<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">Variable elimination and belief propagation reuse local computation</title>
  <desc id="desc">Factors involving one variable are multiplied and summed out to form a new factor, while messages on a tree cache the same local summaries.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#495057"/></marker><style>.box{stroke:#495057;stroke-width:2}.h{font:700 22px Arial,sans-serif;fill:#212529}.t{font:17px Arial,sans-serif;fill:#343a40}.s{font:15px Arial,sans-serif;fill:#495057}.line{stroke:#495057;stroke-width:2.5;fill:none;marker-end:url(#a)}.edge{stroke:#495057;stroke-width:3}.node{fill:#e7f5ff;stroke:#343a40;stroke-width:2}.msg{fill:#fff3bf;stroke:#495057;stroke-width:2}</style></defs>
  <text x="600" y="38" text-anchor="middle" class="h">Exact Inference Is Organized Reuse of Local Sums and Products</text>
  <rect x="35" y="75" width="545" height="455" rx="6" class="box" fill="#f8f9fa"/><text x="307" y="112" text-anchor="middle" class="h">Variable Elimination: remove B first</text>
  <rect x="70" y="165" width="125" height="70" rx="6" class="box" fill="#e7f5ff"/><rect x="230" y="165" width="125" height="70" rx="6" class="box" fill="#ffe8cc"/><rect x="390" y="165" width="150" height="70" rx="6" class="box" fill="#ebfbee"/>
  <text x="132" y="207" text-anchor="middle" class="t">f1(A,B)</text><text x="292" y="207" text-anchor="middle" class="t">f2(B,C)</text><text x="465" y="207" text-anchor="middle" class="t">f3(C,D)</text>
  <path d="M195 200 H222 M355 200 H382" class="line"/>
  <rect x="120" y="290" width="290" height="85" rx="6" class="box" fill="#fff3bf"/><text x="265" y="325" text-anchor="middle" class="t">g(A,C) = sum_B f1(A,B) f2(B,C)</text><text x="265" y="353" text-anchor="middle" class="s">B disappears; A and C become coupled</text>
  <path d="M292 235 V282" class="line"/>
  <rect x="175" y="430" width="305" height="65" rx="6" class="box" fill="#f3f0ff"/><text x="327" y="470" text-anchor="middle" class="t">sum_C g(A,C) f3(C,D)</text><path d="M327 375 V422" class="line"/>
  <rect x="620" y="75" width="545" height="455" rx="6" class="box" fill="#f8f9fa"/><text x="892" y="112" text-anchor="middle" class="h">Belief Propagation: cache subtree summaries</text>
  <circle cx="700" cy="300" r="34" class="node"/><circle cx="850" cy="205" r="34" class="node"/><circle cx="850" cy="395" r="34" class="node"/><circle cx="1030" cy="205" r="34" class="node"/><circle cx="1030" cy="395" r="34" class="node"/>
  <text x="700" y="307" text-anchor="middle" class="h">A</text><text x="850" y="212" text-anchor="middle" class="h">B</text><text x="850" y="402" text-anchor="middle" class="h">C</text><text x="1030" y="212" text-anchor="middle" class="h">D</text><text x="1030" y="402" text-anchor="middle" class="h">E</text>
  <path d="M729 282 L821 223 M729 318 L821 377 M884 205 H996 M884 395 H996" class="edge"/>
  <rect x="905" y="145" width="80" height="34" rx="5" class="msg"/><text x="945" y="168" text-anchor="middle" class="s">m D->B</text><rect x="905" y="411" width="80" height="34" rx="5" class="msg"/><text x="945" y="434" text-anchor="middle" class="s">m E->C</text>
  <text x="892" y="485" text-anchor="middle" class="t">On a tree, two sweeps give exact marginals.</text>
  <text x="600" y="575" text-anchor="middle" class="s">The largest intermediate factor, not the number of original factors, determines exact-inference cost.</text>
</svg>
