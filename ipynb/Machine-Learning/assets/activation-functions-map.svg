<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Activation functions and gradient behavior</title>
  <desc id="desc">Four panels compare sigmoid, tanh, ReLU, and GELU-style activations, with output ranges and gradient implications.</desc>
  <defs><style>.h{font:700 24px Arial,sans-serif;fill:#212529}.t{font:700 19px Arial,sans-serif;fill:#343a40}.s{font:15px Arial,sans-serif;fill:#495057}.box{stroke:#adb5bd;stroke-width:2;rx:6}.axis{stroke:#868e96;stroke-width:1.5}.curve{fill:none;stroke:#1971c2;stroke-width:4}</style></defs>
  <text x="600" y="38" text-anchor="middle" class="h">Nonlinearity Changes Both Expressivity and Gradient Flow</text>
  <g transform="translate(30 78)"><rect width="270" height="465" class="box" fill="#e7f5ff"/><text x="135" y="38" text-anchor="middle" class="t">Sigmoid</text><line x1="35" y1="230" x2="235" y2="230" class="axis"/><line x1="135" y1="75" x2="135" y2="300" class="axis"/><path d="M40 270 C90 268 105 250 125 185 C145 120 170 102 230 100" class="curve"/><text x="135" y="340" text-anchor="middle" class="s">range: (0, 1)</text><text x="135" y="370" text-anchor="middle" class="s">smooth probability output</text><text x="135" y="400" text-anchor="middle" class="s">saturates at both tails</text><text x="135" y="430" text-anchor="middle" class="s">max derivative = 0.25</text></g>
  <g transform="translate(320 78)"><rect width="270" height="465" class="box" fill="#fff3bf"/><text x="135" y="38" text-anchor="middle" class="t">tanh</text><line x1="35" y1="190" x2="235" y2="190" class="axis"/><line x1="135" y1="70" x2="135" y2="305" class="axis"/><path d="M40 280 C90 277 112 250 135 190 C158 130 180 103 230 100" class="curve"/><text x="135" y="340" text-anchor="middle" class="s">range: (-1, 1)</text><text x="135" y="370" text-anchor="middle" class="s">zero-centered output</text><text x="135" y="400" text-anchor="middle" class="s">still saturates at tails</text><text x="135" y="430" text-anchor="middle" class="s">useful in gates and states</text></g>
  <g transform="translate(610 78)"><rect width="270" height="465" class="box" fill="#d3f9d8"/><text x="135" y="38" text-anchor="middle" class="t">ReLU</text><line x1="35" y1="265" x2="235" y2="265" class="axis"/><line x1="135" y1="70" x2="135" y2="305" class="axis"/><path d="M40 265 H135 L230 95" class="curve"/><text x="135" y="340" text-anchor="middle" class="s">max(0, x)</text><text x="135" y="370" text-anchor="middle" class="s">piecewise linear</text><text x="135" y="400" text-anchor="middle" class="s">gradient 1 for x &gt; 0</text><text x="135" y="430" text-anchor="middle" class="s">dead units if always negative</text></g>
  <g transform="translate(900 78)"><rect width="270" height="465" class="box" fill="#f3d9fa"/><text x="135" y="38" text-anchor="middle" class="t">GELU-style</text><line x1="35" y1="255" x2="235" y2="255" class="axis"/><line x1="135" y1="70" x2="135" y2="305" class="axis"/><path d="M40 260 C90 265 110 275 130 255 C150 225 175 160 230 95" class="curve"/><text x="135" y="340" text-anchor="middle" class="s">smooth input-dependent gate</text><text x="135" y="370" text-anchor="middle" class="s">small negative outputs remain</text><text x="135" y="400" text-anchor="middle" class="s">common in Transformers</text><text x="135" y="430" text-anchor="middle" class="s">slightly more computation</text></g>
  <text x="600" y="585" text-anchor="middle" class="s">Hidden-layer activation and output-layer link solve different jobs; choose them separately.</text>
</svg>
