<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#334155"/></marker>
    <style>.t{font:700 28px Arial,sans-serif;fill:#1f2937}.h{font:700 20px Arial,sans-serif;fill:#1f2937}.b{font:16px Arial,sans-serif;fill:#374151}.s{font:14px Arial,sans-serif;fill:#475569}.m{font:italic 18px Georgia,serif;fill:#111827}.box{fill:#fff;stroke:#64748b;stroke-width:2}.arr{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#a)}</style>
  </defs>
  <rect width="1200" height="650" fill="#f8fafc"/>
  <text x="600" y="42" text-anchor="middle" class="t">Approximation error, estimation error, and optimization error</text>

  <rect x="46" y="84" width="330" height="320" rx="8" class="box"/>
  <text x="211" y="118" text-anchor="middle" class="h">All measurable predictors</text>
  <ellipse cx="211" cy="252" rx="135" ry="112" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <ellipse cx="211" cy="252" rx="85" ry="70" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <circle cx="286" cy="175" r="9" fill="#7c3aed"/><text x="299" y="179" class="b">h*</text>
  <circle cx="260" cy="220" r="9" fill="#d97706"/><text x="273" y="224" class="b">h*ₕ</text>
  <circle cx="199" cy="278" r="9" fill="#dc2626"/><text x="212" y="282" class="b">ĥ</text>
  <text x="211" y="347" text-anchor="middle" class="s">green region = chosen H</text>
  <text x="211" y="375" text-anchor="middle" class="s">h*ₕ is the best predictor available in H</text>

  <path d="M296 182 Q318 198 268 216" class="arr"/>
  <text x="318" y="201" text-anchor="end" class="s">approximation</text>
  <path d="M252 231 Q230 246 204 269" class="arr"/>
  <text x="272" y="261" class="s">estimation</text>

  <rect x="414" y="84" width="740" height="320" rx="8" class="box"/>
  <text x="784" y="118" text-anchor="middle" class="h">Excess-risk decomposition</text>
  <text x="784" y="174" text-anchor="middle" class="m">R(ĥ) − R(h*)</text>
  <text x="784" y="218" text-anchor="middle" class="m">= approximation gap + estimation gap</text>
  <rect x="478" y="248" width="282" height="112" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
  <text x="619" y="279" text-anchor="middle" class="h">Approximation error</text>
  <text x="619" y="310" text-anchor="middle" class="b">H cannot express the ideal rule</text>
  <text x="619" y="338" text-anchor="middle" class="s">usually falls as capacity grows</text>
  <rect x="808" y="248" width="282" height="112" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="949" y="279" text-anchor="middle" class="h">Estimation error</text>
  <text x="949" y="310" text-anchor="middle" class="b">finite S selects the wrong member</text>
  <text x="949" y="338" text-anchor="middle" class="s">can grow with capacity</text>

  <rect x="46" y="444" width="1108" height="154" rx="8" class="box"/>
  <text x="66" y="478" class="h">A training algorithm may add a third term</text>
  <text x="66" y="522" class="m">excess risk = approximation + estimation + optimization error</text>
  <text x="66" y="560" class="b">Optimization error is the gap between the algorithm's output and the empirical-risk minimizer it attempted to reach.</text>
  <text x="66" y="586" class="s">More capacity reduces representation limits, but it also changes estimation difficulty and the optimizer's implicit preference.</text>
</svg>
