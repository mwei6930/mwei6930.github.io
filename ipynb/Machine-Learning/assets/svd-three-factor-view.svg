<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc"><title id="title">Singular value decomposition</title><desc id="desc">A data matrix is factorized into left singular vectors, singular values, and right singular vectors, then truncated to a rank-k approximation.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#475569"/></marker><style>.h{font:700 25px Arial,sans-serif;fill:#17212b}.t{font:18px Arial,sans-serif;fill:#334155}.s{font:15px Arial,sans-serif;fill:#526172}.line{stroke:#475569;stroke-width:3;marker-end:url(#a)}</style></defs><rect width="1200" height="590" fill="#fff"/><text x="600" y="42" text-anchor="middle" class="h">SVD separates observation coordinates, component strength, and feature directions</text><rect x="45" y="135" width="230" height="280" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="160" y="120" text-anchor="middle" class="h">X</text><text x="160" y="275" text-anchor="middle" class="t">n × d data</text><text x="315" y="282" class="h">=</text><rect x="365" y="135" width="185" height="280" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="458" y="120" text-anchor="middle" class="h">U</text><text x="458" y="270" text-anchor="middle" class="t">sample scores</text><text x="458" y="298" text-anchor="middle" class="s">orthonormal columns</text><rect x="610" y="175" width="170" height="170" fill="#ffedd5" stroke="#e8590c" stroke-width="3"/><line x1="625" y1="190" x2="765" y2="330" stroke="#e8590c" stroke-width="7"/><text x="695" y="158" text-anchor="middle" class="h">Σ</text><text x="695" y="375" text-anchor="middle" class="t">singular values</text><text x="695" y="402" text-anchor="middle" class="s">σ₁ ≥ σ₂ ≥ … ≥ 0</text><rect x="840" y="175" width="310" height="170" fill="#f3e8ff" stroke="#9333ea" stroke-width="3"/><text x="995" y="158" text-anchor="middle" class="h">Vᵀ</text><text x="995" y="260" text-anchor="middle" class="t">feature directions</text><text x="995" y="290" text-anchor="middle" class="s">rows are right singular vectors</text><line x1="350" y1="470" x2="850" y2="470" class="line"/><rect x="860" y="438" width="285" height="68" rx="6" fill="#eff6ff" stroke="#2563eb"/><text x="1002" y="466" text-anchor="middle" class="t">Keep first k triplets</text><text x="1002" y="490" text-anchor="middle" class="s">Xₖ = UₖΣₖVₖᵀ</text><text x="600" y="552" text-anchor="middle" class="t">Eckart-Young: truncated SVD is the best rank-k approximation under Frobenius or spectral norm.</text></svg>
