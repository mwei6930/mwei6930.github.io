<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Knowledge reuse across domains, tasks, and time</title><desc id="desc">A source domain and task transfer knowledge to a target; transfer learning, domain adaptation, multi-task learning, continual learning, and meta-learning occupy different change axes.</desc>
<defs><marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#475569"/></marker>
<style>.title{font:700 26px Arial,sans-serif;fill:#17212b}.bh{font:700 19px Arial,sans-serif;fill:#17212b}.bt{font:15px Arial,sans-serif;fill:#334155}.small{font:14px Arial,sans-serif;fill:#526172}.arrow{stroke:#475569;stroke-width:3;marker-end:url(#arrowhead)}.node{stroke:#334155;stroke-width:2}</style></defs>
<rect width="1200" height="620" fill="#ffffff"/>
<text x="600" y="42" text-anchor="middle" class="title">Knowledge reuse across domains, tasks, and time</text>
<rect x="40" y="95" width="245" height="175" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="162.5" y="133" text-anchor="middle" class="bh">Source</text><text x="162.5" y="167" text-anchor="middle" class="bt">domain D_S</text><text x="162.5" y="194" text-anchor="middle" class="bt">task T_S</text><text x="162.5" y="221" text-anchor="middle" class="bt">data, labels, model</text><rect x="915" y="95" width="245" height="175" rx="10" fill="#fee2e2" stroke="#e11d48" stroke-width="3"/><text x="1037.5" y="133" text-anchor="middle" class="bh">Target</text><text x="1037.5" y="167" text-anchor="middle" class="bt">domain D_T</text><text x="1037.5" y="194" text-anchor="middle" class="bt">task T_T</text><text x="1037.5" y="221" text-anchor="middle" class="bt">deployment objective</text><line x1="285" y1="180" x2="915" y2="180" class="arrow"/><rect x="70" y="350" width="230" height="145" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="3"/><text x="185.0" y="388" text-anchor="middle" class="bh">Transfer learning</text><text x="185.0" y="422" text-anchor="middle" class="bt">reuse parameters</text><text x="185.0" y="449" text-anchor="middle" class="bt">features or examples</text><rect x="320" y="350" width="230" height="145" rx="10" fill="#fff7ed" stroke="#e8590c" stroke-width="3"/><text x="435.0" y="388" text-anchor="middle" class="bh">Domain adaptation</text><text x="435.0" y="422" text-anchor="middle" class="bt">same related task</text><text x="435.0" y="449" text-anchor="middle" class="bt">different domains</text><rect x="570" y="350" width="230" height="145" rx="10" fill="#f3e8ff" stroke="#9333ea" stroke-width="3"/><text x="685.0" y="388" text-anchor="middle" class="bh">Multi-task learning</text><text x="685.0" y="422" text-anchor="middle" class="bt">tasks learned jointly</text><text x="685.0" y="449" text-anchor="middle" class="bt">shared structure</text><rect x="820" y="350" width="230" height="145" rx="10" fill="#fdf2f8" stroke="#db2777" stroke-width="3"/><text x="935.0" y="388" text-anchor="middle" class="bh">Continual learning</text><text x="935.0" y="422" text-anchor="middle" class="bt">tasks arrive over time</text><text x="935.0" y="449" text-anchor="middle" class="bt">retain old ability</text><text x="600" y="305" text-anchor="middle" class="bh">What changes: P(x), P(y), P(y|x), the output space, or time?</text><text x="600" y="555" text-anchor="middle" class="bh">Meta-learning learns a reusable adaptation procedure across a distribution of tasks.</text><text x="600" y="585" text-anchor="middle" class="small">The correct baseline and split depend on which axis changes and what target information is permitted.</text></svg>