<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Pool-based active learning with a human in the loop</title><desc id="desc">A model scores an unlabeled pool, queries an informative and diverse batch, receives audited human labels, and repeats until marginal value falls below cost.</desc>
<defs><marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#475569"/></marker>
<style>.title{font:700 26px Arial,sans-serif;fill:#17212b}.bh{font:700 19px Arial,sans-serif;fill:#17212b}.bt{font:15px Arial,sans-serif;fill:#334155}.small{font:14px Arial,sans-serif;fill:#526172}.arrow{stroke:#475569;stroke-width:3;marker-end:url(#arrowhead)}.node{stroke:#334155;stroke-width:2}</style></defs>
<rect width="1200" height="600" fill="#ffffff"/>
<text x="600" y="42" text-anchor="middle" class="title">Pool-based active learning with a human in the loop</text>
<rect x="55" y="190" width="185" height="145" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="147.5" y="228" text-anchor="middle" class="bh">Labeled seed</text><text x="147.5" y="262" text-anchor="middle" class="bt">small, audited set</text><rect x="285" y="75" width="210" height="145" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="3"/><text x="390.0" y="113" text-anchor="middle" class="bh">Train model</text><text x="390.0" y="147" text-anchor="middle" class="bt">fit only queried labels</text><rect x="535" y="75" width="210" height="145" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="640.0" y="113" text-anchor="middle" class="bh">Score pool U</text><text x="640.0" y="147" text-anchor="middle" class="bt">uncertainty</text><text x="640.0" y="174" text-anchor="middle" class="bt">diversity, cost</text><rect x="785" y="190" width="210" height="145" rx="10" fill="#fff7ed" stroke="#e8590c" stroke-width="3"/><text x="890.0" y="228" text-anchor="middle" class="bh">Query a batch</text><text x="890.0" y="262" text-anchor="middle" class="bt">deduplicate</text><text x="890.0" y="289" text-anchor="middle" class="bt">respect workload</text><rect x="535" y="360" width="210" height="145" rx="10" fill="#fdf2f8" stroke="#db2777" stroke-width="3"/><text x="640.0" y="398" text-anchor="middle" class="bh">Human annotation</text><text x="640.0" y="432" text-anchor="middle" class="bt">guideline + abstain</text><text x="640.0" y="459" text-anchor="middle" class="bt">gold checks</text><rect x="285" y="360" width="210" height="145" rx="10" fill="#f3e8ff" stroke="#9333ea" stroke-width="3"/><text x="390.0" y="398" text-anchor="middle" class="bh">Audit and append</text><text x="390.0" y="432" text-anchor="middle" class="bt">quality, time, subgroup</text><line x1="240" y1="210" x2="285" y2="175" class="arrow"/><line x1="495" y1="145" x2="535" y2="145" class="arrow"/><line x1="745" y1="175" x2="785" y2="210" class="arrow"/><line x1="865" y1="340" x2="745" y2="405" class="arrow"/><line x1="535" y1="430" x2="495" y2="430" class="arrow"/><line x1="285" y1="405" x2="205" y2="335" class="arrow"/><text x="1050" y="420" text-anchor="middle" class="bh">Stop when</text><text x="1050" y="450" text-anchor="middle" class="bt">marginal utility</text><text x="1050" y="477" text-anchor="middle" class="bt">falls below cost</text><text x="600" y="565" text-anchor="middle" class="small">Evaluate against random sampling across repeated pool orders; query count alone is not annotation cost.</text></svg>