<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Goals and risks of dimensionality reduction</title>
  <desc id="desc">A high-dimensional observation matrix is mapped to a compact representation for compression, denoising, visualization, and efficient modelling, while information loss is evaluated.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#475569"/></marker><style>.h{font:700 25px Arial,sans-serif;fill:#17212b}.t{font:18px Arial,sans-serif;fill:#334155}.s{font:15px Arial,sans-serif;fill:#526172}.box{fill:#f8fafc;stroke:#64748b;stroke-width:2}.line{stroke:#475569;stroke-width:3;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="620" fill="#fff"/><text x="600" y="42" text-anchor="middle" class="h">Dimensionality reduction is a controlled information bottleneck</text>
  <rect x="45" y="115" width="295" height="370" rx="8" class="box"/><text x="192" y="153" text-anchor="middle" class="h">Original representation</text>
  <g fill="#bfdbfe" stroke="#2563eb"><rect x="82" y="190" width="28" height="28"/><rect x="116" y="190" width="28" height="28"/><rect x="150" y="190" width="28" height="28"/><rect x="184" y="190" width="28" height="28"/><rect x="218" y="190" width="28" height="28"/><rect x="252" y="190" width="28" height="28"/><rect x="82" y="224" width="28" height="28"/><rect x="116" y="224" width="28" height="28"/><rect x="150" y="224" width="28" height="28"/><rect x="184" y="224" width="28" height="28"/><rect x="218" y="224" width="28" height="28"/><rect x="252" y="224" width="28" height="28"/><rect x="82" y="258" width="28" height="28"/><rect x="116" y="258" width="28" height="28"/><rect x="150" y="258" width="28" height="28"/><rect x="184" y="258" width="28" height="28"/><rect x="218" y="258" width="28" height="28"/><rect x="252" y="258" width="28" height="28"/><rect x="82" y="292" width="28" height="28"/><rect x="116" y="292" width="28" height="28"/><rect x="150" y="292" width="28" height="28"/><rect x="184" y="292" width="28" height="28"/><rect x="218" y="292" width="28" height="28"/><rect x="252" y="292" width="28" height="28"/></g>
  <text x="192" y="365" text-anchor="middle" class="t">n observations × d features</text><text x="192" y="395" text-anchor="middle" class="s">redundancy, noise, sparse distances</text><text x="192" y="425" text-anchor="middle" class="s">cost grows with d</text><line x1="350" y1="300" x2="445" y2="300" class="line"/>
  <rect x="455" y="170" width="280" height="260" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="595" y="210" text-anchor="middle" class="h">Learn or choose a map</text><text x="595" y="250" text-anchor="middle" class="t">z = f(x),  k ≪ d</text><circle cx="540" cy="315" r="10" fill="#2563eb"/><circle cx="565" cy="285" r="10" fill="#2563eb"/><circle cx="595" cy="320" r="10" fill="#e8590c"/><circle cx="625" cy="275" r="10" fill="#16a34a"/><circle cx="652" cy="318" r="10" fill="#16a34a"/><text x="595" y="375" text-anchor="middle" class="s">linear, factorized, sparse, manifold, neural</text><line x1="745" y1="300" x2="820" y2="300" class="line"/>
  <rect x="830" y="95" width="325" height="410" rx="8" class="box"/><text x="992" y="133" text-anchor="middle" class="h">Use and validate</text><rect x="875" y="170" width="235" height="55" rx="6" fill="#dbeafe"/><text x="992" y="204" text-anchor="middle" class="t">Compression and speed</text><rect x="875" y="240" width="235" height="55" rx="6" fill="#dcfce7"/><text x="992" y="274" text-anchor="middle" class="t">Denoising and structure</text><rect x="875" y="310" width="235" height="55" rx="6" fill="#ffedd5"/><text x="992" y="344" text-anchor="middle" class="t">Visualization and discovery</text><rect x="875" y="380" width="235" height="75" rx="6" fill="#fee2e2"/><text x="992" y="410" text-anchor="middle" class="t">Measure what was lost</text><text x="992" y="438" text-anchor="middle" class="s">reconstruction, neighbours, task utility</text>
  <rect x="185" y="535" width="830" height="48" rx="6" fill="#fff7ed" stroke="#fdba74"/><text x="600" y="565" text-anchor="middle" class="t">A visually clean embedding can still discard rare, predictive, or causally important variation.</text>
</svg>
