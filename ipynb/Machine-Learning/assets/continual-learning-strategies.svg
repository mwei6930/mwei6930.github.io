<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Sequential learning, forgetting, and three defense families</title><desc id="desc">Tasks arrive sequentially; later updates can erase earlier behavior, while replay, regularization, and dynamic architectures preserve knowledge in different ways.</desc>
<defs><marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#475569"/></marker>
<style>.title{font:700 26px Arial,sans-serif;fill:#17212b}.bh{font:700 19px Arial,sans-serif;fill:#17212b}.bt{font:15px Arial,sans-serif;fill:#334155}.small{font:14px Arial,sans-serif;fill:#526172}.arrow{stroke:#475569;stroke-width:3;marker-end:url(#arrowhead)}.node{stroke:#334155;stroke-width:2}</style></defs>
<rect width="1200" height="630" fill="#ffffff"/>
<text x="600" y="42" text-anchor="middle" class="title">Sequential learning, forgetting, and three defense families</text>
<rect x="35" y="100" width="180" height="145" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="125.0" y="138" text-anchor="middle" class="bh">Task 1</text><text x="125.0" y="172" text-anchor="middle" class="bt">learn theta_1</text><line x1="215" y1="170" x2="300" y2="170" class="arrow"/><rect x="315" y="100" width="180" height="145" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="3"/><text x="405.0" y="138" text-anchor="middle" class="bh">Task 2</text><text x="405.0" y="172" text-anchor="middle" class="bt">update theta_2</text><line x1="495" y1="170" x2="580" y2="170" class="arrow"/><rect x="595" y="100" width="180" height="145" rx="10" fill="#fff7ed" stroke="#e8590c" stroke-width="3"/><text x="685.0" y="138" text-anchor="middle" class="bh">Task 3</text><text x="685.0" y="172" text-anchor="middle" class="bt">update theta_3</text><path d="M685 260 C620 350 375 355 125 260" fill="none" stroke="#e11d48" stroke-width="4" stroke-dasharray="9 7" marker-end="url(#arrowhead)"/><text x="405" y="330" text-anchor="middle" class="bh" fill="#be123c">later updates can erase earlier solutions</text><rect x="45" y="390" width="245" height="150" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="167.5" y="428" text-anchor="middle" class="bh">Replay</text><text x="167.5" y="462" text-anchor="middle" class="bt">store or generate old data</text><text x="167.5" y="489" text-anchor="middle" class="bt">rehearse with new task</text><rect x="325" y="390" width="245" height="150" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="3"/><text x="447.5" y="428" text-anchor="middle" class="bh">Regularization</text><text x="447.5" y="462" text-anchor="middle" class="bt">EWC, distillation</text><text x="447.5" y="489" text-anchor="middle" class="bt">protect important behavior</text><rect x="605" y="390" width="245" height="150" rx="10" fill="#f3e8ff" stroke="#9333ea" stroke-width="3"/><text x="727.5" y="428" text-anchor="middle" class="bh">Dynamic architecture</text><text x="727.5" y="462" text-anchor="middle" class="bt">new modules or masks</text><text x="727.5" y="489" text-anchor="middle" class="bt">route by task / context</text><rect x="885" y="390" width="245" height="150" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="3"/><text x="1007.5" y="428" text-anchor="middle" class="bh">Evaluation</text><text x="1007.5" y="462" text-anchor="middle" class="bt">accuracy matrix</text><text x="1007.5" y="489" text-anchor="middle" class="bt">forgetting and transfer</text><text x="1007.5" y="516" text-anchor="middle" class="bt">memory and compute</text><text x="600" y="600" text-anchor="middle" class="small">Continual learning balances stability on old tasks with plasticity for new tasks.</text></svg>