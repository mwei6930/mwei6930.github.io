<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="370" viewBox="0 0 1000 370" role="img" aria-labelledby="title desc">
<title id="title">A variable&#x27;s role depends on the causal paths</title>
<desc id="desc">Confounders, mediators, and colliders imply different adjustment decisions.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
  </marker>
</defs>
<style>
text { font-family: Arial, Helvetica, sans-serif; letter-spacing: 0; fill: #1f2937; }
.title { font-size: 25px; font-weight: 700; }
.subtitle { font-size: 14px; fill: #4b5563; }
.head { font-size: 16px; font-weight: 700; }
.body { font-size: 13px; }
.small { font-size: 12px; fill: #4b5563; }
.formula { font-family: "Courier New", monospace; font-size: 13px; }
.box { stroke-width: 1.4; rx: 7; }
.arrow { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#arrow); }
.dash { stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 7 5; fill: none; marker-end: url(#arrow); }
.blocked { stroke: #dc2626; stroke-width: 3; }
</style>
<rect width="1000" height="370" fill="#ffffff"/>
<text x="40" y="42" class="title" text-anchor="start">A variable&#x27;s role depends on the causal paths</text>
<text x="40" y="68" class="subtitle" text-anchor="start">Confounders, mediators, and colliders imply different adjustment decisions.</text>
<text x="170" y="103" class="head" text-anchor="middle">Confounder</text><circle cx="170" cy="150" r="30" fill="#fee2e2" stroke="#374151" stroke-width="1.5"/><text x="170" y="155" class="head" text-anchor="middle">C</text><circle cx="95" cy="255" r="30" fill="#dbeafe" stroke="#374151" stroke-width="1.5"/><text x="95" y="260" class="head" text-anchor="middle">T</text><circle cx="245" cy="255" r="30" fill="#dcfce7" stroke="#374151" stroke-width="1.5"/><text x="245" y="260" class="head" text-anchor="middle">Y</text><path d="M 150 175 L 110 225" class="arrow"/><path d="M 190 175 L 230 225" class="arrow"/><path d="M 125 255 L 215 255" class="arrow"/><text x="170" y="315" class="small" text-anchor="middle">Adjust C for total effect</text><text x="500" y="103" class="head" text-anchor="middle">Mediator</text><circle cx="425" cy="230" r="30" fill="#dbeafe" stroke="#374151" stroke-width="1.5"/><text x="425" y="235" class="head" text-anchor="middle">T</text><circle cx="500" cy="150" r="30" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/><text x="500" y="155" class="head" text-anchor="middle">M</text><circle cx="575" cy="230" r="30" fill="#dcfce7" stroke="#374151" stroke-width="1.5"/><text x="575" y="235" class="head" text-anchor="middle">Y</text><path d="M 450 210 L 480 173" class="arrow"/><path d="M 520 173 L 550 210" class="arrow"/><path d="M 455 230 L 545 230" class="arrow"/><text x="500" y="315" class="small" text-anchor="middle">Do not adjust for total effect</text><text x="830" y="103" class="head" text-anchor="middle">Collider</text><circle cx="755" cy="180" r="30" fill="#dbeafe" stroke="#374151" stroke-width="1.5"/><text x="755" y="185" class="head" text-anchor="middle">T</text><circle cx="905" cy="180" r="30" fill="#dcfce7" stroke="#374151" stroke-width="1.5"/><text x="905" y="185" class="head" text-anchor="middle">Y</text><circle cx="830" cy="270" r="30" fill="#fee2e2" stroke="#374151" stroke-width="1.5"/><text x="830" y="275" class="head" text-anchor="middle">S</text><path d="M 775 203 L 810 248" class="arrow"/><path d="M 885 203 L 850 248" class="arrow"/><text x="830" y="325" class="small" text-anchor="middle">Conditioning opens a path</text>
</svg>
