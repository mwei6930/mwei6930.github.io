<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410" role="img" aria-labelledby="title desc">
<title id="title">The capstone workflow turns ML work into reviewable gates</title>
<desc id="desc">Contract, evidence, artifact, release, and operation gates make system decisions explicit.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
  </marker>
</defs>
<style>
text { font-family: Arial, Helvetica, sans-serif; letter-spacing: 0; fill: #1f2937; }
.title { font-size: 25px; font-weight: 700; }
.subtitle { font-size: 14px; fill: #4b5563; }
.head { font-size: 16px; font-weight: 700; }
.body { font-size: 13px; }
.small { font-size: 12px; fill: #4b5563; }
.formula { font-family: "Courier New", monospace; font-size: 13px; }
.box { stroke-width: 1.4; rx: 7; }
.arrow { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#arrow); }
.dash { stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 7 5; fill: none; marker-end: url(#arrow); }
.line { stroke: #6b7280; stroke-width: 1.5; fill: none; }
</style>
<rect width="1000" height="410" fill="#ffffff"/>
<text x="40" y="42" class="title" text-anchor="start">The capstone workflow turns ML work into reviewable gates</text>
<text x="40" y="68" class="subtitle" text-anchor="start">Contract, evidence, artifact, release, and operation gates make system decisions explicit.</text>
<rect x="35" y="115" width="170" height="205" class="box" fill="#dbeafe" stroke="#374151"/><text x="120" y="144" class="head" text-anchor="middle">1. Contract</text><text x="49" y="171" class="body" text-anchor="start"><tspan x="49" dy="0">decision owner</tspan><tspan x="49" dy="19">target/horizon</tspan><tspan x="49" dy="19">baseline</tspan><tspan x="49" dy="19">constraints</tspan></text><path d="M 205 218 L 235 218" class="arrow"/><rect x="235" y="115" width="170" height="205" class="box" fill="#dcfce7" stroke="#374151"/><text x="320" y="144" class="head" text-anchor="middle">2. Evidence</text><text x="249" y="171" class="body" text-anchor="start"><tspan x="249" dy="0">leakage-safe split</tspan><tspan x="249" dy="19">uncertainty</tspan><tspan x="249" dy="19">slices</tspan><tspan x="249" dy="19">stress tests</tspan></text><path d="M 405 218 L 435 218" class="arrow"/><rect x="435" y="115" width="170" height="205" class="box" fill="#fef3c7" stroke="#374151"/><text x="520" y="144" class="head" text-anchor="middle">3. Artifact</text><text x="449" y="171" class="body" text-anchor="start"><tspan x="449" dy="0">versioned inputs</tspan><tspan x="449" dy="19">package</tspan><tspan x="449" dy="19">model card</tspan><tspan x="449" dy="19">reproduction</tspan></text><path d="M 605 218 L 635 218" class="arrow"/><rect x="635" y="115" width="150" height="205" class="box" fill="#fee2e2" stroke="#374151"/><text x="710" y="144" class="head" text-anchor="middle">4. Release</text><text x="649" y="171" class="body" text-anchor="start"><tspan x="649" dy="0">shadow/canary</tspan><tspan x="649" dy="19">SLOs</tspan><tspan x="649" dy="19">fallback</tspan><tspan x="649" dy="19">approval</tspan></text><path d="M 785 218 L 815 218" class="arrow"/><rect x="815" y="115" width="150" height="205" class="box" fill="#e0e7ff" stroke="#374151"/><text x="890" y="144" class="head" text-anchor="middle">5. Operate</text><text x="829" y="171" class="body" text-anchor="start"><tspan x="829" dy="0">monitor</tspan><tspan x="829" dy="19">incident</tspan><tspan x="829" dy="19">retrain</tspan><tspan x="829" dy="19">retire</tspan></text><text x="500" y="366" class="head" text-anchor="middle">A failed gate produces a documented action, not an undocumented exception.</text>
</svg>
