<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Preprocessing leakage versus a correct train-only workflow</title>
  <desc id="desc">A side-by-side diagram comparing preprocessing before splitting with splitting first and fitting preprocessing only on training data.</desc>
  <defs>
    <marker id="arrow-dark" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#c2413b"/>
    </marker>
    <style>
      .title { font: 700 29px Arial, sans-serif; fill: #172033; }
      .panel-title { font: 700 22px Arial, sans-serif; }
      .label { font: 600 17px Arial, sans-serif; fill: #172033; }
      .small { font: 15px Arial, sans-serif; fill: #475569; }
      .note { font: 600 16px Arial, sans-serif; }
      .box { stroke-width: 2; rx: 8; }
      .arrow { fill: none; stroke: #334155; stroke-width: 3; marker-end: url(#arrow-dark); }
      .bad-arrow { fill: none; stroke: #c2413b; stroke-width: 3; marker-end: url(#arrow-red); stroke-dasharray: 8 6; }
    </style>
  </defs>

  <rect width="1200" height="620" fill="#ffffff"/>
  <text x="600" y="47" text-anchor="middle" class="title">Where Preprocessing Leakage Enters</text>

  <rect x="32" y="75" width="550" height="500" rx="8" fill="#fff7f5" stroke="#e5a19b" stroke-width="2"/>
  <text x="307" y="112" text-anchor="middle" class="panel-title" fill="#a8322d">Wrong: learn from the full dataset</text>

  <rect x="84" y="145" width="185" height="72" class="box" fill="#ffffff" stroke="#64748b"/>
  <text x="176" y="175" text-anchor="middle" class="label">All observations</text>
  <text x="176" y="198" text-anchor="middle" class="small">future train + test</text>

  <rect x="334" y="145" width="192" height="72" class="box" fill="#fee2e2" stroke="#c2413b"/>
  <text x="430" y="175" text-anchor="middle" class="label">Fit preprocessing</text>
  <text x="430" y="198" text-anchor="middle" class="small">mean, vocabulary, selection</text>
  <path d="M269 181 H326" class="arrow"/>

  <rect x="94" y="285" width="172" height="72" class="box" fill="#e8f1fb" stroke="#3b6ea8"/>
  <text x="180" y="315" text-anchor="middle" class="label">Training rows</text>
  <text x="180" y="338" text-anchor="middle" class="small">fit model</text>

  <rect x="345" y="285" width="172" height="72" class="box" fill="#fff2cc" stroke="#a97710"/>
  <text x="431" y="315" text-anchor="middle" class="label">Test rows</text>
  <text x="431" y="338" text-anchor="middle" class="small">evaluate model</text>

  <path d="M430 217 C430 245,180 244,180 277" class="arrow"/>
  <path d="M430 217 V277" class="arrow"/>
  <path d="M431 285 C431 250,349 247,349 218" class="bad-arrow"/>
  <text x="302" y="406" text-anchor="middle" class="note" fill="#a8322d">Test information already shaped the features.</text>
  <text x="302" y="434" text-anchor="middle" class="small">The reported score is optimistically biased.</text>

  <rect x="618" y="75" width="550" height="500" rx="8" fill="#f4faf7" stroke="#82b99a" stroke-width="2"/>
  <text x="893" y="112" text-anchor="middle" class="panel-title" fill="#16734a">Correct: split first, then fit on training data</text>

  <rect x="792" y="137" width="202" height="66" class="box" fill="#ffffff" stroke="#64748b"/>
  <text x="893" y="165" text-anchor="middle" class="label">Raw observations</text>
  <text x="893" y="187" text-anchor="middle" class="small">split by deployment unit</text>

  <rect x="670" y="263" width="176" height="72" class="box" fill="#e8f1fb" stroke="#3b6ea8"/>
  <text x="758" y="293" text-anchor="middle" class="label">Training rows</text>
  <text x="758" y="316" text-anchor="middle" class="small">fit + transform</text>

  <rect x="939" y="263" width="176" height="72" class="box" fill="#fff2cc" stroke="#a97710"/>
  <text x="1027" y="293" text-anchor="middle" class="label">Validation / test</text>
  <text x="1027" y="316" text-anchor="middle" class="small">transform only</text>

  <path d="M893 203 C893 232,758 230,758 255" class="arrow"/>
  <path d="M893 203 C893 232,1027 230,1027 255" class="arrow"/>

  <rect x="670" y="400" width="176" height="72" class="box" fill="#dcfce7" stroke="#27865a"/>
  <text x="758" y="430" text-anchor="middle" class="label">Fitted pipeline</text>
  <text x="758" y="453" text-anchor="middle" class="small">stored train statistics</text>

  <rect x="939" y="400" width="176" height="72" class="box" fill="#ffffff" stroke="#64748b"/>
  <text x="1027" y="430" text-anchor="middle" class="label">Unbiased estimate</text>
  <text x="1027" y="453" text-anchor="middle" class="small">deployment-like inputs</text>

  <path d="M758 335 V392" class="arrow"/>
  <path d="M846 436 H931" class="arrow"/>
  <path d="M1027 335 V392" class="arrow"/>

  <text x="893" y="526" text-anchor="middle" class="note" fill="#16734a">Pipeline = preprocessing and estimator under one split boundary.</text>
</svg>
