<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">Manifold learning with Isomap and locally linear embedding</title><desc id="desc">A curved manifold is represented by a local neighbor graph; Isomap preserves graph geodesic distances while LLE preserves local reconstruction weights before unfolding.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#475569"/></marker><style>.h{font:700 24px Arial,sans-serif;fill:#17212b}.t{font:17px Arial,sans-serif;fill:#334155}.s{font:14px Arial,sans-serif;fill:#526172}.panel{fill:#f8fafc;stroke:#94a3b8;stroke-width:2}.edge{stroke:#94a3b8;stroke-width:2}.path{stroke:#e8590c;stroke-width:5;fill:none}.line{stroke:#475569;stroke-width:3;marker-end:url(#a)}</style></defs><rect width="1200" height="650" fill="#fff"/><text x="600" y="42" text-anchor="middle" class="h">Manifold learning assumes high-dimensional data lie near a lower-dimensional surface</text>
  <rect x="30" y="85" width="330" height="470" rx="8" class="panel"/><text x="195" y="125" text-anchor="middle" class="h">1. Local geometry</text><path d="M75 430 C110 180 270 160 315 400 C285 510 140 510 110 350 C90 245 220 215 265 335 C275 405 165 440 145 350" fill="none" stroke="#bfdbfe" stroke-width="45"/><g fill="#2563eb"><circle cx="87" cy="395" r="7"/><circle cx="105" cy="300" r="7"/><circle cx="145" cy="210" r="7"/><circle cx="225" cy="195" r="7"/><circle cx="292" cy="275" r="7"/><circle cx="300" cy="390" r="7"/><circle cx="240" cy="465" r="7"/><circle cx="155" cy="445" r="7"/><circle cx="122" cy="355" r="7"/><circle cx="170" cy="270" r="7"/><circle cx="245" cy="260" r="7"/><circle cx="265" cy="350" r="7"/><circle cx="205" cy="405" r="7"/><circle cx="150" cy="365" r="7"/></g><text x="195" y="505" text-anchor="middle" class="t">Nearby in ambient space?</text><text x="195" y="530" text-anchor="middle" class="s">Choose metric and neighbourhood size</text>
  <line x1="370" y1="320" x2="420" y2="320" class="line"/><rect x="430" y="85" width="330" height="470" rx="8" class="panel"/><text x="595" y="125" text-anchor="middle" class="h">2. Preserve a relation</text><text x="505" y="172" class="t">Isomap</text><g class="edge"><line x1="480" y1="245" x2="520" y2="210"/><line x1="520" y1="210" x2="565" y2="250"/><line x1="565" y1="250" x2="610" y2="205"/><line x1="610" y1="205" x2="660" y2="240"/><line x1="660" y1="240" x2="705" y2="200"/></g><path d="M480 245 L520 210 L565 250 L610 205 L660 240 L705 200" class="path"/><text x="595" y="285" text-anchor="middle" class="s">shortest graph path ≈ geodesic distance</text><text x="505" y="345" class="t">LLE</text><circle cx="590" cy="410" r="13" fill="#e8590c"/><circle cx="525" cy="380" r="10" fill="#2563eb"/><circle cx="550" cy="455" r="10" fill="#2563eb"/><circle cx="650" cy="455" r="10" fill="#2563eb"/><line x1="580" y1="402" x2="535" y2="385" class="edge"/><line x1="580" y1="420" x2="558" y2="448" class="edge"/><line x1="602" y1="420" x2="642" y2="448" class="edge"/><text x="595" y="500" text-anchor="middle" class="s">preserve local reconstruction weights</text>
  <line x1="770" y1="320" x2="820" y2="320" class="line"/><rect x="830" y="85" width="340" height="470" rx="8" class="panel"/><text x="1000" y="125" text-anchor="middle" class="h">3. Low-dimensional embedding</text><line x1="885" y1="445" x2="1120" y2="445" stroke="#64748b" stroke-width="2"/><line x1="885" y1="445" x2="885" y2="190" stroke="#64748b" stroke-width="2"/><path d="M910 400 C955 320 995 230 1040 270 C1080 305 1090 380 1120 215" fill="none" stroke="#cbd5e1" stroke-width="35"/><g fill="#2563eb"><circle cx="912" cy="397" r="8"/><circle cx="940" cy="350" r="8"/><circle cx="970" cy="290" r="8"/><circle cx="1005" cy="255" r="8"/><circle cx="1040" cy="273" r="8"/><circle cx="1070" cy="330" r="8"/><circle cx="1095" cy="345" r="8"/><circle cx="1118" cy="220" r="8"/></g><text x="1000" y="505" text-anchor="middle" class="t">Unfold, but do not invent certainty</text><text x="1000" y="530" text-anchor="middle" class="s">neighbour graph errors propagate</text><text x="600" y="610" text-anchor="middle" class="t">Both methods rely on a trustworthy local graph and can fail at shortcuts, disconnected regions, or sparse sampling.</text></svg>
