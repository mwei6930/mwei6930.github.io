<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Evaluation framework for learned representations</title><desc id="desc">A candidate representation is evaluated for reconstruction, geometry preservation, stability, downstream utility, and interpretability, with train-only fitting to prevent leakage.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#475569"/></marker><style>.h{font:700 24px Arial,sans-serif;fill:#17212b}.t{font:17px Arial,sans-serif;fill:#334155}.s{font:14px Arial,sans-serif;fill:#526172}.line{stroke:#475569;stroke-width:3;marker-end:url(#a)}</style></defs><rect width="1200" height="620" fill="#fff"/><text x="600" y="42" text-anchor="middle" class="h">Evaluate a representation against its intended use, not against visual appeal</text>
  <rect x="430" y="215" width="340" height="155" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="3"/><text x="600" y="260" text-anchor="middle" class="h">Candidate representation Z</text><text x="600" y="300" text-anchor="middle" class="t">fit using training data only</text><text x="600" y="335" text-anchor="middle" class="s">dimension, metric, assumptions, hyperparameters</text>
  <rect x="45" y="85" width="300" height="135" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="195" y="125" text-anchor="middle" class="h">Reconstruction</text><text x="195" y="160" text-anchor="middle" class="t">held-out error and residuals</text><text x="195" y="190" text-anchor="middle" class="s">what variation was discarded?</text><line x1="420" y1="245" x2="350" y2="210" class="line"/>
  <rect x="855" y="85" width="300" height="135" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="1005" y="125" text-anchor="middle" class="h">Geometry</text><text x="1005" y="160" text-anchor="middle" class="t">distance and neighbourhood trust</text><text x="1005" y="190" text-anchor="middle" class="s">local versus global preservation</text><line x1="780" y1="245" x2="850" y2="210" class="line"/>
  <rect x="45" y="405" width="300" height="135" rx="8" fill="#ffedd5" stroke="#e8590c" stroke-width="3"/><text x="195" y="445" text-anchor="middle" class="h">Stability</text><text x="195" y="480" text-anchor="middle" class="t">seeds, samples, perturbations</text><text x="195" y="510" text-anchor="middle" class="s">subspace angles or neighbour overlap</text><line x1="420" y1="345" x2="350" y2="415" class="line"/>
  <rect x="450" y="430" width="300" height="135" rx="8" fill="#f3e8ff" stroke="#9333ea" stroke-width="3"/><text x="600" y="470" text-anchor="middle" class="h">Downstream utility</text><text x="600" y="505" text-anchor="middle" class="t">validated task performance</text><text x="600" y="535" text-anchor="middle" class="s">compare with raw-feature baseline</text><line x1="600" y1="380" x2="600" y2="420" class="line"/>
  <rect x="855" y="405" width="300" height="135" rx="8" fill="#fee2e2" stroke="#e11d48" stroke-width="3"/><text x="1005" y="445" text-anchor="middle" class="h">Meaning and risk</text><text x="1005" y="480" text-anchor="middle" class="t">domain interpretation and fairness</text><text x="1005" y="510" text-anchor="middle" class="s">rare signals, leakage, distortion</text><line x1="780" y1="345" x2="850" y2="415" class="line"/>
  <text x="600" y="600" text-anchor="middle" class="t">No single metric establishes that an embedding is faithful, useful, and meaningful at the same time.</text></svg>
