<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="title desc">
<title id="title">Reliability has several independent dimensions</title>
<desc id="desc">Interpretability, robustness, fairness, and privacy answer different questions and require different evidence.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
  </marker>
</defs>
<style>
text { font-family: Arial, Helvetica, sans-serif; letter-spacing: 0; fill: #1f2937; }
.title { font-size: 25px; font-weight: 700; }
.subtitle { font-size: 14px; fill: #4b5563; }
.head { font-size: 16px; font-weight: 700; }
.body { font-size: 13px; }
.small { font-size: 12px; fill: #4b5563; }
.formula { font-family: "Courier New", monospace; font-size: 13px; }
.box { stroke-width: 1.4; rx: 7; }
.arrow { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#arrow); }
.dash { stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 7 5; fill: none; marker-end: url(#arrow); }
.axis { stroke: #6b7280; stroke-width: 1.3; fill: none; }
</style>
<rect width="1000" height="400" fill="#ffffff"/>
<text x="40" y="42" class="title" text-anchor="start">Reliability has several independent dimensions</text>
<text x="40" y="68" class="subtitle" text-anchor="start">Interpretability, robustness, fairness, and privacy answer different questions and require different evidence.</text>
<rect x="35" y="108" width="210" height="205" class="box" fill="#dbeafe" stroke="#374151"/><text x="140" y="137" class="head" text-anchor="middle">Interpretability</text><text x="49" y="164" class="body" text-anchor="start"><tspan x="49" dy="0">Why did it predict?</tspan><tspan x="49" dy="19">Can a human inspect it?</tspan><tspan x="49" dy="19">Is the explanation faithful?</tspan></text><rect x="275" y="108" width="210" height="205" class="box" fill="#dcfce7" stroke="#374151"/><text x="380" y="137" class="head" text-anchor="middle">Robustness</text><text x="289" y="164" class="body" text-anchor="start"><tspan x="289" dy="0">What changes at deployment?</tspan><tspan x="289" dy="19">How does failure degrade?</tspan><tspan x="289" dy="19">Can it abstain safely?</tspan></text><rect x="515" y="108" width="210" height="205" class="box" fill="#fef3c7" stroke="#374151"/><text x="620" y="137" class="head" text-anchor="middle">Fairness</text><text x="529" y="164" class="body" text-anchor="start"><tspan x="529" dy="0">Who receives errors?</tspan><tspan x="529" dy="19">Which harm is relevant?</tspan><tspan x="529" dy="19">What trade-off is chosen?</tspan></text><rect x="755" y="108" width="210" height="205" class="box" fill="#fee2e2" stroke="#374151"/><text x="860" y="137" class="head" text-anchor="middle">Privacy</text><text x="769" y="164" class="body" text-anchor="start"><tspan x="769" dy="0">What can an attacker learn?</tspan><tspan x="769" dy="19">What is the privacy unit?</tspan><tspan x="769" dy="19">What guarantee composes?</tspan></text><text x="500" y="354" class="head" text-anchor="middle">These are separate requirements: passing one does not certify the others.</text>
</svg>
