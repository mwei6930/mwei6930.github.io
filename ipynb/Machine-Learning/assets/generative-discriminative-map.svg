<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">Generative and discriminative probabilistic modeling</title>
  <desc id="desc">A generative model learns the joint distribution through class priors and class-conditional features, while a discriminative model directly learns the conditional label distribution.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#495057"/></marker>
    <style>.box{fill:#fff;stroke:#495057;stroke-width:2}.root{fill:#f8f9fa}.g{fill:#e7f5ff}.d{fill:#ffe8cc}.out{fill:#ebfbee}.h{font:700 24px Arial,sans-serif;fill:#212529}.t{font:17px Arial,sans-serif;fill:#343a40}.s{font:15px Arial,sans-serif;fill:#495057}.line{stroke:#495057;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <text x="600" y="38" text-anchor="middle" class="h">Two Routes to Class Probabilities</text>
  <rect x="435" y="72" width="330" height="100" rx="6" class="box root"/>
  <text x="600" y="113" text-anchor="middle" class="h">Training pairs (x, y)</text>
  <text x="600" y="145" text-anchor="middle" class="s">Same observations, different modeling target</text>
  <rect x="80" y="245" width="430" height="230" rx="6" class="box g"/>
  <text x="295" y="286" text-anchor="middle" class="h">Generative Route</text>
  <text x="112" y="329" class="t">Learn p(x, y) = p(y) p(x | y)</text>
  <text x="112" y="369" class="t">Infer p(y | x) with Bayes' rule</text>
  <text x="112" y="413" class="s">Can sample x, score joint likelihood,</text>
  <text x="112" y="438" class="s">and exploit structural assumptions</text>
  <rect x="690" y="245" width="430" height="230" rx="6" class="box d"/>
  <text x="905" y="286" text-anchor="middle" class="h">Discriminative Route</text>
  <text x="722" y="329" class="t">Learn p(y | x) or a decision score</text>
  <text x="722" y="369" class="t">Focus capacity on the prediction target</text>
  <text x="722" y="413" class="s">Usually needs fewer distributional</text>
  <text x="722" y="438" class="s">assumptions about the feature space</text>
  <path d="M500 172 C420 200 330 205 305 237" class="line"/>
  <path d="M700 172 C780 200 870 205 895 237" class="line"/>
  <rect x="330" y="520" width="540" height="62" rx="6" class="box out"/>
  <text x="600" y="558" text-anchor="middle" class="t">The better choice depends on sample size, misspecification, missing data, and the required outputs.</text>
  <path d="M510 416 C565 470 570 485 580 512" class="line"/>
  <path d="M690 416 C635 470 630 485 620 512" class="line"/>
</svg>
