<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">Probabilistic learning from observations to decisions</title>
  <desc id="desc">A probabilistic model combines data, likelihood assumptions, and prior information to form a posterior predictive distribution, which is converted into an action using a loss function.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#495057"/></marker>
    <style>
      .box{fill:#fff;stroke:#495057;stroke-width:2}.data{fill:#e7f5ff}.model{fill:#ebfbee}.post{fill:#fff3bf}.pred{fill:#ffe8cc}.decision{fill:#f3f0ff}
      .h{font:700 24px Arial,sans-serif;fill:#212529}.t{font:17px Arial,sans-serif;fill:#343a40}.s{font:15px Arial,sans-serif;fill:#495057}.line{stroke:#495057;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <text x="600" y="38" text-anchor="middle" class="h">From Observations to Decisions</text>
  <rect x="35" y="92" width="200" height="150" rx="6" class="box data"/>
  <text x="135" y="130" text-anchor="middle" class="h">Data D</text>
  <text x="55" y="166" class="t">Observed x and y</text>
  <text x="55" y="198" class="s">Finite, noisy sample</text>
  <rect x="275" y="70" width="235" height="194" rx="6" class="box model"/>
  <text x="392" y="108" text-anchor="middle" class="h">Model</text>
  <text x="298" y="146" class="t">Likelihood p(D | theta)</text>
  <text x="298" y="178" class="t">Prior p(theta)</text>
  <text x="298" y="222" class="s">Assumptions define what</text>
  <text x="298" y="246" class="s">can be learned from D</text>
  <path d="M235 167 H267" class="line"/>
  <rect x="550" y="92" width="225" height="150" rx="6" class="box post"/>
  <text x="662" y="130" text-anchor="middle" class="h">Posterior</text>
  <text x="574" y="168" class="t">p(theta | D)</text>
  <text x="574" y="202" class="s">Uncertainty about</text>
  <text x="574" y="226" class="s">parameters and functions</text>
  <path d="M510 167 H542" class="line"/>
  <rect x="815" y="70" width="250" height="194" rx="6" class="box pred"/>
  <text x="940" y="108" text-anchor="middle" class="h">Prediction</text>
  <text x="838" y="146" class="t">p(y* | x*, D)</text>
  <text x="838" y="180" class="s">Average over posterior</text>
  <text x="838" y="204" class="s">parameter uncertainty</text>
  <text x="838" y="240" class="s">Distribution, not only a label</text>
  <path d="M775 167 H807" class="line"/>
  <rect x="365" y="350" width="470" height="160" rx="6" class="box decision"/>
  <text x="600" y="390" text-anchor="middle" class="h">Decision Rule</text>
  <text x="395" y="430" class="t">Choose action a* = arg min E[L(a, Y) | x*, D]</text>
  <text x="395" y="468" class="s">Probabilities describe uncertainty; loss describes consequences.</text>
  <path d="M940 264 C940 320 780 318 754 342" class="line"/>
  <rect x="60" y="540" width="1080" height="46" rx="6" fill="#f8f9fa" stroke="#adb5bd"/>
  <text x="600" y="569" text-anchor="middle" class="t">Aleatoric uncertainty comes from outcomes; epistemic uncertainty comes from limited knowledge of the model.</text>
</svg>
