<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Spectral clustering pipeline</title>
  <desc id="desc">A four-stage teaching diagram showing data points, an affinity graph, Laplacian eigenvectors, and clustering in the spectral embedding.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#425466"/></marker>
    <style>.h{font:700 25px Arial,sans-serif;fill:#17212b}.t{font:17px Arial,sans-serif;fill:#334155}.s{font:15px Arial,sans-serif;fill:#526172}.panel{fill:#f8fafc;stroke:#94a3b8;stroke-width:2}.edge{stroke:#94a3b8;stroke-width:2}.strong{stroke:#2563eb;stroke-width:4}.a{fill:#2563eb}.b{fill:#e8590c}.c{fill:#16a34a}</style>
  </defs>
  <rect width="1200" height="620" fill="#fff"/>
  <text x="600" y="42" text-anchor="middle" class="h">Spectral clustering: turn geometry into a graph problem</text>
  <rect x="28" y="82" width="255" height="430" rx="8" class="panel"/>
  <text x="155" y="120" text-anchor="middle" class="h">1. Observations</text>
  <path d="M78 360 C100 175 210 170 235 350" fill="none" stroke="#cbd5e1" stroke-width="42"/>
  <circle cx="82" cy="356" r="10" class="a"/><circle cx="93" cy="300" r="10" class="a"/><circle cx="112" cy="245" r="10" class="a"/><circle cx="145" cy="205" r="10" class="a"/><circle cx="185" cy="220" r="10" class="b"/><circle cx="216" cy="265" r="10" class="b"/><circle cx="231" cy="320" r="10" class="b"/><circle cx="238" cy="373" r="10" class="b"/>
  <text x="155" y="463" text-anchor="middle" class="t">Non-convex structure</text>
  <text x="155" y="489" text-anchor="middle" class="s">Euclidean centroids can cut across it</text>
  <line x1="289" y1="295" x2="333" y2="295" stroke="#425466" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="338" y="82" width="255" height="430" rx="8" class="panel"/>
  <text x="465" y="120" text-anchor="middle" class="h">2. Affinity graph</text>
  <line x1="388" y1="350" x2="410" y2="290" class="strong"/><line x1="410" y1="290" x2="440" y2="230" class="strong"/><line x1="440" y1="230" x2="475" y2="205" class="strong"/><line x1="475" y1="205" x2="510" y2="235" class="strong"/><line x1="510" y1="235" x2="538" y2="295" class="strong"/><line x1="538" y1="295" x2="550" y2="355" class="strong"/>
  <line x1="388" y1="350" x2="440" y2="230" class="edge"/><line x1="410" y1="290" x2="475" y2="205" class="edge"/><line x1="475" y1="205" x2="538" y2="295" class="edge"/><line x1="510" y1="235" x2="550" y2="355" class="edge"/>
  <circle cx="388" cy="350" r="10" class="a"/><circle cx="410" cy="290" r="10" class="a"/><circle cx="440" cy="230" r="10" class="a"/><circle cx="475" cy="205" r="10" class="c"/><circle cx="510" cy="235" r="10" class="b"/><circle cx="538" cy="295" r="10" class="b"/><circle cx="550" cy="355" r="10" class="b"/>
  <text x="465" y="438" text-anchor="middle" class="t">W encodes local similarity</text>
  <text x="465" y="466" text-anchor="middle" class="s">k-nearest neighbours or an RBF kernel</text>
  <line x1="599" y1="295" x2="643" y2="295" stroke="#425466" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="648" y="82" width="255" height="430" rx="8" class="panel"/>
  <text x="775" y="120" text-anchor="middle" class="h">3. Eigenvectors</text>
  <text x="775" y="175" text-anchor="middle" class="t">L = D - W</text>
  <line x1="700" y1="380" x2="850" y2="380" stroke="#64748b" stroke-width="2"/><line x1="775" y1="205" x2="775" y2="410" stroke="#64748b" stroke-width="2"/>
  <path d="M700 340 C735 335 745 260 770 250 C800 238 810 320 850 325" fill="none" stroke="#2563eb" stroke-width="5"/>
  <path d="M700 305 C735 300 752 305 770 330 C795 360 818 290 850 278" fill="none" stroke="#e8590c" stroke-width="5"/>
  <text x="775" y="438" text-anchor="middle" class="t">Use low-frequency graph directions</text>
  <text x="775" y="466" text-anchor="middle" class="s">Nearby graph nodes receive similar coordinates</text>
  <line x1="909" y1="295" x2="953" y2="295" stroke="#425466" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="958" y="82" width="214" height="430" rx="8" class="panel"/>
  <text x="1065" y="120" text-anchor="middle" class="h">4. Cluster</text>
  <line x1="995" y1="390" x2="1140" y2="390" stroke="#64748b" stroke-width="2"/><line x1="1010" y1="200" x2="1010" y2="410" stroke="#64748b" stroke-width="2"/>
  <circle cx="1030" cy="245" r="10" class="a"/><circle cx="1044" cy="270" r="10" class="a"/><circle cx="1058" cy="230" r="10" class="a"/><circle cx="1070" cy="258" r="10" class="a"/>
  <circle cx="1102" cy="345" r="10" class="b"/><circle cx="1118" cy="320" r="10" class="b"/><circle cx="1130" cy="355" r="10" class="b"/><circle cx="1140" cy="330" r="10" class="b"/>
  <line x1="1085" y1="210" x2="1085" y2="385" stroke="#16a34a" stroke-width="3" stroke-dasharray="8 7"/>
  <text x="1065" y="438" text-anchor="middle" class="t">K-Means in embedding</text>
  <text x="1065" y="466" text-anchor="middle" class="s">Graph cuts become simple</text>
  <rect x="145" y="548" width="910" height="45" rx="6" fill="#ecfdf5" stroke="#86efac"/>
  <text x="600" y="577" text-anchor="middle" class="t">Key dependency: the affinity graph defines what “nearby” means before any eigenvector is computed.</text>
</svg>
