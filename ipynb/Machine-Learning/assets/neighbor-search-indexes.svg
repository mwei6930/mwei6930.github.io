<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">Exact and approximate nearest-neighbor search</title>
  <desc id="desc">Brute force, KD-tree, ball-tree, and approximate graph or quantization indexes make different assumptions and trade recall for latency.</desc>
  <defs>
    <style>.title{font:700 28px Arial,sans-serif;fill:#0f172a}.head{font:700 18px Arial,sans-serif;fill:#0f172a}.body{font:14px Arial,sans-serif;fill:#1e293b}.small{font:12px Arial,sans-serif;fill:#475569}.line{stroke:#64748b;stroke-width:1.5}</style>
  </defs>
  <rect width="1200" height="690" fill="#f8fafc"/>
  <text x="600" y="43" text-anchor="middle" class="title">Neighbor search is an indexing problem at prediction time</text>

  <rect x="30" y="82" width="270" height="465" rx="8" fill="#fff" stroke="#64748b"/>
  <text x="165" y="118" text-anchor="middle" class="head">Brute force</text>
  <g fill="#93c5fd">
    <circle cx="75" cy="185" r="6"/><circle cx="110" cy="230" r="6"/><circle cx="145" cy="175" r="6"/><circle cx="185" cy="250" r="6"/><circle cx="235" cy="190" r="6"/><circle cx="255" cy="285" r="6"/><circle cx="90" cy="305" r="6"/><circle cx="160" cy="325" r="6"/><circle cx="220" cy="340" r="6"/>
  </g>
  <circle cx="170" cy="255" r="9" fill="#dc2626"/>
  <g stroke="#dc2626" stroke-width="1" opacity="0.65"><line x1="170" y1="255" x2="75" y2="185"/><line x1="170" y1="255" x2="110" y2="230"/><line x1="170" y1="255" x2="145" y2="175"/><line x1="170" y1="255" x2="185" y2="250"/><line x1="170" y1="255" x2="235" y2="190"/><line x1="170" y1="255" x2="255" y2="285"/><line x1="170" y1="255" x2="90" y2="305"/><line x1="170" y1="255" x2="160" y2="325"/><line x1="170" y1="255" x2="220" y2="340"/></g>
  <text x="165" y="397" text-anchor="middle" class="body">compare with every point</text>
  <text x="165" y="425" text-anchor="middle" class="small">exact; simple; vectorizes well</text>
  <text x="165" y="450" text-anchor="middle" class="small">query O(nd), memory O(nd)</text>
  <text x="165" y="475" text-anchor="middle" class="small">often strong in high dimension</text>

  <rect x="315" y="82" width="270" height="465" rx="8" fill="#fff" stroke="#64748b"/>
  <text x="450" y="118" text-anchor="middle" class="head">KD-tree</text>
  <rect x="350" y="155" width="200" height="200" fill="#eff6ff" stroke="#2563eb"/>
  <line x1="445" y1="155" x2="445" y2="355" stroke="#f97316" stroke-width="3"/>
  <line x1="350" y1="255" x2="445" y2="255" stroke="#16a34a" stroke-width="3"/>
  <line x1="445" y1="220" x2="550" y2="220" stroke="#7c3aed" stroke-width="3"/>
  <line x1="500" y1="220" x2="500" y2="355" stroke="#dc2626" stroke-width="3"/>
  <g fill="#334155"><circle cx="380" cy="190" r="5"/><circle cx="410" cy="300" r="5"/><circle cx="470" cy="180" r="5"/><circle cx="525" cy="275" r="5"/><circle cx="475" cy="320" r="5"/></g>
  <text x="450" y="397" text-anchor="middle" class="body">recursive axis-aligned splits</text>
  <text x="450" y="425" text-anchor="middle" class="small">exact pruning in low dimension</text>
  <text x="450" y="450" text-anchor="middle" class="small">average query near O(log n)</text>
  <text x="450" y="475" text-anchor="middle" class="small">pruning weakens as d grows</text>

  <rect x="600" y="82" width="270" height="465" rx="8" fill="#fff" stroke="#64748b"/>
  <text x="735" y="118" text-anchor="middle" class="head">Ball tree</text>
  <circle cx="735" cy="255" r="103" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <circle cx="690" cy="235" r="48" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <circle cx="785" cy="275" r="55" fill="#ffedd5" stroke="#f97316" stroke-width="2"/>
  <g fill="#334155"><circle cx="670" cy="220" r="5"/><circle cx="705" cy="250" r="5"/><circle cx="760" cy="250" r="5"/><circle cx="805" cy="290" r="5"/><circle cx="785" cy="310" r="5"/></g>
  <text x="735" y="397" text-anchor="middle" class="body">nested metric balls</text>
  <text x="735" y="425" text-anchor="middle" class="small">supports more metrics than KD-tree</text>
  <text x="735" y="450" text-anchor="middle" class="small">prunes by triangle inequality</text>
  <text x="735" y="475" text-anchor="middle" class="small">still degrades in high dimension</text>

  <rect x="885" y="82" width="285" height="465" rx="8" fill="#fff" stroke="#64748b"/>
  <text x="1027" y="118" text-anchor="middle" class="head">Approximate index</text>
  <g stroke="#7c3aed" stroke-width="2"><line x1="930" y1="190" x2="980" y2="160"/><line x1="980" y1="160" x2="1045" y2="205"/><line x1="1045" y1="205" x2="1110" y2="175"/><line x1="930" y1="190" x2="970" y2="270"/><line x1="970" y1="270" x2="1045" y2="205"/><line x1="970" y1="270" x2="1055" y2="320"/><line x1="1055" y1="320" x2="1110" y2="250"/><line x1="1110" y1="175" x2="1110" y2="250"/><line x1="1045" y1="205" x2="1110" y2="250"/></g>
  <g fill="#c4b5fd" stroke="#7c3aed"><circle cx="930" cy="190" r="9"/><circle cx="980" cy="160" r="9"/><circle cx="1045" cy="205" r="9"/><circle cx="1110" cy="175" r="9"/><circle cx="970" cy="270" r="9"/><circle cx="1055" cy="320" r="9"/><circle cx="1110" cy="250" r="9"/></g>
  <circle cx="1015" cy="260" r="10" fill="#dc2626"/>
  <text x="1027" y="365" text-anchor="middle" class="small">graph navigation, hashing,</text>
  <text x="1027" y="385" text-anchor="middle" class="small">or vector quantization</text>
  <text x="1027" y="425" text-anchor="middle" class="small">fast and scalable</text>
  <text x="1027" y="450" text-anchor="middle" class="small">may miss true neighbors</text>
  <text x="1027" y="475" text-anchor="middle" class="small">measure recall at k versus latency</text>

  <rect x="110" y="580" width="980" height="70" rx="7" fill="#fefce8" stroke="#ca8a04"/>
  <text x="600" y="609" text-anchor="middle" class="head">Index choice is empirical</text>
  <text x="600" y="635" text-anchor="middle" class="body">Benchmark build time, memory, query latency, and neighbor recall on the deployed representation and hardware.</text>
</svg>
