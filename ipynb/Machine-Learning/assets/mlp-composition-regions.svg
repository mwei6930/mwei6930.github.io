<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">An MLP as function composition and learned feature geometry</title>
  <desc id="desc">Inputs pass through two nonlinear hidden layers to a linear output head; each hidden layer creates a representation in which the final task is easier.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#495057"/></marker><style>.h{font:700 24px Arial,sans-serif;fill:#212529}.t{font:17px Arial,sans-serif;fill:#343a40}.s{font:15px Arial,sans-serif;fill:#495057}.box{stroke:#495057;stroke-width:2;rx:6}.line{stroke:#495057;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.node{stroke:#343a40;stroke-width:2}</style></defs>
  <text x="600" y="38" text-anchor="middle" class="h">Depth Builds a Sequence of Learned Representations</text>
  <rect x="30" y="80" width="220" height="430" class="box" fill="#e7f5ff"/><text x="140" y="118" text-anchor="middle" class="t">Input x</text>
  <circle cx="100" cy="220" r="18" class="node" fill="#fff"/><circle cx="180" cy="220" r="18" class="node" fill="#fff"/><circle cx="100" cy="310" r="18" class="node" fill="#fff"/><circle cx="180" cy="310" r="18" class="node" fill="#fff"/>
  <text x="140" y="410" text-anchor="middle" class="s">raw coordinates</text><text x="140" y="438" text-anchor="middle" class="s">or engineered features</text>
  <path d="M250 295 H315" class="line"/>
  <rect x="320" y="80" width="250" height="430" class="box" fill="#fff3bf"/><text x="445" y="118" text-anchor="middle" class="t">Hidden representation h1</text>
  <circle cx="390" cy="190" r="20" class="node" fill="#fff"/><circle cx="500" cy="190" r="20" class="node" fill="#fff"/><circle cx="390" cy="285" r="20" class="node" fill="#fff"/><circle cx="500" cy="285" r="20" class="node" fill="#fff"/><circle cx="445" cy="380" r="20" class="node" fill="#fff"/>
  <text x="445" y="445" text-anchor="middle" class="s">h1 = g1(W1 x + b1)</text>
  <path d="M570 295 H635" class="line"/>
  <rect x="640" y="80" width="250" height="430" class="box" fill="#d3f9d8"/><text x="765" y="118" text-anchor="middle" class="t">Hidden representation h2</text>
  <path d="M700 360 L760 170 L830 360 Z" fill="#fff" stroke="#2b8a3e" stroke-width="3"/><circle cx="745" cy="285" r="13" fill="#4dabf7"/><circle cx="780" cy="255" r="13" fill="#4dabf7"/><circle cx="790" cy="325" r="13" fill="#ff8787"/><circle cx="820" cy="300" r="13" fill="#ff8787"/>
  <text x="765" y="445" text-anchor="middle" class="s">h2 = g2(W2 h1 + b2)</text>
  <path d="M890 295 H955" class="line"/>
  <rect x="960" y="80" width="210" height="430" class="box" fill="#f3d9fa"/><text x="1065" y="118" text-anchor="middle" class="t">Output head</text>
  <line x1="995" y1="345" x2="1135" y2="190" stroke="#862e9c" stroke-width="5"/><circle cx="1025" cy="285" r="13" fill="#4dabf7"/><circle cx="1050" cy="250" r="13" fill="#4dabf7"/><circle cx="1080" cy="320" r="13" fill="#ff8787"/><circle cx="1110" cy="300" r="13" fill="#ff8787"/>
  <text x="1065" y="410" text-anchor="middle" class="s">linear logits</text><text x="1065" y="438" text-anchor="middle" class="s">become sufficient</text>
  <text x="600" y="558" text-anchor="middle" class="t">f(x) = f3(f2(f1(x))) : each layer changes the coordinate system for the next layer.</text>
</svg>
