<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
<title id="title">Governance connects evidence to accountable decisions</title>
<desc id="desc">Scope, evidence, approval, deployment, and monitoring form a continuous lifecycle rather than a one-time document.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
  </marker>
</defs>
<style>
text { font-family: Arial, Helvetica, sans-serif; letter-spacing: 0; fill: #1f2937; }
.title { font-size: 25px; font-weight: 700; }
.subtitle { font-size: 14px; fill: #4b5563; }
.head { font-size: 16px; font-weight: 700; }
.body { font-size: 13px; }
.small { font-size: 12px; fill: #4b5563; }
.formula { font-family: "Courier New", monospace; font-size: 13px; }
.box { stroke-width: 1.4; rx: 7; }
.arrow { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#arrow); }
.dash { stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 7 5; fill: none; marker-end: url(#arrow); }
.axis { stroke: #6b7280; stroke-width: 1.3; fill: none; }
</style>
<rect width="1000" height="420" fill="#ffffff"/>
<text x="40" y="42" class="title" text-anchor="start">Governance connects evidence to accountable decisions</text>
<text x="40" y="68" class="subtitle" text-anchor="start">Scope, evidence, approval, deployment, and monitoring form a continuous lifecycle rather than a one-time document.</text>
<rect x="35" y="118" width="175" height="185" class="box" fill="#dbeafe" stroke="#374151"/><text x="122" y="147" class="head" text-anchor="middle">Scope</text><text x="49" y="174" class="body" text-anchor="start"><tspan x="49" dy="0">Decision owner</tspan><tspan x="49" dy="19">Affected people</tspan><tspan x="49" dy="19">Intended use</tspan></text><path d="M 210 210 L 245 210" class="arrow"/><rect x="245" y="118" width="175" height="185" class="box" fill="#dcfce7" stroke="#374151"/><text x="332" y="147" class="head" text-anchor="middle">Evidence</text><text x="259" y="174" class="body" text-anchor="start"><tspan x="259" dy="0">Data lineage</tspan><tspan x="259" dy="19">Slice metrics</tspan><tspan x="259" dy="19">Stress tests</tspan></text><path d="M 420 210 L 455 210" class="arrow"/><rect x="455" y="118" width="175" height="185" class="box" fill="#fef3c7" stroke="#374151"/><text x="542" y="147" class="head" text-anchor="middle">Decision</text><text x="469" y="174" class="body" text-anchor="start"><tspan x="469" dy="0">Thresholds</tspan><tspan x="469" dy="19">Guardrails</tspan><tspan x="469" dy="19">Sign-off</tspan></text><path d="M 630 210 L 665 210" class="arrow"/><rect x="665" y="118" width="135" height="185" class="box" fill="#fee2e2" stroke="#374151"/><text x="732" y="147" class="head" text-anchor="middle">Deploy</text><text x="679" y="174" class="body" text-anchor="start"><tspan x="679" dy="0">Version</tspan><tspan x="679" dy="19">Access</tspan><tspan x="679" dy="19">Fallback</tspan></text><path d="M 800 210 L 835 210" class="arrow"/><rect x="835" y="118" width="130" height="185" class="box" fill="#e0e7ff" stroke="#374151"/><text x="900" y="147" class="head" text-anchor="middle">Monitor</text><text x="849" y="174" class="body" text-anchor="start"><tspan x="849" dy="0">Drift</tspan><tspan x="849" dy="19">Incidents</tspan><tspan x="849" dy="19">Retire</tspan></text><path d="M 900 303 C 900 375, 120 375, 120 305" class="dash"/><text x="500" y="376" class="head" text-anchor="middle">Operational evidence feeds back into scope, data, and model decisions.</text>
</svg>
