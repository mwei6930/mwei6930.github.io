<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">A classifier can be evaluated at four output levels</title>
  <desc id="desc">The same model output supports label, ranking, probability, and decision utility evaluation, each with different metrics and assumptions.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#334155"/></marker><style>.t{font:700 28px Arial,sans-serif;fill:#0f172a}.h{font:700 20px Arial,sans-serif;fill:#0f172a}.b{font:15px Arial,sans-serif;fill:#334155}.s{font:14px Arial,sans-serif;fill:#475569}.box{fill:#fff;stroke:#64748b;stroke-width:2}.arr{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="620" fill="#f8fafc"/><text x="600" y="43" text-anchor="middle" class="t">A classifier can be evaluated at four output levels</text>
  <rect x="50" y="90" width="210" height="150" rx="8" class="box"/><text x="155" y="123" text-anchor="middle" class="h">Model output</text><text x="155" y="155" text-anchor="middle" class="b">score or probability</text><path d="M85 205 C115 160 145 215 180 165 S225 205 235 155" stroke="#2563eb" stroke-width="4" fill="none"/>
  <path d="M260 165 H310" class="arr"/>
  <rect x="315" y="78" width="190" height="175" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="410" y="112" text-anchor="middle" class="h">Labels</text><text x="410" y="143" text-anchor="middle" class="b">apply a threshold</text><text x="410" y="177" text-anchor="middle" class="b">accuracy, recall,</text><text x="410" y="200" text-anchor="middle" class="b">precision, F1, MCC</text><text x="410" y="231" text-anchor="middle" class="s">depends on prevalence</text>
  <rect x="520" y="78" width="190" height="175" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/><text x="615" y="112" text-anchor="middle" class="h">Ranking</text><text x="615" y="143" text-anchor="middle" class="b">vary all thresholds</text><text x="615" y="177" text-anchor="middle" class="b">ROC AUC, PR curve,</text><text x="615" y="200" text-anchor="middle" class="b">average precision</text><text x="615" y="231" text-anchor="middle" class="s">does not test calibration</text>
  <rect x="725" y="78" width="190" height="175" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="820" y="112" text-anchor="middle" class="h">Probabilities</text><text x="820" y="143" text-anchor="middle" class="b">retain confidence</text><text x="820" y="177" text-anchor="middle" class="b">log loss, Brier,</text><text x="820" y="200" text-anchor="middle" class="b">reliability diagram</text><text x="820" y="231" text-anchor="middle" class="s">rewards honest uncertainty</text>
  <rect x="930" y="78" width="220" height="175" rx="8" fill="#fdf2f8" stroke="#db2777" stroke-width="2"/><text x="1040" y="112" text-anchor="middle" class="h">Decisions</text><text x="1040" y="143" text-anchor="middle" class="b">combine action and cost</text><text x="1040" y="177" text-anchor="middle" class="b">expected utility, capacity,</text><text x="1040" y="200" text-anchor="middle" class="b">recall at fixed precision</text><text x="1040" y="231" text-anchor="middle" class="s">closest to deployment value</text>
  <path d="M410 253 V314 H1040 V253" stroke="#64748b" stroke-width="2" fill="none"/>
  <rect x="105" y="345" width="990" height="190" rx="8" class="box"/>
  <text x="600" y="380" text-anchor="middle" class="h">Metric choice is part of the problem specification</text>
  <text x="145" y="418" class="b">1. Identify the positive class and the unit of prediction.</text><text x="145" y="448" class="b">2. Decide whether the system consumes labels, rankings, probabilities, or actions.</text><text x="145" y="478" class="b">3. Report a small complementary set: discrimination + calibration + decision value.</text><text x="145" y="508" class="b">4. Always include denominators, threshold, averaging rule, and uncertainty.</text>
  <circle cx="120" cy="413" r="6" fill="#2563eb"/><circle cx="120" cy="443" r="6" fill="#16a34a"/><circle cx="120" cy="473" r="6" fill="#ea580c"/><circle cx="120" cy="503" r="6" fill="#db2777"/>
  <text x="600" y="577" text-anchor="middle" class="s">No single metric preserves all information contained in a predictive distribution.</text>
</svg>
