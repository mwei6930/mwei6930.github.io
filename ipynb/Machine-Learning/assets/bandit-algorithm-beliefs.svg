<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc">
<title id="title">Three ways to trade reward for information</title>
<desc id="desc">Exploration may be random, confidence-directed, or driven by posterior uncertainty.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
  </marker>
</defs>
<style>
text { font-family: Arial, Helvetica, sans-serif; letter-spacing: 0; fill: #1f2937; }
.title { font-size: 25px; font-weight: 700; }
.subtitle { font-size: 14px; fill: #4b5563; }
.head { font-size: 16px; font-weight: 700; }
.body { font-size: 13px; }
.small { font-size: 12px; fill: #4b5563; }
.formula { font-family: "Courier New", monospace; font-size: 13px; }
.box { stroke: #374151; stroke-width: 1.4; rx: 8; }
.soft { stroke: #9ca3af; stroke-width: 1.2; rx: 8; }
.arrow { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#arrow); }
.dash { stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 7 5; fill: none; marker-end: url(#arrow); }
</style>
<rect width="1000" height="390" fill="#ffffff"/>
<text x="40" y="42" class="title" text-anchor="start">Three ways to trade reward for information</text>
<text x="40" y="67" class="subtitle" text-anchor="start">Exploration may be random, confidence-directed, or driven by posterior uncertainty.</text>
<rect x="35" y="105" width="285" height="210" class="box" fill="#dbeafe" stroke="#374151"/><text x="177" y="132" class="head" text-anchor="middle">Epsilon-greedy</text><text x="49" y="158" class="body" text-anchor="start"><tspan x="49" dy="0">Mostly choose best mean</tspan><tspan x="49" dy="19">Explore uniformly with ε</tspan><tspan x="49" dy="19">Simple but undirected</tspan></text><rect x="357" y="105" width="285" height="210" class="box" fill="#dcfce7" stroke="#374151"/><text x="499" y="132" class="head" text-anchor="middle">UCB</text><text x="371" y="158" class="body" text-anchor="start"><tspan x="371" dy="0">mean + confidence bonus</tspan><tspan x="371" dy="19">Optimism under uncertainty</tspan><tspan x="371" dy="19">Directed exploration</tspan></text><rect x="679" y="105" width="285" height="210" class="box" fill="#fef3c7" stroke="#374151"/><text x="821" y="132" class="head" text-anchor="middle">Thompson sampling</text><text x="693" y="158" class="body" text-anchor="start"><tspan x="693" dy="0">Sample each posterior</tspan><tspan x="693" dy="19">Choose sampled winner</tspan><tspan x="693" dy="19">Probability matching</tspan></text><text x="500" y="350" class="small" text-anchor="middle">All three need a stationary stochastic model or a deliberate nonstationary extension.</text>
</svg>
