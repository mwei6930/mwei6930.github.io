<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Time aware evaluation for sequential models</title>
  <desc id="desc">Training windows precede validation and test windows, gaps prevent near-boundary leakage, and entity groups stay within one partition.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#495057"/></marker><style>.h{font:700 22px Arial,sans-serif;fill:#212529}.t{font:17px Arial,sans-serif;fill:#343a40}.s{font:15px Arial,sans-serif;fill:#495057}.box{stroke:#495057;stroke-width:2}.line{stroke:#495057;stroke-width:2.5;fill:none;marker-end:url(#a)}</style></defs>
  <text x="600" y="38" text-anchor="middle" class="h">Evaluate in the Direction the System Will Actually Operate</text>
  <path d="M90 125 H1110" class="line"/><text x="90" y="105" class="s">past</text><text x="1080" y="105" class="s">future</text>
  <text x="85" y="190" class="h">Fold 1</text><rect x="180" y="155" width="360" height="70" class="box" fill="#e7f5ff"/><rect x="540" y="155" width="55" height="70" class="box" fill="#f8f9fa"/><rect x="595" y="155" width="180" height="70" class="box" fill="#fff3bf"/><rect x="775" y="155" width="70" height="70" class="box" fill="#f8f9fa"/><rect x="845" y="155" width="180" height="70" class="box" fill="#ffe8cc"/>
  <text x="360" y="198" text-anchor="middle" class="t">training</text><text x="567" y="198" text-anchor="middle" class="s">gap</text><text x="685" y="198" text-anchor="middle" class="t">validation</text><text x="810" y="198" text-anchor="middle" class="s">gap</text><text x="935" y="198" text-anchor="middle" class="t">test</text>
  <text x="85" y="305" class="h">Fold 2</text><rect x="180" y="270" width="515" height="70" class="box" fill="#e7f5ff"/><rect x="695" y="270" width="55" height="70" class="box" fill="#f8f9fa"/><rect x="750" y="270" width="180" height="70" class="box" fill="#fff3bf"/><rect x="930" y="270" width="55" height="70" class="box" fill="#f8f9fa"/><rect x="985" y="270" width="130" height="70" class="box" fill="#ffe8cc"/>
  <text x="437" y="313" text-anchor="middle" class="t">expanded training</text><text x="840" y="313" text-anchor="middle" class="t">validation</text><text x="1050" y="313" text-anchor="middle" class="t">test</text>
  <rect x="150" y="410" width="900" height="95" rx="6" class="box" fill="#ebfbee"/><text x="600" y="446" text-anchor="middle" class="h">Keep dependence inside partitions</text><text x="600" y="476" text-anchor="middle" class="t">same user / patient / document / conversation stays together; fit all preprocessing only on past training data</text>
  <text x="600" y="540" text-anchor="middle" class="s">Report token, span, and full-sequence behavior separately; monitor drift and latency as well as accuracy.</text>
</svg>
