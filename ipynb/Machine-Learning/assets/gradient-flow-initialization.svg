<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Initialization controls activation and gradient scale across depth</title>
  <desc id="desc">Three depth plots show variance shrinking with small weights, remaining stable with variance-aware initialization, and exploding with large weights.</desc>
  <defs><style>.h{font:700 24px Arial,sans-serif;fill:#212529}.t{font:700 18px Arial,sans-serif;fill:#343a40}.s{font:15px Arial,sans-serif;fill:#495057}.box{stroke:#adb5bd;stroke-width:2;rx:6}.axis{stroke:#868e96;stroke-width:2}.bad{stroke:#c92a2a;stroke-width:5;fill:none}.good{stroke:#2b8a3e;stroke-width:5;fill:none}</style></defs>
  <text x="600" y="38" text-anchor="middle" class="h">Initialization Sets the Starting Signal-to-Gradient Regime</text>
  <g transform="translate(30 85)"><rect width="350" height="440" class="box" fill="#ffe3e3"/><text x="175" y="42" text-anchor="middle" class="t">Weights too small</text><line x1="55" y1="340" x2="305" y2="340" class="axis"/><line x1="55" y1="90" x2="55" y2="340" class="axis"/><path d="M65 115 C120 175 170 260 295 330" class="bad"/><text x="175" y="375" text-anchor="middle" class="s">layer depth -></text><text x="175" y="405" text-anchor="middle" class="s">activations and gradients vanish</text></g>
  <g transform="translate(425 85)"><rect width="350" height="440" class="box" fill="#d3f9d8"/><text x="175" y="42" text-anchor="middle" class="t">Variance-aware scale</text><line x1="55" y1="340" x2="305" y2="340" class="axis"/><line x1="55" y1="90" x2="55" y2="340" class="axis"/><path d="M65 210 C120 190 170 225 225 205 C260 195 275 215 295 205" class="good"/><text x="175" y="375" text-anchor="middle" class="s">Xavier: tanh-like layers</text><text x="175" y="405" text-anchor="middle" class="s">He: ReLU-like layers</text></g>
  <g transform="translate(820 85)"><rect width="350" height="440" class="box" fill="#fff3bf"/><text x="175" y="42" text-anchor="middle" class="t">Weights too large</text><line x1="55" y1="340" x2="305" y2="340" class="axis"/><line x1="55" y1="90" x2="55" y2="340" class="axis"/><path d="M65 325 C130 300 190 230 295 105" class="bad"/><text x="175" y="375" text-anchor="middle" class="s">variance compounds with depth</text><text x="175" y="405" text-anchor="middle" class="s">unstable or exploding gradients</text></g>
  <text x="600" y="575" text-anchor="middle" class="s">Initialization does not solve optimization, but it prevents the first forward and backward passes from starting in a pathological scale.</text>
</svg>
