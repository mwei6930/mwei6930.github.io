<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">Forward values and reverse-mode gradients in backpropagation</title>
  <desc id="desc">A two-layer network shows blue forward arrows from input to loss and red gradient arrows returning from loss to every parameter.</desc>
  <defs><marker id="af" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1971c2"/></marker><marker id="ab" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#c92a2a"/></marker><style>.h{font:700 24px Arial,sans-serif;fill:#212529}.t{font:700 17px Arial,sans-serif;fill:#343a40}.s{font:15px Arial,sans-serif;fill:#495057}.box{stroke:#495057;stroke-width:2;rx:6}.f{stroke:#1971c2;stroke-width:3;fill:none;marker-end:url(#af)}.b{stroke:#c92a2a;stroke-width:3;fill:none;marker-end:url(#ab)}</style></defs>
  <text x="600" y="38" text-anchor="middle" class="h">Backpropagation Reuses the Computational Graph in Reverse</text>
  <text x="120" y="88" class="t" fill="#1971c2">Forward: compute and cache values</text><text x="760" y="88" class="t" fill="#c92a2a">Backward: accumulate local vector-Jacobian products</text>
  <rect x="30" y="205" width="120" height="95" class="box" fill="#e7f5ff"/><text x="90" y="260" text-anchor="middle" class="t">X</text>
  <rect x="205" y="140" width="130" height="80" class="box" fill="#fff3bf"/><text x="270" y="188" text-anchor="middle" class="t">W1, b1</text>
  <rect x="205" y="280" width="150" height="100" class="box" fill="#fff3bf"/><text x="280" y="322" text-anchor="middle" class="t">Z1</text><text x="280" y="350" text-anchor="middle" class="s">XW1 + b1</text>
  <rect x="410" y="280" width="130" height="100" class="box" fill="#d3f9d8"/><text x="475" y="322" text-anchor="middle" class="t">H</text><text x="475" y="350" text-anchor="middle" class="s">g(Z1)</text>
  <rect x="590" y="140" width="130" height="80" class="box" fill="#f3d9fa"/><text x="655" y="188" text-anchor="middle" class="t">W2, b2</text>
  <rect x="590" y="280" width="150" height="100" class="box" fill="#f3d9fa"/><text x="665" y="322" text-anchor="middle" class="t">O</text><text x="665" y="350" text-anchor="middle" class="s">HW2 + b2</text>
  <rect x="795" y="280" width="145" height="100" class="box" fill="#ffe3e3"/><text x="867" y="322" text-anchor="middle" class="t">Loss</text><text x="867" y="350" text-anchor="middle" class="s">L(O, y)</text>
  <path d="M150 252 L205 315 M335 180 L300 280 M355 330 H410 M540 330 H590 M720 180 L685 280 M740 330 H795" class="f"/>
  <path d="M795 350 H740 M590 365 H540 M410 365 H355 M250 280 L300 220 M625 280 L655 220 M205 350 L150 278" class="b"/>
  <text x="867" y="440" text-anchor="middle" class="s">start: dL/dL = 1</text><text x="665" y="480" text-anchor="middle" class="s">dL/dW2 = H^T dL/dO</text><text x="475" y="520" text-anchor="middle" class="s">dL/dZ1 = (dL/dO W2^T) multiplied by g'(Z1)</text><text x="280" y="560" text-anchor="middle" class="s">dL/dW1 = X^T dL/dZ1</text>
  <rect x="180" y="600" width="840" height="42" rx="6" fill="#f8f9fa" stroke="#adb5bd"/><text x="600" y="627" text-anchor="middle" class="s">Each edge contributes a local derivative; shared paths add gradient contributions.</text>
</svg>
