<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img" aria-labelledby="title desc">
<title id="title">Static and dynamic regret answer different questions</title>
<desc id="desc">The same sequence can have low static regret yet fail to track a changing optimum.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
  </marker>
</defs>
<style>
text { font-family: Arial, Helvetica, sans-serif; letter-spacing: 0; fill: #1f2937; }
.title { font-size: 25px; font-weight: 700; }
.subtitle { font-size: 14px; fill: #4b5563; }
.head { font-size: 16px; font-weight: 700; }
.body { font-size: 13px; }
.small { font-size: 12px; fill: #4b5563; }
.formula { font-family: "Courier New", monospace; font-size: 13px; }
.box { stroke: #374151; stroke-width: 1.4; rx: 8; }
.soft { stroke: #9ca3af; stroke-width: 1.2; rx: 8; }
.arrow { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#arrow); }
.dash { stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 7 5; fill: none; marker-end: url(#arrow); }
</style>
<rect width="1000" height="380" fill="#ffffff"/>
<text x="40" y="42" class="title" text-anchor="start">Static and dynamic regret answer different questions</text>
<text x="40" y="67" class="subtitle" text-anchor="start">The same sequence can have low static regret yet fail to track a changing optimum.</text>
<rect x="45" y="105" width="270" height="180" class="box" fill="#dbeafe" stroke="#374151"/><text x="180" y="132" class="head" text-anchor="middle">Learner sequence</text><text x="59" y="158" class="body" text-anchor="start"><tspan x="59" dy="0">w_1, w_2, ..., w_T</tspan><tspan x="59" dy="19">adapts after every loss</tspan><tspan x="59" dy="19">sum_t l_t(w_t)</tspan></text><rect x="365" y="105" width="270" height="180" class="box" fill="#f3f4f6" stroke="#374151"/><text x="500" y="132" class="head" text-anchor="middle">Static comparator</text><text x="379" y="158" class="body" text-anchor="start"><tspan x="379" dy="0">one fixed w chosen</tspan><tspan x="379" dy="19">with hindsight</tspan><tspan x="379" dy="19">min_w sum_t l_t(w)</tspan></text><rect x="685" y="105" width="270" height="180" class="box" fill="#fef3c7" stroke="#374151"/><text x="820" y="132" class="head" text-anchor="middle">Dynamic comparator</text><text x="699" y="158" class="body" text-anchor="start"><tspan x="699" dy="0">w*_t may change</tspan><tspan x="699" dy="19">variation is constrained</tspan><tspan x="699" dy="19">sum_t l_t(w*_t)</tspan></text><path d="M 315 195 L 365 195" class="arrow"/><text x="340" y="187" class="small" text-anchor="middle">static regret</text><path d="M 635 195 L 685 195" class="arrow"/><text x="660" y="187" class="small" text-anchor="middle">dynamic regret</text><text x="500" y="330" class="head" text-anchor="middle">A regret statement is incomplete until the comparator class is named.</text>
</svg>
