<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="585" viewBox="0 0 1200 585" role="img" aria-labelledby="title desc">
<title id="title">Instance reweighting under covariate shift</title><desc id="desc">Labeled source samples receive density-ratio weights estimated from source and target inputs before a weighted source risk approximates target risk.</desc>
<defs><marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#475569"/></marker>
<style>.title{font:700 26px Arial,sans-serif;fill:#17212b}.bh{font:700 19px Arial,sans-serif;fill:#17212b}.bt{font:15px Arial,sans-serif;fill:#334155}.small{font:14px Arial,sans-serif;fill:#526172}.arrow{stroke:#475569;stroke-width:3;marker-end:url(#arrowhead)}.node{stroke:#334155;stroke-width:2}</style></defs>
<rect width="1200" height="585" fill="#ffffff"/>
<text x="600" y="42" text-anchor="middle" class="title">Instance reweighting under covariate shift</text>
<rect x="35" y="145" width="260" height="285" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="165.0" y="183" text-anchor="middle" class="bh">Source samples</text><text x="165.0" y="217" text-anchor="middle" class="bt">labeled (x,y)</text><text x="165.0" y="244" text-anchor="middle" class="bt">drawn from P_S(x)</text><text x="165.0" y="271" text-anchor="middle" class="bt">dense source regions</text><line x1="295" y1="285" x2="395" y2="285" class="arrow"/><rect x="410" y="115" width="295" height="345" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="557.5" y="153" text-anchor="middle" class="bh">Density-ratio estimate</text><text x="557.5" y="187" text-anchor="middle" class="bt">w(x)=P_T(x)/P_S(x)</text><text x="557.5" y="214" text-anchor="middle" class="bt">domain classifier odds</text><text x="557.5" y="241" text-anchor="middle" class="bt">clip extreme weights</text><text x="557.5" y="268" text-anchor="middle" class="bt">check effective sample size</text><line x1="705" y1="285" x2="805" y2="285" class="arrow"/><rect x="820" y="145" width="345" height="285" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="3"/><text x="992.5" y="183" text-anchor="middle" class="bh">Weighted source risk</text><text x="992.5" y="217" text-anchor="middle" class="bt">target-like source points count more</text><text x="992.5" y="244" text-anchor="middle" class="bt">unsupported target regions remain</text><text x="992.5" y="271" text-anchor="middle" class="bt">fit and validate target objective</text><circle cx="95" cy="375" r="8" fill="#2563eb"/><circle cx="130" cy="350" r="12" fill="#2563eb"/><circle cx="170" cy="385" r="17" fill="#2563eb"/><circle cx="225" cy="330" r="24" fill="#e8590c"/><text x="600" y="520" text-anchor="middle" class="bh">Importance weighting corrects covariate shift only where source support covers the target.</text><text x="600" y="552" text-anchor="middle" class="small">Large weight variance means a few source observations control the estimate and uncertainty rises sharply.</text></svg>