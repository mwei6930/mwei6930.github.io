<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
<title id="title">Positive-unlabeled learning under a selection mechanism</title><desc id="desc">Observed positives and an unlabeled mixture feed a selection classifier; under SCAR its probability can be corrected using the positive selection rate.</desc>
<defs><marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#475569"/></marker>
<style>.title{font:700 26px Arial,sans-serif;fill:#17212b}.bh{font:700 19px Arial,sans-serif;fill:#17212b}.bt{font:15px Arial,sans-serif;fill:#334155}.small{font:14px Arial,sans-serif;fill:#526172}.arrow{stroke:#475569;stroke-width:3;marker-end:url(#arrowhead)}.node{stroke:#334155;stroke-width:2}</style></defs>
<rect width="1200" height="580" fill="#ffffff"/>
<text x="600" y="42" text-anchor="middle" class="title">Positive-unlabeled learning under a selection mechanism</text>
<rect x="45" y="145" width="260" height="300" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="3"/><text x="175.0" y="183" text-anchor="middle" class="bh">Observed data</text><text x="175.0" y="217" text-anchor="middle" class="bt">P: selected positives</text><text x="175.0" y="244" text-anchor="middle" class="bt">U: hidden positives</text><text x="175.0" y="271" text-anchor="middle" class="bt">U: true negatives</text><text x="175.0" y="298" text-anchor="middle" class="bt">no labeled negatives</text><circle cx="105" cy="335" r="16" fill="#16a34a"/><circle cx="150" cy="335" r="16" fill="#16a34a"/><circle cx="205" cy="335" r="16" fill="#86efac"/><circle cx="250" cy="335" r="16" fill="#94a3b8"/><text x="177" y="385" text-anchor="middle" class="small">U is a mixture, not a negative class</text><line x1="305" y1="295" x2="410" y2="295" class="arrow"/><rect x="425" y="145" width="285" height="300" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="567.5" y="183" text-anchor="middle" class="bh">Selection classifier</text><text x="567.5" y="217" text-anchor="middle" class="bt">learn g(x)=P(s=1|x)</text><text x="567.5" y="244" text-anchor="middle" class="bt">estimate c=P(s=1|y=1)</text><text x="567.5" y="271" text-anchor="middle" class="bt">requires SCAR or a model</text><text x="567.5" y="298" text-anchor="middle" class="bt">of selection propensity</text><line x1="710" y1="295" x2="815" y2="295" class="arrow"/><rect x="830" y="145" width="325" height="300" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="3"/><text x="992.5" y="183" text-anchor="middle" class="bh">Recover target probability</text><text x="992.5" y="217" text-anchor="middle" class="bt">under SCAR:</text><text x="992.5" y="244" text-anchor="middle" class="bt">P(y=1|x)=g(x)/c</text><text x="992.5" y="271" text-anchor="middle" class="bt">clip and calibrate</text><text x="992.5" y="298" text-anchor="middle" class="bt">validate with true labels</text><text x="600" y="510" text-anchor="middle" class="bh">SCAR: selected completely at random among true positives</text><text x="600" y="545" text-anchor="middle" class="small">If easy or high-value positives are more likely to be labeled, a single constant c is not a valid correction.</text></svg>