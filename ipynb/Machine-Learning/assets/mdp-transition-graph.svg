<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410" role="img" aria-labelledby="title desc">
<title id="title">An MDP makes action consequences explicit</title>
<desc id="desc">Actions alter the distribution of future states, so immediate reward is not enough.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
  </marker>
</defs>
<style>
text { font-family: Arial, Helvetica, sans-serif; letter-spacing: 0; fill: #1f2937; }
.title { font-size: 25px; font-weight: 700; }
.subtitle { font-size: 14px; fill: #4b5563; }
.head { font-size: 16px; font-weight: 700; }
.body { font-size: 13px; }
.small { font-size: 12px; fill: #4b5563; }
.formula { font-family: "Courier New", monospace; font-size: 13px; }
.box { stroke: #374151; stroke-width: 1.4; rx: 8; }
.soft { stroke: #9ca3af; stroke-width: 1.2; rx: 8; }
.arrow { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#arrow); }
.dash { stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 7 5; fill: none; marker-end: url(#arrow); }
</style>
<rect width="1000" height="410" fill="#ffffff"/>
<text x="40" y="42" class="title" text-anchor="start">An MDP makes action consequences explicit</text>
<text x="40" y="67" class="subtitle" text-anchor="start">Actions alter the distribution of future states, so immediate reward is not enough.</text>
<rect x="60" y="125" width="170" height="95" class="box" fill="#dbeafe" stroke="#374151"/><text x="145" y="152" class="head" text-anchor="middle">State s0</text><text x="74" y="178" class="body" text-anchor="start"><tspan x="74" dy="0">start</tspan></text><rect x="330" y="95" width="170" height="95" class="box" fill="#dcfce7" stroke="#374151"/><text x="415" y="122" class="head" text-anchor="middle">State s1</text><text x="344" y="148" class="body" text-anchor="start"><tspan x="344" dy="0">safe route</tspan></text><rect x="330" y="240" width="170" height="95" class="box" fill="#fef3c7" stroke="#374151"/><text x="415" y="267" class="head" text-anchor="middle">State s2</text><text x="344" y="293" class="body" text-anchor="start"><tspan x="344" dy="0">risky route</tspan></text><rect x="720" y="125" width="190" height="95" class="box" fill="#fee2e2" stroke="#374151"/><text x="815" y="152" class="head" text-anchor="middle">Terminal s3</text><text x="734" y="178" class="body" text-anchor="start"><tspan x="734" dy="0">goal, reward +1</tspan></text><path d="M 230 165 L 330 140" class="arrow"/><text x="280" y="144" class="small" text-anchor="middle">a = safe</text><path d="M 230 180 L 330 285" class="arrow"/><text x="280" y="224" class="small" text-anchor="middle">a = risky</text><path d="M 500 140 L 720 165" class="arrow"/><text x="610" y="144" class="small" text-anchor="middle">0.9</text><path d="M 500 285 L 720 190" class="arrow"/><text x="610" y="229" class="small" text-anchor="middle">0.6</text><path d="M 500 285 L 330 285" class="arrow"/><text x="415" y="277" class="small" text-anchor="middle">0.4 returns</text><text x="500" y="365" class="head" text-anchor="middle">P(s&#x27;, r | s, a) determines both the next state and reward.</text>
</svg>
