<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Positive transfer, negative transfer, and the required baseline</title><desc id="desc">Source knowledge can improve or harm target learning; target-only baselines and source ablations identify transfer gain and guide mitigation.</desc>
<defs><marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#475569"/></marker>
<style>.title{font:700 26px Arial,sans-serif;fill:#17212b}.bh{font:700 19px Arial,sans-serif;fill:#17212b}.bt{font:15px Arial,sans-serif;fill:#334155}.small{font:14px Arial,sans-serif;fill:#526172}.arrow{stroke:#475569;stroke-width:3;marker-end:url(#arrowhead)}.node{stroke:#334155;stroke-width:2}</style></defs>
<rect width="1200" height="600" fill="#ffffff"/>
<text x="600" y="42" text-anchor="middle" class="title">Positive transfer, negative transfer, and the required baseline</text>
<rect x="45" y="100" width="280" height="310" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="185.0" y="138" text-anchor="middle" class="bh">Source knowledge</text><text x="185.0" y="172" text-anchor="middle" class="bt">representation</text><text x="185.0" y="199" text-anchor="middle" class="bt">parameters or prior</text><text x="185.0" y="226" text-anchor="middle" class="bt">source examples</text><text x="185.0" y="253" text-anchor="middle" class="bt">task relationships</text><line x1="325" y1="255" x2="455" y2="175" class="arrow"/><line x1="325" y1="255" x2="455" y2="345" class="arrow"/><rect x="470" y="85" width="305" height="190" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="3"/><text x="622.5" y="123" text-anchor="middle" class="bh">Positive transfer</text><text x="622.5" y="157" text-anchor="middle" class="bt">faster learning</text><text x="622.5" y="184" text-anchor="middle" class="bt">better target score</text><text x="622.5" y="211" text-anchor="middle" class="bt">lower label requirement</text><rect x="470" y="315" width="305" height="190" rx="10" fill="#fee2e2" stroke="#e11d48" stroke-width="3"/><text x="622.5" y="353" text-anchor="middle" class="bh">Negative transfer</text><text x="622.5" y="387" text-anchor="middle" class="bt">source bias constrains target</text><text x="622.5" y="414" text-anchor="middle" class="bt">irrelevant features persist</text><text x="622.5" y="441" text-anchor="middle" class="bt">performance below target-only</text><line x1="775" y1="175" x2="900" y2="175" class="arrow"/><line x1="775" y1="410" x2="900" y2="410" class="arrow"/><rect x="915" y="85" width="240" height="190" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="3"/><text x="1035.0" y="123" text-anchor="middle" class="bh">Evidence</text><text x="1035.0" y="157" text-anchor="middle" class="bt">target-only baseline</text><text x="1035.0" y="184" text-anchor="middle" class="bt">transfer gain curve</text><text x="1035.0" y="211" text-anchor="middle" class="bt">source ablation</text><rect x="915" y="315" width="240" height="190" rx="10" fill="#fff7ed" stroke="#e8590c" stroke-width="3"/><text x="1035.0" y="353" text-anchor="middle" class="bh">Mitigation</text><text x="1035.0" y="387" text-anchor="middle" class="bt">select source</text><text x="1035.0" y="414" text-anchor="middle" class="bt">weaken sharing</text><text x="1035.0" y="441" text-anchor="middle" class="bt">adapters / gating</text><text x="1035.0" y="468" text-anchor="middle" class="bt">early stop or reset</text><text x="600" y="565" text-anchor="middle" class="bh">Similarity in file format or vocabulary does not establish transferable causal structure.</text></svg>