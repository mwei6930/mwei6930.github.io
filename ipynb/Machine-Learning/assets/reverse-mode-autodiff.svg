<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Reverse-mode automatic differentiation tape</title>
  <desc id="desc">A forward execution records primitive operations and values on a tape; a reverse traversal propagates adjoints and accumulates gradients for reused variables.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#495057"/></marker><style>.h{font:700 24px Arial,sans-serif;fill:#212529}.t{font:700 17px Arial,sans-serif;fill:#343a40}.s{font:15px Arial,sans-serif;fill:#495057}.box{stroke:#495057;stroke-width:2;rx:6}.line{stroke:#495057;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style></defs>
  <text x="600" y="38" text-anchor="middle" class="h">Automatic Differentiation Records Operations, Not Symbolic Formulas</text>
  <rect x="30" y="85" width="300" height="440" class="box" fill="#e7f5ff"/><text x="180" y="125" text-anchor="middle" class="t">1. Execute forward program</text><text x="70" y="185" class="s">a = x * w</text><text x="70" y="235" class="s">b = a + a</text><text x="70" y="285" class="s">c = tanh(b)</text><text x="70" y="335" class="s">L = (c - y)^2</text><text x="180" y="425" text-anchor="middle" class="s">ordinary numeric values</text><text x="180" y="458" text-anchor="middle" class="s">plus operation metadata</text>
  <path d="M330 305 H390" class="line"/>
  <rect x="395" y="85" width="390" height="440" class="box" fill="#fff3bf"/><text x="590" y="125" text-anchor="middle" class="t">2. Build a tape / dynamic graph</text>
  <rect x="445" y="165" width="290" height="55" class="box" fill="#fff"/><text x="590" y="198" text-anchor="middle" class="s">multiply: parents x,w; local rule</text>
  <rect x="445" y="240" width="290" height="55" class="box" fill="#fff"/><text x="590" y="273" text-anchor="middle" class="s">add: parent a used twice</text>
  <rect x="445" y="315" width="290" height="55" class="box" fill="#fff"/><text x="590" y="348" text-anchor="middle" class="s">tanh: cache output c</text>
  <rect x="445" y="390" width="290" height="55" class="box" fill="#fff"/><text x="590" y="423" text-anchor="middle" class="s">square loss: seed adjoint 1</text>
  <path d="M785 305 H845" class="line"/>
  <rect x="850" y="85" width="320" height="440" class="box" fill="#d3f9d8"/><text x="1010" y="125" text-anchor="middle" class="t">3. Traverse in reverse</text><text x="900" y="185" class="s">bar(L) = 1</text><text x="900" y="235" class="s">bar(c) += local VJP</text><text x="900" y="285" class="s">bar(b) += bar(c)(1-c^2)</text><text x="900" y="335" class="s">bar(a) += twice</text><text x="900" y="385" class="s">bar(w) += bar(a) x</text><text x="900" y="435" class="s">bar(x) += bar(a) w</text><text x="1010" y="482" text-anchor="middle" class="s">gradient contributions add</text>
  <text x="600" y="575" text-anchor="middle" class="s">Reverse mode computes the gradient of one scalar loss with respect to many parameters in one backward sweep.</text>
</svg>
