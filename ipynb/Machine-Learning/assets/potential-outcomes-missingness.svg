<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="405" viewBox="0 0 1000 405" role="img" aria-labelledby="title desc">
<title id="title">Every unit has two potential outcomes but reveals only one</title>
<desc id="desc">Treatment assignment determines which potential outcome is observed and which remains counterfactual.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
  </marker>
</defs>
<style>
text { font-family: Arial, Helvetica, sans-serif; letter-spacing: 0; fill: #1f2937; }
.title { font-size: 25px; font-weight: 700; }
.subtitle { font-size: 14px; fill: #4b5563; }
.head { font-size: 16px; font-weight: 700; }
.body { font-size: 13px; }
.small { font-size: 12px; fill: #4b5563; }
.formula { font-family: "Courier New", monospace; font-size: 13px; }
.box { stroke-width: 1.4; rx: 7; }
.arrow { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#arrow); }
.dash { stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 7 5; fill: none; marker-end: url(#arrow); }
.blocked { stroke: #dc2626; stroke-width: 3; }
</style>
<rect width="1000" height="405" fill="#ffffff"/>
<text x="40" y="42" class="title" text-anchor="start">Every unit has two potential outcomes but reveals only one</text>
<text x="40" y="68" class="subtitle" text-anchor="start">Treatment assignment determines which potential outcome is observed and which remains counterfactual.</text>
<rect x="40" y="112" width="190" height="210" class="box" fill="#f3f4f6" stroke="#374151"/><text x="135" y="140" class="head" text-anchor="middle">Unit i</text><text x="54" y="166" class="body" text-anchor="start"><tspan x="54" dy="0">Treatment T_i</tspan><tspan x="54" dy="19">Observed outcome</tspan><tspan x="54" dy="19">Missing outcome</tspan></text><rect x="270" y="112" width="230" height="210" class="box" fill="#dbeafe" stroke="#374151"/><text x="385" y="140" class="head" text-anchor="middle">Potential outcome Y_i(1)</text><text x="284" y="166" class="body" text-anchor="start"><tspan x="284" dy="0">Outcome if treated</tspan><tspan x="284" dy="19">Observed when T_i=1</tspan><tspan x="284" dy="19">Counterfactual when T_i=0</tspan></text><rect x="540" y="112" width="230" height="210" class="box" fill="#dcfce7" stroke="#374151"/><text x="655" y="140" class="head" text-anchor="middle">Potential outcome Y_i(0)</text><text x="554" y="166" class="body" text-anchor="start"><tspan x="554" dy="0">Outcome if untreated</tspan><tspan x="554" dy="19">Observed when T_i=0</tspan><tspan x="554" dy="19">Counterfactual when T_i=1</tspan></text><rect x="810" y="112" width="150" height="210" class="box" fill="#fef3c7" stroke="#374151"/><text x="885" y="140" class="head" text-anchor="middle">Effect</text><text x="824" y="166" class="body" text-anchor="start"><tspan x="824" dy="0">Y_i(1)-Y_i(0)</tspan><tspan x="824" dy="19">Never jointly</tspan><tspan x="824" dy="19">observed</tspan></text><text x="500" y="358" class="head" text-anchor="middle">Causal inference reconstructs population contrasts, not both outcomes for one observed unit.</text>
</svg>
