<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
  <title id="title">Gradient boosting sequence</title><desc id="desc">Each weak tree fits the current negative gradient and is added with a learning rate to update the ensemble.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#495057"/></marker><style>.h{font:700 24px Arial,sans-serif;fill:#212529}.t{font:17px Arial,sans-serif;fill:#343a40}.s{font:15px Arial,sans-serif;fill:#495057}.box{fill:#fff;stroke:#868e96;stroke-width:2}.fit{fill:#ffe8cc;stroke:#e8590c;stroke-width:2}.update{fill:#e7f5ff;stroke:#1971c2;stroke-width:2}.line{stroke:#495057;stroke-width:2.5;fill:none;marker-end:url(#a)}</style></defs>
  <text x="600" y="38" text-anchor="middle" class="h">Gradient Boosting Learns by Sequential Error Correction</text>
  <rect x="35" y="100" width="205" height="120" rx="6" class="box"/><text x="137" y="138" text-anchor="middle" class="h">Initialize</text><text x="58" y="174" class="t">F0(x) = best constant</text><text x="58" y="202" class="s">mean or class log-odds</text>
  <path d="M240 160 H292" class="line"/>
  <rect x="302" y="82" width="245" height="156" rx="6" class="fit"/><text x="424" y="120" text-anchor="middle" class="h">Compute Signal</text><text x="326" y="158" class="t">r_im = - dL / dF(x_i)</text><text x="326" y="190" class="s">squared loss: y_i - F(x_i)</text><text x="326" y="218" class="s">other losses: pseudo-residual</text>
  <path d="M547 160 H599" class="line"/>
  <rect x="609" y="82" width="210" height="156" rx="6" class="fit"/><text x="714" y="120" text-anchor="middle" class="h">Fit Weak Tree</text><text x="632" y="160" class="t">h_m(x) approximates</text><text x="632" y="190" class="t">the negative gradient</text><text x="632" y="220" class="s">usually shallow</text>
  <path d="M819 160 H871" class="line"/>
  <rect x="881" y="82" width="284" height="156" rx="6" class="update"/><text x="1023" y="120" text-anchor="middle" class="h">Update Ensemble</text><text x="904" y="162" class="t">F_m(x) = F_{m-1}(x)</text><text x="956" y="190" class="t">+ eta * gamma_m h_m(x)</text><text x="904" y="220" class="s">small eta requires more stages</text>
  <path d="M1023 238 C1023 310 424 310 424 247" class="line"/>
  <text x="724" y="302" text-anchor="middle" class="s">repeat for m = 1, ..., M; each stage depends on the current ensemble</text>
  <rect x="110" y="360" width="430" height="155" rx="6" fill="#fff3bf" stroke="#f08c00" stroke-width="2"/><text x="325" y="398" text-anchor="middle" class="h">Bagging / Random Forest</text><text x="138" y="438" class="t">Trees are conditionally independent and parallel.</text><text x="138" y="472" class="t">Primary effect: variance reduction by averaging.</text>
  <rect x="660" y="360" width="430" height="155" rx="6" fill="#ffe8cc" stroke="#e8590c" stroke-width="2"/><text x="875" y="398" text-anchor="middle" class="h">Boosting</text><text x="688" y="438" class="t">Tree m depends on predictions from stages 1...m-1.</text><text x="688" y="472" class="t">Primary effect: iterative bias correction, regularized.</text>
  <text x="600" y="556" text-anchor="middle" class="s">Depth controls interaction order; learning rate, number of stages, subsampling, and early stopping control capacity.</text>
</svg>
