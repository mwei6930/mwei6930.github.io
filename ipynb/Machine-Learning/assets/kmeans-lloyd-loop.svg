<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Lloyd's algorithm for k-means</title>
  <desc id="desc">Initialization is followed by nearest-centroid assignment and centroid recomputation until assignments or inertia stabilize.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#495057"/></marker><style>.h{font:700 24px Arial,sans-serif;fill:#212529}.t{font:700 17px Arial,sans-serif;fill:#343a40}.s{font:15px Arial,sans-serif;fill:#495057}.box{stroke:#495057;stroke-width:2;rx:6}.line{stroke:#495057;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.p{fill:#adb5bd}.c1{fill:#4dabf7}.c2{fill:#ff8787}</style></defs>
  <text x="600" y="38" text-anchor="middle" class="h">Lloyd's Algorithm Alternates Two Exact Conditional Steps</text>
  <rect x="25" y="145" width="205" height="280" class="box" fill="#f8f9fa"/><text x="127" y="185" text-anchor="middle" class="t">Initialize K centers</text><g class="p"><circle cx="75" cy="270" r="8"/><circle cx="100" cy="240" r="8"/><circle cx="125" cy="280" r="8"/><circle cx="170" cy="320" r="8"/><circle cx="190" cy="285" r="8"/></g><path d="M80 320 l10 20 h-20 z" fill="#1864ab"/><path d="M180 220 l10 20 h-20 z" fill="#c92a2a"/><text x="127" y="390" text-anchor="middle" class="s">random or k-means++</text>
  <path d="M230 285 H300" class="line"/>
  <rect x="305" y="125" width="250" height="320" class="box" fill="#e7f5ff"/><text x="430" y="165" text-anchor="middle" class="t">Assignment step</text><g class="c1"><circle cx="360" cy="270" r="9"/><circle cx="390" cy="235" r="9"/><circle cx="410" cy="285" r="9"/></g><g class="c2"><circle cx="470" cy="320" r="9"/><circle cx="505" cy="285" r="9"/></g><path d="M380 320 l10 20 h-20 z" fill="#1864ab"/><path d="M490 220 l10 20 h-20 z" fill="#c92a2a"/><text x="430" y="385" text-anchor="middle" class="s">z_i = nearest centroid</text><text x="430" y="415" text-anchor="middle" class="s">Voronoi partition</text>
  <path d="M555 285 H625" class="line"/>
  <rect x="630" y="125" width="250" height="320" class="box" fill="#d3f9d8"/><text x="755" y="165" text-anchor="middle" class="t">Update step</text><g class="c1"><circle cx="685" cy="270" r="9"/><circle cx="715" cy="235" r="9"/><circle cx="735" cy="285" r="9"/></g><g class="c2"><circle cx="795" cy="320" r="9"/><circle cx="830" cy="285" r="9"/></g><path d="M712 250 l10 20 h-20 z" fill="#1864ab"/><path d="M812 292 l10 20 h-20 z" fill="#c92a2a"/><text x="755" y="385" text-anchor="middle" class="s">mu_k = mean of assigned points</text><text x="755" y="415" text-anchor="middle" class="s">inertia cannot increase</text>
  <path d="M880 285 H950" class="line"/>
  <rect x="955" y="170" width="220" height="230" class="box" fill="#fff3bf"/><text x="1065" y="220" text-anchor="middle" class="t">Converged?</text><text x="1065" y="265" text-anchor="middle" class="s">labels unchanged</text><text x="1065" y="300" text-anchor="middle" class="s">or center shift small</text><text x="1065" y="345" text-anchor="middle" class="s">otherwise repeat</text>
  <path d="M1065 400 C1065 520 430 520 430 445" class="line"/>
  <text x="600" y="580" text-anchor="middle" class="s">The objective decreases monotonically, but the final local optimum depends on initialization.</text>
</svg>
