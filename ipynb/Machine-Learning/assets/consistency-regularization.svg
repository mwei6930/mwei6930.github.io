<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Consistency regularization across valid perturbations</title><desc id="desc">A teacher predicts a weakly augmented view, a student predicts a stronger view, and a confidence-gated consistency loss updates the student.</desc>
<defs><marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#475569"/></marker>
<style>.title{font:700 26px Arial,sans-serif;fill:#17212b}.bh{font:700 19px Arial,sans-serif;fill:#17212b}.bt{font:15px Arial,sans-serif;fill:#334155}.small{font:14px Arial,sans-serif;fill:#526172}.arrow{stroke:#475569;stroke-width:3;marker-end:url(#arrowhead)}.node{stroke:#334155;stroke-width:2}</style></defs>
<rect width="1200" height="620" fill="#ffffff"/>
<text x="600" y="42" text-anchor="middle" class="title">Consistency regularization across valid perturbations</text>
<rect x="45" y="190" width="170" height="130" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="3"/><text x="130.0" y="228" text-anchor="middle" class="bh">Input x</text><text x="130.0" y="262" text-anchor="middle" class="bt">unlabeled sample</text><line x1="215" y1="225" x2="315" y2="150" class="arrow"/><line x1="215" y1="285" x2="315" y2="365" class="arrow"/><rect x="330" y="75" width="240" height="150" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="450.0" y="113" text-anchor="middle" class="bh">Weak view</text><text x="450.0" y="147" text-anchor="middle" class="bt">teacher target q</text><text x="450.0" y="174" text-anchor="middle" class="bt">stable semantics</text><rect x="330" y="315" width="240" height="150" rx="10" fill="#fff7ed" stroke="#e8590c" stroke-width="3"/><text x="450.0" y="353" text-anchor="middle" class="bh">Strong view</text><text x="450.0" y="387" text-anchor="middle" class="bt">student prediction p</text><text x="450.0" y="414" text-anchor="middle" class="bt">harder perturbation</text><line x1="570" y1="150" x2="720" y2="210" class="arrow"/><line x1="570" y1="390" x2="720" y2="315" class="arrow"/><rect x="735" y="180" width="220" height="185" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="3"/><text x="845.0" y="218" text-anchor="middle" class="bh">Consistency loss</text><text x="845.0" y="252" text-anchor="middle" class="bt">match q and p</text><text x="845.0" y="279" text-anchor="middle" class="bt">only above confidence tau</text><text x="845.0" y="306" text-anchor="middle" class="bt">stop-gradient on target</text><line x1="955" y1="270" x2="1045" y2="270" class="arrow"/><rect x="1060" y="190" width="105" height="160" rx="10" fill="#f3e8ff" stroke="#9333ea" stroke-width="3"/><text x="1112.5" y="228" text-anchor="middle" class="bh">Update</text><text x="1112.5" y="262" text-anchor="middle" class="bt">student</text><text x="1112.5" y="289" text-anchor="middle" class="bt">weights</text><rect x="330" y="505" width="625" height="75" rx="9" fill="#fee2e2" stroke="#e11d48" stroke-width="2"/><text x="642" y="535" text-anchor="middle" class="bh">Validity condition</text><text x="642" y="562" text-anchor="middle" class="bt">Both views must preserve the task label; otherwise consistency teaches a false invariance.</text></svg>