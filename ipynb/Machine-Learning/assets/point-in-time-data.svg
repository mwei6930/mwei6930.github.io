<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="405" viewBox="0 0 1000 405" role="img" aria-labelledby="title desc">
<title id="title">Training rows must reconstruct what was knowable at prediction time</title>
<desc id="desc">Point-in-time joins exclude future and label-derived feature values, including late-arriving events.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
  </marker>
</defs>
<style>
text { font-family: Arial, Helvetica, sans-serif; letter-spacing: 0; fill: #1f2937; }
.title { font-size: 25px; font-weight: 700; }
.subtitle { font-size: 14px; fill: #4b5563; }
.head { font-size: 16px; font-weight: 700; }
.body { font-size: 13px; }
.small { font-size: 12px; fill: #4b5563; }
.formula { font-family: "Courier New", monospace; font-size: 13px; }
.box { stroke-width: 1.4; rx: 7; }
.arrow { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#arrow); }
.dash { stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 7 5; fill: none; marker-end: url(#arrow); }
.line { stroke: #6b7280; stroke-width: 1.5; fill: none; }
</style>
<rect width="1000" height="405" fill="#ffffff"/>
<text x="40" y="42" class="title" text-anchor="start">Training rows must reconstruct what was knowable at prediction time</text>
<text x="40" y="68" class="subtitle" text-anchor="start">Point-in-time joins exclude future and label-derived feature values, including late-arriving events.</text>
<text x="50" y="118" class="head" text-anchor="start">Feature events</text><path d="M 180 112 L 930 112" class="line"/><circle cx="280" cy="112" r="7" fill="#2563eb"/><text x="280" y="95" class="small" text-anchor="middle">purchase</text><circle cx="480" cy="112" r="7" fill="#2563eb"/><text x="480" y="95" class="small" text-anchor="middle">support call</text><circle cx="690" cy="112" r="7" fill="#2563eb"/><text x="690" y="95" class="small" text-anchor="middle">late-arriving event</text><circle cx="850" cy="112" r="7" fill="#2563eb"/><text x="850" y="95" class="small" text-anchor="middle">future value</text><text x="50" y="215" class="head" text-anchor="start">Label row</text><path d="M 180 210 L 930 210" class="line"/><circle cx="610" cy="210" r="8" fill="#dc2626"/><text x="610" y="190" class="head" text-anchor="middle">prediction time t</text><path d="M 610 218 L 610 320" class="dash"/><rect x="195" y="275" width="355" height="82" class="box" fill="#dcfce7" stroke="#374151"/><text x="372" y="304" class="head" text-anchor="middle">Allowed training features</text><text x="209" y="331" class="body" text-anchor="start"><tspan x="209" dy="0">latest event timestamp &lt;= t</tspan><tspan x="209" dy="19">respect ingestion delay and entity key</tspan></text><rect x="665" y="275" width="275" height="82" class="box" fill="#fee2e2" stroke="#374151"/><text x="802" y="304" class="head" text-anchor="middle">Leakage</text><text x="679" y="331" class="body" text-anchor="start"><tspan x="679" dy="0">event timestamp &gt; t</tspan><tspan x="679" dy="19">label-derived or backfilled value</tspan></text><path d="M 550 316 L 665 316" class="arrow"/><text x="607" y="308" class="small" text-anchor="middle">boundary</text>
</svg>
