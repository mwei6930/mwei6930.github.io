<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660">
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L8 3z" fill="#334155"/></marker><style>.t{font:700 28px Arial,sans-serif;fill:#1f2937}.h{font:700 20px Arial,sans-serif;fill:#1f2937}.b{font:16px Arial,sans-serif;fill:#374151}.s{font:14px Arial,sans-serif;fill:#475569}.box{fill:#fff;stroke:#64748b;stroke-width:2}.ar{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="660" fill="#f8fafc"/><text x="600" y="42" text-anchor="middle" class="t">KKT conditions describe balance at a constrained optimum</text>
  <rect x="42" y="82" width="650" height="500" rx="8" class="box"/><text x="367" y="119" text-anchor="middle" class="h">Geometry of an active inequality constraint</text>
  <g transform="translate(82 170)"><path d="M40 330 Q185 60 500 88 L500 330 Z" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="381" y="308" class="b">feasible region</text><ellipse cx="160" cy="90" rx="200" ry="115" fill="none" stroke="#cbd5e1" stroke-width="3"/><ellipse cx="160" cy="90" rx="162" ry="92" fill="none" stroke="#94a3b8" stroke-width="3"/><ellipse cx="160" cy="90" rx="124" ry="69" fill="none" stroke="#64748b" stroke-width="3"/><circle cx="222" cy="161" r="10" fill="#ef4444"/><text x="238" y="151" class="b">optimum</text><path d="M222 161 L145 103" class="ar"/><text x="112" y="90" class="s">objective gradient</text><path d="M222 161 L299 219" class="ar"/><text x="307" y="237" class="s">constraint normal × multiplier</text><text x="290" y="361" text-anchor="middle" class="b">stationarity: forces cancel along feasible directions</text></g>
  <rect x="728" y="82" width="430" height="500" rx="8" class="box"/><text x="943" y="119" text-anchor="middle" class="h">Four KKT checks</text>
  <g transform="translate(770 157)"><rect width="346" height="62" rx="7" fill="#eef6ff" stroke="#2563eb" stroke-width="2"/><text x="18" y="26" class="b">1. Primal feasibility</text><text x="18" y="49" class="s">the parameters satisfy every constraint</text><rect y="82" width="346" height="62" rx="7" fill="#fff7ed" stroke="#d97706" stroke-width="2"/><text x="18" y="108" class="b">2. Dual feasibility</text><text x="18" y="131" class="s">inequality multipliers are non-negative</text><rect y="164" width="346" height="62" rx="7" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="18" y="190" class="b">3. Complementary slackness</text><text x="18" y="213" class="s">inactive constraint ⇒ zero multiplier</text><rect y="246" width="346" height="62" rx="7" fill="#fce7f3" stroke="#db2777" stroke-width="2"/><text x="18" y="272" class="b">4. Stationarity</text><text x="18" y="295" class="s">Lagrangian gradient is zero</text></g>
  <text x="943" y="507" text-anchor="middle" class="b">Convex + suitable regularity</text><text x="943" y="535" text-anchor="middle" class="s">KKT becomes necessary and sufficient.</text><text x="943" y="560" text-anchor="middle" class="s">Without convexity, it may identify only candidates.</text>
  <rect x="42" y="606" width="1116" height="38" rx="8" fill="#fff" stroke="#64748b"/><text x="600" y="632" text-anchor="middle" class="b">Weak duality gives a lower bound; strong duality closes the primal-dual gap.</text>
</svg>
