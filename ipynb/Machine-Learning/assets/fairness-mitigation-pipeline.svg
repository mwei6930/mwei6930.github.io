<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="title desc">
<title id="title">Fairness interventions can enter at three stages</title>
<desc id="desc">Pre-processing changes training data, in-processing changes learning, and post-processing changes decisions.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
  </marker>
</defs>
<style>
text { font-family: Arial, Helvetica, sans-serif; letter-spacing: 0; fill: #1f2937; }
.title { font-size: 25px; font-weight: 700; }
.subtitle { font-size: 14px; fill: #4b5563; }
.head { font-size: 16px; font-weight: 700; }
.body { font-size: 13px; }
.small { font-size: 12px; fill: #4b5563; }
.formula { font-family: "Courier New", monospace; font-size: 13px; }
.box { stroke-width: 1.4; rx: 7; }
.arrow { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#arrow); }
.dash { stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 7 5; fill: none; marker-end: url(#arrow); }
.axis { stroke: #6b7280; stroke-width: 1.3; fill: none; }
</style>
<rect width="1000" height="400" fill="#ffffff"/>
<text x="40" y="42" class="title" text-anchor="start">Fairness interventions can enter at three stages</text>
<text x="40" y="68" class="subtitle" text-anchor="start">Pre-processing changes training data, in-processing changes learning, and post-processing changes decisions.</text>
<rect x="45" y="120" width="250" height="190" class="box" fill="#dbeafe" stroke="#374151"/><text x="170" y="149" class="head" text-anchor="middle">Pre-processing</text><text x="59" y="176" class="body" text-anchor="start"><tspan x="59" dy="0">Change data or labels</tspan><tspan x="59" dy="19">Reweight or resample</tspan><tspan x="59" dy="19">Repair representation</tspan></text><path d="M 295 215 L 375 215" class="arrow"/><rect x="375" y="120" width="250" height="190" class="box" fill="#dcfce7" stroke="#374151"/><text x="500" y="149" class="head" text-anchor="middle">In-processing</text><text x="389" y="176" class="body" text-anchor="start"><tspan x="389" dy="0">Constrained objective</tspan><tspan x="389" dy="19">Adversarial debiasing</tspan><tspan x="389" dy="19">Group-aware regularizer</tspan></text><path d="M 625 215 L 705 215" class="arrow"/><rect x="705" y="120" width="250" height="190" class="box" fill="#fef3c7" stroke="#374151"/><text x="830" y="149" class="head" text-anchor="middle">Post-processing</text><text x="719" y="176" class="body" text-anchor="start"><tspan x="719" dy="0">Threshold or randomize</tspan><tspan x="719" dy="19">Uses validation labels</tspan><tspan x="719" dy="19">May need group at decision time</tspan></text><text x="500" y="352" class="head" text-anchor="middle">Mitigation changes a measurable constraint; it does not settle the underlying policy question.</text>
</svg>
