<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
<title id="title">Bandit feedback hides unchosen outcomes</title>
<desc id="desc">Only the reward of the selected arm is observed, so learning and reward collection compete.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
  </marker>
</defs>
<style>
text { font-family: Arial, Helvetica, sans-serif; letter-spacing: 0; fill: #1f2937; }
.title { font-size: 25px; font-weight: 700; }
.subtitle { font-size: 14px; fill: #4b5563; }
.head { font-size: 16px; font-weight: 700; }
.body { font-size: 13px; }
.small { font-size: 12px; fill: #4b5563; }
.formula { font-family: "Courier New", monospace; font-size: 13px; }
.box { stroke: #374151; stroke-width: 1.4; rx: 8; }
.soft { stroke: #9ca3af; stroke-width: 1.2; rx: 8; }
.arrow { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#arrow); }
.dash { stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 7 5; fill: none; marker-end: url(#arrow); }
</style>
<rect width="1000" height="360" fill="#ffffff"/>
<text x="40" y="42" class="title" text-anchor="start">Bandit feedback hides unchosen outcomes</text>
<text x="40" y="67" class="subtitle" text-anchor="start">Only the reward of the selected arm is observed, so learning and reward collection compete.</text>
<rect x="40" y="105" width="230" height="200" class="box" fill="#dbeafe" stroke="#374151"/><text x="155" y="132" class="head" text-anchor="middle">Full information</text><text x="54" y="158" class="body" text-anchor="start"><tspan x="54" dy="0">Choose a_t</tspan><tspan x="54" dy="19">Observe every arm loss</tspan><tspan x="54" dy="19">Can update all actions</tspan></text><rect x="385" y="105" width="230" height="200" class="box" fill="#fef3c7" stroke="#374151"/><text x="500" y="132" class="head" text-anchor="middle">Bandit feedback</text><text x="399" y="158" class="body" text-anchor="start"><tspan x="399" dy="0">Choose a_t</tspan><tspan x="399" dy="19">Observe r_t(a_t) only</tspan><tspan x="399" dy="19">Counterfactuals hidden</tspan></text><rect x="730" y="105" width="230" height="200" class="box" fill="#fee2e2" stroke="#374151"/><text x="845" y="132" class="head" text-anchor="middle">Core tension</text><text x="744" y="158" class="body" text-anchor="start"><tspan x="744" dy="0">Exploit high mean</tspan><tspan x="744" dy="19">Explore uncertainty</tspan><tspan x="744" dy="19">Minimize regret</tspan></text><path d="M 270 205 L 385 205" class="arrow"/><text x="327" y="197" class="small" text-anchor="middle">less feedback</text><path d="M 615 205 L 730 205" class="arrow"/><text x="672" y="197" class="small" text-anchor="middle">must explore</text>
</svg>
