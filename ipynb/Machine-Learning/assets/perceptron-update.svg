<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Perceptron update after a mistake</title>
  <desc id="desc">A misclassified positive point adds a multiple of its feature vector to the weight vector, rotating the decision boundary toward a correct classification.</desc>
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/></marker>
    <marker id="arrowDark" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <style>.title{font:700 28px Arial,sans-serif;fill:#0f172a}.head{font:700 19px Arial,sans-serif;fill:#0f172a}.body{font:15px Arial,sans-serif;fill:#1e293b}.small{font:13px Arial,sans-serif;fill:#475569}.axis{stroke:#64748b;stroke-width:1.5}</style>
  </defs>
  <rect width="1200" height="650" fill="#f8fafc"/>
  <text x="600" y="43" text-anchor="middle" class="title">The Perceptron changes its boundary only after a mistake</text>

  <rect x="50" y="85" width="440" height="390" rx="8" fill="#fff" stroke="#64748b"/>
  <text x="270" y="120" text-anchor="middle" class="head">Before the update</text>
  <line x1="105" y1="405" x2="435" y2="405" class="axis"/><line x1="105" y1="405" x2="105" y2="155" class="axis"/>
  <line x1="145" y1="165" x2="395" y2="400" stroke="#334155" stroke-width="4"/>
  <text x="330" y="180" class="small">f(x) = w^T x + b = 0</text>
  <g fill="#93c5fd" stroke="#2563eb"><circle cx="170" cy="210" r="9"/><circle cx="210" cy="250" r="9"/><circle cx="245" cy="200" r="9"/></g>
  <g fill="#fdba74" stroke="#ea580c"><circle cx="325" cy="330" r="9"/><circle cx="365" cy="360" r="9"/></g>
  <circle cx="300" cy="240" r="13" fill="#dc2626" stroke="#991b1b" stroke-width="2"/>
  <text x="318" y="232" class="small" fill="#991b1b">positive point x</text>
  <text x="318" y="251" class="small" fill="#991b1b">has y f(x) &lt;= 0</text>
  <line x1="270" y1="350" x2="210" y2="290" stroke="#2563eb" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <text x="185" y="335" class="small">old w</text>

  <line x1="490" y1="280" x2="690" y2="280" stroke="#334155" stroke-width="4" marker-end="url(#arrowDark)"/>
  <rect x="510" y="160" width="165" height="84" rx="7" fill="#fef2f2" stroke="#dc2626"/>
  <text x="592" y="190" text-anchor="middle" class="head">Mistake</text>
  <text x="592" y="217" text-anchor="middle" class="body">update once</text>
  <text x="592" y="325" text-anchor="middle" class="body">w &lt;- w + eta y x</text>
  <text x="592" y="353" text-anchor="middle" class="body">b &lt;- b + eta y</text>
  <text x="592" y="385" text-anchor="middle" class="small">positive: move toward x</text>
  <text x="592" y="407" text-anchor="middle" class="small">negative: move away from x</text>

  <rect x="710" y="85" width="440" height="390" rx="8" fill="#fff" stroke="#64748b"/>
  <text x="930" y="120" text-anchor="middle" class="head">After the update</text>
  <line x1="765" y1="405" x2="1095" y2="405" class="axis"/><line x1="765" y1="405" x2="765" y2="155" class="axis"/>
  <line x1="830" y1="165" x2="1035" y2="410" stroke="#16a34a" stroke-width="4"/>
  <g fill="#93c5fd" stroke="#2563eb"><circle cx="830" cy="210" r="9"/><circle cx="870" cy="250" r="9"/><circle cx="905" cy="200" r="9"/></g>
  <g fill="#fdba74" stroke="#ea580c"><circle cx="985" cy="330" r="9"/><circle cx="1025" cy="360" r="9"/></g>
  <circle cx="960" cy="240" r="13" fill="#dc2626" stroke="#991b1b" stroke-width="2"/>
  <line x1="930" y1="350" x2="885" y2="270" stroke="#2563eb" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <line x1="930" y1="350" x2="952" y2="260" stroke="#dc2626" stroke-width="3" marker-end="url(#arrowRed)"/>
  <text x="800" y="330" class="small">new w</text>
  <text x="975" y="278" class="small" fill="#991b1b">eta y x</text>

  <rect x="130" y="515" width="940" height="86" rx="7" fill="#ecfeff" stroke="#0f766e"/>
  <text x="600" y="547" text-anchor="middle" class="head">What the update guarantees</text>
  <text x="600" y="575" text-anchor="middle" class="body">If a positive-margin separator exists, repeated mistake-driven updates converge after finitely many mistakes.</text>
  <text x="600" y="596" text-anchor="middle" class="small">It does not maximize the margin, estimate probabilities, or converge on permanently nonseparable data without a stopping rule.</text>
</svg>
