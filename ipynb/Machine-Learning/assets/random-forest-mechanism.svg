<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Random forest mechanism</title><desc id="desc">Bootstrap samples and random feature subsets produce diverse trees whose predictions are aggregated, while omitted observations support out-of-bag evaluation.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#495057"/></marker><style>.h{font:700 24px Arial,sans-serif;fill:#212529}.t{font:17px Arial,sans-serif;fill:#343a40}.s{font:15px Arial,sans-serif;fill:#495057}.box{fill:#fff;stroke:#868e96;stroke-width:2}.line{stroke:#495057;stroke-width:2.5;fill:none;marker-end:url(#a)}.row{fill:#d0ebff;stroke:#1971c2}.oob{fill:#ffe3e3;stroke:#c92a2a}.tree{fill:#d3f9d8;stroke:#2b8a3e}</style></defs>
  <text x="600" y="38" text-anchor="middle" class="h">Random Forest: Two Sources of Randomness</text>
  <rect x="35" y="90" width="210" height="390" rx="6" class="box"/><text x="140" y="124" text-anchor="middle" class="h">Training Data</text>
  <g class="row"><rect x="75" y="155" width="130" height="38" rx="4"/><rect x="75" y="202" width="130" height="38" rx="4"/><rect x="75" y="249" width="130" height="38" rx="4"/><rect x="75" y="296" width="130" height="38" rx="4"/><rect x="75" y="343" width="130" height="38" rx="4"/><rect x="75" y="390" width="130" height="38" rx="4"/></g>
  <text x="140" y="180" text-anchor="middle" class="s">case 1</text><text x="140" y="227" text-anchor="middle" class="s">case 2</text><text x="140" y="274" text-anchor="middle" class="s">case 3</text><text x="140" y="321" text-anchor="middle" class="s">case 4</text><text x="140" y="368" text-anchor="middle" class="s">case 5</text><text x="140" y="415" text-anchor="middle" class="s">case 6</text>
  <path d="M245 180 C285 180 285 145 330 145" class="line"/><path d="M245 285 H330" class="line"/><path d="M245 395 C285 395 285 430 330 430" class="line"/>
  <g><rect x="340" y="82" width="215" height="130" rx="6" fill="#fff3bf" stroke="#f08c00" stroke-width="2"/><rect x="340" y="222" width="215" height="130" rx="6" fill="#fff3bf" stroke="#f08c00" stroke-width="2"/><rect x="340" y="362" width="215" height="130" rx="6" fill="#fff3bf" stroke="#f08c00" stroke-width="2"/></g>
  <text x="447" y="112" text-anchor="middle" class="h">Bootstrap 1</text><text x="447" y="252" text-anchor="middle" class="h">Bootstrap 2</text><text x="447" y="392" text-anchor="middle" class="h">Bootstrap B</text>
  <text x="365" y="145" class="s">sample rows with replacement</text><text x="365" y="173" class="s">some cases omitted (OOB)</text><text x="365" y="285" class="s">duplicates are allowed</text><text x="365" y="313" class="s">about 63.2% unique cases</text><text x="365" y="425" class="s">new random sample</text><text x="365" y="453" class="s">new OOB set</text>
  <path d="M555 145 H625" class="line"/><path d="M555 285 H625" class="line"/><path d="M555 430 H625" class="line"/>
  <g class="tree"><rect x="635" y="82" width="215" height="130" rx="6"/><rect x="635" y="222" width="215" height="130" rx="6"/><rect x="635" y="362" width="215" height="130" rx="6"/></g>
  <text x="742" y="112" text-anchor="middle" class="h">Tree 1</text><text x="742" y="252" text-anchor="middle" class="h">Tree 2</text><text x="742" y="392" text-anchor="middle" class="h">Tree B</text>
  <text x="657" y="146" class="s">at each node, consider</text><text x="657" y="174" class="s">a random feature subset</text><text x="657" y="286" class="s">different rows + features</text><text x="657" y="314" class="s">decorrelate the trees</text><text x="657" y="426" class="s">grow deeply; do not prune</text>
  <path d="M850 145 C900 145 900 245 948 245" class="line"/><path d="M850 285 H948" class="line"/><path d="M850 430 C900 430 900 325 948 325" class="line"/>
  <rect x="958" y="215" width="210" height="150" rx="6" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><text x="1063" y="252" text-anchor="middle" class="h">Aggregate</text><text x="980" y="289" class="t">classification: vote</text><text x="980" y="321" class="t">regression: average</text>
  <rect x="340" y="525" width="828" height="60" rx="6" class="oob"/><text x="754" y="552" text-anchor="middle" class="t">OOB prediction for case i uses only trees whose bootstrap sample omitted case i</text><text x="754" y="576" text-anchor="middle" class="s">This gives an internal validation estimate, but does not replace a final untouched test set.</text>
</svg>
