<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <defs><style>.t{font:700 28px Arial,sans-serif;fill:#1f2937}.h{font:700 20px Arial,sans-serif;fill:#1f2937}.b{font:16px Arial,sans-serif;fill:#374151}.s{font:14px Arial,sans-serif;fill:#475569}.box{fill:#fff;stroke:#64748b;stroke-width:2}.axis{stroke:#334155;stroke-width:3;fill:none}</style></defs>
  <rect width="1200" height="650" fill="#f8fafc"/><text x="600" y="42" text-anchor="middle" class="t">Convexity changes what an optimizer can guarantee</text>
  <rect x="42" y="80" width="536" height="500" rx="8" class="box"/><text x="310" y="116" text-anchor="middle" class="h">Convex objective</text>
  <g transform="translate(82 160)"><path d="M25 335V10M25 335H445" class="axis"/><path d="M55 62 C130 292 225 312 408 58" fill="none" stroke="#2563eb" stroke-width="6"/><line x1="91" y1="135" x2="359" y2="135" stroke="#d97706" stroke-width="3" stroke-dasharray="8 6"/><circle cx="91" cy="135" r="7" fill="#d97706"/><circle cx="359" cy="135" r="7" fill="#d97706"/><circle cx="228" cy="301" r="9" fill="#ef4444"/><text x="228" y="326" text-anchor="middle" class="s">local = global minimum</text><text x="225" y="112" text-anchor="middle" class="s">line segment lies above the graph</text></g>
  <text x="310" y="548" text-anchor="middle" class="b">Every local minimum is global.</text><text x="310" y="572" text-anchor="middle" class="s">Strict or strong convexity adds uniqueness and rates.</text>
  <rect x="622" y="80" width="536" height="500" rx="8" class="box"/><text x="890" y="116" text-anchor="middle" class="h">Non-convex objective</text>
  <g transform="translate(662 160)"><path d="M25 335V10M25 335H445" class="axis"/><path d="M45 92 C85 30 125 286 185 205 C230 144 250 320 307 239 C349 179 373 70 426 110" fill="none" stroke="#7c3aed" stroke-width="6"/><circle cx="143" cy="239" r="9" fill="#d97706"/><text x="143" y="266" text-anchor="middle" class="s">local minimum</text><circle cx="276" cy="273" r="9" fill="#ef4444"/><text x="276" y="302" text-anchor="middle" class="s">deeper minimum</text><circle cx="215" cy="176" r="9" fill="#16a34a"/><text x="215" y="154" text-anchor="middle" class="s">saddle / flat region</text></g>
  <text x="890" y="548" text-anchor="middle" class="b">Initialization and optimization path can matter.</text><text x="890" y="572" text-anchor="middle" class="s">A stationary point need not be globally optimal.</text>
</svg>
