<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc">
<title id="title">Contextual bandits personalize one-step decisions</title>
<desc id="desc">The learner sees context before choosing but still observes only the selected action&#x27;s reward.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
  </marker>
</defs>
<style>
text { font-family: Arial, Helvetica, sans-serif; letter-spacing: 0; fill: #1f2937; }
.title { font-size: 25px; font-weight: 700; }
.subtitle { font-size: 14px; fill: #4b5563; }
.head { font-size: 16px; font-weight: 700; }
.body { font-size: 13px; }
.small { font-size: 12px; fill: #4b5563; }
.formula { font-family: "Courier New", monospace; font-size: 13px; }
.box { stroke: #374151; stroke-width: 1.4; rx: 8; }
.soft { stroke: #9ca3af; stroke-width: 1.2; rx: 8; }
.arrow { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#arrow); }
.dash { stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 7 5; fill: none; marker-end: url(#arrow); }
</style>
<rect width="1000" height="390" fill="#ffffff"/>
<text x="40" y="42" class="title" text-anchor="start">Contextual bandits personalize one-step decisions</text>
<text x="40" y="67" class="subtitle" text-anchor="start">The learner sees context before choosing but still observes only the selected action&#x27;s reward.</text>
<rect x="40" y="125" width="190" height="110" class="box" fill="#dbeafe" stroke="#374151"/><text x="135" y="152" class="head" text-anchor="middle">Context x_t</text><text x="54" y="178" class="body" text-anchor="start"><tspan x="54" dy="0">user, query,</tspan><tspan x="54" dy="19">device, time</tspan></text><path d="M 230 180 L 315 180" class="arrow"/><rect x="315" y="125" width="200" height="110" class="box" fill="#dcfce7" stroke="#374151"/><text x="415" y="152" class="head" text-anchor="middle">Policy π(a|x)</text><text x="329" y="178" class="body" text-anchor="start"><tspan x="329" dy="0">score available actions</tspan><tspan x="329" dy="19">include uncertainty</tspan></text><path d="M 515 180 L 600 180" class="arrow"/><rect x="600" y="125" width="160" height="110" class="box" fill="#fef3c7" stroke="#374151"/><text x="680" y="152" class="head" text-anchor="middle">Choose a_t</text><text x="614" y="178" class="body" text-anchor="start"><tspan x="614" dy="0">one intervention</tspan></text><path d="M 760 180 L 835 180" class="arrow"/><rect x="835" y="125" width="125" height="110" class="box" fill="#fee2e2" stroke="#374151"/><text x="897" y="152" class="head" text-anchor="middle">Observe</text><text x="849" y="178" class="body" text-anchor="start"><tspan x="849" dy="0">r_t(a_t)</tspan><tspan x="849" dy="19">only</tspan></text><path d="M 895 235 L 415 285" class="dash"/><text x="655" y="252" class="small" text-anchor="middle">update chosen action model</text><text x="500" y="335" class="head" text-anchor="middle">Context changes which action is best; it does not create a long-term state transition.</text>
</svg>
