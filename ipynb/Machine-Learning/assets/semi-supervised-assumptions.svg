<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Assumptions that allow unlabeled data to help</title><desc id="desc">Panels illustrate low-density separation, smooth label changes, and a lower-dimensional data manifold.</desc>
<defs><marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#475569"/></marker>
<style>.title{font:700 26px Arial,sans-serif;fill:#17212b}.bh{font:700 19px Arial,sans-serif;fill:#17212b}.bt{font:15px Arial,sans-serif;fill:#334155}.small{font:14px Arial,sans-serif;fill:#526172}.arrow{stroke:#475569;stroke-width:3;marker-end:url(#arrowhead)}.node{stroke:#334155;stroke-width:2}</style></defs>
<rect width="1200" height="630" fill="#ffffff"/>
<text x="600" y="42" text-anchor="middle" class="title">Assumptions that allow unlabeled data to help</text>
<rect x="35" y="90" width="350" height="420" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="210.0" y="128" text-anchor="middle" class="bh">Cluster / low-density</text><text x="210.0" y="162" text-anchor="middle" class="bt">boundary should avoid</text><text x="210.0" y="189" text-anchor="middle" class="bt">dense regions</text><circle cx="105" cy="220" r="13" fill="#2563eb"/><circle cx="145" cy="190" r="10" fill="#2563eb"/><circle cx="165" cy="245" r="11" fill="#2563eb"/><circle cx="225" cy="360" r="12" fill="#e11d48"/><circle cx="270" cy="325" r="10" fill="#e11d48"/><circle cx="310" cy="375" r="13" fill="#e11d48"/><path d="M70 405 C165 325 190 255 340 135" fill="none" stroke="#475569" stroke-width="4" stroke-dasharray="10 8"/><rect x="425" y="90" width="350" height="420" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="3"/><text x="600.0" y="128" text-anchor="middle" class="bh">Smoothness</text><text x="600.0" y="162" text-anchor="middle" class="bt">nearby points should have</text><text x="600.0" y="189" text-anchor="middle" class="bt">similar conditional labels</text><path d="M470 385 C530 180 610 170 730 360" fill="none" stroke="#16a34a" stroke-width="5"/><circle cx="505" cy="300" r="12" fill="#2563eb"/><circle cx="540" cy="235" r="12" fill="#2563eb"/><circle cx="650" cy="235" r="12" fill="#e11d48"/><circle cx="700" cy="310" r="12" fill="#e11d48"/><text x="600" y="445" text-anchor="middle" class="small">small move in x -> small move in p(y|x)</text><rect x="815" y="90" width="350" height="420" rx="10" fill="#fff7ed" stroke="#e8590c" stroke-width="3"/><text x="990.0" y="128" text-anchor="middle" class="bh">Manifold</text><text x="990.0" y="162" text-anchor="middle" class="bt">high-dimensional samples</text><text x="990.0" y="189" text-anchor="middle" class="bt">lie near lower-dimensional structure</text><path d="M865 370 C890 150 1055 125 1115 330 C1140 415 1000 445 920 310 C875 235 995 180 1080 245" fill="none" stroke="#e8590c" stroke-width="14" opacity="0.28"/><path d="M865 370 C890 150 1055 125 1115 330 C1140 415 1000 445 920 310 C875 235 995 180 1080 245" fill="none" stroke="#e8590c" stroke-width="3"/><circle cx="895" cy="270" r="9" fill="#2563eb"/><circle cx="1010" cy="180" r="9" fill="#2563eb"/><circle cx="1105" cy="300" r="9" fill="#e11d48"/><circle cx="970" cy="380" r="9" fill="#e11d48"/><text x="600" y="565" text-anchor="middle" class="bh">Unlabeled data help only when their structure aligns with the target.</text><text x="600" y="596" text-anchor="middle" class="small">A bridge of ambiguous samples, covariate shift, or a target boundary through a dense region can make the assumptions fail.</text></svg>