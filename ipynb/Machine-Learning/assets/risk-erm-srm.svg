<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#34495e"/>
    </marker>
    <style>
      .title{font:700 28px Arial,sans-serif;fill:#1f2937}.head{font:700 20px Arial,sans-serif;fill:#1f2937}.body{font:16px Arial,sans-serif;fill:#374151}.small{font:14px Arial,sans-serif;fill:#4b5563}.math{font:italic 18px Georgia,serif;fill:#111827}.box{fill:#fff;stroke:#64748b;stroke-width:2}.arrow{stroke:#34495e;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="680" fill="#f8fafc"/>
  <text x="600" y="42" text-anchor="middle" class="title">From an unknown population to a learned hypothesis</text>

  <rect x="42" y="86" width="205" height="170" rx="8" class="box" fill="#eef6ff"/>
  <text x="145" y="118" text-anchor="middle" class="head">Population P</text>
  <circle cx="92" cy="164" r="10" fill="#2563eb"/><circle cx="130" cy="194" r="10" fill="#ef4444"/>
  <circle cx="177" cy="151" r="10" fill="#2563eb"/><circle cx="211" cy="208" r="10" fill="#ef4444"/>
  <circle cx="151" cy="228" r="8" fill="#16a34a"/><circle cx="69" cy="220" r="8" fill="#16a34a"/>
  <text x="145" y="280" text-anchor="middle" class="small">future examples are hidden</text>

  <path d="M247 170 H320" class="arrow"/>
  <text x="283" y="151" text-anchor="middle" class="small">sample i.i.d.</text>

  <rect x="322" y="86" width="220" height="170" rx="8" class="box" fill="#f0fdf4"/>
  <text x="432" y="118" text-anchor="middle" class="head">Training sample S</text>
  <text x="432" y="151" text-anchor="middle" class="math">S = {(xᵢ, yᵢ) : i = 1, ..., n}</text>
  <line x1="365" y1="177" x2="499" y2="177" stroke="#9ca3af"/>
  <text x="375" y="202" class="body">x₁</text><text x="470" y="202" class="body">y₁</text>
  <text x="375" y="228" class="body">⋮</text><text x="470" y="228" class="body">⋮</text>
  <text x="375" y="252" class="body">xₙ</text><text x="470" y="252" class="body">yₙ</text>

  <path d="M542 170 H615" class="arrow"/>
  <text x="579" y="151" text-anchor="middle" class="small">evaluate</text>

  <rect x="617" y="72" width="260" height="198" rx="8" class="box" fill="#fff7ed"/>
  <text x="747" y="106" text-anchor="middle" class="head">Hypothesis space H</text>
  <path d="M652 222 Q684 114 716 214" stroke="#2563eb" stroke-width="3" fill="none"/>
  <path d="M690 220 Q744 142 807 221" stroke="#16a34a" stroke-width="3" fill="none"/>
  <path d="M719 224 C752 114 801 252 847 150" stroke="#ef4444" stroke-width="3" fill="none"/>
  <text x="747" y="252" text-anchor="middle" class="small">candidate rules h ∈ H</text>

  <path d="M877 170 H950" class="arrow"/>
  <text x="914" y="151" text-anchor="middle" class="small">minimize</text>

  <rect x="952" y="86" width="206" height="170" rx="8" class="box" fill="#fdf2f8"/>
  <text x="1055" y="118" text-anchor="middle" class="head">ERM choice</text>
  <text x="1055" y="157" text-anchor="middle" class="math">minimum sample risk</text>
  <text x="1055" y="196" text-anchor="middle" class="body">best measured fit</text>
  <text x="1055" y="222" text-anchor="middle" class="small">on this finite sample</text>

  <rect x="42" y="324" width="530" height="134" rx="8" class="box"/>
  <text x="62" y="356" class="head">Two risks, one observable</text>
  <text x="62" y="392" class="math">Population risk: expected loss over P</text>
  <text x="62" y="428" class="math">Empirical risk: average loss over S</text>

  <rect x="596" y="324" width="562" height="134" rx="8" class="box"/>
  <text x="616" y="356" class="head">Generalization gap</text>
  <text x="616" y="397" class="math">gap = population risk − empirical risk</text>
  <line x1="825" y1="427" x2="1098" y2="427" stroke="#cbd5e1" stroke-width="12" stroke-linecap="round"/>
  <circle cx="882" cy="427" r="10" fill="#2563eb"/><circle cx="1013" cy="427" r="10" fill="#ef4444"/>
  <text x="882" y="452" text-anchor="middle" class="small">empirical</text><text x="1013" y="452" text-anchor="middle" class="small">population</text>

  <rect x="42" y="500" width="1116" height="136" rx="8" class="box" fill="#ffffff"/>
  <text x="62" y="534" class="head">Structural risk minimization (SRM)</text>
  <ellipse cx="260" cy="580" rx="145" ry="40" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <ellipse cx="260" cy="580" rx="97" ry="29" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <ellipse cx="260" cy="580" rx="52" ry="18" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="260" y="585" text-anchor="middle" class="body">H₁ ⊂ H₂ ⊂ H₃</text>
  <text x="493" y="573" class="math">choose h to balance</text>
  <text x="493" y="607" class="math">empirical risk + capacity penalty</text>
  <path d="M420 580 H468" class="arrow"/>
  <text x="915" y="577" text-anchor="middle" class="body">fit improves →</text>
  <text x="915" y="608" text-anchor="middle" class="body">estimation uncertainty may grow →</text>
</svg>
