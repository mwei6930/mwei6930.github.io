<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc">
<title id="title">Evaluation and safety are part of the learning problem</title>
<desc id="desc">A policy should pass overlap, uncertainty, constraint, and staged-deployment checks before broad use.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
  </marker>
</defs>
<style>
text { font-family: Arial, Helvetica, sans-serif; letter-spacing: 0; fill: #1f2937; }
.title { font-size: 25px; font-weight: 700; }
.subtitle { font-size: 14px; fill: #4b5563; }
.head { font-size: 16px; font-weight: 700; }
.body { font-size: 13px; }
.small { font-size: 12px; fill: #4b5563; }
.formula { font-family: "Courier New", monospace; font-size: 13px; }
.box { stroke: #374151; stroke-width: 1.4; rx: 8; }
.soft { stroke: #9ca3af; stroke-width: 1.2; rx: 8; }
.arrow { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#arrow); }
.dash { stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 7 5; fill: none; marker-end: url(#arrow); }
</style>
<rect width="1000" height="390" fill="#ffffff"/>
<text x="40" y="42" class="title" text-anchor="start">Evaluation and safety are part of the learning problem</text>
<text x="40" y="67" class="subtitle" text-anchor="start">A policy should pass overlap, uncertainty, constraint, and staged-deployment checks before broad use.</text>
<rect x="35" y="105" width="205" height="225" class="box" fill="#dbeafe" stroke="#374151"/><text x="137" y="132" class="head" text-anchor="middle">Logged data</text><text x="49" y="158" class="body" text-anchor="start"><tspan x="49" dy="0">context x</tspan><tspan x="49" dy="19">action a</tspan><tspan x="49" dy="19">reward r</tspan><tspan x="49" dy="19">propensity b(a|x)</tspan></text><rect x="285" y="105" width="205" height="225" class="box" fill="#fef3c7" stroke="#374151"/><text x="387" y="132" class="head" text-anchor="middle">OPE diagnostics</text><text x="299" y="158" class="body" text-anchor="start"><tspan x="299" dy="0">support overlap</tspan><tspan x="299" dy="19">importance weights</tspan><tspan x="299" dy="19">effective sample size</tspan><tspan x="299" dy="19">uncertainty</tspan></text><rect x="535" y="105" width="205" height="225" class="box" fill="#fee2e2" stroke="#374151"/><text x="637" y="132" class="head" text-anchor="middle">Safety constraints</text><text x="549" y="158" class="body" text-anchor="start"><tspan x="549" dy="0">cost budgets</tspan><tspan x="549" dy="19">forbidden states</tspan><tspan x="549" dy="19">human override</tspan><tspan x="549" dy="19">rollback</tspan></text><rect x="785" y="105" width="180" height="225" class="box" fill="#dcfce7" stroke="#374151"/><text x="875" y="132" class="head" text-anchor="middle">Deployment gate</text><text x="799" y="158" class="body" text-anchor="start"><tspan x="799" dy="0">lower confidence bound</tspan><tspan x="799" dy="19">offline tests</tspan><tspan x="799" dy="19">limited rollout</tspan><tspan x="799" dy="19">monitor drift</tspan></text><path d="M 240 218 L 285 218" class="arrow"/><path d="M 490 218 L 535 218" class="arrow"/><path d="M 740 218 L 785 218" class="arrow"/>
</svg>
