<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
  <title id="title">Comparison of an HMM and a linear chain CRF</title>
  <desc id="desc">The HMM directs hidden states through transitions and emissions, while a CRF conditions on the whole input sequence and connects neighboring output labels with globally normalized scores.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#495057"/></marker><style>.panel{stroke:#495057;stroke-width:2}.state{fill:#e7f5ff;stroke:#343a40;stroke-width:2}.obs{fill:#ffe8cc;stroke:#343a40;stroke-width:2}.h{font:700 23px Arial,sans-serif;fill:#212529}.t{font:17px Arial,sans-serif;fill:#343a40}.s{font:15px Arial,sans-serif;fill:#495057}.arr{stroke:#495057;stroke-width:2.5;fill:none;marker-end:url(#a)}.edge{stroke:#495057;stroke-width:3}</style></defs>
  <text x="600" y="38" text-anchor="middle" class="h">Generative Sequence Model vs Conditional Sequence Model</text>
  <rect x="35" y="75" width="545" height="420" rx="6" class="panel" fill="#f8f9fa"/><rect x="620" y="75" width="545" height="420" rx="6" class="panel" fill="#f8f9fa"/>
  <text x="307" y="115" text-anchor="middle" class="h">HMM: model p(x, y)</text><text x="892" y="115" text-anchor="middle" class="h">Linear-chain CRF: model p(y | x)</text>
  <g><circle cx="145" cy="220" r="30" class="state"/><circle cx="305" cy="220" r="30" class="state"/><circle cx="465" cy="220" r="30" class="state"/><circle cx="145" cy="350" r="28" class="obs"/><circle cx="305" cy="350" r="28" class="obs"/><circle cx="465" cy="350" r="28" class="obs"/><text x="145" y="227" text-anchor="middle" class="h">Y1</text><text x="305" y="227" text-anchor="middle" class="h">Y2</text><text x="465" y="227" text-anchor="middle" class="h">Y3</text><text x="145" y="357" text-anchor="middle" class="h">X1</text><text x="305" y="357" text-anchor="middle" class="h">X2</text><text x="465" y="357" text-anchor="middle" class="h">X3</text><path d="M175 220 H267 M335 220 H427 M145 250 V312 M305 250 V312 M465 250 V312" class="arr"/></g>
  <text x="307" y="435" text-anchor="middle" class="s">Requires an emission model for observations</text>
  <g><circle cx="730" cy="220" r="30" class="state"/><circle cx="892" cy="220" r="30" class="state"/><circle cx="1054" cy="220" r="30" class="state"/><rect x="680" y="330" width="424" height="72" rx="6" class="obs"/><text x="730" y="227" text-anchor="middle" class="h">Y1</text><text x="892" y="227" text-anchor="middle" class="h">Y2</text><text x="1054" y="227" text-anchor="middle" class="h">Y3</text><text x="892" y="362" text-anchor="middle" class="t">entire observed sequence x1:T</text><text x="892" y="387" text-anchor="middle" class="s">overlapping and long-range input features allowed</text><path d="M760 220 H862 M922 220 H1024" class="edge"/><path d="M730 250 V330 M892 250 V330 M1054 250 V330" class="edge"/></g>
  <text x="892" y="435" text-anchor="middle" class="s">One partition function normalizes complete label sequences</text>
  <text x="600" y="535" text-anchor="middle" class="t">Both can use forward-backward and Viterbi because both retain chain structure.</text>
</svg>
