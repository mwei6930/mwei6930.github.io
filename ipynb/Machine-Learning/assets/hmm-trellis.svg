<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
  <title id="title">Hidden Markov model and its trellis representation</title>
  <desc id="desc">Hidden states form a Markov chain, each state emits an observation, and the equivalent trellis expands every possible state across time.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#495057"/></marker><style>.h{font:700 22px Arial,sans-serif;fill:#212529}.t{font:17px Arial,sans-serif;fill:#343a40}.s{font:15px Arial,sans-serif;fill:#495057}.state{fill:#e7f5ff;stroke:#343a40;stroke-width:2}.obs{fill:#ffe8cc;stroke:#343a40;stroke-width:2}.line{stroke:#495057;stroke-width:2.2;fill:none;marker-end:url(#a)}.thin{stroke:#adb5bd;stroke-width:1.8;fill:none;marker-end:url(#a)}</style></defs>
  <text x="600" y="38" text-anchor="middle" class="h">An HMM Repeats the Same Local Dependencies Through Time</text>
  <text x="600" y="78" text-anchor="middle" class="t">Compact dynamic Bayesian network</text>
  <circle cx="190" cy="150" r="31" class="state"/><circle cx="430" cy="150" r="31" class="state"/><circle cx="670" cy="150" r="31" class="state"/><circle cx="910" cy="150" r="31" class="state"/>
  <circle cx="190" cy="275" r="28" class="obs"/><circle cx="430" cy="275" r="28" class="obs"/><circle cx="670" cy="275" r="28" class="obs"/><circle cx="910" cy="275" r="28" class="obs"/>
  <text x="190" y="157" text-anchor="middle" class="h">Z1</text><text x="430" y="157" text-anchor="middle" class="h">Z2</text><text x="670" y="157" text-anchor="middle" class="h">Z3</text><text x="910" y="157" text-anchor="middle" class="h">ZT</text>
  <text x="190" y="282" text-anchor="middle" class="h">X1</text><text x="430" y="282" text-anchor="middle" class="h">X2</text><text x="670" y="282" text-anchor="middle" class="h">X3</text><text x="910" y="282" text-anchor="middle" class="h">XT</text>
  <path d="M221 150 H391 M461 150 H631 M701 150 H871 M190 181 V239 M430 181 V239 M670 181 V239 M910 181 V239" class="line"/><text x="790" y="145" text-anchor="middle" class="t">...</text>
  <path d="M70 335 H1130" stroke="#adb5bd" stroke-width="2"/>
  <text x="600" y="375" text-anchor="middle" class="t">Trellis for K = 3 states: every column is one time step</text>
  <g class="thin"><path d="M165 435 L405 435 M165 435 L405 485 M165 435 L405 535 M165 485 L405 435 M165 485 L405 485 M165 485 L405 535 M165 535 L405 435 M165 535 L405 485 M165 535 L405 535 M435 435 L675 435 M435 435 L675 485 M435 435 L675 535 M435 485 L675 435 M435 485 L675 485 M435 485 L675 535 M435 535 L675 435 M435 535 L675 485 M435 535 L675 535 M705 435 L945 435 M705 435 L945 485 M705 435 L945 535 M705 485 L945 435 M705 485 L945 485 M705 485 L945 535 M705 535 L945 435 M705 535 L945 485 M705 535 L945 535</g>
  <g class="state"><circle cx="150" cy="435" r="15"/><circle cx="150" cy="485" r="15"/><circle cx="150" cy="535" r="15"/><circle cx="420" cy="435" r="15"/><circle cx="420" cy="485" r="15"/><circle cx="420" cy="535" r="15"/><circle cx="690" cy="435" r="15"/><circle cx="690" cy="485" r="15"/><circle cx="690" cy="535" r="15"/><circle cx="960" cy="435" r="15"/><circle cx="960" cy="485" r="15"/><circle cx="960" cy="535" r="15"/></g>
  <text x="150" y="405" text-anchor="middle" class="s">t=1</text><text x="420" y="405" text-anchor="middle" class="s">t=2</text><text x="690" y="405" text-anchor="middle" class="s">t=3</text><text x="960" y="405" text-anchor="middle" class="s">t=T</text>
</svg>
