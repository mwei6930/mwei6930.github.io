<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="585" viewBox="0 0 1200 585" role="img" aria-labelledby="title desc">
<title id="title">Feature alignment for domain adaptation</title><desc id="desc">Labeled source and unlabeled target data are mapped to a shared representation using covariance, MMD, transport, or adversarial alignment while preserving task discrimination.</desc>
<defs><marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#475569"/></marker>
<style>.title{font:700 26px Arial,sans-serif;fill:#17212b}.bh{font:700 19px Arial,sans-serif;fill:#17212b}.bt{font:15px Arial,sans-serif;fill:#334155}.small{font:14px Arial,sans-serif;fill:#526172}.arrow{stroke:#475569;stroke-width:3;marker-end:url(#arrowhead)}.node{stroke:#334155;stroke-width:2}</style></defs>
<rect width="1200" height="585" fill="#ffffff"/>
<text x="600" y="42" text-anchor="middle" class="title">Feature alignment for domain adaptation</text>
<rect x="35" y="110" width="245" height="330" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="157.5" y="148" text-anchor="middle" class="bh">Source</text><text x="157.5" y="182" text-anchor="middle" class="bt">labeled features</text><text x="157.5" y="209" text-anchor="middle" class="bt">source geometry</text><text x="157.5" y="236" text-anchor="middle" class="bt">task predictor</text><rect x="920" y="110" width="245" height="330" rx="10" fill="#fee2e2" stroke="#e11d48" stroke-width="3"/><text x="1042.5" y="148" text-anchor="middle" class="bh">Target</text><text x="1042.5" y="182" text-anchor="middle" class="bt">unlabeled features</text><text x="1042.5" y="209" text-anchor="middle" class="bt">target geometry</text><text x="1042.5" y="236" text-anchor="middle" class="bt">deployment samples</text><line x1="280" y1="275" x2="390" y2="275" class="arrow"/><line x1="920" y1="275" x2="810" y2="275" class="arrow"/><rect x="405" y="90" width="390" height="370" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="3"/><text x="600.0" y="128" text-anchor="middle" class="bh">Shared representation</text><text x="600.0" y="162" text-anchor="middle" class="bt">CORAL: match covariance</text><text x="600.0" y="189" text-anchor="middle" class="bt">MMD: match feature means in RKHS</text><text x="600.0" y="216" text-anchor="middle" class="bt">optimal transport: match mass</text><text x="600.0" y="243" text-anchor="middle" class="bt">DANN: fool a domain classifier</text><text x="600.0" y="270" text-anchor="middle" class="bt">preserve task discrimination</text><path d="M515 360 C565 300 635 300 685 360" fill="none" stroke="#2563eb" stroke-width="5"/><path d="M515 385 C565 325 635 325 685 385" fill="none" stroke="#e11d48" stroke-width="5"/><text x="600" y="520" text-anchor="middle" class="bh">Marginal alignment is not enough when class conditionals or label semantics differ.</text><text x="600" y="552" text-anchor="middle" class="small">A domain-invariant representation can align the wrong classes unless task structure constrains it.</text></svg>