<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">DBSCAN core, border, and noise points</title>
  <desc id="desc">An epsilon neighborhood around a core point contains enough samples; border points are reachable from a core, while sparse isolated points are labeled noise.</desc>
  <defs><style>.h{font:700 24px Arial,sans-serif;fill:#212529}.t{font:700 17px Arial,sans-serif;fill:#343a40}.s{font:15px Arial,sans-serif;fill:#495057}.box{stroke:#adb5bd;stroke-width:2;rx:6}.core{fill:#4dabf7;stroke:#1864ab;stroke-width:2}.border{fill:#ffd43b;stroke:#e67700;stroke-width:2}.noise{fill:#adb5bd;stroke:#495057;stroke-width:2}</style></defs>
  <text x="600" y="38" text-anchor="middle" class="h">DBSCAN Expands Density-Connected Components</text>
  <rect x="30" y="80" width="750" height="480" class="box" fill="#f8f9fa"/>
  <circle cx="325" cy="300" r="115" fill="#e7f5ff" stroke="#1971c2" stroke-width="3" stroke-dasharray="8 6"/><text x="420" y="195" class="s">epsilon neighborhood</text>
  <g class="core"><circle cx="280" cy="270" r="13"/><circle cx="330" cy="250" r="13"/><circle cx="370" cy="285" r="13"/><circle cx="310" cy="330" r="13"/><circle cx="355" cy="345" r="13"/><circle cx="395" cy="325" r="13"/></g>
  <g class="border"><circle cx="225" cy="220" r="13"/><circle cx="440" cy="360" r="13"/><circle cx="245" cy="390" r="13"/></g>
  <g class="noise"><circle cx="100" cy="170" r="13"/><circle cx="620" cy="180" r="13"/><circle cx="680" cy="430" r="13"/></g>
  <text x="100" y="150" text-anchor="middle" class="s">noise</text><text x="325" y="455" text-anchor="middle" class="s">core points connect the cluster</text><text x="245" y="425" text-anchor="middle" class="s">border</text>
  <rect x="810" y="80" width="360" height="480" class="box" fill="#d3f9d8"/><text x="990" y="125" text-anchor="middle" class="t">Classification of a point</text>
  <circle cx="875" cy="195" r="13" class="core"/><text x="910" y="202" class="s">core: at least min_samples</text><text x="910" y="227" class="s">inside its epsilon ball</text>
  <circle cx="875" cy="290" r="13" class="border"/><text x="910" y="297" class="s">border: not core, but lies</text><text x="910" y="322" class="s">inside a core neighborhood</text>
  <circle cx="875" cy="385" r="13" class="noise"/><text x="910" y="392" class="s">noise: not density-reachable</text><text x="910" y="417" class="s">from any core point</text>
  <text x="990" y="485" text-anchor="middle" class="s">No K is required.</text><text x="990" y="515" text-anchor="middle" class="s">Distance scale is still crucial.</text>
  <text x="600" y="600" text-anchor="middle" class="s">A single global epsilon can fail when meaningful clusters have very different densities.</text>
</svg>
