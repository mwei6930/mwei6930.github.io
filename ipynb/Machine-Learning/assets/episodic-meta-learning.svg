<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Episodic meta-learning and few-shot evaluation</title><desc id="desc">Many meta-training tasks teach a reusable learner, which adapts on a support set and is evaluated on a separate query set from a held-out meta-test task.</desc>
<defs><marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#475569"/></marker>
<style>.title{font:700 26px Arial,sans-serif;fill:#17212b}.bh{font:700 19px Arial,sans-serif;fill:#17212b}.bt{font:15px Arial,sans-serif;fill:#334155}.small{font:14px Arial,sans-serif;fill:#526172}.arrow{stroke:#475569;stroke-width:3;marker-end:url(#arrowhead)}.node{stroke:#334155;stroke-width:2}</style></defs>
<rect width="1200" height="620" fill="#ffffff"/>
<text x="600" y="42" text-anchor="middle" class="title">Episodic meta-learning and few-shot evaluation</text>
<rect x="35" y="115" width="230" height="360" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="150.0" y="153" text-anchor="middle" class="bh">Meta-training tasks</text><text x="150.0" y="187" text-anchor="middle" class="bt">episode tau_1</text><text x="150.0" y="214" text-anchor="middle" class="bt">episode tau_2</text><text x="150.0" y="241" text-anchor="middle" class="bt">episode tau_3</text><text x="150.0" y="268" text-anchor="middle" class="bt">support plus query</text><text x="150.0" y="295" text-anchor="middle" class="bt">learn across tasks</text><line x1="265" y1="295" x2="365" y2="295" class="arrow"/><rect x="380" y="95" width="280" height="400" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="3"/><text x="520.0" y="133" text-anchor="middle" class="bh">Reusable learner</text><text x="520.0" y="167" text-anchor="middle" class="bt">metric / embedding</text><text x="520.0" y="194" text-anchor="middle" class="bt">initialization theta</text><text x="520.0" y="221" text-anchor="middle" class="bt">optimizer or update rule</text><text x="520.0" y="248" text-anchor="middle" class="bt">task encoder</text><text x="520.0" y="275" text-anchor="middle" class="bt">meta-objective on query</text><line x1="660" y1="295" x2="760" y2="295" class="arrow"/><rect x="775" y="115" width="390" height="360" rx="10" fill="#fff7ed" stroke="#e8590c" stroke-width="3"/><text x="970.0" y="153" text-anchor="middle" class="bh">Held-out meta-test task</text><text x="970.0" y="187" text-anchor="middle" class="bt">support: N-way K-shot adaptation</text><text x="970.0" y="214" text-anchor="middle" class="bt">query: evaluation only</text><text x="970.0" y="241" text-anchor="middle" class="bt">new classes or new task</text><text x="970.0" y="268" text-anchor="middle" class="bt">repeat many episodes</text><text x="970.0" y="295" text-anchor="middle" class="bt">report mean and interval</text><circle cx="835" cy="385" r="12" fill="#2563eb"/><circle cx="875" cy="360" r="12" fill="#2563eb"/><circle cx="945" cy="410" r="12" fill="#e11d48"/><circle cx="990" cy="370" r="12" fill="#e11d48"/><circle cx="1080" cy="395" r="12" fill="#16a34a"/><text x="600" y="555" text-anchor="middle" class="bh">Support data adapts the learner; query data estimates generalization within the episode.</text><text x="600" y="585" text-anchor="middle" class="small">Class, task, and domain leakage across meta-train and meta-test invalidates few-shot claims.</text></svg>