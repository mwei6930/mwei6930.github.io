<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Self-training and the confirmation-bias loop</title><desc id="desc">A teacher predicts unlabeled data, a confidence gate selects pseudo-labels, and a student is refitted, with a marked feedback path for confident mistakes.</desc>
<defs><marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#475569"/></marker>
<style>.title{font:700 26px Arial,sans-serif;fill:#17212b}.bh{font:700 19px Arial,sans-serif;fill:#17212b}.bt{font:15px Arial,sans-serif;fill:#334155}.small{font:14px Arial,sans-serif;fill:#526172}.arrow{stroke:#475569;stroke-width:3;marker-end:url(#arrowhead)}.node{stroke:#334155;stroke-width:2}</style></defs>
<rect width="1200" height="600" fill="#ffffff"/>
<text x="600" y="42" text-anchor="middle" class="title">Self-training and the confirmation-bias loop</text>
<rect x="55" y="185" width="190" height="145" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="150.0" y="223" text-anchor="middle" class="bh">1. Seed labels</text><text x="150.0" y="257" text-anchor="middle" class="bt">small clean L</text><rect x="285" y="75" width="210" height="145" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="3"/><text x="390.0" y="113" text-anchor="middle" class="bh">2. Fit teacher</text><text x="390.0" y="147" text-anchor="middle" class="bt">calibrated predictor</text><rect x="530" y="75" width="210" height="145" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="635.0" y="113" text-anchor="middle" class="bh">3. Predict U</text><text x="635.0" y="147" text-anchor="middle" class="bt">probability + uncertainty</text><rect x="775" y="185" width="210" height="145" rx="10" fill="#fff7ed" stroke="#e8590c" stroke-width="3"/><text x="880.0" y="223" text-anchor="middle" class="bh">4. Confidence gate</text><text x="880.0" y="257" text-anchor="middle" class="bt">threshold, balance, audit</text><rect x="530" y="355" width="210" height="145" rx="10" fill="#f3e8ff" stroke="#9333ea" stroke-width="3"/><text x="635.0" y="393" text-anchor="middle" class="bh">5. Refit student</text><text x="635.0" y="427" text-anchor="middle" class="bt">L plus pseudo-labels</text><rect x="285" y="355" width="210" height="145" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="3"/><text x="390.0" y="393" text-anchor="middle" class="bh">6. Stop or repeat</text><text x="390.0" y="427" text-anchor="middle" class="bt">no stable additions</text><line x1="245" y1="205" x2="285" y2="180" class="arrow"/><line x1="495" y1="145" x2="530" y2="145" class="arrow"/><line x1="740" y1="180" x2="775" y2="215" class="arrow"/><line x1="825" y1="335" x2="740" y2="405" class="arrow"/><line x1="530" y1="430" x2="495" y2="430" class="arrow"/><line x1="285" y1="405" x2="200" y2="330" class="arrow"/><path d="M890 360 C1005 425 1040 110 760 105" fill="none" stroke="#e11d48" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrowhead)"/><text x="980" y="455" text-anchor="middle" class="bh" fill="#be123c">confirmation-bias path</text><text x="980" y="485" text-anchor="middle" class="small">confident error -> retraining -> more confident error</text><text x="600" y="565" text-anchor="middle" class="small">Confidence is useful only when probabilities are calibrated and selected pseudo-labels are monitored by class and subgroup.</text></svg>