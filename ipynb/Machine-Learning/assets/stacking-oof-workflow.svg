<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Leakage-safe stacking workflow</title><desc id="desc">Base models create out-of-fold training predictions for a meta-model, then are refit on all development data for deployment.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#495057"/></marker><style>.h{font:700 24px Arial,sans-serif;fill:#212529}.t{font:17px Arial,sans-serif;fill:#343a40}.s{font:15px Arial,sans-serif;fill:#495057}.box{fill:#fff;stroke:#868e96;stroke-width:2}.fold{stroke:#495057;stroke-width:1.5}.line{stroke:#495057;stroke-width:2.5;fill:none;marker-end:url(#a)}.safe{fill:#d3f9d8;stroke:#2b8a3e;stroke-width:2}.warn{fill:#ffe3e3;stroke:#c92a2a;stroke-width:2}</style></defs>
  <text x="600" y="38" text-anchor="middle" class="h">Stacking Must Train the Meta-Model on Out-of-Fold Predictions</text>
  <rect x="35" y="92" width="250" height="330" rx="6" class="box"/><text x="160" y="128" text-anchor="middle" class="h">Development Data</text>
  <rect x="76" y="160" width="168" height="42" fill="#d0ebff" class="fold"/><rect x="76" y="202" width="168" height="42" fill="#d3f9d8" class="fold"/><rect x="76" y="244" width="168" height="42" fill="#fff3bf" class="fold"/><rect x="76" y="286" width="168" height="42" fill="#ffe8cc" class="fold"/><rect x="76" y="328" width="168" height="42" fill="#f3d9fa" class="fold"/>
  <text x="160" y="187" text-anchor="middle" class="s">fold 1</text><text x="160" y="229" text-anchor="middle" class="s">fold 2</text><text x="160" y="271" text-anchor="middle" class="s">fold 3</text><text x="160" y="313" text-anchor="middle" class="s">fold 4</text><text x="160" y="355" text-anchor="middle" class="s">fold 5</text>
  <path d="M285 220 H355" class="line"/><path d="M285 310 H355" class="line"/>
  <rect x="365" y="82" width="265" height="155" rx="6" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><text x="497" y="120" text-anchor="middle" class="h">Base Model A</text><text x="390" y="158" class="t">fit on four folds</text><text x="390" y="189" class="t">predict held-out fold</text><text x="390" y="217" class="s">repeat until every row has a prediction</text>
  <rect x="365" y="272" width="265" height="155" rx="6" fill="#fff3bf" stroke="#f08c00" stroke-width="2"/><text x="497" y="310" text-anchor="middle" class="h">Base Model B</text><text x="390" y="348" class="t">same folds, independent fit</text><text x="390" y="379" class="t">predict held-out fold</text><text x="390" y="407" class="s">add more diverse base models if useful</text>
  <path d="M630 160 H700" class="line"/><path d="M630 350 H700" class="line"/>
  <rect x="710" y="145" width="205" height="230" rx="6" class="safe"/><text x="812" y="184" text-anchor="middle" class="h">OOF Matrix Z</text><text x="738" y="222" class="t">row i:</text><text x="738" y="253" class="s">prediction A_i</text><text x="738" y="282" class="s">prediction B_i</text><text x="738" y="311" class="s">...</text><text x="738" y="347" class="t">target y_i unseen</text><text x="738" y="369" class="s">by each producing fit</text>
  <path d="M915 260 H970" class="line"/><rect x="980" y="177" width="185" height="165" rx="6" fill="#f3f0ff" stroke="#7048e8" stroke-width="2"/><text x="1072" y="216" text-anchor="middle" class="h">Meta-Model</text><text x="1000" y="256" class="t">learns how to</text><text x="1000" y="286" class="t">combine columns</text><text x="1000" y="320" class="s">regularize and validate</text>
  <rect x="110" y="485" width="980" height="110" rx="6" class="box"/><text x="600" y="520" text-anchor="middle" class="h">Deployment</text><text x="145" y="558" class="t">Refit each base model on all development data -&gt; produce base predictions for a new case -&gt; meta-model combines them.</text><text x="600" y="583" text-anchor="middle" class="s">Never train the meta-model on in-sample base predictions; that leaks base-model training fit into level two.</text>
  <rect x="805" y="418" width="360" height="45" rx="5" class="warn"/><text x="985" y="447" text-anchor="middle" class="s">Wrong: fit base model and predict the same rows</text>
  <text x="600" y="632" text-anchor="middle" class="s">The final untouched test set remains outside this entire model-selection process.</text>
</svg>
