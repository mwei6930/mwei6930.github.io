<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">HDBSCAN hierarchy and stable cluster extraction</title>
  <desc id="desc">Mutual reachability distances produce a minimum spanning tree and density hierarchy; condensation removes small branches and stable clusters persist across density levels.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#495057"/></marker><style>.h{font:700 24px Arial,sans-serif;fill:#212529}.t{font:700 16px Arial,sans-serif;fill:#343a40}.s{font:14px Arial,sans-serif;fill:#495057}.box{stroke:#495057;stroke-width:2;rx:6}.line{stroke:#495057;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style></defs>
  <text x="600" y="38" text-anchor="middle" class="h">HDBSCAN Selects Clusters That Persist across Density Levels</text>
  <rect x="25" y="135" width="190" height="300" class="box" fill="#e7f5ff"/><text x="120" y="175" text-anchor="middle" class="t">Core distance</text><circle cx="120" cy="285" r="70" fill="none" stroke="#1971c2" stroke-width="3" stroke-dasharray="8 6"/><circle cx="120" cy="285" r="11" fill="#4dabf7"/><circle cx="80" cy="250" r="8" fill="#74c0fc"/><circle cx="150" cy="240" r="8" fill="#74c0fc"/><circle cx="165" cy="310" r="8" fill="#74c0fc"/><text x="120" y="395" text-anchor="middle" class="s">local sparsity scale</text>
  <path d="M215 285 H270" class="line"/>
  <rect x="275" y="135" width="210" height="300" class="box" fill="#fff3bf"/><text x="380" y="175" text-anchor="middle" class="t">Mutual reachability</text><text x="380" y="230" text-anchor="middle" class="s">max(core(a), core(b),</text><text x="380" y="258" text-anchor="middle" class="s">original distance)</text><path d="M320 330 L440 220" stroke="#e67700" stroke-width="5"/><text x="380" y="395" text-anchor="middle" class="s">push sparse points apart</text>
  <path d="M485 285 H540" class="line"/>
  <rect x="545" y="135" width="210" height="300" class="box" fill="#d3f9d8"/><text x="650" y="175" text-anchor="middle" class="t">Minimum spanning tree</text><circle cx="600" cy="250" r="9" fill="#69db7c"/><circle cx="685" cy="225" r="9" fill="#69db7c"/><circle cx="620" cy="345" r="9" fill="#69db7c"/><circle cx="705" cy="335" r="9" fill="#69db7c"/><path d="M609 247 L676 228 M604 259 L616 336 M629 344 L696 336" stroke="#2b8a3e" stroke-width="3"/><text x="650" y="395" text-anchor="middle" class="s">connect all points cheaply</text>
  <path d="M755 285 H810" class="line"/>
  <rect x="815" y="105" width="360" height="360" class="box" fill="#f3d9fa"/><text x="995" y="145" text-anchor="middle" class="t">Condensed density tree</text><path d="M995 180 V235 M995 235 L900 300 M995 235 L1090 300 M900 300 L865 385 M900 300 L935 385 M1090 300 L1055 385 M1090 300 L1125 385" stroke="#862e9c" stroke-width="8" fill="none"/><path d="M900 300 L865 385 M1090 300 L1125 385" stroke="#adb5bd" stroke-width="3" stroke-dasharray="7 6"/><text x="900" y="425" text-anchor="middle" class="s">stable A</text><text x="1090" y="425" text-anchor="middle" class="s">stable B</text><text x="995" y="450" text-anchor="middle" class="s">small short-lived branches become noise</text>
  <text x="600" y="530" text-anchor="middle" class="t">stability approximates how long a cluster survives as the density threshold changes</text>
  <text x="600" y="575" text-anchor="middle" class="s">HDBSCAN removes one global epsilon, but min_cluster_size, metric, and representation still define the result.</text>
</svg>
