<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Ordinary least squares as orthogonal projection</title>
  <desc id="desc">The observed response vector is projected onto the column space of the design matrix. The residual is orthogonal to every design column.</desc>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker>
    <marker id="red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/></marker>
    <style>.title{font:700 29px Arial,sans-serif;fill:#0f172a}.head{font:700 19px Arial,sans-serif;fill:#0f172a}.body{font:16px Arial,sans-serif;fill:#1e293b}.small{font:14px Arial,sans-serif;fill:#475569}</style>
  </defs>
  <rect width="1200" height="650" fill="#f8fafc"/>
  <text x="600" y="43" text-anchor="middle" class="title">Least squares projects y onto the column space of X</text>

  <polygon points="90,490 540,560 830,350 385,286" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="185" y="518" class="head">Col(X)</text>
  <text x="185" y="544" class="small">all predictions X beta reachable by the model</text>

  <circle cx="285" cy="470" r="7" fill="#0f172a"/>
  <line x1="285" y1="470" x2="665" y2="390" stroke="#2563eb" stroke-width="5" marker-end="url(#blue)"/>
  <text x="465" y="405" class="head" fill="#1d4ed8">y-hat = X beta-hat</text>

  <line x1="285" y1="470" x2="665" y2="145" stroke="#334155" stroke-width="5" marker-end="url(#a)"/>
  <text x="465" y="246" class="head">observed y</text>

  <line x1="665" y1="390" x2="665" y2="145" stroke="#dc2626" stroke-width="5" stroke-dasharray="11 8" marker-end="url(#red)"/>
  <text x="690" y="266" class="head" fill="#991b1b">residual e</text>
  <text x="690" y="294" class="body" fill="#991b1b">= y - y-hat</text>
  <path d="M665 390 L635 396 L642 426" fill="none" stroke="#dc2626" stroke-width="3"/>
  <text x="694" y="421" class="small">90 degrees</text>

  <rect x="865" y="105" width="300" height="420" rx="8" fill="#fff" stroke="#64748b" stroke-width="2"/>
  <text x="1015" y="146" text-anchor="middle" class="head">What the geometry means</text>
  <circle cx="900" cy="198" r="8" fill="#2563eb"/><text x="922" y="197" class="body">y-hat is the closest vector</text><text x="922" y="220" class="body">to y that lies in Col(X).</text>
  <circle cx="900" cy="257" r="8" fill="#dc2626"/><text x="922" y="247" class="small">Residual e is orthogonal to</text><text x="922" y="268" class="small">every design column, so motion</text><text x="922" y="289" class="small">inside Col(X) cannot reduce it.</text>
  <rect x="900" y="315" width="230" height="72" rx="6" fill="#fef2f2" stroke="#dc2626"/>
  <text x="1015" y="346" text-anchor="middle" style="font:700 23px Georgia,serif;fill:#991b1b">X^T e = 0</text>
  <text x="1015" y="373" text-anchor="middle" class="small">normal equations</text>
  <circle cx="900" cy="433" r="8" fill="#16a34a"/><text x="922" y="428" class="body">Full column rank makes beta</text><text x="922" y="451" class="body">unique; rank deficiency does not.</text>
  <text x="1015" y="488" text-anchor="middle" class="small">QR or SVD avoids explicitly forming</text><text x="1015" y="510" text-anchor="middle" class="small">the normal-equation inverse.</text>

  <text x="600" y="612" text-anchor="middle" class="body">Projection explains fitted values; probability assumptions are additionally needed for classical standard errors and tests.</text>
</svg>
