<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">Curse of dimensionality for local methods</title>
  <desc id="desc">A fixed coordinate-wise neighborhood occupies exponentially less volume as dimension grows, while nearest and farthest distances become less distinguishable.</desc>
  <defs>
    <style>.title{font:700 28px Arial,sans-serif;fill:#0f172a}.head{font:700 18px Arial,sans-serif;fill:#0f172a}.body{font:15px Arial,sans-serif;fill:#1e293b}.small{font:13px Arial,sans-serif;fill:#475569}</style>
  </defs>
  <rect width="1200" height="660" fill="#f8fafc"/>
  <text x="600" y="43" text-anchor="middle" class="title">Local neighborhoods become statistically empty in high dimension</text>

  <rect x="55" y="82" width="525" height="430" rx="8" fill="#fff" stroke="#64748b"/>
  <text x="317" y="119" text-anchor="middle" class="head">A fixed side fraction loses volume exponentially</text>
  <text x="317" y="149" text-anchor="middle" class="body">If each coordinate keeps half its range, the volume fraction is (1/2)^d.</text>

  <rect x="90" y="195" width="120" height="120" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <rect x="120" y="225" width="60" height="60" fill="#f97316" opacity="0.8"/>
  <text x="150" y="340" text-anchor="middle" class="head">d = 2</text>
  <text x="150" y="365" text-anchor="middle" class="body">25%</text>

  <rect x="255" y="195" width="120" height="120" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <rect x="300" y="240" width="30" height="30" fill="#f97316" opacity="0.8"/>
  <text x="315" y="340" text-anchor="middle" class="head">d = 5</text>
  <text x="315" y="365" text-anchor="middle" class="body">3.125%</text>

  <rect x="420" y="195" width="120" height="120" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <rect x="477" y="252" width="6" height="6" fill="#f97316"/>
  <text x="480" y="340" text-anchor="middle" class="head">d = 10</text>
  <text x="480" y="365" text-anchor="middle" class="body">0.098%</text>

  <rect x="105" y="403" width="425" height="72" rx="6" fill="#fff7ed" stroke="#f97316"/>
  <text x="317" y="432" text-anchor="middle" class="body">To collect the same number of neighbors, the radius must expand.</text>
  <text x="317" y="457" text-anchor="middle" class="small">The estimate becomes less local and bias increases.</text>

  <rect x="620" y="82" width="525" height="430" rx="8" fill="#fff" stroke="#64748b"/>
  <text x="882" y="119" text-anchor="middle" class="head">Distances concentrate</text>
  <text x="882" y="149" text-anchor="middle" class="body">Nearest and farthest points become less distinguishable.</text>
  <line x1="685" y1="420" x2="1085" y2="420" stroke="#64748b" stroke-width="2"/>
  <line x1="685" y1="420" x2="685" y2="185" stroke="#64748b" stroke-width="2"/>
  <text x="885" y="456" text-anchor="middle" class="small">dimension</text>
  <text x="648" y="300" text-anchor="middle" transform="rotate(-90 648 300)" class="small">relative distance spread</text>
  <polyline points="700,210 770,260 840,305 910,340 980,365 1060,382" fill="none" stroke="#dc2626" stroke-width="4"/>
  <circle cx="700" cy="210" r="5" fill="#dc2626"/><circle cx="840" cy="305" r="5" fill="#dc2626"/><circle cx="980" cy="365" r="5" fill="#dc2626"/><circle cx="1060" cy="382" r="5" fill="#dc2626"/>
  <line x1="700" y1="395" x2="1060" y2="395" stroke="#16a34a" stroke-dasharray="7 6"/>
  <text x="1030" y="330" class="small" fill="#991b1b">contrast collapses</text>
  <text x="705" y="188" class="small">easy ranking</text>

  <rect x="105" y="548" width="990" height="72" rx="7" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="600" y="577" text-anchor="middle" class="head">Useful responses</text>
  <text x="600" y="604" text-anchor="middle" class="body">remove irrelevant features | learn a representation or metric | use domain-specific similarity | validate k and search recall</text>
</svg>
