<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Evaluation is a controlled experimental lifecycle</title>
  <desc id="desc">Data are split by the deployment unit, training and validation form a model-selection loop, the specification is frozen before one final test, and deployment monitoring starts a new cycle.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#334155"/></marker>
    <style>
      .title{font:700 28px Arial,sans-serif;fill:#0f172a}.head{font:700 19px Arial,sans-serif;fill:#0f172a}.body{font:15px Arial,sans-serif;fill:#334155}.small{font:14px Arial,sans-serif;fill:#475569}.box{fill:#fff;stroke:#64748b;stroke-width:2}.arrow{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="640" fill="#f8fafc"/>
  <text x="600" y="42" text-anchor="middle" class="title">Evaluation is a controlled experimental lifecycle</text>

  <rect x="35" y="95" width="195" height="225" rx="8" class="box"/>
  <text x="132" y="128" text-anchor="middle" class="head">Target population</text>
  <circle cx="76" cy="178" r="9" fill="#2563eb"/><circle cx="112" cy="170" r="9" fill="#16a34a"/><circle cx="150" cy="182" r="9" fill="#f59e0b"/><circle cx="190" cy="169" r="9" fill="#db2777"/>
  <circle cx="92" cy="215" r="9" fill="#f59e0b"/><circle cx="132" cy="208" r="9" fill="#2563eb"/><circle cx="172" cy="216" r="9" fill="#16a34a"/>
  <text x="132" y="258" text-anchor="middle" class="body">Define deployment unit,</text>
  <text x="132" y="280" text-anchor="middle" class="body">time horizon and outcome</text>
  <text x="132" y="303" text-anchor="middle" class="small">before seeing scores</text>

  <path d="M230 207 H277" class="arrow"/>
  <rect x="280" y="95" width="205" height="225" rx="8" class="box"/>
  <text x="382" y="128" text-anchor="middle" class="head">Split by structure</text>
  <rect x="310" y="158" width="145" height="35" rx="5" fill="#dbeafe" stroke="#2563eb"/><text x="382" y="181" text-anchor="middle" class="body">training units</text>
  <rect x="310" y="203" width="145" height="35" rx="5" fill="#dcfce7" stroke="#16a34a"/><text x="382" y="226" text-anchor="middle" class="body">validation units</text>
  <rect x="310" y="248" width="145" height="35" rx="5" fill="#fee2e2" stroke="#ef4444"/><text x="382" y="271" text-anchor="middle" class="body">locked test units</text>
  <text x="382" y="306" text-anchor="middle" class="small">groups and time stay intact</text>

  <path d="M485 207 H532" class="arrow"/>
  <rect x="535" y="75" width="255" height="265" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="662" y="108" text-anchor="middle" class="head">Selection loop</text>
  <rect x="565" y="133" width="195" height="45" rx="6" fill="#ffedd5" stroke="#ea580c"/><text x="662" y="161" text-anchor="middle" class="body">fit preprocessing + model</text>
  <path d="M662 178 V205" class="arrow"/>
  <rect x="565" y="207" width="195" height="45" rx="6" fill="#dcfce7" stroke="#16a34a"/><text x="662" y="235" text-anchor="middle" class="body">score on validation data</text>
  <path d="M760 230 C785 230 785 155 760 155" stroke="#c2410c" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="662" y="283" text-anchor="middle" class="body">features, hyperparameters,</text>
  <text x="662" y="305" text-anchor="middle" class="body">thresholds and stopping</text>
  <text x="662" y="327" text-anchor="middle" class="small">belong inside this boundary</text>

  <path d="M790 207 H837" class="arrow"/>
  <rect x="840" y="95" width="150" height="225" rx="8" class="box"/>
  <text x="915" y="128" text-anchor="middle" class="head">Freeze</text>
  <path d="M885 165 h60 v75 h-60 z" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <path d="M895 183 h40 M895 199 h40 M895 215 h28" stroke="#7c3aed" stroke-width="3"/>
  <text x="915" y="269" text-anchor="middle" class="body">pipeline, metric,</text>
  <text x="915" y="291" text-anchor="middle" class="body">seed policy and</text>
  <text x="915" y="313" text-anchor="middle" class="body">decision rule</text>

  <path d="M990 207 H1037" class="arrow"/>
  <rect x="1040" y="95" width="130" height="225" rx="8" class="box"/>
  <text x="1105" y="128" text-anchor="middle" class="head">Test once</text>
  <circle cx="1105" cy="190" r="38" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <path d="M1086 190 l13 13 27-31" stroke="#b91c1c" stroke-width="5" fill="none"/>
  <text x="1105" y="252" text-anchor="middle" class="body">point estimate</text>
  <text x="1105" y="274" text-anchor="middle" class="body">+ uncertainty</text>
  <text x="1105" y="296" text-anchor="middle" class="small">no tuning return</text>

  <rect x="250" y="420" width="700" height="145" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="600" y="454" text-anchor="middle" class="head">Deployment and monitoring answer a different question</text>
  <text x="600" y="486" text-anchor="middle" class="body">Do performance, calibration, latency and subgroup behavior remain acceptable under current traffic?</text>
  <text x="600" y="516" text-anchor="middle" class="body">Drift or new requirements trigger a new development cycle, not a rewrite of the historical test result.</text>
  <path d="M1105 320 V390 H950 V420" class="arrow"/>
  <path d="M250 492 H132 V320" class="arrow"/>
  <text x="170" y="475" class="small">new data-generating process</text>
  <line x1="1015" y1="75" x2="1015" y2="345" stroke="#ef4444" stroke-width="3" stroke-dasharray="8 7"/>
  <text x="1025" y="365" class="small" fill="#b91c1c">lock boundary</text>
</svg>
