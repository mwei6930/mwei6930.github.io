<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Kernel trick and dual prediction</title>
  <desc id="desc">A nonlinear feature map may make data linearly separable, while the kernel computes feature-space inner products without constructing the mapped coordinates.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <style>.title{font:700 28px Arial,sans-serif;fill:#0f172a}.head{font:700 18px Arial,sans-serif;fill:#0f172a}.body{font:15px Arial,sans-serif;fill:#1e293b}.small{font:13px Arial,sans-serif;fill:#475569}.axis{stroke:#64748b;stroke-width:1.5}</style>
  </defs>
  <rect width="1200" height="680" fill="#f8fafc"/>
  <text x="600" y="43" text-anchor="middle" class="title">The kernel trick replaces coordinates with inner products</text>

  <rect x="45" y="88" width="300" height="370" rx="8" fill="#fff" stroke="#64748b"/>
  <text x="195" y="123" text-anchor="middle" class="head">Original feature space</text>
  <line x1="85" y1="405" x2="305" y2="405" class="axis"/><line x1="85" y1="405" x2="85" y2="165" class="axis"/>
  <circle cx="195" cy="285" r="52" fill="none" stroke="#dc2626" stroke-width="3"/>
  <g fill="#93c5fd" stroke="#2563eb"><circle cx="190" cy="275" r="8"/><circle cx="210" cy="300" r="8"/><circle cx="175" cy="310" r="8"/><circle cx="205" cy="255" r="8"/></g>
  <g fill="#fdba74" stroke="#ea580c"><circle cx="115" cy="225" r="8"/><circle cx="270" cy="220" r="8"/><circle cx="120" cy="355" r="8"/><circle cx="280" cy="350" r="8"/><circle cx="200" cy="185" r="8"/></g>
  <text x="195" y="432" text-anchor="middle" class="small">no straight line separates center from ring</text>

  <line x1="345" y1="270" x2="435" y2="270" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="390" y="246" text-anchor="middle" class="body">phi(x)</text>

  <rect x="450" y="88" width="300" height="370" rx="8" fill="#fff" stroke="#64748b"/>
  <text x="600" y="123" text-anchor="middle" class="head">Mapped feature space</text>
  <line x1="490" y1="405" x2="710" y2="405" class="axis"/><line x1="490" y1="405" x2="490" y2="165" class="axis"/>
  <line x1="510" y1="290" x2="690" y2="290" stroke="#16a34a" stroke-width="4"/>
  <g fill="#93c5fd" stroke="#2563eb"><circle cx="530" cy="345" r="8"/><circle cx="575" cy="320" r="8"/><circle cx="625" cy="350" r="8"/><circle cx="675" cy="325" r="8"/></g>
  <g fill="#fdba74" stroke="#ea580c"><circle cx="520" cy="225" r="8"/><circle cx="565" cy="190" r="8"/><circle cx="610" cy="235" r="8"/><circle cx="655" cy="200" r="8"/><circle cx="690" cy="245" r="8"/></g>
  <text x="600" y="432" text-anchor="middle" class="small">a hyperplane separates transformed observations</text>

  <line x1="750" y1="270" x2="835" y2="270" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="792" y="235" text-anchor="middle" class="body">avoid explicit</text>
  <text x="792" y="256" text-anchor="middle" class="body">coordinates</text>

  <rect x="850" y="88" width="305" height="370" rx="8" fill="#fff" stroke="#64748b"/>
  <text x="1002" y="123" text-anchor="middle" class="head">Kernel and dual form</text>
  <rect x="892" y="155" width="220" height="78" rx="6" fill="#faf5ff" stroke="#7c3aed"/>
  <text x="1002" y="184" text-anchor="middle" class="body">K(x,z) = phi(x)^T phi(z)</text>
  <text x="1002" y="211" text-anchor="middle" class="small">one similarity value per pair</text>
  <g>
    <rect x="920" y="260" width="42" height="42" fill="#ddd6fe" stroke="#7c3aed"/><rect x="962" y="260" width="42" height="42" fill="#ede9fe" stroke="#7c3aed"/><rect x="1004" y="260" width="42" height="42" fill="#c4b5fd" stroke="#7c3aed"/><rect x="1046" y="260" width="42" height="42" fill="#ede9fe" stroke="#7c3aed"/>
    <rect x="920" y="302" width="42" height="42" fill="#ede9fe" stroke="#7c3aed"/><rect x="962" y="302" width="42" height="42" fill="#ddd6fe" stroke="#7c3aed"/><rect x="1004" y="302" width="42" height="42" fill="#ede9fe" stroke="#7c3aed"/><rect x="1046" y="302" width="42" height="42" fill="#c4b5fd" stroke="#7c3aed"/>
    <rect x="920" y="344" width="42" height="42" fill="#c4b5fd" stroke="#7c3aed"/><rect x="962" y="344" width="42" height="42" fill="#ede9fe" stroke="#7c3aed"/><rect x="1004" y="344" width="42" height="42" fill="#ddd6fe" stroke="#7c3aed"/><rect x="1046" y="344" width="42" height="42" fill="#ede9fe" stroke="#7c3aed"/>
  </g>
  <text x="1002" y="418" text-anchor="middle" class="small">Gram matrix Kij = K(xi,xj)</text>

  <rect x="100" y="500" width="1000" height="125" rx="8" fill="#ecfeff" stroke="#0f766e"/>
  <text x="600" y="535" text-anchor="middle" class="head">Prediction depends on similarities to training cases</text>
  <text x="600" y="570" text-anchor="middle" class="body">f(x) = sum_i alpha_i y_i K(x_i, x) + b</text>
  <text x="600" y="600" text-anchor="middle" class="small">For an SVM, only support vectors have nonzero alpha_i; the computational cost still grows with the number of stored support vectors.</text>
</svg>
