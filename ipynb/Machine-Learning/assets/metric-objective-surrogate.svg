<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#334155"/></marker>
    <style>.title{font:700 28px Arial,sans-serif;fill:#1f2937}.head{font:700 20px Arial,sans-serif;fill:#1f2937}.body{font:16px Arial,sans-serif;fill:#374151}.small{font:14px Arial,sans-serif;fill:#475569}.box{fill:#fff;stroke:#64748b;stroke-width:2}.arr{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="630" fill="#f8fafc"/>
  <text x="600" y="42" text-anchor="middle" class="title">Evaluation metric and training objective play different roles</text>

  <rect x="42" y="90" width="310" height="350" rx="8" class="box"/>
  <text x="197" y="125" text-anchor="middle" class="head">Decision metric</text>
  <text x="197" y="154" text-anchor="middle" class="small">What deployment success means</text>
  <g transform="translate(79 188)">
    <rect width="236" height="48" rx="6" fill="#e0f2fe" stroke="#0284c7"/><text x="118" y="30" text-anchor="middle" class="body">Accuracy / F1 / AUC</text>
    <rect y="68" width="236" height="48" rx="6" fill="#fef3c7" stroke="#d97706"/><text x="118" y="98" text-anchor="middle" class="body">MAE / business cost</text>
    <rect y="136" width="236" height="48" rx="6" fill="#fce7f3" stroke="#db2777"/><text x="118" y="166" text-anchor="middle" class="body">Ranking / utility / constraints</text>
  </g>
  <text x="197" y="404" text-anchor="middle" class="small">May be discrete, non-smooth, delayed,</text>
  <text x="197" y="427" text-anchor="middle" class="small">or defined only over a whole dataset.</text>

  <path d="M352 264 H444" class="arr"/><text x="398" y="244" text-anchor="middle" class="small">design a proxy</text>

  <rect x="446" y="90" width="310" height="350" rx="8" class="box"/>
  <text x="601" y="125" text-anchor="middle" class="head">Training objective</text>
  <text x="601" y="154" text-anchor="middle" class="small">A computable surrogate for learning</text>
  <path d="M500 205 C548 205 558 248 590 296 C622 341 670 350 714 350" fill="none" stroke="#2563eb" stroke-width="5"/>
  <circle cx="500" cy="205" r="8" fill="#ef4444"/>
  <text x="532" y="190" text-anchor="middle" class="small">larger loss</text>
  <text x="500" y="381" class="small">wrong margin</text><text x="655" y="381" class="small">correct margin</text>
  <text x="601" y="410" text-anchor="middle" class="body">differentiable or solver-compatible</text>

  <path d="M756 264 H848" class="arr"/><text x="802" y="244" text-anchor="middle" class="small">optimize</text>

  <rect x="850" y="90" width="308" height="350" rx="8" class="box"/>
  <text x="1004" y="125" text-anchor="middle" class="head">Learned parameters</text>
  <g transform="translate(900 184)">
    <circle cx="33" cy="54" r="14" fill="#2563eb"/><circle cx="33" cy="122" r="14" fill="#2563eb"/>
    <circle cx="112" cy="30" r="14" fill="#16a34a"/><circle cx="112" cy="88" r="14" fill="#16a34a"/><circle cx="112" cy="146" r="14" fill="#16a34a"/>
    <circle cx="190" cy="88" r="14" fill="#ef4444"/>
    <g stroke="#64748b" stroke-width="2"><line x1="47" y1="54" x2="98" y2="30"/><line x1="47" y1="54" x2="98" y2="88"/><line x1="47" y1="54" x2="98" y2="146"/><line x1="47" y1="122" x2="98" y2="30"/><line x1="47" y1="122" x2="98" y2="88"/><line x1="47" y1="122" x2="98" y2="146"/><line x1="126" y1="30" x2="176" y2="88"/><line x1="126" y1="88" x2="176" y2="88"/><line x1="126" y1="146" x2="176" y2="88"/></g>
  </g>
  <text x="1004" y="388" text-anchor="middle" class="body">evaluate on untouched data</text>
  <text x="1004" y="414" text-anchor="middle" class="small">using the original decision metric</text>

  <path d="M1004 440 V515 H197 V448" class="arr"/>
  <text x="600" y="544" text-anchor="middle" class="head">Alignment must be tested, not assumed</text>
  <text x="600" y="576" text-anchor="middle" class="body">A lower surrogate loss is useful only when it improves the decisions that the metric represents.</text>
</svg>
