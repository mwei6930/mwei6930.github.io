<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Decision guide for classical and neural models</title>
  <desc id="desc">A practical decision flow considers data modality, sample size, representation needs, latency, interpretability, and pretraining before choosing a model family.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#495057"/></marker><style>.h{font:700 24px Arial,sans-serif;fill:#212529}.t{font:700 16px Arial,sans-serif;fill:#343a40}.s{font:14px Arial,sans-serif;fill:#495057}.box{stroke:#495057;stroke-width:2;rx:6}.line{stroke:#495057;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style></defs>
  <text x="600" y="38" text-anchor="middle" class="h">Choose by Evidence and Constraints, Not by Model Fashion</text>
  <rect x="455" y="70" width="290" height="75" class="box" fill="#fff3bf"/><text x="600" y="102" text-anchor="middle" class="t">What is the raw data modality?</text><text x="600" y="128" text-anchor="middle" class="s">tabular vs high-dimensional structured signal</text>
  <path d="M520 145 L285 205 M680 145 L915 205" class="line"/>
  <rect x="105" y="210" width="360" height="90" class="box" fill="#e7f5ff"/><text x="285" y="245" text-anchor="middle" class="t">Compact tabular features</text><text x="285" y="272" text-anchor="middle" class="s">strong semantics already supplied by columns</text>
  <rect x="735" y="210" width="360" height="90" class="box" fill="#f3d9fa"/><text x="915" y="245" text-anchor="middle" class="t">Images, text, audio, large sequences</text><text x="915" y="272" text-anchor="middle" class="s">representation must be learned from raw structure</text>
  <path d="M285 300 V355 M915 300 V355" class="line"/>
  <rect x="105" y="360" width="360" height="120" class="box" fill="#d3f9d8"/><text x="285" y="395" text-anchor="middle" class="t">Start with classical baselines</text><text x="285" y="425" text-anchor="middle" class="s">linear / tree ensemble / kernel</text><text x="285" y="452" text-anchor="middle" class="s">especially with limited data and strict latency</text>
  <rect x="735" y="360" width="360" height="120" class="box" fill="#ffe3e3"/><text x="915" y="395" text-anchor="middle" class="t">Start from a pretrained neural encoder</text><text x="915" y="425" text-anchor="middle" class="s">fine-tune or freeze plus a small head</text><text x="915" y="452" text-anchor="middle" class="s">measure compute, robustness, and serving cost</text>
  <path d="M465 420 H735" class="line"/>
  <text x="600" y="402" text-anchor="middle" class="s">hybrid features / learned embeddings</text>
  <rect x="235" y="535" width="730" height="75" class="box" fill="#f8f9fa"/><text x="600" y="565" text-anchor="middle" class="t">Run the same leakage-safe validation protocol</text><text x="600" y="592" text-anchor="middle" class="s">quality + uncertainty + training cost + latency + memory + maintenance + failure analysis</text>
  <path d="M285 480 L440 535 M915 480 L760 535" class="line"/>
</svg>
