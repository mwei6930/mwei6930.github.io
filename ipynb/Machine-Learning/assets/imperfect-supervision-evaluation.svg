<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="615" viewBox="0 0 1200 615" role="img" aria-labelledby="title desc">
<title id="title">Evaluation architecture for imperfect supervision</title><desc id="desc">Imperfect development data is separated from clean validation and a frozen clean test set, with annotation budget and audits tracked throughout training.</desc>
<defs><marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#475569"/></marker>
<style>.title{font:700 26px Arial,sans-serif;fill:#17212b}.bh{font:700 19px Arial,sans-serif;fill:#17212b}.bt{font:15px Arial,sans-serif;fill:#334155}.small{font:14px Arial,sans-serif;fill:#526172}.arrow{stroke:#475569;stroke-width:3;marker-end:url(#arrowhead)}.node{stroke:#334155;stroke-width:2}</style></defs>
<rect width="1200" height="615" fill="#ffffff"/>
<text x="600" y="42" text-anchor="middle" class="title">Evaluation architecture for imperfect supervision</text>
<rect x="40" y="155" width="245" height="295" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="162.5" y="193" text-anchor="middle" class="bh">Development data</text><text x="162.5" y="227" text-anchor="middle" class="bt">clean seed labels</text><text x="162.5" y="254" text-anchor="middle" class="bt">unlabeled pool</text><text x="162.5" y="281" text-anchor="middle" class="bt">weak / noisy labels</text><text x="162.5" y="308" text-anchor="middle" class="bt">annotation ledger</text><line x1="285" y1="300" x2="375" y2="300" class="arrow"/><rect x="390" y="125" width="245" height="355" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="512.5" y="163" text-anchor="middle" class="bh">Training and tuning</text><text x="512.5" y="197" text-anchor="middle" class="bt">fit only train split</text><text x="512.5" y="224" text-anchor="middle" class="bt">select confidence tau</text><text x="512.5" y="251" text-anchor="middle" class="bt">design labeling rules</text><text x="512.5" y="278" text-anchor="middle" class="bt">choose query policy</text><text x="512.5" y="305" text-anchor="middle" class="bt">repeat over budgets</text><line x1="635" y1="300" x2="725" y2="300" class="arrow"/><rect x="740" y="155" width="200" height="295" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="3"/><text x="840.0" y="193" text-anchor="middle" class="bh">Clean validation</text><text x="840.0" y="227" text-anchor="middle" class="bt">model selection</text><text x="840.0" y="254" text-anchor="middle" class="bt">calibration</text><text x="840.0" y="281" text-anchor="middle" class="bt">threshold and stopping</text><text x="840.0" y="308" text-anchor="middle" class="bt">label audit</text><line x1="940" y1="300" x2="1015" y2="300" class="arrow"/><rect x="1030" y="155" width="135" height="295" rx="10" fill="#f3e8ff" stroke="#9333ea" stroke-width="3"/><text x="1097.5" y="193" text-anchor="middle" class="bh">Frozen test</text><text x="1097.5" y="227" text-anchor="middle" class="bt">used once</text><text x="1097.5" y="254" text-anchor="middle" class="bt">task metric</text><text x="1097.5" y="281" text-anchor="middle" class="bt">subgroups</text><text x="1097.5" y="308" text-anchor="middle" class="bt">uncertainty</text><rect x="390" y="510" width="775" height="70" rx="9" fill="#fee2e2" stroke="#e11d48" stroke-width="2"/><text x="777" y="538" text-anchor="middle" class="bh">Never use pseudo-labels, labeling-function votes, or active queries as test truth.</text><text x="777" y="566" text-anchor="middle" class="small">Report performance versus annotation cost, not only versus training iterations or total unlabeled observations.</text></svg>