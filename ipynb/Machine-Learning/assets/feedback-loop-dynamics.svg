<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
<title id="title">Predictions can create their own future training distribution</title>
<desc id="desc">Scores affect decisions, exposure, observed labels, and the next trained model.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
  </marker>
</defs>
<style>
text { font-family: Arial, Helvetica, sans-serif; letter-spacing: 0; fill: #1f2937; }
.title { font-size: 25px; font-weight: 700; }
.subtitle { font-size: 14px; fill: #4b5563; }
.head { font-size: 16px; font-weight: 700; }
.body { font-size: 13px; }
.small { font-size: 12px; fill: #4b5563; }
.formula { font-family: "Courier New", monospace; font-size: 13px; }
.box { stroke-width: 1.4; rx: 7; }
.arrow { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#arrow); }
.dash { stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 7 5; fill: none; marker-end: url(#arrow); }
.line { stroke: #6b7280; stroke-width: 1.5; fill: none; }
</style>
<rect width="1000" height="420" fill="#ffffff"/>
<text x="40" y="42" class="title" text-anchor="start">Predictions can create their own future training distribution</text>
<text x="40" y="68" class="subtitle" text-anchor="start">Scores affect decisions, exposure, observed labels, and the next trained model.</text>
<rect x="55" y="125" width="185" height="155" class="box" fill="#dbeafe" stroke="#374151"/><text x="147" y="154" class="head" text-anchor="middle">Model score</text><text x="69" y="181" class="body" text-anchor="start"><tspan x="69" dy="0">ranks or filters</tspan><tspan x="69" dy="19">changes exposure</tspan></text><path d="M 240 202 L 315 202" class="arrow"/><rect x="315" y="125" width="185" height="155" class="box" fill="#dcfce7" stroke="#374151"/><text x="407" y="154" class="head" text-anchor="middle">Decision</text><text x="329" y="181" class="body" text-anchor="start"><tspan x="329" dy="0">selects cases</tspan><tspan x="329" dy="19">allocates action</tspan></text><path d="M 500 202 L 575 202" class="arrow"/><rect x="575" y="125" width="185" height="155" class="box" fill="#fef3c7" stroke="#374151"/><text x="667" y="154" class="head" text-anchor="middle">Observed data</text><text x="589" y="181" class="body" text-anchor="start"><tspan x="589" dy="0">selective labels</tspan><tspan x="589" dy="19">behavior adapts</tspan></text><path d="M 760 202 L 835 202" class="arrow"/><rect x="835" y="125" width="130" height="155" class="box" fill="#fee2e2" stroke="#374151"/><text x="900" y="154" class="head" text-anchor="middle">Training</text><text x="849" y="181" class="body" text-anchor="start"><tspan x="849" dy="0">new sample</tspan><tspan x="849" dy="19">new model</tspan></text><path d="M 900 280 C 900 365, 145 365, 145 283" class="dash"/><text x="500" y="380" class="head" text-anchor="middle">The model changes the data-generating process; logged outcomes are not a passive sample of the world.</text>
</svg>
