<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">One linear predictor supports several supervised model families</title>
  <desc id="desc">Features may be expanded, combined into a linear predictor, then mapped through distribution-specific inverse links for Gaussian, Bernoulli, and Poisson outcomes.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <style>
      .title{font:700 29px Arial,sans-serif;fill:#0f172a}.head{font:700 19px Arial,sans-serif;fill:#0f172a}.body{font:16px Arial,sans-serif;fill:#1e293b}.small{font:14px Arial,sans-serif;fill:#475569}.box{fill:#fff;stroke:#64748b;stroke-width:2}.arrow{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="650" fill="#f8fafc"/>
  <text x="600" y="42" text-anchor="middle" class="title">Linear refers to the predictor, not necessarily to the final response curve</text>

  <rect x="35" y="175" width="190" height="205" rx="8" class="box"/>
  <text x="130" y="213" text-anchor="middle" class="head">Observed features x</text>
  <circle cx="82" cy="265" r="11" fill="#2563eb"/><text x="105" y="271" class="body">numeric</text>
  <circle cx="82" cy="310" r="11" fill="#16a34a"/><text x="105" y="316" class="body">categorical</text>
  <circle cx="82" cy="355" r="11" fill="#db2777"/><text x="105" y="361" class="body">interactions</text>

  <path d="M225 278 H280" class="arrow"/>
  <rect x="285" y="175" width="205" height="205" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="387" y="213" text-anchor="middle" class="head">Feature map phi(x)</text>
  <text x="387" y="257" text-anchor="middle" class="body">identity</text>
  <text x="387" y="292" text-anchor="middle" class="body">polynomial terms</text>
  <text x="387" y="327" text-anchor="middle" class="body">spline bases</text>
  <text x="387" y="362" text-anchor="middle" class="small">still fixed before fitting beta</text>

  <path d="M490 278 H545" class="arrow"/>
  <rect x="550" y="155" width="265" height="245" rx="8" fill="#eef2ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="682" y="202" text-anchor="middle" class="head">Linear predictor</text>
  <text x="682" y="257" text-anchor="middle" style="font:700 24px Georgia,serif;fill:#4c1d95">eta = beta0 + phi(x)^T beta</text>
  <line x1="585" y1="285" x2="780" y2="285" stroke="#c4b5fd" stroke-width="2"/>
  <text x="682" y="325" text-anchor="middle" class="body">one weighted sum</text>
  <text x="682" y="357" text-anchor="middle" class="small">regularization constrains beta</text>

  <path d="M815 278 H855 V130 H885" class="arrow"/>
  <path d="M815 278 H885" class="arrow"/>
  <path d="M815 278 H855 V426 H885" class="arrow"/>

  <rect x="890" y="65" width="275" height="145" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="1027" y="101" text-anchor="middle" class="head">Gaussian / identity</text>
  <text x="1027" y="137" text-anchor="middle" class="body">mu = eta</text>
  <text x="1027" y="169" text-anchor="middle" class="small">real-valued response; squared loss</text>

  <rect x="890" y="235" width="275" height="145" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="1027" y="271" text-anchor="middle" class="head">Bernoulli / logit</text>
  <text x="1027" y="307" text-anchor="middle" class="body">mu = sigmoid(eta)</text>
  <text x="1027" y="339" text-anchor="middle" class="small">probability in [0, 1]; log loss</text>

  <rect x="890" y="405" width="275" height="145" rx="8" fill="#fdf2f8" stroke="#db2777" stroke-width="2"/>
  <text x="1027" y="441" text-anchor="middle" class="head">Poisson / log</text>
  <text x="1027" y="477" text-anchor="middle" class="body">mu = exp(eta)</text>
  <text x="1027" y="509" text-anchor="middle" class="small">nonnegative rate; Poisson deviance</text>

  <rect x="95" y="500" width="720" height="95" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <text x="455" y="536" text-anchor="middle" class="head">Interpretation follows the scale of eta and the chosen link</text>
  <text x="455" y="569" text-anchor="middle" class="body">A coefficient is a slope, log-odds change, or log-rate change depending on the model.</text>
</svg>
