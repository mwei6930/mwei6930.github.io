<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="415" viewBox="0 0 1000 415" role="img" aria-labelledby="title desc">
<title id="title">Causal discovery searches for a graph or equivalence class</title>
<desc id="desc">Constraint-based and score-based algorithms rely on strong structural and statistical assumptions.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
  </marker>
</defs>
<style>
text { font-family: Arial, Helvetica, sans-serif; letter-spacing: 0; fill: #1f2937; }
.title { font-size: 25px; font-weight: 700; }
.subtitle { font-size: 14px; fill: #4b5563; }
.head { font-size: 16px; font-weight: 700; }
.body { font-size: 13px; }
.small { font-size: 12px; fill: #4b5563; }
.formula { font-family: "Courier New", monospace; font-size: 13px; }
.box { stroke-width: 1.4; rx: 7; }
.arrow { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#arrow); }
.dash { stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 7 5; fill: none; marker-end: url(#arrow); }
.blocked { stroke: #dc2626; stroke-width: 3; }
</style>
<rect width="1000" height="415" fill="#ffffff"/>
<text x="40" y="42" class="title" text-anchor="start">Causal discovery searches for a graph or equivalence class</text>
<text x="40" y="68" class="subtitle" text-anchor="start">Constraint-based and score-based algorithms rely on strong structural and statistical assumptions.</text>
<rect x="35" y="105" width="275" height="225" class="box" fill="#dbeafe" stroke="#374151"/><text x="172" y="133" class="head" text-anchor="middle">Constraint based</text><text x="49" y="159" class="body" text-anchor="start"><tspan x="49" dy="0">Test conditional independence</tspan><tspan x="49" dy="19">Remove incompatible edges</tspan><tspan x="49" dy="19">Orient colliders and rules</tspan></text><rect x="362" y="105" width="275" height="225" class="box" fill="#dcfce7" stroke="#374151"/><text x="499" y="133" class="head" text-anchor="middle">Score based</text><text x="376" y="159" class="body" text-anchor="start"><tspan x="376" dy="0">Choose a graph score</tspan><tspan x="376" dy="19">Search equivalence classes</tspan><tspan x="376" dy="19">Trade fit and complexity</tspan></text><rect x="689" y="105" width="275" height="225" class="box" fill="#fef3c7" stroke="#374151"/><text x="826" y="133" class="head" text-anchor="middle">What data identify</text><text x="703" y="159" class="body" text-anchor="start"><tspan x="703" dy="0">Often a CPDAG, not one DAG</tspan><tspan x="703" dy="19">Assumptions drive directions</tspan><tspan x="703" dy="19">Interventions add information</tspan></text><path d="M 310 215 L 362 215" class="arrow"/><path d="M 637 215 L 689 215" class="arrow"/><text x="500" y="370" class="head" text-anchor="middle">Discovery proposes graphs under assumptions; it does not turn correlation into certainty.</text>
</svg>
