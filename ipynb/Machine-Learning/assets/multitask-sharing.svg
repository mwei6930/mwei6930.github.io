<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="665" viewBox="0 0 1200 665" role="img" aria-labelledby="title desc">
<title id="title">Hard and soft parameter sharing in multi-task learning</title><desc id="desc">Hard sharing uses one trunk with task-specific heads; soft sharing keeps separate models coupled by a parameter or representation regularizer.</desc>
<defs><marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#475569"/></marker>
<style>.title{font:700 26px Arial,sans-serif;fill:#17212b}.bh{font:700 19px Arial,sans-serif;fill:#17212b}.bt{font:15px Arial,sans-serif;fill:#334155}.small{font:14px Arial,sans-serif;fill:#526172}.arrow{stroke:#475569;stroke-width:3;marker-end:url(#arrowhead)}.node{stroke:#334155;stroke-width:2}</style></defs>
<rect width="1200" height="665" fill="#ffffff"/>
<text x="600" y="42" text-anchor="middle" class="title">Hard and soft parameter sharing in multi-task learning</text>
<text x="290" y="92" text-anchor="middle" class="bh">Hard parameter sharing</text><rect x="50" y="125" width="180" height="120" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="140.0" y="163" text-anchor="middle" class="bh">Task A input</text><rect x="350" y="125" width="180" height="120" rx="10" fill="#f3e8ff" stroke="#9333ea" stroke-width="3"/><text x="440.0" y="163" text-anchor="middle" class="bh">Task B input</text><line x1="140" y1="245" x2="290" y2="300" class="arrow"/><line x1="440" y1="245" x2="290" y2="300" class="arrow"/><rect x="180" y="300" width="220" height="135" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="3"/><text x="290.0" y="338" text-anchor="middle" class="bh">Shared trunk</text><text x="290.0" y="372" text-anchor="middle" class="bt">one representation</text><line x1="240" y1="435" x2="150" y2="500" class="arrow"/><line x1="340" y1="435" x2="430" y2="500" class="arrow"/><rect x="65" y="500" width="170" height="90" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="150.0" y="538" text-anchor="middle" class="bh">Head A</text><rect x="345" y="500" width="170" height="90" rx="10" fill="#f3e8ff" stroke="#9333ea" stroke-width="3"/><text x="430.0" y="538" text-anchor="middle" class="bh">Head B</text><line x1="600" y1="80" x2="600" y2="600" stroke="#cbd5e1" stroke-width="3"/><text x="900" y="92" text-anchor="middle" class="bh">Soft parameter sharing</text><rect x="665" y="145" width="200" height="270" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="765.0" y="183" text-anchor="middle" class="bh">Task A model</text><text x="765.0" y="217" text-anchor="middle" class="bt">private encoder</text><text x="765.0" y="244" text-anchor="middle" class="bt">private head</text><text x="765.0" y="271" text-anchor="middle" class="bt">parameters theta_A</text><rect x="935" y="145" width="200" height="270" rx="10" fill="#f3e8ff" stroke="#9333ea" stroke-width="3"/><text x="1035.0" y="183" text-anchor="middle" class="bh">Task B model</text><text x="1035.0" y="217" text-anchor="middle" class="bt">private encoder</text><text x="1035.0" y="244" text-anchor="middle" class="bt">private head</text><text x="1035.0" y="271" text-anchor="middle" class="bt">parameters theta_B</text><line x1="865" y1="280" x2="935" y2="280" stroke="#e8590c" stroke-width="5" stroke-dasharray="9 7"/><text x="900" y="465" text-anchor="middle" class="bh">coupling penalty</text><text x="900" y="495" text-anchor="middle" class="small">similarity, low-rank basis, attention, or cross-stitch</text><text x="600" y="635" text-anchor="middle" class="small">Sharing is a hypothesis about task relatedness, not a guarantee that all tasks benefit.</text></svg>