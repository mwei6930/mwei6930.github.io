<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="370" viewBox="0 0 1000 370" role="img" aria-labelledby="title desc">
<title id="title">DQN adds stabilizers around a neural Q-function</title>
<desc id="desc">Experience replay and a delayed target network reduce moving-target and correlation problems.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
  </marker>
</defs>
<style>
text { font-family: Arial, Helvetica, sans-serif; letter-spacing: 0; fill: #1f2937; }
.title { font-size: 25px; font-weight: 700; }
.subtitle { font-size: 14px; fill: #4b5563; }
.head { font-size: 16px; font-weight: 700; }
.body { font-size: 13px; }
.small { font-size: 12px; fill: #4b5563; }
.formula { font-family: "Courier New", monospace; font-size: 13px; }
.box { stroke: #374151; stroke-width: 1.4; rx: 8; }
.soft { stroke: #9ca3af; stroke-width: 1.2; rx: 8; }
.arrow { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#arrow); }
.dash { stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 7 5; fill: none; marker-end: url(#arrow); }
</style>
<rect width="1000" height="370" fill="#ffffff"/>
<text x="40" y="42" class="title" text-anchor="start">DQN adds stabilizers around a neural Q-function</text>
<text x="40" y="67" class="subtitle" text-anchor="start">Experience replay and a delayed target network reduce moving-target and correlation problems.</text>
<rect x="35" y="105" width="205" height="210" class="box" fill="#dbeafe" stroke="#374151"/><text x="137" y="132" class="head" text-anchor="middle">Online network</text><text x="49" y="158" class="body" text-anchor="start"><tspan x="49" dy="0">Q_θ(s,a)</tspan><tspan x="49" dy="19">selects actions</tspan><tspan x="49" dy="19">updated by SGD</tspan></text><rect x="285" y="105" width="205" height="210" class="box" fill="#fef3c7" stroke="#374151"/><text x="387" y="132" class="head" text-anchor="middle">Replay buffer</text><text x="299" y="158" class="body" text-anchor="start"><tspan x="299" dy="0">stores transitions</tspan><tspan x="299" dy="19">breaks correlation</tspan><tspan x="299" dy="19">reuses experience</tspan></text><rect x="535" y="105" width="205" height="210" class="box" fill="#dcfce7" stroke="#374151"/><text x="637" y="132" class="head" text-anchor="middle">Target network</text><text x="549" y="158" class="body" text-anchor="start"><tspan x="549" dy="0">Q_θ−</tspan><tspan x="549" dy="19">slowly copied</tspan><tspan x="549" dy="19">stabilizes targets</tspan></text><rect x="785" y="105" width="180" height="210" class="box" fill="#fee2e2" stroke="#374151"/><text x="875" y="132" class="head" text-anchor="middle">TD loss</text><text x="799" y="158" class="body" text-anchor="start"><tspan x="799" dy="0">r + γ max Q_θ−</tspan><tspan x="799" dy="19">minus Q_θ</tspan><tspan x="799" dy="19">Huber / clipping</tspan></text><path d="M 240 210 L 285 210" class="arrow"/><path d="M 490 210 L 535 210" class="arrow"/><path d="M 740 210 L 785 210" class="arrow"/>
</svg>
