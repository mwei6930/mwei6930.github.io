<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410" role="img" aria-labelledby="title desc">
<title id="title">Select a feasible point, not the largest model</title>
<desc id="desc">Diminishing utility gains meet latency, memory, energy, and cost budgets on a resource frontier.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
  </marker>
</defs>
<style>
text { font-family: Arial, Helvetica, sans-serif; letter-spacing: 0; fill: #1f2937; }
.title { font-size: 25px; font-weight: 700; }
.subtitle { font-size: 14px; fill: #4b5563; }
.head { font-size: 16px; font-weight: 700; }
.body { font-size: 13px; }
.small { font-size: 12px; fill: #4b5563; }
.formula { font-family: "Courier New", monospace; font-size: 13px; }
.box { stroke-width: 1.4; rx: 7; }
.arrow { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#arrow); }
.dash { stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 7 5; fill: none; marker-end: url(#arrow); }
.line { stroke: #6b7280; stroke-width: 1.5; fill: none; }
</style>
<rect width="1000" height="410" fill="#ffffff"/>
<text x="40" y="42" class="title" text-anchor="start">Select a feasible point, not the largest model</text>
<text x="40" y="68" class="subtitle" text-anchor="start">Diminishing utility gains meet latency, memory, energy, and cost budgets on a resource frontier.</text>
<path d="M 120 325 L 900 325 M 120 325 L 120 105" class="line"/><text x="505" y="370" class="head" text-anchor="middle">Compute / latency / memory cost</text><text x="55" y="215" class="head" text-anchor="middle">Utility</text><circle cx="205" cy="286" r="8" fill="#2563eb"/><text x="205" y="270" class="small" text-anchor="middle">baseline</text><circle cx="350" cy="230" r="8" fill="#2563eb"/><text x="350" y="214" class="small" text-anchor="middle">better features</text><path d="M 205 286 L 350 230" stroke="#2563eb" stroke-width="2" fill="none"/><circle cx="520" cy="180" r="8" fill="#2563eb"/><text x="520" y="164" class="small" text-anchor="middle">larger model</text><path d="M 350 230 L 520 180" stroke="#2563eb" stroke-width="2" fill="none"/><circle cx="705" cy="145" r="8" fill="#2563eb"/><text x="705" y="129" class="small" text-anchor="middle">ensemble</text><path d="M 520 180 L 705 145" stroke="#2563eb" stroke-width="2" fill="none"/><circle cx="855" cy="133" r="8" fill="#2563eb"/><text x="855" y="117" class="small" text-anchor="middle">maximum scale</text><path d="M 705 145 L 855 133" stroke="#2563eb" stroke-width="2" fill="none"/><path d="M 120 155 L 900 155" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6 5"/><text x="895" y="145" class="small" text-anchor="end">required utility</text><path d="M 620 325 L 620 105" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="6 5"/><text x="628" y="118" class="small" text-anchor="start">resource budget</text>
</svg>
