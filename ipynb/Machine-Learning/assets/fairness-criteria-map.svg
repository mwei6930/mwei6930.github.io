<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="415" viewBox="0 0 1000 415" role="img" aria-labelledby="title desc">
<title id="title">Fairness metrics encode different conditional independences</title>
<desc id="desc">Selection parity, error-rate parity, predictive parity, and calibration answer different normative questions.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
  </marker>
</defs>
<style>
text { font-family: Arial, Helvetica, sans-serif; letter-spacing: 0; fill: #1f2937; }
.title { font-size: 25px; font-weight: 700; }
.subtitle { font-size: 14px; fill: #4b5563; }
.head { font-size: 16px; font-weight: 700; }
.body { font-size: 13px; }
.small { font-size: 12px; fill: #4b5563; }
.formula { font-family: "Courier New", monospace; font-size: 13px; }
.box { stroke-width: 1.4; rx: 7; }
.arrow { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#arrow); }
.dash { stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 7 5; fill: none; marker-end: url(#arrow); }
.axis { stroke: #6b7280; stroke-width: 1.3; fill: none; }
</style>
<rect width="1000" height="415" fill="#ffffff"/>
<text x="40" y="42" class="title" text-anchor="start">Fairness metrics encode different conditional independences</text>
<text x="40" y="68" class="subtitle" text-anchor="start">Selection parity, error-rate parity, predictive parity, and calibration answer different normative questions.</text>
<rect x="35" y="105" width="210" height="225" class="box" fill="#dbeafe" stroke="#374151"/><text x="140" y="134" class="head" text-anchor="middle">Demographic parity</text><text x="49" y="161" class="body" text-anchor="start"><tspan x="49" dy="0">Ŷ independent of A</tspan><tspan x="49" dy="19">Equal selection rates</tspan><tspan x="49" dy="19">Ignores labels</tspan></text><rect x="275" y="105" width="210" height="225" class="box" fill="#dcfce7" stroke="#374151"/><text x="380" y="134" class="head" text-anchor="middle">Equalized odds</text><text x="289" y="161" class="body" text-anchor="start"><tspan x="289" dy="0">Ŷ independent of A | Y</tspan><tspan x="289" dy="19">Equal TPR and FPR</tspan><tspan x="289" dy="19">Error-rate criterion</tspan></text><rect x="515" y="105" width="210" height="225" class="box" fill="#fef3c7" stroke="#374151"/><text x="620" y="134" class="head" text-anchor="middle">Predictive parity</text><text x="529" y="161" class="body" text-anchor="start"><tspan x="529" dy="0">Y independent of A | Ŷ</tspan><tspan x="529" dy="19">Equal precision</tspan><tspan x="529" dy="19">Decision meaning</tspan></text><rect x="755" y="105" width="210" height="225" class="box" fill="#fee2e2" stroke="#374151"/><text x="860" y="134" class="head" text-anchor="middle">Calibration</text><text x="769" y="161" class="body" text-anchor="start"><tspan x="769" dy="0">P(Y=1 | score=s,A)=s</tspan><tspan x="769" dy="19">Score reliability</tspan><tspan x="769" dy="19">Within-group property</tspan></text><text x="500" y="370" class="head" text-anchor="middle">With unequal base rates and imperfect prediction, these criteria generally conflict.</text>
</svg>
