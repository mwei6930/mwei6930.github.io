<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
<title id="title">A staged fine-tuning strategy</title><desc id="desc">A pretrained encoder is first frozen for a target probe, then upper layers are unfrozen, and finally full fine-tuning is considered only with sufficient target evidence.</desc>
<defs><marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#475569"/></marker>
<style>.title{font:700 26px Arial,sans-serif;fill:#17212b}.bh{font:700 19px Arial,sans-serif;fill:#17212b}.bt{font:15px Arial,sans-serif;fill:#334155}.small{font:14px Arial,sans-serif;fill:#526172}.arrow{stroke:#475569;stroke-width:3;marker-end:url(#arrowhead)}.node{stroke:#334155;stroke-width:2}</style></defs>
<rect width="1200" height="570" fill="#ffffff"/>
<text x="600" y="42" text-anchor="middle" class="title">A staged fine-tuning strategy</text>
<rect x="35" y="170" width="210" height="190" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="140.0" y="208" text-anchor="middle" class="bh">Pretrained model</text><text x="140.0" y="242" text-anchor="middle" class="bt">source encoder</text><text x="140.0" y="269" text-anchor="middle" class="bt">general features</text><text x="140.0" y="296" text-anchor="middle" class="bt">source head</text><line x1="245" y1="265" x2="325" y2="265" class="arrow"/><rect x="340" y="95" width="235" height="335" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="3"/><text x="457.5" y="133" text-anchor="middle" class="bh">Stage 1: probe</text><text x="457.5" y="167" text-anchor="middle" class="bt">replace output head</text><text x="457.5" y="194" text-anchor="middle" class="bt">freeze encoder</text><text x="457.5" y="221" text-anchor="middle" class="bt">train target head</text><text x="457.5" y="248" text-anchor="middle" class="bt">measure feature utility</text><line x1="575" y1="265" x2="655" y2="265" class="arrow"/><rect x="670" y="95" width="235" height="335" rx="10" fill="#fff7ed" stroke="#e8590c" stroke-width="3"/><text x="787.5" y="133" text-anchor="middle" class="bh">Stage 2: partial tune</text><text x="787.5" y="167" text-anchor="middle" class="bt">unfreeze upper blocks</text><text x="787.5" y="194" text-anchor="middle" class="bt">small learning rate</text><text x="787.5" y="221" text-anchor="middle" class="bt">regularize toward source</text><text x="787.5" y="248" text-anchor="middle" class="bt">monitor target validation</text><line x1="905" y1="265" x2="985" y2="265" class="arrow"/><rect x="1000" y="95" width="165" height="335" rx="10" fill="#f3e8ff" stroke="#9333ea" stroke-width="3"/><text x="1082.5" y="133" text-anchor="middle" class="bh">Stage 3</text><text x="1082.5" y="167" text-anchor="middle" class="bt">full tune</text><text x="1082.5" y="194" text-anchor="middle" class="bt">only when</text><text x="1082.5" y="221" text-anchor="middle" class="bt">labels justify</text><text x="1082.5" y="248" text-anchor="middle" class="bt">greater freedom</text><text x="600" y="500" text-anchor="middle" class="bh">Increase target-specific capacity only when validation evidence supports it.</text><text x="600" y="535" text-anchor="middle" class="small">Use lower learning rates for reusable parameters and larger rates for a newly initialized head.</text></svg>