<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="405" viewBox="0 0 1000 405" role="img" aria-labelledby="title desc">
<title id="title">Privacy leakage can cross several system boundaries</title>
<desc id="desc">Training records can leak through parameters, gradients, outputs, repeated queries, or operational side channels.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
  </marker>
</defs>
<style>
text { font-family: Arial, Helvetica, sans-serif; letter-spacing: 0; fill: #1f2937; }
.title { font-size: 25px; font-weight: 700; }
.subtitle { font-size: 14px; fill: #4b5563; }
.head { font-size: 16px; font-weight: 700; }
.body { font-size: 13px; }
.small { font-size: 12px; fill: #4b5563; }
.formula { font-family: "Courier New", monospace; font-size: 13px; }
.box { stroke-width: 1.4; rx: 7; }
.arrow { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#arrow); }
.dash { stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 7 5; fill: none; marker-end: url(#arrow); }
.axis { stroke: #6b7280; stroke-width: 1.3; fill: none; }
</style>
<rect width="1000" height="405" fill="#ffffff"/>
<text x="40" y="42" class="title" text-anchor="start">Privacy leakage can cross several system boundaries</text>
<text x="40" y="68" class="subtitle" text-anchor="start">Training records can leak through parameters, gradients, outputs, repeated queries, or operational side channels.</text>
<rect x="35" y="110" width="210" height="210" class="box" fill="#fee2e2" stroke="#374151"/><text x="140" y="139" class="head" text-anchor="middle">Training data</text><text x="49" y="166" class="body" text-anchor="start"><tspan x="49" dy="0">Membership inference</tspan><tspan x="49" dy="19">Attribute inference</tspan><tspan x="49" dy="19">Data reconstruction</tspan></text><path d="M 245 215 L 300 215" class="arrow"/><rect x="300" y="110" width="210" height="210" class="box" fill="#dbeafe" stroke="#374151"/><text x="405" y="139" class="head" text-anchor="middle">Model</text><text x="314" y="166" class="body" text-anchor="start"><tspan x="314" dy="0">Parameter access</tspan><tspan x="314" dy="19">Gradient leakage</tspan><tspan x="314" dy="19">Memorized records</tspan></text><path d="M 510 215 L 565 215" class="arrow"/><rect x="565" y="110" width="180" height="210" class="box" fill="#dcfce7" stroke="#374151"/><text x="655" y="139" class="head" text-anchor="middle">Interface</text><text x="579" y="166" class="body" text-anchor="start"><tspan x="579" dy="0">Scores or labels</tspan><tspan x="579" dy="19">Repeated queries</tspan><tspan x="579" dy="19">Side channels</tspan></text><path d="M 745 215 L 800 215" class="arrow"/><rect x="800" y="110" width="165" height="210" class="box" fill="#fef3c7" stroke="#374151"/><text x="882" y="139" class="head" text-anchor="middle">Attacker</text><text x="814" y="166" class="body" text-anchor="start"><tspan x="814" dy="0">Auxiliary data</tspan><tspan x="814" dy="19">Adaptive strategy</tspan><tspan x="814" dy="19">Chosen target</tspan></text><text x="500" y="360" class="head" text-anchor="middle">Privacy must specify the protected unit, attacker knowledge, interface, and release history.</text>
</svg>
