<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Naive Bayes conditional independence factorization</title>
  <desc id="desc">The class variable is a parent of all features, which are assumed independent conditional on the class, allowing the posterior score to be computed as a sum of log likelihood terms.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#495057"/></marker>
    <style>.node{stroke:#495057;stroke-width:2}.class{fill:#fff3bf}.feature{fill:#e7f5ff}.score{fill:#ebfbee}.h{font:700 24px Arial,sans-serif;fill:#212529}.t{font:17px Arial,sans-serif;fill:#343a40}.s{font:15px Arial,sans-serif;fill:#495057}.line{stroke:#495057;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <text x="600" y="38" text-anchor="middle" class="h">Naive Bayes: Dependence Through the Class</text>
  <circle cx="600" cy="125" r="62" class="node class"/>
  <text x="600" y="119" text-anchor="middle" class="h">Y</text>
  <text x="600" y="146" text-anchor="middle" class="s">class</text>
  <circle cx="180" cy="300" r="67" class="node feature"/><text x="180" y="295" text-anchor="middle" class="h">X1</text><text x="180" y="323" text-anchor="middle" class="s">feature</text>
  <circle cx="460" cy="300" r="67" class="node feature"/><text x="460" y="295" text-anchor="middle" class="h">X2</text><text x="460" y="323" text-anchor="middle" class="s">feature</text>
  <circle cx="740" cy="300" r="67" class="node feature"/><text x="740" y="295" text-anchor="middle" class="h">X3</text><text x="740" y="323" text-anchor="middle" class="s">feature</text>
  <circle cx="1020" cy="300" r="67" class="node feature"/><text x="1020" y="295" text-anchor="middle" class="h">Xd</text><text x="1020" y="323" text-anchor="middle" class="s">feature</text>
  <path d="M555 166 L225 257" class="line"/><path d="M580 184 L478 227" class="line"/><path d="M620 184 L722 227" class="line"/><path d="M645 166 L975 257" class="line"/>
  <text x="600" y="405" text-anchor="middle" class="t">Assumption: p(x1, ..., xd | y) = product of p(xj | y)</text>
  <rect x="170" y="455" width="860" height="105" rx="6" class="node score"/>
  <text x="600" y="494" text-anchor="middle" class="h">Stable class score</text>
  <text x="600" y="532" text-anchor="middle" class="t">log p(y = c) + sum over j of log p(xj | y = c)</text>
  <rect x="210" y="580" width="780" height="28" rx="6" fill="#f8f9fa" stroke="#adb5bd"/>
  <text x="600" y="600" text-anchor="middle" class="s">Correlated features can be counted repeatedly, making probabilities too extreme.</text>
</svg>
