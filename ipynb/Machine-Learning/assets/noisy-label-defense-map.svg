<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="625" viewBox="0 0 1200 625" role="img" aria-labelledby="title desc">
<title id="title">Label corruption and three families of defenses</title><desc id="desc">A latent true label passes through a noise transition channel to an observed label, followed by loss correction, sample selection, or label auditing.</desc>
<defs><marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#475569"/></marker>
<style>.title{font:700 26px Arial,sans-serif;fill:#17212b}.bh{font:700 19px Arial,sans-serif;fill:#17212b}.bt{font:15px Arial,sans-serif;fill:#334155}.small{font:14px Arial,sans-serif;fill:#526172}.arrow{stroke:#475569;stroke-width:3;marker-end:url(#arrowhead)}.node{stroke:#334155;stroke-width:2}</style></defs>
<rect width="1200" height="625" fill="#ffffff"/>
<text x="600" y="42" text-anchor="middle" class="title">Label corruption and three families of defenses</text>
<rect x="35" y="165" width="175" height="155" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="122.5" y="203" text-anchor="middle" class="bh">True label y</text><text x="122.5" y="237" text-anchor="middle" class="bt">unobserved</text><line x1="210" y1="240" x2="300" y2="240" class="arrow"/><rect x="315" y="120" width="230" height="245" rx="10" fill="#fee2e2" stroke="#e11d48" stroke-width="3"/><text x="430.0" y="158" text-anchor="middle" class="bh">Noise channel T</text><text x="430.0" y="192" text-anchor="middle" class="bt">T_ab=P(y~=b|y=a)</text><text x="430.0" y="219" text-anchor="middle" class="bt">symmetric</text><text x="430.0" y="246" text-anchor="middle" class="bt">class-conditional</text><text x="430.0" y="273" text-anchor="middle" class="bt">instance-dependent</text><line x1="545" y1="240" x2="635" y2="240" class="arrow"/><rect x="650" y="165" width="190" height="155" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="745.0" y="203" text-anchor="middle" class="bh">Observed y~</text><text x="745.0" y="237" text-anchor="middle" class="bt">used for training</text><line x1="840" y1="200" x2="930" y2="125" class="arrow"/><line x1="840" y1="240" x2="930" y2="240" class="arrow"/><line x1="840" y1="280" x2="930" y2="355" class="arrow"/><rect x="945" y="65" width="220" height="130" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="3"/><text x="1055.0" y="103" text-anchor="middle" class="bh">Correct the loss</text><text x="1055.0" y="137" text-anchor="middle" class="bt">forward / backward T</text><rect x="945" y="215" width="220" height="130" rx="10" fill="#f3e8ff" stroke="#9333ea" stroke-width="3"/><text x="1055.0" y="253" text-anchor="middle" class="bh">Select or reweight</text><text x="1055.0" y="287" text-anchor="middle" class="bt">small loss, agreement</text><rect x="945" y="365" width="220" height="130" rx="10" fill="#fff7ed" stroke="#e8590c" stroke-width="3"/><text x="1055.0" y="403" text-anchor="middle" class="bh">Audit or relabel</text><text x="1055.0" y="437" text-anchor="middle" class="bt">out-of-fold label quality</text><text x="600" y="555" text-anchor="middle" class="bh">A defense is valid only for the noise mechanism it actually models.</text><text x="600" y="590" text-anchor="middle" class="small">Transition correction needs an identifiable T; small-loss filtering can remove hard clean cases; relabeling needs human capacity.</text></svg>