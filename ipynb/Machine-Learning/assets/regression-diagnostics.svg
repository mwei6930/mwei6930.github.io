<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Regression evaluation combines scalar errors with residual structure</title><desc id="desc">Actual-versus-predicted and residual plots reveal patterns hidden by MAE, RMSE and R squared.</desc>
  <style>.t{font:700 28px Arial,sans-serif;fill:#0f172a}.h{font:700 19px Arial,sans-serif;fill:#0f172a}.b{font:15px Arial,sans-serif;fill:#334155}.s{font:13px Arial,sans-serif;fill:#475569}.panel{fill:#fff;stroke:#64748b;stroke-width:2}.axis{stroke:#334155;stroke-width:2}.grid{stroke:#cbd5e1;stroke-width:1}.pt{fill:#2563eb;opacity:.78}</style>
  <rect width="1200" height="650" fill="#f8fafc"/><text x="600" y="42" text-anchor="middle" class="t">Regression evaluation combines scalar errors with residual structure</text>
  <rect x="35" y="78" width="350" height="480" rx="8" class="panel"/><text x="210" y="112" text-anchor="middle" class="h">Actual versus predicted</text>
  <line x1="90" y1="490" x2="340" y2="490" class="axis"/><line x1="90" y1="490" x2="90" y2="155" class="axis"/><line x1="105" y1="470" x2="325" y2="175" stroke="#16a34a" stroke-width="3" stroke-dasharray="8 6"/>
  <g class="pt"><circle cx="118" cy="451" r="7"/><circle cx="137" cy="430" r="7"/><circle cx="158" cy="410" r="7"/><circle cx="178" cy="385" r="7"/><circle cx="202" cy="368" r="7"/><circle cx="218" cy="335" r="7"/><circle cx="244" cy="329" r="7"/><circle cx="263" cy="286" r="7"/><circle cx="287" cy="248" r="7"/><circle cx="306" cy="225" r="7"/><circle cx="322" cy="198" r="7"/></g>
  <circle cx="305" cy="350" r="9" fill="#ef4444"/><text x="292" y="374" class="s">large error</text><text x="215" y="525" text-anchor="middle" class="b">predicted value</text><text transform="translate(60,335) rotate(-90)" text-anchor="middle" class="b">observed value</text><text x="210" y="548" text-anchor="middle" class="s">distance from the diagonal shows error</text>

  <rect x="425" y="78" width="350" height="480" rx="8" class="panel"/><text x="600" y="112" text-anchor="middle" class="h">Residual versus prediction</text>
  <line x1="480" y1="325" x2="730" y2="325" stroke="#16a34a" stroke-width="3" stroke-dasharray="8 6"/><line x1="480" y1="490" x2="730" y2="490" class="axis"/><line x1="480" y1="490" x2="480" y2="155" class="axis"/>
  <g fill="#7c3aed" opacity=".8"><circle cx="505" cy="318" r="6"/><circle cx="520" cy="330" r="6"/><circle cx="538" cy="310" r="6"/><circle cx="555" cy="343" r="6"/><circle cx="575" cy="296" r="6"/><circle cx="594" cy="355" r="6"/><circle cx="615" cy="275" r="6"/><circle cx="635" cy="382" r="6"/><circle cx="655" cy="245" r="6"/><circle cx="674" cy="401" r="6"/><circle cx="695" cy="214" r="6"/><circle cx="714" cy="434" r="6"/></g>
  <path d="M500 322 Q610 260 720 205 M500 328 Q610 390 720 445" stroke="#f59e0b" stroke-width="2" fill="none"/><text x="625" y="190" class="s">variance grows with scale</text><text x="605" y="525" text-anchor="middle" class="b">predicted value</text><text transform="translate(450,335) rotate(-90)" text-anchor="middle" class="b">residual y - y-hat</text><text x="600" y="548" text-anchor="middle" class="s">shape reveals bias, heteroscedasticity and drift</text>

  <rect x="815" y="78" width="350" height="480" rx="8" class="panel"/><text x="990" y="105" text-anchor="middle" class="h">Scalar summaries</text><text x="990" y="128" text-anchor="middle" class="b">answer different questions</text>
  <rect x="845" y="145" width="290" height="70" rx="6" fill="#eff6ff" stroke="#2563eb"/><text x="865" y="173" class="h">MAE</text><text x="865" y="198" class="b">typical absolute miss; linear penalty</text>
  <rect x="845" y="225" width="290" height="70" rx="6" fill="#fff7ed" stroke="#ea580c"/><text x="865" y="253" class="h">RMSE</text><text x="865" y="278" class="b">emphasizes occasional large misses</text>
  <rect x="845" y="305" width="290" height="70" rx="6" fill="#ecfdf5" stroke="#16a34a"/><text x="865" y="333" class="h">R-squared</text><text x="865" y="358" class="b">improvement over a mean baseline</text>
  <rect x="845" y="385" width="290" height="70" rx="6" fill="#fdf2f8" stroke="#db2777"/><text x="865" y="413" class="h">Quantile / pinball</text><text x="865" y="438" class="b">asymmetric under- and overprediction</text>
  <text x="990" y="488" text-anchor="middle" class="b">Report target units and a baseline.</text><text x="990" y="515" text-anchor="middle" class="b">Slice residuals by scale and group.</text><text x="600" y="607" text-anchor="middle" class="s">A good average error can coexist with systematic residual structure that makes deployment unsafe.</text>
</svg>
