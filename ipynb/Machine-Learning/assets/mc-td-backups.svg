<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="title desc">
<title id="title">Three routes to a value target</title>
<desc id="desc">Monte Carlo samples complete returns, TD bootstraps from experience, and DP averages through a model.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
  </marker>
</defs>
<style>
text { font-family: Arial, Helvetica, sans-serif; letter-spacing: 0; fill: #1f2937; }
.title { font-size: 25px; font-weight: 700; }
.subtitle { font-size: 14px; fill: #4b5563; }
.head { font-size: 16px; font-weight: 700; }
.body { font-size: 13px; }
.small { font-size: 12px; fill: #4b5563; }
.formula { font-family: "Courier New", monospace; font-size: 13px; }
.box { stroke: #374151; stroke-width: 1.4; rx: 8; }
.soft { stroke: #9ca3af; stroke-width: 1.2; rx: 8; }
.arrow { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#arrow); }
.dash { stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 7 5; fill: none; marker-end: url(#arrow); }
</style>
<rect width="1000" height="400" fill="#ffffff"/>
<text x="40" y="42" class="title" text-anchor="start">Three routes to a value target</text>
<text x="40" y="67" class="subtitle" text-anchor="start">Monte Carlo samples complete returns, TD bootstraps from experience, and DP averages through a model.</text>
<rect x="40" y="105" width="280" height="220" class="box" fill="#dbeafe" stroke="#374151"/><text x="180" y="132" class="head" text-anchor="middle">Monte Carlo</text><text x="54" y="158" class="body" text-anchor="start"><tspan x="54" dy="0">Wait for episode end</tspan><tspan x="54" dy="19">Target: full return G_t</tspan><tspan x="54" dy="19">No bootstrap</tspan><tspan x="54" dy="19">Unbiased, higher variance</tspan></text><rect x="360" y="105" width="280" height="220" class="box" fill="#dcfce7" stroke="#374151"/><text x="500" y="132" class="head" text-anchor="middle">TD(0)</text><text x="374" y="158" class="body" text-anchor="start"><tspan x="374" dy="0">Update every transition</tspan><tspan x="374" dy="19">Target: r + γV(s&#x27;)</tspan><tspan x="374" dy="19">Bootstraps</tspan><tspan x="374" dy="19">Biased, lower variance</tspan></text><rect x="680" y="105" width="280" height="220" class="box" fill="#fef3c7" stroke="#374151"/><text x="820" y="132" class="head" text-anchor="middle">Dynamic programming</text><text x="694" y="158" class="body" text-anchor="start"><tspan x="694" dy="0">Use transition model</tspan><tspan x="694" dy="19">Expected backup</tspan><tspan x="694" dy="19">No sampled target needed</tspan><tspan x="694" dy="19">Planning rather than learning</tspan></text><text x="500" y="360" class="small" text-anchor="middle">The target determines what information is required and where bias or variance enters.</text>
</svg>
