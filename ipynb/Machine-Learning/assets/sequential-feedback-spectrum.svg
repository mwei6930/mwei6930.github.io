<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc">
<title id="title">From prediction to sequential decision making</title>
<desc id="desc">The correct formulation depends on feedback visibility, context, and whether actions affect future states.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
  </marker>
</defs>
<style>
text { font-family: Arial, Helvetica, sans-serif; letter-spacing: 0; fill: #1f2937; }
.title { font-size: 25px; font-weight: 700; }
.subtitle { font-size: 14px; fill: #4b5563; }
.head { font-size: 16px; font-weight: 700; }
.body { font-size: 13px; }
.small { font-size: 12px; fill: #4b5563; }
.formula { font-family: "Courier New", monospace; font-size: 13px; }
.box { stroke: #374151; stroke-width: 1.4; rx: 8; }
.soft { stroke: #9ca3af; stroke-width: 1.2; rx: 8; }
.arrow { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#arrow); }
.dash { stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 7 5; fill: none; marker-end: url(#arrow); }
</style>
<rect width="1000" height="390" fill="#ffffff"/>
<text x="40" y="42" class="title" text-anchor="start">From prediction to sequential decision making</text>
<text x="40" y="67" class="subtitle" text-anchor="start">The correct formulation depends on feedback visibility, context, and whether actions affect future states.</text>
<rect x="35" y="110" width="170" height="150" class="box" fill="#f3f4f6" stroke="#374151"/><text x="120" y="137" class="head" text-anchor="middle">Batch</text><text x="49" y="163" class="body" text-anchor="start"><tspan x="49" dy="0">All examples</tspan><tspan x="49" dy="19">Full targets</tspan><tspan x="49" dy="19">One final model</tspan></text><path d="M 205 185 L 225 185" class="arrow"/><rect x="227" y="110" width="170" height="150" class="box" fill="#dbeafe" stroke="#374151"/><text x="312" y="137" class="head" text-anchor="middle">Online</text><text x="241" y="163" class="body" text-anchor="start"><tspan x="241" dy="0">One round at a time</tspan><tspan x="241" dy="19">Full loss / label</tspan><tspan x="241" dy="19">Static regret</tspan></text><path d="M 397 185 L 417 185" class="arrow"/><rect x="419" y="110" width="170" height="150" class="box" fill="#fef3c7" stroke="#374151"/><text x="504" y="137" class="head" text-anchor="middle">Bandit</text><text x="433" y="163" class="body" text-anchor="start"><tspan x="433" dy="0">Choose one arm</tspan><tspan x="433" dy="19">Chosen reward only</tspan><tspan x="433" dy="19">Explore</tspan></text><path d="M 589 185 L 609 185" class="arrow"/><rect x="611" y="110" width="170" height="150" class="box" fill="#dcfce7" stroke="#374151"/><text x="696" y="137" class="head" text-anchor="middle">Contextual bandit</text><text x="625" y="163" class="body" text-anchor="start"><tspan x="625" dy="0">Observe context</tspan><tspan x="625" dy="19">Chosen reward only</tspan><tspan x="625" dy="19">Personalize</tspan></text><path d="M 781 185 L 801 185" class="arrow"/><rect x="803" y="110" width="170" height="150" class="box" fill="#fee2e2" stroke="#374151"/><text x="888" y="137" class="head" text-anchor="middle">MDP / RL</text><text x="817" y="163" class="body" text-anchor="start"><tspan x="817" dy="0">Action changes state</tspan><tspan x="817" dy="19">Delayed reward</tspan><tspan x="817" dy="19">Long-term return</tspan></text><text x="500" y="310" class="head" text-anchor="middle">Increasingly partial feedback and stronger action consequences</text><path d="M 170 345 L 830 345" class="arrow"/>
</svg>
