<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="title desc">
<title id="title">Distribution shift is not one phenomenon</title>
<desc id="desc">Covariate, label, concept, and subgroup shifts imply different diagnostics and responses.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
  </marker>
</defs>
<style>
text { font-family: Arial, Helvetica, sans-serif; letter-spacing: 0; fill: #1f2937; }
.title { font-size: 25px; font-weight: 700; }
.subtitle { font-size: 14px; fill: #4b5563; }
.head { font-size: 16px; font-weight: 700; }
.body { font-size: 13px; }
.small { font-size: 12px; fill: #4b5563; }
.formula { font-family: "Courier New", monospace; font-size: 13px; }
.box { stroke-width: 1.4; rx: 7; }
.arrow { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#arrow); }
.dash { stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 7 5; fill: none; marker-end: url(#arrow); }
.axis { stroke: #6b7280; stroke-width: 1.3; fill: none; }
</style>
<rect width="1000" height="400" fill="#ffffff"/>
<text x="40" y="42" class="title" text-anchor="start">Distribution shift is not one phenomenon</text>
<text x="40" y="68" class="subtitle" text-anchor="start">Covariate, label, concept, and subgroup shifts imply different diagnostics and responses.</text>
<rect x="35" y="108" width="210" height="205" class="box" fill="#dbeafe" stroke="#374151"/><text x="140" y="137" class="head" text-anchor="middle">Covariate shift</text><text x="49" y="164" class="body" text-anchor="start"><tspan x="49" dy="0">P(X) changes</tspan><tspan x="49" dy="19">P(Y | X) assumed stable</tspan><tspan x="49" dy="19">Reweight or adapt support</tspan></text><rect x="275" y="108" width="210" height="205" class="box" fill="#dcfce7" stroke="#374151"/><text x="380" y="137" class="head" text-anchor="middle">Label shift</text><text x="289" y="164" class="body" text-anchor="start"><tspan x="289" dy="0">P(Y) changes</tspan><tspan x="289" dy="19">P(X | Y) assumed stable</tspan><tspan x="289" dy="19">Adjust class priors</tspan></text><rect x="515" y="108" width="210" height="205" class="box" fill="#fef3c7" stroke="#374151"/><text x="620" y="137" class="head" text-anchor="middle">Concept shift</text><text x="529" y="164" class="body" text-anchor="start"><tspan x="529" dy="0">P(Y | X) changes</tspan><tspan x="529" dy="19">Old rule no longer applies</tspan><tspan x="529" dy="19">Retrain or redesign</tspan></text><rect x="755" y="108" width="210" height="205" class="box" fill="#fee2e2" stroke="#374151"/><text x="860" y="137" class="head" text-anchor="middle">Subgroup shift</text><text x="769" y="164" class="body" text-anchor="start"><tspan x="769" dy="0">Mixture or worst-group changes</tspan><tspan x="769" dy="19">Aggregate score can conceal it</tspan><tspan x="769" dy="19">Slice and monitor</tspan></text><text x="500" y="353" class="head" text-anchor="middle">A shift label is an assumption about which mechanism remained stable.</text>
</svg>
