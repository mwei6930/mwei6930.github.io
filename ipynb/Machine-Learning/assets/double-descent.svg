<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <defs><style>.t{font:700 28px Arial,sans-serif;fill:#1f2937}.h{font:700 20px Arial,sans-serif;fill:#1f2937}.b{font:16px Arial,sans-serif;fill:#374151}.s{font:14px Arial,sans-serif;fill:#475569}.axis{stroke:#334155;stroke-width:3;fill:none}.train{stroke:#64748b;stroke-width:4;fill:none;stroke-dasharray:10 8}.test{stroke:#dc2626;stroke-width:5;fill:none}</style></defs>
  <rect width="1200" height="600" fill="#f8fafc"/>
  <text x="600" y="42" text-anchor="middle" class="t">Classical U-shape and modern double descent</text>
  <g transform="translate(65 92)">
    <text x="235" y="0" text-anchor="middle" class="h">Classical regime</text>
    <path d="M35 410V45M35 410H500" class="axis"/>
    <text x="255" y="462" text-anchor="middle" class="b">effective model capacity</text>
    <text x="-5" y="225" transform="rotate(-90 -5 225)" text-anchor="middle" class="b">risk</text>
    <path d="M55 80 C150 155 250 320 465 355" class="train"/>
    <path d="M55 105 C165 205 220 340 285 335 C365 326 400 215 465 120" class="test"/>
    <text x="391" y="96" class="s" fill="#dc2626">test risk</text><text x="383" y="379" class="s">training risk</text>
    <line x1="286" y1="72" x2="286" y2="410" stroke="#d97706" stroke-width="2" stroke-dasharray="8 7"/>
    <text x="286" y="430" text-anchor="middle" class="s">sweet spot</text>
  </g>
  <g transform="translate(630 92)">
    <text x="235" y="0" text-anchor="middle" class="h">Overparameterized regime</text>
    <path d="M35 410V45M35 410H500" class="axis"/>
    <text x="255" y="462" text-anchor="middle" class="b">effective model capacity</text>
    <text x="-5" y="225" transform="rotate(-90 -5 225)" text-anchor="middle" class="b">risk</text>
    <path d="M55 84 C140 180 190 330 250 365 C340 386 422 387 475 388" class="train"/>
    <path d="M55 110 C140 210 185 335 229 320 C249 310 254 70 279 76 C315 88 310 315 342 326 C388 338 431 255 475 202" class="test"/>
    <line x1="263" y1="50" x2="263" y2="410" stroke="#7c3aed" stroke-width="2" stroke-dasharray="8 7"/>
    <text x="263" y="430" text-anchor="middle" class="s">interpolation threshold</text>
    <text x="68" y="76" class="s" fill="#dc2626">test risk</text><text x="380" y="380" class="s">training risk ≈ 0</text>
    <text x="355" y="225" text-anchor="middle" class="s">second descent</text>
  </g>
  <text x="600" y="575" text-anchor="middle" class="s">Capacity alone does not determine the curve: data, parameterization, optimization, regularization, and noise all matter.</text>
</svg>
