<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="title desc">
<title id="title">On-policy and off-policy targets can imply different behavior</title>
<desc id="desc">With persistent exploration, SARSA accounts for risky exploratory actions while Q-learning targets a greedy policy.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
  </marker>
</defs>
<style>
text { font-family: Arial, Helvetica, sans-serif; letter-spacing: 0; fill: #1f2937; }
.title { font-size: 25px; font-weight: 700; }
.subtitle { font-size: 14px; fill: #4b5563; }
.head { font-size: 16px; font-weight: 700; }
.body { font-size: 13px; }
.small { font-size: 12px; fill: #4b5563; }
.formula { font-family: "Courier New", monospace; font-size: 13px; }
.box { stroke: #374151; stroke-width: 1.4; rx: 8; }
.soft { stroke: #9ca3af; stroke-width: 1.2; rx: 8; }
.arrow { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#arrow); }
.dash { stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 7 5; fill: none; marker-end: url(#arrow); }
</style>
<rect width="1000" height="400" fill="#ffffff"/>
<text x="40" y="42" class="title" text-anchor="start">On-policy and off-policy targets can imply different behavior</text>
<text x="40" y="67" class="subtitle" text-anchor="start">With persistent exploration, SARSA accounts for risky exploratory actions while Q-learning targets a greedy policy.</text>
<rect x="55" y="220" width="70" height="55" fill="#f9fafb" stroke="#9ca3af"/><rect x="129" y="220" width="70" height="55" fill="#111827" stroke="#9ca3af"/><rect x="203" y="220" width="70" height="55" fill="#111827" stroke="#9ca3af"/><rect x="277" y="220" width="70" height="55" fill="#111827" stroke="#9ca3af"/><rect x="351" y="220" width="70" height="55" fill="#111827" stroke="#9ca3af"/><rect x="425" y="220" width="70" height="55" fill="#111827" stroke="#9ca3af"/><rect x="499" y="220" width="70" height="55" fill="#111827" stroke="#9ca3af"/><rect x="573" y="220" width="70" height="55" fill="#111827" stroke="#9ca3af"/><rect x="647" y="220" width="70" height="55" fill="#111827" stroke="#9ca3af"/><rect x="721" y="220" width="70" height="55" fill="#111827" stroke="#9ca3af"/><rect x="795" y="220" width="70" height="55" fill="#111827" stroke="#9ca3af"/><rect x="869" y="220" width="70" height="55" fill="#f9fafb" stroke="#9ca3af"/><text x="90" y="252" class="head" text-anchor="middle">S</text><text x="869" y="252" class="head" text-anchor="middle">G</text><text x="500" y="205" class="head" text-anchor="middle">CLIFF: reward -100 and reset</text><path d="M 90 200 C 170 95, 760 95, 869 200" stroke="#16a34a" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="500" y="105" class="small" text-anchor="middle">SARSA learns the safer behavior-policy route</text><path d="M 90 290 L 90 315 L 869 315 L 869 278" stroke="#dc2626" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="500" y="350" class="small" text-anchor="middle">Q-learning&#x27;s greedy target prefers the shortest edge route</text>
</svg>
