<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="405" viewBox="0 0 1000 405" role="img" aria-labelledby="title desc">
<title id="title">A machine learning system is a closed evidence loop</title>
<desc id="desc">Problem framing, data, experimentation, release, and operation form a lifecycle with feedback.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
  </marker>
</defs>
<style>
text { font-family: Arial, Helvetica, sans-serif; letter-spacing: 0; fill: #1f2937; }
.title { font-size: 25px; font-weight: 700; }
.subtitle { font-size: 14px; fill: #4b5563; }
.head { font-size: 16px; font-weight: 700; }
.body { font-size: 13px; }
.small { font-size: 12px; fill: #4b5563; }
.formula { font-family: "Courier New", monospace; font-size: 13px; }
.box { stroke-width: 1.4; rx: 7; }
.arrow { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#arrow); }
.dash { stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 7 5; fill: none; marker-end: url(#arrow); }
.line { stroke: #6b7280; stroke-width: 1.5; fill: none; }
</style>
<rect width="1000" height="405" fill="#ffffff"/>
<text x="40" y="42" class="title" text-anchor="start">A machine learning system is a closed evidence loop</text>
<text x="40" y="68" class="subtitle" text-anchor="start">Problem framing, data, experimentation, release, and operation form a lifecycle with feedback.</text>
<rect x="35" y="125" width="165" height="150" class="box" fill="#dbeafe" stroke="#374151"/><text x="117" y="154" class="head" text-anchor="middle">Frame</text><text x="49" y="181" class="body" text-anchor="start"><tspan x="49" dy="0">decision</tspan><tspan x="49" dy="19">constraints</tspan></text><path d="M 200 200 L 225 200" class="arrow"/><rect x="225" y="125" width="165" height="150" class="box" fill="#dcfce7" stroke="#374151"/><text x="307" y="154" class="head" text-anchor="middle">Data</text><text x="239" y="181" class="body" text-anchor="start"><tspan x="239" dy="0">contracts</tspan><tspan x="239" dy="19">labels</tspan></text><path d="M 390 200 L 415 200" class="arrow"/><rect x="415" y="125" width="165" height="150" class="box" fill="#fef3c7" stroke="#374151"/><text x="497" y="154" class="head" text-anchor="middle">Experiment</text><text x="429" y="181" class="body" text-anchor="start"><tspan x="429" dy="0">baseline</tspan><tspan x="429" dy="19">evidence</tspan></text><path d="M 580 200 L 605 200" class="arrow"/><rect x="605" y="125" width="165" height="150" class="box" fill="#fee2e2" stroke="#374151"/><text x="687" y="154" class="head" text-anchor="middle">Release</text><text x="619" y="181" class="body" text-anchor="start"><tspan x="619" dy="0">package</tspan><tspan x="619" dy="19">rollout</tspan></text><path d="M 770 200 L 795 200" class="arrow"/><rect x="795" y="125" width="165" height="150" class="box" fill="#e0e7ff" stroke="#374151"/><text x="877" y="154" class="head" text-anchor="middle">Operate</text><text x="809" y="181" class="body" text-anchor="start"><tspan x="809" dy="0">monitor</tspan><tspan x="809" dy="19">respond</tspan></text><path d="M 875 275 C 875 370, 115 370, 115 278" class="dash"/><text x="500" y="357" class="head" text-anchor="middle">Production evidence changes the next problem definition, dataset, and experiment.</text>
</svg>
