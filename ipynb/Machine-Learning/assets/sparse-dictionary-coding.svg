<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Dictionary learning and sparse coding</title><desc id="desc">A signal is reconstructed from a few active atoms in an overcomplete dictionary, balancing error and sparsity.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#475569"/></marker><style>.h{font:700 25px Arial,sans-serif;fill:#17212b}.t{font:18px Arial,sans-serif;fill:#334155}.s{font:15px Arial,sans-serif;fill:#526172}.line{stroke:#475569;stroke-width:3;marker-end:url(#a)}</style></defs><rect width="1200" height="620" fill="#fff"/><text x="600" y="42" text-anchor="middle" class="h">Sparse coding: explain each observation with only a few dictionary atoms</text><rect x="35" y="105" width="250" height="370" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><text x="160" y="143" text-anchor="middle" class="h">Signal x</text><path d="M70 330 C100 180 130 405 160 250 C190 120 220 390 250 210" fill="none" stroke="#2563eb" stroke-width="5"/><text x="160" y="430" text-anchor="middle" class="s">d observed features</text><line x1="295" y1="290" x2="370" y2="290" class="line"/><rect x="380" y="105" width="390" height="370" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><text x="575" y="143" text-anchor="middle" class="h">Overcomplete dictionary D</text><g fill="none" stroke-width="4"><path d="M415 235 q35-90 70 0t70 0" stroke="#2563eb"/><path d="M585 235 h35v-65h35v65h35" stroke="#e8590c"/><path d="M415 370 C450 250 520 460 555 330" stroke="#16a34a"/><path d="M585 370 l55-120 55 120" stroke="#9333ea"/></g><text x="575" y="430" text-anchor="middle" class="s">m atoms, often m &gt; d</text><line x1="780" y1="290" x2="850" y2="290" class="line"/><rect x="860" y="105" width="300" height="370" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><text x="1010" y="143" text-anchor="middle" class="h">Sparse code α</text><line x1="910" y1="410" x2="1115" y2="410" stroke="#64748b" stroke-width="2"/><rect x="925" y="245" width="25" height="165" fill="#2563eb"/><rect x="965" y="390" width="25" height="20" fill="#cbd5e1"/><rect x="1005" y="320" width="25" height="90" fill="#e8590c"/><rect x="1045" y="400" width="25" height="10" fill="#cbd5e1"/><rect x="1085" y="395" width="25" height="15" fill="#cbd5e1"/><text x="1010" y="450" text-anchor="middle" class="s">most coefficients are zero</text><rect x="160" y="520" width="880" height="60" rx="6" fill="#eff6ff" stroke="#93c5fd"/><text x="600" y="547" text-anchor="middle" class="t">min ‖x - Dα‖²₂ / 2 + λ‖α‖₁</text><text x="600" y="571" text-anchor="middle" class="s">larger λ gives simpler codes but larger reconstruction error</text></svg>
