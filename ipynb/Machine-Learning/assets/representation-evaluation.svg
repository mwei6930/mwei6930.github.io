<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Dimensionality reduction has several evaluation targets</title><desc id="desc">An encoder maps input to a lower-dimensional representation and may reconstruct it; evaluation covers reconstruction, variance, neighborhoods, downstream utility and stability.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#334155"/></marker><style>.t{font:700 28px Arial,sans-serif;fill:#0f172a}.h{font:700 19px Arial,sans-serif;fill:#0f172a}.b{font:15px Arial,sans-serif;fill:#334155}.s{font:14px Arial,sans-serif;fill:#475569}.box{fill:#fff;stroke:#64748b;stroke-width:2}.arr{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="630" fill="#f8fafc"/><text x="600" y="42" text-anchor="middle" class="t">Dimensionality reduction has several evaluation targets</text>
  <rect x="55" y="120" width="190" height="170" rx="8" class="box"/><text x="150" y="153" text-anchor="middle" class="h">Input x</text><g fill="#2563eb"><circle cx="100" cy="195" r="8"/><circle cx="130" cy="180" r="8"/><circle cx="160" cy="210" r="8"/><circle cx="190" cy="188" r="8"/><circle cx="115" cy="240" r="8"/><circle cx="150" cy="250" r="8"/><circle cx="200" cy="235" r="8"/></g><text x="150" y="275" text-anchor="middle" class="s">high-dimensional observations</text>
  <path d="M245 205 H325" class="arr"/><rect x="330" y="120" width="180" height="170" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="420" y="153" text-anchor="middle" class="h">Encoder f</text><path d="M365 185 H475 M380 215 H460 M395 245 H445" stroke="#ea580c" stroke-width="5"/><text x="420" y="275" text-anchor="middle" class="s">projection or learned map</text>
  <path d="M510 205 H590" class="arr"/><rect x="595" y="120" width="180" height="170" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/><text x="685" y="153" text-anchor="middle" class="h">Representation z</text><circle cx="650" cy="215" r="15" fill="#16a34a"/><circle cx="705" cy="185" r="15" fill="#7c3aed"/><circle cx="730" cy="238" r="15" fill="#f59e0b"/><text x="685" y="275" text-anchor="middle" class="s">compressed coordinates</text>
  <path d="M775 205 H855" class="arr"/><rect x="860" y="120" width="200" height="170" rx="8" fill="#fdf2f8" stroke="#db2777" stroke-width="2"/><text x="960" y="153" text-anchor="middle" class="h">Decoder g</text><path d="M915 245 H1005 M900 215 H1020 M885 185 H1035" stroke="#db2777" stroke-width="5"/><text x="960" y="275" text-anchor="middle" class="s">optional reconstruction x-hat</text>
  <path d="M1060 205 H1100" class="arr"/><text x="1110" y="198" class="b">compare</text><text x="1110" y="220" class="b">with x</text>
  <rect x="65" y="370" width="245" height="150" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="187" y="404" text-anchor="middle" class="h">Information retained</text><text x="187" y="438" text-anchor="middle" class="b">explained variance ratio</text><text x="187" y="463" text-anchor="middle" class="b">reconstruction error</text><text x="187" y="490" text-anchor="middle" class="s">depends on scale and loss</text>
  <rect x="340" y="370" width="245" height="150" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/><text x="462" y="404" text-anchor="middle" class="h">Geometry retained</text><text x="462" y="438" text-anchor="middle" class="b">trustworthiness / continuity</text><text x="462" y="463" text-anchor="middle" class="b">pairwise or neighborhood error</text><text x="462" y="490" text-anchor="middle" class="s">global and local views differ</text>
  <rect x="615" y="370" width="245" height="150" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="737" y="404" text-anchor="middle" class="h">Task utility</text><text x="737" y="438" text-anchor="middle" class="b">held-out downstream score</text><text x="737" y="463" text-anchor="middle" class="b">latency and storage</text><text x="737" y="490" text-anchor="middle" class="s">fit transform inside each split</text>
  <rect x="890" y="370" width="245" height="150" rx="8" fill="#fdf2f8" stroke="#db2777" stroke-width="2"/><text x="1012" y="404" text-anchor="middle" class="h">Stability and meaning</text><text x="1012" y="438" text-anchor="middle" class="b">seed / sample sensitivity</text><text x="1012" y="463" text-anchor="middle" class="b">label or factor consistency</text><text x="1012" y="490" text-anchor="middle" class="s">visual appeal is not evidence</text>
  <path d="M685 290 V335 H187 V370 M685 335 H1012 V370 M462 335 V370 M737 335 V370" stroke="#64748b" stroke-width="2" fill="none"/>
  <text x="600" y="580" text-anchor="middle" class="s">Choose the criterion from the representation's intended use; no single score certifies every property.</text>
</svg>
