<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Non-negative matrix factorization</title><desc id="desc">A non-negative observation is reconstructed by adding non-negative weights of interpretable parts, without cancellation.</desc><defs><style>.h{font:700 25px Arial,sans-serif;fill:#17212b}.t{font:18px Arial,sans-serif;fill:#334155}.s{font:15px Arial,sans-serif;fill:#526172}</style></defs><rect width="1200" height="600" fill="#fff"/><text x="600" y="42" text-anchor="middle" class="h">NMF builds observations by adding non-negative parts</text><rect x="55" y="130" width="245" height="300" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><text x="178" y="115" text-anchor="middle" class="h">Observation x</text><circle cx="178" cy="260" r="85" fill="#ffedd5"/><circle cx="145" cy="245" r="12" fill="#334155"/><circle cx="210" cy="245" r="12" fill="#334155"/><path d="M140 305 Q178 330 216 305" fill="none" stroke="#334155" stroke-width="8"/><text x="178" y="392" text-anchor="middle" class="s">all entries are non-negative</text><text x="330" y="290" class="h">~</text><text x="385" y="290" class="h">0.8 x</text><rect x="470" y="165" width="160" height="220" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><circle cx="520" cy="250" r="12" fill="#334155"/><circle cx="580" cy="250" r="12" fill="#334155"/><text x="550" y="415" text-anchor="middle" class="t">eyes atom</text><text x="660" y="290" class="h">+</text><text x="705" y="290" class="h">0.5 x</text><rect x="790" y="165" width="160" height="220" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><path d="M825 290 Q870 325 915 290" fill="none" stroke="#334155" stroke-width="8"/><text x="870" y="415" text-anchor="middle" class="t">mouth atom</text><text x="980" y="290" class="h">+</text><rect x="1025" y="205" width="125" height="145" rx="8" fill="#f3e8ff" stroke="#9333ea" stroke-width="3"/><text x="1088" y="270" text-anchor="middle" class="t">other</text><text x="1088" y="300" text-anchor="middle" class="t">parts</text><rect x="150" y="485" width="900" height="60" rx="6" fill="#fff7ed" stroke="#fdba74"/><text x="600" y="512" text-anchor="middle" class="t">X is approximated by W H, with W &gt;= 0 and H &gt;= 0</text><text x="600" y="536" text-anchor="middle" class="s">No positive-negative cancellation; interpretability still depends on data and regularization.</text>
</svg>
