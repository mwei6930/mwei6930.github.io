<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="415" viewBox="0 0 1000 415" role="img" aria-labelledby="title desc">
<title id="title">Causal forests adapt neighborhoods to treatment-effect heterogeneity</title>
<desc id="desc">Honesty and orthogonalization separate split discovery from local treatment-effect estimation.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
  </marker>
</defs>
<style>
text { font-family: Arial, Helvetica, sans-serif; letter-spacing: 0; fill: #1f2937; }
.title { font-size: 25px; font-weight: 700; }
.subtitle { font-size: 14px; fill: #4b5563; }
.head { font-size: 16px; font-weight: 700; }
.body { font-size: 13px; }
.small { font-size: 12px; fill: #4b5563; }
.formula { font-family: "Courier New", monospace; font-size: 13px; }
.box { stroke-width: 1.4; rx: 7; }
.arrow { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#arrow); }
.dash { stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 7 5; fill: none; marker-end: url(#arrow); }
.blocked { stroke: #dc2626; stroke-width: 3; }
</style>
<rect width="1000" height="415" fill="#ffffff"/>
<text x="40" y="42" class="title" text-anchor="start">Causal forests adapt neighborhoods to treatment-effect heterogeneity</text>
<text x="40" y="68" class="subtitle" text-anchor="start">Honesty and orthogonalization separate split discovery from local treatment-effect estimation.</text>
<rect x="35" y="105" width="225" height="225" class="box" fill="#dbeafe" stroke="#374151"/><text x="147" y="133" class="head" text-anchor="middle">Split sample</text><text x="49" y="159" class="body" text-anchor="start"><tspan x="49" dy="0">Structure subset</tspan><tspan x="49" dy="19">Estimation subset</tspan><tspan x="49" dy="19">Honesty</tspan></text><path d="M 260 215 L 330 215" class="arrow"/><rect x="330" y="105" width="300" height="225" class="box" fill="#fef3c7" stroke="#374151"/><text x="480" y="133" class="head" text-anchor="middle">Grow causal trees</text><text x="344" y="159" class="body" text-anchor="start"><tspan x="344" dy="0">Split for effect heterogeneity</tspan><tspan x="344" dy="19">Maintain treated/control support</tspan><tspan x="344" dy="19">Build many subsamples</tspan></text><path d="M 630 215 L 700 215" class="arrow"/><rect x="700" y="105" width="265" height="225" class="box" fill="#dcfce7" stroke="#374151"/><text x="832" y="133" class="head" text-anchor="middle">Local CATE</text><text x="714" y="159" class="body" text-anchor="start"><tspan x="714" dy="0">Forest similarity weights</tspan><tspan x="714" dy="19">Orthogonalized outcomes</tspan><tspan x="714" dy="19">Uncertainty estimates</tspan></text><text x="500" y="370" class="head" text-anchor="middle">A predictive random forest is not automatically a causal forest.</text>
</svg>
