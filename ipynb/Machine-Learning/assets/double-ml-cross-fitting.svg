<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="415" viewBox="0 0 1000 415" role="img" aria-labelledby="title desc">
<title id="title">Double machine learning residualizes with out-of-fold predictions</title>
<desc id="desc">Flexible nuisance models are combined with an orthogonal score and cross-fitting.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
  </marker>
</defs>
<style>
text { font-family: Arial, Helvetica, sans-serif; letter-spacing: 0; fill: #1f2937; }
.title { font-size: 25px; font-weight: 700; }
.subtitle { font-size: 14px; fill: #4b5563; }
.head { font-size: 16px; font-weight: 700; }
.body { font-size: 13px; }
.small { font-size: 12px; fill: #4b5563; }
.formula { font-family: "Courier New", monospace; font-size: 13px; }
.box { stroke-width: 1.4; rx: 7; }
.arrow { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#arrow); }
.dash { stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 7 5; fill: none; marker-end: url(#arrow); }
.blocked { stroke: #dc2626; stroke-width: 3; }
</style>
<rect width="1000" height="415" fill="#ffffff"/>
<text x="40" y="42" class="title" text-anchor="start">Double machine learning residualizes with out-of-fold predictions</text>
<text x="40" y="68" class="subtitle" text-anchor="start">Flexible nuisance models are combined with an orthogonal score and cross-fitting.</text>
<rect x="35" y="105" width="210" height="225" class="box" fill="#dbeafe" stroke="#374151"/><text x="140" y="133" class="head" text-anchor="middle">Fold A</text><text x="49" y="159" class="body" text-anchor="start"><tspan x="49" dy="0">Fit g(X)=E[Y|X]</tspan><tspan x="49" dy="19">Fit m(X)=E[T|X]</tspan><tspan x="49" dy="19">using fold B</tspan></text><path d="M 245 215 L 320 215" class="arrow"/><rect x="320" y="105" width="240" height="225" class="box" fill="#fef3c7" stroke="#374151"/><text x="440" y="133" class="head" text-anchor="middle">Orthogonalize</text><text x="334" y="159" class="body" text-anchor="start"><tspan x="334" dy="0">Y~ = Y - ĝ(X)</tspan><tspan x="334" dy="19">T~ = T - m̂(X)</tspan><tspan x="334" dy="19">out-of-fold residuals</tspan></text><path d="M 560 215 L 635 215" class="arrow"/><rect x="635" y="105" width="330" height="225" class="box" fill="#dcfce7" stroke="#374151"/><text x="800" y="133" class="head" text-anchor="middle">Causal stage</text><text x="649" y="159" class="body" text-anchor="start"><tspan x="649" dy="0">Solve E[T~(Y~-θT~)]=0</tspan><tspan x="649" dy="19">Swap folds and aggregate</tspan><tspan x="649" dy="19">Inference on θ</tspan></text><text x="500" y="370" class="head" text-anchor="middle">Cross-fitting separates nuisance learning from score evaluation; orthogonality reduces first-order bias.</text>
</svg>
