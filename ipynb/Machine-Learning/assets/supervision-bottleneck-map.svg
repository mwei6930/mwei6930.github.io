<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">From supervision bottlenecks to learning strategies</title><desc id="desc">Five supervision problems map to different families of methods, emphasizing that they are not interchangeable.</desc>
<defs><marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#475569"/></marker>
<style>.title{font:700 26px Arial,sans-serif;fill:#17212b}.bh{font:700 19px Arial,sans-serif;fill:#17212b}.bt{font:15px Arial,sans-serif;fill:#334155}.small{font:14px Arial,sans-serif;fill:#526172}.arrow{stroke:#475569;stroke-width:3;marker-end:url(#arrowhead)}.node{stroke:#334155;stroke-width:2}</style></defs>
<rect width="1200" height="610" fill="#ffffff"/>
<text x="600" y="42" text-anchor="middle" class="title">From supervision bottlenecks to learning strategies</text>
<rect x="35" y="95" width="225" height="150" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="147.5" y="133" text-anchor="middle" class="bh">Limited labels</text><text x="147.5" y="167" text-anchor="middle" class="bt">few trusted examples</text><text x="147.5" y="194" text-anchor="middle" class="bt">high expert cost</text><rect x="275" y="95" width="225" height="150" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="387.5" y="133" text-anchor="middle" class="bh">Unlabeled pool</text><text x="387.5" y="167" text-anchor="middle" class="bt">cheap observations</text><text x="387.5" y="194" text-anchor="middle" class="bt">unknown targets</text><rect x="515" y="95" width="225" height="150" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="627.5" y="133" text-anchor="middle" class="bh">Weak labels</text><text x="627.5" y="167" text-anchor="middle" class="bt">rules, databases, crowd</text><text x="627.5" y="194" text-anchor="middle" class="bt">coverage and conflict</text><rect x="755" y="95" width="225" height="150" rx="10" fill="#fee2e2" stroke="#e11d48" stroke-width="3"/><text x="867.5" y="133" text-anchor="middle" class="bh">Noisy labels</text><text x="867.5" y="167" text-anchor="middle" class="bt">corruption or ambiguity</text><text x="867.5" y="194" text-anchor="middle" class="bt">systematic mistakes</text><rect x="995" y="95" width="170" height="150" rx="10" fill="#f3e8ff" stroke="#9333ea" stroke-width="3"/><text x="1080.0" y="133" text-anchor="middle" class="bh">Rare events</text><text x="1080.0" y="167" text-anchor="middle" class="bt">low prevalence</text><text x="1080.0" y="194" text-anchor="middle" class="bt">asymmetric costs</text><rect x="65" y="335" width="200" height="135" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="165.0" y="373" text-anchor="middle" class="bh">Semi-supervised</text><text x="165.0" y="407" text-anchor="middle" class="bt">exploit data geometry</text><rect x="285" y="335" width="200" height="135" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="3"/><text x="385.0" y="373" text-anchor="middle" class="bh">Self-supervised</text><text x="385.0" y="407" text-anchor="middle" class="bt">derive targets from x</text><rect x="505" y="335" width="200" height="135" rx="10" fill="#fff7ed" stroke="#e8590c" stroke-width="3"/><text x="605.0" y="373" text-anchor="middle" class="bh">Active learning</text><text x="605.0" y="407" text-anchor="middle" class="bt">choose what to label</text><rect x="725" y="335" width="200" height="135" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="3"/><text x="825.0" y="373" text-anchor="middle" class="bh">Weak supervision</text><text x="825.0" y="407" text-anchor="middle" class="bt">combine noisy sources</text><rect x="945" y="335" width="200" height="135" rx="10" fill="#fdf2f8" stroke="#db2777" stroke-width="3"/><text x="1045.0" y="373" text-anchor="middle" class="bh">Robust learning</text><text x="1045.0" y="407" text-anchor="middle" class="bt">audit noise and costs</text><line x1="150" y1="250" x2="165" y2="325" class="arrow"/><line x1="385" y1="250" x2="385" y2="325" class="arrow"/><line x1="625" y1="250" x2="825" y2="325" class="arrow"/><line x1="865" y1="250" x2="1045" y2="325" class="arrow"/><line x1="1080" y1="250" x2="1045" y2="325" class="arrow"/><text x="600" y="535" text-anchor="middle" class="bh">The supervision defect determines the method and the evaluation protocol</text><text x="600" y="570" text-anchor="middle" class="small">A large unlabeled set cannot repair arbitrary label bias, and class weighting cannot identify incorrect labels.</text></svg>