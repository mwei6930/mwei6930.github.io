    <svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360">
      <rect width="1100" height="360" fill="#fbfcfe"/>
      <style>
        .title{font:700 25px Arial;fill:#17212b} .h{font:700 18px Arial;fill:#17212b}
        .t{font:15px Arial;fill:#263746} .s{font:13px Arial;fill:#51606d}
        .box{fill:#fff;stroke:#436b8e;stroke-width:2;rx:7} .soft{fill:#eef5f7;stroke:#6d889b;stroke-width:1.6;rx:7}
        .warm{fill:#fff3df;stroke:#b27a28;stroke-width:1.8;rx:7} .accent{fill:#e8f4ec;stroke:#43845a;stroke-width:1.8;rx:7}
        .line{stroke:#334b5f;stroke-width:2;fill:none;marker-end:url(#a)} .dash{stroke:#7a8791;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#a)}
      </style>
      <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#334b5f"/></marker></defs>
      <text x="40" y="42" class="title">GAN training is a coupled two-player game</text>
<rect x="55" y="125" width="170" height="110" class="soft"/><text x="102" y="165" class="h">noise z</text><text x="88" y="202" class="s">and condition c</text><rect x="315" y="125" width="180" height="110" class="accent"/><text x="365" y="165" class="h">generator G</text><text x="348" y="202" class="s">creates fake x</text><rect x="625" y="90" width="190" height="180" class="warm"/><text x="670" y="130" class="h">discriminator D</text><text x="662" y="170" class="t">real x or fake G(z)</text><text x="655" y="210" class="s">learns source evidence</text><rect x="900" y="125" width="145" height="110" class="box"/><text x="930" y="165" class="h">losses</text><text x="915" y="202" class="s">opposing updates</text><path d="M225 180 L315 180" class="line"/><path d="M495 180 L625 180" class="line"/><path d="M815 180 L900 180" class="line"/><path d="M560 65 C620 55 665 60 690 90" class="dash"/><text x="475" y="60" class="s">real data path</text>

    </svg>
