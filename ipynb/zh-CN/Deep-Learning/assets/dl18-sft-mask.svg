<svg xmlns="http://www.w3.org/2000/svg" width="980" height="300" viewBox="0 0 980 300" role="img">
<style>
  .bg { fill:#fbfcfe; } .panel { fill:#fff; stroke:#425466; stroke-width:2; rx:10; }
  .blue { fill:#e7f0ff; stroke:#2563eb; stroke-width:2; rx:10; }
  .green { fill:#e8f7ef; stroke:#198754; stroke-width:2; rx:10; }
  .amber { fill:#fff4d6; stroke:#c47f00; stroke-width:2; rx:10; }
  .red { fill:#fdebec; stroke:#c43d4b; stroke-width:2; rx:10; }
  .violet { fill:#f0eafd; stroke:#7357b6; stroke-width:2; rx:10; }
  .text { font:16px Arial,sans-serif; fill:#17202a; } .small { font:13px Arial,sans-serif; fill:#334155; }
  .title { font:bold 20px Arial,sans-serif; fill:#17202a; } .label { font:bold 15px Arial,sans-serif; fill:#17202a; }
  .line { stroke:#425466; stroke-width:2.2; fill:none; marker-end:url(#arrow); }
  .dash { stroke:#64748b; stroke-width:2; stroke-dasharray:7 6; fill:none; marker-end:url(#arrow); }
  .axis { stroke:#334155; stroke-width:1.8; fill:none; } .grid { stroke:#d7dee8; stroke-width:1; }
</style>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#425466"/></marker></defs>
<rect class="bg" width="100%" height="100%"/>
      <text class="title" x="490" y="30" text-anchor="middle">Response-only supervised fine-tuning</text>
      <text class="label" x="55" y="82" text-anchor="start">tokens</text>
      <rect class="blue" x="145" y="54" width="125" height="48"/><text class="small" x="207" y="84" text-anchor="middle">&lt;BOS&gt;</text>
      <rect class="blue" x="275" y="54" width="125" height="48"/><text class="small" x="337" y="84" text-anchor="middle">prompt</text>
      <rect class="blue" x="405" y="54" width="125" height="48"/><text class="small" x="467" y="84" text-anchor="middle">&lt;SEP&gt;</text>
      <rect class="green" x="535" y="54" width="125" height="48"/><text class="small" x="597" y="84" text-anchor="middle">response</text>
      <rect class="green" x="665" y="54" width="125" height="48"/><text class="small" x="727" y="84" text-anchor="middle">response</text>
      <rect class="green" x="795" y="54" width="125" height="48"/><text class="small" x="857" y="84" text-anchor="middle">&lt;EOS&gt;</text>
      <text class="label" x="55" y="160" text-anchor="start">labels</text>
      <rect class="panel" x="145" y="132" width="125" height="48"/><text class="small" x="207" y="162" text-anchor="middle">-100</text>
      <rect class="panel" x="275" y="132" width="125" height="48"/><text class="small" x="337" y="162" text-anchor="middle">-100</text>
      <rect class="panel" x="405" y="132" width="125" height="48"/><text class="small" x="467" y="162" text-anchor="middle">-100</text>
      <rect class="green" x="535" y="132" width="125" height="48"/><text class="small" x="597" y="162" text-anchor="middle">next token</text>
      <rect class="green" x="665" y="132" width="125" height="48"/><text class="small" x="727" y="162" text-anchor="middle">next token</text>
      <rect class="green" x="795" y="132" width="125" height="48"/><text class="small" x="857" y="162" text-anchor="middle">&lt;EOS&gt;</text>
      <path class="dash" d="M145 220 H530"/><text class="small" x="337" y="252" text-anchor="middle">context is visible but excluded from the loss</text>
      <path class="line" d="M535 220 H920"/><text class="small" x="727" y="252" text-anchor="middle">only response targets contribute gradients</text>
    </svg>