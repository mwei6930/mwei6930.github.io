<rect width="100%" height="100%" fill="#ffffff"/>
<text x="60" y="58" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#172033">Deployment targets impose different constraints</text>
<text x="60" y="90" font-family="Arial, sans-serif" font-size="17" fill="#526077">The same model artifact is rarely optimal for cloud, edge gateway, and on-device use.</text>
<rect x="70" y="175" width="280" height="210" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="3"/><rect x="70" y="175" width="280" height="10" rx="5" fill="#2563eb"/><text x="88" y="217" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#172033">Cloud</text><text x="88" y="250" font-family="Arial, sans-serif" font-size="16" fill="#526077">elastic batching</text><text x="88" y="275" font-family="Arial, sans-serif" font-size="16" fill="#526077">network latency</text><text x="88" y="300" font-family="Arial, sans-serif" font-size="16" fill="#526077">multi-tenant cost</text>
<rect x="460" y="175" width="280" height="210" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="3"/><rect x="460" y="175" width="280" height="10" rx="5" fill="#d97706"/><text x="478" y="217" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#172033">Edge</text><text x="478" y="250" font-family="Arial, sans-serif" font-size="16" fill="#526077">bounded accelerator</text><text x="478" y="275" font-family="Arial, sans-serif" font-size="16" fill="#526077">intermittent network</text><text x="478" y="300" font-family="Arial, sans-serif" font-size="16" fill="#526077">local privacy</text>
<rect x="850" y="175" width="280" height="210" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="3"/><rect x="850" y="175" width="280" height="10" rx="5" fill="#16a34a"/><text x="868" y="217" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#172033">On-device</text><text x="868" y="250" font-family="Arial, sans-serif" font-size="16" fill="#526077">tight memory/energy</text><text x="868" y="275" font-family="Arial, sans-serif" font-size="16" fill="#526077">operator limits</text><text x="868" y="300" font-family="Arial, sans-serif" font-size="16" fill="#526077">offline response</text>
