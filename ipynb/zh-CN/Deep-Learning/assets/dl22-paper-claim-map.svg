<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#355070"/></marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.13"/></filter>
</defs>
<rect width="100%" height="100%" fill="#fbfcfe"/>
<text x="600" y="48" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#172033">A Paper Is a Chain of Claims, Not a Sequence of Sections</text><g filter="url(#shadow)"><rect x="45" y="205" width="190" height="160" rx="8" fill="#e8f4f8" stroke="#355070" stroke-width="2"/></g>
<text x="140.0" y="240" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#172033">Question</text><text x="140.0" y="272" text-anchor="middle" font-family="Arial" font-size="18" fill="#475569">decision</text><text x="140.0" y="296" text-anchor="middle" font-family="Arial" font-size="18" fill="#475569">and scope</text><g filter="url(#shadow)"><rect x="275" y="205" width="190" height="160" rx="8" fill="#e9f2ff" stroke="#355070" stroke-width="2"/></g>
<text x="370.0" y="240" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#172033">Mechanism</text><text x="370.0" y="272" text-anchor="middle" font-family="Arial" font-size="18" fill="#475569">what changes</text><text x="370.0" y="296" text-anchor="middle" font-family="Arial" font-size="18" fill="#475569">and why</text><g filter="url(#shadow)"><rect x="505" y="205" width="190" height="160" rx="8" fill="#f1ecff" stroke="#355070" stroke-width="2"/></g>
<text x="600.0" y="240" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#172033">Evidence</text><text x="600.0" y="272" text-anchor="middle" font-family="Arial" font-size="18" fill="#475569">data, split,</text><text x="600.0" y="296" text-anchor="middle" font-family="Arial" font-size="18" fill="#475569">metrics, uncertainty</text><g filter="url(#shadow)"><rect x="735" y="205" width="190" height="160" rx="8" fill="#fff2df" stroke="#355070" stroke-width="2"/></g>
<text x="830.0" y="240" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#172033">Boundary</text><text x="830.0" y="272" text-anchor="middle" font-family="Arial" font-size="18" fill="#475569">assumptions</text><text x="830.0" y="296" text-anchor="middle" font-family="Arial" font-size="18" fill="#475569">and failure modes</text><g filter="url(#shadow)"><rect x="965" y="205" width="190" height="160" rx="8" fill="#e8f6ee" stroke="#355070" stroke-width="2"/></g>
<text x="1060.0" y="240" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#172033">Contribution</text><text x="1060.0" y="272" text-anchor="middle" font-family="Arial" font-size="18" fill="#475569">what survives</text><text x="1060.0" y="296" text-anchor="middle" font-family="Arial" font-size="18" fill="#475569">comparison</text><line x1="235" y1="285" x2="275" y2="285" stroke="#355070" stroke-width="3" marker-end="url(#arrow)"/><line x1="465" y1="285" x2="505" y2="285" stroke="#355070" stroke-width="3" marker-end="url(#arrow)"/><line x1="695" y1="285" x2="735" y2="285" stroke="#355070" stroke-width="3" marker-end="url(#arrow)"/><line x1="925" y1="285" x2="965" y2="285" stroke="#355070" stroke-width="3" marker-end="url(#arrow)"/><text x="600" y="440" text-anchor="middle" font-family="Arial" font-size="21" fill="#475569">A weakness anywhere in the chain limits the strength of the conclusion.</text>
</svg>