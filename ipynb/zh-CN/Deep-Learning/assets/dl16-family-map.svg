    <svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360">
      <rect width="1100" height="360" fill="#fbfcfe"/>
      <style>
        .title{font:700 25px Arial;fill:#17212b} .h{font:700 18px Arial;fill:#17212b}
        .t{font:15px Arial;fill:#263746} .s{font:13px Arial;fill:#51606d}
        .box{fill:#fff;stroke:#436b8e;stroke-width:2;rx:7} .soft{fill:#eef5f7;stroke:#6d889b;stroke-width:1.6;rx:7}
        .warm{fill:#fff3df;stroke:#b27a28;stroke-width:1.8;rx:7} .accent{fill:#e8f4ec;stroke:#43845a;stroke-width:1.8;rx:7}
        .line{stroke:#334b5f;stroke-width:2;fill:none;marker-end:url(#a)} .dash{stroke:#7a8791;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#a)}
      </style>
      <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#334b5f"/></marker></defs>
      <text x="40" y="42" class="title">Three routes from noise to data</text>
<rect x="45" y="95" width="310" height="200" class="warm"/><text x="125" y="135" class="h">Adversarial</text><text x="80" y="175" class="t">one learned map G(z, c)</text><text x="80" y="210" class="t">critic supplies distribution signal</text><text x="80" y="250" class="s">fast sampling; coupled game</text>
<rect x="395" y="95" width="310" height="200" class="soft"/><text x="505" y="135" class="h">Diffusion</text><text x="435" y="175" class="t">noise data, then reverse many steps</text><text x="435" y="210" class="t">predict noise / score / clean data</text><text x="435" y="250" class="s">stable regression; iterative sampling</text>
<rect x="745" y="95" width="310" height="200" class="accent"/><text x="838" y="135" class="h">Flow matching</text><text x="785" y="175" class="t">learn velocity along probability paths</text><text x="785" y="210" class="t">integrate an ODE from noise to data</text><text x="785" y="250" class="s">simulation-free training; solver cost</text>

    </svg>
