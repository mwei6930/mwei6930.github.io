<svg xmlns="http://www.w3.org/2000/svg" width="980" height="380" viewBox="0 0 980 380" role="img">
<style>
  .bg { fill:#fbfcfe; } .panel { fill:#fff; stroke:#425466; stroke-width:2; rx:9; }
  .blue { fill:#e7f0ff; stroke:#2563eb; stroke-width:2; rx:9; }
  .green { fill:#e8f7ef; stroke:#198754; stroke-width:2; rx:9; }
  .amber { fill:#fff4d6; stroke:#c47f00; stroke-width:2; rx:9; }
  .red { fill:#fdebec; stroke:#c43d4b; stroke-width:2; rx:9; }
  .violet { fill:#f0eafd; stroke:#7357b6; stroke-width:2; rx:9; }
  .text { font:16px Arial,sans-serif; fill:#17202a; } .small { font:13px Arial,sans-serif; fill:#334155; }
  .title { font:bold 20px Arial,sans-serif; fill:#17202a; } .label { font:bold 15px Arial,sans-serif; fill:#17202a; }
  .line { stroke:#425466; stroke-width:2.2; fill:none; marker-end:url(#arrow); }
  .dash { stroke:#64748b; stroke-width:2; stroke-dasharray:7 6; fill:none; marker-end:url(#arrow); }
  .axis { stroke:#334155; stroke-width:1.8; fill:none; } .grid { stroke:#d7dee8; stroke-width:1; }
</style>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#425466"/></marker></defs>
<rect class="bg" width="100%" height="100%"/>
      <text class="title" x="490" y="30" text-anchor="middle">DistributedDataParallel replicates the model and averages gradients</text>
      <rect class="blue" x="55" y="85" width="190" height="90"/><text class="label" x="150" y="118" text-anchor="middle">Rank 0</text><text class="small" x="150" y="145" text-anchor="middle">batch shard 0</text>
      <rect class="green" x="395" y="85" width="190" height="90"/><text class="label" x="490" y="118" text-anchor="middle">Rank 1</text><text class="small" x="490" y="145" text-anchor="middle">batch shard 1</text>
      <rect class="amber" x="735" y="85" width="190" height="90"/><text class="label" x="830" y="118" text-anchor="middle">Rank 2</text><text class="small" x="830" y="145" text-anchor="middle">batch shard 2</text>
      <path class="line" d="M150 175 V245 H395"/><path class="line" d="M490 175 V245"/><path class="line" d="M830 175 V245 H585"/>
      <rect class="violet" x="345" y="220" width="290" height="95"/><text class="label" x="490" y="255" text-anchor="middle">Bucketed all-reduce</text><text class="small" x="490" y="283" text-anchor="middle">sum gradients, divide by world size</text>
      <path class="dash" d="M345 267 H150 V175"/><path class="dash" d="M635 267 H830 V175"/>
      <text class="small" x="490" y="350" text-anchor="middle">Each rank keeps a full model; only data and gradient work are partitioned.</text>
    </svg>