<rect x="285" y="190" width="170" height="180" rx="8" fill="#ffffff" stroke="#0891b2" stroke-width="3"/><rect x="285" y="190" width="170" height="10" rx="5" fill="#0891b2"/><text x="303" y="232" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#172033">Prepare</text><text x="303" y="265" font-family="Arial, sans-serif" font-size="16" fill="#526077">decode and normalize</text><text x="303" y="290" font-family="Arial, sans-serif" font-size="16" fill="#526077">form a batch</text>
<rect x="515" y="190" width="170" height="180" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/><rect x="515" y="190" width="170" height="10" rx="5" fill="#7c3aed"/><text x="533" y="232" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#172033">Execute</text><text x="533" y="265" font-family="Arial, sans-serif" font-size="16" fill="#526077">runtime and device</text><text x="533" y="290" font-family="Arial, sans-serif" font-size="16" fill="#526077">cache state</text>
<rect x="745" y="190" width="170" height="180" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="3"/><rect x="745" y="190" width="170" height="10" rx="5" fill="#d97706"/><text x="763" y="232" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#172033">Postprocess</text><text x="763" y="265" font-family="Arial, sans-serif" font-size="16" fill="#526077">decode or rank</text><text x="763" y="290" font-family="Arial, sans-serif" font-size="16" fill="#526077">attach confidence</text>
<rect x="975" y="190" width="170" height="180" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="3"/><rect x="975" y="190" width="170" height="10" rx="5" fill="#16a34a"/><text x="993" y="232" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#172033">Observe</text><text x="993" y="265" font-family="Arial, sans-serif" font-size="16" fill="#526077">trace, drift, cost</text><text x="993" y="290" font-family="Arial, sans-serif" font-size="16" fill="#526077">rollback signal</text>
