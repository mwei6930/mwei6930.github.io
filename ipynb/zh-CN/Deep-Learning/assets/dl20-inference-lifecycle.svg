<rect width="100%" height="100%" fill="#ffffff"/>
<text x="60" y="58" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#172033">The inference lifecycle</text>
<text x="60" y="90" font-family="Arial, sans-serif" font-size="17" fill="#526077">A deployable model is a governed pipeline, not a lone forward pass.</text>
