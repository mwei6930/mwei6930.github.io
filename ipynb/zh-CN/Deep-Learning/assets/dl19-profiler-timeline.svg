<svg xmlns="http://www.w3.org/2000/svg" width="980" height="365" viewBox="0 0 980 365" role="img">
<style>
  .bg { fill:#fbfcfe; } .panel { fill:#fff; stroke:#425466; stroke-width:2; rx:9; }
  .blue { fill:#e7f0ff; stroke:#2563eb; stroke-width:2; rx:9; }
  .green { fill:#e8f7ef; stroke:#198754; stroke-width:2; rx:9; }
  .amber { fill:#fff4d6; stroke:#c47f00; stroke-width:2; rx:9; }
  .red { fill:#fdebec; stroke:#c43d4b; stroke-width:2; rx:9; }
  .violet { fill:#f0eafd; stroke:#7357b6; stroke-width:2; rx:9; }
  .text { font:16px Arial,sans-serif; fill:#17202a; } .small { font:13px Arial,sans-serif; fill:#334155; }
  .title { font:bold 20px Arial,sans-serif; fill:#17202a; } .label { font:bold 15px Arial,sans-serif; fill:#17202a; }
  .line { stroke:#425466; stroke-width:2.2; fill:none; marker-end:url(#arrow); }
  .dash { stroke:#64748b; stroke-width:2; stroke-dasharray:7 6; fill:none; marker-end:url(#arrow); }
  .axis { stroke:#334155; stroke-width:1.8; fill:none; } .grid { stroke:#d7dee8; stroke-width:1; }
</style>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#425466"/></marker></defs>
<rect class="bg" width="100%" height="100%"/>
      <text class="title" x="490" y="30" text-anchor="middle">Profile a complete step before choosing an optimization</text>
      <text class="label" x="55" y="92" text-anchor="start">CPU</text><rect class="blue" x="130" y="62" width="150" height="45"/><text class="small" x="205" y="90" text-anchor="middle">data + launch</text><rect class="amber" x="600" y="62" width="120" height="45"/><text class="small" x="660" y="90" text-anchor="middle">optimizer</text>
      <text class="label" x="55" y="162" text-anchor="start">GPU</text><rect class="green" x="210" y="132" width="190" height="45"/><text class="small" x="305" y="160" text-anchor="middle">forward kernels</text><rect class="violet" x="405" y="132" width="260" height="45"/><text class="small" x="535" y="160" text-anchor="middle">backward kernels</text>
      <text class="label" x="55" y="232" text-anchor="start">network</text><rect class="red" x="470" y="202" width="185" height="45"/><text class="small" x="562" y="230" text-anchor="middle">gradient all-reduce</text>
      <line class="axis" x1="130" y1="285" x2="900" y2="285"/><line class="grid" x1="280" y1="55" x2="280" y2="285"/><line class="grid" x1="470" y1="55" x2="470" y2="285"/><line class="grid" x1="665" y1="55" x2="665" y2="285"/>
      <text class="small" x="210" y="315" text-anchor="middle">input stall</text><text class="small" x="375" y="315" text-anchor="middle">compute</text><text class="small" x="565" y="315" text-anchor="middle">overlap?</text><text class="small" x="780" y="315" text-anchor="middle">idle tail</text>
      <text class="small" x="490" y="347" text-anchor="middle">Throughput alone cannot identify the cause of idle time.</text>
    </svg>