    <svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360">
      <rect width="1100" height="360" fill="#fbfcfe"/>
      <style>
        .title{font:700 25px Arial;fill:#17212b} .h{font:700 18px Arial;fill:#17212b}
        .t{font:15px Arial;fill:#263746} .s{font:13px Arial;fill:#51606d}
        .box{fill:#fff;stroke:#436b8e;stroke-width:2;rx:7} .soft{fill:#eef5f7;stroke:#6d889b;stroke-width:1.6;rx:7}
        .warm{fill:#fff3df;stroke:#b27a28;stroke-width:1.8;rx:7} .accent{fill:#e8f4ec;stroke:#43845a;stroke-width:1.8;rx:7}
        .line{stroke:#334b5f;stroke-width:2;fill:none;marker-end:url(#a)} .dash{stroke:#7a8791;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#a)}
      </style>
      <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#334b5f"/></marker></defs>
      <text x="40" y="42" class="title">ELBO balances reconstruction and posterior regularization</text>

<rect x="55" y="105" width="300" height="170" class="box"/><text x="100" y="145" class="h">expected reconstruction</text><text x="86" y="185" class="t">E_q [ log p_theta(x|z) ]</text><text x="85" y="225" class="s">preserve information needed for x</text>
<text x="385" y="195" class="title">-</text>
<rect x="430" y="105" width="290" height="170" class="warm"/><text x="482" y="145" class="h">KL regularization</text><text x="470" y="185" class="t">KL(q_phi(z|x) || p(z))</text><text x="472" y="225" class="s">make aggregate codes sampleable</text>
<text x="750" y="195" class="title">=</text>
<rect x="795" y="105" width="250" height="170" class="accent"/><text x="890" y="145" class="h">ELBO</text><text x="825" y="185" class="t">lower bound on log p(x)</text><text x="828" y="225" class="s">tractable optimization target</text>

    </svg>
