<svg xmlns="http://www.w3.org/2000/svg" width="980" height="390" viewBox="0 0 980 390" role="img">
<style>
  .bg { fill:#fbfcfe; } .panel { fill:#fff; stroke:#425466; stroke-width:2; rx:10; }
  .blue { fill:#e7f0ff; stroke:#2563eb; stroke-width:2; rx:10; }
  .green { fill:#e8f7ef; stroke:#198754; stroke-width:2; rx:10; }
  .amber { fill:#fff4d6; stroke:#c47f00; stroke-width:2; rx:10; }
  .red { fill:#fdebec; stroke:#c43d4b; stroke-width:2; rx:10; }
  .violet { fill:#f0eafd; stroke:#7357b6; stroke-width:2; rx:10; }
  .text { font:16px Arial,sans-serif; fill:#17202a; } .small { font:13px Arial,sans-serif; fill:#334155; }
  .title { font:bold 20px Arial,sans-serif; fill:#17202a; } .label { font:bold 15px Arial,sans-serif; fill:#17202a; }
  .line { stroke:#425466; stroke-width:2.2; fill:none; marker-end:url(#arrow); }
  .dash { stroke:#64748b; stroke-width:2; stroke-dasharray:7 6; fill:none; marker-end:url(#arrow); }
  .axis { stroke:#334155; stroke-width:1.8; fill:none; } .grid { stroke:#d7dee8; stroke-width:1; }
</style>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#425466"/></marker></defs>
<rect class="bg" width="100%" height="100%"/>
      <text class="title" x="490" y="30" text-anchor="middle">Alignment requires a multi-axis evaluation ledger</text>
      <rect class="green" x="45" y="85" width="205" height="90"/><text class="label" x="147" y="119" text-anchor="middle">Task quality</text><text class="small" x="147" y="146" text-anchor="middle">helpfulness / accuracy</text>
      <rect class="blue" x="285" y="85" width="205" height="90"/><text class="label" x="387" y="119" text-anchor="middle">Preference fit</text><text class="small" x="387" y="146" text-anchor="middle">win rate / calibration</text>
      <rect class="amber" x="525" y="85" width="205" height="90"/><text class="label" x="627" y="119" text-anchor="middle">Policy drift</text><text class="small" x="627" y="146" text-anchor="middle">KL / style / length</text>
      <rect class="red" x="765" y="85" width="170" height="90"/><text class="label" x="850" y="119" text-anchor="middle">Safety</text><text class="small" x="850" y="146" text-anchor="middle">red-team suites</text>
      <rect class="violet" x="165" y="235" width="205" height="90"/><text class="label" x="267" y="269" text-anchor="middle">Robustness</text><text class="small" x="267" y="296" text-anchor="middle">OOD / jailbreaks</text>
      <rect class="panel" x="405" y="235" width="205" height="90"/><text class="label" x="507" y="269" text-anchor="middle">Efficiency</text><text class="small" x="507" y="296" text-anchor="middle">latency / memory</text>
      <rect class="blue" x="645" y="235" width="205" height="90"/><text class="label" x="747" y="269" text-anchor="middle">Human oversight</text><text class="small" x="747" y="296" text-anchor="middle">audits / appeals</text>
      <path class="dash" d="M490 175 V235"/><text class="small" x="490" y="363" text-anchor="middle">No single reward-model score can certify all seven axes.</text>
    </svg>