<text x="550" y="42" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700">A Bellman target backs future value into the present</text>
<circle cx="170" cy="210" r="66" fill="#e8f1fb" stroke="#2a6f97" stroke-width="3"/><text x="170" y="205" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700">s<tspan baseline-shift="sub">t</tspan></text><text x="170" y="238" text-anchor="middle" font-family="Arial" font-size="17">estimate Q(s,a)</text>
