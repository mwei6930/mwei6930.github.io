<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img">
<style>
  text { font-family: Inter, Segoe UI, Arial, sans-serif; fill: #172033; letter-spacing: 0; }
  .title { font-size: 28px; font-weight: 700; } .label { font-size: 20px; font-weight: 650; } .small { font-size: 16px; }
  .box { fill: #fff; stroke: #40556f; stroke-width: 2; rx: 7; } .blue { fill: #e8f1ff; stroke: #2463a6; stroke-width: 2; rx: 7; }
  .green { fill: #eef5f2; stroke: #31725f; stroke-width: 2; rx: 7; } .warm { fill: #fff3df; stroke: #a76315; stroke-width: 2; rx: 7; }
  .pink { fill: #fdecef; stroke: #aa455b; stroke-width: 2; rx: 7; } .arrow { stroke: #40556f; stroke-width: 3; fill: none; marker-end: url(#arrow); }
  .dash { stroke: #718096; stroke-width: 2; stroke-dasharray: 7 6; fill: none; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#40556f"/></marker></defs>
<rect width="100%" height="100%" fill="#fbfcfe"/>
<text x="600" y="44" text-anchor="middle" class="title">How major self-supervised families avoid trivial solutions</text>
<rect x="40" y="95" width="260" height="440" class="blue"/><text x="170" y="140" text-anchor="middle" class="label">SimCLR</text><text x="170" y="185" text-anchor="middle" class="small">one shared encoder</text><text x="170" y="220" text-anchor="middle" class="small">in-batch negatives</text><circle cx="115" cy="315" r="30" fill="#8bb8e8"/><circle cx="225" cy="315" r="30" fill="#8bb8e8"/><path d="M148 315 L192 315" class="arrow"/><text x="170" y="390" text-anchor="middle" class="small">large batch expands dictionary</text><text x="170" y="485" text-anchor="middle" class="small">projection head discarded</text>
<rect x="330" y="95" width="260" height="440" class="green"/><text x="460" y="140" text-anchor="middle" class="label">MoCo</text><text x="460" y="185" text-anchor="middle" class="small">query + momentum key</text><text x="460" y="220" text-anchor="middle" class="small">FIFO negative queue</text><rect x="375" y="292" width="170" height="55" class="box"/><text x="460" y="326" text-anchor="middle" class="small">k₁ k₂ k₃ … kQ</text><path d="M460 365 L460 420" class="arrow"/><text x="460" y="455" text-anchor="middle" class="small">large, slowly changing dictionary</text>
<rect x="620" y="95" width="260" height="440" class="warm"/><text x="750" y="140" text-anchor="middle" class="label">BYOL</text><text x="750" y="185" text-anchor="middle" class="small">online predicts target</text><text x="750" y="220" text-anchor="middle" class="small">stop-gradient + EMA</text><rect x="665" y="280" width="170" height="62" class="box"/><text x="750" y="318" text-anchor="middle" class="small">predictor qθ(z₁)</text><path d="M750 350 L750 410" class="arrow"/><rect x="665" y="410" width="170" height="62" class="box"/><text x="750" y="448" text-anchor="middle" class="small">target z₂</text>
<rect x="910" y="95" width="250" height="440" class="pink"/><text x="1035" y="140" text-anchor="middle" class="label">DINO</text><text x="1035" y="185" text-anchor="middle" class="small">student matches teacher</text><text x="1035" y="220" text-anchor="middle" class="small">centering + sharpening</text><circle cx="990" cy="325" r="38" fill="#e8a8b5"/><circle cx="1080" cy="325" r="38" fill="#e8a8b5"/><path d="M1028 325 L1042 325" class="arrow"/><text x="1035" y="410" text-anchor="middle" class="small">distribution over prototypes</text><text x="1035" y="485" text-anchor="middle" class="small">teacher updated by EMA</text></svg>