<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560">
<rect width="100%" height="100%" fill="#ffffff"/>
<style>text{font-family:Arial,sans-serif;fill:#202124}.title{font-size:27px;font-weight:700}.label{font-size:19px;font-weight:700}.body{font-size:16px}.small{font-size:14px;fill:#4b5563}</style>

<text x="550" y="42" text-anchor="middle" class="title">Autoregressive factorization turns one joint distribution into ordered conditionals</text>
<defs><marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 z" fill="#334155"/></marker></defs>
<g><rect x="70" y="180" width="115" height="85" fill="#dbeafe"/><rect x="235" y="180" width="115" height="85" fill="#dcfce7"/><rect x="400" y="180" width="115" height="85" fill="#fef3c7"/><rect x="565" y="180" width="115" height="85" fill="#f3e8ff"/><rect x="730" y="180" width="115" height="85" fill="#fee2e2"/><rect x="895" y="180" width="115" height="85" fill="#e0f2fe"/></g>
<g class="label" text-anchor="middle"><text x="127" y="230">x1</text><text x="292" y="230">x2</text><text x="457" y="230">x3</text><text x="622" y="230">...</text><text x="787" y="230">x63</text><text x="952" y="230">x64</text></g>
<path d="M185 222 H235 M350 222 H400 M515 222 H565 M680 222 H730 M845 222 H895" stroke="#334155" stroke-width="4" marker-end="url(#a)"/>
<text x="127" y="330" text-anchor="middle" class="body">p(x1)</text><text x="292" y="330" text-anchor="middle" class="body">p(x2 | x1)</text><text x="457" y="330" text-anchor="middle" class="body">p(x3 | x&lt;3)</text><text x="787" y="330" text-anchor="middle" class="body">p(x63 | x&lt;63)</text><text x="952" y="330" text-anchor="middle" class="body">p(x64 | x&lt;64)</text>
<text x="550" y="430" text-anchor="middle" class="label">training evaluates all conditionals in parallel; sampling commits one token at a time</text>

</svg>