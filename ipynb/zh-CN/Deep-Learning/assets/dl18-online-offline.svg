<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img">
<style>
  .bg { fill:#fbfcfe; } .panel { fill:#fff; stroke:#425466; stroke-width:2; rx:10; }
  .blue { fill:#e7f0ff; stroke:#2563eb; stroke-width:2; rx:10; }
  .green { fill:#e8f7ef; stroke:#198754; stroke-width:2; rx:10; }
  .amber { fill:#fff4d6; stroke:#c47f00; stroke-width:2; rx:10; }
  .red { fill:#fdebec; stroke:#c43d4b; stroke-width:2; rx:10; }
  .violet { fill:#f0eafd; stroke:#7357b6; stroke-width:2; rx:10; }
  .text { font:16px Arial,sans-serif; fill:#17202a; } .small { font:13px Arial,sans-serif; fill:#334155; }
  .title { font:bold 20px Arial,sans-serif; fill:#17202a; } .label { font:bold 15px Arial,sans-serif; fill:#17202a; }
  .line { stroke:#425466; stroke-width:2.2; fill:none; marker-end:url(#arrow); }
  .dash { stroke:#64748b; stroke-width:2; stroke-dasharray:7 6; fill:none; marker-end:url(#arrow); }
  .axis { stroke:#334155; stroke-width:1.8; fill:none; } .grid { stroke:#d7dee8; stroke-width:1; }
</style>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#425466"/></marker></defs>
<rect class="bg" width="100%" height="100%"/>
      <text class="title" x="480" y="30" text-anchor="middle">Offline preference learning versus an online data flywheel</text>
      <rect class="panel" x="45" y="80" width="350" height="190"/><text class="title" x="220" y="113" text-anchor="middle">Offline</text><text class="text" x="220" y="151" text-anchor="middle">fixed prompts + fixed pairs</text><text class="small" x="220" y="185" text-anchor="middle">stable and reproducible</text><text class="small" x="220" y="215" text-anchor="middle">cannot repair policy-induced shift</text><text class="small" x="220" y="245" text-anchor="middle">coverage is inherited</text>
      <rect class="blue" x="565" y="65" width="175" height="65"/><text class="label" x="652" y="104" text-anchor="middle">Current policy</text>
      <path class="line" d="M740 98 H855 V190"/><rect class="amber" x="740" y="190" width="170" height="65"/><text class="label" x="825" y="229" text-anchor="middle">New feedback</text>
      <path class="line" d="M740 222 H650 V285 H500 V98 H565"/>
      <text class="small" x="650" y="313" text-anchor="middle">Online: collect -&gt; label -&gt; update -&gt; re-audit</text>
    </svg>