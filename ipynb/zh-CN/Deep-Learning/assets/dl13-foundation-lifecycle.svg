<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560">
<rect width="100%" height="100%" fill="#ffffff"/>
<style>
text { font-family: Arial, sans-serif; fill: #202124; }
.title { font-size: 27px; font-weight: 700; } .label { font-size: 19px; font-weight: 700; }
.body { font-size: 16px; } .small { font-size: 14px; fill: #4b5563; }
</style>

<text x="550" y="42" text-anchor="middle" class="title">A foundation model is a reusable system, not only a large checkpoint</text>
<defs><marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 z" fill="#334155"/></marker></defs>
<rect x="45" y="205" width="170" height="95" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="130" y="242" text-anchor="middle" class="label">Broad data</text><text x="130" y="270" text-anchor="middle" class="body">sources + governance</text>
<rect x="275" y="180" width="210" height="145" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="380" y="225" text-anchor="middle" class="label">Pretraining</text><text x="380" y="255" text-anchor="middle" class="body">shared representations</text><text x="380" y="283" text-anchor="middle" class="body">and interfaces</text>
<rect x="545" y="180" width="210" height="145" rx="8" fill="#f3e8ff" stroke="#7c3aed" stroke-width="3"/><text x="650" y="225" text-anchor="middle" class="label">Adaptation</text><text x="650" y="255" text-anchor="middle" class="body">prompts, heads, PEFT</text><text x="650" y="283" text-anchor="middle" class="body">or full updates</text>
<rect x="815" y="205" width="240" height="95" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/><text x="935" y="242" text-anchor="middle" class="label">Many deployments</text><text x="935" y="270" text-anchor="middle" class="body">tasks, domains, modalities</text>
<path d="M215 252 H275 M485 252 H545 M755 252 H815" stroke="#334155" stroke-width="4" marker-end="url(#a)"/>
<path d="M935 315 C935 450 380 470 380 340" fill="none" stroke="#dc2626" stroke-width="4" marker-end="url(#a)"/>
<text x="660" y="454" text-anchor="middle" class="label">monitoring and downstream failures feed back</text>

</svg>