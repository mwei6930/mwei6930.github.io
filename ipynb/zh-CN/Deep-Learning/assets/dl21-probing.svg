<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#68758a"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="60" y="58" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#172033">Representation probes are diagnostic instruments</text>
<text x="60" y="90" font-family="Arial, sans-serif" font-size="17" fill="#526077">High probe accuracy means information is decodable, not that the model uses it causally.</text>
<rect x="65" y="190" width="230" height="170" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="3"/><rect x="65" y="190" width="230" height="10" rx="5" fill="#2563eb"/><text x="83" y="232" font-family="Arial" font-size="20" font-weight="700" fill="#172033">Frozen network</text><text x="83" y="265" font-family="Arial" font-size="16" fill="#526077">raw -> conv1 -> conv2</text><text x="83" y="290" font-family="Arial" font-size="16" fill="#526077">-> embedding</text>
<line x1="295" y1="275" x2="430" y2="275" stroke="#68758a" stroke-width="3" marker-end="url(#arrow)"/><text x="362.5" y="266.0" text-anchor="middle" font-family="Arial" font-size="15" fill="#526077">extract</text>
<rect x="430" y="145" width="300" height="260" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="3"/><rect x="430" y="145" width="300" height="10" rx="5" fill="#16a34a"/><text x="448" y="187" font-family="Arial" font-size="20" font-weight="700" fill="#172033">Controlled probe</text><text x="448" y="220" font-family="Arial" font-size="16" fill="#526077">same split and regularization</text><text x="448" y="245" font-family="Arial" font-size="16" fill="#526077">linear head</text><text x="448" y="270" font-family="Arial" font-size="16" fill="#526077">selectivity baseline</text><text x="448" y="295" font-family="Arial" font-size="16" fill="#526077">held-out score</text>
<line x1="730" y1="275" x2="870" y2="275" stroke="#68758a" stroke-width="3" marker-end="url(#arrow)"/><text x="800.0" y="266.0" text-anchor="middle" font-family="Arial" font-size="15" fill="#526077">interpret</text>
<rect x="870" y="190" width="265" height="170" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="3"/><rect x="870" y="190" width="265" height="10" rx="5" fill="#dc2626"/><text x="888" y="232" font-family="Arial" font-size="20" font-weight="700" fill="#172033">Claim boundary</text><text x="888" y="265" font-family="Arial" font-size="16" fill="#526077">decodable information</text><text x="888" y="290" font-family="Arial" font-size="16" fill="#526077">not mechanism or causality</text>
<rect x="300" y="465" width="600" height="80" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="3"/><rect x="300" y="465" width="600" height="10" rx="5" fill="#d97706"/><text x="318" y="507" font-family="Arial" font-size="20" font-weight="700" fill="#172033">Confounds</text><text x="318" y="540" font-family="Arial" font-size="16" fill="#526077">dimension, probe capacity, data leakage, class imbalance, correlated concepts</text>
</svg>