<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img">
<style>
  .bg { fill:#fbfcfe; } .panel { fill:#fff; stroke:#425466; stroke-width:2; rx:10; }
  .blue { fill:#e7f0ff; stroke:#2563eb; stroke-width:2; rx:10; }
  .green { fill:#e8f7ef; stroke:#198754; stroke-width:2; rx:10; }
  .amber { fill:#fff4d6; stroke:#c47f00; stroke-width:2; rx:10; }
  .red { fill:#fdebec; stroke:#c43d4b; stroke-width:2; rx:10; }
  .violet { fill:#f0eafd; stroke:#7357b6; stroke-width:2; rx:10; }
  .text { font:16px Arial,sans-serif; fill:#17202a; } .small { font:13px Arial,sans-serif; fill:#334155; }
  .title { font:bold 20px Arial,sans-serif; fill:#17202a; } .label { font:bold 15px Arial,sans-serif; fill:#17202a; }
  .line { stroke:#425466; stroke-width:2.2; fill:none; marker-end:url(#arrow); }
  .dash { stroke:#64748b; stroke-width:2; stroke-dasharray:7 6; fill:none; marker-end:url(#arrow); }
  .axis { stroke:#334155; stroke-width:1.8; fill:none; } .grid { stroke:#d7dee8; stroke-width:1; }
</style>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#425466"/></marker></defs>
<rect class="bg" width="100%" height="100%"/>
      <text class="title" x="480" y="30" text-anchor="middle">DPO compares policy improvement relative to a reference</text>
      <rect class="green" x="55" y="75" width="250" height="90"/><text class="label" x="180" y="108" text-anchor="middle">Chosen response</text><text class="small" x="180" y="136" text-anchor="middle">log pi_theta - log pi_ref</text>
      <rect class="red" x="655" y="75" width="250" height="90"/><text class="label" x="780" y="108" text-anchor="middle">Rejected response</text><text class="small" x="780" y="136" text-anchor="middle">log pi_theta - log pi_ref</text>
      <path class="line" d="M305 120 H405"/><path class="line" d="M655 120 H555"/>
      <rect class="amber" x="405" y="83" width="150" height="74"/><text class="label" x="480" y="113" text-anchor="middle">Subtract</text><text class="small" x="480" y="139" text-anchor="middle">Delta_theta</text>
      <path class="line" d="M480 157 V222"/><rect class="violet" x="305" y="222" width="350" height="75"/><text class="label" x="480" y="253" text-anchor="middle">-log sigmoid(beta Delta_theta)</text><text class="small" x="480" y="279" text-anchor="middle">larger relative chosen margin -&gt; lower loss</text>
    </svg>