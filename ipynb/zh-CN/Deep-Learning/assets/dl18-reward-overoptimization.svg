      <path d="M110 290 C300 250 500 180 850 85" stroke="#2563eb" stroke-width="5" fill="none"/>
      <path d="M110 295 C300 250 470 165 610 155 C710 150 780 185 850 235" stroke="#c43d4b" stroke-width="5" fill="none"/>
