<svg xmlns="http://www.w3.org/2000/svg" width="980" height="350" viewBox="0 0 980 350" role="img">
<style>
  .bg { fill:#fbfcfe; } .panel { fill:#fff; stroke:#425466; stroke-width:2; rx:9; }
  .blue { fill:#e7f0ff; stroke:#2563eb; stroke-width:2; rx:9; }
  .green { fill:#e8f7ef; stroke:#198754; stroke-width:2; rx:9; }
  .amber { fill:#fff4d6; stroke:#c47f00; stroke-width:2; rx:9; }
  .red { fill:#fdebec; stroke:#c43d4b; stroke-width:2; rx:9; }
  .violet { fill:#f0eafd; stroke:#7357b6; stroke-width:2; rx:9; }
  .text { font:16px Arial,sans-serif; fill:#17202a; } .small { font:13px Arial,sans-serif; fill:#334155; }
  .title { font:bold 20px Arial,sans-serif; fill:#17202a; } .label { font:bold 15px Arial,sans-serif; fill:#17202a; }
  .line { stroke:#425466; stroke-width:2.2; fill:none; marker-end:url(#arrow); }
  .dash { stroke:#64748b; stroke-width:2; stroke-dasharray:7 6; fill:none; marker-end:url(#arrow); }
  .axis { stroke:#334155; stroke-width:1.8; fill:none; } .grid { stroke:#d7dee8; stroke-width:1; }
</style>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#425466"/></marker></defs>
<rect class="bg" width="100%" height="100%"/>
      <text class="title" x="490" y="30" text-anchor="middle">Floating-point formats trade dynamic range against precision</text>
      <text class="label" x="75" y="82" text-anchor="start">format</text><text class="label" x="230" y="82" text-anchor="middle">sign</text><text class="label" x="390" y="82" text-anchor="middle">exponent</text><text class="label" x="675" y="82" text-anchor="middle">fraction / mantissa</text><text class="label" x="890" y="82" text-anchor="middle">bits</text>
      <rect class="red" x="180" y="100" width="100" height="42"/><text class="small" x="230" y="127" text-anchor="middle">1</text><rect class="blue" x="280" y="100" width="225" height="42"/><text class="small" x="392" y="127" text-anchor="middle">8</text><rect class="green" x="505" y="100" width="335" height="42"/><text class="small" x="672" y="127" text-anchor="middle">23</text><text class="label" x="75" y="128" text-anchor="start">FP32</text><text class="small" x="890" y="128" text-anchor="middle">32</text>
      <rect class="red" x="180" y="154" width="100" height="42"/><text class="small" x="230" y="181" text-anchor="middle">1</text><rect class="blue" x="280" y="154" width="145" height="42"/><text class="small" x="352" y="181" text-anchor="middle">5</text><rect class="green" x="425" y="154" width="415" height="42"/><text class="small" x="632" y="181" text-anchor="middle">10</text><text class="label" x="75" y="182" text-anchor="start">FP16</text><text class="small" x="890" y="182" text-anchor="middle">16</text>
      <rect class="red" x="180" y="208" width="100" height="42"/><text class="small" x="230" y="235" text-anchor="middle">1</text><rect class="blue" x="280" y="208" width="225" height="42"/><text class="small" x="392" y="235" text-anchor="middle">8</text><rect class="green" x="505" y="208" width="335" height="42"/><text class="small" x="672" y="235" text-anchor="middle">7</text><text class="label" x="75" y="236" text-anchor="start">BF16</text><text class="small" x="890" y="236" text-anchor="middle">16</text>
      <rect class="red" x="180" y="262" width="100" height="42"/><text class="small" x="230" y="289" text-anchor="middle">1</text><rect class="blue" x="280" y="262" width="115" height="42"/><text class="small" x="337" y="289" text-anchor="middle">4 / 5</text><rect class="green" x="395" y="262" width="445" height="42"/><text class="small" x="617" y="289" text-anchor="middle">3 / 2</text><text class="label" x="75" y="290" text-anchor="start">FP8</text><text class="small" x="890" y="290" text-anchor="middle">8</text>
      <text class="small" x="490" y="332" text-anchor="middle">E4M3 favors precision; E5M2 favors range. Scaling metadata is part of the recipe.</text>
    </svg>