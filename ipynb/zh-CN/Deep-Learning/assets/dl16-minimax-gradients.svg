    <svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360">
      <rect width="1100" height="360" fill="#fbfcfe"/>
      <style>
        .title{font:700 25px Arial;fill:#17212b} .h{font:700 18px Arial;fill:#17212b}
        .t{font:15px Arial;fill:#263746} .s{font:13px Arial;fill:#51606d}
        .box{fill:#fff;stroke:#436b8e;stroke-width:2;rx:7} .soft{fill:#eef5f7;stroke:#6d889b;stroke-width:1.6;rx:7}
        .warm{fill:#fff3df;stroke:#b27a28;stroke-width:1.8;rx:7} .accent{fill:#e8f4ec;stroke:#43845a;stroke-width:1.8;rx:7}
        .line{stroke:#334b5f;stroke-width:2;fill:none;marker-end:url(#a)} .dash{stroke:#7a8791;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#a)}
      </style>
      <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#334b5f"/></marker></defs>
      <text x="40" y="42" class="title">Saturating and non-saturating generator losses share an optimum, not gradients</text>
<rect x="55" y="100" width="450" height="190" class="warm"/><text x="105" y="140" class="h">minimax / saturating</text><text x="90" y="180" class="t">minimize log(1 - D(G(z)))</text><text x="90" y="220" class="s">gradient can vanish when D rejects fake samples</text><path d="M100 260 C180 250 260 245 455 120" stroke="#b27a28" stroke-width="4" fill="none"/>
<rect x="595" y="100" width="450" height="190" class="accent"/><text x="660" y="140" class="h">non-saturating</text><text x="635" y="180" class="t">minimize -log D(G(z))</text><text x="635" y="220" class="s">stronger early gradient with same fixed point</text><path d="M640 260 C720 170 820 125 995 115" stroke="#43845a" stroke-width="4" fill="none"/>

    </svg>
