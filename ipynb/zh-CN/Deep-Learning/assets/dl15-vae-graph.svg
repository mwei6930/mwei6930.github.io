    <svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360">
      <rect width="1100" height="360" fill="#fbfcfe"/>
      <style>
        .title{font:700 25px Arial;fill:#17212b} .h{font:700 18px Arial;fill:#17212b}
        .t{font:15px Arial;fill:#263746} .s{font:13px Arial;fill:#51606d}
        .box{fill:#fff;stroke:#436b8e;stroke-width:2;rx:7} .soft{fill:#eef5f7;stroke:#6d889b;stroke-width:1.6;rx:7}
        .warm{fill:#fff3df;stroke:#b27a28;stroke-width:1.8;rx:7} .accent{fill:#e8f4ec;stroke:#43845a;stroke-width:1.8;rx:7}
        .line{stroke:#334b5f;stroke-width:2;fill:none;marker-end:url(#a)} .dash{stroke:#7a8791;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#a)}
      </style>
      <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#334b5f"/></marker></defs>
      <text x="40" y="42" class="title">Variational autoencoder: inference model and generative model</text>

<rect x="70" y="120" width="210" height="120" class="box"/><text x="120" y="160" class="h">observed x</text><text x="105" y="200" class="s">encoder input / decoder target</text>
<rect x="420" y="95" width="250" height="170" class="accent"/><text x="472" y="135" class="h">latent z</text><text x="450" y="172" class="t">q_phi(z|x) approximates</text><text x="470" y="202" class="t">p_theta(z|x)</text><text x="456" y="238" class="s">prior p(z) regularizes codes</text>
<rect x="820" y="120" width="210" height="120" class="warm"/><text x="868" y="160" class="h">generated x</text><text x="854" y="200" class="s">sample z then p_theta(x|z)</text>
<path d="M280 160 C340 80 375 90 420 130" class="line"/><text x="305" y="86" class="s">inference q_phi</text><path d="M670 180 L820 180" class="line"/><text x="700" y="160" class="s">decoder p_theta</text><path d="M545 70 L545 95" class="line"/><text x="485" y="66" class="s">z ~ p(z) for sampling</text>

    </svg>
