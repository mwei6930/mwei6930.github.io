<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Key-value cache during autoregressive decoding</title>
  <desc id="desc">Past keys and values are stored once, while each new token produces one query, key, and value and attends to the cache.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#374151"/></marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #111827; letter-spacing: 0; }
      .head { font-size: 25px; font-weight: 700; }
      .label { font-size: 19px; font-weight: 600; }
      .small { font-size: 17px; }
      .box { stroke: #374151; stroke-width: 2; rx: 6; }
      .arrow { stroke: #374151; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="500" fill="#ffffff"/>
  <text x="600" y="40" text-anchor="middle" class="head">Autoregressive decoding with a KV cache</text>
  <text x="165" y="92" text-anchor="middle" class="label">previous tokens</text>
  <g fill="#dbeafe">
    <rect x="45" y="120" width="70" height="58" class="box"/><rect x="125" y="120" width="70" height="58" class="box"/><rect x="205" y="120" width="70" height="58" class="box"/>
  </g>
  <text x="80" y="156" text-anchor="middle" class="small">y₁</text><text x="160" y="156" text-anchor="middle" class="small">y₂</text><text x="240" y="156" text-anchor="middle" class="small">yₜ</text>
  <path d="M285 149 L390 149" class="arrow"/>
  <rect x="410" y="92" width="220" height="118" class="box" fill="#f3f4f6"/>
  <text x="520" y="132" text-anchor="middle" class="label">project once</text>
  <text x="520" y="166" text-anchor="middle" class="small">K₁…Kₜ and V₁…Vₜ</text>
  <path d="M520 220 L520 285" class="arrow"/>
  <rect x="355" y="305" width="330" height="100" class="box" fill="#dcfce7"/>
  <text x="520" y="343" text-anchor="middle" class="label">persistent cache</text>
  <text x="520" y="376" text-anchor="middle" class="small">append Kₜ₊₁,Vₜ₊₁; do not reproject history</text>

  <rect x="775" y="105" width="105" height="72" class="box" fill="#fee2e2"/>
  <text x="827" y="135" text-anchor="middle" class="small">new token</text><text x="827" y="159" text-anchor="middle" class="label">yₜ₊₁</text>
  <path d="M890 141 L975 141" class="arrow"/>
  <rect x="995" y="88" width="155" height="106" class="box" fill="#fef3c7"/>
  <text x="1072" y="126" text-anchor="middle" class="small">new projections</text>
  <text x="1072" y="160" text-anchor="middle" class="label">Qₜ₊₁,Kₜ₊₁,Vₜ₊₁</text>
  <path d="M1020 210 C950 285 795 305 695 340" class="arrow"/>
  <path d="M700 355 C815 375 920 365 1000 300" class="arrow"/>
  <rect x="985" y="250" width="170" height="100" class="box" fill="#e9d5ff"/>
  <text x="1070" y="286" text-anchor="middle" class="label">attention</text>
  <text x="1070" y="318" text-anchor="middle" class="small">Qₜ₊₁ against cached K,V</text>
  <text x="600" y="465" text-anchor="middle" class="small">The cache saves repeated K/V projection, but attention over all retained keys still grows with context length.</text>
</svg>
