<text x="880" y="130" text-anchor="middle" class="label">After alignment</text>
<g fill="#2563eb"><circle cx="130" cy="210" r="15"/><circle cx="175" cy="175" r="15"/><circle cx="205" cy="230" r="15"/><circle cx="155" cy="275" r="15"/></g>
<g fill="#dc2626"><rect x="270" y="285" width="27" height="27"/><rect x="315" y="235" width="27" height="27"/><rect x="260" y="345" width="27" height="27"/><rect x="325" y="325" width="27" height="27"/></g>
<g fill="#2563eb"><circle cx="790" cy="220" r="15"/><circle cx="840" cy="180" r="15"/><circle cx="875" cy="245" r="15"/><circle cx="820" cy="300" r="15"/></g>
<g fill="#dc2626"><rect x="825" y="260" width="27" height="27"/><rect x="895" y="195" width="27" height="27"/><rect x="870" y="315" width="27" height="27"/><rect x="925" y="270" width="27" height="27"/></g>
<path d="M430 260 H655" stroke="#7c3aed" stroke-width="5" marker-end="url(#a)"/>
