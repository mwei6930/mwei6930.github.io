<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360" role="img">
<style>
  .bg { fill:#fbfcfe; } .panel { fill:#fff; stroke:#425466; stroke-width:2; rx:9; }
  .blue { fill:#e7f0ff; stroke:#2563eb; stroke-width:2; rx:9; }
  .green { fill:#e8f7ef; stroke:#198754; stroke-width:2; rx:9; }
  .amber { fill:#fff4d6; stroke:#c47f00; stroke-width:2; rx:9; }
  .red { fill:#fdebec; stroke:#c43d4b; stroke-width:2; rx:9; }
  .violet { fill:#f0eafd; stroke:#7357b6; stroke-width:2; rx:9; }
  .text { font:16px Arial,sans-serif; fill:#17202a; } .small { font:13px Arial,sans-serif; fill:#334155; }
  .title { font:bold 20px Arial,sans-serif; fill:#17202a; } .label { font:bold 15px Arial,sans-serif; fill:#17202a; }
  .line { stroke:#425466; stroke-width:2.2; fill:none; marker-end:url(#arrow); }
  .dash { stroke:#64748b; stroke-width:2; stroke-dasharray:7 6; fill:none; marker-end:url(#arrow); }
  .axis { stroke:#334155; stroke-width:1.8; fill:none; } .grid { stroke:#d7dee8; stroke-width:1; }
</style>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#425466"/></marker></defs>
<rect class="bg" width="100%" height="100%"/>
      <text class="title" x="490" y="30" text-anchor="middle">Three orthogonal ways to fit a larger effective batch or model</text>
      <rect class="blue" x="40" y="80" width="270" height="210"/><text class="label" x="175" y="115" text-anchor="middle">Gradient accumulation</text><text class="small" x="175" y="150" text-anchor="middle">microbatch 1 -&gt; gradients</text><text class="small" x="175" y="180" text-anchor="middle">microbatch 2 -&gt; add</text><text class="small" x="175" y="210" text-anchor="middle">... -&gt; optimizer step</text><text class="small" x="175" y="250" text-anchor="middle">trades steps for memory</text>
      <rect class="green" x="355" y="80" width="270" height="210"/><text class="label" x="490" y="115" text-anchor="middle">Activation checkpointing</text><text class="small" x="490" y="150" text-anchor="middle">save boundaries</text><text class="small" x="490" y="180" text-anchor="middle">discard interior tensors</text><text class="small" x="490" y="210" text-anchor="middle">recompute in backward</text><text class="small" x="490" y="250" text-anchor="middle">trades FLOPs for memory</text>
      <rect class="amber" x="670" y="80" width="270" height="210"/><text class="label" x="805" y="115" text-anchor="middle">Offloading</text><text class="small" x="805" y="150" text-anchor="middle">move state to CPU / NVMe</text><text class="small" x="805" y="180" text-anchor="middle">prefetch before use</text><text class="small" x="805" y="210" text-anchor="middle">overlap transfer</text><text class="small" x="805" y="250" text-anchor="middle">trades bandwidth for memory</text>
      <text class="small" x="490" y="330" text-anchor="middle">Their costs compound; measure throughput after combining them.</text>
    </svg>