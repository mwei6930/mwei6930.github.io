<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img">
<style>
  .bg { fill:#fbfcfe; } .panel { fill:#fff; stroke:#425466; stroke-width:2; rx:9; }
  .blue { fill:#e7f0ff; stroke:#2563eb; stroke-width:2; rx:9; }
  .green { fill:#e8f7ef; stroke:#198754; stroke-width:2; rx:9; }
  .amber { fill:#fff4d6; stroke:#c47f00; stroke-width:2; rx:9; }
  .red { fill:#fdebec; stroke:#c43d4b; stroke-width:2; rx:9; }
  .violet { fill:#f0eafd; stroke:#7357b6; stroke-width:2; rx:9; }
  .text { font:16px Arial,sans-serif; fill:#17202a; } .small { font:13px Arial,sans-serif; fill:#334155; }
  .title { font:bold 20px Arial,sans-serif; fill:#17202a; } .label { font:bold 15px Arial,sans-serif; fill:#17202a; }
  .line { stroke:#425466; stroke-width:2.2; fill:none; marker-end:url(#arrow); }
  .dash { stroke:#64748b; stroke-width:2; stroke-dasharray:7 6; fill:none; marker-end:url(#arrow); }
  .axis { stroke:#334155; stroke-width:1.8; fill:none; } .grid { stroke:#d7dee8; stroke-width:1; }
</style>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#425466"/></marker></defs>
<rect class="bg" width="100%" height="100%"/>
      <text class="title" x="480" y="30" text-anchor="middle">A training step is limited by compute, memory traffic, or communication</text>
      <line class="axis" x1="105" y1="315" x2="880" y2="315"/><line class="axis" x1="105" y1="315" x2="105" y2="65"/>
      <path d="M110 305 L560 95 L850 95" stroke="#2563eb" stroke-width="5" fill="none"/>
      <line x1="640" y1="315" x2="640" y2="95" stroke="#c47f00" stroke-width="2" stroke-dasharray="7 6"/>
      <circle cx="300" cy="217" r="9" fill="#c43d4b"/><circle cx="720" cy="95" r="9" fill="#198754"/>
      <text class="label" x="300" y="202" text-anchor="middle">bandwidth-bound</text><text class="label" x="720" y="78" text-anchor="middle">compute-bound</text>
      <text class="small" x="490" y="352" text-anchor="middle">arithmetic intensity: useful FLOPs / bytes moved</text>
      <text class="small" transform="translate(38 235) rotate(-90)" text-anchor="middle">attainable FLOP/s</text>
      <text class="small" x="330" y="142" text-anchor="middle">slope = memory bandwidth</text><text class="small" x="760" y="125" text-anchor="middle">ceiling = peak compute</text>
