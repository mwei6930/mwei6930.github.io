<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">State-space model recurrent and convolutional views</title>
  <desc id="desc">A continuous state-space system is discretized, then evaluated either as a recurrent scan for streaming or as a causal convolution for parallel training.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#425466"/>
    </marker>
    <style>
      .title{font:700 28px Arial,sans-serif;fill:#172b3a}.label{font:700 20px Arial,sans-serif;fill:#172b3a}.text{font:17px Arial,sans-serif;fill:#304658}.formula{font:19px 'Times New Roman',serif;fill:#172b3a}.box{stroke-width:2}.arrow{stroke:#425466;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="610" fill="#ffffff"/>
  <text x="600" y="42" text-anchor="middle" class="title">One Linear State-Space Layer, Two Computational Views</text>

  <rect x="330" y="72" width="540" height="105" rx="8" fill="#eaf4ee" stroke="#3f7d5b" class="box"/>
  <text x="600" y="105" text-anchor="middle" class="label">Continuous-time dynamics</text>
  <text x="600" y="140" text-anchor="middle" class="formula">h'(t) = A h(t) + B u(t)     y(t) = C h(t) + D u(t)</text>

  <path d="M600 177 L600 225" class="arrow"/>
  <rect x="420" y="225" width="360" height="72" rx="8" fill="#fff2d8" stroke="#b27b20" class="box"/>
  <text x="600" y="255" text-anchor="middle" class="label">Discretize with step Δ</text>
  <text x="600" y="282" text-anchor="middle" class="formula">Ā = exp(ΔA),  B̄ = ∫ exp(τA)B dτ</text>

  <path d="M600 297 L600 330 L285 330 L285 365" class="arrow"/>
  <path d="M600 330 L915 330 L915 365" class="arrow"/>

  <rect x="70" y="365" width="430" height="170" rx="8" fill="#e8f1fb" stroke="#356fa3" class="box"/>
  <text x="285" y="400" text-anchor="middle" class="label">Recurrent scan</text>
  <text x="285" y="435" text-anchor="middle" class="formula">hₖ = Ā hₖ₋₁ + B̄ uₖ</text>
  <text x="285" y="468" text-anchor="middle" class="formula">yₖ = C hₖ + D uₖ</text>
  <text x="285" y="505" text-anchor="middle" class="text">Constant-size state; natural for streaming</text>

  <rect x="700" y="365" width="430" height="170" rx="8" fill="#f4ebf7" stroke="#87569a" class="box"/>
  <text x="915" y="400" text-anchor="middle" class="label">Causal convolution</text>
  <text x="915" y="435" text-anchor="middle" class="formula">K = (CB̄, CĀB̄, CĀ²B̄, ...)</text>
  <text x="915" y="468" text-anchor="middle" class="formula">y = K * u + D u</text>
  <text x="915" y="505" text-anchor="middle" class="text">All positions can be processed in parallel</text>

  <path d="M500 550 L700 550" class="arrow"/>
  <path d="M700 572 L500 572" class="arrow"/>
  <text x="600" y="566" text-anchor="middle" class="label">Equivalent only when the system is linear and time invariant</text>
</svg>
