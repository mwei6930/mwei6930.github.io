    <svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360">
      <rect width="1100" height="360" fill="#fbfcfe"/>
      <style>
        .title{font:700 25px Arial;fill:#17212b} .h{font:700 18px Arial;fill:#17212b}
        .t{font:15px Arial;fill:#263746} .s{font:13px Arial;fill:#51606d}
        .box{fill:#fff;stroke:#436b8e;stroke-width:2;rx:7} .soft{fill:#eef5f7;stroke:#6d889b;stroke-width:1.6;rx:7}
        .warm{fill:#fff3df;stroke:#b27a28;stroke-width:1.8;rx:7} .accent{fill:#e8f4ec;stroke:#43845a;stroke-width:1.8;rx:7}
        .line{stroke:#334b5f;stroke-width:2;fill:none;marker-end:url(#a)} .dash{stroke:#7a8791;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#a)}
      </style>
      <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#334b5f"/></marker></defs>
      <text x="40" y="42" class="title">Autoencoder bottleneck: reconstruction is not yet a generative model</text>

<rect x="65" y="125" width="190" height="110" class="box"/><text x="120" y="165" class="h">input x [B,64]</text><text x="100" y="200" class="s">8 x 8 grayscale digit</text>
<rect x="340" y="125" width="160" height="110" class="accent"/><text x="385" y="165" class="h">z [B,2]</text><text x="373" y="200" class="s">information bottleneck</text>
<rect x="585" y="125" width="190" height="110" class="box"/><text x="628" y="165" class="h">x-hat [B,64]</text><text x="624" y="200" class="s">reconstruction mean</text>
<rect x="855" y="125" width="180" height="110" class="warm"/><text x="895" y="165" class="h">sampling?</text><text x="879" y="200" class="s">no prior over z</text>
<path d="M255 180 L340 180" class="line"/><path d="M500 180 L585 180" class="line"/><path d="M775 180 L855 180" class="dash"/><text x="280" y="163" class="s">encoder</text><text x="520" y="163" class="s">decoder</text>

    </svg>
