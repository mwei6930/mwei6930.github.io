<svg xmlns="http://www.w3.org/2000/svg" width="980" height="280" viewBox="0 0 980 280" role="img">
<style>
  .bg { fill:#fbfcfe; } .panel { fill:#fff; stroke:#425466; stroke-width:2; rx:10; }
  .blue { fill:#e7f0ff; stroke:#2563eb; stroke-width:2; rx:10; }
  .green { fill:#e8f7ef; stroke:#198754; stroke-width:2; rx:10; }
  .amber { fill:#fff4d6; stroke:#c47f00; stroke-width:2; rx:10; }
  .red { fill:#fdebec; stroke:#c43d4b; stroke-width:2; rx:10; }
  .violet { fill:#f0eafd; stroke:#7357b6; stroke-width:2; rx:10; }
  .text { font:16px Arial,sans-serif; fill:#17202a; } .small { font:13px Arial,sans-serif; fill:#334155; }
  .title { font:bold 20px Arial,sans-serif; fill:#17202a; } .label { font:bold 15px Arial,sans-serif; fill:#17202a; }
  .line { stroke:#425466; stroke-width:2.2; fill:none; marker-end:url(#arrow); }
  .dash { stroke:#64748b; stroke-width:2; stroke-dasharray:7 6; fill:none; marker-end:url(#arrow); }
  .axis { stroke:#334155; stroke-width:1.8; fill:none; } .grid { stroke:#d7dee8; stroke-width:1; }
</style>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#425466"/></marker></defs>
<rect class="bg" width="100%" height="100%"/>
      <text class="title" x="490" y="32" text-anchor="middle">From a predictive base model to a deployment policy</text>
      <rect class="blue" x="35" y="85" width="170" height="92"/><text class="label" x="120" y="120" text-anchor="middle">Pretrained model</text><text class="small" x="120" y="147" text-anchor="middle">next-token prior</text>
      <path class="line" d="M205 131 H280"/><rect class="green" x="280" y="85" width="170" height="92"/><text class="label" x="365" y="120" text-anchor="middle">SFT</text><text class="small" x="365" y="147" text-anchor="middle">instruction following</text>
      <path class="line" d="M450 131 H525"/><rect class="amber" x="525" y="85" width="170" height="92"/><text class="label" x="610" y="120" text-anchor="middle">Preference stage</text><text class="small" x="610" y="147" text-anchor="middle">RM, DPO, or RLHF</text>
      <path class="line" d="M695 131 H770"/><rect class="violet" x="770" y="85" width="175" height="92"/><text class="label" x="857" y="120" text-anchor="middle">Evaluated policy</text><text class="small" x="857" y="147" text-anchor="middle">helpful + safe + stable</text>
      <path class="dash" d="M858 177 C858 238 610 242 610 177"/><text class="small" x="735" y="255" text-anchor="middle">evaluation and data flywheel</text>
    </svg>