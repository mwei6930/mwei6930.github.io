<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360" role="img">
<style>
  .bg { fill:#fbfcfe; } .panel { fill:#fff; stroke:#425466; stroke-width:2; rx:9; }
  .blue { fill:#e7f0ff; stroke:#2563eb; stroke-width:2; rx:9; }
  .green { fill:#e8f7ef; stroke:#198754; stroke-width:2; rx:9; }
  .amber { fill:#fff4d6; stroke:#c47f00; stroke-width:2; rx:9; }
  .red { fill:#fdebec; stroke:#c43d4b; stroke-width:2; rx:9; }
  .violet { fill:#f0eafd; stroke:#7357b6; stroke-width:2; rx:9; }
  .text { font:16px Arial,sans-serif; fill:#17202a; } .small { font:13px Arial,sans-serif; fill:#334155; }
  .title { font:bold 20px Arial,sans-serif; fill:#17202a; } .label { font:bold 15px Arial,sans-serif; fill:#17202a; }
  .line { stroke:#425466; stroke-width:2.2; fill:none; marker-end:url(#arrow); }
  .dash { stroke:#64748b; stroke-width:2; stroke-dasharray:7 6; fill:none; marker-end:url(#arrow); }
  .axis { stroke:#334155; stroke-width:1.8; fill:none; } .grid { stroke:#d7dee8; stroke-width:1; }
</style>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#425466"/></marker></defs>
<rect class="bg" width="100%" height="100%"/>
      <text class="title" x="490" y="30" text-anchor="middle">Tensor parallelism partitions one matrix multiplication</text>
      <rect class="blue" x="40" y="92" width="170" height="150"/><text class="label" x="125" y="125" text-anchor="middle">Input X</text><text class="small" x="125" y="155" text-anchor="middle">[B, D_in]</text>
      <path class="line" d="M210 167 H295"/>
      <rect class="green" x="295" y="72" width="180" height="92"/><text class="label" x="385" y="108" text-anchor="middle">W shard 0</text><text class="small" x="385" y="135" text-anchor="middle">output columns</text>
      <rect class="amber" x="295" y="184" width="180" height="92"/><text class="label" x="385" y="220" text-anchor="middle">W shard 1</text><text class="small" x="385" y="247" text-anchor="middle">output columns</text>
      <path class="line" d="M475 118 H585"/><path class="line" d="M475 230 H585"/>
      <rect class="violet" x="585" y="100" width="175" height="145"/><text class="label" x="672" y="137" text-anchor="middle">Local outputs</text><text class="small" x="672" y="167" text-anchor="middle">Y0 and Y1</text><text class="small" x="672" y="199" text-anchor="middle">concatenate</text>
      <path class="line" d="M760 172 H835"/><rect class="panel" x="835" y="125" width="110" height="95"/><text class="label" x="890" y="163" text-anchor="middle">Y</text><text class="small" x="890" y="190" text-anchor="middle">[B,D_out]</text>
      <text class="small" x="490" y="325" text-anchor="middle">Row-parallel layers instead sum partial outputs with an all-reduce.</text>
    </svg>