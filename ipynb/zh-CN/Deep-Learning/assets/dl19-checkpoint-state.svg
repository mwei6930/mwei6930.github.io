<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360" role="img">
<style>
  .bg { fill:#fbfcfe; } .panel { fill:#fff; stroke:#425466; stroke-width:2; rx:9; }
  .blue { fill:#e7f0ff; stroke:#2563eb; stroke-width:2; rx:9; }
  .green { fill:#e8f7ef; stroke:#198754; stroke-width:2; rx:9; }
  .amber { fill:#fff4d6; stroke:#c47f00; stroke-width:2; rx:9; }
  .red { fill:#fdebec; stroke:#c43d4b; stroke-width:2; rx:9; }
  .violet { fill:#f0eafd; stroke:#7357b6; stroke-width:2; rx:9; }
  .text { font:16px Arial,sans-serif; fill:#17202a; } .small { font:13px Arial,sans-serif; fill:#334155; }
  .title { font:bold 20px Arial,sans-serif; fill:#17202a; } .label { font:bold 15px Arial,sans-serif; fill:#17202a; }
  .line { stroke:#425466; stroke-width:2.2; fill:none; marker-end:url(#arrow); }
  .dash { stroke:#64748b; stroke-width:2; stroke-dasharray:7 6; fill:none; marker-end:url(#arrow); }
  .axis { stroke:#334155; stroke-width:1.8; fill:none; } .grid { stroke:#d7dee8; stroke-width:1; }
</style>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#425466"/></marker></defs>
<rect class="bg" width="100%" height="100%"/>
      <text class="title" x="490" y="30" text-anchor="middle">A resumable checkpoint captures the whole training state</text>
      <rect class="blue" x="35" y="85" width="175" height="90"/><text class="label" x="122" y="118" text-anchor="middle">Model</text><text class="small" x="122" y="146" text-anchor="middle">parameters + buffers</text>
      <rect class="green" x="230" y="85" width="175" height="90"/><text class="label" x="317" y="118" text-anchor="middle">Optimizer</text><text class="small" x="317" y="146" text-anchor="middle">moments + step</text>
      <rect class="amber" x="425" y="85" width="175" height="90"/><text class="label" x="512" y="118" text-anchor="middle">Schedule</text><text class="small" x="512" y="146" text-anchor="middle">LR + scaler</text>
      <rect class="violet" x="620" y="85" width="150" height="90"/><text class="label" x="695" y="118" text-anchor="middle">RNG</text><text class="small" x="695" y="146" text-anchor="middle">all ranks</text>
      <rect class="red" x="790" y="85" width="155" height="90"/><text class="label" x="867" y="118" text-anchor="middle">Data cursor</text><text class="small" x="867" y="146" text-anchor="middle">epoch + shard</text>
      <path class="line" d="M122 175 V245 H400"/><path class="line" d="M317 175 V245 H430"/><path class="line" d="M512 175 V245"/><path class="line" d="M695 175 V245 H590"/><path class="line" d="M867 175 V245 H620"/>
      <rect class="panel" x="390" y="220" width="240" height="90"/><text class="label" x="510" y="255" text-anchor="middle">Versioned manifest</text><text class="small" x="510" y="283" text-anchor="middle">atomic + validated</text>
      <text class="small" x="490" y="340" text-anchor="middle">Distributed checkpoints add per-rank shards and resharding metadata.</text>
    </svg>