<svg xmlns="http://www.w3.org/2000/svg" width="980" height="340" viewBox="0 0 980 340" role="img">
<style>
  .bg { fill:#fbfcfe; } .panel { fill:#fff; stroke:#425466; stroke-width:2; rx:9; }
  .blue { fill:#e7f0ff; stroke:#2563eb; stroke-width:2; rx:9; }
  .green { fill:#e8f7ef; stroke:#198754; stroke-width:2; rx:9; }
  .amber { fill:#fff4d6; stroke:#c47f00; stroke-width:2; rx:9; }
  .red { fill:#fdebec; stroke:#c43d4b; stroke-width:2; rx:9; }
  .violet { fill:#f0eafd; stroke:#7357b6; stroke-width:2; rx:9; }
  .text { font:16px Arial,sans-serif; fill:#17202a; } .small { font:13px Arial,sans-serif; fill:#334155; }
  .title { font:bold 20px Arial,sans-serif; fill:#17202a; } .label { font:bold 15px Arial,sans-serif; fill:#17202a; }
  .line { stroke:#425466; stroke-width:2.2; fill:none; marker-end:url(#arrow); }
  .dash { stroke:#64748b; stroke-width:2; stroke-dasharray:7 6; fill:none; marker-end:url(#arrow); }
  .axis { stroke:#334155; stroke-width:1.8; fill:none; } .grid { stroke:#d7dee8; stroke-width:1; }
</style>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#425466"/></marker></defs>
<rect class="bg" width="100%" height="100%"/>
      <text class="title" x="490" y="30" text-anchor="middle">Compilation can fuse graph regions and reduce launch and memory traffic</text>
      <rect class="blue" x="35" y="80" width="145" height="70"/><text class="label" x="107" y="110" text-anchor="middle">bias add</text><text class="small" x="107" y="134" text-anchor="middle">kernel 1</text>
      <path class="line" d="M180 115 H225"/><rect class="green" x="225" y="80" width="145" height="70"/><text class="label" x="297" y="110" text-anchor="middle">GELU</text><text class="small" x="297" y="134" text-anchor="middle">kernel 2</text>
      <path class="line" d="M370 115 H415"/><rect class="amber" x="415" y="80" width="145" height="70"/><text class="label" x="487" y="110" text-anchor="middle">dropout</text><text class="small" x="487" y="134" text-anchor="middle">kernel 3</text>
      <path class="line" d="M560 115 H650"/>
      <rect class="violet" x="650" y="70" width="275" height="90"/><text class="label" x="787" y="105" text-anchor="middle">Fused region</text><text class="small" x="787" y="132" text-anchor="middle">one generated kernel</text>
      <path class="dash" d="M35 245 H410"/><text class="small" x="222" y="278" text-anchor="middle">graph break: Python or data-dependent control</text>
      <rect class="red" x="410" y="210" width="165" height="70"/><text class="label" x="492" y="240" text-anchor="middle">graph break</text><text class="small" x="492" y="264" text-anchor="middle">new region</text>
      <path class="dash" d="M575 245 H925"/><text class="small" x="750" y="304" text-anchor="middle">recompilation if shape or guard changes</text>
    </svg>