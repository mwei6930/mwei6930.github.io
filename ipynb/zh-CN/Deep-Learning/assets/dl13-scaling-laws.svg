<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560">
<rect width="100%" height="100%" fill="#ffffff"/>
<style>
text { font-family: Arial, sans-serif; fill: #202124; }
.title { font-size: 27px; font-weight: 700; } .label { font-size: 19px; font-weight: 700; }
.body { font-size: 16px; } .small { font-size: 14px; fill: #4b5563; }
</style>

<text x="550" y="42" text-anchor="middle" class="title">Compute must be allocated between model capacity and data exposure</text>
<line x1="105" y1="430" x2="1005" y2="430" stroke="#334155" stroke-width="3"/><line x1="105" y1="90" x2="105" y2="430" stroke="#334155" stroke-width="3"/>
<text x="550" y="485" text-anchor="middle" class="label">model parameters N</text><text x="35" y="265" transform="rotate(-90 35 265)" text-anchor="middle" class="label">training tokens D</text>
<path d="M165 380 C300 320 430 265 560 220 S820 145 950 115" fill="none" stroke="#2563eb" stroke-width="8"/>
<path d="M175 125 C315 170 430 220 560 270 S800 355 945 390" fill="none" stroke="#dc2626" stroke-width="8" stroke-dasharray="12 9"/>
<text x="690" y="140" class="label">balanced compute frontier</text><text x="680" y="375" class="label">fixed compute: larger N leaves fewer tokens</text>
<circle cx="555" cy="244" r="18" fill="#16a34a"/><text x="580" y="250" class="body">candidate compute-optimal allocation</text>
<text x="165" y="525" class="small">Conceptual IsoFLOP view; exponents and optima are empirical and regime-dependent.</text>

