    <svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360">
      <rect width="1100" height="360" fill="#fbfcfe"/>
      <style>
        .title{font:700 25px Arial;fill:#17212b} .h{font:700 18px Arial;fill:#17212b}
        .t{font:15px Arial;fill:#263746} .s{font:13px Arial;fill:#51606d}
        .box{fill:#fff;stroke:#436b8e;stroke-width:2;rx:7} .soft{fill:#eef5f7;stroke:#6d889b;stroke-width:1.6;rx:7}
        .warm{fill:#fff3df;stroke:#b27a28;stroke-width:1.8;rx:7} .accent{fill:#e8f4ec;stroke:#43845a;stroke-width:1.8;rx:7}
        .line{stroke:#334b5f;stroke-width:2;fill:none;marker-end:url(#a)} .dash{stroke:#7a8791;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#a)}
      </style>
      <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#334b5f"/></marker></defs>
      <text x="40" y="42" class="title">RealNVP affine coupling: triangular Jacobian and exact inverse</text>

<rect x="55" y="100" width="210" height="180" class="box"/><text x="105" y="140" class="h">input (x_a, x_b)</text><text x="85" y="185" class="t">y_a = x_a</text><text x="85" y="220" class="t">y_b = x_b exp(s(x_a)) + t(x_a)</text><text x="85" y="255" class="s">one part conditions the other</text>
<rect x="355" y="100" width="300" height="180" class="accent"/><text x="430" y="140" class="h">change of variables</text><text x="390" y="185" class="t">log p_X(x) = log p_Z(f(x))</text><text x="405" y="220" class="t">+ log |det J_f(x)|</text><text x="405" y="255" class="s">determinant is sum of scale outputs</text>
<rect x="745" y="100" width="300" height="180" class="warm"/><text x="825" y="140" class="h">exact inverse</text><text x="785" y="185" class="t">x_a = y_a</text><text x="785" y="220" class="t">x_b = (y_b - t(y_a)) exp(-s(y_a))</text><text x="785" y="255" class="s">sample base z, then invert layers</text>
<path d="M265 190 L355 190" class="line"/><path d="M655 190 L745 190" class="line"/>

    </svg>
