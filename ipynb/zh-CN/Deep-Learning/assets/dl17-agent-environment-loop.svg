<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2364aa"/></marker></defs>
<rect width="1100" height="430" fill="#fbfcfe"/><text x="550" y="42" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#17202a">Agent-environment interaction is a closed data-generating loop</text>
<rect x="110" y="135" width="270" height="145" rx="8" fill="#e8f1fb" stroke="#2364aa" stroke-width="3"/><text x="245" y="185" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700">Agent</text><text x="245" y="225" text-anchor="middle" font-family="Arial" font-size="20">policy, value, memory</text>
<rect x="720" y="135" width="270" height="145" rx="8" fill="#f5ece5" stroke="#b05a2b" stroke-width="3"/><text x="855" y="185" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700">Environment</text><text x="855" y="225" text-anchor="middle" font-family="Arial" font-size="20">dynamics and reward</text>
<path d="M380 170 C500 100,610 100,720 170" fill="none" stroke="#2364aa" stroke-width="4" marker-end="url(#a)"/><text x="550" y="112" text-anchor="middle" font-family="Arial" font-size="21">action a<tspan baseline-shift="sub">t</tspan></text>
<path d="M720 250 C610 330,500 330,380 250" fill="none" stroke="#2364aa" stroke-width="4" marker-end="url(#a)"/><text x="550" y="350" text-anchor="middle" font-family="Arial" font-size="21">next observation, reward, termination</text>
<text x="550" y="398" text-anchor="middle" font-family="Arial" font-size="18" fill="#5d6d7e">Changing the policy changes the future training distribution.</text></svg>