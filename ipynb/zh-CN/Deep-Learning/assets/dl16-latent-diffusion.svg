    <svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360">
      <rect width="1100" height="360" fill="#fbfcfe"/>
      <style>
        .title{font:700 25px Arial;fill:#17212b} .h{font:700 18px Arial;fill:#17212b}
        .t{font:15px Arial;fill:#263746} .s{font:13px Arial;fill:#51606d}
        .box{fill:#fff;stroke:#436b8e;stroke-width:2;rx:7} .soft{fill:#eef5f7;stroke:#6d889b;stroke-width:1.6;rx:7}
        .warm{fill:#fff3df;stroke:#b27a28;stroke-width:1.8;rx:7} .accent{fill:#e8f4ec;stroke:#43845a;stroke-width:1.8;rx:7}
        .line{stroke:#334b5f;stroke-width:2;fill:none;marker-end:url(#a)} .dash{stroke:#7a8791;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#a)}
      </style>
      <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#334b5f"/></marker></defs>
      <text x="40" y="42" class="title">Latent diffusion moves iterative denoising into a compressed representation</text>
<rect x="45" y="115" width="170" height="130" class="box"/><text x="85" y="155" class="h">image x</text><text x="72" y="200" class="s">64 pixel values</text><rect x="290" y="115" width="170" height="130" class="accent"/><text x="335" y="155" class="h">encoder</text><text x="325" y="200" class="s">perceptual compression</text><rect x="535" y="90" width="220" height="180" class="soft"/><text x="580" y="130" class="h">latent diffusion</text><text x="565" y="170" class="t">iterative model in z space</text><text x="565" y="210" class="s">lower dimension / lost detail risk</text><rect x="830" y="115" width="170" height="130" class="warm"/><text x="875" y="155" class="h">decoder</text><text x="860" y="200" class="s">return to pixels</text><path d="M215 180 L290 180" class="line"/><path d="M460 180 L535 180" class="line"/><path d="M755 180 L830 180" class="line"/>

    </svg>
