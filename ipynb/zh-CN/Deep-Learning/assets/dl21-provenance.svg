<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#68758a"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="60" y="58" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#172033">Data and model provenance form a lineage graph</text>
<text x="60" y="90" font-family="Arial, sans-serif" font-size="17" fill="#526077">Every result should point to immutable inputs, transformations, code, and artifacts.</text>
<rect x="55" y="185" width="180" height="185" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="3"/><rect x="55" y="185" width="180" height="10" rx="5" fill="#2563eb"/><text x="73" y="227" font-family="Arial" font-size="20" font-weight="700" fill="#172033">Source</text><text x="73" y="260" font-family="Arial" font-size="16" fill="#526077">DOI, license</text><text x="73" y="285" font-family="Arial" font-size="16" fill="#526077">collection context</text>
<rect x="280" y="185" width="180" height="185" rx="8" fill="#ffffff" stroke="#0891b2" stroke-width="3"/><rect x="280" y="185" width="180" height="10" rx="5" fill="#0891b2"/><text x="298" y="227" font-family="Arial" font-size="20" font-weight="700" fill="#172033">Snapshot</text><text x="298" y="260" font-family="Arial" font-size="16" fill="#526077">version, checksum</text><text x="298" y="285" font-family="Arial" font-size="16" fill="#526077">schema</text>
<rect x="505" y="185" width="180" height="185" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="3"/><rect x="505" y="185" width="180" height="10" rx="5" fill="#d97706"/><text x="523" y="227" font-family="Arial" font-size="20" font-weight="700" fill="#172033">Transform</text><text x="523" y="260" font-family="Arial" font-size="16" fill="#526077">split IDs</text><text x="523" y="285" font-family="Arial" font-size="16" fill="#526077">fit-on-train state</text>
<rect x="730" y="185" width="180" height="185" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/><rect x="730" y="185" width="180" height="10" rx="5" fill="#7c3aed"/><text x="748" y="227" font-family="Arial" font-size="20" font-weight="700" fill="#172033">Run</text><text x="748" y="260" font-family="Arial" font-size="16" fill="#526077">code and seed</text><text x="748" y="285" font-family="Arial" font-size="16" fill="#526077">environment</text>
<rect x="955" y="185" width="180" height="185" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="3"/><rect x="955" y="185" width="180" height="10" rx="5" fill="#16a34a"/><text x="973" y="227" font-family="Arial" font-size="20" font-weight="700" fill="#172033">Artifact</text><text x="973" y="260" font-family="Arial" font-size="16" fill="#526077">weights, metrics</text><text x="973" y="285" font-family="Arial" font-size="16" fill="#526077">approvals</text>
<line x1="235" y1="278" x2="280" y2="278" stroke="#68758a" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="460" y1="278" x2="505" y2="278" stroke="#68758a" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="685" y1="278" x2="730" y2="278" stroke="#68758a" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="910" y1="278" x2="955" y2="278" stroke="#68758a" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="305" y="455" width="590" height="90" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="3"/><rect x="305" y="455" width="590" height="10" rx="5" fill="#dc2626"/><text x="323" y="497" font-family="Arial" font-size="20" font-weight="700" fill="#172033">Reproducible claim</text><text x="323" y="530" font-family="Arial" font-size="16" fill="#526077">metric = function(data snapshot, split, code, configuration, artifact, evaluator)</text>
</svg>