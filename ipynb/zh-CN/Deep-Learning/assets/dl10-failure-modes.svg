<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img">
<style>
  text { font-family: Inter, Segoe UI, Arial, sans-serif; fill: #172033; letter-spacing: 0; }
  .title { font-size: 28px; font-weight: 700; }
  .label { font-size: 20px; font-weight: 600; }
  .small { font-size: 16px; }
  .box { fill: #ffffff; stroke: #40556f; stroke-width: 2; rx: 7; }
  .soft { fill: #eef5f2; stroke: #31725f; stroke-width: 2; rx: 7; }
  .warm { fill: #fff3df; stroke: #a76315; stroke-width: 2; rx: 7; }
  .blue { fill: #e8f1ff; stroke: #2463a6; stroke-width: 2; rx: 7; }
  .arrow { stroke: #40556f; stroke-width: 3; fill: none; marker-end: url(#arrow); }
  .thin { stroke: #6b7788; stroke-width: 2; fill: none; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#40556f"/></marker></defs>
<rect width="100%" height="100%" fill="#fbfcfe"/>
<text x="600" y="44" text-anchor="middle" class="title">Two different depth failures in message passing</text>
<rect x="45" y="95" width="525" height="455" class="blue"/><text x="307" y="140" text-anchor="middle" class="label">Oversmoothing</text><text x="307" y="178" text-anchor="middle" class="small">repeated mixing erases node distinctions</text><circle cx="140" cy="285" r="25" fill="#2463a6"/><circle cx="145" cy="405" r="25" fill="#d8782d"/><circle cx="270" cy="250" r="25" fill="#2463a6"/><circle cx="285" cy="420" r="25" fill="#d8782d"/><path d="M315 330 L405 330" class="arrow"/><circle cx="470" cy="285" r="25" fill="#7d8ba1"/><circle cx="480" cy="330" r="25" fill="#7d8ba1"/><circle cx="465" cy="375" r="25" fill="#7d8ba1"/><text x="307" y="505" text-anchor="middle" class="small">symptom: embedding variance and class separation collapse</text>
<rect x="630" y="95" width="525" height="455" class="warm"/><text x="892" y="140" text-anchor="middle" class="label">Oversquashing</text><text x="892" y="178" text-anchor="middle" class="small">many distant signals cross a narrow cut</text><circle cx="700" cy="245" r="19" fill="#e7b26f"/><circle cx="700" cy="320" r="19" fill="#e7b26f"/><circle cx="700" cy="395" r="19" fill="#e7b26f"/><circle cx="780" cy="230" r="19" fill="#e7b26f"/><circle cx="780" cy="410" r="19" fill="#e7b26f"/><path d="M719 245 L845 315" class="thin"/><path d="M719 320 L845 320" class="thin"/><path d="M719 395 L845 325" class="thin"/><path d="M799 230 L845 305" class="thin"/><path d="M799 410 L845 335" class="thin"/><circle cx="870" cy="320" r="28" fill="#a76315"/><path d="M900 320 L1000 320" class="arrow" style="stroke-width:8"/><circle cx="1040" cy="320" r="34" fill="#d8782d"/><text x="892" y="505" text-anchor="middle" class="small">symptom: long-range information cannot pass the bottleneck</text>
</svg>