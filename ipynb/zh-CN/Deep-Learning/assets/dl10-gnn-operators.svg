<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img">
<style>
  text { font-family: Inter, Segoe UI, Arial, sans-serif; fill: #172033; letter-spacing: 0; }
  .title { font-size: 28px; font-weight: 700; }
  .label { font-size: 20px; font-weight: 600; }
  .small { font-size: 16px; }
  .box { fill: #ffffff; stroke: #40556f; stroke-width: 2; rx: 7; }
  .soft { fill: #eef5f2; stroke: #31725f; stroke-width: 2; rx: 7; }
  .warm { fill: #fff3df; stroke: #a76315; stroke-width: 2; rx: 7; }
  .blue { fill: #e8f1ff; stroke: #2463a6; stroke-width: 2; rx: 7; }
  .arrow { stroke: #40556f; stroke-width: 3; fill: none; marker-end: url(#arrow); }
  .thin { stroke: #6b7788; stroke-width: 2; fill: none; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#40556f"/></marker></defs>
<rect width="100%" height="100%" fill="#fbfcfe"/>
<text x="600" y="44" text-anchor="middle" class="title">Three neighborhood aggregation choices</text>
<rect x="45" y="95" width="340" height="440" class="blue"/><text x="215" y="142" text-anchor="middle" class="label">GCN</text><text x="215" y="190" text-anchor="middle" class="small">fixed degree-normalized weights</text><text x="215" y="232" text-anchor="middle" class="small">Ã = D̂⁻¹ᐟ²(A + I)D̂⁻¹ᐟ²</text><circle cx="215" cy="355" r="45" fill="#2463a6"/><circle cx="110" cy="295" r="25" fill="#8bb8e8"/><circle cx="115" cy="430" r="25" fill="#8bb8e8"/><circle cx="320" cy="360" r="25" fill="#8bb8e8"/><path d="M135 307 L174 335" class="arrow"/><path d="M138 418 L174 382" class="arrow"/><path d="M294 360 L262 360" class="arrow"/><text x="215" y="500" text-anchor="middle" class="small">smooth then transform</text>
<rect x="430" y="95" width="340" height="440" class="soft"/><text x="600" y="142" text-anchor="middle" class="label">GraphSAGE</text><text x="600" y="190" text-anchor="middle" class="small">sample and aggregate features</text><text x="600" y="232" text-anchor="middle" class="small">hᵢ′ = σ(W[hᵢ ‖ mean(hⱼ)])</text><circle cx="600" cy="355" r="45" fill="#31725f"/><circle cx="495" cy="295" r="25" fill="#8ac4b4"/><circle cx="500" cy="430" r="25" fill="#8ac4b4" opacity="0.35"/><circle cx="705" cy="360" r="25" fill="#8ac4b4"/><path d="M520 307 L559 335" class="arrow"/><path d="M679 360 L647 360" class="arrow"/><path d="M523 418 L558 383" class="thin" stroke-dasharray="7 6"/><text x="600" y="500" text-anchor="middle" class="small">bounded sampled fan-out</text>
<rect x="815" y="95" width="340" height="440" class="warm"/><text x="985" y="142" text-anchor="middle" class="label">GAT</text><text x="985" y="190" text-anchor="middle" class="small">learn content-dependent weights</text><text x="985" y="232" text-anchor="middle" class="small">hᵢ′ = Σⱼ αᵢⱼWhⱼ</text><circle cx="985" cy="355" r="45" fill="#a76315"/><circle cx="880" cy="295" r="25" fill="#e7b26f"/><circle cx="885" cy="430" r="25" fill="#e7b26f"/><circle cx="1090" cy="360" r="25" fill="#e7b26f"/><path d="M905 307 L944 335" class="arrow" style="stroke-width:7"/><path d="M908 418 L944 382" class="arrow" style="stroke-width:2"/><path d="M1064 360 L1032 360" class="arrow" style="stroke-width:4"/><text x="985" y="500" text-anchor="middle" class="small">softmax within each neighborhood</text>
</svg>