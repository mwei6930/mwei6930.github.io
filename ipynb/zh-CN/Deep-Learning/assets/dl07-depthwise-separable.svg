<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Depthwise separable convolution</title>
  <desc id="desc">Three input channels are filtered independently, then a one by one convolution mixes them into output channels.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #111827; letter-spacing: 0; }
      .title { font-size: 25px; font-weight: 700; }
      .label { font-size: 20px; font-weight: 600; }
      .small { font-size: 17px; }
      .arrow { stroke: #374151; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .tile { stroke: #374151; stroke-width: 2; rx: 4; }
    </style>
  </defs>
  <rect width="1200" height="520" fill="#ffffff"/>
  <text x="600" y="42" text-anchor="middle" class="title">Depthwise Separable Convolution</text>

  <text x="135" y="88" text-anchor="middle" class="label">Input channels</text>
  <rect x="55" y="120" width="150" height="95" class="tile" fill="#dbeafe"/>
  <rect x="70" y="230" width="150" height="95" class="tile" fill="#dcfce7"/>
  <rect x="85" y="340" width="150" height="95" class="tile" fill="#fee2e2"/>
  <text x="130" y="173" text-anchor="middle" class="small">X₁</text>
  <text x="145" y="283" text-anchor="middle" class="small">X₂</text>
  <text x="160" y="393" text-anchor="middle" class="small">X₃</text>

  <path d="M 245 168 L 365 168" class="arrow"/>
  <path d="M 245 278 L 365 278" class="arrow"/>
  <path d="M 245 388 L 365 388" class="arrow"/>
  <text x="305" y="112" text-anchor="middle" class="label">Depthwise 3×3</text>
  <text x="305" y="135" text-anchor="middle" class="small">one kernel per channel</text>

  <rect x="380" y="120" width="150" height="95" class="tile" fill="#bfdbfe"/>
  <rect x="380" y="230" width="150" height="95" class="tile" fill="#bbf7d0"/>
  <rect x="380" y="340" width="150" height="95" class="tile" fill="#fecaca"/>
  <text x="455" y="173" text-anchor="middle" class="small">K₁ * X₁</text>
  <text x="455" y="283" text-anchor="middle" class="small">K₂ * X₂</text>
  <text x="455" y="393" text-anchor="middle" class="small">K₃ * X₃</text>

  <path d="M 550 278 L 695 278" class="arrow"/>
  <text x="623" y="230" text-anchor="middle" class="label">Pointwise 1×1</text>
  <text x="623" y="253" text-anchor="middle" class="small">learned channel mixing</text>

  <rect x="715" y="105" width="155" height="95" class="tile" fill="#fef3c7"/>
  <rect x="730" y="215" width="155" height="95" class="tile" fill="#e9d5ff"/>
  <rect x="745" y="325" width="155" height="95" class="tile" fill="#cffafe"/>
  <text x="792" y="158" text-anchor="middle" class="small">Y₁</text>
  <text x="807" y="268" text-anchor="middle" class="small">Y₂</text>
  <text x="822" y="378" text-anchor="middle" class="small">Y₃ ... Yₒ</text>
  <text x="805" y="88" text-anchor="middle" class="label">Output channels</text>

  <rect x="930" y="126" width="230" height="250" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
  <text x="1045" y="166" text-anchor="middle" class="label">Parameter cost</text>
  <text x="1045" y="218" text-anchor="middle" class="small">Standard convolution</text>
  <text x="1045" y="248" text-anchor="middle" class="label">K² Cᵢ Cₒ</text>
  <line x1="970" y1="275" x2="1120" y2="275" stroke="#9ca3af" stroke-width="2"/>
  <text x="1045" y="315" text-anchor="middle" class="small">Depthwise + pointwise</text>
  <text x="1045" y="346" text-anchor="middle" class="label">K² Cᵢ + Cᵢ Cₒ</text>
  <text x="600" y="484" text-anchor="middle" class="small">Spatial filtering is separated from channel mixing; output shape can match a standard convolution, but the hypothesis class is constrained.</text>
</svg>
