<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Input-dependent selective state-space update</title>
  <desc id="desc">The current token creates input-dependent step, input, and output parameters that control a recurrent state update while the transition matrix remains shared.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#425466"/>
    </marker>
    <style>
      .title{font:700 28px Arial,sans-serif;fill:#172b3a}.label{font:700 19px Arial,sans-serif;fill:#172b3a}.text{font:17px Arial,sans-serif;fill:#304658}.formula{font:19px 'Times New Roman',serif;fill:#172b3a}.box{stroke-width:2}.arrow{stroke:#425466;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#718096;stroke-width:2;stroke-dasharray:8 6;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="600" fill="#ffffff"/>
  <text x="600" y="42" text-anchor="middle" class="title">Selective SSM: the Current Input Controls What Enters, Persists, and Is Read</text>

  <rect x="55" y="245" width="130" height="78" rx="8" fill="#e8f1fb" stroke="#356fa3" class="box"/>
  <text x="120" y="278" text-anchor="middle" class="label">input</text>
  <text x="120" y="307" text-anchor="middle" class="formula">xₜ</text>

  <rect x="255" y="90" width="250" height="145" rx="8" fill="#fff2d8" stroke="#b27b20" class="box"/>
  <text x="380" y="124" text-anchor="middle" class="label">selection projections</text>
  <text x="380" y="160" text-anchor="middle" class="formula">Δₜ = softplus(WΔxₜ)</text>
  <text x="380" y="191" text-anchor="middle" class="formula">Bₜ = Wᴮxₜ,  Cₜ = Wᶜxₜ</text>
  <text x="380" y="219" text-anchor="middle" class="text">parameters vary by token</text>

  <rect x="255" y="325" width="250" height="105" rx="8" fill="#eaf4ee" stroke="#3f7d5b" class="box"/>
  <text x="380" y="359" text-anchor="middle" class="label">shared dynamics</text>
  <text x="380" y="394" text-anchor="middle" class="formula">A with stable decay</text>

  <rect x="590" y="195" width="330" height="190" rx="8" fill="#f4ebf7" stroke="#87569a" class="box"/>
  <text x="755" y="232" text-anchor="middle" class="label">selective state update</text>
  <text x="755" y="273" text-anchor="middle" class="formula">Āₜ = exp(Δₜ A)</text>
  <text x="755" y="311" text-anchor="middle" class="formula">hₜ = Āₜ hₜ₋₁ + B̄ₜ xₜ</text>
  <text x="755" y="349" text-anchor="middle" class="formula">yₜ = Cₜ hₜ</text>

  <rect x="1010" y="245" width="135" height="78" rx="8" fill="#fbe9e7" stroke="#ad4f42" class="box"/>
  <text x="1078" y="278" text-anchor="middle" class="label">output</text>
  <text x="1078" y="307" text-anchor="middle" class="formula">yₜ</text>

  <path d="M185 284 L220 284 L220 162 L255 162" class="arrow"/>
  <path d="M185 284 L590 284" class="arrow"/>
  <path d="M505 162 L550 162 L550 242 L590 242" class="arrow"/>
  <path d="M505 377 L550 377 L550 342 L590 342" class="arrow"/>
  <path d="M920 284 L1010 284" class="arrow"/>
  <path d="M755 465 L755 385" class="dash"/>
  <text x="755" y="493" text-anchor="middle" class="formula">hₜ₋₁ arrives from the previous step</text>

  <rect x="210" y="510" width="780" height="58" rx="8" fill="#f7f9fb" stroke="#7b8794" class="box"/>
  <text x="600" y="546" text-anchor="middle" class="text">Input dependence improves content-based filtering, but removes the single fixed convolution kernel used by time-invariant SSMs.</text>
</svg>
