<svg xmlns="http://www.w3.org/2000/svg" width="980" height="390" viewBox="0 0 980 390" role="img">
<style>
  .bg { fill:#fbfcfe; } .panel { fill:#fff; stroke:#425466; stroke-width:2; rx:9; }
  .blue { fill:#e7f0ff; stroke:#2563eb; stroke-width:2; rx:9; }
  .green { fill:#e8f7ef; stroke:#198754; stroke-width:2; rx:9; }
  .amber { fill:#fff4d6; stroke:#c47f00; stroke-width:2; rx:9; }
  .red { fill:#fdebec; stroke:#c43d4b; stroke-width:2; rx:9; }
  .violet { fill:#f0eafd; stroke:#7357b6; stroke-width:2; rx:9; }
  .text { font:16px Arial,sans-serif; fill:#17202a; } .small { font:13px Arial,sans-serif; fill:#334155; }
  .title { font:bold 20px Arial,sans-serif; fill:#17202a; } .label { font:bold 15px Arial,sans-serif; fill:#17202a; }
  .line { stroke:#425466; stroke-width:2.2; fill:none; marker-end:url(#arrow); }
  .dash { stroke:#64748b; stroke-width:2; stroke-dasharray:7 6; fill:none; marker-end:url(#arrow); }
  .axis { stroke:#334155; stroke-width:1.8; fill:none; } .grid { stroke:#d7dee8; stroke-width:1; }
</style>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#425466"/></marker></defs>
<rect class="bg" width="100%" height="100%"/>
      <text class="title" x="490" y="30" text-anchor="middle">Pipeline parallelism overlaps model stages across microbatches</text>
      <text class="label" x="80" y="100" text-anchor="middle">stage 0</text><text class="label" x="80" y="170" text-anchor="middle">stage 1</text><text class="label" x="80" y="240" text-anchor="middle">stage 2</text>
      <rect class="blue" x="145" y="70" width="120" height="45"/><text class="small" x="205" y="98" text-anchor="middle">m0</text><rect class="green" x="270" y="70" width="120" height="45"/><text class="small" x="330" y="98" text-anchor="middle">m1</text><rect class="amber" x="395" y="70" width="120" height="45"/><text class="small" x="455" y="98" text-anchor="middle">m2</text><rect class="violet" x="520" y="70" width="120" height="45"/><text class="small" x="580" y="98" text-anchor="middle">m3</text>
      <rect class="blue" x="270" y="140" width="120" height="45"/><text class="small" x="330" y="168" text-anchor="middle">m0</text><rect class="green" x="395" y="140" width="120" height="45"/><text class="small" x="455" y="168" text-anchor="middle">m1</text><rect class="amber" x="520" y="140" width="120" height="45"/><text class="small" x="580" y="168" text-anchor="middle">m2</text><rect class="violet" x="645" y="140" width="120" height="45"/><text class="small" x="705" y="168" text-anchor="middle">m3</text>
      <rect class="blue" x="395" y="210" width="120" height="45"/><text class="small" x="455" y="238" text-anchor="middle">m0</text><rect class="green" x="520" y="210" width="120" height="45"/><text class="small" x="580" y="238" text-anchor="middle">m1</text><rect class="amber" x="645" y="210" width="120" height="45"/><text class="small" x="705" y="238" text-anchor="middle">m2</text><rect class="violet" x="770" y="210" width="120" height="45"/><text class="small" x="830" y="238" text-anchor="middle">m3</text>
      <path class="dash" d="M145 300 H395"/><text class="small" x="270" y="332" text-anchor="middle">fill bubble</text><path class="line" d="M395 300 H770"/><text class="small" x="582" y="332" text-anchor="middle">steady overlap</text><path class="dash" d="M770 300 H890"/><text class="small" x="830" y="332" text-anchor="middle">drain</text>
      <text class="small" x="490" y="370" text-anchor="middle">Context parallelism partitions the sequence dimension rather than layers.</text>
