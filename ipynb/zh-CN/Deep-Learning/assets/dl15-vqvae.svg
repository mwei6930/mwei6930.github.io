    <svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360">
      <rect width="1100" height="360" fill="#fbfcfe"/>
      <style>
        .title{font:700 25px Arial;fill:#17212b} .h{font:700 18px Arial;fill:#17212b}
        .t{font:15px Arial;fill:#263746} .s{font:13px Arial;fill:#51606d}
        .box{fill:#fff;stroke:#436b8e;stroke-width:2;rx:7} .soft{fill:#eef5f7;stroke:#6d889b;stroke-width:1.6;rx:7}
        .warm{fill:#fff3df;stroke:#b27a28;stroke-width:1.8;rx:7} .accent{fill:#e8f4ec;stroke:#43845a;stroke-width:1.8;rx:7}
        .line{stroke:#334b5f;stroke-width:2;fill:none;marker-end:url(#a)} .dash{stroke:#7a8791;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#a)}
      </style>
      <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#334b5f"/></marker></defs>
      <text x="40" y="42" class="title">VQ-VAE replaces a continuous posterior with nearest codebook entries</text>

<rect x="50" y="115" width="170" height="120" class="box"/><text x="91" y="155" class="h">encoder z_e</text><text x="76" y="195" class="s">continuous feature vector</text>
<rect x="300" y="85" width="250" height="180" class="soft"/><text x="370" y="125" class="h">codebook</text><circle cx="355" cy="180" r="11" fill="#436b8e"/><circle cx="415" cy="215" r="11" fill="#b27a28"/><circle cx="480" cy="165" r="11" fill="#43845a"/><text x="335" y="248" class="s">nearest embedding e_k</text>
<rect x="635" y="115" width="180" height="120" class="accent"/><text x="680" y="155" class="h">quantized z_q</text><text x="663" y="195" class="s">discrete index + vector</text>
<rect x="895" y="115" width="150" height="120" class="box"/><text x="928" y="155" class="h">decoder</text><text x="920" y="195" class="s">straight-through</text>
<path d="M220 175 L300 175" class="line"/><path d="M550 175 L635 175" class="line"/><path d="M815 175 L895 175" class="line"/>

    </svg>
