<svg xmlns="http://www.w3.org/2000/svg" width="980" height="350" viewBox="0 0 980 350" role="img">
<style>
  .bg { fill:#fbfcfe; } .panel { fill:#fff; stroke:#425466; stroke-width:2; rx:9; }
  .blue { fill:#e7f0ff; stroke:#2563eb; stroke-width:2; rx:9; }
  .green { fill:#e8f7ef; stroke:#198754; stroke-width:2; rx:9; }
  .amber { fill:#fff4d6; stroke:#c47f00; stroke-width:2; rx:9; }
  .red { fill:#fdebec; stroke:#c43d4b; stroke-width:2; rx:9; }
  .violet { fill:#f0eafd; stroke:#7357b6; stroke-width:2; rx:9; }
  .text { font:16px Arial,sans-serif; fill:#17202a; } .small { font:13px Arial,sans-serif; fill:#334155; }
  .title { font:bold 20px Arial,sans-serif; fill:#17202a; } .label { font:bold 15px Arial,sans-serif; fill:#17202a; }
  .line { stroke:#425466; stroke-width:2.2; fill:none; marker-end:url(#arrow); }
  .dash { stroke:#64748b; stroke-width:2; stroke-dasharray:7 6; fill:none; marker-end:url(#arrow); }
  .axis { stroke:#334155; stroke-width:1.8; fill:none; } .grid { stroke:#d7dee8; stroke-width:1; }
</style>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#425466"/></marker></defs>
<rect class="bg" width="100%" height="100%"/>
      <text class="title" x="490" y="30" text-anchor="middle">A distributed input pipeline must keep every accelerator fed</text>
      <rect class="panel" x="35" y="95" width="160" height="100"/><text class="label" x="115" y="130" text-anchor="middle">Storage</text><text class="small" x="115" y="158" text-anchor="middle">files / shards</text>
      <path class="line" d="M195 145 H275"/><rect class="blue" x="275" y="85" width="175" height="120"/><text class="label" x="362" y="122" text-anchor="middle">CPU workers</text><text class="small" x="362" y="150" text-anchor="middle">decode + augment</text><text class="small" x="362" y="177" text-anchor="middle">prefetch</text>
      <path class="line" d="M450 145 H530"/><rect class="green" x="530" y="95" width="170" height="100"/><text class="label" x="615" y="130" text-anchor="middle">Pinned buffer</text><text class="small" x="615" y="158" text-anchor="middle">batched tensors</text>
      <path class="line" d="M700 145 H780"/><rect class="violet" x="780" y="85" width="165" height="120"/><text class="label" x="862" y="122" text-anchor="middle">Device rank</text><text class="small" x="862" y="150" text-anchor="middle">non-blocking copy</text><text class="small" x="862" y="177" text-anchor="middle">compute stream</text>
      <path class="dash" d="M862 205 V285 H362 V205"/><text class="small" x="612" y="315" text-anchor="middle">overlap next batch preparation with current compute</text>
    </svg>