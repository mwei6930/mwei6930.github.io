<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" role="img" aria-labelledby="title desc">
  <title id="title">Bounded producer consumer buffer with predicates</title>
  <desc id="desc">Producers wait while the ring buffer is full, consumers wait while it is empty, and all head tail count updates occur under one mutex. Separate not-full and not-empty condition variables communicate predicate changes.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#374151"/></marker><style>.h{font:700 28px system-ui,sans-serif;fill:#111827}.t{font:600 18px system-ui,sans-serif;fill:#111827}.s{font:15px system-ui,sans-serif;fill:#374151}.box{stroke:#374151;stroke-width:2}.line{fill:none;stroke:#374151;stroke-width:3;marker-end:url(#arrow)}.signal{fill:none;stroke:#7c3aed;stroke-width:4;stroke-dasharray:9 7;marker-end:url(#arrow)}</style></defs>
  <rect width="1500" height="820" fill="#fff"/>
  <text x="750" y="45" text-anchor="middle" class="h">The mutex protects representation; condition variables announce possible progress</text>
  <rect x="65" y="145" width="310" height="230" rx="8" fill="#dbeafe" class="box"/>
  <text x="220" y="182" text-anchor="middle" class="t">Producer</text><text x="220" y="220" text-anchor="middle" class="s">lock</text><text x="220" y="250" text-anchor="middle" class="s">while count == capacity:</text><text x="220" y="278" text-anchor="middle" class="s">wait(not_full)</text><text x="220" y="308" text-anchor="middle" class="s">write at tail; count++</text><text x="220" y="338" text-anchor="middle" class="s">signal(not_empty); unlock</text>
  <rect x="1125" y="145" width="310" height="230" rx="8" fill="#dcfce7" class="box"/>
  <text x="1280" y="182" text-anchor="middle" class="t">Consumer</text><text x="1280" y="220" text-anchor="middle" class="s">lock</text><text x="1280" y="250" text-anchor="middle" class="s">while count == 0:</text><text x="1280" y="278" text-anchor="middle" class="s">wait(not_empty)</text><text x="1280" y="308" text-anchor="middle" class="s">read at head; count--</text><text x="1280" y="338" text-anchor="middle" class="s">signal(not_full); unlock</text>
  <path d="M375 260 H490" class="line"/><path d="M1125 260 H1010" class="line"/>
  <rect x="490" y="120" width="520" height="350" rx="10" fill="#f8fafc" class="box"/>
  <text x="750" y="160" text-anchor="middle" class="t">Shared ring buffer under mutex</text>
  <g transform="translate(555 210)"><rect x="0" width="90" height="90" fill="#fcd34d" class="box"/><rect x="90" width="90" height="90" fill="#fcd34d" class="box"/><rect x="180" width="90" height="90" fill="#fcd34d" class="box"/><rect x="270" width="90" height="90" fill="#fff" class="box"/><g class="t" text-anchor="middle"><text x="45" y="54">A</text><text x="135" y="54">B</text><text x="225" y="54">C</text><text x="315" y="54">empty</text></g><text x="0" y="125" class="s">head</text><text x="310" y="125" class="s">tail</text></g>
  <text x="750" y="385" text-anchor="middle" class="s">Invariant: 0 &lt;= count &lt;= capacity; head and tail identify valid slots.</text>
  <rect x="575" y="410" width="350" height="40" rx="6" fill="#f3e8ff" stroke="#7c3aed"/><text x="750" y="436" text-anchor="middle" class="s">not_empty: count &gt; 0 | not_full: count &lt; capacity</text>
  <path d="M220 375 C220 535 590 530 650 450" class="signal"/><text x="305" y="505" class="s">producer may wake consumer</text>
  <path d="M1280 375 C1280 535 910 530 850 450" class="signal"/><text x="1030" y="505" class="s">consumer may wake producer</text>
  <rect x="200" y="585" width="1100" height="135" rx="8" fill="#eef2ff" class="box"/>
  <text x="750" y="623" text-anchor="middle" class="t">The shell pipeline is a kernel-managed instance of the same pattern</text>
  <text x="750" y="655" text-anchor="middle" class="s">cat writes bytes into a bounded pipe; grep reads them. A full pipe blocks the writer,</text>
  <text x="750" y="682" text-anchor="middle" class="s">an empty pipe blocks the reader, and close changes the reader's predicate to end-of-file.</text>
  <text x="750" y="760" text-anchor="middle" class="s">Wakeup is only a hint to compete again; the mutex-protected predicate determines whether the operation may proceed.</text>
</svg>
