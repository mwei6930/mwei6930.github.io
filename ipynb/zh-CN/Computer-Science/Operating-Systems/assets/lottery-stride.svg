<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="790" viewBox="0 0 1450 790" role="img" aria-labelledby="title desc">
  <title id="title">Lottery and stride proportional-share scheduling</title>
  <desc id="desc">Lottery scheduling randomly draws from tickets held by clients A, B, and C. Stride scheduling repeatedly chooses the smallest pass value and increments it by a stride inverse to ticket count.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#374151"/></marker><style>.h{font:700 27px system-ui,sans-serif;fill:#111827}.t{font:600 18px system-ui,sans-serif;fill:#111827}.s{font:15px system-ui,sans-serif;fill:#374151}.box{stroke:#374151;stroke-width:2}.line{fill:none;stroke:#374151;stroke-width:3;marker-end:url(#arrow)}.a{fill:#93c5fd}.b{fill:#86efac}.c{fill:#fcd34d}</style></defs>
  <rect width="1450" height="790" fill="#fff"/>
  <text x="725" y="44" text-anchor="middle" class="h">Tickets express shares; the selection mechanism controls variance</text>
  <line x1="725" y1="80" x2="725" y2="735" stroke="#d1d5db" stroke-width="2"/>
  <text x="360" y="95" text-anchor="middle" class="t">Lottery: randomized allocation</text>
  <g transform="translate(75 145)">
    <text x="0" y="30" class="s">Tickets: A = 60, B = 30, C = 10</text>
    <rect x="0" y="60" width="540" height="70" fill="#fff" class="box"/>
    <rect x="0" y="60" width="324" height="70" class="a"/><rect x="324" y="60" width="162" height="70" class="b"/><rect x="486" y="60" width="54" height="70" class="c"/>
    <g class="t" text-anchor="middle"><text x="162" y="103">A: 0-59</text><text x="405" y="103">B: 60-89</text><text x="513" y="103">C</text></g>
    <path d="M410 15 V57" class="line"/><text x="430" y="25" class="s">draw 76 -&gt; B wins</text>
    <rect x="35" y="205" width="470" height="230" rx="8" fill="#f8fafc" class="box"/>
    <text x="270" y="245" text-anchor="middle" class="t">Possible ten-quantum sample</text>
    <g transform="translate(70 280)"><g class="box"><rect x="0" width="42" height="42" class="a"/><rect x="42" width="42" height="42" class="b"/><rect x="84" width="42" height="42" class="a"/><rect x="126" width="42" height="42" class="a"/><rect x="168" width="42" height="42" class="c"/><rect x="210" width="42" height="42" class="a"/><rect x="252" width="42" height="42" class="b"/><rect x="294" width="42" height="42" class="a"/><rect x="336" width="42" height="42" class="b"/><rect x="378" width="42" height="42" class="a"/></g><g class="s" text-anchor="middle"><text x="21" y="27">A</text><text x="63" y="27">B</text><text x="105" y="27">A</text><text x="147" y="27">A</text><text x="189" y="27">C</text><text x="231" y="27">A</text><text x="273" y="27">B</text><text x="315" y="27">A</text><text x="357" y="27">B</text><text x="399" y="27">A</text></g></g>
    <text x="270" y="375" text-anchor="middle" class="s">Expected share is proportional; short windows fluctuate.</text>
  </g>
  <text x="1085" y="95" text-anchor="middle" class="t">Stride: deterministic allocation</text>
  <g transform="translate(790 145)">
    <text x="0" y="30" class="s">Choose minimum pass; then pass += stride, where stride = 600 / tickets.</text>
    <g class="t"><text x="10" y="90">client</text><text x="145" y="90">tickets</text><text x="275" y="90">stride</text><text x="405" y="90">initial pass</text></g>
    <g class="s"><text x="30" y="132">A</text><text x="165" y="132">60</text><text x="295" y="132">10</text><text x="435" y="132">0</text><text x="30" y="174">B</text><text x="165" y="174">30</text><text x="295" y="174">20</text><text x="435" y="174">0</text><text x="30" y="216">C</text><text x="165" y="216">10</text><text x="295" y="216">60</text><text x="435" y="216">0</text></g>
    <line x1="0" y1="102" x2="540" y2="102" stroke="#9ca3af"/><line x1="0" y1="228" x2="540" y2="228" stroke="#9ca3af"/>
    <text x="270" y="280" text-anchor="middle" class="t">Minimum-pass sequence with stable tie breaks</text>
    <g transform="translate(55 315)"><g class="box"><rect x="0" width="42" height="42" class="a"/><rect x="42" width="42" height="42" class="b"/><rect x="84" width="42" height="42" class="c"/><rect x="126" width="42" height="42" class="a"/><rect x="168" width="42" height="42" class="a"/><rect x="210" width="42" height="42" class="b"/><rect x="252" width="42" height="42" class="a"/><rect x="294" width="42" height="42" class="a"/><rect x="336" width="42" height="42" class="b"/><rect x="378" width="42" height="42" class="a"/></g><g class="s" text-anchor="middle"><text x="21" y="27">A</text><text x="63" y="27">B</text><text x="105" y="27">C</text><text x="147" y="27">A</text><text x="189" y="27">A</text><text x="231" y="27">B</text><text x="273" y="27">A</text><text x="315" y="27">A</text><text x="357" y="27">B</text><text x="399" y="27">A</text></g></g>
    <text x="270" y="420" text-anchor="middle" class="s">Lower variance, but joins, leaves, and pass normalization need care.</text>
  </g>
  <rect x="230" y="650" width="990" height="75" rx="8" fill="#eef2ff" class="box"/>
  <text x="725" y="682" text-anchor="middle" class="t">Both target long-run shares of 60% : 30% : 10%</text>
  <text x="725" y="709" text-anchor="middle" class="s">Neither promises that every short interval exactly matches the target, and neither is a deadline guarantee.</text>
</svg>
