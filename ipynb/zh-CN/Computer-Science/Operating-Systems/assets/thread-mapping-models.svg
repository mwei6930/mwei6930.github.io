<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1540 850" role="img" aria-labelledby="title desc">
  <title id="title">Many-to-one, one-to-one, and many-to-many thread implementation models</title>
  <desc id="desc">Three panels map user-level threads to kernel scheduling entities and CPUs, showing the consequences for blocking and parallel execution.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#355070"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17212b; }
      .title { font-size: 32px; font-weight: 700; }
      .section { font-size: 24px; font-weight: 700; }
      .head { font-size: 18px; font-weight: 700; }
      .body { font-size: 16px; }
      .small { font-size: 14px; }
      .panel { stroke: #355070; stroke-width: 2.3; rx: 9; }
      .line { stroke: #355070; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1540" height="850" fill="#fff"/>
  <text x="770" y="48" text-anchor="middle" class="title">Who Schedules the User Threads?</text>

  <rect x="35" y="90" width="470" height="680" class="panel" fill="#f8fafb"/>
  <text x="270" y="132" text-anchor="middle" class="section">Many-to-One</text>
  <text x="270" y="161" text-anchor="middle" class="small">user runtime multiplexes many threads onto one kernel entity</text>
  <text x="75" y="205" class="head">User threads</text>
  <circle cx="145" cy="250" r="34" fill="#e6f5ef" stroke="#355070" stroke-width="2"/>
  <circle cx="270" cy="250" r="34" fill="#fff3d9" stroke="#355070" stroke-width="2"/>
  <circle cx="395" cy="250" r="34" fill="#fdebea" stroke="#355070" stroke-width="2"/>
  <text x="145" y="256" text-anchor="middle" class="head">U1</text><text x="270" y="256" text-anchor="middle" class="head">U2</text><text x="395" y="256" text-anchor="middle" class="head">U3</text>
  <rect x="110" y="335" width="320" height="82" class="panel" fill="#e9f2fb"/>
  <text x="270" y="368" text-anchor="middle" class="head">User-space scheduler</text>
  <text x="270" y="395" text-anchor="middle" class="small">fast switches; kernel cannot see U1/U2/U3</text>
  <rect x="190" y="480" width="160" height="75" class="panel" fill="#f1eef8"/>
  <text x="270" y="525" text-anchor="middle" class="head">K1</text>
  <path d="M145 284 L220 335" class="line"/><path d="M270 284 L270 335" class="line"/><path d="M395 284 L320 335" class="line"/>
  <path d="M270 417 L270 480" class="line"/>
  <rect x="190" y="610" width="160" height="70" class="panel" fill="#edf5e8"/>
  <text x="270" y="652" text-anchor="middle" class="head">one CPU at a time</text>
  <path d="M270 555 L270 610" class="line"/>
  <text x="270" y="722" text-anchor="middle" class="body">A blocking kernel call can stall all user threads.</text>
  <text x="270" y="748" text-anchor="middle" class="body">No parallel execution on several CPUs.</text>

  <rect x="535" y="90" width="470" height="680" class="panel" fill="#f8fafb"/>
  <text x="770" y="132" text-anchor="middle" class="section">One-to-One</text>
  <text x="770" y="161" text-anchor="middle" class="small">each user thread maps to a kernel scheduling entity</text>
  <text x="575" y="205" class="head">User threads</text>
  <circle cx="645" cy="250" r="34" fill="#e6f5ef" stroke="#355070" stroke-width="2"/>
  <circle cx="770" cy="250" r="34" fill="#fff3d9" stroke="#355070" stroke-width="2"/>
  <circle cx="895" cy="250" r="34" fill="#fdebea" stroke="#355070" stroke-width="2"/>
  <text x="645" y="256" text-anchor="middle" class="head">U1</text><text x="770" y="256" text-anchor="middle" class="head">U2</text><text x="895" y="256" text-anchor="middle" class="head">U3</text>
  <text x="575" y="382" class="head">Kernel entities</text>
  <rect x="602" y="410" width="86" height="68" class="panel" fill="#f1eef8"/><rect x="727" y="410" width="86" height="68" class="panel" fill="#f1eef8"/><rect x="852" y="410" width="86" height="68" class="panel" fill="#f1eef8"/>
  <text x="645" y="451" text-anchor="middle" class="head">K1</text><text x="770" y="451" text-anchor="middle" class="head">K2</text><text x="895" y="451" text-anchor="middle" class="head">K3</text>
  <path d="M645 284 L645 410" class="line"/><path d="M770 284 L770 410" class="line"/><path d="M895 284 L895 410" class="line"/>
  <rect x="602" y="565" width="86" height="68" class="panel" fill="#edf5e8"/><rect x="727" y="565" width="86" height="68" class="panel" fill="#edf5e8"/><rect x="852" y="565" width="86" height="68" class="panel" fill="#edf5e8"/>
  <text x="645" y="606" text-anchor="middle" class="head">CPU 0</text><text x="770" y="606" text-anchor="middle" class="head">CPU 1</text><text x="895" y="606" text-anchor="middle" class="head">CPU 2</text>
  <path d="M645 478 L645 565" class="line"/><path d="M770 478 L770 565" class="line"/><path d="M895 478 L895 565" class="line"/>
  <text x="770" y="701" text-anchor="middle" class="body">A blocked thread does not inherently block its peers.</text>
  <text x="770" y="727" text-anchor="middle" class="body">Parallelism is possible; kernel objects cost resources.</text>

  <rect x="1035" y="90" width="470" height="680" class="panel" fill="#f8fafb"/>
  <text x="1270" y="132" text-anchor="middle" class="section">Many-to-Many</text>
  <text x="1270" y="161" text-anchor="middle" class="small">runtime multiplexes many user threads over several kernel entities</text>
  <text x="1075" y="205" class="head">User threads</text>
  <circle cx="1110" cy="250" r="30" fill="#e6f5ef" stroke="#355070" stroke-width="2"/><circle cx="1215" cy="250" r="30" fill="#fff3d9" stroke="#355070" stroke-width="2"/><circle cx="1325" cy="250" r="30" fill="#fdebea" stroke="#355070" stroke-width="2"/><circle cx="1430" cy="250" r="30" fill="#e9f2fb" stroke="#355070" stroke-width="2"/>
  <text x="1110" y="256" text-anchor="middle" class="head">U1</text><text x="1215" y="256" text-anchor="middle" class="head">U2</text><text x="1325" y="256" text-anchor="middle" class="head">U3</text><text x="1430" y="256" text-anchor="middle" class="head">U4</text>
  <rect x="1085" y="335" width="370" height="82" class="panel" fill="#e9f2fb"/>
  <text x="1270" y="368" text-anchor="middle" class="head">Runtime scheduler</text>
  <text x="1270" y="395" text-anchor="middle" class="small">balances user work over available kernel contexts</text>
  <rect x="1135" y="480" width="110" height="70" class="panel" fill="#f1eef8"/><rect x="1295" y="480" width="110" height="70" class="panel" fill="#f1eef8"/>
  <text x="1190" y="523" text-anchor="middle" class="head">K1</text><text x="1350" y="523" text-anchor="middle" class="head">K2</text>
  <path d="M1140 417 L1190 480" class="line"/><path d="M1270 417 L1190 480" class="line"/><path d="M1270 417 L1350 480" class="line"/><path d="M1400 417 L1350 480" class="line"/>
  <rect x="1135" y="610" width="110" height="70" class="panel" fill="#edf5e8"/><rect x="1295" y="610" width="110" height="70" class="panel" fill="#edf5e8"/>
  <text x="1190" y="652" text-anchor="middle" class="head">CPU 0</text><text x="1350" y="652" text-anchor="middle" class="head">CPU 1</text>
  <path d="M1190 550 L1190 610" class="line"/><path d="M1350 550 L1350 610" class="line"/>
  <text x="1270" y="722" text-anchor="middle" class="body">Combines runtime flexibility with parallelism.</text>
  <text x="1270" y="748" text-anchor="middle" class="body">Coordination and blocking integration are complex.</text>

  <text x="770" y="820" text-anchor="middle" class="small">Modern Linux POSIX threads use a one-to-one model; language runtimes may schedule lighter tasks above those threads.</text>
</svg>
