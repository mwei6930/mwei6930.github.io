<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1540 840" role="img" aria-labelledby="title desc">
  <title id="title">Signal generation, pending state, target selection, and delivery</title>
  <desc id="desc">A signal is generated by the kernel, another process, or a thread. It becomes pending, is matched against thread masks, and is consumed by a default action, handler, or synchronous sigwait-style interface.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#355070"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17212b; }
      .title { font-size: 32px; font-weight: 700; }
      .section { font-size: 23px; font-weight: 700; }
      .head { font-size: 18px; font-weight: 700; }
      .body { font-size: 16px; }
      .small { font-size: 14px; }
      .panel { stroke: #355070; stroke-width: 2.4; rx: 9; }
      .line { stroke: #355070; stroke-width: 2.7; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1540" height="840" fill="#fff"/>
  <text x="770" y="48" text-anchor="middle" class="title">A Signal Is a Notification, Not a Message Payload</text>

  <rect x="50" y="110" width="265" height="250" class="panel" fill="#e9f2fb"/>
  <text x="182" y="151" text-anchor="middle" class="section">Generate</text>
  <text x="82" y="199" class="body">- hardware fault or terminal</text>
  <text x="82" y="235" class="body">- kernel event or timer</text>
  <text x="82" y="271" class="body">- kill() to a process</text>
  <text x="82" y="307" class="body">- pthread_kill() to a thread</text>
  <text x="182" y="341" text-anchor="middle" class="small">identity and small metadata only</text>

  <rect x="380" y="110" width="285" height="250" class="panel" fill="#fff3d9"/>
  <text x="522" y="151" text-anchor="middle" class="section">Become pending</text>
  <text x="412" y="199" class="body">process-directed pending set</text>
  <text x="412" y="235" class="body">or thread-directed pending set</text>
  <text x="412" y="283" class="body">standard signals may coalesce</text>
  <text x="412" y="319" class="body">real-time signals can queue</text>

  <rect x="730" y="110" width="335" height="250" class="panel" fill="#f1eef8"/>
  <text x="897" y="151" text-anchor="middle" class="section">Select an eligible thread</text>
  <text x="762" y="199" class="body">process disposition is shared</text>
  <text x="762" y="235" class="body">each thread has its own mask</text>
  <text x="762" y="271" class="body">blocked means remain pending</text>
  <text x="762" y="307" class="body">unblocked target can consume it</text>
  <text x="897" y="341" text-anchor="middle" class="small">selection rules depend on signal direction</text>

  <rect x="1130" y="110" width="355" height="250" class="panel" fill="#edf5e8"/>
  <text x="1307" y="151" text-anchor="middle" class="section">Choose the action</text>
  <text x="1162" y="199" class="body">- ignore, stop, continue, terminate</text>
  <text x="1162" y="235" class="body">- run an installed handler</text>
  <text x="1162" y="271" class="body">- return from sigwait-style call</text>
  <text x="1162" y="307" class="body">- expose as signalfd on Linux</text>
  <text x="1307" y="341" text-anchor="middle" class="small">one pending instance is consumed</text>

  <path d="M315 235 L380 235" class="line"/><path d="M665 235 L730 235" class="line"/><path d="M1065 235 L1130 235" class="line"/>

  <rect x="90" y="455" width="640" height="280" class="panel" fill="#fdebea"/>
  <text x="410" y="498" text-anchor="middle" class="section">Asynchronous handler path</text>
  <text x="130" y="545" class="body">1. kernel saves interrupted user context on a signal frame</text>
  <text x="130" y="585" class="body">2. program counter is redirected to the handler</text>
  <text x="130" y="625" class="body">3. handler uses only async-signal-safe operations</text>
  <text x="130" y="665" class="body">4. signal trampoline restores the interrupted context</text>
  <text x="410" y="706" text-anchor="middle" class="small">Hard to compose with arbitrary library code and shared state</text>

  <rect x="810" y="455" width="640" height="280" class="panel" fill="#e6f5ef"/>
  <text x="1130" y="498" text-anchor="middle" class="section">Synchronous acceptance path</text>
  <text x="850" y="545" class="body">1. block selected signals before creating worker threads</text>
  <text x="850" y="585" class="body">2. dedicate one thread to sigwait() or signalfd</text>
  <text x="850" y="625" class="body">3. receive the signal through ordinary control flow</text>
  <text x="850" y="665" class="body">4. notify workers using normal thread-safe mechanisms</text>
  <text x="1130" y="706" text-anchor="middle" class="small">Often easier to reason about in a multithreaded service</text>

  <text x="770" y="795" text-anchor="middle" class="body">A mask delays delivery; it does not delete a pending signal.</text>
</svg>
