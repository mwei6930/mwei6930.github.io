<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 665" role="img" aria-labelledby="title desc">
  <title id="title">eBPF load, verification, attachment, execution, and map path</title>
  <desc id="desc">A pipeline shows source compilation, loading, verifier analysis, JIT or interpretation, hook attachment, event execution, and map communication with user space.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#34495e"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#17202a;letter-spacing:0}.h{font-size:28px;font-weight:700}.s{font-size:19px;font-weight:700}.b{font-size:16px}.n{font-size:14px;fill:#425466}.box{stroke:#34495e;stroke-width:2;rx:6}.p{stroke:#34495e;stroke-width:3;marker-end:url(#a)}.deny{stroke:#c0392b;stroke-width:3;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="665" fill="#f8fafc"/><text x="600" y="42" text-anchor="middle" class="h">eBPF extends selected kernel paths through a verified program contract</text>
  <rect x="50" y="105" width="185" height="92" class="box" fill="#d6eaf8"/><text x="142" y="139" text-anchor="middle" class="s">Program</text><text x="142" y="167" text-anchor="middle" class="n">restricted C / bytecode</text><text x="142" y="189" text-anchor="middle" class="n">BTF metadata</text>
  <rect x="285" y="105" width="185" height="92" class="box" fill="#d5f5e3"/><text x="377" y="139" text-anchor="middle" class="s">Loader</text><text x="377" y="167" text-anchor="middle" class="n">libbpf / bpf syscall</text><text x="377" y="189" text-anchor="middle" class="n">credentials + object setup</text>
  <rect x="520" y="85" width="235" height="132" class="box" fill="#fff3cd"/><text x="637" y="119" text-anchor="middle" class="s">Kernel verifier</text><text x="637" y="147" text-anchor="middle" class="n">track register and pointer states</text><text x="637" y="171" text-anchor="middle" class="n">prove bounded control flow</text><text x="637" y="195" text-anchor="middle" class="n">enforce helper/context rules</text>
  <rect x="805" y="105" width="160" height="92" class="box" fill="#eadcf8"/><text x="885" y="139" text-anchor="middle" class="s">JIT / interpreter</text><text x="885" y="167" text-anchor="middle" class="n">hardened executable</text><text x="885" y="189" text-anchor="middle" class="n">kernel context</text>
  <rect x="1015" y="105" width="145" height="92" class="box" fill="#f5cba7"/><text x="1087" y="139" text-anchor="middle" class="s">Attach</text><text x="1087" y="167" text-anchor="middle" class="n">tracepoint, XDP,</text><text x="1087" y="189" text-anchor="middle" class="n">cgroup, LSM...</text>
  <line x1="235" y1="151" x2="285" y2="151" class="p"/><line x1="470" y1="151" x2="520" y2="151" class="p"/><line x1="755" y1="151" x2="805" y2="151" class="p"/><line x1="965" y1="151" x2="1015" y2="151" class="p"/>
  <rect x="465" y="278" width="345" height="76" class="box" fill="#f9ebea"/><text x="637" y="310" text-anchor="middle" class="s" fill="#c0392b">Reject</text><text x="637" y="336" text-anchor="middle" class="n">unsafe path, invalid memory, unsupported helper, excessive complexity</text><line x1="637" y1="217" x2="637" y2="278" class="deny"/>
  <rect x="785" y="405" width="335" height="92" class="box" fill="#d6eaf8"/><text x="952" y="439" text-anchor="middle" class="s">Kernel event executes program</text><text x="952" y="467" text-anchor="middle" class="n">bounded work with type-specific context</text><text x="952" y="489" text-anchor="middle" class="n">helpers and kfuncs expose controlled services</text><line x1="1087" y1="197" x2="1000" y2="405" class="p"/>
  <rect x="430" y="405" width="270" height="92" class="box" fill="#d5f5e3"/><text x="565" y="439" text-anchor="middle" class="s">Maps and ring buffers</text><text x="565" y="467" text-anchor="middle" class="n">state, counters, events</text><text x="565" y="489" text-anchor="middle" class="n">kernel/user communication</text><line x1="785" y1="451" x2="700" y2="451" class="p"/>
  <rect x="80" y="405" width="270" height="92" class="box" fill="#ffffff"/><text x="215" y="439" text-anchor="middle" class="s">User-space controller</text><text x="215" y="467" text-anchor="middle" class="n">configure, read, aggregate</text><text x="215" y="489" text-anchor="middle" class="n">detach and manage lifecycle</text><line x1="430" y1="451" x2="350" y2="451" class="p"/>
  <rect x="85" y="555" width="1030" height="80" rx="6" fill="#ffffff" stroke="#34495e" stroke-width="2"/>
  <text x="600" y="583" text-anchor="middle" class="b">The verifier establishes memory/control-flow safety under its model; it does not decide whether a privileged program's policy is wise.</text>
  <text x="600" y="610" text-anchor="middle" class="n">Verifier, JIT, helpers, hook implementations, loader privileges, and attached program behavior all belong in the threat analysis.</text>
</svg>
