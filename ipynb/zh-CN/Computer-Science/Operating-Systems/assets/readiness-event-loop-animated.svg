<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Readiness-based event loop</title>
  <desc id="desc">An animated event-loop token waits for readiness, dispatches a handler, drains nonblocking I/O until EAGAIN, updates interest, and returns to wait while timers and queued work share a bounded budget.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#334155"/></marker><style>.h{font:700 30px system-ui,sans-serif;fill:#111827}.t{font:700 18px system-ui,sans-serif;fill:#111827}.s{font:15px system-ui,sans-serif;fill:#334155}.box{stroke:#334155;stroke-width:2}.line{fill:none;stroke:#334155;stroke-width:4;marker-end:url(#a)}.dash{fill:none;stroke:#7c3aed;stroke-width:3;stroke-dasharray:9 7;marker-end:url(#a)}</style></defs>
  <rect width="1600" height="900" fill="#fff"/><text x="800" y="48" text-anchor="middle" class="h">Readiness tells the loop where an operation is unlikely to block</text>
  <circle cx="800" cy="450" r="120" fill="#ede9fe" class="box"/><text x="800" y="437" text-anchor="middle" class="t">Event-loop policy</text><text x="800" y="468" text-anchor="middle" class="s">fairness, budgets, deadlines</text><text x="800" y="494" text-anchor="middle" class="s">and per-connection state</text>

  <rect x="110" y="155" width="330" height="120" rx="8" fill="#dbeafe" class="box"/><text x="275" y="198" text-anchor="middle" class="t">1. Wait for readiness</text><text x="275" y="229" text-anchor="middle" class="s">epoll_wait / kevent / poll</text><text x="275" y="255" text-anchor="middle" class="s">plus timeout for timers</text>
  <rect x="635" y="105" width="330" height="120" rx="8" fill="#dcfce7" class="box"/><text x="800" y="148" text-anchor="middle" class="t">2. Receive ready set</text><text x="800" y="179" text-anchor="middle" class="s">fd + readable/writable/error flags</text><text x="800" y="205" text-anchor="middle" class="s">not a byte count or final result</text>
  <rect x="1160" y="155" width="330" height="120" rx="8" fill="#fef3c7" class="box"/><text x="1325" y="198" text-anchor="middle" class="t">3. Dispatch handler</text><text x="1325" y="229" text-anchor="middle" class="s">look up connection/request state</text><text x="1325" y="255" text-anchor="middle" class="s">do bounded application work</text>
  <rect x="1110" y="625" width="380" height="125" rx="8" fill="#ffedd5" class="box"/><text x="1300" y="669" text-anchor="middle" class="t">4. Drain nonblocking I/O</text><text x="1300" y="700" text-anchor="middle" class="s">repeat read/write until EAGAIN, EOF,</text><text x="1300" y="727" text-anchor="middle" class="s">error, or a fairness budget is reached</text>
  <rect x="610" y="675" width="380" height="125" rx="8" fill="#fce7f3" class="box"/><text x="800" y="719" text-anchor="middle" class="t">5. Update interest and state</text><text x="800" y="750" text-anchor="middle" class="s">enable writable events only when queued</text><text x="800" y="777" text-anchor="middle" class="s">handle close, retry and backpressure</text>
  <rect x="110" y="625" width="380" height="125" rx="8" fill="#ecfeff" class="box"/><text x="300" y="669" text-anchor="middle" class="t">6. Run timers / queued work</text><text x="300" y="700" text-anchor="middle" class="s">avoid starving non-I/O tasks</text><text x="300" y="727" text-anchor="middle" class="s">then return to the wait point</text>

  <path id="loop" d="M440 215 H635 M965 165 H1160 M1325 275 V625 M1110 688 H990 M610 738 H490 M300 625 V360 H275 V275" class="line"/>
  <circle cx="440" cy="215" r="11" fill="#2563eb"><animateMotion dur="8s" repeatCount="indefinite" path="M0 0 H195 M525 -50 H720 M885 60 V410 M670 473 H550 M170 523 H50 M-140 410 V145 H-165 V60"/></circle>
  <path d="M920 450 H1135 V335 H1325 V275" class="dash"/><text x="1100" y="430" class="s" fill="#6d28d9">state guides dispatch</text>
  <text x="800" y="856" text-anchor="middle" class="s">Edge-triggered APIs require draining to EAGAIN; level-triggered APIs keep reporting a condition while it remains true.</text>
</svg>
