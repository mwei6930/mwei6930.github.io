<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Programmed I/O, polling, interrupts, and DMA</title>
  <desc id="desc">Four panels distinguish who moves payload data and how the CPU learns that an operation has completed.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#334155"/></marker><marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#2563eb"/></marker><style>.h{font:700 30px system-ui,sans-serif;fill:#111827}.t{font:700 19px system-ui,sans-serif;fill:#111827}.s{font:14px system-ui,sans-serif;fill:#334155}.box{stroke:#334155;stroke-width:2}.ctl{fill:none;stroke:#334155;stroke-width:3;marker-end:url(#a)}.data{fill:none;stroke:#2563eb;stroke-width:5;marker-end:url(#b)}.dash{fill:none;stroke:#dc2626;stroke-width:3;stroke-dasharray:8 7;marker-end:url(#a)}</style></defs>
  <rect width="1600" height="900" fill="#fff"/><text x="800" y="48" text-anchor="middle" class="h">Two separate questions: who moves the bytes, and who notices completion?</text>
  <rect x="55" y="100" width="350" height="680" rx="8" fill="#eff6ff" class="box"/><text x="230" y="140" text-anchor="middle" class="t">Programmed I/O</text>
  <rect x="105" y="205" width="250" height="80" rx="8" fill="#dbeafe" class="box"/><text x="230" y="253" text-anchor="middle" class="t">CPU</text>
  <rect x="105" y="390" width="250" height="80" rx="8" fill="#ede9fe" class="box"/><text x="230" y="438" text-anchor="middle" class="t">Controller register</text>
  <rect x="105" y="575" width="250" height="80" rx="8" fill="#cffafe" class="box"/><text x="230" y="623" text-anchor="middle" class="t">Device</text>
  <path d="M190 285 V390" class="data"/><path d="M270 470 V575" class="data"/>
  <text x="230" y="700" text-anchor="middle" class="s">CPU instructions copy payload</text><text x="230" y="727" text-anchor="middle" class="s">through an I/O register.</text><text x="230" y="754" text-anchor="middle" class="s">Simple, but consumes CPU cycles.</text>

  <rect x="435" y="100" width="350" height="680" rx="8" fill="#fff7ed" class="box"/><text x="610" y="140" text-anchor="middle" class="t">Polling</text>
  <rect x="485" y="205" width="250" height="80" rx="8" fill="#dbeafe" class="box"/><text x="610" y="253" text-anchor="middle" class="t">CPU</text>
  <rect x="485" y="390" width="250" height="80" rx="8" fill="#fef3c7" class="box"/><text x="610" y="438" text-anchor="middle" class="t">STATUS register</text>
  <path d="M570 285 V390" class="ctl"/><path d="M650 390 V285" class="dash"/><text x="686" y="343" class="s">not ready?</text>
  <path d="M735 430 H758 V185 H610 V205" class="dash"/>
  <text x="610" y="700" text-anchor="middle" class="s">CPU repeatedly checks state.</text><text x="610" y="727" text-anchor="middle" class="s">Low notification latency under load,</text><text x="610" y="754" text-anchor="middle" class="s">wasted probes while idle.</text>

  <rect x="815" y="100" width="350" height="680" rx="8" fill="#f0fdf4" class="box"/><text x="990" y="140" text-anchor="middle" class="t">Interrupt</text>
  <rect x="865" y="205" width="250" height="80" rx="8" fill="#dbeafe" class="box"/><text x="990" y="253" text-anchor="middle" class="t">CPU runs other work</text>
  <rect x="865" y="390" width="250" height="80" rx="8" fill="#dcfce7" class="box"/><text x="990" y="438" text-anchor="middle" class="t">Interrupt controller</text>
  <rect x="865" y="575" width="250" height="80" rx="8" fill="#cffafe" class="box"/><text x="990" y="623" text-anchor="middle" class="t">Device completes</text>
  <path d="M990 575 V470" class="ctl"/><path d="M990 390 V285" class="ctl"/>
  <text x="990" y="700" text-anchor="middle" class="s">Device signals only on events.</text><text x="990" y="727" text-anchor="middle" class="s">Efficient when events are sparse;</text><text x="990" y="754" text-anchor="middle" class="s">each interrupt has fixed overhead.</text>

  <rect x="1195" y="100" width="350" height="680" rx="8" fill="#f5f3ff" class="box"/><text x="1370" y="140" text-anchor="middle" class="t">DMA + completion</text>
  <rect x="1245" y="185" width="250" height="72" rx="8" fill="#dbeafe" class="box"/><text x="1370" y="229" text-anchor="middle" class="t">CPU sets descriptor</text>
  <rect x="1245" y="360" width="250" height="72" rx="8" fill="#ede9fe" class="box"/><text x="1370" y="404" text-anchor="middle" class="t">Main memory</text>
  <rect x="1245" y="545" width="250" height="72" rx="8" fill="#cffafe" class="box"/><text x="1370" y="589" text-anchor="middle" class="t">DMA-capable device</text>
  <path d="M1330 257 V360" class="ctl"/><path d="M1330 432 V545" class="data"/><path d="M1410 545 V432" class="data"/>
  <path d="M1495 581 H1522 V222 H1495" class="dash"/>
  <text x="1370" y="677" text-anchor="middle" class="s">Device transfers bulk data directly</text><text x="1370" y="704" text-anchor="middle" class="s">to mapped memory. CPU handles setup</text><text x="1370" y="731" text-anchor="middle" class="s">and an interrupt or polled completion.</text>
  <text x="800" y="842" text-anchor="middle" class="s">Polling and interrupts describe notification; PIO and DMA describe payload movement. Real systems combine them.</text>
</svg>
