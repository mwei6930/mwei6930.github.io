<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="930" viewBox="0 0 1800 930" role="img" aria-labelledby="title desc">
  <title id="title">Crash-safe same-directory file replacement protocol</title>
  <desc id="desc">An animated protocol creates a temporary file, writes and synchronizes its data, atomically renames it over the target, and synchronizes the parent directory so both content and the new name survive a crash.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#334155"/></marker><style>.h{font:700 30px system-ui,sans-serif;fill:#111827}.t{font:700 17px system-ui,sans-serif;fill:#111827}.s{font:14px system-ui,sans-serif;fill:#334155}.box{stroke:#334155;stroke-width:2}.line{fill:none;stroke:#334155;stroke-width:4;marker-end:url(#a)}.danger{fill:#fee2e2;stroke:#dc2626;stroke-width:2}.safe{fill:#dcfce7;stroke:#15803d;stroke-width:2}</style></defs>
  <rect width="1800" height="930" fill="#fff"/><text x="900" y="48" text-anchor="middle" class="h">Atomic visibility requires rename; durable replacement also requires flush boundaries</text>
  <rect x="65" y="115" width="280" height="165" rx="8" fill="#eff6ff" class="box"/><text x="205" y="156" text-anchor="middle" class="t">1. Open parent directory</text><text x="205" y="190" text-anchor="middle" class="s">dirfd anchors all relative names</text><text x="205" y="220" text-anchor="middle" class="s">avoids cwd/path races</text><text x="205" y="250" text-anchor="middle" class="s">target: config.json</text>
  <rect x="405" y="115" width="280" height="165" rx="8" fill="#f5f3ff" class="box"/><text x="545" y="156" text-anchor="middle" class="t">2. Create unique temp</text><text x="545" y="190" text-anchor="middle" class="s">same directory/filesystem</text><text x="545" y="220" text-anchor="middle" class="s">O_CREAT | O_EXCL</text><text x="545" y="250" text-anchor="middle" class="s">.config.tmp.PID</text>
  <rect x="745" y="115" width="280" height="165" rx="8" fill="#fff7ed" class="box"/><text x="885" y="156" text-anchor="middle" class="t">3. Write complete content</text><text x="885" y="190" text-anchor="middle" class="s">loop over partial writes</text><text x="885" y="220" text-anchor="middle" class="s">set required metadata</text><text x="885" y="250" text-anchor="middle" class="s">temp still invisible as target</text>
  <rect x="1085" y="115" width="280" height="165" rx="8" fill="#fef3c7" class="box"/><text x="1225" y="156" text-anchor="middle" class="t">4. fdatasync(temp)</text><text x="1225" y="190" text-anchor="middle" class="s">persist bytes + retrieval metadata</text><text x="1225" y="220" text-anchor="middle" class="s">check delayed ENOSPC/EIO</text><text x="1225" y="250" text-anchor="middle" class="s">old target still names old inode</text>
  <rect x="1425" y="115" width="310" height="165" rx="8" fill="#dcfce7" class="box"/><text x="1580" y="156" text-anchor="middle" class="t">5. rename(temp, target)</text><text x="1580" y="190" text-anchor="middle" class="s">atomic namespace replacement</text><text x="1580" y="220" text-anchor="middle" class="s">readers see old or new object</text><text x="1580" y="250" text-anchor="middle" class="s">not yet promised crash-durable</text>
  <path id="top" d="M345 198 H405 M685 198 H745 M1025 198 H1085 M1365 198 H1425" class="line"/>

  <path d="M1580 280 V420" class="line"/>
  <rect x="1390" y="420" width="380" height="150" rx="8" fill="#dcfce7" class="box"/><text x="1580" y="462" text-anchor="middle" class="t">6. fsync(parent directory)</text><text x="1580" y="496" text-anchor="middle" class="s">persist the directory entry replacement</text><text x="1580" y="526" text-anchor="middle" class="s">then close descriptors and report success</text><text x="1580" y="552" text-anchor="middle" class="s">according to Linux/local-FS contract</text>
  <circle cx="345" cy="198" r="11" fill="#2563eb"><animateMotion dur="8s" repeatCount="indefinite" path="M0 0 H1080 H1235 V297"/></circle>

  <rect x="80" y="390" width="1120" height="265" rx="8" fill="#f8fafc" class="box"/><text x="640" y="430" text-anchor="middle" class="t">Crash interpretation</text>
  <rect x="125" y="475" width="300" height="110" rx="8" class="danger"/><text x="275" y="514" text-anchor="middle" class="t">Before temp sync</text><text x="275" y="545" text-anchor="middle" class="s">old target should remain;</text><text x="275" y="572" text-anchor="middle" class="s">temporary data may be absent/torn</text>
  <rect x="490" y="475" width="300" height="110" rx="8" fill="#fef3c7" class="box"/><text x="640" y="514" text-anchor="middle" class="t">After temp sync</text><text x="640" y="545" text-anchor="middle" class="s">new inode contents durable;</text><text x="640" y="572" text-anchor="middle" class="s">target still names old inode</text>
  <rect x="855" y="475" width="300" height="110" rx="8" fill="#ffedd5" class="box"/><text x="1005" y="514" text-anchor="middle" class="t">After rename only</text><text x="1005" y="545" text-anchor="middle" class="s">runtime visibility is atomic;</text><text x="1005" y="572" text-anchor="middle" class="s">directory persistence not yet forced</text>

  <rect x="180" y="730" width="1440" height="105" rx="8" fill="#f0fdf4" class="box"/><text x="900" y="768" text-anchor="middle" class="t">Result after acknowledged protocol</text><text x="900" y="800" text-anchor="middle" class="s">The target name resolves to the fully written new inode after recovery; readers never observe a partially overwritten target.</text><text x="900" y="827" text-anchor="middle" class="s">This is not a general multi-file transaction and does not replace application-level versioning or backup.</text>
  <text x="900" y="888" text-anchor="middle" class="s">Exact guarantees vary across filesystems and remote storage; applications must rely on documented semantics, not folklore.</text>
</svg>
