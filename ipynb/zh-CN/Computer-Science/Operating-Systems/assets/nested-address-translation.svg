<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">Shadow page tables compared with nested address translation</title>
  <desc id="desc">Two paths compare software-maintained shadow mappings with hardware two-stage guest virtual to guest physical to host physical translation.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#34495e"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#17202a;letter-spacing:0}.h{font-size:28px;font-weight:700}.s{font-size:20px;font-weight:700}.b{font-size:17px}.n{font-size:15px;fill:#425466}.box{stroke:#34495e;stroke-width:2;rx:6}.p{stroke:#34495e;stroke-width:3;marker-end:url(#a)}.red{stroke:#c0392b;stroke-width:3;stroke-dasharray:9 6;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="690" fill="#f8fafc"/><text x="600" y="42" text-anchor="middle" class="h">Who composes guest and host mappings?</text>
  <text x="300" y="88" text-anchor="middle" class="s">Shadow page tables</text>
  <rect x="65" y="120" width="170" height="72" class="box" fill="#d6eaf8"/><text x="150" y="150" text-anchor="middle" class="b">Guest virtual</text><text x="150" y="177" text-anchor="middle" class="n">GVA</text>
  <rect x="365" y="120" width="170" height="72" class="box" fill="#fdebd0"/><text x="450" y="150" text-anchor="middle" class="b">Host physical</text><text x="450" y="177" text-anchor="middle" class="n">HPA</text>
  <line x1="235" y1="156" x2="365" y2="156" class="p"/><text x="300" y="139" text-anchor="middle" class="n">hardware walk</text>
  <rect x="150" y="235" width="300" height="90" class="box" fill="#eadcf8"/><text x="300" y="269" text-anchor="middle" class="b">Hypervisor shadow mapping</text><text x="300" y="297" text-anchor="middle" class="n">combines guest intent with host ownership</text>
  <rect x="150" y="365" width="300" height="92" class="box" fill="#fff3cd"/><text x="300" y="398" text-anchor="middle" class="b">Guest updates its page tables</text><text x="300" y="428" text-anchor="middle" class="n">trap or detect, validate, update shadow</text>
  <line x1="300" y1="365" x2="300" y2="325" class="red"/><text x="300" y="493" text-anchor="middle" class="n">Fast steady-state lookup; expensive synchronization</text>

  <text x="900" y="88" text-anchor="middle" class="s">Nested translation: EPT / NPT</text>
  <rect x="655" y="120" width="170" height="72" class="box" fill="#d6eaf8"/><text x="740" y="150" text-anchor="middle" class="b">Guest virtual</text><text x="740" y="177" text-anchor="middle" class="n">GVA</text>
  <rect x="855" y="120" width="170" height="72" class="box" fill="#d5f5e3"/><text x="940" y="150" text-anchor="middle" class="b">Guest physical</text><text x="940" y="177" text-anchor="middle" class="n">GPA</text>
  <rect x="955" y="260" width="170" height="72" class="box" fill="#fdebd0"/><text x="1040" y="290" text-anchor="middle" class="b">Host physical</text><text x="1040" y="317" text-anchor="middle" class="n">HPA</text>
  <line x1="825" y1="156" x2="855" y2="156" class="p"/><text x="840" y="136" text-anchor="middle" class="n">stage 1</text>
  <line x1="975" y1="192" x2="1025" y2="260" class="p"/><text x="1040" y="225" text-anchor="middle" class="n">stage 2</text>
  <rect x="655" y="365" width="470" height="92" class="box" fill="#eadcf8"/><text x="890" y="398" text-anchor="middle" class="b">MMU walks guest tables and nested tables</text><text x="890" y="428" text-anchor="middle" class="n">hypervisor intervenes on permission or mapping faults</text>
  <text x="890" y="493" text-anchor="middle" class="n">Simpler updates; a cold two-dimensional walk can be long</text>

  <rect x="80" y="535" width="1040" height="115" rx="6" fill="#ffffff" stroke="#34495e" stroke-width="2"/>
  <text x="600" y="569" text-anchor="middle" class="b">Translation caches hide most page-walk work</text>
  <text x="600" y="598" text-anchor="middle" class="n">TLBs, page-walk caches, large pages, address-space tags, and invalidation discipline determine real cost.</text>
  <text x="600" y="626" text-anchor="middle" class="n">Nested translation changes the miss path; it does not imply that every memory reference performs every walk.</text>
</svg>
