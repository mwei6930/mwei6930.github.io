<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Linux I/O observability by layer</title>
  <desc id="desc">A layered diagram maps application symptoms to system-call traces, process counters, subsystem queues, interrupts, block and network device statistics, and kernel tracepoints.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#334155"/></marker><style>.h{font:700 30px system-ui,sans-serif;fill:#111827}.t{font:700 18px system-ui,sans-serif;fill:#111827}.s{font:14px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#334155}.p{font:14px system-ui,sans-serif;fill:#334155}.box{stroke:#334155;stroke-width:2}.line{fill:none;stroke:#334155;stroke-width:3;marker-end:url(#a)}</style></defs>
  <rect width="1600" height="900" fill="#fff"/><text x="800" y="48" text-anchor="middle" class="h">Measure the layer that could own the delay</text>
  <rect x="95" y="95" width="1410" height="110" rx="8" fill="#eff6ff" class="box"/><text x="155" y="132" class="t">Application symptoms</text><text x="155" y="166" class="p">request latency, throughput, timeouts, queue depth, event-loop lag</text><text x="980" y="150" class="s">time / application metrics</text>
  <path d="M800 205 V245" class="line"/>
  <rect x="95" y="245" width="1410" height="110" rx="8" fill="#dbeafe" class="box"/><text x="155" y="282" class="t">System-call boundary</text><text x="155" y="316" class="p">which calls block, return partial results, EAGAIN or errors?</text><text x="980" y="300" class="s">strace -ttT -e trace=read,write,poll,epoll_wait</text>
  <path d="M800 355 V395" class="line"/>
  <rect x="95" y="395" width="1410" height="110" rx="8" fill="#ede9fe" class="box"/><text x="155" y="432" class="t">Process and scheduler</text><text x="155" y="466" class="p">bytes attempted, context switches, blocked time and CPU placement</text><text x="980" y="450" class="s">/proc/$pid/io · pidstat -d -w · perf sched</text>
  <path d="M800 505 V545" class="line"/>
  <rect x="95" y="545" width="1410" height="110" rx="8" fill="#fff7ed" class="box"/><text x="155" y="582" class="t">Kernel queues and event delivery</text><text x="155" y="616" class="p">request queueing, softirq pressure, IRQ affinity, wakeups and completion latency</text><text x="980" y="600" class="s">/proc/interrupts · /proc/softirqs · ftrace / eBPF</text>
  <path d="M800 655 V695" class="line"/>
  <rect x="95" y="695" width="680" height="115" rx="8" fill="#fef3c7" class="box"/><text x="155" y="733" class="t">Block device</text><text x="155" y="765" class="p">in-flight requests, utilization, service and queue delay</text><text x="155" y="794" class="s">iostat -xz 1 · /sys/block/$dev/stat</text>
  <rect x="825" y="695" width="680" height="115" rx="8" fill="#dcfce7" class="box"/><text x="885" y="733" class="t">Network device</text><text x="885" y="765" class="p">packet drops, errors, ring/softirq load and queue imbalance</text><text x="885" y="794" class="s">ip -s link · ethtool -S · /sys/class/net</text>
  <text x="800" y="858" text-anchor="middle" class="p">A long read() may include sleeping, but a short read() does not prove the data path had no earlier queueing.</text>
</svg>
