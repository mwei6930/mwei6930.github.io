<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Type 1 and Type 2 hypervisor architectures</title>
  <desc id="desc">Two layered stacks show bare-metal and hosted hypervisors and explain why modern systems such as KVM blur the simple taxonomy.</desc>
  <defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#17202a;letter-spacing:0}.h{font-size:28px;font-weight:700}.s{font-size:21px;font-weight:700}.b{font-size:17px}.n{font-size:15px;fill:#425466}.box{stroke:#34495e;stroke-width:2;rx:6}.brace{fill:none;stroke:#c0392b;stroke-width:3;stroke-dasharray:9 7}</style></defs>
  <rect width="1200" height="650" fill="#f8fafc"/><text x="600" y="42" text-anchor="middle" class="h">Hypervisor placement is about control paths, not product labels</text>
  <text x="302" y="88" text-anchor="middle" class="s">Type 1: bare-metal control layer</text>
  <rect x="80" y="112" width="205" height="78" class="box" fill="#d6eaf8"/><text x="182" y="145" text-anchor="middle" class="b">Guest applications</text><text x="182" y="171" text-anchor="middle" class="n">VM A</text>
  <rect x="319" y="112" width="205" height="78" class="box" fill="#d6eaf8"/><text x="421" y="145" text-anchor="middle" class="b">Guest applications</text><text x="421" y="171" text-anchor="middle" class="n">VM B</text>
  <rect x="80" y="207" width="205" height="72" class="box" fill="#d5f5e3"/><text x="182" y="251" text-anchor="middle" class="b">Guest OS</text>
  <rect x="319" y="207" width="205" height="72" class="box" fill="#d5f5e3"/><text x="421" y="251" text-anchor="middle" class="b">Guest OS</text>
  <rect x="80" y="302" width="444" height="104" class="box" fill="#eadcf8"/><text x="302" y="342" text-anchor="middle" class="s">Hypervisor</text><text x="302" y="372" text-anchor="middle" class="n">CPU scheduling, memory mapping, isolation</text><text x="302" y="394" text-anchor="middle" class="n">often with a privileged management domain</text>
  <rect x="80" y="430" width="444" height="78" class="box" fill="#fdebd0"/><text x="302" y="478" text-anchor="middle" class="s">Hardware</text>
  <path d="M58 102 V518 H548" class="brace"/><text x="302" y="550" text-anchor="middle" class="n">Examples of the design family: ESXi, Xen, Hyper-V</text>

  <text x="895" y="88" text-anchor="middle" class="s">Type 2: hosted VMM</text>
  <rect x="665" y="112" width="205" height="78" class="box" fill="#d6eaf8"/><text x="767" y="145" text-anchor="middle" class="b">Guest applications</text><text x="767" y="171" text-anchor="middle" class="n">VM A</text>
  <rect x="904" y="112" width="205" height="78" class="box" fill="#d6eaf8"/><text x="1006" y="145" text-anchor="middle" class="b">Guest applications</text><text x="1006" y="171" text-anchor="middle" class="n">VM B</text>
  <rect x="665" y="207" width="205" height="72" class="box" fill="#d5f5e3"/><text x="767" y="251" text-anchor="middle" class="b">Guest OS</text>
  <rect x="904" y="207" width="205" height="72" class="box" fill="#d5f5e3"/><text x="1006" y="251" text-anchor="middle" class="b">Guest OS</text>
  <rect x="665" y="302" width="444" height="68" class="box" fill="#eadcf8"/><text x="887" y="344" text-anchor="middle" class="s">VMM process</text>
  <rect x="665" y="388" width="444" height="68" class="box" fill="#d5f5e3"/><text x="887" y="430" text-anchor="middle" class="s">Host operating system</text>
  <rect x="665" y="474" width="444" height="68" class="box" fill="#fdebd0"/><text x="887" y="516" text-anchor="middle" class="s">Hardware</text>
  <path d="M643 102 V552 H1133" class="brace"/><text x="887" y="580" text-anchor="middle" class="n">Examples of the design family: desktop-hosted VMMs</text>

  <rect x="180" y="595" width="840" height="38" rx="6" fill="#fff3cd" stroke="#b9770e" stroke-width="2"/><text x="600" y="620" text-anchor="middle" class="b">KVM is deliberately hybrid: Linux supplies kernel mechanisms; QEMU supplies user-space device and machine models.</text>
</svg>
