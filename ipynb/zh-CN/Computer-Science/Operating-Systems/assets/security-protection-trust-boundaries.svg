<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Protection, security, and isolation are related but distinct</title>
  <desc id="desc">A layered diagram connects policy, mediation, isolation mechanisms, hardware enforcement, and audit feedback.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#46596d"/></marker></defs>
  <style>
    text{font-family:Arial,sans-serif;fill:#172235}.title{font-size:28px;font-weight:700}.head{font-size:19px;font-weight:700}.body{font-size:15px}.small{font-size:13px;fill:#516173}.box{stroke:#65778a;stroke-width:2}.line{stroke:#46596d;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
  </style>
  <rect width="1200" height="650" fill="#f7f9fb"/>
  <text x="600" y="42" text-anchor="middle" class="title">Security is an end-to-end property built from several contracts</text>
  <rect x="85" y="83" width="880" height="78" rx="8" fill="#e6f0ff" class="box"/>
  <text x="115" y="115" class="head">Policy and threat model</text><text x="115" y="140" class="body">Which principals, objects, operations, adversaries, failures, and information flows matter?</text>
  <rect x="85" y="185" width="880" height="78" rx="8" fill="#eee9ff" class="box"/>
  <text x="115" y="217" class="head">Protection and mediation</text><text x="115" y="242" class="body">Authenticate a subject, resolve an object, evaluate policy, and allow or deny every protected operation.</text>
  <rect x="85" y="287" width="880" height="78" rx="8" fill="#e5f7ed" class="box"/>
  <text x="115" y="319" class="head">Isolation and least authority</text><text x="115" y="344" class="body">Separate address spaces and views; minimize privileges, reachable objects, syscalls, and resource budgets.</text>
  <rect x="85" y="389" width="880" height="78" rx="8" fill="#fff2d5" class="box"/>
  <text x="115" y="421" class="head">Kernel and hardware enforcement</text><text x="115" y="446" class="body">Privilege levels, page permissions, reference checks, MMU/IOMMU, secure transitions, and fault handling.</text>
  <rect x="85" y="491" width="880" height="78" rx="8" fill="#dff4f5" class="box"/>
  <text x="115" y="523" class="head">Audit, detection, and recovery</text><text x="115" y="548" class="body">Record security decisions, preserve evidence, detect policy failure, revoke authority, and restore service.</text>
  <path d="M525 161V185M525 263V287M525 365V389M525 467V491" class="line"/>
  <rect x="1000" y="111" width="145" height="422" rx="8" fill="#fff" class="box"/>
  <text x="1072" y="145" text-anchor="middle" class="head">Security</text>
  <text x="1072" y="177" text-anchor="middle" class="body">asks whether</text><text x="1072" y="199" text-anchor="middle" class="body">all layers remain</text><text x="1072" y="221" text-anchor="middle" class="body">effective under</text><text x="1072" y="243" text-anchor="middle" class="body">attack and failure.</text>
  <path d="M1072 272V456" stroke="#16817a" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1072" y="488" text-anchor="middle" class="small">Feedback changes</text><text x="1072" y="507" text-anchor="middle" class="small">policy and controls.</text>
  <text x="600" y="615" text-anchor="middle" class="small">Protection answers an authorization question; isolation reduces interaction; security depends on both and on their assumptions.</text>
</svg>
