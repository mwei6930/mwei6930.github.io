<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">Condition variable wait and signal protocol</title>
  <desc id="desc">A consumer holds a mutex, checks a predicate, atomically releases the mutex and sleeps, then wakes, reacquires the mutex, and checks again. A producer modifies the predicate while holding the same mutex and signals.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#374151"/></marker><style>.h{font:700 28px system-ui,sans-serif;fill:#111827}.t{font:600 18px system-ui,sans-serif;fill:#111827}.s{font:15px system-ui,sans-serif;fill:#374151}.box{stroke:#374151;stroke-width:2}.line{fill:none;stroke:#374151;stroke-width:3;marker-end:url(#arrow)}.wake{fill:none;stroke:#7c3aed;stroke-width:4;stroke-dasharray:10 7;marker-end:url(#arrow)}.pulse{fill:#fef3c7;stroke:#b45309;stroke-width:3;opacity:.22;animation:pulse 2.2s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.12}50%{opacity:.7}}@media(prefers-reduced-motion:reduce){.pulse{animation:none;opacity:.25}}</style></defs>
  <rect width="1500" height="900" fill="#fff"/>
  <text x="750" y="45" text-anchor="middle" class="h">A condition variable waits for a predicate; it does not store the predicate</text>
  <line x1="750" y1="85" x2="750" y2="790" stroke="#d1d5db" stroke-width="2"/>
  <text x="370" y="105" text-anchor="middle" class="t">Consumer</text><text x="1130" y="105" text-anchor="middle" class="t">Producer</text>
  <rect x="160" y="145" width="420" height="70" rx="8" fill="#dbeafe" class="box"/><text x="370" y="187" text-anchor="middle" class="t">lock(mutex)</text>
  <path d="M370 215 V275" class="line"/>
  <polygon points="370,275 550,350 370,425 190,350" fill="#fef3c7" class="box"/><text x="370" y="342" text-anchor="middle" class="t">predicate true?</text><text x="370" y="370" text-anchor="middle" class="s">for example count &gt; 0</text>
  <path d="M190 350 H95 V620 H160" class="line"/><text x="110" y="330" class="s">no</text>
  <rect x="160" y="580" width="420" height="90" rx="8" fill="#f3e8ff" class="box"/><rect x="176" y="595" width="388" height="60" rx="6" class="pulse"/><text x="370" y="615" text-anchor="middle" class="t">cond_wait(cv, mutex)</text><text x="370" y="643" text-anchor="middle" class="s">atomically unlock + sleep; later reacquire</text>
  <path d="M370 580 C650 535 650 455 750 455" class="wake"/>
  <path d="M580 625 C680 625 680 350 550 350" class="line"/><text x="605" y="605" class="s">wake and recheck</text>
  <path d="M550 350 H650 V750 H580" class="line"/><text x="580" y="330" class="s">yes</text>
  <rect x="160" y="715" width="420" height="70" rx="8" fill="#dcfce7" class="box"/><text x="370" y="757" text-anchor="middle" class="t">consume state; unlock(mutex)</text>
  <rect x="920" y="145" width="420" height="70" rx="8" fill="#dbeafe" class="box"/><text x="1130" y="187" text-anchor="middle" class="t">lock(the same mutex)</text>
  <path d="M1130 215 V305" class="line"/>
  <rect x="920" y="305" width="420" height="85" rx="8" fill="#dcfce7" class="box"/><text x="1130" y="340" text-anchor="middle" class="t">change protected state</text><text x="1130" y="368" text-anchor="middle" class="s">enqueue item; count becomes positive</text>
  <path d="M1130 390 V455" class="line"/>
  <rect x="920" y="455" width="420" height="75" rx="8" fill="#f3e8ff" class="box"/><text x="1130" y="500" text-anchor="middle" class="t">cond_signal(cv)</text>
  <path d="M920 493 H750" class="wake"/><text x="815" y="475" class="s">makes waiter eligible</text>
  <path d="M1130 530 V610" class="line"/>
  <rect x="920" y="610" width="420" height="70" rx="8" fill="#fee2e2" class="box"/><text x="1130" y="652" text-anchor="middle" class="t">unlock(mutex)</text>
  <rect x="220" y="825" width="1060" height="48" rx="8" fill="#f8fafc" class="box"/>
  <text x="750" y="855" text-anchor="middle" class="s">Use while, not if: another consumer may win the mutex, the predicate may change, and spurious wakeups are permitted.</text>
</svg>
