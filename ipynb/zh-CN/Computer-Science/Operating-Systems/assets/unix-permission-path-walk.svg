<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Unix permission checks during pathname traversal</title>
  <desc id="desc">A process traverses directories using search permission before checking file read or write permission, with separate rules for modifying directory entries.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#46596d"/></marker></defs>
  <style>text{font-family:Arial,sans-serif;fill:#172235}.title{font-size:28px;font-weight:700}.head{font-size:18px;font-weight:700}.body{font-size:15px}.small{font-size:13px;fill:#526274}.box{stroke:#65788b;stroke-width:2}.arrow{stroke:#46596d;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style>
  <rect width="1200" height="650" fill="#f7f9fb"/><text x="600" y="42" text-anchor="middle" class="title">Opening a file requires search permission on every directory component</text>
  <rect x="50" y="88" width="1100" height="86" rx="8" fill="#e6f0ff" class="box"/><text x="80" y="120" class="head">Request</text><text x="200" y="120" class="body">process FSUID 1000, groups {100, 220}: open("/srv/project/result.txt", O_WRONLY)</text><text x="80" y="149" class="small">The kernel resolves names component by component; possession of the final string does not confer access.</text>
  <g>
    <rect x="50" y="230" width="190" height="150" rx="8" fill="#fff2d5" class="box"/><text x="145" y="263" text-anchor="middle" class="head">/</text><text x="145" y="296" text-anchor="middle" class="body">root:root 0755</text><text x="145" y="326" text-anchor="middle" class="body">other x: search OK</text><text x="145" y="354" text-anchor="middle" class="small">lookup "srv"</text>
    <rect x="275" y="230" width="190" height="150" rx="8" fill="#fff2d5" class="box"/><text x="370" y="263" text-anchor="middle" class="head">/srv</text><text x="370" y="296" text-anchor="middle" class="body">root:staff 0710</text><text x="370" y="326" text-anchor="middle" class="body">group x: search OK</text><text x="370" y="354" text-anchor="middle" class="small">lookup "project"</text>
    <rect x="500" y="230" width="190" height="150" rx="8" fill="#fff2d5" class="box"/><text x="595" y="263" text-anchor="middle" class="head">/srv/project</text><text x="595" y="296" text-anchor="middle" class="body">alice:team 2770</text><text x="595" y="326" text-anchor="middle" class="body">group x: search OK</text><text x="595" y="354" text-anchor="middle" class="small">lookup "result.txt"</text>
    <rect x="725" y="230" width="190" height="150" rx="8" fill="#e5f7ed" class="box"/><text x="820" y="263" text-anchor="middle" class="head">result.txt</text><text x="820" y="296" text-anchor="middle" class="body">alice:team 0660</text><text x="820" y="326" text-anchor="middle" class="body">group w: open OK</text><text x="820" y="354" text-anchor="middle" class="small">descriptor returned</text>
  </g>
  <path d="M240 305H275M465 305H500M690 305H725" class="arrow"/>
  <rect x="950" y="218" width="200" height="175" rx="8" fill="#ffe6e3" class="box"/><text x="1050" y="250" text-anchor="middle" class="head">Possible denial</text><text x="1050" y="282" text-anchor="middle" class="body">Missing x on /srv</text><text x="1050" y="307" text-anchor="middle" class="body">stops lookup before</text><text x="1050" y="332" text-anchor="middle" class="body">the file's own mode</text><text x="1050" y="365" text-anchor="middle" class="small">EACCES, not “file denied”</text>
  <rect x="65" y="440" width="330" height="135" rx="8" fill="#fff" class="box"/><text x="230" y="472" text-anchor="middle" class="head">Regular file</text><text x="90" y="505" class="body">r = read bytes</text><text x="90" y="532" class="body">w = modify bytes</text><text x="90" y="559" class="body">x = execute as program</text>
  <rect x="435" y="440" width="330" height="135" rx="8" fill="#fff" class="box"/><text x="600" y="472" text-anchor="middle" class="head">Directory</text><text x="460" y="505" class="body">r = list entry names</text><text x="460" y="532" class="body">x = search/traverse names</text><text x="460" y="559" class="body">w+x = create/delete entries</text>
  <rect x="805" y="440" width="330" height="135" rx="8" fill="#eee9ff" class="box"/><text x="970" y="472" text-anchor="middle" class="head">Important separation</text><text x="830" y="505" class="body">Deleting a name checks its parent</text><text x="830" y="532" class="body">directory, not write permission on</text><text x="830" y="559" class="body">the target file itself.</text>
  <text x="600" y="620" text-anchor="middle" class="small">Owner, named-user ACL, group classes, ACL mask, other, capabilities, mount flags and LSM policy can all affect the final decision.</text>
</svg>
