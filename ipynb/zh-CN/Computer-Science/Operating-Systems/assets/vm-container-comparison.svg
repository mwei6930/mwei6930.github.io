<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 670" role="img" aria-labelledby="title desc">
  <title id="title">Virtual machine and container comparison across trust and operations</title>
  <desc id="desc">A two-dimensional comparison shows shared-kernel containers, full virtual machines, sandboxed containers, and microVMs along startup-state and isolation-boundary axes.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#34495e"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#17202a;letter-spacing:0}.h{font-size:28px;font-weight:700}.s{font-size:19px;font-weight:700}.b{font-size:16px}.n{font-size:14px;fill:#425466}.axis{stroke:#34495e;stroke-width:3;marker-end:url(#a)}.box{stroke:#34495e;stroke-width:2;rx:6}</style></defs>
  <rect width="1200" height="670" fill="#f8fafc"/><text x="600" y="42" text-anchor="middle" class="h">VM versus container is a design space, not a binary slogan</text>
  <line x1="165" y1="555" x2="1080" y2="555" class="axis"/><line x1="165" y1="555" x2="165" y2="100" class="axis"/>
  <text x="610" y="608" text-anchor="middle" class="s">More boot state, memory footprint, and lifecycle machinery</text>
  <text transform="translate(55 335) rotate(-90)" text-anchor="middle" class="s">Boundary below more privileged guest software</text>
  <rect x="240" y="390" width="230" height="105" class="box" fill="#d5f5e3"/><text x="355" y="424" text-anchor="middle" class="s">Linux container</text><text x="355" y="452" text-anchor="middle" class="n">shared host kernel</text><text x="355" y="476" text-anchor="middle" class="n">fast start; small image delta</text>
  <rect x="465" y="258" width="230" height="105" class="box" fill="#d6eaf8"/><text x="580" y="292" text-anchor="middle" class="s">Sandboxed container</text><text x="580" y="320" text-anchor="middle" class="n">user-space kernel or syscall proxy</text><text x="580" y="344" text-anchor="middle" class="n">extra boundary and compatibility work</text>
  <rect x="700" y="175" width="230" height="105" class="box" fill="#eadcf8"/><text x="815" y="209" text-anchor="middle" class="s">MicroVM</text><text x="815" y="237" text-anchor="middle" class="n">guest kernel + minimal device model</text><text x="815" y="261" text-anchor="middle" class="n">snapshot and fast-start specialization</text>
  <rect x="875" y="380" width="230" height="105" class="box" fill="#fdebd0"/><text x="990" y="414" text-anchor="middle" class="s">General-purpose VM</text><text x="990" y="442" text-anchor="middle" class="n">full guest OS and virtual hardware</text><text x="990" y="466" text-anchor="middle" class="n">broad compatibility and migration state</text>
  <text x="192" y="85" class="n">stronger against a compromised guest kernel</text><text x="985" y="582" class="n">not necessarily slower after warm-up</text>
  <rect x="225" y="625" width="750" height="33" rx="6" fill="#fff3cd" stroke="#b9770e" stroke-width="2"/><text x="600" y="647" text-anchor="middle" class="b">Evaluate the exact TCB, threat model, workload, and operational path; labels alone prove nothing.</text>
</svg>
