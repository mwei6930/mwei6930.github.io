<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 720" role="img" aria-labelledby="title desc">
  <title id="title">Context switch from process A to process B</title>
  <desc id="desc">A trap enters the kernel, saves A, changes its state, chooses B, switches address-space and kernel context, restores B, and returns to user mode.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#355070"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17212b; }
      .title { font-size: 31px; font-weight: 700; }
      .head { font-size: 21px; font-weight: 700; }
      .body { font-size: 17px; }
      .small { font-size: 15px; }
      .box { stroke: #355070; stroke-width: 2.3; rx: 8; }
      .arrow { stroke: #355070; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .boundary { stroke: #c44536; stroke-width: 3; stroke-dasharray: 10 8; }
    </style>
  </defs>
  <rect width="1520" height="720" fill="#fff"/>
  <text x="760" y="45" text-anchor="middle" class="title">A Context Switch Changes the Running Execution Context</text>
  <line x1="42" y1="205" x2="1478" y2="205" class="boundary"/>
  <text x="58" y="193" class="small" fill="#c44536">user mode</text><text x="58" y="230" class="small" fill="#c44536">kernel mode</text>

  <rect x="65" y="85" width="250" height="85" class="box" fill="#e9f2fb"/>
  <text x="190" y="119" text-anchor="middle" class="head">Process A running</text>
  <text x="190" y="148" text-anchor="middle" class="body">user registers + address space A</text>
  <path d="M315 128 L390 128 L390 252" class="arrow"/>

  <rect x="320" y="252" width="250" height="96" class="box" fill="#fff3d9"/>
  <text x="445" y="287" text-anchor="middle" class="head">Trap into kernel</text>
  <text x="445" y="318" text-anchor="middle" class="body">timer, blocking call, fault, yield</text>
  <text x="445" y="340" text-anchor="middle" class="small">a mode switch occurs first</text>

  <rect x="630" y="252" width="250" height="96" class="box" fill="#fdebea"/>
  <text x="755" y="287" text-anchor="middle" class="head">Save A</text>
  <text x="755" y="318" text-anchor="middle" class="body">registers, stack pointer, state</text>
  <text x="755" y="340" text-anchor="middle" class="small">A becomes ready or blocked</text>
  <path d="M570 300 L630 300" class="arrow"/>

  <rect x="940" y="252" width="250" height="96" class="box" fill="#f1eef8"/>
  <text x="1065" y="287" text-anchor="middle" class="head">Schedule and switch</text>
  <text x="1065" y="318" text-anchor="middle" class="body">choose B; switch kernel context</text>
  <text x="1065" y="340" text-anchor="middle" class="small">change memory context if required</text>
  <path d="M880 300 L940 300" class="arrow"/>

  <rect x="1245" y="252" width="230" height="96" class="box" fill="#e6f5ef"/>
  <text x="1360" y="287" text-anchor="middle" class="head">Restore B</text>
  <text x="1360" y="318" text-anchor="middle" class="body">saved registers and state</text>
  <text x="1360" y="340" text-anchor="middle" class="small">prepare protected return</text>
  <path d="M1190 300 L1245 300" class="arrow"/>
  <path d="M1360 252 L1360 128 L1290 128" class="arrow"/>

  <rect x="1040" y="85" width="250" height="85" class="box" fill="#e6f5ef"/>
  <text x="1165" y="119" text-anchor="middle" class="head">Process B running</text>
  <text x="1165" y="148" text-anchor="middle" class="body">user registers + address space B</text>

  <rect x="135" y="430" width="555" height="190" rx="8" fill="#f8fafb" stroke="#7c8794" stroke-width="2"/>
  <text x="413" y="468" text-anchor="middle" class="head">Direct work on the switch path</text>
  <text x="175" y="508" class="body">- enter and leave the kernel</text>
  <text x="175" y="541" class="body">- save and restore architectural state</text>
  <text x="175" y="574" class="body">- run scheduler and queue bookkeeping</text>
  <text x="175" y="607" class="body">- switch page-table / protection context when needed</text>

  <rect x="830" y="430" width="555" height="190" rx="8" fill="#f8fafb" stroke="#7c8794" stroke-width="2"/>
  <text x="1108" y="468" text-anchor="middle" class="head">Indirect work after the switch</text>
  <text x="870" y="508" class="body">- refill TLB entries and translation caches</text>
  <text x="870" y="541" class="body">- reload data and instructions displaced from caches</text>
  <text x="870" y="574" class="body">- recover branch-predictor and working-set locality</text>
  <text x="870" y="607" class="body">- suffer NUMA or migration penalties on another CPU</text>
  <text x="760" y="676" text-anchor="middle" class="small">A system call can return to A with no context switch; entering the kernel does not imply that B must run.</text>
</svg>
