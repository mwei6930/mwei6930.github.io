<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1540 760" role="img" aria-labelledby="title desc">
  <title id="title">Animated Unix fork, exec, exit, and wait lifecycle</title>
  <desc id="desc">A parent forks, the child prepares descriptors and executes a new program, the parent waits, the child exits, and the parent reaps its status. Animated markers show one possible interleaving.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#355070"/></marker>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17212b; }
      .title { font-size: 31px; font-weight: 700; }
      .lane { font-size: 22px; font-weight: 700; }
      .head { font-size: 20px; font-weight: 700; }
      .body { font-size: 17px; }
      .small { font-size: 15px; }
      .box { stroke: #355070; stroke-width: 2.4; rx: 8; }
      .line { stroke: #355070; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .timeline { stroke: #7c8794; stroke-width: 2; stroke-dasharray: 8 7; }
      @media (prefers-reduced-motion: reduce) {
        .animated-marker { display: none; }
      }
    </style>
  </defs>
  <rect width="1540" height="760" fill="#fff"/>
  <text x="770" y="45" text-anchor="middle" class="title">fork() Splits Execution; execve() Replaces One Branch</text>
  <text x="104" y="132" class="lane">Parent process</text>
  <text x="104" y="436" class="lane">Child process</text>
  <line x1="260" y1="126" x2="1460" y2="126" class="timeline"/>
  <line x1="260" y1="430" x2="1460" y2="430" class="timeline"/>

  <rect x="90" y="170" width="220" height="105" class="box" fill="#e9f2fb"/>
  <text x="200" y="206" text-anchor="middle" class="head">Program A</text>
  <text x="200" y="237" text-anchor="middle" class="body">one process, one PID</text>
  <text x="200" y="262" text-anchor="middle" class="small">calls fork()</text>

  <rect x="380" y="170" width="230" height="105" class="box" fill="#fff3d9"/>
  <text x="495" y="206" text-anchor="middle" class="head">Parent branch</text>
  <text x="495" y="237" text-anchor="middle" class="body">fork returns child PID</text>
  <text x="495" y="262" text-anchor="middle" class="small">may continue or wait</text>
  <path d="M310 222 L380 222" class="line"/>

  <rect x="702" y="170" width="230" height="105" class="box" fill="#f1eef8"/>
  <text x="817" y="206" text-anchor="middle" class="head">waitpid(child)</text>
  <text x="817" y="237" text-anchor="middle" class="body">parent becomes blocked</text>
  <text x="817" y="262" text-anchor="middle" class="small">unless using WNOHANG</text>
  <path d="M610 222 L702 222" class="line"/>

  <rect x="1130" y="170" width="275" height="105" class="box" fill="#e6f5ef"/>
  <text x="1268" y="206" text-anchor="middle" class="head">wait returns</text>
  <text x="1268" y="237" text-anchor="middle" class="body">status is collected</text>
  <text x="1268" y="262" text-anchor="middle" class="small">zombie record can be released</text>
  <path d="M932 222 L1130 222" class="line"/>

  <rect x="380" y="474" width="230" height="105" class="box" fill="#fff3d9"/>
  <text x="495" y="510" text-anchor="middle" class="head">Child branch</text>
  <text x="495" y="541" text-anchor="middle" class="body">fork returns 0</text>
  <text x="495" y="566" text-anchor="middle" class="small">new PID; inherited descriptors</text>
  <path d="M310 222 C345 222 335 526 380 526" class="line"/>

  <rect x="660" y="474" width="225" height="105" class="box" fill="#fdebea"/>
  <text x="773" y="510" text-anchor="middle" class="head">Child setup</text>
  <text x="773" y="541" text-anchor="middle" class="body">dup2 / close / signals</text>
  <text x="773" y="566" text-anchor="middle" class="small">small pre-exec window</text>
  <path d="M610 526 L660 526" class="line"/>

  <rect x="935" y="474" width="225" height="105" class="box" fill="#edf5e8"/>
  <text x="1048" y="510" text-anchor="middle" class="head">execve(Program B)</text>
  <text x="1048" y="541" text-anchor="middle" class="body">replace address space</text>
  <text x="1048" y="566" text-anchor="middle" class="small">PID is preserved</text>
  <path d="M885 526 L935 526" class="line"/>

  <rect x="1210" y="474" width="225" height="105" class="box" fill="#e6f5ef"/>
  <text x="1323" y="510" text-anchor="middle" class="head">exit(status)</text>
  <text x="1323" y="541" text-anchor="middle" class="body">execution ends</text>
  <text x="1323" y="566" text-anchor="middle" class="small">status remains waitable</text>
  <path d="M1160 526 L1210 526" class="line"/>
  <path d="M1323 474 C1323 360 1268 340 1268 275" class="line"/>

  <circle r="12" fill="#d1495b" filter="url(#glow)" class="animated-marker">
    <animateMotion dur="10s" repeatCount="indefinite" path="M200 222 L495 222 L817 222 L817 222" keyTimes="0;0.22;0.42;1" keyPoints="0;0.45;1;1" calcMode="linear"/>
    <animate attributeName="opacity" values="1;1;0.25;0.25;1" keyTimes="0;0.42;0.5;0.92;1" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle r="12" fill="#2a9d8f" filter="url(#glow)" opacity="0" class="animated-marker">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2;0.24;0.82;1" dur="10s" repeatCount="indefinite"/>
    <animateMotion dur="10s" repeatCount="indefinite" path="M310 222 C345 222 335 526 495 526 L773 526 L1048 526 L1323 526" keyTimes="0;0.2;0.32;0.52;0.7;0.82;1" keyPoints="0;0;0.23;0.45;0.68;1;1" calcMode="linear"/>
  </circle>
  <circle cx="1268" cy="222" r="12" fill="#d1495b" filter="url(#glow)" opacity="0" class="animated-marker">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.78;0.82;0.96;1" dur="10s" repeatCount="indefinite"/>
  </circle>

  <rect x="260" y="638" width="1020" height="74" rx="8" fill="#f8fafb" stroke="#7c8794" stroke-width="2"/>
  <text x="770" y="667" text-anchor="middle" class="body">Animated markers show one legal history, not a guaranteed schedule.</text>
  <text x="770" y="695" text-anchor="middle" class="small">After fork, parent and child are independently schedulable; exec succeeds without creating another process.</text>
</svg>
