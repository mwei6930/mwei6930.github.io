<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-labelledby="title desc">
  <title id="title">Scheduling metric timeline</title>
  <desc id="desc">A job arrives at time two, first runs at time five, executes in two intervals, and completes at time twelve. The diagram identifies response, waiting, turnaround, and service time.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker>
    <style>.h{font:700 28px system-ui,sans-serif;fill:#111827}.t{font:600 18px system-ui,sans-serif;fill:#111827}.s{font:16px system-ui,sans-serif;fill:#374151}.axis{stroke:#111827;stroke-width:3}.dash{stroke:#6b7280;stroke-width:2;stroke-dasharray:7 7}.br{fill:none;stroke-width:4;marker-end:url(#arrow)}.tick{stroke:#111827;stroke-width:2}</style>
  </defs>
  <rect width="1400" height="700" fill="#fff"/>
  <text x="700" y="48" text-anchor="middle" class="h">One job, four different timing questions</text>
  <line x1="120" y1="245" x2="1300" y2="245" class="axis" marker-end="url(#arrow)"/>
  <g class="tick"><line x1="280" y1="230" x2="280" y2="260"/><line x1="520" y1="230" x2="520" y2="260"/><line x1="840" y1="230" x2="840" y2="260"/><line x1="1080" y1="230" x2="1080" y2="260"/></g>
  <g class="t" text-anchor="middle"><text x="280" y="292">arrival = 2</text><text x="520" y="292">first run = 5</text><text x="840" y="292">preempted = 9</text><text x="1080" y="292">completion = 12</text></g>
  <rect x="280" y="165" width="240" height="46" fill="#fef3c7" stroke="#b45309"/><text x="400" y="195" text-anchor="middle" class="s">READY (waiting)</text>
  <rect x="520" y="165" width="320" height="46" fill="#86efac" stroke="#15803d"/><text x="680" y="195" text-anchor="middle" class="s">RUNNING (4 CPU units)</text>
  <rect x="840" y="165" width="160" height="46" fill="#fef3c7" stroke="#b45309"/><text x="920" y="195" text-anchor="middle" class="s">READY</text>
  <rect x="1000" y="165" width="80" height="46" fill="#86efac" stroke="#15803d"/><text x="1040" y="195" text-anchor="middle" class="s">1</text>
  <path d="M280 350 H520" class="br" stroke="#2563eb"/><text x="400" y="337" text-anchor="middle" class="t">response = 5 - 2 = 3</text>
  <path d="M280 420 H1080" class="br" stroke="#7c3aed"/><text x="680" y="407" text-anchor="middle" class="t">turnaround = 12 - 2 = 10</text>
  <path d="M280 490 H520" class="br" stroke="#b45309"/><path d="M840 490 H1000" class="br" stroke="#b45309"/><text x="700" y="477" text-anchor="middle" class="t">waiting = (5 - 2) + (11 - 9) = 5</text>
  <path d="M520 560 H840" class="br" stroke="#15803d"/><path d="M1000 560 H1080" class="br" stroke="#15803d"/><text x="700" y="547" text-anchor="middle" class="t">service (CPU burst) = 4 + 1 = 5</text>
  <text x="700" y="635" text-anchor="middle" class="s">For a CPU-only model with no other blocked time: waiting = turnaround - service.</text>
</svg>
