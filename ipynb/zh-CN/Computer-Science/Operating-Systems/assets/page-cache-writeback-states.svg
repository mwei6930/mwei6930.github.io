<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="900" viewBox="0 0 1700 900" role="img" aria-labelledby="title desc">
  <title id="title">Page-cache dirtying and writeback states</title>
  <desc id="desc">A buffered write copies data into a page-cache folio and marks it dirty. Background or explicit writeback submits storage I/O, then marks it clean or records an error. Returning from write is distinct from durable completion.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#334155"/></marker><style>.h{font:700 30px system-ui,sans-serif;fill:#111827}.t{font:700 18px system-ui,sans-serif;fill:#111827}.s{font:14px system-ui,sans-serif;fill:#334155}.box{stroke:#334155;stroke-width:2}.line{fill:none;stroke:#334155;stroke-width:3;marker-end:url(#a)}.ok{fill:none;stroke:#15803d;stroke-width:3;marker-end:url(#a)}.bad{fill:none;stroke:#dc2626;stroke-width:3;marker-end:url(#a)}.dash{fill:none;stroke:#7c3aed;stroke-width:3;stroke-dasharray:9 7;marker-end:url(#a)}</style></defs>
  <rect width="1700" height="900" fill="#fff"/><text x="850" y="48" text-anchor="middle" class="h">Buffered write completion and durable storage completion are different events</text>
  <rect x="80" y="110" width="300" height="105" rx="8" fill="#eff6ff" class="box"/><text x="230" y="150" text-anchor="middle" class="t">Application buffer</text><text x="230" y="180" text-anchor="middle" class="s">new bytes in userspace</text>
  <path d="M380 162 H510" class="line"/><text x="445" y="143" text-anchor="middle" class="s">write()</text>
  <rect x="510" y="95" width="400" height="135" rx="8" fill="#fef3c7" class="box"/><text x="710" y="137" text-anchor="middle" class="t">Page-cache folio becomes DIRTY</text><text x="710" y="170" text-anchor="middle" class="s">bytes copied; inode size/metadata may change</text><text x="710" y="200" text-anchor="middle" class="s">write() can return here</text>
  <path d="M910 162 H1040" class="dash"/><text x="975" y="142" text-anchor="middle" class="s" fill="#6d28d9">later</text>
  <rect x="1040" y="95" width="360" height="135" rx="8" fill="#ffedd5" class="box"/><text x="1220" y="137" text-anchor="middle" class="t">WRITEBACK in progress</text><text x="1220" y="170" text-anchor="middle" class="s">filesystem maps blocks and submits I/O</text><text x="1220" y="200" text-anchor="middle" class="s">dirty throttling may slow producers</text>
  <path d="M1400 162 H1530 V325" class="line"/>
  <rect x="1270" y="325" width="390" height="120" rx="8" fill="#ecfeff" class="box"/><text x="1465" y="365" text-anchor="middle" class="t">Device reports completion</text><text x="1465" y="397" text-anchor="middle" class="s">success, ENOSPC, EIO, transport failure</text><text x="1465" y="425" text-anchor="middle" class="s">cache flush may still be required</text>
  <path d="M1270 385 H1060 V540" class="ok"/><text x="1120" y="365" class="s" fill="#15803d">success</text>
  <rect x="870" y="540" width="380" height="120" rx="8" fill="#dcfce7" class="box"/><text x="1060" y="580" text-anchor="middle" class="t">CLEAN and reclaimable</text><text x="1060" y="612" text-anchor="middle" class="s">cached bytes match acknowledged backing state</text><text x="1060" y="640" text-anchor="middle" class="s">page may remain for future reads</text>
  <path d="M1465 445 V540" class="bad"/><text x="1482" y="505" class="s" fill="#b91c1c">error</text>
  <rect x="1300" y="540" width="330" height="120" rx="8" fill="#fee2e2" class="box"/><text x="1465" y="580" text-anchor="middle" class="t">Writeback error recorded</text><text x="1465" y="612" text-anchor="middle" class="s">reported by fsync/close/later writes</text><text x="1465" y="640" text-anchor="middle" class="s">application must not ignore it</text>

  <rect x="80" y="325" width="620" height="335" rx="8" fill="#f8fafc" class="box"/><text x="390" y="365" text-anchor="middle" class="t">What can trigger writeback?</text>
  <text x="135" y="420" class="s">- explicit fsync(), fdatasync(), syncfs()</text><text x="135" y="460" class="s">- dirty-age or dirty-ratio thresholds</text><text x="135" y="500" class="s">- memory pressure / reclaim</text><text x="135" y="540" class="s">- periodic filesystem transaction commit</text><text x="135" y="580" class="s">- unmount, freeze, shutdown</text><text x="135" y="620" class="s">- synchronous open/write flags</text>
  <path d="M700 465 H820 V230 H910" class="dash"/>
  <rect x="180" y="735" width="1340" height="90" rx="8" fill="#f5f3ff" class="box"/><text x="850" y="771" text-anchor="middle" class="t">Cache coherence relation</text><text x="850" y="802" text-anchor="middle" class="s">read(), write(), and shared mmap normally observe the same file-backed page-cache identity; direct I/O requires additional coherence rules.</text>
  <text x="850" y="870" text-anchor="middle" class="s">A successful buffered write means the kernel accepted bytes, not necessarily that power loss can no longer erase them.</text>
</svg>
