<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 710" role="img" aria-labelledby="title desc">
  <title id="title">Monolithic, microkernel, exokernel, and unikernel architectures</title>
  <desc id="desc">Four architecture columns show where operating-system services and policy run and what the protected boundary contains.</desc>
  <defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#17202a;letter-spacing:0}.h{font-size:28px;font-weight:700}.s{font-size:18px;font-weight:700}.b{font-size:15px}.n{font-size:13px;fill:#425466}.box{stroke:#34495e;stroke-width:2;rx:6}.bound{fill:none;stroke:#c0392b;stroke-width:3;stroke-dasharray:8 6;rx:8}</style></defs>
  <rect width="1200" height="710" fill="#f8fafc"/><text x="600" y="42" text-anchor="middle" class="h">Kernel architectures move policy, services, and protection boundaries</text>
  <text x="165" y="88" text-anchor="middle" class="s">Monolithic</text>
  <rect x="45" y="110" width="240" height="65" class="box" fill="#d6eaf8"/><text x="165" y="150" text-anchor="middle" class="b">Applications</text>
  <rect x="45" y="200" width="240" height="235" class="box" fill="#d5f5e3"/><text x="165" y="232" text-anchor="middle" class="s">One kernel address space</text><text x="165" y="271" text-anchor="middle" class="n">scheduler + VM + VFS</text><text x="165" y="298" text-anchor="middle" class="n">network + drivers + IPC</text><text x="165" y="325" text-anchor="middle" class="n">loadable modules possible</text><text x="165" y="374" text-anchor="middle" class="b">direct internal calls</text><text x="165" y="401" text-anchor="middle" class="n">large privileged failure domain</text>
  <rect x="45" y="462" width="240" height="58" class="box" fill="#fdebd0"/><text x="165" y="498" text-anchor="middle" class="b">Hardware</text><rect x="34" y="190" width="262" height="256" class="bound"/>

  <text x="455" y="88" text-anchor="middle" class="s">Microkernel</text>
  <rect x="335" y="110" width="240" height="65" class="box" fill="#d6eaf8"/><text x="455" y="150" text-anchor="middle" class="b">Applications</text>
  <rect x="335" y="200" width="112" height="110" class="box" fill="#eadcf8"/><text x="391" y="235" text-anchor="middle" class="b">File server</text><text x="391" y="264" text-anchor="middle" class="n">user mode</text><text x="391" y="289" text-anchor="middle" class="n">IPC</text>
  <rect x="463" y="200" width="112" height="110" class="box" fill="#eadcf8"/><text x="519" y="235" text-anchor="middle" class="b">Driver</text><text x="519" y="264" text-anchor="middle" class="n">user mode</text><text x="519" y="289" text-anchor="middle" class="n">IPC</text>
  <rect x="335" y="335" width="240" height="100" class="box" fill="#d5f5e3"/><text x="455" y="370" text-anchor="middle" class="s">Minimal kernel</text><text x="455" y="399" text-anchor="middle" class="n">address spaces, IPC, scheduling</text><text x="455" y="422" text-anchor="middle" class="n">capability/protection primitives</text>
  <rect x="335" y="462" width="240" height="58" class="box" fill="#fdebd0"/><text x="455" y="498" text-anchor="middle" class="b">Hardware</text><rect x="324" y="325" width="262" height="121" class="bound"/>

  <text x="745" y="88" text-anchor="middle" class="s">Exokernel</text>
  <rect x="625" y="110" width="240" height="65" class="box" fill="#d6eaf8"/><text x="745" y="150" text-anchor="middle" class="b">Application</text>
  <rect x="625" y="200" width="240" height="110" class="box" fill="#eadcf8"/><text x="745" y="235" text-anchor="middle" class="s">Library OS</text><text x="745" y="264" text-anchor="middle" class="n">app-selected abstractions</text><text x="745" y="289" text-anchor="middle" class="n">resource-management policy</text>
  <rect x="625" y="335" width="240" height="100" class="box" fill="#d5f5e3"/><text x="745" y="370" text-anchor="middle" class="s">Exokernel</text><text x="745" y="399" text-anchor="middle" class="n">securely multiplex raw resources</text><text x="745" y="422" text-anchor="middle" class="n">allocation, revocation, protection</text>
  <rect x="625" y="462" width="240" height="58" class="box" fill="#fdebd0"/><text x="745" y="498" text-anchor="middle" class="b">Hardware</text><rect x="614" y="325" width="262" height="121" class="bound"/>

  <text x="1035" y="88" text-anchor="middle" class="s">Unikernel</text>
  <rect x="915" y="110" width="240" height="325" class="box" fill="#d6eaf8"/><text x="1035" y="146" text-anchor="middle" class="s">Single-purpose image</text><text x="1035" y="187" text-anchor="middle" class="n">application</text><text x="1035" y="214" text-anchor="middle" class="n">selected language/runtime</text><text x="1035" y="241" text-anchor="middle" class="n">library OS components</text><text x="1035" y="268" text-anchor="middle" class="n">minimal drivers/platform code</text><text x="1035" y="319" text-anchor="middle" class="b">often one address space</text><text x="1035" y="346" text-anchor="middle" class="n">small specialized image</text><text x="1035" y="373" text-anchor="middle" class="n">reduced generality and tooling</text>
  <rect x="915" y="462" width="240" height="58" class="box" fill="#fdebd0"/><text x="1035" y="498" text-anchor="middle" class="b">Virtual hardware / monitor</text><rect x="904" y="100" width="262" height="346" class="bound"/>

  <rect x="75" y="570" width="1050" height="103" rx="6" fill="#ffffff" stroke="#34495e" stroke-width="2"/>
  <text x="600" y="601" text-anchor="middle" class="b">No architecture simultaneously maximizes compatibility, fault isolation, minimal TCB, specialization, and ease of development.</text>
  <text x="600" y="630" text-anchor="middle" class="n">Ask where a buggy driver runs, how services communicate, who chooses resource policy, what is protected by hardware, and how the system is updated.</text>
  <text x="600" y="655" text-anchor="middle" class="n">The dashed outline marks the most characteristic privileged or single-image boundary, not every implementation detail.</text>
</svg>
