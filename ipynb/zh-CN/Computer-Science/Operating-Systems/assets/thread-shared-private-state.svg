<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1540 850" role="img" aria-labelledby="title desc">
  <title id="title">Shared process state and private thread execution state</title>
  <desc id="desc">A process contains shared address-space and resource state. Three threads each have private registers, stack, signal mask, scheduling state, and thread-local storage.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#355070"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17212b; }
      .title { font-size: 32px; font-weight: 700; }
      .section { font-size: 23px; font-weight: 700; }
      .head { font-size: 19px; font-weight: 700; }
      .body { font-size: 16px; }
      .small { font-size: 14px; }
      .panel { stroke: #355070; stroke-width: 2.4; rx: 9; }
      .link { stroke: #355070; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1540" height="850" fill="#fff"/>
  <text x="770" y="48" text-anchor="middle" class="title">One Process Owns Resources; Each Thread Carries an Execution Context</text>

  <rect x="55" y="90" width="1430" height="690" class="panel" fill="#f8fafb"/>
  <text x="90" y="130" class="section">Process-wide state</text>

  <rect x="105" y="160" width="1330" height="220" class="panel" fill="#e9f2fb"/>
  <rect x="135" y="205" width="190" height="120" class="panel" fill="#fff"/>
  <text x="230" y="239" text-anchor="middle" class="head">Address space</text>
  <text x="230" y="271" text-anchor="middle" class="body">code, globals, heap</text>
  <text x="230" y="299" text-anchor="middle" class="body">shared mappings</text>

  <rect x="350" y="205" width="190" height="120" class="panel" fill="#fff3d9"/>
  <text x="445" y="239" text-anchor="middle" class="head">Descriptors</text>
  <text x="445" y="271" text-anchor="middle" class="body">files, pipes</text>
  <text x="445" y="299" text-anchor="middle" class="body">sockets, devices</text>

  <rect x="565" y="205" width="190" height="120" class="panel" fill="#edf5e8"/>
  <text x="660" y="239" text-anchor="middle" class="head">Identity</text>
  <text x="660" y="271" text-anchor="middle" class="body">PID, credentials</text>
  <text x="660" y="299" text-anchor="middle" class="body">working directory</text>

  <rect x="780" y="205" width="190" height="120" class="panel" fill="#f1eef8"/>
  <text x="875" y="239" text-anchor="middle" class="head">Signal policy</text>
  <text x="875" y="271" text-anchor="middle" class="body">dispositions</text>
  <text x="875" y="299" text-anchor="middle" class="body">process pending set</text>

  <rect x="995" y="205" width="190" height="120" class="panel" fill="#fdebea"/>
  <text x="1090" y="239" text-anchor="middle" class="head">Resource policy</text>
  <text x="1090" y="271" text-anchor="middle" class="body">limits, timers</text>
  <text x="1090" y="299" text-anchor="middle" class="body">accounting</text>

  <rect x="1210" y="205" width="190" height="120" class="panel" fill="#e6f5ef"/>
  <text x="1305" y="239" text-anchor="middle" class="head">Process lifetime</text>
  <text x="1305" y="271" text-anchor="middle" class="body">parent relation</text>
  <text x="1305" y="299" text-anchor="middle" class="body">exit status</text>

  <text x="90" y="426" class="section">Per-thread state</text>

  <rect x="115" y="455" width="390" height="250" class="panel" fill="#e6f5ef"/>
  <text x="310" y="494" text-anchor="middle" class="section">Thread A</text>
  <text x="155" y="535" class="body">- program counter and registers</text>
  <text x="155" y="568" class="body">- user stack and kernel stack</text>
  <text x="155" y="601" class="body">- thread ID and scheduler state</text>
  <text x="155" y="634" class="body">- signal mask and pending set</text>
  <text x="155" y="667" class="body">- errno and thread-local storage</text>

  <rect x="575" y="455" width="390" height="250" class="panel" fill="#fff3d9"/>
  <text x="770" y="494" text-anchor="middle" class="section">Thread B</text>
  <text x="615" y="535" class="body">- program counter and registers</text>
  <text x="615" y="568" class="body">- user stack and kernel stack</text>
  <text x="615" y="601" class="body">- thread ID and scheduler state</text>
  <text x="615" y="634" class="body">- signal mask and pending set</text>
  <text x="615" y="667" class="body">- errno and thread-local storage</text>

  <rect x="1035" y="455" width="390" height="250" class="panel" fill="#fdebea"/>
  <text x="1230" y="494" text-anchor="middle" class="section">Thread C</text>
  <text x="1075" y="535" class="body">- program counter and registers</text>
  <text x="1075" y="568" class="body">- user stack and kernel stack</text>
  <text x="1075" y="601" class="body">- thread ID and scheduler state</text>
  <text x="1075" y="634" class="body">- signal mask and pending set</text>
  <text x="1075" y="667" class="body">- errno and thread-local storage</text>

  <path d="M310 455 L310 405 L300 380" class="link"/>
  <path d="M770 455 L770 380" class="link"/>
  <path d="M1230 455 L1230 405 L1240 380" class="link"/>

  <rect x="225" y="735" width="1090" height="70" rx="8" fill="#fff" stroke="#7c8794" stroke-width="2"/>
  <text x="770" y="764" text-anchor="middle" class="body">A thread is cheaper to create partly because it reuses process resources.</text>
  <text x="770" y="790" text-anchor="middle" class="small">The same sharing also increases coupling: one bad pointer can corrupt data used by every thread.</text>
</svg>
