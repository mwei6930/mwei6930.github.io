<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="980" viewBox="0 0 1700 980" role="img" aria-labelledby="title desc">
  <title id="title">Comparison of page replacement policies</title><desc id="desc">A common reference string is evaluated with three frames under optimal, FIFO, LRU, and random replacement. The diagram separates implementability, state cost, and expected behavior.</desc>
  <defs><style>.h{font:700 30px system-ui,sans-serif;fill:#111827}.t{font:700 18px system-ui,sans-serif;fill:#111827}.s{font:15px system-ui,sans-serif;fill:#334155}.mono{font:600 16px ui-monospace,monospace;fill:#111827}.box{stroke:#334155;stroke-width:2}.grid{stroke:#94a3b8;stroke-width:1}.fault{fill:#fee2e2}.hit{fill:#dcfce7}</style></defs>
  <rect width="1700" height="980" fill="#fff"/><text x="850" y="48" text-anchor="middle" class="h">One reference stream, four different definitions of “best victim”</text>
  <rect x="170" y="80" width="1360" height="70" rx="8" fill="#f1f5f9" class="box"/><text x="850" y="108" text-anchor="middle" class="t">Reference string with three frames</text><text x="850" y="135" text-anchor="middle" class="mono">7  0  1  2  0  3  0  4  2  3  0  3  2</text>

  <g transform="translate(80,205)">
    <rect width="360" height="485" rx="8" fill="#eff6ff" class="box"/><text x="180" y="42" text-anchor="middle" class="t">OPT / MIN</text>
    <text x="28" y="85" class="s">Victim:</text><text x="98" y="85" class="s">next use is farthest in future</text>
    <text x="28" y="125" class="s">Knowledge:</text><text x="112" y="125" class="s">future references</text>
    <text x="28" y="165" class="s">Purpose:</text><text x="98" y="165" class="s">unattainable lower bound</text>
    <rect x="28" y="205" width="304" height="92" rx="6" fill="#fff" class="box"/><text x="180" y="240" text-anchor="middle" class="mono">faults = 7</text><text x="180" y="270" text-anchor="middle" class="s">best possible for this trace</text>
    <text x="28" y="345" class="s">A simulator can look ahead; an online</text><text x="28" y="372" class="s">kernel cannot know the program's future.</text>
    <text x="28" y="425" class="t">Use it as a benchmark</text>
  </g>
  <g transform="translate(475,205)">
    <rect width="360" height="485" rx="8" fill="#fff7ed" class="box"/><text x="180" y="42" text-anchor="middle" class="t">FIFO</text>
    <text x="28" y="85" class="s">Victim:</text><text x="98" y="85" class="s">resident for the longest time</text>
    <text x="28" y="125" class="s">State:</text><text x="86" y="125" class="s">one queue / arrival order</text>
    <text x="28" y="165" class="s">Blind spot:</text><text x="112" y="165" class="s">ignores recent reuse</text>
    <rect x="28" y="205" width="304" height="92" rx="6" fill="#fff" class="box"/><text x="180" y="240" text-anchor="middle" class="mono">faults = 10</text><text x="180" y="270" text-anchor="middle" class="s">may show Belady's anomaly</text>
    <text x="28" y="345" class="s">Adding frames can perversely increase</text><text x="28" y="372" class="s">faults for some reference strings.</text>
    <text x="28" y="425" class="t">Simple, but locality-blind</text>
  </g>
  <g transform="translate(870,205)">
    <rect width="360" height="485" rx="8" fill="#ecfdf5" class="box"/><text x="180" y="42" text-anchor="middle" class="t">Exact LRU</text>
    <text x="28" y="85" class="s">Victim:</text><text x="98" y="85" class="s">least recently referenced</text>
    <text x="28" y="125" class="s">State:</text><text x="86" y="125" class="s">total recency order</text>
    <text x="28" y="165" class="s">Cost:</text><text x="74" y="165" class="s">update on every reference</text>
    <rect x="28" y="205" width="304" height="92" rx="6" fill="#fff" class="box"/><text x="180" y="240" text-anchor="middle" class="mono">faults = 9</text><text x="180" y="270" text-anchor="middle" class="s">uses past locality as predictor</text>
    <text x="28" y="345" class="s">The policy is online, but exact global</text><text x="28" y="372" class="s">ordering is too costly at page scale.</text>
    <text x="28" y="425" class="t">Approximate in real systems</text>
  </g>
  <g transform="translate(1265,205)">
    <rect width="360" height="485" rx="8" fill="#fdf2f8" class="box"/><text x="180" y="42" text-anchor="middle" class="t">Random</text>
    <text x="28" y="85" class="s">Victim:</text><text x="98" y="85" class="s">uniform eligible candidate</text>
    <text x="28" y="125" class="s">State:</text><text x="86" y="125" class="s">almost none</text>
    <text x="28" y="165" class="s">Behavior:</text><text x="105" y="165" class="s">seed- and workload-dependent</text>
    <rect x="28" y="205" width="304" height="92" rx="6" fill="#fff" class="box"/><text x="180" y="240" text-anchor="middle" class="mono">faults vary</text><text x="180" y="270" text-anchor="middle" class="s">use a fixed seed in experiments</text>
    <text x="28" y="345" class="s">It avoids adversarial ordering state but</text><text x="28" y="372" class="s">does not deliberately preserve hot pages.</text>
    <text x="28" y="425" class="t">Useful comparison baseline</text>
  </g>

  <rect x="170" y="765" width="1360" height="135" rx="8" fill="#f1f5f9" class="box"/>
  <text x="850" y="806" text-anchor="middle" class="t">A fault count is meaningful only with the same trace, frame budget, initial state, and random seed</text>
  <text x="850" y="842" text-anchor="middle" class="s">Real reclaim also asks whether a page is clean, dirty, anonymous, file-backed, shared, pinned, or costly to reconstruct.</text>
  <text x="850" y="873" text-anchor="middle" class="s">Replacement policy is therefore one component of a larger reclaim decision.</text>
</svg>
