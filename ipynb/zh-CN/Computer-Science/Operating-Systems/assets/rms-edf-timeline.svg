<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" role="img" aria-labelledby="title desc">
  <title id="title">Rate-monotonic and earliest-deadline-first scheduling</title>
  <desc id="desc">Tasks T1 with execution two and period five and T2 with execution four and period seven are scheduled on one CPU. Rate monotonic misses T2's first deadline, while earliest deadline first completes it before time seven.</desc>
  <defs><style>.h{font:700 27px system-ui,sans-serif;fill:#111827}.t{font:600 18px system-ui,sans-serif;fill:#111827}.s{font:15px system-ui,sans-serif;fill:#374151}.grid{stroke:#d1d5db;stroke-width:1}.axis{stroke:#111827;stroke-width:2}.one{fill:#93c5fd;stroke:#1d4ed8;stroke-width:1.5}.two{fill:#fcd34d;stroke:#b45309;stroke-width:1.5}.deadline{stroke:#dc2626;stroke-width:3}.miss{fill:#dc2626}</style></defs>
  <rect width="1500" height="820" fill="#fff"/>
  <text x="750" y="43" text-anchor="middle" class="h">Fixed period priority versus dynamic absolute deadline</text>
  <text x="750" y="76" text-anchor="middle" class="s">T1: C=2, D=P=5; T2: C=4, D=P=7; utilization = 2/5 + 4/7 = 0.971</text>
  <g transform="translate(275 0)">
    <g class="grid"><path d="M0 120V690 M70 120V690 M140 120V690 M210 120V690 M280 120V690 M350 120V690 M420 120V690 M490 120V690 M560 120V690 M630 120V690 M700 120V690 M770 120V690 M840 120V690 M910 120V690 M980 120V690"/></g>
    <g class="s" text-anchor="middle"><text x="0" y="725">0</text><text x="70" y="725">1</text><text x="140" y="725">2</text><text x="210" y="725">3</text><text x="280" y="725">4</text><text x="350" y="725">5</text><text x="420" y="725">6</text><text x="490" y="725">7</text><text x="560" y="725">8</text><text x="630" y="725">9</text><text x="700" y="725">10</text><text x="770" y="725">11</text><text x="840" y="725">12</text><text x="910" y="725">13</text><text x="980" y="725">14</text></g>
    <line x1="0" y1="720" x2="980" y2="720" class="axis"/>
    <g transform="translate(0 185)"><rect width="140" height="68" class="one"/><rect x="140" width="210" height="68" class="two"/><rect x="350" width="140" height="68" class="one"/><rect x="490" width="70" height="68" class="two"/><rect x="560" width="140" height="68" class="two"/><rect x="700" width="140" height="68" class="one"/><rect x="840" width="140" height="68" class="two"/><g class="t" text-anchor="middle"><text x="70" y="42">T1</text><text x="245" y="42">T2</text><text x="420" y="42">T1</text><text x="525" y="42">T2</text><text x="630" y="42">T2</text><text x="770" y="42">T1</text><text x="910" y="42">T2</text></g></g>
    <line x1="490" y1="145" x2="490" y2="280" class="deadline"/><circle cx="490" cy="145" r="8" class="miss"/><text x="500" y="135" class="s" fill="#b91c1c">T2 deadline: one unit remains</text>
    <g transform="translate(0 465)"><rect width="140" height="68" class="one"/><rect x="140" width="280" height="68" class="two"/><rect x="420" width="140" height="68" class="one"/><rect x="560" width="280" height="68" class="two"/><rect x="840" width="140" height="68" class="one"/><g class="t" text-anchor="middle"><text x="70" y="42">T1 d=5</text><text x="280" y="42">T2 d=7</text><text x="490" y="42">T1 d=10</text><text x="700" y="42">T2 d=14</text><text x="910" y="42">T1 d=15</text></g></g>
    <line x1="490" y1="430" x2="490" y2="560" class="deadline"/><text x="500" y="420" class="s" fill="#15803d">T2 completed at 6, before d=7</text>
  </g>
  <g class="t" text-anchor="end"><text x="240" y="220">Rate Monotonic</text><text x="240" y="500">EDF</text></g>
  <g class="s" text-anchor="end"><text x="240" y="247">T1 always higher priority</text><text x="240" y="527">earliest absolute deadline wins</text></g>
  <rect x="145" y="755" width="1210" height="45" rx="8" fill="#f8fafc" stroke="#374151" stroke-width="2"/>
  <text x="750" y="784" text-anchor="middle" class="s">This textbook comparison assumes one preemptive CPU, independent periodic tasks, negligible overhead, and deadlines equal to periods.</text>
</svg>
