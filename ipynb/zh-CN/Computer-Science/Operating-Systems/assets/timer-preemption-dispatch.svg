<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="720" viewBox="0 0 1450 720" role="img" aria-labelledby="title desc">
  <title id="title">Timer interrupt, preemption, and dispatch sequence</title>
  <desc id="desc">A running user thread is interrupted by a timer. Hardware enters the kernel, the kernel saves context and accounts runtime, the scheduler decides whether to preempt, and the dispatcher restores a selected thread before returning to user mode.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#374151"/></marker>
    <style>.h{font:700 27px system-ui,sans-serif;fill:#111827}.t{font:600 18px system-ui,sans-serif;fill:#111827}.s{font:15px system-ui,sans-serif;fill:#374151}.box{stroke:#374151;stroke-width:2}.line{fill:none;stroke:#374151;stroke-width:3;marker-end:url(#arrow)}.pulse{fill:#ef4444;animation:pulse 1.8s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.pulse{animation:none;opacity:1}}</style>
  </defs>
  <rect width="1450" height="720" fill="#fff"/>
  <text x="725" y="43" text-anchor="middle" class="h">A timer creates an opportunity to schedule; it does not require a switch</text>
  <g transform="translate(45 110)">
    <rect x="0" y="0" width="180" height="85" rx="8" fill="#dbeafe" class="box"/><text x="90" y="36" text-anchor="middle" class="t">Thread A runs</text><text x="90" y="63" text-anchor="middle" class="s">user mode</text>
    <rect x="245" y="0" width="180" height="85" rx="8" fill="#fee2e2" class="box"/><circle cx="275" cy="25" r="10" class="pulse"/><text x="335" y="36" text-anchor="middle" class="t">Timer interrupt</text><text x="335" y="63" text-anchor="middle" class="s">hardware event</text>
    <rect x="490" y="0" width="180" height="85" rx="8" fill="#f3e8ff" class="box"/><text x="580" y="31" text-anchor="middle" class="t">Kernel entry</text><text x="580" y="58" text-anchor="middle" class="s">privilege changes;</text><text x="580" y="77" text-anchor="middle" class="s">minimal state saved</text>
    <rect x="735" y="0" width="180" height="85" rx="8" fill="#fef3c7" class="box"/><text x="825" y="31" text-anchor="middle" class="t">Account time</text><text x="825" y="58" text-anchor="middle" class="s">update runtime,</text><text x="825" y="77" text-anchor="middle" class="s">timers, eligibility</text>
    <rect x="980" y="0" width="180" height="85" rx="8" fill="#dcfce7" class="box"/><text x="1070" y="31" text-anchor="middle" class="t">Schedule?</text><text x="1070" y="58" text-anchor="middle" class="s">continue A or</text><text x="1070" y="77" text-anchor="middle" class="s">select another</text>
    <path d="M180 42 H245" class="line"/><path d="M425 42 H490" class="line"/><path d="M670 42 H735" class="line"/><path d="M915 42 H980" class="line"/>
    <rect x="735" y="225" width="180" height="95" rx="8" fill="#ffedd5" class="box"/><text x="825" y="260" text-anchor="middle" class="t">Switch context</text><text x="825" y="287" text-anchor="middle" class="s">save A; restore B;</text><text x="825" y="307" text-anchor="middle" class="s">switch address context if needed</text>
    <rect x="490" y="225" width="180" height="95" rx="8" fill="#e0f2fe" class="box"/><text x="580" y="260" text-anchor="middle" class="t">Return to user</text><text x="580" y="287" text-anchor="middle" class="s">resume selected</text><text x="580" y="307" text-anchor="middle" class="s">instruction stream</text>
    <rect x="245" y="225" width="180" height="95" rx="8" fill="#bfdbfe" class="box"/><text x="335" y="260" text-anchor="middle" class="t">Thread B runs</text><text x="335" y="287" text-anchor="middle" class="s">or A continues</text>
    <path d="M1070 85 C1070 175 890 165 825 225" class="line"/><path d="M735 272 H670" class="line"/><path d="M490 272 H425" class="line"/>
    <path d="M1070 85 C1240 185 1170 410 955 410 H335 C220 410 190 335 245 285" class="line"/>
    <text x="1165" y="205" class="s">No preemption:</text><text x="1165" y="228" class="s">return to A</text>
  </g>
  <rect x="135" y="590" width="1180" height="80" rx="8" fill="#f8fafc" class="box"/>
  <text x="725" y="622" text-anchor="middle" class="t">Dispatch latency = decision + context-switch path + delayed work before the chosen thread executes</text>
  <text x="725" y="651" text-anchor="middle" class="s">Interrupt latency, scheduler latency, and context-switch cost are related measurements, but they are not synonyms.</text>
</svg>
