<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 720" role="img" aria-labelledby="title desc">
  <title id="title">How an executable program becomes a running process</title>
  <desc id="desc">An executable file is interpreted by the loader to create a virtual address space, while the kernel creates identity, resource, and execution state.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#355070"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17212b; }
      .title { font-size: 31px; font-weight: 700; }
      .head { font-size: 22px; font-weight: 700; }
      .body { font-size: 18px; }
      .small { font-size: 16px; }
      .box { stroke: #355070; stroke-width: 2.4; rx: 8; }
      .arrow { stroke: #355070; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1500" height="720" fill="#fff"/>
  <text x="750" y="45" text-anchor="middle" class="title">A Program Is Input; a Process Is a Managed Execution</text>

  <rect x="55" y="110" width="315" height="430" class="box" fill="#fff3d9"/>
  <text x="213" y="149" text-anchor="middle" class="head">Executable file</text>
  <text x="213" y="178" text-anchor="middle" class="small">passive bytes on storage</text>
  <rect x="95" y="215" width="235" height="57" class="box" fill="#fff"/><text x="213" y="250" text-anchor="middle" class="body">ELF header</text>
  <rect x="95" y="282" width="235" height="57" class="box" fill="#e9f2fb"/><text x="213" y="317" text-anchor="middle" class="body">loadable code</text>
  <rect x="95" y="349" width="235" height="57" class="box" fill="#edf5e8"/><text x="213" y="384" text-anchor="middle" class="body">initialized data</text>
  <rect x="95" y="416" width="235" height="57" class="box" fill="#f1eef8"/><text x="213" y="451" text-anchor="middle" class="body">metadata / symbols</text>
  <text x="213" y="507" text-anchor="middle" class="small">not scheduled; no PID; no live registers</text>

  <rect x="432" y="242" width="225" height="164" class="box" fill="#fdebea"/>
  <text x="545" y="278" text-anchor="middle" class="head">Loader path</text>
  <text x="545" y="311" text-anchor="middle" class="body">validate format</text>
  <text x="545" y="339" text-anchor="middle" class="body">map segments</text>
  <text x="545" y="367" text-anchor="middle" class="body">build initial stack</text>
  <text x="545" y="393" text-anchor="middle" class="small">choose entry point</text>
  <path d="M370 324 L432 324" class="arrow"/>

  <rect x="720" y="88" width="355" height="502" class="box" fill="#e9f2fb"/>
  <text x="898" y="128" text-anchor="middle" class="head">User virtual address space</text>
  <rect x="770" y="166" width="255" height="60" class="box" fill="#fdebea"/><text x="898" y="202" text-anchor="middle" class="body">user stack: argv, env, frames</text>
  <rect x="770" y="238" width="255" height="60" class="box" fill="#f1eef8"/><text x="898" y="274" text-anchor="middle" class="body">mapped libraries / files</text>
  <rect x="770" y="310" width="255" height="60" class="box" fill="#edf5e8"/><text x="898" y="346" text-anchor="middle" class="body">heap and anonymous mappings</text>
  <rect x="770" y="382" width="255" height="60" class="box" fill="#fff3d9"/><text x="898" y="418" text-anchor="middle" class="body">data and zero-filled BSS</text>
  <rect x="770" y="454" width="255" height="60" class="box" fill="#e6f5ef"/><text x="898" y="490" text-anchor="middle" class="body">read-only code and constants</text>
  <text x="898" y="553" text-anchor="middle" class="small">protected mappings, often demand-paged</text>
  <path d="M657 324 L720 324" class="arrow"/>

  <rect x="1138" y="110" width="307" height="430" class="box" fill="#e6f5ef"/>
  <text x="1292" y="149" text-anchor="middle" class="head">Kernel-maintained state</text>
  <text x="1292" y="188" text-anchor="middle" class="body">PID and parent relation</text>
  <text x="1292" y="225" text-anchor="middle" class="body">credentials and limits</text>
  <text x="1292" y="262" text-anchor="middle" class="body">scheduling state</text>
  <text x="1292" y="299" text-anchor="middle" class="body">saved registers / kernel stack</text>
  <text x="1292" y="336" text-anchor="middle" class="body">address-space reference</text>
  <text x="1292" y="373" text-anchor="middle" class="body">file-descriptor table</text>
  <text x="1292" y="410" text-anchor="middle" class="body">signals and accounting</text>
  <rect x="1185" y="450" width="214" height="58" class="box" fill="#fff"/>
  <text x="1292" y="486" text-anchor="middle" class="head">runnable context</text>
  <path d="M1075 324 L1138 324" class="arrow"/>

  <rect x="215" y="625" width="1070" height="62" rx="8" fill="#f8fafb" stroke="#7c8794" stroke-width="2"/>
  <text x="750" y="650" text-anchor="middle" class="body">The same executable can create many processes; each receives distinct identity and live state.</text>
  <text x="750" y="675" text-anchor="middle" class="small">Some resources may still be shared through mappings, open-file descriptions, or explicit IPC.</text>
</svg>
