<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Privilege separation confines ambient authority</title>
  <desc id="desc">An untrusted parser and worker communicate through a narrow protocol with a small privileged broker that alone opens protected resources.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#46596d"/></marker></defs>
  <style>text{font-family:Arial,sans-serif;fill:#172235}.title{font-size:28px;font-weight:700}.head{font-size:19px;font-weight:700}.body{font-size:15px}.small{font-size:13px;fill:#526274}.box{stroke:#65788b;stroke-width:2}.arrow{stroke:#46596d;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.boundary{stroke:#9b55cf;stroke-width:2.5;stroke-dasharray:10 8;fill:none}</style>
  <rect width="1200" height="680" fill="#f7f9fb"/><text x="600" y="42" text-anchor="middle" class="title">Keep complex parsing outside the smallest privileged component</text>
  <rect x="55" y="90" width="700" height="455" rx="8" fill="#e6f0ff" class="box"/><text x="405" y="124" text-anchor="middle" class="head">Unprivileged domain</text>
  <rect x="90" y="165" width="245" height="180" rx="8" fill="#fff" class="box"/><text x="212" y="199" text-anchor="middle" class="head">Parser / front end</text><text x="212" y="235" text-anchor="middle" class="body">accepts attacker-controlled input</text><text x="212" y="265" text-anchor="middle" class="body">normalizes requested operation</text><text x="212" y="295" text-anchor="middle" class="body">has no protected path access</text><text x="212" y="325" text-anchor="middle" class="small">large and bug-prone by assumption</text>
  <rect x="440" y="165" width="245" height="180" rx="8" fill="#e5f7ed" class="box"/><text x="562" y="199" text-anchor="middle" class="head">Worker</text><text x="562" y="235" text-anchor="middle" class="body">receives validated data + fd</text><text x="562" y="265" text-anchor="middle" class="body">performs narrow computation</text><text x="562" y="295" text-anchor="middle" class="body">drops unused descriptors</text><text x="562" y="325" text-anchor="middle" class="small">seccomp / Landlock can narrow further</text>
  <rect x="178" y="405" width="455" height="86" rx="8" fill="#eee9ff" class="box"/><text x="405" y="437" text-anchor="middle" class="body">Narrow IPC protocol</text><text x="405" y="464" text-anchor="middle" class="small">typed operation + bounded fields; pass handles, not attacker-controlled absolute paths</text>
  <path d="M212 345V405M562 405V345" class="arrow"/>
  <path d="M785 80V560" class="boundary"/><text x="785" y="585" text-anchor="middle" class="small">privilege boundary</text>
  <rect x="835" y="120" width="310" height="300" rx="8" fill="#fff2d5" class="box"/><text x="990" y="155" text-anchor="middle" class="head">Small privileged broker</text><text x="872" y="198" class="body">1. authenticate peer credentials</text><text x="872" y="230" class="body">2. validate operation and limits</text><text x="872" y="262" class="body">3. resolve path under fixed dirfd</text><text x="872" y="294" class="body">4. open object with minimal rights</text><text x="872" y="326" class="body">5. pass fd; retain no extra state</text><rect x="872" y="350" width="236" height="44" rx="8" fill="#fff" class="box"/><text x="990" y="378" text-anchor="middle" class="small">small enough to review and fuzz</text>
  <path d="M633 448H790V270H835" class="arrow"/>
  <rect x="835" y="475" width="310" height="90" rx="8" fill="#ffe6e3" class="box"/><text x="990" y="508" text-anchor="middle" class="head">Protected resources</text><text x="990" y="539" text-anchor="middle" class="body">configuration, keys, devices, admin APIs</text>
  <path d="M990 420V475" class="arrow"/>
  <rect x="145" y="610" width="910" height="43" rx="8" fill="#dff4f5" class="box"/><text x="600" y="637" text-anchor="middle" class="body">Compromise of the parser should expose only the broker protocol, not the broker's full ambient authority.</text>
</svg>
