<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860" role="img" aria-labelledby="title desc">
  <title id="title">select, poll, epoll, and kqueue comparison</title>
  <desc id="desc">Four columns compare how readiness interests are represented, what is passed on each wait, and which results are returned.</desc>
  <defs><style>.h{font:700 30px system-ui,sans-serif;fill:#111827}.t{font:700 19px system-ui,sans-serif;fill:#111827}.s{font:15px system-ui,sans-serif;fill:#334155}.box{stroke:#334155;stroke-width:2}.rule{stroke:#cbd5e1;stroke-width:2}</style></defs>
  <rect width="1600" height="860" fill="#fff"/><text x="800" y="48" text-anchor="middle" class="h">The APIs differ mainly in interest storage and result delivery</text>
  <rect x="60" y="90" width="360" height="690" rx="8" fill="#eff6ff" class="box"/><text x="240" y="135" text-anchor="middle" class="t">select</text>
  <text x="90" y="188" class="t">Interest</text><text x="90" y="220" class="s">bit sets copied and rebuilt each call</text><line x1="90" y1="245" x2="390" y2="245" class="rule"/>
  <text x="90" y="292" class="t">Kernel work</text><text x="90" y="324" class="s">scan descriptors up to nfds</text><line x1="90" y1="349" x2="390" y2="349" class="rule"/>
  <text x="90" y="396" class="t">Result</text><text x="90" y="428" class="s">mutated sets; application scans them</text><line x1="90" y1="453" x2="390" y2="453" class="rule"/>
  <text x="90" y="500" class="t">Important constraint</text><text x="90" y="532" class="s">FD_SETSIZE is commonly 1024</text><text x="90" y="558" class="s">and rebuilding is error-prone</text>

  <rect x="440" y="90" width="360" height="690" rx="8" fill="#fff7ed" class="box"/><text x="620" y="135" text-anchor="middle" class="t">poll</text>
  <text x="470" y="188" class="t">Interest</text><text x="470" y="220" class="s">pollfd array supplied each call</text><line x1="470" y1="245" x2="770" y2="245" class="rule"/>
  <text x="470" y="292" class="t">Kernel work</text><text x="470" y="324" class="s">scan the array for current state</text><line x1="470" y1="349" x2="770" y2="349" class="rule"/>
  <text x="470" y="396" class="t">Result</text><text x="470" y="428" class="s">revents fields in the same array</text><line x1="470" y1="453" x2="770" y2="453" class="rule"/>
  <text x="470" y="500" class="t">Good fit</text><text x="470" y="532" class="s">portable, simple and moderate</text><text x="470" y="558" class="s">numbers of descriptors</text>

  <rect x="820" y="90" width="360" height="690" rx="8" fill="#f0fdf4" class="box"/><text x="1000" y="135" text-anchor="middle" class="t">epoll (Linux)</text>
  <text x="850" y="188" class="t">Interest</text><text x="850" y="220" class="s">persistent kernel interest set</text><line x1="850" y1="245" x2="1150" y2="245" class="rule"/>
  <text x="850" y="292" class="t">Kernel work</text><text x="850" y="324" class="s">maintain a ready list as state changes</text><line x1="850" y1="349" x2="1150" y2="349" class="rule"/>
  <text x="850" y="396" class="t">Result</text><text x="850" y="428" class="s">only ready event records returned</text><line x1="850" y1="453" x2="1150" y2="453" class="rule"/>
  <text x="850" y="500" class="t">Modes</text><text x="850" y="532" class="s">level, edge and one-shot</text><text x="850" y="558" class="s">edge mode must drain to EAGAIN</text>

  <rect x="1200" y="90" width="340" height="690" rx="8" fill="#f5f3ff" class="box"/><text x="1370" y="135" text-anchor="middle" class="t">kqueue (BSD family)</text>
  <text x="1230" y="188" class="t">Interest</text><text x="1230" y="220" class="s">persistent filters registered by kevent</text><line x1="1230" y1="245" x2="1510" y2="245" class="rule"/>
  <text x="1230" y="292" class="t">Kernel work</text><text x="1230" y="324" class="s">track filter-specific events</text><line x1="1230" y1="349" x2="1510" y2="349" class="rule"/>
  <text x="1230" y="396" class="t">Result</text><text x="1230" y="428" class="s">ready event records plus metadata</text><line x1="1230" y1="453" x2="1510" y2="453" class="rule"/>
  <text x="1230" y="500" class="t">Beyond descriptors</text><text x="1230" y="532" class="s">timers, signals, process and</text><text x="1230" y="558" class="s">filesystem filters</text>
  <rect x="180" y="650" width="1240" height="78" rx="8" fill="#fff" class="box"/><text x="800" y="682" text-anchor="middle" class="t">No API removes application-level work</text><text x="800" y="710" text-anchor="middle" class="s">You still need nonblocking operations, per-request state, bounded handlers, error paths and backpressure.</text>
</svg>
