<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="800" viewBox="0 0 1500 800" role="img" aria-labelledby="title desc">
  <title id="title">Page-size tradeoffs for a 64 MiB mapped region</title>
  <desc id="desc">Comparison of 4 KiB base pages and 2 MiB huge pages. Small pages require more entries and have lower TLB reach, while huge pages increase reach and reduce page-table work but have coarser allocation and migration.</desc>
  <defs><style>.h{font:700 28px system-ui,sans-serif;fill:#111827}.t{font:600 18px system-ui,sans-serif;fill:#111827}.s{font:15px system-ui,sans-serif;fill:#374151}.box{stroke:#374151;stroke-width:2}</style></defs>
  <rect width="1500" height="800" fill="#ffffff"/>
  <text x="750" y="44" text-anchor="middle" class="h">Page size trades fine-grained allocation for translation coverage</text>
  <text x="390" y="100" text-anchor="middle" class="t">4 KiB base pages</text><text x="1110" y="100" text-anchor="middle" class="t">2 MiB huge pages</text>
  <rect x="100" y="130" width="580" height="520" rx="8" fill="#f8fafc" class="box"/>
  <rect x="820" y="130" width="580" height="520" rx="8" fill="#f8fafc" class="box"/>

  <text x="140" y="175" class="s">64 MiB mapping is divided into:</text>
  <g fill="#dbeafe" stroke="#374151" stroke-width="1"><rect x="140" y="200" width="28" height="60"/><rect x="170" y="200" width="28" height="60"/><rect x="200" y="200" width="28" height="60"/><rect x="230" y="200" width="28" height="60"/><rect x="260" y="200" width="28" height="60"/><rect x="290" y="200" width="28" height="60"/><rect x="320" y="200" width="28" height="60"/><rect x="350" y="200" width="28" height="60"/><rect x="380" y="200" width="28" height="60"/><rect x="410" y="200" width="28" height="60"/><rect x="440" y="200" width="28" height="60"/><rect x="470" y="200" width="28" height="60"/><rect x="500" y="200" width="28" height="60"/><rect x="530" y="200" width="28" height="60"/><rect x="560" y="200" width="28" height="60"/><rect x="590" y="200" width="28" height="60"/></g>
  <text x="390" y="290" text-anchor="middle" class="t">16,384 page mappings</text>
  <rect x="140" y="330" width="500" height="70" rx="6" fill="#dcfce7" class="box"/><text x="390" y="360" text-anchor="middle" class="t">64-entry TLB reach = 256 KiB</text><text x="390" y="384" text-anchor="middle" class="s">more misses for large streaming working sets</text>
  <rect x="140" y="425" width="500" height="70" rx="6" fill="#e0f2fe" class="box"/><text x="390" y="455" text-anchor="middle" class="t">fine permissions and sparse allocation</text><text x="390" y="479" text-anchor="middle" class="s">small tail waste and cheap local remapping</text>
  <rect x="140" y="520" width="500" height="90" rx="6" fill="#fef3c7" class="box"/><text x="390" y="553" text-anchor="middle" class="t">more PTEs and page-walk pressure</text><text x="390" y="580" text-anchor="middle" class="s">metadata and TLB entries cover less memory</text>

  <text x="860" y="175" class="s">64 MiB mapping is divided into:</text>
  <g fill="#f3e8ff" stroke="#374151" stroke-width="2"><rect x="860" y="200" width="60" height="60"/><rect x="924" y="200" width="60" height="60"/><rect x="988" y="200" width="60" height="60"/><rect x="1052" y="200" width="60" height="60"/><rect x="1116" y="200" width="60" height="60"/><rect x="1180" y="200" width="60" height="60"/><rect x="1244" y="200" width="60" height="60"/><rect x="1308" y="200" width="52" height="60"/></g>
  <text x="1110" y="290" text-anchor="middle" class="t">32 huge-page mappings</text>
  <rect x="860" y="330" width="500" height="70" rx="6" fill="#dcfce7" class="box"/><text x="1110" y="360" text-anchor="middle" class="t">64-entry TLB reach = 128 MiB</text><text x="1110" y="384" text-anchor="middle" class="s">one TLB entry covers 512 base pages</text>
  <rect x="860" y="425" width="500" height="70" rx="6" fill="#e0f2fe" class="box"/><text x="1110" y="455" text-anchor="middle" class="t">fewer PTEs and shorter walks</text><text x="1110" y="479" text-anchor="middle" class="s">helpful for dense, stable, large mappings</text>
  <rect x="860" y="520" width="500" height="90" rx="6" fill="#fee2e2" class="box"/><text x="1110" y="553" text-anchor="middle" class="t">coarse allocation and protection</text><text x="1110" y="580" text-anchor="middle" class="s">larger tail waste; harder compaction and migration</text>

  <rect x="220" y="695" width="1060" height="58" rx="8" fill="#f1f5f9" class="box"/><text x="750" y="730" text-anchor="middle" class="s">Huge pages are not universally faster: benefit depends on locality, mapping density, allocation success, and workload lifetime.</text>
</svg>
