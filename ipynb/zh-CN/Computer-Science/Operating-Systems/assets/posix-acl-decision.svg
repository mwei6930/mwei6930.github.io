<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">POSIX ACL access decision and mask</title>
  <desc id="desc">A decision tree checks owner, named user, matching groups, and other; the ACL mask limits named user and group class permissions.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#46596d"/></marker></defs>
  <style>text{font-family:Arial,sans-serif;fill:#172235}.title{font-size:28px;font-weight:700}.head{font-size:18px;font-weight:700}.body{font-size:15px}.small{font-size:13px;fill:#526274}.box{stroke:#65788b;stroke-width:2}.arrow{stroke:#46596d;stroke-width:2.4;fill:none;marker-end:url(#arrow)}</style>
  <rect width="1200" height="720" fill="#f7f9fb"/><text x="600" y="42" text-anchor="middle" class="title">The ACL mask is a ceiling on the named-user and group classes</text>
  <rect x="55" y="82" width="360" height="300" rx="8" fill="#eee9ff" class="box"/><text x="235" y="115" text-anchor="middle" class="head">Example access ACL</text>
  <text x="90" y="154" class="body">user::rw-</text><text x="90" y="184" class="body">user:bob:rw-</text><text x="282" y="184" class="small">effective: r--</text><text x="90" y="214" class="body">group::r--</text><text x="90" y="244" class="body">group:editors:rw-</text><text x="282" y="244" class="small">effective: r--</text><text x="90" y="274" class="body">mask::r--</text><text x="90" y="304" class="body">other::---</text><rect x="82" y="328" width="305" height="37" rx="8" fill="#fff2d5" class="box"/><text x="235" y="352" text-anchor="middle" class="small">requested rights must be a subset of effective rights</text>
  <rect x="505" y="82" width="250" height="72" rx="8" fill="#e6f0ff" class="box"/><text x="630" y="112" text-anchor="middle" class="body">Does EUID equal owner UID?</text><text x="630" y="136" text-anchor="middle" class="small">yes: use user:: only</text>
  <rect x="505" y="190" width="250" height="72" rx="8" fill="#e6f0ff" class="box"/><text x="630" y="220" text-anchor="middle" class="body">Named user entry matches?</text><text x="630" y="244" text-anchor="middle" class="small">rights = entry AND mask</text>
  <rect x="505" y="298" width="250" height="88" rx="8" fill="#e6f0ff" class="box"/><text x="630" y="328" text-anchor="middle" class="body">Any file-group or named-group</text><text x="630" y="350" text-anchor="middle" class="body">entry matches EGID/groups?</text><text x="630" y="374" text-anchor="middle" class="small">union matches, then AND mask</text>
  <rect x="505" y="422" width="250" height="72" rx="8" fill="#e6f0ff" class="box"/><text x="630" y="452" text-anchor="middle" class="body">Otherwise use other::</text><text x="630" y="476" text-anchor="middle" class="small">mask does not apply</text>
  <path d="M630 154V190M630 262V298M630 386V422" class="arrow"/>
  <rect x="850" y="83" width="290" height="125" rx="8" fill="#e5f7ed" class="box"/><text x="995" y="115" text-anchor="middle" class="head">ALLOW</text><text x="995" y="149" text-anchor="middle" class="body">chosen effective rights contain</text><text x="995" y="174" text-anchor="middle" class="body">every requested permission</text>
  <rect x="850" y="259" width="290" height="125" rx="8" fill="#ffe6e3" class="box"/><text x="995" y="291" text-anchor="middle" class="head">DENY</text><text x="995" y="325" text-anchor="middle" class="body">a matching higher-priority class</text><text x="995" y="350" text-anchor="middle" class="body">does not fall through to other</text>
  <path d="M755 118H850M755 226H810V145H850M755 342H825V321H850M755 458H810V321H850" class="arrow"/>
  <rect x="80" y="540" width="1040" height="122" rx="8" fill="#fff" class="box"/><text x="600" y="573" text-anchor="middle" class="head">Creation and maintenance consequences</text><text x="110" y="606" class="body">• A directory default ACL seeds the access ACL of newly created children; it does not govern access to the directory itself.</text><text x="110" y="634" class="body">• chmod changes the ACL entries corresponding to mode bits; tightening the mask can silently reduce named-user/group effective rights.</text><text x="110" y="657" class="small">Always inspect effective rights with getfacl rather than reading a named entry in isolation.</text>
</svg>
