<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">MMU address translation through TLB hit or page-table walk</title>
  <desc id="desc">A CPU sends a virtual address and access type to the MMU. A tagged TLB hit proceeds through permission checking to a physical address. A miss invokes the page-table walker, which may refill the TLB or raise a page fault. Animated highlights show the fast and slow paths.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#374151"/></marker><style>.h{font:700 28px system-ui,sans-serif;fill:#111827}.t{font:600 18px system-ui,sans-serif;fill:#111827}.s{font:15px system-ui,sans-serif;fill:#374151}.box{stroke:#374151;stroke-width:2}.line{fill:none;stroke:#374151;stroke-width:3;marker-end:url(#arrow)}.fast{fill:none;stroke:#15803d;stroke-width:5;marker-end:url(#arrow)}.slow{fill:none;stroke:#7c3aed;stroke-width:5;marker-end:url(#arrow)}</style></defs>
  <rect width="1600" height="900" fill="#ffffff"/>
  <text x="800" y="44" text-anchor="middle" class="h">A TLB miss is a cache miss; a page fault is a failed translation or permission check</text>
  <rect x="55" y="315" width="230" height="125" rx="8" fill="#dbeafe" class="box"/><text x="170" y="352" text-anchor="middle" class="t">CPU memory operation</text><text x="170" y="382" text-anchor="middle" class="s">virtual address</text><text x="170" y="408" text-anchor="middle" class="s">read / write / execute, mode</text>
  <path d="M285 377 H390" class="line"/>
  <rect x="390" y="285" width="270" height="185" rx="8" fill="#e0f2fe" class="box"><animate attributeName="stroke-width" values="2;6;2" dur="6s" repeatCount="indefinite"/></rect>
  <text x="525" y="325" text-anchor="middle" class="t">tagged TLB lookup</text><text x="525" y="355" text-anchor="middle" class="s">key: ASID/PCID + VPN + page size</text><text x="525" y="388" text-anchor="middle" class="s">result: PFN + permissions</text><text x="525" y="438" text-anchor="middle" class="s">small, associative translation cache</text>

  <path d="M660 340 H790" class="fast"><animate attributeName="stroke-opacity" values="0.35;1;0.35" dur="6s" begin="1s" repeatCount="indefinite"/></path><text x="710" y="320" class="t" fill="#15803d">hit</text>
  <rect x="790" y="280" width="260" height="130" rx="8" fill="#dcfce7" class="box"/><text x="920" y="321" text-anchor="middle" class="t">permission check</text><text x="920" y="352" text-anchor="middle" class="s">PTE/TLB rights vs operation</text><text x="920" y="380" text-anchor="middle" class="s">and current privilege mode</text>
  <path d="M1050 345 H1180" class="fast"/>
  <rect x="1180" y="280" width="340" height="130" rx="8" fill="#ffedd5" class="box"/><text x="1350" y="321" text-anchor="middle" class="t">physical address</text><text x="1350" y="352" text-anchor="middle" class="s">PFN concatenated with offset</text><text x="1350" y="380" text-anchor="middle" class="s">then cache / memory access continues</text>

  <path d="M525 470 V570 H690" class="slow"><animate attributeName="stroke-opacity" values="0.35;1;0.35" dur="6s" begin="3s" repeatCount="indefinite"/></path><text x="548" y="535" class="t" fill="#7c3aed">miss</text>
  <rect x="690" y="520" width="300" height="150" rx="8" fill="#f3e8ff" class="box"/><text x="840" y="560" text-anchor="middle" class="t">hardware page-table walk</text><text x="840" y="592" text-anchor="middle" class="s">root register + VPN indexes</text><text x="840" y="620" text-anchor="middle" class="s">dependent reads of paging structures</text><text x="840" y="647" text-anchor="middle" class="s">page-walk caches may help</text>
  <path d="M990 575 C1080 535 1090 455 1030 410" class="slow"/><text x="1065" y="505" class="s">valid leaf: refill TLB</text>
  <path d="M840 670 V755" class="line"/>
  <rect x="665" y="755" width="350" height="100" rx="8" fill="#fee2e2" class="box"/><text x="840" y="792" text-anchor="middle" class="t">page-fault exception</text><text x="840" y="821" text-anchor="middle" class="s">invalid entry, malformed address,</text><text x="840" y="846" text-anchor="middle" class="s">or denied access</text>
  <path d="M920 410 C920 455 1060 510 1060 590 V755 H1015" class="line"/><text x="1055" y="715" class="s">permission denied</text>
  <rect x="180" y="705" width="380" height="110" rx="8" fill="#f8fafc" class="box"/><text x="370" y="742" text-anchor="middle" class="t">Fast path</text><text x="370" y="773" text-anchor="middle" class="s">TLB hit avoids reading page tables.</text><text x="370" y="798" text-anchor="middle" class="s">The ordinary data-cache access still remains.</text>
</svg>
