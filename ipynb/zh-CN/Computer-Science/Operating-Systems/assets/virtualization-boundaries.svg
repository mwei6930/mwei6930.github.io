<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Native, container, and virtual-machine isolation boundaries</title>
  <desc id="desc">Three stacks compare native processes, containers sharing a host kernel, and virtual machines with guest kernels above a hypervisor.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#34495e"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#17202a;letter-spacing:0}.h{font-size:28px;font-weight:700}.s{font-size:20px;font-weight:700}.b{font-size:17px}.n{font-size:15px;fill:#425466}.box{stroke:#34495e;stroke-width:2;rx:6}.boundary{fill:none;stroke:#c0392b;stroke-width:4;stroke-dasharray:11 8;rx:8}.arrow{stroke:#34495e;stroke-width:2.5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="650" fill="#f8fafc"/>
  <text x="600" y="42" text-anchor="middle" class="h">Where does the isolation boundary sit?</text>

  <text x="205" y="90" text-anchor="middle" class="s">Native processes</text>
  <rect x="55" y="120" width="140" height="72" class="box" fill="#d6eaf8"/><text x="125" y="151" text-anchor="middle" class="b">cat</text><text x="125" y="176" text-anchor="middle" class="n">process</text>
  <rect x="215" y="120" width="140" height="72" class="box" fill="#d6eaf8"/><text x="285" y="151" text-anchor="middle" class="b">grep</text><text x="285" y="176" text-anchor="middle" class="n">process</text>
  <rect x="55" y="220" width="300" height="105" class="box" fill="#d5f5e3"/><text x="205" y="263" text-anchor="middle" class="s">Host kernel</text><text x="205" y="293" text-anchor="middle" class="n">syscalls, scheduling, VFS, drivers</text>
  <rect x="55" y="355" width="300" height="82" class="box" fill="#fdebd0"/><text x="205" y="405" text-anchor="middle" class="s">Hardware</text>
  <rect x="42" y="108" width="326" height="229" class="boundary"/>
  <text x="205" y="468" text-anchor="middle" class="b" fill="#c0392b">Process boundary</text>
  <text x="205" y="494" text-anchor="middle" class="n">One kernel remains in every process TCB</text>

  <text x="600" y="90" text-anchor="middle" class="s">Containers</text>
  <rect x="445" y="112" width="142" height="92" class="box" fill="#d6eaf8"/><text x="516" y="147" text-anchor="middle" class="b">Container A</text><text x="516" y="176" text-anchor="middle" class="n">cat + rootfs</text>
  <rect x="613" y="112" width="142" height="92" class="box" fill="#d6eaf8"/><text x="684" y="147" text-anchor="middle" class="b">Container B</text><text x="684" y="176" text-anchor="middle" class="n">grep + rootfs</text>
  <rect x="445" y="230" width="310" height="105" class="box" fill="#d5f5e3"/><text x="600" y="270" text-anchor="middle" class="s">Shared host kernel</text><text x="600" y="299" text-anchor="middle" class="n">namespaces + cgroups + LSM</text>
  <rect x="445" y="365" width="310" height="82" class="box" fill="#fdebd0"/><text x="600" y="415" text-anchor="middle" class="s">Hardware</text>
  <rect x="432" y="99" width="168" height="118" class="boundary"/><rect x="600" y="99" width="168" height="118" class="boundary"/>
  <text x="600" y="480" text-anchor="middle" class="b" fill="#c0392b">Namespaced process boundary</text>
  <text x="600" y="506" text-anchor="middle" class="n">Kernel exploit can cross container boundaries</text>

  <text x="995" y="90" text-anchor="middle" class="s">Virtual machines</text>
  <rect x="842" y="112" width="145" height="76" class="box" fill="#d6eaf8"/><text x="915" y="145" text-anchor="middle" class="b">VM A app</text><text x="915" y="170" text-anchor="middle" class="n">cat</text>
  <rect x="1003" y="112" width="145" height="76" class="box" fill="#d6eaf8"/><text x="1075" y="145" text-anchor="middle" class="b">VM B app</text><text x="1075" y="170" text-anchor="middle" class="n">grep</text>
  <rect x="842" y="199" width="145" height="69" class="box" fill="#d5f5e3"/><text x="915" y="241" text-anchor="middle" class="b">Guest kernel</text>
  <rect x="1003" y="199" width="145" height="69" class="box" fill="#d5f5e3"/><text x="1075" y="241" text-anchor="middle" class="b">Guest kernel</text>
  <rect x="842" y="296" width="306" height="78" class="box" fill="#eadcf8"/><text x="995" y="329" text-anchor="middle" class="s">Hypervisor / VMM</text><text x="995" y="354" text-anchor="middle" class="n">vCPU, guest RAM, virtual devices</text>
  <rect x="842" y="400" width="306" height="72" class="box" fill="#fdebd0"/><text x="995" y="444" text-anchor="middle" class="s">Hardware</text>
  <rect x="829" y="99" width="171" height="181" class="boundary"/><rect x="990" y="99" width="171" height="181" class="boundary"/>
  <text x="995" y="505" text-anchor="middle" class="b" fill="#c0392b">Virtual-hardware boundary</text>
  <text x="995" y="531" text-anchor="middle" class="n">Guest kernel is outside sibling VM TCB</text>

  <line x1="205" y1="555" x2="995" y2="555" class="arrow"/>
  <text x="600" y="586" text-anchor="middle" class="b">More state and startup cost; potentially smaller cross-tenant trust</text>
  <text x="600" y="620" text-anchor="middle" class="n">Boundary strength still depends on configuration, device model, host software, firmware, and hardware</text>
</svg>
