<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" role="img" aria-labelledby="title desc">
  <title id="title">Reusable barrier and readers writer lock behavior</title>
  <desc id="desc">The left panel shows four threads completing phase one and waiting at a generation barrier before any enter phase two. The right panel shows concurrent readers, an exclusive writer, and a policy queue.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#374151"/></marker><style>.h{font:700 28px system-ui,sans-serif;fill:#111827}.t{font:600 18px system-ui,sans-serif;fill:#111827}.s{font:15px system-ui,sans-serif;fill:#374151}.box{stroke:#374151;stroke-width:2}.line{fill:none;stroke:#374151;stroke-width:3;marker-end:url(#arrow)}.bar{stroke:#7c3aed;stroke-width:5;stroke-dasharray:11 8}</style></defs>
  <rect width="1500" height="820" fill="#fff"/>
  <text x="750" y="45" text-anchor="middle" class="h">Barriers coordinate phases; read-write locks coordinate access modes</text>
  <line x1="750" y1="85" x2="750" y2="760" stroke="#d1d5db" stroke-width="2"/>
  <text x="375" y="100" text-anchor="middle" class="t">Reusable generation barrier</text>
  <g transform="translate(75 145)">
    <g class="s"><text x="0" y="50">T1</text><text x="0" y="140">T2</text><text x="0" y="230">T3</text><text x="0" y="320">T4</text></g>
    <g class="box"><rect x="55" y="15" width="230" height="55" rx="5" fill="#dbeafe"/><rect x="55" y="105" width="335" height="55" rx="5" fill="#dbeafe"/><rect x="55" y="195" width="170" height="55" rx="5" fill="#dbeafe"/><rect x="55" y="285" width="410" height="55" rx="5" fill="#dbeafe"/></g>
    <g class="s" text-anchor="middle"><text x="170" y="49">phase 1 work</text><text x="222" y="139">phase 1 work</text><text x="140" y="229">phase 1</text><text x="260" y="319">phase 1 work</text></g>
    <line x1="500" y1="0" x2="500" y2="385" class="bar"/><text x="500" y="415" text-anchor="middle" class="t" fill="#6d28d9">generation 7 opens when arrival count reaches 4</text>
    <g class="box"><rect x="530" y="15" width="160" height="55" rx="5" fill="#dcfce7"/><rect x="530" y="105" width="160" height="55" rx="5" fill="#dcfce7"/><rect x="530" y="195" width="160" height="55" rx="5" fill="#dcfce7"/><rect x="530" y="285" width="160" height="55" rx="5" fill="#dcfce7"/></g>
    <g class="s" text-anchor="middle"><text x="610" y="49">phase 2</text><text x="610" y="139">phase 2</text><text x="610" y="229">phase 2</text><text x="610" y="319">phase 2</text></g>
    <text x="350" y="470" text-anchor="middle" class="s">A generation counter prevents a fast thread from confusing two consecutive uses.</text>
  </g>
  <text x="1125" y="100" text-anchor="middle" class="t">Readers-writer coordination</text>
  <g transform="translate(825 155)">
    <rect x="0" y="0" width="600" height="105" rx="8" fill="#dcfce7" class="box"/>
    <text x="300" y="34" text-anchor="middle" class="t">Shared-read mode</text>
    <rect x="45" y="53" width="140" height="35" rx="5" fill="#86efac" stroke="#15803d"/><text x="115" y="77" text-anchor="middle" class="s">reader A</text>
    <rect x="230" y="53" width="140" height="35" rx="5" fill="#86efac" stroke="#15803d"/><text x="300" y="77" text-anchor="middle" class="s">reader B</text>
    <rect x="415" y="53" width="140" height="35" rx="5" fill="#86efac" stroke="#15803d"/><text x="485" y="77" text-anchor="middle" class="s">reader C</text>
    <path d="M300 105 V195" class="line"/>
    <rect x="0" y="195" width="600" height="100" rx="8" fill="#fee2e2" class="box"/>
    <text x="300" y="232" text-anchor="middle" class="t">Exclusive-write mode</text>
    <rect x="200" y="250" width="200" height="30" rx="5" fill="#fca5a5" stroke="#dc2626"/><text x="300" y="272" text-anchor="middle" class="s">one writer, no readers</text>
    <rect x="35" y="365" width="530" height="150" rx="8" fill="#fef3c7" class="box"/>
    <text x="300" y="402" text-anchor="middle" class="t">Admission policy matters</text>
    <text x="300" y="435" text-anchor="middle" class="s">reader preference -> writer starvation risk</text>
    <text x="300" y="465" text-anchor="middle" class="s">writer preference -> reader latency spikes</text>
    <text x="300" y="495" text-anchor="middle" class="s">phase-fair -> bounded handoff with more bookkeeping</text>
  </g>
  <rect x="195" y="740" width="1110" height="48" rx="8" fill="#f8fafc" class="box"/>
  <text x="750" y="770" text-anchor="middle" class="s">Neither primitive is automatically faster than a mutex: workload mix, critical-section length, cache traffic, and fairness policy decide.</text>
</svg>
