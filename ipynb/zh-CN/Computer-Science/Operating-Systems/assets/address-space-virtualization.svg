<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" role="img" aria-labelledby="title desc">
  <title id="title">Virtual address-space properties mapped onto shared physical memory</title>
  <desc id="desc">One process layout maps private pages to physical frames, a library page may map to a frame shared with another process, and unmapped virtual holes consume no data frame. Another process may reuse the same virtual addresses with different mappings.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#374151"/></marker>
    <style>.h{font:700 28px system-ui,sans-serif;fill:#111827}.t{font:600 18px system-ui,sans-serif;fill:#111827}.s{font:15px system-ui,sans-serif;fill:#374151}.box{stroke:#374151;stroke-width:2}.map{fill:none;stroke:#475569;stroke-width:3;marker-end:url(#arrow)}.shared{fill:none;stroke:#7c3aed;stroke-width:4;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1500" height="820" fill="#ffffff"/>
  <text x="750" y="44" text-anchor="middle" class="h">Virtual addresses name a view; page tables decide where that view lives</text>

  <text x="245" y="92" text-anchor="middle" class="t">Process A virtual space</text>
  <rect x="95" y="120" width="300" height="570" rx="8" fill="#f8fafc" class="box"/>
  <rect x="120" y="155" width="250" height="85" rx="6" fill="#dbeafe" class="box"/><text x="245" y="190" text-anchor="middle" class="t">text + read-only data</text><text x="245" y="217" text-anchor="middle" class="s">VA page 0x00400</text>
  <rect x="120" y="265" width="250" height="85" rx="6" fill="#dcfce7" class="box"/><text x="245" y="300" text-anchor="middle" class="t">private heap page</text><text x="245" y="327" text-anchor="middle" class="s">VA page 0x02100</text>
  <rect x="120" y="375" width="250" height="85" rx="6" fill="#f3e8ff" class="box"/><text x="245" y="410" text-anchor="middle" class="t">shared library page</text><text x="245" y="437" text-anchor="middle" class="s">read + execute</text>
  <rect x="120" y="485" width="250" height="75" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 6"/><text x="245" y="518" text-anchor="middle" class="t">unmapped hole</text><text x="245" y="544" text-anchor="middle" class="s">no data frame</text>
  <rect x="120" y="585" width="250" height="75" rx="6" fill="#ffedd5" class="box"/><text x="245" y="619" text-anchor="middle" class="t">stack page</text><text x="245" y="645" text-anchor="middle" class="s">private, read + write</text>

  <text x="750" y="92" text-anchor="middle" class="t">MMU + process page-table root</text>
  <rect x="610" y="135" width="280" height="120" rx="8" fill="#e0f2fe" class="box"/><text x="750" y="177" text-anchor="middle" class="t">translate VPN</text><text x="750" y="207" text-anchor="middle" class="s">check mapping and permissions</text><text x="750" y="233" text-anchor="middle" class="s">preserve page offset</text>
  <rect x="610" y="290" width="280" height="105" rx="8" fill="#fef3c7" class="box"/><text x="750" y="330" text-anchor="middle" class="t">same VA is not same RAM</text><text x="750" y="360" text-anchor="middle" class="s">root register selects an address space</text>
  <rect x="610" y="430" width="280" height="105" rx="8" fill="#f3e8ff" class="box"/><text x="750" y="470" text-anchor="middle" class="t">sharing is explicit</text><text x="750" y="500" text-anchor="middle" class="s">two mappings may name one frame</text>
  <rect x="610" y="570" width="280" height="90" rx="8" fill="#fee2e2" class="box"/><text x="750" y="606" text-anchor="middle" class="t">invalid access</text><text x="750" y="635" text-anchor="middle" class="s">raises a controlled exception</text>

  <text x="1245" y="92" text-anchor="middle" class="t">Physical frames in RAM</text>
  <rect x="1095" y="120" width="300" height="570" rx="8" fill="#f8fafc" class="box"/>
  <rect x="1120" y="150" width="250" height="72" rx="6" fill="#ffedd5" class="box"/><text x="1245" y="194" text-anchor="middle" class="t">frame 2: A stack</text>
  <rect x="1120" y="240" width="250" height="72" rx="6" fill="#dcfce7" class="box"/><text x="1245" y="284" text-anchor="middle" class="t">frame 7: A heap</text>
  <rect x="1120" y="330" width="250" height="72" rx="6" fill="#dbeafe" class="box"/><text x="1245" y="374" text-anchor="middle" class="t">frame 9: A text</text>
  <rect x="1120" y="420" width="250" height="72" rx="6" fill="#f3e8ff" class="box"/><text x="1245" y="451" text-anchor="middle" class="t">frame 12: libc text</text><text x="1245" y="477" text-anchor="middle" class="s">shared by A and B</text>
  <rect x="1120" y="510" width="250" height="72" rx="6" fill="#bfdbfe" class="box"/><text x="1245" y="554" text-anchor="middle" class="t">frame 14: B text</text>
  <rect x="1120" y="600" width="250" height="60" rx="6" fill="#e5e7eb" class="box"/><text x="1245" y="637" text-anchor="middle" class="s">other frames and free frames</text>

  <path d="M370 198 C520 198 930 366 1120 366" class="map"/>
  <path d="M370 308 C560 308 930 276 1120 276" class="map"/>
  <path d="M370 418 C570 418 930 456 1120 456" class="shared"/>
  <path d="M370 622 C560 622 930 186 1120 186" class="map"/>
  <text x="750" y="760" text-anchor="middle" class="s">Process B can reuse the same virtual addresses with different private mappings while sharing selected frames such as library code.</text>
</svg>
