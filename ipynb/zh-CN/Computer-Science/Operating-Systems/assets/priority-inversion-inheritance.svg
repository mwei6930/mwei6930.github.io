<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850" role="img" aria-labelledby="title desc">
  <title id="title">Priority inversion with and without priority inheritance</title>
  <desc id="desc">Without inheritance, a medium-priority thread preempts the low-priority lock owner while a high-priority thread waits. With inheritance, the low-priority owner temporarily runs at high priority, releases the lock, and the high-priority thread proceeds.</desc>
  <defs><style>.h{font:700 28px system-ui,sans-serif;fill:#111827}.t{font:600 18px system-ui,sans-serif;fill:#111827}.s{font:15px system-ui,sans-serif;fill:#374151}.grid{stroke:#d1d5db;stroke-width:1}.axis{stroke:#111827;stroke-width:2}.low{fill:#93c5fd;stroke:#1d4ed8;stroke-width:2}.med{fill:#fcd34d;stroke:#b45309;stroke-width:2}.high{fill:#fca5a5;stroke:#dc2626;stroke-width:2}.wait{fill:#f3f4f6;stroke:#6b7280;stroke-width:2;stroke-dasharray:7 5}.inherit{fill:#c4b5fd;stroke:#7c3aed;stroke-width:3}</style></defs>
  <rect width="1500" height="850" fill="#fff"/>
  <text x="750" y="45" text-anchor="middle" class="h">The blocked high-priority thread depends on the lock owner's CPU progress</text>
  <g transform="translate(300 0)"><g class="grid"><path d="M0 105V740 M100 105V740 M200 105V740 M300 105V740 M400 105V740 M500 105V740 M600 105V740 M700 105V740 M800 105V740 M900 105V740"/></g><g class="s" text-anchor="middle"><text x="0" y="775">0</text><text x="100" y="775">1</text><text x="200" y="775">2</text><text x="300" y="775">3</text><text x="400" y="775">4</text><text x="500" y="775">5</text><text x="600" y="775">6</text><text x="700" y="775">7</text><text x="800" y="775">8</text><text x="900" y="775">9</text></g><line x1="0" y1="770" x2="900" y2="770" class="axis"/></g>
  <text x="255" y="130" text-anchor="end" class="t">Without inheritance</text>
  <text x="255" y="170" text-anchor="end" class="s">CPU</text>
  <g transform="translate(300 135)"><rect x="0" width="100" height="65" class="low"/><rect x="100" width="500" height="65" class="med"/><rect x="600" width="200" height="65" class="low"/><rect x="800" width="100" height="65" class="high"/><g class="t" text-anchor="middle"><text x="50" y="40">L</text><text x="350" y="40">M preempts L</text><text x="700" y="40">L</text><text x="850" y="40">H</text></g></g>
  <text x="255" y="265" text-anchor="end" class="s">H state</text><g transform="translate(300 225)"><rect x="100" width="700" height="55" class="wait"/><text x="450" y="35" text-anchor="middle" class="s">H waits for lock held by L</text></g>
  <text x="255" y="335" text-anchor="end" class="s">lock</text><g transform="translate(300 300)"><rect x="0" width="800" height="50" class="low"/><text x="400" y="32" text-anchor="middle" class="s">owned by L</text></g>
  <text x="255" y="470" text-anchor="end" class="t">With priority inheritance</text>
  <text x="255" y="510" text-anchor="end" class="s">CPU</text>
  <g transform="translate(300 475)"><rect x="0" width="100" height="65" class="low"/><rect x="100" width="200" height="65" class="inherit"/><rect x="300" width="200" height="65" class="high"/><rect x="500" width="300" height="65" class="med"/><g class="t" text-anchor="middle"><text x="50" y="40">L</text><text x="200" y="32">L inherits H</text><text x="200" y="52" class="s">finishes critical section</text><text x="400" y="40">H</text><text x="650" y="40">M</text></g></g>
  <text x="255" y="605" text-anchor="end" class="s">H state</text><g transform="translate(300 565)"><rect x="100" width="200" height="55" class="wait"/><text x="200" y="35" text-anchor="middle" class="s">bounded wait</text></g>
  <text x="255" y="675" text-anchor="end" class="s">lock</text><g transform="translate(300 640)"><rect x="0" width="300" height="50" class="inherit"/><rect x="300" width="200" height="50" class="high"/><g class="s" text-anchor="middle"><text x="150" y="32">L owns; boosted</text><text x="400" y="32">H owns</text></g></g>
  <rect x="205" y="805" width="1090" height="32" rx="7" fill="#f8fafc" stroke="#374151" stroke-width="2"/>
  <text x="750" y="827" text-anchor="middle" class="s">Inheritance limits scheduler-induced inversion; it does not remove long critical sections, chained blocking, or deadlock.</text>
</svg>
