<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">Uniform I/O interfaces over heterogeneous devices</title>
  <desc id="desc">Applications use a small set of file-descriptor operations. Kernel subsystems and drivers translate those requests to different device protocols while device-specific semantics remain visible.</desc>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#334155"/></marker>
    <style>.h{font:700 30px system-ui,sans-serif;fill:#111827}.t{font:700 18px system-ui,sans-serif;fill:#111827}.s{font:15px system-ui,sans-serif;fill:#334155}.box{stroke:#334155;stroke-width:2}.line{fill:none;stroke:#334155;stroke-width:3;marker-end:url(#a)}.dash{fill:none;stroke:#64748b;stroke-width:2;stroke-dasharray:9 7}</style>
  </defs>
  <rect width="1600" height="820" fill="#fff"/>
  <text x="800" y="48" text-anchor="middle" class="h">One interface reduces accidental diversity, not semantic diversity</text>

  <rect x="105" y="90" width="1390" height="120" rx="8" fill="#eff6ff" class="box"/>
  <text x="165" y="125" class="t">Applications</text>
  <rect x="365" y="116" width="170" height="58" rx="8" fill="#dbeafe" class="box"/><text x="450" y="151" text-anchor="middle" class="t">read / write</text>
  <rect x="575" y="116" width="170" height="58" rx="8" fill="#dbeafe" class="box"/><text x="660" y="151" text-anchor="middle" class="t">ioctl</text>
  <rect x="785" y="116" width="170" height="58" rx="8" fill="#dbeafe" class="box"/><text x="870" y="151" text-anchor="middle" class="t">mmap</text>
  <rect x="995" y="116" width="205" height="58" rx="8" fill="#dbeafe" class="box"/><text x="1098" y="151" text-anchor="middle" class="t">poll / epoll</text>
  <rect x="1240" y="116" width="180" height="58" rx="8" fill="#dbeafe" class="box"/><text x="1330" y="151" text-anchor="middle" class="t">io_uring</text>

  <path d="M800 210 V272" class="line"/>
  <rect x="260" y="272" width="1080" height="100" rx="8" fill="#ede9fe" class="box"/>
  <text x="800" y="312" text-anchor="middle" class="t">Kernel object selected by the file descriptor</text>
  <text x="800" y="344" text-anchor="middle" class="s">access mode, current state, credentials, operation table, wait queues and ownership</text>

  <path d="M800 372 V430 H260 V466" class="line"/><path d="M800 430 H620 V466" class="line"/><path d="M800 430 H980 V466" class="line"/><path d="M800 430 H1340 V466" class="line"/>
  <rect x="90" y="466" width="340" height="118" rx="8" fill="#dcfce7" class="box"/><text x="260" y="505" text-anchor="middle" class="t">Regular file</text><text x="260" y="535" text-anchor="middle" class="s">offset, page cache, persistence</text><text x="260" y="561" text-anchor="middle" class="s">seekable; EOF can be stable</text>
  <rect x="450" y="466" width="340" height="118" rx="8" fill="#fef3c7" class="box"/><text x="620" y="505" text-anchor="middle" class="t">Pipe / terminal</text><text x="620" y="535" text-anchor="middle" class="s">byte stream, finite buffer</text><text x="620" y="561" text-anchor="middle" class="s">producer and consumer timing</text>
  <rect x="810" y="466" width="340" height="118" rx="8" fill="#ffedd5" class="box"/><text x="980" y="505" text-anchor="middle" class="t">Socket</text><text x="980" y="535" text-anchor="middle" class="s">stream or datagram semantics</text><text x="980" y="561" text-anchor="middle" class="s">peer failure and backpressure</text>
  <rect x="1170" y="466" width="340" height="118" rx="8" fill="#fce7f3" class="box"/><text x="1340" y="505" text-anchor="middle" class="t">Device node</text><text x="1340" y="535" text-anchor="middle" class="s">driver-defined operations</text><text x="1340" y="561" text-anchor="middle" class="s">device-specific control via ioctl</text>

  <path d="M260 584 V650" class="line"/><path d="M620 584 V650" class="line"/><path d="M980 584 V650" class="line"/><path d="M1340 584 V650" class="line"/>
  <rect x="90" y="650" width="1420" height="96" rx="8" fill="#f8fafc" class="box"/>
  <text x="800" y="688" text-anchor="middle" class="t">Subsystems and drivers translate policy into controller-specific commands</text>
  <text x="800" y="719" text-anchor="middle" class="s">uniform calls make composition possible; EOF, atomicity, readiness, ordering and durability still depend on the object</text>
  <path d="M80 410 H1520" class="dash"/><text x="125" y="401" class="s">abstraction boundary</text>
</svg>
