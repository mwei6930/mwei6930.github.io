<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="880" viewBox="0 0 1600 880" role="img" aria-labelledby="title desc">
  <title id="title">Buffering and backpressure under bursty load</title>
  <desc id="desc">A producer feeds a bounded queue faster than a consumer can drain it. High- and low-water marks control admission, while a graph shows queue growth and delay.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#334155"/></marker><style>.h{font:700 30px system-ui,sans-serif;fill:#111827}.t{font:700 18px system-ui,sans-serif;fill:#111827}.s{font:15px system-ui,sans-serif;fill:#334155}.box{stroke:#334155;stroke-width:2}.line{fill:none;stroke:#334155;stroke-width:4;marker-end:url(#a)}.axis{stroke:#334155;stroke-width:3}.dash{stroke:#dc2626;stroke-width:2;stroke-dasharray:9 7}</style></defs>
  <rect width="1600" height="880" fill="#fff"/><text x="800" y="48" text-anchor="middle" class="h">A buffer absorbs a burst; backpressure prevents an unbounded promise</text>
  <rect x="70" y="105" width="260" height="120" rx="8" fill="#dbeafe" class="box"/><text x="200" y="150" text-anchor="middle" class="t">Producer</text><text x="200" y="181" text-anchor="middle" class="s">arrival rate λ(t)</text><text x="200" y="207" text-anchor="middle" class="s">application or device</text>
  <path d="M330 165 H450" class="line"/><text x="390" y="145" text-anchor="middle" class="s">enqueue</text>
  <rect x="450" y="90" width="700" height="150" rx="8" fill="#fff7ed" class="box"/><text x="800" y="125" text-anchor="middle" class="t">Bounded queue / ring buffer</text>
  <rect x="500" y="150" width="95" height="55" fill="#f59e0b" class="box"/><rect x="595" y="150" width="95" height="55" fill="#f59e0b" class="box"/><rect x="690" y="150" width="95" height="55" fill="#f59e0b" class="box"/><rect x="785" y="150" width="95" height="55" fill="#fef3c7" class="box"/><rect x="880" y="150" width="95" height="55" fill="#fff" class="box"/><rect x="975" y="150" width="95" height="55" fill="#fff" class="box"/>
  <text x="547" y="184" text-anchor="middle" class="s">oldest</text><text x="1022" y="184" text-anchor="middle" class="s">free</text>
  <path d="M1150 165 H1270" class="line"/><text x="1210" y="145" text-anchor="middle" class="s">dequeue</text>
  <rect x="1270" y="105" width="260" height="120" rx="8" fill="#dcfce7" class="box"/><text x="1400" y="150" text-anchor="middle" class="t">Consumer</text><text x="1400" y="181" text-anchor="middle" class="s">service rate μ(t)</text><text x="1400" y="207" text-anchor="middle" class="s">device or application</text>

  <path d="M800 240 V315" class="line"/>
  <rect x="515" y="315" width="570" height="100" rx="8" fill="#fee2e2" class="box"/><text x="800" y="351" text-anchor="middle" class="t">High-water mark reached</text><text x="800" y="381" text-anchor="middle" class="s">stop reading, disable producer interest, return partial write/EAGAIN,</text><text x="800" y="405" text-anchor="middle" class="s">or reject work according to an explicit overload policy</text>
  <path d="M515 365 H200 V225" class="line"/>

  <rect x="90" y="500" width="660" height="300" rx="8" fill="#f8fafc" class="box"/><text x="420" y="537" text-anchor="middle" class="t">Queue occupancy over time</text>
  <line x1="160" y1="745" x2="690" y2="745" class="axis"/><line x1="160" y1="745" x2="160" y2="575" class="axis"/>
  <line x1="160" y1="615" x2="690" y2="615" class="dash"/><text x="675" y="603" text-anchor="end" class="s" fill="#b91c1c">high water</text>
  <path d="M160 735 C250 725 270 650 350 630 C430 610 470 590 530 615 C590 640 620 690 690 705" fill="none" stroke="#2563eb" stroke-width="5"/>
  <text x="425" y="780" text-anchor="middle" class="s">burst fills queue → throttle → consumer drains → resume</text>

  <rect x="820" y="500" width="690" height="300" rx="8" fill="#f0fdf4" class="box"/><text x="1165" y="537" text-anchor="middle" class="t">What buffering can and cannot do</text>
  <text x="865" y="588" class="t">Can</text><text x="1015" y="588" class="s">smooth bursts, batch work, align transfers, overlap stages</text>
  <text x="865" y="638" class="t">Cannot</text><text x="1015" y="638" class="s">raise sustained service rate or make overload disappear</text>
  <text x="865" y="688" class="t">Little's law</text><text x="1015" y="688" class="s">L = λW: a larger average queue implies longer waiting</text>
  <text x="865" y="738" class="t">Design rule</text><text x="1015" y="738" class="s">bound memory, define admission, expose pressure upstream</text>
  <text x="800" y="842" text-anchor="middle" class="s">A cache retains reusable data; a buffer temporarily reconciles rate, size or timing mismatches. One object may serve both roles.</text>
</svg>
