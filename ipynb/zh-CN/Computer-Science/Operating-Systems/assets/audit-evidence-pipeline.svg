<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Security audit evidence pipeline</title>
  <desc id="desc">Security-relevant events are selected in kernel policy, grouped into records, queued to auditd, enriched and forwarded to protected storage and analysis while loss and clock quality are monitored.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#46596d"/></marker></defs>
  <style>text{font-family:Arial,sans-serif;fill:#172235}.title{font-size:28px;font-weight:700}.head{font-size:18px;font-weight:700}.body{font-size:15px}.small{font-size:13px;fill:#526274}.box{stroke:#65788b;stroke-width:2}.arrow{stroke:#46596d;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style>
  <rect width="1200" height="700" fill="#f7f9fb"/><text x="600" y="42" text-anchor="middle" class="title">Useful audit evidence preserves who, what, which object, result, and context</text>
  <rect x="45" y="102" width="210" height="175" rx="8" fill="#e6f0ff" class="box"/><text x="150" y="136" text-anchor="middle" class="head">Security event</text><text x="150" y="174" text-anchor="middle" class="body">syscall / LSM denial</text><text x="150" y="202" text-anchor="middle" class="body">credential change</text><text x="150" y="230" text-anchor="middle" class="body">policy or config update</text><text x="150" y="258" text-anchor="middle" class="small">success may matter too</text>
  <rect x="320" y="82" width="250" height="215" rx="8" fill="#eee9ff" class="box"/><text x="445" y="116" text-anchor="middle" class="head">Kernel audit decision</text><text x="445" y="154" text-anchor="middle" class="body">rule/filter + task context</text><text x="445" y="182" text-anchor="middle" class="body">event serial + timestamp</text><text x="445" y="210" text-anchor="middle" class="body">SYSCALL, PATH, CWD...</text><text x="445" y="238" text-anchor="middle" class="body">UID/AUID, PID, result</text><text x="445" y="275" text-anchor="middle" class="small">one event can span several records</text>
  <rect x="635" y="102" width="210" height="175" rx="8" fill="#fff2d5" class="box"/><text x="740" y="136" text-anchor="middle" class="head">Backlog / Netlink</text><text x="740" y="174" text-anchor="middle" class="body">bounded kernel queue</text><text x="740" y="202" text-anchor="middle" class="body">overflow policy</text><text x="740" y="230" text-anchor="middle" class="body">auditd consumes</text><text x="740" y="258" text-anchor="middle" class="small">loss is a security signal</text>
  <rect x="910" y="82" width="245" height="215" rx="8" fill="#e5f7ed" class="box"/><text x="1032" y="116" text-anchor="middle" class="head">Protected collection</text><text x="1032" y="154" text-anchor="middle" class="body">rotate + retain locally</text><text x="1032" y="182" text-anchor="middle" class="body">forward off-host</text><text x="1032" y="210" text-anchor="middle" class="body">normalize and correlate</text><text x="1032" y="238" text-anchor="middle" class="body">restrict read/delete access</text><text x="1032" y="275" text-anchor="middle" class="small">alerts, investigation, reports</text>
  <path d="M255 190H320M570 190H635M845 190H910" class="arrow"/>
  <rect x="65" y="365" width="320" height="190" rx="8" fill="#fff" class="box"/><text x="225" y="399" text-anchor="middle" class="head">Selection quality</text><text x="95" y="437" class="body">record policy-changing and high-risk events</text><text x="95" y="467" class="body">avoid secrets in argv/environment/content</text><text x="95" y="497" class="body">include stable IDs and outcome</text><text x="95" y="527" class="small">too little hides attacks; too much hides signal</text>
  <rect x="440" y="365" width="320" height="190" rx="8" fill="#ffe6e3" class="box"/><text x="600" y="399" text-anchor="middle" class="head">Evidence failure modes</text><text x="470" y="437" class="body">queue overflow or disabled auditing</text><text x="470" y="467" class="body">clock skew and ambiguous identity</text><text x="470" y="497" class="body">local attacker truncates logs</text><text x="470" y="527" class="small">logging after compromise is not trustworthy by default</text>
  <rect x="815" y="365" width="320" height="190" rx="8" fill="#dff4f5" class="box"/><text x="975" y="399" text-anchor="middle" class="head">Operational feedback</text><text x="845" y="437" class="body">monitor lost/backlog counters</text><text x="845" y="467" class="body">test rules and alert delivery</text><text x="845" y="497" class="body">define retention and access policy</text><text x="845" y="527" class="small">evidence must survive the incident it explains</text>
  <path d="M1032 297V335H975V365" class="arrow"/>
  <rect x="145" y="610" width="910" height="54" rx="8" fill="#fff2d5" class="box"/><text x="600" y="643" text-anchor="middle" class="body">Audit supports accountability and detection; it does not retroactively prevent an unauthorized operation or prove that an unlogged event never occurred.</text>
</svg>
