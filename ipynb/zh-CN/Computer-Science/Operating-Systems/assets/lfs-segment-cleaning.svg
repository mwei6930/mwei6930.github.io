<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="930" viewBox="0 0 1800 930" role="img" aria-labelledby="title desc">
  <title id="title">Log-structured writing and segment cleaning</title>
  <desc id="desc">New data, inodes, and index updates append sequentially to log segments. Cleaning selects low-utilization segments, identifies live blocks through summaries and current maps, copies live blocks, and frees complete segments.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#334155"/></marker><style>.h{font:700 30px system-ui,sans-serif;fill:#111827}.t{font:700 18px system-ui,sans-serif;fill:#111827}.s{font:14px system-ui,sans-serif;fill:#334155}.box{stroke:#334155;stroke-width:2}.line{fill:none;stroke:#334155;stroke-width:3;marker-end:url(#a)}.live{fill:#dcfce7;stroke:#15803d;stroke-width:2}.dead{fill:#e2e8f0;stroke:#64748b;stroke-width:2}.new{fill:#dbeafe;stroke:#2563eb;stroke-width:2}.free{fill:#fff;stroke:#94a3b8;stroke-width:2;stroke-dasharray:8 6}</style></defs>
  <rect width="1800" height="930" fill="#fff"/><text x="900" y="48" text-anchor="middle" class="h">Log-structured filesystems trade in-place writes for append bandwidth and cleaning</text>
  <rect x="70" y="105" width="1660" height="240" rx="8" fill="#eff6ff" class="box"/><text x="120" y="145" class="t">Append head</text><text x="1450" y="145" class="s">time / logical log order -></text>
  <rect x="120" y="190" width="270" height="105" fill="#fff7ed" class="box"/><text x="255" y="220" text-anchor="middle" class="t">Segment 10</text><rect x="135" y="245" width="55" height="35" class="live"/><rect x="190" y="245" width="55" height="35" class="dead"/><rect x="245" y="245" width="55" height="35" class="dead"/><rect x="300" y="245" width="55" height="35" class="live"/>
  <rect x="410" y="190" width="270" height="105" fill="#fff7ed" class="box"/><text x="545" y="220" text-anchor="middle" class="t">Segment 11</text><rect x="425" y="245" width="55" height="35" class="dead"/><rect x="480" y="245" width="55" height="35" class="live"/><rect x="535" y="245" width="55" height="35" class="dead"/><rect x="590" y="245" width="55" height="35" class="dead"/>
  <rect x="700" y="190" width="270" height="105" fill="#fff7ed" class="box"/><text x="835" y="220" text-anchor="middle" class="t">Segment 12</text><rect x="715" y="245" width="55" height="35" class="live"/><rect x="770" y="245" width="55" height="35" class="live"/><rect x="825" y="245" width="55" height="35" class="dead"/><rect x="880" y="245" width="55" height="35" class="live"/>
  <rect x="990" y="190" width="320" height="105" fill="#dbeafe" class="box"/><text x="1150" y="220" text-anchor="middle" class="t">Current segment</text><rect x="1005" y="245" width="55" height="35" class="new"/><rect x="1060" y="245" width="55" height="35" class="new"/><rect x="1115" y="245" width="55" height="35" class="new"/><rect x="1170" y="245" width="55" height="35" class="free"/><rect x="1225" y="245" width="55" height="35" class="free"/>
  <path d="M1310 242 H1580" class="line"/><text x="1445" y="222" text-anchor="middle" class="s">append data + inode/index updates</text>

  <rect x="70" y="420" width="760" height="320" rx="8" fill="#fff7ed" class="box"/><text x="450" y="462" text-anchor="middle" class="t">Cleaning decision</text>
  <text x="125" y="515" class="s">1. choose victim segments with favorable utilization/age</text><text x="125" y="558" class="s">2. read segment summaries to identify recorded owners</text><text x="125" y="601" class="s">3. consult current inode map/index to test liveness</text><text x="125" y="644" class="s">4. copy only live blocks to the append head</text><text x="125" y="687" class="s">5. mark whole victim segments free</text>
  <path d="M545 345 V420" class="line"/>

  <rect x="900" y="420" width="830" height="320" rx="8" fill="#f0fdf4" class="box"/><text x="1315" y="462" text-anchor="middle" class="t">After cleaning segments 10 and 11</text>
  <rect x="960" y="525" width="300" height="100" fill="#dbeafe" class="box"/><text x="1110" y="558" text-anchor="middle" class="t">New appended segment</text><text x="1110" y="590" text-anchor="middle" class="s">copied live blocks + newer writes</text>
  <rect x="1340" y="500" width="150" height="150" class="free"/><text x="1415" y="566" text-anchor="middle" class="t">10</text><text x="1415" y="596" text-anchor="middle" class="s">free</text>
  <rect x="1510" y="500" width="150" height="150" class="free"/><text x="1585" y="566" text-anchor="middle" class="t">11</text><text x="1585" y="596" text-anchor="middle" class="s">free</text>
  <path d="M830 580 H900" class="line"/>

  <rect x="180" y="800" width="1440" height="75" rx="8" fill="#f8fafc" class="box"/><text x="900" y="831" text-anchor="middle" class="t">Write amplification</text><text x="900" y="859" text-anchor="middle" class="s">WA = physical bytes written / logical bytes requested; copying live blocks and updating indexes raises WA above 1.</text>
  <text x="900" y="915" text-anchor="middle" class="s">SSD-aware designs align segments/zones, separate hot and cold data, issue discard, and coordinate with the flash translation layer to limit redundant relocation.</text>
</svg>
