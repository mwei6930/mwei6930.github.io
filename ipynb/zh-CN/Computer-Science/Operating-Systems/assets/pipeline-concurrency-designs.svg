<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1540 850" role="img" aria-labelledby="title desc">
  <title id="title">Three concurrency designs for a cat and grep style dataflow</title>
  <desc id="desc">The same input-filter-output workflow is shown using isolated processes and a pipe, threads and a shared queue, or one event loop and explicit state machines.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#355070"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17212b; }
      .title { font-size: 32px; font-weight: 700; }
      .section { font-size: 22px; font-weight: 700; }
      .head { font-size: 18px; font-weight: 700; }
      .body { font-size: 16px; }
      .small { font-size: 14px; }
      .panel { stroke: #355070; stroke-width: 2.4; rx: 9; }
      .line { stroke: #355070; stroke-width: 2.8; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1540" height="850" fill="#fff"/>
  <text x="770" y="48" text-anchor="middle" class="title">The Same Dataflow Can Use Different Isolation and Coordination Boundaries</text>

  <rect x="55" y="100" width="1430" height="205" class="panel" fill="#f8fafb"/>
  <text x="95" y="143" class="section">Isolated process pipeline</text>
  <rect x="330" y="155" width="230" height="100" class="panel" fill="#e9f2fb"/>
  <text x="445" y="193" text-anchor="middle" class="head">cat process</text>
  <text x="445" y="225" text-anchor="middle" class="body">read input.txt</text>
  <rect x="655" y="155" width="230" height="100" class="panel" fill="#fff3d9"/>
  <text x="770" y="193" text-anchor="middle" class="head">kernel pipe</text>
  <text x="770" y="225" text-anchor="middle" class="body">bounded byte stream</text>
  <rect x="980" y="155" width="230" height="100" class="panel" fill="#edf5e8"/>
  <text x="1095" y="193" text-anchor="middle" class="head">grep process</text>
  <text x="1095" y="225" text-anchor="middle" class="body">filter and write result</text>
  <path d="M560 205 L655 205" class="line"/><path d="M885 205 L980 205" class="line"/>
  <text x="1340" y="190" text-anchor="middle" class="body">strong isolation</text>
  <text x="1340" y="220" text-anchor="middle" class="body">explicit byte transfer</text>
  <text x="1340" y="250" text-anchor="middle" class="small">natural EOF and backpressure</text>

  <rect x="55" y="330" width="1430" height="205" class="panel" fill="#f8fafb"/>
  <text x="95" y="373" class="section">Threaded redesign</text>
  <rect x="270" y="395" width="920" height="100" class="panel" fill="#f1eef8"/>
  <text x="315" y="425" class="small">one process: shared address space and descriptor table</text>
  <rect x="330" y="438" width="215" height="42" class="panel" fill="#e9f2fb"/>
  <text x="437" y="465" text-anchor="middle" class="head">reader thread</text>
  <rect x="625" y="438" width="215" height="42" class="panel" fill="#fff3d9"/>
  <text x="732" y="465" text-anchor="middle" class="head">shared bounded queue</text>
  <rect x="920" y="438" width="215" height="42" class="panel" fill="#edf5e8"/>
  <text x="1027" y="465" text-anchor="middle" class="head">filter thread</text>
  <path d="M545 459 L625 459" class="line"/><path d="M840 459 L920 459" class="line"/>
  <text x="1340" y="420" text-anchor="middle" class="body">cheap shared payload</text>
  <text x="1340" y="450" text-anchor="middle" class="body">custom locking and EOF flag</text>
  <text x="1340" y="480" text-anchor="middle" class="small">one memory bug threatens all work</text>

  <rect x="55" y="560" width="1430" height="205" class="panel" fill="#f8fafb"/>
  <text x="95" y="603" class="section">Single-threaded event loop</text>
  <rect x="330" y="625" width="230" height="100" class="panel" fill="#e9f2fb"/>
  <text x="445" y="663" text-anchor="middle" class="head">input state machine</text>
  <text x="445" y="695" text-anchor="middle" class="body">nonblocking reads</text>
  <rect x="655" y="625" width="230" height="100" class="panel" fill="#f1eef8"/>
  <text x="770" y="663" text-anchor="middle" class="head">event loop</text>
  <text x="770" y="695" text-anchor="middle" class="body">readiness + explicit state</text>
  <rect x="980" y="625" width="230" height="100" class="panel" fill="#edf5e8"/>
  <text x="1095" y="663" text-anchor="middle" class="head">output state machine</text>
  <text x="1095" y="695" text-anchor="middle" class="body">partial writes</text>
  <path d="M560 675 L655 675" class="line"/><path d="M885 675 L980 675" class="line"/>
  <text x="1340" y="650" text-anchor="middle" class="body">few schedulable contexts</text>
  <text x="1340" y="680" text-anchor="middle" class="body">no blocking operation allowed</text>
  <text x="1340" y="710" text-anchor="middle" class="small">CPU-heavy work delays all flows</text>

  <text x="770" y="815" text-anchor="middle" class="body">The workflow is unchanged; the chosen boundary relocates copying, synchronization, failure isolation, and complexity.</text>
</svg>
