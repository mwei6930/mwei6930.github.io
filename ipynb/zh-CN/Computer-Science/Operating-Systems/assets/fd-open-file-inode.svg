<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">File descriptors, open file descriptions, and inodes</title>
  <desc id="desc">Descriptor tables in two processes point to system-wide open file descriptions. Dup and fork can share an offset, while separate open calls create independent offsets that still reference the same inode.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#334155"/></marker><style>.h{font:700 30px system-ui,sans-serif;fill:#111827}.t{font:700 18px system-ui,sans-serif;fill:#111827}.s{font:15px system-ui,sans-serif;fill:#334155}.box{stroke:#334155;stroke-width:2}.line{fill:none;stroke:#334155;stroke-width:3;marker-end:url(#a)}.shared{fill:none;stroke:#7c3aed;stroke-width:4;marker-end:url(#a)}.separate{fill:none;stroke:#0f766e;stroke-width:4;marker-end:url(#a)}</style></defs>
  <rect width="1600" height="900" fill="#fff"/><text x="800" y="48" text-anchor="middle" class="h">Descriptor number, open state, and persistent object are three different layers</text>
  <rect x="70" y="105" width="420" height="300" rx="8" fill="#eff6ff" class="box"/><text x="280" y="145" text-anchor="middle" class="t">Process A descriptor table</text>
  <rect x="125" y="190" width="310" height="58" rx="6" fill="#dbeafe" class="box"/><text x="165" y="226" class="t">fd 3</text><text x="405" y="226" text-anchor="end" class="s">after open()</text>
  <rect x="125" y="275" width="310" height="58" rx="6" fill="#dbeafe" class="box"/><text x="165" y="311" class="t">fd 7</text><text x="405" y="311" text-anchor="end" class="s">after dup(3)</text>
  <rect x="125" y="350" width="310" height="35" rx="6" fill="#fff" class="box"/><text x="280" y="374" text-anchor="middle" class="s">FD_CLOEXEC belongs to each descriptor</text>

  <rect x="70" y="480" width="420" height="240" rx="8" fill="#f0fdf4" class="box"/><text x="280" y="520" text-anchor="middle" class="t">Process B descriptor table</text>
  <rect x="125" y="570" width="310" height="58" rx="6" fill="#dcfce7" class="box"/><text x="165" y="606" class="t">fd 3</text><text x="405" y="606" text-anchor="end" class="s">inherited by fork()</text>
  <rect x="125" y="645" width="310" height="58" rx="6" fill="#dcfce7" class="box"/><text x="165" y="681" class="t">fd 5</text><text x="405" y="681" text-anchor="end" class="s">separate open()</text>

  <rect x="650" y="175" width="400" height="220" rx="8" fill="#f5f3ff" class="box"/><text x="850" y="216" text-anchor="middle" class="t">Open file description X</text>
  <text x="700" y="260" class="s">current offset: 4096</text><text x="700" y="292" class="s">status flags: O_RDONLY</text><text x="700" y="324" class="s">reference count: 3 descriptors</text><text x="700" y="356" class="s">pointer to file/inode operations</text>
  <path d="M435 219 H650" class="shared"/><path d="M435 304 H570 V240 H650" class="shared"/><path d="M435 599 H560 V330 H650" class="shared"/>

  <rect x="650" y="520" width="400" height="190" rx="8" fill="#ecfeff" class="box"/><text x="850" y="561" text-anchor="middle" class="t">Open file description Y</text>
  <text x="700" y="605" class="s">current offset: 0</text><text x="700" y="637" class="s">status flags: O_RDONLY</text><text x="700" y="669" class="s">created by a distinct open()</text>
  <path d="M435 674 H650" class="separate"/>

  <rect x="1210" y="285" width="320" height="300" rx="8" fill="#fff7ed" class="box"/><text x="1370" y="326" text-anchor="middle" class="t">Cached inode / file object</text>
  <text x="1260" y="374" class="s">identity: device + inode number</text><text x="1260" y="406" class="s">type, size, owner, mode</text><text x="1260" y="438" class="s">timestamps and mapping tree</text><text x="1260" y="470" class="s">page-cache address space</text><text x="1260" y="502" class="s">filesystem operation methods</text><text x="1260" y="546" class="s">does not store per-open offset</text>
  <path d="M1050 285 H1210" class="line"/><path d="M1050 615 H1140 V500 H1210" class="line"/>
  <rect x="170" y="790" width="1260" height="65" rx="8" fill="#f8fafc" class="box"/><text x="800" y="830" text-anchor="middle" class="s">dup() and fork() can share an open offset; a new open() normally creates an independent offset even for the same inode.</text>
</svg>
