<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Hardware-assisted CPU virtualization and VM exits</title>
  <desc id="desc">An animated control path alternates between guest execution and hypervisor handling of intercepted operations.</desc>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#34495e"/></marker>
    <style>text{font-family:Arial,Helvetica,sans-serif;fill:#17202a;letter-spacing:0}.h{font-size:28px;font-weight:700}.s{font-size:20px;font-weight:700}.b{font-size:17px}.n{font-size:15px;fill:#425466}.box{stroke:#34495e;stroke-width:2;rx:6}.p{fill:none;stroke:#34495e;stroke-width:3;marker-end:url(#a)}.hot{fill:#c0392b}</style>
  </defs>
  <rect width="1200" height="620" fill="#f8fafc"/><text x="600" y="42" text-anchor="middle" class="h">Guest execution is direct until an intercepted event requires mediation</text>
  <rect x="90" y="90" width="420" height="360" class="box" fill="#eaf2f8"/><text x="300" y="128" text-anchor="middle" class="s">VMX non-root / guest context</text>
  <rect x="145" y="160" width="310" height="68" class="box" fill="#d6eaf8"/><text x="300" y="202" text-anchor="middle" class="b">Run ordinary guest instructions</text>
  <rect x="145" y="258" width="310" height="90" class="box" fill="#fff3cd"/><text x="300" y="292" text-anchor="middle" class="b">Intercepted event</text><text x="300" y="320" text-anchor="middle" class="n">I/O, selected control register, EPT fault, interrupt</text>
  <text x="300" y="395" text-anchor="middle" class="n">Guest privilege is real inside the VM,</text><text x="300" y="418" text-anchor="middle" class="n">but constrained by virtualization controls.</text>
  <rect x="690" y="90" width="420" height="360" class="box" fill="#f4ecf7"/><text x="900" y="128" text-anchor="middle" class="s">VMX root / hypervisor context</text>
  <rect x="745" y="160" width="310" height="68" class="box" fill="#eadcf8"/><text x="900" y="202" text-anchor="middle" class="b">Read exit reason and guest state</text>
  <rect x="745" y="258" width="310" height="90" class="box" fill="#eadcf8"/><text x="900" y="291" text-anchor="middle" class="b">Emulate, inject, map, or schedule</text><text x="900" y="320" text-anchor="middle" class="n">Update virtual state or defer the vCPU</text>
  <text x="900" y="395" text-anchor="middle" class="n">VMCS/VMCB holds entry controls, exit controls,</text><text x="900" y="418" text-anchor="middle" class="n">guest state, host state, and exit information.</text>
  <path d="M455 302 C565 302 605 195 745 195" class="p"/><text x="600" y="218" text-anchor="middle" class="b" fill="#c0392b">VM exit</text>
  <path d="M745 327 C620 327 565 410 455 410" class="p"/><text x="600" y="401" text-anchor="middle" class="b" fill="#1f618d">VM entry</text>
  <circle r="9" class="hot"><animateMotion dur="4s" repeatCount="indefinite" path="M455 302 C565 302 605 195 745 195 C910 195 1000 280 900 327 C720 410 590 410 455 410 C350 380 330 330 455 302"/></circle>
  <rect x="90" y="482" width="1020" height="92" rx="6" fill="#ffffff" stroke="#34495e" stroke-width="2"/>
  <text x="600" y="517" text-anchor="middle" class="b">Fast path: execute guest code without instruction-by-instruction emulation.</text>
  <text x="600" y="546" text-anchor="middle" class="b">Slow path: pay exit, handling, cache/TLB disruption, and re-entry costs.</text>
  <text x="600" y="568" text-anchor="middle" class="n">Good VMM design reduces unnecessary exits and batches communication when possible.</text>
</svg>
