<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="850" viewBox="0 0 1600 850" role="img" aria-labelledby="title desc">
  <title id="title">Driver lifecycle and trust boundary</title>
  <desc id="desc">A device driver discovers hardware, claims resources, serves requests, handles power transitions and errors, and safely disconnects while enforcing a trust boundary around DMA and interrupts.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#334155"/></marker><style>.h{font:700 30px system-ui,sans-serif;fill:#111827}.t{font:700 18px system-ui,sans-serif;fill:#111827}.s{font:15px system-ui,sans-serif;fill:#334155}.box{stroke:#334155;stroke-width:2}.line{fill:none;stroke:#334155;stroke-width:3;marker-end:url(#a)}.bad{fill:none;stroke:#dc2626;stroke-width:3;marker-end:url(#a)}.boundary{fill:none;stroke:#dc2626;stroke-width:3;stroke-dasharray:10 8}</style></defs>
  <rect width="1600" height="850" fill="#fff"/><text x="800" y="48" text-anchor="middle" class="h">A driver owns both a lifecycle and a security boundary</text>
  <text x="800" y="88" text-anchor="middle" class="s">The happy-path read/write routine is only one part of correct device ownership.</text>

  <rect x="90" y="160" width="230" height="100" rx="8" fill="#dbeafe" class="box"/><text x="205" y="199" text-anchor="middle" class="t">Discover</text><text x="205" y="228" text-anchor="middle" class="s">bus match / hotplug event</text>
  <rect x="365" y="160" width="230" height="100" rx="8" fill="#ede9fe" class="box"/><text x="480" y="199" text-anchor="middle" class="t">Probe</text><text x="480" y="228" text-anchor="middle" class="s">identify and validate device</text>
  <rect x="640" y="160" width="250" height="100" rx="8" fill="#fef3c7" class="box"/><text x="765" y="199" text-anchor="middle" class="t">Claim resources</text><text x="765" y="228" text-anchor="middle" class="s">MMIO, IRQ, DMA, queues</text>
  <rect x="935" y="160" width="250" height="100" rx="8" fill="#dcfce7" class="box"/><text x="1060" y="199" text-anchor="middle" class="t">Serve requests</text><text x="1060" y="228" text-anchor="middle" class="s">submit, complete, account</text>
  <rect x="1230" y="160" width="280" height="100" rx="8" fill="#ffedd5" class="box"/><text x="1370" y="199" text-anchor="middle" class="t">Quiesce and remove</text><text x="1370" y="228" text-anchor="middle" class="s">stop new work, drain, release</text>
  <path d="M320 210 H365" class="line"/><path d="M595 210 H640" class="line"/><path d="M890 210 H935" class="line"/><path d="M1185 210 H1230" class="line"/>

  <path d="M1060 260 V335" class="line"/>
  <rect x="860" y="335" width="400" height="105" rx="8" fill="#fce7f3" class="box"/><text x="1060" y="375" text-anchor="middle" class="t">Suspend, reset, or recover</text><text x="1060" y="404" text-anchor="middle" class="s">mask events, cancel or finish work, restore state</text><text x="1060" y="429" text-anchor="middle" class="s">then return to service or remove the device</text>
  <path d="M860 387 H765 V260" class="line"/><path d="M1260 387 H1370 V260" class="bad"/>

  <rect x="120" y="525" width="1360" height="225" rx="8" fill="#fff7ed" class="boundary"/>
  <text x="800" y="558" text-anchor="middle" class="t" fill="#b91c1c">Privileged trust boundary</text>
  <rect x="175" y="590" width="280" height="105" rx="8" fill="#fee2e2" class="box"/><text x="315" y="629" text-anchor="middle" class="t">Untrusted inputs</text><text x="315" y="658" text-anchor="middle" class="s">device descriptors, lengths, status</text><text x="315" y="683" text-anchor="middle" class="s">and userspace ioctl arguments</text>
  <rect x="510" y="590" width="280" height="105" rx="8" fill="#fef3c7" class="box"/><text x="650" y="629" text-anchor="middle" class="t">Driver checks</text><text x="650" y="658" text-anchor="middle" class="s">bounds, ownership, state</text><text x="650" y="683" text-anchor="middle" class="s">and completion identity</text>
  <rect x="845" y="590" width="280" height="105" rx="8" fill="#ede9fe" class="box"/><text x="985" y="629" text-anchor="middle" class="t">DMA isolation</text><text x="985" y="658" text-anchor="middle" class="s">map only intended buffers</text><text x="985" y="683" text-anchor="middle" class="s">IOMMU limits reachable memory</text>
  <rect x="1180" y="590" width="245" height="105" rx="8" fill="#dcfce7" class="box"/><text x="1303" y="629" text-anchor="middle" class="t">Safe teardown</text><text x="1303" y="658" text-anchor="middle" class="s">refcounts and generations</text><text x="1303" y="683" text-anchor="middle" class="s">prevent use-after-remove</text>
  <path d="M455 642 H510" class="line"/><path d="M790 642 H845" class="line"/><path d="M1125 642 H1180" class="line"/>
  <text x="800" y="806" text-anchor="middle" class="s">A buggy driver can corrupt the kernel; a malicious or failed device can corrupt memory unless the driver and IOMMU constrain it.</text>
</svg>
