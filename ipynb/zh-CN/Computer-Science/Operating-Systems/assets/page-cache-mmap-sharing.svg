<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">File I/O, mmap, and the page cache</title><desc id="desc">Buffered read and write calls and memory mappings converge on the same page cache. Shared mapping writes dirty that cached page; private mapping writes diverge through copy-on-write.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#334155"/></marker><style>.h{font:700 30px system-ui,sans-serif;fill:#111827}.t{font:700 18px system-ui,sans-serif;fill:#111827}.s{font:15px system-ui,sans-serif;fill:#334155}.box{stroke:#334155;stroke-width:2}.line{fill:none;stroke:#334155;stroke-width:3;marker-end:url(#a)}.private{fill:none;stroke:#db2777;stroke-width:3;stroke-dasharray:9 7;marker-end:url(#a)}</style></defs>
  <rect width="1600" height="900" fill="#fff"/><text x="800" y="48" text-anchor="middle" class="h">Normal file I/O and mmap meet in the page cache</text>
  <rect x="90" y="115" width="300" height="120" rx="8" fill="#dbeafe" class="box"/><text x="240" y="155" text-anchor="middle" class="t">read() / write()</text><text x="240" y="187" text-anchor="middle" class="s">copy bytes between user buffer</text><text x="240" y="212" text-anchor="middle" class="s">and cached file pages</text>
  <rect x="650" y="115" width="300" height="120" rx="8" fill="#dcfce7" class="box"/><text x="800" y="155" text-anchor="middle" class="t">MAP_SHARED</text><text x="800" y="187" text-anchor="middle" class="s">PTE maps cached file page</text><text x="800" y="212" text-anchor="middle" class="s">writes make shared state dirty</text>
  <rect x="1210" y="115" width="300" height="120" rx="8" fill="#fce7f3" class="box"/><text x="1360" y="155" text-anchor="middle" class="t">MAP_PRIVATE</text><text x="1360" y="187" text-anchor="middle" class="s">reads may use cached page</text><text x="1360" y="212" text-anchor="middle" class="s">writes diverge through COW</text>

  <rect x="500" y="365" width="600" height="190" rx="8" fill="#fef3c7" class="box"/><text x="800" y="407" text-anchor="middle" class="t">Page cache: file identity + offset -> resident folio</text>
  <g class="box"><rect x="555" y="445" width="145" height="62" rx="5" fill="#fff7ed"/><rect x="725" y="445" width="145" height="62" rx="5" fill="#ffedd5"/><rect x="895" y="445" width="145" height="62" rx="5" fill="#fff7ed"/></g>
  <text x="627" y="482" text-anchor="middle" class="s">offset 0</text><text x="797" y="482" text-anchor="middle" class="s">offset 4 KiB, dirty</text><text x="967" y="482" text-anchor="middle" class="s">offset 8 KiB</text>
  <path d="M240 235 V300 H650 V365" class="line"/><path d="M800 235 V365" class="line"/><path d="M1360 235 V300 H950 V365" class="line"/>
  <rect x="1210" y="390" width="300" height="120" rx="8" fill="#ede9fe" class="box"/><text x="1360" y="430" text-anchor="middle" class="t">Private anonymous page</text><text x="1360" y="462" text-anchor="middle" class="s">created only after a private write</text><text x="1360" y="487" text-anchor="middle" class="s">does not update the file object</text>
  <path d="M1360 235 V390" class="private"/>

  <rect x="565" y="690" width="470" height="105" rx="8" fill="#e0f2fe" class="box"/><text x="800" y="730" text-anchor="middle" class="t">Filesystem and durable storage</text><text x="800" y="762" text-anchor="middle" class="s">dirty pages require writeback; durability needs an explicit contract</text>
  <path d="M800 555 V690" class="line"/>
  <rect x="90" y="680" width="340" height="125" rx="8" fill="#f1f5f9" class="box"/><text x="260" y="720" text-anchor="middle" class="t">Important boundary</text><text x="260" y="752" text-anchor="middle" class="s">resident does not mean durable</text><text x="260" y="779" text-anchor="middle" class="s">and mapped does not mean resident</text>
</svg>
