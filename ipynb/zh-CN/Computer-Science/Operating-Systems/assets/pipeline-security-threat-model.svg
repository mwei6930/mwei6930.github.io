<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Threat model for the running shell pipeline</title>
  <desc id="desc">The shell pipeline cat input.txt pipe grep kernel to result.txt is annotated with assets, trust boundaries, security checks, attacks and defenses.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#46596d"/></marker></defs>
  <style>text{font-family:Arial,sans-serif;fill:#172235}.title{font-size:28px;font-weight:700}.head{font-size:18px;font-weight:700}.body{font-size:15px}.small{font-size:13px;fill:#526274}.box{stroke:#65788b;stroke-width:2}.arrow{stroke:#46596d;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.boundary{stroke:#9b55cf;stroke-width:2.5;stroke-dasharray:10 8;fill:none}</style>
  <rect width="1200" height="760" fill="#f7f9fb"/><text x="600" y="42" text-anchor="middle" class="title">Threat-model the pipeline as identities, handles, boundaries, and effects</text>
  <rect x="45" y="80" width="1110" height="315" rx="8" fill="#fff" class="box"/><text x="75" y="112" class="head">Execution and data flow</text>
  <rect x="75" y="155" width="190" height="135" rx="8" fill="#e6f0ff" class="box"/><text x="170" y="187" text-anchor="middle" class="head">shell</text><text x="170" y="220" text-anchor="middle" class="body">user credentials</text><text x="170" y="248" text-anchor="middle" class="body">opens 3 objects</text><text x="170" y="274" text-anchor="middle" class="small">fork, fd wiring, exec</text>
  <rect x="330" y="155" width="190" height="135" rx="8" fill="#fff2d5" class="box"/><text x="425" y="187" text-anchor="middle" class="head">cat</text><text x="425" y="220" text-anchor="middle" class="body">fd 3: input read</text><text x="425" y="248" text-anchor="middle" class="body">fd 1: pipe write</text><text x="425" y="274" text-anchor="middle" class="small">no output pathname needed</text>
  <rect x="585" y="155" width="190" height="135" rx="8" fill="#eee9ff" class="box"/><text x="680" y="187" text-anchor="middle" class="head">pipe</text><text x="680" y="220" text-anchor="middle" class="body">kernel buffer</text><text x="680" y="248" text-anchor="middle" class="body">read/write endpoints</text><text x="680" y="274" text-anchor="middle" class="small">backpressure + EOF</text>
  <rect x="840" y="155" width="190" height="135" rx="8" fill="#e5f7ed" class="box"/><text x="935" y="187" text-anchor="middle" class="head">grep</text><text x="935" y="220" text-anchor="middle" class="body">fd 0: pipe read</text><text x="935" y="248" text-anchor="middle" class="body">fd 4: result write</text><text x="935" y="274" text-anchor="middle" class="small">pattern is untrusted data</text>
  <path d="M265 222H330M520 222H585M775 222H840" class="arrow"/>
  <rect x="330" y="320" width="190" height="45" rx="8" fill="#dff4f5" class="box"/><text x="425" y="348" text-anchor="middle" class="small">input.txt inode + ACL</text><rect x="840" y="320" width="190" height="45" rx="8" fill="#dff4f5" class="box"/><text x="935" y="348" text-anchor="middle" class="small">result.txt parent + inode</text>
  <path d="M425 290V320M935 290V320" class="arrow"/>
  <rect x="45" y="430" width="535" height="250" rx="8" fill="#ffe6e3" class="box"/><text x="312" y="465" text-anchor="middle" class="head">Representative threats</text><text x="80" y="507" class="body">1. input or output path is swapped through a symlink race</text><text x="80" y="540" class="body">2. inherited descriptor leaks a secret into cat or grep</text><text x="80" y="573" class="body">3. malicious input triggers a parser/memory bug</text><text x="80" y="606" class="body">4. fork/input exhausts PIDs, memory, CPU or disk</text><text x="80" y="639" class="body">5. forged/missing logs hide who changed result.txt</text>
  <rect x="620" y="430" width="535" height="250" rx="8" fill="#e5f7ed" class="box"/><text x="887" y="465" text-anchor="middle" class="head">Composed controls</text><text x="655" y="507" class="body">1. shell opens with dirfd/openat2; workers receive stable fds</text><text x="655" y="540" class="body">2. O_CLOEXEC and explicit close/dup2 descriptor plan</text><text x="655" y="573" class="body">3. W^X/ASLR + least privilege + syscall/object sandbox</text><text x="655" y="606" class="body">4. cgroup CPU/memory/PID/I/O limits and disk quotas</text><text x="655" y="639" class="body">5. audit success/failure with AUID, inode, result and event ID</text>
  <path d="M600 415V695" class="boundary"/><text x="600" y="718" text-anchor="middle" class="small">threat -> control mapping</text>
  <rect x="185" y="705" width="830" height="38" rx="8" fill="#fff2d5" class="box"/><text x="600" y="730" text-anchor="middle" class="small">Security claim: under an unprivileged-input attacker and trusted kernel/storage assumptions, the pipeline reads only the selected input and writes only the selected output within bounded resources.</text>
</svg>
