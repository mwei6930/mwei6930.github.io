<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Seccomp BPF system call decision path</title>
  <desc id="desc">An animated system call request enters the kernel, is evaluated by a verified BPF filter over syscall metadata, then allowed, denied, logged, trapped, notified, or killed.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#46596d"/></marker></defs>
  <style>text{font-family:Arial,sans-serif;fill:#172235}.title{font-size:28px;font-weight:700}.head{font-size:18px;font-weight:700}.body{font-size:15px}.small{font-size:13px;fill:#526274}.box{stroke:#65788b;stroke-width:2}.arrow{stroke:#46596d;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style>
  <rect width="1200" height="700" fill="#f7f9fb"/><text x="600" y="42" text-anchor="middle" class="title">seccomp reduces the syscall surface; it does not express full object policy</text>
  <rect x="45" y="105" width="225" height="160" rx="8" fill="#e6f0ff" class="box"/><text x="157" y="139" text-anchor="middle" class="head">Sandboxed task</text><text x="157" y="177" text-anchor="middle" class="body">syscall number</text><text x="157" y="205" text-anchor="middle" class="body">architecture + IP</text><text x="157" y="233" text-anchor="middle" class="body">six raw arguments</text>
  <rect x="350" y="86" width="350" height="198" rx="8" fill="#eee9ff" class="box"/><text x="525" y="120" text-anchor="middle" class="head">Kernel seccomp filter chain</text><text x="525" y="157" text-anchor="middle" class="body">verified classic BPF program</text><text x="525" y="185" text-anchor="middle" class="body">cannot dereference user pointers</text><text x="525" y="213" text-anchor="middle" class="body">new filters can only add restrictions</text><rect x="395" y="232" width="260" height="34" rx="8" fill="#fff" class="box"/><text x="525" y="255" text-anchor="middle" class="small">usually requires no_new_privs = 1</text>
  <path d="M270 185H350" class="arrow"/><circle r="9" fill="#8a4ec2"><animateMotion dur="3.8s" repeatCount="indefinite" path="M270 185H350"/></circle>
  <rect x="790" y="72" width="160" height="82" rx="8" fill="#e5f7ed" class="box"/><text x="870" y="106" text-anchor="middle" class="head">ALLOW</text><text x="870" y="133" text-anchor="middle" class="small">normal syscall path</text>
  <rect x="980" y="72" width="160" height="82" rx="8" fill="#fff2d5" class="box"/><text x="1060" y="106" text-anchor="middle" class="head">LOG</text><text x="1060" y="133" text-anchor="middle" class="small">allow + audit signal</text>
  <rect x="790" y="187" width="160" height="82" rx="8" fill="#ffe6e3" class="box"/><text x="870" y="221" text-anchor="middle" class="head">ERRNO</text><text x="870" y="248" text-anchor="middle" class="small">return EPERM etc.</text>
  <rect x="980" y="187" width="160" height="82" rx="8" fill="#ffe6e3" class="box"/><text x="1060" y="221" text-anchor="middle" class="head">TRAP / KILL</text><text x="1060" y="248" text-anchor="middle" class="small">SIGSYS or terminate</text>
  <rect x="790" y="302" width="350" height="82" rx="8" fill="#dff4f5" class="box"/><text x="965" y="336" text-anchor="middle" class="head">USER_NOTIF</text><text x="965" y="363" text-anchor="middle" class="small">supervisor receives event and may reply; design races carefully</text>
  <path d="M700 150H760V113H790M700 170H760V113H980M700 205H760V228H790M700 225H760V228H980M700 245H740V343H790" class="arrow"/>
  <rect x="70" y="430" width="500" height="190" rx="8" fill="#e5f7ed" class="box"/><text x="320" y="464" text-anchor="middle" class="head">Good fit</text><text x="104" y="504" class="body">• remove unused kernel entry points</text><text x="104" y="535" class="body">• constrain syscall numbers and simple scalar arguments</text><text x="104" y="566" class="body">• make compromise less able to mount, trace, reboot or create sockets</text><text x="104" y="597" class="small">Start from observed needs, then test failure paths and ABI variants.</text>
  <rect x="630" y="430" width="500" height="190" rx="8" fill="#ffe6e3" class="box"/><text x="880" y="464" text-anchor="middle" class="head">Not sufficient alone</text><text x="664" y="504" class="body">• pathname and inode authorization</text><text x="664" y="535" class="body">• information-flow or network-destination policy</text><text x="664" y="566" class="body">• CPU, memory, PID or I/O resource budgets</text><text x="664" y="597" class="small">Combine with LSM/Landlock, namespaces, cgroups and least privilege.</text>
  <text x="600" y="665" text-anchor="middle" class="small">Filters inspect raw syscall metadata at entry; pointer contents can change and are intentionally unavailable to classic seccomp BPF.</text>
</svg>
