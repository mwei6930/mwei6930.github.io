<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850" role="img" aria-labelledby="title desc">
  <title id="title">Conceptual comparison of CFS virtual runtime and EEVDF eligibility</title>
  <desc id="desc">The left panel shows CFS selecting the runnable task with smallest weighted virtual runtime. The right panel shows EEVDF filtering tasks by nonnegative lag, then selecting the eligible task with earliest virtual deadline.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#374151"/></marker><style>.h{font:700 27px system-ui,sans-serif;fill:#111827}.t{font:600 18px system-ui,sans-serif;fill:#111827}.s{font:15px system-ui,sans-serif;fill:#374151}.box{stroke:#374151;stroke-width:2}.line{fill:none;stroke:#374151;stroke-width:3;marker-end:url(#arrow)}.a{fill:#93c5fd}.b{fill:#86efac}.c{fill:#fcd34d}.d{fill:#fca5a5}</style></defs>
  <rect width="1500" height="850" fill="#fff"/>
  <text x="750" y="44" text-anchor="middle" class="h">Fairness accounting evolves from virtual runtime to eligibility plus deadlines</text>
  <line x1="750" y1="80" x2="750" y2="790" stroke="#d1d5db" stroke-width="2"/>
  <text x="375" y="95" text-anchor="middle" class="t">CFS mental model</text>
  <text x="375" y="126" text-anchor="middle" class="s">Approximate an ideal processor shared continuously by weighted tasks.</text>
  <g transform="translate(90 175)">
    <text x="0" y="30" class="t">weighted virtual runtime (smaller is more underserved)</text>
    <line x1="20" y1="90" x2="560" y2="90" stroke="#111827" stroke-width="3"/>
    <g class="s" text-anchor="middle"><text x="20" y="122">0</text><text x="155" y="122">5</text><text x="290" y="122">10</text><text x="425" y="122">15</text><text x="560" y="122">20</text></g>
    <circle cx="128" cy="90" r="30" class="b" stroke="#15803d" stroke-width="3"/><text x="128" y="96" text-anchor="middle" class="t">B</text>
    <circle cx="236" cy="90" r="30" class="a" stroke="#1d4ed8" stroke-width="3"/><text x="236" y="96" text-anchor="middle" class="t">A</text>
    <circle cx="425" cy="90" r="30" class="c" stroke="#b45309" stroke-width="3"/><text x="425" y="96" text-anchor="middle" class="t">C</text>
    <path d="M128 145 V215" class="line"/><rect x="35" y="215" width="190" height="75" rx="8" fill="#dcfce7" class="box"/><text x="130" y="248" text-anchor="middle" class="t">pick B</text><text x="130" y="273" text-anchor="middle" class="s">smallest vruntime</text>
    <rect x="15" y="355" width="545" height="125" rx="8" fill="#f8fafc" class="box"/>
    <text x="287" y="392" text-anchor="middle" class="t">Weight changes the rate of virtual time</text>
    <text x="287" y="423" text-anchor="middle" class="s">A larger weight makes vruntime advance more slowly,</text><text x="287" y="448" text-anchor="middle" class="s">so the task receives a larger long-run CPU share.</text>
  </g>
  <text x="1125" y="95" text-anchor="middle" class="t">EEVDF mental model</text>
  <text x="1125" y="126" text-anchor="middle" class="s">First enforce eligibility, then prefer the earliest virtual deadline.</text>
  <g transform="translate(815 170)">
    <g class="t"><text x="0" y="30">task</text><text x="130" y="30">lag</text><text x="275" y="30">eligible?</text><text x="430" y="30">virtual deadline</text></g>
    <line x1="0" y1="45" x2="600" y2="45" stroke="#9ca3af"/>
    <rect x="260" y="58" width="95" height="45" rx="5" fill="#dcfce7" stroke="#15803d"/><rect x="260" y="108" width="95" height="45" rx="5" fill="#fee2e2" stroke="#dc2626"/><rect x="260" y="158" width="95" height="45" rx="5" fill="#dcfce7" stroke="#15803d"/>
    <g class="s"><text x="25" y="88">A</text><text x="145" y="88">+3</text><text x="300" y="88">yes</text><text x="475" y="88">42</text><text x="25" y="138">B</text><text x="145" y="138">-1</text><text x="300" y="138">no</text><text x="475" y="138">35</text><text x="25" y="188">C</text><text x="145" y="188">+1</text><text x="300" y="188">yes</text><text x="475" y="188">38</text></g>
    <path d="M305 215 V280" class="line"/><rect x="90" y="280" width="430" height="95" rx="8" fill="#eef2ff" class="box"/><text x="305" y="315" text-anchor="middle" class="t">eligible set = {A, C}</text><text x="305" y="344" text-anchor="middle" class="s">B has an earlier deadline but has already received extra service.</text>
    <path d="M305 375 V430" class="line"/><rect x="180" y="430" width="250" height="80" rx="8" fill="#fef3c7" class="box"/><text x="305" y="464" text-anchor="middle" class="t">pick C</text><text x="305" y="490" text-anchor="middle" class="s">earliest eligible VD = 38</text>
  </g>
  <rect x="165" y="765" width="1170" height="55" rx="8" fill="#f8fafc" class="box"/>
  <text x="750" y="799" text-anchor="middle" class="s">Conceptual view only: production Linux includes wakeup placement, hierarchy, bandwidth control, multicore balancing, and implementation details beyond this figure.</text>
</svg>
