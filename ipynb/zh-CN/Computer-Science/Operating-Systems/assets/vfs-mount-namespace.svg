<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="900" viewBox="0 0 1700 900" role="img" aria-labelledby="title desc">
  <title id="title">Virtual file system and mount namespace</title>
  <desc id="desc">Two processes have different mount namespaces. The same pathname crosses different mount tables, while VFS dentries, inodes, file objects, and superblocks dispatch to ext4, tmpfs, procfs, or another implementation.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#334155"/></marker><style>.h{font:700 30px system-ui,sans-serif;fill:#111827}.t{font:700 18px system-ui,sans-serif;fill:#111827}.s{font:14px system-ui,sans-serif;fill:#334155}.box{stroke:#334155;stroke-width:2}.line{fill:none;stroke:#334155;stroke-width:3;marker-end:url(#a)}.ns1{fill:none;stroke:#2563eb;stroke-width:4;marker-end:url(#a)}.ns2{fill:none;stroke:#7c3aed;stroke-width:4;marker-end:url(#a)}</style></defs>
  <rect width="1700" height="900" fill="#fff"/><text x="850" y="48" text-anchor="middle" class="h">The VFS unifies operations; a mount namespace chooses the visible tree</text>
  <rect x="70" y="95" width="390" height="220" rx="8" fill="#eff6ff" class="box"/><text x="265" y="137" text-anchor="middle" class="t">Process A</text><text x="120" y="180" class="s">root: namespace A /</text><text x="120" y="212" class="s">cwd: /home/ana</text><text x="120" y="244" class="s">/work mounted from ext4 volume X</text><text x="120" y="276" class="s">/proc mounted from procfs</text>
  <rect x="70" y="390" width="390" height="220" rx="8" fill="#f5f3ff" class="box"/><text x="265" y="432" text-anchor="middle" class="t">Process B (container-like view)</text><text x="120" y="475" class="s">root: namespace B /</text><text x="120" y="507" class="s">cwd: /app</text><text x="120" y="539" class="s">/work mounted from tmpfs Y</text><text x="120" y="571" class="s">different /proc instance/view</text>

  <rect x="600" y="120" width="470" height="180" rx="8" fill="#e0f2fe" class="box"/><text x="835" y="160" text-anchor="middle" class="t">Path walk: dentry + mount pair</text><text x="650" y="205" class="s">component lookup uses dentry/inode cache</text><text x="650" y="237" class="s">mount table can replace the next visible root</text><text x="650" y="269" class="s">references stabilize concurrent traversal</text>
  <path d="M460 220 H600" class="ns1"/><path d="M460 500 H540 V260 H600" class="ns2"/>

  <rect x="600" y="385" width="470" height="250" rx="8" fill="#f8fafc" class="box"/><text x="835" y="425" text-anchor="middle" class="t">Common VFS objects</text>
  <rect x="650" y="465" width="170" height="60" rx="6" fill="#dbeafe" class="box"/><text x="735" y="502" text-anchor="middle" class="s">file object</text>
  <rect x="850" y="465" width="170" height="60" rx="6" fill="#ede9fe" class="box"/><text x="935" y="502" text-anchor="middle" class="s">dentry + inode</text>
  <rect x="650" y="550" width="170" height="60" rx="6" fill="#fef3c7" class="box"/><text x="735" y="587" text-anchor="middle" class="s">superblock</text>
  <rect x="850" y="550" width="170" height="60" rx="6" fill="#dcfce7" class="box"/><text x="935" y="587" text-anchor="middle" class="s">address_space/cache</text>
  <path d="M835 300 V385" class="line"/>

  <rect x="1210" y="95" width="410" height="660" rx="8" fill="#fff7ed" class="box"/><text x="1415" y="137" text-anchor="middle" class="t">Filesystem implementations</text>
  <rect x="1260" y="190" width="310" height="90" rx="8" fill="#ffedd5" class="box"/><text x="1415" y="227" text-anchor="middle" class="t">ext4 / XFS / Btrfs</text><text x="1415" y="255" text-anchor="middle" class="s">persistent local storage</text>
  <rect x="1260" y="330" width="310" height="90" rx="8" fill="#dcfce7" class="box"/><text x="1415" y="367" text-anchor="middle" class="t">tmpfs</text><text x="1415" y="395" text-anchor="middle" class="s">memory-backed filesystem</text>
  <rect x="1260" y="470" width="310" height="90" rx="8" fill="#ede9fe" class="box"/><text x="1415" y="507" text-anchor="middle" class="t">procfs / sysfs</text><text x="1415" y="535" text-anchor="middle" class="s">kernel-generated namespace</text>
  <rect x="1260" y="610" width="310" height="90" rx="8" fill="#cffafe" class="box"/><text x="1415" y="647" text-anchor="middle" class="t">NFS / FUSE / overlay</text><text x="1415" y="675" text-anchor="middle" class="s">remote or composed backends</text>
  <path d="M1070 505 H1150 V235 H1260" class="line"/><path d="M1150 375 H1260" class="line"/><path d="M1150 515 H1260" class="line"/><path d="M1150 655 H1260" class="line"/>
  <rect x="250" y="780" width="1200" height="70" rx="8" fill="#f8fafc" class="box"/><text x="850" y="822" text-anchor="middle" class="s">Mount namespaces change pathname visibility; they do not duplicate the underlying storage object unless a different filesystem is mounted.</text>
</svg>
