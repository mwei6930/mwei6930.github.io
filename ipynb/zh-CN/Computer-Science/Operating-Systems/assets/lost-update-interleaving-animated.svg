<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">Lost update caused by a legal instruction interleaving</title>
  <desc id="desc">Two threads each load counter zero, compute one, and store one. Every individual instruction completes, but the final counter is one instead of two.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#374151"/></marker>
    <style>.h{font:700 28px system-ui,sans-serif;fill:#111827}.t{font:600 18px system-ui,sans-serif;fill:#111827}.s{font:15px system-ui,sans-serif;fill:#374151}.lane{stroke:#9ca3af;stroke-width:2;stroke-dasharray:7 7}.box{stroke:#374151;stroke-width:2}.line{fill:none;stroke:#374151;stroke-width:3;marker-end:url(#arrow)}.step{fill:#fef3c7;stroke:#b45309;stroke-width:3;opacity:.18;animation:walk 7s steps(7,end) infinite}@keyframes walk{0%{transform:translateY(0)}14%{transform:translateY(90px)}28%{transform:translateY(180px)}42%{transform:translateY(270px)}57%{transform:translateY(360px)}71%{transform:translateY(450px)}85%,100%{transform:translateY(540px)}}@media(prefers-reduced-motion:reduce){.step{animation:none;transform:translateY(540px);opacity:.12}}</style>
  </defs>
  <rect width="1500" height="900" fill="#fff"/>
  <text x="750" y="45" text-anchor="middle" class="h">counter++ is a read-modify-write sequence, not one indivisible action</text>
  <g class="t" text-anchor="middle"><text x="310" y="100">Thread A</text><text x="750" y="100">Shared memory</text><text x="1190" y="100">Thread B</text></g>
  <line x1="310" y1="125" x2="310" y2="760" class="lane"/><line x1="750" y1="125" x2="750" y2="760" class="lane"/><line x1="1190" y1="125" x2="1190" y2="760" class="lane"/>
  <rect x="80" y="138" width="1340" height="68" rx="7" class="step"/>
  <rect x="655" y="135" width="190" height="60" rx="7" fill="#e0f2fe" class="box"/><text x="750" y="172" text-anchor="middle" class="t">counter = 0</text>
  <rect x="165" y="225" width="290" height="60" rx="7" fill="#dbeafe" class="box"/><text x="310" y="262" text-anchor="middle" class="t">rA = load(counter) -> 0</text><path d="M655 255 H455" class="line"/>
  <rect x="1045" y="315" width="290" height="60" rx="7" fill="#dcfce7" class="box"/><text x="1190" y="352" text-anchor="middle" class="t">rB = load(counter) -> 0</text><path d="M845 345 H1045" class="line"/>
  <rect x="165" y="405" width="290" height="60" rx="7" fill="#dbeafe" class="box"/><text x="310" y="442" text-anchor="middle" class="t">rA = rA + 1 -> 1</text>
  <rect x="1045" y="495" width="290" height="60" rx="7" fill="#dcfce7" class="box"/><text x="1190" y="532" text-anchor="middle" class="t">rB = rB + 1 -> 1</text>
  <rect x="165" y="585" width="290" height="60" rx="7" fill="#dbeafe" class="box"/><text x="310" y="622" text-anchor="middle" class="t">store(counter, rA)</text><path d="M455 615 H655" class="line"/>
  <rect x="655" y="585" width="190" height="60" rx="7" fill="#bfdbfe" class="box"/><text x="750" y="622" text-anchor="middle" class="t">counter = 1</text>
  <rect x="1045" y="675" width="290" height="60" rx="7" fill="#dcfce7" class="box"/><text x="1190" y="712" text-anchor="middle" class="t">store(counter, rB)</text><path d="M1045 705 H845" class="line"/>
  <rect x="655" y="675" width="190" height="60" rx="7" fill="#fee2e2" class="box"/><text x="750" y="712" text-anchor="middle" class="t">counter = 1</text>
  <rect x="285" y="790" width="930" height="70" rx="8" fill="#fee2e2" class="box"/>
  <text x="750" y="820" text-anchor="middle" class="t">Expected 2, observed 1: both threads used a stale snapshot</text>
  <text x="750" y="846" text-anchor="middle" class="s">The highlighted band advances through one possible schedule; many other schedules produce the correct result by accident.</text>
</svg>
