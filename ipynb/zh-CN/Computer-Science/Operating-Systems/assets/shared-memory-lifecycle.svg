<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1540 850" role="img" aria-labelledby="title desc">
  <title id="title">POSIX shared memory lifecycle and protocol responsibilities</title>
  <desc id="desc">Four stages show creating and sizing a named shared-memory object, mapping it into two processes, coordinating publication and reuse, and unmapping, closing, and unlinking it.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#355070"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17212b; }
      .title { font-size: 32px; font-weight: 700; }
      .section { font-size: 22px; font-weight: 700; }
      .head { font-size: 18px; font-weight: 700; }
      .body { font-size: 16px; }
      .small { font-size: 14px; }
      .panel { stroke: #355070; stroke-width: 2.3; rx: 9; }
      .line { stroke: #355070; stroke-width: 2.7; fill: none; marker-end: url(#arrow); }
      .map { stroke: #2a9d8f; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1540" height="850" fill="#fff"/>
  <text x="770" y="48" text-anchor="middle" class="title">Shared Memory Has an Object Lifecycle and a Data Protocol</text>

  <rect x="35" y="100" width="340" height="650" class="panel" fill="#f8fafb"/>
  <text x="205" y="143" text-anchor="middle" class="section">Create and size</text>
  <rect x="80" y="195" width="250" height="90" class="panel" fill="#e9f2fb"/>
  <text x="205" y="230" text-anchor="middle" class="head">shm_open(name, flags)</text>
  <text x="205" y="258" text-anchor="middle" class="small">returns a file descriptor</text>
  <path d="M205 285 L205 335" class="line"/>
  <rect x="80" y="335" width="250" height="90" class="panel" fill="#fff3d9"/>
  <text x="205" y="370" text-anchor="middle" class="head">ftruncate(fd, size)</text>
  <text x="205" y="398" text-anchor="middle" class="small">new objects begin at length zero</text>
  <path d="M205 425 L205 475" class="line"/>
  <rect x="80" y="475" width="250" height="115" class="panel" fill="#edf5e8"/>
  <text x="205" y="512" text-anchor="middle" class="head">named kernel object</text>
  <text x="205" y="545" text-anchor="middle" class="body">permissions + size</text>
  <text x="205" y="573" text-anchor="middle" class="body">page-backed storage</text>
  <text x="205" y="650" text-anchor="middle" class="small">The name discovers the object;</text>
  <text x="205" y="674" text-anchor="middle" class="small">it is not the mapped address.</text>

  <rect x="410" y="100" width="340" height="650" class="panel" fill="#f8fafb"/>
  <text x="580" y="143" text-anchor="middle" class="section">Map into processes</text>
  <rect x="445" y="190" width="125" height="210" class="panel" fill="#e9f2fb"/>
  <text x="507" y="225" text-anchor="middle" class="head">Process A</text>
  <rect x="465" y="275" width="85" height="80" class="panel" fill="#e6f5ef"/>
  <text x="507" y="309" text-anchor="middle" class="body">mapping</text>
  <text x="507" y="336" text-anchor="middle" class="small">VA 0xA...</text>
  <rect x="590" y="190" width="125" height="210" class="panel" fill="#edf5e8"/>
  <text x="652" y="225" text-anchor="middle" class="head">Process B</text>
  <rect x="610" y="275" width="85" height="80" class="panel" fill="#e6f5ef"/>
  <text x="652" y="309" text-anchor="middle" class="body">mapping</text>
  <text x="652" y="336" text-anchor="middle" class="small">VA 0xB...</text>
  <rect x="480" y="485" width="200" height="125" class="panel" fill="#fff3d9"/>
  <text x="580" y="522" text-anchor="middle" class="head">same physical frames</text>
  <text x="580" y="558" text-anchor="middle" class="body">MAP_SHARED</text>
  <text x="580" y="585" text-anchor="middle" class="small">updates can become visible</text>
  <path d="M507 355 L535 485" class="map"/><path d="M652 355 L625 485" class="map"/>
  <text x="580" y="665" text-anchor="middle" class="small">Virtual addresses need not match.</text>

  <rect x="785" y="100" width="340" height="650" class="panel" fill="#f8fafb"/>
  <text x="955" y="143" text-anchor="middle" class="section">Define a protocol</text>
  <rect x="825" y="190" width="260" height="145" class="panel" fill="#fdebea"/>
  <text x="955" y="228" text-anchor="middle" class="head">Data layout</text>
  <text x="955" y="266" text-anchor="middle" class="body">header, version, lengths</text>
  <text x="955" y="300" text-anchor="middle" class="body">ring indices and payload slots</text>
  <rect x="825" y="380" width="260" height="145" class="panel" fill="#fff3d9"/>
  <text x="955" y="418" text-anchor="middle" class="head">Publication rules</text>
  <text x="955" y="456" text-anchor="middle" class="body">who owns each slot?</text>
  <text x="955" y="490" text-anchor="middle" class="body">when is data visible and reusable?</text>
  <rect x="825" y="570" width="260" height="100" class="panel" fill="#e6f5ef"/>
  <text x="955" y="608" text-anchor="middle" class="head">Wakeup mechanism</text>
  <text x="955" y="643" text-anchor="middle" class="body">semaphore, futex, eventfd, signal</text>
  <text x="955" y="708" text-anchor="middle" class="small">Memory visibility and sleeping are separate concerns.</text>

  <rect x="1160" y="100" width="345" height="650" class="panel" fill="#f8fafb"/>
  <text x="1332" y="143" text-anchor="middle" class="section">Release references</text>
  <rect x="1205" y="205" width="255" height="90" class="panel" fill="#e9f2fb"/>
  <text x="1332" y="240" text-anchor="middle" class="head">munmap(address, size)</text>
  <text x="1332" y="268" text-anchor="middle" class="small">remove one process mapping</text>
  <path d="M1332 295 L1332 345" class="line"/>
  <rect x="1205" y="345" width="255" height="90" class="panel" fill="#fff3d9"/>
  <text x="1332" y="380" text-anchor="middle" class="head">close(fd)</text>
  <text x="1332" y="408" text-anchor="middle" class="small">release the descriptor reference</text>
  <path d="M1332 435 L1332 485" class="line"/>
  <rect x="1205" y="485" width="255" height="105" class="panel" fill="#fdebea"/>
  <text x="1332" y="521" text-anchor="middle" class="head">shm_unlink(name)</text>
  <text x="1332" y="553" text-anchor="middle" class="body">remove discovery name</text>
  <text x="1332" y="578" text-anchor="middle" class="small">existing mappings can remain valid</text>
  <text x="1332" y="650" text-anchor="middle" class="small">Storage disappears only after the</text>
  <text x="1332" y="674" text-anchor="middle" class="small">name and all live references are gone.</text>

  <path d="M375 425 L410 425" class="line"/><path d="M750 425 L785 425" class="line"/><path d="M1125 425 L1160 425" class="line"/>
  <text x="770" y="810" text-anchor="middle" class="body">Correct cleanup requires distinguishing the name, descriptor, mapping, and underlying storage lifetime.</text>
</svg>
