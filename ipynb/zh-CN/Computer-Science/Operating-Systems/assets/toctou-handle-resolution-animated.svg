<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">TOCTOU pathname race versus stable handle resolution</title>
  <desc id="desc">The top timeline shows an attacker swapping a pathname between access and open; the bottom shows one constrained openat2 resolution returning a stable descriptor.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#46596d"/></marker></defs>
  <style>text{font-family:Arial,sans-serif;fill:#172235}.title{font-size:28px;font-weight:700}.head{font-size:18px;font-weight:700}.body{font-size:15px}.small{font-size:13px;fill:#526274}.box{stroke:#65788b;stroke-width:2}.arrow{stroke:#46596d;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.time{stroke:#46596d;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
  <rect width="1200" height="720" fill="#f7f9fb"/><text x="600" y="42" text-anchor="middle" class="title">A pathname can change after a check; an opened handle binds one object</text>
  <rect x="45" y="82" width="1110" height="260" rx="8" fill="#ffe9e6" class="box"/><text x="75" y="116" class="head">Vulnerable: separate check and use</text>
  <text x="90" y="160" class="body">Victim (privileged)</text><text x="90" y="257" class="body">Attacker</text>
  <path d="M240 158H1095M240 255H1095" class="time"/>
  <rect x="285" y="129" width="185" height="60" rx="8" fill="#fff" class="box"/><text x="377" y="155" text-anchor="middle" class="body">access(path, W_OK)</text><text x="377" y="177" text-anchor="middle" class="small">checks benign inode A</text>
  <rect x="690" y="129" width="185" height="60" rx="8" fill="#fff2d5" class="box"/><text x="782" y="155" text-anchor="middle" class="body">open(path, O_WRONLY)</text><text x="782" y="177" text-anchor="middle" class="small">resolves secret inode B</text>
  <rect x="480" y="226" width="190" height="60" rx="8" fill="#fff" class="box"/><text x="575" y="252" text-anchor="middle" class="body">replace path with symlink</text><text x="575" y="274" text-anchor="middle" class="small">A -> protected object B</text>
  <path d="M575 226V198" stroke="#c84c4c" stroke-width="3" marker-end="url(#arrow)"/><circle r="9" fill="#c84c4c"><animateMotion dur="4s" repeatCount="indefinite" path="M470 255H690"/></circle>
  <text x="995" y="309" text-anchor="end" class="small">The check was true, but it described a different object.</text>
  <rect x="45" y="380" width="1110" height="260" rx="8" fill="#e5f7ed" class="box"/><text x="75" y="414" class="head">Safer: constrain resolution and continue through descriptors</text>
  <rect x="90" y="466" width="220" height="105" rx="8" fill="#e6f0ff" class="box"/><text x="200" y="497" text-anchor="middle" class="body">trusted parent dirfd</text><text x="200" y="526" text-anchor="middle" class="body">/safe/output</text><text x="200" y="553" text-anchor="middle" class="small">opened before untrusted work</text>
  <rect x="392" y="451" width="300" height="135" rx="8" fill="#eee9ff" class="box"/><text x="542" y="482" text-anchor="middle" class="body">openat2(dirfd, relative_name)</text><text x="542" y="511" text-anchor="middle" class="small">RESOLVE_BENEATH</text><text x="542" y="535" text-anchor="middle" class="small">RESOLVE_NO_SYMLINKS</text><text x="542" y="559" text-anchor="middle" class="small">O_NOFOLLOW | minimal open mode</text>
  <rect x="780" y="466" width="285" height="105" rx="8" fill="#fff2d5" class="box"/><text x="922" y="497" text-anchor="middle" class="body">stable file descriptor</text><text x="922" y="526" text-anchor="middle" class="body">fstat/read/write same object</text><text x="922" y="553" text-anchor="middle" class="small">rename of path cannot retarget fd</text>
  <path d="M310 518H392M692 518H780" class="arrow"/><circle r="9" fill="#1b8a73"><animateMotion dur="4s" repeatCount="indefinite" path="M310 518H780"/></circle>
  <rect x="190" y="661" width="820" height="38" rx="8" fill="#fff" class="box"/><text x="600" y="686" text-anchor="middle" class="small">Prefer atomic kernel APIs, directory-relative operations, O_EXCL, O_NOFOLLOW/openat2 constraints, and post-open fstat when identity properties matter.</text>
</svg>
