<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">cgroup v2 hierarchical resource governance</title>
  <desc id="desc">A cgroup hierarchy distributes CPU, memory, PIDs and I/O limits, protections and weights to child workloads, with usage and pressure feedback.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#46596d"/></marker></defs>
  <style>text{font-family:Arial,sans-serif;fill:#172235}.title{font-size:28px;font-weight:700}.head{font-size:18px;font-weight:700}.body{font-size:15px}.small{font-size:13px;fill:#526274}.box{stroke:#65788b;stroke-width:2}.line{stroke:#46596d;stroke-width:2.5;fill:none}.arrow{stroke:#16817a;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style>
  <rect width="1200" height="720" fill="#f7f9fb"/><text x="600" y="42" text-anchor="middle" class="title">cgroup v2 controls resource distribution along one hierarchy</text>
  <rect x="410" y="78" width="380" height="92" rx="8" fill="#e6f0ff" class="box"/><text x="600" y="109" text-anchor="middle" class="head">root cgroup</text><text x="600" y="137" text-anchor="middle" class="body">controllers enabled for descendants</text><text x="600" y="158" text-anchor="middle" class="small">a child cannot escape ancestor constraints</text>
  <path d="M600 170V214M600 214H275V250M600 214H600V250M600 214H925V250" class="line"/>
  <rect x="100" y="250" width="350" height="180" rx="8" fill="#e5f7ed" class="box"/><text x="275" y="282" text-anchor="middle" class="head">interactive.slice</text><text x="135" y="320" class="body">cpu.weight = 200</text><text x="135" y="349" class="body">memory.low = protected working set</text><text x="135" y="378" class="body">pids.max = 4096</text><text x="135" y="407" class="small">relative service quality, not fixed reservation</text>
  <rect x="425" y="250" width="350" height="180" rx="8" fill="#fff2d5" class="box"/><text x="600" y="282" text-anchor="middle" class="head">batch.slice</text><text x="460" y="320" class="body">cpu.max = quota / period</text><text x="460" y="349" class="body">memory.high = reclaim pressure</text><text x="460" y="378" class="body">io.max = BPS / IOPS ceiling</text><text x="460" y="407" class="small">throttle before one job dominates the host</text>
  <rect x="750" y="250" width="350" height="180" rx="8" fill="#eee9ff" class="box"/><text x="925" y="282" text-anchor="middle" class="head">sandbox.scope</text><text x="785" y="320" class="body">memory.max = hard limit</text><text x="785" y="349" class="body">pids.max = 64</text><text x="785" y="378" class="body">cpuset.cpus = allowed CPU set</text><text x="785" y="407" class="small">OOM and fork failure are part of the API contract</text>
  <rect x="80" y="495" width="300" height="132" rx="8" fill="#fff" class="box"/><text x="230" y="528" text-anchor="middle" class="head">Limits</text><text x="230" y="560" text-anchor="middle" class="body">maximum usable amount</text><text x="230" y="586" text-anchor="middle" class="small">memory.max, cpu.max, io.max</text><text x="230" y="610" text-anchor="middle" class="small">children cannot exceed ancestors</text>
  <rect x="450" y="495" width="300" height="132" rx="8" fill="#fff" class="box"/><text x="600" y="528" text-anchor="middle" class="head">Protections / weights</text><text x="600" y="560" text-anchor="middle" class="body">share or protect under contention</text><text x="600" y="586" text-anchor="middle" class="small">memory.low, cpu.weight, io.weight</text><text x="600" y="610" text-anchor="middle" class="small">not an unconditional capacity promise</text>
  <rect x="820" y="495" width="300" height="132" rx="8" fill="#dff4f5" class="box"/><text x="970" y="528" text-anchor="middle" class="head">Observation</text><text x="970" y="560" text-anchor="middle" class="body">usage, events and pressure</text><text x="970" y="586" text-anchor="middle" class="small">memory.events, cpu.stat, PSI</text><text x="970" y="610" text-anchor="middle" class="small">feeds policy and incident diagnosis</text>
  <path d="M925 430V470H970V495" class="arrow"/>
  <text x="600" y="681" text-anchor="middle" class="small">Resource containment supports availability, but it does not decide which files, sockets, syscalls or secrets a process may access.</text>
</svg>
