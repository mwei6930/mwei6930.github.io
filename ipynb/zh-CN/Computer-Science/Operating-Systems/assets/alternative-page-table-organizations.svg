<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="800" viewBox="0 0 1500 800" role="img" aria-labelledby="title desc">
  <title id="title">Hashed and inverted page-table organizations</title>
  <desc id="desc">A hashed page table maps an address-space identifier and virtual page number to a bucket chain. An inverted page table has one record per physical frame and records which process and virtual page owns each frame.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#374151"/></marker><style>.h{font:700 28px system-ui,sans-serif;fill:#111827}.t{font:600 18px system-ui,sans-serif;fill:#111827}.s{font:15px system-ui,sans-serif;fill:#374151}.box{stroke:#374151;stroke-width:2}.line{fill:none;stroke:#374151;stroke-width:3;marker-end:url(#arrow)}</style></defs>
  <rect width="1500" height="800" fill="#ffffff"/>
  <text x="750" y="44" text-anchor="middle" class="h">Alternative organizations change what page-table memory scales with</text>
  <line x1="750" y1="85" x2="750" y2="735" stroke="#cbd5e1" stroke-width="3"/>
  <text x="375" y="98" text-anchor="middle" class="t">Hashed page table: scale with populated mappings</text>
  <rect x="70" y="140" width="230" height="90" rx="8" fill="#dbeafe" class="box"/><text x="185" y="175" text-anchor="middle" class="t">lookup key</text><text x="185" y="205" text-anchor="middle" class="s">hash(ASID, VPN)</text>
  <path d="M300 185 H390" class="line"/>
  <rect x="390" y="125" width="155" height="340" rx="8" fill="#f8fafc" class="box"/><text x="468" y="158" text-anchor="middle" class="t">buckets</text>
  <rect x="420" y="185" width="95" height="46" rx="5" fill="#e5e7eb" class="box"/><text x="468" y="214" text-anchor="middle" class="s">0</text>
  <rect x="420" y="246" width="95" height="55" rx="5" fill="#fef3c7" class="box"/><text x="468" y="280" text-anchor="middle" class="t">bucket 1</text>
  <rect x="420" y="316" width="95" height="46" rx="5" fill="#e5e7eb" class="box"/><text x="468" y="345" text-anchor="middle" class="s">2</text>
  <rect x="420" y="377" width="95" height="46" rx="5" fill="#e5e7eb" class="box"/><text x="468" y="406" text-anchor="middle" class="s">3</text>
  <path d="M515 273 H565" class="line"/>
  <rect x="565" y="230" width="145" height="86" rx="8" fill="#dcfce7" class="box"/><text x="638" y="260" text-anchor="middle" class="s">ASID 7, VPN A</text><text x="638" y="286" text-anchor="middle" class="t">PFN 12</text>
  <path d="M638 316 V360" class="line"/>
  <rect x="565" y="360" width="145" height="86" rx="8" fill="#f3e8ff" class="box"/><text x="638" y="390" text-anchor="middle" class="s">ASID 3, VPN B</text><text x="638" y="416" text-anchor="middle" class="t">PFN 41</text>
  <rect x="100" y="535" width="550" height="135" rx="8" fill="#eef2ff" class="box"/><text x="375" y="573" text-anchor="middle" class="t">Tradeoff</text><text x="375" y="607" text-anchor="middle" class="s">Good for very large sparse address spaces, but collisions require</text><text x="375" y="634" text-anchor="middle" class="s">key comparison and chaining; hardware lookup becomes less regular.</text>

  <text x="1125" y="98" text-anchor="middle" class="t">Inverted page table: scale with physical frames</text>
  <rect x="810" y="135" width="240" height="95" rx="8" fill="#dbeafe" class="box"/><text x="930" y="170" text-anchor="middle" class="t">lookup request</text><text x="930" y="202" text-anchor="middle" class="s">(ASID 7, VPN A)</text>
  <path d="M1050 182 H1115" class="line"/>
  <rect x="1115" y="125" width="320" height="390" rx="8" fill="#f8fafc" class="box"/><text x="1275" y="159" text-anchor="middle" class="t">one record per physical frame</text>
  <rect x="1145" y="185" width="260" height="56" rx="5" fill="#e5e7eb" class="box"/><text x="1170" y="219" class="s">PFN 0</text><text x="1260" y="219" class="s">free</text>
  <rect x="1145" y="255" width="260" height="66" rx="5" fill="#dcfce7" class="box"/><text x="1170" y="281" class="s">PFN 1</text><text x="1260" y="281" class="s">ASID 7</text><text x="1260" y="306" class="s">VPN A</text>
  <rect x="1145" y="335" width="260" height="66" rx="5" fill="#f3e8ff" class="box"/><text x="1170" y="361" class="s">PFN 2</text><text x="1260" y="361" class="s">ASID 3</text><text x="1260" y="386" class="s">VPN B</text>
  <rect x="1145" y="415" width="260" height="56" rx="5" fill="#e5e7eb" class="box"/><text x="1170" y="449" class="s">PFN 3</text><text x="1260" y="449" class="s">ASID 2, VPN C</text>
  <rect x="850" y="535" width="550" height="135" rx="8" fill="#fff7ed" class="box"/><text x="1125" y="573" text-anchor="middle" class="t">Tradeoff</text><text x="1125" y="607" text-anchor="middle" class="s">Compact when virtual spaces dwarf RAM, but reverse lookup, shared</text><text x="1125" y="634" text-anchor="middle" class="s">pages, and multiple aliases need hashing or auxiliary structures.</text>
  <text x="750" y="748" text-anchor="middle" class="s">A hardware-managed radix tree is common today because its fixed walk is predictable; other designs remain useful conceptual alternatives.</text>
</svg>
