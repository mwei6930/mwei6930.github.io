<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">Access matrix projected into ACLs and capabilities</title>
  <desc id="desc">A sparse subject by object rights matrix is projected by object into ACLs and by subject into capability lists.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#46596d"/></marker></defs>
  <style>text{font-family:Arial,sans-serif;fill:#172235}.title{font-size:28px;font-weight:700}.head{font-size:19px;font-weight:700}.body{font-size:15px}.small{font-size:13px;fill:#526274}.box{stroke:#65788b;stroke-width:2}.grid{stroke:#7b8998;stroke-width:1.5}.arrow{stroke:#46596d;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style>
  <rect width="1200" height="690" fill="#f7f9fb"/><text x="600" y="42" text-anchor="middle" class="title">ACLs store matrix columns; capabilities store matrix rows</text>
  <text x="365" y="91" text-anchor="middle" class="head">Conceptual access matrix A[subject, object]</text>
  <rect x="80" y="115" width="570" height="330" fill="#fff" class="box"/>
  <rect x="80" y="115" width="150" height="72" fill="#e6f0ff" class="grid"/><text x="155" y="157" text-anchor="middle" class="body">Subject \ Object</text>
  <rect x="230" y="115" width="140" height="72" fill="#fff2d5" class="grid"/><text x="300" y="157" text-anchor="middle" class="body">input.txt</text>
  <rect x="370" y="115" width="140" height="72" fill="#fff2d5" class="grid"/><text x="440" y="157" text-anchor="middle" class="body">result.txt</text>
  <rect x="510" y="115" width="140" height="72" fill="#fff2d5" class="grid"/><text x="580" y="157" text-anchor="middle" class="body">pipe P</text>
  <rect x="80" y="187" width="150" height="86" fill="#e6f0ff" class="grid"/><text x="155" y="236" text-anchor="middle" class="body">shell</text>
  <rect x="80" y="273" width="150" height="86" fill="#e6f0ff" class="grid"/><text x="155" y="322" text-anchor="middle" class="body">cat</text>
  <rect x="80" y="359" width="150" height="86" fill="#e6f0ff" class="grid"/><text x="155" y="408" text-anchor="middle" class="body">grep</text>
  <g class="grid" fill="#fff"><rect x="230" y="187" width="140" height="86"/><rect x="370" y="187" width="140" height="86"/><rect x="510" y="187" width="140" height="86"/><rect x="230" y="273" width="140" height="86"/><rect x="370" y="273" width="140" height="86"/><rect x="510" y="273" width="140" height="86"/><rect x="230" y="359" width="140" height="86"/><rect x="370" y="359" width="140" height="86"/><rect x="510" y="359" width="140" height="86"/></g>
  <text x="300" y="235" text-anchor="middle" class="body">open:r</text><text x="440" y="235" text-anchor="middle" class="body">create:w</text><text x="580" y="235" text-anchor="middle" class="body">create, pass</text>
  <text x="300" y="321" text-anchor="middle" class="body">read</text><text x="440" y="321" text-anchor="middle" class="small">-</text><text x="580" y="321" text-anchor="middle" class="body">write</text>
  <text x="300" y="407" text-anchor="middle" class="small">-</text><text x="440" y="407" text-anchor="middle" class="body">write</text><text x="580" y="407" text-anchor="middle" class="body">read</text>
  <rect x="740" y="98" width="400" height="245" rx="8" fill="#e5f7ed" class="box"/><text x="940" y="132" text-anchor="middle" class="head">Object projection: ACL</text>
  <text x="775" y="170" class="body">result.txt</text><text x="775" y="203" class="body">shell : create, write</text><text x="775" y="236" class="body">grep  : write</text><text x="775" y="269" class="body">cat   : -</text><text x="775" y="310" class="small">Easy object-centric review and revocation.</text>
  <rect x="740" y="378" width="400" height="245" rx="8" fill="#eee9ff" class="box"/><text x="940" y="412" text-anchor="middle" class="head">Subject projection: capability list</text>
  <text x="775" y="450" class="body">grep holds:</text><text x="805" y="483" class="body">cap(pipe P, read)</text><text x="805" y="516" class="body">cap(result.txt, write)</text><text x="775" y="557" class="small">Natural delegation: pass a narrowed handle.</text><text x="775" y="581" class="small">Revocation needs indirection or bookkeeping.</text>
  <path d="M650 228H700V220H740M650 402H700V500H740" class="arrow"/>
  <text x="365" y="485" text-anchor="middle" class="small">The complete matrix is mostly empty; real systems store compact projections and derive entries from identity, groups, roles, labels, or handles.</text>
  <rect x="85" y="535" width="555" height="88" rx="8" fill="#fff" class="box"/><text x="362" y="568" text-anchor="middle" class="body">Naming authority is not automatically operation authority.</text><text x="362" y="595" text-anchor="middle" class="small">A pathname names an object; an ACL asks who you are. A capability both identifies an object and carries rights.</text>
</svg>
