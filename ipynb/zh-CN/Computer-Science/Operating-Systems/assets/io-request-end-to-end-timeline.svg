<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="960" viewBox="0 0 1800 960" role="img" aria-labelledby="title desc">
  <title id="title">End-to-end buffered file read through the I/O stack</title>
  <desc id="desc">A swimlane timeline follows a cache-missing regular-file read from userspace through the system call, page cache, block layer, driver, controller, DMA completion and scheduler back to userspace.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#334155"/></marker><marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#0f766e"/></marker><style>.h{font:700 30px system-ui,sans-serif;fill:#111827}.t{font:700 17px system-ui,sans-serif;fill:#111827}.s{font:14px system-ui,sans-serif;fill:#334155}.lane{stroke:#cbd5e1;stroke-width:2}.line{fill:none;stroke:#334155;stroke-width:3;marker-end:url(#a)}.ret{fill:none;stroke:#0f766e;stroke-width:3;marker-end:url(#g)}.wait{fill:#fef3c7;stroke:#d97706;stroke-width:2}.run{fill:#dbeafe;stroke:#2563eb;stroke-width:2}.dev{fill:#cffafe;stroke:#0891b2;stroke-width:2}.done{fill:#dcfce7;stroke:#16a34a;stroke-width:2}</style></defs>
  <rect width="1800" height="960" fill="#fff"/><text x="900" y="48" text-anchor="middle" class="h">A cache-missing read is a pipeline, not one indivisible device delay</text>
  <text x="230" y="92" text-anchor="middle" class="t">Layer</text><text x="1030" y="92" text-anchor="middle" class="s">time →</text>
  <rect x="70" y="115" width="1660" height="100" fill="#eff6ff" class="lane"/><text x="230" y="170" text-anchor="middle" class="t">Application / scheduler</text>
  <rect x="70" y="215" width="1660" height="100" fill="#f8fafc" class="lane"/><text x="230" y="270" text-anchor="middle" class="t">System call + file object</text>
  <rect x="70" y="315" width="1660" height="100" fill="#fff7ed" class="lane"/><text x="230" y="370" text-anchor="middle" class="t">Page cache + block layer</text>
  <rect x="70" y="415" width="1660" height="100" fill="#f5f3ff" class="lane"/><text x="230" y="470" text-anchor="middle" class="t">Driver + DMA mapping</text>
  <rect x="70" y="515" width="1660" height="100" fill="#ecfeff" class="lane"/><text x="230" y="570" text-anchor="middle" class="t">Controller + device</text>
  <rect x="70" y="615" width="1660" height="100" fill="#f0fdf4" class="lane"/><text x="230" y="670" text-anchor="middle" class="t">Completion path</text>
  <line x1="385" y1="110" x2="385" y2="720" stroke="#94a3b8" stroke-width="2"/>

  <rect x="410" y="138" width="130" height="55" rx="6" class="run"/><text x="475" y="171" text-anchor="middle" class="s">read()</text>
  <path d="M540 165 V265 H590" class="line"/>
  <rect x="590" y="238" width="170" height="55" rx="6" class="run"/><text x="675" y="271" text-anchor="middle" class="s">fd + range checks</text>
  <path d="M760 265 V365 H810" class="line"/>
  <rect x="810" y="338" width="160" height="55" rx="6" class="wait"/><text x="890" y="371" text-anchor="middle" class="s">cache miss</text>
  <path d="M970 365 H1020 V465 H1070" class="line"/>
  <rect x="1070" y="438" width="220" height="55" rx="6" class="run"/><text x="1180" y="471" text-anchor="middle" class="s">map buffer + submit descriptor</text>
  <path d="M1290 465 H1330 V565 H1370" class="line"/>
  <rect x="1370" y="538" width="205" height="55" rx="6" class="dev"/><text x="1473" y="571" text-anchor="middle" class="s">device service + DMA</text>

  <rect x="970" y="138" width="455" height="55" rx="6" class="wait"/><text x="1198" y="171" text-anchor="middle" class="s">calling task sleeps; CPU executes other runnable work</text>
  <path d="M1575 565 H1630 V665 H1535" class="ret"/>
  <rect x="1310" y="638" width="225" height="55" rx="6" class="done"/><text x="1423" y="671" text-anchor="middle" class="s">IRQ/poll → finish request</text>
  <path d="M1310 665 H1170 V365 H970" class="ret"/>
  <rect x="1010" y="338" width="160" height="55" rx="6" class="done"/><text x="1090" y="371" text-anchor="middle" class="s">page becomes valid</text>
  <path d="M1010 365 H920 V265 H870" class="ret"/>
  <rect x="760" y="238" width="160" height="55" rx="6" class="done"/><text x="840" y="271" text-anchor="middle" class="s">copy to user</text>
  <path d="M760 265 H690 V165 H650" class="ret"/>
  <rect x="540" y="138" width="150" height="55" rx="6" class="done"/><text x="615" y="171" text-anchor="middle" class="s">return bytes</text>

  <rect x="110" y="775" width="1580" height="120" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="900" y="810" text-anchor="middle" class="t">Tread = Tentry + Tlookup + Tqueue + Tdevice + Tcompletion + Tcopy + Tschedule</text>
  <text x="900" y="842" text-anchor="middle" class="s">Terms can overlap across requests, and a cache hit ends before the block layer. O_DIRECT, mmap faults, and io_uring alter parts of the route.</text>
  <text x="900" y="872" text-anchor="middle" class="s">The file-system chapter explains how a byte offset is mapped to storage; this chapter focuses on transport, waiting and completion.</text>
  <text x="900" y="930" text-anchor="middle" class="s">The longest observed request may be dominated by queueing or scheduling even when the device's own service time is short.</text>
</svg>
