<svg xmlns="http://www.w3.org/2000/svg" width="1650" height="930" viewBox="0 0 1650 930" role="img" aria-labelledby="title desc">
  <title id="title">Linux memory observability workflow</title><desc id="desc">Start with a symptom, collect process, system, pressure, and locality views, correlate them over time, and test a hypothesis. No single RSS or free-memory number diagnoses memory behavior.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#334155"/></marker><style>.h{font:700 30px system-ui,sans-serif;fill:#111827}.t{font:700 18px system-ui,sans-serif;fill:#111827}.s{font:15px system-ui,sans-serif;fill:#334155}.mono{font:600 14px ui-monospace,monospace;fill:#111827}.box{stroke:#334155;stroke-width:2}.line{fill:none;stroke:#334155;stroke-width:3;marker-end:url(#a)}</style></defs>
  <rect width="1650" height="930" fill="#fff"/><text x="825" y="48" text-anchor="middle" class="h">Diagnose memory by triangulating scope, type, pressure, and time</text>
  <rect x="590" y="90" width="470" height="95" rx="8" fill="#fee2e2" class="box"/><text x="825" y="127" text-anchor="middle" class="t">Symptom</text><text x="825" y="158" text-anchor="middle" class="s">latency spike, OOM kill, swap activity, or unexpected footprint</text>

  <g transform="translate(70,275)">
    <rect width="340" height="245" rx="8" fill="#eff6ff" class="box"/><text x="170" y="40" text-anchor="middle" class="t">Process scope</text>
    <text x="30" y="84" class="mono">/proc/PID/smaps_rollup</text><text x="30" y="116" class="s">RSS, PSS, private/shared, swap</text>
    <text x="30" y="158" class="mono">/proc/PID/status</text><text x="30" y="190" class="s">VmSize, VmRSS, VmSwap, THP</text>
    <text x="30" y="224" class="s">Question: who owns the footprint?</text>
  </g>
  <g transform="translate(460,275)">
    <rect width="340" height="245" rx="8" fill="#ecfdf5" class="box"/><text x="170" y="40" text-anchor="middle" class="t">System scope</text>
    <text x="30" y="84" class="mono">/proc/meminfo</text><text x="30" y="116" class="s">available, cache, slab, commit, swap</text>
    <text x="30" y="158" class="mono">/proc/vmstat ; vmstat 1</text><text x="30" y="190" class="s">faults, scan, steal, swap in/out</text>
    <text x="30" y="224" class="s">Question: what is the kernel doing?</text>
  </g>
  <g transform="translate(850,275)">
    <rect width="340" height="245" rx="8" fill="#fff7ed" class="box"/><text x="170" y="40" text-anchor="middle" class="t">Pressure scope</text>
    <text x="30" y="84" class="mono">/proc/pressure/memory</text><text x="30" y="116" class="s">some/full stall time and trends</text>
    <text x="30" y="158" class="mono">cgroup memory.pressure</text><text x="30" y="190" class="s">service/container-local contention</text>
    <text x="30" y="224" class="s">Question: is progress being lost?</text>
  </g>
  <g transform="translate(1240,275)">
    <rect width="340" height="245" rx="8" fill="#fdf2f8" class="box"/><text x="170" y="40" text-anchor="middle" class="t">Placement scope</text>
    <text x="30" y="84" class="mono">numastat ; numa_maps</text><text x="30" y="116" class="s">local/remote pages and policy</text>
    <text x="30" y="158" class="mono">perf stat ; pidstat -r</text><text x="30" y="190" class="s">fault and hardware consequences</text>
    <text x="30" y="224" class="s">Question: where is data accessed?</text>
  </g>
  <path d="M825 185 V235 H240 V275" class="line"/><path d="M825 235 H630 V275" class="line"/><path d="M825 235 H1020 V275" class="line"/><path d="M825 235 H1410 V275" class="line"/>

  <rect x="295" y="630" width="1060" height="125" rx="8" fill="#f1f5f9" class="box"/><text x="825" y="669" text-anchor="middle" class="t">Correlate a time series and test one hypothesis</text><text x="825" y="703" text-anchor="middle" class="s">Example: RSS grows, reclaim scan rises, memory full PSI rises, and major faults follow -> active demand may exceed the budget.</text><text x="825" y="731" text-anchor="middle" class="s">A one-time snapshot cannot establish order or causality.</text>
  <path d="M240 520 V575 H825 V630" class="line"/><path d="M630 520 V575 H825" class="line"/><path d="M1020 520 V575 H825" class="line"/><path d="M1410 520 V575 H825" class="line"/>
  <rect x="410" y="830" width="830" height="62" rx="8" fill="#ecfeff" class="box"/><text x="825" y="869" text-anchor="middle" class="s">Capacity counters explain state; PSI and latency explain user-visible cost.</text>
</svg>
