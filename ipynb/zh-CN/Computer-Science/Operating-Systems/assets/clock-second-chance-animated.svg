<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">Clock second-chance page replacement</title><desc id="desc">A circular hand scans candidate frames. A referenced frame has its access bit cleared and receives a second chance. The first unreferenced eligible frame becomes the victim.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#dc2626"/></marker><style>.h{font:700 30px system-ui,sans-serif;fill:#111827}.t{font:700 18px system-ui,sans-serif;fill:#111827}.s{font:15px system-ui,sans-serif;fill:#334155}.box{stroke:#334155;stroke-width:2}.hand{stroke:#dc2626;stroke-width:6;marker-end:url(#a);transform-origin:580px 455px;animation:turn 6s steps(4,end) infinite}@keyframes turn{0%{transform:rotate(-90deg)}25%{transform:rotate(0deg)}50%{transform:rotate(90deg)}75%{transform:rotate(180deg)}100%{transform:rotate(270deg)}}.scan{animation:f 6s infinite}@keyframes f{0%,18%{fill:#fee2e2}19%,100%{fill:#f8fafc}}</style></defs>
  <rect width="1500" height="900" fill="#fff"/><text x="750" y="48" text-anchor="middle" class="h">Clock approximates recency with one bit and a moving hand</text>
  <circle cx="580" cy="455" r="280" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/>
  <g class="box"><rect x="480" y="105" width="200" height="105" rx="8" fill="#dbeafe"/><rect x="825" y="400" width="200" height="105" rx="8" fill="#dcfce7"/><rect x="480" y="700" width="200" height="105" rx="8" fill="#fff7ed"/><rect x="135" y="400" width="200" height="105" rx="8" class="scan"/></g>
  <text x="580" y="142" text-anchor="middle" class="t">Frame A</text><text x="580" y="177" text-anchor="middle" class="s">R = 1: clear and skip</text>
  <text x="925" y="437" text-anchor="middle" class="t">Frame B</text><text x="925" y="472" text-anchor="middle" class="s">R = 1: clear and skip</text>
  <text x="580" y="737" text-anchor="middle" class="t">Frame C</text><text x="580" y="772" text-anchor="middle" class="s">R = 1: clear and skip</text>
  <text x="235" y="437" text-anchor="middle" class="t">Frame D</text><text x="235" y="472" text-anchor="middle" class="s">R = 0: eligible victim</text>
  <line x1="580" y1="455" x2="580" y2="215" class="hand"/>
  <circle cx="580" cy="455" r="18" fill="#dc2626"/>

  <rect x="1090" y="145" width="330" height="545" rx="8" fill="#f1f5f9" class="box"/>
  <text x="1255" y="188" text-anchor="middle" class="t">On each scan step</text>
  <text x="1125" y="240" class="s">1. Ignore ineligible or pinned pages.</text>
  <text x="1125" y="292" class="s">2. If R = 1, set R = 0.</text>
  <text x="1125" y="344" class="s">3. Move the hand forward.</text>
  <text x="1125" y="396" class="s">4. If R = 0, select the page.</text>
  <text x="1125" y="470" class="t">Why this is an approximation</text>
  <text x="1125" y="512" class="s">R records at least one access since</text><text x="1125" y="540" class="s">the last clearing, not exact order.</text>
  <text x="1125" y="592" class="s">A recently cleared hot page can be</text><text x="1125" y="620" class="s">touched again and receive another chance.</text>
  <text x="1125" y="664" class="s">Dirty state may add writeback policy.</text>
  <rect x="210" y="838" width="1080" height="42" rx="8" fill="#ecfeff" class="box"/><text x="750" y="865" text-anchor="middle" class="s">Modern kernels use richer aging and generations, but the Clock loop exposes the hardware-software idea clearly.</text>
</svg>
