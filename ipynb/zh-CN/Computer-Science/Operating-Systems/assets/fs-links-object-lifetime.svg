<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="870" viewBox="0 0 1600 870" role="img" aria-labelledby="title desc">
  <title id="title">Names, links, open handles, and inode lifetime</title>
  <desc id="desc">Two hard-link directory entries point to one inode, a symbolic link stores a pathname, and an open file description keeps an unlinked inode alive until the last reference closes.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#334155"/></marker><style>.h{font:700 30px system-ui,sans-serif;fill:#111827}.t{font:700 18px system-ui,sans-serif;fill:#111827}.s{font:15px system-ui,sans-serif;fill:#334155}.box{stroke:#334155;stroke-width:2}.line{fill:none;stroke:#334155;stroke-width:3;marker-end:url(#a)}.soft{fill:none;stroke:#7c3aed;stroke-width:3;stroke-dasharray:9 7;marker-end:url(#a)}.dead{fill:none;stroke:#dc2626;stroke-width:3;stroke-dasharray:8 7}</style></defs>
  <rect width="1600" height="870" fill="#fff"/><text x="800" y="48" text-anchor="middle" class="h">A pathname names an object; it is not the object itself</text>
  <rect x="80" y="100" width="500" height="300" rx="8" fill="#eff6ff" class="box"/><text x="330" y="140" text-anchor="middle" class="t">Directory data</text>
  <rect x="130" y="185" width="400" height="65" rx="6" fill="#dbeafe" class="box"/><text x="190" y="225" class="t">report</text><text x="455" y="225" text-anchor="end" class="s">inode 42</text>
  <rect x="130" y="275" width="400" height="65" rx="6" fill="#dbeafe" class="box"/><text x="190" y="315" class="t">backup</text><text x="455" y="315" text-anchor="end" class="s">inode 42</text>
  <path d="M530 218 H765 V300" class="line"/><path d="M530 308 H765" class="line"/>

  <rect x="640" y="205" width="450" height="210" rx="8" fill="#fff7ed" class="box"/><text x="865" y="246" text-anchor="middle" class="t">Inode 42: the shared file object</text>
  <text x="690" y="286" class="s">type: regular file</text><text x="690" y="316" class="s">link count: 2</text><text x="690" y="346" class="s">size, owner, mode, timestamps</text><text x="690" y="376" class="s">extent/block map to contents</text>

  <rect x="1170" y="100" width="350" height="300" rx="8" fill="#f5f3ff" class="box"/><text x="1345" y="140" text-anchor="middle" class="t">Symbolic link inode 77</text>
  <rect x="1220" y="190" width="250" height="75" rx="6" fill="#ede9fe" class="box"/><text x="1345" y="220" text-anchor="middle" class="s">stored contents</text><text x="1345" y="248" text-anchor="middle" class="t">"../docs/report"</text>
  <path d="M1220 310 H1110 V218 H1090" class="soft"/><text x="1345" y="350" text-anchor="middle" class="s">resolved as another pathname</text>

  <rect x="100" y="520" width="380" height="130" rx="8" fill="#dcfce7" class="box"/><text x="290" y="560" text-anchor="middle" class="t">Open file description</text><text x="290" y="591" text-anchor="middle" class="s">offset + status flags + inode reference</text><text x="290" y="620" text-anchor="middle" class="s">keeps inode 42 reachable</text>
  <path d="M480 585 H675 V415" class="line"/>
  <rect x="605" y="520" width="390" height="130" rx="8" fill="#fee2e2" class="box"/><text x="800" y="560" text-anchor="middle" class="t">unlink("report"); unlink("backup")</text><text x="800" y="591" text-anchor="middle" class="s">directory entries removed; link count becomes 0</text><text x="800" y="620" text-anchor="middle" class="s">open handle still works</text>
  <path d="M605 585 H530" class="dead"/><path d="M995 585 H1120" class="line"/>
  <rect x="1120" y="520" width="380" height="130" rx="8" fill="#fef3c7" class="box"/><text x="1310" y="560" text-anchor="middle" class="t">close(last_fd)</text><text x="1310" y="591" text-anchor="middle" class="s">no names and no open references remain</text><text x="1310" y="620" text-anchor="middle" class="s">inode and data blocks become reclaimable</text>

  <rect x="180" y="730" width="1240" height="80" rx="8" fill="#f8fafc" class="box"/><text x="800" y="763" text-anchor="middle" class="t">Lifetime rule</text><text x="800" y="791" text-anchor="middle" class="s">A file object survives while at least one hard link, open description, mapping, or other kernel reference requires it.</text>
  <text x="800" y="846" text-anchor="middle" class="s">Renaming or unlinking a pathname does not retarget existing file descriptors.</text>
</svg>
