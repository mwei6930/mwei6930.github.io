<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">I/O system call submission and completion path</title>
  <desc id="desc">An animated request travels from a user read call through file descriptor lookup, subsystem and driver to a controller. Completion travels back by interrupt or polling and wakes the task or posts an event.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#334155"/></marker><marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#0f766e"/></marker><style>.h{font:700 30px system-ui,sans-serif;fill:#111827}.t{font:700 17px system-ui,sans-serif;fill:#111827}.s{font:14px system-ui,sans-serif;fill:#334155}.box{stroke:#334155;stroke-width:2}.line{fill:none;stroke:#334155;stroke-width:3;marker-end:url(#a)}.ret{fill:none;stroke:#0f766e;stroke-width:4;marker-end:url(#g)}.lane{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}</style></defs>
  <rect width="1600" height="900" fill="#fff"/><text x="800" y="46" text-anchor="middle" class="h">Submission and completion are separated by time</text>
  <rect x="75" y="90" width="1450" height="235" rx="8" class="lane"/><text x="105" y="124" class="t">Submission path</text>
  <rect x="110" y="170" width="220" height="92" rx="8" fill="#dbeafe" class="box"/><text x="220" y="205" text-anchor="middle" class="t">1. System call</text><text x="220" y="235" text-anchor="middle" class="s">read(fd, buf, n)</text>
  <rect x="390" y="170" width="220" height="92" rx="8" fill="#ede9fe" class="box"/><text x="500" y="205" text-anchor="middle" class="t">2. Validate</text><text x="500" y="235" text-anchor="middle" class="s">fd, range, access mode</text>
  <rect x="670" y="170" width="220" height="92" rx="8" fill="#fef3c7" class="box"/><text x="780" y="205" text-anchor="middle" class="t">3. Subsystem</text><text x="780" y="235" text-anchor="middle" class="s">cache or queue decision</text>
  <rect x="950" y="170" width="220" height="92" rx="8" fill="#ffedd5" class="box"/><text x="1060" y="205" text-anchor="middle" class="t">4. Driver</text><text x="1060" y="235" text-anchor="middle" class="s">map buffer + descriptor</text>
  <rect x="1230" y="170" width="220" height="92" rx="8" fill="#cffafe" class="box"/><text x="1340" y="205" text-anchor="middle" class="t">5. Controller</text><text x="1340" y="235" text-anchor="middle" class="s">execute command</text>
  <path id="submit" d="M330 216 H390 M610 216 H670 M890 216 H950 M1170 216 H1230" class="line"/>
  <circle cx="330" cy="216" r="10" fill="#2563eb"><animateMotion dur="5s" repeatCount="indefinite" path="M0 0 H900"/></circle>

  <rect x="455" y="365" width="690" height="130" rx="8" fill="#fff7ed" class="box"/>
  <text x="800" y="405" text-anchor="middle" class="t">Latency gap: the device and CPU run concurrently</text>
  <text x="800" y="437" text-anchor="middle" class="s">The calling thread may sleep, continue after a nonblocking return, or wait in an event loop.</text>
  <text x="800" y="466" text-anchor="middle" class="s">A cache hit can bypass the physical device; a miss enters the lower path.</text>
  <path d="M1340 262 V365 H1145" class="line"/>

  <rect x="75" y="540" width="1450" height="265" rx="8" class="lane"/><text x="105" y="574" class="t">Completion path</text>
  <rect x="1230" y="625" width="220" height="105" rx="8" fill="#cffafe" class="box"/><text x="1340" y="662" text-anchor="middle" class="t">6. Completion</text><text x="1340" y="691" text-anchor="middle" class="s">CQ entry / status register</text><text x="1340" y="716" text-anchor="middle" class="s">and IRQ or host polling</text>
  <rect x="950" y="625" width="220" height="105" rx="8" fill="#dcfce7" class="box"/><text x="1060" y="662" text-anchor="middle" class="t">7. Finish request</text><text x="1060" y="691" text-anchor="middle" class="s">bytes, error, unmap DMA</text><text x="1060" y="716" text-anchor="middle" class="s">update kernel state</text>
  <rect x="670" y="625" width="220" height="105" rx="8" fill="#dcfce7" class="box"/><text x="780" y="662" text-anchor="middle" class="t">8. Notify</text><text x="780" y="691" text-anchor="middle" class="s">wake task, mark ready</text><text x="780" y="716" text-anchor="middle" class="s">or publish CQE</text>
  <rect x="390" y="625" width="220" height="105" rx="8" fill="#dbeafe" class="box"/><text x="500" y="662" text-anchor="middle" class="t">9. Resume</text><text x="500" y="691" text-anchor="middle" class="s">scheduler/event loop</text><text x="500" y="716" text-anchor="middle" class="s">observes the result</text>
  <rect x="110" y="625" width="220" height="105" rx="8" fill="#dbeafe" class="box"/><text x="220" y="662" text-anchor="middle" class="t">10. Return</text><text x="220" y="691" text-anchor="middle" class="s">positive bytes, 0,</text><text x="220" y="716" text-anchor="middle" class="s">partial result or error</text>
  <path d="M1230 678 H1170 M950 678 H890 M670 678 H610 M390 678 H330" class="ret"/>
  <circle cx="1230" cy="678" r="10" fill="#0f766e"><animateMotion dur="5s" begin="2.5s" repeatCount="indefinite" path="M0 0 H-900"/></circle>
  <text x="800" y="856" text-anchor="middle" class="s">The API determines how completion is delivered; the controller still completes independently of the caller.</text>
</svg>
