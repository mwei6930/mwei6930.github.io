<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">Readiness versus completion interfaces</title>
  <desc id="desc">Side-by-side timelines compare receiving a readiness hint before issuing a nonblocking operation with submitting an asynchronous operation and later receiving its result.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#334155"/></marker><style>.h{font:700 30px system-ui,sans-serif;fill:#111827}.t{font:700 19px system-ui,sans-serif;fill:#111827}.s{font:15px system-ui,sans-serif;fill:#334155}.box{stroke:#334155;stroke-width:2}.axis{fill:none;stroke:#334155;stroke-width:3;marker-end:url(#a)}.dash{fill:none;stroke:#64748b;stroke-width:2;stroke-dasharray:8 7}</style></defs>
  <rect width="1600" height="820" fill="#fff"/><text x="800" y="48" text-anchor="middle" class="h">Readiness predicts progress; completion reports an operation's result</text>
  <rect x="70" y="100" width="700" height="620" rx="8" fill="#eff6ff" class="box"/><text x="420" y="145" text-anchor="middle" class="t">Readiness model</text>
  <text x="125" y="205" class="s">application</text><text x="625" y="205" class="s">kernel / object</text><path d="M150 240 H680" class="axis"/>
  <circle cx="220" cy="240" r="9" fill="#2563eb"/><text x="220" y="280" text-anchor="middle" class="s">register interest</text>
  <circle cx="360" cy="240" r="9" fill="#16a34a"/><text x="360" y="280" text-anchor="middle" class="s">ready event</text>
  <circle cx="505" cy="240" r="9" fill="#f59e0b"/><text x="505" y="280" text-anchor="middle" class="s">call read()</text>
  <circle cx="635" cy="240" r="9" fill="#7c3aed"/><text x="635" y="280" text-anchor="middle" class="s">bytes / EAGAIN</text>
  <rect x="145" y="340" width="550" height="115" rx="8" fill="#dbeafe" class="box"/><text x="420" y="380" text-anchor="middle" class="t">Event describes current state</text><text x="420" y="411" text-anchor="middle" class="s">The application chooses operation size and must handle</text><text x="420" y="438" text-anchor="middle" class="s">races, partial transfer, EOF and repeated draining.</text>
  <rect x="145" y="505" width="550" height="115" rx="8" fill="#fff" class="box"/><text x="420" y="545" text-anchor="middle" class="t">Typical correlation key</text><text x="420" y="576" text-anchor="middle" class="s">file descriptor plus application connection state</text><text x="420" y="603" text-anchor="middle" class="s">One readiness event can enable several operations.</text>

  <rect x="830" y="100" width="700" height="620" rx="8" fill="#f0fdf4" class="box"/><text x="1180" y="145" text-anchor="middle" class="t">Completion model</text>
  <text x="885" y="205" class="s">application</text><text x="1385" y="205" class="s">kernel / device</text><path d="M910 240 H1440" class="axis"/>
  <circle cx="980" cy="240" r="9" fill="#2563eb"/><text x="980" y="280" text-anchor="middle" class="s">submit read</text>
  <circle cx="1115" cy="240" r="9" fill="#f59e0b"/><text x="1115" y="280" text-anchor="middle" class="s">operation in flight</text>
  <circle cx="1270" cy="240" r="9" fill="#16a34a"/><text x="1270" y="280" text-anchor="middle" class="s">device finishes</text>
  <circle cx="1410" cy="240" r="9" fill="#7c3aed"/><text x="1410" y="280" text-anchor="middle" class="s">result event</text>
  <rect x="905" y="340" width="550" height="115" rx="8" fill="#dcfce7" class="box"/><text x="1180" y="380" text-anchor="middle" class="t">Event belongs to a submitted operation</text><text x="1180" y="411" text-anchor="middle" class="s">The completion carries bytes or an error. Buffers and</text><text x="1180" y="438" text-anchor="middle" class="s">request metadata must remain valid until it arrives.</text>
  <rect x="905" y="505" width="550" height="115" rx="8" fill="#fff" class="box"/><text x="1180" y="545" text-anchor="middle" class="t">Typical correlation key</text><text x="1180" y="576" text-anchor="middle" class="s">application-supplied request ID / user_data</text><text x="1180" y="603" text-anchor="middle" class="s">Completions may arrive out of submission order.</text>
  <path d="M800 100 V720" class="dash"/>
  <text x="800" y="778" text-anchor="middle" class="s">A thread pool can provide an asynchronous application API while internally executing blocking system calls; it is a third implementation strategy.</text>
</svg>
