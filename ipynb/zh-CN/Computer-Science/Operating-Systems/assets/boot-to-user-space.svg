<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 590" role="img" aria-labelledby="title desc">
  <title id="title">Boot path from reset to user space</title>
  <desc id="desc">The processor reset vector leads to firmware, a boot manager or bootloader, kernel initialization, the root file system, PID 1, and ordinary services.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#355070"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17212b; }
      .title { font-size: 30px; font-weight: 700; }
      .head { font-size: 21px; font-weight: 700; }
      .body { font-size: 17px; }
      .small { font-size: 15px; }
      .box { stroke: #355070; stroke-width: 2.3; rx: 8; }
      .arrow { stroke: #355070; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1520" height="590" fill="#fff"/>
  <text x="760" y="45" text-anchor="middle" class="title">From Power-On to the First Ordinary Program</text>

  <rect x="35" y="112" width="185" height="132" class="box" fill="#e9f2fb"/>
  <text x="128" y="148" text-anchor="middle" class="head">Reset vector</text>
  <text x="128" y="180" text-anchor="middle" class="body">CPU starts at a</text>
  <text x="128" y="204" text-anchor="middle" class="body">defined address</text>
  <text x="128" y="230" text-anchor="middle" class="small">minimal machine state</text>

  <rect x="257" y="112" width="205" height="132" class="box" fill="#edf5e8"/>
  <text x="360" y="148" text-anchor="middle" class="head">Firmware</text>
  <text x="360" y="180" text-anchor="middle" class="body">initialize platform</text>
  <text x="360" y="204" text-anchor="middle" class="body">discover boot options</text>
  <text x="360" y="230" text-anchor="middle" class="small">UEFI on modern PCs</text>

  <rect x="499" y="112" width="220" height="132" class="box" fill="#fff3d9"/>
  <text x="609" y="148" text-anchor="middle" class="head">Boot manager</text>
  <text x="609" y="180" text-anchor="middle" class="body">select and load an</text>
  <text x="609" y="204" text-anchor="middle" class="body">OS loader / kernel</text>
  <text x="609" y="230" text-anchor="middle" class="small">may verify signatures</text>

  <rect x="756" y="112" width="220" height="132" class="box" fill="#f1eef8"/>
  <text x="866" y="148" text-anchor="middle" class="head">Early kernel</text>
  <text x="866" y="180" text-anchor="middle" class="body">decompress, page tables,</text>
  <text x="866" y="204" text-anchor="middle" class="body">memory and CPU setup</text>
  <text x="866" y="230" text-anchor="middle" class="small">kernel now controls machine</text>

  <rect x="1013" y="112" width="220" height="132" class="box" fill="#e6f5ef"/>
  <text x="1123" y="148" text-anchor="middle" class="head">Core subsystems</text>
  <text x="1123" y="180" text-anchor="middle" class="body">drivers, scheduler, VM,</text>
  <text x="1123" y="204" text-anchor="middle" class="body">interrupts, root file system</text>
  <text x="1123" y="230" text-anchor="middle" class="small">initramfs may help mount root</text>

  <rect x="1270" y="112" width="215" height="132" class="box" fill="#fdebea"/>
  <text x="1378" y="148" text-anchor="middle" class="head">First user process</text>
  <text x="1378" y="180" text-anchor="middle" class="body">Linux PID 1 or xv6 init</text>
  <text x="1378" y="204" text-anchor="middle" class="body">starts services and login</text>
  <text x="1378" y="230" text-anchor="middle" class="small">normal user space begins</text>

  <path d="M220 178 L257 178" class="arrow"/><path d="M462 178 L499 178" class="arrow"/>
  <path d="M719 178 L756 178" class="arrow"/><path d="M976 178 L1013 178" class="arrow"/>
  <path d="M1233 178 L1270 178" class="arrow"/>

  <rect x="118" y="330" width="1284" height="190" rx="8" fill="#f8fafb" stroke="#7c8794" stroke-width="2"/>
  <text x="760" y="369" text-anchor="middle" class="head">Two different chains are being established</text>
  <text x="165" y="414" class="body">Control chain:</text><text x="312" y="414" class="body">each stage deliberately transfers execution to the next stage.</text>
  <text x="165" y="452" class="body">Trust chain:</text><text x="312" y="452" class="body">Secure Boot can verify signatures before control is transferred.</text>
  <text x="165" y="490" class="body">Recovery rule:</text><text x="312" y="490" class="body">a failure before PID 1 is a boot failure; a failure after PID 1 is usually a service failure.</text>
  <text x="760" y="558" text-anchor="middle" class="small">Conceptual Linux/UEFI path; exact stages differ across architectures, firmware, bootloaders, and distributions.</text>
</svg>
