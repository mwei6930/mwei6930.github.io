<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
  <title id="title">Generic page-table entry fields and access decisions</title>
  <desc id="desc">A generic PTE contains a physical frame number and status or permission bits. Read, write, execute, privilege, and presence checks lead either to a physical frame or a page-fault exception.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#374151"/></marker><style>.h{font:700 28px system-ui,sans-serif;fill:#111827}.t{font:600 18px system-ui,sans-serif;fill:#111827}.s{font:15px system-ui,sans-serif;fill:#374151}.box{stroke:#374151;stroke-width:2}.line{fill:none;stroke:#374151;stroke-width:3;marker-end:url(#arrow)}</style></defs>
  <rect width="1500" height="760" fill="#ffffff"/>
  <text x="750" y="44" text-anchor="middle" class="h">A PTE is both a translation record and an access-control record</text>
  <text x="750" y="100" text-anchor="middle" class="t">Generic 64-bit page-table entry (exact encoding is architecture-specific)</text>
  <rect x="95" y="130" width="800" height="90" rx="8" fill="#dbeafe" class="box"/><text x="495" y="183" text-anchor="middle" class="t">physical page/frame number (PFN or PPN)</text>
  <g class="box"><rect x="895" y="130" width="65" height="90" fill="#dcfce7"/><rect x="960" y="130" width="65" height="90" fill="#fef3c7"/><rect x="1025" y="130" width="65" height="90" fill="#fef3c7"/><rect x="1090" y="130" width="65" height="90" fill="#ffedd5"/><rect x="1155" y="130" width="65" height="90" fill="#f3e8ff"/><rect x="1220" y="130" width="65" height="90" fill="#e0f2fe"/><rect x="1285" y="130" width="65" height="90" fill="#e0f2fe"/><rect x="1350" y="130" width="55" height="90" fill="#e5e7eb"/></g>
  <text x="928" y="184" text-anchor="middle" class="t">V</text><text x="992" y="184" text-anchor="middle" class="t">R</text><text x="1057" y="184" text-anchor="middle" class="t">W</text><text x="1122" y="184" text-anchor="middle" class="t">X</text><text x="1187" y="184" text-anchor="middle" class="t">U</text><text x="1252" y="184" text-anchor="middle" class="t">A</text><text x="1317" y="184" text-anchor="middle" class="t">D</text><text x="1377" y="184" text-anchor="middle" class="s">OS</text>
  <text x="928" y="246" text-anchor="middle" class="s">valid / present</text><text x="1025" y="268" text-anchor="middle" class="s">read and write</text><text x="1122" y="246" text-anchor="middle" class="s">execute</text><text x="1187" y="268" text-anchor="middle" class="s">user access</text><text x="1285" y="246" text-anchor="middle" class="s">accessed / dirty</text><text x="1377" y="268" text-anchor="middle" class="s">software state</text>

  <rect x="100" y="335" width="260" height="90" rx="8" fill="#f8fafc" class="box"/><text x="230" y="370" text-anchor="middle" class="t">memory reference</text><text x="230" y="399" text-anchor="middle" class="s">VA + read/write/execute + mode</text>
  <path d="M360 380 H490" class="line"/>
  <polygon points="515,325 760,325 815,380 760,435 515,435 460,380" fill="#fef3c7" class="box"/><text x="638" y="361" text-anchor="middle" class="t">valid mapping?</text><text x="638" y="391" text-anchor="middle" class="s">entry form and presence</text><text x="638" y="417" text-anchor="middle" class="s">are acceptable</text>
  <path d="M815 380 H930" class="line"/><text x="865" y="362" class="s">yes</text>
  <polygon points="955,325 1200,325 1255,380 1200,435 955,435 900,380" fill="#f3e8ff" class="box"/><text x="1078" y="361" text-anchor="middle" class="t">permission allows?</text><text x="1078" y="391" text-anchor="middle" class="s">operation, privilege, and policy</text>
  <path d="M1255 380 H1375" class="line"/><text x="1300" y="362" class="s">yes</text>
  <rect x="1320" y="335" width="135" height="90" rx="8" fill="#dcfce7" class="box"/><text x="1387" y="370" text-anchor="middle" class="t">PFN</text><text x="1387" y="399" text-anchor="middle" class="s">continue</text>
  <path d="M638 435 V560 H930" class="line"/><text x="675" y="526" class="s">no</text>
  <path d="M1078 435 V560 H930" class="line"/><text x="1100" y="526" class="s">no</text>
  <rect x="930" y="520" width="350" height="105" rx="8" fill="#fee2e2" class="box"/><text x="1105" y="558" text-anchor="middle" class="t">page-fault exception</text><text x="1105" y="588" text-anchor="middle" class="s">cause distinguishes missing translation</text><text x="1105" y="612" text-anchor="middle" class="s">from a protection violation</text>
  <rect x="140" y="675" width="1220" height="48" rx="8" fill="#f1f5f9" class="box"/><text x="750" y="705" text-anchor="middle" class="s">W^X policy avoids pages that are writable and executable at the same time; copy-on-write often uses a read-only PTE plus OS metadata.</text>
</svg>
