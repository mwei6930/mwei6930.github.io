<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">Linux subjective and objective security context</title>
  <desc id="desc">A task credential structure carries user IDs, group IDs, capabilities, keys and LSM labels that are compared with an object's owner, ACL, labels and type.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#46596d"/></marker></defs>
  <style>text{font-family:Arial,sans-serif;fill:#172235}.title{font-size:28px;font-weight:700}.head{font-size:19px;font-weight:700}.body{font-size:15px}.small{font-size:13px;fill:#526274}.box{stroke:#65788b;stroke-width:2}.arrow{stroke:#46596d;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style>
  <rect width="1200" height="690" fill="#f7f9fb"/><text x="600" y="42" text-anchor="middle" class="title">Authorization compares a task's subjective context with an object's context</text>
  <rect x="50" y="95" width="180" height="470" rx="8" fill="#e6f0ff" class="box"/><text x="140" y="130" text-anchor="middle" class="head">task_struct</text><text x="140" y="169" text-anchor="middle" class="body">execution state</text><text x="140" y="199" text-anchor="middle" class="body">address space</text><text x="140" y="229" text-anchor="middle" class="body">file table</text><text x="140" y="259" text-anchor="middle" class="body">namespace refs</text><text x="140" y="289" text-anchor="middle" class="body">cgroup membership</text><rect x="82" y="340" width="116" height="79" rx="8" fill="#fff" class="box"/><text x="140" y="372" text-anchor="middle" class="body">cred *</text><text x="140" y="396" text-anchor="middle" class="small">immutable pointer</text>
  <rect x="288" y="78" width="380" height="505" rx="8" fill="#eee9ff" class="box"/><text x="478" y="114" text-anchor="middle" class="head">struct cred: subjective authority</text>
  <rect x="322" y="144" width="145" height="116" rx="8" fill="#fff" class="box"/><text x="394" y="174" text-anchor="middle" class="body">Identity</text><text x="394" y="201" text-anchor="middle" class="small">real UID/GID</text><text x="394" y="224" text-anchor="middle" class="small">effective + saved</text><text x="394" y="247" text-anchor="middle" class="small">FSUID/FSGID</text>
  <rect x="488" y="144" width="145" height="116" rx="8" fill="#fff" class="box"/><text x="560" y="174" text-anchor="middle" class="body">Groups</text><text x="560" y="201" text-anchor="middle" class="small">effective GID</text><text x="560" y="224" text-anchor="middle" class="small">supplementary set</text><text x="560" y="247" text-anchor="middle" class="small">membership snapshot</text>
  <rect x="322" y="286" width="311" height="91" rx="8" fill="#e5f7ed" class="box"/><text x="477" y="318" text-anchor="middle" class="body">Linux capability sets</text><text x="477" y="343" text-anchor="middle" class="small">permitted, effective, inheritable, bounding, ambient</text><text x="477" y="364" text-anchor="middle" class="small">plus securebits and no_new_privs state</text>
  <rect x="322" y="403" width="145" height="116" rx="8" fill="#fff2d5" class="box"/><text x="394" y="435" text-anchor="middle" class="body">Keys</text><text x="394" y="462" text-anchor="middle" class="small">thread/process/</text><text x="394" y="484" text-anchor="middle" class="small">session keyrings</text><text x="394" y="506" text-anchor="middle" class="small">security tokens</text>
  <rect x="488" y="403" width="145" height="116" rx="8" fill="#ffe6e3" class="box"/><text x="560" y="435" text-anchor="middle" class="body">LSM context</text><text x="560" y="462" text-anchor="middle" class="small">SELinux/AppArmor/</text><text x="560" y="484" text-anchor="middle" class="small">Landlock state</text><text x="560" y="506" text-anchor="middle" class="small">security label</text>
  <path d="M198 379H288" class="arrow"/>
  <rect x="748" y="119" width="400" height="398" rx="8" fill="#fff2d5" class="box"/><text x="948" y="155" text-anchor="middle" class="head">Object: objective security context</text>
  <rect x="786" y="187" width="150" height="104" rx="8" fill="#fff" class="box"/><text x="861" y="217" text-anchor="middle" class="body">Filesystem object</text><text x="861" y="244" text-anchor="middle" class="small">owner UID/GID</text><text x="861" y="267" text-anchor="middle" class="small">mode + POSIX ACL</text>
  <rect x="958" y="187" width="150" height="104" rx="8" fill="#fff" class="box"/><text x="1033" y="217" text-anchor="middle" class="body">Process object</text><text x="1033" y="244" text-anchor="middle" class="small">target credentials</text><text x="1033" y="267" text-anchor="middle" class="small">dumpability + ptrace</text>
  <rect x="786" y="319" width="150" height="104" rx="8" fill="#fff" class="box"/><text x="861" y="349" text-anchor="middle" class="body">IPC / socket</text><text x="861" y="376" text-anchor="middle" class="small">owner, peer creds</text><text x="861" y="399" text-anchor="middle" class="small">namespace + label</text>
  <rect x="958" y="319" width="150" height="104" rx="8" fill="#fff" class="box"/><text x="1033" y="349" text-anchor="middle" class="body">Kernel resource</text><text x="1033" y="376" text-anchor="middle" class="small">type and owner NS</text><text x="1033" y="399" text-anchor="middle" class="small">operation-specific state</text>
  <path d="M668 331H748" class="arrow"/>
  <rect x="280" y="610" width="640" height="52" rx="8" fill="#dff4f5" class="box"/><text x="600" y="641" text-anchor="middle" class="body">Decision = operation + current credentials + stable object + DAC/capability/LSM rules + namespace context</text>
  <path d="M478 583V610M948 517V581H820V610" class="arrow"/>
</svg>
