<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="820" viewBox="0 0 1450 820" role="img" aria-labelledby="title desc">
  <title id="title">Priority aging and multilevel feedback queue scheduling</title>
  <desc id="desc">The left panel shows an old low-priority job gaining priority while it waits. The right panel shows an illustrative three-level feedback queue with demotion, I/O return, and periodic boost.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#374151"/></marker>
    <style>.h{font:700 27px system-ui,sans-serif;fill:#111827}.t{font:600 18px system-ui,sans-serif;fill:#111827}.s{font:15px system-ui,sans-serif;fill:#374151}.box{stroke:#374151;stroke-width:2}.line{fill:none;stroke:#374151;stroke-width:3;marker-end:url(#arrow)}.dash{fill:none;stroke:#7c3aed;stroke-width:3;stroke-dasharray:8 7;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1450" height="820" fill="#fff"/>
  <text x="725" y="44" text-anchor="middle" class="h">Preventing starvation without knowing future burst lengths</text>
  <line x1="715" y1="80" x2="715" y2="765" stroke="#d1d5db" stroke-width="2"/>
  <text x="355" y="95" text-anchor="middle" class="t">Priority scheduling with aging</text>
  <text x="355" y="128" text-anchor="middle" class="s">Lower numeric value means higher priority in this example.</text>
  <g transform="translate(75 170)">
    <g class="t"><text x="0" y="30">time</text><text x="105" y="30">0</text><text x="210" y="30">5</text><text x="315" y="30">10</text><text x="420" y="30">15</text><text x="525" y="30">20</text></g>
    <g class="box"><rect x="95" y="70" width="90" height="55" rx="5" fill="#fee2e2"/><rect x="200" y="70" width="90" height="55" rx="5" fill="#ffedd5"/><rect x="305" y="70" width="90" height="55" rx="5" fill="#fef3c7"/><rect x="410" y="70" width="90" height="55" rx="5" fill="#dcfce7"/><rect x="515" y="70" width="90" height="55" rx="5" fill="#bbf7d0"/></g>
    <g class="s" text-anchor="middle"><text x="140" y="103">P = 8</text><text x="245" y="103">P = 7</text><text x="350" y="103">P = 6</text><text x="455" y="103">P = 5</text><text x="560" y="103">P = 4</text></g>
    <path d="M140 145 C250 200 445 200 560 145" class="line"/>
    <text x="350" y="230" text-anchor="middle" class="s">Every five waiting units improves the priority by one.</text>
    <rect x="135" y="285" width="430" height="90" rx="8" fill="#eef2ff" class="box"/>
    <text x="350" y="322" text-anchor="middle" class="t">Eventually competitive</text>
    <text x="350" y="352" text-anchor="middle" class="s">New high-priority arrivals can no longer postpone it forever.</text>
  </g>
  <text x="1080" y="95" text-anchor="middle" class="t">One illustrative MLFQ policy</text>
  <text x="1080" y="128" text-anchor="middle" class="s">Exact queue counts, quanta, and promotion rules are implementation choices.</text>
  <g transform="translate(790 165)">
    <rect x="0" y="0" width="570" height="120" rx="8" fill="#dbeafe" class="box"/>
    <text x="30" y="38" class="t">Q0: highest priority, Round Robin, quantum 2</text>
    <rect x="45" y="60" width="95" height="38" rx="4" fill="#93c5fd" stroke="#1d4ed8"/><text x="92" y="85" text-anchor="middle" class="s">new A</text>
    <rect x="155" y="60" width="95" height="38" rx="4" fill="#93c5fd" stroke="#1d4ed8"/><text x="202" y="85" text-anchor="middle" class="s">wake B</text>
    <rect x="0" y="195" width="570" height="120" rx="8" fill="#dcfce7" class="box"/>
    <text x="30" y="233" class="t">Q1: Round Robin, quantum 4</text>
    <rect x="45" y="255" width="110" height="38" rx="4" fill="#86efac" stroke="#15803d"/><text x="100" y="280" text-anchor="middle" class="s">CPU-bound A</text>
    <rect x="0" y="390" width="570" height="120" rx="8" fill="#fef3c7" class="box"/>
    <text x="30" y="428" class="t">Q2: lowest priority, quantum 8 or FCFS</text>
    <rect x="45" y="450" width="140" height="38" rx="4" fill="#fcd34d" stroke="#b45309"/><text x="115" y="475" text-anchor="middle" class="s">long-running C</text>
    <path d="M460 120 V195" class="line"/><text x="472" y="160" class="s">uses allotment</text>
    <path d="M460 315 V390" class="line"/><text x="472" y="355" class="s">uses allotment</text>
    <path d="M120 195 C40 160 25 120 70 100" class="line"/><text x="10" y="154" class="s">I/O return policy</text>
    <path d="M535 510 C640 370 640 90 550 40" class="dash"/><text x="480" y="560" class="s">periodic global boost</text>
  </g>
  <text x="725" y="792" text-anchor="middle" class="s">Aging changes a priority continuously; MLFQ infers behavior from observed CPU use and periodically repairs starvation.</text>
</svg>
