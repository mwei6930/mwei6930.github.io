<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">Privilege transition across execve and no new privileges</title>
  <desc id="desc">An animated marker follows execution from a user process through execve to ordinary, set-user-ID, or file-capability results, while no_new_privs blocks gains.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#46596d"/></marker></defs>
  <style>text{font-family:Arial,sans-serif;fill:#172235}.title{font-size:28px;font-weight:700}.head{font-size:18px;font-weight:700}.body{font-size:15px}.small{font-size:13px;fill:#526274}.box{stroke:#65788b;stroke-width:2}.arrow{stroke:#46596d;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.dash{stroke:#9b55cf;stroke-width:2.5;stroke-dasharray:9 7;fill:none;marker-end:url(#arrow)}</style>
  <rect width="1200" height="690" fill="#f7f9fb"/><text x="600" y="42" text-anchor="middle" class="title">execve can transform credentials; no_new_privs forbids privilege gain</text>
  <rect x="55" y="95" width="270" height="180" rx="8" fill="#e6f0ff" class="box"/><text x="190" y="130" text-anchor="middle" class="head">Calling process</text><text x="190" y="168" text-anchor="middle" class="body">RUID = EUID = 1000</text><text x="190" y="198" text-anchor="middle" class="body">permitted caps = empty</text><text x="190" y="228" text-anchor="middle" class="body">no_new_privs = 0 or 1</text><text x="190" y="258" text-anchor="middle" class="small">argv, env, fds cross exec selectively</text>
  <rect x="430" y="95" width="270" height="180" rx="8" fill="#eee9ff" class="box"/><text x="565" y="130" text-anchor="middle" class="head">execve loader checks</text><text x="565" y="168" text-anchor="middle" class="body">executable owner + mode</text><text x="565" y="198" text-anchor="middle" class="body">file capability xattr</text><text x="565" y="228" text-anchor="middle" class="body">mount nosuid, tracing, LSM</text><text x="565" y="258" text-anchor="middle" class="small">derive new credentials before entry</text>
  <path d="M325 185H430" class="arrow"/><circle r="9" fill="#8a4ec2"><animateMotion dur="3.6s" repeatCount="indefinite" path="M325 185H430"/></circle>
  <rect x="820" y="75" width="325" height="112" rx="8" fill="#e5f7ed" class="box"/><text x="982" y="108" text-anchor="middle" class="head">Ordinary executable</text><text x="982" y="140" text-anchor="middle" class="body">EUID remains 1000</text><text x="982" y="167" text-anchor="middle" class="small">no authority added</text>
  <rect x="820" y="218" width="325" height="128" rx="8" fill="#fff2d5" class="box"/><text x="982" y="251" text-anchor="middle" class="head">setuid-root executable</text><text x="982" y="283" text-anchor="middle" class="body">EUID becomes file owner 0</text><text x="982" y="311" text-anchor="middle" class="small">saved ID supports controlled drop/regain</text><text x="982" y="333" text-anchor="middle" class="small">only when transition is permitted</text>
  <rect x="820" y="377" width="325" height="128" rx="8" fill="#dff4f5" class="box"/><text x="982" y="410" text-anchor="middle" class="head">file-capability executable</text><text x="982" y="442" text-anchor="middle" class="body">selected permitted/effective caps</text><text x="982" y="470" text-anchor="middle" class="small">e.g. CAP_NET_BIND_SERVICE</text><text x="982" y="492" text-anchor="middle" class="small">less authority than full root</text>
  <path d="M700 160H760V131H820M700 185H775V282H820M700 210H760V441H820" class="arrow"/>
  <rect x="388" y="390" width="355" height="155" rx="8" fill="#ffe6e3" class="box"/><text x="565" y="425" text-anchor="middle" class="head">If no_new_privs = 1</text><text x="565" y="461" text-anchor="middle" class="body">setuid/setgid bits do not raise IDs</text><text x="565" y="490" text-anchor="middle" class="body">file capabilities do not add privilege</text><text x="565" y="519" text-anchor="middle" class="small">inherited across fork, clone, and exec; cannot be unset</text>
  <path d="M565 275V390" class="dash"/><path d="M743 468H785V282H820" stroke="#c84c4c" stroke-width="3" stroke-dasharray="9 7" fill="none"/><path d="M800 267L820 297M820 267L800 297" stroke="#c84c4c" stroke-width="4"/>
  <rect x="110" y="595" width="980" height="58" rx="8" fill="#fff" class="box"/><text x="600" y="620" text-anchor="middle" class="body">Privilege transitions are code-loading protocols, not magic: loader state, file metadata, namespace ownership, LSM policy, descriptors, and environment all matter.</text><text x="600" y="643" text-anchor="middle" class="small">Drop supplementary groups, GID, UID and capabilities deliberately; verify failures and close unintended descriptors.</text>
</svg>
