<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" role="img" aria-labelledby="title desc">
  <title id="title">Lazy allocation and zero-fill-on-demand</title>
  <desc id="desc">A reserved anonymous virtual range initially has no private frames. Reads can share a read-only zero page; the first write faults and receives a cleared private frame.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#334155"/></marker><style>.h{font:700 30px system-ui,sans-serif;fill:#111827}.t{font:700 18px system-ui,sans-serif;fill:#111827}.s{font:15px system-ui,sans-serif;fill:#334155}.box{stroke:#334155;stroke-width:2}.line{fill:none;stroke:#334155;stroke-width:3;marker-end:url(#a)}.pulse{animation:p 4.8s infinite}@keyframes p{0%,20%{opacity:.2}35%,85%{opacity:1}100%{opacity:.2}}</style></defs>
  <rect width="1500" height="820" fill="#fff"/>
  <text x="750" y="48" text-anchor="middle" class="h">Reservation is cheap; private physical storage arrives on first write</text>
  <text x="240" y="100" text-anchor="middle" class="t">1. Reserve address range</text><text x="750" y="100" text-anchor="middle" class="t">2. First read</text><text x="1260" y="100" text-anchor="middle" class="t">3. First write</text>

  <rect x="70" y="135" width="340" height="430" rx="8" fill="#f8fafc" class="box"/>
  <text x="240" y="174" text-anchor="middle" class="t">Anonymous VMA: 16 KiB</text>
  <g fill="#e2e8f0" class="box"><rect x="130" y="215" width="220" height="62" rx="5"/><rect x="130" y="290" width="220" height="62" rx="5"/><rect x="130" y="365" width="220" height="62" rx="5"/><rect x="130" y="440" width="220" height="62" rx="5"/></g>
  <g class="s" text-anchor="middle"><text x="240" y="252">virtual page, no PTE</text><text x="240" y="327">virtual page, no PTE</text><text x="240" y="402">virtual page, no PTE</text><text x="240" y="477">virtual page, no PTE</text></g>
  <text x="240" y="540" text-anchor="middle" class="s">virtual size grows; RSS need not</text>

  <rect x="580" y="135" width="340" height="430" rx="8" fill="#eff6ff" class="box"/>
  <rect x="645" y="220" width="210" height="76" rx="6" fill="#dbeafe" class="box"/><text x="750" y="250" text-anchor="middle" class="t">PTE: read-only</text><text x="750" y="278" text-anchor="middle" class="s">points to shared zero page</text>
  <path d="M750 296 V370" class="line"/>
  <rect x="625" y="370" width="250" height="100" rx="50" fill="#ecfeff" class="box"/><text x="750" y="410" text-anchor="middle" class="t">global zero page</text><text x="750" y="441" text-anchor="middle" class="s">all bytes are zero; never writable</text>
  <text x="750" y="530" text-anchor="middle" class="s">many untouched pages can share one frame</text>

  <rect x="1090" y="135" width="340" height="430" rx="8" fill="#fff7ed" class="box"/>
  <rect x="1155" y="210" width="210" height="76" rx="6" fill="#fee2e2" class="box"/><text x="1260" y="240" text-anchor="middle" class="t">write-protection fault</text><text x="1260" y="268" text-anchor="middle" class="s">the zero page cannot change</text>
  <path d="M1260 286 V350" class="line pulse"/>
  <rect x="1140" y="350" width="240" height="100" rx="8" fill="#dcfce7" class="box"/><text x="1260" y="388" text-anchor="middle" class="t">private cleared frame</text><text x="1260" y="418" text-anchor="middle" class="s">install writable PTE, store byte</text>
  <text x="1260" y="505" text-anchor="middle" class="s">RSS rises by the materialized page</text>

  <path d="M410 350 H580" class="line"/><path d="M920 350 H1090" class="line"/>
  <rect x="180" y="650" width="1140" height="100" rx="8" fill="#f1f5f9" class="box"/>
  <text x="750" y="688" text-anchor="middle" class="t">Security invariant</text>
  <text x="750" y="720" text-anchor="middle" class="s">A frame from another process must be cleared before user access; lazy allocation delays that work but never skips it.</text>
</svg>
