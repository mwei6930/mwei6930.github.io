<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">Three ways execution enters the operating-system kernel</title>
  <desc id="desc">System calls, synchronous exceptions, and asynchronous interrupts converge on protected trap entry, handling, and return.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#355070"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17212b; }
      .title { font-size: 30px; font-weight: 700; }
      .label { font-size: 23px; font-weight: 700; }
      .body { font-size: 19px; }
      .small { font-size: 17px; }
      .box { stroke: #355070; stroke-width: 2.5; rx: 8; }
      .arrow { stroke: #355070; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #7c8794; stroke-width: 2; stroke-dasharray: 8 7; }
    </style>
  </defs>
  <rect width="1400" height="720" fill="#ffffff"/>
  <text x="700" y="48" text-anchor="middle" class="title">Protected Entry, Handling, and Return</text>

  <rect x="55" y="92" width="375" height="142" class="box" fill="#e9f2fb"/>
  <text x="242" y="127" text-anchor="middle" class="label">System call</text>
  <text x="242" y="160" text-anchor="middle" class="body">Intentional and synchronous</text>
  <text x="242" y="190" text-anchor="middle" class="small">Example: write(fd, buffer, n)</text>
  <text x="242" y="216" text-anchor="middle" class="small">Instruction: syscall / ecall</text>

  <rect x="512" y="92" width="375" height="142" class="box" fill="#fff3d9"/>
  <text x="700" y="127" text-anchor="middle" class="label">Exception or fault</text>
  <text x="700" y="160" text-anchor="middle" class="body">Synchronous with an instruction</text>
  <text x="700" y="190" text-anchor="middle" class="small">Example: invalid address, divide by zero</text>
  <text x="700" y="216" text-anchor="middle" class="small">May be repaired, reported, or fatal</text>

  <rect x="970" y="92" width="375" height="142" class="box" fill="#e6f5ef"/>
  <text x="1157" y="127" text-anchor="middle" class="label">Hardware interrupt</text>
  <text x="1157" y="160" text-anchor="middle" class="body">Asynchronous to current instruction</text>
  <text x="1157" y="190" text-anchor="middle" class="small">Example: timer tick, NIC, completed I/O</text>
  <text x="1157" y="216" text-anchor="middle" class="small">May arrive between instructions</text>

  <path d="M242 234 L242 286 L530 286 L530 324" class="arrow"/>
  <path d="M700 234 L700 324" class="arrow"/>
  <path d="M1157 234 L1157 286 L870 286 L870 324" class="arrow"/>

  <line x1="32" y1="307" x2="1368" y2="307" class="dash"/>
  <text x="49" y="297" class="small" fill="#5b6570">user execution / device activity</text>
  <text x="49" y="334" class="small" fill="#5b6570">protected kernel execution</text>

  <rect x="428" y="324" width="544" height="102" class="box" fill="#f1eef8"/>
  <text x="700" y="358" text-anchor="middle" class="label">Architecture-defined trap entry</text>
  <text x="700" y="389" text-anchor="middle" class="body">Record cause and resume address, raise privilege, select vector</text>
  <text x="700" y="414" text-anchor="middle" class="small">The CPU does not save every general-purpose register automatically</text>

  <path d="M700 426 L700 466" class="arrow"/>
  <rect x="280" y="466" width="840" height="92" class="box" fill="#eaf0f4"/>
  <text x="700" y="500" text-anchor="middle" class="label">Entry stub and trap frame</text>
  <text x="700" y="532" text-anchor="middle" class="body">Save registers, establish a kernel stack/context, classify the cause</text>

  <path d="M700 558 L700 574 L296 574 L296 597" class="arrow"/>
  <path d="M700 558 L700 597" class="arrow"/>
  <path d="M700 558 L700 574 L1104 574 L1104 597" class="arrow"/>
  <rect x="125" y="597" width="342" height="82" class="box" fill="#e9f2fb"/>
  <text x="296" y="630" text-anchor="middle" class="label">System-call handler</text>
  <text x="296" y="659" text-anchor="middle" class="small">Dispatch, validate, perform service</text>
  <rect x="529" y="597" width="342" height="82" class="box" fill="#fff3d9"/>
  <text x="700" y="630" text-anchor="middle" class="label">Exception handler</text>
  <text x="700" y="659" text-anchor="middle" class="small">Repair, signal/kill, or panic</text>
  <rect x="933" y="597" width="342" height="82" class="box" fill="#e6f5ef"/>
  <text x="1104" y="630" text-anchor="middle" class="label">Interrupt handler</text>
  <text x="1104" y="659" text-anchor="middle" class="small">Acknowledge, defer work, wake waiters</text>
</svg>
