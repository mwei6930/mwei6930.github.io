<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="900" viewBox="0 0 1700 900" role="img" aria-labelledby="title desc">
  <title id="title">Representative ext4 on-disk layout</title>
  <desc id="desc">A filesystem volume is divided into block groups containing replicated or distributed metadata, allocation bitmaps, inode tables, and data blocks, with a journal reserved as a special file.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#334155"/></marker><style>.h{font:700 30px system-ui,sans-serif;fill:#111827}.t{font:700 18px system-ui,sans-serif;fill:#111827}.s{font:14px system-ui,sans-serif;fill:#334155}.box{stroke:#334155;stroke-width:2}.line{fill:none;stroke:#334155;stroke-width:3;marker-end:url(#a)}.brace{fill:none;stroke:#7c3aed;stroke-width:3}</style></defs>
  <rect width="1700" height="900" fill="#fff"/><text x="850" y="48" text-anchor="middle" class="h">On-disk structures turn a block address space into persistent objects</text>
  <text x="100" y="105" class="t">Filesystem volume</text>
  <rect x="100" y="130" width="1500" height="105" rx="8" fill="#f8fafc" class="box"/>
  <rect x="110" y="140" width="180" height="85" fill="#e2e8f0" class="box"/><text x="200" y="177" text-anchor="middle" class="t">Boot / padding</text><text x="200" y="205" text-anchor="middle" class="s">format dependent</text>
  <rect x="290" y="140" width="430" height="85" fill="#eff6ff" class="box"/><text x="505" y="177" text-anchor="middle" class="t">Block group 0</text><text x="505" y="205" text-anchor="middle" class="s">metadata + inodes + nearby data</text>
  <rect x="720" y="140" width="430" height="85" fill="#f0fdf4" class="box"/><text x="935" y="177" text-anchor="middle" class="t">Block group 1</text><text x="935" y="205" text-anchor="middle" class="s">metadata + inodes + nearby data</text>
  <rect x="1150" y="140" width="230" height="85" fill="#fff" class="box"/><text x="1265" y="190" text-anchor="middle" class="t">...</text>
  <rect x="1380" y="140" width="210" height="85" fill="#fff7ed" class="box"/><text x="1485" y="177" text-anchor="middle" class="t">Group N</text><text x="1485" y="205" text-anchor="middle" class="s">last region</text>

  <path d="M505 235 V315" class="line"/>
  <rect x="80" y="315" width="1540" height="170" rx="8" fill="#eff6ff" class="box"/><text x="850" y="350" text-anchor="middle" class="t">Representative block group contents</text>
  <rect x="110" y="385" width="220" height="70" fill="#fce7f3" class="box"/><text x="220" y="414" text-anchor="middle" class="t">Superblock copy</text><text x="220" y="441" text-anchor="middle" class="s">global geometry/features</text>
  <rect x="330" y="385" width="240" height="70" fill="#ede9fe" class="box"/><text x="450" y="414" text-anchor="middle" class="t">Group descriptors</text><text x="450" y="441" text-anchor="middle" class="s">locations + free counts</text>
  <rect x="570" y="385" width="210" height="70" fill="#fef3c7" class="box"/><text x="675" y="414" text-anchor="middle" class="t">Block bitmap</text><text x="675" y="441" text-anchor="middle" class="s">free/used blocks</text>
  <rect x="780" y="385" width="210" height="70" fill="#fef3c7" class="box"/><text x="885" y="414" text-anchor="middle" class="t">Inode bitmap</text><text x="885" y="441" text-anchor="middle" class="s">free/used inodes</text>
  <rect x="990" y="385" width="260" height="70" fill="#ffedd5" class="box"/><text x="1120" y="414" text-anchor="middle" class="t">Inode table</text><text x="1120" y="441" text-anchor="middle" class="s">fixed-size inode records</text>
  <rect x="1250" y="385" width="340" height="70" fill="#dcfce7" class="box"/><text x="1420" y="414" text-anchor="middle" class="t">Data / directory / extent blocks</text><text x="1420" y="441" text-anchor="middle" class="s">allocated according to local policy</text>

  <rect x="100" y="560" width="680" height="240" rx="8" fill="#f5f3ff" class="box"/><text x="440" y="600" text-anchor="middle" class="t">Superblock and group descriptors answer</text>
  <text x="150" y="650" class="s">- Which features and block size define this format?</text><text x="150" y="684" class="s">- Where are allocation maps and inode tables?</text><text x="150" y="718" class="s">- Which groups have suitable free space?</text><text x="150" y="752" class="s">- Is this filesystem clean, mounted, or recovering?</text>
  <rect x="920" y="560" width="680" height="240" rx="8" fill="#fff7ed" class="box"/><text x="1260" y="600" text-anchor="middle" class="t">Journal as a reserved special file/region</text>
  <rect x="980" y="650" width="160" height="70" fill="#fef3c7" class="box"/><text x="1060" y="680" text-anchor="middle" class="s">journal</text><text x="1060" y="706" text-anchor="middle" class="s">superblock</text>
  <rect x="1140" y="650" width="190" height="70" fill="#fde68a" class="box"/><text x="1235" y="680" text-anchor="middle" class="s">descriptor +</text><text x="1235" y="706" text-anchor="middle" class="s">logged blocks</text>
  <rect x="1330" y="650" width="180" height="70" fill="#dcfce7" class="box"/><text x="1420" y="680" text-anchor="middle" class="s">commit</text><text x="1420" y="706" text-anchor="middle" class="s">record</text>
  <path d="M1100 560 V515 H450 V455" class="brace"/>
  <text x="850" y="850" text-anchor="middle" class="s">This is an ext-family teaching model, not a universal layout: other filesystems organize trees, logs and allocation state differently.</text>
</svg>
