<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Diagnosing an end-to-end performance regression</title><desc id="desc">Baseline and incident waterfalls show unchanged DNS and network connection time but a much larger origin processing phase after a deployment.</desc>
  <rect width="1200" height="620" fill="#fff"/><style>.h{font:700 27px Arial,sans-serif;fill:#17212b}.t{font:700 18px Arial,sans-serif;fill:#17212b}.s{font:15px Arial,sans-serif;fill:#3d4e5c}.axis{stroke:#657583;stroke-width:2}.dash{stroke:#b5bec6;stroke-dasharray:5 5}</style>
  <text class="h" x="600" y="43" text-anchor="middle">Localize the Delta, Not Just the Slow Request</text>
  <line class="axis" x1="200" y1="480" x2="1120" y2="480"/><g class="s" text-anchor="middle"><text x="200" y="507">0</text><text x="384" y="507">100</text><text x="568" y="507">200</text><text x="752" y="507">300</text><text x="936" y="507">400</text><text x="1120" y="507">500 ms</text></g>
  <g class="dash"><line x1="384" y1="90" x2="384" y2="480"/><line x1="568" y1="90" x2="568" y2="480"/><line x1="752" y1="90" x2="752" y2="480"/><line x1="936" y1="90" x2="936" y2="480"/></g>
  <text class="t" x="180" y="158" text-anchor="end">Baseline p95</text><text class="t" x="180" y="338" text-anchor="end">Incident p95</text>
  <g transform="translate(200 110)"><rect width="46" height="72" fill="#2878b5"/><rect x="46" width="74" height="72" fill="#2f855a"/><rect x="120" width="66" height="72" fill="#7651a8"/><rect x="186" width="110" height="72" fill="#b7791f"/><rect x="296" width="37" height="72" fill="#b64a4a"/></g>
  <g transform="translate(200 290)"><rect width="48" height="72" fill="#2878b5"/><rect x="48" width="78" height="72" fill="#2f855a"/><rect x="126" width="70" height="72" fill="#7651a8"/><rect x="196" width="606" height="72" fill="#b7791f"/><rect x="802" width="46" height="72" fill="#b64a4a"/></g>
  <g class="s"><text x="208" y="101">DNS</text><text x="260" y="101">connect</text><text x="332" y="101">TLS</text><text x="410" y="101">server</text><text x="504" y="101">body</text></g>
  <path d="M1010 275L825 326" stroke="#b64a4a" stroke-width="3" fill="none"/><rect x="870" y="205" width="275" height="75" rx="7" fill="#fbeaea" stroke="#b64a4a"/><text class="t" x="1008" y="234" text-anchor="middle">Largest delta: server phase</text><text class="s" x="1008" y="259" text-anchor="middle">correlates with deployment c42</text>
  <g transform="translate(200 410)"><rect width="165" height="36" fill="#2878b5"/><text class="s" x="82" y="24" fill="#fff" text-anchor="middle">client timing</text><rect x="180" width="165" height="36" fill="#2f855a"/><text class="s" x="262" y="24" fill="#fff" text-anchor="middle">packet evidence</text><rect x="360" width="165" height="36" fill="#7651a8"/><text class="s" x="442" y="24" fill="#fff" text-anchor="middle">server trace</text><rect x="540" width="165" height="36" fill="#b7791f"/><text class="s" x="622" y="24" fill="#fff" text-anchor="middle">deploy history</text></g>
  <text class="s" x="600" y="555" text-anchor="middle">Unchanged handshake RTT and retransmission rate reject a path-congestion hypothesis for this population.</text><text class="s" x="600" y="582" text-anchor="middle">A canary rollback should restore the original SLI before the incident is declared recovered.</text>
</svg>
