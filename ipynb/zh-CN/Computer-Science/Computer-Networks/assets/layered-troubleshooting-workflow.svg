<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" role="img" aria-labelledby="title desc">
  <title id="title">Layered network troubleshooting workflow</title><desc id="desc">A hypothesis-driven loop scopes the symptom, checks layers from local link to application, applies one reversible change, and verifies recovery.</desc>
  <rect width="1200" height="670" fill="#fff"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#586a78"/></marker></defs><style>.h{font:700 27px Arial,sans-serif;fill:#17212b}.t{font:700 17px Arial,sans-serif;fill:#17212b}.s{font:14px Arial,sans-serif;fill:#3d4e5c}.a{stroke:#586a78;stroke-width:3;fill:none;marker-end:url(#a)}</style>
  <text class="h" x="600" y="42" text-anchor="middle">Troubleshooting Is a Controlled Evidence Loop</text>
  <g transform="translate(40 92)"><rect width="190" height="112" rx="7" fill="#e8f1fb" stroke="#2878b5" stroke-width="2"/><text class="t" x="95" y="34" text-anchor="middle">Scope symptom</text><text class="s" x="18" y="62">users, regions, protocols</text><text class="s" x="18" y="84">start time, good controls</text></g><path class="a" d="M235 148H285"/>
  <g transform="translate(290 92)"><rect width="190" height="112" rx="7" fill="#eaf6ef" stroke="#2f855a" stroke-width="2"/><text class="t" x="95" y="34" text-anchor="middle">State hypothesis</text><text class="s" x="18" y="62">predicted evidence</text><text class="s" x="18" y="84">falsifying observation</text></g><path class="a" d="M485 148H535"/>
  <g transform="translate(540 92)"><rect width="190" height="112" rx="7" fill="#fff4dd" stroke="#b7791f" stroke-width="2"/><text class="t" x="95" y="34" text-anchor="middle">Collect minimum</text><text class="s" x="18" y="62">two relevant signals</text><text class="s" x="18" y="84">from useful vantage points</text></g><path class="a" d="M735 148H785"/>
  <g transform="translate(790 92)"><rect width="165" height="112" rx="7" fill="#f2edfb" stroke="#7651a8" stroke-width="2"/><text class="t" x="82" y="34" text-anchor="middle">Rank causes</text><text class="s" x="18" y="62">fit + prior + blast</text><text class="s" x="18" y="84">radius + change history</text></g><path class="a" d="M960 148H1010"/>
  <g transform="translate(1015 92)"><rect width="145" height="112" rx="7" fill="#fbeaea" stroke="#b64a4a" stroke-width="2"/><text class="t" x="72" y="34" text-anchor="middle">Act safely</text><text class="s" x="15" y="62">one variable</text><text class="s" x="15" y="84">rollback ready</text></g>
  <text class="t" x="600" y="252" text-anchor="middle">Layer checks: stop when evidence localizes the fault; do not mechanically run every command</text>
  <g transform="translate(65 285)">
    <rect width="1070" height="58" rx="6" fill="#e8f1fb" stroke="#2878b5"/><text class="t" x="28" y="35">Link / local</text><text class="s" x="185" y="35">carrier, errors, duplex, Wi-Fi association, interface, recent physical change</text>
    <rect y="70" width="1070" height="58" rx="6" fill="#eaf6ef" stroke="#2f855a"/><text class="t" x="28" y="105">Addressing</text><text class="s" x="185" y="105">IP/prefix, route to gateway, ARP/ND state, DHCP lease, duplicate address</text>
    <rect y="140" width="1070" height="58" rx="6" fill="#fff4dd" stroke="#b7791f"/><text class="t" x="28" y="175">Routing / path</text><text class="s" x="185" y="175">FIB, policy, path change, MTU, asymmetric direction, NAT/firewall state</text>
    <rect y="210" width="1070" height="58" rx="6" fill="#f2edfb" stroke="#7651a8"/><text class="t" x="28" y="245">Transport</text><text class="s" x="185" y="245">handshake, retransmission, RTT, receive window, queueing, congestion control</text>
    <rect y="280" width="1070" height="58" rx="6" fill="#fbeaea" stroke="#b64a4a"/><text class="t" x="28" y="315">Service</text><text class="s" x="185" y="315">DNS answer, TLS identity, HTTP status, dependency latency, authorization semantics</text>
  </g>
  <path class="a" d="M1088 204V256H1148V575H1098"/>
  <text class="s" x="600" y="655" text-anchor="middle">Recovery is verified against the original user-facing success criterion and a control population.</text>
</svg>
