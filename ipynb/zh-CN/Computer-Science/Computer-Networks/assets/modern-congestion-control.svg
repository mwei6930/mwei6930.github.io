<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc">
  <title id="title">Signals and control laws used by modern congestion-control algorithms</title>
  <desc id="desc">Four panels compare CUBIC window growth around a previous maximum, Vegas queue-delay inference, BBR estimation of bottleneck bandwidth and propagation round-trip time, and DCTCP proportional response to ECN marking fraction.</desc>
  <style>.t{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#172554}.h{font-size:28px;font-weight:700}.s{font-size:20px;font-weight:700}.b{font-size:15px}.n{font-size:13px;fill:#475569}.p{fill:#fff;stroke:#94a3b8;stroke-width:2}.axis{stroke:#475569;stroke-width:2}</style>
  <rect width="1400" height="800" fill="#f8fafc"/><text x="700" y="42" text-anchor="middle" class="t h">Modern algorithms differ mainly in what they measure and how they react</text>
  <g class="t">
    <rect x="35" y="75" width="645" height="325" rx="10" class="p"/><text x="65" y="110" class="s">CUBIC: elapsed time since congestion</text>
    <line x1="105" y1="335" x2="620" y2="335" class="axis"/><line x1="105" y1="335" x2="105" y2="145" class="axis"/>
    <line x1="430" y1="335" x2="430" y2="145" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 6"/><line x1="105" y1="218" x2="620" y2="218" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 6"/>
    <path d="M115 310 C205 270 315 225 430 218 C520 213 560 175 615 115" fill="none" stroke="#2563eb" stroke-width="6"/>
    <circle cx="430" cy="218" r="8" fill="#111827"/><text x="442" y="207" class="b">previous Wmax</text><text x="430" y="360" text-anchor="middle" class="n">K</text>
    <text x="175" y="285" class="n">concave: cautious return</text><text x="462" y="170" class="n">convex: probe above Wmax</text><text x="362" y="240" class="n">plateau</text>
    <text x="365" y="387" text-anchor="middle" class="b">W(t) = C(t - K)^3 + Wmax; loss multiplies window by beta</text>

    <rect x="720" y="75" width="645" height="325" rx="10" class="p"/><text x="750" y="110" class="s">Vegas: queueing delay before loss</text>
    <rect x="765" y="155" width="170" height="110" rx="8" fill="#dbeafe" stroke="#3b82f6"/><text x="850" y="188" text-anchor="middle" class="b" font-weight="700">Expected rate</text><text x="850" y="218" text-anchor="middle" class="b">cwnd / baseRTT</text><text x="850" y="246" text-anchor="middle" class="n">empty-path estimate</text>
    <rect x="1150" y="155" width="170" height="110" rx="8" fill="#fef3c7" stroke="#f59e0b"/><text x="1235" y="188" text-anchor="middle" class="b" font-weight="700">Actual rate</text><text x="1235" y="218" text-anchor="middle" class="b">cwnd / RTT</text><text x="1235" y="246" text-anchor="middle" class="n">observed ACK rate</text>
    <path d="M940 210 L1145 210" stroke="#7c3aed" stroke-width="5"/><text x="1042" y="194" text-anchor="middle" class="b">difference estimates queued data</text>
    <rect x="885" y="300" width="315" height="60" rx="8" fill="#dcfce7" stroke="#16a34a"/><text x="1042" y="326" text-anchor="middle" class="b">small difference: grow</text><text x="1042" y="348" text-anchor="middle" class="b">large difference: reduce</text>

    <rect x="35" y="435" width="645" height="325" rx="10" class="p"/><text x="65" y="470" class="s">BBR: model the path's operating point</text>
    <rect x="80" y="515" width="190" height="100" rx="8" fill="#dbeafe" stroke="#3b82f6"/><text x="175" y="548" text-anchor="middle" class="b" font-weight="700">BtlBw</text><text x="175" y="575" text-anchor="middle" class="b">delivery-rate estimate</text><text x="175" y="598" text-anchor="middle" class="n">bottleneck bandwidth</text>
    <rect x="445" y="515" width="190" height="100" rx="8" fill="#dcfce7" stroke="#16a34a"/><text x="540" y="548" text-anchor="middle" class="b" font-weight="700">RTprop</text><text x="540" y="575" text-anchor="middle" class="b">minimum RTT estimate</text><text x="540" y="598" text-anchor="middle" class="n">path propagation</text>
    <text x="355" y="570" text-anchor="middle" font-size="28" font-weight="700">x</text>
    <rect x="175" y="650" width="365" height="62" rx="8" fill="#ede9fe" stroke="#8b5cf6"/><text x="357" y="677" text-anchor="middle" class="b" font-weight="700">BDP target and pacing rate</text><text x="357" y="699" text-anchor="middle" class="n">probe model; do not wait only for overflow loss</text>

    <rect x="720" y="435" width="645" height="325" rx="10" class="p"/><text x="750" y="470" class="s">DCTCP: respond to how much traffic was ECN-marked</text>
    <rect x="760" y="525" width="170" height="95" rx="8" fill="#fef3c7" stroke="#f59e0b"/><text x="845" y="559" text-anchor="middle" class="b" font-weight="700">M</text><text x="845" y="585" text-anchor="middle" class="b">marked-byte fraction</text>
    <path d="M935 572 L1015 572" stroke="#2563eb" stroke-width="5"/>
    <rect x="1020" y="515" width="300" height="115" rx="8" fill="#dcfce7" stroke="#16a34a"/><text x="1170" y="548" text-anchor="middle" class="b">alpha = (1-g)alpha + gM</text><text x="1170" y="580" text-anchor="middle" class="b">cwnd = cwnd (1 - alpha/2)</text><text x="1170" y="607" text-anchor="middle" class="n">proportional, not one binary halving</text>
    <rect x="825" y="665" width="435" height="55" rx="8" fill="#fee2e2" stroke="#ef4444"/><text x="1042" y="690" text-anchor="middle" class="b" font-weight="700">Designed for controlled low-latency datacenter fabrics</text><text x="1042" y="710" text-anchor="middle" class="n">requires compatible marking and coexistence policy</text>
  </g>
</svg>
