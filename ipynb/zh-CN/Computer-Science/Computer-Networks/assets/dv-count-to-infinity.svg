<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 930" role="img" aria-labelledby="title desc">
  <title id="title">Distance-vector count-to-infinity after a failure</title>
  <desc id="desc">Routers A and B retain stale routes after destination X disconnects from C. They mistakenly advertise routes through one another and increase their metrics until the protocol infinity value.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2457a7"/></marker>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#172033}.section{font:700 24px Arial,sans-serif;fill:#172033}.txt{font:20px Arial,sans-serif;fill:#172033}.small{font:17px Arial,sans-serif;fill:#455269}.mono{font:19px Consolas,monospace;fill:#172033}.node{fill:#eef4fb;stroke:#2457a7;stroke-width:3}.edge{stroke:#2457a7;stroke-width:5}.failed{stroke:#b5473a;stroke-width:7;stroke-dasharray:12 8}.head{font:700 20px Arial,sans-serif;fill:#fff}.cell{font:20px Consolas,monospace;fill:#172033}.bad{font:700 20px Consolas,monospace;fill:#b5473a}</style>
  </defs>
  <rect width="1600" height="930" fill="#fff"/>
  <text x="65" y="62" class="title">Count-to-infinity: neighbors can reinforce stale information</text>

  <text x="70" y="122" class="section">Before failure</text>
  <circle cx="150" cy="230" r="55" class="node"/><text x="133" y="239" class="section">A</text>
  <circle cx="390" cy="230" r="55" class="node"/><text x="373" y="239" class="section">B</text>
  <circle cx="630" cy="230" r="55" class="node"/><text x="613" y="239" class="section">C</text>
  <rect x="820" y="180" width="175" height="100" rx="9" fill="#eef8f3" stroke="#147a54" stroke-width="3"/><text x="883" y="220" class="section">X</text><text x="850" y="255" class="small">destination</text>
  <line x1="205" y1="230" x2="335" y2="230" class="edge"/><line x1="445" y1="230" x2="575" y2="230" class="edge"/><line x1="685" y1="230" x2="820" y2="230" class="edge"/>
  <text x="250" y="210" class="mono">1</text><text x="490" y="210" class="mono">1</text><text x="735" y="210" class="mono">0</text>
  <text x="85" y="322" class="txt">Stable distance to X:</text><text x="295" y="322" class="mono">A=2 via B, B=1 via C, C=0</text>

  <text x="1080" y="122" class="section">Failure</text>
  <rect x="1060" y="160" width="430" height="170" rx="9" fill="#fdf0ec" stroke="#b5473a" stroke-width="3"/>
  <text x="1100" y="205" class="txt">C loses destination X.</text>
  <line x1="1110" y1="250" x2="1395" y2="250" class="failed"/>
  <line x1="1225" y1="215" x2="1280" y2="285" stroke="#b5473a" stroke-width="7"/><line x1="1280" y1="215" x2="1225" y2="285" stroke="#b5473a" stroke-width="7"/>
  <text x="1100" y="310" class="small">A and B have not yet discarded each other's stale claims.</text>

  <rect x="70" y="390" width="950" height="430" rx="9" fill="#f8fafc" stroke="#9aa9bd" stroke-width="2"/>
  <rect x="70" y="390" width="950" height="60" fill="#2457a7"/>
  <text x="100" y="429" class="head">Synchronous round</text><text x="360" y="429" class="head">A advertises</text><text x="565" y="429" class="head">B advertises</text><text x="770" y="429" class="head">What went wrong</text>
  <g>
    <line x1="70" y1="520" x2="1020" y2="520" stroke="#c5ceda"/><line x1="70" y1="590" x2="1020" y2="590" stroke="#c5ceda"/><line x1="70" y1="660" x2="1020" y2="660" stroke="#c5ceda"/><line x1="70" y1="730" x2="1020" y2="730" stroke="#c5ceda"/>
    <text x="120" y="495" class="cell">initial</text><text x="402" y="495" class="cell">2</text><text x="607" y="495" class="cell">1</text><text x="770" y="495" class="small">Both values were once true.</text>
    <text x="150" y="565" class="cell">1</text><text x="402" y="565" class="bad">2</text><text x="607" y="565" class="bad">3</text><text x="770" y="565" class="small">B believes A still has a path.</text>
    <text x="150" y="635" class="cell">2</text><text x="402" y="635" class="bad">4</text><text x="607" y="635" class="bad">3</text><text x="770" y="635" class="small">A now believes B's stale path.</text>
    <text x="150" y="705" class="cell">3</text><text x="402" y="705" class="bad">4</text><text x="607" y="705" class="bad">5</text><text x="770" y="705" class="small">The false route bounces.</text>
    <text x="150" y="775" class="cell">...</text><text x="402" y="775" class="bad">...</text><text x="607" y="775" class="bad">...</text><text x="770" y="775" class="small">Metrics rise toward protocol infinity.</text>
  </g>

  <rect x="1070" y="390" width="460" height="430" rx="9" fill="#eef8f3" stroke="#147a54" stroke-width="2"/>
  <text x="1100" y="435" class="section">Mitigations</text>
  <text x="1100" y="485" class="txt">Split horizon</text><text x="1100" y="513" class="small">Do not advertise a learned route back</text><text x="1100" y="538" class="small">toward the neighbor that supplied it.</text>
  <text x="1100" y="585" class="txt">Poison reverse</text><text x="1100" y="613" class="small">Advertise that reverse route explicitly</text><text x="1100" y="638" class="small">with infinity.</text>
  <text x="1100" y="685" class="txt">Triggered updates and timers</text><text x="1100" y="713" class="small">Spread bad news quickly and suppress</text><text x="1100" y="738" class="small">unstable alternatives temporarily.</text>
  <text x="1100" y="785" class="small">These reduce common loops; they do not</text><text x="1100" y="810" class="small">make every distributed failure instantaneous.</text>

  <text x="70" y="882" class="small">RIP chooses 16 as infinity, deliberately limiting network diameter so bad news cannot count forever.</text>
</svg>
