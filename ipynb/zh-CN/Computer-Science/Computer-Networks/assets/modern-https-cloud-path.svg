<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">End-to-end HTTPS request through programmable cloud infrastructure</title><desc id="desc">A client reaches anycast CDN edge, cloud load balancer, VPC overlay, Kubernetes gateway and service, pod, and database while several control planes program the path.</desc>
  <rect width="1200" height="630" fill="#fff"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#596b78"/></marker></defs><style>.h{font:700 27px Arial,sans-serif;fill:#17212b}.t{font:700 16px Arial,sans-serif;fill:#17212b}.s{font:14px Arial,sans-serif;fill:#3d4e5c}.a{stroke:#596b78;stroke-width:3;fill:none;marker-end:url(#a)}.c{stroke:#7651a8;stroke-width:2;fill:none;stroke-dasharray:7 6;marker-end:url(#a)}</style>
  <text class="h" x="600" y="43" text-anchor="middle">One Request, Many Independently Programmed Layers</text>
  <g transform="translate(25 145)"><rect width="120" height="85" rx="7" fill="#e8f1fb" stroke="#2878b5" stroke-width="2"/><text class="t" x="60" y="34" text-anchor="middle">Client</text><text class="s" x="60" y="61" text-anchor="middle">DNS + QUIC/TCP</text></g><path class="a" d="M150 187H190"/>
  <g transform="translate(195 125)"><rect width="145" height="125" rx="7" fill="#fff4dd" stroke="#b7791f" stroke-width="2"/><text class="t" x="72" y="31" text-anchor="middle">Anycast CDN</text><text class="s" x="72" y="57" text-anchor="middle">BGP selects edge</text><text class="s" x="72" y="80" text-anchor="middle">TLS + cache + WAF</text><text class="s" x="72" y="103" text-anchor="middle">origin route</text></g><path class="a" d="M345 187H385"/>
  <g transform="translate(390 125)"><rect width="145" height="125" rx="7" fill="#eaf6ef" stroke="#2f855a" stroke-width="2"/><text class="t" x="72" y="31" text-anchor="middle">Cloud LB</text><text class="s" x="72" y="57" text-anchor="middle">VIP + health</text><text class="s" x="72" y="80" text-anchor="middle">zone/backend</text><text class="s" x="72" y="103" text-anchor="middle">policy + proxy</text></g><path class="a" d="M540 187H580"/>
  <g transform="translate(585 125)"><rect width="145" height="125" rx="7" fill="#f2edfb" stroke="#7651a8" stroke-width="2"/><text class="t" x="72" y="31" text-anchor="middle">VPC overlay</text><text class="s" x="72" y="57" text-anchor="middle">route + SG/ACL</text><text class="s" x="72" y="80" text-anchor="middle">tunnel endpoint</text><text class="s" x="72" y="103" text-anchor="middle">underlay ECMP</text></g><path class="a" d="M735 187H775"/>
  <g transform="translate(780 125)"><rect width="145" height="125" rx="7" fill="#fbeaea" stroke="#b64a4a" stroke-width="2"/><text class="t" x="72" y="31" text-anchor="middle">K8s Gateway</text><text class="s" x="72" y="57" text-anchor="middle">HTTP route</text><text class="s" x="72" y="80" text-anchor="middle">Service/Endpoint</text><text class="s" x="72" y="103" text-anchor="middle">network policy</text></g><path class="a" d="M930 187H970"/>
  <g transform="translate(975 125)"><rect width="100" height="125" rx="7" fill="#e8f5f5" stroke="#267d7d" stroke-width="2"/><text class="t" x="50" y="31" text-anchor="middle">Pod</text><text class="s" x="50" y="57" text-anchor="middle">proxy?</text><text class="s" x="50" y="80" text-anchor="middle">app</text><text class="s" x="50" y="103" text-anchor="middle">trace</text></g><path class="a" d="M1080 187H1110"/><g transform="translate(1110 145)"><rect width="70" height="85" rx="7" fill="#fff4dd" stroke="#b7791f" stroke-width="2"/><text class="t" x="35" y="34" text-anchor="middle">DB</text><text class="s" x="35" y="60" text-anchor="middle">private</text></g>
  <g transform="translate(90 345)"><rect width="1020" height="180" rx="7" fill="#f7f9fb" stroke="#8a99a6"/><text class="t" x="510" y="34" text-anchor="middle">Control planes that must converge</text><text class="s" x="35" y="74">DNS and BGP: edge selection</text><text class="s" x="300" y="74">CDN/LB: backend health and policy</text><text class="s" x="660" y="74">Cloud: VPC route, identity, security rules</text><text class="s" x="35" y="112">Fabric/overlay: VTEP and ECMP state</text><text class="s" x="300" y="112">Kubernetes: Gateway, Service, EndpointSlice</text><text class="s" x="660" y="112">Application: discovery, retries, circuit breaking</text><text class="s" x="510" y="151" text-anchor="middle">Correlate request ID, connection tuple, endpoint identity, configuration version, and timestamps.</text></g>
  <path class="c" d="M267 340V255"/><path class="c" d="M462 340V255"/><path class="c" d="M657 340V255"/><path class="c" d="M852 340V255"/>
  <text class="s" x="600" y="590" text-anchor="middle">A failure may be stale control state even when every individual data-plane hop is healthy.</text>
</svg>
