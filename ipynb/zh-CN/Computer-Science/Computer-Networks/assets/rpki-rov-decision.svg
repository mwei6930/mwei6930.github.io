<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="780" viewBox="0 0 1280 780" role="img" aria-labelledby="title desc">
  <title id="title">RPKI route origin validation decision</title>
  <desc id="desc">A BGP announcement is compared with route origin authorizations to produce valid, invalid, or not found state before local routing policy.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#334155"/></marker><style>.h{font:700 30px Arial,sans-serif;fill:#172033}.s{font:700 18px Arial,sans-serif;fill:#172033}.t{font:15px Arial,sans-serif;fill:#334155}.tiny{font:13px Arial,sans-serif;fill:#475569}.box{fill:#fff;stroke:#64748b;stroke-width:2}.route{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.roa{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2}.valid{fill:#dcfce7;stroke:#059669;stroke-width:2}.invalid{fill:#fee2e2;stroke:#e11d48;stroke-width:2}.unknown{fill:#fef3c7;stroke:#d97706;stroke-width:2}.policy{fill:#fff7ed;stroke:#f97316;stroke-width:2}</style></defs>
  <rect width="1280" height="780" fill="#fff"/>
  <text x="44" y="52" class="h">RPKI Route Origin Validation: authorization before preference</text>
  <text x="44" y="80" class="t">ROV checks whether the origin AS may announce a prefix. It does not validate the complete AS path.</text>

  <rect x="55" y="130" width="330" height="145" rx="8" class="route"/>
  <text x="220" y="168" text-anchor="middle" class="s">Received BGP announcement</text>
  <text x="220" y="207" text-anchor="middle" class="t">prefix: 203.0.113.0/24</text>
  <text x="220" y="235" text-anchor="middle" class="t">AS_PATH: 64501 64510 64520</text>
  <text x="220" y="259" text-anchor="middle" class="tiny">origin = rightmost AS64520</text>

  <rect x="55" y="355" width="330" height="145" rx="8" class="roa"/>
  <text x="220" y="393" text-anchor="middle" class="s">Validated ROA payload</text>
  <text x="220" y="432" text-anchor="middle" class="t">prefix: 203.0.113.0/23</text>
  <text x="220" y="460" text-anchor="middle" class="t">maxLength: /24, ASN: 64520</text>
  <text x="220" y="484" text-anchor="middle" class="tiny">authorization comes from the RPKI</text>

  <rect x="485" y="245" width="310" height="170" rx="8" class="box"/>
  <text x="640" y="282" text-anchor="middle" class="s">Validator</text>
  <text x="515" y="320" class="t">1. Is a covering VRP present?</text>
  <text x="515" y="350" class="t">2. Is prefix length &lt;= maxLength?</text>
  <text x="515" y="380" class="t">3. Does origin ASN match?</text>
  <path d="M385 202 H485" stroke="#334155" stroke-width="3" marker-end="url(#a)"/>
  <path d="M385 428 H445 V360 H485" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#a)"/>

  <rect x="900" y="135" width="300" height="100" rx="8" class="valid"/>
  <text x="1050" y="174" text-anchor="middle" class="s">VALID</text>
  <text x="1050" y="202" text-anchor="middle" class="t">covering authorization + length + ASN</text>
  <rect x="900" y="270" width="300" height="100" rx="8" class="invalid"/>
  <text x="1050" y="309" text-anchor="middle" class="s">INVALID</text>
  <text x="1050" y="337" text-anchor="middle" class="t">cover exists, but length or ASN fails</text>
  <rect x="900" y="405" width="300" height="100" rx="8" class="unknown"/>
  <text x="1050" y="444" text-anchor="middle" class="s">NOT FOUND</text>
  <text x="1050" y="472" text-anchor="middle" class="t">no covering validated authorization</text>
  <path d="M795 300 H850 V185 H900" fill="none" stroke="#059669" stroke-width="3" marker-end="url(#a)"/>
  <path d="M795 330 H900" stroke="#e11d48" stroke-width="3" marker-end="url(#a)"/>
  <path d="M795 360 H850 V455 H900" fill="none" stroke="#d97706" stroke-width="3" marker-end="url(#a)"/>

  <rect x="485" y="560" width="715" height="130" rx="8" class="policy"/>
  <text x="842" y="598" text-anchor="middle" class="s">Local BGP import policy still decides</text>
  <text x="520" y="632" class="t">Common policy: reject INVALID; assign preference and monitoring treatment to VALID and NOT FOUND.</text>
  <text x="520" y="660" class="t">Route selection still considers local preference, path, communities, next hop, and operator intent.</text>
  <path d="M1050 505 V560" stroke="#334155" stroke-width="3" marker-end="url(#a)"/>

  <rect x="55" y="715" width="1145" height="42" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="75" y="742" class="s">Limitation:</text><text x="170" y="742" class="t">ROV can stop many unauthorized origins, but a valid origin can still leak a route or announce a misleading path.</text>
</svg>
