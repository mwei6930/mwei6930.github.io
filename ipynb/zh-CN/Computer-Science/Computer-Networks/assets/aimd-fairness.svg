<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" role="img" aria-labelledby="title desc">
  <title id="title">AIMD convergence toward efficiency and fairness</title>
  <desc id="desc">A two-flow rate plane shows the efficiency boundary x1 plus x2 equals capacity, the equal-rate fairness line, additive increase moving diagonally, and multiplicative decrease moving toward the origin until the trajectory approaches their intersection.</desc>
  <defs><marker id="ab" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#2563eb"/></marker><marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#dc2626"/></marker><style>.t{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#172554}.h{font-size:28px;font-weight:700}.s{font-size:18px;font-weight:700}.b{font-size:15px}.axis{stroke:#334155;stroke-width:3}.grid{stroke:#cbd5e1;stroke-width:1}.panel{fill:#fff;stroke:#94a3b8;stroke-width:2}</style></defs>
  <rect width="1000" height="780" fill="#f8fafc"/><text x="500" y="43" text-anchor="middle" class="t h">Why additive increase plus multiplicative decrease tends to share a bottleneck</text>
  <rect x="55" y="78" width="890" height="640" rx="10" class="panel"/>
  <g transform="translate(165 640)" class="t">
    <line x1="0" y1="0" x2="650" y2="0" class="axis"/><line x1="0" y1="0" x2="0" y2="-500" class="axis"/>
    <g class="grid"><line x1="130" y1="0" x2="130" y2="-500"/><line x1="260" y1="0" x2="260" y2="-500"/><line x1="390" y1="0" x2="390" y2="-500"/><line x1="520" y1="0" x2="520" y2="-500"/><line x1="0" y1="-100" x2="650" y2="-100"/><line x1="0" y1="-200" x2="650" y2="-200"/><line x1="0" y1="-300" x2="650" y2="-300"/><line x1="0" y1="-400" x2="650" y2="-400"/></g>
    <line x1="0" y1="-500" x2="650" y2="0" stroke="#7c3aed" stroke-width="4"/><text x="490" y="-155" class="s" fill="#6d28d9" transform="rotate(37 490 -155)">efficiency: x1 + x2 = C</text>
    <line x1="0" y1="0" x2="600" y2="-462" stroke="#16a34a" stroke-width="4" stroke-dasharray="10 7"/><text x="375" y="-310" class="s" fill="#15803d" transform="rotate(-38 375 -310)">fairness: x1 = x2</text>
    <circle cx="325" cy="-250" r="10" fill="#111827"/><text x="345" y="-260" class="s">efficient and equal</text>

    <path d="M80 -60 L245 -187" fill="none" stroke="#2563eb" stroke-width="5" marker-end="url(#ab)"/>
    <path d="M245 -187 L130 -99" fill="none" stroke="#dc2626" stroke-width="5" marker-end="url(#ar)"/>
    <path d="M130 -99 L365 -280" fill="none" stroke="#2563eb" stroke-width="5" marker-end="url(#ab)"/>
    <path d="M365 -280 L220 -169" fill="none" stroke="#dc2626" stroke-width="5" marker-end="url(#ar)"/>
    <path d="M220 -169 L342 -263" fill="none" stroke="#2563eb" stroke-width="5" marker-end="url(#ab)"/>
    <path d="M342 -263 L274 -211" fill="none" stroke="#dc2626" stroke-width="5" marker-end="url(#ar)"/>
    <path d="M274 -211 L330 -254" fill="none" stroke="#2563eb" stroke-width="5" marker-end="url(#ab)"/>
    <text x="63" y="-195" class="b" fill="#1d4ed8">additive increase:</text><text x="63" y="-171" class="b" fill="#1d4ed8">both add roughly equal capacity</text>
    <text x="408" y="-380" class="b" fill="#b91c1c">multiplicative decrease:</text><text x="408" y="-356" class="b" fill="#b91c1c">larger flow gives up more</text>
    <text x="645" y="34" text-anchor="end" class="s">flow 1 rate, x1</text><text x="-18" y="-475" text-anchor="end" class="s" transform="rotate(-90 -18 -475)">flow 2 rate, x2</text>
  </g>
  <text x="500" y="753" text-anchor="middle" class="t b">The geometry is intuition, not a guarantee: RTTs, marks, algorithms, and path bottlenecks may differ.</text>
</svg>
