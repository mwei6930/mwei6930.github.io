<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-labelledby="title desc">
  <title id="title">Cross-layer network attacks and defensive invariants</title>
  <desc id="desc">A table connecting application, naming, transport, network, link, and endpoint attacks to violated assumptions and layered defenses.</desc>
  <defs><style>.h{font:700 30px Arial,sans-serif;fill:#172033}.s{font:700 17px Arial,sans-serif;fill:#172033}.t{font:15px Arial,sans-serif;fill:#334155}.tiny{font:13px Arial,sans-serif;fill:#475569}.head{fill:#172033}.row{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.app{fill:#ede9fe}.name{fill:#dbeafe}.trans{fill:#dcfce7}.net{fill:#fef3c7}.link{fill:#ffedd5}.host{fill:#ffe4e6}.def{fill:#ecfdf5}</style></defs>
  <rect width="1280" height="900" fill="#fff"/>
  <text x="42" y="52" class="h">Attacks cross layers; defenses restore explicit invariants</text>
  <text x="42" y="80" class="t">A packet can be well formed at one layer and still violate the application's identity, freshness, capacity, or authorization assumptions.</text>
  <rect x="42" y="112" width="1196" height="52" rx="6" class="head"/>
  <text x="62" y="145" class="s" fill="#fff">Layer</text><text x="218" y="145" class="s" fill="#fff">Representative abuse</text><text x="535" y="145" class="s" fill="#fff">Broken assumption</text><text x="830" y="145" class="s" fill="#fff">Defensive invariant</text>

  <rect x="42" y="170" width="1196" height="105" class="row"/><rect x="42" y="170" width="145" height="105" class="app"/>
  <text x="62" y="207" class="s">Application</text><text x="62" y="235" class="tiny">HTTP, mail, APIs</text>
  <text x="218" y="207" class="t">credential stuffing, request replay,</text><text x="218" y="233" class="t">authorization bypass, expensive queries</text>
  <text x="535" y="207" class="t">authenticated user may perform</text><text x="535" y="233" class="t">this operation exactly once</text>
  <text x="830" y="207" class="t">authorize every object and action;</text><text x="830" y="233" class="t">idempotency, quotas, input limits</text>

  <rect x="42" y="281" width="1196" height="105" class="row"/><rect x="42" y="281" width="145" height="105" class="name"/>
  <text x="62" y="318" class="s">Naming</text><text x="62" y="346" class="tiny">DNS, certificates</text>
  <text x="218" y="318" class="t">cache poisoning, resolver redirection,</text><text x="218" y="344" class="t">misissued certificate</text>
  <text x="535" y="318" class="t">name maps to an authorized key</text><text x="535" y="344" class="t">and intended service</text>
  <text x="830" y="318" class="t">DNSSEC where applicable; PKIX path +</text><text x="830" y="344" class="t">service identity + CT monitoring</text>

  <rect x="42" y="392" width="1196" height="105" class="row"/><rect x="42" y="392" width="145" height="105" class="trans"/>
  <text x="62" y="429" class="s">Transport</text><text x="62" y="457" class="tiny">TCP, QUIC, TLS</text>
  <text x="218" y="429" class="t">SYN flood, reset injection, replay,</text><text x="218" y="455" class="t">state exhaustion</text>
  <text x="535" y="429" class="t">peer owns return path; records are</text><text x="535" y="455" class="t">fresh, ordered, and within budget</text>
  <text x="830" y="429" class="t">cookies/tokens, replay windows, AEAD,</text><text x="830" y="455" class="t">timeouts and per-source budgets</text>

  <rect x="42" y="503" width="1196" height="105" class="row"/><rect x="42" y="503" width="145" height="105" class="net"/>
  <text x="62" y="540" class="s">Network</text><text x="62" y="568" class="tiny">IP and routing</text>
  <text x="218" y="540" class="t">source spoofing, amplification, BGP</text><text x="218" y="566" class="t">hijack or route leak</text>
  <text x="535" y="540" class="t">source is plausible; selected origin</text><text x="535" y="566" class="t">AS is authorized for the prefix</text>
  <text x="830" y="540" class="t">source validation, rate limits, RPKI ROV,</text><text x="830" y="566" class="t">diverse monitoring and routing policy</text>

  <rect x="42" y="614" width="1196" height="105" class="row"/><rect x="42" y="614" width="145" height="105" class="link"/>
  <text x="62" y="651" class="s">Link / access</text><text x="62" y="679" class="tiny">Ethernet, Wi-Fi</text>
  <text x="218" y="651" class="t">ARP spoofing, rogue AP, deauthentication,</text><text x="218" y="677" class="t">unauthorized attachment</text>
  <text x="535" y="651" class="t">local peer and access network are</text><text x="535" y="677" class="t">authenticated and isolated</text>
  <text x="830" y="651" class="t">802.1X, WPA3, protected management,</text><text x="830" y="677" class="t">DHCP snooping / ARP inspection</text>

  <rect x="42" y="725" width="1196" height="105" class="row"/><rect x="42" y="725" width="145" height="105" class="host"/>
  <text x="62" y="762" class="s">Endpoint</text><text x="62" y="790" class="tiny">browser, OS, server</text>
  <text x="218" y="762" class="t">malware, stolen keys, unsafe trust store,</text><text x="218" y="788" class="t">unpatched service</text>
  <text x="535" y="762" class="t">endpoint enforces policy and keeps</text><text x="535" y="788" class="t">secrets outside attacker control</text>
  <text x="830" y="762" class="t">hardening, key isolation, patching, EDR,</text><text x="830" y="788" class="t">least privilege and recovery</text>

  <rect x="42" y="848" width="1196" height="36" rx="6" class="def"/><text x="62" y="873" class="s">Defense in depth means independent failure barriers, not repeating the same trust assumption at several boxes.</text>
</svg>
