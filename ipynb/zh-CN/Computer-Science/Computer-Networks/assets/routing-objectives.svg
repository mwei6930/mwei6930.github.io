<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 850" role="img" aria-labelledby="title desc">
  <title id="title">Routing objectives can choose different paths</title>
  <desc id="desc">The same network offers a low-latency path, a high-capacity path, and a policy-preferred path. No single path is best for every objective.</desc>
  <defs>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2457a7"/></marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#147a54"/></marker>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#172033}.section{font:700 24px Arial,sans-serif;fill:#172033}.txt{font:20px Arial,sans-serif;fill:#172033}.small{font:17px Arial,sans-serif;fill:#455269}.node{fill:#eef4fb;stroke:#2457a7;stroke-width:3}.edge{stroke:#8b99ac;stroke-width:6;fill:none}.blue{stroke:#2457a7;stroke-width:7;fill:none;marker-end:url(#blueArrow)}.green{stroke:#147a54;stroke-width:7;fill:none;marker-end:url(#greenArrow)}.label{font:700 18px Consolas,monospace;fill:#172033}</style>
  </defs>
  <rect width="1500" height="850" fill="#fff"/>
  <text x="65" y="62" class="title">Routing chooses according to an objective, not a universal meaning of "best"</text>

  <g>
    <circle cx="150" cy="390" r="62" class="node"/><text x="116" y="398" class="section">R1</text>
    <circle cx="500" cy="210" r="62" class="node"/><text x="466" y="218" class="section">R2</text>
    <circle cx="500" cy="570" r="62" class="node"/><text x="466" y="578" class="section">R3</text>
    <circle cx="860" cy="390" r="62" class="node"/><text x="826" y="398" class="section">R4</text>
    <rect x="1040" y="330" width="260" height="120" rx="10" fill="#fff8e6" stroke="#d59b20" stroke-width="3"/>
    <text x="1080" y="380" class="section">Prefix P</text><text x="1080" y="418" class="txt">203.0.113.0/24</text>

    <path d="M205 360 L445 240" class="edge"/><path d="M555 240 L805 360" class="edge"/>
    <path d="M205 420 L445 540" class="edge"/><path d="M555 540 L805 420" class="edge"/>
    <path d="M922 390 L1040 390" class="edge"/>

    <text x="292" y="278" class="label">4 ms, cost 5</text><text x="642" y="278" class="label">4 ms, cost 5</text>
    <text x="270" y="535" class="label">8 ms, cost 2</text><text x="630" y="535" class="label">7 ms, cost 2</text>
    <text x="320" y="315" class="small">1 Gb/s</text><text x="320" y="578" class="small">10 Gb/s</text>
  </g>

  <rect x="70" y="690" width="420" height="115" rx="9" fill="#eef4fb" stroke="#2457a7" stroke-width="2"/>
  <text x="95" y="728" class="section">Lowest latency</text><text x="95" y="766" class="txt">R1 -> R2 -> R4: 8 ms</text><text x="95" y="792" class="small">Useful for delay-sensitive traffic.</text>
  <rect x="540" y="690" width="420" height="115" rx="9" fill="#eef8f3" stroke="#147a54" stroke-width="2"/>
  <text x="565" y="728" class="section">Lowest configured cost</text><text x="565" y="766" class="txt">R1 -> R3 -> R4: cost 4</text><text x="565" y="792" class="small">The metric can encode operator intent.</text>
  <rect x="1010" y="690" width="420" height="115" rx="9" fill="#f3ebfa" stroke="#7a4ca0" stroke-width="2"/>
  <text x="1035" y="728" class="section">Policy-preferred</text><text x="1035" y="766" class="txt">May ignore both numeric choices</text><text x="1035" y="792" class="small">Commercial or security rules can dominate.</text>

  <path d="M150 320 C290 90 660 80 860 320" class="blue" opacity="0.9"/>
  <path d="M150 460 C300 655 660 655 860 460" class="green" opacity="0.9"/>
</svg>
