<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="960" viewBox="0 0 1280 960" role="img" aria-labelledby="title desc">
  <title id="title">TLS 1.3 full handshake and key phases</title>
  <desc id="desc">A TLS 1.3 handshake sequence showing plaintext hello messages, encrypted authentication, finished verification, application data, and optional zero round trip early data.</desc>
  <defs>
    <marker id="right" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#2563eb"/></marker>
    <marker id="left" markerWidth="10" markerHeight="10" refX="1" refY="3" orient="auto"><path d="M9 0 L9 6 L0 3 z" fill="#059669"/></marker>
    <style>.h{font:700 30px Arial,sans-serif;fill:#172033}.s{font:700 18px Arial,sans-serif;fill:#172033}.t{font:15px Arial,sans-serif;fill:#334155}.tiny{font:13px Arial,sans-serif;fill:#475569}.lane{stroke:#64748b;stroke-width:3}.c{stroke:#2563eb;stroke-width:3}.v{stroke:#059669;stroke-width:3}.phase1{fill:#eff6ff}.phase2{fill:#ecfdf5}.phase3{fill:#f5f3ff}.warn{fill:#fff7ed;stroke:#f97316;stroke-width:2}.check{fill:#ecfdf5;stroke:#059669;stroke-width:2}</style>
  </defs>
  <rect width="1280" height="960" fill="#fff"/>
  <text x="44" y="50" class="h">TLS 1.3: agree, authenticate, verify, then protect application data</text>
  <text x="44" y="78" class="t">Full handshake without client authentication; message order follows RFC 8446.</text>
  <rect x="55" y="110" width="1170" height="180" rx="8" class="phase1"/>
  <rect x="55" y="300" width="1170" height="330" rx="8" class="phase2"/>
  <rect x="55" y="640" width="1170" height="180" rx="8" class="phase3"/>
  <text x="76" y="140" class="s">Plaintext negotiation</text>
  <text x="76" y="330" class="s">Encrypted handshake authentication</text>
  <text x="76" y="670" class="s">Application traffic keys</text>

  <text x="255" y="120" text-anchor="middle" class="s">Client</text>
  <text x="1025" y="120" text-anchor="middle" class="s">Server</text>
  <line x1="255" y1="132" x2="255" y2="865" class="lane"/>
  <line x1="1025" y1="132" x2="1025" y2="865" class="lane"/>

  <line x1="270" y1="175" x2="1010" y2="175" class="c" marker-end="url(#right)"/>
  <text x="640" y="165" text-anchor="middle" class="s">ClientHello</text>
  <text x="640" y="194" text-anchor="middle" class="tiny">supported versions, cipher suites, key_share, SNI or ECH, random</text>

  <line x1="1010" y1="245" x2="270" y2="245" class="v" marker-end="url(#left)"/>
  <text x="640" y="235" text-anchor="middle" class="s">ServerHello</text>
  <text x="640" y="264" text-anchor="middle" class="tiny">selected parameters + key_share; both sides derive handshake traffic secrets</text>

  <line x1="1010" y1="365" x2="270" y2="365" class="v" marker-end="url(#left)"/>
  <text x="640" y="355" text-anchor="middle" class="s">EncryptedExtensions</text>
  <text x="640" y="384" text-anchor="middle" class="tiny">negotiated extensions; ALPN and accepted ECH state belong here</text>

  <line x1="1010" y1="430" x2="270" y2="430" class="v" marker-end="url(#left)"/>
  <text x="640" y="420" text-anchor="middle" class="s">Certificate</text>
  <text x="640" y="449" text-anchor="middle" class="tiny">leaf and intermediates; client builds a path to a local trust anchor</text>

  <line x1="1010" y1="495" x2="270" y2="495" class="v" marker-end="url(#left)"/>
  <text x="640" y="485" text-anchor="middle" class="s">CertificateVerify</text>
  <text x="640" y="514" text-anchor="middle" class="tiny">signature over the transcript proves possession of the certificate private key</text>

  <line x1="1010" y1="560" x2="270" y2="560" class="v" marker-end="url(#left)"/>
  <text x="640" y="550" text-anchor="middle" class="s">Finished</text>
  <text x="640" y="579" text-anchor="middle" class="tiny">MAC over the transcript detects changed or missing handshake messages</text>

  <rect x="78" y="470" width="150" height="120" rx="7" class="check"/>
  <text x="153" y="500" text-anchor="middle" class="s">Client checks</text>
  <text x="92" y="528" class="tiny">chain + validity</text>
  <text x="92" y="550" class="tiny">service identity</text>
  <text x="92" y="572" class="tiny">signature + Finished</text>

  <line x1="270" y1="605" x2="1010" y2="605" class="c" marker-end="url(#right)"/>
  <text x="640" y="596" text-anchor="middle" class="s">client Finished</text>
  <text x="640" y="625" text-anchor="middle" class="tiny">server verifies the client's view of the same transcript</text>

  <line x1="270" y1="710" x2="1010" y2="710" class="c" marker-end="url(#right)"/>
  <line x1="1010" y1="755" x2="270" y2="755" class="v" marker-end="url(#left)"/>
  <text x="640" y="700" text-anchor="middle" class="s">protected application data</text>
  <text x="640" y="746" text-anchor="middle" class="s">protected application data</text>
  <text x="640" y="786" text-anchor="middle" class="tiny">independent directional AEAD keys; sequence numbers derive unique nonces</text>

  <rect x="55" y="842" width="1170" height="86" rx="8" class="warn"/>
  <text x="78" y="875" class="s">Resumption and 0-RTT</text>
  <text x="78" y="903" class="t">A PSK ticket can shorten a later handshake. Early data may be replayed, so only explicitly replay-safe operations belong in 0-RTT.</text>
</svg>
