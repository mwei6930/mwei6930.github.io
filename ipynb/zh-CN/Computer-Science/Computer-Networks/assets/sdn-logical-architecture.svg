<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Software-defined networking logical architecture</title><desc id="desc">Applications express policy through northbound interfaces to a logically centralized controller cluster, which programs distributed forwarding devices through southbound interfaces.</desc>
  <rect width="1200" height="630" fill="#fff"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#596b78"/></marker></defs><style>.h{font:700 27px Arial,sans-serif;fill:#17212b}.t{font:700 18px Arial,sans-serif;fill:#17212b}.s{font:15px Arial,sans-serif;fill:#3d4e5c}.a{stroke:#596b78;stroke-width:3;fill:none;marker-end:url(#a)}</style>
  <text class="h" x="600" y="42" text-anchor="middle">Logical Centralization, Physical Distribution</text>
  <text class="t" x="70" y="98">Applications and intent</text>
  <g transform="translate(70 120)"><rect width="280" height="72" rx="7" fill="#e8f1fb" stroke="#2878b5" stroke-width="2"/><text class="t" x="140" y="30" text-anchor="middle">Traffic engineering</text><text class="s" x="140" y="54" text-anchor="middle">path and capacity policy</text><rect x="360" width="280" height="72" rx="7" fill="#eaf6ef" stroke="#2f855a" stroke-width="2"/><text class="t" x="500" y="30" text-anchor="middle">Security policy</text><text class="s" x="500" y="54" text-anchor="middle">reachability and isolation</text><rect x="720" width="280" height="72" rx="7" fill="#fff4dd" stroke="#b7791f" stroke-width="2"/><text class="t" x="860" y="30" text-anchor="middle">Operations</text><text class="s" x="860" y="54" text-anchor="middle">inventory and remediation</text></g>
  <text class="s" x="600" y="226" text-anchor="middle">northbound models / APIs: desired behavior, topology queries, events</text><path class="a" d="M600 240V278"/>
  <g transform="translate(245 285)"><rect width="710" height="150" rx="7" fill="#f2edfb" stroke="#7651a8" stroke-width="3"/><text class="t" x="355" y="34" text-anchor="middle">Controller cluster - logically one control service</text><rect x="28" y="58" width="190" height="65" rx="5" fill="#fff" stroke="#7651a8"/><text class="s" x="123" y="84" text-anchor="middle">network state database</text><text class="s" x="123" y="106" text-anchor="middle">topology + host location</text><rect x="260" y="58" width="190" height="65" rx="5" fill="#fff" stroke="#7651a8"/><text class="s" x="355" y="84" text-anchor="middle">policy compiler</text><text class="s" x="355" y="106" text-anchor="middle">path + rule generation</text><rect x="492" y="58" width="190" height="65" rx="5" fill="#fff" stroke="#7651a8"/><text class="s" x="587" y="84" text-anchor="middle">replication + leadership</text><text class="s" x="587" y="106" text-anchor="middle">failure and consistency</text></g>
  <text class="s" x="600" y="470" text-anchor="middle">southbound protocols / device APIs: install state, read counters, receive events</text><path class="a" d="M600 480V515"/>
  <g transform="translate(95 525)"><rect width="210" height="70" rx="7" fill="#e8f5f5" stroke="#267d7d" stroke-width="2"/><text class="t" x="105" y="31" text-anchor="middle">Switch A</text><text class="s" x="105" y="54" text-anchor="middle">local fast forwarding</text><rect x="255" width="210" height="70" rx="7" fill="#e8f5f5" stroke="#267d7d" stroke-width="2"/><text class="t" x="360" y="31" text-anchor="middle">Switch B</text><text class="s" x="360" y="54" text-anchor="middle">local fast forwarding</text><rect x="510" width="210" height="70" rx="7" fill="#e8f5f5" stroke="#267d7d" stroke-width="2"/><text class="t" x="615" y="31" text-anchor="middle">Router C</text><text class="s" x="615" y="54" text-anchor="middle">local fast forwarding</text><rect x="765" width="210" height="70" rx="7" fill="#e8f5f5" stroke="#267d7d" stroke-width="2"/><text class="t" x="870" y="31" text-anchor="middle">Virtual switch D</text><text class="s" x="870" y="54" text-anchor="middle">local fast forwarding</text></g>
</svg>
