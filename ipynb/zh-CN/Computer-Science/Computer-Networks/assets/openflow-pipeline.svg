<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">OpenFlow match-action pipeline</title><desc id="desc">A packet enters tables that match fields by priority, update metadata, apply actions, continue, output, or send an exception to a controller.</desc>
  <rect width="1200" height="560" fill="#fff"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#596b78"/></marker></defs><style>.h{font:700 27px Arial,sans-serif;fill:#17212b}.t{font:700 18px Arial,sans-serif;fill:#17212b}.s{font:15px Arial,sans-serif;fill:#3d4e5c}.m{font:14px Consolas,monospace;fill:#283640}.a{stroke:#596b78;stroke-width:3;fill:none;marker-end:url(#a)}</style>
  <text class="h" x="600" y="43" text-anchor="middle">Packets Execute Installed Match-Action State</text>
  <g transform="translate(45 130)"><rect width="150" height="100" rx="7" fill="#e8f1fb" stroke="#2878b5" stroke-width="2"/><text class="t" x="75" y="38" text-anchor="middle">Ingress packet</text><text class="s" x="75" y="67" text-anchor="middle">headers + port</text></g><path class="a" d="M200 180H255"/>
  <g transform="translate(260 90)"><rect width="250" height="250" rx="7" fill="#f7f9fb" stroke="#2f855a" stroke-width="2"/><text class="t" x="125" y="35" text-anchor="middle">Flow table 0</text><text class="m" x="20" y="73">priority 300: dst /32</text><text class="m" x="20" y="101"> -&gt; set next-hop, goto 1</text><text class="m" x="20" y="139">priority 200: tcp dst 443</text><text class="m" x="20" y="167"> -&gt; meter, goto 2</text><text class="m" x="20" y="205">priority 0: table miss</text><text class="m" x="20" y="233"> -&gt; drop or controller</text></g><path class="a" d="M515 180H570"/>
  <g transform="translate(575 90)"><rect width="250" height="250" rx="7" fill="#f7f9fb" stroke="#b7791f" stroke-width="2"/><text class="t" x="125" y="35" text-anchor="middle">Later tables</text><text class="s" x="22" y="75">match packet + metadata</text><text class="s" x="22" y="108">write action set</text><text class="s" x="22" y="141">modify header / meter</text><text class="s" x="22" y="174">group for ECMP / failover</text><text class="s" x="22" y="207">goto higher table only</text><text class="s" x="22" y="240">counters update per entry</text></g><path class="a" d="M830 180H885"/>
  <g transform="translate(890 130)"><rect width="260" height="100" rx="7" fill="#eaf6ef" stroke="#2f855a" stroke-width="2"/><text class="t" x="130" y="38" text-anchor="middle">Execute action set</text><text class="s" x="130" y="67" text-anchor="middle">output, drop, group, queue</text></g>
  <path class="a" d="M385 345V415H590"/><g transform="translate(590 380)"><rect width="270" height="110" rx="7" fill="#f2edfb" stroke="#7651a8" stroke-width="2"/><text class="t" x="135" y="35" text-anchor="middle">Controller exception path</text><text class="s" x="135" y="64" text-anchor="middle">packet-in / event is slower</text><text class="s" x="135" y="87" text-anchor="middle">and must be rate-limited</text></g>
  <text class="s" x="600" y="530" text-anchor="middle">The controller programs tables; established packets should normally remain on the switch fast path.</text>
</svg>
