<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">Leaf-spine ECMP forwarding and link failure</title><desc id="desc">Two leaf switches connect to four spines, flows hash over equal-cost paths, one failed link is removed and only affected flow buckets move.</desc>
  <rect width="1200" height="610" fill="#fff"/><style>.h{font:700 27px Arial,sans-serif;fill:#17212b}.t{font:700 18px Arial,sans-serif;fill:#17212b}.s{font:15px Arial,sans-serif;fill:#3d4e5c}.l{stroke:#6b7a86;stroke-width:4}.p1{stroke:#2878b5;stroke-width:8;fill:none}.p2{stroke:#2f855a;stroke-width:8;fill:none}.bad{stroke:#b64a4a;stroke-width:8;stroke-dasharray:10 8}</style>
  <text class="h" x="600" y="43" text-anchor="middle">ECMP Spreads Flows; Convergence Reassigns Affected Buckets</text>
  <g class="t" text-anchor="middle"><g transform="translate(150 100)"><rect width="160" height="70" rx="7" fill="#fff4dd" stroke="#b7791f" stroke-width="2"/><text x="80" y="42">Spine 1</text></g><g transform="translate(395 100)"><rect width="160" height="70" rx="7" fill="#fff4dd" stroke="#b7791f" stroke-width="2"/><text x="80" y="42">Spine 2</text></g><g transform="translate(645 100)"><rect width="160" height="70" rx="7" fill="#fff4dd" stroke="#b7791f" stroke-width="2"/><text x="80" y="42">Spine 3</text></g><g transform="translate(890 100)"><rect width="160" height="70" rx="7" fill="#fff4dd" stroke="#b7791f" stroke-width="2"/><text x="80" y="42">Spine 4</text></g></g>
  <g class="l"><line x1="230" y1="170" x2="360" y2="350"/><line x1="475" y1="170" x2="360" y2="350"/><line x1="725" y1="170" x2="360" y2="350"/><line x1="970" y1="170" x2="360" y2="350"/><line x1="230" y1="170" x2="840" y2="350"/><line x1="475" y1="170" x2="840" y2="350"/><line x1="725" y1="170" x2="840" y2="350"/><line x1="970" y1="170" x2="840" y2="350"/></g>
  <path class="p1" d="M360 350L475 170L840 350"/><path class="p2" d="M360 350L725 170L840 350"/><path class="bad" d="M360 350L970 170"/><line x1="720" y1="222" x2="755" y2="257" stroke="#b64a4a" stroke-width="9"/><line x1="755" y1="222" x2="720" y2="257" stroke="#b64a4a" stroke-width="9"/>
  <g transform="translate(245 350)"><rect width="230" height="85" rx="7" fill="#e8f1fb" stroke="#2878b5" stroke-width="2"/><text class="t" x="115" y="35" text-anchor="middle">Leaf A</text><text class="s" x="115" y="62" text-anchor="middle">servers / rack A</text></g><g transform="translate(725 350)"><rect width="230" height="85" rx="7" fill="#eaf6ef" stroke="#2f855a" stroke-width="2"/><text class="t" x="115" y="35" text-anchor="middle">Leaf B</text><text class="s" x="115" y="62" text-anchor="middle">servers / rack B</text></g>
  <g transform="translate(110 490)"><rect width="980" height="75" rx="7" fill="#f7f9fb" stroke="#8a99a6"/><text class="s" x="490" y="30" text-anchor="middle">Per-flow hashing preserves packet order, but unequal flow sizes can still create hot links.</text><text class="s" x="490" y="54" text-anchor="middle">After failure detection and FIB update, new traffic avoids the link; in-flight flows may reset, reorder, or pause.</text></g>
</svg>
