<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">TCP receiver flow control</title>
  <desc id="desc">The sender has bytes in flight toward a receiver buffer. Unread bytes occupy part of the buffer, free space becomes the advertised receive window, and the application drains data independently.</desc>
  <defs>
    <marker id="a1" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#2563eb"/></marker>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#15803d"/></marker>
  </defs>
  <rect width="1200" height="650" fill="#f8fafc"/>
  <text x="600" y="43" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="29" font-weight="700" fill="#172554">Flow control protects the receiving application</text>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="55" y="120" width="260" height="290" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
    <text x="185" y="157" text-anchor="middle" font-size="23" font-weight="700" fill="#1e3a8a">TCP sender</text>
    <rect x="90" y="190" width="190" height="58" rx="7" fill="#dbeafe" stroke="#60a5fa"/>
    <text x="185" y="215" text-anchor="middle" font-size="16" font-weight="700" fill="#1e40af">sent, not ACKed</text>
    <text x="185" y="237" text-anchor="middle" font-size="15" fill="#1e40af">4 KiB in flight</text>
    <rect x="90" y="270" width="190" height="82" rx="7" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="185" y="297" text-anchor="middle" font-size="16" font-weight="700" fill="#1e40af">send limit</text>
    <text x="185" y="322" text-anchor="middle" font-size="15" fill="#1e40af">min(rwnd, cwnd)</text>
    <text x="185" y="344" text-anchor="middle" font-size="15" fill="#1e40af">- bytes in flight</text>

    <rect x="500" y="95" width="390" height="400" rx="10" fill="#ffffff" stroke="#475569" stroke-width="2.5"/>
    <text x="695" y="132" text-anchor="middle" font-size="23" font-weight="700" fill="#1f2937">Receiver socket buffer: 16 KiB</text>
    <rect x="555" y="175" width="280" height="220" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <rect x="555" y="285" width="280" height="110" fill="#bfdbfe" stroke="#2563eb"/>
    <text x="695" y="330" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">10 KiB received</text>
    <text x="695" y="354" text-anchor="middle" font-size="16" fill="#1e3a8a">not yet read by application</text>
    <rect x="555" y="175" width="280" height="110" fill="#dcfce7" stroke="#16a34a"/>
    <text x="695" y="220" text-anchor="middle" font-size="18" font-weight="700" fill="#14532d">6 KiB free</text>
    <text x="695" y="246" text-anchor="middle" font-size="16" fill="#14532d">advertised rwnd = 6 KiB</text>
    <text x="695" y="430" text-anchor="middle" font-size="16" fill="#475569">rwnd = capacity - unread bytes</text>
    <text x="695" y="459" text-anchor="middle" font-size="15" fill="#475569">ACK number and window are carried together.</text>

    <rect x="970" y="175" width="180" height="125" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="1060" y="210" text-anchor="middle" font-size="20" font-weight="700" fill="#78350f">Application</text>
    <text x="1060" y="240" text-anchor="middle" font-size="15" fill="#78350f">read() drains</text>
    <text x="1060" y="264" text-anchor="middle" font-size="15" fill="#78350f">4 KiB</text>
  </g>

  <line x1="315" y1="235" x2="500" y2="265" stroke="#2563eb" stroke-width="5" marker-end="url(#a1)"/>
  <text x="405" y="220" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#1e40af">data bytes</text>
  <line x1="500" y1="420" x2="315" y2="370" stroke="#15803d" stroke-width="4" marker-end="url(#a2)"/>
  <text x="400" y="424" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#166534">ACK + rwnd</text>
  <line x1="890" y1="285" x2="970" y2="240" stroke="#d97706" stroke-width="5" marker-end="url(#a2)"/>

  <rect x="180" y="535" width="840" height="75" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="600" y="565" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#334155">When rwnd reaches zero, normal data pauses; persist probes prevent a lost window update from deadlocking the connection.</text>
  <text x="600" y="592" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#475569">Flow control protects the receiver. Congestion control protects the network path.</text>
</svg>
