<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 760" role="img" aria-labelledby="title desc">
  <title id="title">Adaptive bitrate streaming control loop</title>
  <desc id="desc">An encoder creates several bitrate representations divided into equal media-time segments and described by a manifest. A player measures segment download throughput and playback buffer, chooses the next representation, downloads one segment through HTTP and a CDN, then updates its estimate.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#2563eb"/></marker><marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#16a34a"/></marker><style>.t{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#172554}.h{font-size:28px;font-weight:700}.s{font-size:18px;font-weight:700}.b{font-size:14px}.n{font-size:12px;fill:#475569}.p{fill:#fff;stroke:#94a3b8;stroke-width:2}</style></defs>
  <rect width="1360" height="760" fill="#f8fafc"/><text x="680" y="43" text-anchor="middle" class="t h">Adaptive streaming chooses each next segment from current evidence</text>
  <g class="t">
    <rect x="35" y="82" width="510" height="620" rx="10" class="p"/><text x="290" y="120" text-anchor="middle" class="s">Packager and CDN objects</text>
    <rect x="85" y="165" width="160" height="70" rx="8" fill="#ede9fe" stroke="#8b5cf6"/><text x="165" y="194" text-anchor="middle" class="b" font-weight="700">source media</text><text x="165" y="218" text-anchor="middle" class="n">one presentation timeline</text>
    <line x1="245" y1="200" x2="335" y2="200" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/><rect x="345" y="155" width="150" height="90" rx="8" fill="#dbeafe" stroke="#3b82f6"/><text x="420" y="187" text-anchor="middle" class="b" font-weight="700">encode</text><text x="420" y="211" text-anchor="middle" class="n">0.5, 1.5, 3, 6 Mb/s</text><text x="420" y="231" text-anchor="middle" class="n">aligned keyframes</text>
    <text x="85" y="300" class="b" font-weight="700">equal media duration, different bytes</text>
    <g><text x="92" y="352" class="b">0.5 Mb/s</text><rect x="190" y="325" width="72" height="42" fill="#dbeafe" stroke="#3b82f6"/><rect x="267" y="325" width="72" height="42" fill="#dbeafe" stroke="#3b82f6"/><rect x="344" y="325" width="72" height="42" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="92" y="422" class="b">1.5 Mb/s</text><rect x="190" y="395" width="110" height="42" fill="#dcfce7" stroke="#22c55e"/><rect x="305" y="395" width="110" height="42" fill="#dcfce7" stroke="#22c55e"/>
    <text x="92" y="492" class="b">3.0 Mb/s</text><rect x="190" y="465" width="150" height="42" fill="#fef3c7" stroke="#f59e0b"/><rect x="345" y="465" width="150" height="42" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="92" y="562" class="b">6.0 Mb/s</text><rect x="190" y="535" width="265" height="42" fill="#fee2e2" stroke="#ef4444"/></g>
    <rect x="85" y="615" width="400" height="55" rx="8" fill="#eff6ff" stroke="#60a5fa"/><text x="285" y="638" text-anchor="middle" class="b" font-weight="700">manifest: URLs, codecs, bitrates, segment timing</text><text x="285" y="659" text-anchor="middle" class="n">the manifest does not choose quality for the client</text>

    <rect x="585" y="82" width="740" height="620" rx="10" class="p"/><text x="955" y="120" text-anchor="middle" class="s">Player-side ABR feedback loop</text>
    <rect x="645" y="175" width="200" height="85" rx="8" fill="#dbeafe" stroke="#3b82f6"/><text x="745" y="205" text-anchor="middle" class="b" font-weight="700">measure</text><text x="745" y="229" text-anchor="middle" class="b">recent throughput</text><text x="745" y="249" text-anchor="middle" class="n">download bytes / time</text>
    <rect x="1045" y="175" width="200" height="85" rx="8" fill="#dcfce7" stroke="#22c55e"/><text x="1145" y="205" text-anchor="middle" class="b" font-weight="700">observe buffer</text><text x="1145" y="229" text-anchor="middle" class="b">seconds playable</text><text x="1145" y="249" text-anchor="middle" class="n">risk of rebuffering</text>
    <rect x="830" y="325" width="250" height="105" rx="8" fill="#fef3c7" stroke="#f59e0b"/><text x="955" y="357" text-anchor="middle" class="b" font-weight="700">choose next representation</text><text x="955" y="383" text-anchor="middle" class="b">bitrate below safe estimate</text><text x="955" y="408" text-anchor="middle" class="n">avoid oscillation with hysteresis</text>
    <line x1="790" y1="260" x2="895" y2="320" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/><line x1="1100" y1="260" x2="1015" y2="320" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/>
    <rect x="830" y="500" width="250" height="88" rx="8" fill="#ede9fe" stroke="#8b5cf6"/><text x="955" y="531" text-anchor="middle" class="b" font-weight="700">HTTP GET one segment</text><text x="955" y="556" text-anchor="middle" class="b">append, decode, play</text><text x="955" y="577" text-anchor="middle" class="n">segment completes before next decision</text>
    <line x1="955" y1="430" x2="955" y2="495" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/>
    <path d="M830 545 C690 545 640 430 690 270" fill="none" stroke="#16a34a" stroke-width="4" marker-end="url(#g)"/><path d="M1080 545 C1245 545 1285 420 1190 270" fill="none" stroke="#16a34a" stroke-width="4" marker-end="url(#g)"/>
    <rect x="650" y="625" width="610" height="45" rx="7" fill="#fee2e2" stroke="#ef4444"/><text x="955" y="653" text-anchor="middle" class="b">A higher bitrate is useful only if it avoids stalls and unstable quality switching.</text>
  </g>
</svg>
