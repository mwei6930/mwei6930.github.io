<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Per-request zero trust policy path</title>
  <desc id="desc">A subject and device request passes through a policy enforcement point while a policy engine evaluates identity, posture, resource, context, and telemetry.</desc>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#334155"/></marker>
    <style>.h{font:700 30px Arial,sans-serif;fill:#172033}.s{font:700 18px Arial,sans-serif;fill:#172033}.t{font:15px Arial,sans-serif;fill:#334155}.tiny{font:13px Arial,sans-serif;fill:#475569}.box{fill:#fff;stroke:#64748b;stroke-width:2}.subject{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.policy{fill:#fff7ed;stroke:#f97316;stroke-width:2}.allow{fill:#ecfdf5;stroke:#059669;stroke-width:2}.deny{fill:#fff1f2;stroke:#e11d48;stroke-width:2}.signal{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2}</style>
  </defs>
  <rect width="1280" height="760" fill="#fff"/>
  <text x="44" y="52" class="h">Zero trust: no network location grants durable trust</text>
  <text x="44" y="80" class="t">Every request is evaluated for a specific subject, device, action, resource, and moment.</text>

  <rect x="55" y="180" width="230" height="130" rx="8" class="subject"/>
  <text x="170" y="218" text-anchor="middle" class="s">Subject + device</text>
  <text x="170" y="248" text-anchor="middle" class="t">identity credential</text>
  <text x="170" y="273" text-anchor="middle" class="t">device posture + workload</text>

  <rect x="380" y="180" width="230" height="130" rx="8" class="policy"/>
  <text x="495" y="218" text-anchor="middle" class="s">Policy enforcement point</text>
  <text x="495" y="248" text-anchor="middle" class="t">authenticate channel</text>
  <text x="495" y="273" text-anchor="middle" class="t">allow, constrain, or deny</text>

  <rect x="980" y="180" width="230" height="130" rx="8" class="allow"/>
  <text x="1095" y="218" text-anchor="middle" class="s">Protected resource</text>
  <text x="1095" y="248" text-anchor="middle" class="t">one API / service / dataset</text>
  <text x="1095" y="273" text-anchor="middle" class="t">least-privilege action</text>

  <path d="M285 245 H380" stroke="#334155" stroke-width="3" marker-end="url(#a)"/>
  <path d="M610 245 H980" stroke="#334155" stroke-width="3" marker-end="url(#a)"/>
  <text x="332" y="228" text-anchor="middle" class="tiny">request</text>
  <text x="795" y="228" text-anchor="middle" class="tiny">short-lived authorized session</text>

  <rect x="380" y="395" width="430" height="230" rx="8" class="box"/>
  <text x="595" y="430" text-anchor="middle" class="s">Policy decision point</text>
  <rect x="405" y="458" width="170" height="52" rx="6" class="signal"/><text x="490" y="489" text-anchor="middle" class="t">identity + MFA</text>
  <rect x="615" y="458" width="170" height="52" rx="6" class="signal"/><text x="700" y="489" text-anchor="middle" class="t">device posture</text>
  <rect x="405" y="530" width="170" height="52" rx="6" class="signal"/><text x="490" y="561" text-anchor="middle" class="t">resource policy</text>
  <rect x="615" y="530" width="170" height="52" rx="6" class="signal"/><text x="700" y="561" text-anchor="middle" class="t">risk + context</text>
  <path d="M595 395 V320 H495 V310" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#a)"/>

  <rect x="55" y="420" width="245" height="145" rx="8" class="signal"/>
  <text x="177" y="458" text-anchor="middle" class="s">Continuous telemetry</text>
  <text x="177" y="488" text-anchor="middle" class="t">endpoint, identity, flow, app</text>
  <text x="177" y="513" text-anchor="middle" class="t">configuration and threat signals</text>
  <path d="M300 493 H380" stroke="#7c3aed" stroke-width="3" marker-end="url(#a)"/>

  <rect x="930" y="435" width="280" height="130" rx="8" class="deny"/>
  <text x="1070" y="473" text-anchor="middle" class="s">Deny or contain</text>
  <text x="1070" y="503" text-anchor="middle" class="t">expired identity, risky device,</text>
  <text x="1070" y="528" text-anchor="middle" class="t">forbidden action, anomalous session</text>
  <path d="M810 510 H930" stroke="#e11d48" stroke-width="3" marker-end="url(#a)"/>

  <rect x="55" y="665" width="1155" height="56" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="77" y="699" class="s">Key distinction:</text>
  <text x="226" y="699" class="t">segmentation limits reachable paths; identity-aware authorization decides whether this request may perform this action.</text>
</svg>
