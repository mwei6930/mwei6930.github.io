<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Network telemetry evidence pipeline</title><desc id="desc">Counters, flows, logs, traces, and packets are collected, normalized, enriched, retained, queried, and tied to a decision.</desc>
  <rect width="1200" height="600" fill="#fff"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#5f6f7c"/></marker></defs><style>.h{font:700 27px Arial,sans-serif;fill:#17212b}.t{font:700 18px Arial,sans-serif;fill:#17212b}.s{font:15px Arial,sans-serif;fill:#3d4e5c}.a{stroke:#5f6f7c;stroke-width:3;fill:none;marker-end:url(#a)}</style>
  <text class="h" x="600" y="44" text-anchor="middle">Telemetry Becomes Evidence Only After Context Is Preserved</text>
  <g transform="translate(45 92)">
    <rect width="190" height="360" rx="7" fill="#f7f9fb" stroke="#2878b5" stroke-width="2"/><text class="t" x="95" y="38" text-anchor="middle">Signals</text>
    <g class="s"><rect x="22" y="65" width="146" height="42" rx="5" fill="#e8f1fb"/><text x="95" y="91" text-anchor="middle">interface counters</text><rect x="22" y="121" width="146" height="42" rx="5" fill="#eaf6ef"/><text x="95" y="147" text-anchor="middle">flow records</text><rect x="22" y="177" width="146" height="42" rx="5" fill="#fff4dd"/><text x="95" y="203" text-anchor="middle">logs and events</text><rect x="22" y="233" width="146" height="42" rx="5" fill="#f2edfb"/><text x="95" y="259" text-anchor="middle">distributed traces</text><rect x="22" y="289" width="146" height="42" rx="5" fill="#fbeaea"/><text x="95" y="315" text-anchor="middle">packet captures</text></g>
  </g>
  <path class="a" d="M240 272H315"/>
  <g transform="translate(320 92)"><rect width="215" height="360" rx="7" fill="#f7f9fb" stroke="#2f855a" stroke-width="2"/><text class="t" x="107" y="38" text-anchor="middle">Collect + Normalize</text><text class="s" x="24" y="83">- synchronized timestamps</text><text class="s" x="24" y="116">- stable device identity</text><text class="s" x="24" y="149">- units and counter width</text><text class="s" x="24" y="182">- sampling probability</text><text class="s" x="24" y="215">- schema / version</text><text class="s" x="24" y="248">- loss and collection gaps</text><text class="s" x="24" y="281">- privacy classification</text><text class="s" x="24" y="314">- trace / request IDs</text></g>
  <path class="a" d="M540 272H615"/>
  <g transform="translate(620 92)"><rect width="215" height="360" rx="7" fill="#f7f9fb" stroke="#b7791f" stroke-width="2"/><text class="t" x="107" y="38" text-anchor="middle">Enrich + Retain</text><text class="s" x="24" y="83">- inventory and ownership</text><text class="s" x="24" y="116">- topology and region</text><text class="s" x="24" y="149">- configuration version</text><text class="s" x="24" y="182">- deployment / incident ID</text><text class="s" x="24" y="215">- access controls</text><text class="s" x="24" y="248">- raw and aggregate tiers</text><text class="s" x="24" y="281">- retention window</text><text class="s" x="24" y="314">- immutable audit trail</text></g>
  <path class="a" d="M840 272H915"/>
  <g transform="translate(920 92)"><rect width="235" height="360" rx="7" fill="#f7f9fb" stroke="#7651a8" stroke-width="2"/><text class="t" x="117" y="38" text-anchor="middle">Query + Decide</text><text class="s" x="24" y="83">- compare baseline</text><text class="s" x="24" y="116">- join by time and identity</text><text class="s" x="24" y="149">- inspect distributions</text><text class="s" x="24" y="182">- preserve counterexamples</text><text class="s" x="24" y="215">- rank hypotheses</text><text class="s" x="24" y="248">- change one variable</text><text class="s" x="24" y="281">- verify recovery</text><text class="s" x="24" y="314">- document uncertainty</text></g>
  <text class="s" x="600" y="510" text-anchor="middle">High-cardinality labels and raw packets are valuable but expensive and privacy-sensitive.</text>
  <text class="s" x="600" y="540" text-anchor="middle">A useful pipeline records what was not observed, not only what arrived.</text>
</svg>
