<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="780" viewBox="0 0 1500 780" role="img" aria-labelledby="title desc">
  <title id="title">Three steps of Ethernet switch learning</title>
  <desc id="desc">A switch first learns host A and floods an unknown destination, then learns host B from the reply, and finally forwards later A to B frames only to B's port.</desc>
  <defs>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563a6"/>
    </marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2f855a"/>
    </marker>
    <marker id="goldArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#b7791f"/>
    </marker>
  </defs>
  <rect width="1500" height="780" fill="#ffffff"/>
  <text x="750" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#172033">How a Learning Switch Builds Its Forwarding Table</text>
  <text x="750" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#475569">The source address teaches the switch; the destination address selects the action</text>

  <g font-family="Arial, sans-serif">
    <rect x="30" y="118" width="460" height="600" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="72" cy="158" r="23" fill="#2563a6"/>
    <text x="72" y="165" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">1</text>
    <text x="108" y="164" font-size="21" font-weight="700" fill="#172033">A sends to unknown B</text>

    <rect x="72" y="240" width="92" height="60" rx="6" fill="#e8f2ff" stroke="#2563a6" stroke-width="2"/>
    <text x="118" y="265" text-anchor="middle" font-size="17" font-weight="700" fill="#164e78">Host A</text>
    <text x="118" y="286" text-anchor="middle" font-size="13" fill="#27364b">MAC A</text>
    <rect x="254" y="225" width="135" height="90" rx="7" fill="#eef2f7" stroke="#475569" stroke-width="3"/>
    <text x="321" y="260" text-anchor="middle" font-size="19" font-weight="700" fill="#334155">Switch</text>
    <text x="321" y="286" text-anchor="middle" font-size="14" fill="#475569">P1  P2  P3</text>
    <rect x="72" y="410" width="92" height="60" rx="6" fill="#e8f8ee" stroke="#2f855a" stroke-width="2"/>
    <text x="118" y="435" text-anchor="middle" font-size="17" font-weight="700" fill="#17623f">Host B</text>
    <text x="118" y="456" text-anchor="middle" font-size="13" fill="#27364b">MAC B</text>
    <rect x="363" y="410" width="92" height="60" rx="6" fill="#fff6d8" stroke="#b7791f" stroke-width="2"/>
    <text x="409" y="435" text-anchor="middle" font-size="17" font-weight="700" fill="#8a4b10">Host C</text>
    <text x="409" y="456" text-anchor="middle" font-size="13" fill="#27364b">MAC C</text>
    <path d="M164 270 H244" stroke="#2563a6" stroke-width="4" marker-end="url(#blueArrow)"/>
    <path d="M294 315 V390 H164" fill="none" stroke="#b7791f" stroke-width="4" stroke-dasharray="8 5" marker-end="url(#goldArrow)"/>
    <path d="M350 315 V390 H409 V400" fill="none" stroke="#b7791f" stroke-width="4" stroke-dasharray="8 5" marker-end="url(#goldArrow)"/>
    <text x="230" y="346" font-size="14" fill="#8a4b10">flood P2, P3</text>
    <rect x="85" y="535" width="350" height="120" rx="6" fill="#ffffff" stroke="#64748b"/>
    <text x="260" y="565" text-anchor="middle" font-size="17" font-weight="700" fill="#172033">Forwarding database after step 1</text>
    <line x1="105" y1="583" x2="415" y2="583" stroke="#cbd5e1"/>
    <text x="145" y="611" font-family="Consolas, monospace" font-size="16" fill="#27364b">MAC A</text>
    <text x="286" y="611" font-family="Consolas, monospace" font-size="16" fill="#27364b">P1</text>
    <text x="350" y="611" font-family="Consolas, monospace" font-size="16" fill="#27364b">dynamic</text>

    <rect x="520" y="118" width="460" height="600" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="562" cy="158" r="23" fill="#2f855a"/>
    <text x="562" y="165" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">2</text>
    <text x="598" y="164" font-size="21" font-weight="700" fill="#172033">B replies to known A</text>

    <rect x="562" y="240" width="92" height="60" rx="6" fill="#e8f2ff" stroke="#2563a6" stroke-width="2"/>
    <text x="608" y="265" text-anchor="middle" font-size="17" font-weight="700" fill="#164e78">Host A</text>
    <text x="608" y="286" text-anchor="middle" font-size="13" fill="#27364b">MAC A</text>
    <rect x="744" y="225" width="135" height="90" rx="7" fill="#eef2f7" stroke="#475569" stroke-width="3"/>
    <text x="811" y="260" text-anchor="middle" font-size="19" font-weight="700" fill="#334155">Switch</text>
    <text x="811" y="286" text-anchor="middle" font-size="14" fill="#475569">P1  P2  P3</text>
    <rect x="562" y="410" width="92" height="60" rx="6" fill="#e8f8ee" stroke="#2f855a" stroke-width="2"/>
    <text x="608" y="435" text-anchor="middle" font-size="17" font-weight="700" fill="#17623f">Host B</text>
    <text x="608" y="456" text-anchor="middle" font-size="13" fill="#27364b">MAC B</text>
    <path d="M608 400 V350 H770 V315" fill="none" stroke="#2f855a" stroke-width="4" marker-end="url(#greenArrow)"/>
    <path d="M744 270 H664" stroke="#2563a6" stroke-width="4" marker-end="url(#blueArrow)"/>
    <text x="671" y="342" font-size="14" fill="#17623f">learn B on P2</text>
    <text x="675" y="256" font-size="14" fill="#164e78">forward P1 only</text>
    <rect x="575" y="535" width="350" height="120" rx="6" fill="#ffffff" stroke="#64748b"/>
    <text x="750" y="565" text-anchor="middle" font-size="17" font-weight="700" fill="#172033">Forwarding database after step 2</text>
    <line x1="595" y1="583" x2="905" y2="583" stroke="#cbd5e1"/>
    <text x="635" y="608" font-family="Consolas, monospace" font-size="16" fill="#27364b">MAC A</text>
    <text x="776" y="608" font-family="Consolas, monospace" font-size="16" fill="#27364b">P1</text>
    <text x="635" y="635" font-family="Consolas, monospace" font-size="16" fill="#27364b">MAC B</text>
    <text x="776" y="635" font-family="Consolas, monospace" font-size="16" fill="#27364b">P2</text>

    <rect x="1010" y="118" width="460" height="600" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="1052" cy="158" r="23" fill="#7c4dba"/>
    <text x="1052" y="165" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">3</text>
    <text x="1088" y="164" font-size="21" font-weight="700" fill="#172033">A sends to learned B</text>

    <rect x="1052" y="240" width="92" height="60" rx="6" fill="#e8f2ff" stroke="#2563a6" stroke-width="2"/>
    <text x="1098" y="265" text-anchor="middle" font-size="17" font-weight="700" fill="#164e78">Host A</text>
    <text x="1098" y="286" text-anchor="middle" font-size="13" fill="#27364b">MAC A</text>
    <rect x="1234" y="225" width="135" height="90" rx="7" fill="#eef2f7" stroke="#475569" stroke-width="3"/>
    <text x="1301" y="260" text-anchor="middle" font-size="19" font-weight="700" fill="#334155">Switch</text>
    <text x="1301" y="286" text-anchor="middle" font-size="14" fill="#475569">P1  P2  P3</text>
    <rect x="1052" y="410" width="92" height="60" rx="6" fill="#e8f8ee" stroke="#2f855a" stroke-width="2"/>
    <text x="1098" y="435" text-anchor="middle" font-size="17" font-weight="700" fill="#17623f">Host B</text>
    <text x="1098" y="456" text-anchor="middle" font-size="13" fill="#27364b">MAC B</text>
    <path d="M1144 270 H1224" stroke="#2563a6" stroke-width="4" marker-end="url(#blueArrow)"/>
    <path d="M1268 315 V350 H1098 V400" fill="none" stroke="#2f855a" stroke-width="4" marker-end="url(#greenArrow)"/>
    <text x="1152" y="342" font-size="14" fill="#17623f">forward P2 only</text>
    <rect x="1065" y="535" width="350" height="120" rx="6" fill="#ffffff" stroke="#64748b"/>
    <text x="1240" y="565" text-anchor="middle" font-size="17" font-weight="700" fill="#172033">Result</text>
    <text x="1240" y="600" text-anchor="middle" font-size="16" fill="#27364b">No frame reaches Host C.</text>
    <text x="1240" y="628" text-anchor="middle" font-size="16" fill="#27364b">Entries age out unless refreshed.</text>
  </g>
</svg>
