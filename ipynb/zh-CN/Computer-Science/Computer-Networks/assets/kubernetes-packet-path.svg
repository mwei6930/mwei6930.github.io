<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Kubernetes pod, service, policy, and ingress packet path</title><desc id="desc">A client reaches Gateway or Ingress, a Service selects endpoint pods, the node dataplane forwards across the pod network, and network policy constrains traffic.</desc>
  <rect width="1200" height="680" fill="#fff"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#596b78"/></marker></defs><style>.h{font:700 27px Arial,sans-serif;fill:#17212b}.t{font:700 18px Arial,sans-serif;fill:#17212b}.s{font:15px Arial,sans-serif;fill:#3d4e5c}.a{stroke:#596b78;stroke-width:3;fill:none;marker-end:url(#a)}.p{stroke:#2878b5;stroke-width:6;fill:none;marker-end:url(#a)}</style>
  <text class="h" x="600" y="43" text-anchor="middle">Kubernetes Names Objects; the Dataplane Still Forwards Packets</text>
  <g transform="translate(35 120)"><rect width="140" height="85" rx="7" fill="#e8f1fb" stroke="#2878b5" stroke-width="2"/><text class="t" x="70" y="33" text-anchor="middle">External client</text><text class="s" x="70" y="60" text-anchor="middle">DNS + public IP</text></g><path class="p" d="M180 162H250"/>
  <g transform="translate(255 105)"><rect width="185" height="115" rx="7" fill="#fff4dd" stroke="#b7791f" stroke-width="2"/><text class="t" x="92" y="32" text-anchor="middle">Gateway / Ingress</text><text class="s" x="92" y="59" text-anchor="middle">listener, hostname, route</text><text class="s" x="92" y="82" text-anchor="middle">TLS and L7 policy</text><text class="s" x="92" y="103" text-anchor="middle">implementation-specific</text></g><path class="p" d="M445 162H515"/>
  <g transform="translate(520 105)"><rect width="175" height="115" rx="7" fill="#f2edfb" stroke="#7651a8" stroke-width="2"/><text class="t" x="87" y="32" text-anchor="middle">Service ClusterIP</text><text class="s" x="87" y="59" text-anchor="middle">stable virtual address</text><text class="s" x="87" y="82" text-anchor="middle">selector / EndpointSlice</text><text class="s" x="87" y="103" text-anchor="middle">not a process itself</text></g>
  <path class="p" d="M700 162H770V300"/>
  <g transform="translate(735 270)"><rect width="430" height="300" rx="8" fill="#f7f9fb" stroke="#2f855a" stroke-width="3"/><text class="t" x="215" y="34" text-anchor="middle">Node B</text><g transform="translate(25 65)"><rect width="170" height="85" rx="7" fill="#e8f5f5" stroke="#267d7d" stroke-width="2"/><text class="t" x="85" y="32" text-anchor="middle">Node dataplane</text><text class="s" x="85" y="58" text-anchor="middle">iptables/nftables/IPVS</text><text class="s" x="85" y="78" text-anchor="middle">or eBPF implementation</text></g><g transform="translate(235 65)"><rect width="170" height="85" rx="7" fill="#e8f1fb" stroke="#2878b5" stroke-width="2"/><text class="t" x="85" y="32" text-anchor="middle">Pod B</text><text class="s" x="85" y="58" text-anchor="middle">10.244.2.17</text><text class="s" x="85" y="78" text-anchor="middle">app container(s)</text></g><path class="a" d="M200 107H230"/><g transform="translate(25 185)"><rect width="380" height="78" rx="7" fill="#fbeaea" stroke="#b64a4a" stroke-width="2"/><text class="t" x="190" y="31" text-anchor="middle">NetworkPolicy enforcement by network plugin</text><text class="s" x="190" y="57" text-anchor="middle">identity/IP/port rules; API alone does not forward packets</text></g></g>
  <g transform="translate(35 315)"><rect width="540" height="255" rx="8" fill="#f7f9fb" stroke="#2878b5" stroke-width="3"/><text class="t" x="270" y="34" text-anchor="middle">Node A</text><g transform="translate(25 65)"><rect width="190" height="90" rx="7" fill="#e8f1fb" stroke="#2878b5" stroke-width="2"/><text class="t" x="95" y="32" text-anchor="middle">Pod A namespace</text><text class="s" x="95" y="58" text-anchor="middle">eth0 - veth pair</text><text class="s" x="95" y="79" text-anchor="middle">10.244.1.12</text></g><g transform="translate(300 65)"><rect width="190" height="90" rx="7" fill="#eaf6ef" stroke="#2f855a" stroke-width="2"/><text class="t" x="95" y="32" text-anchor="middle">CNI-installed state</text><text class="s" x="95" y="58" text-anchor="middle">interface, route, IPAM</text><text class="s" x="95" y="79" text-anchor="middle">encap or native routing</text></g><path class="a" d="M220 110H295"/><g transform="translate(120 185)"><rect width="300" height="45" rx="6" fill="#fff4dd" stroke="#b7791f"/><text class="s" x="150" y="28" text-anchor="middle">pod network across nodes</text></g></g>
  <path class="p" d="M575 512H700V420H735"/>
  <text class="s" x="600" y="635" text-anchor="middle">A service mesh may add sidecar or node proxies, identity, retries, and telemetry, creating another data path to observe.</text>
</svg>
