<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">The four components of nodal delay</title>
  <desc id="desc">A packet enters a router, is processed, waits in a queue, is transmitted onto a link, and then propagates to the next router.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1200" height="620" fill="#ffffff"/>
  <text x="600" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#172033">One Packet at One Router</text>
  <text x="600" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#475569">Nodal delay is a sequence of different physical and computational costs</text>

  <rect x="40" y="158" width="165" height="190" rx="8" fill="#e8f2ff" stroke="#2563a6" stroke-width="3"/>
  <text x="122" y="196" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#164e78">1. Processing</text>
  <text x="122" y="232" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#27364b">Check header</text>
  <text x="122" y="258" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#27364b">verify checksum</text>
  <text x="122" y="284" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#27364b">choose output</text>
  <rect x="73" y="307" width="98" height="24" rx="4" fill="#2563a6"/>
  <text x="122" y="324" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#ffffff">d_proc</text>

  <line x1="205" y1="253" x2="260" y2="253" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="270" y="158" width="220" height="190" rx="8" fill="#fff6d8" stroke="#b7791f" stroke-width="3"/>
  <text x="380" y="196" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#8a4b10">2. Queueing</text>
  <text x="380" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#3f3423">Wait for earlier packets</text>
  <rect x="298" y="251" width="42" height="45" rx="4" fill="#efb23c" stroke="#8a4b10"/>
  <rect x="348" y="251" width="42" height="45" rx="4" fill="#efb23c" stroke="#8a4b10"/>
  <rect x="398" y="251" width="42" height="45" rx="4" fill="#efb23c" stroke="#8a4b10"/>
  <path d="M292 306 H448" stroke="#8a4b10" stroke-width="3"/>
  <text x="380" y="331" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#6f3c0d">d_queue</text>

  <line x1="490" y1="253" x2="545" y2="253" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="555" y="158" width="210" height="190" rx="8" fill="#e8f8ee" stroke="#2f855a" stroke-width="3"/>
  <text x="660" y="196" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#17623f">3. Transmission</text>
  <text x="660" y="228" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#27364b">Serialize L packet bits</text>
  <text x="660" y="254" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#27364b">at R bits per second</text>
  <rect x="596" y="278" width="128" height="18" fill="#4bb57a" stroke="#17623f"/>
  <path d="M600 303 H720" stroke="#17623f" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="660" y="331" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#17623f">d_trans = L / R</text>

  <line x1="765" y1="253" x2="820" y2="253" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="830" y="158" width="325" height="190" rx="8" fill="#f2ecff" stroke="#7c4dba" stroke-width="3"/>
  <text x="992" y="196" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#5d338f">4. Propagation</text>
  <text x="992" y="226" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#27364b">Signal crosses distance D</text>
  <line x1="868" y1="274" x2="1114" y2="274" stroke="#7c4dba" stroke-width="5" marker-end="url(#arrow)"/>
  <circle cx="880" cy="274" r="9" fill="#7c4dba"/>
  <text x="992" y="309" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#27364b">at medium speed s</text>
  <text x="992" y="333" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#5d338f">d_prop = D / s</text>

  <rect x="104" y="417" width="992" height="112" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="600" y="458" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#172033">d_nodal = d_proc + d_queue + d_trans + d_prop</text>
  <text x="600" y="492" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#475569">Only queueing delay is strongly traffic-dependent; transmission and propagation describe different phenomena.</text>
  <text x="600" y="562" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#64748b">Packet size controls serialization time. Physical distance controls propagation time.</text>
</svg>
