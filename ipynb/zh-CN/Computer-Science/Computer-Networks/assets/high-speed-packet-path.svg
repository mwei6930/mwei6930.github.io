<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Kernel, XDP, DPDK, SmartNIC, and DPU packet paths</title><desc id="desc">Packet-processing choices attach at different points from NIC hardware through XDP and the kernel stack to user space, with changing isolation, flexibility, and observability.</desc>
  <rect width="1200" height="650" fill="#fff"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#596b78"/></marker></defs><style>.h{font:700 27px Arial,sans-serif;fill:#17212b}.t{font:700 18px Arial,sans-serif;fill:#17212b}.s{font:15px Arial,sans-serif;fill:#3d4e5c}.a{stroke:#596b78;stroke-width:4;fill:none;marker-end:url(#a)}.b{stroke:#2878b5;stroke-width:5;fill:none;marker-end:url(#a)}.r{stroke:#b64a4a;stroke-width:5;fill:none;marker-end:url(#a)}</style>
  <text class="h" x="600" y="43" text-anchor="middle">Faster Paths Move Work Earlier and Change What the Host Can Observe</text>
  <g transform="translate(45 120)"><rect width="150" height="105" rx="7" fill="#fff4dd" stroke="#b7791f" stroke-width="2"/><text class="t" x="75" y="35" text-anchor="middle">Wire / NIC</text><text class="s" x="75" y="63" text-anchor="middle">RSS, checksum,</text><text class="s" x="75" y="84" text-anchor="middle">segmentation offload</text></g><path class="a" d="M200 172H260"/>
  <g transform="translate(265 100)"><rect width="180" height="145" rx="7" fill="#fbeaea" stroke="#b64a4a" stroke-width="2"/><text class="t" x="90" y="34" text-anchor="middle">XDP / eBPF</text><text class="s" x="90" y="63" text-anchor="middle">early receive hook</text><text class="s" x="90" y="86" text-anchor="middle">drop, redirect, pass</text><text class="s" x="90" y="109" text-anchor="middle">verified program</text><text class="s" x="90" y="132" text-anchor="middle">driver or generic mode</text></g><path class="a" d="M450 172H510"/>
  <g transform="translate(515 100)"><rect width="180" height="145" rx="7" fill="#e8f1fb" stroke="#2878b5" stroke-width="2"/><text class="t" x="90" y="34" text-anchor="middle">Kernel stack</text><text class="s" x="90" y="63" text-anchor="middle">skb, routing, netfilter</text><text class="s" x="90" y="86" text-anchor="middle">TCP/UDP sockets</text><text class="s" x="90" y="109" text-anchor="middle">mature semantics</text><text class="s" x="90" y="132" text-anchor="middle">context/cache costs</text></g><path class="a" d="M700 172H760"/>
  <g transform="translate(765 120)"><rect width="180" height="105" rx="7" fill="#eaf6ef" stroke="#2f855a" stroke-width="2"/><text class="t" x="90" y="35" text-anchor="middle">Application</text><text class="s" x="90" y="63" text-anchor="middle">socket API and</text><text class="s" x="90" y="84" text-anchor="middle">service semantics</text></g>
  <path class="r" d="M195 205V330H370"/><g transform="translate(375 300)"><rect width="260" height="120" rx="7" fill="#f2edfb" stroke="#7651a8" stroke-width="2"/><text class="t" x="130" y="34" text-anchor="middle">DPDK user-space path</text><text class="s" x="130" y="63" text-anchor="middle">poll-mode driver + hugepages</text><text class="s" x="130" y="86" text-anchor="middle">batching and CPU pinning</text><text class="s" x="130" y="107" text-anchor="middle">bypasses normal host stack</text></g><path class="r" d="M640 360H760V225"/>
  <g transform="translate(870 300)"><rect width="270" height="120" rx="7" fill="#e8f5f5" stroke="#267d7d" stroke-width="2"/><text class="t" x="135" y="34" text-anchor="middle">SmartNIC / DPU offload</text><text class="s" x="135" y="63" text-anchor="middle">switching, crypto, storage, policy</text><text class="s" x="135" y="86" text-anchor="middle">separate cores / accelerators</text><text class="s" x="135" y="107" text-anchor="middle">firmware becomes infrastructure</text></g><path class="b" d="M120 230V470H1005V425"/>
  <g transform="translate(95 500)"><rect width="1010" height="90" rx="7" fill="#f7f9fb" stroke="#8a99a6"/><text class="t" x="505" y="33" text-anchor="middle">Evaluate the whole system</text><text class="s" x="505" y="60" text-anchor="middle">throughput, p99 latency, CPU/NUMA, queueing, fairness, isolation, upgrade safety, and equivalent telemetry</text></g>
  <text class="s" x="600" y="630" text-anchor="middle">Bypassing work is not free: ownership, debuggability, portability, and failure recovery move with it.</text>
</svg>
