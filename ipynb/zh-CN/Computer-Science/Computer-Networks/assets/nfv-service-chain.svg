<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
  <title id="title">Virtual network functions and service chaining</title><desc id="desc">Classified traffic traverses firewall, load balancer, and intrusion detection functions placed across hosts, with scaling, state, and bypass considerations.</desc>
  <rect width="1200" height="590" fill="#fff"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#596b78"/></marker></defs><style>.h{font:700 27px Arial,sans-serif;fill:#17212b}.t{font:700 18px Arial,sans-serif;fill:#17212b}.s{font:15px Arial,sans-serif;fill:#3d4e5c}.a{stroke:#596b78;stroke-width:3;fill:none;marker-end:url(#a)}.d{stroke:#b64a4a;stroke-width:3;fill:none;stroke-dasharray:7 6;marker-end:url(#a)}</style>
  <text class="h" x="600" y="43" text-anchor="middle">A Service Chain Is a Stateful Distributed Path</text>
  <g transform="translate(45 125)"><rect width="155" height="92" rx="7" fill="#e8f1fb" stroke="#2878b5" stroke-width="2"/><text class="t" x="77" y="35" text-anchor="middle">Classifier</text><text class="s" x="77" y="64" text-anchor="middle">tenant + policy</text></g><path class="a" d="M205 171H270"/>
  <g transform="translate(275 105)"><rect width="180" height="132" rx="7" fill="#fbeaea" stroke="#b64a4a" stroke-width="2"/><text class="t" x="90" y="34" text-anchor="middle">Firewall VNF</text><text class="s" x="90" y="64" text-anchor="middle">connection state</text><text class="s" x="90" y="88" text-anchor="middle">scale set: fw-1, fw-2</text><text class="s" x="90" y="112" text-anchor="middle">failure: fail closed?</text></g><path class="a" d="M460 171H525"/>
  <g transform="translate(530 105)"><rect width="180" height="132" rx="7" fill="#eaf6ef" stroke="#2f855a" stroke-width="2"/><text class="t" x="90" y="34" text-anchor="middle">Load balancer</text><text class="s" x="90" y="64" text-anchor="middle">VIP + backend map</text><text class="s" x="90" y="88" text-anchor="middle">affinity / draining</text><text class="s" x="90" y="112" text-anchor="middle">health state</text></g><path class="a" d="M715 171H780"/>
  <g transform="translate(785 105)"><rect width="180" height="132" rx="7" fill="#fff4dd" stroke="#b7791f" stroke-width="2"/><text class="t" x="90" y="34" text-anchor="middle">IDS / monitor</text><text class="s" x="90" y="64" text-anchor="middle">copy or inline</text><text class="s" x="90" y="88" text-anchor="middle">ordering required?</text><text class="s" x="90" y="112" text-anchor="middle">overload policy</text></g><path class="a" d="M970 171H1035"/>
  <g transform="translate(1040 125)"><rect width="115" height="92" rx="7" fill="#f2edfb" stroke="#7651a8" stroke-width="2"/><text class="t" x="57" y="35" text-anchor="middle">Service</text><text class="s" x="57" y="64" text-anchor="middle">backend</text></g>
  <g transform="translate(100 310)"><rect width="1000" height="170" rx="7" fill="#f7f9fb" stroke="#8a99a6"/><text class="t" x="500" y="36" text-anchor="middle">Orchestrator decisions</text><text class="s" x="35" y="78">Placement: latency, NUMA, NIC, availability zone</text><text class="s" x="360" y="78">Scaling: capacity plus per-flow state transfer</text><text class="s" x="700" y="78">Steering: tunnel, segment list, switch rule</text><text class="s" x="35" y="116">Failure: bypass, fail-open, fail-closed, retry</text><text class="s" x="360" y="116">Symmetry: both directions see compatible state</text><text class="s" x="700" y="116">Evidence: per-hop latency and drop reason</text><text class="s" x="500" y="150" text-anchor="middle">The shortest compute placement is not necessarily the safest or most state-consistent path.</text></g>
  <path class="d" d="M365 245V275H875V245"/><text class="s" x="620" y="270" text-anchor="middle">unplanned bypass changes security semantics</text>
  <text class="s" x="600" y="548" text-anchor="middle">Virtualization changes deployment form; it does not remove forwarding, state, capacity, or failure constraints.</text>
</svg>
