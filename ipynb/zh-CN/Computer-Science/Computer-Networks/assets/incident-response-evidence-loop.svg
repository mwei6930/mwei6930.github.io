<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Network security incident response evidence loop</title>
  <desc id="desc">A six-stage incident response process from detection to learning, supported by synchronized evidence and explicit decision records.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#334155"/></marker><style>.h{font:700 30px Arial,sans-serif;fill:#172033}.s{font:700 18px Arial,sans-serif;fill:#172033}.t{font:15px Arial,sans-serif;fill:#334155}.tiny{font:13px Arial,sans-serif;fill:#475569}.step1{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.step2{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2}.step3{fill:#fff7ed;stroke:#f97316;stroke-width:2}.step4{fill:#fff1f2;stroke:#e11d48;stroke-width:2}.step5{fill:#ecfdf5;stroke:#059669;stroke-width:2}.step6{fill:#fef3c7;stroke:#d97706;stroke-width:2}.evidence{fill:#f8fafc;stroke:#64748b;stroke-width:2}</style></defs>
  <rect width="1280" height="760" fill="#fff"/>
  <text x="44" y="52" class="h">Incident response is a controlled evidence-and-decision loop</text>
  <text x="44" y="80" class="t">Fast containment matters, but unrecorded changes can destroy evidence and create a second outage.</text>

  <rect x="55" y="145" width="170" height="110" rx="8" class="step1"/><text x="140" y="183" text-anchor="middle" class="s">1. Detect</text><text x="140" y="213" text-anchor="middle" class="t">validate signal</text><text x="140" y="237" text-anchor="middle" class="tiny">false positive?</text>
  <rect x="255" y="145" width="170" height="110" rx="8" class="step2"/><text x="340" y="183" text-anchor="middle" class="s">2. Scope</text><text x="340" y="213" text-anchor="middle" class="t">assets + timeline</text><text x="340" y="237" text-anchor="middle" class="tiny">blast radius?</text>
  <rect x="455" y="145" width="170" height="110" rx="8" class="step3"/><text x="540" y="183" text-anchor="middle" class="s">3. Contain</text><text x="540" y="213" text-anchor="middle" class="t">limit harm</text><text x="540" y="237" text-anchor="middle" class="tiny">preserve service</text>
  <rect x="655" y="145" width="170" height="110" rx="8" class="step4"/><text x="740" y="183" text-anchor="middle" class="s">4. Eradicate</text><text x="740" y="213" text-anchor="middle" class="t">remove cause</text><text x="740" y="237" text-anchor="middle" class="tiny">rotate + patch</text>
  <rect x="855" y="145" width="170" height="110" rx="8" class="step5"/><text x="940" y="183" text-anchor="middle" class="s">5. Recover</text><text x="940" y="213" text-anchor="middle" class="t">restore safely</text><text x="940" y="237" text-anchor="middle" class="tiny">watch recurrence</text>
  <rect x="1055" y="145" width="170" height="110" rx="8" class="step6"/><text x="1140" y="183" text-anchor="middle" class="s">6. Learn</text><text x="1140" y="213" text-anchor="middle" class="t">fix system</text><text x="1140" y="237" text-anchor="middle" class="tiny">test controls</text>
  <path d="M225 200 H255" stroke="#334155" stroke-width="3" marker-end="url(#a)"/><path d="M425 200 H455" stroke="#334155" stroke-width="3" marker-end="url(#a)"/><path d="M625 200 H655" stroke="#334155" stroke-width="3" marker-end="url(#a)"/><path d="M825 200 H855" stroke="#334155" stroke-width="3" marker-end="url(#a)"/><path d="M1025 200 H1055" stroke="#334155" stroke-width="3" marker-end="url(#a)"/>
  <path d="M1140 255 V310 H140 V255" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#a)"/>
  <text x="640" y="302" text-anchor="middle" class="tiny">lessons update detections, architecture, runbooks, and exercises</text>

  <rect x="55" y="355" width="1170" height="220" rx="8" class="evidence"/>
  <text x="80" y="393" class="s">Evidence plane</text>
  <rect x="80" y="420" width="200" height="62" rx="6" class="step1"/><text x="180" y="457" text-anchor="middle" class="t">identity + authentication logs</text>
  <rect x="305" y="420" width="200" height="62" rx="6" class="step2"/><text x="405" y="457" text-anchor="middle" class="t">DNS + proxy + application</text>
  <rect x="530" y="420" width="200" height="62" rx="6" class="step3"/><text x="630" y="457" text-anchor="middle" class="t">flows + packet evidence</text>
  <rect x="755" y="420" width="200" height="62" rx="6" class="step5"/><text x="855" y="457" text-anchor="middle" class="t">endpoint + cloud control plane</text>
  <rect x="980" y="420" width="220" height="62" rx="6" class="step6"/><text x="1090" y="457" text-anchor="middle" class="t">configuration + change history</text>
  <text x="80" y="520" class="t">Synchronize clocks, retain raw identifiers, record collection gaps, hash exported artifacts, and distinguish observation from inference.</text>
  <text x="80" y="548" class="t">Every containment action should have an owner, timestamp, intended effect, rollback condition, and verification result.</text>

  <rect x="55" y="615" width="1170" height="92" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="80" y="650" class="s">Decision rule</text>
  <text x="80" y="680" class="t">Choose the smallest reversible action that meaningfully reduces harm, then verify with independent evidence before broadening the change.</text>
</svg>
