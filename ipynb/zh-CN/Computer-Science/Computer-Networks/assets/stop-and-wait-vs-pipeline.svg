<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Stop-and-wait compared with pipelining</title>
  <desc id="desc">Two sender receiver timelines show one packet followed by idle time under stop-and-wait and several packets in flight under pipelining.</desc>
  <defs>
    <marker id="arrowB" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#2563eb"/></marker>
    <marker id="arrowG" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#15803d"/></marker>
  </defs>
  <rect width="1200" height="700" fill="#f8fafc"/>
  <text x="600" y="42" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="29" font-weight="700" fill="#172554">The path can hold many packets at once</text>

  <g transform="translate(30,70)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect width="550" height="565" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text x="275" y="38" text-anchor="middle" font-size="23" font-weight="700" fill="#9f1239">Stop-and-wait</text>
    <text x="105" y="77" text-anchor="middle" font-size="17" font-weight="700" fill="#334155">Sender</text>
    <text x="445" y="77" text-anchor="middle" font-size="17" font-weight="700" fill="#334155">Receiver</text>
    <line x1="105" y1="95" x2="105" y2="500" stroke="#64748b" stroke-width="3"/>
    <line x1="445" y1="95" x2="445" y2="500" stroke="#64748b" stroke-width="3"/>
    <line x1="105" y1="115" x2="445" y2="210" stroke="#2563eb" stroke-width="4" marker-end="url(#arrowB)"/>
    <text x="230" y="133" font-size="16" font-weight="700" fill="#1e40af">packet 0</text>
    <line x1="445" y1="235" x2="105" y2="330" stroke="#15803d" stroke-width="4" marker-end="url(#arrowG)"/>
    <text x="310" y="263" font-size="16" font-weight="700" fill="#166534">ACK 0</text>
    <line x1="105" y1="355" x2="445" y2="450" stroke="#2563eb" stroke-width="4" marker-end="url(#arrowB)"/>
    <text x="230" y="373" font-size="16" font-weight="700" fill="#1e40af">packet 1</text>
    <rect x="125" y="150" width="85" height="155" rx="6" fill="#fee2e2" opacity="0.8"/>
    <text x="167" y="217" text-anchor="middle" font-size="15" font-weight="700" fill="#991b1b">sender</text>
    <text x="167" y="239" text-anchor="middle" font-size="15" font-weight="700" fill="#991b1b">idle</text>
    <text x="275" y="525" text-anchor="middle" font-size="16" fill="#475569">One packet per RTT, even when the link is fast.</text>
    <text x="275" y="551" text-anchor="middle" font-size="16" font-weight="700" fill="#9f1239">Useful rate is limited by waiting.</text>
  </g>

  <g transform="translate(620,70)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect width="550" height="565" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text x="275" y="38" text-anchor="middle" font-size="23" font-weight="700" fill="#166534">Pipelined window</text>
    <text x="105" y="77" text-anchor="middle" font-size="17" font-weight="700" fill="#334155">Sender</text>
    <text x="445" y="77" text-anchor="middle" font-size="17" font-weight="700" fill="#334155">Receiver</text>
    <line x1="105" y1="95" x2="105" y2="500" stroke="#64748b" stroke-width="3"/>
    <line x1="445" y1="95" x2="445" y2="500" stroke="#64748b" stroke-width="3"/>
    <g stroke="#2563eb" stroke-width="4" marker-end="url(#arrowB)">
      <line x1="105" y1="115" x2="445" y2="210"/>
      <line x1="105" y1="150" x2="445" y2="245"/>
      <line x1="105" y1="185" x2="445" y2="280"/>
      <line x1="105" y1="220" x2="445" y2="315"/>
    </g>
    <g font-size="15" font-weight="700" fill="#1e40af">
      <text x="230" y="128">packet 0</text><text x="230" y="163">packet 1</text>
      <text x="230" y="198">packet 2</text><text x="230" y="233">packet 3</text>
    </g>
    <g stroke="#15803d" stroke-width="3" marker-end="url(#arrowG)">
      <line x1="445" y1="335" x2="105" y2="430"/>
      <line x1="445" y1="370" x2="105" y2="465"/>
    </g>
    <text x="315" y="357" font-size="15" font-weight="700" fill="#166534">ACKs return while later packets are in flight</text>
    <rect x="88" y="105" width="34" height="130" rx="5" fill="#dcfce7" opacity="0.85"/>
    <text x="275" y="525" text-anchor="middle" font-size="16" fill="#475569">Window size should cover the bandwidth-delay product.</text>
    <text x="275" y="551" text-anchor="middle" font-size="16" font-weight="700" fill="#166534">The link stays busy while feedback travels.</text>
  </g>

  <rect x="260" y="650" width="680" height="38" rx="7" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="600" y="675" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#075985">Bandwidth-delay product = path rate x round-trip time = data needed in flight</text>
</svg>
