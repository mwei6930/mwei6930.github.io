<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Go-Back-N retransmission after one lost packet</title>
  <desc id="desc">Packet two is lost. Packet three reaches a receiver that expects two and is discarded. Duplicate cumulative acknowledgments are returned. When the oldest timer expires, the sender retransmits packets two and three.</desc>
  <defs>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#2563eb"/></marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#15803d"/></marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#dc2626"/></marker>
  </defs>
  <rect width="1200" height="720" fill="#f8fafc"/>
  <text x="600" y="43" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="29" font-weight="700" fill="#172554">Go-Back-N: one gap can replay the remaining window</text>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="145" y="70" width="235" height="55" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="262" y="105" text-anchor="middle" font-size="21" font-weight="700" fill="#1e3a8a">Sender, window = 4</text>
    <rect x="820" y="70" width="235" height="55" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="937" y="105" text-anchor="middle" font-size="21" font-weight="700" fill="#14532d">Receiver, expects 0</text>
  </g>
  <line x1="262" y1="125" x2="262" y2="670" stroke="#64748b" stroke-width="3"/>
  <line x1="937" y1="125" x2="937" y2="670" stroke="#64748b" stroke-width="3"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">
    <line x1="262" y1="160" x2="937" y2="225" stroke="#2563eb" stroke-width="4" marker-end="url(#arrB)"/>
    <text x="530" y="168" font-weight="700" fill="#1e40af">packet 0</text>
    <line x1="262" y1="205" x2="937" y2="270" stroke="#2563eb" stroke-width="4" marker-end="url(#arrB)"/>
    <text x="530" y="213" font-weight="700" fill="#1e40af">packet 1</text>

    <line x1="262" y1="250" x2="585" y2="281" stroke="#dc2626" stroke-width="4" stroke-dasharray="9 6"/>
    <line x1="572" y1="264" x2="592" y2="298" stroke="#dc2626" stroke-width="5"/>
    <line x1="592" y1="264" x2="572" y2="298" stroke="#dc2626" stroke-width="5"/>
    <text x="500" y="270" font-weight="700" fill="#b91c1c">packet 2 lost</text>

    <line x1="262" y1="295" x2="937" y2="360" stroke="#2563eb" stroke-width="4" marker-end="url(#arrB)"/>
    <text x="530" y="303" font-weight="700" fill="#1e40af">packet 3</text>
    <rect x="955" y="333" width="205" height="62" rx="7" fill="#fff7ed" stroke="#ea580c"/>
    <text x="1057" y="357" text-anchor="middle" fill="#9a3412">expected packet 2</text>
    <text x="1057" y="381" text-anchor="middle" font-weight="700" fill="#9a3412">discard packet 3</text>

    <line x1="937" y1="290" x2="262" y2="350" stroke="#15803d" stroke-width="3" marker-end="url(#arrG)"/>
    <text x="650" y="307" font-weight="700" fill="#166534">ACK 1: all packets through 1 received</text>
    <line x1="937" y1="410" x2="262" y2="460" stroke="#15803d" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#arrG)"/>
    <text x="650" y="421" font-weight="700" fill="#166534">duplicate ACK 1</text>

    <path d="M238 385 C140 410 140 505 238 525" fill="none" stroke="#dc2626" stroke-width="4" marker-end="url(#arrR)"/>
    <text x="112" y="447" text-anchor="middle" font-weight="700" fill="#b91c1c">timer for base 2</text>
    <text x="112" y="470" text-anchor="middle" font-weight="700" fill="#b91c1c">expires</text>

    <line x1="262" y1="535" x2="937" y2="590" stroke="#2563eb" stroke-width="4" marker-end="url(#arrB)"/>
    <text x="525" y="541" font-weight="700" fill="#1e40af">retransmit packet 2</text>
    <line x1="262" y1="580" x2="937" y2="635" stroke="#2563eb" stroke-width="4" marker-end="url(#arrB)"/>
    <text x="525" y="587" font-weight="700" fill="#1e40af">retransmit packet 3</text>
    <text x="944" y="663" text-anchor="end" font-weight="700" fill="#14532d">deliver 2, then 3; ACK 3</text>
  </g>

  <rect x="405" y="646" width="390" height="50" rx="7" fill="#ffffff" stroke="#94a3b8"/>
  <text x="600" y="677" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#475569">Simple receiver, but avoidable retransmissions after a single loss.</text>
</svg>
