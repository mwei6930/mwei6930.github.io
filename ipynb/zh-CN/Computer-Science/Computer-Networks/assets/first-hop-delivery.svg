<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
  <title id="title">First-hop delivery from a wireless host to a remote server</title>
  <desc id="desc">A laptop resolves the default gateway's link-layer address, sends a Wi-Fi frame through an access point and VLAN switch, and the router forwards the enclosed IP datagram toward a remote server.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563a6"/>
    </marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2f855a"/>
    </marker>
  </defs>
  <rect width="1500" height="760" fill="#ffffff"/>
  <text x="750" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#172033">The First Hop: Local Delivery Before Internet Routing</text>
  <text x="750" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#475569">The frame targets the gateway's link address; the enclosed IP datagram targets the remote server</text>

  <g font-family="Arial, sans-serif">
    <rect x="45" y="170" width="210" height="130" rx="8" fill="#e8f2ff" stroke="#2563a6" stroke-width="3"/>
    <text x="150" y="208" text-anchor="middle" font-size="22" font-weight="700" fill="#164e78">Laptop</text>
    <text x="150" y="240" text-anchor="middle" font-size="15" fill="#27364b">IP 192.0.2.24</text>
    <text x="150" y="265" text-anchor="middle" font-size="15" fill="#27364b">MAC 02:...:24</text>

    <rect x="335" y="170" width="190" height="130" rx="8" fill="#e8f8ee" stroke="#2f855a" stroke-width="3"/>
    <text x="430" y="208" text-anchor="middle" font-size="22" font-weight="700" fill="#17623f">Wi-Fi AP</text>
    <text x="430" y="240" text-anchor="middle" font-size="15" fill="#27364b">802.11 BSS</text>
    <text x="430" y="265" text-anchor="middle" font-size="15" fill="#27364b">bridges to LAN</text>

    <rect x="605" y="170" width="210" height="130" rx="8" fill="#fff6d8" stroke="#b7791f" stroke-width="3"/>
    <text x="710" y="208" text-anchor="middle" font-size="22" font-weight="700" fill="#8a4b10">Access Switch</text>
    <text x="710" y="240" text-anchor="middle" font-size="15" fill="#27364b">VLAN 20</text>
    <text x="710" y="265" text-anchor="middle" font-size="15" fill="#27364b">learns source MAC</text>

    <rect x="895" y="150" width="230" height="170" rx="8" fill="#f2ecff" stroke="#7c4dba" stroke-width="3"/>
    <text x="1010" y="193" text-anchor="middle" font-size="22" font-weight="700" fill="#5d338f">Default Gateway</text>
    <text x="1010" y="228" text-anchor="middle" font-size="15" fill="#27364b">IP 192.0.2.1</text>
    <text x="1010" y="253" text-anchor="middle" font-size="15" fill="#27364b">MAC 02:...:01</text>
    <text x="1010" y="285" text-anchor="middle" font-size="15" font-weight="700" fill="#5d338f">L2 ends; IP forwarding begins</text>

    <rect x="1245" y="170" width="210" height="130" rx="8" fill="#eef2f7" stroke="#475569" stroke-width="3"/>
    <text x="1350" y="208" text-anchor="middle" font-size="22" font-weight="700" fill="#334155">Remote Server</text>
    <text x="1350" y="240" text-anchor="middle" font-size="15" fill="#27364b">IP 203.0.113.80</text>
    <text x="1350" y="265" text-anchor="middle" font-size="15" fill="#27364b">many routed hops away</text>
  </g>

  <line x1="255" y1="235" x2="325" y2="235" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="525" y1="235" x2="595" y2="235" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="815" y1="235" x2="885" y2="235" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="1125" y1="235" x2="1235" y2="235" stroke="#334155" stroke-width="4" stroke-dasharray="10 6" marker-end="url(#arrow)"/>

  <g font-family="Arial, sans-serif">
    <rect x="55" y="382" width="1390" height="98" rx="8" fill="#fff8e8" stroke="#b7791f" stroke-width="2"/>
    <circle cx="95" cy="431" r="24" fill="#b7791f"/>
    <text x="95" y="438" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">1</text>
    <text x="135" y="416" font-size="18" font-weight="700" fill="#172033">Resolve the next hop</text>
    <text x="135" y="445" font-size="16" fill="#475569">The remote IP is outside 192.0.2.0/24, so the laptop broadcasts: "Who has 192.0.2.1?" The gateway replies with MAC 02:...:01.</text>

    <rect x="55" y="505" width="1390" height="98" rx="8" fill="#eaf4ff" stroke="#2563a6" stroke-width="2"/>
    <circle cx="95" cy="554" r="24" fill="#2563a6"/>
    <text x="95" y="561" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">2</text>
    <text x="135" y="539" font-size="18" font-weight="700" fill="#172033">Deliver one local frame</text>
    <text x="135" y="568" font-size="16" fill="#475569">L2 destination = gateway MAC 02:...:01. L3 destination = server IP 203.0.113.80. The AP and switch bridge the frame inside VLAN 20.</text>

    <rect x="55" y="628" width="1390" height="98" rx="8" fill="#eaf8ef" stroke="#2f855a" stroke-width="2"/>
    <circle cx="95" cy="677" r="24" fill="#2f855a"/>
    <text x="95" y="684" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">3</text>
    <text x="135" y="662" font-size="18" font-weight="700" fill="#172033">Route the enclosed datagram</text>
    <text x="135" y="691" font-size="16" fill="#475569">The gateway removes the local frame, decreases TTL, selects a route, and creates different link-layer framing for its next hop.</text>
  </g>
</svg>
