<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 820" role="img" aria-labelledby="title desc">
  <title id="title">Recursive DNS resolution with referrals and caching</title>
  <desc id="desc">A browser asks its stub resolver, which sends one recursive query to a caching recursive resolver. On a miss, that resolver iteratively asks a root server, a dot-com TLD server, and the example.com authoritative server, then caches the answer by TTL and returns it to the client.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#2563eb"/></marker><marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#16a34a"/></marker><style>.t{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#172554}.h{font-size:28px;font-weight:700}.s{font-size:18px;font-weight:700}.b{font-size:14px}.n{font-size:12px;fill:#475569}.node{fill:#fff;stroke:#64748b;stroke-width:2}.life{stroke:#94a3b8;stroke-width:2;stroke-dasharray:7 6}</style></defs>
  <rect width="1360" height="820" fill="#f8fafc"/><text x="680" y="42" text-anchor="middle" class="t h">The client asks recursively; the resolver follows delegations iteratively</text>
  <g class="t">
    <rect x="45" y="92" width="190" height="80" rx="9" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/><text x="140" y="124" text-anchor="middle" class="s">Browser + stub</text><text x="140" y="150" text-anchor="middle" class="b">www.example.com A?</text>
    <rect x="350" y="92" width="235" height="80" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="467" y="124" text-anchor="middle" class="s">Recursive resolver</text><text x="467" y="150" text-anchor="middle" class="b">cache + validation policy</text>
    <rect x="700" y="92" width="175" height="80" rx="9" class="node"/><text x="787" y="124" text-anchor="middle" class="s">Root</text><text x="787" y="150" text-anchor="middle" class="b">delegates .com</text>
    <rect x="935" y="92" width="175" height="80" rx="9" class="node"/><text x="1022" y="124" text-anchor="middle" class="s">.com TLD</text><text x="1022" y="150" text-anchor="middle" class="b">delegates example</text>
    <rect x="1170" y="92" width="155" height="80" rx="9" class="node"/><text x="1247" y="124" text-anchor="middle" class="s">Authoritative</text><text x="1247" y="150" text-anchor="middle" class="b">owns zone data</text>
    <g class="life"><line x1="140" y1="172" x2="140" y2="735"/><line x1="467" y1="172" x2="467" y2="735"/><line x1="787" y1="172" x2="787" y2="735"/><line x1="1022" y1="172" x2="1022" y2="735"/><line x1="1247" y1="172" x2="1247" y2="735"/></g>

    <line x1="140" y1="220" x2="457" y2="220" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/><text x="300" y="208" text-anchor="middle" class="b">1 recursive query: final answer requested</text>
    <rect x="380" y="245" width="175" height="52" rx="7" fill="#fef3c7" stroke="#f59e0b"/><text x="467" y="267" text-anchor="middle" class="b" font-weight="700">cache miss</text><text x="467" y="286" text-anchor="middle" class="n">start delegation walk</text>
    <line x1="477" y1="325" x2="777" y2="325" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/><text x="627" y="313" text-anchor="middle" class="b">2 www.example.com A?</text>
    <line x1="777" y1="375" x2="477" y2="375" stroke="#16a34a" stroke-width="4" marker-end="url(#g)"/><text x="627" y="363" text-anchor="middle" class="b">3 referral: .com NS + glue</text>
    <line x1="477" y1="425" x2="1012" y2="425" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/><text x="747" y="413" text-anchor="middle" class="b">4 ask a .com authoritative server</text>
    <line x1="1012" y1="475" x2="477" y2="475" stroke="#16a34a" stroke-width="4" marker-end="url(#g)"/><text x="747" y="463" text-anchor="middle" class="b">5 referral: example.com NS + glue</text>
    <line x1="477" y1="525" x2="1237" y2="525" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/><text x="862" y="513" text-anchor="middle" class="b">6 ask the zone's authoritative server</text>
    <line x1="1237" y1="575" x2="477" y2="575" stroke="#16a34a" stroke-width="4" marker-end="url(#g)"/><text x="862" y="563" text-anchor="middle" class="b">7 answer: 203.0.113.20, TTL 300</text>
    <rect x="375" y="610" width="185" height="62" rx="7" fill="#dcfce7" stroke="#16a34a"/><text x="467" y="636" text-anchor="middle" class="b" font-weight="700">cache RRset by TTL</text><text x="467" y="657" text-anchor="middle" class="n">later clients skip the walk</text>
    <line x1="457" y1="700" x2="150" y2="700" stroke="#16a34a" stroke-width="4" marker-end="url(#g)"/><text x="302" y="688" text-anchor="middle" class="b">8 final recursive answer</text>
    <rect x="695" y="745" width="570" height="48" rx="7" fill="#eff6ff" stroke="#60a5fa"/><text x="980" y="774" text-anchor="middle" class="b">A referral identifies the next zone cut; it is not the final host address.</text>
  </g>
</svg>
