<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Underlay, overlay, and endpoint control plane</title><desc id="desc">Tenant endpoints attach to tunnel endpoints, an EVPN-like control plane distributes endpoint and VNI mappings, and the IP underlay forwards outer packets.</desc>
  <rect width="1200" height="650" fill="#fff"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#596b78"/></marker></defs><style>.h{font:700 27px Arial,sans-serif;fill:#17212b}.t{font:700 18px Arial,sans-serif;fill:#17212b}.s{font:15px Arial,sans-serif;fill:#3d4e5c}.a{stroke:#596b78;stroke-width:3;fill:none;marker-end:url(#a)}.tun{stroke:#7651a8;stroke-width:8;fill:none;stroke-dasharray:14 8}</style>
  <text class="h" x="600" y="43" text-anchor="middle">The Overlay Defines Tenant Semantics; the Underlay Provides Reachability</text>
  <g transform="translate(55 100)"><rect width="260" height="150" rx="7" fill="#e8f1fb" stroke="#2878b5" stroke-width="2"/><text class="t" x="130" y="34" text-anchor="middle">Host A / VTEP 10.0.0.11</text><rect x="25" y="60" width="95" height="55" rx="5" fill="#fff" stroke="#2878b5"/><text class="s" x="72" y="83" text-anchor="middle">tenant VM</text><text class="s" x="72" y="104" text-anchor="middle">10.1.0.8</text><rect x="140" y="60" width="95" height="55" rx="5" fill="#f2edfb" stroke="#7651a8"/><text class="s" x="187" y="83" text-anchor="middle">VNI 5001</text><text class="s" x="187" y="104" text-anchor="middle">encap</text></g>
  <g transform="translate(885 100)"><rect width="260" height="150" rx="7" fill="#eaf6ef" stroke="#2f855a" stroke-width="2"/><text class="t" x="130" y="34" text-anchor="middle">Host B / VTEP 10.0.0.22</text><rect x="25" y="60" width="95" height="55" rx="5" fill="#fff" stroke="#2f855a"/><text class="s" x="72" y="83" text-anchor="middle">tenant VM</text><text class="s" x="72" y="104" text-anchor="middle">10.1.0.9</text><rect x="140" y="60" width="95" height="55" rx="5" fill="#f2edfb" stroke="#7651a8"/><text class="s" x="187" y="83" text-anchor="middle">VNI 5001</text><text class="s" x="187" y="104" text-anchor="middle">decap</text></g>
  <path class="tun" d="M315 184C485 104 715 104 885 184"/><text class="s" x="600" y="112" text-anchor="middle">logical tenant tunnel: inner address spaces may overlap</text>
  <g transform="translate(390 305)"><rect width="420" height="110" rx="7" fill="#f2edfb" stroke="#7651a8" stroke-width="2"/><text class="t" x="210" y="34" text-anchor="middle">Overlay control plane</text><text class="s" x="210" y="63" text-anchor="middle">tenant MAC/IP -&gt; VNI -&gt; remote VTEP mapping</text><text class="s" x="210" y="87" text-anchor="middle">mobility, withdrawal, multihoming, policy</text></g><path class="a" d="M390 360H250V252"/><path class="a" d="M810 360H950V252"/>
  <g transform="translate(110 500)"><rect width="980" height="95" rx="7" fill="#fff4dd" stroke="#b7791f" stroke-width="2"/><text class="t" x="490" y="32" text-anchor="middle">IP underlay / Clos fabric</text><text class="s" x="490" y="60" text-anchor="middle">routes only outer VTEP addresses, uses ECMP, supplies MTU and failure recovery</text><text class="s" x="490" y="81" text-anchor="middle">transit routers do not need every tenant endpoint route</text></g><path class="a" d="M185 500V430H1015V500"/>
  <text class="s" x="600" y="630" text-anchor="middle">Isolation requires enforcement at trusted tunnel endpoints; a VNI is an identifier, not encryption.</text>
</svg>
