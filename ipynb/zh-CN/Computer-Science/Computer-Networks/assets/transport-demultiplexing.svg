<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Transport-layer multiplexing and demultiplexing</title>
  <desc id="desc">Three network flows are classified by transport protocol, addresses, and ports and delivered to DNS, HTTPS, and application processes.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#355070"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1f2937" flood-opacity="0.13"/>
    </filter>
  </defs>
  <rect width="1200" height="560" fill="#f8fafc"/>
  <text x="600" y="45" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="29" font-weight="700" fill="#172554">One host, many conversations</text>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" filter="url(#shadow)">
    <rect x="45" y="100" width="245" height="100" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="168" y="132" text-anchor="middle" font-size="19" font-weight="700" fill="#1e3a8a">Resolver request</text>
    <text x="168" y="162" text-anchor="middle" font-size="16" fill="#1e3a8a">UDP 10.0.0.8:53000</text>
    <text x="168" y="185" text-anchor="middle" font-size="16" fill="#1e3a8a">to 192.0.2.53:53</text>

    <rect x="45" y="230" width="245" height="100" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="168" y="262" text-anchor="middle" font-size="19" font-weight="700" fill="#14532d">Browser connection</text>
    <text x="168" y="292" text-anchor="middle" font-size="16" fill="#14532d">TCP 10.0.0.8:53001</text>
    <text x="168" y="315" text-anchor="middle" font-size="16" fill="#14532d">to 192.0.2.80:443</text>

    <rect x="45" y="360" width="245" height="100" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="168" y="392" text-anchor="middle" font-size="19" font-weight="700" fill="#78350f">API connection</text>
    <text x="168" y="422" text-anchor="middle" font-size="16" fill="#78350f">TCP 10.0.0.9:53002</text>
    <text x="168" y="445" text-anchor="middle" font-size="16" fill="#78350f">to 192.0.2.80:8080</text>
  </g>

  <g stroke="#355070" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M290 150 C350 150 350 205 420 205"/>
    <path d="M290 280 C350 280 350 280 420 280"/>
    <path d="M290 410 C350 410 350 355 420 355"/>
  </g>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" filter="url(#shadow)">
    <rect x="420" y="105" width="350" height="350" rx="10" fill="#ffffff" stroke="#475569" stroke-width="2.5"/>
    <text x="595" y="143" text-anchor="middle" font-size="23" font-weight="700" fill="#1f2937">Kernel transport demultiplexer</text>
    <text x="595" y="173" text-anchor="middle" font-size="16" fill="#475569">protocol + local address + local port</text>
    <text x="595" y="196" text-anchor="middle" font-size="16" fill="#475569">and, for a connection, remote endpoint</text>

    <rect x="460" y="225" width="270" height="48" rx="6" fill="#dbeafe" stroke="#2563eb"/>
    <text x="595" y="255" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">UDP socket bound to :53</text>
    <rect x="460" y="292" width="270" height="48" rx="6" fill="#dcfce7" stroke="#16a34a"/>
    <text x="595" y="322" text-anchor="middle" font-size="17" font-weight="700" fill="#14532d">TCP connection ending at :443</text>
    <rect x="460" y="359" width="270" height="48" rx="6" fill="#fef3c7" stroke="#d97706"/>
    <text x="595" y="389" text-anchor="middle" font-size="17" font-weight="700" fill="#78350f">TCP connection ending at :8080</text>
  </g>

  <g stroke="#355070" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M770 249 H875"/>
    <path d="M770 316 H875"/>
    <path d="M770 383 H875"/>
  </g>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" filter="url(#shadow)">
    <rect x="875" y="205" width="270" height="75" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="1010" y="237" text-anchor="middle" font-size="19" font-weight="700" fill="#1e3a8a">DNS process</text>
    <text x="1010" y="262" text-anchor="middle" font-size="15" fill="#1e3a8a">receives one datagram</text>
    <rect x="875" y="292" width="270" height="75" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="1010" y="324" text-anchor="middle" font-size="19" font-weight="700" fill="#14532d">Web server worker</text>
    <text x="1010" y="349" text-anchor="middle" font-size="15" fill="#14532d">reads a byte stream</text>
    <rect x="875" y="379" width="270" height="75" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
    <text x="1010" y="411" text-anchor="middle" font-size="19" font-weight="700" fill="#78350f">API worker</text>
    <text x="1010" y="436" text-anchor="middle" font-size="15" fill="#78350f">independent connection state</text>
  </g>

  <text x="600" y="515" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" fill="#475569">Ports identify local service endpoints; the full flow key separates simultaneous conversations.</text>
</svg>
