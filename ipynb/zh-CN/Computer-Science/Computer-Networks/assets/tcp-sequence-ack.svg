<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">TCP cumulative acknowledgment and selective acknowledgment</title>
  <desc id="desc">The receiver gets bytes 1000 through 1499, loses bytes 1500 through 1999, and receives bytes 2000 through 2499 out of order. It keeps cumulative acknowledgment 1500 and reports a SACK block. Retransmission closes the gap and advances acknowledgment to 2500.</desc>
  <defs>
    <marker id="ab" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#2563eb"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#15803d"/></marker>
  </defs>
  <rect width="1200" height="700" fill="#f8fafc"/>
  <text x="600" y="43" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="29" font-weight="700" fill="#172554">TCP acknowledges byte positions, not segment labels</text>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="130" y="75" width="220" height="58" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="240" y="111" text-anchor="middle" font-size="21" font-weight="700" fill="#1e3a8a">Sender</text>
    <rect x="850" y="75" width="220" height="58" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="960" y="111" text-anchor="middle" font-size="21" font-weight="700" fill="#14532d">Receiver</text>
  </g>
  <line x1="240" y1="133" x2="240" y2="650" stroke="#64748b" stroke-width="3"/>
  <line x1="960" y1="133" x2="960" y2="650" stroke="#64748b" stroke-width="3"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">
    <line x1="240" y1="175" x2="960" y2="235" stroke="#2563eb" stroke-width="4" marker-end="url(#ab)"/>
    <text x="510" y="180" font-weight="700" fill="#1e40af">SEQ=1000, LEN=500 -> bytes [1000, 1500)</text>
    <line x1="960" y1="255" x2="240" y2="310" stroke="#15803d" stroke-width="3" marker-end="url(#ag)"/>
    <text x="580" y="268" font-weight="700" fill="#166534">ACK=1500: next contiguous byte wanted</text>

    <line x1="240" y1="330" x2="590" y2="359" stroke="#dc2626" stroke-width="4" stroke-dasharray="9 6"/>
    <line x1="575" y1="342" x2="595" y2="376" stroke="#dc2626" stroke-width="5"/>
    <line x1="595" y1="342" x2="575" y2="376" stroke="#dc2626" stroke-width="5"/>
    <text x="470" y="345" font-weight="700" fill="#b91c1c">SEQ=1500, LEN=500 lost</text>

    <line x1="240" y1="390" x2="960" y2="450" stroke="#2563eb" stroke-width="4" marker-end="url(#ab)"/>
    <text x="510" y="395" font-weight="700" fill="#1e40af">SEQ=2000, LEN=500 arrives out of order</text>
    <rect x="975" y="420" width="200" height="66" rx="7" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="1075" y="446" text-anchor="middle" fill="#166534">buffer [2000, 2500)</text>
    <text x="1075" y="470" text-anchor="middle" font-weight="700" fill="#166534">gap still starts at 1500</text>
    <line x1="960" y1="500" x2="240" y2="550" stroke="#15803d" stroke-width="3" marker-end="url(#ag)"/>
    <text x="520" y="510" font-weight="700" fill="#166534">ACK=1500, SACK=[2000,2500)</text>

    <line x1="240" y1="575" x2="960" y2="620" stroke="#2563eb" stroke-width="4" stroke-dasharray="10 6" marker-end="url(#ab)"/>
    <text x="510" y="580" font-weight="700" fill="#1e40af">retransmit SEQ=1500, LEN=500</text>
    <text x="950" y="653" text-anchor="end" font-weight="700" fill="#166534">gap closes -> cumulative ACK=2500</text>
  </g>

  <rect x="375" y="116" width="450" height="43" rx="7" fill="#ffffff" stroke="#94a3b8"/>
  <text x="600" y="143" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#475569">Half-open intervals make length and the next expected byte unambiguous.</text>
</svg>
