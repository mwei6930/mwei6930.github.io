<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="790" viewBox="0 0 1540 790" role="img" aria-labelledby="title desc">
  <title id="title">Row-major, column-major, and tiled matrix traversal</title>
  <desc id="desc">A row-major traversal consumes neighboring elements from each fetched block. A column-major traversal has a large stride and touches many blocks before reuse. Tiling works on a small two-dimensional region so multiple rows and columns remain in cache.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#374151"/></marker>
    <style>.body{font-family:"Segoe UI",Arial,sans-serif;fill:#111827}.small{font-family:"Segoe UI",Arial,sans-serif;fill:#4b5563;font-size:15px}.mono{font-family:Consolas,monospace;fill:#111827;font-size:15px}.route{stroke:#374151;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1540" height="790" fill="#ffffff"/>
  <text x="770" y="43" text-anchor="middle" class="body" font-size="28" font-weight="700">The same arithmetic can create very different cache traffic</text>
  <text x="770" y="74" text-anchor="middle" class="small">Example assumes a row-major matrix: neighboring columns occupy neighboring addresses.</text>

  <rect x="30" y="115" width="480" height="590" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="270" y="158" text-anchor="middle" class="body" font-size="23" font-weight="700" fill="#1d4ed8">Row-major traversal</text>
  <text x="270" y="188" text-anchor="middle" class="mono">for i: for j: use A[i][j]</text>
  <g transform="translate(90 240)">
    <rect x="0" y="0" width="360" height="280" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <path d="M0 70H360 M0 140H360 M0 210H360 M45 0V280 M90 0V280 M135 0V280 M180 0V280 M225 0V280 M270 0V280 M315 0V280" stroke="#bfdbfe"/>
    <rect x="0" y="0" width="360" height="70" fill="#dbeafe" opacity="0.8"/>
    <path d="M15 35 H340" class="route"/>
    <path d="M340 65 C330 100 40 100 15 105" class="route"/>
    <path d="M15 105 H340" class="route"/>
  </g>
  <text x="270" y="565" text-anchor="middle" class="body" font-size="18" font-weight="700">consume the transferred line</text>
  <text x="270" y="598" text-anchor="middle" class="small">many adjacent elements per compulsory miss</text>
  <text x="270" y="628" text-anchor="middle" class="small">hardware prefetchers also recognize the stream</text>
  <text x="270" y="672" text-anchor="middle" class="small">strong spatial locality</text>

  <rect x="530" y="115" width="480" height="590" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="770" y="158" text-anchor="middle" class="body" font-size="23" font-weight="700" fill="#9a3412">Column-major traversal</text>
  <text x="770" y="188" text-anchor="middle" class="mono">for j: for i: use A[i][j]</text>
  <g transform="translate(590 240)">
    <rect x="0" y="0" width="360" height="280" fill="#ffffff" stroke="#c2410c" stroke-width="2"/>
    <path d="M0 70H360 M0 140H360 M0 210H360 M45 0V280 M90 0V280 M135 0V280 M180 0V280 M225 0V280 M270 0V280 M315 0V280" stroke="#fed7aa"/>
    <rect x="0" y="0" width="45" height="280" fill="#ffedd5" opacity="0.8"/>
    <path d="M22 15 V260" class="route"/>
    <path d="M45 260 C90 250 70 30 67 15" class="route"/>
    <path d="M67 15 V260" class="route"/>
  </g>
  <text x="770" y="565" text-anchor="middle" class="body" font-size="18" font-weight="700">large stride between consecutive uses</text>
  <text x="770" y="598" text-anchor="middle" class="small">often one useful element from each fetched line</text>
  <text x="770" y="628" text-anchor="middle" class="small">lines may be evicted before the next column reuses them</text>
  <text x="770" y="672" text-anchor="middle" class="small">poor spatial locality for row-major storage</text>

  <rect x="1030" y="115" width="480" height="590" rx="8" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
  <text x="1270" y="158" text-anchor="middle" class="body" font-size="23" font-weight="700" fill="#0f766e">Tiled traversal</text>
  <text x="1270" y="188" text-anchor="middle" class="mono">for ii,jj: process one tile</text>
  <g transform="translate(1090 240)">
    <rect x="0" y="0" width="360" height="280" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
    <path d="M0 70H360 M0 140H360 M0 210H360 M90 0V280 M180 0V280 M270 0V280" stroke="#a7f3d0" stroke-width="2"/>
    <rect x="0" y="0" width="180" height="140" fill="#d1fae5" opacity="0.9" stroke="#0f766e" stroke-width="3"/>
    <path d="M15 35 H160" class="route"/><path d="M160 65 C145 100 35 100 15 105" class="route"/><path d="M15 105 H160" class="route"/>
    <text x="90" y="165" text-anchor="middle" class="small">active tile</text>
  </g>
  <text x="1270" y="565" text-anchor="middle" class="body" font-size="18" font-weight="700">keep a small two-dimensional working set</text>
  <text x="1270" y="598" text-anchor="middle" class="small">reuse tile rows/columns before moving onward</text>
  <text x="1270" y="628" text-anchor="middle" class="small">tile dimensions should fit the useful cache budget</text>
  <text x="1270" y="672" text-anchor="middle" class="small">temporal and spatial locality together</text>
  <text x="770" y="755" text-anchor="middle" class="small">Cache-aware code changes access order or layout without changing the mathematical result; actual gains depend on block size, associativity, prefetching, and competing data.</text>
</svg>
