<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="690" viewBox="0 0 1440 690" role="img" aria-labelledby="title desc">
  <title id="title">RAW, WAR, and WAW instruction dependencies</title>
  <desc id="desc">Three columns show read after write, write after read, and write after write dependencies, with arrows between producer and consumer instructions and an explanation of which dependencies become hazards in an in-order five-stage pipeline.</desc>
  <defs>
    <marker id="rawArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b91c1c"/></marker>
    <marker id="warArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/></marker>
    <marker id="wawArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#c2410c"/></marker>
    <style>.body{font-family:"Segoe UI",Arial,sans-serif;fill:#111827}.small{font-family:"Segoe UI",Arial,sans-serif;fill:#4b5563;font-size:16px}.mono{font-family:Consolas,monospace;fill:#111827;font-size:17px}</style>
  </defs>
  <rect width="1440" height="690" fill="#ffffff"/>
  <text x="720" y="43" text-anchor="middle" class="body" font-size="28" font-weight="700">A name dependency becomes a hazard only when timing can violate its order</text>
  <text x="720" y="74" text-anchor="middle" class="small">R means an instruction reads a register; W means it writes a register.</text>

  <rect x="35" y="115" width="430" height="500" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="250" y="158" text-anchor="middle" class="body" font-size="24" font-weight="700" fill="#991b1b">RAW: Read After Write</text>
  <text x="250" y="188" text-anchor="middle" class="small">true data dependency</text>
  <rect x="78" y="230" width="344" height="74" rx="5" fill="#ffffff" stroke="#b91c1c"/>
  <text x="250" y="276" text-anchor="middle" class="mono">add x5, x1, x2   # W(x5)</text>
  <rect x="78" y="390" width="344" height="74" rx="5" fill="#ffffff" stroke="#b91c1c"/>
  <text x="250" y="436" text-anchor="middle" class="mono">sub x7, x5, x3   # R(x5)</text>
  <path d="M250 306 V386" stroke="#b91c1c" stroke-width="4" fill="none" marker-end="url(#rawArrow)"/>
  <text x="274" y="352" class="small" fill="#991b1b">value flows forward</text>
  <text x="250" y="516" text-anchor="middle" class="body" font-size="18" font-weight="700">Hazard in the basic in-order pipeline</text>
  <text x="250" y="548" text-anchor="middle" class="small">Solve with forwarding, or stall if the value</text>
  <text x="250" y="572" text-anchor="middle" class="small">will not exist when the consumer needs it.</text>

  <rect x="505" y="115" width="430" height="500" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="720" y="158" text-anchor="middle" class="body" font-size="24" font-weight="700" fill="#6d28d9">WAR: Write After Read</text>
  <text x="720" y="188" text-anchor="middle" class="small">anti-dependency caused by a reused name</text>
  <rect x="548" y="230" width="344" height="74" rx="5" fill="#ffffff" stroke="#7c3aed"/>
  <text x="720" y="276" text-anchor="middle" class="mono">add x5, x1, x2   # R(x1)</text>
  <rect x="548" y="390" width="344" height="74" rx="5" fill="#ffffff" stroke="#7c3aed"/>
  <text x="720" y="436" text-anchor="middle" class="mono">sub x1, x3, x4   # W(x1)</text>
  <path d="M720 306 V386" stroke="#7c3aed" stroke-width="4" fill="none" marker-end="url(#warArrow)"/>
  <text x="744" y="352" class="small" fill="#6d28d9">read must occur first</text>
  <text x="720" y="516" text-anchor="middle" class="body" font-size="18" font-weight="700">Not a hazard with ordered ID reads and WB writes</text>
  <text x="720" y="548" text-anchor="middle" class="small">It matters once instructions may execute or</text>
  <text x="720" y="572" text-anchor="middle" class="small">complete out of order; register renaming removes it.</text>

  <rect x="975" y="115" width="430" height="500" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="1190" y="158" text-anchor="middle" class="body" font-size="24" font-weight="700" fill="#9a3412">WAW: Write After Write</text>
  <text x="1190" y="188" text-anchor="middle" class="small">output dependency caused by a reused name</text>
  <rect x="1018" y="230" width="344" height="74" rx="5" fill="#ffffff" stroke="#c2410c"/>
  <text x="1190" y="276" text-anchor="middle" class="mono">mul x5, x1, x2   # W(x5)</text>
  <rect x="1018" y="390" width="344" height="74" rx="5" fill="#ffffff" stroke="#c2410c"/>
  <text x="1190" y="436" text-anchor="middle" class="mono">add x5, x3, x4   # W(x5)</text>
  <path d="M1190 306 V386" stroke="#c2410c" stroke-width="4" fill="none" marker-end="url(#wawArrow)"/>
  <text x="1214" y="352" class="small" fill="#9a3412">write order must remain</text>
  <text x="1190" y="516" text-anchor="middle" class="body" font-size="18" font-weight="700">Not a hazard with one ordered WB stage</text>
  <text x="1190" y="548" text-anchor="middle" class="small">Variable-latency and out-of-order completion can</text>
  <text x="1190" y="572" text-anchor="middle" class="small">reverse the writes; renaming plus ordered commit fixes it.</text>
  <text x="720" y="660" text-anchor="middle" class="small">The five-stage scalar core must actively solve RAW timing; WAR and WAW explain why wider out-of-order designs add renaming and retirement machinery.</text>
</svg>
