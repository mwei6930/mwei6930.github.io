<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="700" viewBox="0 0 1440 700" role="img" aria-labelledby="title desc">
  <title id="title">Average memory access time probability tree</title>
  <desc id="desc">Every access pays the cache hit time. Most accesses hit and return immediately. A fraction equal to the miss rate additionally pays the miss penalty before data returns and the pipeline resumes.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker>
    <style>.body{font-family:"Segoe UI",Arial,sans-serif;fill:#111827}.small{font-family:"Segoe UI",Arial,sans-serif;fill:#4b5563;font-size:16px}.mono{font-family:Consolas,monospace;fill:#111827;font-size:17px}.line{stroke:#374151;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1440" height="700" fill="#ffffff"/>
  <text x="720" y="43" text-anchor="middle" class="body" font-size="28" font-weight="700">AMAT is a weighted average of the common hit path and the rare miss path</text>
  <text x="720" y="74" text-anchor="middle" class="small">The formula is useful only when hit time, miss rate, and miss penalty use consistent definitions.</text>

  <rect x="75" y="240" width="230" height="118" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="190" y="280" text-anchor="middle" class="body" font-size="21" font-weight="700">memory request</text>
  <text x="190" y="313" text-anchor="middle" class="mono">IF or MEM stage</text>
  <text x="190" y="340" text-anchor="middle" class="small">one lookup begins</text>

  <rect x="430" y="230" width="250" height="138" rx="7" fill="#f9fafb" stroke="#4b5563" stroke-width="2"/>
  <text x="555" y="273" text-anchor="middle" class="body" font-size="21" font-weight="700">check L1 cache</text>
  <text x="555" y="307" text-anchor="middle" class="mono">pay T_hit always</text>
  <text x="555" y="337" text-anchor="middle" class="small">valid + tag + data selection</text>
  <path d="M305 299 H425" class="line"/>

  <rect x="850" y="125" width="300" height="145" rx="7" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
  <text x="1000" y="169" text-anchor="middle" class="body" font-size="22" font-weight="700" fill="#0f766e">hit</text>
  <text x="1000" y="204" text-anchor="middle" class="mono">probability = 1 - r_m</text>
  <text x="1000" y="237" text-anchor="middle" class="small">return data; no miss penalty</text>
  <path d="M680 270 C740 270 770 198 845 198" class="line"/>

  <rect x="850" y="355" width="300" height="175" rx="7" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="1000" y="399" text-anchor="middle" class="body" font-size="22" font-weight="700" fill="#9a3412">miss</text>
  <text x="1000" y="434" text-anchor="middle" class="mono">probability = r_m</text>
  <text x="1000" y="468" text-anchor="middle" class="mono">additional cost = P_m</text>
  <text x="1000" y="500" text-anchor="middle" class="small">lower lookup + refill + restart</text>
  <path d="M680 328 C740 328 770 442 845 442" class="line"/>

  <rect x="1220" y="240" width="165" height="118" rx="7" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="1302" y="280" text-anchor="middle" class="body" font-size="20" font-weight="700">pipeline</text>
  <text x="1302" y="313" text-anchor="middle" class="mono">resume</text>
  <text x="1302" y="340" text-anchor="middle" class="small">use returned value</text>
  <path d="M1150 198 H1185 V270 H1215" class="line"/><path d="M1150 442 H1185 V328 H1215" class="line"/>

  <rect x="250" y="585" width="940" height="72" rx="7" fill="#f9fafb" stroke="#9ca3af"/>
  <text x="720" y="617" text-anchor="middle" class="body" font-size="22" font-weight="700">AMAT = T_hit + r_m x P_m</text>
  <text x="720" y="645" text-anchor="middle" class="small">Example: 1 ns hit time + 0.05 miss rate x 60 ns additional penalty = 4 ns average.</text>
</svg>
