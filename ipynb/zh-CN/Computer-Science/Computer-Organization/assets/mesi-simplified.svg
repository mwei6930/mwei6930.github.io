<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="880" viewBox="0 0 1500 880" role="img" aria-labelledby="title desc">
  <title id="title">Simplified MESI state transitions</title>
  <desc id="desc">The Modified, Exclusive, Shared, and Invalid states encode whether a line is valid, clean or dirty, and privately or jointly cached. Processor and snoop events move the line between states.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker><style>.body{font-family:"Segoe UI",Arial,sans-serif;fill:#111827}.small{font-family:"Segoe UI",Arial,sans-serif;fill:#4b5563;font-size:15px}.mono{font-family:Consolas,monospace;fill:#111827;font-size:14px}.line{stroke:#374151;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.label{font-family:Consolas,monospace;fill:#111827;font-size:13px}</style></defs>
  <rect width="1500" height="880" fill="#ffffff"/>
  <text x="750" y="44" text-anchor="middle" class="body" font-size="29" font-weight="700">MESI compresses ownership and freshness into four line states</text>
  <text x="750" y="75" text-anchor="middle" class="small">The exact bus messages vary by implementation; the state meanings and common transitions provide the key intuition.</text>

  <circle cx="310" cy="300" r="105" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="310" y="284" text-anchor="middle" class="body" font-size="34" font-weight="700">I</text><text x="310" y="316" text-anchor="middle" class="body" font-size="18" font-weight="700">Invalid</text><text x="310" y="344" text-anchor="middle" class="small">cannot be read locally</text>
  <circle cx="750" cy="190" r="105" fill="#ecfdf5" stroke="#0f766e" stroke-width="3"/><text x="750" y="174" text-anchor="middle" class="body" font-size="34" font-weight="700">E</text><text x="750" y="206" text-anchor="middle" class="body" font-size="18" font-weight="700">Exclusive</text><text x="750" y="234" text-anchor="middle" class="small">clean, only cached copy</text>
  <circle cx="1190" cy="300" r="105" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="1190" y="284" text-anchor="middle" class="body" font-size="34" font-weight="700">S</text><text x="1190" y="316" text-anchor="middle" class="body" font-size="18" font-weight="700">Shared</text><text x="1190" y="344" text-anchor="middle" class="small">clean, possibly many copies</text>
  <circle cx="750" cy="550" r="105" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/><text x="750" y="534" text-anchor="middle" class="body" font-size="34" font-weight="700">M</text><text x="750" y="566" text-anchor="middle" class="body" font-size="18" font-weight="700">Modified</text><text x="750" y="594" text-anchor="middle" class="small">dirty, sole authoritative copy</text>

  <path d="M408 264 C505 200 585 178 642 184" class="line"/><text x="500" y="188" class="label">PrRd, no sharer</text>
  <path d="M412 330 C600 380 920 380 1088 330" class="line"/><text x="650" y="407" class="label">PrRd, another cache responds</text>
  <path d="M376 386 C470 500 570 545 643 550" class="line"/><text x="428" y="488" class="label">PrWr / GetM</text>
  <path d="M750 295 V438" class="line"/><text x="770" y="378" class="label">PrWr, silent E to M</text>
  <path d="M1091 367 C990 485 900 540 857 548" class="line"/><text x="965" y="500" class="label">PrWr / upgrade; invalidate peers</text>
  <path d="M855 510 C1010 455 1090 405 1132 389" class="line"/><text x="930" y="432" class="label">snoop read; supply data</text>
  <path d="M855 590 C1000 640 1200 560 1210 405" class="line"/><text x="1020" y="635" class="label">snoop ownership request: write back / I</text>
  <path d="M1114 220 C1010 155 900 145 855 162" class="line"/><text x="940" y="130" class="label">snoop read: E to S</text>
  <path d="M1098 250 C980 210 880 205 855 207" class="line"/><text x="925" y="245" class="label">evict clean copy</text>
  <path d="M1085 295 C900 320 500 320 415 295" class="line"/><text x="670" y="300" class="label">snoop invalidate: S to I</text>

  <rect x="120" y="710" width="1260" height="105" rx="7" fill="#f9fafb" stroke="#6b7280"/>
  <text x="155" y="746" class="body" font-size="17" font-weight="700">Read permission:</text><text x="305" y="746" class="small">M, E, and S may satisfy a local load; I must obtain a copy.</text>
  <text x="155" y="779" class="body" font-size="17" font-weight="700">Write permission:</text><text x="310" y="779" class="small">M or E already has sole ownership; S must invalidate peers before writing.</text>
  <text x="155" y="812" class="body" font-size="17" font-weight="700">Dirty data:</text><text x="270" y="812" class="small">only M differs from the lower memory level and must eventually be written back or forwarded.</text>
  <text x="750" y="855" text-anchor="middle" class="body" font-size="18" font-weight="700">MESI guarantees one coherent value per address; it does not by itself define ordering between different addresses.</text>
</svg>
