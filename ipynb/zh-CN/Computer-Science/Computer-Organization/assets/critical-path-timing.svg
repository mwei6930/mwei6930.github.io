<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Critical path and propagation delay in a combinational circuit</title>
  <desc id="desc">A three-gate red path determines the worst-case delay, while a shorter gray path reaches the output earlier. A timing strip shows the output becoming valid after the propagation delay.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/>
    </marker>
    <style>
      .t { font: 18px Arial, sans-serif; fill: #334155; }
      .b { font: 700 21px Arial, sans-serif; fill: #0f172a; text-anchor: middle; }
      .gate { fill: #f8fafc; stroke: #475569; stroke-width: 3; rx: 6; }
      .critical { fill: none; stroke: #dc2626; stroke-width: 5; marker-end: url(#arrow); }
      .short { fill: none; stroke: #64748b; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="520" fill="#ffffff"/>
  <text x="600" y="40" class="b" font-size="28">The longest input-to-output path sets the safe sampling time</text>

  <text x="55" y="113" class="t">A</text><text x="55" y="163" class="t">B</text>
  <text x="55" y="253" class="t">C</text><text x="55" y="343" class="t">D</text>
  <path class="critical" d="M80 107 H208"/><path class="critical" d="M80 157 H208"/>
  <rect x="210" y="92" width="150" height="90" class="gate"/><text x="285" y="145" class="b">AND</text>
  <text x="285" y="207" class="t" text-anchor="middle">arrival: 1t_g</text>

  <path class="critical" d="M360 137 H492"/><path class="critical" d="M80 247 H492"/>
  <rect x="494" y="182" width="150" height="90" class="gate"/><text x="569" y="235" class="b">XOR</text>
  <text x="569" y="297" class="t" text-anchor="middle">arrival: 2t_g</text>

  <path class="critical" d="M644 227 H805"/>
  <path class="short" d="M80 337 H740 Q775 337 805 270"/>
  <rect x="807" y="182" width="150" height="90" class="gate"/><text x="882" y="235" class="b">OR</text>
  <text x="882" y="297" class="t" text-anchor="middle">arrival: 3t_g</text>
  <path class="critical" d="M957 227 H1105"/>
  <text x="1134" y="234" class="b">Y</text>
  <text x="500" y="354" class="t" fill="#dc2626">Critical path: A/B -> AND -> XOR -> OR</text>
  <text x="500" y="381" class="t">A shorter path can settle earlier, but it cannot reduce the worst-case delay.</text>

  <line x1="90" y1="455" x2="1100" y2="455" stroke="#94a3b8" stroke-width="2"/>
  <line x1="90" y1="438" x2="90" y2="472" stroke="#334155" stroke-width="2"/>
  <line x1="800" y1="438" x2="800" y2="472" stroke="#dc2626" stroke-width="3"/>
  <text x="90" y="500" class="t" text-anchor="middle">input changes</text>
  <text x="800" y="500" class="t" text-anchor="middle">t_pd = 3t_g</text>
  <rect x="95" y="427" width="700" height="18" fill="#fee2e2" opacity="0.9"/>
  <rect x="805" y="427" width="290" height="18" fill="#dcfce7" opacity="0.9"/>
  <text x="445" y="421" class="t" text-anchor="middle">output may be changing or glitching</text>
  <text x="950" y="421" class="t" text-anchor="middle">output guaranteed valid</text>
</svg>
