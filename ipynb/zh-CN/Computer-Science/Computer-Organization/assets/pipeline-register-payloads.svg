<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="650" viewBox="0 0 1450 650" role="img" aria-labelledby="title desc">
  <title id="title">Pipeline register payloads</title>
  <desc id="desc">The IF ID, ID EX, EX MEM, and MEM WB registers carry each instruction's valid bit, data values, destination register, program counter, and stage-specific control signals.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker></defs>
  <rect width="1450" height="650" fill="#ffffff"/>
  <text x="725" y="40" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#111827">Pipeline registers carry identity, data, and intent together</text>
  <text x="725" y="68" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#4b5563">A value without its destination or control bits belongs to no usable instruction.</text>

  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <rect x="35" y="120" width="180" height="100" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="125" y="158" font-size="22" font-weight="700" fill="#1d4ed8">IF</text><text x="125" y="190" font-size="15" fill="#4b5563">fetch instruction</text>
    <rect x="330" y="120" width="180" height="100" rx="7" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/><text x="420" y="158" font-size="22" font-weight="700" fill="#9a3412">ID</text><text x="420" y="190" font-size="15" fill="#4b5563">read and decode</text>
    <rect x="625" y="120" width="180" height="100" rx="7" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="715" y="158" font-size="22" font-weight="700" fill="#0f766e">EX</text><text x="715" y="190" font-size="15" fill="#4b5563">calculate / compare</text>
    <rect x="920" y="120" width="180" height="100" rx="7" fill="#fefce8" stroke="#a16207" stroke-width="2"/><text x="1010" y="158" font-size="22" font-weight="700" fill="#854d0e">MEM</text><text x="1010" y="190" font-size="15" fill="#4b5563">access data cache</text>
    <rect x="1215" y="120" width="180" height="100" rx="7" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="1305" y="158" font-size="22" font-weight="700" fill="#7c3aed">WB</text><text x="1305" y="190" font-size="15" fill="#4b5563">retire register result</text>
  </g>
  <line x1="215" y1="170" x2="328" y2="170" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/><line x1="510" y1="170" x2="623" y2="170" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/><line x1="805" y1="170" x2="918" y2="170" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/><line x1="1100" y1="170" x2="1213" y2="170" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/>

  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="230" y="270" width="220" height="300" rx="7" fill="#f9fafb" stroke="#4b5563" stroke-width="2"/>
    <text x="340" y="306" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">IF / ID</text>
    <text x="255" y="345" font-family="Consolas, monospace" font-size="15" fill="#111827">valid</text><text x="255" y="377" font-family="Consolas, monospace" font-size="15" fill="#111827">PC</text><text x="255" y="409" font-family="Consolas, monospace" font-size="15" fill="#111827">PC + 4</text><text x="255" y="441" font-family="Consolas, monospace" font-size="15" fill="#111827">instruction</text><text x="255" y="486" font-size="14" fill="#4b5563">Enough to restart decode</text><text x="255" y="510" font-size="14" fill="#4b5563">or report a fetch fault.</text>

    <rect x="475" y="270" width="270" height="300" rx="7" fill="#f9fafb" stroke="#4b5563" stroke-width="2"/>
    <text x="610" y="306" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">ID / EX</text>
    <text x="500" y="345" font-family="Consolas, monospace" font-size="15" fill="#111827">valid, PC, PC+4</text><text x="500" y="377" font-family="Consolas, monospace" font-size="15" fill="#111827">operand A, operand B</text><text x="500" y="409" font-family="Consolas, monospace" font-size="15" fill="#111827">immediate, rs1, rs2, rd</text><text x="500" y="441" font-family="Consolas, monospace" font-size="15" fill="#111827">EX controls</text><text x="500" y="473" font-family="Consolas, monospace" font-size="15" fill="#111827">MEM controls</text><text x="500" y="505" font-family="Consolas, monospace" font-size="15" fill="#111827">WB controls</text>

    <rect x="770" y="270" width="270" height="300" rx="7" fill="#f9fafb" stroke="#4b5563" stroke-width="2"/>
    <text x="905" y="306" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">EX / MEM</text>
    <text x="795" y="345" font-family="Consolas, monospace" font-size="15" fill="#111827">valid, PC</text><text x="795" y="377" font-family="Consolas, monospace" font-size="15" fill="#111827">ALU result / address</text><text x="795" y="409" font-family="Consolas, monospace" font-size="15" fill="#111827">store data</text><text x="795" y="441" font-family="Consolas, monospace" font-size="15" fill="#111827">destination rd</text><text x="795" y="473" font-family="Consolas, monospace" font-size="15" fill="#111827">branch outcome</text><text x="795" y="505" font-family="Consolas, monospace" font-size="15" fill="#111827">MEM + WB controls</text>

    <rect x="1065" y="270" width="260" height="300" rx="7" fill="#f9fafb" stroke="#4b5563" stroke-width="2"/>
    <text x="1195" y="306" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">MEM / WB</text>
    <text x="1090" y="345" font-family="Consolas, monospace" font-size="15" fill="#111827">valid, PC</text><text x="1090" y="377" font-family="Consolas, monospace" font-size="15" fill="#111827">memory read data</text><text x="1090" y="409" font-family="Consolas, monospace" font-size="15" fill="#111827">ALU result</text><text x="1090" y="441" font-family="Consolas, monospace" font-size="15" fill="#111827">PC + 4</text><text x="1090" y="473" font-family="Consolas, monospace" font-size="15" fill="#111827">destination rd</text><text x="1090" y="505" font-family="Consolas, monospace" font-size="15" fill="#111827">ResultSrc + RegWrite</text>
  </g>
  <text x="725" y="615" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#4b5563">A stall holds selected registers; a bubble writes valid=0 or zeroes side-effect controls; a flush invalidates wrong-path entries.</text>
</svg>
