<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">LRU, FIFO, and random cache replacement choices</title>
  <desc id="desc">A three-way set receives trace A B C A D. On the final miss, LRU evicts B because A was reused, FIFO evicts A because it arrived first, and random selects a valid way without recency tracking.</desc>
  <defs><style>.body{font-family:"Segoe UI",Arial,sans-serif;fill:#111827}.small{font-family:"Segoe UI",Arial,sans-serif;fill:#4b5563;font-size:16px}.mono{font-family:Consolas,monospace;fill:#111827;font-size:18px}</style></defs>
  <rect width="1440" height="720" fill="#ffffff"/>
  <text x="720" y="43" text-anchor="middle" class="body" font-size="28" font-weight="700">Replacement is needed only when the selected set is full and the access misses</text>
  <text x="720" y="74" text-anchor="middle" class="small">Trace for one three-way set: A, B, C, A, then D. The second A is a hit that changes recency but not arrival order.</text>

  <g transform="translate(125 118)" class="body" font-size="18" font-weight="700" text-anchor="middle">
    <text x="0" y="26" class="small">access</text>
    <rect x="60" y="0" width="90" height="55" rx="5" fill="#ede9fe" stroke="#7c3aed"/><text x="105" y="34">A</text>
    <rect x="180" y="0" width="90" height="55" rx="5" fill="#dbeafe" stroke="#2563eb"/><text x="225" y="34">B</text>
    <rect x="300" y="0" width="90" height="55" rx="5" fill="#d1fae5" stroke="#0f766e"/><text x="345" y="34">C</text>
    <rect x="420" y="0" width="90" height="55" rx="5" fill="#ede9fe" stroke="#7c3aed"/><text x="465" y="34">A hit</text>
    <rect x="540" y="0" width="90" height="55" rx="5" fill="#ffedd5" stroke="#c2410c"/><text x="585" y="34">D miss</text>
  </g>

  <rect x="45" y="235" width="425" height="400" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="257" y="278" text-anchor="middle" class="body" font-size="23" font-weight="700" fill="#6d28d9">Least Recently Used</text>
  <text x="257" y="307" text-anchor="middle" class="small">Approximate future reuse with past recency.</text>
  <rect x="105" y="345" width="305" height="155" fill="#ffffff" stroke="#7c3aed"/>
  <path d="M105 397H410 M105 449H410" stroke="#c4b5fd"/>
  <text x="130" y="380" class="mono">way 0: A</text><text x="130" y="432" class="mono" fill="#b91c1c">way 1: B  evict</text><text x="130" y="484" class="mono">way 2: C</text>
  <text x="257" y="545" text-anchor="middle" class="mono">recency: A, C, B</text>
  <text x="257" y="578" text-anchor="middle" class="small">A was refreshed by the hit; B is oldest.</text>
  <text x="257" y="610" text-anchor="middle" class="small">Good intuition, increasing metadata cost.</text>

  <rect x="507" y="235" width="425" height="400" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="719" y="278" text-anchor="middle" class="body" font-size="23" font-weight="700" fill="#1d4ed8">First In, First Out</text>
  <text x="719" y="307" text-anchor="middle" class="small">Track insertion order; hits do not refresh it.</text>
  <rect x="567" y="345" width="305" height="155" fill="#ffffff" stroke="#2563eb"/>
  <path d="M567 397H872 M567 449H872" stroke="#93c5fd"/>
  <text x="592" y="380" class="mono" fill="#b91c1c">way 0: A  evict</text><text x="592" y="432" class="mono">way 1: B</text><text x="592" y="484" class="mono">way 2: C</text>
  <text x="719" y="545" text-anchor="middle" class="mono">arrival: A, B, C</text>
  <text x="719" y="578" text-anchor="middle" class="small">A arrived first even though it was reused.</text>
  <text x="719" y="610" text-anchor="middle" class="small">Simpler metadata, weaker reuse signal.</text>

  <rect x="970" y="235" width="425" height="400" rx="8" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
  <text x="1182" y="278" text-anchor="middle" class="body" font-size="23" font-weight="700" fill="#0f766e">Random</text>
  <text x="1182" y="307" text-anchor="middle" class="small">Choose a way without per-line order state.</text>
  <rect x="1030" y="345" width="305" height="155" fill="#ffffff" stroke="#0f766e"/>
  <path d="M1030 397H1335 M1030 449H1335" stroke="#6ee7b7"/>
  <text x="1055" y="380" class="mono">way 0: A</text><text x="1055" y="432" class="mono">way 1: B</text><text x="1055" y="484" class="mono" fill="#b91c1c">way 2: C  chosen</text>
  <text x="1182" y="545" text-anchor="middle" class="mono">victim = pseudo-random way</text>
  <text x="1182" y="578" text-anchor="middle" class="small">The shown victim is one possible outcome.</text>
  <text x="1182" y="610" text-anchor="middle" class="small">Low tracking cost; less predictable behavior.</text>

  <text x="720" y="685" text-anchor="middle" class="small">Always select an invalid line before evicting a valid one. Real high-associativity caches often use pseudo-LRU or more advanced approximations.</text>
</svg>
