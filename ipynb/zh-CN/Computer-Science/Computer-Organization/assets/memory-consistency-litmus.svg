<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" role="img" aria-labelledby="title desc">
  <title id="title">Store-buffering litmus test and memory consistency</title>
  <desc id="desc">Two threads each store to one address and load the other. Store buffers can delay global visibility, allowing both loads to read zero on a weak memory model unless synchronization orders the operations.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker><style>.body{font-family:"Segoe UI",Arial,sans-serif;fill:#111827}.small{font-family:"Segoe UI",Arial,sans-serif;fill:#4b5563;font-size:15px}.mono{font-family:Consolas,monospace;fill:#111827;font-size:16px}.line{stroke:#374151;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.delay{stroke:#dc2626;stroke-width:2.5;fill:none;stroke-dasharray:8 6;marker-end:url(#arrow)}</style></defs>
  <rect width="1500" height="820" fill="#ffffff"/>
  <text x="750" y="44" text-anchor="middle" class="body" font-size="29" font-weight="700">Consistency constrains visibility across different addresses</text>
  <text x="750" y="75" text-anchor="middle" class="small">Initial state: x = 0 and y = 0. Each thread preserves its own instruction semantics, yet another thread may observe delayed stores.</text>

  <rect x="80" y="125" width="430" height="360" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="295" y="165" text-anchor="middle" class="body" font-size="22" font-weight="700">Thread 0</text>
  <rect x="135" y="210" width="320" height="68" rx="6" fill="#ffffff" stroke="#2563eb"/><text x="295" y="252" text-anchor="middle" class="mono">x = 1</text>
  <path d="M295 278 V325" class="line"/>
  <rect x="135" y="330" width="320" height="68" rx="6" fill="#ffffff" stroke="#2563eb"/><text x="295" y="372" text-anchor="middle" class="mono">r0 = y</text>
  <rect x="135" y="425" width="320" height="40" rx="5" fill="#dbeafe" stroke="#2563eb"/><text x="295" y="451" text-anchor="middle" class="small">program order is store, then load</text>

  <rect x="990" y="125" width="430" height="360" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="1205" y="165" text-anchor="middle" class="body" font-size="22" font-weight="700">Thread 1</text>
  <rect x="1045" y="210" width="320" height="68" rx="6" fill="#ffffff" stroke="#7c3aed"/><text x="1205" y="252" text-anchor="middle" class="mono">y = 1</text>
  <path d="M1205 278 V325" class="line"/>
  <rect x="1045" y="330" width="320" height="68" rx="6" fill="#ffffff" stroke="#7c3aed"/><text x="1205" y="372" text-anchor="middle" class="mono">r1 = x</text>
  <rect x="1045" y="425" width="320" height="40" rx="5" fill="#ede9fe" stroke="#7c3aed"/><text x="1205" y="451" text-anchor="middle" class="small">program order is store, then load</text>

  <rect x="590" y="145" width="320" height="100" rx="7" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="750" y="182" text-anchor="middle" class="body" font-size="18" font-weight="700">Private store buffers</text><text x="750" y="214" text-anchor="middle" class="mono">x=1 delayed | y=1 delayed</text>
  <path d="M510 244 H585" class="delay"/><path d="M990 244 H915" class="delay"/>
  <rect x="590" y="320" width="320" height="145" rx="7" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="750" y="357" text-anchor="middle" class="body" font-size="18" font-weight="700">Coherent shared memory</text><text x="750" y="393" text-anchor="middle" class="mono">x = 0</text><text x="750" y="427" text-anchor="middle" class="mono">y = 0</text>
  <path d="M455 364 H585" class="line"/><path d="M1045 364 H915" class="line"/>

  <rect x="120" y="545" width="590" height="175" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="415" y="585" text-anchor="middle" class="body" font-size="21" font-weight="700">Without an ordering edge</text>
  <text x="415" y="625" text-anchor="middle" class="mono">r0 = 0 and r1 = 0</text>
  <text x="415" y="657" text-anchor="middle" class="small">can be legal because both stores remain buffered</text>
  <text x="415" y="688" text-anchor="middle" class="small">coherence is not violated: each address still has a valid write order</text>

  <rect x="790" y="545" width="590" height="175" rx="8" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
  <text x="1085" y="585" text-anchor="middle" class="body" font-size="21" font-weight="700">With release/acquire or a fence</text>
  <text x="1085" y="625" text-anchor="middle" class="mono">store -> synchronization -> load</text>
  <text x="1085" y="657" text-anchor="middle" class="small">the required visibility order becomes part of the contract</text>
  <text x="1085" y="688" text-anchor="middle" class="small">use language-level atomics so compiler and hardware agree</text>
  <text x="750" y="778" text-anchor="middle" class="body" font-size="18" font-weight="700">Coherence orders writes to one location; consistency governs what combinations of observations are allowed across locations.</text>
</svg>
