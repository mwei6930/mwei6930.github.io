<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="510" viewBox="0 0 1160 510" role="img" aria-labelledby="title desc">
  <title id="title">Speculative execution side-channel mechanism</title><desc id="desc">A predicted path performs transient operations whose architectural result is squashed, but a microarchitectural cache footprint can remain and affect later timing.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3 0 6Z" fill="#334155"/></marker></defs>
  <rect width="1160" height="510" rx="18" fill="#f8fafc"/>
  <text x="580" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#172033">Architectural rollback does not erase every microarchitectural effect</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="35" y="125" width="180" height="110" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="125" y="160" font-size="18" font-weight="700" fill="#1e3a8a">Predict</text><text x="125" y="190" font-size="14" fill="#334155">choose likely path</text><text x="125" y="213" font-size="14" fill="#334155">before resolution</text>
    <rect x="260" y="125" width="180" height="110" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="350" y="160" font-size="18" font-weight="700" fill="#78350f">Execute transiently</text><text x="350" y="190" font-size="14" fill="#334155">instructions run</text><text x="350" y="213" font-size="14" fill="#334155">under prediction</text>
    <rect x="485" y="125" width="180" height="110" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="575" y="160" font-size="18" font-weight="700" fill="#7f1d1d">Touch shared state</text><text x="575" y="190" font-size="14" fill="#334155">cache, TLB, predictor</text><text x="575" y="213" font-size="14" fill="#334155">or execution resource</text>
    <rect x="710" y="125" width="180" height="110" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="800" y="160" font-size="18" font-weight="700" fill="#14532d">Resolve + squash</text><text x="800" y="190" font-size="14" fill="#334155">register / memory result</text><text x="800" y="213" font-size="14" fill="#334155">does not retire</text>
    <rect x="935" y="125" width="190" height="110" rx="10" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/><text x="1030" y="160" font-size="18" font-weight="700" fill="#581c87">Observe timing</text><text x="1030" y="190" font-size="14" fill="#334155">residual state changes</text><text x="1030" y="213" font-size="14" fill="#334155">later execution time</text>
  </g>
  <g stroke="#334155" stroke-width="3" marker-end="url(#a)"><line x1="215" y1="180" x2="250" y2="180"/><line x1="440" y1="180" x2="475" y2="180"/><line x1="665" y1="180" x2="700" y2="180"/><line x1="890" y1="180" x2="925" y2="180"/></g>
  <path d="M575 235 V315 H800 V245" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="7 6"/>
  <text x="688" y="344" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#7f1d1d">The architectural path is corrected; the shared-state footprint may persist.</text>
  <rect x="225" y="395" width="710" height="65" rx="10" fill="#172033"/>
  <text x="580" y="422" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#fff">Security requires controlling both what may retire and what transient work may reveal</text>
  <text x="580" y="446" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#dbeafe">through isolation, barriers, bounds discipline, partitioning, and reduced timer fidelity.</text>
</svg>
