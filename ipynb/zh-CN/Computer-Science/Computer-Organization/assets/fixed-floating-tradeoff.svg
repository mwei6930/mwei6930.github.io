<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Fixed-point and floating-point spacing</title>
  <desc id="desc">Fixed-point values have uniform spacing over a limited interval, while floating-point spacing becomes wider as magnitude grows.</desc>
  <defs>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #202a35; }
      .label { font: 700 20px Arial, sans-serif; fill: #202a35; }
      .body { font: 16px Arial, sans-serif; fill: #475569; }
      .tick { stroke: #355070; stroke-width: 2; }
    </style>
  </defs>
  <rect width="1200" height="520" fill="#ffffff"/>
  <text x="600" y="42" text-anchor="middle" class="title">The same bit budget can prioritize uniform precision or dynamic range</text>

  <rect x="70" y="82" width="1060" height="165" rx="8" fill="#edf4ff" stroke="#457b9d" stroke-width="2"/>
  <text x="120" y="120" class="label">Fixed point</text>
  <text x="120" y="148" class="body">A fixed scale makes every adjacent value the same distance apart.</text>
  <line x1="160" y1="196" x2="1040" y2="196" stroke="#355070" stroke-width="3"/>
  <g class="tick">
    <line x1="160" y1="182" x2="160" y2="210"/><line x1="270" y1="182" x2="270" y2="210"/><line x1="380" y1="182" x2="380" y2="210"/><line x1="490" y1="182" x2="490" y2="210"/><line x1="600" y1="178" x2="600" y2="214"/><line x1="710" y1="182" x2="710" y2="210"/><line x1="820" y1="182" x2="820" y2="210"/><line x1="930" y1="182" x2="930" y2="210"/><line x1="1040" y1="182" x2="1040" y2="210"/>
  </g>
  <text x="160" y="232" text-anchor="middle" class="body">min</text><text x="600" y="232" text-anchor="middle" class="body">0</text><text x="1040" y="232" text-anchor="middle" class="body">max</text>

  <rect x="70" y="278" width="1060" height="165" rx="8" fill="#fff2e8" stroke="#e76f51" stroke-width="2"/>
  <text x="120" y="316" class="label">Floating point</text>
  <text x="120" y="344" class="body">An exponent moves the scale, so representable values spread farther apart as magnitude grows.</text>
  <line x1="160" y1="392" x2="1040" y2="392" stroke="#355070" stroke-width="3"/>
  <g class="tick">
    <line x1="160" y1="378" x2="160" y2="406"/><line x1="340" y1="378" x2="340" y2="406"/><line x1="460" y1="378" x2="460" y2="406"/><line x1="530" y1="378" x2="530" y2="406"/><line x1="570" y1="378" x2="570" y2="406"/><line x1="590" y1="378" x2="590" y2="406"/><line x1="600" y1="374" x2="600" y2="410"/><line x1="610" y1="378" x2="610" y2="406"/><line x1="630" y1="378" x2="630" y2="406"/><line x1="670" y1="378" x2="670" y2="406"/><line x1="740" y1="378" x2="740" y2="406"/><line x1="860" y1="378" x2="860" y2="406"/><line x1="1040" y1="378" x2="1040" y2="406"/>
  </g>
  <text x="160" y="428" text-anchor="middle" class="body">large negative</text><text x="600" y="428" text-anchor="middle" class="body">0</text><text x="1040" y="428" text-anchor="middle" class="body">large positive</text>

  <text x="600" y="487" text-anchor="middle" class="body">Fixed point gives predictable increments; floating point trades uniform absolute precision for a much larger range.</text>
</svg>
