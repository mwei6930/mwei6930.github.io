<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="720" viewBox="0 0 1320 720" role="img" aria-labelledby="title desc">
  <title id="title">Two-bit saturating counter branch predictor</title>
  <desc id="desc">Four states strongly not taken, weakly not taken, weakly taken, and strongly taken transition toward taken on a taken outcome and toward not taken on a not-taken outcome. Two consecutive contrary outcomes are normally needed to reverse a strong prediction.</desc>
  <defs>
    <marker id="n" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker>
    <marker id="t" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0f766e"/></marker>
    <style>.body{font-family:"Segoe UI",Arial,sans-serif;fill:#111827}.small{font-family:"Segoe UI",Arial,sans-serif;fill:#4b5563;font-size:16px}.mono{font-family:Consolas,monospace;fill:#111827;font-size:18px}.nline{stroke:#2563eb;stroke-width:3;fill:none;marker-end:url(#n)}.tline{stroke:#0f766e;stroke-width:3;fill:none;marker-end:url(#t)}</style>
  </defs>
  <rect width="1320" height="720" fill="#ffffff"/>
  <text x="660" y="43" text-anchor="middle" class="body" font-size="28" font-weight="700">Two-bit prediction remembers confidence, not just the last outcome</text>
  <text x="660" y="74" text-anchor="middle" class="small">T moves the counter toward taken; N moves it toward not taken; the high bit is the prediction.</text>

  <rect x="70" y="220" width="245" height="170" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="192" y="264" text-anchor="middle" class="body" font-size="23" font-weight="700">SN</text>
  <text x="192" y="299" text-anchor="middle" class="mono">state 00</text>
  <text x="192" y="337" text-anchor="middle" class="body" font-size="18" font-weight="700" fill="#1d4ed8">predict not taken</text>
  <text x="192" y="366" text-anchor="middle" class="small">strong confidence</text>

  <rect x="380" y="220" width="245" height="170" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="502" y="264" text-anchor="middle" class="body" font-size="23" font-weight="700">WN</text>
  <text x="502" y="299" text-anchor="middle" class="mono">state 01</text>
  <text x="502" y="337" text-anchor="middle" class="body" font-size="18" font-weight="700" fill="#1d4ed8">predict not taken</text>
  <text x="502" y="366" text-anchor="middle" class="small">weak confidence</text>

  <rect x="695" y="220" width="245" height="170" rx="8" fill="#ecfdf5" stroke="#0f766e" stroke-width="3"/>
  <text x="817" y="264" text-anchor="middle" class="body" font-size="23" font-weight="700">WT</text>
  <text x="817" y="299" text-anchor="middle" class="mono">state 10</text>
  <text x="817" y="337" text-anchor="middle" class="body" font-size="18" font-weight="700" fill="#0f766e">predict taken</text>
  <text x="817" y="366" text-anchor="middle" class="small">weak confidence</text>

  <rect x="1005" y="220" width="245" height="170" rx="8" fill="#d1fae5" stroke="#0f766e" stroke-width="3"/>
  <text x="1127" y="264" text-anchor="middle" class="body" font-size="23" font-weight="700">ST</text>
  <text x="1127" y="299" text-anchor="middle" class="mono">state 11</text>
  <text x="1127" y="337" text-anchor="middle" class="body" font-size="18" font-weight="700" fill="#0f766e">predict taken</text>
  <text x="1127" y="366" text-anchor="middle" class="small">strong confidence</text>

  <path d="M315 270 H375" class="tline"/><path d="M625 270 H690" class="tline"/><path d="M940 270 H1000" class="tline"/>
  <text x="345" y="252" text-anchor="middle" class="body" font-size="17" font-weight="700" fill="#0f766e">T</text><text x="657" y="252" text-anchor="middle" class="body" font-size="17" font-weight="700" fill="#0f766e">T</text><text x="972" y="252" text-anchor="middle" class="body" font-size="17" font-weight="700" fill="#0f766e">T</text>
  <path d="M1005 350 H945" class="nline"/><path d="M695 350 H630" class="nline"/><path d="M380 350 H320" class="nline"/>
  <text x="975" y="380" text-anchor="middle" class="body" font-size="17" font-weight="700" fill="#1d4ed8">N</text><text x="662" y="380" text-anchor="middle" class="body" font-size="17" font-weight="700" fill="#1d4ed8">N</text><text x="350" y="380" text-anchor="middle" class="body" font-size="17" font-weight="700" fill="#1d4ed8">N</text>

  <path d="M192 220 C192 140 95 140 95 215" class="nline"/><text x="133" y="139" class="body" font-size="17" font-weight="700" fill="#1d4ed8">N: stay</text>
  <path d="M1127 220 C1127 140 1225 140 1225 215" class="tline"/><text x="1155" y="139" class="body" font-size="17" font-weight="700" fill="#0f766e">T: stay</text>

  <rect x="145" y="490" width="1030" height="150" rx="8" fill="#f9fafb" stroke="#9ca3af"/>
  <text x="660" y="528" text-anchor="middle" class="body" font-size="20" font-weight="700">Why two bits help a loop branch</text>
  <text x="660" y="565" text-anchor="middle" class="mono">outcomes: T  T  T  T  N   |   T  T  T  T  N</text>
  <text x="660" y="600" text-anchor="middle" class="small">The final not-taken loop exit changes ST to WT but keeps the next prediction taken.</text>
  <text x="660" y="625" text-anchor="middle" class="small">A one-bit predictor would flip immediately and often miss both the exit and the next loop entry.</text>
  <text x="660" y="682" text-anchor="middle" class="small">Real predictors index many counters with branch history and use a BTB to supply target addresses; aliasing can make unrelated branches share state.</text>
</svg>
