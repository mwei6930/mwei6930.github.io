<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 620" role="img" aria-labelledby="title desc">
  <title id="title">Example RV32 stack frame</title><desc id="desc">The stack grows toward lower addresses. A sixteen-byte frame contains locals and saved registers, while the frame pointer can refer to the caller stack position.</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#374151"/></marker><style>.h{font:700 23px Arial,sans-serif;fill:#111827}.t{font:17px Arial,sans-serif;fill:#374151}.b{stroke:#1f2937;stroke-width:3}.w{stroke:#374151;stroke-width:3;marker-end:url(#a)}</style></defs>
  <rect x="1.5" y="1.5" width="1037" height="617" rx="8" fill="#fff" stroke="#d1d5db" stroke-width="3"/><text x="520" y="42" text-anchor="middle" class="h">Example 16-byte RV32 stack frame</text>
  <line x1="125" y1="110" x2="125" y2="540" class="w"/><text x="65" y="100" class="t">higher</text><text x="65" y="565" class="t">lower</text><text x="45" y="330" class="h" transform="rotate(-90 45 330)">address</text>
  <rect x="300" y="90" width="420" height="75" fill="#dbeafe" class="b"/><text x="510" y="122" text-anchor="middle" class="h">Caller-owned area / stack arguments</text><text x="510" y="149" text-anchor="middle" class="t">addresses at and above entry sp</text>
  <rect x="300" y="165" width="420" height="75" fill="#ecfdf5" class="b"/><text x="510" y="209" text-anchor="middle" class="h">saved ra at 12(sp)</text>
  <rect x="300" y="240" width="420" height="75" fill="#fef3c7" class="b"/><text x="510" y="284" text-anchor="middle" class="h">saved s0 at 8(sp)</text>
  <rect x="300" y="315" width="420" height="150" fill="#fff7ed" class="b"/><text x="510" y="375" text-anchor="middle" class="h">locals / spill slots</text><text x="510" y="410" text-anchor="middle" class="t">0(sp) through 7(sp)</text>
  <line x1="260" y1="165" x2="740" y2="165" stroke="#be123c" stroke-width="4"/><text x="755" y="172" class="h" fill="#be123c">entry sp / optional fp</text><line x1="260" y1="465" x2="740" y2="465" stroke="#0f766e" stroke-width="4"/><text x="755" y="472" class="h" fill="#0f766e">current sp</text>
  <text x="510" y="520" text-anchor="middle" class="t">prologue: addi sp, sp, -16</text><text x="510" y="550" text-anchor="middle" class="t">epilogue: addi sp, sp, 16 after restoring saved values</text><text x="510" y="585" text-anchor="middle" class="t">The exact frame layout is chosen by the procedure; 16-byte entry alignment is the ABI rule</text>
</svg>
