<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="800" viewBox="0 0 1500 800" role="img" aria-labelledby="title desc">
  <title id="title">Instruction-level, data-level, and thread-level parallelism</title>
  <desc id="desc">Three panels show independent instructions overlapping inside one core, one operation applied across multiple data lanes, and independent threads running on multiple cores.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker><style>.body{font-family:"Segoe UI",Arial,sans-serif;fill:#111827}.small{font-family:"Segoe UI",Arial,sans-serif;fill:#4b5563;font-size:16px}.mono{font-family:Consolas,monospace;fill:#111827;font-size:15px}.line{stroke:#374151;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1500" height="800" fill="#ffffff"/>
  <text x="750" y="44" text-anchor="middle" class="body" font-size="29" font-weight="700">Parallelism exists at different granularities</text>
  <text x="750" y="75" text-anchor="middle" class="small">The dependency structure of the workload determines which hardware resources can be kept busy at the same time.</text>

  <rect x="55" y="125" width="1390" height="185" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="90" y="163" class="body" font-size="22" font-weight="700">Instruction-level parallelism (ILP)</text>
  <text x="90" y="191" class="small">One instruction stream; independent operations overlap in pipelines or execute in different functional units.</text>
  <text x="110" y="247" class="mono">program order</text><path d="M220 242 H370" class="line"/>
  <rect x="390" y="218" width="175" height="55" rx="5" fill="#ffffff" stroke="#2563eb"/><text x="477" y="251" text-anchor="middle" class="mono">load A[i]</text>
  <rect x="590" y="218" width="175" height="55" rx="5" fill="#ffffff" stroke="#2563eb"/><text x="677" y="251" text-anchor="middle" class="mono">mul x, y</text>
  <rect x="790" y="218" width="175" height="55" rx="5" fill="#ffffff" stroke="#2563eb"/><text x="877" y="251" text-anchor="middle" class="mono">add p, q</text>
  <rect x="1005" y="205" width="375" height="83" rx="6" fill="#dbeafe" stroke="#1d4ed8"/><text x="1192" y="238" text-anchor="middle" class="body" font-size="17" font-weight="700">load unit + multiplier + ALU</text><text x="1192" y="266" text-anchor="middle" class="small">issue together when dependencies permit</text>

  <rect x="55" y="335" width="1390" height="185" rx="8" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
  <text x="90" y="373" class="body" font-size="22" font-weight="700">Data-level parallelism (DLP)</text>
  <text x="90" y="401" class="small">The same operation is applied to many independent elements through SIMD lanes or a vector pipeline.</text>
  <rect x="130" y="436" width="220" height="52" rx="5" fill="#ffffff" stroke="#0f766e"/><text x="240" y="468" text-anchor="middle" class="mono">vector add</text>
  <path d="M350 462 H445" class="line"/>
  <g fill="#ffffff" stroke="#0f766e"><rect x="470" y="430" width="105" height="64" rx="5"/><rect x="590" y="430" width="105" height="64" rx="5"/><rect x="710" y="430" width="105" height="64" rx="5"/><rect x="830" y="430" width="105" height="64" rx="5"/><rect x="950" y="430" width="105" height="64" rx="5"/><rect x="1070" y="430" width="105" height="64" rx="5"/></g>
  <g text-anchor="middle" class="mono"><text x="522" y="458">a0+b0</text><text x="642" y="458">a1+b1</text><text x="762" y="458">a2+b2</text><text x="882" y="458">a3+b3</text><text x="1002" y="458">a4+b4</text><text x="1122" y="458">a5+b5</text></g>
  <text x="1260" y="458" class="body" font-size="17" font-weight="700">one operation</text><text x="1260" y="484" class="small">many elements</text>

  <rect x="55" y="545" width="1390" height="185" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="90" y="583" class="body" font-size="22" font-weight="700">Thread-level parallelism (TLP)</text>
  <text x="90" y="611" class="small">Independent instruction streams run on hardware threads or cores and coordinate through shared memory or messages.</text>
  <g fill="#ffffff" stroke="#7c3aed" stroke-width="2"><rect x="135" y="645" width="235" height="58" rx="6"/><rect x="440" y="645" width="235" height="58" rx="6"/><rect x="745" y="645" width="235" height="58" rx="6"/><rect x="1050" y="645" width="235" height="58" rx="6"/></g>
  <g text-anchor="middle" class="body" font-size="17" font-weight="700"><text x="252" y="680">Core 0: thread A</text><text x="557" y="680">Core 1: thread B</text><text x="862" y="680">Core 2: thread C</text><text x="1167" y="680">Core 3: thread D</text></g>
  <text x="750" y="770" text-anchor="middle" class="body" font-size="18" font-weight="700">More resources help only when the program exposes independent work at the matching level.</text>
</svg>
