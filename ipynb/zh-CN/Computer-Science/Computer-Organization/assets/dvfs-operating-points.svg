<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" role="img" aria-labelledby="title desc">
  <title id="title">DVFS operating-point tradeoffs</title><desc id="desc">Three voltage-frequency operating points show that higher frequency shortens compute time but raises power sharply, while memory time does not scale with core frequency.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3 0 6Z" fill="#334155"/></marker></defs>
  <rect width="1120" height="500" rx="18" fill="#f8fafc"/>
  <text x="560" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#172033">DVFS changes both speed and energy</text>
  <line x1="90" y1="388" x2="520" y2="388" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><line x1="90" y1="388" x2="90" y2="90" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="305" y="426" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#334155">frequency f</text><text x="35" y="235" text-anchor="middle" transform="rotate(-90 35 235)" font-family="Arial, sans-serif" font-size="15" fill="#334155">power</text>
  <path d="M112 362 C205 350 250 320 310 270 C376 216 410 155 492 105" fill="none" stroke="#dc2626" stroke-width="5"/>
  <g font-family="Arial, sans-serif" text-anchor="middle"><circle cx="190" cy="337" r="10" fill="#16a34a"/><text x="190" y="322" font-size="14" font-weight="700" fill="#14532d">Eco</text><circle cx="315" cy="266" r="10" fill="#d97706"/><text x="315" y="250" font-size="14" font-weight="700" fill="#78350f">Balanced</text><circle cx="440" cy="143" r="10" fill="#dc2626"/><text x="440" y="128" font-size="14" font-weight="700" fill="#7f1d1d">Turbo</text></g>
  <rect x="610" y="92" width="445" height="300" rx="12" fill="#fff" stroke="#64748b" stroke-width="2"/>
  <text x="833" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#172033">Task runtime composition</text>
  <g font-family="Arial, sans-serif"><text x="640" y="181" font-size="15" fill="#334155">Low f</text><rect x="705" y="158" width="255" height="34" fill="#dbeafe" stroke="#2563eb"/><rect x="960" y="158" width="65" height="34" fill="#fef3c7" stroke="#d97706"/><text x="833" y="180" text-anchor="middle" font-size="13" fill="#1e3a8a">compute</text><text x="992" y="180" text-anchor="middle" font-size="12" fill="#78350f">memory</text>
  <text x="640" y="252" font-size="15" fill="#334155">Mid f</text><rect x="705" y="229" width="165" height="34" fill="#dbeafe" stroke="#2563eb"/><rect x="870" y="229" width="65" height="34" fill="#fef3c7" stroke="#d97706"/><text x="788" y="251" text-anchor="middle" font-size="13" fill="#1e3a8a">compute</text><text x="902" y="251" text-anchor="middle" font-size="12" fill="#78350f">memory</text>
  <text x="640" y="323" font-size="15" fill="#334155">High f</text><rect x="705" y="300" width="115" height="34" fill="#dbeafe" stroke="#2563eb"/><rect x="820" y="300" width="65" height="34" fill="#fef3c7" stroke="#d97706"/><text x="763" y="322" text-anchor="middle" font-size="13" fill="#1e3a8a">compute</text><text x="852" y="322" text-anchor="middle" font-size="12" fill="#78350f">memory</text></g>
  <text x="833" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#475569">Memory latency barely shrinks when only the core clock rises.</text>
  <text x="560" y="463" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#475569">The best operating point depends on workload stalls, deadline, leakage, and cooling limits.</text>
</svg>
