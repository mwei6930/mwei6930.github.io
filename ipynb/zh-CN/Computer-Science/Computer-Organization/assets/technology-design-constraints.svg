<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc">
  <title id="title">Power, memory, cost, and reliability constraints</title>
  <desc id="desc">Four constraints surround computer design and show why increasing one performance parameter creates tradeoffs elsewhere.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#52606d"/>
    </marker>
  </defs>
  <rect width="1120" height="660" fill="#f8fafc"/>
  <text x="560" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#172b4d">A faster design must still fit power, memory, cost, and reliability budgets</text>

  <rect x="420" y="245" width="280" height="155" rx="6" fill="#ffffff" stroke="#172b4d" stroke-width="2.5"/>
  <text x="560" y="288" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#172b4d">Computer design</text>
  <text x="560" y="323" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#52606d">choose an organization that meets</text>
  <text x="560" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#52606d">the workload's complete contract</text>
  <text x="560" y="379" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#172b4d">performance is one constraint, not the only one</text>

  <rect x="55" y="85" width="360" height="205" rx="6" fill="#ffe9ec" stroke="#c9435c" stroke-width="2"/>
  <text x="235" y="122" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#9f2940">Power wall</text>
  <text x="235" y="158" text-anchor="middle" font-family="Consolas, monospace" font-size="18" fill="#5d2a35">P_dynamic ~= alpha C V^2 f</text>
  <text x="80" y="194" font-family="Arial, sans-serif" font-size="15" fill="#5d2a35">higher frequency raises switching work</text>
  <text x="80" y="220" font-family="Arial, sans-serif" font-size="15" fill="#5d2a35">voltage has a quadratic effect</text>
  <text x="80" y="246" font-family="Arial, sans-serif" font-size="15" fill="#5d2a35">heat limits sustained performance</text>
  <text x="80" y="272" font-family="Arial, sans-serif" font-size="14" fill="#52606d">responses: parallelism, specialization, DVFS</text>

  <rect x="705" y="85" width="360" height="205" rx="6" fill="#e8f1ff" stroke="#2f6fed" stroke-width="2"/>
  <text x="885" y="122" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#174ea6">Memory wall</text>
  <text x="885" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#253858">execution waits when data is not nearby</text>
  <text x="730" y="194" font-family="Arial, sans-serif" font-size="15" fill="#253858">latency delays a dependent access</text>
  <text x="730" y="220" font-family="Arial, sans-serif" font-size="15" fill="#253858">bandwidth limits bytes per second</text>
  <text x="730" y="246" font-family="Arial, sans-serif" font-size="15" fill="#253858">random access defeats simple streaming</text>
  <text x="730" y="272" font-family="Arial, sans-serif" font-size="14" fill="#52606d">responses: cache, locality, prefetching</text>

  <rect x="55" y="425" width="360" height="185" rx="6" fill="#fff1df" stroke="#d97706" stroke-width="2"/>
  <text x="235" y="462" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#9a4f00">Cost and manufacturability</text>
  <text x="235" y="497" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#4b3a2d">larger dies produce fewer chips per wafer</text>
  <text x="80" y="531" font-family="Arial, sans-serif" font-size="15" fill="#4b3a2d">defects reduce manufacturing yield</text>
  <text x="80" y="557" font-family="Arial, sans-serif" font-size="15" fill="#4b3a2d">packaging and memory add system cost</text>
  <text x="80" y="583" font-family="Arial, sans-serif" font-size="14" fill="#52606d">responses: reuse, chiplets, right-sized cores</text>

  <rect x="705" y="425" width="360" height="185" rx="6" fill="#e7f7ef" stroke="#17885b" stroke-width="2"/>
  <text x="885" y="462" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#0c6b45">Reliability</text>
  <text x="885" y="497" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#22543d">correctness must survive time and faults</text>
  <text x="730" y="531" font-family="Arial, sans-serif" font-size="15" fill="#22543d">temperature accelerates wear</text>
  <text x="730" y="557" font-family="Arial, sans-serif" font-size="15" fill="#22543d">transient errors can corrupt stored bits</text>
  <text x="730" y="583" font-family="Arial, sans-serif" font-size="14" fill="#52606d">responses: ECC, redundancy, monitoring</text>

  <path d="M415 220 L460 245" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M705 220 L660 245" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M415 500 L460 400" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M705 500 L660 400" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="560" y="641" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#172b4d">There is no universally best computer: only a better fit for a stated workload and constraint set.</text>
</svg>
