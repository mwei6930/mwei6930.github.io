<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="820" viewBox="0 0 1560 820" role="img" aria-labelledby="title desc">
  <title id="title">Choosing polling, interrupts, programmed I/O, and DMA by workload shape</title>
  <desc id="desc">A decision flow first separates small control operations from bulk payload transfers, then considers event frequency and latency requirements. Small control uses MMIO programmed I/O; sparse completions use interrupts; high-rate queues use DMA plus polling or interrupt coalescing.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker><style>.body{font-family:"Segoe UI",Arial,sans-serif;fill:#111827}.small{font-family:"Segoe UI",Arial,sans-serif;fill:#4b5563;font-size:15px}.mono{font-family:Consolas,monospace;fill:#111827;font-size:15px}.line{stroke:#374151;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1560" height="820" fill="#ffffff"/>
  <text x="780" y="42" text-anchor="middle" class="body" font-size="28" font-weight="700">Choose control, data movement, and completion mechanisms separately</text>
  <text x="780" y="72" text-anchor="middle" class="small">Real devices commonly use MMIO for control, DMA for payload, and either interrupts or polling for completion.</text>
  <rect x="610" y="115" width="340" height="82" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="780" y="148" text-anchor="middle" class="body" font-size="20" font-weight="700">What must move?</text><text x="780" y="175" text-anchor="middle" class="small">control/status or payload bytes</text>
  <polygon points="430,270 610,335 430,400 250,335" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="430" y="329" text-anchor="middle" class="body" font-size="18" font-weight="700">small, infrequent</text><text x="430" y="353" text-anchor="middle" class="body" font-size="18" font-weight="700">control transfer?</text>
  <polygon points="1130,270 1310,335 1130,400 950,335" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="1130" y="329" text-anchor="middle" class="body" font-size="18" font-weight="700">bulk or repeated</text><text x="1130" y="353" text-anchor="middle" class="body" font-size="18" font-weight="700">payload transfer?</text>
  <path d="M700 197 C650 235 540 260 430 270" class="line"/><path d="M860 197 C910 235 1020 260 1130 270" class="line"/>
  <rect x="100" y="485" width="410" height="170" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="305" y="526" text-anchor="middle" class="body" font-size="21" font-weight="700">MMIO programmed I/O</text><text x="305" y="562" text-anchor="middle" class="small">register reads/writes, tiny FIFO data</text><text x="305" y="592" text-anchor="middle" class="small">simple setup, CPU moves each unit</text><text x="305" y="626" text-anchor="middle" class="mono">best for small control paths</text>
  <path d="M430 400 V450 H305 V485" class="line"/><text x="445" y="440" class="small">yes</text>
  <rect x="980" y="485" width="410" height="170" rx="8" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="1185" y="526" text-anchor="middle" class="body" font-size="21" font-weight="700">DMA payload transfer</text><text x="1185" y="562" text-anchor="middle" class="small">descriptors, mapped buffers, scatter/gather</text><text x="1185" y="592" text-anchor="middle" class="small">setup overhead amortized over many bytes</text><text x="1185" y="626" text-anchor="middle" class="mono">best for bulk data paths</text>
  <path d="M1130 400 V450 H1185 V485" class="line"/><text x="1145" y="440" class="small">yes</text>
  <polygon points="750,475 920,540 750,605 580,540" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="750" y="534" text-anchor="middle" class="body" font-size="18" font-weight="700">How frequent are</text><text x="750" y="558" text-anchor="middle" class="body" font-size="18" font-weight="700">completion events?</text>
  <path d="M510 570 H580" class="line"/><path d="M980 570 H920" class="line"/>
  <rect x="405" y="695" width="310" height="90" rx="7" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="560" y="730" text-anchor="middle" class="body" font-size="19" font-weight="700">Sparse: interrupt</text><text x="560" y="758" text-anchor="middle" class="small">sleep or do other work between events</text>
  <rect x="845" y="695" width="310" height="90" rx="7" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="1000" y="730" text-anchor="middle" class="body" font-size="19" font-weight="700">High rate: poll/batch</text><text x="1000" y="758" text-anchor="middle" class="small">amortize entry cost and drain queues</text>
  <path d="M700 605 C650 650 600 665 560 695" class="line"/><text x="625" y="650" class="small">low</text><path d="M800 605 C850 650 950 665 1000 695" class="line"/><text x="890" y="650" class="small">high</text>
  <text x="780" y="808" text-anchor="middle" class="small">Middle ground: interrupt coalescing or adaptive polling changes mode as load changes.</text>
</svg>
