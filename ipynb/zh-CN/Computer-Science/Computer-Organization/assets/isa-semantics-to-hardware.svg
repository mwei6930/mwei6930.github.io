<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">From ISA semantics to processor hardware</title>
  <desc id="desc">An instruction encoding is decoded into control decisions, data values flow through a datapath, and selected architectural state changes at the clock edge.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker>
    <marker id="controlArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#c2410c"/></marker>
  </defs>
  <rect width="1200" height="620" fill="#ffffff"/>
  <text x="600" y="38" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#111827">One instruction crosses three reasoning layers</text>

  <rect x="50" y="72" width="1100" height="130" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="78" y="104" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#1d4ed8">ISA semantics: what must be observed</text>
  <rect x="78" y="125" width="290" height="48" rx="6" fill="#ffffff" stroke="#2563eb"/>
  <text x="223" y="155" text-anchor="middle" font-family="Consolas, monospace" font-size="20" fill="#111827">add x5, x6, x7</text>
  <text x="410" y="145" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#111827">R[5]&#8242; = (R[6] + R[7]) mod 2<tspan baseline-shift="super" font-size="13">32</tspan></text>
  <text x="410" y="174" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#4b5563">PC&#8242; = PC + 4; memory is unchanged</text>
  <text x="1095" y="154" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#4b5563">The ISA does not prescribe the circuit.</text>

  <line x1="600" y1="202" x2="600" y2="238" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="616" y="228" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#4b5563">implementation choice</text>

  <rect x="50" y="246" width="520" height="190" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="78" y="280" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#9a3412">Control: which actions are enabled</text>
  <rect x="80" y="307" width="205" height="48" rx="6" fill="#ffffff" stroke="#c2410c"/>
  <text x="182" y="337" text-anchor="middle" font-family="Consolas, monospace" font-size="17" fill="#111827">decode opcode/funct</text>
  <rect x="330" y="307" width="205" height="48" rx="6" fill="#ffffff" stroke="#c2410c"/>
  <text x="432" y="337" text-anchor="middle" font-family="Consolas, monospace" font-size="17" fill="#111827">ALUControl = ADD</text>
  <rect x="80" y="373" width="205" height="42" rx="6" fill="#ffffff" stroke="#c2410c"/>
  <text x="182" y="400" text-anchor="middle" font-family="Consolas, monospace" font-size="16" fill="#111827">RegWrite = 1</text>
  <rect x="330" y="373" width="205" height="42" rx="6" fill="#ffffff" stroke="#c2410c"/>
  <text x="432" y="400" text-anchor="middle" font-family="Consolas, monospace" font-size="16" fill="#111827">MemWrite = 0</text>

  <rect x="630" y="246" width="520" height="190" rx="8" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
  <text x="658" y="280" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f766e">Datapath: where values travel</text>
  <rect x="660" y="310" width="130" height="64" rx="6" fill="#ffffff" stroke="#0f766e"/>
  <text x="725" y="337" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#111827">Register file</text>
  <text x="725" y="359" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#4b5563">R[6], R[7]</text>
  <rect x="840" y="310" width="120" height="64" rx="6" fill="#ffffff" stroke="#0f766e"/>
  <text x="900" y="349" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#111827">ALU</text>
  <rect x="1010" y="310" width="110" height="64" rx="6" fill="#ffffff" stroke="#0f766e"/>
  <text x="1065" y="337" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#111827">Write-back</text>
  <text x="1065" y="359" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#4b5563">to R[5]</text>
  <line x1="790" y1="342" x2="838" y2="342" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="960" y1="342" x2="1008" y2="342" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="890" y="408" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#4b5563">Combinational values settle during the cycle.</text>

  <path d="M570 340 C600 340, 600 340, 630 340" fill="none" stroke="#c2410c" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#controlArrow)"/>

  <line x1="600" y1="436" x2="600" y2="475" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="180" y="483" width="840" height="95" rx="8" fill="#fefce8" stroke="#a16207" stroke-width="2"/>
  <text x="600" y="515" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#854d0e">Clock edge: commit only the selected architectural changes</text>
  <text x="600" y="547" text-anchor="middle" font-family="Consolas, monospace" font-size="18" fill="#111827">PC &#8592; PC + 4&#160;&#160;&#160;&#160; R[5] &#8592; ALUResult&#160;&#160;&#160;&#160; memory unchanged</text>
  <text x="600" y="569" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#4b5563">Correct hardware may be single-cycle, multi-cycle, pipelined, or out-of-order and still implement the same ISA result.</text>
</svg>
