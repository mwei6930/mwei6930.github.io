<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720" role="img" aria-labelledby="title desc">
  <title id="title">Generic page-table entry fields and permission checking</title>
  <desc id="desc">A generic page-table entry combines a physical page number with valid, user, read, write, execute, accessed, dirty, and software-defined state. The MMU checks presence and permissions before constructing a physical address.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker><style>.body{font-family:"Segoe UI",Arial,sans-serif;fill:#111827}.small{font-family:"Segoe UI",Arial,sans-serif;fill:#4b5563;font-size:15px}.mono{font-family:Consolas,monospace;fill:#111827;font-size:16px}.line{stroke:#374151;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1500" height="720" fill="#ffffff"/>
  <text x="750" y="42" text-anchor="middle" class="body" font-size="28" font-weight="700">A PTE combines mapping and policy</text>
  <text x="750" y="72" text-anchor="middle" class="small">Bit positions differ by ISA; these are the common conceptual fields rather than one exact binary format.</text>
  <rect x="70" y="130" width="1360" height="110" rx="7" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <rect x="70" y="130" width="680" height="110" fill="#dbeafe" stroke="#2563eb"/><text x="410" y="172" text-anchor="middle" class="body" font-size="20" font-weight="700">Physical page number (PPN / PFN)</text><text x="410" y="205" text-anchor="middle" class="small">becomes the high bits of the physical address</text>
  <g class="body" font-size="16" font-weight="700"><rect x="750" y="130" width="85" height="110" fill="#dcfce7" stroke="#16a34a"/><text x="792" y="178" text-anchor="middle">V/P</text><text x="792" y="204" text-anchor="middle" class="small">valid</text><rect x="835" y="130" width="85" height="110" fill="#fef3c7" stroke="#d97706"/><text x="877" y="178" text-anchor="middle">U</text><text x="877" y="204" text-anchor="middle" class="small">user</text><rect x="920" y="130" width="85" height="110" fill="#f5f3ff" stroke="#7c3aed"/><text x="962" y="178" text-anchor="middle">R</text><text x="962" y="204" text-anchor="middle" class="small">read</text><rect x="1005" y="130" width="85" height="110" fill="#fee2e2" stroke="#dc2626"/><text x="1047" y="178" text-anchor="middle">W</text><text x="1047" y="204" text-anchor="middle" class="small">write</text><rect x="1090" y="130" width="85" height="110" fill="#e0f2fe" stroke="#0284c7"/><text x="1132" y="178" text-anchor="middle">X</text><text x="1132" y="204" text-anchor="middle" class="small">execute</text><rect x="1175" y="130" width="85" height="110" fill="#f3f4f6" stroke="#6b7280"/><text x="1217" y="178" text-anchor="middle">A</text><text x="1217" y="204" text-anchor="middle" class="small">accessed</text><rect x="1260" y="130" width="85" height="110" fill="#fff7ed" stroke="#ea580c"/><text x="1302" y="178" text-anchor="middle">D</text><text x="1302" y="204" text-anchor="middle" class="small">dirty</text><rect x="1345" y="130" width="85" height="110" fill="#f9fafb" stroke="#9ca3af"/><text x="1387" y="178" text-anchor="middle">SW</text><text x="1387" y="204" text-anchor="middle" class="small">OS use</text></g>

  <rect x="100" y="315" width="400" height="290" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="300" y="351" text-anchor="middle" class="body" font-size="21" font-weight="700">Access request</text>
  <text x="145" y="399" class="mono">mode   = user</text><text x="145" y="437" class="mono">action = write</text><text x="145" y="475" class="mono">VPN    = 0x12345</text><text x="145" y="513" class="mono">offset = 0xABC</text>
  <text x="300" y="565" text-anchor="middle" class="small">The requested operation is part of translation.</text>
  <rect x="560" y="315" width="380" height="290" rx="8" fill="#f9fafb" stroke="#374151" stroke-width="2"/>
  <text x="750" y="351" text-anchor="middle" class="body" font-size="21" font-weight="700">MMU checks</text>
  <text x="610" y="399" class="mono">1. valid/present?</text><text x="610" y="437" class="mono">2. user allowed?</text><text x="610" y="475" class="mono">3. write allowed?</text><text x="610" y="513" class="mono">4. update A/D state</text>
  <text x="750" y="565" text-anchor="middle" class="small">A cached TLB entry must enforce equivalent permissions.</text>
  <rect x="1000" y="315" width="400" height="290" rx="8" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
  <text x="1200" y="351" text-anchor="middle" class="body" font-size="21" font-weight="700">Outcome</text>
  <rect x="1055" y="385" width="290" height="60" rx="5" fill="#dcfce7" stroke="#16a34a"/><text x="1200" y="422" text-anchor="middle" class="body" font-size="17" font-weight="700">allowed: construct PA</text>
  <rect x="1055" y="470" width="290" height="60" rx="5" fill="#fee2e2" stroke="#dc2626"/><text x="1200" y="507" text-anchor="middle" class="body" font-size="17" font-weight="700">denied/absent: exception</text>
  <text x="1200" y="565" text-anchor="middle" class="small">A fault is resolved by software or reported to the process.</text>
  <path d="M500 460 H560" class="line"/><path d="M940 460 H1000" class="line"/>
  <text x="750" y="665" text-anchor="middle" class="body" font-size="18" font-weight="700">Translation is not merely arithmetic: every instruction fetch, load, and store is also a protection check.</text>
</svg>
