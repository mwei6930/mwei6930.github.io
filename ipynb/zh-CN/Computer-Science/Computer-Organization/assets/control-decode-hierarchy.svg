<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="650" viewBox="0 0 1250 650" role="img" aria-labelledby="title desc">
  <title id="title">Hierarchical control decoding</title>
  <desc id="desc">The opcode drives main control, function fields refine the ALU operation, and branch or jump conditions choose the next program counter.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker>
    <marker id="orangeArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#c2410c"/></marker>
  </defs>
  <rect width="1250" height="650" fill="#ffffff"/>
  <text x="625" y="40" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#111827">Control is a decoding hierarchy, not a sequence of software steps</text>

  <rect x="45" y="95" width="245" height="175" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="167" y="130" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#1d4ed8">Instruction fields</text>
  <rect x="75" y="155" width="185" height="38" rx="5" fill="#ffffff" stroke="#2563eb"/>
  <text x="167" y="180" text-anchor="middle" font-family="Consolas, monospace" font-size="16" fill="#111827">opcode = instr[6:0]</text>
  <rect x="75" y="207" width="185" height="38" rx="5" fill="#ffffff" stroke="#2563eb"/>
  <text x="167" y="232" text-anchor="middle" font-family="Consolas, monospace" font-size="16" fill="#111827">funct3, funct7[5]</text>

  <rect x="370" y="75" width="270" height="230" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="505" y="112" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#9a3412">Main decoder</text>
  <text x="505" y="139" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#4b5563">instruction class from opcode</text>
  <text x="405" y="178" font-family="Consolas, monospace" font-size="15" fill="#111827">RegWrite</text>
  <text x="405" y="204" font-family="Consolas, monospace" font-size="15" fill="#111827">MemWrite</text>
  <text x="405" y="230" font-family="Consolas, monospace" font-size="15" fill="#111827">ALUSrc / ResultSrc</text>
  <text x="405" y="256" font-family="Consolas, monospace" font-size="15" fill="#111827">ImmSrc / Branch / Jump</text>
  <text x="405" y="282" font-family="Consolas, monospace" font-size="15" fill="#111827">ALUOp</text>

  <rect x="735" y="75" width="225" height="165" rx="8" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
  <text x="847" y="112" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f766e">ALU decoder</text>
  <text x="847" y="145" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#111827">ALUOp</text>
  <text x="847" y="171" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#111827">funct3 + funct7[5]</text>
  <rect x="775" y="191" width="145" height="32" rx="5" fill="#ffffff" stroke="#0f766e"/>
  <text x="847" y="213" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#111827">ALUControl</text>

  <rect x="1015" y="75" width="190" height="165" rx="8" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
  <text x="1110" y="112" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f766e">ALU</text>
  <text x="1110" y="148" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#111827">ADD, SUB, AND,</text>
  <text x="1110" y="173" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#111827">OR, SLT, ...</text>
  <text x="1110" y="211" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#4b5563">ALUResult</text>

  <line x1="290" y1="170" x2="368" y2="170" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="329" y="157" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#4b5563">opcode</text>
  <path d="M290 225 H690 V155 H733" fill="none" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="520" y="325" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#4b5563">Most outputs depend only on the instruction class.</text>
  <line x1="640" y1="270" x2="735" y2="200" stroke="#c2410c" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#orangeArrow)"/>
  <line x1="960" y1="157" x2="1013" y2="157" stroke="#c2410c" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#orangeArrow)"/>

  <rect x="165" y="385" width="920" height="205" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="2"/>
  <text x="625" y="421" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#111827">Next-PC decision</text>
  <rect x="215" y="455" width="175" height="72" rx="6" fill="#fff7ed" stroke="#c2410c"/>
  <text x="302" y="484" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#111827">Branch / Jump</text>
  <text x="302" y="508" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#4b5563">from main decoder</text>
  <rect x="475" y="455" width="175" height="72" rx="6" fill="#ecfdf5" stroke="#0f766e"/>
  <text x="562" y="484" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#111827">BrEq / BrLt</text>
  <text x="562" y="508" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#4b5563">comparison result</text>
  <rect x="735" y="455" width="145" height="72" rx="6" fill="#ffffff" stroke="#374151"/>
  <text x="807" y="485" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#111827">Decision logic</text>
  <text x="807" y="509" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#4b5563">taken?</text>
  <path d="M945 449 l85 0 l25 42 l-25 42 l-85 0 z" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <text x="990" y="481" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#111827">Next PC</text>
  <text x="990" y="506" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#4b5563">MUX</text>
  <line x1="390" y1="491" x2="733" y2="491" stroke="#c2410c" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#orangeArrow)"/>
  <line x1="650" y1="491" x2="733" y2="491" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="880" y1="491" x2="943" y2="491" stroke="#c2410c" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#orangeArrow)"/>
  <text x="625" y="568" text-anchor="middle" font-family="Consolas, monospace" font-size="16" fill="#374151">take = Jump OR (Branch AND condition_matches_funct3)</text>
</svg>
