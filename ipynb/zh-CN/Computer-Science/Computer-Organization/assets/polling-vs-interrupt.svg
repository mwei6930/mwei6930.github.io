<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="780" viewBox="0 0 1560 780" role="img" aria-labelledby="title desc">
  <title id="title">Polling and interrupts trade CPU overhead against detection latency</title>
  <desc id="desc">Two timelines compare repeated status checks with interrupt-driven waiting. Polling detects completion at the next check but spends CPU work while idle; interrupts avoid repeated checks but pay entry, handler, and return overhead.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker><style>.body{font-family:"Segoe UI",Arial,sans-serif;fill:#111827}.small{font-family:"Segoe UI",Arial,sans-serif;fill:#4b5563;font-size:15px}.mono{font-family:Consolas,monospace;fill:#111827;font-size:15px}.axis{stroke:#374151;stroke-width:2.5;marker-end:url(#arrow)}</style></defs>
  <rect width="1560" height="780" fill="#ffffff"/>
  <text x="780" y="42" text-anchor="middle" class="body" font-size="28" font-weight="700">Polling spends attention; interrupts spend transition overhead</text>
  <text x="780" y="72" text-anchor="middle" class="small">Neither is universally better. Event rate, required latency, useful work, and batching determine the right mechanism.</text>
  <rect x="70" y="120" width="1420" height="250" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="120" y="160" class="body" font-size="22" font-weight="700">Polling timeline</text>
  <line x1="190" y1="250" x2="1430" y2="250" class="axis"/>
  <g><rect x="260" y="205" width="100" height="90" fill="#dbeafe" stroke="#2563eb"/><text x="310" y="245" text-anchor="middle" class="mono">check</text><text x="310" y="271" text-anchor="middle" class="small">not ready</text><rect x="450" y="205" width="100" height="90" fill="#dbeafe" stroke="#2563eb"/><text x="500" y="245" text-anchor="middle" class="mono">check</text><text x="500" y="271" text-anchor="middle" class="small">not ready</text><rect x="640" y="205" width="100" height="90" fill="#dbeafe" stroke="#2563eb"/><text x="690" y="245" text-anchor="middle" class="mono">check</text><text x="690" y="271" text-anchor="middle" class="small">not ready</text><line x1="830" y1="175" x2="830" y2="325" stroke="#ea580c" stroke-width="4"/><text x="830" y="168" text-anchor="middle" class="body" font-size="16" fill="#ea580c">device completes</text><rect x="900" y="205" width="120" height="90" fill="#dcfce7" stroke="#16a34a"/><text x="960" y="245" text-anchor="middle" class="mono">check</text><text x="960" y="271" text-anchor="middle" class="small">detect ready</text></g>
  <text x="1140" y="320" class="small">detection delay is at most one polling interval</text><text x="320" y="335" class="small">CPU repeatedly reads status even when no event exists</text>
  <rect x="70" y="410" width="1420" height="250" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="120" y="450" class="body" font-size="22" font-weight="700">Interrupt-driven timeline</text>
  <line x1="190" y1="540" x2="1430" y2="540" class="axis"/>
  <rect x="260" y="495" width="480" height="90" fill="#ecfdf5" stroke="#0f766e"/><text x="500" y="535" text-anchor="middle" class="body" font-size="18" font-weight="700">CPU performs other work or waits efficiently</text><text x="500" y="562" text-anchor="middle" class="small">no repeated device status reads</text>
  <line x1="830" y1="465" x2="830" y2="615" stroke="#ea580c" stroke-width="4"/><text x="830" y="458" text-anchor="middle" class="body" font-size="16" fill="#ea580c">device completes</text>
  <rect x="860" y="495" width="130" height="90" fill="#fef3c7" stroke="#d97706"/><text x="925" y="530" text-anchor="middle" class="mono">entry</text><text x="925" y="557" text-anchor="middle" class="small">save + vector</text>
  <rect x="990" y="495" width="180" height="90" fill="#dbeafe" stroke="#2563eb"/><text x="1080" y="530" text-anchor="middle" class="mono">handler</text><text x="1080" y="557" text-anchor="middle" class="small">ack + service</text>
  <rect x="1170" y="495" width="130" height="90" fill="#fef3c7" stroke="#d97706"/><text x="1235" y="530" text-anchor="middle" class="mono">return</text><text x="1235" y="557" text-anchor="middle" class="small">restore state</text>
  <text x="925" y="625" class="small">interrupt delivery and handler overhead</text>
  <rect x="220" y="700" width="1120" height="52" rx="6" fill="#f9fafb" stroke="#9ca3af"/><text x="780" y="733" text-anchor="middle" class="body" font-size="17" font-weight="700">High-rate systems often combine both: interrupt to signal work, then polling to drain a batch before re-enabling interrupts.</text>
</svg>
