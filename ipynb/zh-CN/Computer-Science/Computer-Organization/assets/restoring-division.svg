<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Restoring binary division of thirteen by three</title>
  <desc id="desc">Four iterations shift the combined remainder and quotient registers, try subtracting the divisor, and restore the remainder when subtraction is negative.</desc>
  <defs>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #202a35; }
      .head { font: 700 17px Arial, sans-serif; fill: #ffffff; }
      .label { font: 700 17px Arial, sans-serif; fill: #202a35; }
      .body { font: 15px Arial, sans-serif; fill: #475569; }
      .mono { font: 700 20px Consolas, monospace; fill: #102a43; }
    </style>
  </defs>
  <rect width="1200" height="650" fill="#ffffff"/>
  <text x="600" y="42" text-anchor="middle" class="title">Restoring division: 1101 (13) / 0011 (3)</text>
  <rect x="70" y="68" width="1060" height="68" rx="8" fill="#e8f3f1" stroke="#2a9d8f" stroke-width="2"/>
  <text x="235" y="110" text-anchor="middle" class="mono">A = 0000</text>
  <text x="600" y="110" text-anchor="middle" class="mono">Q = 1101</text>
  <text x="965" y="110" text-anchor="middle" class="mono">M = 0011</text>

  <rect x="70" y="166" width="1060" height="50" fill="#355070"/>
  <text x="120" y="198" text-anchor="middle" class="head">step</text>
  <text x="300" y="198" text-anchor="middle" class="head">after left shift (A,Q)</text>
  <text x="545" y="198" text-anchor="middle" class="head">trial A - M</text>
  <text x="795" y="198" text-anchor="middle" class="head">decision</text>
  <text x="1040" y="198" text-anchor="middle" class="head">end state</text>

  <g>
    <rect x="70" y="216" width="1060" height="78" fill="#f8fafc" stroke="#d8e0e8"/>
    <text x="120" y="263" text-anchor="middle" class="label">1</text><text x="300" y="263" text-anchor="middle" class="mono">0001 | 1010</text>
    <text x="545" y="263" text-anchor="middle" class="mono">1110 (-2)</text><text x="795" y="250" text-anchor="middle" class="body">negative: write Q0 = 0</text><text x="795" y="272" text-anchor="middle" class="body">restore A by adding M</text><text x="1040" y="263" text-anchor="middle" class="mono">0001 | 1010</text>
    <rect x="70" y="294" width="1060" height="78" fill="#edf4ff" stroke="#d8e0e8"/>
    <text x="120" y="341" text-anchor="middle" class="label">2</text><text x="300" y="341" text-anchor="middle" class="mono">0011 | 0100</text>
    <text x="545" y="341" text-anchor="middle" class="mono">0000 (0)</text><text x="795" y="341" text-anchor="middle" class="body">non-negative: keep A, write Q0 = 1</text><text x="1040" y="341" text-anchor="middle" class="mono">0000 | 0101</text>
    <rect x="70" y="372" width="1060" height="78" fill="#f8fafc" stroke="#d8e0e8"/>
    <text x="120" y="419" text-anchor="middle" class="label">3</text><text x="300" y="419" text-anchor="middle" class="mono">0000 | 1010</text>
    <text x="545" y="419" text-anchor="middle" class="mono">1101 (-3)</text><text x="795" y="406" text-anchor="middle" class="body">negative: write Q0 = 0</text><text x="795" y="428" text-anchor="middle" class="body">restore A by adding M</text><text x="1040" y="419" text-anchor="middle" class="mono">0000 | 1010</text>
    <rect x="70" y="450" width="1060" height="78" fill="#fff2e8" stroke="#d8e0e8"/>
    <text x="120" y="497" text-anchor="middle" class="label">4</text><text x="300" y="497" text-anchor="middle" class="mono">0001 | 0100</text>
    <text x="545" y="497" text-anchor="middle" class="mono">1110 (-2)</text><text x="795" y="484" text-anchor="middle" class="body">negative: write Q0 = 0</text><text x="795" y="506" text-anchor="middle" class="body">restore A by adding M</text><text x="1040" y="497" text-anchor="middle" class="mono">0001 | 0100</text>
  </g>

  <rect x="220" y="558" width="760" height="58" rx="8" fill="#fff8db" stroke="#d4a017" stroke-width="2"/>
  <text x="600" y="594" text-anchor="middle" class="label">Q = 0100 = 4, A = 0001 = 1, so 13 = 3 x 4 + 1</text>
</svg>
