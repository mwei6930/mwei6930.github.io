<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="550" viewBox="0 0 1120 550" role="img" aria-labelledby="title desc">
  <title id="title">Privilege and hardware access checks</title><desc id="desc">A user request traps into a supervisor, while every instruction and memory access is checked against privilege state, page permissions, and physical memory protection before reaching a resource.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3 0 6Z" fill="#334155"/></marker></defs>
  <rect width="1120" height="550" rx="18" fill="#f8fafc"/>
  <text x="560" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#172033">Privilege is enforced on every protected transition</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="55" y="95" width="210" height="95" rx="11" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="160" y="130" font-size="19" font-weight="700" fill="#1e3a8a">User mode (U)</text><text x="160" y="160" font-size="14" fill="#334155">application request</text>
    <rect x="455" y="95" width="210" height="95" rx="11" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="560" y="130" font-size="19" font-weight="700" fill="#14532d">Supervisor (S)</text><text x="560" y="160" font-size="14" fill="#334155">OS validates policy</text>
    <rect x="855" y="95" width="210" height="95" rx="11" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="960" y="130" font-size="19" font-weight="700" fill="#78350f">Machine (M)</text><text x="960" y="160" font-size="14" fill="#334155">platform control</text>
  </g>
  <path d="M265 142 H445" stroke="#334155" stroke-width="3" marker-end="url(#a)"/><text x="355" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#334155">system call / trap</text>
  <path d="M665 142 H845" stroke="#334155" stroke-width="3" marker-end="url(#a)"/><text x="755" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#334155">firmware service / trap</text>
  <path d="M445 172 H275" stroke="#64748b" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#a)"/><text x="360" y="202" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">checked return</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="90" y="285" width="245" height="105" rx="11" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="213" y="320" font-size="18" font-weight="700" fill="#1e3a8a">Instruction check</text><text x="213" y="349" font-size="14" fill="#334155">privileged opcode?</text><text x="213" y="373" font-size="14" fill="#334155">current mode sufficient?</text>
    <rect x="438" y="285" width="245" height="105" rx="11" fill="#fff" stroke="#16a34a" stroke-width="2"/><text x="561" y="320" font-size="18" font-weight="700" fill="#14532d">Virtual-memory check</text><text x="561" y="349" font-size="14" fill="#334155">page U / R / W / X bits</text><text x="561" y="373" font-size="14" fill="#334155">address translation</text>
    <rect x="786" y="285" width="245" height="105" rx="11" fill="#fff" stroke="#d97706" stroke-width="2"/><text x="909" y="320" font-size="18" font-weight="700" fill="#78350f">Physical check</text><text x="909" y="349" font-size="14" fill="#334155">PMP / device permissions</text><text x="909" y="373" font-size="14" fill="#334155">final physical range</text>
  </g>
  <path d="M160 190 V275 H213" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#a)"/><path d="M560 190 V275" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#a)"/><path d="M960 190 V275 H909" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#a)"/>
  <rect x="350" y="455" width="420" height="58" rx="10" fill="#172033"/><text x="560" y="491" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#fff">Allow access or raise a precise exception</text>
  <g stroke="#334155" stroke-width="3" marker-end="url(#a)"><line x1="213" y1="390" x2="430" y2="450"/><line x1="561" y1="390" x2="561" y2="445"/><line x1="909" y1="390" x2="690" y2="450"/></g>
</svg>
