<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="790" viewBox="0 0 1560 790" role="img" aria-labelledby="title desc">
  <title id="title">Direct-mapped, set-associative, and fully associative cache placement</title>
  <desc id="desc">The same four-line cache is shown with one way and four sets, two ways and two sets, and four ways in one set. Memory blocks map to one set by modulo arithmetic and may occupy any way in that set.</desc>
  <defs>
    <marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker>
    <marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0f766e"/></marker>
    <style>.body{font-family:"Segoe UI",Arial,sans-serif;fill:#111827}.small{font-family:"Segoe UI",Arial,sans-serif;fill:#4b5563;font-size:15px}.mono{font-family:Consolas,monospace;fill:#111827;font-size:15px}.b{stroke:#2563eb;stroke-width:3;fill:none;marker-end:url(#blue)}.g{stroke:#0f766e;stroke-width:3;fill:none;marker-end:url(#green)}</style>
  </defs>
  <rect width="1560" height="790" fill="#ffffff"/>
  <text x="780" y="43" text-anchor="middle" class="body" font-size="28" font-weight="700">Associativity changes placement freedom, comparator count, and conflict behavior</text>
  <text x="780" y="74" text-anchor="middle" class="small">All three examples hold four blocks; only the number of sets and ways changes.</text>

  <rect x="30" y="115" width="480" height="590" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="270" y="157" text-anchor="middle" class="body" font-size="23" font-weight="700" fill="#1d4ed8">Direct-mapped</text>
  <text x="270" y="188" text-anchor="middle" class="mono">4 sets x 1 way</text>
  <g class="mono"><text x="65" y="250">block 0</text><text x="65" y="305">block 4</text><text x="65" y="360">block 1</text></g>
  <g transform="translate(285 220)">
    <text x="0" y="-12" class="small">one legal line per block</text>
    <rect x="0" y="0" width="160" height="65" fill="#ffffff" stroke="#2563eb"/><text x="22" y="40" class="mono">set 0 | way 0</text>
    <rect x="0" y="85" width="160" height="65" fill="#ffffff" stroke="#2563eb"/><text x="22" y="125" class="mono">set 1 | way 0</text>
    <rect x="0" y="170" width="160" height="65" fill="#ffffff" stroke="#2563eb"/><text x="22" y="210" class="mono">set 2 | way 0</text>
    <rect x="0" y="255" width="160" height="65" fill="#ffffff" stroke="#2563eb"/><text x="22" y="295" class="mono">set 3 | way 0</text>
  </g>
  <path d="M130 243 H280" class="b"/><path d="M130 298 H220 V243 H280" class="b"/><path d="M130 353 H220 V328 H280" class="g"/>
  <text x="270" y="575" text-anchor="middle" class="body" font-size="18" font-weight="700">set = block mod 4</text>
  <text x="270" y="610" text-anchor="middle" class="small">Blocks 0 and 4 always compete for set 0,</text>
  <text x="270" y="634" text-anchor="middle" class="small">even when other cache lines are unused.</text>
  <text x="270" y="674" text-anchor="middle" class="small">1 tag comparator on the hit path</text>

  <rect x="540" y="115" width="480" height="590" rx="8" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
  <text x="780" y="157" text-anchor="middle" class="body" font-size="23" font-weight="700" fill="#0f766e">Two-way set-associative</text>
  <text x="780" y="188" text-anchor="middle" class="mono">2 sets x 2 ways</text>
  <g class="mono"><text x="575" y="250">block 0</text><text x="575" y="305">block 2</text><text x="575" y="360">block 1</text></g>
  <g transform="translate(765 235)">
    <text x="40" y="-20" class="small">two legal ways in the selected set</text>
    <rect x="0" y="0" width="200" height="78" fill="#ffffff" stroke="#0f766e"/><path d="M100 0V78" stroke="#0f766e"/><text x="12" y="45" class="mono">set 0 / w0</text><text x="112" y="45" class="mono">set 0 / w1</text>
    <rect x="0" y="115" width="200" height="78" fill="#ffffff" stroke="#0f766e"/><path d="M100 115V193" stroke="#0f766e"/><text x="12" y="160" class="mono">set 1 / w0</text><text x="112" y="160" class="mono">set 1 / w1</text>
  </g>
  <path d="M640 243 H760" class="g"/><path d="M640 298 H710 V270 H760" class="g"/><path d="M640 353 H710 V388 H760" class="b"/>
  <text x="780" y="575" text-anchor="middle" class="body" font-size="18" font-weight="700">set = block mod 2</text>
  <text x="780" y="610" text-anchor="middle" class="small">Blocks 0 and 2 share set 0 but can coexist</text>
  <text x="780" y="634" text-anchor="middle" class="small">until both ways are occupied.</text>
  <text x="780" y="674" text-anchor="middle" class="small">2 tag comparators plus a way-selection MUX</text>

  <rect x="1050" y="115" width="480" height="590" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="1290" y="157" text-anchor="middle" class="body" font-size="23" font-weight="700" fill="#6d28d9">Fully associative</text>
  <text x="1290" y="188" text-anchor="middle" class="mono">1 set x 4 ways</text>
  <g class="mono"><text x="1085" y="250">any block</text><text x="1085" y="305">any block</text></g>
  <g transform="translate(1215 230)">
    <text x="0" y="-15" class="small">every line is a legal destination</text>
    <rect x="0" y="0" width="240" height="245" fill="#ffffff" stroke="#7c3aed"/>
    <path d="M0 61H240 M0 122H240 M0 183H240" stroke="#7c3aed"/>
    <text x="25" y="39" class="mono">way 0</text><text x="25" y="100" class="mono">way 1</text><text x="25" y="161" class="mono">way 2</text><text x="25" y="222" class="mono">way 3</text>
  </g>
  <path d="M1155 243 H1210" class="g"/><path d="M1155 298 H1190 V352 H1210" class="g"/>
  <text x="1290" y="575" text-anchor="middle" class="body" font-size="18" font-weight="700">no index field</text>
  <text x="1290" y="610" text-anchor="middle" class="small">Any block can occupy any line, eliminating</text>
  <text x="1290" y="634" text-anchor="middle" class="small">placement conflicts for this capacity.</text>
  <text x="1290" y="674" text-anchor="middle" class="small">4 tag comparators and a larger selection network</text>
  <text x="780" y="752" text-anchor="middle" class="small">More associativity usually reduces conflict misses, but it adds tag comparisons, replacement state, energy, and potentially hit latency.</text>
</svg>
