<svg xmlns="http://www.w3.org/2000/svg" width="1620" height="850" viewBox="0 0 1620 850" role="img" aria-labelledby="title desc">
  <title id="title">An SSD controller maps logical blocks to NAND pages and writes updates out of place</title>
  <desc id="desc">Host LBAs enter an SSD controller containing queues, an FTL mapping table, error correction, wear leveling, and garbage collection. Multiple NAND channels hold erase blocks made of pages. Updating LBA 42 writes a fresh page and marks the old page stale.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0f766e"/></marker><style>.body{font-family:"Segoe UI",Arial,sans-serif;fill:#111827}.small{font-family:"Segoe UI",Arial,sans-serif;fill:#4b5563;font-size:15px}.mono{font-family:Consolas,monospace;fill:#111827;font-size:15px}.line{stroke:#374151;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.write{stroke:#0f766e;stroke-width:4;fill:none;marker-end:url(#green)}</style></defs>
  <rect width="1620" height="850" fill="#ffffff"/>
  <text x="810" y="42" text-anchor="middle" class="body" font-size="28" font-weight="700">SSD updates are remapped, not overwritten in place</text>
  <text x="810" y="72" text-anchor="middle" class="small">NAND reads and programs pages but erases larger blocks, so the controller maintains a logical-to-physical translation layer.</text>
  <rect x="55" y="155" width="260" height="470" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="185" y="197" text-anchor="middle" class="body" font-size="22" font-weight="700">Host interface</text><text x="185" y="230" text-anchor="middle" class="small">NVMe / SATA commands</text>
  <rect x="100" y="290" width="170" height="72" rx="5" fill="#ffffff" stroke="#2563eb"/><text x="185" y="320" text-anchor="middle" class="mono">READ LBA 42</text><text x="185" y="346" text-anchor="middle" class="small">find current page</text>
  <rect x="100" y="405" width="170" height="72" rx="5" fill="#ecfdf5" stroke="#0f766e"/><text x="185" y="435" text-anchor="middle" class="mono">WRITE LBA 42</text><text x="185" y="461" text-anchor="middle" class="small">allocate fresh page</text>
  <rect x="400" y="105" width="600" height="570" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="700" y="147" text-anchor="middle" class="body" font-size="23" font-weight="700">SSD controller</text>
  <rect x="450" y="205" width="220" height="100" rx="6" fill="#ffffff" stroke="#7c3aed"/><text x="560" y="240" text-anchor="middle" class="body" font-size="18" font-weight="700">Command queues</text><text x="560" y="271" text-anchor="middle" class="small">schedule parallel requests</text>
  <rect x="730" y="205" width="220" height="100" rx="6" fill="#dbeafe" stroke="#2563eb"/><text x="840" y="240" text-anchor="middle" class="body" font-size="18" font-weight="700">FTL mapping</text><text x="840" y="271" text-anchor="middle" class="mono">LBA 42 -&gt; C1:B3:P5</text>
  <rect x="450" y="355" width="220" height="120" rx="6" fill="#fef3c7" stroke="#d97706"/><text x="560" y="390" text-anchor="middle" class="body" font-size="18" font-weight="700">Placement policy</text><text x="560" y="422" text-anchor="middle" class="small">wear leveling</text><text x="560" y="449" text-anchor="middle" class="small">over-provisioning</text>
  <rect x="730" y="355" width="220" height="120" rx="6" fill="#fff7ed" stroke="#ea580c"/><text x="840" y="390" text-anchor="middle" class="body" font-size="18" font-weight="700">Garbage collection</text><text x="840" y="422" text-anchor="middle" class="small">copy valid pages</text><text x="840" y="449" text-anchor="middle" class="small">erase reclaimed block</text>
  <rect x="450" y="525" width="500" height="100" rx="6" fill="#ecfdf5" stroke="#0f766e"/><text x="700" y="559" text-anchor="middle" class="body" font-size="18" font-weight="700">ECC, retry, encryption, and NAND channel engines</text><text x="700" y="592" text-anchor="middle" class="small">translate controller decisions into flash operations</text>
  <path d="M315 325 H450" class="line"/><path d="M315 440 H400" class="write"/><path d="M670 255 H730" class="line"/><path d="M560 305 V355" class="line"/><path d="M840 305 V355" class="line"/><path d="M560 475 V525" class="line"/><path d="M840 475 V525" class="line"/>
  <rect x="1085" y="105" width="480" height="570" rx="8" fill="#f9fafb" stroke="#374151" stroke-width="2"/>
  <text x="1325" y="147" text-anchor="middle" class="body" font-size="23" font-weight="700">NAND channels and erase blocks</text>
  <text x="1325" y="180" text-anchor="middle" class="small">pages can be read/programmed; whole blocks are erased</text>
  <g class="mono"><text x="1130" y="225">channel 0 / block 8</text><rect x="1130" y="245" width="370" height="45" fill="#dcfce7" stroke="#16a34a"/><text x="1145" y="273">P0 valid LBA 8</text><rect x="1130" y="290" width="370" height="45" fill="#fee2e2" stroke="#dc2626"/><text x="1145" y="318">P1 stale old LBA 42</text><rect x="1130" y="335" width="370" height="45" fill="#f3f4f6" stroke="#9ca3af"/><text x="1145" y="363">P2 free</text><text x="1130" y="425">channel 1 / block 3</text><rect x="1130" y="445" width="370" height="45" fill="#dcfce7" stroke="#16a34a"/><text x="1145" y="473">P4 valid LBA 21</text><rect x="1130" y="490" width="370" height="45" fill="#dbeafe" stroke="#2563eb"/><text x="1145" y="518">P5 new LBA 42</text><rect x="1130" y="535" width="370" height="45" fill="#f3f4f6" stroke="#9ca3af"/><text x="1145" y="563">P6 free</text></g>
  <path d="M1000 575 C1040 575 1040 512 1130 512" class="write"/>
  <text x="1325" y="625" text-anchor="middle" class="small">mapping changes first; old physical page becomes stale</text>
  <rect x="230" y="720" width="1160" height="82" rx="7" fill="#fff7ed" stroke="#ea580c"/><text x="810" y="753" text-anchor="middle" class="body" font-size="18" font-weight="700">Garbage collection and write amplification are consequences of erase-before-reuse.</text><text x="810" y="781" text-anchor="middle" class="small">The host writes logical data once, but the controller may copy additional valid pages while reclaiming a block.</text>
</svg>
