<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="730" viewBox="0 0 1500 730" role="img" aria-labelledby="title desc">
  <title id="title">The compulsory, capacity, and conflict cache miss model</title>
  <desc id="desc">A compulsory miss is the first reference to block A. A capacity miss occurs when a four-block working set exceeds a three-line fully associative cache. A conflict miss occurs when blocks 0 and 4 repeatedly map to one line of a four-line direct-mapped cache.</desc>
  <defs><style>.body{font-family:"Segoe UI",Arial,sans-serif;fill:#111827}.small{font-family:"Segoe UI",Arial,sans-serif;fill:#4b5563;font-size:15px}.mono{font-family:Consolas,monospace;fill:#111827;font-size:16px}</style></defs>
  <rect width="1500" height="730" fill="#ffffff"/>
  <text x="750" y="43" text-anchor="middle" class="body" font-size="28" font-weight="700">The 3C model explains why an access missed and which design change can help</text>
  <text x="750" y="74" text-anchor="middle" class="small">All classifications operate on blocks, not individual bytes.</text>

  <rect x="30" y="115" width="460" height="540" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="260" y="158" text-anchor="middle" class="body" font-size="24" font-weight="700" fill="#1d4ed8">Compulsory</text>
  <text x="260" y="188" text-anchor="middle" class="small">The block has never appeared earlier in the trace.</text>
  <rect x="85" y="245" width="350" height="76" rx="6" fill="#ffffff" stroke="#2563eb"/>
  <text x="260" y="276" text-anchor="middle" class="mono">trace: A</text><text x="260" y="303" text-anchor="middle" class="body" font-size="17" font-weight="700">first A -> miss</text>
  <rect x="105" y="370" width="310" height="120" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="260" y="407" text-anchor="middle" class="body" font-size="18" font-weight="700">even an infinite cache is empty</text>
  <text x="260" y="440" text-anchor="middle" class="small">demand fetch installs block A</text>
  <text x="260" y="468" text-anchor="middle" class="small">later A may hit</text>
  <text x="260" y="545" text-anchor="middle" class="body" font-size="18" font-weight="700">Helpful direction</text>
  <text x="260" y="578" text-anchor="middle" class="small">prefetch before demand, or transfer a block</text>
  <text x="260" y="603" text-anchor="middle" class="small">whose nearby bytes will also be used</text>

  <rect x="520" y="115" width="460" height="540" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="750" y="158" text-anchor="middle" class="body" font-size="24" font-weight="700" fill="#9a3412">Capacity</text>
  <text x="750" y="188" text-anchor="middle" class="small">The active working set cannot fit in the total cache.</text>
  <rect x="575" y="230" width="350" height="76" rx="6" fill="#ffffff" stroke="#c2410c"/>
  <text x="750" y="261" text-anchor="middle" class="mono">trace: A B C D A</text><text x="750" y="288" text-anchor="middle" class="small">three-line fully associative cache</text>
  <g transform="translate(595 355)" class="body" font-size="18" font-weight="700" text-anchor="middle">
    <rect x="0" y="0" width="90" height="70" fill="#ede9fe" stroke="#7c3aed"/><text x="45" y="43">B</text>
    <rect x="110" y="0" width="90" height="70" fill="#dbeafe" stroke="#2563eb"/><text x="155" y="43">C</text>
    <rect x="220" y="0" width="90" height="70" fill="#d1fae5" stroke="#0f766e"/><text x="265" y="43">D</text>
  </g>
  <text x="750" y="466" text-anchor="middle" class="small">D forced A out; the returning A misses again.</text>
  <text x="750" y="545" text-anchor="middle" class="body" font-size="18" font-weight="700">Helpful direction</text>
  <text x="750" y="578" text-anchor="middle" class="small">increase capacity or reduce the program's</text>
  <text x="750" y="603" text-anchor="middle" class="small">simultaneously active working set</text>

  <rect x="1010" y="115" width="460" height="540" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="1240" y="158" text-anchor="middle" class="body" font-size="24" font-weight="700" fill="#6d28d9">Conflict</text>
  <text x="1240" y="188" text-anchor="middle" class="small">Placement restrictions overload one set.</text>
  <rect x="1065" y="230" width="350" height="76" rx="6" fill="#ffffff" stroke="#7c3aed"/>
  <text x="1240" y="261" text-anchor="middle" class="mono">trace: block 0, 4, 0, 4</text><text x="1240" y="288" text-anchor="middle" class="small">four-line direct-mapped cache</text>
  <g transform="translate(1090 345)">
    <rect x="0" y="0" width="300" height="135" fill="#ffffff" stroke="#7c3aed"/>
    <path d="M0 34H300 M0 68H300 M0 102H300" stroke="#c4b5fd"/>
    <text x="18" y="24" class="mono" fill="#b91c1c">set 0: block 0 or 4</text><text x="18" y="58" class="mono">set 1: empty</text><text x="18" y="92" class="mono">set 2: empty</text><text x="18" y="126" class="mono">set 3: empty</text>
  </g>
  <text x="1240" y="510" text-anchor="middle" class="small">The whole cache has room, but set 0 does not.</text>
  <text x="1240" y="545" text-anchor="middle" class="body" font-size="18" font-weight="700">Helpful direction</text>
  <text x="1240" y="578" text-anchor="middle" class="small">increase associativity, change placement,</text>
  <text x="1240" y="603" text-anchor="middle" class="small">or change data layout/alignment</text>
  <text x="750" y="700" text-anchor="middle" class="small">A target miss is compulsory if the block is new; otherwise it is capacity if an equal-size fully associative cache also misses; the remaining misses are conflict misses.</text>
</svg>
