<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">Setup and hold timing window</title><desc id="desc">Data must be stable before and after the active clock edge.</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#374151"/></marker><style>.h{font:700 24px Arial,sans-serif;fill:#111827}.t{font:18px Arial,sans-serif;fill:#374151}.axis{stroke:#374151;stroke-width:3;marker-end:url(#a)}.clock{fill:none;stroke:#0f766e;stroke-width:4}.data{fill:none;stroke:#1d4ed8;stroke-width:4}.mark{stroke:#be123c;stroke-width:3;stroke-dasharray:8 6}</style></defs>
  <rect x="1.5" y="1.5" width="1117" height="557" rx="8" fill="#fff" stroke="#d1d5db" stroke-width="3"/><text x="560" y="45" text-anchor="middle" class="h">Capture edge and the forbidden data-change window</text><line x1="120" y1="440" x2="1035" y2="440" class="axis"/><text x="1045" y="447" class="t">time</text><text x="35" y="150" class="h">CLK</text><path d="M120 170H430V95H650V170H1000" class="clock"/><text x="35" y="300" class="h">D</text><path d="M120 320H300L350 275H760L815 320H1000" class="data"/><line x1="540" y1="70" x2="540" y2="440" class="mark"/><text x="540" y="62" text-anchor="middle" class="h" fill="#be123c">active edge</text><rect x="350" y="225" width="190" height="150" fill="#fef2f2" opacity="0.85"/><rect x="540" y="225" width="220" height="150" fill="#fff7ed" opacity="0.9"/><path d="M350 405H540" class="axis"/><text x="445" y="398" text-anchor="middle" class="t">setup interval t_setup</text><path d="M540 405H760" class="axis"/><text x="650" y="398" text-anchor="middle" class="t">hold interval t_hold</text><text x="555" y="255" class="t">D must remain stable here</text><rect x="120" y="475" width="880" height="55" rx="6" fill="#f8fafc" stroke="#d1d5db" stroke-width="2"/><text x="560" y="510" text-anchor="middle" class="t">Setup checks the latest-arriving path; hold checks the earliest-changing path</text>
</svg>
