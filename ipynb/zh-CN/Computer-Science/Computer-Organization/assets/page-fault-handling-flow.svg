<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" role="img" aria-labelledby="title desc">
  <title id="title">Hardware and operating-system steps for a page fault</title>
  <desc id="desc">A memory access that cannot complete translation traps to the operating system. The OS rejects invalid or prohibited accesses, or obtains a frame, possibly writes back a victim, fills the page, updates the page table and TLB state, and restarts the faulting instruction.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker><style>.body{font-family:"Segoe UI",Arial,sans-serif;fill:#111827}.small{font-family:"Segoe UI",Arial,sans-serif;fill:#4b5563;font-size:15px}.mono{font-family:Consolas,monospace;fill:#111827;font-size:15px}.line{stroke:#374151;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.yes{fill:#0f766e;font-family:"Segoe UI",Arial,sans-serif;font-size:15px}.no{fill:#dc2626;font-family:"Segoe UI",Arial,sans-serif;font-size:15px}</style></defs>
  <rect width="1500" height="820" fill="#ffffff"/>
  <text x="750" y="42" text-anchor="middle" class="body" font-size="28" font-weight="700">Page-fault handling depends on cause</text>
  <text x="750" y="72" text-anchor="middle" class="small">The slow storage path is only one possible resolution; lazy allocation and copy-on-write may need no disk read.</text>
  <rect x="80" y="135" width="255" height="78" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="207" y="168" text-anchor="middle" class="body" font-size="18" font-weight="700">instruction accesses VA</text><text x="207" y="194" text-anchor="middle" class="small">fetch, load, or store</text>
  <polygon points="520,125 690,174 520,223 350,174" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="520" y="168" text-anchor="middle" class="body" font-size="17" font-weight="700">translation and permission</text><text x="520" y="191" text-anchor="middle" class="body" font-size="17" font-weight="700">permit completion?</text>
  <rect x="810" y="135" width="260" height="78" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="940" y="168" text-anchor="middle" class="body" font-size="18" font-weight="700">complete memory access</text><text x="940" y="194" text-anchor="middle" class="small">no page-fault handler</text>
  <path d="M335 174 H350" class="line"/><path d="M690 174 H810" class="line"/><text x="742" y="160" class="yes">yes</text>
  <path d="M520 223 V292" class="line"/><text x="535" y="264" class="no">no: trap</text>
  <rect x="390" y="295" width="260" height="78" rx="7" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="520" y="328" text-anchor="middle" class="body" font-size="18" font-weight="700">OS examines fault</text><text x="520" y="354" text-anchor="middle" class="small">VA, access type, cause, process map</text>
  <polygon points="850,285 1030,334 850,383 670,334" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="850" y="329" text-anchor="middle" class="body" font-size="17" font-weight="700">valid region and</text><text x="850" y="352" text-anchor="middle" class="body" font-size="17" font-weight="700">permitted operation?</text>
  <path d="M650 334 H670" class="line"/><path d="M1030 334 H1170" class="line"/><text x="1085" y="319" class="no">no</text>
  <rect x="1170" y="295" width="260" height="78" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="1300" y="328" text-anchor="middle" class="body" font-size="18" font-weight="700">deliver error</text><text x="1300" y="354" text-anchor="middle" class="small">for example, terminate user process</text>
  <path d="M850 383 V452" class="line"/><text x="865" y="422" class="yes">yes</text>
  <rect x="710" y="455" width="280" height="78" rx="7" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="850" y="488" text-anchor="middle" class="body" font-size="18" font-weight="700">obtain a physical frame</text><text x="850" y="514" text-anchor="middle" class="small">free, evict victim, or allocate zero page</text>
  <rect x="320" y="585" width="285" height="86" rx="7" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/><text x="462" y="618" text-anchor="middle" class="body" font-size="18" font-weight="700">prepare page contents</text><text x="462" y="644" text-anchor="middle" class="small">read file/swap, zero-fill, or copy</text>
  <rect x="710" y="585" width="280" height="86" rx="7" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="850" y="618" text-anchor="middle" class="body" font-size="18" font-weight="700">update PTE and TLB state</text><text x="850" y="644" text-anchor="middle" class="small">publish PFN, permissions, present bit</text>
  <rect x="1100" y="585" width="285" height="86" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="1242" y="618" text-anchor="middle" class="body" font-size="18" font-weight="700">restart faulting instruction</text><text x="1242" y="644" text-anchor="middle" class="small">same VA now translates successfully</text>
  <path d="M850 533 V555 H462 V585" class="line"/><path d="M605 628 H710" class="line"/><path d="M990 628 H1100" class="line"/>
  <rect x="235" y="730" width="1030" height="56" rx="6" fill="#f9fafb" stroke="#9ca3af"/><text x="750" y="765" text-anchor="middle" class="body" font-size="17" font-weight="700">A TLB miss merely requests a translation lookup; a page fault means hardware cannot legally finish the access with current mappings.</text>
</svg>
