<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
  <title id="title">False sharing and cache-line padding</title>
  <desc id="desc">Two cores update different counters that occupy the same cache line, causing ownership ping-pong. Padding places the counters in separate lines and removes unnecessary coherence traffic.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/></marker><style>.body{font-family:"Segoe UI",Arial,sans-serif;fill:#111827}.small{font-family:"Segoe UI",Arial,sans-serif;fill:#4b5563;font-size:16px}.mono{font-family:Consolas,monospace;fill:#111827;font-size:15px}.bad{stroke:#dc2626;stroke-width:3;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1500" height="760" fill="#ffffff"/>
  <text x="750" y="44" text-anchor="middle" class="body" font-size="29" font-weight="700">Coherence operates on cache lines, not source-language variables</text>
  <text x="750" y="75" text-anchor="middle" class="small">Independent counters can still interfere when they occupy the same coherence block.</text>

  <rect x="50" y="125" width="675" height="535" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="387" y="168" text-anchor="middle" class="body" font-size="22" font-weight="700">False sharing: one line ping-pongs</text>
  <rect x="110" y="220" width="210" height="95" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="215" y="257" text-anchor="middle" class="body" font-size="18" font-weight="700">Core 0 cache</text><text x="215" y="287" text-anchor="middle" class="mono">write counter A</text>
  <rect x="455" y="220" width="210" height="95" rx="7" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="560" y="257" text-anchor="middle" class="body" font-size="18" font-weight="700">Core 1 cache</text><text x="560" y="287" text-anchor="middle" class="mono">write counter B</text>
  <path d="M320 255 C370 210 405 210 455 255" class="bad"/><path d="M455 285 C405 330 370 330 320 285" class="bad"/>
  <text x="387" y="350" text-anchor="middle" class="small">every write requests exclusive ownership of the entire line</text>
  <rect x="105" y="390" width="560" height="94" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <rect x="125" y="410" width="120" height="54" rx="4" fill="#fee2e2" stroke="#dc2626"/><text x="185" y="442" text-anchor="middle" class="mono">A</text>
  <rect x="245" y="410" width="120" height="54" rx="4" fill="#f3e8ff" stroke="#7c3aed"/><text x="305" y="442" text-anchor="middle" class="mono">B</text>
  <rect x="365" y="410" width="280" height="54" rx="4" fill="#f9fafb" stroke="#9ca3af"/><text x="505" y="442" text-anchor="middle" class="small">other bytes in the same line</text>
  <text x="387" y="527" text-anchor="middle" class="body" font-size="17" font-weight="700">correct result, poor scalability</text>
  <text x="387" y="558" text-anchor="middle" class="small">invalidations and line transfers are unnecessary logically</text>

  <rect x="775" y="125" width="675" height="535" rx="8" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
  <text x="1112" y="168" text-anchor="middle" class="body" font-size="22" font-weight="700">Padding or partitioning: separate lines</text>
  <rect x="835" y="220" width="210" height="95" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="940" y="257" text-anchor="middle" class="body" font-size="18" font-weight="700">Core 0 cache</text><text x="940" y="287" text-anchor="middle" class="mono">owns line A</text>
  <rect x="1180" y="220" width="210" height="95" rx="7" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="1285" y="257" text-anchor="middle" class="body" font-size="18" font-weight="700">Core 1 cache</text><text x="1285" y="287" text-anchor="middle" class="mono">owns line B</text>
  <text x="1112" y="350" text-anchor="middle" class="small">each core repeatedly writes its own line without invalidating the other</text>
  <rect x="830" y="390" width="250" height="94" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><rect x="850" y="410" width="90" height="54" rx="4" fill="#dbeafe" stroke="#2563eb"/><text x="895" y="442" text-anchor="middle" class="mono">A</text><text x="1000" y="442" text-anchor="middle" class="small">padding</text>
  <rect x="1145" y="390" width="250" height="94" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/><rect x="1165" y="410" width="90" height="54" rx="4" fill="#f3e8ff" stroke="#7c3aed"/><text x="1210" y="442" text-anchor="middle" class="mono">B</text><text x="1315" y="442" text-anchor="middle" class="small">padding</text>
  <text x="1112" y="527" text-anchor="middle" class="body" font-size="17" font-weight="700">same algorithm, less coherence traffic</text>
  <text x="1112" y="558" text-anchor="middle" class="small">thread-private aggregation can be even better than padding</text>
  <text x="750" y="714" text-anchor="middle" class="body" font-size="18" font-weight="700">True sharing is about the same value; false sharing is about different values in the same cache line.</text>
</svg>
