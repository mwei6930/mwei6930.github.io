<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">One bit pattern interpreted under several data contracts</title>
  <desc id="desc">The 32-bit pattern FFFFFFFB can mean a large unsigned integer, negative five in two's complement, a NaN in IEEE 754 binary32, or four raw bytes.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#355070"/>
    </marker>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #202a35; }
      .label { font: 700 19px Arial, sans-serif; fill: #202a35; }
      .body { font: 16px Arial, sans-serif; fill: #334155; }
      .mono { font: 700 24px Consolas, monospace; fill: #102a43; letter-spacing: 1px; }
      .small { font: 14px Arial, sans-serif; fill: #52616f; }
    </style>
  </defs>
  <rect width="1200" height="500" fill="#ffffff"/>
  <text x="600" y="42" text-anchor="middle" class="title">Bits do not carry a type by themselves</text>

  <rect x="150" y="76" width="900" height="104" rx="8" fill="#e8f3f1" stroke="#2a9d8f" stroke-width="2"/>
  <text x="600" y="112" text-anchor="middle" class="label">One 32-bit pattern</text>
  <text x="600" y="150" text-anchor="middle" class="mono">1111 1111 1111 1111 1111 1111 1111 1011</text>
  <text x="600" y="172" text-anchor="middle" class="small">hexadecimal shorthand: 0xFFFFFFFB</text>

  <line x1="600" y1="180" x2="600" y2="215" stroke="#355070" stroke-width="2"/>
  <line x1="155" y1="215" x2="1045" y2="215" stroke="#355070" stroke-width="2"/>
  <line x1="155" y1="215" x2="155" y2="248" stroke="#355070" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="215" x2="450" y2="248" stroke="#355070" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="750" y1="215" x2="750" y2="248" stroke="#355070" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1045" y1="215" x2="1045" y2="248" stroke="#355070" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="30" y="252" width="250" height="170" rx="8" fill="#edf4ff" stroke="#457b9d" stroke-width="2"/>
  <text x="155" y="288" text-anchor="middle" class="label">Unsigned integer</text>
  <text x="155" y="330" text-anchor="middle" class="mono" font-size="21">4,294,967,291</text>
  <text x="155" y="366" text-anchor="middle" class="body">All 32 positions contribute</text>
  <text x="155" y="390" text-anchor="middle" class="body">non-negative powers of two.</text>

  <rect x="325" y="252" width="250" height="170" rx="8" fill="#fff2e8" stroke="#e76f51" stroke-width="2"/>
  <text x="450" y="288" text-anchor="middle" class="label">Two's complement</text>
  <text x="450" y="334" text-anchor="middle" class="mono">-5</text>
  <text x="450" y="366" text-anchor="middle" class="body">The top bit has weight</text>
  <text x="450" y="390" text-anchor="middle" class="body">-2^31, not +2^31.</text>

  <rect x="625" y="252" width="250" height="170" rx="8" fill="#fff8db" stroke="#d4a017" stroke-width="2"/>
  <text x="750" y="288" text-anchor="middle" class="label">IEEE 754 binary32</text>
  <text x="750" y="334" text-anchor="middle" class="mono">NaN</text>
  <text x="750" y="366" text-anchor="middle" class="body">Exponent is all ones and</text>
  <text x="750" y="390" text-anchor="middle" class="body">the fraction is nonzero.</text>

  <rect x="920" y="252" width="250" height="170" rx="8" fill="#f1edf8" stroke="#6d597a" stroke-width="2"/>
  <text x="1045" y="288" text-anchor="middle" class="label">Four raw bytes</text>
  <text x="1045" y="334" text-anchor="middle" class="mono">FF FF FF FB</text>
  <text x="1045" y="366" text-anchor="middle" class="body">Meaning may instead come</text>
  <text x="1045" y="390" text-anchor="middle" class="body">from text, pixels, or an ISA.</text>

  <text x="600" y="465" text-anchor="middle" class="label">The contract selects the interpretation; the stored bits do not change.</text>
</svg>
