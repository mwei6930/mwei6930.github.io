<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="760" viewBox="0 0 1540 760" role="img" aria-labelledby="title desc">
  <title id="title">Memory-mapped I/O reuses load and store instructions for device registers</title>
  <desc id="desc">The physical address decoder routes ordinary memory addresses to RAM and reserved ranges to device control, status, data, and doorbell registers. Programmed I/O transfers each data unit through the CPU, unlike a later DMA transfer.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker><style>.body{font-family:"Segoe UI",Arial,sans-serif;fill:#111827}.small{font-family:"Segoe UI",Arial,sans-serif;fill:#4b5563;font-size:15px}.mono{font-family:Consolas,monospace;fill:#111827;font-size:15px}.line{stroke:#374151;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1540" height="760" fill="#ffffff"/>
  <text x="770" y="42" text-anchor="middle" class="body" font-size="28" font-weight="700">MMIO is an address-space choice; programmed I/O is a CPU-work choice</text>
  <text x="770" y="72" text-anchor="middle" class="small">The terms are related but not interchangeable: MMIO can configure DMA, and programmed I/O can use either MMIO or port instructions.</text>
  <rect x="55" y="125" width="300" height="480" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="205" y="165" text-anchor="middle" class="body" font-size="22" font-weight="700">CPU and driver</text>
  <rect x="100" y="220" width="210" height="66" rx="5" fill="#ffffff" stroke="#2563eb"/><text x="205" y="247" text-anchor="middle" class="mono">store control</text><text x="205" y="272" text-anchor="middle" class="small">start operation</text>
  <rect x="100" y="320" width="210" height="66" rx="5" fill="#ffffff" stroke="#2563eb"/><text x="205" y="347" text-anchor="middle" class="mono">load status</text><text x="205" y="372" text-anchor="middle" class="small">test ready/error bits</text>
  <rect x="100" y="420" width="210" height="100" rx="5" fill="#fff7ed" stroke="#ea580c"/><text x="205" y="450" text-anchor="middle" class="mono">load/store data</text><text x="205" y="478" text-anchor="middle" class="small">CPU moves every word</text><text x="205" y="503" text-anchor="middle" class="small">in programmed I/O</text>
  <rect x="450" y="170" width="270" height="390" rx="8" fill="#f9fafb" stroke="#374151" stroke-width="2"/>
  <text x="585" y="210" text-anchor="middle" class="body" font-size="21" font-weight="700">Physical address decoder</text>
  <rect x="495" y="270" width="180" height="62" rx="5" fill="#ffffff" stroke="#6b7280"/><text x="585" y="308" text-anchor="middle" class="mono">0x0000... RAM</text>
  <rect x="495" y="365" width="180" height="62" rx="5" fill="#f5f3ff" stroke="#7c3aed"/><text x="585" y="403" text-anchor="middle" class="mono">0xF000... MMIO</text>
  <rect x="495" y="460" width="180" height="62" rx="5" fill="#fef3c7" stroke="#d97706"/><text x="585" y="498" text-anchor="middle" class="mono">other mappings</text>
  <path d="M355 350 H450" class="line"/>
  <rect x="815" y="105" width="670" height="535" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="1150" y="145" text-anchor="middle" class="body" font-size="22" font-weight="700">Device MMIO register window</text>
  <g class="mono"><rect x="875" y="200" width="550" height="64" fill="#dbeafe" stroke="#2563eb"/><text x="905" y="239">+0x00 CONTROL</text><text x="1190" y="239" class="small">enable, reset, command bits</text><rect x="875" y="280" width="550" height="64" fill="#dcfce7" stroke="#16a34a"/><text x="905" y="319">+0x04 STATUS</text><text x="1190" y="319" class="small">ready, busy, error, completion</text><rect x="875" y="360" width="550" height="64" fill="#fff7ed" stroke="#ea580c"/><text x="905" y="399">+0x08 DATA</text><text x="1190" y="399" class="small">small programmed transfers</text><rect x="875" y="440" width="550" height="64" fill="#fef3c7" stroke="#d97706"/><text x="905" y="479">+0x0C DOORBELL</text><text x="1190" y="479" class="small">notify queued work is ready</text></g>
  <text x="1150" y="550" text-anchor="middle" class="small">Device accesses may be volatile, ordered differently from RAM, and side-effecting.</text><text x="1150" y="580" text-anchor="middle" class="small">Drivers use architecture-specific accessors and barriers rather than ordinary cached pointers.</text>
  <path d="M720 396 H815" class="line"/>
  <rect x="260" y="675" width="1020" height="55" rx="6" fill="#fee2e2" stroke="#dc2626"/><text x="770" y="709" text-anchor="middle" class="body" font-size="17" font-weight="700">A status read can acknowledge an event and a posted control write may not reach the device immediately: MMIO has side effects and ordering rules.</text>
</svg>
