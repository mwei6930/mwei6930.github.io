<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Shift-and-add multiplication of thirteen by eleven</title>
  <desc id="desc">Each one bit of multiplier 1011 selects a shifted copy of multiplicand 1101; the selected partial products sum to 143.</desc>
  <defs>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #202a35; }
      .head { font: 700 18px Arial, sans-serif; fill: #ffffff; }
      .label { font: 700 18px Arial, sans-serif; fill: #202a35; }
      .body { font: 16px Arial, sans-serif; fill: #475569; }
      .mono { font: 700 23px Consolas, monospace; fill: #102a43; letter-spacing: 1px; }
    </style>
  </defs>
  <rect width="1200" height="620" fill="#ffffff"/>
  <text x="600" y="42" text-anchor="middle" class="title">Shift and add: 13 x 11 = 143</text>
  <rect x="80" y="70" width="1040" height="64" rx="8" fill="#e8f3f1" stroke="#2a9d8f" stroke-width="2"/>
  <text x="330" y="110" text-anchor="middle" class="mono">multiplicand 1101 (13)</text>
  <text x="870" y="110" text-anchor="middle" class="mono">multiplier 1011 (11)</text>

  <rect x="80" y="164" width="1040" height="48" fill="#355070"/>
  <text x="145" y="195" text-anchor="middle" class="head">bit i</text>
  <text x="300" y="195" text-anchor="middle" class="head">multiplier bit</text>
  <text x="585" y="195" text-anchor="middle" class="head">selected partial product</text>
  <text x="930" y="195" text-anchor="middle" class="head">reason</text>

  <g>
    <rect x="80" y="212" width="1040" height="70" fill="#f8fafc" stroke="#d8e0e8"/>
    <text x="145" y="254" text-anchor="middle" class="label">0</text><text x="300" y="254" text-anchor="middle" class="mono">1</text>
    <text x="585" y="254" text-anchor="middle" class="mono">0000 1101</text><text x="930" y="254" text-anchor="middle" class="body">add 1101 &lt;&lt; 0</text>
    <rect x="80" y="282" width="1040" height="70" fill="#edf4ff" stroke="#d8e0e8"/>
    <text x="145" y="324" text-anchor="middle" class="label">1</text><text x="300" y="324" text-anchor="middle" class="mono">1</text>
    <text x="585" y="324" text-anchor="middle" class="mono">0001 1010</text><text x="930" y="324" text-anchor="middle" class="body">add 1101 &lt;&lt; 1</text>
    <rect x="80" y="352" width="1040" height="70" fill="#f8fafc" stroke="#d8e0e8"/>
    <text x="145" y="394" text-anchor="middle" class="label">2</text><text x="300" y="394" text-anchor="middle" class="mono">0</text>
    <text x="585" y="394" text-anchor="middle" class="mono" fill="#64748b">0000 0000</text><text x="930" y="394" text-anchor="middle" class="body">skip: this bit contributes zero</text>
    <rect x="80" y="422" width="1040" height="70" fill="#fff2e8" stroke="#d8e0e8"/>
    <text x="145" y="464" text-anchor="middle" class="label">3</text><text x="300" y="464" text-anchor="middle" class="mono">1</text>
    <text x="585" y="464" text-anchor="middle" class="mono">0110 1000</text><text x="930" y="464" text-anchor="middle" class="body">add 1101 &lt;&lt; 3</text>
  </g>

  <line x1="430" y1="515" x2="740" y2="515" stroke="#202a35" stroke-width="2"/>
  <text x="585" y="552" text-anchor="middle" class="mono">1000 1111 (143)</text>
  <text x="600" y="590" text-anchor="middle" class="body">An n-bit by n-bit product may require 2n bits even though each input has only n bits.</text>
</svg>
