<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="-112 -112 224 224">
 <title>twos vs ones complement circle</title>
 <desc>Cyclic depiction of unsigned (white ring), ones-complement (orange), twos-complement (teal) values of 4-bit integers (black) and the effect of adding 4 to an arbitrary value by CMG Lee.</desc>
 <style type="text/css">
svg { font-family:'Liberation Sans',Helvetica,Arial,sans-serif; font-size:15px; text-anchor:middle; }
.bit { fill:#fff; font-size:10px; }
.add { font-weight:bold; }
 </style>
 <defs>
  <path id="radius" stroke="#999" opacity="0.5" d="M 0,-110 V -35" transform="rotate(-11.25)"/>
 </defs>
 <circle fill="#fff" r="99999"/>
 <circle fill="#000" r="110"/>
 <circle fill="#fff" r="95"/>
 <circle fill="#f90" r="75"/>
 <circle fill="#0cc" r="55"/>
 <circle fill="#ffc" r="35"/>
 <g transform="rotate( 11.25)">
  <g transform="rotate(  0.0)"            ><use xlink:href="#radius"/><text class="bit" y="-99">0000</text><text y="-80" >0</text><text y="-60" >0</text><text y="-40" >0</text></g>
  <g transform="rotate( 22.5)" class="add"><use xlink:href="#radius"/><text class="bit" y="-99">0001</text><text y="-80" >1</text><text y="-60" >1</text><text y="-40" >1</text></g>
  <g transform="rotate( 45.0)"            ><use xlink:href="#radius"/><text class="bit" y="-99">0010</text><text y="-80" >2</text><text y="-60" >2</text><text y="-40" >2</text></g>
  <g transform="rotate( 67.5)"            ><use xlink:href="#radius"/><text class="bit" y="-99">0011</text><text y="-80" >3</text><text y="-60" >3</text><text y="-40" >3</text></g>
  <g transform="rotate( 90.0)"            ><use xlink:href="#radius"/><text class="bit" y="-99">0100</text><text y="-80" >4</text><text y="-60" >4</text><text y="-40" >4</text></g>
  <g transform="rotate(112.5)"            ><use xlink:href="#radius"/><text class="bit" y="-99">0101</text><text y="-80" >5</text><text y="-60" >5</text><text y="-40" >5</text></g>
  <g transform="rotate(135.0)"            ><use xlink:href="#radius"/><text class="bit" y="-99">0110</text><text y="-80" >6</text><text y="-60" >6</text><text y="-40" >6</text></g>
  <g transform="rotate(157.5)"            ><use xlink:href="#radius"/><text class="bit" y="-99">0111</text><text y="-80" >7</text><text y="-60" >7</text><text y="-40" >7</text></g>
  <g transform="rotate(180.0)"            ><use xlink:href="#radius"/><text class="bit" y="-99">1000</text><text y="-80" >8</text><text y="-60">-7</text><text y="-40">-8</text></g>
  <g transform="rotate(202.5)"            ><use xlink:href="#radius"/><text class="bit" y="-99">1001</text><text y="-80" >9</text><text y="-60">-6</text><text y="-40">-7</text></g>
  <g transform="rotate(225.0)"            ><use xlink:href="#radius"/><text class="bit" y="-99">1010</text><text y="-80">10</text><text y="-60">-5</text><text y="-40">-6</text></g>
  <g transform="rotate(247.5)"            ><use xlink:href="#radius"/><text class="bit" y="-99">1011</text><text y="-80">11</text><text y="-60">-4</text><text y="-40">-5</text></g>
  <g transform="rotate(270.0)"            ><use xlink:href="#radius"/><text class="bit" y="-99">1100</text><text y="-80">12</text><text y="-60">-3</text><text y="-40">-4</text></g>
  <g transform="rotate(292.5)" class="add"><use xlink:href="#radius"/><text class="bit" y="-99">1101</text><text y="-80">13</text><text y="-60">-2</text><text y="-40">-3</text></g>
  <g transform="rotate(315.0)"            ><use xlink:href="#radius"/><text class="bit" y="-99">1110</text><text y="-80">14</text><text y="-60">-1</text><text y="-40">-2</text></g>
  <g transform="rotate(337.5)"            ><use xlink:href="#radius"/><text class="bit" y="-99">1111</text><text y="-80">15</text><text y="-60">-0</text><text y="-40">-1</text></g>
 </g>
 <path fill="none" stroke="#c00" transform="rotate(-56.25)" d="M 0,-25 A 25,25 0 0 1 25,0 m -4,-4 l 4,4 l 3,-5"/>
 <text x="-2" y="-5" fill="#c00" class="add">+4<tspan x="0" dy="16">(0100)</tspan></text>
</svg>
