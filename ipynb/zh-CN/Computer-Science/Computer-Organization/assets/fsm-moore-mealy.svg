<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">Moore and Mealy finite-state machines</title><desc id="desc">A Moore output depends only on registered state, while a Mealy output also has a direct combinational path from input.</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#374151"/></marker><style>.h{font:700 25px Arial,sans-serif;fill:#111827}.t{font:18px Arial,sans-serif;fill:#374151}.box{stroke:#1f2937;stroke-width:3}.w{fill:none;stroke:#374151;stroke-width:3;marker-end:url(#a)}.direct{fill:none;stroke:#be123c;stroke-width:4;marker-end:url(#a)}</style></defs>
  <rect x="1.5" y="1.5" width="1117" height="517" rx="8" fill="#fff" stroke="#d1d5db" stroke-width="3"/><text x="280" y="48" text-anchor="middle" class="h">Moore machine</text><text x="840" y="48" text-anchor="middle" class="h">Mealy machine</text><line x1="560" y1="25" x2="560" y2="490" stroke="#d1d5db" stroke-width="3"/>
  <rect x="165" y="125" width="220" height="95" rx="7" fill="#dbeafe" class="box"/><text x="275" y="165" text-anchor="middle" class="h">Next-state logic</text><text x="275" y="195" text-anchor="middle" class="t">delta(S, X)</text><rect x="165" y="300" width="220" height="80" rx="7" fill="#fef3c7" class="box"/><text x="275" y="348" text-anchor="middle" class="h">State register</text><rect x="405" y="300" width="125" height="80" rx="7" fill="#dcfce7" class="box"/><text x="468" y="333" text-anchor="middle" class="h">Output</text><text x="468" y="360" text-anchor="middle" class="t">lambda(S)</text><path d="M60 170H165" class="w"/><text x="70" y="151" class="t">X</text><path d="M275 220V300" class="w"/><path d="M385 340H405" class="w"/><path d="M275 380V440H115V190H165" class="w"/><text x="115" y="465" class="t">Output changes after state changes</text>
  <rect x="720" y="125" width="225" height="95" rx="7" fill="#dbeafe" class="box"/><text x="833" y="165" text-anchor="middle" class="h">Next-state logic</text><text x="833" y="195" text-anchor="middle" class="t">delta(S, X)</text><rect x="720" y="300" width="225" height="80" rx="7" fill="#fef3c7" class="box"/><text x="833" y="348" text-anchor="middle" class="h">State register</text><rect x="965" y="300" width="125" height="80" rx="7" fill="#dcfce7" class="box"/><text x="1028" y="333" text-anchor="middle" class="h">Output</text><text x="1028" y="360" text-anchor="middle" class="t">lambda(S,X)</text><path d="M610 170H720" class="w"/><text x="620" y="151" class="t">X</text><path d="M833 220V300" class="w"/><path d="M945 340H965" class="w"/><path d="M833 380V440H670V190H720" class="w"/><path d="M665 170V260H1028V300" class="direct"/><text x="880" y="250" text-anchor="middle" class="t" fill="#be123c">direct input-to-output path</text><text x="665" y="465" class="t">Faster reaction, but input glitches can reach Y</text>
</svg>
