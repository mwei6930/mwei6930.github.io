<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Pedagogical single-cycle RV32I datapath</title>
  <desc id="desc">A complete single-cycle datapath for a small RV32I subset showing the PC, instruction memory, register file, immediate generator, ALU, comparator, data memory, adders, multiplexers, write-back path, and control signals.</desc>
  <defs>
    <marker id="dataArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker>
    <marker id="ctrlArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#c2410c"/></marker>
    <style>
      .label{font-family:"Segoe UI",Arial,sans-serif;fill:#111827}.small{font-family:"Segoe UI",Arial,sans-serif;fill:#4b5563;font-size:15px}.mono{font-family:Consolas,monospace;fill:#374151;font-size:14px}.data{fill:none;stroke:#374151;stroke-width:3;marker-end:url(#dataArrow)}.control{fill:none;stroke:#c2410c;stroke-width:2.4;stroke-dasharray:8 6;marker-end:url(#ctrlArrow)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#ffffff"/>
  <text x="800" y="40" text-anchor="middle" class="label" font-size="27" font-weight="700">Single-cycle datapath for a teaching subset of RV32I</text>
  <text x="800" y="66" text-anchor="middle" class="small">Black lines carry values; dashed orange lines carry control decisions.</text>

  <rect x="45" y="385" width="105" height="94" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="97" y="420" text-anchor="middle" class="label" font-size="20" font-weight="700">PC</text>
  <text x="97" y="447" text-anchor="middle" class="mono">32-bit state</text>
  <text x="97" y="468" text-anchor="middle" class="mono">PCWrite</text>

  <rect x="220" y="335" width="165" height="194" rx="6" fill="#fefce8" stroke="#a16207" stroke-width="2"/>
  <text x="302" y="380" text-anchor="middle" class="label" font-size="20" font-weight="700">Instruction</text>
  <text x="302" y="405" text-anchor="middle" class="label" font-size="20" font-weight="700">memory</text>
  <text x="302" y="445" text-anchor="middle" class="mono">address = PC</text>
  <text x="302" y="470" text-anchor="middle" class="mono">read 32-bit instr</text>

  <rect x="465" y="295" width="205" height="250" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="567" y="335" text-anchor="middle" class="label" font-size="21" font-weight="700">Register file</text>
  <text x="490" y="375" class="mono">RA1 = rs1</text>
  <text x="490" y="405" class="mono">RA2 = rs2</text>
  <text x="490" y="435" class="mono">WA  = rd</text>
  <text x="490" y="465" class="mono">WD  = Result</text>
  <text x="490" y="495" class="mono">WE  = RegWrite</text>
  <text x="567" y="525" text-anchor="middle" class="small">two reads, one edge write</text>

  <rect x="470" y="655" width="195" height="100" rx="6" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
  <text x="567" y="695" text-anchor="middle" class="label" font-size="20" font-weight="700">Immediate generator</text>
  <text x="567" y="725" text-anchor="middle" class="mono">ImmSrc selects I/S/B/J</text>

  <path d="M755 405 l55 0 l22 28 l-22 28 l-55 0 z" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <text x="790" y="425" text-anchor="middle" class="label" font-size="15" font-weight="700">ALU B</text>
  <text x="790" y="447" text-anchor="middle" class="mono">MUX</text>

  <rect x="875" y="330" width="155" height="145" rx="6" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
  <text x="952" y="382" text-anchor="middle" class="label" font-size="24" font-weight="700">ALU</text>
  <text x="952" y="415" text-anchor="middle" class="mono">ALUControl</text>
  <text x="952" y="444" text-anchor="middle" class="mono">ALUResult</text>

  <rect x="880" y="525" width="145" height="95" rx="6" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
  <text x="952" y="562" text-anchor="middle" class="label" font-size="19" font-weight="700">Branch compare</text>
  <text x="952" y="589" text-anchor="middle" class="mono">BrEq / BrLt</text>

  <rect x="1110" y="315" width="180" height="230" rx="6" fill="#fefce8" stroke="#a16207" stroke-width="2"/>
  <text x="1200" y="365" text-anchor="middle" class="label" font-size="21" font-weight="700">Data memory</text>
  <text x="1135" y="410" class="mono">A  = ALUResult</text>
  <text x="1135" y="443" class="mono">WD = ReadData2</text>
  <text x="1135" y="476" class="mono">WE = MemWrite</text>
  <text x="1200" y="515" text-anchor="middle" class="small">read data or commit store</text>

  <path d="M1350 380 l65 0 l25 45 l-25 45 l-65 0 z" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <text x="1385" y="414" text-anchor="middle" class="label" font-size="16" font-weight="700">Result</text>
  <text x="1385" y="439" text-anchor="middle" class="mono">MUX</text>
  <text x="1385" y="460" text-anchor="middle" class="mono">ALU/Mem/PC+4</text>

  <rect x="290" y="120" width="140" height="75" rx="6" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
  <text x="360" y="151" text-anchor="middle" class="label" font-size="18" font-weight="700">PC + 4</text>
  <text x="360" y="176" text-anchor="middle" class="mono">adder</text>
  <rect x="665" y="120" width="180" height="75" rx="6" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
  <text x="755" y="151" text-anchor="middle" class="label" font-size="18" font-weight="700">PC + immediate</text>
  <text x="755" y="176" text-anchor="middle" class="mono">target adder</text>
  <path d="M955 112 l78 0 l27 45 l-27 45 l-78 0 z" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <text x="1000" y="145" text-anchor="middle" class="label" font-size="17" font-weight="700">Next PC</text>
  <text x="1000" y="170" text-anchor="middle" class="mono">MUX</text>

  <rect x="555" y="805" width="440" height="64" rx="6" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="775" y="832" text-anchor="middle" class="label" font-size="19" font-weight="700">Control unit</text>
  <text x="775" y="856" text-anchor="middle" class="mono">opcode + funct &#8594; selects, enables, ALUControl, branch/jump decision</text>

  <!-- Value paths -->
  <path d="M150 432 H220" class="data"/>
  <path d="M150 405 V157 H290" class="data"/>
  <path d="M430 157 H665" class="data"/>
  <path d="M845 157 H953" class="data"/>
  <path d="M1060 157 H1080 V260 H70 V385" class="data"/>
  <path d="M385 410 H465" class="data"/>
  <text x="415" y="397" class="small">rs1/rs2/rd</text>
  <path d="M385 485 H430 V705 H470" class="data"/>
  <text x="402" y="632" class="small">instruction bits</text>
  <path d="M670 370 H875" class="data"/>
  <text x="730" y="356" class="small">ReadData1</text>
  <path d="M670 430 H755" class="data"/>
  <path d="M665 705 H720 V455 H755" class="data"/>
  <path d="M832 433 H875" class="data"/>
  <path d="M1030 405 H1110" class="data"/>
  <path d="M670 485 H1075 V455 H1110" class="data"/>
  <text x="900" y="500" class="small">store data</text>
  <path d="M1290 410 H1350" class="data"/>
  <path d="M1030 430 H1320 V395 H1350" class="data"/>
  <path d="M430 157 H450 V270 H1325 V455 H1350" class="data"/>
  <text x="1260" y="257" class="small">PC + 4 for JAL link</text>
  <path d="M1440 425 H1490 V590 H440 V480 H465" class="data"/>
  <text x="1160" y="580" class="small">write-back result</text>
  <path d="M670 525 H840 V552 H880" class="data"/>
  <path d="M670 470 H820 V595 H880" class="data"/>
  <path d="M665 705 H690 V195" class="data"/>

  <!-- Control paths -->
  <path d="M385 520 V780 H650 V805" class="control"/>
  <path d="M695 805 V760 H790 V461" class="control"/>
  <text x="798" y="770" class="small" fill="#9a3412">ALUSrc</text>
  <path d="M760 805 V620 H952" class="control"/>
  <path d="M825 805 V475 H952" class="control"/>
  <path d="M880 805 V545 H1200" class="control"/>
  <text x="1110" y="575" class="small" fill="#9a3412">MemWrite</text>
  <path d="M930 805 V500 H1385" class="control"/>
  <text x="1300" y="530" class="small" fill="#9a3412">ResultSrc</text>
  <path d="M620 805 V590 H620 V545" class="control"/>
  <text x="632" y="600" class="small" fill="#9a3412">RegWrite</text>
  <path d="M570 805 V755" class="control"/>
  <text x="475" y="790" class="small" fill="#9a3412">ImmSrc</text>
  <path d="M995 805 V235 H1000 V202" class="control"/>
  <text x="1012" y="275" class="small" fill="#9a3412">PCSrc</text>

  <rect x="55" y="780" width="380" height="86" rx="6" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="75" y="810" class="label" font-size="16" font-weight="700">Pedagogical assumptions</text>
  <text x="75" y="836" class="small">Separate combinational instruction/data memory ports;</text>
  <text x="75" y="858" class="small">one long cycle; subset includes ALU, load/store, branch, JAL.</text>
</svg>
