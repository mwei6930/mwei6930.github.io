<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">ROM, SRAM, and DRAM building blocks</title><desc id="desc">ROM uses a programmed connection matrix, SRAM uses a bistable cell, and DRAM uses one access transistor and one capacitor.</desc>
  <defs><style>.h{font:700 25px Arial,sans-serif;fill:#111827}.t{font:18px Arial,sans-serif;fill:#374151}.b{stroke:#1f2937;stroke-width:3}.w{fill:none;stroke:#374151;stroke-width:3}.dash{stroke:#9ca3af;stroke-width:2;stroke-dasharray:7 7}</style></defs>
  <rect x="1.5" y="1.5" width="1117" height="557" rx="8" fill="#fff" stroke="#d1d5db" stroke-width="3"/><text x="190" y="48" text-anchor="middle" class="h">ROM</text><text x="560" y="48" text-anchor="middle" class="h">SRAM</text><text x="930" y="48" text-anchor="middle" class="h">DRAM</text><line x1="373" y1="25" x2="373" y2="530" class="dash"/><line x1="747" y1="25" x2="747" y2="530" class="dash"/>
  <rect x="40" y="95" width="110" height="300" rx="7" fill="#dbeafe" class="b"/><text x="95" y="235" text-anchor="middle" class="h" transform="rotate(-90 95 235)">Row decoder</text><g class="w"><path d="M150 140H330"/><path d="M150 200H330"/><path d="M150 260H330"/><path d="M150 320H330"/><path d="M190 105V390"/><path d="M245 105V390"/><path d="M300 105V390"/></g><g fill="#be123c"><circle cx="190" cy="140" r="8"/><circle cx="300" cy="140" r="8"/><circle cx="245" cy="200" r="8"/><circle cx="190" cy="260" r="8"/><circle cx="245" cy="320" r="8"/><circle cx="300" cy="320" r="8"/></g><text x="190" y="435" text-anchor="middle" class="t">programmed connections</text><text x="190" y="465" text-anchor="middle" class="t">encode fixed words</text>
  <rect x="440" y="105" width="240" height="285" rx="7" fill="#ecfdf5" class="b"/><path d="M485 185C520 125 600 125 635 185C600 245 520 245 485 185Z" fill="#fff" stroke="#0f766e" stroke-width="4"/><text x="560" y="178" text-anchor="middle" class="h">bistable</text><text x="560" y="208" text-anchor="middle" class="t">feedback</text><path d="M405 145H440" class="w"/><path d="M405 350H440" class="w"/><text x="390" y="135" text-anchor="end" class="t">BL</text><text x="390" y="370" text-anchor="end" class="t">BL&#772;</text><path d="M475 90V105" class="w"/><path d="M645 90V105" class="w"/><text x="560" y="77" text-anchor="middle" class="t">word line controls two access transistors</text><text x="560" y="435" text-anchor="middle" class="t">state persists while powered</text><text x="560" y="465" text-anchor="middle" class="t">fast, larger cell, no refresh</text>
  <path d="M820 170H900" class="w"/><text x="805" y="158" text-anchor="end" class="t">bit line</text><rect x="900" y="135" width="70" height="70" rx="7" fill="#fef3c7" class="b"/><text x="935" y="180" text-anchor="middle" class="h">T</text><path d="M935 205V275" class="w"/><path d="M885 120H985" class="w"/><text x="935" y="105" text-anchor="middle" class="t">word line</text><line x1="900" y1="275" x2="970" y2="275" stroke="#1f2937" stroke-width="4"/><line x1="910" y1="293" x2="960" y2="293" stroke="#1f2937" stroke-width="4"/><text x="985" y="290" class="h">C</text><text x="930" y="345" text-anchor="middle" class="t">charge represents one bit</text><text x="930" y="435" text-anchor="middle" class="t">dense, but charge leaks</text><text x="930" y="465" text-anchor="middle" class="t">read restores; refresh repeats</text><text x="560" y="525" text-anchor="middle" class="t">All three scale into addressed arrays with row selection, bit lines, and sensing</text>
</svg>
