<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Magnitude comparison and staged barrel shifting</title>
  <desc id="desc">The left panel compares unsigned words from the most-significant bit. The right panel implements an eight-bit shift with independently selectable shifts by one, two, and four positions.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
    <style>
      .h { font: 700 24px Arial, sans-serif; fill: #0f172a; text-anchor: middle; }
      .t { font: 18px Arial, sans-serif; fill: #334155; text-anchor: middle; }
      .bit { font: 700 22px Consolas, monospace; text-anchor: middle; }
      .wire { stroke: #475569; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="520" fill="#ffffff"/>
  <rect x="20" y="25" width="555" height="470" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <rect x="600" y="25" width="580" height="470" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>

  <text x="298" y="66" class="h">Unsigned comparator: inspect from the MSB</text>
  <text x="98" y="119" class="t">A</text><text x="98" y="173" class="t">B</text>
  <g class="bit">
    <rect x="145" y="88" width="70" height="50" fill="#dbeafe" stroke="#2563eb"/><text x="180" y="121" fill="#0f172a">1</text>
    <rect x="220" y="88" width="70" height="50" fill="#dbeafe" stroke="#2563eb"/><text x="255" y="121" fill="#0f172a">0</text>
    <rect x="295" y="88" width="70" height="50" fill="#fee2e2" stroke="#b91c1c"/><text x="330" y="121" fill="#0f172a">1</text>
    <rect x="370" y="88" width="70" height="50" fill="#dbeafe" stroke="#2563eb"/><text x="405" y="121" fill="#0f172a">0</text>
    <rect x="145" y="142" width="70" height="50" fill="#ccfbf1" stroke="#0f766e"/><text x="180" y="175" fill="#0f172a">1</text>
    <rect x="220" y="142" width="70" height="50" fill="#ccfbf1" stroke="#0f766e"/><text x="255" y="175" fill="#0f172a">0</text>
    <rect x="295" y="142" width="70" height="50" fill="#fee2e2" stroke="#b91c1c"/><text x="330" y="175" fill="#0f172a">0</text>
    <rect x="370" y="142" width="70" height="50" fill="#ccfbf1" stroke="#0f766e"/><text x="405" y="175" fill="#0f172a">1</text>
  </g>
  <text x="180" y="218" class="t">bit 3</text><text x="255" y="218" class="t">bit 2</text><text x="330" y="218" class="t">bit 1</text><text x="405" y="218" class="t">bit 0</text>
  <path d="M330 229 V282" stroke="#b91c1c" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="115" y="290" width="365" height="92" rx="6" fill="#fff7ed" stroke="#c2410c" stroke-width="2.5"/>
  <text x="298" y="327" class="h">First differing bit: A1 = 1, B1 = 0</text>
  <text x="298" y="359" class="t">Higher bits are equal, so A &gt; B</text>
  <text x="298" y="430" class="t">Equality uses XNOR per bit, followed by AND.</text>
  <text x="298" y="458" class="t">Signed comparison must treat the sign bit separately.</text>

  <text x="890" y="66" class="h">Barrel shifter: three selectable stages</text>
  <text x="675" y="117" class="t">input</text><text x="675" y="139" class="bit" fill="#0f172a">10110110</text>
  <path class="wire" d="M730 128 H775"/>
  <rect x="778" y="88" width="105" height="80" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="830" y="119" class="h">shift 1</text><text x="830" y="148" class="t">if s0=1</text>
  <path class="wire" d="M883 128 H928"/>
  <rect x="931" y="88" width="105" height="80" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="2.5"/>
  <text x="983" y="119" class="h">shift 2</text><text x="983" y="148" class="t">if s1=1</text>
  <path class="wire" d="M1036 128 H1081"/>
  <rect x="1084" y="88" width="75" height="80" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/>
  <text x="1121" y="119" class="h">4</text><text x="1121" y="148" class="t">s2</text>

  <text x="890" y="226" class="t">For shift amount 5 = 1012, stages 1 and 4 are active.</text>
  <g>
    <rect x="660" y="258" width="460" height="56" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="890" y="293" class="bit" fill="#0f172a">10110110  --shift 1--&gt;  01011011</text>
    <rect x="660" y="328" width="460" height="56" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="890" y="363" class="bit" fill="#0f172a">01011011  --shift 4--&gt;  00000101</text>
  </g>
  <text x="890" y="430" class="t">Each stage is a bank of multiplexers.</text>
  <text x="890" y="458" class="t">log2(n) stages choose any shift from 0 to n-1.</text>
</svg>
