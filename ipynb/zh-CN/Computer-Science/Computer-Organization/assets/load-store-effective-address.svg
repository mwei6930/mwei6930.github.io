<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 500" role="img" aria-labelledby="title desc">
  <title id="title">RISC-V load and store effective address</title><desc id="desc">A base register and sign-extended twelve-bit immediate enter an adder. Loads copy memory data to a destination register; stores copy a source register to memory.</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#374151"/></marker><style>.h{font:700 24px Arial,sans-serif;fill:#111827}.t{font:18px Arial,sans-serif;fill:#374151}.b{stroke:#1f2937;stroke-width:3}.w{fill:none;stroke:#374151;stroke-width:3;marker-end:url(#a)}.load{fill:none;stroke:#0f766e;stroke-width:4;marker-end:url(#a)}.store{fill:none;stroke:#be123c;stroke-width:4;marker-end:url(#a)}</style></defs>
  <rect x="1.5" y="1.5" width="1117" height="497" rx="8" fill="#fff" stroke="#d1d5db" stroke-width="3"/><text x="560" y="42" text-anchor="middle" class="h">Effective address = base register + sign-extended offset</text>
  <rect x="60" y="95" width="235" height="85" rx="8" fill="#dbeafe" class="b"/><text x="178" y="132" text-anchor="middle" class="h">x[rs1]</text><text x="178" y="160" text-anchor="middle" class="t">base address</text><rect x="60" y="245" width="235" height="85" rx="8" fill="#fef3c7" class="b"/><text x="178" y="282" text-anchor="middle" class="h">sext(imm12)</text><text x="178" y="310" text-anchor="middle" class="t">signed byte offset</text>
  <circle cx="440" cy="210" r="75" fill="#ecfdf5" stroke="#1f2937" stroke-width="3"/><text x="440" y="205" text-anchor="middle" class="h">ADD</text><text x="440" y="235" text-anchor="middle" class="t">XLEN bits</text><path d="M295 137H365" class="w"/><path d="M295 287H350L382 255" class="w"/>
  <rect x="590" y="105" width="240" height="220" rx="8" fill="#f8fafc" class="b"/><text x="710" y="145" text-anchor="middle" class="h">Memory</text><path d="M515 210H590" class="w"/><text x="550" y="193" text-anchor="middle" class="t">EA</text>
  <path d="M830 170H1050" class="load"/><text x="940" y="150" text-anchor="middle" class="t" fill="#0f766e">load: memory to rd</text><path d="M1050 270H830" class="store"/><text x="940" y="310" text-anchor="middle" class="t" fill="#be123c">store: rs2 to memory</text>
  <rect x="175" y="385" width="770" height="55" rx="6" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/><text x="560" y="420" text-anchor="middle" class="t">The instruction names a byte address; access width decides how many adjacent bytes move</text>
</svg>
