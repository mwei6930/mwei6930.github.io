<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="565" viewBox="0 0 1160 565" role="img" aria-labelledby="title desc">
  <title id="title">Evidence-driven bottleneck localization</title><desc id="desc">A top-down process moves from application symptoms through utilization and hardware counters to a processor, memory, or input-output hypothesis, then validates a single change.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3 0 6Z" fill="#334155"/></marker></defs>
  <rect width="1160" height="565" rx="18" fill="#f8fafc"/>
  <text x="580" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#172033">Follow waiting time, then test the hypothesis</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="55" y="90" width="200" height="82" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="155" y="122" font-size="18" font-weight="700" fill="#1e3a8a">Symptom</text><text x="155" y="149" font-size="14" fill="#334155">latency, throughput, tails</text>
    <rect x="345" y="90" width="200" height="82" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="445" y="122" font-size="18" font-weight="700" fill="#14532d">Coarse signals</text><text x="445" y="149" font-size="14" fill="#334155">CPU, memory, disk, network</text>
    <rect x="635" y="90" width="200" height="82" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="735" y="122" font-size="18" font-weight="700" fill="#78350f">Focused evidence</text><text x="735" y="149" font-size="14" fill="#334155">profiles, counters, queues</text>
    <rect x="925" y="90" width="180" height="82" rx="10" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/><text x="1015" y="122" font-size="18" font-weight="700" fill="#581c87">Hypothesis</text><text x="1015" y="149" font-size="14" fill="#334155">one limiting resource</text>
  </g>
  <g stroke="#334155" stroke-width="3" marker-end="url(#a)"><line x1="255" y1="131" x2="335" y2="131"/><line x1="545" y1="131" x2="625" y2="131"/><line x1="835" y1="131" x2="915" y2="131"/></g>
  <line x1="1015" y1="172" x2="1015" y2="223" stroke="#334155" stroke-width="3"/>
  <line x1="255" y1="223" x2="1015" y2="223" stroke="#334155" stroke-width="3"/>
  <g stroke="#334155" stroke-width="3" marker-end="url(#a)"><line x1="255" y1="223" x2="255" y2="260"/><line x1="580" y1="223" x2="580" y2="260"/><line x1="905" y1="223" x2="905" y2="260"/></g>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="105" y="270" width="300" height="145" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="255" y="305" font-size="20" font-weight="700" fill="#1e3a8a">Processor-bound</text><text x="255" y="338" font-size="15" fill="#334155">high retiring or execution pressure</text><text x="255" y="364" font-size="15" fill="#334155">branch / front-end stalls</text><text x="255" y="390" font-size="15" fill="#334155">scales with CPU resources</text>
    <rect x="430" y="270" width="300" height="145" rx="12" fill="#fff" stroke="#16a34a" stroke-width="2"/><text x="580" y="305" font-size="20" font-weight="700" fill="#14532d">Memory-bound</text><text x="580" y="338" font-size="15" fill="#334155">cache misses and long stalls</text><text x="580" y="364" font-size="15" fill="#334155">bandwidth saturation / NUMA</text><text x="580" y="390" font-size="15" fill="#334155">weak response to more compute</text>
    <rect x="755" y="270" width="300" height="145" rx="12" fill="#fff" stroke="#dc2626" stroke-width="2"/><text x="905" y="305" font-size="20" font-weight="700" fill="#7f1d1d">I/O-bound</text><text x="905" y="338" font-size="15" fill="#334155">device queues and wait time</text><text x="905" y="364" font-size="15" fill="#334155">small / synchronous requests</text><text x="905" y="390" font-size="15" fill="#334155">throughput near device ceiling</text>
  </g>
  <rect x="300" y="470" width="560" height="58" rx="10" fill="#172033"/><text x="580" y="506" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#fff">Change one lever, predict the effect, remeasure end to end</text>
  <g stroke="#334155" stroke-width="3" marker-end="url(#a)"><line x1="255" y1="415" x2="415" y2="465"/><line x1="580" y1="415" x2="580" y2="460"/><line x1="905" y1="415" x2="745" y2="465"/></g>
</svg>
