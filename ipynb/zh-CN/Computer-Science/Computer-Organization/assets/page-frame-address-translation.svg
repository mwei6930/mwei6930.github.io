<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720" role="img" aria-labelledby="title desc">
  <title id="title">Page translation preserves the page offset</title>
  <desc id="desc">A 32-bit virtual address 0x12345ABC with 4 KiB pages splits into VPN 0x12345 and offset 0xABC. A page-table entry maps the VPN to PPN 0x2BEEF, producing physical address 0x2BEE FABC without changing the offset.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker><style>.body{font-family:"Segoe UI",Arial,sans-serif;fill:#111827}.small{font-family:"Segoe UI",Arial,sans-serif;fill:#4b5563;font-size:15px}.mono{font-family:Consolas,monospace;fill:#111827;font-size:17px}.line{stroke:#374151;stroke-width:3;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1500" height="720" fill="#ffffff"/>
  <text x="750" y="43" text-anchor="middle" class="body" font-size="28" font-weight="700">VPN changes; page offset does not</text>
  <text x="750" y="73" text-anchor="middle" class="small">Running example: 32-bit virtual addresses, 4 KiB pages, and a page-table mapping from VPN 0x12345 to PPN 0x2BEEF.</text>
  <text x="150" y="135" class="body" font-size="20" font-weight="700">Virtual address 0x12345ABC</text>
  <rect x="150" y="160" width="600" height="100" rx="6" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <rect x="150" y="160" width="390" height="100" fill="#dbeafe" stroke="#2563eb"/><rect x="540" y="160" width="210" height="100" fill="#fef3c7" stroke="#d97706"/>
  <text x="345" y="198" text-anchor="middle" class="body" font-size="19" font-weight="700">VPN: 20 bits</text><text x="345" y="231" text-anchor="middle" class="mono">0x12345</text>
  <text x="645" y="198" text-anchor="middle" class="body" font-size="19" font-weight="700">offset: 12 bits</text><text x="645" y="231" text-anchor="middle" class="mono">0xABC</text>
  <rect x="860" y="135" width="490" height="150" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="1105" y="174" text-anchor="middle" class="body" font-size="21" font-weight="700">Translation entry selected by VPN</text>
  <text x="925" y="216" class="mono">VPN 0x12345</text><text x="1082" y="216" class="mono">-&gt;</text><text x="1130" y="216" class="mono">PPN 0x2BEEF</text>
  <text x="1105" y="254" text-anchor="middle" class="small">The entry also carries validity and permission bits.</text>
  <path d="M345 160 V105 H1105 V135" class="line"/><text x="725" y="99" text-anchor="middle" class="small">VPN selects a page-table entry</text>

  <text x="150" y="365" class="body" font-size="20" font-weight="700">Physical address 0x2BEEFABC</text>
  <rect x="150" y="390" width="600" height="100" rx="6" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <rect x="150" y="390" width="390" height="100" fill="#dcfce7" stroke="#16a34a"/><rect x="540" y="390" width="210" height="100" fill="#fef3c7" stroke="#d97706"/>
  <text x="345" y="428" text-anchor="middle" class="body" font-size="19" font-weight="700">PPN: physical frame number</text><text x="345" y="461" text-anchor="middle" class="mono">0x2BEEF</text>
  <text x="645" y="428" text-anchor="middle" class="body" font-size="19" font-weight="700">same offset</text><text x="645" y="461" text-anchor="middle" class="mono">0xABC</text>
  <path d="M1105 285 V440 H760" class="line"/><path d="M645 260 V380" class="line"/>
  <text x="980" y="424" text-anchor="middle" class="small">replace VPN with PPN</text><text x="700" y="337" class="small">no translation</text>

  <rect x="150" y="550" width="1200" height="120" rx="8" fill="#f9fafb" stroke="#9ca3af"/>
  <text x="750" y="585" text-anchor="middle" class="body" font-size="19" font-weight="700">Arithmetic view</text>
  <text x="750" y="620" text-anchor="middle" class="mono">VPN = VA // 4096       offset = VA mod 4096       PA = PPN x 4096 + offset</text>
  <text x="750" y="651" text-anchor="middle" class="small">Page alignment makes the low 12 bits identical in the virtual and physical addresses.</text>
</svg>
