<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 600" role="img" aria-labelledby="title desc">
  <title id="title">RISC-V integer register convention</title><desc id="desc">Registers are grouped into fixed, return address, stack pointer, temporary, argument, and saved categories, with preservation responsibilities across calls.</desc>
  <defs><style>.h{font:700 22px Arial,sans-serif;fill:#111827}.t{font:16px Arial,sans-serif;fill:#374151}.b{stroke:#1f2937;stroke-width:3}</style></defs>
  <rect x="1.5" y="1.5" width="1137" height="597" rx="8" fill="#fff" stroke="#d1d5db" stroke-width="3"/><text x="570" y="42" text-anchor="middle" class="h">RV32/RV64 integer calling-convention groups</text>
  <rect x="35" y="85" width="205" height="130" rx="8" fill="#e5e7eb" class="b"/><text x="138" y="122" text-anchor="middle" class="h">Fixed / special</text><text x="138" y="154" text-anchor="middle" class="t">zero x0</text><text x="138" y="180" text-anchor="middle" class="t">gp x3, tp x4</text>
  <rect x="260" y="85" width="205" height="130" rx="8" fill="#fee2e2" class="b"/><text x="363" y="122" text-anchor="middle" class="h">Control links</text><text x="363" y="154" text-anchor="middle" class="t">ra x1: caller-saved</text><text x="363" y="180" text-anchor="middle" class="t">sp x2: preserved</text>
  <rect x="485" y="85" width="280" height="130" rx="8" fill="#dbeafe" class="b"/><text x="625" y="122" text-anchor="middle" class="h">Arguments / return</text><text x="625" y="154" text-anchor="middle" class="t">a0-a7 = x10-x17</text><text x="625" y="180" text-anchor="middle" class="t">caller-saved; a0-a1 return</text>
  <rect x="785" y="85" width="320" height="130" rx="8" fill="#fef3c7" class="b"/><text x="945" y="122" text-anchor="middle" class="h">Temporaries</text><text x="945" y="154" text-anchor="middle" class="t">t0-t2 = x5-x7</text><text x="945" y="180" text-anchor="middle" class="t">t3-t6 = x28-x31; caller-saved</text>
  <rect x="190" y="285" width="760" height="150" rx="8" fill="#ecfdf5" class="b"/><text x="570" y="330" text-anchor="middle" class="h">Saved registers: s0-s11</text><text x="570" y="365" text-anchor="middle" class="t">x8-x9 and x18-x27</text><text x="570" y="398" text-anchor="middle" class="t">callee must restore any of these registers that it changes</text>
  <rect x="110" y="490" width="400" height="70" rx="8" fill="#fff7ed" class="b"/><text x="310" y="520" text-anchor="middle" class="h">Caller-saved = save before call if still needed</text><text x="310" y="546" text-anchor="middle" class="t">ra, a0-a7, t0-t6</text>
  <rect x="630" y="490" width="400" height="70" rx="8" fill="#eef2ff" class="b"/><text x="830" y="520" text-anchor="middle" class="h">Callee-saved = restore before return</text><text x="830" y="546" text-anchor="middle" class="t">sp, s0-s11</text>
</svg>
