<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="720" viewBox="0 0 1300 720" role="img" aria-labelledby="title desc">
  <title id="title">Roles of processor datapath components</title>
  <desc id="desc">State elements preserve the program-visible machine state, combinational blocks transform values, memories provide instructions and data, and control signals steer the paths.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker>
    <marker id="ctrl" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#c2410c"/></marker>
  </defs>
  <rect width="1300" height="720" fill="#ffffff"/>
  <text x="650" y="40" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#111827">State, transformation, storage, and steering</text>

  <rect x="45" y="75" width="1210" height="565" rx="8" fill="#fafafa" stroke="#d1d5db"/>
  <rect x="75" y="105" width="270" height="485" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="210" y="140" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#1d4ed8">State elements</text>
  <text x="210" y="165" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#4b5563">change only when enabled at an edge</text>
  <rect x="105" y="200" width="210" height="74" rx="6" fill="#ffffff" stroke="#2563eb"/>
  <text x="210" y="231" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#111827">Program Counter</text>
  <text x="210" y="255" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#4b5563">current instruction address</text>
  <rect x="105" y="305" width="210" height="92" rx="6" fill="#ffffff" stroke="#2563eb"/>
  <text x="210" y="336" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#111827">Register File</text>
  <text x="210" y="360" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#4b5563">2 read ports</text>
  <text x="210" y="382" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#4b5563">1 write port</text>
  <rect x="105" y="430" width="210" height="112" rx="6" fill="#ffffff" stroke="#2563eb"/>
  <text x="210" y="461" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#111827">Internal registers</text>
  <text x="210" y="485" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#4b5563">IR, MDR, A, B, ALUOut</text>
  <text x="210" y="510" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#4b5563">needed by a multi-cycle</text>
  <text x="210" y="530" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#4b5563">implementation</text>

  <rect x="385" y="105" width="300" height="485" rx="8" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
  <text x="535" y="140" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#0f766e">Combinational blocks</text>
  <text x="535" y="165" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#4b5563">produce values without storing them</text>
  <rect x="420" y="200" width="230" height="66" rx="6" fill="#ffffff" stroke="#0f766e"/>
  <text x="535" y="240" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#111827">ALU and comparator</text>
  <rect x="420" y="295" width="230" height="66" rx="6" fill="#ffffff" stroke="#0f766e"/>
  <text x="535" y="335" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#111827">Immediate generator</text>
  <rect x="420" y="390" width="230" height="66" rx="6" fill="#ffffff" stroke="#0f766e"/>
  <text x="535" y="430" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#111827">Adders</text>
  <rect x="420" y="485" width="230" height="66" rx="6" fill="#ffffff" stroke="#0f766e"/>
  <text x="535" y="525" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#111827">Multiplexers</text>

  <rect x="725" y="105" width="250" height="485" rx="8" fill="#fefce8" stroke="#a16207" stroke-width="2"/>
  <text x="850" y="140" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#854d0e">Memory interfaces</text>
  <text x="850" y="165" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#4b5563">abstracted as reads and writes</text>
  <rect x="755" y="220" width="190" height="105" rx="6" fill="#ffffff" stroke="#a16207"/>
  <text x="850" y="254" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#111827">Instruction memory</text>
  <text x="850" y="280" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#4b5563">address = PC</text>
  <text x="850" y="302" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#4b5563">output = instruction</text>
  <rect x="755" y="370" width="190" height="120" rx="6" fill="#ffffff" stroke="#a16207"/>
  <text x="850" y="405" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#111827">Data memory</text>
  <text x="850" y="431" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#4b5563">address = ALUResult</text>
  <text x="850" y="453" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#4b5563">read or write data</text>
  <text x="850" y="475" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#4b5563">with byte enables</text>

  <rect x="1015" y="105" width="210" height="485" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="1120" y="140" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#9a3412">Control</text>
  <text x="1120" y="165" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#4b5563">turns decoded meaning into enables</text>
  <rect x="1043" y="205" width="154" height="70" rx="6" fill="#ffffff" stroke="#c2410c"/>
  <text x="1120" y="235" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#111827">Main decode</text>
  <text x="1120" y="257" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#4b5563">opcode</text>
  <rect x="1043" y="310" width="154" height="70" rx="6" fill="#ffffff" stroke="#c2410c"/>
  <text x="1120" y="340" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#111827">ALU decode</text>
  <text x="1120" y="362" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#4b5563">funct + ALUOp</text>
  <rect x="1043" y="415" width="154" height="100" rx="6" fill="#ffffff" stroke="#c2410c"/>
  <text x="1120" y="445" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#111827">Enables/selects</text>
  <text x="1120" y="468" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#4b5563">RegWrite, MemWrite</text>
  <text x="1120" y="489" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#4b5563">ALUSrc, ResultSrc</text>

  <line x1="345" y1="345" x2="383" y2="345" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="685" y1="345" x2="723" y2="345" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M1015 345 C995 345, 995 250, 975 250" fill="none" stroke="#c2410c" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#ctrl)"/>
  <path d="M1015 370 C900 610, 550 630, 345 500" fill="none" stroke="#c2410c" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#ctrl)"/>

  <rect x="190" y="662" width="20" height="20" fill="#eff6ff" stroke="#2563eb"/>
  <text x="220" y="678" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#374151">stored state</text>
  <rect x="405" y="662" width="20" height="20" fill="#ecfdf5" stroke="#0f766e"/>
  <text x="435" y="678" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#374151">value transformation</text>
  <rect x="675" y="662" width="20" height="20" fill="#fefce8" stroke="#a16207"/>
  <text x="705" y="678" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#374151">memory access</text>
  <line x1="900" y1="672" x2="940" y2="672" stroke="#c2410c" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="950" y="678" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#374151">control influence</text>
</svg>
