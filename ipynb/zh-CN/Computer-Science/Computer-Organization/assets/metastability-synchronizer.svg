<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">Two-flip-flop synchronizer and metastability containment</title><desc id="desc">An asynchronous input can make the first flip-flop metastable. A second flip-flop samples it one cycle later.</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#374151"/></marker><style>.h{font:700 24px Arial,sans-serif;fill:#111827}.t{font:18px Arial,sans-serif;fill:#374151}.b{stroke:#1f2937;stroke-width:3}.w{fill:none;stroke:#374151;stroke-width:3;marker-end:url(#a)}.risk{fill:none;stroke:#be123c;stroke-width:4;stroke-dasharray:8 6;marker-end:url(#a)}</style></defs>
  <rect x="1.5" y="1.5" width="1097" height="517" rx="8" fill="#fff" stroke="#d1d5db" stroke-width="3"/><text x="550" y="45" text-anchor="middle" class="h">Two-flip-flop synchronizer</text><rect x="250" y="130" width="210" height="180" rx="7" fill="#fee2e2" class="b"/><text x="355" y="185" text-anchor="middle" class="h">D flip-flop 1</text><text x="355" y="225" text-anchor="middle" class="t">may enter</text><text x="355" y="255" text-anchor="middle" class="h" fill="#be123c">metastability</text><rect x="600" y="130" width="210" height="180" rx="7" fill="#dcfce7" class="b"/><text x="705" y="185" text-anchor="middle" class="h">D flip-flop 2</text><text x="705" y="225" text-anchor="middle" class="t">samples after one</text><text x="705" y="255" text-anchor="middle" class="t">resolution interval</text><path d="M45 220H250" class="risk"/><text x="45" y="195" class="t">asynchronous input</text><path d="M460 220H600" class="risk"/><text x="530" y="205" text-anchor="middle" class="t">uncertain briefly</text><path d="M810 220H1040" class="w"/><text x="830" y="195" class="t">synchronized level</text><path d="M180 410H290V360H400V410H510V360H620V410H730V360H840V410H950" fill="none" stroke="#0f766e" stroke-width="4"/><path d="M355 360V310" class="w"/><path d="M705 360V310" class="w"/><text x="565" y="455" text-anchor="middle" class="t">same destination clock; no combinational logic between synchronizer stages</text><text x="550" y="490" text-anchor="middle" class="t">The circuit reduces probability; it cannot make metastability mathematically impossible</text>
</svg>
