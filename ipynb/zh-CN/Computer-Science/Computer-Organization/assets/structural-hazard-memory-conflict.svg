<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="650" viewBox="0 0 1320 650" role="img" aria-labelledby="title desc">
  <title id="title">Structural hazard caused by one shared memory port</title>
  <desc id="desc">Instruction fetch and a load in the memory stage request the same single memory port during one cycle. Three common remedies are separate instruction and data caches, a multiported memory, or a pipeline stall.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker>
    <marker id="bad" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b91c1c"/></marker>
    <style>.body{font-family:"Segoe UI",Arial,sans-serif;fill:#111827}.small{font-family:"Segoe UI",Arial,sans-serif;fill:#4b5563;font-size:16px}.mono{font-family:Consolas,monospace;fill:#374151;font-size:16px}.line{stroke:#374151;stroke-width:3;fill:none;marker-end:url(#arrow)}.conflict{stroke:#b91c1c;stroke-width:4;fill:none;marker-end:url(#bad)}</style>
  </defs>
  <rect width="1320" height="650" fill="#ffffff"/>
  <text x="660" y="42" text-anchor="middle" class="body" font-size="28" font-weight="700">One resource, two requests in the same cycle</text>
  <text x="660" y="72" text-anchor="middle" class="small">A structural hazard is a capacity conflict, not a dependency between instruction values.</text>

  <rect x="55" y="125" width="255" height="160" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="182" y="164" text-anchor="middle" class="body" font-size="23" font-weight="700" fill="#1d4ed8">IF stage</text>
  <text x="182" y="201" text-anchor="middle" class="mono">read instruction at PC</text>
  <text x="182" y="238" text-anchor="middle" class="small">request every active cycle</text>

  <rect x="55" y="350" width="255" height="160" rx="7" fill="#fefce8" stroke="#a16207" stroke-width="2"/>
  <text x="182" y="389" text-anchor="middle" class="body" font-size="23" font-weight="700" fill="#854d0e">MEM stage</text>
  <text x="182" y="426" text-anchor="middle" class="mono">load data at address</text>
  <text x="182" y="463" text-anchor="middle" class="small">request when a load reaches MEM</text>

  <rect x="475" y="205" width="310" height="225" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="3"/>
  <text x="630" y="252" text-anchor="middle" class="body" font-size="24" font-weight="700" fill="#991b1b">Unified single-port memory</text>
  <rect x="565" y="290" width="130" height="76" rx="5" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
  <text x="630" y="320" text-anchor="middle" class="body" font-size="19" font-weight="700">one port</text>
  <text x="630" y="347" text-anchor="middle" class="mono">one request</text>
  <text x="630" y="400" text-anchor="middle" class="body" font-size="18" font-weight="700" fill="#991b1b">cannot serve both now</text>
  <path d="M310 205 H470" class="conflict"/>
  <path d="M310 430 H405 V355 H470" class="conflict"/>
  <circle cx="438" cy="355" r="21" fill="#ffffff" stroke="#b91c1c" stroke-width="3"/>
  <path d="M426 343 L450 367 M450 343 L426 367" stroke="#b91c1c" stroke-width="4"/>

  <rect x="900" y="112" width="350" height="118" rx="7" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
  <text x="1075" y="148" text-anchor="middle" class="body" font-size="20" font-weight="700">Duplicate access paths</text>
  <text x="1075" y="181" text-anchor="middle" class="mono">I-cache + D-cache</text>
  <text x="1075" y="208" text-anchor="middle" class="small">the common pipelined solution</text>

  <rect x="900" y="268" width="350" height="118" rx="7" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="1075" y="304" text-anchor="middle" class="body" font-size="20" font-weight="700">Increase resource capacity</text>
  <text x="1075" y="337" text-anchor="middle" class="mono">two ports / banking</text>
  <text x="1075" y="364" text-anchor="middle" class="small">more area, wiring, and arbitration</text>

  <rect x="900" y="424" width="350" height="118" rx="7" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="1075" y="460" text-anchor="middle" class="body" font-size="20" font-weight="700">Serialize the requests</text>
  <text x="1075" y="493" text-anchor="middle" class="mono">stall one pipeline stage</text>
  <text x="1075" y="520" text-anchor="middle" class="small">correct, but throughput decreases</text>
  <path d="M785 318 H855 V171 H895" class="line"/>
  <path d="M855 327 H895" class="line"/>
  <path d="M855 327 V483 H895" class="line"/>
  <text x="660" y="604" text-anchor="middle" class="small">Design rule: either provide enough hardware for every simultaneous stage request or detect the conflict and stall.</text>
</svg>
