<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="860" viewBox="0 0 1660 860" role="img" aria-labelledby="title desc">
  <title id="title">Direct memory access moves bulk data without one CPU instruction per word</title>
  <desc id="desc">The CPU allocates a buffer, prepares descriptors, publishes them with a memory barrier, and rings a device doorbell. The DMA engine reads descriptors, accesses memory through an IOMMU or direct mapping, transfers data, writes completion state, and signals the CPU.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0f766e"/></marker><style>.body{font-family:"Segoe UI",Arial,sans-serif;fill:#111827}.small{font-family:"Segoe UI",Arial,sans-serif;fill:#4b5563;font-size:15px}.mono{font-family:Consolas,monospace;fill:#111827;font-size:15px}.line{stroke:#374151;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.data{stroke:#0f766e;stroke-width:4;fill:none;marker-end:url(#green)}</style></defs>
  <rect width="1660" height="860" fill="#ffffff"/>
  <text x="830" y="42" text-anchor="middle" class="body" font-size="28" font-weight="700">CPU describes the transfer; DMA hardware moves the bytes</text>
  <text x="830" y="72" text-anchor="middle" class="small">Correctness also depends on address translation, buffer lifetime, cache coherence, and ordering between descriptors and doorbells.</text>
  <rect x="55" y="125" width="310" height="500" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="210" y="167" text-anchor="middle" class="body" font-size="22" font-weight="700">CPU / driver</text>
  <g><rect x="100" y="220" width="220" height="64" rx="5" fill="#ffffff" stroke="#2563eb"/><text x="210" y="247" text-anchor="middle" class="mono">1. map/pin buffer</text><text x="210" y="271" text-anchor="middle" class="small">obtain device-visible address</text><rect x="100" y="310" width="220" height="64" rx="5" fill="#ffffff" stroke="#2563eb"/><text x="210" y="337" text-anchor="middle" class="mono">2. write descriptors</text><text x="210" y="361" text-anchor="middle" class="small">address, length, direction</text><rect x="100" y="400" width="220" height="64" rx="5" fill="#fff7ed" stroke="#ea580c"/><text x="210" y="427" text-anchor="middle" class="mono">3. memory barrier</text><text x="210" y="451" text-anchor="middle" class="small">publish before notification</text><rect x="100" y="490" width="220" height="64" rx="5" fill="#fef3c7" stroke="#d97706"/><text x="210" y="517" text-anchor="middle" class="mono">4. ring doorbell</text><text x="210" y="541" text-anchor="middle" class="small">MMIO write</text></g>
  <rect x="455" y="125" width="390" height="500" rx="8" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
  <text x="650" y="167" text-anchor="middle" class="body" font-size="22" font-weight="700">Main memory</text>
  <rect x="505" y="220" width="290" height="130" rx="6" fill="#ffffff" stroke="#0f766e"/><text x="650" y="252" text-anchor="middle" class="body" font-size="18" font-weight="700">Descriptor ring</text><text x="535" y="287" class="mono">addr=0x84000000</text><text x="535" y="317" class="mono">len=16 KiB, READ</text>
  <rect x="505" y="405" width="290" height="160" rx="6" fill="#d1fae5" stroke="#0f766e"/><text x="650" y="439" text-anchor="middle" class="body" font-size="18" font-weight="700">Data buffer</text><text x="650" y="476" text-anchor="middle" class="mono">pages / scatter list</text><text x="650" y="511" text-anchor="middle" class="small">device writes incoming bytes</text><text x="650" y="540" text-anchor="middle" class="small">CPU reads only after completion</text>
  <rect x="925" y="195" width="230" height="360" rx="8" fill="#f9fafb" stroke="#374151" stroke-width="2"/>
  <text x="1040" y="237" text-anchor="middle" class="body" font-size="21" font-weight="700">IOMMU / fabric</text><text x="1040" y="274" text-anchor="middle" class="small">device address translation</text><text x="1040" y="305" text-anchor="middle" class="small">permission and isolation</text>
  <rect x="965" y="355" width="150" height="72" rx="5" fill="#ffffff" stroke="#6b7280"/><text x="1040" y="383" text-anchor="middle" class="mono">IOVA -&gt; PA</text><text x="1040" y="409" text-anchor="middle" class="small">or direct map</text>
  <rect x="1240" y="125" width="365" height="500" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="1422" y="167" text-anchor="middle" class="body" font-size="22" font-weight="700">Device DMA engine</text>
  <rect x="1290" y="220" width="265" height="80" rx="6" fill="#ffffff" stroke="#7c3aed"/><text x="1422" y="251" text-anchor="middle" class="mono">5. fetch descriptor</text><text x="1422" y="278" text-anchor="middle" class="small">validate and schedule</text>
  <rect x="1290" y="335" width="265" height="100" rx="6" fill="#dbeafe" stroke="#2563eb"/><text x="1422" y="369" text-anchor="middle" class="mono">6. transfer data</text><text x="1422" y="397" text-anchor="middle" class="small">bus master reads/writes memory</text><text x="1422" y="421" text-anchor="middle" class="small">CPU does not copy each word</text>
  <rect x="1290" y="470" width="265" height="100" rx="6" fill="#dcfce7" stroke="#16a34a"/><text x="1422" y="504" text-anchor="middle" class="mono">7. record completion</text><text x="1422" y="532" text-anchor="middle" class="small">queue/status then MSI interrupt</text><text x="1422" y="556" text-anchor="middle" class="small">or wait for polling</text>
  <path d="M320 342 H505" class="line"/><path d="M320 522 C650 522 900 270 1290 260" class="line"/>
  <path d="M1290 270 C1180 270 900 260 795 270" class="line"/><path d="M1290 385 H1155" class="data"/><path d="M925 385 H795 V485" class="data"/>
  <path d="M795 485 H925" class="data"/><path d="M1155 385 H1290" class="data"/>
  <path d="M1290 520 C1000 690 500 690 320 555" class="line"/>
  <rect x="250" y="710" width="1160" height="105" rx="7" fill="#fff7ed" stroke="#ea580c"/><text x="830" y="743" text-anchor="middle" class="body" font-size="18" font-weight="700">DMA removes per-word CPU copying, not all CPU work.</text><text x="830" y="772" text-anchor="middle" class="small">Setup, mapping, synchronization, completion handling, error recovery, and cache/IOMMU maintenance remain.</text><text x="830" y="799" text-anchor="middle" class="small">Coherent systems simplify visibility; non-coherent systems require explicit cache clean/invalidate operations.</text>
</svg>
