<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">Two-read one-write register file</title><desc id="desc">Two read addresses independently select outputs while a decoder selects one destination register for a synchronous write.</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#374151"/></marker><style>.h{font:700 24px Arial,sans-serif;fill:#111827}.t{font:18px Arial,sans-serif;fill:#374151}.b{stroke:#1f2937;stroke-width:3}.w{fill:none;stroke:#374151;stroke-width:3;marker-end:url(#a)}.write{fill:none;stroke:#be123c;stroke-width:4;marker-end:url(#a)}.read{fill:none;stroke:#0f766e;stroke-width:4;marker-end:url(#a)}</style></defs>
  <rect x="1.5" y="1.5" width="1097" height="557" rx="8" fill="#fff" stroke="#d1d5db" stroke-width="3"/><text x="550" y="45" text-anchor="middle" class="h">Register file with two read ports and one write port</text><rect x="395" y="90" width="300" height="380" rx="7" fill="#f8fafc" class="b"/>
  <g class="h" text-anchor="middle"><rect x="445" y="125" width="200" height="55" rx="7" fill="#fef3c7" class="b"/><text x="545" y="160">R0</text><rect x="445" y="195" width="200" height="55" rx="7" fill="#fef3c7" class="b"/><text x="545" y="230">R1</text><rect x="445" y="265" width="200" height="55" rx="7" fill="#fef3c7" class="b"/><text x="545" y="300">...</text><rect x="445" y="335" width="200" height="55" rx="7" fill="#fef3c7" class="b"/><text x="545" y="370">R(N-1)</text></g>
  <rect x="120" y="155" width="190" height="90" rx="7" fill="#fee2e2" class="b"/><text x="215" y="193" text-anchor="middle" class="h">Write decoder</text><text x="215" y="222" text-anchor="middle" class="t">one-hot enable</text><path d="M35 120H120V177" class="write"/><text x="35" y="102" class="t">write address</text><path d="M35 225H120" class="write"/><text x="35" y="252" class="t">write enable</text><path d="M215 245V420H445" class="write"/><path d="M35 425H445" class="write"/><text x="35" y="410" class="t">write data</text>
  <rect x="790" y="120" width="180" height="100" rx="7" fill="#dcfce7" class="b"/><text x="880" y="160" text-anchor="middle" class="h">Read MUX A</text><text x="880" y="190" text-anchor="middle" class="t">select source A</text><rect x="790" y="315" width="180" height="100" rx="7" fill="#dbeafe" class="b"/><text x="880" y="355" text-anchor="middle" class="h">Read MUX B</text><text x="880" y="385" text-anchor="middle" class="t">select source B</text><path d="M695 175H790" class="read"/><path d="M695 365H790" class="read"/><path d="M970 170H1060" class="read"/><text x="985" y="150" class="t">read data A</text><path d="M970 365H1060" class="read"/><text x="985" y="345" class="t">read data B</text><path d="M760 70H880V120" class="w"/><text x="710" y="68" class="t">read address A</text><path d="M760 500H880V415" class="w"/><text x="710" y="525" class="t">read address B</text><path d="M315 500H545V470" class="write"/><text x="120" y="510" class="t">clock: writes occur at the active edge</text>
</svg>
