<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="680" viewBox="0 0 1400 680" role="img" aria-labelledby="title desc">
  <title id="title">Branch and jump control flow traces</title>
  <desc id="desc">A conditional branch compares two registers and chooses between PC plus four and a target, while JAL always selects the target and writes PC plus four to the link register.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker></defs>
  <rect width="1400" height="680" fill="#ffffff"/>
  <text x="700" y="40" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#111827">Control-flow instructions choose the next PC for different reasons</text>

  <rect x="45" y="85" width="1310" height="245" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="75" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#9a3412">Conditional branch: beq x5, x6, +16</text>
  <text x="75" y="147" font-family="Consolas, monospace" font-size="15" fill="#4b5563">PC = 0x100; R[5] = R[6] = 9</text>
  <rect x="95" y="185" width="205" height="82" rx="6" fill="#ffffff" stroke="#2563eb"/><text x="197" y="217" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Read operands</text><text x="197" y="246" text-anchor="middle" font-family="Consolas, monospace" font-size="15">9 and 9</text>
  <rect x="370" y="185" width="205" height="82" rx="6" fill="#ffffff" stroke="#0f766e"/><text x="472" y="217" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Compare</text><text x="472" y="246" text-anchor="middle" font-family="Consolas, monospace" font-size="15">BrEq = 1</text>
  <rect x="645" y="185" width="205" height="82" rx="6" fill="#ffffff" stroke="#0f766e"/><text x="747" y="217" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Target adder</text><text x="747" y="246" text-anchor="middle" font-family="Consolas, monospace" font-size="15">0x100 + 16 = 0x110</text>
  <path d="M930 179 l130 0 l30 47 l-30 47 l-130 0 z" fill="#ffffff" stroke="#c2410c" stroke-width="2"/>
  <text x="995" y="216" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Next-PC MUX</text>
  <text x="995" y="244" text-anchor="middle" font-family="Consolas, monospace" font-size="15">taken = 1</text>
  <rect x="1160" y="185" width="155" height="82" rx="6" fill="#ffffff" stroke="#4b5563"/>
  <text x="1237" y="217" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Commit</text>
  <text x="1237" y="246" text-anchor="middle" font-family="Consolas, monospace" font-size="15">PC &#8592; 0x110</text>
  <line x1="300" y1="226" x2="368" y2="226" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="575" y1="226" x2="643" y2="226" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="850" y1="226" x2="928" y2="226" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="1090" y1="226" x2="1158" y2="226" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="700" y="306" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#374151">RegWrite=0  MemWrite=0  Branch=1  Jump=0  PCSrc=target</text>

  <rect x="45" y="365" width="1310" height="245" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="75" y="400" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#1d4ed8">Unconditional jump with link: jal x1, +32</text>
  <text x="75" y="427" font-family="Consolas, monospace" font-size="15" fill="#4b5563">PC = 0x100; J-immediate = 32</text>
  <rect x="95" y="465" width="205" height="82" rx="6" fill="#ffffff" stroke="#2563eb"/><text x="197" y="497" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Sequential address</text><text x="197" y="526" text-anchor="middle" font-family="Consolas, monospace" font-size="15">PC + 4 = 0x104</text>
  <rect x="370" y="465" width="205" height="82" rx="6" fill="#ffffff" stroke="#0f766e"/><text x="472" y="497" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Target adder</text><text x="472" y="526" text-anchor="middle" font-family="Consolas, monospace" font-size="15">PC + 32 = 0x120</text>
  <path d="M655 459 l130 0 l30 47 l-30 47 l-130 0 z" fill="#ffffff" stroke="#c2410c" stroke-width="2"/>
  <text x="720" y="496" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Next-PC MUX</text>
  <text x="720" y="524" text-anchor="middle" font-family="Consolas, monospace" font-size="15">Jump = 1</text>
  <rect x="885" y="465" width="185" height="82" rx="6" fill="#ffffff" stroke="#a16207"/><text x="977" y="497" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Link write-back</text><text x="977" y="526" text-anchor="middle" font-family="Consolas, monospace" font-size="15">R[1] &#8592; 0x104</text>
  <rect x="1140" y="465" width="175" height="82" rx="6" fill="#ffffff" stroke="#4b5563"/><text x="1227" y="497" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Commit</text><text x="1227" y="526" text-anchor="middle" font-family="Consolas, monospace" font-size="15">PC &#8592; 0x120</text>
  <line x1="300" y1="506" x2="653" y2="506" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="575" y1="530" x2="653" y2="530" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="815" y1="506" x2="1138" y2="506" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="300" y1="481" x2="860" y2="481" stroke="#374151" stroke-width="2.5"/><line x1="860" y1="481" x2="883" y2="493" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="700" y="586" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#374151">RegWrite=1  ResultSrc=PC+4  Branch=0  Jump=1  PCSrc=target</text>
  <text x="700" y="654" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#4b5563">A branch needs a condition but no link; JAL needs a link but no condition.</text>
</svg>
