<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="740" viewBox="0 0 1450 740" role="img" aria-labelledby="title desc">
  <title id="title">From scalar pipelining to two-wide superscalar execution</title>
  <desc id="desc">A scalar pipeline issues at most one instruction per cycle. A two-wide superscalar front end considers two instructions, checks same-cycle dependencies and resources, routes them to multiple execution units, and retires results in program order.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker>
    <style>.body{font-family:"Segoe UI",Arial,sans-serif;fill:#111827}.small{font-family:"Segoe UI",Arial,sans-serif;fill:#4b5563;font-size:15px}.mono{font-family:Consolas,monospace;fill:#111827;font-size:15px}.flow{stroke:#374151;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1450" height="740" fill="#ffffff"/>
  <text x="725" y="43" text-anchor="middle" class="body" font-size="28" font-weight="700">Pipeline depth overlaps stages; superscalar width overlaps instructions within a stage</text>
  <text x="725" y="74" text-anchor="middle" class="small">More issue slots create new dependency, port, bypass, and precise-retirement requirements.</text>

  <rect x="45" y="120" width="535" height="515" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="312" y="162" text-anchor="middle" class="body" font-size="24" font-weight="700" fill="#1d4ed8">Scalar: issue width = 1</text>
  <rect x="105" y="205" width="415" height="70" rx="6" fill="#ffffff" stroke="#2563eb"/><text x="312" y="235" text-anchor="middle" class="body" font-size="18" font-weight="700">fetch and decode one instruction</text><text x="312" y="259" text-anchor="middle" class="mono">I0</text>
  <rect x="105" y="335" width="415" height="80" rx="6" fill="#ecfdf5" stroke="#0f766e"/><text x="312" y="368" text-anchor="middle" class="body" font-size="19" font-weight="700">one selected execution path</text><text x="312" y="394" text-anchor="middle" class="mono">ALU or load/store</text>
  <rect x="105" y="475" width="415" height="70" rx="6" fill="#f5f3ff" stroke="#7c3aed"/><text x="312" y="505" text-anchor="middle" class="body" font-size="18" font-weight="700">write back in program order</text><text x="312" y="529" text-anchor="middle" class="mono">at most one instruction / cycle</text>
  <path d="M312 275 V330" class="flow"/><path d="M312 415 V470" class="flow"/>
  <text x="312" y="590" text-anchor="middle" class="small">Ideal steady-state IPC is at most 1.</text>

  <rect x="625" y="120" width="780" height="515" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="1015" y="162" text-anchor="middle" class="body" font-size="24" font-weight="700" fill="#9a3412">Two-wide superscalar: issue width = 2</text>
  <rect x="685" y="200" width="660" height="75" rx="6" fill="#ffffff" stroke="#c2410c"/><text x="1015" y="230" text-anchor="middle" class="body" font-size="18" font-weight="700">fetch and decode an instruction pair</text><text x="1015" y="257" text-anchor="middle" class="mono">slot 0: I0               slot 1: I1</text>
  <rect x="685" y="315" width="660" height="90" rx="6" fill="#fef2f2" stroke="#b91c1c"/><text x="1015" y="346" text-anchor="middle" class="body" font-size="18" font-weight="700">same-cycle issue checks</text><text x="1015" y="374" text-anchor="middle" class="mono">I1 reads I0.rd?  enough ALUs?  enough cache ports?</text><text x="1015" y="395" text-anchor="middle" class="small">rename and schedule when execution may become out of order</text>
  <rect x="685" y="455" width="300" height="80" rx="6" fill="#ecfdf5" stroke="#0f766e"/><text x="835" y="487" text-anchor="middle" class="body" font-size="18" font-weight="700">execution lane 0</text><text x="835" y="515" text-anchor="middle" class="mono">ALU / branch</text>
  <rect x="1045" y="455" width="300" height="80" rx="6" fill="#fefce8" stroke="#a16207"/><text x="1195" y="487" text-anchor="middle" class="body" font-size="18" font-weight="700">execution lane 1</text><text x="1195" y="515" text-anchor="middle" class="mono">ALU / load-store</text>
  <rect x="810" y="570" width="410" height="58" rx="6" fill="#f5f3ff" stroke="#7c3aed"/><text x="1015" y="595" text-anchor="middle" class="body" font-size="18" font-weight="700">ordered retirement / precise state</text><text x="1015" y="617" text-anchor="middle" class="mono">commit I0 before I1</text>
  <path d="M1015 275 V310" class="flow"/><path d="M895 405 V450" class="flow"/><path d="M1135 405 V450" class="flow"/><path d="M835 535 V555 H1000 V565" class="flow"/><path d="M1195 535 V555 H1030 V565" class="flow"/>

  <rect x="285" y="665" width="880" height="48" rx="6" fill="#f9fafb" stroke="#9ca3af"/>
  <text x="725" y="696" text-anchor="middle" class="body" font-size="18" font-weight="700">Width raises the peak IPC, but dependencies, branch misses, and cache misses determine how many slots are actually useful.</text>
</svg>
