<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc">
  <title id="title">Dummy node makes head deletion uniform</title>
  <desc id="desc">Without a dummy node deleting the first data node changes head directly; with a dummy node every deleted node has a predecessor.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#385170"/></marker></defs>
  <rect width="1000" height="460" fill="#ffffff"/>
  <text x="500" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#172b4d">A dummy node gives the first data node a predecessor</text>
  <g font-family="Arial, sans-serif">
    <text x="45" y="103" font-size="20" font-weight="700" fill="#9b2c2c">Without dummy</text>
    <text x="45" y="132" font-size="16" fill="#4a5568">Deleting the first node is a special case.</text>
    <text x="240" y="101" text-anchor="middle" font-size="16" font-weight="700" fill="#2f6fa3">head</text>
    <path d="M240 108 V143" stroke="#2f6fa3" stroke-width="3" marker-end="url(#arrow)"/>
    <g fill="#fff5f5" stroke="#c53030" stroke-width="2"><rect x="190" y="150" width="100" height="62" rx="7"/><rect x="360" y="150" width="100" height="62" rx="7"/><rect x="530" y="150" width="100" height="62" rx="7"/></g>
    <g text-anchor="middle" font-size="22" font-weight="700" fill="#742a2a"><text x="240" y="189">3</text><text x="410" y="189">7</text><text x="580" y="189">9</text></g>
    <path d="M290 181 H352" stroke="#385170" stroke-width="3" marker-end="url(#arrow)"/><path d="M460 181 H522" stroke="#385170" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M645 151 C735 117 790 124 835 155" fill="none" stroke="#c53030" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="770" y="105" text-anchor="middle" font-size="16" fill="#9b2c2c">head must be reassigned</text>

    <line x1="45" y1="248" x2="955" y2="248" stroke="#cbd5e0" stroke-width="2"/>
    <text x="45" y="300" font-size="20" font-weight="700" fill="#22543d">With dummy</text>
    <text x="45" y="329" font-size="16" fill="#4a5568">Delete after a predecessor, even at the front.</text>
    <g fill="#f2ecfb" stroke="#805ad5" stroke-width="2"><rect x="190" y="342" width="100" height="62" rx="7"/></g>
    <text x="240" y="380" text-anchor="middle" font-size="19" font-weight="700" fill="#553c9a">dummy</text>
    <g fill="#e8f7ef" stroke="#2f855a" stroke-width="2"><rect x="360" y="342" width="100" height="62" rx="7"/><rect x="530" y="342" width="100" height="62" rx="7"/><rect x="700" y="342" width="100" height="62" rx="7"/></g>
    <g text-anchor="middle" font-size="22" font-weight="700" fill="#22543d"><text x="410" y="380">3</text><text x="580" y="380">7</text><text x="750" y="380">9</text></g>
    <path d="M290 373 H352" stroke="#385170" stroke-width="3" marker-end="url(#arrow)"/><path d="M460 373 H522" stroke="#385170" stroke-width="3" marker-end="url(#arrow)"/><path d="M630 373 H692" stroke="#385170" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M240 335 C300 280 490 282 575 332" fill="none" stroke="#2f855a" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="430" y="287" text-anchor="middle" font-size="16" fill="#22543d">dummy.next = dummy.next.next</text>
  </g>
</svg>
