<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
  <title id="title">Variable sliding window for distinct characters</title>
  <desc id="desc">The right edge expands over characters and the left edge moves past the earlier duplicate when a repeated character enters.</desc>
  <rect width="1000" height="500" fill="#ffffff"/>
  <text x="500" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#172b4d">A sliding window reuses the previous state</text>
  <g font-family="Arial, sans-serif">
    <text x="45" y="112" font-size="18" font-weight="700" fill="#174a73">Expand</text><text x="770" y="112" font-size="17" fill="#174a73">window = "abc"</text>
    <text x="45" y="246" font-size="18" font-weight="700" fill="#9b2c2c">Duplicate</text><text x="770" y="246" font-size="17" fill="#9b2c2c">next "a" repeats</text>
    <text x="45" y="380" font-size="18" font-weight="700" fill="#22543d">Shrink</text><text x="770" y="380" font-size="17" fill="#22543d">move L after old "a"</text>
    <g transform="translate(155 74)"><g fill="#e9f3ff" stroke="#2f6fa3"><rect width="80" height="58" rx="6" stroke-width="3"/><rect x="86" width="80" height="58" rx="6" stroke-width="3"/><rect x="172" width="80" height="58" rx="6" stroke-width="3"/><rect x="258" width="80" height="58" rx="6"/><rect x="344" width="80" height="58" rx="6"/><rect x="430" width="80" height="58" rx="6"/></g><g text-anchor="middle" font-size="22"><text x="40" y="37">a</text><text x="126" y="37">b</text><text x="212" y="37">c</text><text x="298" y="37">a</text><text x="384" y="37">b</text><text x="470" y="37">c</text></g><path d="M0 70 H252" stroke="#2f6fa3" stroke-width="4"/><text x="0" y="95" fill="#2f6fa3" font-weight="700">L</text><text x="242" y="95" fill="#c53030" font-weight="700">R</text></g>
    <g transform="translate(155 208)"><g fill="#fff5f5" stroke="#c53030"><rect width="80" height="58" rx="6"/><rect x="86" width="80" height="58" rx="6"/><rect x="172" width="80" height="58" rx="6"/><rect x="258" width="80" height="58" rx="6" stroke-width="3"/><rect x="344" width="80" height="58" rx="6"/><rect x="430" width="80" height="58" rx="6"/></g><g text-anchor="middle" font-size="22"><text x="40" y="37">a</text><text x="126" y="37">b</text><text x="212" y="37">c</text><text x="298" y="37">a</text><text x="384" y="37">b</text><text x="470" y="37">c</text></g><path d="M0 70 H338" stroke="#c53030" stroke-width="4"/><text x="0" y="95" fill="#2f6fa3" font-weight="700">L</text><text x="328" y="95" fill="#c53030" font-weight="700">R</text></g>
    <g transform="translate(155 342)"><g fill="#edf2f7" stroke="#a0aec0"><rect width="80" height="58" rx="6"/><rect x="86" width="80" height="58" rx="6" stroke="#2f855a" stroke-width="3"/><rect x="172" width="80" height="58" rx="6" stroke="#2f855a" stroke-width="3"/><rect x="258" width="80" height="58" rx="6" stroke="#2f855a" stroke-width="3"/><rect x="344" width="80" height="58" rx="6"/><rect x="430" width="80" height="58" rx="6"/></g><g text-anchor="middle" font-size="22"><text x="40" y="37">a</text><text x="126" y="37">b</text><text x="212" y="37">c</text><text x="298" y="37">a</text><text x="384" y="37">b</text><text x="470" y="37">c</text></g><path d="M86 70 H338" stroke="#2f855a" stroke-width="4"/><text x="86" y="95" fill="#2f6fa3" font-weight="700">L</text><text x="328" y="95" fill="#c53030" font-weight="700">R</text></g>
  </g>
</svg>
