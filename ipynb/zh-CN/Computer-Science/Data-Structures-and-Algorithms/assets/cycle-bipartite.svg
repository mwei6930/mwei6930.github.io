<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">DFS cycle detection and BFS bipartite coloring</title>
  <desc id="desc">A directed DFS finds a back edge to a gray active vertex, while bipartite testing alternates two colors and rejects an edge whose endpoints share a color.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#52657a"/></marker><marker id="redarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c53030"/></marker></defs>
  <rect width="1100" height="520" fill="#ffffff"/>
  <text x="550" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#172b4d">Traversal state turns structure into a test</text>
  <g font-family="Arial, sans-serif">
    <rect x="28" y="72" width="505" height="390" rx="8" fill="#f7fafc" stroke="#9aa9ba" stroke-width="2"/>
    <text x="280" y="108" text-anchor="middle" font-size="21" font-weight="700" fill="#2d3748">Directed cycle: a back edge to gray</text>
    <g fill="none" stroke="#52657a" stroke-width="4" marker-end="url(#arrow)"><path d="M120 225 L235 150"/><path d="M255 165 L365 230"/><path d="M355 250 L260 335"/></g>
    <path d="M235 335 Q95 335 105 245" fill="none" stroke="#c53030" stroke-width="5" marker-end="url(#redarrow)"/>
    <g text-anchor="middle" dominant-baseline="middle" font-size="18" font-weight="700">
      <g fill="#fff3d6" stroke="#b7791f" stroke-width="3"><circle cx="105" cy="235" r="28"/><circle cx="245" cy="150" r="28"/><circle cx="375" cy="240" r="28"/><circle cx="245" cy="345" r="28"/></g>
      <text x="105" y="235">A</text><text x="245" y="150">B</text><text x="375" y="240">C</text><text x="245" y="345">D</text>
    </g>
    <text x="280" y="390" text-anchor="middle" font-size="17" fill="#9b2c2c">D → A reaches an active ancestor.</text>
    <text x="280" y="425" text-anchor="middle" font-size="15" fill="#4a5568">white = unseen, gray = active, black = finished</text>

    <rect x="565" y="72" width="507" height="390" rx="8" fill="#f7fafc" stroke="#9aa9ba" stroke-width="2"/>
    <text x="818" y="108" text-anchor="middle" font-size="21" font-weight="700" fill="#2d3748">Bipartite test: neighbors alternate colors</text>
    <g fill="none" stroke="#52657a" stroke-width="4"><path d="M660 190 L810 145 L950 205 L875 355 L700 345 Z"/><path d="M810 145 L875 355"/></g>
    <g text-anchor="middle" dominant-baseline="middle" font-size="18" font-weight="700">
      <g fill="#e6f1fb" stroke="#2f6fa3" stroke-width="3"><circle cx="660" cy="190" r="28"/><circle cx="950" cy="205" r="28"/><circle cx="875" cy="355" r="28"/></g>
      <g fill="#fdecec" stroke="#c53030" stroke-width="3"><circle cx="810" cy="145" r="28"/><circle cx="700" cy="345" r="28"/></g>
      <text x="660" y="190">A</text><text x="810" y="145">B</text><text x="950" y="205">C</text><text x="875" y="355">D</text><text x="700" y="345">E</text>
    </g>
    <path d="M933 227 L892 333" stroke="#c53030" stroke-width="6" stroke-dasharray="10 7"/>
    <text x="818" y="405" text-anchor="middle" font-size="17" fill="#9b2c2c">Conflict: C and D have the same color.</text>
    <text x="818" y="435" text-anchor="middle" font-size="15" fill="#4a5568">An odd cycle makes two-coloring impossible.</text>
  </g>
  <text x="550" y="496" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#4a5568">Both tests keep a local invariant while traversing every reachable edge.</text>
</svg>
