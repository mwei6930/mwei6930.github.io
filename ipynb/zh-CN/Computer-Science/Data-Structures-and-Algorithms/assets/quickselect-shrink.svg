<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">Quickselect discards the side that cannot contain rank k</title>
  <desc id="desc">After partitioning around a pivot, Quickselect compares the pivot rank with k and recurses only into the side that contains the requested order statistic.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#52657a"/></marker></defs>
  <rect width="1100" height="520" fill="#ffffff"/>
  <text x="550" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#172b4d">Quickselect partitions like quicksort but follows only one side</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="115" y="120" font-size="18" font-weight="700" fill="#2d3748">Find rank k = 2</text>
    <g transform="translate(260 82)" font-size="19" font-weight="700"><g fill="#e6f1fb" stroke="#2f6fa3"><rect x="0" y="0" width="62" height="55"/><rect x="64" y="0" width="62" height="55"/><rect x="128" y="0" width="62" height="55"/><rect x="192" y="0" width="62" height="55"/><rect x="256" y="0" width="62" height="55"/><rect x="320" y="0" width="62" height="55"/><rect x="384" y="0" width="62" height="55"/><rect x="448" y="0" width="62" height="55"/><rect x="512" y="0" width="62" height="55"/></g><g fill="#2d3748"><text x="31" y="35">9</text><text x="95" y="35">1</text><text x="159" y="35">8</text><text x="223" y="35">2</text><text x="287" y="35">7</text><text x="351" y="35">3</text><text x="415" y="35">6</text><text x="479" y="35">4</text><text x="543" y="35">5</text></g></g>
    <path d="M550 160 V205" stroke="#52657a" stroke-width="4" marker-end="url(#arrow)"/>

    <text x="125" y="260" font-size="17" font-weight="700" fill="#744210">pivot 6 has rank 5</text>
    <g transform="translate(260 225)" font-size="19" font-weight="700"><g fill="#e8f7ef" stroke="#2f855a"><rect x="0" y="0" width="62" height="55"/><rect x="64" y="0" width="62" height="55"/><rect x="128" y="0" width="62" height="55"/><rect x="192" y="0" width="62" height="55"/><rect x="256" y="0" width="62" height="55"/></g><rect x="320" y="0" width="62" height="55" fill="#f2ecfb" stroke="#805ad5" stroke-width="4"/><g fill="#fff3d6" stroke="#b7791f"><rect x="384" y="0" width="62" height="55"/><rect x="448" y="0" width="62" height="55"/><rect x="512" y="0" width="62" height="55"/></g><g fill="#2d3748"><text x="31" y="35">1</text><text x="95" y="35">2</text><text x="159" y="35">3</text><text x="223" y="35">4</text><text x="287" y="35">5</text><text x="351" y="35">6</text><text x="415" y="35">7</text><text x="479" y="35">8</text><text x="543" y="35">9</text></g></g>
    <path d="M415 302 V345" stroke="#2f855a" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M700 302 V340" stroke="#c53030" stroke-width="3" stroke-dasharray="8 6"/>
    <text x="795" y="334" font-size="16" fill="#9b2c2c">discard pivot and right side</text>

    <g transform="translate(330 365)" font-size="19" font-weight="700"><g fill="#e8f7ef" stroke="#2f855a"><rect x="0" y="0" width="75" height="58"/><rect x="77" y="0" width="75" height="58"/></g><rect x="154" y="0" width="75" height="58" fill="#d5f0e1" stroke="#2f855a" stroke-width="4"/><g fill="#edf2f7" stroke="#a0aec0"><rect x="231" y="0" width="75" height="58"/><rect x="308" y="0" width="75" height="58"/></g><g fill="#2d3748"><text x="37" y="37">1</text><text x="114" y="37">2</text><text x="191" y="37">3</text><text x="268" y="37">4</text><text x="345" y="37">5</text></g></g>
    <text x="550" y="452" font-size="17" font-weight="700" fill="#22543d">pivot 3 has rank k = 2: answer found</text>
    <text x="550" y="492" font-size="16" fill="#4a5568">Balanced random pivots shrink the active interval geometrically; sorting either discarded side is unnecessary.</text>
  </g>
</svg>
