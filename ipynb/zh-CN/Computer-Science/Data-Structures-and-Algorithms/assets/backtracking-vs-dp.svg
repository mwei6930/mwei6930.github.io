<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
  <title id="title">Backtracking versus dynamic programming state merging</title>
  <desc id="desc">Different target-sum decision histories reach the same index and total state; backtracking revisits it while dynamic programming merges it.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
  </defs>
  <rect width="1200" height="580" fill="#f8fafc"/>
  <text x="600" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#0f172a">Memoization is valid only when different histories have identical futures</text>

  <rect x="35" y="78" width="545" height="450" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="307" y="116" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#6d28d9">Plain backtracking</text>
  <text x="307" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#475569">Histories remain separate even after reaching the same state.</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <circle cx="307" cy="205" r="28" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="307" y="211" font-size="15" fill="#5b21b6">(0,0)</text>
    <circle cx="205" cy="285" r="27" fill="#ede9fe" stroke="#7c3aed"/><text x="205" y="291" font-size="15" fill="#5b21b6">(1,+1)</text>
    <circle cx="409" cy="285" r="27" fill="#ede9fe" stroke="#7c3aed"/><text x="409" y="291" font-size="15" fill="#5b21b6">(1,-1)</text>
    <circle cx="150" cy="385" r="27" fill="#f5f3ff" stroke="#7c3aed"/><text x="150" y="391" font-size="15" fill="#5b21b6">(2,+2)</text>
    <circle cx="260" cy="385" r="27" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="260" y="391" font-size="15" fill="#9a3412">(2,0)</text>
    <circle cx="354" cy="385" r="27" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="354" y="391" font-size="15" fill="#9a3412">(2,0)</text>
    <circle cx="464" cy="385" r="27" fill="#f5f3ff" stroke="#7c3aed"/><text x="464" y="391" font-size="15" fill="#5b21b6">(2,-2)</text>
  </g>
  <path d="M287 226 L223 264 M327 226 L391 264 M188 307 L162 358 M222 307 L248 358 M392 307 L366 358 M426 307 L452 358" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="307" y="448" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#9a3412">State (2,0) and all descendants are evaluated twice.</text>
  <text x="307" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#475569">Useful when histories have constraints not captured by (index,total).</text>

  <rect x="620" y="78" width="545" height="450" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="892" y="116" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1d4ed8">Memoized dynamic programming</text>
  <text x="892" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#475569">Equivalent histories share one cached continuation.</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <circle cx="892" cy="205" r="28" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="892" y="211" font-size="15" fill="#1e3a8a">(0,0)</text>
    <circle cx="790" cy="285" r="27" fill="#dbeafe" stroke="#2563eb"/><text x="790" y="291" font-size="15" fill="#1e3a8a">(1,+1)</text>
    <circle cx="994" cy="285" r="27" fill="#dbeafe" stroke="#2563eb"/><text x="994" y="291" font-size="15" fill="#1e3a8a">(1,-1)</text>
    <circle cx="735" cy="385" r="27" fill="#eff6ff" stroke="#2563eb"/><text x="735" y="391" font-size="15" fill="#1e3a8a">(2,+2)</text>
    <circle cx="892" cy="385" r="31" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="892" y="391" font-size="15" font-weight="700" fill="#166534">(2,0)</text>
    <circle cx="1049" cy="385" r="27" fill="#eff6ff" stroke="#2563eb"/><text x="1049" y="391" font-size="15" fill="#1e3a8a">(2,-2)</text>
  </g>
  <path d="M872 226 L808 264 M912 226 L976 264 M773 307 L747 358 M807 307 L872 367 M977 307 L912 367 M1011 307 L1037 358" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="892" y="448" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#166534">One state stores the number of successful continuations.</text>
  <text x="892" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#475569">Safe because future choices depend only on index and current total.</text>
</svg>
