<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="610" viewBox="0 0 1100 610" role="img" aria-labelledby="title desc">
  <title id="title">One graph represented as adjacency lists and an adjacency matrix</title>
  <desc id="desc">An undirected graph with five vertices is shown beside its adjacency-list and adjacency-matrix representations.</desc>
  <rect width="1100" height="610" fill="#ffffff"/>
  <text x="550" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#172b4d">The same graph, two storage choices</text>
  <g font-family="Arial, sans-serif">
    <rect x="28" y="72" width="330" height="470" rx="8" fill="#f7fafc" stroke="#9aa9ba" stroke-width="2"/>
    <text x="193" y="107" text-anchor="middle" font-size="21" font-weight="700" fill="#2d3748">Undirected graph</text>
    <g fill="none" stroke="#63758a" stroke-width="4">
      <path d="M105 205 L205 150 L280 230 L230 350 L105 365 Z"/>
      <path d="M105 205 L230 350 M205 150 L230 350"/>
    </g>
    <g text-anchor="middle" dominant-baseline="middle" font-size="21" font-weight="700">
      <circle cx="105" cy="205" r="27" fill="#e6f1fb" stroke="#2f6fa3" stroke-width="3"/><text x="105" y="205">A</text>
      <circle cx="205" cy="150" r="27" fill="#e8f7ef" stroke="#2f855a" stroke-width="3"/><text x="205" y="150">B</text>
      <circle cx="280" cy="230" r="27" fill="#fff3d6" stroke="#b7791f" stroke-width="3"/><text x="280" y="230">C</text>
      <circle cx="230" cy="350" r="27" fill="#f2ecfb" stroke="#805ad5" stroke-width="3"/><text x="230" y="350">D</text>
      <circle cx="105" cy="365" r="27" fill="#fdecec" stroke="#c53030" stroke-width="3"/><text x="105" y="365">E</text>
    </g>
    <text x="193" y="455" text-anchor="middle" font-size="17" fill="#4a5568">|V| = 5 vertices</text>
    <text x="193" y="483" text-anchor="middle" font-size="17" fill="#4a5568">|E| = 7 undirected edges</text>
    <text x="193" y="518" text-anchor="middle" font-size="15" fill="#63758a">The drawing is not the data structure.</text>

    <rect x="385" y="72" width="320" height="470" rx="8" fill="#edf7f2" stroke="#4d9b71" stroke-width="2"/>
    <text x="545" y="107" text-anchor="middle" font-size="21" font-weight="700" fill="#22543d">Adjacency lists</text>
    <g font-size="18" fill="#2d3748">
      <text x="420" y="160" font-weight="700">A</text><text x="462" y="160">→ B → D → E</text>
      <text x="420" y="220" font-weight="700">B</text><text x="462" y="220">→ A → C → D</text>
      <text x="420" y="280" font-weight="700">C</text><text x="462" y="280">→ B → D</text>
      <text x="420" y="340" font-weight="700">D</text><text x="462" y="340">→ A → B → C → E</text>
      <text x="420" y="400" font-weight="700">E</text><text x="462" y="400">→ A → D</text>
    </g>
    <line x1="410" y1="178" x2="680" y2="178" stroke="#b7d8c6"/><line x1="410" y1="238" x2="680" y2="238" stroke="#b7d8c6"/><line x1="410" y1="298" x2="680" y2="298" stroke="#b7d8c6"/><line x1="410" y1="358" x2="680" y2="358" stroke="#b7d8c6"/>
    <text x="545" y="468" text-anchor="middle" font-size="17" fill="#22543d">Space: Θ(|V| + |E|)</text>
    <text x="545" y="500" text-anchor="middle" font-size="15" fill="#4a5568">Best when the graph is sparse.</text>

    <rect x="732" y="72" width="340" height="470" rx="8" fill="#fff8e8" stroke="#d69e2e" stroke-width="2"/>
    <text x="902" y="107" text-anchor="middle" font-size="21" font-weight="700" fill="#744210">Adjacency matrix</text>
    <g transform="translate(784 135)" font-size="17" text-anchor="middle" dominant-baseline="middle">
      <g font-weight="700" fill="#744210"><text x="65" y="20">A</text><text x="105" y="20">B</text><text x="145" y="20">C</text><text x="185" y="20">D</text><text x="225" y="20">E</text><text x="20" y="65">A</text><text x="20" y="105">B</text><text x="20" y="145">C</text><text x="20" y="185">D</text><text x="20" y="225">E</text></g>
      <g fill="#ffffff" stroke="#d69e2e">
        <rect x="45" y="45" width="40" height="40"/><rect x="85" y="45" width="40" height="40"/><rect x="125" y="45" width="40" height="40"/><rect x="165" y="45" width="40" height="40"/><rect x="205" y="45" width="40" height="40"/>
        <rect x="45" y="85" width="40" height="40"/><rect x="85" y="85" width="40" height="40"/><rect x="125" y="85" width="40" height="40"/><rect x="165" y="85" width="40" height="40"/><rect x="205" y="85" width="40" height="40"/>
        <rect x="45" y="125" width="40" height="40"/><rect x="85" y="125" width="40" height="40"/><rect x="125" y="125" width="40" height="40"/><rect x="165" y="125" width="40" height="40"/><rect x="205" y="125" width="40" height="40"/>
        <rect x="45" y="165" width="40" height="40"/><rect x="85" y="165" width="40" height="40"/><rect x="125" y="165" width="40" height="40"/><rect x="165" y="165" width="40" height="40"/><rect x="205" y="165" width="40" height="40"/>
        <rect x="45" y="205" width="40" height="40"/><rect x="85" y="205" width="40" height="40"/><rect x="125" y="205" width="40" height="40"/><rect x="165" y="205" width="40" height="40"/><rect x="205" y="205" width="40" height="40"/>
      </g>
      <g fill="#2d3748"><text x="65" y="65">0</text><text x="105" y="65">1</text><text x="145" y="65">0</text><text x="185" y="65">1</text><text x="225" y="65">1</text><text x="65" y="105">1</text><text x="105" y="105">0</text><text x="145" y="105">1</text><text x="185" y="105">1</text><text x="225" y="105">0</text><text x="65" y="145">0</text><text x="105" y="145">1</text><text x="145" y="145">0</text><text x="185" y="145">1</text><text x="225" y="145">0</text><text x="65" y="185">1</text><text x="105" y="185">1</text><text x="145" y="185">1</text><text x="185" y="185">0</text><text x="225" y="185">1</text><text x="65" y="225">1</text><text x="105" y="225">0</text><text x="145" y="225">0</text><text x="185" y="225">1</text><text x="225" y="225">0</text></g>
    </g>
    <text x="902" y="468" text-anchor="middle" font-size="17" fill="#744210">Space: Θ(|V|²)</text>
    <text x="902" y="500" text-anchor="middle" font-size="15" fill="#4a5568">Edge lookup is Θ(1).</text>
  </g>
  <text x="550" y="582" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#4a5568">An undirected edge appears twice in adjacency lists and symmetrically in the matrix.</text>
</svg>
