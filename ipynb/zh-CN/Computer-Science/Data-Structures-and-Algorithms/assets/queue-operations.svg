<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
  <title id="title">Queue enqueue and dequeue operations</title>
  <desc id="desc">Items enter at the rear and leave from the front, preserving first in first out order.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#385170"/></marker></defs>
  <rect width="1000" height="420" fill="#ffffff"/>
  <text x="500" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#172b4d">Queue: enter at rear, leave from front</text>
  <g font-family="Arial, sans-serif">
    <text x="80" y="142" font-size="20" font-weight="700" fill="#22543d">dequeue()</text>
    <path d="M250 136 H150" stroke="#2f855a" stroke-width="4" marker-end="url(#arrow)"/>
    <g fill="#e9f3ff" stroke="#2f6fa3" stroke-width="2"><rect x="270" y="100" width="110" height="72" rx="7"/><rect x="390" y="100" width="110" height="72" rx="7"/><rect x="510" y="100" width="110" height="72" rx="7"/><rect x="630" y="100" width="110" height="72" rx="7"/></g>
    <g text-anchor="middle" font-size="22" font-weight="700" fill="#174a73"><text x="325" y="144">A</text><text x="445" y="144">B</text><text x="565" y="144">C</text><text x="685" y="144">D</text></g>
    <path d="M760 136 H850" stroke="#b7791f" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="865" y="142" font-size="20" font-weight="700" fill="#744210">enqueue(E)</text>
    <text x="325" y="198" text-anchor="middle" font-size="17" font-weight="700" fill="#2f6fa3">front</text><text x="685" y="198" text-anchor="middle" font-size="17" font-weight="700" fill="#c53030">rear</text>

    <line x1="70" y1="238" x2="930" y2="238" stroke="#cbd5e0" stroke-width="2"/>
    <text x="500" y="286" text-anchor="middle" font-size="19" font-weight="700" fill="#553c9a">FIFO preserves arrival order</text>
    <rect x="175" y="312" width="650" height="62" rx="8" fill="#f2ecfb" stroke="#805ad5" stroke-width="2"/>
    <text x="500" y="338" text-anchor="middle" font-size="16" fill="#44337a">A arrives before B, so A must leave before B.</text>
    <text x="500" y="362" text-anchor="middle" font-size="16" fill="#44337a">A linked queue keeps both front and rear pointers for O(1) operations.</text>
  </g>
</svg>
