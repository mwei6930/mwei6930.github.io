<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">Three Master Theorem cases</title>
  <desc id="desc">The Master Theorem compares nonrecursive work f of n with the recursive threshold n to the power log base b of a.</desc>
  <rect width="1100" height="520" fill="#ffffff"/>
  <text x="550" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#172b4d">Master Theorem: compare f(n) with n^p, where p = log_b(a)</text>
  <g font-family="Arial, sans-serif">
    <rect x="25" y="78" width="335" height="385" rx="8" fill="#edf4fb" stroke="#2f6fa3" stroke-width="2"/>
    <text x="192" y="118" text-anchor="middle" font-size="22" font-weight="700" fill="#174a73">Case 1: leaves dominate</text>
    <text x="192" y="162" text-anchor="middle" font-size="17" fill="#2d3748">f(n) = O(n^(p - epsilon))</text>
    <g fill="#2f6fa3"><rect x="100" y="210" width="185" height="28" opacity="0.25"/><rect x="80" y="252" width="225" height="35" opacity="0.45"/><rect x="58" y="300" width="270" height="48" opacity="0.75"/></g>
    <text x="192" y="380" text-anchor="middle" font-size="17" fill="#4a5568">Recursive leaves contribute most.</text>
    <text x="192" y="424" text-anchor="middle" font-size="20" font-weight="700" fill="#174a73">T(n) = Theta(n^p)</text>

    <rect x="382" y="78" width="335" height="385" rx="8" fill="#f5f0fb" stroke="#805ad5" stroke-width="2"/>
    <text x="549" y="118" text-anchor="middle" font-size="22" font-weight="700" fill="#553c9a">Case 2: levels balance</text>
    <text x="549" y="162" text-anchor="middle" font-size="17" fill="#2d3748">f(n) = Theta(n^p log^k(n))</text>
    <g fill="#805ad5"><rect x="445" y="210" width="210" height="35" opacity="0.65"/><rect x="445" y="262" width="210" height="35" opacity="0.65"/><rect x="445" y="314" width="210" height="35" opacity="0.65"/></g>
    <text x="549" y="380" text-anchor="middle" font-size="17" fill="#4a5568">Comparable work appears at each level.</text>
    <text x="549" y="424" text-anchor="middle" font-size="18" font-weight="700" fill="#553c9a">T(n) = Theta(n^p log^(k+1)(n))</text>

    <rect x="739" y="78" width="335" height="385" rx="8" fill="#edf7f2" stroke="#2f855a" stroke-width="2"/>
    <text x="906" y="118" text-anchor="middle" font-size="22" font-weight="700" fill="#22543d">Case 3: root dominates</text>
    <text x="906" y="162" text-anchor="middle" font-size="17" fill="#2d3748">f(n) = Omega(n^(p + epsilon))</text>
    <g fill="#2f855a"><rect x="775" y="205" width="263" height="52" opacity="0.8"/><rect x="800" y="278" width="213" height="38" opacity="0.5"/><rect x="830" y="337" width="153" height="25" opacity="0.25"/></g>
    <text x="906" y="390" text-anchor="middle" font-size="15" fill="#4a5568">plus the regularity condition</text>
    <text x="906" y="424" text-anchor="middle" font-size="20" font-weight="700" fill="#22543d">T(n) = Theta(f(n))</text>
  </g>
  <text x="550" y="492" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#4a5568">The theorem applies to T(n) = aT(n/b) + f(n) under its side conditions; it is not a universal recurrence solver.</text>
</svg>
