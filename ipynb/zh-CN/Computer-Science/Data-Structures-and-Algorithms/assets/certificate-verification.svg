<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">Efficient verification with a certificate</title><desc id="desc">A proposed vertex cover is checked edge by edge in polynomial time, even if discovering one may require search.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><style>.title{font:700 28px 'Segoe UI',Arial,sans-serif;fill:#172033}.head{font:700 19px 'Segoe UI',Arial,sans-serif;fill:#172033}.body{font:16px 'Segoe UI',Arial,sans-serif;fill:#334155}.small{font:14px 'Segoe UI',Arial,sans-serif;fill:#526174}.line{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1120" height="620" fill="#f8fafc"/><text x="560" y="45" text-anchor="middle" class="title">NP asks whether a short witness can be checked efficiently</text>
  <rect x="45" y="100" width="280" height="370" rx="8" fill="#fff" stroke="#93c5fd" stroke-width="2"/><text x="185" y="140" text-anchor="middle" class="head">Instance</text><text x="185" y="170" text-anchor="middle" class="body">Graph G and bound k = 2</text><circle cx="115" cy="280" r="28" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><circle cx="185" cy="220" r="28" fill="#fff" stroke="#64748b" stroke-width="2"/><circle cx="255" cy="280" r="28" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><circle cx="185" cy="355" r="28" fill="#fff" stroke="#64748b" stroke-width="2"/><path d="M137 261L163 239M207 239L233 261M238 301L203 335M167 335L132 301" stroke="#64748b" stroke-width="3"/><text x="185" y="420" text-anchor="middle" class="small">Question: does a cover of size &lt;= 2 exist?</text>
  <path d="M325 285L410 285" class="line"/><rect x="410" y="160" width="260" height="250" rx="8" fill="#fff" stroke="#c4b5fd" stroke-width="2"/><text x="540" y="200" text-anchor="middle" class="head">Certificate C</text><text x="540" y="238" text-anchor="middle" class="body">{left, right}</text><rect x="455" y="275" width="170" height="70" rx="8" fill="#faf5ff" stroke="#d8b4fe"/><text x="540" y="305" text-anchor="middle" class="body">short description</text><text x="540" y="330" text-anchor="middle" class="small">at most k vertex IDs</text>
  <path d="M670 285L755 285" class="line"/><rect x="755" y="100" width="320" height="370" rx="8" fill="#fff" stroke="#86efac" stroke-width="2"/><text x="915" y="140" text-anchor="middle" class="head">Polynomial verifier</text><text x="790" y="190" class="body">1. Check |C| &lt;= k</text><text x="790" y="235" class="body">2. Scan every edge (u,v)</text><text x="810" y="270" class="small">accept edge if u in C or v in C</text><text x="790" y="320" class="body">3. Accept only if all edges pass</text><rect x="825" y="365" width="180" height="62" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/><text x="915" y="402" text-anchor="middle" class="head">O(V + E)</text>
  <rect x="175" y="510" width="770" height="64" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/><text x="560" y="537" text-anchor="middle" class="body">Verification receives the witness. Solving must discover whether any valid witness exists.</text><text x="560" y="561" text-anchor="middle" class="small">Fast checking does not by itself provide a fast search algorithm.</text>
</svg>
