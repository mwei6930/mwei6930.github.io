<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc">
  <title id="title">Priority queue implementation tradeoffs</title>
  <desc id="desc">Unsorted arrays make insertion cheap, sorted arrays make extract minimum cheap, and binary heaps balance both operations logarithmically.</desc>
  <rect width="1000" height="450" fill="#ffffff"/>
  <text x="500" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#172b4d">The ADT stays fixed while the representation changes</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(35 75)"><rect width="290" height="320" rx="8" fill="#e9f3ff" stroke="#2f6fa3"/><text x="145" y="37" text-anchor="middle" font-size="20" font-weight="700" fill="#174a73">Unsorted array</text><g fill="#ffffff" stroke="#7aa7cf"><rect x="35" y="82" width="52" height="52"/><rect x="89" y="82" width="52" height="52"/><rect x="143" y="82" width="52" height="52"/><rect x="197" y="82" width="52" height="52"/></g><g text-anchor="middle" font-size="19"><text x="61" y="115">7</text><text x="115" y="115">2</text><text x="169" y="115">9</text><text x="223" y="115">4</text></g><text x="145" y="178" text-anchor="middle" font-size="17">insert: append</text><text x="145" y="208" text-anchor="middle" font-size="18" font-weight="700" fill="#22543d">O(1)</text><text x="145" y="252" text-anchor="middle" font-size="17">extract-min: scan</text><text x="145" y="282" text-anchor="middle" font-size="18" font-weight="700" fill="#9b2c2c">O(n)</text></g>
    <g transform="translate(355 75)"><rect width="290" height="320" rx="8" fill="#fff3d6" stroke="#b7791f"/><text x="145" y="37" text-anchor="middle" font-size="20" font-weight="700" fill="#744210">Sorted array</text><g fill="#ffffff" stroke="#d9aa55"><rect x="35" y="82" width="52" height="52"/><rect x="89" y="82" width="52" height="52"/><rect x="143" y="82" width="52" height="52"/><rect x="197" y="82" width="52" height="52"/></g><g text-anchor="middle" font-size="19"><text x="61" y="115">2</text><text x="115" y="115">4</text><text x="169" y="115">7</text><text x="223" y="115">9</text></g><text x="145" y="178" text-anchor="middle" font-size="17">insert: find + shift</text><text x="145" y="208" text-anchor="middle" font-size="18" font-weight="700" fill="#9b2c2c">O(n)</text><text x="145" y="252" text-anchor="middle" font-size="17">extract-min: end/front design</text><text x="145" y="282" text-anchor="middle" font-size="18" font-weight="700" fill="#22543d">O(1)</text></g>
    <g transform="translate(675 75)"><rect width="290" height="320" rx="8" fill="#e8f7ef" stroke="#2f855a"/><text x="145" y="37" text-anchor="middle" font-size="20" font-weight="700" fill="#22543d">Binary heap</text><g stroke="#68a983" stroke-width="2"><path d="M145 90 L95 150 M145 90 L195 150 M95 178 L65 225 M95 178 L125 225"/></g><g fill="#ffffff" stroke="#2f855a"><circle cx="145" cy="78" r="23"/><circle cx="95" cy="165" r="22"/><circle cx="195" cy="165" r="22"/><circle cx="65" cy="240" r="20"/><circle cx="125" cy="240" r="20"/></g><g text-anchor="middle" font-size="17"><text x="145" y="84">2</text><text x="95" y="171">4</text><text x="195" y="171">7</text><text x="65" y="246">9</text><text x="125" y="246">5</text></g><text x="145" y="284" text-anchor="middle" font-size="17">insert / extract-min</text><text x="145" y="312" text-anchor="middle" font-size="18" font-weight="700" fill="#22543d">O(log n)</text></g>
    <text x="500" y="428" text-anchor="middle" font-size="16" fill="#4a5568">A heap is the balanced default when both insertion and repeated extraction matter.</text>
  </g>
</svg>
