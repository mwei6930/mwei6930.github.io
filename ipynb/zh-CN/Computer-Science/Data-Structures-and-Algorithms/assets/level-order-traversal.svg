<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
  <title id="title">Breadth-first level-order traversal</title>
  <desc id="desc">A queue visits a binary tree level by level, with queue snapshots after each depth.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#385170"/></marker></defs>
  <rect width="1000" height="470" fill="#ffffff"/>
  <text x="500" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#172b4d">The queue stores the next frontier</text>
  <g font-family="Arial, sans-serif">
    <g stroke="#718096" stroke-width="3"><path d="M350 112 L220 205"/><path d="M350 112 L480 205"/><path d="M220 245 L150 340"/><path d="M220 245 L290 340"/><path d="M480 245 L410 340"/><path d="M480 245 L550 340"/></g>
    <g text-anchor="middle" font-size="21" font-weight="700"><circle cx="350" cy="92" r="36" fill="#f2ecfb" stroke="#805ad5" stroke-width="3"/><text x="350" y="99" fill="#553c9a">A</text><circle cx="220" cy="225" r="34" fill="#e9f3ff" stroke="#2f6fa3" stroke-width="2"/><circle cx="480" cy="225" r="34" fill="#e9f3ff" stroke="#2f6fa3" stroke-width="2"/><text x="220" y="232">B</text><text x="480" y="232">C</text><g fill="#e8f7ef" stroke="#2f855a" stroke-width="2"><circle cx="150" cy="360" r="31"/><circle cx="290" cy="360" r="31"/><circle cx="410" cy="360" r="31"/><circle cx="550" cy="360" r="31"/></g><text x="150" y="367">D</text><text x="290" y="367">E</text><text x="410" y="367">F</text><text x="550" y="367">G</text></g>
    <g font-size="16" font-weight="700"><text x="55" y="98" fill="#553c9a">depth 0</text><text x="55" y="231" fill="#174a73">depth 1</text><text x="55" y="366" fill="#22543d">depth 2</text></g>
    <rect x="655" y="78" width="300" height="326" rx="8" fill="#f7fafc" stroke="#a0aec0"/>
    <text x="805" y="112" text-anchor="middle" font-size="19" font-weight="700" fill="#2d3748">Queue snapshots</text>
    <g font-size="17"><text x="680" y="157" fill="#553c9a">start</text><text x="760" y="157">[A]</text><path d="M760 170 H900" stroke="#805ad5" stroke-width="4" marker-end="url(#arrow)"/><text x="680" y="218" fill="#174a73">after A</text><text x="760" y="218">[B, C]</text><path d="M760 231 H900" stroke="#2f6fa3" stroke-width="4" marker-end="url(#arrow)"/><text x="680" y="279" fill="#22543d">after B,C</text><text x="760" y="279">[D, E, F, G]</text><path d="M760 292 H900" stroke="#2f855a" stroke-width="4" marker-end="url(#arrow)"/><text x="680" y="342" fill="#4a5568">visit order</text><text x="805" y="375" text-anchor="middle" font-weight="700">A, B, C, D, E, F, G</text></g>
  </g>
</svg>
