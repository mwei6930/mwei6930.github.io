<svg xmlns="http://www.w3.org/2000/svg" width="940" height="430" viewBox="0 0 940 430" role="img" aria-labelledby="title desc">
  <title id="title">Static versus contextual embedding for bank</title>
  <desc id="desc">A diagram showing that static embeddings assign one vector to bank while contextual embeddings assign different vectors depending on sentence meaning.</desc>
  <defs>
    <style>
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; }
      .title { font: 700 24px Arial, sans-serif; fill: #1e293b; }
      .text { font: 16px Arial, sans-serif; fill: #334155; }
      .word { font: 700 18px Arial, sans-serif; fill: #0f172a; }
      .box { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.5; }
      .money { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
      .river { fill: #e0f2fe; stroke: #0284c7; stroke-width: 1.5; }
      .arrow { stroke: #475569; stroke-width: 2.5; marker-end: url(#arrow); fill: none; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="30" y="30" width="400" height="350" rx="10" class="panel"/>
  <text x="230" y="75" text-anchor="middle" class="title">Static Embedding</text>
  <text x="70" y="125" class="text">bank account</text>
  <text x="70" y="165" class="text">river bank</text>
  <path d="M190 120 C230 140, 260 175, 300 205" class="arrow"/>
  <path d="M170 160 C225 170, 260 190, 300 210" class="arrow"/>
  <rect x="300" y="185" width="90" height="52" rx="8" class="box"/>
  <text x="345" y="218" text-anchor="middle" class="word">bank</text>
  <text x="70" y="300" class="text">One word type has one fixed vector.</text>

  <rect x="510" y="30" width="400" height="350" rx="10" class="panel"/>
  <text x="710" y="75" text-anchor="middle" class="title">Contextual Embedding</text>
  <text x="550" y="125" class="text">I deposited money in the bank.</text>
  <text x="550" y="245" class="text">The boat stopped near the river bank.</text>
  <path d="M720 135 C745 145, 765 155, 790 165" class="arrow"/>
  <path d="M735 255 C760 245, 780 235, 800 225" class="arrow"/>
  <rect x="790" y="140" width="90" height="52" rx="8" class="money"/>
  <text x="835" y="173" text-anchor="middle" class="word">bank</text>
  <text x="835" y="205" text-anchor="middle" class="text">finance</text>
  <rect x="790" y="230" width="90" height="52" rx="8" class="river"/>
  <text x="835" y="263" text-anchor="middle" class="word">bank</text>
  <text x="835" y="295" text-anchor="middle" class="text">river side</text>
  <text x="550" y="340" class="text">The vector changes with surrounding words.</text>
</svg>
