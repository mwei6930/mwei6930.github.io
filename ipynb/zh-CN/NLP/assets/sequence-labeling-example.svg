<svg xmlns="http://www.w3.org/2000/svg" width="920" height="360" viewBox="0 0 920 360" role="img" aria-label="Sequence labeling example for named entity recognition">
  <rect width="920" height="360" fill="#f8fafc"/>
  <text x="460" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#111827">Sequence-to-Label-Sequence Modeling</text>
  <text x="460" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#4b5563">Each input token receives one output label</text>

  <g font-family="Arial, sans-serif">
    <text x="76" y="126" font-size="16" font-weight="700" fill="#374151">Input tokens</text>
    <text x="76" y="246" font-size="16" font-weight="700" fill="#374151">Output labels</text>

    <g transform="translate(190 100)">
      <rect x="0" y="0" width="92" height="54" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
      <text x="46" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1d4ed8">John</text>
      <rect x="120" y="0" width="92" height="54" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
      <text x="166" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1d4ed8">works</text>
      <rect x="240" y="0" width="92" height="54" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
      <text x="286" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1d4ed8">at</text>
      <rect x="360" y="0" width="104" height="54" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
      <text x="412" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1d4ed8">Google</text>
      <rect x="492" y="0" width="108" height="54" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
      <text x="546" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1d4ed8">Sydney</text>
    </g>

    <g stroke="#94a3b8" stroke-width="2" fill="none">
      <path d="M236 158 L236 218"/>
      <path d="M356 158 L356 218"/>
      <path d="M476 158 L476 218"/>
      <path d="M602 158 L602 218"/>
      <path d="M736 158 L736 218"/>
      <path d="M230 211 L236 218 L242 211"/>
      <path d="M350 211 L356 218 L362 211"/>
      <path d="M470 211 L476 218 L482 211"/>
      <path d="M596 211 L602 218 L608 211"/>
      <path d="M730 211 L736 218 L742 211"/>
    </g>

    <g transform="translate(190 220)">
      <rect x="0" y="0" width="92" height="54" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
      <text x="46" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#3730a3">B-PER</text>
      <rect x="120" y="0" width="92" height="54" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
      <text x="166" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#334155">O</text>
      <rect x="240" y="0" width="92" height="54" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
      <text x="286" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#334155">O</text>
      <rect x="360" y="0" width="104" height="54" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
      <text x="412" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#047857">B-ORG</text>
      <rect x="492" y="0" width="108" height="54" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
      <text x="546" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#c2410c">B-LOC</text>
    </g>

    <rect x="230" y="306" width="460" height="34" rx="17" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="460" y="328" text-anchor="middle" font-size="14" fill="#334155">BIO labels mark beginning tokens, inside tokens, and outside tokens</text>
  </g>
</svg>
