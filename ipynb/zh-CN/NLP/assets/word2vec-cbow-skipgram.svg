<svg xmlns="http://www.w3.org/2000/svg" width="980" height="420" viewBox="0 0 980 420" role="img" aria-labelledby="title desc">
  <title id="title">CBOW and Skip-gram comparison</title>
  <desc id="desc">A diagram comparing CBOW, which predicts the center word from context words, and Skip-gram, which predicts context words from the center word.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2f5d62" />
    </marker>
    <style>
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; }
      .title { font: 700 24px Arial, sans-serif; fill: #1e293b; }
      .label { font: 600 16px Arial, sans-serif; fill: #1e293b; }
      .small { font: 14px Arial, sans-serif; fill: #475569; }
      .word { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.5; }
      .target { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
      .arrow { stroke: #2f5d62; stroke-width: 2.5; marker-end: url(#arrow); fill: none; }
    </style>
  </defs>

  <rect x="30" y="30" width="430" height="360" rx="10" class="panel"/>
  <text x="245" y="70" text-anchor="middle" class="title">CBOW</text>
  <text x="245" y="98" text-anchor="middle" class="small">Context words predict the center word</text>

  <rect x="80" y="150" width="100" height="44" rx="8" class="word"/>
  <text x="130" y="178" text-anchor="middle" class="label">I</text>
  <rect x="80" y="215" width="100" height="44" rx="8" class="word"/>
  <text x="130" y="243" text-anchor="middle" class="label">love</text>
  <rect x="80" y="280" width="100" height="44" rx="8" class="word"/>
  <text x="130" y="308" text-anchor="middle" class="label">language</text>

  <path d="M190 172 C240 172, 260 210, 300 228" class="arrow"/>
  <path d="M190 237 C235 237, 260 237, 300 237" class="arrow"/>
  <path d="M190 302 C240 302, 260 264, 300 246" class="arrow"/>

  <rect x="310" y="215" width="110" height="44" rx="8" class="target"/>
  <text x="365" y="243" text-anchor="middle" class="label">natural</text>
  <text x="245" y="350" text-anchor="middle" class="small">Good for frequent words; usually faster.</text>

  <rect x="520" y="30" width="430" height="360" rx="10" class="panel"/>
  <text x="735" y="70" text-anchor="middle" class="title">Skip-gram</text>
  <text x="735" y="98" text-anchor="middle" class="small">Center word predicts surrounding context words</text>

  <rect x="560" y="215" width="110" height="44" rx="8" class="target"/>
  <text x="615" y="243" text-anchor="middle" class="label">natural</text>

  <path d="M680 228 C725 190, 750 172, 800 172" class="arrow"/>
  <path d="M680 237 C725 237, 750 237, 800 237" class="arrow"/>
  <path d="M680 246 C725 284, 750 302, 800 302" class="arrow"/>

  <rect x="810" y="150" width="100" height="44" rx="8" class="word"/>
  <text x="860" y="178" text-anchor="middle" class="label">I</text>
  <rect x="810" y="215" width="100" height="44" rx="8" class="word"/>
  <text x="860" y="243" text-anchor="middle" class="label">love</text>
  <rect x="810" y="280" width="100" height="44" rx="8" class="word"/>
  <text x="860" y="308" text-anchor="middle" class="label">language</text>
  <text x="735" y="350" text-anchor="middle" class="small">Better for rare words; creates more training pairs.</text>
</svg>
