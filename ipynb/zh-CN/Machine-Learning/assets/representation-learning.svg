<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Representation learning and transfer</title>
  <desc id="desc">Raw high-dimensional observations pass through an encoder into a compact representation that supports a simple task head and can transfer to another task.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#495057"/></marker><style>.h{font:700 24px Arial,sans-serif;fill:#212529}.t{font:700 17px Arial,sans-serif;fill:#343a40}.s{font:15px Arial,sans-serif;fill:#495057}.box{stroke:#495057;stroke-width:2;rx:6}.line{stroke:#495057;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style></defs>
  <text x="600" y="38" text-anchor="middle" class="h">Representation Learning Moves Feature Construction Inside the Model</text>
  <rect x="30" y="120" width="220" height="350" class="box" fill="#e7f5ff"/><text x="140" y="160" text-anchor="middle" class="t">Raw observation x</text><text x="140" y="205" text-anchor="middle" class="s">pixels, tokens, audio,</text><text x="140" y="235" text-anchor="middle" class="s">or many correlated fields</text><g fill="#74c0fc"><rect x="75" y="285" width="28" height="28"/><rect x="110" y="285" width="28" height="28"/><rect x="145" y="285" width="28" height="28"/><rect x="110" y="320" width="28" height="28"/><rect x="145" y="355" width="28" height="28"/></g>
  <path d="M250 295 H320" class="line"/>
  <rect x="325" y="120" width="260" height="350" class="box" fill="#fff3bf"/><text x="455" y="160" text-anchor="middle" class="t">Encoder h_phi(x)</text><text x="455" y="205" text-anchor="middle" class="s">learned invariances</text><text x="455" y="235" text-anchor="middle" class="s">task-relevant interactions</text><path d="M385 370 L455 245 L525 370 Z" fill="#fff" stroke="#e67700" stroke-width="3"/><circle cx="430" cy="335" r="12" fill="#4dabf7"/><circle cx="465" cy="305" r="12" fill="#4dabf7"/><circle cx="475" cy="370" r="12" fill="#ff8787"/>
  <path d="M585 295 H655" class="line"/>
  <rect x="660" y="120" width="220" height="350" class="box" fill="#d3f9d8"/><text x="770" y="160" text-anchor="middle" class="t">Representation z</text><circle cx="725" cy="270" r="13" fill="#4dabf7"/><circle cx="755" cy="245" r="13" fill="#4dabf7"/><circle cx="785" cy="275" r="13" fill="#4dabf7"/><circle cx="755" cy="350" r="13" fill="#ff8787"/><circle cx="795" cy="330" r="13" fill="#ff8787"/><line x1="700" y1="320" x2="840" y2="280" stroke="#2b8a3e" stroke-width="4"/><text x="770" y="420" text-anchor="middle" class="s">simple geometry</text>
  <path d="M880 245 H940" class="line"/><path d="M880 350 H940" class="line"/>
  <rect x="945" y="155" width="225" height="130" class="box" fill="#f3d9fa"/><text x="1057" y="200" text-anchor="middle" class="t">Task A head</text><text x="1057" y="238" text-anchor="middle" class="s">classification / regression</text>
  <rect x="945" y="330" width="225" height="130" class="box" fill="#ffe3e3"/><text x="1057" y="375" text-anchor="middle" class="t">Task B head</text><text x="1057" y="413" text-anchor="middle" class="s">fine-tune or linear probe</text>
  <text x="600" y="550" text-anchor="middle" class="s">A useful representation keeps information needed by downstream tasks while discarding nuisance variation.</text>
</svg>
