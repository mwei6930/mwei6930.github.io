<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="650" viewBox="0 0 1260 650" role="img" aria-labelledby="title desc">
  <title id="title">Bayesian updating in a rare-event test</title>
  <desc id="desc">A population prior is filtered by positive test evidence to form a posterior probability.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #172033; }
      .head { font: 700 21px Arial, sans-serif; fill: #172033; }
      .label { font: 600 17px Arial, sans-serif; fill: #172033; }
      .small { font: 15px Arial, sans-serif; fill: #475569; }
      .arrow { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1260" height="650" fill="#ffffff"/>
  <text x="630" y="48" text-anchor="middle" class="title">Bayes' Rule Reweights a Prior Using Evidence</text>

  <rect x="45" y="105" width="300" height="410" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="195" y="144" text-anchor="middle" class="head">Prior population</text>
  <text x="195" y="173" text-anchor="middle" class="small">10,000 people before the test</text>
  <rect x="82" y="205" width="226" height="65" rx="6" fill="#fee2e2" stroke="#b23a35" stroke-width="2"/>
  <text x="195" y="232" text-anchor="middle" class="label">100 have condition</text>
  <text x="195" y="255" text-anchor="middle" class="small">prior P(D) = 1%</text>
  <rect x="82" y="295" width="226" height="150" rx="6" fill="#e8f1fb" stroke="#2c6ca3" stroke-width="2"/>
  <text x="195" y="350" text-anchor="middle" class="label">9,900 do not</text>
  <text x="195" y="377" text-anchor="middle" class="small">prior P(not D) = 99%</text>
  <text x="195" y="478" text-anchor="middle" class="small">Rare events begin with low prior odds.</text>

  <path d="M355 310H445" class="arrow"/>
  <text x="400" y="280" text-anchor="middle" class="head">Test</text>
  <text x="400" y="342" text-anchor="middle" class="small">E = positive</text>

  <rect x="460" y="105" width="330" height="410" rx="8" fill="#fffdf5" stroke="#c7a75b" stroke-width="2"/>
  <text x="625" y="144" text-anchor="middle" class="head">Likelihood pathways</text>
  <rect x="500" y="202" width="250" height="82" rx="6" fill="#fee2e2" stroke="#b23a35" stroke-width="2"/>
  <text x="625" y="231" text-anchor="middle" class="label">90 true positives</text>
  <text x="625" y="256" text-anchor="middle" class="small">P(E | D) = 90%</text>
  <rect x="500" y="320" width="250" height="82" rx="6" fill="#e8f1fb" stroke="#2c6ca3" stroke-width="2"/>
  <text x="625" y="349" text-anchor="middle" class="label">495 false positives</text>
  <text x="625" y="374" text-anchor="middle" class="small">P(E | not D) = 5%</text>
  <text x="625" y="448" text-anchor="middle" class="small">Both paths can produce the same observation.</text>
  <text x="625" y="474" text-anchor="middle" class="small">The large healthy group still contributes many positives.</text>

  <path d="M800 310H890" class="arrow"/>
  <text x="845" y="280" text-anchor="middle" class="head">Condition</text>
  <text x="845" y="342" text-anchor="middle" class="small">positive cases only</text>

  <rect x="905" y="105" width="310" height="410" rx="8" fill="#f4faf7" stroke="#6aa184" stroke-width="2"/>
  <text x="1060" y="144" text-anchor="middle" class="head">Posterior among positives</text>
  <rect x="945" y="202" width="230" height="82" rx="6" fill="#fee2e2" stroke="#b23a35" stroke-width="2"/>
  <text x="1060" y="232" text-anchor="middle" class="label">90 true positives</text>
  <rect x="945" y="320" width="230" height="82" rx="6" fill="#e8f1fb" stroke="#2c6ca3" stroke-width="2"/>
  <text x="1060" y="350" text-anchor="middle" class="label">495 false positives</text>
  <text x="1060" y="438" text-anchor="middle" class="head" fill="#176c49">P(D | E) = 90 / 585</text>
  <text x="1060" y="474" text-anchor="middle" class="head" fill="#176c49">= 15.4%</text>

  <rect x="170" y="555" width="920" height="60" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="630" y="592" text-anchor="middle" class="label">posterior is proportional to likelihood times prior; the denominator normalizes competing explanations</text>
</svg>
