<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <defs><style>.t{font:700 28px Arial,sans-serif;fill:#1f2937}.h{font:700 20px Arial,sans-serif;fill:#1f2937}.b{font:16px Arial,sans-serif;fill:#374151}.s{font:14px Arial,sans-serif;fill:#475569}.box{fill:#fff;stroke:#64748b;stroke-width:2}</style></defs>
  <rect width="1200" height="650" fill="#f8fafc"/>
  <text x="600" y="42" text-anchor="middle" class="t">Shattering asks whether every labeling can be represented</text>
  <rect x="42" y="80" width="720" height="500" rx="8" class="box"/>
  <text x="402" y="115" text-anchor="middle" class="h">Three non-collinear points and linear separators in 2D</text>
  <text x="402" y="142" text-anchor="middle" class="s">Each mini-panel shows one of the 2³ binary labelings.</text>
  <g transform="translate(78 176)">
    <g transform="translate(0 0)"><rect width="140" height="130" fill="#f8fafc" stroke="#cbd5e1"/><circle cx="36" cy="95" r="8" fill="#2563eb"/><circle cx="105" cy="94" r="8" fill="#2563eb"/><circle cx="70" cy="34" r="8" fill="#2563eb"/></g>
    <g transform="translate(165 0)"><rect width="140" height="130" fill="#f8fafc" stroke="#cbd5e1"/><circle cx="36" cy="95" r="8" fill="#ef4444"/><circle cx="105" cy="94" r="8" fill="#2563eb"/><circle cx="70" cy="34" r="8" fill="#2563eb"/><line x1="18" y1="65" x2="64" y2="125" stroke="#111827" stroke-width="3"/></g>
    <g transform="translate(330 0)"><rect width="140" height="130" fill="#f8fafc" stroke="#cbd5e1"/><circle cx="36" cy="95" r="8" fill="#2563eb"/><circle cx="105" cy="94" r="8" fill="#ef4444"/><circle cx="70" cy="34" r="8" fill="#2563eb"/><line x1="75" y1="124" x2="122" y2="63" stroke="#111827" stroke-width="3"/></g>
    <g transform="translate(495 0)"><rect width="140" height="130" fill="#f8fafc" stroke="#cbd5e1"/><circle cx="36" cy="95" r="8" fill="#2563eb"/><circle cx="105" cy="94" r="8" fill="#2563eb"/><circle cx="70" cy="34" r="8" fill="#ef4444"/><line x1="12" y1="68" x2="128" y2="68" stroke="#111827" stroke-width="3"/></g>
    <g transform="translate(0 160)"><rect width="140" height="130" fill="#f8fafc" stroke="#cbd5e1"/><circle cx="36" cy="95" r="8" fill="#ef4444"/><circle cx="105" cy="94" r="8" fill="#ef4444"/><circle cx="70" cy="34" r="8" fill="#2563eb"/><line x1="12" y1="68" x2="128" y2="68" stroke="#111827" stroke-width="3"/></g>
    <g transform="translate(165 160)"><rect width="140" height="130" fill="#f8fafc" stroke="#cbd5e1"/><circle cx="36" cy="95" r="8" fill="#ef4444"/><circle cx="105" cy="94" r="8" fill="#2563eb"/><circle cx="70" cy="34" r="8" fill="#ef4444"/><line x1="74" y1="124" x2="122" y2="61" stroke="#111827" stroke-width="3"/></g>
    <g transform="translate(330 160)"><rect width="140" height="130" fill="#f8fafc" stroke="#cbd5e1"/><circle cx="36" cy="95" r="8" fill="#2563eb"/><circle cx="105" cy="94" r="8" fill="#ef4444"/><circle cx="70" cy="34" r="8" fill="#ef4444"/><line x1="18" y1="64" x2="64" y2="125" stroke="#111827" stroke-width="3"/></g>
    <g transform="translate(495 160)"><rect width="140" height="130" fill="#f8fafc" stroke="#cbd5e1"/><circle cx="36" cy="95" r="8" fill="#ef4444"/><circle cx="105" cy="94" r="8" fill="#ef4444"/><circle cx="70" cy="34" r="8" fill="#ef4444"/></g>
  </g>
  <text x="402" y="544" text-anchor="middle" class="b">All eight labelings are realizable, so this particular set is shattered.</text>

  <rect x="792" y="80" width="366" height="500" rx="8" class="box"/>
  <text x="975" y="115" text-anchor="middle" class="h">Four points: one impossible pattern</text>
  <rect x="850" y="172" width="250" height="250" fill="#f8fafc" stroke="#cbd5e1"/>
  <circle cx="890" cy="212" r="12" fill="#2563eb"/><circle cx="1060" cy="212" r="12" fill="#ef4444"/>
  <circle cx="890" cy="382" r="12" fill="#ef4444"/><circle cx="1060" cy="382" r="12" fill="#2563eb"/>
  <path d="M875 395 L1075 195" stroke="#111827" stroke-width="3" stroke-dasharray="9 7"/>
  <path d="M875 195 L1075 395" stroke="#111827" stroke-width="3" stroke-dasharray="9 7"/>
  <text x="975" y="462" text-anchor="middle" class="b">XOR cannot be separated by one line.</text>
  <text x="975" y="493" text-anchor="middle" class="s">Therefore 2D affine linear separators</text>
  <text x="975" y="518" text-anchor="middle" class="s">cannot shatter every four-point set.</text>
  <text x="975" y="551" text-anchor="middle" class="h">VC dimension = 3</text>
</svg>
