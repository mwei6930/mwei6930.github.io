<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Programmatic weak supervision and a latent label model</title><desc id="desc">Labeling functions produce an abstaining vote matrix; a label model estimates source reliability and generates probabilistic labels for an end model.</desc>
<defs><marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#475569"/></marker>
<style>.title{font:700 26px Arial,sans-serif;fill:#17212b}.bh{font:700 19px Arial,sans-serif;fill:#17212b}.bt{font:15px Arial,sans-serif;fill:#334155}.small{font:14px Arial,sans-serif;fill:#526172}.arrow{stroke:#475569;stroke-width:3;marker-end:url(#arrowhead)}.node{stroke:#334155;stroke-width:2}</style></defs>
<rect width="1200" height="600" fill="#ffffff"/>
<text x="600" y="42" text-anchor="middle" class="title">Programmatic weak supervision and a latent label model</text>
<rect x="35" y="110" width="230" height="355" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="150.0" y="148" text-anchor="middle" class="bh">Labeling functions</text><text x="150.0" y="182" text-anchor="middle" class="bt">LF1: domain rule</text><text x="150.0" y="209" text-anchor="middle" class="bt">LF2: keyword pattern</text><text x="150.0" y="236" text-anchor="middle" class="bt">LF3: database match</text><text x="150.0" y="263" text-anchor="middle" class="bt">LF4: crowd worker</text><text x="150.0" y="290" text-anchor="middle" class="bt">ABSTAIN is allowed</text><line x1="265" y1="285" x2="350" y2="285" class="arrow"/><rect x="365" y="95" width="250" height="385" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="490.0" y="133" text-anchor="middle" class="bh">Vote matrix Lambda</text><text x="490.0" y="167" text-anchor="middle" class="bt">rows: observations</text><text x="490.0" y="194" text-anchor="middle" class="bt">columns: sources</text><text x="490.0" y="221" text-anchor="middle" class="bt">coverage</text><text x="490.0" y="248" text-anchor="middle" class="bt">overlap and conflict</text><text x="490.0" y="275" text-anchor="middle" class="bt">source correlation</text><text x="490" y="310" text-anchor="middle" font-family="monospace" font-size="20">+  .  +  -</text><text x="490" y="345" text-anchor="middle" font-family="monospace" font-size="20">.  -  -  -</text><text x="490" y="380" text-anchor="middle" font-family="monospace" font-size="20">+  +  .  +</text><line x1="615" y1="285" x2="700" y2="285" class="arrow"/><rect x="715" y="110" width="220" height="355" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="3"/><text x="825.0" y="148" text-anchor="middle" class="bh">Label model</text><text x="825.0" y="182" text-anchor="middle" class="bt">estimate reliability</text><text x="825.0" y="209" text-anchor="middle" class="bt">model dependencies</text><text x="825.0" y="236" text-anchor="middle" class="bt">infer latent y</text><text x="825.0" y="263" text-anchor="middle" class="bt">produce p(y|Lambda)</text><text x="825.0" y="290" text-anchor="middle" class="bt">audit identifiability</text><line x1="935" y1="285" x2="1015" y2="285" class="arrow"/><rect x="1030" y="135" width="135" height="305" rx="10" fill="#f3e8ff" stroke="#9333ea" stroke-width="3"/><text x="1097.5" y="173" text-anchor="middle" class="bh">End model</text><text x="1097.5" y="207" text-anchor="middle" class="bt">train on</text><text x="1097.5" y="234" text-anchor="middle" class="bt">probabilistic</text><text x="1097.5" y="261" text-anchor="middle" class="bt">labels</text><text x="1097.5" y="288" text-anchor="middle" class="bt">use raw x</text><text x="1097.5" y="315" text-anchor="middle" class="bt">at inference</text><text x="600" y="535" text-anchor="middle" class="bh">The label model learns about sources; the end model learns from input features.</text><text x="600" y="567" text-anchor="middle" class="small">Correlated rules can look like independent confirmation, so source analysis and a small clean audit set remain essential.</text></svg>