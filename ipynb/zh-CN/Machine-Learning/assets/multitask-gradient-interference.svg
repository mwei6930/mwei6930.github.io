<rect width="1200" height="610" fill="#ffffff"/>
<text x="600" y="42" text-anchor="middle" class="title">Gradient interference between tasks</text>
<circle cx="310" cy="300" r="210" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><line x1="310" y1="510" x2="310" y2="80" stroke="#94a3b8" stroke-width="2"/><line x1="100" y1="300" x2="520" y2="300" stroke="#94a3b8" stroke-width="2"/><line x1="310" y1="300" x2="455" y2="180" class="arrow"/><line x1="310" y1="300" x2="175" y2="190" class="arrow"/><text x="470" y="170" class="bh" fill="#2563eb">g_A</text><text x="145" y="180" class="bh" fill="#e11d48">g_B</text><text x="310" y="555" text-anchor="middle" class="bh">g_A dot g_B &lt; 0: conflicting updates</text><rect x="610" y="95" width="245" height="180" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="732.5" y="133" text-anchor="middle" class="bh">Loss weighting</text><text x="732.5" y="167" text-anchor="middle" class="bt">lambda_t L_t</text><text x="732.5" y="194" text-anchor="middle" class="bt">balance scales</text><text x="732.5" y="221" text-anchor="middle" class="bt">balance learning rates</text><rect x="900" y="95" width="245" height="180" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="3"/><text x="1022.5" y="133" text-anchor="middle" class="bh">Gradient balancing</text><text x="1022.5" y="167" text-anchor="middle" class="bt">GradNorm</text><text x="1022.5" y="194" text-anchor="middle" class="bt">equalize training rates</text><text x="1022.5" y="221" text-anchor="middle" class="bt">control magnitudes</text><rect x="610" y="330" width="245" height="180" rx="10" fill="#f3e8ff" stroke="#9333ea" stroke-width="3"/><text x="732.5" y="368" text-anchor="middle" class="bh">Gradient surgery</text><text x="732.5" y="402" text-anchor="middle" class="bt">PCGrad projection</text><text x="732.5" y="429" text-anchor="middle" class="bt">remove conflicting component</text><text x="732.5" y="456" text-anchor="middle" class="bt">order can matter</text><rect x="900" y="330" width="245" height="180" rx="10" fill="#fff7ed" stroke="#e8590c" stroke-width="3"/><text x="1022.5" y="368" text-anchor="middle" class="bh">Architecture / routing</text><text x="1022.5" y="402" text-anchor="middle" class="bt">task-specific adapters</text><text x="1022.5" y="429" text-anchor="middle" class="bt">gates and experts</text><text x="1022.5" y="456" text-anchor="middle" class="bt">share selectively</text><text x="875" y="575" text-anchor="middle" class="small">A weighted sum selects one trade-off on a multi-objective surface.</text></svg>