<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <defs><marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#334155"/></marker><style>.t{font:700 28px Arial,sans-serif;fill:#1f2937}.h{font:700 20px Arial,sans-serif;fill:#1f2937}.b{font:16px Arial,sans-serif;fill:#374151}.s{font:14px Arial,sans-serif;fill:#475569}.m{font:italic 18px Georgia,serif;fill:#111827}.box{fill:#fff;stroke:#64748b;stroke-width:2}.a{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#ar)}</style></defs>
  <rect width="1200" height="680" fill="#f8fafc"/>
  <text x="600" y="42" text-anchor="middle" class="t">Two routes from training fit to generalization</text>

  <rect x="42" y="78" width="536" height="548" rx="8" class="box"/>
  <text x="310" y="115" text-anchor="middle" class="h">Uniform convergence: control every h at once</text>
  <text x="310" y="144" text-anchor="middle" class="m">max over H |population − empirical| ≤ ε</text>
  <g transform="translate(87 190)">
    <text x="0" y="21" class="b">h₁</text><rect x="55" y="6" width="315" height="18" fill="#e2e8f0"/><rect x="55" y="6" width="185" height="18" fill="#2563eb"/><line x1="252" y1="1" x2="252" y2="29" stroke="#ef4444" stroke-width="4"/>
    <text x="0" y="83" class="b">h₂</text><rect x="55" y="68" width="315" height="18" fill="#e2e8f0"/><rect x="55" y="68" width="242" height="18" fill="#2563eb"/><line x1="307" y1="63" x2="307" y2="91" stroke="#ef4444" stroke-width="4"/>
    <text x="0" y="145" class="b">h₃</text><rect x="55" y="130" width="315" height="18" fill="#e2e8f0"/><rect x="55" y="130" width="108" height="18" fill="#2563eb"/><line x1="173" y1="125" x2="173" y2="153" stroke="#ef4444" stroke-width="4"/>
    <text x="0" y="207" class="b">h₄</text><rect x="55" y="192" width="315" height="18" fill="#e2e8f0"/><rect x="55" y="192" width="274" height="18" fill="#2563eb"/><line x1="338" y1="187" x2="338" y2="215" stroke="#ef4444" stroke-width="4"/>
    <text x="89" y="256" class="s" fill="#2563eb">blue bar: empirical risk</text><text x="250" y="256" class="s" fill="#dc2626">red mark: population risk</text>
  </g>
  <rect x="82" y="505" width="456" height="81" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="310" y="537" text-anchor="middle" class="b">If every pair is close, selecting the smallest</text>
  <text x="310" y="565" text-anchor="middle" class="b">empirical bar cannot hide a large true risk.</text>

  <rect x="622" y="78" width="536" height="548" rx="8" class="box"/>
  <text x="890" y="115" text-anchor="middle" class="h">Algorithmic stability: perturb one example</text>
  <rect x="664" y="167" width="180" height="190" rx="8" fill="#eef6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="754" y="197" text-anchor="middle" class="h">Dataset S</text>
  <text x="754" y="233" text-anchor="middle" class="b">z₁</text><text x="754" y="263" text-anchor="middle" class="b">z₂</text><text x="754" y="293" text-anchor="middle" class="b">z₃</text><text x="754" y="323" text-anchor="middle" class="b">z₄</text>
  <rect x="936" y="167" width="180" height="190" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
  <text x="1026" y="197" text-anchor="middle" class="h">Dataset S′</text>
  <text x="1026" y="233" text-anchor="middle" class="b">z₁</text><text x="1026" y="263" text-anchor="middle" class="b">z₂</text><text x="1026" y="293" text-anchor="middle" class="b">z′₃</text><text x="1026" y="323" text-anchor="middle" class="b">z₄</text>
  <path d="M844 262 H928" class="a"/>
  <text x="886" y="245" text-anchor="middle" class="s">one change</text>
  <path d="M754 357 V420" class="a"/><path d="M1026 357 V420" class="a"/>
  <ellipse cx="754" cy="454" rx="84" ry="35" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><ellipse cx="1026" cy="454" rx="84" ry="35" fill="#ffedd5" stroke="#d97706" stroke-width="2"/>
  <text x="754" y="461" text-anchor="middle" class="h">A(S)</text><text x="1026" y="461" text-anchor="middle" class="h">A(S′)</text>
  <path d="M840 454 H938" stroke="#16a34a" stroke-width="6"/>
  <text x="889" y="437" text-anchor="middle" class="s">small change</text>
  <text x="890" y="527" text-anchor="middle" class="m">|ℓ(A(S), z) − ℓ(A(S′), z)| ≤ β</text>
  <text x="890" y="566" text-anchor="middle" class="b">Stable algorithms do not memorize one example strongly.</text>
</svg>
