<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Three factorizations of dataset shift</title><desc id="desc">Panels contrast covariate shift, label shift, and concept shift using which factor of the joint distribution changes.</desc>
<defs><marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#475569"/></marker>
<style>.title{font:700 26px Arial,sans-serif;fill:#17212b}.bh{font:700 19px Arial,sans-serif;fill:#17212b}.bt{font:15px Arial,sans-serif;fill:#334155}.small{font:14px Arial,sans-serif;fill:#526172}.arrow{stroke:#475569;stroke-width:3;marker-end:url(#arrowhead)}.node{stroke:#334155;stroke-width:2}</style></defs>
<rect width="1200" height="600" fill="#ffffff"/>
<text x="600" y="42" text-anchor="middle" class="title">Three factorizations of dataset shift</text>
<rect x="35" y="90" width="350" height="390" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="210.0" y="128" text-anchor="middle" class="bh">Covariate shift</text><text x="210.0" y="162" text-anchor="middle" class="bt">P_S(x) != P_T(x)</text><text x="210.0" y="189" text-anchor="middle" class="bt">P_S(y|x) = P_T(y|x)</text><text x="210.0" y="216" text-anchor="middle" class="bt">input mix changes</text><text x="210.0" y="243" text-anchor="middle" class="bt">decision rule is stable</text><circle cx="110" cy="330" r="13" fill="#2563eb"/><circle cx="155" cy="290" r="13" fill="#2563eb"/><circle cx="225" cy="360" r="13" fill="#2563eb"/><circle cx="285" cy="250" r="13" fill="#e11d48"/><circle cx="320" cy="300" r="13" fill="#e11d48"/><path d="M70 410 C170 330 225 275 345 160" fill="none" stroke="#475569" stroke-width="4" stroke-dasharray="9 7"/><rect x="425" y="90" width="350" height="390" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="3"/><text x="600.0" y="128" text-anchor="middle" class="bh">Label shift</text><text x="600.0" y="162" text-anchor="middle" class="bt">P_S(y) != P_T(y)</text><text x="600.0" y="189" text-anchor="middle" class="bt">P_S(x|y) = P_T(x|y)</text><text x="600.0" y="216" text-anchor="middle" class="bt">class prevalence changes</text><text x="600.0" y="243" text-anchor="middle" class="bt">class signatures are stable</text><rect x="485" y="280" width="55" height="135" fill="#2563eb"/><rect x="555" y="345" width="55" height="70" fill="#e11d48"/><rect x="650" y="345" width="55" height="70" fill="#2563eb"/><rect x="720" y="250" width="55" height="165" fill="#e11d48"/><text x="548" y="445" text-anchor="middle" class="small">source</text><text x="713" y="445" text-anchor="middle" class="small">target</text><rect x="815" y="90" width="350" height="390" rx="10" fill="#fff7ed" stroke="#e8590c" stroke-width="3"/><text x="990.0" y="128" text-anchor="middle" class="bh">Concept shift</text><text x="990.0" y="162" text-anchor="middle" class="bt">P_S(y|x) != P_T(y|x)</text><text x="990.0" y="189" text-anchor="middle" class="bt">decision relationship changes</text><text x="990.0" y="216" text-anchor="middle" class="bt">policy, behavior, or meaning</text><text x="990.0" y="243" text-anchor="middle" class="bt">may need new target labels</text><path d="M855 390 C930 330 1000 250 1120 160" fill="none" stroke="#2563eb" stroke-width="5"/><path d="M855 180 C960 265 1030 345 1120 410" fill="none" stroke="#e11d48" stroke-width="5"/><text x="600" y="535" text-anchor="middle" class="bh">The same observed drift can have multiple causal explanations.</text><text x="600" y="567" text-anchor="middle" class="small">A taxonomy is useful only when its conditional-invariance assumption is tested against delayed target labels.</text></svg>