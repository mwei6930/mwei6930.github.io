<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
  <defs><marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#334155"/></marker><style>.t{font:700 28px Arial,sans-serif;fill:#1f2937}.h{font:700 20px Arial,sans-serif;fill:#1f2937}.b{font:16px Arial,sans-serif;fill:#374151}.s{font:14px Arial,sans-serif;fill:#475569}.m{font:italic 20px Georgia,serif;fill:#111827}.box{fill:#fff;stroke:#64748b;stroke-width:2}.a{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#ar)}</style></defs>
  <rect width="1200" height="620" fill="#f8fafc"/>
  <text x="600" y="42" text-anchor="middle" class="t">PAC learning: accuracy and confidence are different promises</text>

  <rect x="45" y="84" width="288" height="425" rx="8" class="box"/>
  <text x="189" y="118" text-anchor="middle" class="h">Repeat the sampling process</text>
  <g fill="#dbeafe" stroke="#2563eb" stroke-width="2">
    <rect x="78" y="150" width="220" height="48" rx="6"/><rect x="78" y="218" width="220" height="48" rx="6"/><rect x="78" y="286" width="220" height="48" rx="6"/><rect x="78" y="354" width="220" height="48" rx="6"/>
  </g>
  <text x="188" y="180" text-anchor="middle" class="b">S₁ ∼ Pⁿ → ĥ₁</text><text x="188" y="248" text-anchor="middle" class="b">S₂ ∼ Pⁿ → ĥ₂</text><text x="188" y="316" text-anchor="middle" class="b">S₃ ∼ Pⁿ → ĥ₃</text><text x="188" y="384" text-anchor="middle" class="b">⋮</text>
  <text x="189" y="449" text-anchor="middle" class="s">randomness comes from S</text>
  <text x="189" y="476" text-anchor="middle" class="s">and sometimes the algorithm</text>

  <path d="M333 294 H425" class="a"/>
  <text x="379" y="277" text-anchor="middle" class="s">evaluate</text>

  <rect x="427" y="84" width="728" height="425" rx="8" class="box"/>
  <text x="791" y="118" text-anchor="middle" class="h">Distribution over learned models</text>
  <line x1="493" y1="360" x2="1091" y2="360" stroke="#475569" stroke-width="3"/>
  <text x="493" y="393" text-anchor="middle" class="s">risk 0</text><text x="1091" y="393" text-anchor="middle" class="s">larger risk</text>
  <rect x="493" y="190" width="315" height="170" fill="#dcfce7" opacity="0.75"/>
  <line x1="808" y1="175" x2="808" y2="375" stroke="#d97706" stroke-width="3" stroke-dasharray="8 7"/>
  <text x="808" y="158" text-anchor="middle" class="m">ε</text>
  <circle cx="557" cy="321" r="9" fill="#16a34a"/><circle cx="611" cy="284" r="9" fill="#16a34a"/><circle cx="672" cy="335" r="9" fill="#16a34a"/><circle cx="726" cy="254" r="9" fill="#16a34a"/><circle cx="774" cy="307" r="9" fill="#16a34a"/>
  <circle cx="891" cy="242" r="9" fill="#dc2626"/><circle cx="966" cy="301" r="9" fill="#dc2626"/>
  <text x="650" y="220" text-anchor="middle" class="h" fill="#166534">good samples: at least 1 − δ</text>
  <text x="965" y="220" text-anchor="middle" class="h" fill="#991b1b">failure: at most δ</text>
  <text x="791" y="437" text-anchor="middle" class="m">Prₛ(R(ĥₛ) ≤ ε) ≥ 1 − δ</text>
  <text x="791" y="472" text-anchor="middle" class="s">ε controls approximation quality; δ controls confidence across samples.</text>

  <rect x="45" y="540" width="1110" height="52" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
  <text x="600" y="572" text-anchor="middle" class="b">PAC is not a promise that every training set works; it bounds how often a finite sample leads the learner astray.</text>
</svg>
