<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Kernel density bandwidth comparison</title>
  <desc id="desc">Three panels use the same observations to show an undersmoothed, useful, and oversmoothed kernel density estimate.</desc>
  <defs><style>.h{font:700 25px Arial,sans-serif;fill:#17212b}.t{font:18px Arial,sans-serif;fill:#334155}.s{font:15px Arial,sans-serif;fill:#526172}.panel{fill:#f8fafc;stroke:#94a3b8;stroke-width:2}.axis{stroke:#64748b;stroke-width:2}.curve{fill:none;stroke:#2563eb;stroke-width:5}.rug{stroke:#e8590c;stroke-width:4}</style></defs>
  <rect width="1200" height="600" fill="#fff"/>
  <text x="600" y="42" text-anchor="middle" class="h">KDE bandwidth controls the bias-variance trade-off</text>
  <rect x="28" y="85" width="360" height="420" rx="8" class="panel"/><rect x="420" y="85" width="360" height="420" rx="8" class="panel"/><rect x="812" y="85" width="360" height="420" rx="8" class="panel"/>
  <text x="208" y="125" text-anchor="middle" class="h">Too small h</text><text x="600" y="125" text-anchor="middle" class="h">Useful h</text><text x="992" y="125" text-anchor="middle" class="h">Too large h</text>
  <line x1="65" y1="425" x2="350" y2="425" class="axis"/><line x1="457" y1="425" x2="742" y2="425" class="axis"/><line x1="849" y1="425" x2="1134" y2="425" class="axis"/>
  <path d="M65 424 C80 420 84 300 98 424 C112 424 118 240 135 424 C150 424 160 280 176 424 C195 424 202 205 220 424 C242 424 250 260 267 424 C285 424 298 310 313 424 C330 424 338 365 350 424" class="curve"/>
  <path d="M457 423 C480 420 495 365 520 330 C550 285 578 280 603 325 C625 365 643 360 665 320 C690 274 720 315 742 423" class="curve"/>
  <path d="M849 424 C880 418 900 380 930 325 C960 270 1000 245 1036 275 C1080 310 1105 380 1134 424" class="curve"/>
  <g class="rug"><line x1="92" y1="425" x2="92" y2="405"/><line x1="126" y1="425" x2="126" y2="405"/><line x1="167" y1="425" x2="167" y2="405"/><line x1="213" y1="425" x2="213" y2="405"/><line x1="260" y1="425" x2="260" y2="405"/><line x1="306" y1="425" x2="306" y2="405"/>
  <line x1="484" y1="425" x2="484" y2="405"/><line x1="518" y1="425" x2="518" y2="405"/><line x1="559" y1="425" x2="559" y2="405"/><line x1="605" y1="425" x2="605" y2="405"/><line x1="652" y1="425" x2="652" y2="405"/><line x1="698" y1="425" x2="698" y2="405"/>
  <line x1="876" y1="425" x2="876" y2="405"/><line x1="910" y1="425" x2="910" y2="405"/><line x1="951" y1="425" x2="951" y2="405"/><line x1="997" y1="425" x2="997" y2="405"/><line x1="1044" y1="425" x2="1044" y2="405"/><line x1="1090" y1="425" x2="1090" y2="405"/></g>
  <text x="208" y="467" text-anchor="middle" class="t">High variance</text><text x="600" y="467" text-anchor="middle" class="t">Structure without every fluctuation</text><text x="992" y="467" text-anchor="middle" class="t">High bias</text>
  <text x="208" y="492" text-anchor="middle" class="s">Fits sampling noise</text><text x="600" y="492" text-anchor="middle" class="s">Select with held-out likelihood</text><text x="992" y="492" text-anchor="middle" class="s">Merges meaningful modes</text>
  <rect x="160" y="535" width="880" height="42" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="600" y="562" text-anchor="middle" class="t">The data points are identical in all three panels; only the bandwidth changes.</text>
</svg>
