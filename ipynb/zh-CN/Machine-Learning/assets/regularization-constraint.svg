<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#334155"/></marker><style>.t{font:700 28px Arial,sans-serif;fill:#1f2937}.h{font:700 20px Arial,sans-serif;fill:#1f2937}.b{font:16px Arial,sans-serif;fill:#374151}.s{font:14px Arial,sans-serif;fill:#475569}.m{font:italic 18px Georgia,serif;fill:#111827}.box{fill:#fff;stroke:#64748b;stroke-width:2}.ar{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="640" fill="#f8fafc"/><text x="600" y="42" text-anchor="middle" class="t">Penalties and constraints express the same trade-off in two languages</text>
  <rect x="42" y="82" width="520" height="230" rx="8" class="box"/><text x="302" y="119" text-anchor="middle" class="h">Penalized form</text>
  <text x="302" y="170" text-anchor="middle" class="m">training loss + λ × complexity</text>
  <line x1="100" y1="226" x2="504" y2="226" stroke="#cbd5e1" stroke-width="14" stroke-linecap="round"/><circle cx="196" cy="226" r="12" fill="#2563eb"/><circle cx="428" cy="226" r="12" fill="#d97706"/>
  <text x="196" y="263" text-anchor="middle" class="b">small λ: fit dominates</text><text x="428" y="263" text-anchor="middle" class="b">large λ: penalty dominates</text>
  <rect x="638" y="82" width="520" height="230" rx="8" class="box"/><text x="898" y="119" text-anchor="middle" class="h">Constrained form</text>
  <text x="898" y="170" text-anchor="middle" class="m">minimize training loss subject to complexity ≤ c</text>
  <rect x="746" y="201" width="304" height="67" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="898" y="242" text-anchor="middle" class="b">feasible parameter set</text>
  <path d="M562 197 H630" class="ar"/><text x="596" y="181" text-anchor="middle" class="s">paired solutions</text>

  <rect x="42" y="354" width="1116" height="230" rx="8" class="box"/><text x="600" y="391" text-anchor="middle" class="h">Geometry explains different coefficient patterns</text>
  <g transform="translate(160 421)"><path d="M0 72H235M117 -10V158" stroke="#64748b" stroke-width="2"/><path d="M42 72 L117 -3 L192 72 L117 147 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><ellipse cx="183" cy="17" rx="117" ry="72" transform="rotate(-28 183 17)" fill="none" stroke="#ef4444" stroke-width="3"/><circle cx="117" cy="-3" r="7" fill="#111827"/><text x="117" y="183" text-anchor="middle" class="b">L1 corner encourages zeros</text></g>
  <g transform="translate(650 421)"><path d="M0 72H235M117 -10V158" stroke="#64748b" stroke-width="2"/><circle cx="117" cy="72" r="74" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><ellipse cx="183" cy="17" rx="117" ry="72" transform="rotate(-28 183 17)" fill="none" stroke="#ef4444" stroke-width="3"/><circle cx="168" cy="18" r="7" fill="#111827"/><text x="117" y="183" text-anchor="middle" class="b">L2 boundary shrinks smoothly</text></g>
  <text x="1055" y="458" text-anchor="middle" class="b">Elastic net</text><text x="1055" y="488" text-anchor="middle" class="s">combines L1 sparsity</text><text x="1055" y="512" text-anchor="middle" class="s">with L2 stabilization</text><text x="1055" y="548" text-anchor="middle" class="s">especially for correlated features</text>
</svg>
