<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="395" viewBox="0 0 1000 395" role="img" aria-labelledby="title desc">
<title id="title">An intervention replaces one structural equation</title>
<desc id="desc">The do-operator removes the natural treatment mechanism while retaining downstream causal mechanisms.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
  </marker>
</defs>
<style>
text { font-family: Arial, Helvetica, sans-serif; letter-spacing: 0; fill: #1f2937; }
.title { font-size: 25px; font-weight: 700; }
.subtitle { font-size: 14px; fill: #4b5563; }
.head { font-size: 16px; font-weight: 700; }
.body { font-size: 13px; }
.small { font-size: 12px; fill: #4b5563; }
.formula { font-family: "Courier New", monospace; font-size: 13px; }
.box { stroke-width: 1.4; rx: 7; }
.arrow { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#arrow); }
.dash { stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 7 5; fill: none; marker-end: url(#arrow); }
.blocked { stroke: #dc2626; stroke-width: 3; }
</style>
<rect width="1000" height="395" fill="#ffffff"/>
<text x="40" y="42" class="title" text-anchor="start">An intervention replaces one structural equation</text>
<text x="40" y="68" class="subtitle" text-anchor="start">The do-operator removes the natural treatment mechanism while retaining downstream causal mechanisms.</text>
<rect x="35" y="115" width="240" height="190" class="box" fill="#dbeafe" stroke="#374151"/><text x="155" y="143" class="head" text-anchor="middle">Observed SCM</text><text x="49" y="169" class="body" text-anchor="start"><tspan x="49" dy="0">C := f_C(U_C)</tspan><tspan x="49" dy="19">T := f_T(C, U_T)</tspan><tspan x="49" dy="19">Y := f_Y(T, C, U_Y)</tspan></text><path d="M 275 210 L 375 210" class="arrow"/><text x="325" y="202" class="small" text-anchor="middle">do(T=t)</text><rect x="375" y="115" width="250" height="190" class="box" fill="#fef3c7" stroke="#374151"/><text x="500" y="143" class="head" text-anchor="middle">Surgical intervention</text><text x="389" y="169" class="body" text-anchor="start"><tspan x="389" dy="0">Keep all other equations</tspan><tspan x="389" dy="19">Replace only:</tspan><tspan x="389" dy="19">T := t</tspan></text><path d="M 625 210 L 725 210" class="arrow"/><text x="675" y="202" class="small" text-anchor="middle">simulate</text><rect x="725" y="115" width="240" height="190" class="box" fill="#dcfce7" stroke="#374151"/><text x="845" y="143" class="head" text-anchor="middle">Interventional world</text><text x="739" y="169" class="body" text-anchor="start"><tspan x="739" dy="0">C keeps its causes</tspan><tspan x="739" dy="19">T no longer has parents</tspan><tspan x="739" dy="19">Y responds downstream</tspan></text><text x="500" y="350" class="head" text-anchor="middle">Modularity: an intervention changes one mechanism, not the entire joint distribution.</text>
</svg>
