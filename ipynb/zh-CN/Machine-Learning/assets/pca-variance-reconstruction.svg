<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">PCA variance maximization and reconstruction</title><desc id="desc">Correlated points are projected onto the first principal direction and reconstructed, with orthogonal residuals representing discarded variance.</desc>
  <defs><style>.h{font:700 25px Arial,sans-serif;fill:#17212b}.t{font:18px Arial,sans-serif;fill:#334155}.s{font:15px Arial,sans-serif;fill:#526172}.axis{stroke:#64748b;stroke-width:2}.pc1{stroke:#2563eb;stroke-width:5}.pc2{stroke:#16a34a;stroke-width:4}.res{stroke:#e8590c;stroke-width:2;stroke-dasharray:7 5}.p{fill:#334155}.q{fill:#2563eb}</style></defs>
  <rect width="1200" height="620" fill="#fff"/><text x="600" y="42" text-anchor="middle" class="h">PCA: retain maximum variance and minimize squared reconstruction error</text>
  <rect x="35" y="85" width="700" height="455" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><line x1="100" y1="470" x2="680" y2="470" class="axis"/><line x1="140" y1="510" x2="140" y2="120" class="axis"/><line x1="105" y1="465" x2="660" y2="160" class="pc1"/><line x1="290" y1="120" x2="500" y2="510" class="pc2"/><text x="650" y="145" class="t">PC1</text><text x="500" y="500" class="t">PC2</text>
  <g class="res"><line x1="210" y1="390" x2="220" y2="402"/><line x1="270" y1="325" x2="289" y2="364"/><line x1="350" y1="350" x2="336" y2="337"/><line x1="410" y1="270" x2="413" y2="296"/><line x1="480" y1="225" x2="481" y2="258"/><line x1="555" y1="245" x2="533" y2="229"/><line x1="600" y1="175" x2="598" y2="194"/></g>
  <g class="p"><circle cx="210" cy="390" r="8"/><circle cx="270" cy="325" r="8"/><circle cx="350" cy="350" r="8"/><circle cx="410" cy="270" r="8"/><circle cx="480" cy="225" r="8"/><circle cx="555" cy="245" r="8"/><circle cx="600" cy="175" r="8"/></g><g class="q"><circle cx="220" cy="402" r="6"/><circle cx="289" cy="364" r="6"/><circle cx="336" cy="337" r="6"/><circle cx="413" cy="296" r="6"/><circle cx="481" cy="258" r="6"/><circle cx="533" cy="229" r="6"/><circle cx="598" cy="194" r="6"/></g><text x="385" y="525" text-anchor="middle" class="s">Orange residuals are perpendicular reconstruction errors</text>
  <rect x="770" y="85" width="395" height="455" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="967" y="125" text-anchor="middle" class="h">Equivalent views</text><rect x="820" y="165" width="295" height="80" rx="6" fill="#dbeafe"/><text x="967" y="198" text-anchor="middle" class="t">Maximize projected variance</text><text x="967" y="225" text-anchor="middle" class="s">max w^T Sigma w, subject to ||w||_2 = 1</text><text x="967" y="282" text-anchor="middle" class="h">equivalent to</text><rect x="820" y="310" width="295" height="80" rx="6" fill="#dcfce7"/><text x="967" y="343" text-anchor="middle" class="t">Minimize reconstruction error</text><text x="967" y="370" text-anchor="middle" class="s">min ||X - XWW^T||_F^2</text><rect x="820" y="430" width="295" height="65" rx="6" fill="#fff7ed"/><text x="967" y="458" text-anchor="middle" class="t">Only after centering X</text><text x="967" y="482" text-anchor="middle" class="s">scale if units should be comparable</text><text x="600" y="585" text-anchor="middle" class="t">Principal-component signs may flip without changing the subspace or reconstruction.</text>
</svg>
