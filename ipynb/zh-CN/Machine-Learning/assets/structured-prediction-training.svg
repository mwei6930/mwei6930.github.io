<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Structured prediction training loop</title>
  <desc id="desc">A feature map and parameters score complete outputs, inference finds the best or loss-augmented output, and the discrepancy with the gold structure updates the parameters.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#495057"/></marker><style>.box{stroke:#495057;stroke-width:2}.h{font:700 22px Arial,sans-serif;fill:#212529}.t{font:17px Arial,sans-serif;fill:#343a40}.s{font:15px Arial,sans-serif;fill:#495057}.line{stroke:#495057;stroke-width:2.5;fill:none;marker-end:url(#a)}</style></defs>
  <text x="600" y="38" text-anchor="middle" class="h">Learning Requires Inference Inside the Training Loop</text>
  <rect x="40" y="130" width="180" height="120" rx="6" class="box" fill="#e7f5ff"/><text x="130" y="170" text-anchor="middle" class="h">Input x</text><text x="130" y="203" text-anchor="middle" class="s">tokens, image, graph</text>
  <path d="M220 190 H275" class="line"/><rect x="285" y="115" width="235" height="150" rx="6" class="box" fill="#ebfbee"/><text x="402" y="155" text-anchor="middle" class="h">Score structures</text><text x="402" y="190" text-anchor="middle" class="t">w dot Phi(x, y)</text><text x="402" y="223" text-anchor="middle" class="s">local terms permit dynamic programming</text>
  <path d="M520 190 H575" class="line"/><rect x="585" y="105" width="245" height="170" rx="6" class="box" fill="#fff3bf"/><text x="707" y="145" text-anchor="middle" class="h">Inference oracle</text><text x="707" y="180" text-anchor="middle" class="t">argmax y score(x,y)</text><text x="707" y="214" text-anchor="middle" class="t">or score + task loss</text><text x="707" y="246" text-anchor="middle" class="s">Viterbi, CKY, matching, flow</text>
  <path d="M830 190 H885" class="line"/><rect x="895" y="130" width="260" height="120" rx="6" class="box" fill="#ffe8cc"/><text x="1025" y="170" text-anchor="middle" class="h">Predicted structure</text><text x="1025" y="205" text-anchor="middle" class="t">y-hat</text>
  <rect x="430" y="360" width="340" height="120" rx="6" class="box" fill="#f3f0ff"/><text x="600" y="400" text-anchor="middle" class="h">Compare with gold y</text><text x="600" y="435" text-anchor="middle" class="t">update from Phi(x,y) - Phi(x,y-hat)</text><text x="600" y="463" text-anchor="middle" class="s">perceptron, margin, or log-likelihood objective</text>
  <path d="M1025 250 V320 H770 V352" class="line"/><path d="M430 420 H260 V285 H390" class="line"/>
  <text x="600" y="525" text-anchor="middle" class="s">A tractable decomposition is valuable because the same inference routine supports prediction, learning, and diagnostics.</text>
</svg>
