<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Graphical model families and their questions</title>
  <desc id="desc">A shared distribution branches into directed Bayesian networks, undirected Markov random fields, factor graphs, and sequential specializations such as HMMs and CRFs.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#495057"/></marker>
    <style>.box{stroke:#495057;stroke-width:2;rx:6}.h{font:700 23px Arial,sans-serif;fill:#212529}.t{font:17px Arial,sans-serif;fill:#343a40}.s{font:15px Arial,sans-serif;fill:#495057}.line{stroke:#495057;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.node{stroke:#343a40;stroke-width:2}</style>
  </defs>
  <text x="600" y="38" text-anchor="middle" class="h">One Joint Distribution, Several Structural Languages</text>
  <rect x="420" y="70" width="360" height="92" class="box" fill="#fff3bf"/>
  <text x="600" y="108" text-anchor="middle" class="h">Variables and Dependencies</text>
  <text x="600" y="138" text-anchor="middle" class="s">What factors locally determine the global distribution?</text>
  <path d="M500 162 L245 238" class="line"/><path d="M570 162 L475 238" class="line"/><path d="M630 162 L725 238" class="line"/><path d="M700 162 L955 238" class="line"/>
  <rect x="45" y="245" width="250" height="185" class="box" fill="#e7f5ff"/>
  <text x="170" y="280" text-anchor="middle" class="h">Bayesian Network</text><text x="170" y="310" text-anchor="middle" class="s">Directed acyclic graph</text>
  <circle cx="110" cy="360" r="20" class="node" fill="#fff"/><circle cx="230" cy="360" r="20" class="node" fill="#fff"/><circle cx="170" cy="405" r="20" class="node" fill="#fff"/>
  <path d="M130 360 H200" class="line"/><path d="M120 374 L150 394" class="line"/><path d="M220 374 L190 394" class="line"/>
  <rect x="320" y="245" width="250" height="185" class="box" fill="#ebfbee"/>
  <text x="445" y="280" text-anchor="middle" class="h">Markov Network</text><text x="445" y="310" text-anchor="middle" class="s">Undirected compatibility</text>
  <circle cx="390" cy="355" r="20" class="node" fill="#fff"/><circle cx="500" cy="355" r="20" class="node" fill="#fff"/><circle cx="445" cy="405" r="20" class="node" fill="#fff"/>
  <path d="M410 355 H480 M402 370 L430 393 M488 370 L460 393" stroke="#495057" stroke-width="3"/>
  <rect x="595" y="245" width="250" height="185" class="box" fill="#ffe8cc"/>
  <text x="720" y="280" text-anchor="middle" class="h">Factor Graph</text><text x="720" y="310" text-anchor="middle" class="s">Variables separated from factors</text>
  <circle cx="650" cy="380" r="19" class="node" fill="#fff"/><circle cx="790" cy="380" r="19" class="node" fill="#fff"/><rect x="702" y="360" width="36" height="36" class="node" fill="#ffd8a8"/>
  <path d="M669 380 H702 M738 380 H771" stroke="#495057" stroke-width="3"/>
  <rect x="870" y="245" width="285" height="185" class="box" fill="#f3f0ff"/>
  <text x="1012" y="280" text-anchor="middle" class="h">Sequential Models</text><text x="1012" y="310" text-anchor="middle" class="s">Repeated structure through time</text>
  <circle cx="925" cy="365" r="18" class="node" fill="#fff"/><circle cx="1010" cy="365" r="18" class="node" fill="#fff"/><circle cx="1095" cy="365" r="18" class="node" fill="#fff"/>
  <path d="M943 365 H982 M1028 365 H1067" class="line"/><text x="1010" y="414" text-anchor="middle" class="s">HMM, dynamic BN, linear-chain CRF</text>
  <rect x="110" y="485" width="980" height="90" class="box" fill="#f8f9fa"/>
  <text x="600" y="520" text-anchor="middle" class="h">Shared workflow</text>
  <text x="600" y="551" text-anchor="middle" class="t">Represent local structure  ->  learn potentials or parameters  ->  infer marginals or the best structure</text>
</svg>
