<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="395" viewBox="0 0 1000 395" role="img" aria-labelledby="title desc">
<title id="title">ATE, ATT, ATC, and CATE answer different questions</title>
<desc id="desc">Treatment effect summaries differ by target population and conditioning variables.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
  </marker>
</defs>
<style>
text { font-family: Arial, Helvetica, sans-serif; letter-spacing: 0; fill: #1f2937; }
.title { font-size: 25px; font-weight: 700; }
.subtitle { font-size: 14px; fill: #4b5563; }
.head { font-size: 16px; font-weight: 700; }
.body { font-size: 13px; }
.small { font-size: 12px; fill: #4b5563; }
.formula { font-family: "Courier New", monospace; font-size: 13px; }
.box { stroke-width: 1.4; rx: 7; }
.arrow { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#arrow); }
.dash { stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 7 5; fill: none; marker-end: url(#arrow); }
.blocked { stroke: #dc2626; stroke-width: 3; }
</style>
<rect width="1000" height="395" fill="#ffffff"/>
<text x="40" y="42" class="title" text-anchor="start">ATE, ATT, ATC, and CATE answer different questions</text>
<text x="40" y="68" class="subtitle" text-anchor="start">Treatment effect summaries differ by target population and conditioning variables.</text>
<rect x="35" y="110" width="210" height="200" class="box" fill="#dbeafe" stroke="#374151"/><text x="140" y="138" class="head" text-anchor="middle">ATE</text><text x="49" y="164" class="body" text-anchor="start"><tspan x="49" dy="0">E[Y(1)-Y(0)]</tspan><tspan x="49" dy="19">Target population</tspan><tspan x="49" dy="19">Policy-wide average</tspan></text><rect x="275" y="110" width="210" height="200" class="box" fill="#dcfce7" stroke="#374151"/><text x="380" y="138" class="head" text-anchor="middle">ATT</text><text x="289" y="164" class="body" text-anchor="start"><tspan x="289" dy="0">E[Y(1)-Y(0)|T=1]</tspan><tspan x="289" dy="19">Actually treated</tspan><tspan x="289" dy="19">Selection matters</tspan></text><rect x="515" y="110" width="210" height="200" class="box" fill="#fef3c7" stroke="#374151"/><text x="620" y="138" class="head" text-anchor="middle">ATC</text><text x="529" y="164" class="body" text-anchor="start"><tspan x="529" dy="0">E[Y(1)-Y(0)|T=0]</tspan><tspan x="529" dy="19">Actually untreated</tspan><tspan x="529" dy="19">Different population</tspan></text><rect x="755" y="110" width="210" height="200" class="box" fill="#fee2e2" stroke="#374151"/><text x="860" y="138" class="head" text-anchor="middle">CATE</text><text x="769" y="164" class="body" text-anchor="start"><tspan x="769" dy="0">E[Y(1)-Y(0)|X=x]</tspan><tspan x="769" dy="19">Conditional subgroup</tspan><tspan x="769" dy="19">Heterogeneity</tspan></text><text x="500" y="350" class="head" text-anchor="middle">The estimand fixes the population and aggregation before an estimator is chosen.</text>
</svg>
