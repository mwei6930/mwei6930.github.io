<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
<title id="title">Choose a causal method only after defining the question and design</title>
<desc id="desc">A causal workflow moves from intervention question to design, estimand, identification, and finally estimation.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
  </marker>
</defs>
<style>
text { font-family: Arial, Helvetica, sans-serif; letter-spacing: 0; fill: #1f2937; }
.title { font-size: 25px; font-weight: 700; }
.subtitle { font-size: 14px; fill: #4b5563; }
.head { font-size: 16px; font-weight: 700; }
.body { font-size: 13px; }
.small { font-size: 12px; fill: #4b5563; }
.formula { font-family: "Courier New", monospace; font-size: 13px; }
.box { stroke-width: 1.4; rx: 7; }
.arrow { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#arrow); }
.dash { stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 7 5; fill: none; marker-end: url(#arrow); }
.blocked { stroke: #dc2626; stroke-width: 3; }
</style>
<rect width="1000" height="430" fill="#ffffff"/>
<text x="40" y="42" class="title" text-anchor="start">Choose a causal method only after defining the question and design</text>
<text x="40" y="68" class="subtitle" text-anchor="start">A causal workflow moves from intervention question to design, estimand, identification, and finally estimation.</text>
<rect x="35" y="105" width="210" height="235" class="box" fill="#dbeafe" stroke="#374151"/><text x="140" y="133" class="head" text-anchor="middle">Question</text><text x="49" y="159" class="body" text-anchor="start"><tspan x="49" dy="0">Is the goal prediction</tspan><tspan x="49" dy="19">or an intervention effect?</tspan><tspan x="49" dy="19">Define decision and time</tspan></text><path d="M 245 220 L 315 220" class="arrow"/><rect x="315" y="105" width="210" height="235" class="box" fill="#dcfce7" stroke="#374151"/><text x="420" y="133" class="head" text-anchor="middle">Design</text><text x="329" y="159" class="body" text-anchor="start"><tspan x="329" dy="0">Can treatment be randomized?</tspan><tspan x="329" dy="19">Is a natural experiment valid?</tspan><tspan x="329" dy="19">What is observed?</tspan></text><path d="M 525 220 L 595 220" class="arrow"/><rect x="595" y="105" width="180" height="235" class="box" fill="#fef3c7" stroke="#374151"/><text x="685" y="133" class="head" text-anchor="middle">Estimand</text><text x="609" y="159" class="body" text-anchor="start"><tspan x="609" dy="0">ATE / ATT / CATE</tspan><tspan x="609" dy="19">Population</tspan><tspan x="609" dy="19">Horizon</tspan></text><path d="M 775 220 L 825 220" class="arrow"/><rect x="825" y="105" width="140" height="235" class="box" fill="#fee2e2" stroke="#374151"/><text x="895" y="133" class="head" text-anchor="middle">Method</text><text x="839" y="159" class="body" text-anchor="start"><tspan x="839" dy="0">Only now</tspan><tspan x="839" dy="19">choose an</tspan><tspan x="839" dy="19">estimator</tspan></text><text x="500" y="382" class="head" text-anchor="middle">The algorithm is the last design choice, not the first.</text>
</svg>
