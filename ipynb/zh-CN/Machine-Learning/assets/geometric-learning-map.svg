<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Geometric learning pipeline</title>
  <desc id="desc">Features and preprocessing define a geometry. Neighborhood, margin, and kernel methods use that geometry in different ways.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <style>.title{font:700 29px Arial,sans-serif;fill:#0f172a}.head{font:700 18px Arial,sans-serif;fill:#0f172a}.body{font:15px Arial,sans-serif;fill:#1e293b}.small{font:13px Arial,sans-serif;fill:#475569}</style>
  </defs>
  <rect width="1200" height="650" fill="#f8fafc"/>
  <text x="600" y="44" text-anchor="middle" class="title">A geometric model begins before the estimator</text>

  <rect x="55" y="105" width="235" height="235" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="172" y="140" text-anchor="middle" class="head">Representation</text>
  <text x="80" y="181" class="body">numeric scaling</text>
  <text x="80" y="215" class="body">categorical encoding</text>
  <text x="80" y="249" class="body">feature selection</text>
  <text x="80" y="283" class="body">embedding or projection</text>
  <rect x="78" y="302" width="189" height="23" rx="4" fill="#dbeafe"/>
  <text x="172" y="319" text-anchor="middle" class="small">changes every distance</text>

  <line x1="290" y1="222" x2="390" y2="222" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="405" y="105" width="260" height="235" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="535" y="140" text-anchor="middle" class="head">Geometry</text>
  <text x="430" y="181" class="body">distance d(x, z)</text>
  <text x="430" y="215" class="body">similarity K(x, z)</text>
  <text x="430" y="249" class="body">inner product x^T z</text>
  <text x="430" y="283" class="body">local density and scale</text>
  <rect x="428" y="302" width="214" height="23" rx="4" fill="#dcfce7"/>
  <text x="535" y="319" text-anchor="middle" class="small">encodes the inductive bias</text>

  <line x1="665" y1="222" x2="750" y2="222" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="770" y="82" width="365" height="310" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="952" y="118" text-anchor="middle" class="head">Three ways to use the geometry</text>

  <rect x="800" y="142" width="305" height="62" rx="6" fill="#fff7ed" stroke="#f97316"/>
  <text x="820" y="169" class="head">Neighborhood</text>
  <text x="820" y="191" class="small">predict from nearby stored observations</text>

  <rect x="800" y="220" width="305" height="62" rx="6" fill="#fef2f2" stroke="#dc2626"/>
  <text x="820" y="247" class="head">Margin</text>
  <text x="820" y="269" class="small">place a boundary far from critical cases</text>

  <rect x="800" y="298" width="305" height="62" rx="6" fill="#faf5ff" stroke="#7c3aed"/>
  <text x="820" y="325" class="head">Kernel</text>
  <text x="820" y="347" class="small">learn linearly from pairwise similarities</text>

  <rect x="120" y="430" width="960" height="140" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <text x="600" y="468" text-anchor="middle" class="head">The central question is: which observations should influence one another?</text>
  <line x1="180" y1="493" x2="1020" y2="493" stroke="#cbd5e1"/>
  <text x="180" y="525" class="body">KNN uses the k nearest stored points.</text>
  <text x="620" y="525" class="body">SVM uses support vectors near the margin.</text>
  <text x="180" y="552" class="body">Kernel methods weight pairwise similarities.</text>
  <text x="620" y="552" class="body">Scaling and dimension reshape all three.</text>
</svg>
