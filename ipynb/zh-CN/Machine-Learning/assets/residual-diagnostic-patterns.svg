<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Residual patterns and their likely interpretations</title>
  <desc id="desc">Four residual plots contrast random scatter, curvature, heteroscedasticity, and an influential high-leverage observation, with suggested responses.</desc>
  <defs>
    <style>.title{font:700 29px Arial,sans-serif;fill:#0f172a}.head{font:700 18px Arial,sans-serif;fill:#0f172a}.body{font:15px Arial,sans-serif;fill:#1e293b}.small{font:13px Arial,sans-serif;fill:#475569}.axis{stroke:#334155;stroke-width:1.6}.zero{stroke:#16a34a;stroke-width:2;stroke-dasharray:7 5}.point{fill:#2563eb;opacity:.82}</style>
  </defs>
  <rect width="1200" height="650" fill="#f8fafc"/>
  <text x="600" y="43" text-anchor="middle" class="title">Residual plots turn average error into a model-checking signal</text>

  <g transform="translate(35,85)">
    <rect width="270" height="455" rx="8" fill="#fff" stroke="#64748b" stroke-width="2"/>
    <text x="135" y="36" text-anchor="middle" class="head">Unstructured scatter</text>
    <line x1="42" y1="230" x2="242" y2="230" class="zero"/><line x1="42" y1="75" x2="42" y2="360" class="axis"/><line x1="42" y1="360" x2="242" y2="360" class="axis"/>
    <g class="point"><circle cx="60" cy="205" r="6"/><circle cx="78" cy="249" r="6"/><circle cx="96" cy="184" r="6"/><circle cx="114" cy="270" r="6"/><circle cx="132" cy="217" r="6"/><circle cx="150" cy="255" r="6"/><circle cx="168" cy="195" r="6"/><circle cx="186" cy="238" r="6"/><circle cx="204" cy="211" r="6"/><circle cx="226" cy="263" r="6"/></g>
    <text x="135" y="397" text-anchor="middle" class="body">mean structure is plausible</text>
    <text x="135" y="423" text-anchor="middle" class="small">still check groups, time, and tails</text>
  </g>

  <g transform="translate(325,85)">
    <rect width="270" height="455" rx="8" fill="#fff" stroke="#64748b" stroke-width="2"/>
    <text x="135" y="36" text-anchor="middle" class="head">Curvature</text>
    <line x1="42" y1="230" x2="242" y2="230" class="zero"/><line x1="42" y1="75" x2="42" y2="360" class="axis"/><line x1="42" y1="360" x2="242" y2="360" class="axis"/>
    <g class="point"><circle cx="58" cy="156" r="6"/><circle cx="78" cy="184" r="6"/><circle cx="98" cy="225" r="6"/><circle cx="118" cy="272" r="6"/><circle cx="138" cy="292" r="6"/><circle cx="158" cy="270" r="6"/><circle cx="178" cy="228" r="6"/><circle cx="198" cy="181" r="6"/><circle cx="222" cy="148" r="6"/></g>
    <text x="135" y="397" text-anchor="middle" class="body">missing nonlinear effect</text>
    <text x="135" y="423" text-anchor="middle" class="small">transform, add a basis, or revise features</text>
  </g>

  <g transform="translate(615,85)">
    <rect width="270" height="455" rx="8" fill="#fff" stroke="#64748b" stroke-width="2"/>
    <text x="135" y="36" text-anchor="middle" class="head">Funnel shape</text>
    <line x1="42" y1="230" x2="242" y2="230" class="zero"/><line x1="42" y1="75" x2="42" y2="360" class="axis"/><line x1="42" y1="360" x2="242" y2="360" class="axis"/>
    <g class="point"><circle cx="60" cy="219" r="6"/><circle cx="60" cy="240" r="6"/><circle cx="90" cy="207" r="6"/><circle cx="90" cy="252" r="6"/><circle cx="120" cy="188" r="6"/><circle cx="120" cy="273" r="6"/><circle cx="150" cy="167" r="6"/><circle cx="150" cy="294" r="6"/><circle cx="185" cy="137" r="6"/><circle cx="185" cy="319" r="6"/><circle cx="225" cy="110" r="6"/><circle cx="225" cy="342" r="6"/></g>
    <text x="135" y="397" text-anchor="middle" class="body">nonconstant conditional variance</text>
    <text x="135" y="423" text-anchor="middle" class="small">robust SE, weights, transform, or GLM</text>
  </g>

  <g transform="translate(905,85)">
    <rect width="260" height="455" rx="8" fill="#fff" stroke="#64748b" stroke-width="2"/>
    <text x="130" y="36" text-anchor="middle" class="head">Influential case</text>
    <line x1="38" y1="230" x2="232" y2="230" class="zero"/><line x1="38" y1="75" x2="38" y2="360" class="axis"/><line x1="38" y1="360" x2="232" y2="360" class="axis"/>
    <g class="point"><circle cx="58" cy="218" r="6"/><circle cx="76" cy="247" r="6"/><circle cx="94" cy="194" r="6"/><circle cx="112" cy="255" r="6"/><circle cx="130" cy="211" r="6"/><circle cx="148" cy="239" r="6"/></g>
    <circle cx="220" cy="112" r="12" fill="#dc2626"/><circle cx="220" cy="112" r="23" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="130" y="397" text-anchor="middle" class="body">high leverage plus large residual</text>
    <text x="130" y="423" text-anchor="middle" class="small">verify provenance and assess Cook's D</text>
  </g>

  <text x="600" y="583" text-anchor="middle" class="body">A diagnostic pattern suggests a hypothesis; it does not automatically prescribe deleting observations.</text>
  <text x="600" y="615" text-anchor="middle" class="small">For GLMs, inspect Pearson or deviance residuals on the appropriate mean-variance scale.</text>
</svg>
