<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Neural network training and regularization loop</title>
  <desc id="desc">Mini-batches enter forward and backward passes, an optimizer updates parameters, validation drives early stopping, while dropout and weight decay alter training.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#495057"/></marker><style>.h{font:700 24px Arial,sans-serif;fill:#212529}.t{font:700 17px Arial,sans-serif;fill:#343a40}.s{font:15px Arial,sans-serif;fill:#495057}.box{stroke:#495057;stroke-width:2;rx:6}.line{stroke:#495057;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style></defs>
  <text x="600" y="38" text-anchor="middle" class="h">Training Is an Optimization Loop with Generalization Guardrails</text>
  <rect x="35" y="190" width="160" height="110" class="box" fill="#e7f5ff"/><text x="115" y="235" text-anchor="middle" class="t">Mini-batch</text><text x="115" y="270" text-anchor="middle" class="s">X_B, y_B</text>
  <path d="M195 245 H250" class="line"/>
  <rect x="255" y="170" width="175" height="150" class="box" fill="#fff3bf"/><text x="342" y="215" text-anchor="middle" class="t">Forward pass</text><text x="342" y="250" text-anchor="middle" class="s">dropout masks</text><text x="342" y="282" text-anchor="middle" class="s">loss + weight decay</text>
  <path d="M430 245 H485" class="line"/>
  <rect x="490" y="170" width="175" height="150" class="box" fill="#ffe3e3"/><text x="577" y="215" text-anchor="middle" class="t">Backward pass</text><text x="577" y="250" text-anchor="middle" class="s">gradients</text><text x="577" y="282" text-anchor="middle" class="s">optional clipping</text>
  <path d="M665 245 H720" class="line"/>
  <rect x="725" y="170" width="175" height="150" class="box" fill="#d3f9d8"/><text x="812" y="215" text-anchor="middle" class="t">Optimizer step</text><text x="812" y="250" text-anchor="middle" class="s">SGD / momentum</text><text x="812" y="282" text-anchor="middle" class="s">Adam / AdamW</text>
  <path d="M900 245 H955" class="line"/>
  <rect x="960" y="170" width="205" height="150" class="box" fill="#f3d9fa"/><text x="1062" y="215" text-anchor="middle" class="t">Updated theta</text><text x="1062" y="250" text-anchor="middle" class="s">next mini-batch</text><text x="1062" y="282" text-anchor="middle" class="s">scheduled learning rate</text>
  <path d="M1062 320 C1062 390 115 390 115 300" class="line"/>
  <rect x="360" y="430" width="480" height="120" class="box" fill="#f8f9fa"/><text x="600" y="470" text-anchor="middle" class="t">Validation checkpoint</text><text x="600" y="505" text-anchor="middle" class="s">evaluation mode: dropout off, no parameter update</text><text x="600" y="535" text-anchor="middle" class="s">save best model; stop after patience is exhausted</text>
  <path d="M812 320 C812 390 700 390 690 430" class="line"/>
  <text x="600" y="600" text-anchor="middle" class="s">Optimization reduces training objective; regularization and validation control generalization.</text>
</svg>
