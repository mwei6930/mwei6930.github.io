<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="405" viewBox="0 0 1000 405" role="img" aria-labelledby="title desc">
<title id="title">Study design determines what assumptions estimation must carry</title>
<desc id="desc">Randomization identifies effects by design; observational analyses must emulate a well-defined target trial.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
  </marker>
</defs>
<style>
text { font-family: Arial, Helvetica, sans-serif; letter-spacing: 0; fill: #1f2937; }
.title { font-size: 25px; font-weight: 700; }
.subtitle { font-size: 14px; fill: #4b5563; }
.head { font-size: 16px; font-weight: 700; }
.body { font-size: 13px; }
.small { font-size: 12px; fill: #4b5563; }
.formula { font-family: "Courier New", monospace; font-size: 13px; }
.box { stroke-width: 1.4; rx: 7; }
.arrow { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#arrow); }
.dash { stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 7 5; fill: none; marker-end: url(#arrow); }
.blocked { stroke: #dc2626; stroke-width: 3; }
</style>
<rect width="1000" height="405" fill="#ffffff"/>
<text x="40" y="42" class="title" text-anchor="start">Study design determines what assumptions estimation must carry</text>
<text x="40" y="68" class="subtitle" text-anchor="start">Randomization identifies effects by design; observational analyses must emulate a well-defined target trial.</text>
<rect x="40" y="110" width="270" height="210" class="box" fill="#dcfce7" stroke="#374151"/><text x="175" y="138" class="head" text-anchor="middle">Randomized experiment</text><text x="54" y="164" class="body" text-anchor="start"><tspan x="54" dy="0">Assignment by protocol</tspan><tspan x="54" dy="19">T independent of baseline</tspan><tspan x="54" dy="19">Estimate by design</tspan></text><rect x="365" y="110" width="270" height="210" class="box" fill="#fef3c7" stroke="#374151"/><text x="500" y="138" class="head" text-anchor="middle">Observational study</text><text x="379" y="164" class="body" text-anchor="start"><tspan x="379" dy="0">Assignment by people/system</tspan><tspan x="379" dy="19">Common causes may remain</tspan><tspan x="379" dy="19">Identify by assumptions</tspan></text><rect x="690" y="110" width="270" height="210" class="box" fill="#dbeafe" stroke="#374151"/><text x="825" y="138" class="head" text-anchor="middle">Target trial</text><text x="704" y="164" class="body" text-anchor="start"><tspan x="704" dy="0">Eligibility and time zero</tspan><tspan x="704" dy="19">Treatment strategies</tspan><tspan x="704" dy="19">Outcome and estimand</tspan></text><path d="M 310 215 L 365 215" class="arrow"/><text x="337" y="207" class="small" text-anchor="middle">less control</text><path d="M 635 215 L 690 215" class="arrow"/><text x="662" y="207" class="small" text-anchor="middle">emulate explicitly</text><text x="500" y="360" class="head" text-anchor="middle">Analysis cannot repair an undefined treatment, outcome, population, or time origin.</text>
</svg>
