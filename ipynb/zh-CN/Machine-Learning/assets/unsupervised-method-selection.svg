<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">Selecting an unsupervised learning method</title>
  <desc id="desc">A decision flow from analytical goal and cluster assumption to K-Means, hierarchical, DBSCAN or HDBSCAN, spectral clustering, mixture models, density estimation, or anomaly detection.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#475569"/></marker><style>.h{font:700 23px Arial,sans-serif;fill:#17212b}.t{font:17px Arial,sans-serif;fill:#334155}.s{font:14px Arial,sans-serif;fill:#526172}.box{fill:#f8fafc;stroke:#64748b;stroke-width:2}.choice{fill:#eff6ff;stroke:#2563eb;stroke-width:3}.end{fill:#ecfdf5;stroke:#16a34a;stroke-width:3}.line{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1200" height="690" fill="#fff"/>
  <text x="600" y="40" text-anchor="middle" class="h">Choose the method from the question, not from the popularity of the algorithm</text>
  <rect x="445" y="72" width="310" height="70" rx="8" class="choice"/><text x="600" y="103" text-anchor="middle" class="h">What output do you need?</text><text x="600" y="129" text-anchor="middle" class="s">groups, density, or unusual observations</text>
  <path d="M520 145 L270 198" class="line"/><path d="M600 145 L600 198" class="line"/><path d="M680 145 L930 198" class="line"/>
  <rect x="95" y="202" width="350" height="72" rx="8" class="box"/><text x="270" y="233" text-anchor="middle" class="h">Partition or hierarchy</text><text x="270" y="258" text-anchor="middle" class="s">What should make points belong together?</text>
  <rect x="460" y="202" width="280" height="72" rx="8" class="box"/><text x="600" y="233" text-anchor="middle" class="h">Probability density</text><text x="600" y="258" text-anchor="middle" class="s">Need likelihood or uncertainty?</text>
  <rect x="755" y="202" width="350" height="72" rx="8" class="box"/><text x="930" y="233" text-anchor="middle" class="h">Anomaly ranking</text><text x="930" y="258" text-anchor="middle" class="s">Global, local, isolation, or boundary?</text>
  <path d="M175 278 L115 350" class="line"/><path d="M245 278 L250 350" class="line"/><path d="M325 278 L390 350" class="line"/>
  <rect x="25" y="354" width="180" height="100" rx="8" class="end"/><text x="115" y="388" text-anchor="middle" class="h">Centroid</text><text x="115" y="417" text-anchor="middle" class="t">K-Means</text><text x="115" y="442" text-anchor="middle" class="s">compact, scalable</text>
  <rect x="215" y="354" width="180" height="100" rx="8" class="end"/><text x="305" y="388" text-anchor="middle" class="h">Connectivity</text><text x="305" y="417" text-anchor="middle" class="t">Hierarchical</text><text x="305" y="442" text-anchor="middle" class="s">nested structure</text>
  <rect x="405" y="354" width="180" height="100" rx="8" class="end"/><text x="495" y="388" text-anchor="middle" class="h">Density / graph</text><text x="495" y="417" text-anchor="middle" class="t">DBSCAN / spectral</text><text x="495" y="442" text-anchor="middle" class="s">irregular shapes</text>
  <path d="M575 278 L575 350" class="line"/><path d="M655 278 L685 350" class="line"/>
  <rect x="535" y="354" width="190" height="100" rx="8" class="end"/><text x="630" y="388" text-anchor="middle" class="h">Parametric</text><text x="630" y="417" text-anchor="middle" class="t">Gaussian mixture</text><text x="630" y="442" text-anchor="middle" class="s">soft membership</text>
  <rect x="735" y="354" width="190" height="100" rx="8" class="end"/><text x="830" y="388" text-anchor="middle" class="h">Nonparametric</text><text x="830" y="417" text-anchor="middle" class="t">KDE</text><text x="830" y="442" text-anchor="middle" class="s">low-dimensional density</text>
  <path d="M900 278 L930 350" class="line"/>
  <rect x="935" y="354" width="240" height="100" rx="8" class="end"/><text x="1055" y="388" text-anchor="middle" class="h">Detector family</text><text x="1055" y="417" text-anchor="middle" class="t">LOF / IF / OC-SVM</text><text x="1055" y="442" text-anchor="middle" class="s">match scoring assumption</text>
  <path d="M600 470 L600 520" class="line"/>
  <rect x="245" y="524" width="710" height="108" rx="8" fill="#fff7ed" stroke="#e8590c" stroke-width="3"/>
  <text x="600" y="558" text-anchor="middle" class="h">Validate the representation and the conclusion</text>
  <text x="600" y="588" text-anchor="middle" class="t">scale and metric → sensitivity → stability → domain usefulness</text>
  <text x="600" y="615" text-anchor="middle" class="s">A “no convincing structure” conclusion is scientifically valid.</text>
  <text x="600" y="670" text-anchor="middle" class="t">Start with the simplest defensible baseline, then add flexibility only when diagnostics justify it.</text>
</svg>
