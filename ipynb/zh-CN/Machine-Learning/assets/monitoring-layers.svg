<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
<title id="title">Observe the system from infrastructure to outcomes</title>
<desc id="desc">System, data, model, and decision layers reveal different failure modes.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
  </marker>
</defs>
<style>
text { font-family: Arial, Helvetica, sans-serif; letter-spacing: 0; fill: #1f2937; }
.title { font-size: 25px; font-weight: 700; }
.subtitle { font-size: 14px; fill: #4b5563; }
.head { font-size: 16px; font-weight: 700; }
.body { font-size: 13px; }
.small { font-size: 12px; fill: #4b5563; }
.formula { font-family: "Courier New", monospace; font-size: 13px; }
.box { stroke-width: 1.4; rx: 7; }
.arrow { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#arrow); }
.dash { stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 7 5; fill: none; marker-end: url(#arrow); }
.line { stroke: #6b7280; stroke-width: 1.5; fill: none; }
</style>
<rect width="1000" height="420" fill="#ffffff"/>
<text x="40" y="42" class="title" text-anchor="start">Observe the system from infrastructure to outcomes</text>
<text x="40" y="68" class="subtitle" text-anchor="start">System, data, model, and decision layers reveal different failure modes.</text>
<rect x="35" y="110" width="210" height="225" class="box" fill="#dbeafe" stroke="#374151"/><text x="140" y="139" class="head" text-anchor="middle">System</text><text x="49" y="166" class="body" text-anchor="start"><tspan x="49" dy="0">availability</tspan><tspan x="49" dy="19">p50/p95/p99 latency</tspan><tspan x="49" dy="19">errors and saturation</tspan><tspan x="49" dy="19">cost per prediction</tspan></text><rect x="275" y="110" width="210" height="225" class="box" fill="#dcfce7" stroke="#374151"/><text x="380" y="139" class="head" text-anchor="middle">Data</text><text x="289" y="166" class="body" text-anchor="start"><tspan x="289" dy="0">schema and missingness</tspan><tspan x="289" dy="19">freshness</tspan><tspan x="289" dy="19">range/category drift</tspan><tspan x="289" dy="19">feature skew</tspan></text><rect x="515" y="110" width="210" height="225" class="box" fill="#fef3c7" stroke="#374151"/><text x="620" y="139" class="head" text-anchor="middle">Model</text><text x="529" y="166" class="body" text-anchor="start"><tspan x="529" dy="0">score distribution</tspan><tspan x="529" dy="19">calibration</tspan><tspan x="529" dy="19">slice metrics</tspan><tspan x="529" dy="19">abstention</tspan></text><rect x="755" y="110" width="210" height="225" class="box" fill="#fee2e2" stroke="#374151"/><text x="860" y="139" class="head" text-anchor="middle">Decision</text><text x="769" y="166" class="body" text-anchor="start"><tspan x="769" dy="0">utility and harm</tspan><tspan x="769" dy="19">override/appeal</tspan><tspan x="769" dy="19">feedback effects</tspan><tspan x="769" dy="19">business outcome</tspan></text><text x="500" y="377" class="head" text-anchor="middle">Alerts need an owner, a diagnostic path, and an action; a dashboard alone is not monitoring.</text>
</svg>
