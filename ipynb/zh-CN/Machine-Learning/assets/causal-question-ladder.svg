<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="385" viewBox="0 0 1000 385" role="img" aria-labelledby="title desc">
<title id="title">Three different questions can use the same variables</title>
<desc id="desc">Prediction, intervention, and counterfactual questions require increasingly explicit causal assumptions.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
  </marker>
</defs>
<style>
text { font-family: Arial, Helvetica, sans-serif; letter-spacing: 0; fill: #1f2937; }
.title { font-size: 25px; font-weight: 700; }
.subtitle { font-size: 14px; fill: #4b5563; }
.head { font-size: 16px; font-weight: 700; }
.body { font-size: 13px; }
.small { font-size: 12px; fill: #4b5563; }
.formula { font-family: "Courier New", monospace; font-size: 13px; }
.box { stroke-width: 1.4; rx: 7; }
.arrow { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#arrow); }
.dash { stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 7 5; fill: none; marker-end: url(#arrow); }
.blocked { stroke: #dc2626; stroke-width: 3; }
</style>
<rect width="1000" height="385" fill="#ffffff"/>
<text x="40" y="42" class="title" text-anchor="start">Three different questions can use the same variables</text>
<text x="40" y="68" class="subtitle" text-anchor="start">Prediction, intervention, and counterfactual questions require increasingly explicit causal assumptions.</text>
<rect x="35" y="110" width="275" height="190" class="box" fill="#dbeafe" stroke="#374151"/><text x="172" y="138" class="head" text-anchor="middle">Prediction</text><text x="49" y="164" class="body" text-anchor="start"><tspan x="49" dy="0">What outcome is likely?</tspan><tspan x="49" dy="19">Estimate P(Y | X)</tspan><tspan x="49" dy="19">Validated on held-out data</tspan></text><rect x="362" y="110" width="275" height="190" class="box" fill="#dcfce7" stroke="#374151"/><text x="499" y="138" class="head" text-anchor="middle">Intervention</text><text x="376" y="164" class="body" text-anchor="start"><tspan x="376" dy="0">What if we set T = t?</tspan><tspan x="376" dy="19">Estimate P(Y | do(T=t))</tspan><tspan x="376" dy="19">Needs identification</tspan></text><rect x="689" y="110" width="275" height="190" class="box" fill="#fef3c7" stroke="#374151"/><text x="826" y="138" class="head" text-anchor="middle">Counterfactual</text><text x="703" y="164" class="body" text-anchor="start"><tspan x="703" dy="0">What would have happened?</tspan><tspan x="703" dy="19">Compare Y(1) and Y(0)</tspan><tspan x="703" dy="19">One world is unobserved</tspan></text><path d="M 310 205 L 362 205" class="arrow"/><text x="336" y="197" class="small" text-anchor="middle">stronger assumptions</text><path d="M 637 205 L 689 205" class="arrow"/><text x="663" y="197" class="small" text-anchor="middle">unit-level contrast</text><text x="500" y="342" class="head" text-anchor="middle">More flexible prediction does not move a question up this ladder.</text>
</svg>
