<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="405" viewBox="0 0 1000 405" role="img" aria-labelledby="title desc">
<title id="title">Federated learning is an architecture, not a privacy proof</title>
<desc id="desc">Local training, secure aggregation, and differential privacy protect different system boundaries.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
  </marker>
</defs>
<style>
text { font-family: Arial, Helvetica, sans-serif; letter-spacing: 0; fill: #1f2937; }
.title { font-size: 25px; font-weight: 700; }
.subtitle { font-size: 14px; fill: #4b5563; }
.head { font-size: 16px; font-weight: 700; }
.body { font-size: 13px; }
.small { font-size: 12px; fill: #4b5563; }
.formula { font-family: "Courier New", monospace; font-size: 13px; }
.box { stroke-width: 1.4; rx: 7; }
.arrow { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#arrow); }
.dash { stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 7 5; fill: none; marker-end: url(#arrow); }
.axis { stroke: #6b7280; stroke-width: 1.3; fill: none; }
</style>
<rect width="1000" height="405" fill="#ffffff"/>
<text x="40" y="42" class="title" text-anchor="start">Federated learning is an architecture, not a privacy proof</text>
<text x="40" y="68" class="subtitle" text-anchor="start">Local training, secure aggregation, and differential privacy protect different system boundaries.</text>
<rect x="35" y="115" width="205" height="200" class="box" fill="#dbeafe" stroke="#374151"/><text x="137" y="144" class="head" text-anchor="middle">Client updates</text><text x="49" y="171" class="body" text-anchor="start"><tspan x="49" dy="0">Train on local records</tspan><tspan x="49" dy="19">Clip or protect update</tspan><tspan x="49" dy="19">Send an update, not raw data</tspan></text><path d="M 240 215 L 315 215" class="arrow"/><rect x="315" y="115" width="235" height="200" class="box" fill="#dcfce7" stroke="#374151"/><text x="432" y="144" class="head" text-anchor="middle">Secure aggregation</text><text x="329" y="171" class="body" text-anchor="start"><tspan x="329" dy="0">Server learns a sum</tspan><tspan x="329" dy="19">Masks individual updates</tspan><tspan x="329" dy="19">Needs protocol assumptions</tspan></text><path d="M 550 215 L 625 215" class="arrow"/><rect x="625" y="115" width="150" height="200" class="box" fill="#fef3c7" stroke="#374151"/><text x="700" y="144" class="head" text-anchor="middle">Global model</text><text x="639" y="171" class="body" text-anchor="start"><tspan x="639" dy="0">Weighted average</tspan><tspan x="639" dy="19">Broadcast next round</tspan><tspan x="639" dy="19">May still memorize</tspan></text><path d="M 775 215 L 825 215" class="arrow"/><rect x="825" y="115" width="140" height="200" class="box" fill="#fee2e2" stroke="#374151"/><text x="895" y="144" class="head" text-anchor="middle">DP layer</text><text x="839" y="171" class="body" text-anchor="start"><tspan x="839" dy="0">Clip sensitivity</tspan><tspan x="839" dy="19">Add calibrated noise</tspan><tspan x="839" dy="19">Account privacy</tspan></text><text x="500" y="355" class="head" text-anchor="middle">Federated learning reduces data movement; secure aggregation and differential privacy address different threats.</text>
</svg>
