<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
<title id="title">A layered workflow for detecting and diagnosing shift</title><desc id="desc">Reference data is compared with a current window through validation, statistical tests, domain classification, and prediction monitoring before diagnosis and action.</desc>
<defs><marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#475569"/></marker>
<style>.title{font:700 26px Arial,sans-serif;fill:#17212b}.bh{font:700 19px Arial,sans-serif;fill:#17212b}.bt{font:15px Arial,sans-serif;fill:#334155}.small{font:14px Arial,sans-serif;fill:#526172}.arrow{stroke:#475569;stroke-width:3;marker-end:url(#arrowhead)}.node{stroke:#334155;stroke-width:2}</style></defs>
<rect width="1200" height="580" fill="#ffffff"/>
<text x="600" y="42" text-anchor="middle" class="title">A layered workflow for detecting and diagnosing shift</text>
<rect x="35" y="155" width="205" height="230" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="137.5" y="193" text-anchor="middle" class="bh">Reference window</text><text x="137.5" y="227" text-anchor="middle" class="bt">schema and ranges</text><text x="137.5" y="254" text-anchor="middle" class="bt">feature distribution</text><text x="137.5" y="281" text-anchor="middle" class="bt">prediction behavior</text><line x1="240" y1="270" x2="320" y2="270" class="arrow"/><rect x="335" y="110" width="240" height="320" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="455.0" y="148" text-anchor="middle" class="bh">Detection layers</text><text x="455.0" y="182" text-anchor="middle" class="bt">data validation</text><text x="455.0" y="209" text-anchor="middle" class="bt">univariate tests</text><text x="455.0" y="236" text-anchor="middle" class="bt">domain classifier</text><text x="455.0" y="263" text-anchor="middle" class="bt">embedding / MMD</text><text x="455.0" y="290" text-anchor="middle" class="bt">prediction drift</text><line x1="575" y1="270" x2="655" y2="270" class="arrow"/><rect x="670" y="110" width="220" height="320" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="3"/><text x="780.0" y="148" text-anchor="middle" class="bh">Diagnosis</text><text x="780.0" y="182" text-anchor="middle" class="bt">which features?</text><text x="780.0" y="209" text-anchor="middle" class="bt">which subgroup?</text><text x="780.0" y="236" text-anchor="middle" class="bt">sampling artifact?</text><text x="780.0" y="263" text-anchor="middle" class="bt">label or concept shift?</text><text x="780.0" y="290" text-anchor="middle" class="bt">operational cause?</text><line x1="890" y1="270" x2="970" y2="270" class="arrow"/><rect x="985" y="155" width="180" height="230" rx="10" fill="#f3e8ff" stroke="#9333ea" stroke-width="3"/><text x="1075.0" y="193" text-anchor="middle" class="bh">Action</text><text x="1075.0" y="227" text-anchor="middle" class="bt">collect labels</text><text x="1075.0" y="254" text-anchor="middle" class="bt">reweight / adapt</text><text x="1075.0" y="281" text-anchor="middle" class="bt">recalibrate</text><text x="1075.0" y="308" text-anchor="middle" class="bt">rollback or retrain</text><rect x="335" y="475" width="555" height="70" rx="8" fill="#fee2e2" stroke="#e11d48" stroke-width="2"/><text x="612" y="505" text-anchor="middle" class="bh">Detection is not performance measurement</text><text x="612" y="532" text-anchor="middle" class="small">P(x) may move harmlessly, while P(y|x) can change before labels arrive.</text></svg>