<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="620" viewBox="0 0 1260 620" role="img" aria-labelledby="title desc">
  <title id="title">Shapes of common machine learning objects</title>
  <desc id="desc">A scalar, vector, matrix, and tensor followed by a shape-checked matrix-vector multiplication.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #172033; }
      .head { font: 700 21px Arial, sans-serif; fill: #172033; }
      .label { font: 600 17px Arial, sans-serif; fill: #172033; }
      .small { font: 15px Arial, sans-serif; fill: #475569; }
      .cell { stroke: #64748b; stroke-width: 1.5; }
      .arrow { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1260" height="620" fill="#ffffff"/>
  <text x="630" y="48" text-anchor="middle" class="title">Notation Carries Shape Information</text>

  <g transform="translate(48 95)">
    <text x="85" y="25" text-anchor="middle" class="head">Scalar</text>
    <rect x="40" y="55" width="90" height="90" rx="8" fill="#e8f1fb" stroke="#3b6ea8" stroke-width="2"/>
    <text x="85" y="110" text-anchor="middle" class="head">3.7</text>
    <text x="85" y="180" text-anchor="middle" class="small">one value</text>
    <text x="85" y="204" text-anchor="middle" class="label">a in R</text>
  </g>

  <g transform="translate(245 95)">
    <text x="90" y="25" text-anchor="middle" class="head">Vector</text>
    <rect x="45" y="50" width="90" height="42" fill="#fff2cc" class="cell"/>
    <rect x="45" y="92" width="90" height="42" fill="#fff2cc" class="cell"/>
    <rect x="45" y="134" width="90" height="42" fill="#fff2cc" class="cell"/>
    <rect x="45" y="176" width="90" height="42" fill="#fff2cc" class="cell"/>
    <text x="90" y="77" text-anchor="middle" class="label">x1</text>
    <text x="90" y="119" text-anchor="middle" class="label">x2</text>
    <text x="90" y="161" text-anchor="middle" class="label">x3</text>
    <text x="90" y="203" text-anchor="middle" class="label">x4</text>
    <text x="90" y="252" text-anchor="middle" class="small">one sample or parameter set</text>
    <text x="90" y="276" text-anchor="middle" class="label">x in R^d</text>
  </g>

  <g transform="translate(465 95)">
    <text x="150" y="25" text-anchor="middle" class="head">Matrix</text>
    <g transform="translate(35 55)">
      <rect x="0" y="0" width="230" height="168" rx="4" fill="#f4faf7" stroke="#27865a" stroke-width="2"/>
      <path d="M57.5 0V168 M115 0V168 M172.5 0V168 M0 56H230 M0 112H230" stroke="#82b99a" stroke-width="1.5"/>
      <text x="29" y="34" text-anchor="middle" class="small">x11</text>
      <text x="87" y="34" text-anchor="middle" class="small">x12</text>
      <text x="144" y="34" text-anchor="middle" class="small">...</text>
      <text x="202" y="34" text-anchor="middle" class="small">x1d</text>
      <text x="29" y="90" text-anchor="middle" class="small">x21</text>
      <text x="87" y="90" text-anchor="middle" class="small">x22</text>
      <text x="144" y="90" text-anchor="middle" class="small">...</text>
      <text x="202" y="90" text-anchor="middle" class="small">x2d</text>
      <text x="29" y="146" text-anchor="middle" class="small">xn1</text>
      <text x="87" y="146" text-anchor="middle" class="small">xn2</text>
      <text x="144" y="146" text-anchor="middle" class="small">...</text>
      <text x="202" y="146" text-anchor="middle" class="small">xnd</text>
    </g>
    <text x="150" y="260" text-anchor="middle" class="small">n samples by d features</text>
    <text x="150" y="284" text-anchor="middle" class="label">X in R^(n x d)</text>
  </g>

  <g transform="translate(795 95)">
    <text x="110" y="25" text-anchor="middle" class="head">Tensor</text>
    <rect x="55" y="88" width="130" height="130" rx="4" fill="#f3e8ff" stroke="#76519b" stroke-width="2"/>
    <rect x="35" y="68" width="130" height="130" rx="4" fill="#f8f0ff" stroke="#76519b" stroke-width="2"/>
    <rect x="15" y="48" width="130" height="130" rx="4" fill="#fbf7ff" stroke="#76519b" stroke-width="2"/>
    <path d="M58 48V178 M101 48V178 M15 91H145 M15 134H145" stroke="#b69bcf" stroke-width="1"/>
    <text x="110" y="258" text-anchor="middle" class="small">images, batches, sequences</text>
    <text x="110" y="282" text-anchor="middle" class="label">T in R^(n x h x w x c)</text>
  </g>

  <rect x="60" y="438" width="1140" height="130" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="630" y="472" text-anchor="middle" class="head">Shape check for a linear model</text>
  <text x="300" y="526" text-anchor="middle" class="head">X</text>
  <text x="300" y="551" text-anchor="middle" class="small">n x d</text>
  <text x="440" y="526" text-anchor="middle" class="head">times</text>
  <text x="560" y="526" text-anchor="middle" class="head">w</text>
  <text x="560" y="551" text-anchor="middle" class="small">d x 1</text>
  <path d="M625 520H745" class="arrow"/>
  <text x="845" y="526" text-anchor="middle" class="head">scores</text>
  <text x="845" y="551" text-anchor="middle" class="small">n x 1</text>
  <text x="1055" y="526" text-anchor="middle" class="label">inner d matches</text>
  <text x="1055" y="551" text-anchor="middle" class="small">outer n x 1 remains</text>
</svg>
