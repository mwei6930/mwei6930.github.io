<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Common k-means failure modes</title>
  <desc id="desc">Unequal variance, unequal cluster size, non-convex shapes, unscaled features, and outliers violate squared Euclidean centroid assumptions.</desc>
  <defs><style>.h{font:700 24px Arial,sans-serif;fill:#212529}.t{font:700 17px Arial,sans-serif;fill:#343a40}.s{font:15px Arial,sans-serif;fill:#495057}.box{stroke:#adb5bd;stroke-width:2;rx:6}.a{fill:#4dabf7}.b{fill:#ff8787}.o{fill:#adb5bd}</style></defs>
  <text x="600" y="38" text-anchor="middle" class="h">K-Means Assumes Squared-Euclidean, Compact, Similar-Scale Groups</text>
  <g transform="translate(25 90)"><rect width="220" height="430" class="box" fill="#e7f5ff"/><text x="110" y="38" text-anchor="middle" class="t">Non-convex shape</text><path d="M40 240 C70 130 160 130 185 240" fill="none" stroke="#4dabf7" stroke-width="18"/><path d="M40 270 C75 380 160 380 185 270" fill="none" stroke="#ff8787" stroke-width="18"/><line x1="110" y1="100" x2="110" y2="390" stroke="#495057" stroke-width="3" stroke-dasharray="7 6"/><text x="110" y="405" text-anchor="middle" class="s">Voronoi cells cut moons</text></g>
  <g transform="translate(260 90)"><rect width="220" height="430" class="box" fill="#fff3bf"/><text x="110" y="38" text-anchor="middle" class="t">Unequal variance</text><ellipse cx="80" cy="230" rx="35" ry="100" fill="#4dabf7" opacity=".6"/><ellipse cx="155" cy="250" rx="55" ry="35" fill="#ff8787" opacity=".6"/><line x1="125" y1="90" x2="125" y2="390" stroke="#495057" stroke-width="3" stroke-dasharray="7 6"/><text x="110" y="405" text-anchor="middle" class="s">spherical partition is wrong</text></g>
  <g transform="translate(495 90)"><rect width="220" height="430" class="box" fill="#d3f9d8"/><text x="110" y="38" text-anchor="middle" class="t">Unequal size</text><circle cx="80" cy="230" r="90" fill="#4dabf7" opacity=".45"/><circle cx="165" cy="270" r="25" fill="#ff8787" opacity=".8"/><line x1="125" y1="100" x2="125" y2="380" stroke="#495057" stroke-width="3" stroke-dasharray="7 6"/><text x="110" y="405" text-anchor="middle" class="s">large group may be split</text></g>
  <g transform="translate(730 90)"><rect width="220" height="430" class="box" fill="#f3d9fa"/><text x="110" y="38" text-anchor="middle" class="t">Feature scale</text><ellipse cx="110" cy="245" rx="80" ry="25" fill="#4dabf7" opacity=".55"/><ellipse cx="110" cy="310" rx="80" ry="25" fill="#ff8787" opacity=".55"/><line x1="110" y1="100" x2="110" y2="380" stroke="#495057" stroke-width="3"/><text x="110" y="405" text-anchor="middle" class="s">one unit dominates distance</text></g>
  <g transform="translate(965 90)"><rect width="210" height="430" class="box" fill="#ffe3e3"/><text x="105" y="38" text-anchor="middle" class="t">Outlier leverage</text><g class="a"><circle cx="65" cy="250" r="10"/><circle cx="90" cy="220" r="10"/><circle cx="100" cy="275" r="10"/><circle cx="125" cy="245" r="10"/></g><circle cx="180" cy="105" r="12" class="o"/><path d="M95 245 L135 200" stroke="#c92a2a" stroke-width="4"/><text x="105" y="405" text-anchor="middle" class="s">mean is pulled strongly</text></g>
  <text x="600" y="580" text-anchor="middle" class="s">Standardization, robust preprocessing, another metric, or another clustering definition may be required.</text>
</svg>
