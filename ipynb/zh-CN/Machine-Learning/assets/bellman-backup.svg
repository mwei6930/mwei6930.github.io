<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="370" viewBox="0 0 1000 370" role="img" aria-labelledby="title desc">
<title id="title">Bellman equations turn long horizons into local consistency</title>
<desc id="desc">A value equals immediate reward plus a discounted value of what follows.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
  </marker>
</defs>
<style>
text { font-family: Arial, Helvetica, sans-serif; letter-spacing: 0; fill: #1f2937; }
.title { font-size: 25px; font-weight: 700; }
.subtitle { font-size: 14px; fill: #4b5563; }
.head { font-size: 16px; font-weight: 700; }
.body { font-size: 13px; }
.small { font-size: 12px; fill: #4b5563; }
.formula { font-family: "Courier New", monospace; font-size: 13px; }
.box { stroke: #374151; stroke-width: 1.4; rx: 8; }
.soft { stroke: #9ca3af; stroke-width: 1.2; rx: 8; }
.arrow { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#arrow); }
.dash { stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 7 5; fill: none; marker-end: url(#arrow); }
</style>
<rect width="1000" height="370" fill="#ffffff"/>
<text x="40" y="42" class="title" text-anchor="start">Bellman equations turn long horizons into local consistency</text>
<text x="40" y="67" class="subtitle" text-anchor="start">A value equals immediate reward plus a discounted value of what follows.</text>
<rect x="55" y="120" width="190" height="125" class="box" fill="#dbeafe" stroke="#374151"/><text x="150" y="147" class="head" text-anchor="middle">Current value</text><text x="69" y="173" class="body" text-anchor="start"><tspan x="69" dy="0">V(s) or Q(s,a)</tspan><tspan x="69" dy="19">estimate before backup</tspan></text><path d="M 245 182 L 350 182" class="arrow"/><rect x="350" y="105" width="300" height="155" class="box" fill="#fef3c7" stroke="#374151"/><text x="500" y="132" class="head" text-anchor="middle">One-step lookahead</text><text x="364" y="158" class="body" text-anchor="start"><tspan x="364" dy="0">immediate reward r</tspan><tspan x="364" dy="19">plus γ × next value</tspan><tspan x="364" dy="19">expectation or max</tspan></text><path d="M 650 182 L 755 182" class="arrow"/><rect x="755" y="120" width="190" height="125" class="box" fill="#dcfce7" stroke="#374151"/><text x="850" y="147" class="head" text-anchor="middle">Backed-up value</text><text x="769" y="173" class="body" text-anchor="start"><tspan x="769" dy="0">new estimate</tspan><tspan x="769" dy="19">consistent with future</tspan></text><text x="500" y="315" class="head" text-anchor="middle">Bellman expectation: average under π     Bellman optimality: maximize over actions</text>
</svg>
