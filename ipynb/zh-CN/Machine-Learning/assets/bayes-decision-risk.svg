<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
  <title id="title">Bayesian decision theory and posterior risk</title>
  <desc id="desc">Posterior class probabilities are combined with a loss matrix to compute the risk of each action, and the action with the lower risk is chosen.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#495057"/></marker>
    <style>
      .box{fill:#fff;stroke:#495057;stroke-width:2}.p{fill:#e7f5ff}.l{fill:#fff3bf}.r{fill:#ffe8cc}.a{fill:#ebfbee}.h{font:700 24px Arial,sans-serif;fill:#212529}.t{font:17px Arial,sans-serif;fill:#343a40}.s{font:15px Arial,sans-serif;fill:#495057}.line{stroke:#495057;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <text x="600" y="38" text-anchor="middle" class="h">Posterior Probability Is Not Yet a Decision</text>
  <rect x="45" y="90" width="260" height="180" rx="6" class="box p"/>
  <text x="175" y="130" text-anchor="middle" class="h">Posterior</text>
  <text x="72" y="172" class="t">P(Y = 0 | x, D) = 0.65</text>
  <text x="72" y="207" class="t">P(Y = 1 | x, D) = 0.35</text>
  <text x="72" y="245" class="s">Evidence about outcomes</text>
  <rect x="360" y="90" width="320" height="180" rx="6" class="box l"/>
  <text x="520" y="130" text-anchor="middle" class="h">Loss Matrix L(a, y)</text>
  <text x="405" y="172" class="t">Predict 0: [0, 5]</text>
  <text x="405" y="207" class="t">Predict 1: [1, 0]</text>
  <text x="405" y="245" class="s">Missing class 1 is five times costlier</text>
  <path d="M305 180 H352" class="line"/>
  <rect x="735" y="70" width="420" height="220" rx="6" class="box r"/>
  <text x="945" y="110" text-anchor="middle" class="h">Posterior Risk</text>
  <text x="770" y="155" class="t">R(predict 0) = 0(0.65) + 5(0.35) = 1.75</text>
  <text x="770" y="195" class="t">R(predict 1) = 1(0.65) + 0(0.35) = 0.65</text>
  <text x="770" y="244" class="s">Expected consequence under the posterior</text>
  <path d="M680 180 H727" class="line"/>
  <rect x="330" y="380" width="540" height="130" rx="6" class="box a"/>
  <text x="600" y="422" text-anchor="middle" class="h">Bayes Action: predict class 1</text>
  <text x="380" y="465" class="t">Choose the action with minimum posterior risk, not necessarily the MAP class.</text>
  <path d="M945 290 C945 342 820 347 790 372" class="line"/>
  <rect x="115" y="535" width="970" height="38" rx="6" fill="#f8f9fa" stroke="#adb5bd"/>
  <text x="600" y="560" text-anchor="middle" class="s">Under symmetric 0-1 loss, minimum risk reduces to choosing the most probable class.</text>
</svg>
