<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" role="img" aria-labelledby="title desc">
  <title id="title">The three components of a generalized linear model</title>
  <desc id="desc">A generalized linear model combines a conditional response distribution, a linear predictor, and a link relating the conditional mean to that predictor.</desc>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <style>.title{font:700 29px Arial,sans-serif;fill:#0f172a}.head{font:700 19px Arial,sans-serif;fill:#0f172a}.body{font:16px Arial,sans-serif;fill:#1e293b}.small{font:14px Arial,sans-serif;fill:#475569}.arr{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#arr)}</style>
  </defs>
  <rect width="1200" height="670" fill="#f8fafc"/>
  <text x="600" y="43" text-anchor="middle" class="title">A GLM separates outcome randomness, systematic effects, and scale</text>

  <rect x="45" y="92" width="315" height="235" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="202" y="132" text-anchor="middle" class="head">1. Random component</text>
  <text x="202" y="175" text-anchor="middle" class="body">Y | X follows an exponential-family</text>
  <text x="202" y="202" text-anchor="middle" class="body">distribution with mean mu.</text>
  <line x1="85" y1="225" x2="320" y2="225" stroke="#bfdbfe" stroke-width="2"/>
  <text x="202" y="258" text-anchor="middle" class="small">Gaussian: constant variance</text>
  <text x="202" y="283" text-anchor="middle" class="small">Bernoulli: variance mu(1-mu)</text>
  <text x="202" y="308" text-anchor="middle" class="small">Poisson: variance mu</text>

  <path d="M360 210 H425" class="arr"/>
  <rect x="430" y="92" width="315" height="235" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="587" y="132" text-anchor="middle" class="head">2. Systematic component</text>
  <text x="587" y="188" text-anchor="middle" style="font:700 24px Georgia,serif;fill:#9a3412">eta = beta0 + x^T beta</text>
  <line x1="470" y1="222" x2="705" y2="222" stroke="#fed7aa" stroke-width="2"/>
  <text x="587" y="258" text-anchor="middle" class="body">features, interactions, offsets</text>
  <text x="587" y="287" text-anchor="middle" class="small">effects are additive on the eta scale</text>

  <path d="M745 210 H810" class="arr"/>
  <rect x="815" y="92" width="340" height="235" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="985" y="132" text-anchor="middle" class="head">3. Link component</text>
  <text x="985" y="184" text-anchor="middle" style="font:700 24px Georgia,serif;fill:#166534">g(mu) = eta</text>
  <text x="985" y="221" text-anchor="middle" class="body">mu = g^-1(eta)</text>
  <line x1="855" y1="242" x2="1115" y2="242" stroke="#bbf7d0" stroke-width="2"/>
  <text x="985" y="276" text-anchor="middle" class="small">maps an unrestricted score to a valid mean</text>
  <text x="985" y="303" text-anchor="middle" class="small">and defines coefficient interpretation</text>

  <rect x="75" y="385" width="1050" height="205" rx="8" fill="#fff" stroke="#64748b" stroke-width="2"/>
  <text x="600" y="421" text-anchor="middle" class="head">Common combinations</text>
  <line x1="105" y1="449" x2="1095" y2="449" stroke="#cbd5e1" stroke-width="2"/>
  <text x="145" y="476" class="head">Outcome</text><text x="365" y="476" class="head">Distribution</text><text x="615" y="476" class="head">Link g(mu)</text><text x="865" y="476" class="head">Inverse link</text>
  <line x1="105" y1="490" x2="1095" y2="490" stroke="#e2e8f0"/>
  <text x="145" y="518" class="body">continuous</text><text x="365" y="518" class="body">Gaussian</text><text x="615" y="518" class="body">identity</text><text x="865" y="518" class="body">mu = eta</text>
  <text x="145" y="550" class="body">binary</text><text x="365" y="550" class="body">Bernoulli</text><text x="615" y="550" class="body">logit</text><text x="865" y="550" class="body">mu = sigmoid(eta)</text>
  <text x="145" y="582" class="body">count / rate</text><text x="365" y="582" class="body">Poisson</text><text x="615" y="582" class="body">log</text><text x="865" y="582" class="body">mu = exp(eta)</text>

  <text x="600" y="638" text-anchor="middle" class="small">Choosing a distribution and link is a modeling claim about support, variance, and interpretation, not merely an API option.</text>
</svg>
