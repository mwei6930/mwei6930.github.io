<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L8 3z" fill="#334155"/></marker><style>.t{font:700 28px Arial,sans-serif;fill:#1f2937}.h{font:700 20px Arial,sans-serif;fill:#1f2937}.b{font:16px Arial,sans-serif;fill:#374151}.s{font:14px Arial,sans-serif;fill:#475569}.box{fill:#fff;stroke:#64748b;stroke-width:2}</style></defs>
  <rect width="1200" height="650" fill="#f8fafc"/><text x="600" y="42" text-anchor="middle" class="t">Gradient estimates change the path through an ill-conditioned valley</text>
  <g transform="translate(42 82)"><rect width="350" height="490" rx="8" class="box"/><text x="175" y="38" text-anchor="middle" class="h">Full-batch gradient descent</text><g transform="translate(35 80)"><ellipse cx="140" cy="170" rx="130" ry="45" fill="none" stroke="#cbd5e1" stroke-width="2" transform="rotate(-28 140 170)"/><ellipse cx="140" cy="170" rx="95" ry="31" fill="none" stroke="#cbd5e1" stroke-width="2" transform="rotate(-28 140 170)"/><ellipse cx="140" cy="170" rx="55" ry="18" fill="none" stroke="#cbd5e1" stroke-width="2" transform="rotate(-28 140 170)"/><circle cx="140" cy="170" r="8" fill="#16a34a"/><polyline points="15,35 100,270 62,107 153,250 112,137 176,222 148,158 170,194 140,170" fill="none" stroke="#2563eb" stroke-width="4"/><circle cx="15" cy="35" r="7" fill="#2563eb"/></g><text x="175" y="391" text-anchor="middle" class="b">accurate but expensive step</text><text x="175" y="420" text-anchor="middle" class="s">zig-zags when curvature differs by direction</text><text x="175" y="449" text-anchor="middle" class="s">one update uses all n examples</text></g>
  <g transform="translate(425 82)"><rect width="350" height="490" rx="8" class="box"/><text x="175" y="38" text-anchor="middle" class="h">Stochastic / mini-batch</text><g transform="translate(35 80)"><ellipse cx="140" cy="170" rx="130" ry="45" fill="none" stroke="#cbd5e1" stroke-width="2" transform="rotate(-28 140 170)"/><ellipse cx="140" cy="170" rx="95" ry="31" fill="none" stroke="#cbd5e1" stroke-width="2" transform="rotate(-28 140 170)"/><ellipse cx="140" cy="170" rx="55" ry="18" fill="none" stroke="#cbd5e1" stroke-width="2" transform="rotate(-28 140 170)"/><circle cx="140" cy="170" r="8" fill="#16a34a"/><polyline points="15,35 92,82 43,145 148,105 87,221 183,150 116,209 194,183 140,170" fill="none" stroke="#d97706" stroke-width="4"/><circle cx="15" cy="35" r="7" fill="#d97706"/></g><text x="175" y="391" text-anchor="middle" class="b">cheaper noisy gradient estimate</text><text x="175" y="420" text-anchor="middle" class="s">more updates and hardware-friendly batches</text><text x="175" y="449" text-anchor="middle" class="s">noise persists near the optimum</text></g>
  <g transform="translate(808 82)"><rect width="350" height="490" rx="8" class="box"/><text x="175" y="38" text-anchor="middle" class="h">Momentum</text><g transform="translate(35 80)"><ellipse cx="140" cy="170" rx="130" ry="45" fill="none" stroke="#cbd5e1" stroke-width="2" transform="rotate(-28 140 170)"/><ellipse cx="140" cy="170" rx="95" ry="31" fill="none" stroke="#cbd5e1" stroke-width="2" transform="rotate(-28 140 170)"/><ellipse cx="140" cy="170" rx="55" ry="18" fill="none" stroke="#cbd5e1" stroke-width="2" transform="rotate(-28 140 170)"/><circle cx="140" cy="170" r="8" fill="#16a34a"/><path d="M15 35 C58 85 88 116 116 145 C127 157 136 165 140 170" fill="none" stroke="#7c3aed" stroke-width="5"/><circle cx="15" cy="35" r="7" fill="#7c3aed"/></g><text x="175" y="391" text-anchor="middle" class="b">averages directions over time</text><text x="175" y="420" text-anchor="middle" class="s">damps alternating high-curvature motion</text><text x="175" y="449" text-anchor="middle" class="s">accelerates persistent low-curvature progress</text></g>
  <text x="600" y="615" text-anchor="middle" class="s">The exact path depends on step size, batch sampling, momentum coefficient, scaling, and the local landscape.</text>
</svg>
