<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
<title id="title">Self-supervised pretraining from data-derived targets</title><desc id="desc">Raw data is transformed into predictive or contrastive learning signals, used to pretrain an encoder, then evaluated on downstream transfer.</desc>
<defs><marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#475569"/></marker>
<style>.title{font:700 26px Arial,sans-serif;fill:#17212b}.bh{font:700 19px Arial,sans-serif;fill:#17212b}.bt{font:15px Arial,sans-serif;fill:#334155}.small{font:14px Arial,sans-serif;fill:#526172}.arrow{stroke:#475569;stroke-width:3;marker-end:url(#arrowhead)}.node{stroke:#334155;stroke-width:2}</style></defs>
<rect width="1200" height="570" fill="#ffffff"/>
<text x="600" y="42" text-anchor="middle" class="title">Self-supervised pretraining from data-derived targets</text>
<rect x="45" y="185" width="175" height="150" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="3"/><text x="132.5" y="223" text-anchor="middle" class="bh">Raw data x</text><text x="132.5" y="257" text-anchor="middle" class="bt">no human target</text><line x1="220" y1="260" x2="300" y2="260" class="arrow"/><rect x="315" y="90" width="260" height="340" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="445.0" y="128" text-anchor="middle" class="bh">Create a learning signal</text><text x="445.0" y="162" text-anchor="middle" class="bt">masked prediction</text><text x="445.0" y="189" text-anchor="middle" class="bt">future / context prediction</text><text x="445.0" y="216" text-anchor="middle" class="bt">denoising or rotation</text><text x="445.0" y="243" text-anchor="middle" class="bt">positive and negative views</text><line x1="575" y1="260" x2="655" y2="260" class="arrow"/><rect x="670" y="135" width="210" height="250" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="3"/><text x="775.0" y="173" text-anchor="middle" class="bh">Pretrain encoder</text><text x="775.0" y="207" text-anchor="middle" class="bt">predictive loss</text><text x="775.0" y="234" text-anchor="middle" class="bt">contrastive loss</text><text x="775.0" y="261" text-anchor="middle" class="bt">avoid shortcuts</text><line x1="880" y1="260" x2="960" y2="260" class="arrow"/><rect x="975" y="90" width="180" height="340" rx="10" fill="#fff7ed" stroke="#e8590c" stroke-width="3"/><text x="1065.0" y="128" text-anchor="middle" class="bh">Evaluate transfer</text><text x="1065.0" y="162" text-anchor="middle" class="bt">linear probe</text><text x="1065.0" y="189" text-anchor="middle" class="bt">fine-tuning</text><text x="1065.0" y="216" text-anchor="middle" class="bt">few-label curve</text><text x="1065.0" y="243" text-anchor="middle" class="bt">shift and subgroup checks</text><text x="600" y="500" text-anchor="middle" class="bh">The target is generated from the observation, but the desired invariance is a modeling choice.</text><text x="600" y="535" text-anchor="middle" class="small">High pretext accuracy can reflect a shortcut and does not establish that the representation helps the downstream task.</text></svg>