<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">Predictive uncertainty, calibration, and decision validation</title>
  <desc id="desc">Predictive uncertainty contains aleatoric and epistemic components, but useful uncertainty estimates must also be checked for calibration, distribution shift, and decision relevance.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#495057"/></marker>
    <style>.box{fill:#fff;stroke:#495057;stroke-width:2}.root{fill:#f8f9fa}.alea{fill:#e7f5ff}.epis{fill:#fff3bf}.check{fill:#ebfbee}.warn{fill:#ffe8cc}.h{font:700 24px Arial,sans-serif;fill:#212529}.t{font:17px Arial,sans-serif;fill:#343a40}.s{font:15px Arial,sans-serif;fill:#495057}.line{stroke:#495057;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <text x="600" y="38" text-anchor="middle" class="h">Uncertainty Is Useful Only When It Is Validated</text>
  <rect x="420" y="72" width="360" height="105" rx="6" class="box root"/>
  <text x="600" y="113" text-anchor="middle" class="h">Predictive distribution</text>
  <text x="600" y="149" text-anchor="middle" class="t">What might happen at x*?</text>
  <rect x="105" y="245" width="390" height="165" rx="6" class="box alea"/>
  <text x="300" y="286" text-anchor="middle" class="h">Aleatoric Uncertainty</text>
  <text x="135" y="328" class="t">Outcome noise or class overlap</text>
  <text x="135" y="365" class="s">Usually remains even with unlimited</text>
  <text x="135" y="389" class="s">data under the chosen observations</text>
  <rect x="705" y="245" width="390" height="165" rx="6" class="box epis"/>
  <text x="900" y="286" text-anchor="middle" class="h">Epistemic Uncertainty</text>
  <text x="735" y="328" class="t">Limited data or model knowledge</text>
  <text x="735" y="365" class="s">Can shrink with informative data,</text>
  <text x="735" y="389" class="s">but depends on model assumptions</text>
  <path d="M520 177 C430 205 350 210 320 237" class="line"/><path d="M680 177 C770 205 850 210 880 237" class="line"/>
  <rect x="165" y="475" width="870" height="92" rx="6" class="box check"/>
  <text x="600" y="513" text-anchor="middle" class="h">Validate: calibration + coverage + shift + decision cost</text>
  <text x="600" y="547" text-anchor="middle" class="s">A narrow interval or confident probability is not trustworthy merely because it came from a Bayesian model.</text>
  <path d="M300 410 C330 450 425 450 470 467" class="line"/><path d="M900 410 C870 450 775 450 730 467" class="line"/>
  <rect x="220" y="584" width="760" height="24" rx="6" class="warn" stroke="#adb5bd"/>
  <text x="600" y="602" text-anchor="middle" class="s">Out-of-distribution confidence can still be wrong when the model class is misspecified.</text>
</svg>
