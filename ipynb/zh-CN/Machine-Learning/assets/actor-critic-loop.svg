<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc">
<title id="title">Actor-critic separates acting from value estimation</title>
<desc id="desc">The actor represents the policy while the critic supplies a lower-variance learning signal.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
  </marker>
</defs>
<style>
text { font-family: Arial, Helvetica, sans-serif; letter-spacing: 0; fill: #1f2937; }
.title { font-size: 25px; font-weight: 700; }
.subtitle { font-size: 14px; fill: #4b5563; }
.head { font-size: 16px; font-weight: 700; }
.body { font-size: 13px; }
.small { font-size: 12px; fill: #4b5563; }
.formula { font-family: "Courier New", monospace; font-size: 13px; }
.box { stroke: #374151; stroke-width: 1.4; rx: 8; }
.soft { stroke: #9ca3af; stroke-width: 1.2; rx: 8; }
.arrow { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#arrow); }
.dash { stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 7 5; fill: none; marker-end: url(#arrow); }
</style>
<rect width="1000" height="390" fill="#ffffff"/>
<text x="40" y="42" class="title" text-anchor="start">Actor-critic separates acting from value estimation</text>
<text x="40" y="67" class="subtitle" text-anchor="start">The actor represents the policy while the critic supplies a lower-variance learning signal.</text>
<rect x="45" y="120" width="220" height="145" class="box" fill="#dbeafe" stroke="#374151"/><text x="155" y="147" class="head" text-anchor="middle">Actor π_θ(a|s)</text><text x="59" y="173" class="body" text-anchor="start"><tspan x="59" dy="0">selects action</tspan><tspan x="59" dy="19">receives policy gradient</tspan></text><path d="M 265 190 L 390 190" class="arrow"/><text x="327" y="182" class="small" text-anchor="middle">action</text><rect x="390" y="120" width="220" height="145" class="box" fill="#fef3c7" stroke="#374151"/><text x="500" y="147" class="head" text-anchor="middle">Environment</text><text x="404" y="173" class="body" text-anchor="start"><tspan x="404" dy="0">returns r and s&#x27;</tspan><tspan x="404" dy="19">generates trajectory</tspan></text><path d="M 610 190 L 735 190" class="arrow"/><text x="672" y="182" class="small" text-anchor="middle">transition</text><rect x="735" y="120" width="220" height="145" class="box" fill="#dcfce7" stroke="#374151"/><text x="845" y="147" class="head" text-anchor="middle">Critic V_φ(s)</text><text x="749" y="173" class="body" text-anchor="start"><tspan x="749" dy="0">estimates return</tspan><tspan x="749" dy="19">forms advantage / δ</tspan></text><path d="M 845 265 L 155 305" class="dash"/><text x="500" y="277" class="small" text-anchor="middle">advantage trains actor</text><text x="500" y="345" class="head" text-anchor="middle">The critic reduces variance; it does not choose the deployed action.</text>
</svg>
