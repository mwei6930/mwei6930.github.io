<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Agglomerative clustering and linkage criteria</title>
  <desc id="desc">Pairwise clusters merge from leaves to root; single, complete, average, and Ward linkage assign different merge distances and produce different dendrograms.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#495057"/></marker><style>.h{font:700 24px Arial,sans-serif;fill:#212529}.t{font:700 17px Arial,sans-serif;fill:#343a40}.s{font:15px Arial,sans-serif;fill:#495057}.box{stroke:#adb5bd;stroke-width:2;rx:6}.line{stroke:#495057;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style></defs>
  <text x="600" y="38" text-anchor="middle" class="h">Hierarchical Clustering Preserves a Family of Partitions</text>
  <rect x="25" y="90" width="420" height="470" class="box" fill="#f8f9fa"/><text x="235" y="130" text-anchor="middle" class="t">Agglomerative process</text>
  <g fill="#4dabf7"><circle cx="85" cy="240" r="14"/><circle cx="130" cy="210" r="14"/></g><g fill="#ff8787"><circle cx="250" cy="330" r="14"/><circle cx="295" cy="300" r="14"/></g><circle cx="370" cy="185" r="14" fill="#69db7c"/>
  <path d="M100 230 C160 160 210 170 250 300" stroke="#1971c2" stroke-width="3" fill="none"/><path d="M265 315 C310 260 350 250 370 200" stroke="#c92a2a" stroke-width="3" fill="none"/>
  <text x="235" y="410" text-anchor="middle" class="s">start with singleton clusters</text><text x="235" y="440" text-anchor="middle" class="s">merge the closest pair</text><text x="235" y="470" text-anchor="middle" class="s">recompute inter-cluster distances</text><text x="235" y="500" text-anchor="middle" class="s">continue until one root remains</text>
  <path d="M445 325 H515" class="line"/>
  <rect x="520" y="90" width="655" height="470" class="box" fill="#e7f5ff"/><text x="847" y="130" text-anchor="middle" class="t">Dendrogram: merge height records dissimilarity</text>
  <line x1="585" y1="480" x2="585" y2="390" stroke="#495057" stroke-width="3"/><line x1="685" y1="480" x2="685" y2="390" stroke="#495057" stroke-width="3"/><line x1="585" y1="390" x2="685" y2="390" stroke="#495057" stroke-width="3"/><line x1="635" y1="390" x2="635" y2="290" stroke="#495057" stroke-width="3"/>
  <line x1="815" y1="480" x2="815" y2="350" stroke="#495057" stroke-width="3"/><line x1="915" y1="480" x2="915" y2="350" stroke="#495057" stroke-width="3"/><line x1="815" y1="350" x2="915" y2="350" stroke="#495057" stroke-width="3"/><line x1="865" y1="350" x2="865" y2="290" stroke="#495057" stroke-width="3"/>
  <line x1="635" y1="290" x2="865" y2="290" stroke="#495057" stroke-width="3"/><line x1="750" y1="290" x2="750" y2="200" stroke="#495057" stroke-width="3"/><line x1="1045" y1="480" x2="1045" y2="200" stroke="#495057" stroke-width="3"/><line x1="750" y1="200" x2="1045" y2="200" stroke="#495057" stroke-width="3"/>
  <line x1="545" y1="325" x2="1145" y2="325" stroke="#c92a2a" stroke-width="3" stroke-dasharray="8 6"/><text x="1100" y="315" class="s">cut</text>
  <text x="847" y="525" text-anchor="middle" class="s">A horizontal cut selects one flat partition; another height selects another resolution.</text>
  <text x="600" y="605" text-anchor="middle" class="s">Single uses nearest pairs; complete uses farthest pairs; average uses mean pair distance; Ward minimizes variance increase.</text>
</svg>
