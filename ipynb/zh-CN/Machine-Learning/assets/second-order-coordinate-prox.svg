<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L8 3z" fill="#334155"/></marker><style>.t{font:700 28px Arial,sans-serif;fill:#1f2937}.h{font:700 20px Arial,sans-serif;fill:#1f2937}.b{font:16px Arial,sans-serif;fill:#374151}.s{font:14px Arial,sans-serif;fill:#475569}.m{font:italic 17px Georgia,serif;fill:#111827}.box{fill:#fff;stroke:#64748b;stroke-width:2}.ar{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="650" fill="#f8fafc"/><text x="600" y="42" text-anchor="middle" class="t">Different structure suggests different optimization methods</text>
  <g transform="translate(42 82)"><rect width="350" height="500" rx="8" class="box"/><text x="175" y="38" text-anchor="middle" class="h">Newton / quasi-Newton</text><g transform="translate(45 82)"><path d="M10 260 C80 30 180 38 260 250" fill="none" stroke="#2563eb" stroke-width="5"/><circle cx="35" cy="188" r="8" fill="#ef4444"/><line x1="35" y1="188" x2="198" y2="263" stroke="#d97706" stroke-width="3"/><line x1="35" y1="270" x2="198" y2="270" class="ar"/><circle cx="198" cy="263" r="8" fill="#16a34a"/><text x="116" y="298" text-anchor="middle" class="s">curvature-scaled step</text></g><text x="175" y="414" text-anchor="middle" class="b">uses or approximates Hessian information</text><text x="175" y="445" text-anchor="middle" class="s">fast near a well-behaved optimum</text><text x="175" y="474" text-anchor="middle" class="s">memory and factorization can be expensive</text></g>
  <g transform="translate(425 82)"><rect width="350" height="500" rx="8" class="box"/><text x="175" y="38" text-anchor="middle" class="h">Coordinate descent</text><g transform="translate(45 82)"><ellipse cx="130" cy="135" rx="115" ry="46" transform="rotate(-28 130 135)" fill="none" stroke="#cbd5e1" stroke-width="2"/><ellipse cx="130" cy="135" rx="70" ry="28" transform="rotate(-28 130 135)" fill="none" stroke="#cbd5e1" stroke-width="2"/><circle cx="130" cy="135" r="8" fill="#16a34a"/><polyline points="18,255 18,191 82,191 82,158 118,158 118,135 130,135" fill="none" stroke="#d97706" stroke-width="5"/><circle cx="18" cy="255" r="8" fill="#d97706"/><text x="130" y="298" text-anchor="middle" class="s">optimize one block at a time</text></g><text x="175" y="414" text-anchor="middle" class="b">exploits separability and cheap coordinates</text><text x="175" y="445" text-anchor="middle" class="s">effective for Lasso and sparse models</text><text x="175" y="474" text-anchor="middle" class="s">correlated coordinates may slow progress</text></g>
  <g transform="translate(808 82)"><rect width="350" height="500" rx="8" class="box"/><text x="175" y="38" text-anchor="middle" class="h">Proximal gradient</text><g transform="translate(35 82)"><line x1="20" y1="150" x2="280" y2="150" stroke="#64748b" stroke-width="3"/><line x1="150" y1="30" x2="150" y2="270" stroke="#64748b" stroke-width="3"/><circle cx="252" cy="72" r="9" fill="#2563eb"/><path d="M245 80 L177 135" class="ar"/><circle cx="177" cy="135" r="9" fill="#d97706"/><path d="M168 142 L150 150" class="ar"/><circle cx="150" cy="150" r="9" fill="#16a34a"/><text x="250" y="52" text-anchor="middle" class="s">gradient step</text><text x="195" y="177" class="s">prox step</text><path d="M62 250 L150 150 L238 250" fill="none" stroke="#7c3aed" stroke-width="4"/><text x="150" y="298" text-anchor="middle" class="s">soft-threshold toward zero</text></g><text x="175" y="414" text-anchor="middle" class="b">splits smooth loss from non-smooth penalty</text><text x="175" y="445" text-anchor="middle" class="s">handles L1 without pretending it is differentiable</text><text x="175" y="474" text-anchor="middle" class="s">step size follows the smooth part</text></g>
</svg>
