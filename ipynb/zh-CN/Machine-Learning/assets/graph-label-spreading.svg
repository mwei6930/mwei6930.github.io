<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img" aria-labelledby="title desc">
<title id="title">Graph-based semi-supervised label spreading</title><desc id="desc">Labeled and unlabeled observations form a weighted graph; smoothness and label anchoring produce soft predictions at every node.</desc>
<defs><marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#475569"/></marker>
<style>.title{font:700 26px Arial,sans-serif;fill:#17212b}.bh{font:700 19px Arial,sans-serif;fill:#17212b}.bt{font:15px Arial,sans-serif;fill:#334155}.small{font:14px Arial,sans-serif;fill:#526172}.arrow{stroke:#475569;stroke-width:3;marker-end:url(#arrowhead)}.node{stroke:#334155;stroke-width:2}</style></defs>
<rect width="1200" height="510" fill="#ffffff"/>
<text x="600" y="42" text-anchor="middle" class="title">Graph-based semi-supervised label spreading</text>
<text x="250" y="92" text-anchor="middle" class="bh">Feature space becomes a weighted graph</text><line x1="115" y1="190" x2="220" y2="145" stroke="#94a3b8" stroke-width="6"/><line x1="220" y1="145" x2="315" y2="205" stroke="#94a3b8" stroke-width="6"/><line x1="115" y1="190" x2="190" y2="285" stroke="#94a3b8" stroke-width="5"/><line x1="190" y1="285" x2="315" y2="205" stroke="#94a3b8" stroke-width="4"/><line x1="315" y1="205" x2="375" y2="320" stroke="#94a3b8" stroke-width="3"/><line x1="190" y1="285" x2="375" y2="320" stroke="#cbd5e1" stroke-width="2"/><circle cx="115" cy="190" r="22" fill="#2563eb" class="node"/><text x="115" y="196" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">A</text><circle cx="220" cy="145" r="18" fill="#bfdbfe" class="node"/><circle cx="315" cy="205" r="18" fill="#e2e8f0" class="node"/><circle cx="190" cy="285" r="18" fill="#fecdd3" class="node"/><circle cx="375" cy="320" r="22" fill="#e11d48" class="node"/><text x="375" y="326" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">B</text><line x1="430" y1="235" x2="530" y2="235" class="arrow"/><rect x="545" y="120" width="250" height="230" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="3"/><text x="670.0" y="158" text-anchor="middle" class="bh">Graph objective</text><text x="670.0" y="192" text-anchor="middle" class="bt">similar nodes agree</text><text x="670.0" y="219" text-anchor="middle" class="bt">labels remain anchored</text><text x="670.0" y="246" text-anchor="middle" class="bt">soft clamping resists noise</text><line x1="810" y1="235" x2="905" y2="235" class="arrow"/><rect x="920" y="120" width="235" height="230" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="3"/><text x="1037.5" y="158" text-anchor="middle" class="bh">Soft predictions</text><text x="1037.5" y="192" text-anchor="middle" class="bt">class probability</text><text x="1037.5" y="219" text-anchor="middle" class="bt">at every node</text><text x="1037.5" y="246" text-anchor="middle" class="bt">including unlabeled U</text><rect x="950" y="285" width="170" height="20" rx="10" fill="url(#g)"/><defs><linearGradient id="g"><stop offset="0" stop-color="#2563eb"/><stop offset="0.5" stop-color="#f8fafc"/><stop offset="1" stop-color="#e11d48"/></linearGradient></defs><text x="600" y="430" text-anchor="middle" class="bh">Edge weight W_ij encodes how strongly two observations should share labels.</text><text x="600" y="465" text-anchor="middle" class="small">The result is sensitive to feature scaling, the distance metric, k, kernel bandwidth, graph connectivity, and label placement.</text></svg>