<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="title desc">
<title id="title">Serving mode follows the decision deadline</title>
<desc id="desc">Batch, online, and edge inference exchange freshness, latency, availability, and resource constraints.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
  </marker>
</defs>
<style>
text { font-family: Arial, Helvetica, sans-serif; letter-spacing: 0; fill: #1f2937; }
.title { font-size: 25px; font-weight: 700; }
.subtitle { font-size: 14px; fill: #4b5563; }
.head { font-size: 16px; font-weight: 700; }
.body { font-size: 13px; }
.small { font-size: 12px; fill: #4b5563; }
.formula { font-family: "Courier New", monospace; font-size: 13px; }
.box { stroke-width: 1.4; rx: 7; }
.arrow { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#arrow); }
.dash { stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 7 5; fill: none; marker-end: url(#arrow); }
.line { stroke: #6b7280; stroke-width: 1.5; fill: none; }
</style>
<rect width="1000" height="400" fill="#ffffff"/>
<text x="40" y="42" class="title" text-anchor="start">Serving mode follows the decision deadline</text>
<text x="40" y="68" class="subtitle" text-anchor="start">Batch, online, and edge inference exchange freshness, latency, availability, and resource constraints.</text>
<rect x="40" y="112" width="280" height="205" class="box" fill="#dbeafe" stroke="#374151"/><text x="180" y="141" class="head" text-anchor="middle">Batch inference</text><text x="54" y="168" class="body" text-anchor="start"><tspan x="54" dy="0">many records at once</tspan><tspan x="54" dy="19">minutes to hours</tspan><tspan x="54" dy="19">high throughput</tspan><tspan x="54" dy="19">simpler rollback</tspan></text><rect x="360" y="112" width="280" height="205" class="box" fill="#dcfce7" stroke="#374151"/><text x="500" y="141" class="head" text-anchor="middle">Online inference</text><text x="374" y="168" class="body" text-anchor="start"><tspan x="374" dy="0">one request at a time</tspan><tspan x="374" dy="19">milliseconds</tspan><tspan x="374" dy="19">fresh features</tspan><tspan x="374" dy="19">strict availability</tspan></text><rect x="680" y="112" width="280" height="205" class="box" fill="#fef3c7" stroke="#374151"/><text x="820" y="141" class="head" text-anchor="middle">Edge inference</text><text x="694" y="168" class="body" text-anchor="start"><tspan x="694" dy="0">on-device or local</tspan><tspan x="694" dy="19">offline operation</tspan><tspan x="694" dy="19">tight memory/power</tspan><tspan x="694" dy="19">slow fleet updates</tspan></text><text x="180" y="355" class="head" text-anchor="middle">scheduled</text><text x="500" y="355" class="head" text-anchor="middle">request-driven</text><text x="820" y="355" class="head" text-anchor="middle">resource-constrained</text>
</svg>
