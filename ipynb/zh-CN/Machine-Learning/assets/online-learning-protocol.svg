<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img" aria-labelledby="title desc">
<title id="title">The online prediction protocol</title>
<desc id="desc">A learner must decide before the current outcome is revealed, then updates from feedback.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
  </marker>
</defs>
<style>
text { font-family: Arial, Helvetica, sans-serif; letter-spacing: 0; fill: #1f2937; }
.title { font-size: 25px; font-weight: 700; }
.subtitle { font-size: 14px; fill: #4b5563; }
.head { font-size: 16px; font-weight: 700; }
.body { font-size: 13px; }
.small { font-size: 12px; fill: #4b5563; }
.formula { font-family: "Courier New", monospace; font-size: 13px; }
.box { stroke: #374151; stroke-width: 1.4; rx: 8; }
.soft { stroke: #9ca3af; stroke-width: 1.2; rx: 8; }
.arrow { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#arrow); }
.dash { stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 7 5; fill: none; marker-end: url(#arrow); }
</style>
<rect width="1000" height="380" fill="#ffffff"/>
<text x="40" y="42" class="title" text-anchor="start">The online prediction protocol</text>
<text x="40" y="67" class="subtitle" text-anchor="start">A learner must decide before the current outcome is revealed, then updates from feedback.</text>
<rect x="40" y="120" width="170" height="100" class="box" fill="#f9fafb" stroke="#374151"/><text x="125" y="147" class="head" text-anchor="middle">1. Observe</text><text x="54" y="173" class="body" text-anchor="start"><tspan x="54" dy="0">context x_t</tspan><tspan x="54" dy="19">or loss function</tspan></text><path d="M 210 170 L 285 170" class="arrow"/><rect x="285" y="120" width="170" height="100" class="box" fill="#f9fafb" stroke="#374151"/><text x="370" y="147" class="head" text-anchor="middle">2. Decide</text><text x="299" y="173" class="body" text-anchor="start"><tspan x="299" dy="0">prediction / action</tspan><tspan x="299" dy="19">using w_t</tspan></text><path d="M 455 170 L 530 170" class="arrow"/><rect x="530" y="120" width="170" height="100" class="box" fill="#f9fafb" stroke="#374151"/><text x="615" y="147" class="head" text-anchor="middle">3. Reveal</text><text x="544" y="173" class="body" text-anchor="start"><tspan x="544" dy="0">outcome y_t</tspan><tspan x="544" dy="19">or full loss l_t</tspan></text><path d="M 700 170 L 775 170" class="arrow"/><rect x="775" y="120" width="180" height="100" class="box" fill="#dcfce7" stroke="#374151"/><text x="865" y="147" class="head" text-anchor="middle">4. Update</text><text x="789" y="173" class="body" text-anchor="start"><tspan x="789" dy="0">w_(t+1)</tspan><tspan x="789" dy="19">before next round</tspan></text><path d="M 865 220 L 125 270" class="dash"/><text x="495" y="237" class="small" text-anchor="middle">repeat for t = 1,...,T</text><text x="500" y="330" class="head" text-anchor="middle">Evaluation: cumulative loss versus an explicit comparator</text>
</svg>
