<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="370" viewBox="0 0 1000 370" role="img" aria-labelledby="title desc">
<title id="title">Identification converts a causal query into observed-data quantities</title>
<desc id="desc">Backdoor adjustment controls observed common causes; frontdoor identification uses a valid mediator despite hidden treatment-outcome confounding.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
  </marker>
</defs>
<style>
text { font-family: Arial, Helvetica, sans-serif; letter-spacing: 0; fill: #1f2937; }
.title { font-size: 25px; font-weight: 700; }
.subtitle { font-size: 14px; fill: #4b5563; }
.head { font-size: 16px; font-weight: 700; }
.body { font-size: 13px; }
.small { font-size: 12px; fill: #4b5563; }
.formula { font-family: "Courier New", monospace; font-size: 13px; }
.box { stroke-width: 1.4; rx: 7; }
.arrow { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#arrow); }
.dash { stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 7 5; fill: none; marker-end: url(#arrow); }
.blocked { stroke: #dc2626; stroke-width: 3; }
</style>
<rect width="1000" height="370" fill="#ffffff"/>
<text x="40" y="42" class="title" text-anchor="start">Identification converts a causal query into observed-data quantities</text>
<text x="40" y="68" class="subtitle" text-anchor="start">Backdoor adjustment controls observed common causes; frontdoor identification uses a valid mediator despite hidden treatment-outcome confounding.</text>
<text x="250" y="105" class="head" text-anchor="middle">Backdoor adjustment</text><circle cx="250" cy="150" r="28" fill="#fee2e2" stroke="#374151" stroke-width="1.5"/><text x="250" y="155" class="head" text-anchor="middle">C</text><circle cx="135" cy="250" r="28" fill="#dbeafe" stroke="#374151" stroke-width="1.5"/><text x="135" y="255" class="head" text-anchor="middle">T</text><circle cx="365" cy="250" r="28" fill="#dcfce7" stroke="#374151" stroke-width="1.5"/><text x="365" y="255" class="head" text-anchor="middle">Y</text><path d="M 230 173 L 155 228" class="arrow"/><path d="M 270 173 L 345 228" class="arrow"/><path d="M 163 250 L 337 250" class="arrow"/><text x="250" y="310" class="small" text-anchor="middle">Block T ← C → Y by adjusting C</text><text x="750" y="105" class="head" text-anchor="middle">Frontdoor identification</text><circle cx="620" cy="235" r="28" fill="#dbeafe" stroke="#374151" stroke-width="1.5"/><text x="620" y="240" class="head" text-anchor="middle">T</text><circle cx="750" cy="235" r="28" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/><text x="750" y="240" class="head" text-anchor="middle">M</text><circle cx="880" cy="235" r="28" fill="#dcfce7" stroke="#374151" stroke-width="1.5"/><text x="880" y="240" class="head" text-anchor="middle">Y</text><circle cx="750" cy="130" r="28" fill="#fee2e2" stroke="#374151" stroke-width="1.5"/><text x="750" y="135" class="head" text-anchor="middle">U</text><path d="M 648 235 L 722 235" class="arrow"/><path d="M 778 235 L 852 235" class="arrow"/><path d="M 728 148 L 640 215" class="dash"/><path d="M 772 148 L 860 215" class="dash"/><text x="750" y="310" class="small" text-anchor="middle">Use a fully mediating M under strict conditions</text>
</svg>
