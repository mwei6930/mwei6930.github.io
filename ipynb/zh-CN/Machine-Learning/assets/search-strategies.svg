<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Hyperparameter search allocates evaluations differently</title><desc id="desc">Grid search, random search, Bayesian optimization and successive halving use different rules to choose configurations and allocate resources.</desc>
  <style>.t{font:700 28px Arial,sans-serif;fill:#0f172a}.h{font:700 19px Arial,sans-serif;fill:#0f172a}.b{font:15px Arial,sans-serif;fill:#334155}.s{font:13px Arial,sans-serif;fill:#475569}.p{fill:#fff;stroke:#64748b;stroke-width:2}.axis{stroke:#334155;stroke-width:2}</style>
  <rect width="1200" height="650" fill="#f8fafc"/><text x="600" y="42" text-anchor="middle" class="t">Hyperparameter search allocates evaluations differently</text>
  <rect x="30" y="78" width="270" height="500" rx="8" class="p"/><text x="165" y="112" text-anchor="middle" class="h">Grid search</text><line x1="75" y1="350" x2="255" y2="350" class="axis"/><line x1="75" y1="350" x2="75" y2="155" class="axis"/><g fill="#2563eb"><circle cx="105" cy="185" r="6"/><circle cx="150" cy="185" r="6"/><circle cx="195" cy="185" r="6"/><circle cx="240" cy="185" r="6"/><circle cx="105" cy="230" r="6"/><circle cx="150" cy="230" r="6"/><circle cx="195" cy="230" r="6"/><circle cx="240" cy="230" r="6"/><circle cx="105" cy="275" r="6"/><circle cx="150" cy="275" r="6"/><circle cx="195" cy="275" r="6"/><circle cx="240" cy="275" r="6"/><circle cx="105" cy="320" r="6"/><circle cx="150" cy="320" r="6"/><circle cx="195" cy="320" r="6"/><circle cx="240" cy="320" r="6"/></g><text x="165" y="397" text-anchor="middle" class="b">systematic Cartesian product</text><text x="165" y="425" text-anchor="middle" class="b">easy to parallelize</text><text x="165" y="453" text-anchor="middle" class="s">wastes trials when only a few</text><text x="165" y="474" text-anchor="middle" class="s">dimensions strongly matter</text>
  <rect x="320" y="78" width="270" height="500" rx="8" class="p"/><text x="455" y="112" text-anchor="middle" class="h">Random search</text><line x1="365" y1="350" x2="545" y2="350" class="axis"/><line x1="365" y1="350" x2="365" y2="155" class="axis"/><g fill="#16a34a"><circle cx="392" cy="182" r="6"/><circle cx="530" cy="205" r="6"/><circle cx="445" cy="230" r="6"/><circle cx="478" cy="173" r="6"/><circle cx="410" cy="293" r="6"/><circle cx="515" cy="320" r="6"/><circle cx="470" cy="305" r="6"/><circle cx="535" cy="258" r="6"/><circle cx="398" cy="243" r="6"/><circle cx="490" cy="266" r="6"/></g><text x="455" y="397" text-anchor="middle" class="b">samples stated distributions</text><text x="455" y="425" text-anchor="middle" class="b">covers more distinct values</text><text x="455" y="453" text-anchor="middle" class="s">budget controls trial count;</text><text x="455" y="474" text-anchor="middle" class="s">log-scale priors often matter</text>
  <rect x="610" y="78" width="270" height="500" rx="8" class="p"/><text x="745" y="112" text-anchor="middle" class="h">Bayesian optimization</text><line x1="650" y1="350" x2="840" y2="350" class="axis"/><line x1="650" y1="350" x2="650" y2="155" class="axis"/><path d="M660 305 C690 210 720 320 750 235 S810 170 835 220" fill="none" stroke="#7c3aed" stroke-width="4"/><path d="M660 325 C690 245 720 345 750 275 S810 205 835 245 L835 195 C810 145 780 200 750 195 S690 175 660 285 Z" fill="#ddd6fe" opacity=".6"/><g fill="#ef4444"><circle cx="675" cy="275" r="7"/><circle cx="730" cy="290" r="7"/><circle cx="795" cy="184" r="7"/></g><circle cx="820" cy="190" r="10" fill="#f59e0b"/><text x="812" y="170" class="s">next trial</text><text x="745" y="397" text-anchor="middle" class="b">surrogate + acquisition rule</text><text x="745" y="425" text-anchor="middle" class="b">learns from earlier trials</text><text x="745" y="453" text-anchor="middle" class="s">useful when evaluations are</text><text x="745" y="474" text-anchor="middle" class="s">expensive; overhead can matter</text>
  <rect x="900" y="78" width="270" height="500" rx="8" class="p"/><text x="1035" y="112" text-anchor="middle" class="h">Successive halving</text><rect x="930" y="160" width="210" height="52" rx="5" fill="#dbeafe" stroke="#2563eb"/><text x="1035" y="192" text-anchor="middle" class="b">16 candidates x 1 resource</text><rect x="955" y="235" width="160" height="52" rx="5" fill="#dcfce7" stroke="#16a34a"/><text x="1035" y="267" text-anchor="middle" class="b">8 candidates x 2</text><rect x="980" y="310" width="110" height="52" rx="5" fill="#ffedd5" stroke="#ea580c"/><text x="1035" y="342" text-anchor="middle" class="b">4 x 4</text><path d="M1035 212 V235 M1035 287 V310" stroke="#334155" stroke-width="2"/><text x="1035" y="397" text-anchor="middle" class="b">discard weak candidates early</text><text x="1035" y="425" text-anchor="middle" class="b">increase data, epochs or trees</text><text x="1035" y="453" text-anchor="middle" class="s">early score must predict later</text><text x="1035" y="474" text-anchor="middle" class="s">quality well enough</text>
  <rect x="180" y="532" width="840" height="76" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="600" y="562" text-anchor="middle" class="h">Every search is an adaptive use of validation data</text><text x="600" y="589" text-anchor="middle" class="b">The selected score is optimistic unless final performance is estimated on an untouched outer split.</text>
</svg>
