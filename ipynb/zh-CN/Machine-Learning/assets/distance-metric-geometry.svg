<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Distance metrics create different neighborhoods</title>
  <desc id="desc">Unit neighborhoods for Manhattan, Euclidean, Mahalanobis, and cosine geometry have different shapes and invariances.</desc>
  <defs>
    <style>.title{font:700 28px Arial,sans-serif;fill:#0f172a}.head{font:700 18px Arial,sans-serif;fill:#0f172a}.body{font:14px Arial,sans-serif;fill:#1e293b}.small{font:13px Arial,sans-serif;fill:#475569}.axis{stroke:#64748b;stroke-width:1.5}</style>
  </defs>
  <rect width="1200" height="680" fill="#f8fafc"/>
  <text x="600" y="43" text-anchor="middle" class="title">A metric decides what "near" means</text>

  <rect x="35" y="82" width="270" height="430" rx="8" fill="#fff" stroke="#64748b"/>
  <text x="170" y="118" text-anchor="middle" class="head">Manhattan: L1</text>
  <line x1="75" y1="270" x2="265" y2="270" class="axis"/><line x1="170" y1="170" x2="170" y2="370" class="axis"/>
  <polygon points="170,185 255,270 170,355 85,270" fill="#ffedd5" stroke="#f97316" stroke-width="3"/>
  <circle cx="170" cy="270" r="5" fill="#0f172a"/>
  <text x="170" y="402" text-anchor="middle" class="body">d(x,z) = sum |xj-zj|</text>
  <text x="170" y="432" text-anchor="middle" class="small">axis-aligned changes add</text>
  <text x="170" y="456" text-anchor="middle" class="small">diamond-shaped unit ball</text>
  <text x="170" y="480" text-anchor="middle" class="small">less dominated by one large gap</text>

  <rect x="320" y="82" width="270" height="430" rx="8" fill="#fff" stroke="#64748b"/>
  <text x="455" y="118" text-anchor="middle" class="head">Euclidean: L2</text>
  <line x1="360" y1="270" x2="550" y2="270" class="axis"/><line x1="455" y1="170" x2="455" y2="370" class="axis"/>
  <circle cx="455" cy="270" r="85" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <circle cx="455" cy="270" r="5" fill="#0f172a"/>
  <text x="455" y="402" text-anchor="middle" class="body">d(x,z) = sqrt(sum (xj-zj)^2)</text>
  <text x="455" y="432" text-anchor="middle" class="small">rotation invariant</text>
  <text x="455" y="456" text-anchor="middle" class="small">circular unit ball</text>
  <text x="455" y="480" text-anchor="middle" class="small">sensitive to scale and large gaps</text>

  <rect x="605" y="82" width="270" height="430" rx="8" fill="#fff" stroke="#64748b"/>
  <text x="740" y="118" text-anchor="middle" class="head">Mahalanobis</text>
  <line x1="645" y1="270" x2="835" y2="270" class="axis"/><line x1="740" y1="170" x2="740" y2="370" class="axis"/>
  <ellipse cx="740" cy="270" rx="105" ry="48" transform="rotate(-30 740 270)" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <line x1="670" y1="315" x2="810" y2="225" stroke="#16a34a" stroke-dasharray="6 5"/>
  <circle cx="740" cy="270" r="5" fill="#0f172a"/>
  <text x="740" y="402" text-anchor="middle" class="body">d^2 = (x-z)^T S^-1 (x-z)</text>
  <text x="740" y="432" text-anchor="middle" class="small">rescales correlated directions</text>
  <text x="740" y="456" text-anchor="middle" class="small">elliptical unit ball</text>
  <text x="740" y="480" text-anchor="middle" class="small">requires a stable covariance model</text>

  <rect x="890" y="82" width="275" height="430" rx="8" fill="#fff" stroke="#64748b"/>
  <text x="1027" y="118" text-anchor="middle" class="head">Cosine similarity</text>
  <line x1="935" y1="330" x2="1125" y2="330" class="axis"/><line x1="965" y1="360" x2="965" y2="165" class="axis"/>
  <line x1="965" y1="330" x2="1105" y2="210" stroke="#7c3aed" stroke-width="4"/>
  <line x1="965" y1="330" x2="1080" y2="185" stroke="#db2777" stroke-width="4"/>
  <path d="M1020 283 A72 72 0 0 0 1010 273" fill="none" stroke="#0f172a" stroke-width="2"/>
  <text x="1027" y="402" text-anchor="middle" class="body">s(x,z) = x^T z / (||x|| ||z||)</text>
  <text x="1027" y="432" text-anchor="middle" class="small">compares direction, not magnitude</text>
  <text x="1027" y="456" text-anchor="middle" class="small">common for sparse text vectors</text>
  <text x="1027" y="480" text-anchor="middle" class="small">undefined for a zero vector</text>

  <rect x="90" y="548" width="1020" height="82" rx="7" fill="#ecfeff" stroke="#0f766e"/>
  <text x="600" y="579" text-anchor="middle" class="head">There is no universally correct metric</text>
  <text x="600" y="607" text-anchor="middle" class="body">Choose it from feature semantics, preprocess inside validation, and test whether neighborhood labels are stable.</text>
</svg>
