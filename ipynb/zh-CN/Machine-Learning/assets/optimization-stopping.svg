<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <defs><style>.t{font:700 28px Arial,sans-serif;fill:#1f2937}.h{font:700 20px Arial,sans-serif;fill:#1f2937}.b{font:16px Arial,sans-serif;fill:#374151}.s{font:14px Arial,sans-serif;fill:#475569}.box{fill:#fff;stroke:#64748b;stroke-width:2}.axis{stroke:#334155;stroke-width:3;fill:none}</style></defs>
  <rect width="1200" height="650" fill="#f8fafc"/><text x="600" y="42" text-anchor="middle" class="t">Stopping requires several signals, not one magic threshold</text>
  <rect x="42" y="82" width="720" height="500" rx="8" class="box"/><text x="402" y="118" text-anchor="middle" class="h">Training diagnostics across iterations</text>
  <g transform="translate(92 160)"><path d="M25 330V10M25 330H610" class="axis"/><path d="M40 48 C140 180 250 250 580 284" fill="none" stroke="#2563eb" stroke-width="5"/><path d="M40 85 C150 190 253 253 370 265 C452 268 500 225 580 190" fill="none" stroke="#ef4444" stroke-width="5"/><path d="M40 32 C100 158 170 238 300 290 C410 321 505 316 580 310" fill="none" stroke="#16a34a" stroke-width="4" stroke-dasharray="9 7"/><line x1="370" y1="25" x2="370" y2="330" stroke="#d97706" stroke-width="3" stroke-dasharray="8 7"/><text x="370" y="352" text-anchor="middle" class="s">selected checkpoint</text><text x="487" y="183" class="s" fill="#dc2626">validation loss</text><text x="488" y="277" class="s" fill="#2563eb">training objective</text><text x="470" y="326" class="s" fill="#15803d">gradient norm</text></g>
  <rect x="798" y="82" width="360" height="500" rx="8" class="box"/><text x="978" y="118" text-anchor="middle" class="h">Stop or investigate when...</text>
  <g transform="translate(833 157)"><circle cx="10" cy="8" r="7" fill="#2563eb"/><text x="30" y="14" class="b">objective improvement is tiny</text><text x="30" y="39" class="s">use relative, not only absolute change</text><circle cx="10" cy="91" r="7" fill="#16a34a"/><text x="30" y="97" class="b">gradient norm is sufficiently small</text><text x="30" y="122" class="s">after accounting for scaling and constraints</text><circle cx="10" cy="174" r="7" fill="#d97706"/><text x="30" y="180" class="b">validation metric stops improving</text><text x="30" y="205" class="s">retain the best checkpoint with patience</text><circle cx="10" cy="257" r="7" fill="#7c3aed"/><text x="30" y="263" class="b">budget or wall time is exhausted</text><text x="30" y="288" class="s">report optimization status honestly</text><circle cx="10" cy="340" r="7" fill="#ef4444"/><text x="30" y="346" class="b">loss oscillates or diverges</text><text x="30" y="371" class="s">do not mislabel failure as convergence</text></g>
  <text x="978" y="548" text-anchor="middle" class="s">A small gradient can also indicate a saddle,</text><text x="978" y="570" text-anchor="middle" class="s">a plateau, saturation, or numerical underflow.</text>
  <text x="600" y="620" text-anchor="middle" class="b">For stochastic objectives, inspect smoothed trends and uncertainty rather than single noisy batches.</text>
</svg>
