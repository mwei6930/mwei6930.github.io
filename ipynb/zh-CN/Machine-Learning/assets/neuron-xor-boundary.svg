<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">From a linear neuron to the XOR limitation</title>
  <desc id="desc">The left side shows weighted inputs, bias, activation, and output. The right side compares a linearly separable problem with XOR, which one hyperplane cannot solve.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#495057"/></marker>
    <style>.h{font:700 24px Arial,sans-serif;fill:#212529}.t{font:17px Arial,sans-serif;fill:#343a40}.s{font:15px Arial,sans-serif;fill:#495057}.box{stroke:#495057;stroke-width:2;rx:6}.line{stroke:#495057;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.axis{stroke:#868e96;stroke-width:2}.pos{fill:#4dabf7;stroke:#1864ab;stroke-width:2}.neg{fill:#ff8787;stroke:#c92a2a;stroke-width:2}</style>
  </defs>
  <text x="600" y="38" text-anchor="middle" class="h">A Perceptron Learns One Linear Boundary</text>
  <rect x="30" y="70" width="540" height="500" class="box" fill="#f8f9fa"/>
  <text x="300" y="108" text-anchor="middle" class="h">Artificial neuron</text>
  <circle cx="105" cy="195" r="28" class="pos"/><circle cx="105" cy="310" r="28" class="pos"/><circle cx="105" cy="425" r="28" class="pos"/>
  <text x="105" y="201" text-anchor="middle" class="t">x1</text><text x="105" y="316" text-anchor="middle" class="t">x2</text><text x="105" y="431" text-anchor="middle" class="t">1</text>
  <path d="M135 195 L250 275 M135 310 L250 292 M135 425 L250 310" class="line"/>
  <text x="180" y="205" class="s">w1</text><text x="180" y="286" class="s">w2</text><text x="180" y="390" class="s">b</text>
  <circle cx="285" cy="290" r="54" fill="#fff3bf" stroke="#e67700" stroke-width="2"/>
  <text x="285" y="282" text-anchor="middle" class="t">z = w^T x</text><text x="285" y="307" text-anchor="middle" class="t">+ b</text>
  <path d="M340 290 H405" class="line"/>
  <rect x="410" y="247" width="115" height="86" class="box" fill="#d3f9d8"/>
  <text x="467" y="281" text-anchor="middle" class="t">activation</text><text x="467" y="307" text-anchor="middle" class="t">g(z)</text>
  <text x="300" y="500" text-anchor="middle" class="s">Decision surface: w^T x + b = 0</text>
  <rect x="600" y="70" width="570" height="500" class="box" fill="#f8f9fa"/>
  <text x="885" y="108" text-anchor="middle" class="h">Geometry of the labels</text>
  <text x="735" y="150" text-anchor="middle" class="t">Linearly separable</text>
  <line x1="645" y1="350" x2="825" y2="350" class="axis"/><line x1="675" y1="390" x2="675" y2="185" class="axis"/>
  <circle cx="710" cy="300" r="12" class="pos"/><circle cx="735" cy="260" r="12" class="pos"/><circle cx="770" cy="220" r="12" class="pos"/>
  <circle cx="720" cy="335" r="12" class="neg"/><circle cx="765" cy="320" r="12" class="neg"/><circle cx="800" cy="290" r="12" class="neg"/>
  <line x1="690" y1="200" x2="815" y2="345" stroke="#2b8a3e" stroke-width="4"/>
  <text x="1015" y="150" text-anchor="middle" class="t">XOR</text>
  <line x1="910" y1="350" x2="1090" y2="350" class="axis"/><line x1="940" y1="390" x2="940" y2="185" class="axis"/>
  <circle cx="975" cy="315" r="13" class="neg"/><circle cx="1050" cy="220" r="13" class="neg"/>
  <circle cx="975" cy="220" r="13" class="pos"/><circle cx="1050" cy="315" r="13" class="pos"/>
  <path d="M925 185 C1030 240 970 300 1100 345" stroke="#c92a2a" stroke-width="3" stroke-dasharray="8 7" fill="none"/>
  <text x="1015" y="425" text-anchor="middle" class="s">No single line separates both classes</text>
  <text x="885" y="515" text-anchor="middle" class="t">Hidden nonlinear features can transform XOR</text>
  <text x="885" y="540" text-anchor="middle" class="t">into a linearly separable representation.</text>
</svg>
