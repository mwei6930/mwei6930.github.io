<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Factor analysis and independent component analysis</title><desc id="desc">Factor analysis explains correlated measurements with latent factors plus feature-specific noise, while ICA unmixes independent non-Gaussian sources.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#475569"/></marker><style>.h{font:700 24px Arial,sans-serif;fill:#17212b}.t{font:18px Arial,sans-serif;fill:#334155}.s{font:15px Arial,sans-serif;fill:#526172}.line{stroke:#475569;stroke-width:3;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="620" fill="#fff"/><text x="600" y="42" text-anchor="middle" class="h">Latent factors explain covariance; independent components unmix sources</text>
  <rect x="35" y="85" width="540" height="450" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="305" y="125" text-anchor="middle" class="h">Factor Analysis</text><circle cx="185" cy="240" r="55" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="185" y="247" text-anchor="middle" class="t">latent z</text><rect x="345" y="165" width="145" height="48" rx="6" fill="#dcfce7"/><rect x="345" y="235" width="145" height="48" rx="6" fill="#dcfce7"/><rect x="345" y="305" width="145" height="48" rx="6" fill="#dcfce7"/><text x="417" y="196" text-anchor="middle" class="t">feature x1</text><text x="417" y="266" text-anchor="middle" class="t">feature x2</text><text x="417" y="336" text-anchor="middle" class="t">feature x3</text><line x1="235" y1="220" x2="337" y2="190" class="line"/><line x1="240" y1="240" x2="337" y2="258" class="line"/><line x1="230" y1="270" x2="337" y2="323" class="line"/><circle cx="510" cy="190" r="14" fill="#e8590c"/><circle cx="510" cy="260" r="14" fill="#e8590c"/><circle cx="510" cy="330" r="14" fill="#e8590c"/><text x="305" y="410" text-anchor="middle" class="t">x = Lambda z + epsilon</text><text x="305" y="442" text-anchor="middle" class="s">shared covariance + feature-specific noise</text><text x="305" y="480" text-anchor="middle" class="s">rotation affects interpretation</text>
  <rect x="625" y="85" width="540" height="450" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="895" y="125" text-anchor="middle" class="h">Independent Component Analysis</text><path d="M680 225 q45-95 90 0t90 0" fill="none" stroke="#2563eb" stroke-width="4"/><path d="M680 290 h45 v-60 h45 v60 h45 v-60 h45" fill="none" stroke="#e8590c" stroke-width="4"/><text x="770" y="335" text-anchor="middle" class="s">independent non-Gaussian sources s</text><line x1="870" y1="260" x2="930" y2="260" class="line"/><rect x="940" y="190" width="160" height="140" rx="6" fill="#f3e8ff" stroke="#9333ea" stroke-width="3"/><path d="M965 225 C1000 290 1040 190 1075 255" fill="none" stroke="#2563eb" stroke-width="4"/><path d="M965 290 C1010 205 1045 330 1075 235" fill="none" stroke="#e8590c" stroke-width="4"/><text x="1020" y="365" text-anchor="middle" class="t">mixed x = A s</text><line x1="1020" y1="390" x2="885" y2="390" class="line"/><text x="950" y="425" text-anchor="middle" class="s">learn W so estimated s = W x</text><text x="895" y="470" text-anchor="middle" class="s">scale and order are not identifiable</text><text x="600" y="580" text-anchor="middle" class="t">PCA decorrelates second moments; ICA uses stronger independence and non-Gaussianity assumptions.</text>
</svg>
