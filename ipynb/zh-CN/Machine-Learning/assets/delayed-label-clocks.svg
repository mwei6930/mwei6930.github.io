<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="385" viewBox="0 0 1000 385" role="img" aria-labelledby="title desc">
<title id="title">Production evaluation runs on two clocks</title>
<desc id="desc">Predictions are logged now, while outcome labels mature later and must be joined to a fixed cohort.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
  </marker>
</defs>
<style>
text { font-family: Arial, Helvetica, sans-serif; letter-spacing: 0; fill: #1f2937; }
.title { font-size: 25px; font-weight: 700; }
.subtitle { font-size: 14px; fill: #4b5563; }
.head { font-size: 16px; font-weight: 700; }
.body { font-size: 13px; }
.small { font-size: 12px; fill: #4b5563; }
.formula { font-family: "Courier New", monospace; font-size: 13px; }
.box { stroke-width: 1.4; rx: 7; }
.arrow { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#arrow); }
.dash { stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 7 5; fill: none; marker-end: url(#arrow); }
.line { stroke: #6b7280; stroke-width: 1.5; fill: none; }
</style>
<rect width="1000" height="385" fill="#ffffff"/>
<text x="40" y="42" class="title" text-anchor="start">Production evaluation runs on two clocks</text>
<text x="40" y="68" class="subtitle" text-anchor="start">Predictions are logged now, while outcome labels mature later and must be joined to a fixed cohort.</text>
<rect x="35" y="120" width="195" height="170" class="box" fill="#dbeafe" stroke="#374151"/><text x="132" y="149" class="head" text-anchor="middle">Prediction clock</text><text x="49" y="176" class="body" text-anchor="start"><tspan x="49" dy="0">request time</tspan><tspan x="49" dy="19">score and version</tspan><tspan x="49" dy="19">features logged</tspan></text><path d="M 230 205 L 310 205" class="arrow"/><text x="270" y="197" class="small" text-anchor="middle">hours/days</text><rect x="310" y="120" width="195" height="170" class="box" fill="#dcfce7" stroke="#374151"/><text x="407" y="149" class="head" text-anchor="middle">Outcome clock</text><text x="324" y="176" class="body" text-anchor="start"><tspan x="324" dy="0">label matures</tspan><tspan x="324" dy="19">censoring ends</tspan><tspan x="324" dy="19">join by entity</tspan></text><path d="M 505 205 L 585 205" class="arrow"/><text x="545" y="197" class="small" text-anchor="middle">backfill</text><rect x="585" y="120" width="195" height="170" class="box" fill="#fef3c7" stroke="#374151"/><text x="682" y="149" class="head" text-anchor="middle">Evaluation</text><text x="599" y="176" class="body" text-anchor="start"><tspan x="599" dy="0">fixed cohort</tspan><tspan x="599" dy="19">coverage</tspan><tspan x="599" dy="19">uncertainty</tspan></text><path d="M 780 205 L 825 205" class="arrow"/><rect x="825" y="120" width="140" height="170" class="box" fill="#fee2e2" stroke="#374151"/><text x="895" y="149" class="head" text-anchor="middle">Action</text><text x="839" y="176" class="body" text-anchor="start"><tspan x="839" dy="0">alert</tspan><tspan x="839" dy="19">retrain</tspan><tspan x="839" dy="19">rollback</tspan></text><text x="500" y="338" class="head" text-anchor="middle">Before labels mature, proxy metrics can diagnose inputs but cannot prove predictive quality.</text>
</svg>
