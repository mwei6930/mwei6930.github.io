<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc">
<title id="title">Dynamic programming alternates evaluation and improvement</title>
<desc id="desc">A known transition model allows expected Bellman backups over every successor.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
  </marker>
</defs>
<style>
text { font-family: Arial, Helvetica, sans-serif; letter-spacing: 0; fill: #1f2937; }
.title { font-size: 25px; font-weight: 700; }
.subtitle { font-size: 14px; fill: #4b5563; }
.head { font-size: 16px; font-weight: 700; }
.body { font-size: 13px; }
.small { font-size: 12px; fill: #4b5563; }
.formula { font-family: "Courier New", monospace; font-size: 13px; }
.box { stroke: #374151; stroke-width: 1.4; rx: 8; }
.soft { stroke: #9ca3af; stroke-width: 1.2; rx: 8; }
.arrow { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#arrow); }
.dash { stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 7 5; fill: none; marker-end: url(#arrow); }
</style>
<rect width="1000" height="390" fill="#ffffff"/>
<text x="40" y="42" class="title" text-anchor="start">Dynamic programming alternates evaluation and improvement</text>
<text x="40" y="67" class="subtitle" text-anchor="start">A known transition model allows expected Bellman backups over every successor.</text>
<rect x="55" y="120" width="220" height="125" class="box" fill="#dbeafe" stroke="#374151"/><text x="165" y="147" class="head" text-anchor="middle">Policy evaluation</text><text x="69" y="173" class="body" text-anchor="start"><tspan x="69" dy="0">compute V^π</tspan><tspan x="69" dy="19">for current π</tspan></text><path d="M 275 182 L 390 182" class="arrow"/><text x="332" y="174" class="small" text-anchor="middle">V^π</text><rect x="390" y="120" width="220" height="125" class="box" fill="#dcfce7" stroke="#374151"/><text x="500" y="147" class="head" text-anchor="middle">Policy improvement</text><text x="404" y="173" class="body" text-anchor="start"><tspan x="404" dy="0">greedy using Q^π</tspan><tspan x="404" dy="19">produce π&#x27;</tspan></text><path d="M 610 182 L 725 182" class="arrow"/><text x="667" y="174" class="small" text-anchor="middle">π&#x27;</text><rect x="725" y="120" width="220" height="125" class="box" fill="#fef3c7" stroke="#374151"/><text x="835" y="147" class="head" text-anchor="middle">Convergence test</text><text x="739" y="173" class="body" text-anchor="start"><tspan x="739" dy="0">stable policy?</tspan><tspan x="739" dy="19">otherwise repeat</tspan></text><path d="M 835 245 L 165 285" class="dash"/><text x="500" y="257" class="small" text-anchor="middle">repeat</text><text x="500" y="335" class="head" text-anchor="middle">Value iteration merges partial evaluation and greedy improvement into one backup.</text>
</svg>
