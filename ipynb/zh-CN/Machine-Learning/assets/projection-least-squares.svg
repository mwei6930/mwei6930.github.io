<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Least squares as orthogonal projection</title>
  <desc id="desc">A target vector b is decomposed into its projection p in the column space of A and a perpendicular residual e.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2c6ca3"/></marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b23a35"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#21835a"/></marker>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #172033; }
      .head { font: 700 21px Arial, sans-serif; fill: #172033; }
      .label { font: 600 18px Arial, sans-serif; fill: #172033; }
      .small { font: 15px Arial, sans-serif; fill: #475569; }
    </style>
  </defs>
  <rect width="1200" height="650" fill="#ffffff"/>
  <text x="600" y="48" text-anchor="middle" class="title">Least Squares Finds the Closest Reachable Prediction</text>

  <polygon points="100,500 750,210 1110,330 450,585" fill="#eef6f2" stroke="#76a990" stroke-width="2"/>
  <text x="815" y="365" class="head" fill="#176c49">column space Col(A)</text>
  <text x="815" y="393" class="small">all reachable predictions Ax</text>

  <circle cx="275" cy="505" r="7" fill="#172033"/>
  <text x="248" y="536" class="label">origin</text>

  <line x1="275" y1="505" x2="750" y2="295" stroke="#21835a" stroke-width="5" marker-end="url(#arrow-green)"/>
  <text x="510" y="365" class="label" fill="#176c49">p = A x_hat</text>
  <text x="490" y="392" class="small">projection / fitted values</text>

  <line x1="275" y1="505" x2="660" y2="105" stroke="#2c6ca3" stroke-width="5" marker-end="url(#arrow-blue)"/>
  <text x="430" y="252" class="label" fill="#2c6ca3">b</text>
  <text x="420" y="278" class="small">observed target vector</text>

  <line x1="750" y1="295" x2="660" y2="105" stroke="#b23a35" stroke-width="5" stroke-dasharray="10 7" marker-end="url(#arrow-red)"/>
  <text x="735" y="185" class="label" fill="#a8322d">e = b - p</text>
  <text x="745" y="211" class="small">unexplained residual</text>

  <polyline points="725,306 713,280 739,268" fill="none" stroke="#172033" stroke-width="3"/>
  <text x="780" y="262" class="label">90 degrees</text>

  <rect x="115" y="70" width="345" height="130" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="287" y="108" text-anchor="middle" class="head">Orthogonality condition</text>
  <text x="287" y="148" text-anchor="middle" class="label">A^T (b - A x_hat) = 0</text>
  <text x="287" y="178" text-anchor="middle" class="small">the residual is orthogonal to every column of A</text>

  <rect x="800" y="465" width="315" height="115" rx="8" fill="#fff7f5" stroke="#d89b96" stroke-width="2"/>
  <text x="958" y="504" text-anchor="middle" class="head">Optimization view</text>
  <text x="958" y="540" text-anchor="middle" class="label">minimize ||b - Ax||_2^2</text>
  <text x="958" y="568" text-anchor="middle" class="small">distance from b to Col(A)</text>
</svg>
