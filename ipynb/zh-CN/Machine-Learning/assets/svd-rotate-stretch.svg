<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="620" viewBox="0 0 1320 620" role="img" aria-labelledby="title desc">
  <title id="title">Geometric interpretation of singular value decomposition</title>
  <desc id="desc">SVD applies a rotation or reflection, axis-aligned stretching, and a final rotation or reflection.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #172033; }
      .head { font: 700 21px Arial, sans-serif; fill: #172033; }
      .label { font: 600 17px Arial, sans-serif; fill: #172033; }
      .small { font: 15px Arial, sans-serif; fill: #475569; }
      .axis { stroke: #94a3b8; stroke-width: 2; }
      .arrow { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1320" height="620" fill="#ffffff"/>
  <text x="660" y="48" text-anchor="middle" class="title">A = U Sigma V^T: Rotate, Stretch, Rotate</text>

  <g transform="translate(50 100)">
    <text x="135" y="25" text-anchor="middle" class="head">Input space</text>
    <line x1="25" y1="190" x2="245" y2="190" class="axis"/>
    <line x1="135" y1="80" x2="135" y2="300" class="axis"/>
    <circle cx="135" cy="190" r="82" fill="#e8f1fb" fill-opacity="0.65" stroke="#2c6ca3" stroke-width="3"/>
    <line x1="135" y1="190" x2="205" y2="148" stroke="#b23a35" stroke-width="4"/>
    <line x1="135" y1="190" x2="95" y2="122" stroke="#21835a" stroke-width="4"/>
    <text x="135" y="342" text-anchor="middle" class="small">unit circle and input directions</text>
  </g>

  <path d="M315 290H390" class="arrow"/>
  <text x="352" y="260" text-anchor="middle" class="head">V^T</text>
  <text x="352" y="322" text-anchor="middle" class="small">rotate / reflect</text>

  <g transform="translate(405 100)">
    <text x="135" y="25" text-anchor="middle" class="head">Singular-vector basis</text>
    <line x1="25" y1="190" x2="245" y2="190" class="axis"/>
    <line x1="135" y1="80" x2="135" y2="300" class="axis"/>
    <circle cx="135" cy="190" r="82" fill="#fff2cc" fill-opacity="0.7" stroke="#a97710" stroke-width="3"/>
    <line x1="53" y1="190" x2="217" y2="190" stroke="#b23a35" stroke-width="4"/>
    <line x1="135" y1="108" x2="135" y2="272" stroke="#21835a" stroke-width="4"/>
    <text x="135" y="342" text-anchor="middle" class="small">directions align with coordinate axes</text>
  </g>

  <path d="M670 290H745" class="arrow"/>
  <text x="707" y="260" text-anchor="middle" class="head">Sigma</text>
  <text x="707" y="322" text-anchor="middle" class="small">scale by singular values</text>

  <g transform="translate(760 100)">
    <text x="135" y="25" text-anchor="middle" class="head">Axis-aligned stretch</text>
    <line x1="15" y1="190" x2="255" y2="190" class="axis"/>
    <line x1="135" y1="80" x2="135" y2="300" class="axis"/>
    <ellipse cx="135" cy="190" rx="112" ry="55" fill="#f4faf7" fill-opacity="0.8" stroke="#21835a" stroke-width="3"/>
    <line x1="23" y1="190" x2="247" y2="190" stroke="#b23a35" stroke-width="4"/>
    <line x1="135" y1="135" x2="135" y2="245" stroke="#21835a" stroke-width="4"/>
    <text x="135" y="342" text-anchor="middle" class="small">singular values set the two axis lengths</text>
  </g>

  <path d="M1025 290H1095" class="arrow"/>
  <text x="1060" y="260" text-anchor="middle" class="head">U</text>
  <text x="1060" y="322" text-anchor="middle" class="small">rotate / reflect</text>

  <g transform="translate(1090 100)">
    <text x="105" y="25" text-anchor="middle" class="head">Output space</text>
    <line x1="0" y1="190" x2="210" y2="190" class="axis"/>
    <line x1="105" y1="80" x2="105" y2="300" class="axis"/>
    <ellipse cx="105" cy="190" rx="112" ry="55" transform="rotate(-28 105 190)" fill="#f3e8ff" fill-opacity="0.75" stroke="#76519b" stroke-width="3"/>
    <line x1="6" y1="243" x2="204" y2="137" stroke="#b23a35" stroke-width="4"/>
    <line x1="79" y1="141" x2="131" y2="239" stroke="#21835a" stroke-width="4"/>
    <text x="105" y="342" text-anchor="middle" class="small">oriented output ellipse</text>
  </g>

  <rect x="180" y="505" width="960" height="72" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="660" y="535" text-anchor="middle" class="label">Low-rank approximation keeps the largest singular values and their directions.</text>
  <text x="660" y="561" text-anchor="middle" class="small">Small singular values correspond to weakly expressed or noise-sensitive directions.</text>
</svg>
