<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">Evaluation of unsupervised structure</title>
  <desc id="desc">A four-lens evaluation framework combining internal geometry, external labels, stability, and downstream usefulness.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#475569"/></marker><style>.h{font:700 25px Arial,sans-serif;fill:#17212b}.t{font:18px Arial,sans-serif;fill:#334155}.s{font:15px Arial,sans-serif;fill:#526172}.box{stroke-width:3}.line{stroke:#475569;stroke-width:3;marker-end:url(#arrow)}</style></defs>
  <rect width="1200" height="610" fill="#fff"/>
  <text x="600" y="42" text-anchor="middle" class="h">Unsupervised evaluation needs several independent lenses</text>
  <rect x="455" y="218" width="290" height="150" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="3"/>
  <text x="600" y="265" text-anchor="middle" class="h">Candidate structure</text>
  <text x="600" y="303" text-anchor="middle" class="t">labels, density, scores, hierarchy</text>
  <text x="600" y="335" text-anchor="middle" class="s">produced under explicit assumptions</text>
  <rect x="65" y="95" width="290" height="150" rx="10" fill="#dbeafe" stroke="#2563eb" class="box"/>
  <text x="210" y="137" text-anchor="middle" class="h">Internal geometry</text><text x="210" y="174" text-anchor="middle" class="t">Silhouette, CH, DB</text><text x="210" y="207" text-anchor="middle" class="s">Does it match the chosen metric?</text>
  <rect x="845" y="95" width="290" height="150" rx="10" fill="#ffedd5" stroke="#e8590c" class="box"/>
  <text x="990" y="137" text-anchor="middle" class="h">External agreement</text><text x="990" y="174" text-anchor="middle" class="t">ARI, NMI, known outcomes</text><text x="990" y="207" text-anchor="middle" class="s">Only when trustworthy labels exist</text>
  <rect x="65" y="390" width="290" height="150" rx="10" fill="#ecfdf5" stroke="#16a34a" class="box"/>
  <text x="210" y="432" text-anchor="middle" class="h">Stability</text><text x="210" y="469" text-anchor="middle" class="t">Seeds, samples, perturbations</text><text x="210" y="502" text-anchor="middle" class="s">Does the conclusion survive variation?</text>
  <rect x="845" y="390" width="290" height="150" rx="10" fill="#f3e8ff" stroke="#9333ea" class="box"/>
  <text x="990" y="432" text-anchor="middle" class="h">Usefulness and validity</text><text x="990" y="469" text-anchor="middle" class="t">Domain review, downstream value</text><text x="990" y="502" text-anchor="middle" class="s">Does it support a real decision?</text>
  <line x1="449" y1="245" x2="365" y2="205" class="line"/><line x1="751" y1="245" x2="835" y2="205" class="line"/><line x1="449" y1="340" x2="365" y2="410" class="line"/><line x1="751" y1="340" x2="835" y2="410" class="line"/>
  <text x="600" y="582" text-anchor="middle" class="t">No single score proves that discovered clusters are real, useful, or causally meaningful.</text>
</svg>
