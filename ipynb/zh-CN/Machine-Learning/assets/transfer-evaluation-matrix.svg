<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Held-out-domain evaluation for transfer and adaptation</title><desc id="desc">Several source domains train and select a model without held-out-domain labels, which are used only for final comparison against source-only, target-only, pooled, probe, and adaptation baselines.</desc>
<defs><marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#475569"/></marker>
<style>.title{font:700 26px Arial,sans-serif;fill:#17212b}.bh{font:700 19px Arial,sans-serif;fill:#17212b}.bt{font:15px Arial,sans-serif;fill:#334155}.small{font:14px Arial,sans-serif;fill:#526172}.arrow{stroke:#475569;stroke-width:3;marker-end:url(#arrowhead)}.node{stroke:#334155;stroke-width:2}</style></defs>
<rect width="1200" height="620" fill="#ffffff"/>
<text x="600" y="42" text-anchor="middle" class="title">Held-out-domain evaluation for transfer and adaptation</text>
<text x="245" y="95" text-anchor="middle" class="bh">Training domains</text><rect x="40" y="125" width="170" height="115" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="125.0" y="163" text-anchor="middle" class="bh">Domain A</text><text x="125.0" y="197" text-anchor="middle" class="bt">source labels</text><rect x="220" y="125" width="170" height="115" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="3"/><text x="305.0" y="163" text-anchor="middle" class="bh">Domain B</text><text x="305.0" y="197" text-anchor="middle" class="bt">source labels</text><rect x="400" y="125" width="170" height="115" rx="10" fill="#f3e8ff" stroke="#9333ea" stroke-width="3"/><text x="485.0" y="163" text-anchor="middle" class="bh">Domain C</text><text x="485.0" y="197" text-anchor="middle" class="bt">source labels</text><line x1="305" y1="250" x2="305" y2="330" class="arrow"/><rect x="180" y="345" width="250" height="150" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="305.0" y="383" text-anchor="middle" class="bh">Fit and select</text><text x="305.0" y="417" text-anchor="middle" class="bt">inner validation</text><text x="305.0" y="444" text-anchor="middle" class="bt">no held-out-domain labels</text><line x1="430" y1="420" x2="675" y2="420" class="arrow"/><rect x="690" y="125" width="210" height="370" rx="10" fill="#fee2e2" stroke="#e11d48" stroke-width="3"/><text x="795.0" y="163" text-anchor="middle" class="bh">Held-out domain D</text><text x="795.0" y="197" text-anchor="middle" class="bt">target labels hidden</text><text x="795.0" y="224" text-anchor="middle" class="bt">evaluate once</text><text x="795.0" y="251" text-anchor="middle" class="bt">subgroups and calibration</text><text x="795.0" y="278" text-anchor="middle" class="bt">target label-budget curve</text><rect x="945" y="125" width="220" height="370" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="3"/><text x="1055.0" y="163" text-anchor="middle" class="bh">Required baselines</text><text x="1055.0" y="197" text-anchor="middle" class="bt">source only</text><text x="1055.0" y="224" text-anchor="middle" class="bt">target only / scratch</text><text x="1055.0" y="251" text-anchor="middle" class="bt">pooled data</text><text x="1055.0" y="278" text-anchor="middle" class="bt">frozen probe</text><text x="1055.0" y="305" text-anchor="middle" class="bt">fine-tuning / adaptation</text><text x="600" y="555" text-anchor="middle" class="bh">Repeat which domain is held out and report the distribution of transfer gains.</text><text x="600" y="585" text-anchor="middle" class="small">Random row splits answer interpolation within known domains, not generalization to a new domain.</text></svg>