<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#334155"/></marker><style>.t{font:700 28px Arial,sans-serif;fill:#1f2937}.h{font:700 20px Arial,sans-serif;fill:#1f2937}.b{font:16px Arial,sans-serif;fill:#374151}.s{font:14px Arial,sans-serif;fill:#475569}.m{font:italic 18px Georgia,serif;fill:#111827}.box{fill:#fff;stroke:#64748b;stroke-width:2}.ar{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="650" fill="#f8fafc"/><text x="600" y="42" text-anchor="middle" class="t">Likelihood turns a probabilistic model into an objective</text>

  <rect x="42" y="84" width="270" height="210" rx="8" class="box"/>
  <text x="177" y="120" text-anchor="middle" class="h">Observed data D</text>
  <g transform="translate(77 151)"><circle cx="10" cy="70" r="7" fill="#2563eb"/><circle cx="44" cy="36" r="7" fill="#2563eb"/><circle cx="82" cy="90" r="7" fill="#2563eb"/><circle cx="124" cy="52" r="7" fill="#2563eb"/><circle cx="168" cy="24" r="7" fill="#2563eb"/><circle cx="197" cy="76" r="7" fill="#2563eb"/><path d="M3 95 C55 83 90 62 205 22" stroke="#94a3b8" stroke-width="2" fill="none"/></g>
  <text x="177" y="271" text-anchor="middle" class="s">inputs and labels are fixed</text>
  <path d="M312 190 H394" class="ar"/>

  <rect x="396" y="84" width="358" height="210" rx="8" class="box"/>
  <text x="575" y="120" text-anchor="middle" class="h">Likelihood over parameters</text>
  <path d="M438 254 C470 252 480 223 505 217 C539 208 548 236 575 230 C611 222 619 148 653 146 C687 145 700 219 721 246" fill="none" stroke="#2563eb" stroke-width="5"/>
  <line x1="653" y1="142" x2="653" y2="264" stroke="#ef4444" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="653" y="278" text-anchor="middle" class="s">MLE</text>
  <text x="575" y="166" text-anchor="middle" class="m">choose parameters that make D plausible</text>

  <path d="M754 190 H836" class="ar"/>
  <rect x="838" y="84" width="320" height="210" rx="8" class="box"/>
  <text x="998" y="120" text-anchor="middle" class="h">Negative log-likelihood</text>
  <text x="998" y="167" text-anchor="middle" class="m">maximize product</text>
  <text x="998" y="204" text-anchor="middle" class="h">becomes</text>
  <text x="998" y="241" text-anchor="middle" class="m">minimize sum of losses</text>
  <text x="998" y="274" text-anchor="middle" class="s">same optimizer target, better numerics</text>

  <rect x="42" y="340" width="1116" height="254" rx="8" class="box"/>
  <text x="600" y="377" text-anchor="middle" class="h">MAP adds prior information before maximizing</text>
  <rect x="84" y="414" width="232" height="112" rx="8" fill="#eef6ff" stroke="#2563eb" stroke-width="2"/><text x="200" y="450" text-anchor="middle" class="h">Likelihood</text><text x="200" y="484" text-anchor="middle" class="b">evidence from D</text>
  <text x="350" y="479" text-anchor="middle" class="t">+</text>
  <rect x="388" y="414" width="232" height="112" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="2"/><text x="504" y="450" text-anchor="middle" class="h">Prior</text><text x="504" y="484" text-anchor="middle" class="b">plausible parameters</text>
  <path d="M620 470 H704" class="ar"/>
  <rect x="706" y="414" width="232" height="112" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="822" y="450" text-anchor="middle" class="h">Posterior</text><text x="822" y="484" text-anchor="middle" class="b">likelihood × prior</text>
  <path d="M938 470 H1002" class="ar"/>
  <ellipse cx="1070" cy="470" rx="67" ry="48" fill="#fce7f3" stroke="#db2777" stroke-width="2"/><text x="1070" y="464" text-anchor="middle" class="h">MAP</text><text x="1070" y="490" text-anchor="middle" class="s">posterior mode</text>
  <text x="600" y="564" text-anchor="middle" class="b">A Gaussian prior yields an L2-like penalty; a Laplace prior yields an L1-like penalty.</text>
</svg>
