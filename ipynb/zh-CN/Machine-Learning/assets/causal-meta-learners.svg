<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410" role="img" aria-labelledby="title desc">
<title id="title">Meta-learners reuse supervised models to estimate heterogeneous effects</title>
<desc id="desc">S-, T-, and X-learners differ in how they model potential outcomes and share information.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
  </marker>
</defs>
<style>
text { font-family: Arial, Helvetica, sans-serif; letter-spacing: 0; fill: #1f2937; }
.title { font-size: 25px; font-weight: 700; }
.subtitle { font-size: 14px; fill: #4b5563; }
.head { font-size: 16px; font-weight: 700; }
.body { font-size: 13px; }
.small { font-size: 12px; fill: #4b5563; }
.formula { font-family: "Courier New", monospace; font-size: 13px; }
.box { stroke-width: 1.4; rx: 7; }
.arrow { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#arrow); }
.dash { stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 7 5; fill: none; marker-end: url(#arrow); }
.blocked { stroke: #dc2626; stroke-width: 3; }
</style>
<rect width="1000" height="410" fill="#ffffff"/>
<text x="40" y="42" class="title" text-anchor="start">Meta-learners reuse supervised models to estimate heterogeneous effects</text>
<text x="40" y="68" class="subtitle" text-anchor="start">S-, T-, and X-learners differ in how they model potential outcomes and share information.</text>
<rect x="35" y="105" width="280" height="225" class="box" fill="#dbeafe" stroke="#374151"/><text x="175" y="133" class="head" text-anchor="middle">S-learner</text><text x="49" y="159" class="body" text-anchor="start"><tspan x="49" dy="0">One model m(X,T)</tspan><tspan x="49" dy="19">Toggle T at prediction</tspan><tspan x="49" dy="19">Shares all structure</tspan></text><rect x="360" y="105" width="280" height="225" class="box" fill="#dcfce7" stroke="#374151"/><text x="500" y="133" class="head" text-anchor="middle">T-learner</text><text x="374" y="159" class="body" text-anchor="start"><tspan x="374" dy="0">Separate μ1(X), μ0(X)</tspan><tspan x="374" dy="19">CATE = μ1 - μ0</tspan><tspan x="374" dy="19">Flexible but data hungry</tspan></text><rect x="685" y="105" width="280" height="225" class="box" fill="#fef3c7" stroke="#374151"/><text x="825" y="133" class="head" text-anchor="middle">X-learner</text><text x="699" y="159" class="body" text-anchor="start"><tspan x="699" dy="0">Impute individual effects</tspan><tspan x="699" dy="19">Fit effect models</tspan><tspan x="699" dy="19">Combine by propensity</tspan></text><text x="500" y="365" class="head" text-anchor="middle">Meta-learners organize predictive models; identification still comes from the study design and assumptions.</text>
</svg>
