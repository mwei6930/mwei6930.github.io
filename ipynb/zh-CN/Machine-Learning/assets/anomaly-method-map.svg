<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Anomaly detection methods and assumptions</title>
  <desc id="desc">Four panels compare global statistical scores, local outlier factor, isolation forests, and one-class support vector machines.</desc>
  <defs><style>.h{font:700 24px Arial,sans-serif;fill:#17212b}.t{font:17px Arial,sans-serif;fill:#334155}.s{font:15px Arial,sans-serif;fill:#526172}.panel{fill:#f8fafc;stroke:#94a3b8;stroke-width:2}.normal{fill:#2563eb}.out{fill:#e11d48}.line{stroke:#16a34a;stroke-width:4;fill:none}</style></defs>
  <rect width="1200" height="650" fill="#fff"/>
  <text x="600" y="42" text-anchor="middle" class="h">Anomaly detectors answer different questions</text>
  <rect x="28" y="82" width="268" height="475" rx="8" class="panel"/><rect x="320" y="82" width="268" height="475" rx="8" class="panel"/><rect x="612" y="82" width="268" height="475" rx="8" class="panel"/><rect x="904" y="82" width="268" height="475" rx="8" class="panel"/>
  <text x="162" y="120" text-anchor="middle" class="h">Global score</text>
  <ellipse cx="162" cy="300" rx="75" ry="115" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><circle cx="125" cy="260" r="7" class="normal"/><circle cx="150" cy="315" r="7" class="normal"/><circle cx="185" cy="270" r="7" class="normal"/><circle cx="175" cy="350" r="7" class="normal"/><circle cx="250" cy="180" r="11" class="out"/>
  <line x1="225" y1="198" x2="195" y2="238" stroke="#e11d48" stroke-width="3" stroke-dasharray="6 5"/>
  <text x="162" y="462" text-anchor="middle" class="t">Far from a global model</text><text x="162" y="490" text-anchor="middle" class="s">e.g. Mahalanobis distance</text><text x="162" y="518" text-anchor="middle" class="s">Can miss local anomalies</text>
  <text x="454" y="120" text-anchor="middle" class="h">Local density</text>
  <circle cx="390" cy="260" r="7" class="normal"/><circle cx="410" cy="285" r="7" class="normal"/><circle cx="430" cy="250" r="7" class="normal"/><circle cx="465" cy="350" r="7" class="normal"/><circle cx="485" cy="375" r="7" class="normal"/><circle cx="510" cy="340" r="7" class="normal"/><circle cx="455" cy="286" r="11" class="out"/>
  <circle cx="455" cy="286" r="62" fill="none" stroke="#e11d48" stroke-width="3" stroke-dasharray="7 5"/>
  <text x="454" y="462" text-anchor="middle" class="t">Sparse relative to neighbours</text><text x="454" y="490" text-anchor="middle" class="s">Local Outlier Factor</text><text x="454" y="518" text-anchor="middle" class="s">Adapts to local scale</text>
  <text x="746" y="120" text-anchor="middle" class="h">Isolation</text>
  <rect x="650" y="175" width="190" height="235" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><line x1="790" y1="175" x2="790" y2="410" class="line"/><line x1="650" y1="235" x2="790" y2="235" class="line"/><line x1="710" y1="235" x2="710" y2="410" class="line"/><circle cx="685" cy="285" r="7" class="normal"/><circle cx="738" cy="320" r="7" class="normal"/><circle cx="760" cy="270" r="7" class="normal"/><circle cx="817" cy="205" r="11" class="out"/>
  <text x="746" y="462" text-anchor="middle" class="t">Few random splits isolate it</text><text x="746" y="490" text-anchor="middle" class="s">Isolation Forest</text><text x="746" y="518" text-anchor="middle" class="s">No explicit density estimate</text>
  <text x="1038" y="120" text-anchor="middle" class="h">Learned boundary</text>
  <path d="M945 345 C940 205 1115 190 1130 330 C1135 445 960 450 945 345 Z" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
  <circle cx="995" cy="290" r="7" class="normal"/><circle cx="1022" cy="340" r="7" class="normal"/><circle cx="1060" cy="275" r="7" class="normal"/><circle cx="1085" cy="355" r="7" class="normal"/><circle cx="1142" cy="180" r="11" class="out"/>
  <text x="1038" y="462" text-anchor="middle" class="t">Outside the normal region</text><text x="1038" y="490" text-anchor="middle" class="s">One-Class SVM</text><text x="1038" y="518" text-anchor="middle" class="s">Sensitive to scale and kernel</text>
  <text x="600" y="610" text-anchor="middle" class="t">A score ranks observations; a threshold turns that ranking into alerts and must reflect operational costs.</text>
</svg>
