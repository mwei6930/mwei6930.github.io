<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="title desc">
<title id="title">Inverse weighting reconstructs a target pseudo-population</title>
<desc id="desc">Treatment propensities reweight observed units so baseline covariates are balanced across treatment groups.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
  </marker>
</defs>
<style>
text { font-family: Arial, Helvetica, sans-serif; letter-spacing: 0; fill: #1f2937; }
.title { font-size: 25px; font-weight: 700; }
.subtitle { font-size: 14px; fill: #4b5563; }
.head { font-size: 16px; font-weight: 700; }
.body { font-size: 13px; }
.small { font-size: 12px; fill: #4b5563; }
.formula { font-family: "Courier New", monospace; font-size: 13px; }
.box { stroke-width: 1.4; rx: 7; }
.arrow { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#arrow); }
.dash { stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 7 5; fill: none; marker-end: url(#arrow); }
.blocked { stroke: #dc2626; stroke-width: 3; }
</style>
<rect width="1000" height="400" fill="#ffffff"/>
<text x="40" y="42" class="title" text-anchor="start">Inverse weighting reconstructs a target pseudo-population</text>
<text x="40" y="68" class="subtitle" text-anchor="start">Treatment propensities reweight observed units so baseline covariates are balanced across treatment groups.</text>
<rect x="35" y="105" width="250" height="210" class="box" fill="#fee2e2" stroke="#374151"/><text x="160" y="133" class="head" text-anchor="middle">Observed sample</text><text x="49" y="159" class="body" text-anchor="start"><tspan x="49" dy="0">Treatment depends on X</tspan><tspan x="49" dy="19">Covariates imbalanced</tspan><tspan x="49" dy="19">Raw groups incomparable</tspan></text><path d="M 285 210 L 375 210" class="arrow"/><text x="330" y="202" class="small" text-anchor="middle">weight by 1/e</text><rect x="375" y="105" width="250" height="210" class="box" fill="#fef3c7" stroke="#374151"/><text x="500" y="133" class="head" text-anchor="middle">Weighted sample</text><text x="389" y="159" class="body" text-anchor="start"><tspan x="389" dy="0">Upweight rare assignments</tspan><tspan x="389" dy="19">Create pseudo-population</tspan><tspan x="389" dy="19">Check weight tails</tspan></text><path d="M 625 210 L 715 210" class="arrow"/><text x="670" y="202" class="small" text-anchor="middle">compare</text><rect x="715" y="105" width="250" height="210" class="box" fill="#dcfce7" stroke="#374151"/><text x="840" y="133" class="head" text-anchor="middle">Target contrast</text><text x="729" y="159" class="body" text-anchor="start"><tspan x="729" dy="0">Weighted treated mean</tspan><tspan x="729" dy="19">Weighted control mean</tspan><tspan x="729" dy="19">ATE or ATT weights</tspan></text><text x="500" y="355" class="head" text-anchor="middle">Extreme weights signal weak positivity; clipping stabilizes variance but changes bias.</text>
</svg>
