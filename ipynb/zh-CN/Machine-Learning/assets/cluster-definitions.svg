<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Four meanings of cluster structure</title>
  <desc id="desc">Compactness, connectivity, density separation, and probabilistic components partition the same observations according to different assumptions.</desc>
  <defs><style>.h{font:700 24px Arial,sans-serif;fill:#212529}.t{font:700 18px Arial,sans-serif;fill:#343a40}.s{font:15px Arial,sans-serif;fill:#495057}.box{stroke:#adb5bd;stroke-width:2;rx:6}.a{fill:#4dabf7;stroke:#1864ab;stroke-width:1.5}.b{fill:#ff8787;stroke:#c92a2a;stroke-width:1.5}.edge{stroke:#495057;stroke-width:2}</style></defs>
  <text x="600" y="38" text-anchor="middle" class="h">A Cluster Is Defined by an Assumption, Not by the Data Alone</text>
  <g transform="translate(25 80)"><rect width="270" height="460" class="box" fill="#e7f5ff"/><text x="135" y="40" text-anchor="middle" class="t">Compactness</text><circle cx="85" cy="200" r="13" class="a"/><circle cx="115" cy="175" r="13" class="a"/><circle cx="125" cy="225" r="13" class="a"/><circle cx="180" cy="300" r="13" class="b"/><circle cx="205" cy="275" r="13" class="b"/><circle cx="220" cy="325" r="13" class="b"/><circle cx="110" cy="200" r="55" fill="none" stroke="#1971c2" stroke-width="3"/><circle cx="205" cy="300" r="55" fill="none" stroke="#c92a2a" stroke-width="3"/><text x="135" y="390" text-anchor="middle" class="s">near one prototype</text><text x="135" y="420" text-anchor="middle" class="s">roughly spherical groups</text></g>
  <g transform="translate(320 80)"><rect width="270" height="460" class="box" fill="#fff3bf"/><text x="135" y="40" text-anchor="middle" class="t">Connectivity</text><circle cx="55" cy="210" r="11" class="a"/><circle cx="90" cy="185" r="11" class="a"/><circle cx="125" cy="200" r="11" class="a"/><circle cx="155" cy="235" r="11" class="a"/><circle cx="185" cy="270" r="11" class="a"/><circle cx="220" cy="285" r="11" class="a"/><path d="M66 203 L80 192 M101 190 L114 197 M136 208 L147 227 M163 245 L177 262 M196 275 L209 280" class="edge"/><text x="135" y="390" text-anchor="middle" class="s">linked by short steps</text><text x="135" y="420" text-anchor="middle" class="s">shape can be non-convex</text></g>
  <g transform="translate(615 80)"><rect width="270" height="460" class="box" fill="#d3f9d8"/><text x="135" y="40" text-anchor="middle" class="t">Density</text><g class="a"><circle cx="85" cy="210" r="10"/><circle cx="105" cy="185" r="10"/><circle cx="120" cy="225" r="10"/><circle cx="140" cy="195" r="10"/><circle cx="160" cy="220" r="10"/></g><g class="b"><circle cx="170" cy="300" r="10"/><circle cx="195" cy="280" r="10"/><circle cx="215" cy="310" r="10"/><circle cx="190" cy="330" r="10"/></g><circle cx="45" cy="330" r="8" fill="#adb5bd"/><circle cx="230" cy="160" r="8" fill="#adb5bd"/><path d="M40 255 C90 270 140 260 230 245" stroke="#2b8a3e" stroke-width="3" stroke-dasharray="7 6" fill="none"/><text x="135" y="390" text-anchor="middle" class="s">dense islands</text><text x="135" y="420" text-anchor="middle" class="s">separated by sparse regions</text></g>
  <g transform="translate(910 80)"><rect width="265" height="460" class="box" fill="#f3d9fa"/><text x="132" y="40" text-anchor="middle" class="t">Distribution</text><ellipse cx="95" cy="220" rx="60" ry="95" fill="#74c0fc" opacity=".45"/><ellipse cx="175" cy="275" rx="65" ry="45" fill="#ff8787" opacity=".45" transform="rotate(-20 175 275)"/><circle cx="95" cy="220" r="7" fill="#1864ab"/><circle cx="175" cy="275" r="7" fill="#c92a2a"/><text x="132" y="390" text-anchor="middle" class="s">latent mixture components</text><text x="132" y="420" text-anchor="middle" class="s">soft overlapping membership</text></g>
  <text x="600" y="585" text-anchor="middle" class="s">Different definitions can produce different valid partitions of the same observations.</text>
</svg>
