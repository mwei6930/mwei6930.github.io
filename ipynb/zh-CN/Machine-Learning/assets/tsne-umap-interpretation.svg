<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">Interpreting t-SNE and UMAP embeddings</title><desc id="desc">The diagram distinguishes relatively trustworthy local neighborhoods from potentially misleading cluster size, distance, density, and global geometry, and shows sensitivity to hyperparameters and random seeds.</desc><defs><style>.h{font:700 24px Arial,sans-serif;fill:#17212b}.t{font:17px Arial,sans-serif;fill:#334155}.s{font:14px Arial,sans-serif;fill:#526172}.panel{fill:#f8fafc;stroke:#94a3b8;stroke-width:2}.good{fill:#dcfce7;stroke:#16a34a;stroke-width:3}.warn{fill:#fff7ed;stroke:#e8590c;stroke-width:3}</style></defs><rect width="1200" height="650" fill="#fff"/><text x="600" y="42" text-anchor="middle" class="h">t-SNE and UMAP are neighborhood visualizers, not automatic evidence of clusters</text>
  <rect x="40" y="85" width="520" height="455" rx="8" class="panel"/><text x="300" y="125" text-anchor="middle" class="h">What is comparatively trustworthy?</text><rect x="90" y="165" width="420" height="100" rx="8" class="good"/><circle cx="165" cy="215" r="10" fill="#2563eb"/><circle cx="192" cy="198" r="10" fill="#2563eb"/><circle cx="215" cy="225" r="10" fill="#2563eb"/><circle cx="240" cy="205" r="10" fill="#2563eb"/><text x="350" y="205" text-anchor="middle" class="t">Local neighbourhood membership</text><text x="350" y="232" text-anchor="middle" class="s">when stable across settings and samples</text><rect x="90" y="300" width="420" height="190" rx="8" class="warn"/><circle cx="160" cy="370" r="45" fill="#bfdbfe"/><circle cx="390" cy="380" r="18" fill="#fed7aa"/><line x1="210" y1="375" x2="360" y2="380" stroke="#e8590c" stroke-width="3" stroke-dasharray="8 6"/><text x="300" y="440" text-anchor="middle" class="t">Size, spacing, and density can mislead</text><text x="300" y="467" text-anchor="middle" class="s">large gaps do not prove disconnected populations</text>
  <rect x="640" y="85" width="520" height="455" rx="8" class="panel"/><text x="900" y="125" text-anchor="middle" class="h">Sensitivity is part of the result</text><rect x="685" y="165" width="200" height="150" rx="6" fill="#dbeafe"/><circle cx="730" cy="225" r="9" fill="#2563eb"/><circle cx="755" cy="245" r="9" fill="#2563eb"/><circle cx="805" cy="215" r="9" fill="#e8590c"/><circle cx="830" cy="240" r="9" fill="#e8590c"/><text x="785" y="292" text-anchor="middle" class="s">setting A</text><rect x="915" y="165" width="200" height="150" rx="6" fill="#f3e8ff"/><circle cx="965" cy="220" r="9" fill="#2563eb"/><circle cx="990" cy="240" r="9" fill="#2563eb"/><circle cx="1015" cy="260" r="9" fill="#e8590c"/><circle cx="1060" cy="210" r="9" fill="#e8590c"/><text x="1015" y="292" text-anchor="middle" class="s">setting B</text>
  <text x="900" y="365" text-anchor="middle" class="t">t-SNE: perplexity, learning rate, seed</text><text x="900" y="400" text-anchor="middle" class="t">UMAP: n_neighbors, min_dist, metric, seed</text><rect x="700" y="440" width="400" height="55" rx="6" fill="#fee2e2"/><text x="900" y="474" text-anchor="middle" class="t">Never fit the map before a train/test split</text><text x="600" y="590" text-anchor="middle" class="t">Validate neighbourhood preservation, rerun with plausible settings, and return to original features before naming groups.</text></svg>
