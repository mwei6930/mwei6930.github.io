<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">Neural architecture map by inductive bias</title>
  <desc id="desc">MLPs, CNNs, RNNs, attention, and Transformers are compared by the structure they exploit, parameter sharing, and typical data.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#495057"/></marker><style>.h{font:700 24px Arial,sans-serif;fill:#212529}.t{font:700 18px Arial,sans-serif;fill:#343a40}.s{font:15px Arial,sans-serif;fill:#495057}.box{stroke:#495057;stroke-width:2;rx:6}.line{stroke:#495057;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style></defs>
  <text x="600" y="38" text-anchor="middle" class="h">Architectures Differ Mainly in How They Share Parameters and Mix Context</text>
  <rect x="430" y="70" width="340" height="90" class="box" fill="#fff3bf"/><text x="600" y="108" text-anchor="middle" class="t">What structure does the input have?</text><text x="600" y="136" text-anchor="middle" class="s">none, local grid, ordered sequence, or pairwise relations</text>
  <path d="M490 160 L150 240 M555 160 L410 240 M645 160 L790 240 M710 160 L1050 240" class="line"/>
  <rect x="25" y="245" width="250" height="260" class="box" fill="#e7f5ff"/><text x="150" y="282" text-anchor="middle" class="t">MLP</text><text x="150" y="315" text-anchor="middle" class="s">dense global mixing</text><text x="150" y="345" text-anchor="middle" class="s">few structural assumptions</text><circle cx="90" cy="395" r="15" fill="#fff" stroke="#1971c2" stroke-width="2"/><circle cx="150" cy="395" r="15" fill="#fff" stroke="#1971c2" stroke-width="2"/><circle cx="210" cy="395" r="15" fill="#fff" stroke="#1971c2" stroke-width="2"/><text x="150" y="470" text-anchor="middle" class="s">fixed-size feature vectors</text>
  <rect x="300" y="245" width="250" height="260" class="box" fill="#d3f9d8"/><text x="425" y="282" text-anchor="middle" class="t">CNN</text><text x="425" y="315" text-anchor="middle" class="s">local receptive fields</text><text x="425" y="345" text-anchor="middle" class="s">translation-aware sharing</text><g fill="#69db7c"><rect x="365" y="380" width="35" height="35"/><rect x="405" y="380" width="35" height="35"/><rect x="445" y="380" width="35" height="35"/><rect x="405" y="420" width="35" height="35"/></g><text x="425" y="480" text-anchor="middle" class="s">images, spatial signals</text>
  <rect x="575" y="245" width="250" height="260" class="box" fill="#ffe3e3"/><text x="700" y="282" text-anchor="middle" class="t">RNN / state model</text><text x="700" y="315" text-anchor="middle" class="s">shared recurrent transition</text><text x="700" y="345" text-anchor="middle" class="s">ordered streaming memory</text><circle cx="630" cy="410" r="20" fill="#fff" stroke="#c92a2a" stroke-width="2"/><circle cx="700" cy="410" r="20" fill="#fff" stroke="#c92a2a" stroke-width="2"/><circle cx="770" cy="410" r="20" fill="#fff" stroke="#c92a2a" stroke-width="2"/><path d="M650 410 H678 M720 410 H748" class="line"/><text x="700" y="480" text-anchor="middle" class="s">sequences and online state</text>
  <rect x="850" y="245" width="325" height="260" class="box" fill="#f3d9fa"/><text x="1012" y="282" text-anchor="middle" class="t">Attention / Transformer</text><text x="1012" y="315" text-anchor="middle" class="s">content-dependent pairwise mixing</text><text x="1012" y="345" text-anchor="middle" class="s">parallel context plus position</text><circle cx="925" cy="410" r="15" fill="#fff" stroke="#862e9c" stroke-width="2"/><circle cx="985" cy="390" r="15" fill="#fff" stroke="#862e9c" stroke-width="2"/><circle cx="1045" cy="430" r="15" fill="#fff" stroke="#862e9c" stroke-width="2"/><circle cx="1105" cy="390" r="15" fill="#fff" stroke="#862e9c" stroke-width="2"/><path d="M940 407 L970 394 M1000 395 L1030 424 M1060 425 L1090 396 M940 414 L1030 428 M1000 388 L1090 390" stroke="#862e9c" stroke-width="2"/><text x="1012" y="480" text-anchor="middle" class="s">language, vision, multimodal data</text>
  <rect x="250" y="555" width="700" height="60" rx="6" fill="#f8f9fa" stroke="#adb5bd"/><text x="600" y="592" text-anchor="middle" class="s">The Deep Learning series develops these architecture-specific mechanisms, training recipes, and modern systems in detail.</text>
</svg>
