<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="375" viewBox="0 0 1000 375" role="img" aria-labelledby="title desc">
<title id="title">Causal comparisons require overlap</title>
<desc id="desc">Treated and untreated units need common support in treatment propensity for the target population.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
  </marker>
</defs>
<style>
text { font-family: Arial, Helvetica, sans-serif; letter-spacing: 0; fill: #1f2937; }
.title { font-size: 25px; font-weight: 700; }
.subtitle { font-size: 14px; fill: #4b5563; }
.head { font-size: 16px; font-weight: 700; }
.body { font-size: 13px; }
.small { font-size: 12px; fill: #4b5563; }
.formula { font-family: "Courier New", monospace; font-size: 13px; }
.box { stroke-width: 1.4; rx: 7; }
.arrow { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#arrow); }
.dash { stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 7 5; fill: none; marker-end: url(#arrow); }
.blocked { stroke: #dc2626; stroke-width: 3; }
</style>
<rect width="1000" height="375" fill="#ffffff"/>
<text x="40" y="42" class="title" text-anchor="start">Causal comparisons require overlap</text>
<text x="40" y="68" class="subtitle" text-anchor="start">Treated and untreated units need common support in treatment propensity for the target population.</text>
<text x="500" y="102" class="head" text-anchor="middle">Propensity score e(X) = P(T=1 | X)</text><path d="M 90 290 C 180 285, 205 125, 350 135 C 460 143, 485 265, 535 285" fill="none" stroke="#2563eb" stroke-width="4"/><path d="M 350 285 C 405 265, 430 145, 560 135 C 710 125, 735 285, 900 290" fill="none" stroke="#16a34a" stroke-width="4"/><rect x="350" y="115" width="185" height="190" fill="#fef3c7" fill-opacity="0.35" stroke="#d97706" stroke-dasharray="7 5"/><text x="255" y="125" class="head" text-anchor="middle">Untreated</text><text x="680" y="125" class="head" text-anchor="middle">Treated</text><text x="442" y="330" class="head" text-anchor="middle">Common support</text><text x="90" y="322" class="small" text-anchor="middle">0</text><text x="900" y="322" class="small" text-anchor="middle">1</text><path d="M 90 305 L 900 305" class="arrow"/>
</svg>
