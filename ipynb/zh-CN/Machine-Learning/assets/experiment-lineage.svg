<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc">
<title id="title">Reproducibility is an explicit lineage graph</title>
<desc id="desc">Versioned inputs create a run, artifacts, and a reviewable decision record.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
  </marker>
</defs>
<style>
text { font-family: Arial, Helvetica, sans-serif; letter-spacing: 0; fill: #1f2937; }
.title { font-size: 25px; font-weight: 700; }
.subtitle { font-size: 14px; fill: #4b5563; }
.head { font-size: 16px; font-weight: 700; }
.body { font-size: 13px; }
.small { font-size: 12px; fill: #4b5563; }
.formula { font-family: "Courier New", monospace; font-size: 13px; }
.box { stroke-width: 1.4; rx: 7; }
.arrow { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#arrow); }
.dash { stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 7 5; fill: none; marker-end: url(#arrow); }
.line { stroke: #6b7280; stroke-width: 1.5; fill: none; }
</style>
<rect width="1000" height="390" fill="#ffffff"/>
<text x="40" y="42" class="title" text-anchor="start">Reproducibility is an explicit lineage graph</text>
<text x="40" y="68" class="subtitle" text-anchor="start">Versioned inputs create a run, artifacts, and a reviewable decision record.</text>
<rect x="35" y="118" width="170" height="180" class="box" fill="#dbeafe" stroke="#374151"/><text x="120" y="147" class="head" text-anchor="middle">Inputs</text><text x="49" y="174" class="body" text-anchor="start"><tspan x="49" dy="0">dataset hash</tspan><tspan x="49" dy="19">code commit</tspan><tspan x="49" dy="19">environment</tspan><tspan x="49" dy="19">configuration</tspan></text><path d="M 205 208 L 265 208" class="arrow"/><rect x="265" y="118" width="170" height="180" class="box" fill="#dcfce7" stroke="#374151"/><text x="350" y="147" class="head" text-anchor="middle">Run</text><text x="279" y="174" class="body" text-anchor="start"><tspan x="279" dy="0">seed</tspan><tspan x="279" dy="19">logs</tspan><tspan x="279" dy="19">resource use</tspan><tspan x="279" dy="19">status</tspan></text><path d="M 435 208 L 495 208" class="arrow"/><rect x="495" y="118" width="170" height="180" class="box" fill="#fef3c7" stroke="#374151"/><text x="580" y="147" class="head" text-anchor="middle">Artifacts</text><text x="509" y="174" class="body" text-anchor="start"><tspan x="509" dy="0">model</tspan><tspan x="509" dy="19">predictions</tspan><tspan x="509" dy="19">plots</tspan><tspan x="509" dy="19">report</tspan></text><path d="M 665 208 L 725 208" class="arrow"/><rect x="725" y="118" width="240" height="180" class="box" fill="#fee2e2" stroke="#374151"/><text x="845" y="147" class="head" text-anchor="middle">Decision record</text><text x="739" y="174" class="body" text-anchor="start"><tspan x="739" dy="0">comparison set</tspan><tspan x="739" dy="19">acceptance criteria</tspan><tspan x="739" dy="19">owner and timestamp</tspan><tspan x="739" dy="19">release or rejection</tspan></text><text x="500" y="345" class="head" text-anchor="middle">A run identifier is useful only when every result can be traced backward and every release forward.</text>
</svg>
