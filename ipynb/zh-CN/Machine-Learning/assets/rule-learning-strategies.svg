<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">Rule learning strategies</title><desc id="desc">OneR uses one feature, separate-and-conquer covers one class rule by rule, and a tree recursively partitions all cases.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#495057"/></marker>
  <style>.panel{fill:#fff;stroke:#868e96;stroke-width:2}.h{font:700 23px Arial,sans-serif;fill:#212529}.t{font:17px Arial,sans-serif;fill:#343a40}.s{font:15px Arial,sans-serif;fill:#495057}.pos{fill:#4dabf7}.neg{fill:#ff8787}.rule{fill:#fff3bf;stroke:#f08c00;stroke-width:3;fill-opacity:.45}.line{stroke:#495057;stroke-width:2;fill:none;marker-end:url(#a)}</style></defs>
  <text x="600" y="38" text-anchor="middle" class="h">Three Ways to Turn Conditions into Predictions</text>
  <rect x="30" y="70" width="355" height="500" rx="6" class="panel"/><text x="207" y="108" text-anchor="middle" class="h">OneR</text>
  <text x="55" y="142" class="t">Choose one attribute only</text>
  <rect x="65" y="178" width="280" height="220" fill="#f8f9fa" stroke="#ced4da"/>
  <line x1="185" y1="178" x2="185" y2="398" stroke="#f08c00" stroke-width="4"/><line x1="270" y1="178" x2="270" y2="398" stroke="#f08c00" stroke-width="4"/>
  <circle cx="105" cy="225" r="10" class="pos"/><circle cx="140" cy="300" r="10" class="pos"/><circle cx="115" cy="350" r="10" class="neg"/>
  <circle cx="220" cy="220" r="10" class="neg"/><circle cx="230" cy="292" r="10" class="neg"/><circle cx="245" cy="345" r="10" class="pos"/>
  <circle cx="302" cy="235" r="10" class="pos"/><circle cx="315" cy="315" r="10" class="pos"/>
  <text x="207" y="438" text-anchor="middle" class="s">One value -&gt; majority class</text><text x="207" y="468" text-anchor="middle" class="s">Transparent baseline; limited interactions</text>
  <rect x="422" y="70" width="355" height="500" rx="6" class="panel"/><text x="599" y="108" text-anchor="middle" class="h">Separate-and-Conquer</text>
  <text x="447" y="142" class="t">Grow one high-precision rule</text>
  <rect x="457" y="178" width="285" height="220" fill="#f8f9fa" stroke="#ced4da"/>
  <circle cx="500" cy="225" r="10" class="pos"/><circle cx="545" cy="245" r="10" class="pos"/><circle cx="520" cy="300" r="10" class="pos"/><circle cx="610" cy="220" r="10" class="neg"/><circle cx="690" cy="270" r="10" class="neg"/><circle cx="640" cy="350" r="10" class="neg"/><circle cx="555" cy="355" r="10" class="pos"/>
  <rect x="475" y="200" width="105" height="125" rx="5" class="rule"/><text x="527" y="338" text-anchor="middle" class="s">Rule 1</text>
  <path d="M505 426 H685" class="line"/><text x="595" y="455" text-anchor="middle" class="s">remove covered positives, repeat</text>
  <text x="599" y="492" text-anchor="middle" class="s">PRISM / covering algorithms</text>
  <rect x="814" y="70" width="355" height="500" rx="6" class="panel"/><text x="991" y="108" text-anchor="middle" class="h">Decision Tree</text>
  <text x="839" y="142" class="t">Partition all cases recursively</text>
  <circle cx="991" cy="198" r="21" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><text x="991" y="204" text-anchor="middle" class="s">x1?</text>
  <line x1="975" y1="215" x2="905" y2="270" stroke="#495057" stroke-width="2"/><line x1="1007" y1="215" x2="1077" y2="270" stroke="#495057" stroke-width="2"/>
  <circle cx="900" cy="286" r="21" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><text x="900" y="292" text-anchor="middle" class="s">x2?</text>
  <circle cx="1082" cy="286" r="21" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><text x="1082" y="292" text-anchor="middle" class="s">x3?</text>
  <line x1="885" y1="303" x2="855" y2="350" stroke="#495057" stroke-width="2"/><line x1="915" y1="303" x2="945" y2="350" stroke="#495057" stroke-width="2"/><line x1="1067" y1="303" x2="1037" y2="350" stroke="#495057" stroke-width="2"/><line x1="1097" y1="303" x2="1127" y2="350" stroke="#495057" stroke-width="2"/>
  <rect x="824" y="350" width="62" height="42" rx="4" fill="#d0ebff" stroke="#1971c2"/><rect x="914" y="350" width="62" height="42" rx="4" fill="#ffc9c9" stroke="#c92a2a"/><rect x="1006" y="350" width="62" height="42" rx="4" fill="#d0ebff" stroke="#1971c2"/><rect x="1096" y="350" width="62" height="42" rx="4" fill="#ffc9c9" stroke="#c92a2a"/>
  <text x="855" y="377" text-anchor="middle" class="s">+</text><text x="945" y="377" text-anchor="middle" class="s">-</text><text x="1037" y="377" text-anchor="middle" class="s">+</text><text x="1127" y="377" text-anchor="middle" class="s">-</text>
  <text x="991" y="438" text-anchor="middle" class="s">Every root-to-leaf path is a rule</text><text x="991" y="468" text-anchor="middle" class="s">Paths share earlier conditions</text>
  <text x="600" y="596" text-anchor="middle" class="s">Blue = positive class, red = negative class. The strategies differ in how they search the discrete rule space.</text>
</svg>
