<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc">
<title id="title">Research quality is a chain from claim to executable evidence</title>
<desc id="desc">Claims require protocols, uncertainty, challenge tests, and complete artifacts.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
  </marker>
</defs>
<style>
text { font-family: Arial, Helvetica, sans-serif; letter-spacing: 0; fill: #1f2937; }
.title { font-size: 25px; font-weight: 700; }
.subtitle { font-size: 14px; fill: #4b5563; }
.head { font-size: 16px; font-weight: 700; }
.body { font-size: 13px; }
.small { font-size: 12px; fill: #4b5563; }
.formula { font-family: "Courier New", monospace; font-size: 13px; }
.box { stroke-width: 1.4; rx: 7; }
.arrow { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#arrow); }
.dash { stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 7 5; fill: none; marker-end: url(#arrow); }
.line { stroke: #6b7280; stroke-width: 1.5; fill: none; }
</style>
<rect width="1000" height="390" fill="#ffffff"/>
<text x="40" y="42" class="title" text-anchor="start">Research quality is a chain from claim to executable evidence</text>
<text x="40" y="68" class="subtitle" text-anchor="start">Claims require protocols, uncertainty, challenge tests, and complete artifacts.</text>
<rect x="35" y="120" width="160" height="180" class="box" fill="#dbeafe" stroke="#374151"/><text x="115" y="149" class="head" text-anchor="middle">Claim</text><text x="49" y="176" class="body" text-anchor="start"><tspan x="49" dy="0">precise scope</tspan><tspan x="49" dy="19">falsifiable</tspan><tspan x="49" dy="19">comparison</tspan></text><path d="M 195 210 L 230 210" class="arrow"/><rect x="230" y="120" width="160" height="180" class="box" fill="#dcfce7" stroke="#374151"/><text x="310" y="149" class="head" text-anchor="middle">Protocol</text><text x="244" y="176" class="body" text-anchor="start"><tspan x="244" dy="0">split unit</tspan><tspan x="244" dy="19">metric</tspan><tspan x="244" dy="19">budget</tspan></text><path d="M 390 210 L 425 210" class="arrow"/><rect x="425" y="120" width="160" height="180" class="box" fill="#fef3c7" stroke="#374151"/><text x="505" y="149" class="head" text-anchor="middle">Evidence</text><text x="439" y="176" class="body" text-anchor="start"><tspan x="439" dy="0">runs and seeds</tspan><tspan x="439" dy="19">uncertainty</tspan><tspan x="439" dy="19">ablations</tspan></text><path d="M 585 210 L 620 210" class="arrow"/><rect x="620" y="120" width="160" height="180" class="box" fill="#fee2e2" stroke="#374151"/><text x="700" y="149" class="head" text-anchor="middle">Challenge</text><text x="634" y="176" class="body" text-anchor="start"><tspan x="634" dy="0">leakage check</tspan><tspan x="634" dy="19">sensitivity</tspan><tspan x="634" dy="19">failure cases</tspan></text><path d="M 780 210 L 815 210" class="arrow"/><rect x="815" y="120" width="150" height="180" class="box" fill="#e0e7ff" stroke="#374151"/><text x="890" y="149" class="head" text-anchor="middle">Artifact</text><text x="829" y="176" class="body" text-anchor="start"><tspan x="829" dy="0">code/data</tspan><tspan x="829" dy="19">commands</tspan><tspan x="829" dy="19">provenance</tspan></text><text x="500" y="345" class="head" text-anchor="middle">A paper is credible when another person can trace every conclusion back to a controlled comparison.</text>
</svg>
