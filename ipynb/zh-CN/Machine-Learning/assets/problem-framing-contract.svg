<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="385" viewBox="0 0 1000 385" role="img" aria-labelledby="title desc">
<title id="title">Frame the decision before selecting the model</title>
<desc id="desc">The contract links users and observations to predictions, decisions, outcomes, and measurable evidence.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
  </marker>
</defs>
<style>
text { font-family: Arial, Helvetica, sans-serif; letter-spacing: 0; fill: #1f2937; }
.title { font-size: 25px; font-weight: 700; }
.subtitle { font-size: 14px; fill: #4b5563; }
.head { font-size: 16px; font-weight: 700; }
.body { font-size: 13px; }
.small { font-size: 12px; fill: #4b5563; }
.formula { font-family: "Courier New", monospace; font-size: 13px; }
.box { stroke-width: 1.4; rx: 7; }
.arrow { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#arrow); }
.dash { stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 7 5; fill: none; marker-end: url(#arrow); }
.line { stroke: #6b7280; stroke-width: 1.5; fill: none; }
</style>
<rect width="1000" height="385" fill="#ffffff"/>
<text x="40" y="42" class="title" text-anchor="start">Frame the decision before selecting the model</text>
<text x="40" y="68" class="subtitle" text-anchor="start">The contract links users and observations to predictions, decisions, outcomes, and measurable evidence.</text>
<rect x="35" y="122" width="175" height="175" class="box" fill="#dbeafe" stroke="#374151"/><text x="122" y="151" class="head" text-anchor="middle">User state</text><text x="49" y="178" class="body" text-anchor="start"><tspan x="49" dy="0">Who is affected?</tspan><tspan x="49" dy="19">What is observable?</tspan><tspan x="49" dy="19">What can change?</tspan></text><path d="M 210 210 L 245 210" class="arrow"/><rect x="245" y="122" width="175" height="175" class="box" fill="#dcfce7" stroke="#374151"/><text x="332" y="151" class="head" text-anchor="middle">Prediction</text><text x="259" y="178" class="body" text-anchor="start"><tspan x="259" dy="0">Target and horizon</tspan><tspan x="259" dy="19">Available features</tspan><tspan x="259" dy="19">Uncertainty</tspan></text><path d="M 420 210 L 455 210" class="arrow"/><rect x="455" y="122" width="175" height="175" class="box" fill="#fef3c7" stroke="#374151"/><text x="542" y="151" class="head" text-anchor="middle">Decision</text><text x="469" y="178" class="body" text-anchor="start"><tspan x="469" dy="0">Action policy</tspan><tspan x="469" dy="19">Threshold</tspan><tspan x="469" dy="19">Human override</tspan></text><path d="M 630 210 L 665 210" class="arrow"/><rect x="665" y="122" width="135" height="175" class="box" fill="#fee2e2" stroke="#374151"/><text x="732" y="151" class="head" text-anchor="middle">Outcome</text><text x="679" y="178" class="body" text-anchor="start"><tspan x="679" dy="0">Benefit</tspan><tspan x="679" dy="19">Harm</tspan><tspan x="679" dy="19">Delay</tspan></text><path d="M 800 210 L 835 210" class="arrow"/><rect x="835" y="122" width="130" height="175" class="box" fill="#e0e7ff" stroke="#374151"/><text x="900" y="151" class="head" text-anchor="middle">Evidence</text><text x="849" y="178" class="body" text-anchor="start"><tspan x="849" dy="0">Utility</tspan><tspan x="849" dy="19">SLOs</tspan><tspan x="849" dy="19">Slices</tspan></text><text x="500" y="343" class="head" text-anchor="middle">A predictive metric is useful only after it is connected to an action and consequence.</text>
</svg>
