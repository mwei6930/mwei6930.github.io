<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410" role="img" aria-labelledby="title desc">
<title id="title">Deployment is a sequence of reversible evidence gates</title>
<desc id="desc">Offline validation, shadowing, canary traffic, ramp-up, and operation each have rollback criteria.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
  </marker>
</defs>
<style>
text { font-family: Arial, Helvetica, sans-serif; letter-spacing: 0; fill: #1f2937; }
.title { font-size: 25px; font-weight: 700; }
.subtitle { font-size: 14px; fill: #4b5563; }
.head { font-size: 16px; font-weight: 700; }
.body { font-size: 13px; }
.small { font-size: 12px; fill: #4b5563; }
.formula { font-family: "Courier New", monospace; font-size: 13px; }
.box { stroke-width: 1.4; rx: 7; }
.arrow { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#arrow); }
.dash { stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 7 5; fill: none; marker-end: url(#arrow); }
.line { stroke: #6b7280; stroke-width: 1.5; fill: none; }
</style>
<rect width="1000" height="410" fill="#ffffff"/>
<text x="40" y="42" class="title" text-anchor="start">Deployment is a sequence of reversible evidence gates</text>
<text x="40" y="68" class="subtitle" text-anchor="start">Offline validation, shadowing, canary traffic, ramp-up, and operation each have rollback criteria.</text>
<rect x="35" y="128" width="165" height="145" class="box" fill="#f3f4f6" stroke="#374151"/><text x="117" y="157" class="head" text-anchor="middle">Offline</text><text x="49" y="184" class="body" text-anchor="start"><tspan x="49" dy="0">tests</tspan><tspan x="49" dy="19">replay</tspan></text><path d="M 200 200 L 225 200" class="arrow"/><text x="212" y="192" class="small" text-anchor="middle">gate</text><rect x="225" y="128" width="165" height="145" class="box" fill="#dbeafe" stroke="#374151"/><text x="307" y="157" class="head" text-anchor="middle">Shadow</text><text x="239" y="184" class="body" text-anchor="start"><tspan x="239" dy="0">no action</tspan><tspan x="239" dy="19">compare</tspan></text><path d="M 390 200 L 415 200" class="arrow"/><text x="402" y="192" class="small" text-anchor="middle">gate</text><rect x="415" y="128" width="165" height="145" class="box" fill="#dcfce7" stroke="#374151"/><text x="497" y="157" class="head" text-anchor="middle">Canary</text><text x="429" y="184" class="body" text-anchor="start"><tspan x="429" dy="0">small traffic</tspan><tspan x="429" dy="19">guardrails</tspan></text><path d="M 580 200 L 605 200" class="arrow"/><text x="592" y="192" class="small" text-anchor="middle">gate</text><rect x="605" y="128" width="165" height="145" class="box" fill="#fef3c7" stroke="#374151"/><text x="687" y="157" class="head" text-anchor="middle">Ramp</text><text x="619" y="184" class="body" text-anchor="start"><tspan x="619" dy="0">25/50/100%</tspan><tspan x="619" dy="19">watch SLOs</tspan></text><path d="M 770 200 L 795 200" class="arrow"/><text x="782" y="192" class="small" text-anchor="middle">gate</text><rect x="795" y="128" width="165" height="145" class="box" fill="#fee2e2" stroke="#374151"/><text x="877" y="157" class="head" text-anchor="middle">Operate</text><text x="809" y="184" class="body" text-anchor="start"><tspan x="809" dy="0">fallback</tspan><tspan x="809" dy="19">rollback</tspan></text><path d="M 875 273 C 875 350, 505 350, 505 276" class="dash"/><text x="500" y="368" class="head" text-anchor="middle">Any failed guardrail returns traffic to a known-good model or deterministic fallback.</text>
</svg>
