<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Paired bootstrap preserves the shared test cases</title><desc id="desc">Two models are evaluated on the same cases; cases are resampled together, producing a distribution of paired metric differences and an interval compared with a practical equivalence region.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#334155"/></marker><style>.t{font:700 28px Arial,sans-serif;fill:#0f172a}.h{font:700 19px Arial,sans-serif;fill:#0f172a}.b{font:15px Arial,sans-serif;fill:#334155}.s{font:13px Arial,sans-serif;fill:#475569}.box{fill:#fff;stroke:#64748b;stroke-width:2}.arr{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="640" fill="#f8fafc"/><text x="600" y="42" text-anchor="middle" class="t">Paired bootstrap preserves the shared test cases</text>
  <rect x="45" y="90" width="260" height="350" rx="8" class="box"/><text x="175" y="125" text-anchor="middle" class="h">Locked test predictions</text><text x="75" y="160" class="s">case</text><text x="135" y="160" class="s">truth</text><text x="195" y="160" class="s">A</text><text x="245" y="160" class="s">B</text>
  <g class="b"><text x="80" y="195">1</text><text x="140" y="195">1</text><text x="200" y="195">1</text><text x="250" y="195">1</text><text x="80" y="230">2</text><text x="140" y="230">0</text><text x="200" y="230">1</text><text x="250" y="230">0</text><text x="80" y="265">3</text><text x="140" y="265">1</text><text x="200" y="265">0</text><text x="250" y="265">1</text><text x="80" y="300">4</text><text x="140" y="300">0</text><text x="200" y="300">0</text><text x="250" y="300">0</text><text x="80" y="335">...</text><text x="140" y="335">...</text><text x="200" y="335">...</text><text x="250" y="335">...</text></g>
  <line x1="65" y1="170" x2="280" y2="170" stroke="#94a3b8"/><text x="175" y="382" text-anchor="middle" class="b">both models see each case</text><text x="175" y="408" text-anchor="middle" class="s">keep groups or blocks intact</text>
  <path d="M305 260 H385" class="arr"/><rect x="390" y="90" width="260" height="350" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="520" y="125" text-anchor="middle" class="h">Resample units together</text><g fill="#2563eb"><circle cx="435" cy="190" r="17"/><circle cx="485" cy="190" r="17"/><circle cx="535" cy="190" r="17"/><circle cx="585" cy="190" r="17"/><circle cx="435" cy="245" r="17"/><circle cx="485" cy="245" r="17"/><circle cx="535" cy="245" r="17"/><circle cx="585" cy="245" r="17"/></g><g class="b" fill="#fff"><text x="430" y="196">2</text><text x="480" y="196">4</text><text x="530" y="196">2</text><text x="580" y="196">1</text><text x="430" y="251">3</text><text x="480" y="251">2</text><text x="530" y="251">4</text><text x="580" y="251">1</text></g><text x="520" y="305" text-anchor="middle" class="b">compute delta* = metric(A*)</text><text x="520" y="330" text-anchor="middle" class="b">- metric(B*)</text><text x="520" y="372" text-anchor="middle" class="s">repeat B times with replacement</text><text x="520" y="397" text-anchor="middle" class="s">pairing removes shared-case noise</text>
  <path d="M650 260 H730" class="arr"/><rect x="735" y="90" width="420" height="350" rx="8" class="box"/><text x="945" y="125" text-anchor="middle" class="h">Distribution of paired differences</text><line x1="785" y1="360" x2="1110" y2="360" stroke="#334155" stroke-width="2"/><rect x="900" y="160" width="90" height="200" fill="#fef3c7" opacity=".9"/><text x="945" y="182" text-anchor="middle" class="s">practical equivalence</text><path d="M795 350 C835 345 850 320 875 275 C900 225 925 190 950 185 C980 180 1010 220 1030 270 C1050 320 1070 345 1100 350" fill="#ddd6fe" stroke="#7c3aed" stroke-width="3"/><line x1="842" y1="350" x2="842" y2="245" stroke="#2563eb" stroke-width="3" stroke-dasharray="7 5"/><line x1="1055" y1="350" x2="1055" y2="245" stroke="#2563eb" stroke-width="3" stroke-dasharray="7 5"/><line x1="945" y1="360" x2="945" y2="145" stroke="#ef4444" stroke-width="3"/><text x="842" y="385" text-anchor="middle" class="s">2.5%</text><text x="1055" y="385" text-anchor="middle" class="s">97.5%</text><text x="945" y="410" text-anchor="middle" class="b">report estimate, interval and meaningful effect</text>
  <rect x="145" y="495" width="910" height="92" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="600" y="527" text-anchor="middle" class="h">The sampling unit determines what uncertainty means</text><text x="600" y="555" text-anchor="middle" class="b">Independent rows: resample rows. Repeated patients: resample patients. Time dependence: use blocks.</text><text x="600" y="579" text-anchor="middle" class="s">Resampling predictions quantifies test-sample uncertainty; it does not include retraining variability unless the full procedure is repeated.</text>
</svg>
