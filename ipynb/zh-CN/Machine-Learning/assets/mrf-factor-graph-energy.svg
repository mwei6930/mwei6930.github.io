<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
  <title id="title">Markov random field factor graph and energy representation</title>
  <desc id="desc">An undirected pairwise model is rewritten as a bipartite factor graph and connected to an energy and partition function.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#495057"/></marker><style>.box{stroke:#495057;stroke-width:2}.v{fill:#e7f5ff;stroke:#343a40;stroke-width:2}.f{fill:#ffe8cc;stroke:#343a40;stroke-width:2}.h{font:700 23px Arial,sans-serif;fill:#212529}.t{font:17px Arial,sans-serif;fill:#343a40}.s{font:15px Arial,sans-serif;fill:#495057}.edge{stroke:#495057;stroke-width:3}.arrow{stroke:#495057;stroke-width:2.5;fill:none;marker-end:url(#a)}</style></defs>
  <text x="600" y="38" text-anchor="middle" class="h">Compatibility, Factors, and Energy Describe the Same Model</text>
  <rect x="35" y="78" width="330" height="405" rx="6" class="box" fill="#ebfbee"/><text x="200" y="116" text-anchor="middle" class="h">Pairwise Markov Network</text>
  <circle cx="120" cy="220" r="30" class="v"/><circle cx="280" cy="220" r="30" class="v"/><circle cx="120" cy="370" r="30" class="v"/><circle cx="280" cy="370" r="30" class="v"/><text x="120" y="227" text-anchor="middle" class="h">A</text><text x="280" y="227" text-anchor="middle" class="h">B</text><text x="120" y="377" text-anchor="middle" class="h">C</text><text x="280" y="377" text-anchor="middle" class="h">D</text>
  <path d="M150 220 H250 M120 250 V340 M280 250 V340 M150 370 H250 M142 242 L258 348" class="edge"/>
  <path d="M365 280 H415" class="arrow"/>
  <rect x="425" y="78" width="350" height="405" rx="6" class="box" fill="#fff3bf"/><text x="600" y="116" text-anchor="middle" class="h">Factor Graph</text>
  <circle cx="490" cy="220" r="27" class="v"/><circle cx="710" cy="220" r="27" class="v"/><circle cx="490" cy="370" r="27" class="v"/><circle cx="710" cy="370" r="27" class="v"/><text x="490" y="227" text-anchor="middle" class="h">A</text><text x="710" y="227" text-anchor="middle" class="h">B</text><text x="490" y="377" text-anchor="middle" class="h">C</text><text x="710" y="377" text-anchor="middle" class="h">D</text>
  <rect x="575" y="198" width="50" height="44" class="f"/><rect x="465" y="278" width="50" height="44" class="f"/><rect x="685" y="278" width="50" height="44" class="f"/><rect x="575" y="348" width="50" height="44" class="f"/><rect x="575" y="273" width="50" height="44" class="f"/>
  <text x="600" y="226" text-anchor="middle" class="s">fAB</text><text x="490" y="306" text-anchor="middle" class="s">fAC</text><text x="710" y="306" text-anchor="middle" class="s">fBD</text><text x="600" y="376" text-anchor="middle" class="s">fCD</text><text x="600" y="301" text-anchor="middle" class="s">fAD</text>
  <path d="M517 220 H575 M625 220 H683 M490 247 V278 M710 247 V278 M490 322 V343 M710 322 V343 M625 370 H683 M517 370 H575 M512 238 L575 273 M688 238 L625 273 M512 352 L575 317 M688 352 L625 317" class="edge"/>
  <path d="M775 280 H825" class="arrow"/>
  <rect x="835" y="78" width="330" height="405" rx="6" class="box" fill="#f3f0ff"/><text x="1000" y="116" text-anchor="middle" class="h">Energy Form</text>
  <text x="1000" y="185" text-anchor="middle" class="t">p(x) = exp(-E(x)) / Z</text><text x="1000" y="235" text-anchor="middle" class="t">E(x) = sum of local energies</text>
  <rect x="875" y="280" width="250" height="110" rx="6" class="box" fill="#fff"/><text x="1000" y="316" text-anchor="middle" class="h">Partition function Z</text><text x="1000" y="347" text-anchor="middle" class="s">Normalizes all configurations</text><text x="1000" y="375" text-anchor="middle" class="s">Often the computational bottleneck</text>
  <text x="600" y="535" text-anchor="middle" class="t">Low energy means high compatibility. Potentials need only be non-negative; they are not probabilities by themselves.</text>
</svg>
