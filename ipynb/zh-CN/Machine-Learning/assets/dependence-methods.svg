<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="415" viewBox="0 0 1000 415" role="img" aria-labelledby="title desc">
<title id="title">PDP, ICE, and ALE summarize feature-response behavior differently</title>
<desc id="desc">PDP averages a replacement intervention on the model input, ICE retains individual curves, and ALE averages local changes in observed regions.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
  </marker>
</defs>
<style>
text { font-family: Arial, Helvetica, sans-serif; letter-spacing: 0; fill: #1f2937; }
.title { font-size: 25px; font-weight: 700; }
.subtitle { font-size: 14px; fill: #4b5563; }
.head { font-size: 16px; font-weight: 700; }
.body { font-size: 13px; }
.small { font-size: 12px; fill: #4b5563; }
.formula { font-family: "Courier New", monospace; font-size: 13px; }
.box { stroke-width: 1.4; rx: 7; }
.arrow { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#arrow); }
.dash { stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 7 5; fill: none; marker-end: url(#arrow); }
.axis { stroke: #6b7280; stroke-width: 1.3; fill: none; }
</style>
<rect width="1000" height="415" fill="#ffffff"/>
<text x="40" y="42" class="title" text-anchor="start">PDP, ICE, and ALE summarize feature-response behavior differently</text>
<text x="40" y="68" class="subtitle" text-anchor="start">PDP averages a replacement intervention on the model input, ICE retains individual curves, and ALE averages local changes in observed regions.</text>
<rect x="35" y="112" width="280" height="220" class="box" fill="#dbeafe" stroke="#374151"/><text x="175" y="141" class="head" text-anchor="middle">PDP</text><text x="49" y="168" class="body" text-anchor="start"><tspan x="49" dy="0">Average predictions after replacing Xj</tspan><tspan x="49" dy="19">One global curve</tspan><tspan x="49" dy="19">Can evaluate implausible combinations</tspan></text><rect x="360" y="112" width="280" height="220" class="box" fill="#dcfce7" stroke="#374151"/><text x="500" y="141" class="head" text-anchor="middle">ICE</text><text x="374" y="168" class="body" text-anchor="start"><tspan x="374" dy="0">One curve per observation</tspan><tspan x="374" dy="19">Reveals heterogeneity</tspan><tspan x="374" dy="19">Shares PDP extrapolation risk</tspan></text><rect x="685" y="112" width="280" height="220" class="box" fill="#fef3c7" stroke="#374151"/><text x="825" y="141" class="head" text-anchor="middle">ALE</text><text x="699" y="168" class="body" text-anchor="start"><tspan x="699" dy="0">Average local prediction differences</tspan><tspan x="699" dy="19">Conditions on observed neighborhoods</tspan><tspan x="699" dy="19">Accumulates centered effects</tspan></text><text x="500" y="371" class="head" text-anchor="middle">All three describe the fitted model, not a causal intervention.</text>
</svg>
