<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">Forward and Viterbi dynamic programs differ by one aggregation operator</title>
  <desc id="desc">Both algorithms combine a previous score, transition score, and emission score, but Forward sums all predecessor paths while Viterbi maximizes and stores a backpointer.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#495057"/></marker><style>.box{stroke:#495057;stroke-width:2}.h{font:700 23px Arial,sans-serif;fill:#212529}.t{font:18px Arial,sans-serif;fill:#343a40}.s{font:15px Arial,sans-serif;fill:#495057}.line{stroke:#495057;stroke-width:2.5;fill:none;marker-end:url(#a)}</style></defs>
  <text x="600" y="38" text-anchor="middle" class="h">Same Trellis, Different Aggregation</text>
  <rect x="50" y="82" width="500" height="380" rx="6" class="box" fill="#e7f5ff"/><rect x="650" y="82" width="500" height="380" rx="6" class="box" fill="#ffe8cc"/>
  <text x="300" y="125" text-anchor="middle" class="h">Forward: sum-product</text><text x="900" y="125" text-anchor="middle" class="h">Viterbi: max-product</text>
  <rect x="100" y="175" width="145" height="70" rx="6" class="box" fill="#fff"/><text x="172" y="205" text-anchor="middle" class="t">all previous</text><text x="172" y="230" text-anchor="middle" class="t">path mass</text>
  <path d="M245 210 H282" class="line"/><rect x="290" y="175" width="210" height="70" rx="6" class="box" fill="#fff3bf"/><text x="395" y="218" text-anchor="middle" class="t">SUM predecessors</text>
  <path d="M395 245 V285" class="line"/><rect x="200" y="295" width="200" height="70" rx="6" class="box" fill="#ebfbee"/><text x="300" y="325" text-anchor="middle" class="t">multiply emission</text><text x="300" y="350" text-anchor="middle" class="s">marginal likelihood</text>
  <text x="300" y="415" text-anchor="middle" class="t">Keeps every path implicitly</text>
  <rect x="700" y="175" width="145" height="70" rx="6" class="box" fill="#fff"/><text x="772" y="205" text-anchor="middle" class="t">best previous</text><text x="772" y="230" text-anchor="middle" class="t">path score</text>
  <path d="M845 210 H882" class="line"/><rect x="890" y="175" width="210" height="70" rx="6" class="box" fill="#fff3bf"/><text x="995" y="218" text-anchor="middle" class="t">MAX predecessor</text>
  <path d="M995 245 V285" class="line"/><rect x="800" y="295" width="200" height="70" rx="6" class="box" fill="#f3f0ff"/><text x="900" y="325" text-anchor="middle" class="t">multiply emission</text><text x="900" y="350" text-anchor="middle" class="s">store backpointer</text>
  <text x="900" y="415" text-anchor="middle" class="t">Keeps one winning predecessor</text>
  <text x="600" y="505" text-anchor="middle" class="s">In log space, multiplication becomes addition; Forward uses log-sum-exp while Viterbi uses max.</text>
</svg>
