<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">Comparison of Laplace approximation, variational inference, and Monte Carlo methods</title>
  <desc id="desc">Three approximate inference methods trade local Gaussian fitting, optimization speed, and sampling accuracy when the exact Bayesian posterior is unavailable.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#495057"/></marker>
    <style>.box{fill:#fff;stroke:#495057;stroke-width:2}.target{fill:#f8f9fa}.lap{fill:#e7f5ff}.vi{fill:#fff3bf}.mc{fill:#ebfbee}.h{font:700 24px Arial,sans-serif;fill:#212529}.t{font:17px Arial,sans-serif;fill:#343a40}.s{font:15px Arial,sans-serif;fill:#495057}.line{stroke:#495057;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <text x="600" y="38" text-anchor="middle" class="h">When the Exact Posterior Cannot Be Integrated</text>
  <rect x="410" y="70" width="380" height="115" rx="6" class="box target"/>
  <text x="600" y="112" text-anchor="middle" class="h">Target posterior p(theta | D)</text>
  <text x="600" y="151" text-anchor="middle" class="t">Known up to a normalizing constant</text>
  <rect x="45" y="285" width="335" height="245" rx="6" class="box lap"/>
  <text x="212" y="326" text-anchor="middle" class="h">Laplace</text>
  <text x="75" y="367" class="t">Fit a Gaussian at the mode</text>
  <text x="75" y="404" class="t">using local curvature</text>
  <text x="75" y="452" class="s">Fast and deterministic</text>
  <text x="75" y="480" class="s">Local; weak for skew or modes</text>
  <rect x="432" y="285" width="335" height="245" rx="6" class="box vi"/>
  <text x="600" y="326" text-anchor="middle" class="h">Variational Inference</text>
  <text x="462" y="367" class="t">Optimize q(theta) to maximize</text>
  <text x="462" y="404" class="t">the evidence lower bound</text>
  <text x="462" y="452" class="s">Scalable and optimization-based</text>
  <text x="462" y="480" class="s">Family and KL direction add bias</text>
  <rect x="820" y="285" width="335" height="245" rx="6" class="box mc"/>
  <text x="987" y="326" text-anchor="middle" class="h">Monte Carlo</text>
  <text x="850" y="367" class="t">Construct weighted or correlated</text>
  <text x="850" y="404" class="t">draws from the target</text>
  <text x="850" y="452" class="s">Flexible asymptotic estimator</text>
  <text x="850" y="480" class="s">Needs diagnostics and computation</text>
  <path d="M520 185 C390 220 260 235 220 277" class="line"/>
  <path d="M600 185 V277" class="line"/>
  <path d="M680 185 C810 220 940 235 980 277" class="line"/>
  <rect x="160" y="575" width="880" height="52" rx="6" fill="#ffe8cc" stroke="#adb5bd"/>
  <text x="600" y="607" text-anchor="middle" class="t">Approximation error and Monte Carlo error are different; both must be distinguished from posterior uncertainty.</text>
</svg>
