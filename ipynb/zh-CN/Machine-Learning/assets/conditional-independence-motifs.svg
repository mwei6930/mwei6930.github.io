<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
  <title id="title">Chain fork and collider conditional independence motifs</title>
  <desc id="desc">Three Bayesian-network motifs show when conditioning blocks a path and why conditioning on a collider or its descendant opens a path.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#495057"/></marker><style>.panel{fill:#fff;stroke:#adb5bd;stroke-width:2}.node{fill:#e7f5ff;stroke:#343a40;stroke-width:2}.obs{fill:#fff3bf;stroke:#343a40;stroke-width:3}.h{font:700 23px Arial,sans-serif;fill:#212529}.t{font:18px Arial,sans-serif;fill:#343a40}.s{font:15px Arial,sans-serif;fill:#495057}.line{stroke:#495057;stroke-width:2.5;fill:none;marker-end:url(#a)}</style></defs>
  <text x="600" y="38" text-anchor="middle" class="h">Three Paths That Control D-Separation</text>
  <rect x="35" y="72" width="350" height="425" rx="6" class="panel"/><rect x="425" y="72" width="350" height="425" rx="6" class="panel"/><rect x="815" y="72" width="350" height="425" rx="6" class="panel"/>
  <text x="210" y="110" text-anchor="middle" class="h">Chain</text><text x="600" y="110" text-anchor="middle" class="h">Fork</text><text x="990" y="110" text-anchor="middle" class="h">Collider</text>
  <circle cx="105" cy="215" r="34" class="node"/><circle cx="210" cy="215" r="34" class="obs"/><circle cx="315" cy="215" r="34" class="node"/><text x="105" y="222" text-anchor="middle" class="h">X</text><text x="210" y="222" text-anchor="middle" class="h">Z</text><text x="315" y="222" text-anchor="middle" class="h">Y</text><path d="M139 215 H168" class="line"/><path d="M244 215 H273" class="line"/>
  <text x="210" y="290" text-anchor="middle" class="t">X -> Z -> Y</text><text x="210" y="335" text-anchor="middle" class="t">Observe Z: path blocked</text><text x="210" y="370" text-anchor="middle" class="s">X independent of Y given Z</text>
  <circle cx="495" cy="215" r="34" class="node"/><circle cx="600" cy="155" r="34" class="obs"/><circle cx="705" cy="215" r="34" class="node"/><text x="495" y="222" text-anchor="middle" class="h">X</text><text x="600" y="162" text-anchor="middle" class="h">Z</text><text x="705" y="222" text-anchor="middle" class="h">Y</text><path d="M574 178 L526 205" class="line"/><path d="M626 178 L674 205" class="line"/>
  <text x="600" y="290" text-anchor="middle" class="t">X <- Z -> Y</text><text x="600" y="335" text-anchor="middle" class="t">Observe Z: common cause blocked</text><text x="600" y="370" text-anchor="middle" class="s">X independent of Y given Z</text>
  <circle cx="885" cy="170" r="34" class="node"/><circle cx="990" cy="240" r="34" class="obs"/><circle cx="1095" cy="170" r="34" class="node"/><text x="885" y="177" text-anchor="middle" class="h">X</text><text x="990" y="247" text-anchor="middle" class="h">Z</text><text x="1095" y="177" text-anchor="middle" class="h">Y</text><path d="M913 189 L958 220" class="line"/><path d="M1067 189 L1022 220" class="line"/>
  <text x="990" y="315" text-anchor="middle" class="t">X -> Z <- Y</text><text x="990" y="355" text-anchor="middle" class="t">Unobserved Z: path blocked</text><text x="990" y="390" text-anchor="middle" class="t">Observe Z: path opens</text><text x="990" y="425" text-anchor="middle" class="s">Explaining away creates dependence</text>
  <text x="600" y="540" text-anchor="middle" class="s">Yellow nodes are conditioned on. A graph encodes observational independences; causal interpretation requires additional assumptions.</text>
</svg>
