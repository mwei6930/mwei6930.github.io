<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
  <title id="title">Random projection and the Johnson-Lindenstrauss guarantee</title><desc id="desc">High-dimensional points are multiplied by a random matrix to obtain fewer dimensions while approximately preserving pairwise squared distances.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#475569"/></marker><style>.h{font:700 25px Arial,sans-serif;fill:#17212b}.t{font:18px Arial,sans-serif;fill:#334155}.s{font:15px Arial,sans-serif;fill:#526172}.line{stroke:#475569;stroke-width:3;marker-end:url(#a)}</style></defs><rect width="1200" height="590" fill="#fff"/><text x="600" y="42" text-anchor="middle" class="h">Random projection preserves geometry without fitting data-dependent directions</text><rect x="45" y="120" width="300" height="330" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="195" y="158" text-anchor="middle" class="h">High-dimensional X</text><g fill="#2563eb"><circle cx="105" cy="230" r="9"/><circle cx="160" cy="205" r="9"/><circle cx="220" cy="250" r="9"/><circle cx="275" cy="195" r="9"/><circle cx="135" cy="335" r="9"/><circle cx="205" cy="360" r="9"/><circle cx="280" cy="325" r="9"/></g><line x1="105" y1="230" x2="280" y2="325" stroke="#e8590c" stroke-width="4"/><text x="195" y="405" text-anchor="middle" class="s">d original features</text><line x1="355" y1="285" x2="445" y2="285" class="line"/><rect x="455" y="145" width="290" height="280" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="600" y="185" text-anchor="middle" class="h">Random matrix R</text><text x="600" y="225" text-anchor="middle" class="t">Z = X R^T</text><g fill="#bfdbfe" stroke="#2563eb"><rect x="515" y="255" width="35" height="35"/><rect x="555" y="255" width="35" height="35"/><rect x="595" y="255" width="35" height="35"/><rect x="635" y="255" width="35" height="35"/><rect x="515" y="295" width="35" height="35"/><rect x="555" y="295" width="35" height="35"/><rect x="595" y="295" width="35" height="35"/><rect x="635" y="295" width="35" height="35"/></g><text x="600" y="375" text-anchor="middle" class="s">Gaussian or sparse signs; no iterative fit</text><line x1="755" y1="285" x2="835" y2="285" class="line"/><rect x="845" y="120" width="310" height="330" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="1000" y="158" text-anchor="middle" class="h">Lower-dimensional Z</text><g fill="#16a34a"><circle cx="900" cy="240" r="9"/><circle cx="945" cy="210" r="9"/><circle cx="1000" cy="260" r="9"/><circle cx="1075" cy="205" r="9"/><circle cx="920" cy="340" r="9"/><circle cx="990" cy="365" r="9"/><circle cx="1080" cy="325" r="9"/></g><line x1="900" y1="240" x2="1080" y2="325" stroke="#e8590c" stroke-width="4"/><text x="1000" y="405" text-anchor="middle" class="s">k dimensions, k independent of d</text><rect x="195" y="490" width="810" height="60" rx="6" fill="#fff7ed" stroke="#fdba74"/><text x="600" y="518" text-anchor="middle" class="t">(1-eps)||u-v||^2 &lt;= ||Ru-Rv||^2 &lt;= (1+eps)||u-v||^2</text><text x="600" y="542" text-anchor="middle" class="s">with high probability when k is large enough for n observations and distortion eps</text>
</svg>
