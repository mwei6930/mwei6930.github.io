<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="425" viewBox="0 0 1000 425" role="img" aria-labelledby="title desc">
<title id="title">Complexity must earn its place</title>
<desc id="desc">A model progresses from dummy and heuristic baselines to a deployable system only through controlled evidence.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
  </marker>
</defs>
<style>
text { font-family: Arial, Helvetica, sans-serif; letter-spacing: 0; fill: #1f2937; }
.title { font-size: 25px; font-weight: 700; }
.subtitle { font-size: 14px; fill: #4b5563; }
.head { font-size: 16px; font-weight: 700; }
.body { font-size: 13px; }
.small { font-size: 12px; fill: #4b5563; }
.formula { font-family: "Courier New", monospace; font-size: 13px; }
.box { stroke-width: 1.4; rx: 7; }
.arrow { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#arrow); }
.dash { stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 7 5; fill: none; marker-end: url(#arrow); }
.line { stroke: #6b7280; stroke-width: 1.5; fill: none; }
</style>
<rect width="1000" height="425" fill="#ffffff"/>
<text x="40" y="42" class="title" text-anchor="start">Complexity must earn its place</text>
<text x="40" y="68" class="subtitle" text-anchor="start">A model progresses from dummy and heuristic baselines to a deployable system only through controlled evidence.</text>
<rect x="45" y="250" width="150" height="95" class="box" fill="#f3f4f6" stroke="#374151"/><text x="120" y="279" class="head" text-anchor="middle">Dummy</text><text x="59" y="306" class="body" text-anchor="start"><tspan x="59" dy="0">prevalence</tspan><tspan x="59" dy="19">mean/median</tspan></text><rect x="225" y="210" width="150" height="135" class="box" fill="#dbeafe" stroke="#374151"/><text x="300" y="239" class="head" text-anchor="middle">Heuristic</text><text x="239" y="266" class="body" text-anchor="start"><tspan x="239" dy="0">domain rule</tspan><tspan x="239" dy="19">current policy</tspan><tspan x="239" dy="19">cost-aware</tspan></text><rect x="405" y="170" width="150" height="175" class="box" fill="#dcfce7" stroke="#374151"/><text x="480" y="199" class="head" text-anchor="middle">Classical</text><text x="419" y="226" class="body" text-anchor="start"><tspan x="419" dy="0">linear/tree</tspan><tspan x="419" dy="19">simple features</tspan><tspan x="419" dy="19">calibrated</tspan></text><rect x="585" y="130" width="150" height="215" class="box" fill="#fef3c7" stroke="#374151"/><text x="660" y="159" class="head" text-anchor="middle">Candidate</text><text x="599" y="186" class="body" text-anchor="start"><tspan x="599" dy="0">added capacity</tspan><tspan x="599" dy="19">ablation</tspan><tspan x="599" dy="19">uncertainty</tspan></text><rect x="765" y="90" width="190" height="255" class="box" fill="#fee2e2" stroke="#374151"/><text x="860" y="119" class="head" text-anchor="middle">Deployable system</text><text x="779" y="146" class="body" text-anchor="start"><tspan x="779" dy="0">offline gain</tspan><tspan x="779" dy="19">latency/cost</tspan><tspan x="779" dy="19">slice guardrails</tspan><tspan x="779" dy="19">rollback evidence</tspan></text><path d="M 195 297 L 225 277" class="arrow"/><path d="M 375 277 L 405 257" class="arrow"/><path d="M 555 257 L 585 237" class="arrow"/><path d="M 735 237 L 765 217" class="arrow"/><text x="500" y="382" class="head" text-anchor="middle">Each step must justify its extra data, complexity, and operational burden.</text>
</svg>
