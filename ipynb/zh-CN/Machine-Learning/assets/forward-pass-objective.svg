<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Forward pass from mini-batch to objective</title>
  <desc id="desc">A mini-batch flows through affine transformations, nonlinear activations, an output head, and a task loss, with tensor dimensions and regularization shown.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#495057"/></marker><style>.h{font:700 24px Arial,sans-serif;fill:#212529}.t{font:700 17px Arial,sans-serif;fill:#343a40}.s{font:15px Arial,sans-serif;fill:#495057}.box{stroke:#495057;stroke-width:2;rx:6}.line{stroke:#495057;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style></defs>
  <text x="600" y="38" text-anchor="middle" class="h">Forward Pass: Values Move Left to Right</text>
  <rect x="25" y="155" width="160" height="150" class="box" fill="#e7f5ff"/><text x="105" y="195" text-anchor="middle" class="t">Mini-batch X</text><text x="105" y="230" text-anchor="middle" class="s">shape B x d</text><text x="105" y="268" text-anchor="middle" class="s">features</text>
  <path d="M185 230 H235" class="line"/>
  <rect x="240" y="135" width="190" height="190" class="box" fill="#fff3bf"/><text x="335" y="180" text-anchor="middle" class="t">Affine layer</text><text x="335" y="218" text-anchor="middle" class="s">Z1 = X W1 + b1</text><text x="335" y="252" text-anchor="middle" class="s">B x h</text><text x="335" y="288" text-anchor="middle" class="s">learned projection</text>
  <path d="M430 230 H480" class="line"/>
  <rect x="485" y="155" width="160" height="150" class="box" fill="#d3f9d8"/><text x="565" y="195" text-anchor="middle" class="t">Activation</text><text x="565" y="230" text-anchor="middle" class="s">H = g(Z1)</text><text x="565" y="268" text-anchor="middle" class="s">B x h</text>
  <path d="M645 230 H695" class="line"/>
  <rect x="700" y="135" width="190" height="190" class="box" fill="#f3d9fa"/><text x="795" y="180" text-anchor="middle" class="t">Output head</text><text x="795" y="218" text-anchor="middle" class="s">O = H W2 + b2</text><text x="795" y="252" text-anchor="middle" class="s">B x q</text><text x="795" y="288" text-anchor="middle" class="s">logit or prediction</text>
  <path d="M890 230 H940" class="line"/>
  <rect x="945" y="135" width="225" height="190" class="box" fill="#ffe3e3"/><text x="1057" y="180" text-anchor="middle" class="t">Data loss</text><text x="1057" y="218" text-anchor="middle" class="s">L_data(O, y)</text><text x="1057" y="252" text-anchor="middle" class="s">one scalar</text><text x="1057" y="288" text-anchor="middle" class="s">task mismatch</text>
  <rect x="340" y="405" width="520" height="120" class="box" fill="#f8f9fa"/><text x="600" y="445" text-anchor="middle" class="t">Training objective</text><text x="600" y="480" text-anchor="middle" class="s">J(theta) = mean_i L_data(f_theta(x_i), y_i) + lambda R(theta)</text><text x="600" y="510" text-anchor="middle" class="s">The forward pass caches intermediate values needed by backward propagation.</text>
  <path d="M1057 325 C1057 390 865 400 820 430" class="line"/>
</svg>
