<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
  <title id="title">Map of rule, tree, and ensemble learning</title>
  <desc id="desc">A progression from explicit rules and a single decision tree to bagging, boosting, and stacking.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#495057"/></marker>
    <style>
      .box{fill:#fff;stroke:#495057;stroke-width:2}.rule{fill:#e7f5ff}.tree{fill:#ebfbee}.bag{fill:#fff3bf}.boost{fill:#ffe8cc}.stack{fill:#f3f0ff}
      .h{font:700 24px Arial,sans-serif;fill:#212529}.t{font:17px Arial,sans-serif;fill:#343a40}.s{font:15px Arial,sans-serif;fill:#495057}.line{stroke:#495057;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <text x="600" y="38" text-anchor="middle" class="h">From Explicit Rules to Ensembles</text>
  <rect x="40" y="88" width="205" height="150" rx="6" class="box rule"/>
  <text x="142" y="124" text-anchor="middle" class="h">Rules</text>
  <text x="60" y="158" class="t">IF condition</text><text x="60" y="186" class="t">THEN prediction</text>
  <text x="60" y="218" class="s">OneR / PRISM</text>
  <rect x="290" y="88" width="205" height="150" rx="6" class="box tree"/>
  <text x="392" y="124" text-anchor="middle" class="h">Single Tree</text>
  <text x="310" y="158" class="t">Recursive splits</text><text x="310" y="186" class="t">Leaf predictions</text>
  <text x="310" y="218" class="s">Interpretable, unstable</text>
  <path d="M245 163 H282" class="line"/>
  <rect x="545" y="62" width="285" height="176" rx="6" class="box bag"/>
  <text x="687" y="100" text-anchor="middle" class="h">Bagging / Forests</text>
  <text x="565" y="138" class="t">Trees learn in parallel</text><text x="565" y="168" class="t">on randomized data/features</text>
  <text x="565" y="208" class="s">Average to reduce variance</text>
  <path d="M495 142 H537" class="line"/>
  <rect x="545" y="282" width="285" height="176" rx="6" class="box boost"/>
  <text x="687" y="320" text-anchor="middle" class="h">Boosting</text>
  <text x="565" y="358" class="t">Trees learn sequentially</text><text x="565" y="388" class="t">from earlier mistakes</text>
  <text x="565" y="428" class="s">Reduce bias under regularization</text>
  <path d="M495 184 C525 205 515 360 537 368" class="line"/>
  <rect x="900" y="172" width="255" height="176" rx="6" class="box stack"/>
  <text x="1027" y="210" text-anchor="middle" class="h">Voting / Stacking</text>
  <text x="920" y="248" class="t">Combine distinct models</text><text x="920" y="278" class="t">or learn a meta-model</text>
  <text x="920" y="318" class="s">Exploit complementary errors</text>
  <path d="M830 150 C865 150 868 217 892 228" class="line"/>
  <path d="M830 370 C865 370 868 303 892 292" class="line"/>
  <rect x="150" y="493" width="900" height="50" rx="6" fill="#f8f9fa" stroke="#adb5bd"/>
  <text x="600" y="525" text-anchor="middle" class="t">Shared idea: divide a difficult prediction problem into simpler local decisions, then control complexity.</text>
</svg>
