<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Gaussian mixture model and expectation-maximization</title>
  <desc id="desc">A teaching diagram showing overlapping Gaussian components, soft responsibilities, and the alternating E-step and M-step.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#475569"/></marker><style>.h{font:700 26px Arial,sans-serif;fill:#17212b}.t{font:18px Arial,sans-serif;fill:#334155}.s{font:15px Arial,sans-serif;fill:#526172}.panel{fill:#f8fafc;stroke:#94a3b8;stroke-width:2}.blue{fill:#2563eb}.orange{fill:#e8590c}.green{fill:#16a34a}</style></defs>
  <rect width="1200" height="650" fill="#fff"/>
  <text x="600" y="42" text-anchor="middle" class="h">Gaussian mixtures: explain data with overlapping probability components</text>
  <rect x="32" y="82" width="430" height="480" rx="8" class="panel"/>
  <text x="247" y="122" text-anchor="middle" class="h">Soft membership</text>
  <ellipse cx="205" cy="315" rx="145" ry="88" transform="rotate(-25 205 315)" fill="#93c5fd" fill-opacity=".45" stroke="#2563eb" stroke-width="4"/>
  <ellipse cx="305" cy="325" rx="145" ry="90" transform="rotate(25 305 325)" fill="#fdba74" fill-opacity=".45" stroke="#e8590c" stroke-width="4"/>
  <circle cx="120" cy="335" r="8" class="blue"/><circle cx="160" cy="275" r="8" class="blue"/><circle cx="190" cy="348" r="8" class="blue"/><circle cx="230" cy="286" r="8" class="green"/><circle cx="258" cy="330" r="12" class="green"/><circle cx="285" cy="292" r="8" class="green"/><circle cx="325" cy="360" r="8" class="orange"/><circle cx="365" cy="302" r="8" class="orange"/><circle cx="392" cy="350" r="8" class="orange"/>
  <line x1="258" y1="330" x2="150" y2="430" stroke="#2563eb" stroke-width="4"/><line x1="258" y1="330" x2="360" y2="430" stroke="#e8590c" stroke-width="4"/>
  <text x="120" y="460" class="t">γ₁ = 0.58</text><text x="318" y="460" class="t">γ₂ = 0.42</text>
  <text x="247" y="505" text-anchor="middle" class="s">A point is not forced into one component</text>
  <rect x="505" y="82" width="663" height="480" rx="8" class="panel"/>
  <text x="837" y="122" text-anchor="middle" class="h">Expectation-Maximization loop</text>
  <rect x="560" y="170" width="220" height="105" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="670" y="205" text-anchor="middle" class="h">E-step</text>
  <text x="670" y="235" text-anchor="middle" class="t">Compute responsibilities</text>
  <text x="670" y="258" text-anchor="middle" class="s">γᵢₖ = P(zᵢ = k | xᵢ, θ)</text>
  <rect x="895" y="170" width="220" height="105" rx="8" fill="#ffedd5" stroke="#e8590c" stroke-width="3"/>
  <text x="1005" y="205" text-anchor="middle" class="h">M-step</text>
  <text x="1005" y="235" text-anchor="middle" class="t">Re-estimate parameters</text>
  <text x="1005" y="258" text-anchor="middle" class="s">πₖ, μₖ, Σₖ from weighted data</text>
  <line x1="784" y1="220" x2="886" y2="220" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1005 285 C1005 390 670 390 670 285" fill="none" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="655" y="420" width="365" height="82" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="3"/>
  <text x="837" y="452" text-anchor="middle" class="t">Observed log-likelihood does not decrease</text>
  <text x="837" y="482" text-anchor="middle" class="s">Stop when improvement is small, but the optimum may be local</text>
  <text x="600" y="613" text-anchor="middle" class="t">Component labels are interchangeable; interpret density and uncertainty before assigning semantic cluster names.</text>
</svg>
