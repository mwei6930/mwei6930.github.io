<title id="title">Rare-event scores, operating thresholds, and asymmetric costs</title><desc id="desc">Overlapping majority and rare-event score distributions illustrate how lower and higher thresholds trade recall, precision, and review workload.</desc>
<defs><marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#475569"/></marker>
<style>.title{font:700 26px Arial,sans-serif;fill:#17212b}.bh{font:700 19px Arial,sans-serif;fill:#17212b}.bt{font:15px Arial,sans-serif;fill:#334155}.small{font:14px Arial,sans-serif;fill:#526172}.arrow{stroke:#475569;stroke-width:3;marker-end:url(#arrowhead)}.node{stroke:#334155;stroke-width:2}</style></defs>
<rect width="1200" height="625" fill="#ffffff"/>
<text x="600" y="42" text-anchor="middle" class="title">Rare-event scores, operating thresholds, and asymmetric costs</text>
<line x1="80" y1="455" x2="1120" y2="455" stroke="#334155" stroke-width="3"/><line x1="80" y1="455" x2="80" y2="95" stroke="#334155" stroke-width="3"/><path d="M90 450 C250 445 320 380 430 250 C520 145 635 185 720 330 C790 440 900 450 1110 450" fill="none" stroke="#2563eb" stroke-width="5"/><path d="M90 450 C330 450 500 435 650 385 C800 335 900 210 1110 150" fill="none" stroke="#e11d48" stroke-width="5"/><text x="395" y="170" class="bh" fill="#2563eb">majority score density</text><text x="875" y="125" class="bh" fill="#e11d48">rare-event score density</text><line x1="530" y1="105" x2="530" y2="455" stroke="#9333ea" stroke-width="4" stroke-dasharray="9 7"/><line x1="760" y1="105" x2="760" y2="455" stroke="#e8590c" stroke-width="4" stroke-dasharray="9 7"/><text x="530" y="505" text-anchor="middle" class="bh" fill="#9333ea">low threshold</text><text x="530" y="535" text-anchor="middle" class="small">higher recall, more review</text><text x="760" y="505" text-anchor="middle" class="bh" fill="#e8590c">high threshold</text><text x="760" y="535" text-anchor="middle" class="small">higher precision, more misses</text><text x="1115" y="490" text-anchor="end" class="small">predicted probability / score</text><text x="600" y="590" text-anchor="middle" class="bh">Training weights change the fitted model; decision thresholds change the action policy.</text></svg>