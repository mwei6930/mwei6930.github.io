<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Aggregate performance can hide structured failures</title><desc id="desc">An overall metric is decomposed into subgroup, temporal and stress slices, followed by a hypothesis-driven error analysis loop.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#334155"/></marker><style>.t{font:700 28px Arial,sans-serif;fill:#0f172a}.h{font:700 19px Arial,sans-serif;fill:#0f172a}.b{font:15px Arial,sans-serif;fill:#334155}.s{font:13px Arial,sans-serif;fill:#475569}.box{fill:#fff;stroke:#64748b;stroke-width:2}.arr{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="640" fill="#f8fafc"/><text x="600" y="42" text-anchor="middle" class="t">Aggregate performance can hide structured failures</text>
  <rect x="45" y="85" width="270" height="205" rx="8" class="box"/><text x="180" y="120" text-anchor="middle" class="h">Overall score</text><text x="180" y="198" text-anchor="middle" font-family="Arial" font-size="54" font-weight="700" fill="#16a34a">0.91</text><text x="180" y="235" text-anchor="middle" class="b">looks acceptable</text><text x="180" y="263" text-anchor="middle" class="s">weighted toward common cases</text>
  <path d="M315 188 H390" class="arr"/><rect x="395" y="85" width="760" height="300" rx="8" class="box"/><text x="775" y="120" text-anchor="middle" class="h">Slice table with denominators and uncertainty</text>
  <text x="435" y="160" class="b">slice</text><text x="650" y="160" class="b">n</text><text x="755" y="160" class="b">metric</text><text x="890" y="160" class="b">interval</text><text x="1045" y="160" class="b">signal</text><line x1="425" y1="170" x2="1125" y2="170" stroke="#94a3b8"/>
  <rect x="425" y="184" width="700" height="40" fill="#ecfdf5"/><text x="435" y="210" class="b">majority group</text><text x="650" y="210" class="b">820</text><text x="755" y="210" class="b">0.94</text><text x="890" y="210" class="b">[0.92, 0.95]</text><text x="1045" y="210" class="b" fill="#16a34a">stable</text>
  <rect x="425" y="229" width="700" height="40" fill="#fee2e2"/><text x="435" y="255" class="b">minority group</text><text x="650" y="255" class="b">64</text><text x="755" y="255" class="b">0.66</text><text x="890" y="255" class="b">[0.54, 0.77]</text><text x="1045" y="255" class="b" fill="#b91c1c">investigate</text>
  <rect x="425" y="274" width="700" height="40" fill="#fff7ed"/><text x="435" y="300" class="b">latest month</text><text x="650" y="300" class="b">90</text><text x="755" y="300" class="b">0.78</text><text x="890" y="300" class="b">[0.68, 0.86]</text><text x="1045" y="300" class="b" fill="#c2410c">drift</text>
  <rect x="425" y="319" width="700" height="40" fill="#f3e8ff"/><text x="435" y="345" class="b">missing-feature stress</text><text x="650" y="345" class="b">1000</text><text x="755" y="345" class="b">0.59</text><text x="890" y="345" class="b">[0.56, 0.62]</text><text x="1045" y="345" class="b" fill="#7c3aed">brittle</text>
  <rect x="100" y="445" width="170" height="82" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="185" y="477" text-anchor="middle" class="h">Detect</text><text x="185" y="502" text-anchor="middle" class="s">patterns, not anecdotes</text><path d="M270 486 H330" class="arr"/>
  <rect x="335" y="445" width="170" height="82" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/><text x="420" y="477" text-anchor="middle" class="h">Inspect</text><text x="420" y="502" text-anchor="middle" class="s">cases and provenance</text><path d="M505 486 H565" class="arr"/>
  <rect x="570" y="445" width="170" height="82" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="655" y="477" text-anchor="middle" class="h">Hypothesize</text><text x="655" y="502" text-anchor="middle" class="s">data, label, model, shift</text><path d="M740 486 H800" class="arr"/>
  <rect x="805" y="445" width="170" height="82" rx="8" fill="#fdf2f8" stroke="#db2777" stroke-width="2"/><text x="890" y="477" text-anchor="middle" class="h">Intervene</text><text x="890" y="502" text-anchor="middle" class="s">make one traceable change</text><path d="M975 486 H1035" class="arr"/>
  <rect x="1040" y="445" width="120" height="82" rx="8" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/><text x="1100" y="477" text-anchor="middle" class="h">Retest</text><text x="1100" y="502" text-anchor="middle" class="s">untouched data</text>
  <text x="600" y="580" text-anchor="middle" class="b">Predeclare high-stakes slices; use discovery slices to generate hypotheses, not definitive claims.</text><text x="600" y="606" text-anchor="middle" class="s">Small slices need intervals or hierarchical pooling, and every slice must correspond to a legitimate use case.</text>
</svg>
