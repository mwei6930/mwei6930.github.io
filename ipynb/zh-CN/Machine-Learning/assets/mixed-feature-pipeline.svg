<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="610" viewBox="0 0 1280 610" role="img" aria-labelledby="title desc">
  <title id="title">Mixed-type preprocessing pipeline</title>
  <desc id="desc">Numeric and categorical columns follow separate preprocessing branches, are concatenated into one feature matrix, and feed an estimator.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 29px Arial, sans-serif; fill: #172033; }
      .section { font: 700 19px Arial, sans-serif; fill: #172033; }
      .label { font: 600 17px Arial, sans-serif; fill: #172033; }
      .small { font: 15px Arial, sans-serif; fill: #475569; }
      .tiny { font: 14px Arial, sans-serif; fill: #475569; }
      .box { stroke-width: 2; rx: 8; }
      .arrow { fill: none; stroke: #334155; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1280" height="610" fill="#ffffff"/>
  <text x="640" y="46" text-anchor="middle" class="title">One Dataset, Separate Transformations, One Estimator</text>

  <rect x="35" y="95" width="245" height="400" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="157" y="132" text-anchor="middle" class="section">Raw table</text>
  <line x1="63" y1="151" x2="252" y2="151" stroke="#cbd5e1" stroke-width="2"/>
  <text x="72" y="184" class="label">age</text>
  <text x="205" y="184" class="small">numeric</text>
  <text x="72" y="225" class="label">income</text>
  <text x="205" y="225" class="small">numeric</text>
  <text x="72" y="266" class="label">tenure</text>
  <text x="205" y="266" class="small">numeric</text>
  <line x1="63" y1="289" x2="252" y2="289" stroke="#cbd5e1" stroke-width="2"/>
  <text x="72" y="326" class="label">city</text>
  <text x="205" y="326" class="small">category</text>
  <text x="72" y="367" class="label">plan</text>
  <text x="205" y="367" class="small">category</text>
  <text x="72" y="408" class="label">device</text>
  <text x="205" y="408" class="small">category</text>
  <text x="157" y="467" text-anchor="middle" class="tiny">metadata stays outside X</text>

  <rect x="365" y="100" width="325" height="155" class="box" fill="#e8f1fb" stroke="#3b6ea8"/>
  <text x="527" y="137" text-anchor="middle" class="section">Numeric branch</text>
  <rect x="395" y="161" width="116" height="58" class="box" fill="#ffffff" stroke="#6b8fb5"/>
  <text x="453" y="187" text-anchor="middle" class="label">Impute</text>
  <text x="453" y="207" text-anchor="middle" class="tiny">median</text>
  <rect x="545" y="161" width="116" height="58" class="box" fill="#ffffff" stroke="#6b8fb5"/>
  <text x="603" y="187" text-anchor="middle" class="label">Scale</text>
  <text x="603" y="207" text-anchor="middle" class="tiny">train statistics</text>
  <path d="M511 190 H537" class="arrow"/>

  <rect x="365" y="335" width="325" height="155" class="box" fill="#fff2cc" stroke="#a97710"/>
  <text x="527" y="372" text-anchor="middle" class="section">Categorical branch</text>
  <rect x="395" y="396" width="116" height="58" class="box" fill="#ffffff" stroke="#b68a34"/>
  <text x="453" y="422" text-anchor="middle" class="label">Impute</text>
  <text x="453" y="442" text-anchor="middle" class="tiny">most frequent</text>
  <rect x="545" y="396" width="116" height="58" class="box" fill="#ffffff" stroke="#b68a34"/>
  <text x="603" y="422" text-anchor="middle" class="label">One-hot</text>
  <text x="603" y="442" text-anchor="middle" class="tiny">handle unknown</text>
  <path d="M511 425 H537" class="arrow"/>

  <path d="M280 205 H357" class="arrow"/>
  <path d="M280 382 H357" class="arrow"/>

  <rect x="775" y="190" width="210" height="210" class="box" fill="#f4faf7" stroke="#27865a"/>
  <text x="880" y="228" text-anchor="middle" class="section">ColumnTransformer</text>
  <rect x="812" y="258" width="136" height="94" class="box" fill="#ffffff" stroke="#82b99a"/>
  <text x="880" y="289" text-anchor="middle" class="label">Concatenate</text>
  <text x="880" y="313" text-anchor="middle" class="small">dense + sparse</text>
  <text x="880" y="336" text-anchor="middle" class="small">feature blocks</text>
  <path d="M690 177 C735 177,735 273,767 273" class="arrow"/>
  <path d="M690 412 C735 412,735 318,767 318" class="arrow"/>

  <rect x="1065" y="226" width="180" height="138" class="box" fill="#f3e8ff" stroke="#76519b"/>
  <text x="1155" y="264" text-anchor="middle" class="section">Estimator</text>
  <text x="1155" y="296" text-anchor="middle" class="small">fit / predict</text>
  <text x="1155" y="323" text-anchor="middle" class="small">same transformations</text>
  <text x="1155" y="346" text-anchor="middle" class="small">same learned state</text>
  <path d="M985 295 H1057" class="arrow"/>

  <rect x="365" y="535" width="880" height="48" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="805" y="566" text-anchor="middle" class="label">During validation: refit the entire pipeline inside each training fold, then transform its held-out fold.</text>
</svg>
