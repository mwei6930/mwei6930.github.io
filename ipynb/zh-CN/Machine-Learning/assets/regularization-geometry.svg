<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Geometry of ridge, lasso, and elastic-net constraints</title>
  <desc id="desc">Elliptical least-squares contours first touch an L2 circle away from axes, an L1 diamond at a sparse vertex, and an elastic-net rounded diamond between those behaviors.</desc>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#334155"/></marker>
    <style>.title{font:700 29px Arial,sans-serif;fill:#0f172a}.head{font:700 20px Arial,sans-serif;fill:#0f172a}.body{font:16px Arial,sans-serif;fill:#1e293b}.small{font:14px Arial,sans-serif;fill:#475569}.axis{stroke:#64748b;stroke-width:1.6}.contour{fill:none;stroke:#f59e0b;stroke-width:2}.guide{stroke:#94a3b8;stroke-width:1.4;stroke-dasharray:5 5}</style>
  </defs>
  <rect width="1200" height="630" fill="#f8fafc"/>
  <text x="600" y="43" text-anchor="middle" class="title">The constraint boundary determines how coefficients shrink</text>

  <rect x="35" y="80" width="350" height="470" rx="8" fill="#fff" stroke="#64748b" stroke-width="2"/>
  <text x="210" y="117" text-anchor="middle" class="head">Ridge: L2 ball</text>
  <line x1="80" y1="330" x2="340" y2="330" class="axis"/><line x1="210" y1="185" x2="210" y2="470" class="axis"/>
  <text x="335" y="351" class="small">beta1</text><text x="218" y="200" class="small">beta2</text>
  <circle cx="210" cy="330" r="105" fill="#dbeafe" fill-opacity="0.72" stroke="#2563eb" stroke-width="3"/>
  <ellipse cx="328" cy="205" rx="75" ry="125" transform="rotate(45 328 205)" class="contour"/>
  <ellipse cx="328" cy="205" rx="112" ry="184" transform="rotate(45 328 205)" class="contour"/>
  <circle cx="278" cy="260" r="8" fill="#dc2626"/>
  <line x1="278" y1="260" x2="317" y2="222" class="guide"/>
  <text x="210" y="505" text-anchor="middle" class="body">smooth boundary</text>
  <text x="210" y="530" text-anchor="middle" class="small">shrinks correlated coefficients together</text>

  <rect x="425" y="80" width="350" height="470" rx="8" fill="#fff" stroke="#64748b" stroke-width="2"/>
  <text x="600" y="117" text-anchor="middle" class="head">Lasso: L1 ball</text>
  <line x1="470" y1="330" x2="730" y2="330" class="axis"/><line x1="600" y1="185" x2="600" y2="470" class="axis"/>
  <text x="725" y="351" class="small">beta1</text><text x="608" y="200" class="small">beta2</text>
  <polygon points="600,215 715,330 600,445 485,330" fill="#dcfce7" fill-opacity="0.78" stroke="#16a34a" stroke-width="3"/>
  <ellipse cx="720" cy="205" rx="75" ry="125" transform="rotate(45 720 205)" class="contour"/>
  <ellipse cx="720" cy="205" rx="112" ry="184" transform="rotate(45 720 205)" class="contour"/>
  <circle cx="600" cy="215" r="8" fill="#dc2626"/>
  <line x1="600" y1="215" x2="652" y2="176" class="guide"/>
  <text x="600" y="505" text-anchor="middle" class="body">corners lie on coordinate axes</text>
  <text x="600" y="530" text-anchor="middle" class="small">a first contact often sets coefficients exactly to zero</text>

  <rect x="815" y="80" width="350" height="470" rx="8" fill="#fff" stroke="#64748b" stroke-width="2"/>
  <text x="990" y="117" text-anchor="middle" class="head">Elastic Net: L1 + L2</text>
  <line x1="860" y1="330" x2="1120" y2="330" class="axis"/><line x1="990" y1="185" x2="990" y2="470" class="axis"/>
  <text x="1115" y="351" class="small">beta1</text><text x="998" y="200" class="small">beta2</text>
  <path d="M990 220 C1025 245 1075 295 1100 330 C1075 365 1025 415 990 440 C955 415 905 365 880 330 C905 295 955 245 990 220 Z" fill="#f3e8ff" fill-opacity="0.82" stroke="#7c3aed" stroke-width="3"/>
  <ellipse cx="1108" cy="205" rx="75" ry="125" transform="rotate(45 1108 205)" class="contour"/>
  <ellipse cx="1108" cy="205" rx="112" ry="184" transform="rotate(45 1108 205)" class="contour"/>
  <circle cx="1049" cy="262" r="8" fill="#dc2626"/>
  <line x1="1049" y1="262" x2="1086" y2="224" class="guide"/>
  <text x="990" y="505" text-anchor="middle" class="body">rounded corners</text>
  <text x="990" y="530" text-anchor="middle" class="small">combines sparsity with grouped shrinkage</text>

  <rect x="175" y="572" width="850" height="42" rx="8" fill="#fff7ed" stroke="#ea580c"/>
  <text x="600" y="599" text-anchor="middle" class="body">Contours represent equal training loss; the red point is the constrained optimum at the first contact.</text>
</svg>
