<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Autoencoder bottleneck architecture</title><desc id="desc">An encoder maps an input through decreasing layer widths to a bottleneck representation, and a decoder reconstructs the input, with variants imposing denoising, sparsity, or probabilistic constraints.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#475569"/></marker><style>.h{font:700 25px Arial,sans-serif;fill:#17212b}.t{font:18px Arial,sans-serif;fill:#334155}.s{font:15px Arial,sans-serif;fill:#526172}.line{stroke:#94a3b8;stroke-width:2}.flow{stroke:#475569;stroke-width:3;marker-end:url(#a)}</style></defs><rect width="1200" height="620" fill="#fff"/><text x="600" y="42" text-anchor="middle" class="h">Autoencoder: learn a nonlinear representation by reconstructing the input</text>
  <text x="105" y="105" text-anchor="middle" class="h">x</text><g fill="#2563eb"><circle cx="105" cy="155" r="10"/><circle cx="105" cy="210" r="10"/><circle cx="105" cy="265" r="10"/><circle cx="105" cy="320" r="10"/><circle cx="105" cy="375" r="10"/><circle cx="105" cy="430" r="10"/></g>
  <g class="line"><line x1="115" y1="155" x2="295" y2="190"/><line x1="115" y1="210" x2="295" y2="250"/><line x1="115" y1="320" x2="295" y2="310"/><line x1="115" y1="430" x2="295" y2="370"/></g><g fill="#60a5fa"><circle cx="305" cy="190" r="11"/><circle cx="305" cy="250" r="11"/><circle cx="305" cy="310" r="11"/><circle cx="305" cy="370" r="11"/></g><text x="305" y="455" text-anchor="middle" class="t">encoder fθ</text>
  <g class="line"><line x1="316" y1="190" x2="485" y2="260"/><line x1="316" y1="250" x2="485" y2="260"/><line x1="316" y1="310" x2="485" y2="330"/><line x1="316" y1="370" x2="485" y2="330"/></g><rect x="455" y="215" width="90" height="165" rx="25" fill="#ffedd5" stroke="#e8590c" stroke-width="3"/><circle cx="500" cy="260" r="12" fill="#e8590c"/><circle cx="500" cy="330" r="12" fill="#e8590c"/><text x="500" y="410" text-anchor="middle" class="h">z</text><text x="500" y="438" text-anchor="middle" class="s">bottleneck</text>
  <g class="line"><line x1="515" y1="260" x2="685" y2="190"/><line x1="515" y1="260" x2="685" y2="250"/><line x1="515" y1="330" x2="685" y2="310"/><line x1="515" y1="330" x2="685" y2="370"/></g><g fill="#4ade80"><circle cx="695" cy="190" r="11"/><circle cx="695" cy="250" r="11"/><circle cx="695" cy="310" r="11"/><circle cx="695" cy="370" r="11"/></g><text x="695" y="455" text-anchor="middle" class="t">decoder gφ</text>
  <g class="line"><line x1="706" y1="190" x2="885" y2="155"/><line x1="706" y1="250" x2="885" y2="210"/><line x1="706" y1="310" x2="885" y2="320"/><line x1="706" y1="370" x2="885" y2="430"/></g><text x="895" y="105" text-anchor="middle" class="h">x̂</text><g fill="#16a34a"><circle cx="895" cy="155" r="10"/><circle cx="895" cy="210" r="10"/><circle cx="895" cy="265" r="10"/><circle cx="895" cy="320" r="10"/><circle cx="895" cy="375" r="10"/><circle cx="895" cy="430" r="10"/></g>
  <rect x="955" y="135" width="205" height="300" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="1058" y="175" text-anchor="middle" class="h">Constraints</text><text x="1058" y="225" text-anchor="middle" class="t">small bottleneck</text><text x="1058" y="270" text-anchor="middle" class="t">denoising input</text><text x="1058" y="315" text-anchor="middle" class="t">sparse activity</text><text x="1058" y="360" text-anchor="middle" class="t">regularized latent</text><text x="1058" y="405" text-anchor="middle" class="s">prevent identity copying</text>
  <line x1="115" y1="500" x2="885" y2="500" class="flow"/><text x="500" y="535" text-anchor="middle" class="t">minimize reconstruction loss L(x, gφ(fθ(x)))</text><text x="600" y="585" text-anchor="middle" class="t">Good reconstruction does not guarantee a useful, identifiable, or semantically meaningful representation.</text></svg>
