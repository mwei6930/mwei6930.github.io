<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="395" viewBox="0 0 1000 395" role="img" aria-labelledby="title desc">
<title id="title">Correlated features can hide one another under permutation</title>
<desc id="desc">Individual marginal permutation can understate importance when another feature is a close substitute.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
  </marker>
</defs>
<style>
text { font-family: Arial, Helvetica, sans-serif; letter-spacing: 0; fill: #1f2937; }
.title { font-size: 25px; font-weight: 700; }
.subtitle { font-size: 14px; fill: #4b5563; }
.head { font-size: 16px; font-weight: 700; }
.body { font-size: 13px; }
.small { font-size: 12px; fill: #4b5563; }
.formula { font-family: "Courier New", monospace; font-size: 13px; }
.box { stroke-width: 1.4; rx: 7; }
.arrow { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#arrow); }
.dash { stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 7 5; fill: none; marker-end: url(#arrow); }
.axis { stroke: #6b7280; stroke-width: 1.3; fill: none; }
</style>
<rect width="1000" height="395" fill="#ffffff"/>
<text x="40" y="42" class="title" text-anchor="start">Correlated features can hide one another under permutation</text>
<text x="40" y="68" class="subtitle" text-anchor="start">Individual marginal permutation can understate importance when another feature is a close substitute.</text>
<rect x="40" y="115" width="255" height="190" class="box" fill="#dbeafe" stroke="#374151"/><text x="167" y="144" class="head" text-anchor="middle">Two correlated signals</text><text x="54" y="171" class="body" text-anchor="start"><tspan x="54" dy="0">X1 and X2 carry the same information</tspan><tspan x="54" dy="19">The model can substitute one for the other</tspan></text><path d="M 295 210 L 385 210" class="arrow"/><text x="340" y="201" class="small" text-anchor="middle">permute X1</text><rect x="385" y="115" width="230" height="190" class="box" fill="#fef3c7" stroke="#374151"/><text x="500" y="144" class="head" text-anchor="middle">Marginal permutation</text><text x="399" y="171" class="body" text-anchor="start"><tspan x="399" dy="0">X2 remains predictive</tspan><tspan x="399" dy="19">Importance of X1 looks small</tspan><tspan x="399" dy="19">Rows may become unrealistic</tspan></text><path d="M 615 210 L 705 210" class="arrow"/><text x="660" y="201" class="small" text-anchor="middle">permute jointly</text><rect x="705" y="115" width="255" height="190" class="box" fill="#dcfce7" stroke="#374151"/><text x="832" y="144" class="head" text-anchor="middle">Grouped importance</text><text x="719" y="171" class="body" text-anchor="start"><tspan x="719" dy="0">Destroy shared information</tspan><tspan x="719" dy="19">Measures the feature set</tspan><tspan x="719" dy="19">Still describes model reliance</tspan></text><text x="500" y="350" class="head" text-anchor="middle">Importance is conditional on the feature representation and perturbation scheme.</text>
</svg>
