<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="title desc">
<title id="title">Abstention trades coverage for conditional risk</title>
<desc id="desc">Sorting examples by a confidence or uncertainty score produces a risk-coverage curve used to choose an escalation threshold.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
  </marker>
</defs>
<style>
text { font-family: Arial, Helvetica, sans-serif; letter-spacing: 0; fill: #1f2937; }
.title { font-size: 25px; font-weight: 700; }
.subtitle { font-size: 14px; fill: #4b5563; }
.head { font-size: 16px; font-weight: 700; }
.body { font-size: 13px; }
.small { font-size: 12px; fill: #4b5563; }
.formula { font-family: "Courier New", monospace; font-size: 13px; }
.box { stroke-width: 1.4; rx: 7; }
.arrow { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#arrow); }
.dash { stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 7 5; fill: none; marker-end: url(#arrow); }
.axis { stroke: #6b7280; stroke-width: 1.3; fill: none; }
</style>
<rect width="1000" height="400" fill="#ffffff"/>
<text x="40" y="42" class="title" text-anchor="start">Abstention trades coverage for conditional risk</text>
<text x="40" y="68" class="subtitle" text-anchor="start">Sorting examples by a confidence or uncertainty score produces a risk-coverage curve used to choose an escalation threshold.</text>
<path d="M 110 325 L 110 105 M 110 325 L 900 325" class="axis"/><text x="505" y="365" class="body" text-anchor="middle">coverage: fraction of cases predicted</text><text x="40" y="215" class="body" text-anchor="middle">risk</text><path d="M 130 135 C 300 145, 470 180, 610 230 S 790 300, 880 315" stroke="#2563eb" stroke-width="4" fill="none"/><circle cx="505" cy="200" r="7" fill="#dc2626"/><path d="M 640 132 L 520 191" class="arrow"/><text x="580" y="152" class="small" text-anchor="middle">choose threshold using validation</text><rect x="650" y="95" width="275" height="105" class="box" fill="#fef3c7" stroke="#374151"/><text x="787" y="124" class="head" text-anchor="middle">Selective prediction</text><text x="664" y="151" class="body" text-anchor="start"><tspan x="664" dy="0">Accept confident cases</tspan><tspan x="664" dy="19">Abstain or escalate the rest</tspan></text><text x="250" y="300" class="small" text-anchor="middle">lower risk, more abstention</text><text x="790" y="300" class="small" text-anchor="middle">higher coverage</text>
</svg>
