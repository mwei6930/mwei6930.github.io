<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
<title id="title">Choose the weakest sequential model that captures the consequence</title>
<desc id="desc">State effects separate reinforcement learning from one-step bandits; feedback visibility separates bandits from online prediction.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
  </marker>
</defs>
<style>
text { font-family: Arial, Helvetica, sans-serif; letter-spacing: 0; fill: #1f2937; }
.title { font-size: 25px; font-weight: 700; }
.subtitle { font-size: 14px; fill: #4b5563; }
.head { font-size: 16px; font-weight: 700; }
.body { font-size: 13px; }
.small { font-size: 12px; fill: #4b5563; }
.formula { font-family: "Courier New", monospace; font-size: 13px; }
.box { stroke: #374151; stroke-width: 1.4; rx: 8; }
.soft { stroke: #9ca3af; stroke-width: 1.2; rx: 8; }
.arrow { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#arrow); }
.dash { stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 7 5; fill: none; marker-end: url(#arrow); }
</style>
<rect width="1000" height="430" fill="#ffffff"/>
<text x="40" y="42" class="title" text-anchor="start">Choose the weakest sequential model that captures the consequence</text>
<text x="40" y="67" class="subtitle" text-anchor="start">State effects separate reinforcement learning from one-step bandits; feedback visibility separates bandits from online prediction.</text>
<rect x="35" y="110" width="210" height="95" class="box" fill="#f3f4f6" stroke="#374151"/><text x="140" y="137" class="head" text-anchor="middle">Does action affect</text><text x="49" y="163" class="body" text-anchor="start"><tspan x="49" dy="0">future state?</tspan></text><path d="M 245 155 L 400 105" class="arrow"/><text x="322" y="122" class="small" text-anchor="middle">yes</text><path d="M 245 170 L 400 260" class="arrow"/><text x="322" y="207" class="small" text-anchor="middle">no</text><rect x="400" y="70" width="220" height="95" class="box" fill="#fee2e2" stroke="#374151"/><text x="510" y="97" class="head" text-anchor="middle">MDP / RL</text><text x="414" y="123" class="body" text-anchor="start"><tspan x="414" dy="0">optimize long-term return</tspan></text><rect x="400" y="230" width="220" height="95" class="box" fill="#f3f4f6" stroke="#374151"/><text x="510" y="257" class="head" text-anchor="middle">Only chosen reward</text><text x="414" y="283" class="body" text-anchor="start"><tspan x="414" dy="0">is observed?</tspan></text><path d="M 620 275 L 755 225" class="arrow"/><text x="687" y="242" class="small" text-anchor="middle">yes</text><path d="M 620 290 L 755 345" class="arrow"/><text x="687" y="309" class="small" text-anchor="middle">no</text><rect x="755" y="185" width="205" height="95" class="box" fill="#fef3c7" stroke="#374151"/><text x="857" y="212" class="head" text-anchor="middle">Bandit</text><text x="769" y="238" class="body" text-anchor="start"><tspan x="769" dy="0">add context if available</tspan></text><rect x="755" y="310" width="205" height="95" class="box" fill="#dbeafe" stroke="#374151"/><text x="857" y="337" class="head" text-anchor="middle">Online learning</text><text x="769" y="363" class="body" text-anchor="start"><tspan x="769" dy="0">full label / loss feedback</tspan></text><text x="505" y="390" class="small" text-anchor="middle">If all data are already fixed, ordinary batch learning may be enough.</text>
</svg>
