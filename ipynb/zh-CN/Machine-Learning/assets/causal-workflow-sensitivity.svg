<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="415" viewBox="0 0 1000 415" role="img" aria-labelledby="title desc">
<title id="title">A credible causal workflow separates specification, identification, and estimation</title>
<desc id="desc">Diagnostics and sensitivity analyses test consequences of assumptions without pretending to prove them.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
  </marker>
</defs>
<style>
text { font-family: Arial, Helvetica, sans-serif; letter-spacing: 0; fill: #1f2937; }
.title { font-size: 25px; font-weight: 700; }
.subtitle { font-size: 14px; fill: #4b5563; }
.head { font-size: 16px; font-weight: 700; }
.body { font-size: 13px; }
.small { font-size: 12px; fill: #4b5563; }
.formula { font-family: "Courier New", monospace; font-size: 13px; }
.box { stroke-width: 1.4; rx: 7; }
.arrow { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#arrow); }
.dash { stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 7 5; fill: none; marker-end: url(#arrow); }
.blocked { stroke: #dc2626; stroke-width: 3; }
</style>
<rect width="1000" height="415" fill="#ffffff"/>
<text x="40" y="42" class="title" text-anchor="start">A credible causal workflow separates specification, identification, and estimation</text>
<text x="40" y="68" class="subtitle" text-anchor="start">Diagnostics and sensitivity analyses test consequences of assumptions without pretending to prove them.</text>
<rect x="35" y="105" width="175" height="225" class="box" fill="#dbeafe" stroke="#374151"/><text x="122" y="133" class="head" text-anchor="middle">1. Specify</text><text x="49" y="159" class="body" text-anchor="start"><tspan x="49" dy="0">Target trial</tspan><tspan x="49" dy="19">Estimand</tspan><tspan x="49" dy="19">Causal graph</tspan></text><path d="M 210 215 L 245 215" class="arrow"/><rect x="245" y="105" width="175" height="225" class="box" fill="#dcfce7" stroke="#374151"/><text x="332" y="133" class="head" text-anchor="middle">2. Identify</text><text x="259" y="159" class="body" text-anchor="start"><tspan x="259" dy="0">Design</tspan><tspan x="259" dy="19">Adjustment set</tspan><tspan x="259" dy="19">Assumptions</tspan></text><path d="M 420 215 L 455 215" class="arrow"/><rect x="455" y="105" width="175" height="225" class="box" fill="#fef3c7" stroke="#374151"/><text x="542" y="133" class="head" text-anchor="middle">3. Estimate</text><text x="469" y="159" class="body" text-anchor="start"><tspan x="469" dy="0">Nuisance models</tspan><tspan x="469" dy="19">Cross-fitting</tspan><tspan x="469" dy="19">Uncertainty</tspan></text><path d="M 630 215 L 665 215" class="arrow"/><rect x="665" y="105" width="140" height="225" class="box" fill="#fee2e2" stroke="#374151"/><text x="735" y="133" class="head" text-anchor="middle">4. Diagnose</text><text x="679" y="159" class="body" text-anchor="start"><tspan x="679" dy="0">Balance</tspan><tspan x="679" dy="19">Overlap</tspan><tspan x="679" dy="19">Calibration</tspan></text><path d="M 805 215 L 840 215" class="arrow"/><rect x="840" y="105" width="125" height="225" class="box" fill="#f3f4f6" stroke="#374151"/><text x="902" y="133" class="head" text-anchor="middle">5. Stress</text><text x="854" y="159" class="body" text-anchor="start"><tspan x="854" dy="0">Placebos</tspan><tspan x="854" dy="19">Sensitivity</tspan><tspan x="854" dy="19">Bounds</tspan></text><text x="500" y="370" class="head" text-anchor="middle">Failure at an earlier stage cannot be repaired by a more sophisticated estimator.</text>
</svg>
