<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc">
<title id="title">Conditioning observes a group; intervention changes the system</title>
<desc id="desc">Natural treatment assignment and forced treatment produce different distributions when treatment is confounded.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
  </marker>
</defs>
<style>
text { font-family: Arial, Helvetica, sans-serif; letter-spacing: 0; fill: #1f2937; }
.title { font-size: 25px; font-weight: 700; }
.subtitle { font-size: 14px; fill: #4b5563; }
.head { font-size: 16px; font-weight: 700; }
.body { font-size: 13px; }
.small { font-size: 12px; fill: #4b5563; }
.formula { font-family: "Courier New", monospace; font-size: 13px; }
.box { stroke-width: 1.4; rx: 7; }
.arrow { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#arrow); }
.dash { stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 7 5; fill: none; marker-end: url(#arrow); }
.blocked { stroke: #dc2626; stroke-width: 3; }
</style>
<rect width="1000" height="390" fill="#ffffff"/>
<text x="40" y="42" class="title" text-anchor="start">Conditioning observes a group; intervention changes the system</text>
<text x="40" y="68" class="subtitle" text-anchor="start">Natural treatment assignment and forced treatment produce different distributions when treatment is confounded.</text>
<rect x="45" y="115" width="370" height="190" class="box" fill="#dbeafe" stroke="#374151"/><text x="230" y="143" class="head" text-anchor="middle">Condition: T = t</text><text x="59" y="169" class="body" text-anchor="start"><tspan x="59" dy="0">Select naturally treated units</tspan><tspan x="59" dy="19">Parents of T remain active</tspan><tspan x="59" dy="19">P(Y | T=t)</tspan></text><rect x="585" y="115" width="370" height="190" class="box" fill="#dcfce7" stroke="#374151"/><text x="770" y="143" class="head" text-anchor="middle">Intervene: do(T = t)</text><text x="599" y="169" class="body" text-anchor="start"><tspan x="599" dy="0">Force treatment for all units</tspan><tspan x="599" dy="19">Cut arrows entering T</tspan><tspan x="599" dy="19">P(Y | do(T=t))</tspan></text><path d="M 415 210 L 585 210" class="dash"/><text x="500" y="202" class="small" text-anchor="middle">not generally equal</text><text x="500" y="345" class="head" text-anchor="middle">Equality requires a design or assumptions that remove confounding.</text>
</svg>
