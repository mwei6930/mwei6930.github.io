<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="425" viewBox="0 0 1000 425" role="img" aria-labelledby="title desc">
<title id="title">Explanation methods answer different questions</title>
<desc id="desc">Global versus local describes scope; intrinsic versus post-hoc describes how the explanation is produced.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
  </marker>
</defs>
<style>
text { font-family: Arial, Helvetica, sans-serif; letter-spacing: 0; fill: #1f2937; }
.title { font-size: 25px; font-weight: 700; }
.subtitle { font-size: 14px; fill: #4b5563; }
.head { font-size: 16px; font-weight: 700; }
.body { font-size: 13px; }
.small { font-size: 12px; fill: #4b5563; }
.formula { font-family: "Courier New", monospace; font-size: 13px; }
.box { stroke-width: 1.4; rx: 7; }
.arrow { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#arrow); }
.dash { stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 7 5; fill: none; marker-end: url(#arrow); }
.axis { stroke: #6b7280; stroke-width: 1.3; fill: none; }
</style>
<rect width="1000" height="425" fill="#ffffff"/>
<text x="40" y="42" class="title" text-anchor="start">Explanation methods answer different questions</text>
<text x="40" y="68" class="subtitle" text-anchor="start">Global versus local describes scope; intrinsic versus post-hoc describes how the explanation is produced.</text>
<rect x="65" y="115" width="390" height="105" class="box" fill="#dbeafe" stroke="#374151"/><text x="260" y="144" class="head" text-anchor="middle">Global</text><text x="79" y="171" class="body" text-anchor="start"><tspan x="79" dy="0">Overall behavior, feature effects, rules</tspan><tspan x="79" dy="19">Useful for validation and governance</tspan></text><rect x="545" y="115" width="390" height="105" class="box" fill="#dcfce7" stroke="#374151"/><text x="740" y="144" class="head" text-anchor="middle">Local</text><text x="559" y="171" class="body" text-anchor="start"><tspan x="559" dy="0">One prediction or nearby region</tspan><tspan x="559" dy="19">Useful for debugging and recourse</tspan></text><rect x="65" y="270" width="390" height="105" class="box" fill="#fef3c7" stroke="#374151"/><text x="260" y="299" class="head" text-anchor="middle">Intrinsic</text><text x="79" y="326" class="body" text-anchor="start"><tspan x="79" dy="0">Model itself is inspectable</tspan><tspan x="79" dy="19">Examples: sparse linear model, shallow tree</tspan></text><rect x="545" y="270" width="390" height="105" class="box" fill="#fee2e2" stroke="#374151"/><text x="740" y="299" class="head" text-anchor="middle">Post-hoc</text><text x="559" y="326" class="body" text-anchor="start"><tspan x="559" dy="0">A second method summarizes a fitted model</tspan><tspan x="559" dy="19">Faithfulness must be tested, not assumed</tspan></text><path d="M 455 167 L 545 167" class="arrow"/><text x="500" y="158" class="small" text-anchor="middle">scope</text><path d="M 455 322 L 545 322" class="arrow"/><text x="500" y="313" class="small" text-anchor="middle">mechanism</text>
</svg>
