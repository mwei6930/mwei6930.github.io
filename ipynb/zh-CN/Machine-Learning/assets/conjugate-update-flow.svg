<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
  <title id="title">Conjugate Bayesian updating with a Beta Bernoulli model</title>
  <desc id="desc">A Beta prior combines with Bernoulli observations summarized by successes and failures to give a Beta posterior and a closed-form posterior predictive probability.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#495057"/></marker>
    <style>.box{fill:#fff;stroke:#495057;stroke-width:2}.prior{fill:#e7f5ff}.data{fill:#fff3bf}.post{fill:#ebfbee}.pred{fill:#ffe8cc}.h{font:700 24px Arial,sans-serif;fill:#212529}.t{font:17px Arial,sans-serif;fill:#343a40}.s{font:15px Arial,sans-serif;fill:#495057}.line{stroke:#495057;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <text x="600" y="38" text-anchor="middle" class="h">Conjugacy Turns Bayes' Rule into Parameter Updates</text>
  <rect x="45" y="110" width="235" height="160" rx="6" class="box prior"/>
  <text x="162" y="150" text-anchor="middle" class="h">Prior</text>
  <text x="72" y="193" class="t">theta ~ Beta(a, b)</text>
  <text x="72" y="232" class="s">a - 1 and b - 1 act</text>
  <text x="72" y="255" class="s">like prior pseudo-counts</text>
  <rect x="335" y="110" width="235" height="160" rx="6" class="box data"/>
  <text x="452" y="150" text-anchor="middle" class="h">Data</text>
  <text x="365" y="193" class="t">s successes</text>
  <text x="365" y="225" class="t">f failures</text>
  <text x="365" y="255" class="s">Sufficient statistics</text>
  <path d="M280 190 H327" class="line"/>
  <rect x="625" y="92" width="265" height="196" rx="6" class="box post"/>
  <text x="757" y="134" text-anchor="middle" class="h">Posterior</text>
  <text x="650" y="180" class="t">theta | D ~</text>
  <text x="650" y="214" class="t">Beta(a + s, b + f)</text>
  <text x="650" y="258" class="s">Same distribution family</text>
  <path d="M570 190 H617" class="line"/>
  <rect x="945" y="110" width="215" height="160" rx="6" class="box pred"/>
  <text x="1052" y="150" text-anchor="middle" class="h">Predict</text>
  <text x="968" y="195" class="t">P(next = 1 | D)</text>
  <text x="982" y="232" class="t">= (a+s)/(a+b+n)</text>
  <path d="M890 190 H937" class="line"/>
  <rect x="160" y="380" width="880" height="120" rx="6" fill="#f8f9fa" stroke="#adb5bd" stroke-width="2"/>
  <text x="600" y="420" text-anchor="middle" class="h">Why conjugacy matters</text>
  <text x="600" y="458" text-anchor="middle" class="t">No numerical integration is required, and observations can be processed sequentially.</text>
  <text x="600" y="486" text-anchor="middle" class="s">Convenience does not guarantee that the chosen prior-likelihood pair is scientifically appropriate.</text>
</svg>
