<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" role="img" aria-labelledby="title desc">
  <title id="title">Numerically stable softmax using a maximum shift</title>
  <desc id="desc">Direct exponentiation of large logits can overflow, while subtracting the maximum preserves probabilities and keeps exponentials bounded.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #172033; }
      .head { font: 700 21px Arial, sans-serif; fill: #172033; }
      .label { font: 600 17px Arial, sans-serif; fill: #172033; }
      .small { font: 15px Arial, sans-serif; fill: #475569; }
      .arrow { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1280" height="600" fill="#ffffff"/>
  <text x="640" y="48" text-anchor="middle" class="title">Equivalent Mathematics, Very Different Numerical Behaviour</text>

  <rect x="45" y="90" width="555" height="420" rx="8" fill="#fff7f5" stroke="#d89b96" stroke-width="2"/>
  <text x="322" y="130" text-anchor="middle" class="head" fill="#a8322d">Direct computation</text>
  <rect x="95" y="175" width="180" height="68" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="185" y="205" text-anchor="middle" class="label">logits</text>
  <text x="185" y="229" text-anchor="middle" class="small">[1000, 1001, 1002]</text>
  <path d="M275 209H350" class="arrow"/>
  <rect x="345" y="175" width="215" height="68" rx="8" fill="#fee2e2" stroke="#b23a35" stroke-width="2"/>
  <text x="452" y="205" text-anchor="middle" class="label">exp(logits)</text>
  <text x="452" y="229" text-anchor="middle" class="small">[overflow, overflow, overflow]</text>
  <path d="M452 253V320" class="arrow"/>
  <rect x="200" y="330" width="245" height="92" rx="8" fill="#fee2e2" stroke="#b23a35" stroke-width="2"/>
  <text x="322" y="365" text-anchor="middle" class="head">undefined ratios</text>
  <text x="322" y="394" text-anchor="middle" class="small">infinity / infinity -> NaN</text>
  <text x="322" y="472" text-anchor="middle" class="small">The formula is correct; the finite representation is not.</text>

  <rect x="680" y="90" width="555" height="420" rx="8" fill="#f4faf7" stroke="#82b99a" stroke-width="2"/>
  <text x="957" y="130" text-anchor="middle" class="head" fill="#176c49">Stable computation</text>
  <rect x="720" y="175" width="160" height="68" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="800" y="205" text-anchor="middle" class="label">subtract max</text>
  <text x="800" y="229" text-anchor="middle" class="small">[-2, -1, 0]</text>
  <path d="M880 209H925" class="arrow"/>
  <rect x="935" y="175" width="255" height="68" rx="8" fill="#dcfce7" stroke="#21835a" stroke-width="2"/>
  <text x="1062" y="205" text-anchor="middle" class="label">bounded exponentials</text>
  <text x="1062" y="229" text-anchor="middle" class="small">[0.135, 0.368, 1.000]</text>
  <path d="M1062 253V320" class="arrow"/>
  <rect x="835" y="330" width="245" height="92" rx="8" fill="#dcfce7" stroke="#21835a" stroke-width="2"/>
  <text x="957" y="365" text-anchor="middle" class="head">valid probabilities</text>
  <text x="957" y="394" text-anchor="middle" class="small">[0.090, 0.245, 0.665]</text>
  <text x="957" y="472" text-anchor="middle" class="small">Adding or subtracting one constant leaves softmax unchanged.</text>

  <rect x="195" y="535" width="890" height="45" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="640" y="564" text-anchor="middle" class="label">stable softmax(z) = exp(z - max(z)) / sum exp(z - max(z))</text>
</svg>
