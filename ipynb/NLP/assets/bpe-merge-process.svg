<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430" role="img" aria-labelledby="title desc">
  <title id="title">BPE merge process</title>
  <desc id="desc">A simplified Byte Pair Encoding process where frequent adjacent symbol pairs are merged into larger subword units.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <style>
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; }
      .title { font: 700 22px Arial, sans-serif; fill: #1e293b; }
      .text { font: 15px Arial, sans-serif; fill: #475569; }
      .token { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.5; }
      .merge { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
      .label { font: 700 16px Arial, sans-serif; fill: #0f172a; }
      .arrow { stroke: #475569; stroke-width: 2.5; marker-end: url(#arrow); fill: none; }
    </style>
  </defs>
  <rect x="25" y="25" width="930" height="380" rx="12" class="panel"/>
  <text x="490" y="65" text-anchor="middle" class="title">Byte Pair Encoding (BPE): frequent pairs become new tokens</text>

  <text x="80" y="130" class="title">Start</text>
  <text x="190" y="130" class="text">Vocabulary begins with characters.</text>
  <g transform="translate(190,155)">
    <rect x="0" y="0" width="34" height="34" rx="6" class="token"/><text x="17" y="23" text-anchor="middle" class="label">l</text>
    <rect x="42" y="0" width="34" height="34" rx="6" class="token"/><text x="59" y="23" text-anchor="middle" class="label">o</text>
    <rect x="84" y="0" width="34" height="34" rx="6" class="token"/><text x="101" y="23" text-anchor="middle" class="label">w</text>
    <rect x="126" y="0" width="34" height="34" rx="6" class="token"/><text x="143" y="23" text-anchor="middle" class="label">_</text>
  </g>
  <path d="M390 172 L465 172" class="arrow"/>
  <text x="410" y="145" class="text">merge frequent pair</text>
  <g transform="translate(485,155)">
    <rect x="0" y="0" width="54" height="34" rx="6" class="merge"/><text x="27" y="23" text-anchor="middle" class="label">lo</text>
    <rect x="64" y="0" width="34" height="34" rx="6" class="token"/><text x="81" y="23" text-anchor="middle" class="label">w</text>
    <rect x="106" y="0" width="34" height="34" rx="6" class="token"/><text x="123" y="23" text-anchor="middle" class="label">_</text>
  </g>

  <text x="80" y="250" class="title">Repeat</text>
  <text x="190" y="250" class="text">Apply learned merge rules until no rule matches.</text>
  <g transform="translate(190,275)">
    <rect x="0" y="0" width="54" height="34" rx="6" class="merge"/><text x="27" y="23" text-anchor="middle" class="label">lo</text>
    <rect x="64" y="0" width="34" height="34" rx="6" class="token"/><text x="81" y="23" text-anchor="middle" class="label">w</text>
    <rect x="106" y="0" width="34" height="34" rx="6" class="token"/><text x="123" y="23" text-anchor="middle" class="label">_</text>
  </g>
  <path d="M360 292 L435 292" class="arrow"/>
  <g transform="translate(455,275)">
    <rect x="0" y="0" width="64" height="34" rx="6" class="merge"/><text x="32" y="23" text-anchor="middle" class="label">low</text>
    <rect x="74" y="0" width="34" height="34" rx="6" class="token"/><text x="91" y="23" text-anchor="middle" class="label">_</text>
  </g>
  <path d="M590 292 L665 292" class="arrow"/>
  <g transform="translate(685,275)">
    <rect x="0" y="0" width="82" height="34" rx="6" class="merge"/><text x="41" y="23" text-anchor="middle" class="label">low_</text>
  </g>

  <text x="190" y="365" class="text">During training, BPE learns merge rules. During tokenisation, those rules are applied to new text.</text>
</svg>
