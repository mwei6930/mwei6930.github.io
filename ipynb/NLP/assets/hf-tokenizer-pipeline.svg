<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="360" viewBox="0 0 1040 360" role="img" aria-labelledby="title desc">
  <title id="title">Hugging Face tokenizer pipeline</title>
  <desc id="desc">A diagram showing a tokenizer pipeline from raw text to normalized text, pre-tokens, token model pieces, special-token post-processing, token IDs, and decoded text.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <style>
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; }
      .box { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.5; }
      .box2 { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
      .box3 { fill: #fef3c7; stroke: #d97706; stroke-width: 1.5; }
      .box4 { fill: #fce7f3; stroke: #db2777; stroke-width: 1.5; }
      .title { font: 700 22px Arial, sans-serif; fill: #1e293b; }
      .label { font: 700 15px Arial, sans-serif; fill: #0f172a; }
      .small { font: 13px Arial, sans-serif; fill: #475569; }
      .arrow { stroke: #475569; stroke-width: 2.3; marker-end: url(#arrow); fill: none; }
    </style>
  </defs>
  <rect x="25" y="25" width="990" height="310" rx="12" class="panel"/>
  <text x="520" y="65" text-anchor="middle" class="title">Hugging Face tokenizer pipeline</text>

  <rect x="55" y="125" width="130" height="70" rx="9" class="box"/>
  <text x="120" y="152" text-anchor="middle" class="label">Raw text</text>
  <text x="120" y="176" text-anchor="middle" class="small">"Héllo NLP!"</text>

  <path d="M190 160 L230 160" class="arrow"/>
  <rect x="240" y="115" width="140" height="90" rx="9" class="box2"/>
  <text x="310" y="145" text-anchor="middle" class="label">Normalization</text>
  <text x="310" y="169" text-anchor="middle" class="small">lowercase</text>
  <text x="310" y="188" text-anchor="middle" class="small">strip accents</text>

  <path d="M385 160 L425 160" class="arrow"/>
  <rect x="435" y="115" width="140" height="90" rx="9" class="box3"/>
  <text x="505" y="145" text-anchor="middle" class="label">Pre-tokenize</text>
  <text x="505" y="169" text-anchor="middle" class="small">words</text>
  <text x="505" y="188" text-anchor="middle" class="small">punctuation</text>

  <path d="M580 160 L620 160" class="arrow"/>
  <rect x="630" y="115" width="140" height="90" rx="9" class="box"/>
  <text x="700" y="145" text-anchor="middle" class="label">Model</text>
  <text x="700" y="169" text-anchor="middle" class="small">BPE / WordPiece</text>
  <text x="700" y="188" text-anchor="middle" class="small">Unigram / WordLevel</text>

  <path d="M775 160 L815 160" class="arrow"/>
  <rect x="825" y="115" width="140" height="90" rx="9" class="box4"/>
  <text x="895" y="145" text-anchor="middle" class="label">Post-process</text>
  <text x="895" y="169" text-anchor="middle" class="small">[CLS], [SEP]</text>
  <text x="895" y="188" text-anchor="middle" class="small">padding / truncation</text>

  <text x="120" y="270" text-anchor="middle" class="small">Input string</text>
  <text x="310" y="270" text-anchor="middle" class="small">Cleaner text</text>
  <text x="505" y="270" text-anchor="middle" class="small">Boundary candidates</text>
  <text x="700" y="270" text-anchor="middle" class="small">Subword tokens + IDs</text>
  <text x="895" y="270" text-anchor="middle" class="small">Model-ready encoding</text>
</svg>
