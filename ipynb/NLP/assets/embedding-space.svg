<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img" aria-labelledby="title desc">
  <title id="title">Word embedding space</title>
  <desc id="desc">A two-dimensional illustration of word embeddings where semantically similar words are close together.</desc>
  <defs>
    <style>
      .axis { stroke: #64748b; stroke-width: 2; }
      .grid { stroke: #e2e8f0; stroke-width: 1; }
      .label { font: 14px Arial, sans-serif; fill: #475569; }
      .word { font: 700 16px Arial, sans-serif; }
      .animal { fill: #2563eb; }
      .vehicle { fill: #dc2626; }
      .medical { fill: #16a34a; }
      .dot-animal { fill: #93c5fd; stroke: #2563eb; stroke-width: 2; }
      .dot-vehicle { fill: #fecaca; stroke: #dc2626; stroke-width: 2; }
      .dot-medical { fill: #bbf7d0; stroke: #16a34a; stroke-width: 2; }
      .note { font: 16px Arial, sans-serif; fill: #334155; }
    </style>
  </defs>
  <rect x="20" y="20" width="860" height="420" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="90" y1="370" x2="820" y2="370" class="axis"/>
  <line x1="90" y1="370" x2="90" y2="70" class="axis"/>
  <text x="805" y="400" class="label">dimension 1</text>
  <text x="35" y="82" class="label">dimension 2</text>
  <line x1="90" y1="295" x2="820" y2="295" class="grid"/>
  <line x1="90" y1="220" x2="820" y2="220" class="grid"/>
  <line x1="90" y1="145" x2="820" y2="145" class="grid"/>
  <line x1="240" y1="70" x2="240" y2="370" class="grid"/>
  <line x1="390" y1="70" x2="390" y2="370" class="grid"/>
  <line x1="540" y1="70" x2="540" y2="370" class="grid"/>
  <line x1="690" y1="70" x2="690" y2="370" class="grid"/>

  <circle cx="210" cy="160" r="10" class="dot-animal"/>
  <text x="226" y="165" class="word animal">cat</text>
  <circle cx="250" cy="190" r="10" class="dot-animal"/>
  <text x="266" y="195" class="word animal">dog</text>
  <circle cx="195" cy="215" r="10" class="dot-animal"/>
  <text x="211" y="220" class="word animal">pet</text>

  <circle cx="625" cy="190" r="10" class="dot-vehicle"/>
  <text x="641" y="195" class="word vehicle">car</text>
  <circle cx="665" cy="230" r="10" class="dot-vehicle"/>
  <text x="681" y="235" class="word vehicle">truck</text>
  <circle cx="600" cy="250" r="10" class="dot-vehicle"/>
  <text x="616" y="255" class="word vehicle">road</text>

  <circle cx="410" cy="115" r="10" class="dot-medical"/>
  <text x="426" y="120" class="word medical">doctor</text>
  <circle cx="445" cy="145" r="10" class="dot-medical"/>
  <text x="461" y="150" class="word medical">nurse</text>
  <circle cx="470" cy="105" r="10" class="dot-medical"/>
  <text x="486" y="110" class="word medical">hospital</text>

  <text x="120" y="415" class="note">Words used in similar contexts move closer together in the embedding space.</text>
</svg>
