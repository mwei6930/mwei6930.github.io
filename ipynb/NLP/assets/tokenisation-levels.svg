<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430" role="img" aria-labelledby="title desc">
  <title id="title">Tokenisation levels</title>
  <desc id="desc">A diagram comparing character, word, and subword tokenisation for the phrase unhappy tokenizer.</desc>
  <defs>
    <style>
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; }
      .title { font: 700 22px Arial, sans-serif; fill: #1e293b; }
      .text { font: 15px Arial, sans-serif; fill: #475569; }
      .token { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.5; }
      .word { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
      .subword { fill: #fef3c7; stroke: #d97706; stroke-width: 1.5; }
      .label { font: 700 16px Arial, sans-serif; fill: #0f172a; }
    </style>
  </defs>
  <rect x="25" y="25" width="930" height="380" rx="12" class="panel"/>
  <text x="490" y="65" text-anchor="middle" class="title">Tokenisation chooses the unit of text</text>
  <text x="490" y="92" text-anchor="middle" class="text">The same string can be split into characters, words, or subwords.</text>

  <text x="80" y="145" class="title">Input</text>
  <rect x="190" y="120" width="250" height="46" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="315" y="150" text-anchor="middle" class="label">unhappy tokenizer</text>

  <text x="80" y="215" class="title">Characters</text>
  <g transform="translate(190,190)">
    <rect x="0" y="0" width="34" height="34" rx="6" class="token"/><text x="17" y="23" text-anchor="middle" class="label">u</text>
    <rect x="42" y="0" width="34" height="34" rx="6" class="token"/><text x="59" y="23" text-anchor="middle" class="label">n</text>
    <rect x="84" y="0" width="34" height="34" rx="6" class="token"/><text x="101" y="23" text-anchor="middle" class="label">h</text>
    <rect x="126" y="0" width="34" height="34" rx="6" class="token"/><text x="143" y="23" text-anchor="middle" class="label">a</text>
    <rect x="168" y="0" width="34" height="34" rx="6" class="token"/><text x="185" y="23" text-anchor="middle" class="label">p</text>
    <rect x="210" y="0" width="34" height="34" rx="6" class="token"/><text x="227" y="23" text-anchor="middle" class="label">p</text>
    <rect x="252" y="0" width="34" height="34" rx="6" class="token"/><text x="269" y="23" text-anchor="middle" class="label">y</text>
    <text x="310" y="23" class="text">...</text>
  </g>

  <text x="80" y="285" class="title">Words</text>
  <g transform="translate(190,260)">
    <rect x="0" y="0" width="104" height="38" rx="7" class="word"/><text x="52" y="25" text-anchor="middle" class="label">unhappy</text>
    <rect x="120" y="0" width="116" height="38" rx="7" class="word"/><text x="178" y="25" text-anchor="middle" class="label">tokenizer</text>
  </g>

  <text x="80" y="355" class="title">Subwords</text>
  <g transform="translate(190,330)">
    <rect x="0" y="0" width="48" height="38" rx="7" class="subword"/><text x="24" y="25" text-anchor="middle" class="label">un</text>
    <rect x="60" y="0" width="70" height="38" rx="7" class="subword"/><text x="95" y="25" text-anchor="middle" class="label">happy</text>
    <rect x="145" y="0" width="70" height="38" rx="7" class="subword"/><text x="180" y="25" text-anchor="middle" class="label">token</text>
    <rect x="230" y="0" width="44" height="38" rx="7" class="subword"/><text x="252" y="25" text-anchor="middle" class="label">izer</text>
  </g>

  <text x="560" y="205" class="text">Character-level: flexible but long sequences.</text>
  <text x="560" y="275" class="text">Word-level: intuitive but suffers from rare/OOV words.</text>
  <text x="560" y="345" class="text">Subword-level: balance between coverage and efficiency.</text>
</svg>
