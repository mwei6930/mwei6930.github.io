    <svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360">
      <rect width="1100" height="360" fill="#fbfcfe"/>
      <style>
        .title{font:700 25px Arial;fill:#17212b} .h{font:700 18px Arial;fill:#17212b}
        .t{font:15px Arial;fill:#263746} .s{font:13px Arial;fill:#51606d}
        .box{fill:#fff;stroke:#436b8e;stroke-width:2;rx:7} .soft{fill:#eef5f7;stroke:#6d889b;stroke-width:1.6;rx:7}
        .warm{fill:#fff3df;stroke:#b27a28;stroke-width:1.8;rx:7} .accent{fill:#e8f4ec;stroke:#43845a;stroke-width:1.8;rx:7}
        .line{stroke:#334b5f;stroke-width:2;fill:none;marker-end:url(#a)} .dash{stroke:#7a8791;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#a)}
      </style>
      <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#334b5f"/></marker></defs>
      <text x="40" y="42" class="title">Regularized autoencoders constrain what the representation preserves</text>

<rect x="55" y="105" width="205" height="150" class="warm"/><text x="98" y="140" class="h">corrupted x-tilde</text><text x="82" y="180" class="t">mask pixels + Gaussian noise</text><text x="82" y="215" class="s">input is intentionally damaged</text>
<rect x="340" y="105" width="190" height="150" class="accent"/><text x="392" y="140" class="h">sparse z</text><text x="375" y="180" class="t">few active coordinates</text><text x="370" y="215" class="s">penalty limits trivial copying</text>
<rect x="610" y="105" width="205" height="150" class="box"/><text x="665" y="140" class="h">clean x</text><text x="645" y="180" class="t">predict uncorrupted target</text><text x="648" y="215" class="s">learn stable local structure</text>
<rect x="875" y="105" width="170" height="150" class="soft"/><text x="913" y="140" class="h">diagnose</text><text x="900" y="180" class="t">noise robustness</text><text x="900" y="212" class="t">activation sparsity</text>
<path d="M260 180 L340 180" class="line"/><path d="M530 180 L610 180" class="line"/><path d="M815 180 L875 180" class="line"/>

    </svg>
