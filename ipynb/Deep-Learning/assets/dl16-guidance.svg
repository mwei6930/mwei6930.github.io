    <svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360">
      <rect width="1100" height="360" fill="#fbfcfe"/>
      <style>
        .title{font:700 25px Arial;fill:#17212b} .h{font:700 18px Arial;fill:#17212b}
        .t{font:15px Arial;fill:#263746} .s{font:13px Arial;fill:#51606d}
        .box{fill:#fff;stroke:#436b8e;stroke-width:2;rx:7} .soft{fill:#eef5f7;stroke:#6d889b;stroke-width:1.6;rx:7}
        .warm{fill:#fff3df;stroke:#b27a28;stroke-width:1.8;rx:7} .accent{fill:#e8f4ec;stroke:#43845a;stroke-width:1.8;rx:7}
        .line{stroke:#334b5f;stroke-width:2;fill:none;marker-end:url(#a)} .dash{stroke:#7a8791;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#a)}
      </style>
      <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#334b5f"/></marker></defs>
      <text x="40" y="42" class="title">Classifier-free guidance extrapolates away from the unconditional prediction</text>
<rect x="45" y="105" width="280" height="175" class="soft"/><text x="95" y="145" class="h">unconditional</text><text x="75" y="185" class="t">epsilon_u = eps(x_t, null)</text><text x="75" y="225" class="s">coverage and shared structure</text><rect x="410" y="105" width="280" height="175" class="accent"/><text x="470" y="145" class="h">conditional</text><text x="440" y="185" class="t">epsilon_c = eps(x_t, c)</text><text x="440" y="225" class="s">condition-specific direction</text><rect x="775" y="105" width="280" height="175" class="warm"/><text x="820" y="145" class="h">guided</text><text x="805" y="185" class="t">epsilon_u + w(epsilon_c-epsilon_u)</text><text x="805" y="225" class="s">higher w: stronger condition, less diversity</text><path d="M325 192 L410 192" class="line"/><path d="M690 192 L775 192" class="line"/>

    </svg>
