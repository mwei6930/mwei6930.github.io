    <svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360">
      <rect width="1100" height="360" fill="#fbfcfe"/>
      <style>
        .title{font:700 25px Arial;fill:#17212b} .h{font:700 18px Arial;fill:#17212b}
        .t{font:15px Arial;fill:#263746} .s{font:13px Arial;fill:#51606d}
        .box{fill:#fff;stroke:#436b8e;stroke-width:2;rx:7} .soft{fill:#eef5f7;stroke:#6d889b;stroke-width:1.6;rx:7}
        .warm{fill:#fff3df;stroke:#b27a28;stroke-width:1.8;rx:7} .accent{fill:#e8f4ec;stroke:#43845a;stroke-width:1.8;rx:7}
        .line{stroke:#334b5f;stroke-width:2;fill:none;marker-end:url(#a)} .dash{stroke:#7a8791;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#a)}
      </style>
      <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#334b5f"/></marker></defs>
      <text x="40" y="42" class="title">Reparameterization moves randomness outside the differentiable path</text>

<rect x="65" y="115" width="180" height="120" class="box"/><text x="120" y="153" class="h">encoder</text><text x="108" y="193" class="t">mu(x), log var(x)</text>
<rect x="330" y="115" width="180" height="120" class="warm"/><text x="393" y="153" class="h">epsilon</text><text x="375" y="193" class="t">N(0, I), no parameters</text>
<rect x="600" y="115" width="220" height="120" class="accent"/><text x="650" y="153" class="h">z = mu + sigma epsilon</text><text x="640" y="193" class="t">differentiable in mu, sigma</text>
<rect x="900" y="115" width="145" height="120" class="box"/><text x="936" y="153" class="h">decoder</text><text x="925" y="193" class="t">loss -> gradients</text>
<path d="M245 175 L600 175" class="line"/><path d="M510 175 L600 175" class="line"/><path d="M820 175 L900 175" class="line"/>

    </svg>
