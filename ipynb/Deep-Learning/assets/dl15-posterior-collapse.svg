    <svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360">
      <rect width="1100" height="360" fill="#fbfcfe"/>
      <style>
        .title{font:700 25px Arial;fill:#17212b} .h{font:700 18px Arial;fill:#17212b}
        .t{font:15px Arial;fill:#263746} .s{font:13px Arial;fill:#51606d}
        .box{fill:#fff;stroke:#436b8e;stroke-width:2;rx:7} .soft{fill:#eef5f7;stroke:#6d889b;stroke-width:1.6;rx:7}
        .warm{fill:#fff3df;stroke:#b27a28;stroke-width:1.8;rx:7} .accent{fill:#e8f4ec;stroke:#43845a;stroke-width:1.8;rx:7}
        .line{stroke:#334b5f;stroke-width:2;fill:none;marker-end:url(#a)} .dash{stroke:#7a8791;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#a)}
      </style>
      <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#334b5f"/></marker></defs>
      <text x="40" y="42" class="title">Posterior collapse: the decoder learns to ignore z</text>

<rect x="55" y="100" width="290" height="185" class="accent"/><text x="110" y="140" class="h">informative posterior</text><text x="85" y="180" class="t">q(z|x) changes with x</text><text x="85" y="218" class="t">KL &gt; 0; active latent units</text><path d="M110 260 C150 210 210 210 280 260" stroke="#43845a" stroke-width="4" fill="none"/>
<rect x="405" y="100" width="290" height="185" class="warm"/><text x="455" y="140" class="h">collapsed posterior</text><text x="440" y="180" class="t">q(z|x) approximately p(z)</text><text x="440" y="218" class="t">KL approximately 0; z ignored</text><path d="M465 260 C505 185 590 185 635 260" stroke="#b27a28" stroke-width="4" fill="none"/>
<rect x="755" y="100" width="290" height="185" class="box"/><text x="815" y="140" class="h">practical diagnostics</text><text x="790" y="180" class="t">per-dimension KL / active units</text><text x="790" y="215" class="t">decoder sensitivity to z</text><text x="790" y="250" class="t">mutual-information proxies</text>

    </svg>
