<svg xmlns="http://www.w3.org/2000/svg" width="980" height="350" viewBox="0 0 980 350" role="img">
<style>
  .bg { fill:#fbfcfe; } .panel { fill:#fff; stroke:#425466; stroke-width:2; rx:9; }
  .blue { fill:#e7f0ff; stroke:#2563eb; stroke-width:2; rx:9; }
  .green { fill:#e8f7ef; stroke:#198754; stroke-width:2; rx:9; }
  .amber { fill:#fff4d6; stroke:#c47f00; stroke-width:2; rx:9; }
  .red { fill:#fdebec; stroke:#c43d4b; stroke-width:2; rx:9; }
  .violet { fill:#f0eafd; stroke:#7357b6; stroke-width:2; rx:9; }
  .text { font:16px Arial,sans-serif; fill:#17202a; } .small { font:13px Arial,sans-serif; fill:#334155; }
  .title { font:bold 20px Arial,sans-serif; fill:#17202a; } .label { font:bold 15px Arial,sans-serif; fill:#17202a; }
  .line { stroke:#425466; stroke-width:2.2; fill:none; marker-end:url(#arrow); }
  .dash { stroke:#64748b; stroke-width:2; stroke-dasharray:7 6; fill:none; marker-end:url(#arrow); }
  .axis { stroke:#334155; stroke-width:1.8; fill:none; } .grid { stroke:#d7dee8; stroke-width:1; }
</style>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#425466"/></marker></defs>
<rect class="bg" width="100%" height="100%"/>
      <text class="title" x="490" y="30" text-anchor="middle">Automatic mixed precision keeps sensitive operations in safer formats</text>
      <rect class="blue" x="45" y="85" width="175" height="90"/><text class="label" x="132" y="118" text-anchor="middle">FP32 weights</text><text class="small" x="132" y="146" text-anchor="middle">optimizer state</text>
      <path class="line" d="M220 130 H305"/><rect class="green" x="305" y="75" width="225" height="110"/><text class="label" x="417" y="109" text-anchor="middle">autocast forward</text><text class="small" x="417" y="138" text-anchor="middle">GEMM: FP16 / BF16</text><text class="small" x="417" y="163" text-anchor="middle">reductions: FP32</text>
      <path class="line" d="M530 130 H615"/><rect class="amber" x="615" y="85" width="180" height="90"/><text class="label" x="705" y="118" text-anchor="middle">Scaled loss</text><text class="small" x="705" y="146" text-anchor="middle">S × L</text>
      <path class="line" d="M705 175 V245 H540"/><rect class="violet" x="330" y="220" width="210" height="90"/><text class="label" x="435" y="253" text-anchor="middle">Backward</text><text class="small" x="435" y="281" text-anchor="middle">scaled gradients</text>
      <path class="line" d="M330 265 H145"/><rect class="red" x="45" y="220" width="190" height="90"/><text class="label" x="140" y="250" text-anchor="middle">Unscale + check</text><text class="small" x="140" y="277" text-anchor="middle">clip, step, update S</text>
      <text class="label" x="805" y="264" text-anchor="middle">overflow?</text><text class="small" x="805" y="289" text-anchor="middle">skip optimizer step</text><path class="dash" d="M235 266 H730"/>
    </svg>