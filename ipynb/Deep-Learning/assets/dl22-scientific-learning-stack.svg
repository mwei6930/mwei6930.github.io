<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#355070"/></marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.13"/></filter>
</defs>
<rect width="100%" height="100%" fill="#fbfcfe"/>
<text x="600" y="45" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#172033">Scientific Deep Learning Must Close the Domain-Validation Loop</text><g filter="url(#shadow)"><rect x="180" y="90" width="840" height="78" rx="8" fill="#e8f4f8" stroke="#355070" stroke-width="2"/></g>
<text x="600.0" y="125" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#172033">Scientific question</text><text x="600.0" y="157" text-anchor="middle" font-family="Arial" font-size="18" fill="#475569">what is measured and why</text><line x1="600" y1="168" x2="600" y2="192" stroke="#355070" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="180" y="195" width="840" height="78" rx="8" fill="#e9f2ff" stroke="#355070" stroke-width="2"/></g>
<text x="600.0" y="230" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#172033">Data + governing knowledge</text><text x="600.0" y="262" text-anchor="middle" font-family="Arial" font-size="18" fill="#475569">observations, simulators, units, symmetries</text><line x1="600" y1="273" x2="600" y2="297" stroke="#355070" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="180" y="300" width="840" height="78" rx="8" fill="#f1ecff" stroke="#355070" stroke-width="2"/></g>
<text x="600.0" y="335" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#172033">Learned component</text><text x="600.0" y="367" text-anchor="middle" font-family="Arial" font-size="18" fill="#475569">surrogate, inverse model, generator, controller</text><line x1="600" y1="378" x2="600" y2="402" stroke="#355070" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="180" y="405" width="840" height="78" rx="8" fill="#fff2df" stroke="#355070" stroke-width="2"/></g>
<text x="600.0" y="440" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#172033">Domain validation</text><text x="600.0" y="472" text-anchor="middle" font-family="Arial" font-size="18" fill="#475569">conservation, uncertainty, extrapolation, experiment</text><path d="M180 444 C80 420 70 155 180 128" fill="none" stroke="#2a9d8f" stroke-width="4" marker-end="url(#arrow)"/><text x="82" y="288" text-anchor="middle" transform="rotate(-90 82 288)" font-family="Arial" font-size="18" fill="#2a9d8f">revise hypothesis and data</text>
</svg>