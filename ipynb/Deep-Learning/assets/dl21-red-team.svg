<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#68758a"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="60" y="58" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#172033">Red teaming is hypothesis-driven evaluation</text>
<text x="60" y="90" font-family="Arial, sans-serif" font-size="17" fill="#526077">Threat actors, capabilities, assets, and failure criteria define the test campaign.</text>
<rect x="60" y="170" width="220" height="190" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="3"/><rect x="60" y="170" width="220" height="10" rx="5" fill="#dc2626"/><text x="78" y="212" font-family="Arial" font-size="20" font-weight="700" fill="#172033">Threat model</text><text x="78" y="245" font-family="Arial" font-size="16" fill="#526077">actor and access</text><text x="78" y="270" font-family="Arial" font-size="16" fill="#526077">targeted asset</text>
<line x1="280" y1="265" x2="380" y2="265" stroke="#68758a" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="380" y="145" width="270" height="240" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="3"/><rect x="380" y="145" width="270" height="10" rx="5" fill="#d97706"/><text x="398" y="187" font-family="Arial" font-size="20" font-weight="700" fill="#172033">Attack library</text><text x="398" y="220" font-family="Arial" font-size="16" fill="#526077">malformed inputs</text><text x="398" y="245" font-family="Arial" font-size="16" fill="#526077">distribution shifts</text><text x="398" y="270" font-family="Arial" font-size="16" fill="#526077">evasion and abuse</text><text x="398" y="295" font-family="Arial" font-size="16" fill="#526077">resource exhaustion</text>
<line x1="650" y1="265" x2="750" y2="265" stroke="#68758a" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="750" y="145" width="270" height="240" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="3"/><rect x="750" y="145" width="270" height="10" rx="5" fill="#16a34a"/><text x="768" y="187" font-family="Arial" font-size="20" font-weight="700" fill="#172033">Oracles</text><text x="768" y="220" font-family="Arial" font-size="16" fill="#526077">reject, abstain, alert</text><text x="768" y="245" font-family="Arial" font-size="16" fill="#526077">quality and safety limits</text><text x="768" y="270" font-family="Arial" font-size="16" fill="#526077">no silent fallback</text>
<line x1="1020" y1="265" x2="1080" y2="265" stroke="#68758a" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="1040" y="170" width="110" height="190" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="3"/><rect x="1040" y="170" width="110" height="10" rx="5" fill="#2563eb"/><text x="1058" y="212" font-family="Arial" font-size="20" font-weight="700" fill="#172033">Fix</text><text x="1058" y="245" font-family="Arial" font-size="16" fill="#526077">triage</text><text x="1058" y="270" font-family="Arial" font-size="16" fill="#526077">retest</text>
<rect x="280" y="465" width="640" height="85" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/><rect x="280" y="465" width="640" height="10" rx="5" fill="#7c3aed"/><text x="298" y="507" font-family="Arial" font-size="20" font-weight="700" fill="#172033">Regression suite</text><text x="298" y="540" font-family="Arial" font-size="16" fill="#526077">every discovered failure becomes a versioned test with an owner and expected behavior</text>
</svg>