<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360" role="img">
<style>
  .bg { fill:#fbfcfe; } .panel { fill:#fff; stroke:#425466; stroke-width:2; rx:9; }
  .blue { fill:#e7f0ff; stroke:#2563eb; stroke-width:2; rx:9; }
  .green { fill:#e8f7ef; stroke:#198754; stroke-width:2; rx:9; }
  .amber { fill:#fff4d6; stroke:#c47f00; stroke-width:2; rx:9; }
  .red { fill:#fdebec; stroke:#c43d4b; stroke-width:2; rx:9; }
  .violet { fill:#f0eafd; stroke:#7357b6; stroke-width:2; rx:9; }
  .text { font:16px Arial,sans-serif; fill:#17202a; } .small { font:13px Arial,sans-serif; fill:#334155; }
  .title { font:bold 20px Arial,sans-serif; fill:#17202a; } .label { font:bold 15px Arial,sans-serif; fill:#17202a; }
  .line { stroke:#425466; stroke-width:2.2; fill:none; marker-end:url(#arrow); }
  .dash { stroke:#64748b; stroke-width:2; stroke-dasharray:7 6; fill:none; marker-end:url(#arrow); }
  .axis { stroke:#334155; stroke-width:1.8; fill:none; } .grid { stroke:#d7dee8; stroke-width:1; }
</style>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#425466"/></marker></defs>
<rect class="bg" width="100%" height="100%"/>
      <text class="title" x="490" y="30" text-anchor="middle">Training memory is a ledger, not just the parameter file</text>
      <rect class="blue" x="55" y="85" width="155" height="190"/><text class="label" x="132" y="116" text-anchor="middle">Parameters</text><text class="small" x="132" y="145" text-anchor="middle">model dtype</text><text class="small" x="132" y="169" text-anchor="middle">master copy?</text>
      <rect class="green" x="210" y="85" width="140" height="190"/><text class="label" x="280" y="116" text-anchor="middle">Gradients</text><text class="small" x="280" y="145" text-anchor="middle">per trainable</text><text class="small" x="280" y="169" text-anchor="middle">parameter</text>
      <rect class="amber" x="350" y="85" width="180" height="190"/><text class="label" x="440" y="116" text-anchor="middle">Optimizer state</text><text class="small" x="440" y="145" text-anchor="middle">Adam m and v</text><text class="small" x="440" y="169" text-anchor="middle">often FP32</text>
      <rect class="violet" x="530" y="85" width="220" height="190"/><text class="label" x="640" y="116" text-anchor="middle">Saved activations</text><text class="small" x="640" y="145" text-anchor="middle">batch × depth</text><text class="small" x="640" y="169" text-anchor="middle">sequence × width</text><text class="small" x="640" y="198" text-anchor="middle">often dynamic</text>
      <rect class="red" x="750" y="85" width="175" height="190"/><text class="label" x="837" y="116" text-anchor="middle">Transient</text><text class="small" x="837" y="145" text-anchor="middle">workspaces</text><text class="small" x="837" y="169" text-anchor="middle">buckets</text><text class="small" x="837" y="193" text-anchor="middle">fragmentation</text>
      <text class="small" x="490" y="322" text-anchor="middle">Peak memory is the maximum overlap of these categories during one step.</text>
    </svg>