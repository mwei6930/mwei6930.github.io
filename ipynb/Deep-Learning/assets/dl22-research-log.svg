<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#355070"/></marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.13"/></filter>
</defs>
<rect width="100%" height="100%" fill="#fbfcfe"/>
<text x="600" y="45" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#172033">A Research Log Connects Decisions to Reconstructable Artifacts</text><g filter="url(#shadow)"><rect x="60" y="115" width="180" height="120" rx="8" fill="#edf6ff" stroke="#355070" stroke-width="2"/></g>
<text x="150.0" y="150" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#172033">Question</text><text x="150.0" y="182" text-anchor="middle" font-family="Arial" font-size="18" fill="#475569">hypothesis</text><g filter="url(#shadow)"><rect x="360" y="115" width="180" height="120" rx="8" fill="#edf6ff" stroke="#355070" stroke-width="2"/></g>
<text x="450.0" y="150" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#172033">Config</text><text x="450.0" y="182" text-anchor="middle" font-family="Arial" font-size="18" fill="#475569">seed + commit</text><g filter="url(#shadow)"><rect x="660" y="115" width="180" height="120" rx="8" fill="#edf6ff" stroke="#355070" stroke-width="2"/></g>
<text x="750.0" y="150" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#172033">Data</text><text x="750.0" y="182" text-anchor="middle" font-family="Arial" font-size="18" fill="#475569">version + split</text><g filter="url(#shadow)"><rect x="960" y="115" width="180" height="120" rx="8" fill="#edf6ff" stroke="#355070" stroke-width="2"/></g>
<text x="1050.0" y="150" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#172033">Run</text><text x="1050.0" y="182" text-anchor="middle" font-family="Arial" font-size="18" fill="#475569">hardware + time</text><g filter="url(#shadow)"><rect x="210" y="390" width="180" height="120" rx="8" fill="#e8f6ee" stroke="#355070" stroke-width="2"/></g>
<text x="300.0" y="425" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#172033">Metrics</text><text x="300.0" y="457" text-anchor="middle" font-family="Arial" font-size="18" fill="#475569">raw predictions</text><g filter="url(#shadow)"><rect x="510" y="390" width="180" height="120" rx="8" fill="#e8f6ee" stroke="#355070" stroke-width="2"/></g>
<text x="600.0" y="425" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#172033">Decision</text><text x="600.0" y="457" text-anchor="middle" font-family="Arial" font-size="18" fill="#475569">continue / stop</text><g filter="url(#shadow)"><rect x="810" y="390" width="180" height="120" rx="8" fill="#e8f6ee" stroke="#355070" stroke-width="2"/></g>
<text x="900.0" y="425" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#172033">Artifact</text><text x="900.0" y="457" text-anchor="middle" font-family="Arial" font-size="18" fill="#475569">table + model</text><line x1="240" y1="175" x2="360" y2="175" stroke="#355070" stroke-width="3" marker-end="url(#arrow)"/><line x1="540" y1="175" x2="660" y2="175" stroke="#355070" stroke-width="3" marker-end="url(#arrow)"/><line x1="840" y1="175" x2="960" y2="175" stroke="#355070" stroke-width="3" marker-end="url(#arrow)"/><line x1="1050" y1="235" x2="900" y2="390" stroke="#355070" stroke-width="3" marker-end="url(#arrow)"/><line x1="810" y1="450" x2="690" y2="450" stroke="#355070" stroke-width="3" marker-end="url(#arrow)"/><line x1="510" y1="450" x2="390" y2="450" stroke="#355070" stroke-width="3" marker-end="url(#arrow)"/><path d="M300 450 C115 535 95 300 150 235" fill="none" stroke="#c77d19" stroke-width="4" marker-end="url(#arrow)"/><text x="150" y="535" font-family="Arial" font-size="18" fill="#c77d19">negative result informs next question</text>
</svg>