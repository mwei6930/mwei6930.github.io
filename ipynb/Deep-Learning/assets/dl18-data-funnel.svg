<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img">
<style>
  .bg { fill:#fbfcfe; } .panel { fill:#fff; stroke:#425466; stroke-width:2; rx:10; }
  .blue { fill:#e7f0ff; stroke:#2563eb; stroke-width:2; rx:10; }
  .green { fill:#e8f7ef; stroke:#198754; stroke-width:2; rx:10; }
  .amber { fill:#fff4d6; stroke:#c47f00; stroke-width:2; rx:10; }
  .red { fill:#fdebec; stroke:#c43d4b; stroke-width:2; rx:10; }
  .violet { fill:#f0eafd; stroke:#7357b6; stroke-width:2; rx:10; }
  .text { font:16px Arial,sans-serif; fill:#17202a; } .small { font:13px Arial,sans-serif; fill:#334155; }
  .title { font:bold 20px Arial,sans-serif; fill:#17202a; } .label { font:bold 15px Arial,sans-serif; fill:#17202a; }
  .line { stroke:#425466; stroke-width:2.2; fill:none; marker-end:url(#arrow); }
  .dash { stroke:#64748b; stroke-width:2; stroke-dasharray:7 6; fill:none; marker-end:url(#arrow); }
  .axis { stroke:#334155; stroke-width:1.8; fill:none; } .grid { stroke:#d7dee8; stroke-width:1; }
</style>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#425466"/></marker></defs>
<rect class="bg" width="100%" height="100%"/>
      <text class="title" x="450" y="30" text-anchor="middle">Instruction and preference data construction</text>
      <polygon points="90,65 810,65 735,125 165,125" fill="#e7f0ff" stroke="#2563eb" stroke-width="2"/><text class="label" x="450" y="101" text-anchor="middle">source prompts and candidate responses</text>
      <polygon points="165,137 735,137 670,197 230,197" fill="#e8f7ef" stroke="#198754" stroke-width="2"/><text class="label" x="450" y="174" text-anchor="middle">license, privacy, safety, and provenance checks</text>
      <polygon points="230,209 670,209 615,269 285,269" fill="#fff4d6" stroke="#c47f00" stroke-width="2"/><text class="label" x="450" y="246" text-anchor="middle">deduplication, rubric, ties, and quality audit</text>
      <polygon points="285,281 615,281 565,336 335,336" fill="#f0eafd" stroke="#7357b6" stroke-width="2"/><text class="label" x="450" y="315" text-anchor="middle">prompt-level train / validation / test split</text>
