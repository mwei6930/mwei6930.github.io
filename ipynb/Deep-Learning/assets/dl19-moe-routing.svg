      <rect class="violet" x="560" y="165" width="170" height="75"/><text class="label" x="645" y="199" text-anchor="middle">Expert 1</text><text class="small" x="645" y="223" text-anchor="middle">device group B</text>
      <rect class="panel" x="560" y="265" width="170" height="75"/><text class="label" x="645" y="299" text-anchor="middle">Expert ...</text><text class="small" x="645" y="323" text-anchor="middle">all-to-all</text>
      <path class="line" d="M730 103 H820"/><path class="line" d="M730 203 H820"/><path class="line" d="M730 303 H820"/>
