<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
  <title id="title">Simplified residual unit</title>
  <desc id="desc">Input x splits into an identity shortcut and residual branch F of x, then the paths are added.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#2c3e50"/></marker>
    <style>.line{stroke:#2c3e50;stroke-width:4;fill:none;marker-end:url(#arrow)}.box{fill:#eaf2f8;stroke:#2874a6;stroke-width:3}.label{font-family:Arial,sans-serif;font-size:30px;fill:#17202a;text-anchor:middle}.small{font-family:Arial,sans-serif;font-size:25px;fill:#2c3e50;text-anchor:middle}</style>
  </defs>
  <text x="80" y="223" class="label">x</text><path d="M110 210 H245" class="line"/><circle cx="265" cy="210" r="8" fill="#2c3e50"/>
  <path d="M273 210 H350" class="line"/><rect x="365" y="155" width="260" height="110" rx="12" class="box"/><text x="495" y="202" class="label">Residual branch</text><text x="495" y="239" class="small">F(x)</text>
  <path d="M625 210 H735" class="line"/><path d="M265 202 V75 H735 V177" class="line"/><text x="505" y="55" class="small">identity shortcut</text>
  <circle cx="755" cy="210" r="31" fill="#fef9e7" stroke="#b7950b" stroke-width="3"/><text x="755" y="221" class="label">+</text><path d="M786 210 H900" class="line"/><text x="940" y="223" class="label">y</text>
  <text x="500" y="355" class="label">y = x + F(x)</text>
</svg>
