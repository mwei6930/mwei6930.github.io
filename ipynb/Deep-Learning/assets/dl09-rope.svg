<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Rotary position embedding</title>
  <desc id="desc">Query and key vector pairs are rotated by position-dependent angles, so their dot product depends on relative position.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#374151"/></marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #111827; letter-spacing: 0; }
      .head { font-size: 25px; font-weight: 700; }
      .label { font-size: 19px; font-weight: 600; }
      .small { font-size: 17px; }
      .axis { stroke: #9ca3af; stroke-width: 2; }
      .vec { stroke-width: 5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="520" fill="#ffffff"/>
  <text x="600" y="40" text-anchor="middle" class="head">RoPE: position as rotation, distance as relative angle</text>

  <g transform="translate(215 270)">
    <line x1="-135" y1="0" x2="135" y2="0" class="axis"/><line x1="0" y1="125" x2="0" y2="-125" class="axis"/>
    <line x1="0" y1="0" x2="105" y2="-38" class="vec" stroke="#2563eb"/>
    <path d="M70 0 A70 70 0 0 0 61 -34" fill="none" stroke="#2563eb" stroke-width="3"/>
    <text x="68" y="-56" class="label">R(mθ)q</text><text x="35" y="29" class="small">mθ</text>
    <text x="0" y="158" text-anchor="middle" class="label">query at position m</text>
  </g>

  <g transform="translate(600 270)">
    <line x1="-135" y1="0" x2="135" y2="0" class="axis"/><line x1="0" y1="125" x2="0" y2="-125" class="axis"/>
    <line x1="0" y1="0" x2="62" y2="-100" class="vec" stroke="#dc2626"/>
    <path d="M70 0 A70 70 0 0 0 37 -59" fill="none" stroke="#dc2626" stroke-width="3"/>
    <text x="73" y="-110" class="label">R(nθ)k</text><text x="21" y="-70" class="small">nθ</text>
    <text x="0" y="158" text-anchor="middle" class="label">key at position n</text>
  </g>

  <path d="M760 270 L900 270" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="925" y="145" width="240" height="245" rx="7" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
  <text x="1045" y="190" text-anchor="middle" class="label">Attention dot product</text>
  <text x="1045" y="240" text-anchor="middle" class="small">(R(mθ)q)ᵀR(nθ)k</text>
  <text x="1045" y="280" text-anchor="middle" class="label">= qᵀR((n-m)θ)k</text>
  <line x1="965" y1="310" x2="1125" y2="310" stroke="#d1d5db" stroke-width="2"/>
  <text x="1045" y="345" text-anchor="middle" class="small">same shift applied to m,n</text>
  <text x="1045" y="373" text-anchor="middle" class="label">same relative score</text>
  <text x="600" y="492" text-anchor="middle" class="small">Each feature pair uses its own frequency θ; the diagram shows one two-dimensional pair.</text>
</svg>
