    <svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360">
      <rect width="1100" height="360" fill="#fbfcfe"/>
      <style>
        .title{font:700 25px Arial;fill:#17212b} .h{font:700 18px Arial;fill:#17212b}
        .t{font:15px Arial;fill:#263746} .s{font:13px Arial;fill:#51606d}
        .box{fill:#fff;stroke:#436b8e;stroke-width:2;rx:7} .soft{fill:#eef5f7;stroke:#6d889b;stroke-width:1.6;rx:7}
        .warm{fill:#fff3df;stroke:#b27a28;stroke-width:1.8;rx:7} .accent{fill:#e8f4ec;stroke:#43845a;stroke-width:1.8;rx:7}
        .line{stroke:#334b5f;stroke-width:2;fill:none;marker-end:url(#a)} .dash{stroke:#7a8791;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#a)}
      </style>
      <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#334b5f"/></marker></defs>
      <text x="40" y="42" class="title">Three ways to represent a data distribution</text>

<rect x="55" y="95" width="290" height="190" class="soft"/><text x="90" y="130" class="h">Latent-variable model</text><text x="90" y="165" class="t">x is explained through hidden z</text><text x="90" y="200" class="t">p(x) = integral p(x|z)p(z) dz</text><text x="90" y="240" class="s">compact structure; posterior inference</text>
<rect x="405" y="95" width="290" height="190" class="accent"/><text x="455" y="130" class="h">Normalizing flow</text><text x="455" y="165" class="t">x &lt;-&gt; z through an invertible map</text><text x="455" y="200" class="t">exact change of variables</text><text x="455" y="240" class="s">exact density; architectural constraints</text>
<rect x="755" y="95" width="290" height="190" class="warm"/><text x="805" y="130" class="h">Energy-based model</text><text x="805" y="165" class="t">low E(x) means preferred</text><text x="805" y="200" class="t">p(x) proportional to exp(-E(x))</text><text x="805" y="240" class="s">flexible score; hard normalization/sampling</text>

    </svg>
