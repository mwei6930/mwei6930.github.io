<svg xmlns="http://www.w3.org/2000/svg" width="940" height="350" viewBox="0 0 940 350" role="img">
<style>
  .bg { fill:#fbfcfe; } .panel { fill:#fff; stroke:#425466; stroke-width:2; rx:10; }
  .blue { fill:#e7f0ff; stroke:#2563eb; stroke-width:2; rx:10; }
  .green { fill:#e8f7ef; stroke:#198754; stroke-width:2; rx:10; }
  .amber { fill:#fff4d6; stroke:#c47f00; stroke-width:2; rx:10; }
  .red { fill:#fdebec; stroke:#c43d4b; stroke-width:2; rx:10; }
  .violet { fill:#f0eafd; stroke:#7357b6; stroke-width:2; rx:10; }
  .text { font:16px Arial,sans-serif; fill:#17202a; } .small { font:13px Arial,sans-serif; fill:#334155; }
  .title { font:bold 20px Arial,sans-serif; fill:#17202a; } .label { font:bold 15px Arial,sans-serif; fill:#17202a; }
  .line { stroke:#425466; stroke-width:2.2; fill:none; marker-end:url(#arrow); }
  .dash { stroke:#64748b; stroke-width:2; stroke-dasharray:7 6; fill:none; marker-end:url(#arrow); }
  .axis { stroke:#334155; stroke-width:1.8; fill:none; } .grid { stroke:#d7dee8; stroke-width:1; }
</style>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#425466"/></marker></defs>
<rect class="bg" width="100%" height="100%"/>
      <text class="title" x="470" y="30" text-anchor="middle">Best-of-N spends inference compute on candidate selection</text>
      <rect class="blue" x="35" y="85" width="165" height="82"/><text class="label" x="117" y="117" text-anchor="middle">One prompt</text><text class="small" x="117" y="144" text-anchor="middle">x</text>
      <path class="line" d="M200 126 H285"/>
      <rect class="panel" x="285" y="55" width="180" height="55"/><text class="small" x="375" y="88" text-anchor="middle">candidate 1</text>
      <rect class="green" x="285" y="120" width="180" height="55"/><text class="small" x="375" y="153" text-anchor="middle">candidate 2</text>
      <rect class="panel" x="285" y="185" width="180" height="55"/><text class="small" x="375" y="218" text-anchor="middle">candidate ... N</text>
      <path class="line" d="M465 82 H570"/><path class="line" d="M465 147 H570"/><path class="line" d="M465 212 H570"/>
      <rect class="amber" x="570" y="100" width="165" height="100"/><text class="label" x="652" y="136" text-anchor="middle">Reward model</text><text class="small" x="652" y="165" text-anchor="middle">score all N</text>
      <path class="line" d="M735 150 H805"/><rect class="violet" x="805" y="105" width="105" height="90"/><text class="label" x="857" y="139" text-anchor="middle">argmax</text><text class="small" x="857" y="168" text-anchor="middle">return</text>
      <text class="small" x="470" y="285" text-anchor="middle">Higher N can improve proxy reward while increasing latency and selection bias.</text>
      <text class="small" x="470" y="316" text-anchor="middle">Sampling diversity and reward-model validity become the bottlenecks.</text>
    </svg>