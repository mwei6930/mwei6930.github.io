<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img">
<style>
  text { font-family: Inter, Segoe UI, Arial, sans-serif; fill: #172033; letter-spacing: 0; }
  .title { font-size: 28px; font-weight: 700; } .label { font-size: 20px; font-weight: 650; } .small { font-size: 16px; }
  .box { fill: #fff; stroke: #40556f; stroke-width: 2; rx: 7; } .blue { fill: #e8f1ff; stroke: #2463a6; stroke-width: 2; rx: 7; }
  .green { fill: #eef5f2; stroke: #31725f; stroke-width: 2; rx: 7; } .warm { fill: #fff3df; stroke: #a76315; stroke-width: 2; rx: 7; }
  .pink { fill: #fdecef; stroke: #aa455b; stroke-width: 2; rx: 7; } .arrow { stroke: #40556f; stroke-width: 3; fill: none; marker-end: url(#arrow); }
  .dash { stroke: #718096; stroke-width: 2; stroke-dasharray: 7 6; fill: none; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#40556f"/></marker></defs>
<rect width="100%" height="100%" fill="#fbfcfe"/>
<text x="600" y="44" text-anchor="middle" class="title">Cross-modal alignment creates one retrieval space</text>
<rect x="50" y="110" width="250" height="390" class="blue"/><text x="175" y="150" text-anchor="middle" class="label">Image tower</text><rect x="95" y="205" width="160" height="90" class="box"/><text x="175" y="258" text-anchor="middle" class="small">digit pixels</text><path d="M175 305 L175 380" class="arrow"/><circle cx="175" cy="425" r="42" fill="#8bb8e8"/><text x="175" y="432" text-anchor="middle" class="label">vᵢ</text>
<rect x="900" y="110" width="250" height="390" class="green"/><text x="1025" y="150" text-anchor="middle" class="label">Text tower</text><rect x="945" y="205" width="160" height="90" class="box"/><text x="1025" y="245" text-anchor="middle" class="small">“digit seven”</text><text x="1025" y="273" text-anchor="middle" class="small">prompt</text><path d="M1025 305 L1025 380" class="arrow"/><circle cx="1025" cy="425" r="42" fill="#8ac4b4"/><text x="1025" y="432" text-anchor="middle" class="label">tⱼ</text>
<rect x="410" y="180" width="380" height="260" class="warm"/><text x="600" y="225" text-anchor="middle" class="label">B × B similarity matrix</text><text x="600" y="275" text-anchor="middle" class="small">Sᵢⱼ = exp(s) · cos(vᵢ, tⱼ)</text><path d="M300 425 L410 360" class="arrow"/><path d="M900 425 L790 360" class="arrow"/><rect x="505" y="315" width="190" height="70" fill="#e7b26f" opacity="0.65"/><text x="600" y="356" text-anchor="middle" class="small">matched diagonal high</text><text x="600" y="520" text-anchor="middle" class="small">At inference, text prompts act as classifiers or retrieval queries.</text></svg>