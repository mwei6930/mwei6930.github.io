<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560">
<rect width="100%" height="100%" fill="#ffffff"/>
<style>
text { font-family: Arial, sans-serif; fill: #202124; }
.title { font-size: 27px; font-weight: 700; }
.label { font-size: 19px; font-weight: 700; }
.body { font-size: 16px; }
.small { font-size: 14px; fill: #4b5563; }
</style>

<text x="550" y="42" text-anchor="middle" class="title">The transfer spectrum controls plasticity</text>
<line x1="120" y1="270" x2="980" y2="270" stroke="#cbd5e1" stroke-width="12" stroke-linecap="round"/>
<circle cx="150" cy="270" r="28" fill="#16a34a"/><circle cx="420" cy="270" r="28" fill="#0ea5e9"/>
<circle cx="690" cy="270" r="28" fill="#8b5cf6"/><circle cx="950" cy="270" r="28" fill="#dc2626"/>
<text x="150" y="205" text-anchor="middle" class="label">Linear probe</text>
<text x="420" y="205" text-anchor="middle" class="label">Partial unfreeze</text>
<text x="690" y="205" text-anchor="middle" class="label">PEFT module</text>
<text x="950" y="205" text-anchor="middle" class="label">Full fine-tune</text>
<text x="150" y="330" text-anchor="middle" class="body">backbone frozen</text>
<text x="420" y="330" text-anchor="middle" class="body">upper layers update</text>
<text x="690" y="330" text-anchor="middle" class="body">small learned delta</text>
<text x="950" y="330" text-anchor="middle" class="body">all weights update</text>
<path d="M155 420 H945" stroke="#334155" stroke-width="3" marker-end="url(#a)"/>
<defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#334155"/></marker></defs>
<text x="155" y="460" class="label">more stability / lower task storage</text>
<text x="945" y="460" text-anchor="end" class="label">more plasticity / higher update cost</text>

</svg>