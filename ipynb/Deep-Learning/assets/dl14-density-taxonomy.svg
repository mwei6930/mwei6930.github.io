<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560">
<rect width="100%" height="100%" fill="#ffffff"/>
<style>text{font-family:Arial,sans-serif;fill:#202124}.title{font-size:27px;font-weight:700}.label{font-size:19px;font-weight:700}.body{font-size:16px}.small{font-size:14px;fill:#4b5563}</style>

<text x="550" y="42" text-anchor="middle" class="title">Generative families differ in likelihood access and sampling path</text>
<rect x="55" y="105" width="990" height="390" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="3"/>
<text x="285" y="150" text-anchor="middle" class="label">Explicit density</text><text x="815" y="150" text-anchor="middle" class="label">Implicit density</text>
<rect x="100" y="195" width="170" height="90" fill="#dbeafe"/><text x="185" y="235" text-anchor="middle" class="body">tractable likelihood</text><text x="185" y="263" text-anchor="middle" class="small">autoregressive, flow</text>
<rect x="310" y="195" width="170" height="90" fill="#dcfce7"/><text x="395" y="235" text-anchor="middle" class="body">approximate bound</text><text x="395" y="263" text-anchor="middle" class="small">latent-variable model</text>
<rect x="620" y="195" width="390" height="90" fill="#fee2e2"/><text x="815" y="235" text-anchor="middle" class="body">sample x = G(z), but p(x) is unavailable</text><text x="815" y="263" text-anchor="middle" class="small">adversarial or simulator-based generator</text>
<text x="290" y="355" text-anchor="middle" class="label">score data with log p(x)</text><text x="815" y="355" text-anchor="middle" class="label">evaluate samples or distributional statistics</text>
<text x="550" y="445" text-anchor="middle" class="body">Likelihood tractability, sample speed, representation quality, and perceptual quality are separate axes.</text>

</svg>