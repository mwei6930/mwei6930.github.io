<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#68758a"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="60" y="58" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#172033">Fairness evaluation starts with a use context</text>
<text x="60" y="90" font-family="Arial, sans-serif" font-size="17" fill="#526077">Groups, outcomes, harms, and interventions must be meaningful for the application.</text>
<rect x="65" y="165" width="235" height="210" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="3"/><rect x="65" y="165" width="235" height="10" rx="5" fill="#2563eb"/><text x="83" y="207" font-family="Arial" font-size="20" font-weight="700" fill="#172033">Context</text><text x="83" y="240" font-family="Arial" font-size="16" fill="#526077">who is affected?</text><text x="83" y="265" font-family="Arial" font-size="16" fill="#526077">what decision?</text><text x="83" y="290" font-family="Arial" font-size="16" fill="#526077">what harm?</text>
<line x1="300" y1="270" x2="400" y2="270" stroke="#68758a" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="400" y="165" width="235" height="210" rx="8" fill="#ffffff" stroke="#0891b2" stroke-width="3"/><rect x="400" y="165" width="235" height="10" rx="5" fill="#0891b2"/><text x="418" y="207" font-family="Arial" font-size="20" font-weight="700" fill="#172033">Groups</text><text x="418" y="240" font-family="Arial" font-size="16" fill="#526077">protected attributes</text><text x="418" y="265" font-family="Arial" font-size="16" fill="#526077">intersectional slices</text><text x="418" y="290" font-family="Arial" font-size="16" fill="#526077">sample support</text>
<line x1="635" y1="270" x2="735" y2="270" stroke="#68758a" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="735" y="165" width="235" height="210" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="3"/><rect x="735" y="165" width="235" height="10" rx="5" fill="#d97706"/><text x="753" y="207" font-family="Arial" font-size="20" font-weight="700" fill="#172033">Metrics</text><text x="753" y="240" font-family="Arial" font-size="16" fill="#526077">error parity</text><text x="753" y="265" font-family="Arial" font-size="16" fill="#526077">calibration</text><text x="753" y="290" font-family="Arial" font-size="16" fill="#526077">allocation outcomes</text>
<line x1="970" y1="270" x2="1040" y2="270" stroke="#68758a" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="1000" y="165" width="150" height="210" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="3"/><rect x="1000" y="165" width="150" height="10" rx="5" fill="#16a34a"/><text x="1018" y="207" font-family="Arial" font-size="20" font-weight="700" fill="#172033">Act</text><text x="1018" y="240" font-family="Arial" font-size="16" fill="#526077">mitigate</text><text x="1018" y="265" font-family="Arial" font-size="16" fill="#526077">monitor</text><text x="1018" y="290" font-family="Arial" font-size="16" fill="#526077">escalate</text>
<rect x="280" y="465" width="640" height="85" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="3"/><rect x="280" y="465" width="640" height="10" rx="5" fill="#dc2626"/><text x="298" y="507" font-family="Arial" font-size="20" font-weight="700" fill="#172033">Dataset limitation</text><text x="298" y="540" font-family="Arial" font-size="16" fill="#526077">an operational slice without sensitive attributes cannot establish demographic fairness</text>
</svg>