<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#68758a"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="60" y="58" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#172033">Speculative decoding</text>
<text x="60" y="90" font-family="Arial, sans-serif" font-size="17" fill="#526077">A cheap draft proposes; the target verifies without changing the target distribution.</text>
<rect x="65" y="170" width="245" height="170" rx="8" fill="#ffffff" stroke="#0891b2" stroke-width="3"/><rect x="65" y="170" width="245" height="10" rx="5" fill="#0891b2"/><text x="83" y="212" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#172033">Draft model q</text><text x="83" y="245" font-family="Arial, sans-serif" font-size="16" fill="#526077">propose y1, y2, y3</text><text x="83" y="270" font-family="Arial, sans-serif" font-size="16" fill="#526077">one inexpensive block</text>
<line x1="310" y1="255" x2="435" y2="255" stroke="#68758a" stroke-width="3" marker-end="url(#arrow)"/><text x="372.5" y="245.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#526077">candidates</text>
<rect x="435" y="145" width="325" height="220" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/><rect x="435" y="145" width="325" height="10" rx="5" fill="#7c3aed"/><text x="453" y="187" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#172033">Target model p</text><text x="453" y="220" font-family="Arial, sans-serif" font-size="16" fill="#526077">score the block in parallel</text><text x="453" y="245" font-family="Arial, sans-serif" font-size="16" fill="#526077">accept with min(1, p/q)</text><text x="453" y="270" font-family="Arial, sans-serif" font-size="16" fill="#526077">correct rejected probability</text>
<line x1="760" y1="255" x2="885" y2="255" stroke="#68758a" stroke-width="3" marker-end="url(#arrow)"/><text x="822.5" y="245.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#526077">exact output</text>
<rect x="885" y="170" width="245" height="170" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="3"/><rect x="885" y="170" width="245" height="10" rx="5" fill="#16a34a"/><text x="903" y="212" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#172033">Committed prefix</text><text x="903" y="245" font-family="Arial, sans-serif" font-size="16" fill="#526077">accept a run</text><text x="903" y="270" font-family="Arial, sans-serif" font-size="16" fill="#526077">resample at rejection</text>
<rect x="300" y="440" width="600" height="105" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="3"/><rect x="300" y="440" width="600" height="10" rx="5" fill="#d97706"/><text x="318" y="482" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#172033">Speed condition</text><text x="318" y="515" font-family="Arial, sans-serif" font-size="16" fill="#526077">draft cost + verification cost < target calls avoided; acceptance must remain high</text>
</svg>