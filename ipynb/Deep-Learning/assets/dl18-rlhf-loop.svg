<svg xmlns="http://www.w3.org/2000/svg" width="980" height="390" viewBox="0 0 980 390" role="img">
<style>
  .bg { fill:#fbfcfe; } .panel { fill:#fff; stroke:#425466; stroke-width:2; rx:10; }
  .blue { fill:#e7f0ff; stroke:#2563eb; stroke-width:2; rx:10; }
  .green { fill:#e8f7ef; stroke:#198754; stroke-width:2; rx:10; }
  .amber { fill:#fff4d6; stroke:#c47f00; stroke-width:2; rx:10; }
  .red { fill:#fdebec; stroke:#c43d4b; stroke-width:2; rx:10; }
  .violet { fill:#f0eafd; stroke:#7357b6; stroke-width:2; rx:10; }
  .text { font:16px Arial,sans-serif; fill:#17202a; } .small { font:13px Arial,sans-serif; fill:#334155; }
  .title { font:bold 20px Arial,sans-serif; fill:#17202a; } .label { font:bold 15px Arial,sans-serif; fill:#17202a; }
  .line { stroke:#425466; stroke-width:2.2; fill:none; marker-end:url(#arrow); }
  .dash { stroke:#64748b; stroke-width:2; stroke-dasharray:7 6; fill:none; marker-end:url(#arrow); }
  .axis { stroke:#334155; stroke-width:1.8; fill:none; } .grid { stroke:#d7dee8; stroke-width:1; }
</style>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#425466"/></marker></defs>
<rect class="bg" width="100%" height="100%"/>
      <text class="title" x="490" y="30" text-anchor="middle">RLHF separates policy learning from preference measurement</text>
      <rect class="blue" x="55" y="95" width="180" height="90"/><text class="label" x="145" y="129" text-anchor="middle">Prompt batch</text><text class="small" x="145" y="157" text-anchor="middle">x ~ D</text>
      <path class="line" d="M235 140 H335"/><rect class="green" x="335" y="95" width="190" height="90"/><text class="label" x="430" y="129" text-anchor="middle">Policy rollout</text><text class="small" x="430" y="157" text-anchor="middle">y ~ pi_theta(.|x)</text>
      <path class="line" d="M525 140 H625"/><rect class="amber" x="625" y="95" width="255" height="90"/><text class="label" x="752" y="129" text-anchor="middle">Reward + constraints</text><text class="small" x="752" y="157" text-anchor="middle">r_phi - beta log(pi/pi_ref)</text>
      <path class="line" d="M752 185 V265 H535"/><rect class="violet" x="335" y="235" width="200" height="90"/><text class="label" x="435" y="270" text-anchor="middle">PPO update</text><text class="small" x="435" y="298" text-anchor="middle">clipped policy step</text>
      <path class="line" d="M335 280 H145 V185"/>
      <rect class="panel" x="650" y="245" width="230" height="80"/><text class="label" x="765" y="276" text-anchor="middle">Reference policy</text><text class="small" x="765" y="302" text-anchor="middle">frozen KL anchor</text>
      <path class="dash" d="M650 285 H535"/>
      <text class="small" x="490" y="366" text-anchor="middle">Human feedback trains the reward model; policy rollouts train the aligned policy.</text>
    </svg>