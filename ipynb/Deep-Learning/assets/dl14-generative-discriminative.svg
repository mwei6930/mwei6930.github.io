<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560">
<rect width="100%" height="100%" fill="#ffffff"/>
<style>text{font-family:Arial,sans-serif;fill:#202124}.title{font-size:27px;font-weight:700}.label{font-size:19px;font-weight:700}.body{font-size:16px}.small{font-size:14px;fill:#4b5563}</style>

<text x="550" y="42" text-anchor="middle" class="title">Discriminative and generative models answer different probability questions</text>
<rect x="60" y="105" width="440" height="350" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><rect x="600" y="105" width="440" height="350" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/>
<text x="280" y="155" text-anchor="middle" class="label">Discriminative p(y | x)</text><text x="820" y="155" text-anchor="middle" class="label">Generative p(x, y)</text>
<rect x="110" y="215" width="110" height="70" fill="#dbeafe"/><text x="165" y="257" text-anchor="middle" class="body">observed x</text><path d="M220 250 H350" stroke="#2563eb" stroke-width="5"/><rect x="350" y="215" width="100" height="70" fill="#dcfce7"/><text x="400" y="257" text-anchor="middle" class="body">label y</text>
<text x="280" y="350" text-anchor="middle" class="body">learn the decision boundary</text>
<circle cx="700" cy="245" r="45" fill="#f3e8ff"/><text x="700" y="250" text-anchor="middle" class="body">sample y</text><path d="M745 245 H860" stroke="#7c3aed" stroke-width="5"/><circle cx="915" cy="245" r="45" fill="#ffedd5"/><text x="915" y="250" text-anchor="middle" class="body">sample x</text>
<text x="820" y="350" text-anchor="middle" class="body">model classes and observations</text><text x="820" y="385" text-anchor="middle" class="body">then obtain p(y | x) by Bayes rule</text>

</svg>