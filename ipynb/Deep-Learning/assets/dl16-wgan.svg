    <svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360">
      <rect width="1100" height="360" fill="#fbfcfe"/>
      <style>
        .title{font:700 25px Arial;fill:#17212b} .h{font:700 18px Arial;fill:#17212b}
        .t{font:15px Arial;fill:#263746} .s{font:13px Arial;fill:#51606d}
        .box{fill:#fff;stroke:#436b8e;stroke-width:2;rx:7} .soft{fill:#eef5f7;stroke:#6d889b;stroke-width:1.6;rx:7}
        .warm{fill:#fff3df;stroke:#b27a28;stroke-width:1.8;rx:7} .accent{fill:#e8f4ec;stroke:#43845a;stroke-width:1.8;rx:7}
        .line{stroke:#334b5f;stroke-width:2;fill:none;marker-end:url(#a)} .dash{stroke:#7a8791;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#a)}
      </style>
      <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#334b5f"/></marker></defs>
      <text x="40" y="42" class="title">WGAN critic supplies a distance-shaped training signal</text>
<rect x="55" y="100" width="280" height="190" class="soft"/><text x="110" y="140" class="h">real distribution</text><text x="88" y="185" class="t">critic score should be high</text><text x="88" y="225" class="s">not a probability classifier</text><rect x="410" y="100" width="280" height="190" class="warm"/><text x="467" y="140" class="h">1-Lipschitz critic</text><text x="445" y="185" class="t">bounded input gradient</text><text x="445" y="225" class="s">gradient penalty on interpolates</text><rect x="765" y="100" width="280" height="190" class="accent"/><text x="815" y="140" class="h">generated distribution</text><text x="800" y="185" class="t">generator raises critic score</text><text x="800" y="225" class="s">continuous signal under disjoint support</text><path d="M335 195 L410 195" class="line"/><path d="M690 195 L765 195" class="line"/>

    </svg>
