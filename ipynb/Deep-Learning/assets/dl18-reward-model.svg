<svg xmlns="http://www.w3.org/2000/svg" width="980" height="340" viewBox="0 0 980 340" role="img">
<style>
  .bg { fill:#fbfcfe; } .panel { fill:#fff; stroke:#425466; stroke-width:2; rx:10; }
  .blue { fill:#e7f0ff; stroke:#2563eb; stroke-width:2; rx:10; }
  .green { fill:#e8f7ef; stroke:#198754; stroke-width:2; rx:10; }
  .amber { fill:#fff4d6; stroke:#c47f00; stroke-width:2; rx:10; }
  .red { fill:#fdebec; stroke:#c43d4b; stroke-width:2; rx:10; }
  .violet { fill:#f0eafd; stroke:#7357b6; stroke-width:2; rx:10; }
  .text { font:16px Arial,sans-serif; fill:#17202a; } .small { font:13px Arial,sans-serif; fill:#334155; }
  .title { font:bold 20px Arial,sans-serif; fill:#17202a; } .label { font:bold 15px Arial,sans-serif; fill:#17202a; }
  .line { stroke:#425466; stroke-width:2.2; fill:none; marker-end:url(#arrow); }
  .dash { stroke:#64748b; stroke-width:2; stroke-dasharray:7 6; fill:none; marker-end:url(#arrow); }
  .axis { stroke:#334155; stroke-width:1.8; fill:none; } .grid { stroke:#d7dee8; stroke-width:1; }
</style>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#425466"/></marker></defs>
<rect class="bg" width="100%" height="100%"/>
      <text class="title" x="490" y="30" text-anchor="middle">Bradley-Terry reward modeling</text>
      <rect class="blue" x="35" y="90" width="190" height="86"/><text class="label" x="130" y="123" text-anchor="middle">(prompt, response)</text><text class="small" x="130" y="150" text-anchor="middle">features h_phi(x,y)</text>
      <path class="line" d="M225 133 H315"/><rect class="violet" x="315" y="90" width="170" height="86"/><text class="label" x="400" y="123" text-anchor="middle">Reward head</text><text class="small" x="400" y="150" text-anchor="middle">r_phi(x,y)</text>
      <path class="line" d="M485 133 H575"/><rect class="amber" x="575" y="68" width="365" height="130"/><text class="label" x="757" y="105" text-anchor="middle">P(y_w &gt; y_l)</text><text class="text" x="757" y="137" text-anchor="middle">= sigmoid(r_w - r_l)</text><text class="small" x="757" y="170" text-anchor="middle">only score differences are identified</text>
      <line class="axis" x1="110" y1="285" x2="870" y2="285"/><line class="axis" x1="490" y1="225" x2="490" y2="320"/>
      <path d="M130 310 C330 310 390 295 490 272 C590 249 650 232 850 232" stroke="#2563eb" stroke-width="4" fill="none"/>
      <text class="small" x="500" y="326" text-anchor="middle">reward margin r_w - r_l</text><text class="small" x="862" y="226" text-anchor="middle">1</text><text class="small" x="470" y="248" text-anchor="middle">0.5</text>
    </svg>