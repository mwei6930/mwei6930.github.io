<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img">
<style>
  text { font-family: Inter, Segoe UI, Arial, sans-serif; fill: #172033; letter-spacing: 0; }
  .title { font-size: 28px; font-weight: 700; }
  .label { font-size: 20px; font-weight: 600; }
  .small { font-size: 16px; }
  .box { fill: #ffffff; stroke: #40556f; stroke-width: 2; rx: 7; }
  .soft { fill: #eef5f2; stroke: #31725f; stroke-width: 2; rx: 7; }
  .warm { fill: #fff3df; stroke: #a76315; stroke-width: 2; rx: 7; }
  .blue { fill: #e8f1ff; stroke: #2463a6; stroke-width: 2; rx: 7; }
  .arrow { stroke: #40556f; stroke-width: 3; fill: none; marker-end: url(#arrow); }
  .thin { stroke: #6b7788; stroke-width: 2; fill: none; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#40556f"/></marker></defs>
<rect width="100%" height="100%" fill="#fbfcfe"/>
<text x="600" y="44" text-anchor="middle" class="title">Prediction level determines the readout</text>
<rect x="55" y="100" width="300" height="430" class="blue"/><text x="205" y="145" text-anchor="middle" class="label">Node-level</text><circle cx="205" cy="310" r="50" fill="#2463a6"/><circle cx="115" cy="225" r="24" fill="#9fc2e8"/><circle cx="298" cy="235" r="24" fill="#9fc2e8"/><circle cx="110" cy="405" r="24" fill="#9fc2e8"/><circle cx="300" cy="410" r="24" fill="#9fc2e8"/><path d="M132 242 L170 276" class="thin"/><path d="M280 251 L241 279" class="thin"/><path d="M128 393 L166 348" class="thin"/><path d="M279 397 L244 347" class="thin"/><text x="205" y="485" text-anchor="middle" class="small">classify each hᵢ</text>
<rect x="450" y="100" width="300" height="430" class="soft"/><text x="600" y="145" text-anchor="middle" class="label">Edge-level</text><circle cx="525" cy="305" r="38" fill="#8ac4b4"/><circle cx="675" cy="305" r="38" fill="#8ac4b4"/><path d="M565 305 L635 305" class="arrow" style="stroke-width:8"/><text x="600" y="390" text-anchor="middle" class="small">score r(hᵤ, hᵥ, eᵤᵥ)</text><text x="600" y="485" text-anchor="middle" class="small">predict links or relations</text>
<rect x="845" y="100" width="300" height="430" class="warm"/><text x="995" y="145" text-anchor="middle" class="label">Graph-level</text><circle cx="930" cy="245" r="25" fill="#e7b26f"/><circle cx="1050" cy="225" r="25" fill="#e7b26f"/><circle cx="920" cy="365" r="25" fill="#e7b26f"/><circle cx="1065" cy="370" r="25" fill="#e7b26f"/><path d="M952 258 L1028 235" class="thin"/><path d="M941 347 L1028 243" class="thin"/><path d="M944 365 L1039 369" class="thin"/><path d="M1053 250 L1062 345" class="thin"/><path d="M995 420 L995 465" class="arrow"/><text x="995" y="500" text-anchor="middle" class="small">invariant pool → one vector</text>
</svg>