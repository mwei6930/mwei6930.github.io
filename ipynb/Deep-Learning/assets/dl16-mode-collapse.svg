    <svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360">
      <rect width="1100" height="360" fill="#fbfcfe"/>
      <style>
        .title{font:700 25px Arial;fill:#17212b} .h{font:700 18px Arial;fill:#17212b}
        .t{font:15px Arial;fill:#263746} .s{font:13px Arial;fill:#51606d}
        .box{fill:#fff;stroke:#436b8e;stroke-width:2;rx:7} .soft{fill:#eef5f7;stroke:#6d889b;stroke-width:1.6;rx:7}
        .warm{fill:#fff3df;stroke:#b27a28;stroke-width:1.8;rx:7} .accent{fill:#e8f4ec;stroke:#43845a;stroke-width:1.8;rx:7}
        .line{stroke:#334b5f;stroke-width:2;fill:none;marker-end:url(#a)} .dash{stroke:#7a8791;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#a)}
      </style>
      <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#334b5f"/></marker></defs>
      <text x="40" y="42" class="title">Mode collapse preserves fidelity for a subset while losing coverage</text>
<rect x="45" y="95" width="310" height="205" class="soft"/><text x="100" y="135" class="h">data modes</text><circle cx="110" cy="205" r="35" fill="#436b8e" opacity=".45"/><circle cx="205" cy="165" r="35" fill="#43845a" opacity=".45"/><circle cx="285" cy="230" r="35" fill="#b27a28" opacity=".45"/><text x="88" y="280" class="s">several valid regions</text><rect x="395" y="95" width="310" height="205" class="warm"/><text x="455" y="135" class="h">collapsed generator</text><circle cx="550" cy="205" r="48" fill="#b27a28" opacity=".6"/><text x="430" y="280" class="s">many z map to one convincing region</text><rect x="745" y="95" width="310" height="205" class="box"/><text x="820" y="135" class="h">diagnose both axes</text><text x="785" y="180" class="t">fidelity: are samples plausible?</text><text x="785" y="215" class="t">coverage: are modes represented?</text><text x="785" y="250" class="t">memorization: are samples copied?</text>

    </svg>
