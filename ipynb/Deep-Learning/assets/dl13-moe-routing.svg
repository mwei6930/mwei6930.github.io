<text x="550" y="42" text-anchor="middle" class="title">Sparse MoE separates total capacity from active computation</text>
<defs><marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 z" fill="#334155"/></marker></defs>
<rect x="70" y="205" width="160" height="90" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="150" y="245" text-anchor="middle" class="label">token states</text><text x="150" y="272" text-anchor="middle" class="body">B x T x D</text>
<rect x="315" y="205" width="160" height="90" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="395" y="245" text-anchor="middle" class="label">router</text><text x="395" y="272" text-anchor="middle" class="body">top-k experts</text>
<rect x="620" y="80" width="190" height="75" rx="8" fill="#dcfce7"/><rect x="620" y="185" width="190" height="75" rx="8" fill="#f3e8ff"/><rect x="620" y="290" width="190" height="75" rx="8" fill="#fee2e2"/><rect x="620" y="395" width="190" height="75" rx="8" fill="#e0f2fe"/>
<text x="715" y="125" text-anchor="middle" class="label">expert 0</text><text x="715" y="230" text-anchor="middle" class="label">expert 1</text><text x="715" y="335" text-anchor="middle" class="label">expert 2</text><text x="715" y="440" text-anchor="middle" class="label">expert 3</text>
<rect x="900" y="205" width="150" height="90" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="975" y="245" text-anchor="middle" class="label">combine</text><text x="975" y="272" text-anchor="middle" class="body">weighted output</text>
<path d="M230 250 H315 M475 250 C545 250 545 118 620 118 M475 250 H620 M475 250 C545 250 545 327 620 327 M810 118 C875 118 860 250 900 250 M810 222 H900 M810 327 C875 327 860 250 900 250" fill="none" stroke="#334155" stroke-width="4" marker-end="url(#a)"/>
<text x="470" y="505" class="small">Unused experts add parameter capacity but not token-level FLOPs; communication and imbalance remain real costs.</text>

