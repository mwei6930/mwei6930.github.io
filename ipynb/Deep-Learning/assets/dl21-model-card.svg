<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#68758a"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="60" y="58" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#172033">A model card is a release interface</text>
<text x="60" y="90" font-family="Arial, sans-serif" font-size="17" fill="#526077">It records evidence and limitations for a specific model version and use context.</text>
<rect x="65" y="150" width="310" height="300" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="3"/><rect x="65" y="150" width="310" height="10" rx="5" fill="#2563eb"/><text x="83" y="192" font-family="Arial" font-size="20" font-weight="700" fill="#172033">Scope</text><text x="83" y="225" font-family="Arial" font-size="16" fill="#526077">model and owner</text><text x="83" y="250" font-family="Arial" font-size="16" fill="#526077">intended users</text><text x="83" y="275" font-family="Arial" font-size="16" fill="#526077">intended and out-of-scope uses</text><text x="83" y="300" font-family="Arial" font-size="16" fill="#526077">decision context</text>
<rect x="445" y="150" width="310" height="300" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="3"/><rect x="445" y="150" width="310" height="10" rx="5" fill="#16a34a"/><text x="463" y="192" font-family="Arial" font-size="20" font-weight="700" fill="#172033">Evidence</text><text x="463" y="225" font-family="Arial" font-size="16" fill="#526077">data and split</text><text x="463" y="250" font-family="Arial" font-size="16" fill="#526077">task and slice metrics</text><text x="463" y="275" font-family="Arial" font-size="16" fill="#526077">robustness/privacy tests</text><text x="463" y="300" font-family="Arial" font-size="16" fill="#526077">runtime configuration</text>
<rect x="825" y="150" width="310" height="300" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="3"/><rect x="825" y="150" width="310" height="10" rx="5" fill="#d97706"/><text x="843" y="192" font-family="Arial" font-size="20" font-weight="700" fill="#172033">Controls</text><text x="843" y="225" font-family="Arial" font-size="16" fill="#526077">limitations</text><text x="843" y="250" font-family="Arial" font-size="16" fill="#526077">human oversight</text><text x="843" y="275" font-family="Arial" font-size="16" fill="#526077">monitoring and rollback</text><text x="843" y="300" font-family="Arial" font-size="16" fill="#526077">change history</text>
<rect x="300" y="500" width="600" height="70" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="3"/><rect x="300" y="500" width="600" height="10" rx="5" fill="#dc2626"/><text x="318" y="542" font-family="Arial" font-size="20" font-weight="700" fill="#172033">Release decision</text><text x="318" y="575" font-family="Arial" font-size="16" fill="#526077">approved, restricted, or blocked - with named owners for unresolved risks</text>
</svg>