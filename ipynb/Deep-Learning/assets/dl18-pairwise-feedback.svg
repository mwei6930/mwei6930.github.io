<svg xmlns="http://www.w3.org/2000/svg" width="940" height="330" viewBox="0 0 940 330" role="img">
<style>
  .bg { fill:#fbfcfe; } .panel { fill:#fff; stroke:#425466; stroke-width:2; rx:10; }
  .blue { fill:#e7f0ff; stroke:#2563eb; stroke-width:2; rx:10; }
  .green { fill:#e8f7ef; stroke:#198754; stroke-width:2; rx:10; }
  .amber { fill:#fff4d6; stroke:#c47f00; stroke-width:2; rx:10; }
  .red { fill:#fdebec; stroke:#c43d4b; stroke-width:2; rx:10; }
  .violet { fill:#f0eafd; stroke:#7357b6; stroke-width:2; rx:10; }
  .text { font:16px Arial,sans-serif; fill:#17202a; } .small { font:13px Arial,sans-serif; fill:#334155; }
  .title { font:bold 20px Arial,sans-serif; fill:#17202a; } .label { font:bold 15px Arial,sans-serif; fill:#17202a; }
  .line { stroke:#425466; stroke-width:2.2; fill:none; marker-end:url(#arrow); }
  .dash { stroke:#64748b; stroke-width:2; stroke-dasharray:7 6; fill:none; marker-end:url(#arrow); }
  .axis { stroke:#334155; stroke-width:1.8; fill:none; } .grid { stroke:#d7dee8; stroke-width:1; }
</style>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#425466"/></marker></defs>
<rect class="bg" width="100%" height="100%"/>
      <text class="title" x="470" y="30" text-anchor="middle">Pairwise feedback converts a rubric into a relative label</text>
      <rect class="blue" x="30" y="85" width="200" height="120"/><text class="label" x="130" y="118" text-anchor="middle">Prompt x</text><text class="small" x="130" y="151" text-anchor="middle">same context</text><text class="small" x="130" y="178" text-anchor="middle">for both candidates</text>
      <path class="line" d="M230 125 H315"/><path class="line" d="M230 170 H315"/>
      <rect class="green" x="315" y="62" width="215" height="90"/><text class="label" x="422" y="99" text-anchor="middle">Response y_w</text><text class="small" x="422" y="126" text-anchor="middle">preferred</text>
      <rect class="red" x="315" y="174" width="215" height="90"/><text class="label" x="422" y="211" text-anchor="middle">Response y_l</text><text class="small" x="422" y="238" text-anchor="middle">rejected</text>
      <path class="line" d="M530 107 H625"/><path class="line" d="M530 219 H625"/>
      <rect class="amber" x="625" y="100" width="275" height="125"/><text class="label" x="762" y="134" text-anchor="middle">Rubric + comparison</text><text class="small" x="762" y="165" text-anchor="middle">helpfulness, correctness,</text><text class="small" x="762" y="189" text-anchor="middle">coherence, uncertainty</text><text class="small" x="762" y="213" text-anchor="middle">order is randomized</text>
      <text class="small" x="470" y="303" text-anchor="middle">Pair labels reveal order, not an absolute universal utility scale.</text>
    </svg>