    <svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360">
      <rect width="1100" height="360" fill="#fbfcfe"/>
      <style>
        .title{font:700 25px Arial;fill:#17212b} .h{font:700 18px Arial;fill:#17212b}
        .t{font:15px Arial;fill:#263746} .s{font:13px Arial;fill:#51606d}
        .box{fill:#fff;stroke:#436b8e;stroke-width:2;rx:7} .soft{fill:#eef5f7;stroke:#6d889b;stroke-width:1.6;rx:7}
        .warm{fill:#fff3df;stroke:#b27a28;stroke-width:1.8;rx:7} .accent{fill:#e8f4ec;stroke:#43845a;stroke-width:1.8;rx:7}
        .line{stroke:#334b5f;stroke-width:2;fill:none;marker-end:url(#a)} .dash{stroke:#7a8791;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#a)}
      </style>
      <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#334b5f"/></marker></defs>
      <text x="40" y="42" class="title">One denoiser supports equivalent prediction parameterizations</text>
<rect x="50" y="105" width="220" height="180" class="soft"/><text x="105" y="145" class="h">inputs</text><text x="85" y="185" class="t">noisy x_t, timestep t</text><text x="85" y="220" class="t">optional condition c</text><rect x="365" y="105" width="250" height="180" class="accent"/><text x="430" y="145" class="h">denoiser</text><text x="397" y="185" class="t">shared neural backbone</text><text x="398" y="220" class="s">learn conditional expectation</text><rect x="710" y="80" width="335" height="230" class="warm"/><text x="790" y="120" class="h">prediction target</text><text x="750" y="160" class="t">epsilon: injected noise</text><text x="750" y="195" class="t">x_0: clean sample</text><text x="750" y="230" class="t">v: balanced velocity target</text><text x="750" y="270" class="s">algebraically convertible when schedule is known</text><path d="M270 195 L365 195" class="line"/><path d="M615 195 L710 195" class="line"/>

    </svg>
