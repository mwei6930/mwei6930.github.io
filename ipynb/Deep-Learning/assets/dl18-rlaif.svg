<svg xmlns="http://www.w3.org/2000/svg" width="960" height="370" viewBox="0 0 960 370" role="img">
<style>
  .bg { fill:#fbfcfe; } .panel { fill:#fff; stroke:#425466; stroke-width:2; rx:10; }
  .blue { fill:#e7f0ff; stroke:#2563eb; stroke-width:2; rx:10; }
  .green { fill:#e8f7ef; stroke:#198754; stroke-width:2; rx:10; }
  .amber { fill:#fff4d6; stroke:#c47f00; stroke-width:2; rx:10; }
  .red { fill:#fdebec; stroke:#c43d4b; stroke-width:2; rx:10; }
  .violet { fill:#f0eafd; stroke:#7357b6; stroke-width:2; rx:10; }
  .text { font:16px Arial,sans-serif; fill:#17202a; } .small { font:13px Arial,sans-serif; fill:#334155; }
  .title { font:bold 20px Arial,sans-serif; fill:#17202a; } .label { font:bold 15px Arial,sans-serif; fill:#17202a; }
  .line { stroke:#425466; stroke-width:2.2; fill:none; marker-end:url(#arrow); }
  .dash { stroke:#64748b; stroke-width:2; stroke-dasharray:7 6; fill:none; marker-end:url(#arrow); }
  .axis { stroke:#334155; stroke-width:1.8; fill:none; } .grid { stroke:#d7dee8; stroke-width:1; }
</style>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#425466"/></marker></defs>
<rect class="bg" width="100%" height="100%"/>
      <text class="title" x="480" y="30" text-anchor="middle">Constitutional AI and scalable AI feedback</text>
      <rect class="blue" x="45" y="85" width="180" height="90"/><text class="label" x="135" y="119" text-anchor="middle">Draft response</text><text class="small" x="135" y="146" text-anchor="middle">from current policy</text>
      <path class="line" d="M225 130 H315"/><rect class="amber" x="315" y="72" width="235" height="116"/><text class="label" x="432" y="105" text-anchor="middle">Constitution / rubric</text><text class="small" x="432" y="135" text-anchor="middle">critique violations</text><text class="small" x="432" y="160" text-anchor="middle">state uncertainty</text>
      <path class="line" d="M550 130 H640"/><rect class="green" x="640" y="85" width="270" height="90"/><text class="label" x="775" y="119" text-anchor="middle">Revision or preference</text><text class="small" x="775" y="146" text-anchor="middle">training signal</text>
      <path class="line" d="M775 175 V255 H555"/><rect class="violet" x="315" y="225" width="240" height="95"/><text class="label" x="435" y="261" text-anchor="middle">Policy / judge update</text><text class="small" x="435" y="289" text-anchor="middle">with human audits</text>
      <path class="dash" d="M315 272 H135 V175"/>
      <text class="small" x="480" y="350" text-anchor="middle">AI feedback scales a rubric; it does not make the rubric complete or unbiased.</text>
    </svg>