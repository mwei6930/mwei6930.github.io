<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">FlashAttention tiling and online softmax</title>
  <desc id="desc">Query, key, and value blocks move from high-bandwidth memory into on-chip memory, where score tiles and online softmax statistics update output blocks without materializing the full attention matrix.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#374151"/></marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #111827; letter-spacing: 0; }
      .head { font-size: 25px; font-weight: 700; }
      .label { font-size: 19px; font-weight: 600; }
      .small { font-size: 17px; }
      .box { stroke: #374151; stroke-width: 2; rx: 6; }
      .arrow { stroke: #374151; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="520" fill="#ffffff"/>
  <text x="600" y="40" text-anchor="middle" class="head">FlashAttention principle: exact attention without a full score matrix in HBM</text>
  <rect x="45" y="105" width="275" height="315" class="box" fill="#eef2ff"/>
  <text x="182" y="145" text-anchor="middle" class="label">GPU HBM</text>
  <rect x="85" y="180" width="195" height="52" class="box" fill="#dbeafe"/><text x="182" y="213" text-anchor="middle" class="small">Q blocks</text>
  <rect x="85" y="250" width="195" height="52" class="box" fill="#dcfce7"/><text x="182" y="283" text-anchor="middle" class="small">K and V blocks</text>
  <rect x="85" y="320" width="195" height="52" class="box" fill="#fef3c7"/><text x="182" y="353" text-anchor="middle" class="small">output blocks O</text>

  <path d="M330 250 L455 250" class="arrow"/>
  <path d="M455 335 L330 350" class="arrow"/>
  <rect x="475" y="90" width="390" height="350" class="box" fill="#f9fafb"/>
  <text x="670" y="130" text-anchor="middle" class="label">on-chip SRAM tile</text>
  <rect x="520" y="165" width="300" height="62" class="box" fill="#fee2e2"/>
  <text x="670" y="192" text-anchor="middle" class="small">score tile Sᵢⱼ = QᵢKⱼᵀ / √d</text>
  <text x="670" y="215" text-anchor="middle" class="small">apply causal / padding mask</text>
  <path d="M670 235 L670 275" class="arrow"/>
  <rect x="520" y="290" width="300" height="95" class="box" fill="#e9d5ff"/>
  <text x="670" y="321" text-anchor="middle" class="label">online softmax update</text>
  <text x="670" y="350" text-anchor="middle" class="small">running max m, normalizer ℓ, numerator O</text>
  <text x="670" y="375" text-anchor="middle" class="small">rescale when a new tile maximum appears</text>

  <path d="M875 255 L975 255" class="arrow"/>
  <rect x="995" y="145" width="165" height="220" class="box" fill="#ecfeff"/>
  <text x="1077" y="188" text-anchor="middle" class="label">result</text>
  <text x="1077" y="230" text-anchor="middle" class="small">exact softmax(QKᵀ)V</text>
  <text x="1077" y="272" text-anchor="middle" class="small">same mathematical output</text>
  <text x="1077" y="314" text-anchor="middle" class="small">fewer HBM reads/writes</text>
  <text x="600" y="485" text-anchor="middle" class="small">Tiling changes the memory schedule, not the attention definition; optimized kernels also recompute selected intermediates during backward.</text>
</svg>
