<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560">
<rect width="100%" height="100%" fill="#ffffff"/>
<style>
text { font-family: Arial, sans-serif; fill: #202124; }
.title { font-size: 27px; font-weight: 700; }
.label { font-size: 19px; font-weight: 700; }
.body { font-size: 16px; }
.small { font-size: 14px; fill: #4b5563; }
</style>

<text x="550" y="42" text-anchor="middle" class="title">LoRA and QLoRA share the same learned low-rank path</text>
<rect x="70" y="105" width="420" height="365" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
<rect x="610" y="105" width="420" height="365" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
<text x="280" y="148" text-anchor="middle" class="label">LoRA</text><text x="820" y="148" text-anchor="middle" class="label">QLoRA</text>
<rect x="125" y="205" width="130" height="65" fill="#dbeafe" stroke="#2563eb"/><text x="190" y="243" text-anchor="middle" class="body">frozen BF16 W</text>
<rect x="300" y="195" width="55" height="85" fill="#fef3c7" stroke="#d97706"/><rect x="390" y="195" width="55" height="85" fill="#fef3c7" stroke="#d97706"/><text x="327" y="242" text-anchor="middle" class="body">A</text><text x="417" y="242" text-anchor="middle" class="body">B</text>
<text x="280" y="335" text-anchor="middle" class="label">Wx + (alpha/r)BAx</text><text x="280" y="395" text-anchor="middle" class="small">only A and B receive gradients</text>
<rect x="660" y="195" width="130" height="85" fill="#fed7aa" stroke="#ea580c"/><text x="725" y="228" text-anchor="middle" class="body">frozen 4-bit W</text><text x="725" y="255" text-anchor="middle" class="small">dequantize to compute</text>
<rect x="840" y="195" width="55" height="85" fill="#fef3c7" stroke="#d97706"/><rect x="930" y="195" width="55" height="85" fill="#fef3c7" stroke="#d97706"/><text x="867" y="242" text-anchor="middle" class="body">A</text><text x="957" y="242" text-anchor="middle" class="body">B</text>
<text x="820" y="335" text-anchor="middle" class="label">dequant(W)x + (alpha/r)BAx</text><text x="820" y="395" text-anchor="middle" class="small">NF4 + double quantization + paged optimizer in full QLoRA</text>

</svg>