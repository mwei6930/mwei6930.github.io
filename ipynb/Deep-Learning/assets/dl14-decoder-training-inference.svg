<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560">
<rect width="100%" height="100%" fill="#ffffff"/>
<style>text{font-family:Arial,sans-serif;fill:#202124}.title{font-size:27px;font-weight:700}.label{font-size:19px;font-weight:700}.body{font-size:16px}.small{font-size:14px;fill:#4b5563}</style>

<text x="550" y="42" text-anchor="middle" class="title">Decoder training is parallel; autoregressive inference is sequential</text>
<rect x="45" y="105" width="480" height="350" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><rect x="575" y="105" width="480" height="350" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
<text x="285" y="150" text-anchor="middle" class="label">Teacher-forced training</text><text x="815" y="150" text-anchor="middle" class="label">Incremental inference</text>
<g fill="#dbeafe"><rect x="95" y="205" width="70" height="70"/><rect x="185" y="205" width="70" height="70"/><rect x="275" y="205" width="70" height="70"/><rect x="365" y="205" width="70" height="70"/></g><text x="265" y="320" text-anchor="middle" class="body">one masked forward pass</text><text x="265" y="355" text-anchor="middle" class="body">predicts every next token</text>
<g fill="#ffedd5"><rect x="625" y="205" width="70" height="70"/><rect x="715" y="205" width="70" height="70"/><rect x="805" y="205" width="70" height="70"/><rect x="895" y="205" width="70" height="70"/></g><path d="M695 240 H715 M785 240 H805 M875 240 H895" stroke="#ea580c" stroke-width="4"/><text x="815" y="320" text-anchor="middle" class="body">sample, append, repeat</text><text x="815" y="355" text-anchor="middle" class="body">KV cache reuses earlier states</text>

</svg>