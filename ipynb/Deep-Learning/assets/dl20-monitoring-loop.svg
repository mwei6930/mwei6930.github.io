<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#68758a"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="60" y="58" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#172033">Monitoring closes the deployment loop</text>
<text x="60" y="90" font-family="Arial, sans-serif" font-size="17" fill="#526077">Operational signals identify change; labels and audits determine whether behavior is still acceptable.</text>
<rect x="70" y="205" width="220" height="125" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="3"/><rect x="70" y="205" width="220" height="10" rx="5" fill="#2563eb"/><text x="88" y="247" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#172033">Traffic</text><text x="88" y="280" font-family="Arial, sans-serif" font-size="16" fill="#526077">inputs and contexts</text>
<rect x="330" y="125" width="220" height="125" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/><rect x="330" y="125" width="220" height="10" rx="5" fill="#7c3aed"/><text x="348" y="167" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#172033">Model</text><text x="348" y="200" font-family="Arial, sans-serif" font-size="16" fill="#526077">prediction + confidence</text>
<rect x="650" y="125" width="220" height="125" rx="8" fill="#ffffff" stroke="#0891b2" stroke-width="3"/><rect x="650" y="125" width="220" height="10" rx="5" fill="#0891b2"/><text x="668" y="167" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#172033">Telemetry</text><text x="668" y="200" font-family="Arial, sans-serif" font-size="16" fill="#526077">latency, errors, cost</text>
<rect x="650" y="360" width="220" height="125" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="3"/><rect x="650" y="360" width="220" height="10" rx="5" fill="#d97706"/><text x="668" y="402" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#172033">Quality</text><text x="668" y="435" font-family="Arial, sans-serif" font-size="16" fill="#526077">delayed labels and slices</text>
<rect x="330" y="360" width="220" height="125" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="3"/><rect x="330" y="360" width="220" height="10" rx="5" fill="#dc2626"/><text x="348" y="402" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#172033">Decision</text><text x="348" y="435" font-family="Arial, sans-serif" font-size="16" fill="#526077">continue, canary, rollback</text>
