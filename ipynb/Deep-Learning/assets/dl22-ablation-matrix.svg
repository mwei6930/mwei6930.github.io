<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#355070"/></marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.13"/></filter>
</defs>
<rect width="100%" height="100%" fill="#fbfcfe"/>
<text x="600" y="46" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#172033">A 2 x 2 Ablation Separates Main Effects from Interaction</text><text x="600" y="92" text-anchor="middle" font-family="Arial" font-size="20" fill="#475569">Factor B: dropout</text><text x="92" y="330" text-anchor="middle" transform="rotate(-90 92 330)" font-family="Arial" font-size="20" fill="#475569">Factor A: wider hidden layer</text><g filter="url(#shadow)"><rect x="245" y="145" width="330" height="155" rx="8" fill="#eef2f7" stroke="#355070" stroke-width="2"/></g>
<text x="410.0" y="180" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#172033">A0 B0</text><text x="410.0" y="212" text-anchor="middle" font-family="Arial" font-size="18" fill="#475569">reference</text><g filter="url(#shadow)"><rect x="625" y="145" width="330" height="155" rx="8" fill="#e9f2ff" stroke="#355070" stroke-width="2"/></g>
<text x="790.0" y="180" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#172033">A0 B1</text><text x="790.0" y="212" text-anchor="middle" font-family="Arial" font-size="18" fill="#475569">dropout only</text><g filter="url(#shadow)"><rect x="245" y="360" width="330" height="155" rx="8" fill="#e8f6ee" stroke="#355070" stroke-width="2"/></g>
<text x="410.0" y="395" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#172033">A1 B0</text><text x="410.0" y="427" text-anchor="middle" font-family="Arial" font-size="18" fill="#475569">width only</text><g filter="url(#shadow)"><rect x="625" y="360" width="330" height="155" rx="8" fill="#f1ecff" stroke="#355070" stroke-width="2"/></g>
<text x="790.0" y="395" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#172033">A1 B1</text><text x="790.0" y="427" text-anchor="middle" font-family="Arial" font-size="18" fill="#475569">both</text><text x="1060" y="235" text-anchor="middle" font-family="Arial" font-size="18" fill="#475569">main effect B</text><line x1="1010" y1="265" x2="1010" y2="420" stroke="#355070" stroke-width="3" marker-end="url(#arrow)"/><text x="600" y="570" text-anchor="middle" font-family="Arial" font-size="19" fill="#475569">Interaction = (A1B1 - A1B0) - (A0B1 - A0B0)</text>
</svg>