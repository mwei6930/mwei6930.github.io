    <svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360">
      <rect width="1100" height="360" fill="#fbfcfe"/>
      <style>
        .title{font:700 25px Arial;fill:#17212b} .h{font:700 18px Arial;fill:#17212b}
        .t{font:15px Arial;fill:#263746} .s{font:13px Arial;fill:#51606d}
        .box{fill:#fff;stroke:#436b8e;stroke-width:2;rx:7} .soft{fill:#eef5f7;stroke:#6d889b;stroke-width:1.6;rx:7}
        .warm{fill:#fff3df;stroke:#b27a28;stroke-width:1.8;rx:7} .accent{fill:#e8f4ec;stroke:#43845a;stroke-width:1.8;rx:7}
        .line{stroke:#334b5f;stroke-width:2;fill:none;marker-end:url(#a)} .dash{stroke:#7a8791;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#a)}
      </style>
      <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#334b5f"/></marker></defs>
      <text x="40" y="42" class="title">Reverse SDE and probability-flow ODE share marginals, not paths</text>
<rect x="45" y="95" width="470" height="205" class="soft"/><text x="100" y="135" class="h">reverse-time SDE</text><text x="80" y="175" class="t">drift includes -g(t)^2 score</text><text x="80" y="210" class="t">Brownian noise remains</text><path d="M95 265 C180 180 260 285 455 135" stroke="#436b8e" stroke-width="4" fill="none"/><text x="80" y="285" class="s">stochastic sample paths</text><rect x="585" y="95" width="470" height="205" class="accent"/><text x="650" y="135" class="h">probability-flow ODE</text><text x="620" y="175" class="t">half score correction, no Brownian term</text><text x="620" y="210" class="t">deterministic for fixed initial noise</text><path d="M640 265 C740 235 835 190 1005 135" stroke="#43845a" stroke-width="4" fill="none"/><text x="620" y="285" class="s">same time marginals under exact score</text>

    </svg>
