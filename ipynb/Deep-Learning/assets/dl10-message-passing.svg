<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img">
<style>
  text { font-family: Inter, Segoe UI, Arial, sans-serif; fill: #172033; letter-spacing: 0; }
  .title { font-size: 28px; font-weight: 700; }
  .label { font-size: 20px; font-weight: 600; }
  .small { font-size: 16px; }
  .box { fill: #ffffff; stroke: #40556f; stroke-width: 2; rx: 7; }
  .soft { fill: #eef5f2; stroke: #31725f; stroke-width: 2; rx: 7; }
  .warm { fill: #fff3df; stroke: #a76315; stroke-width: 2; rx: 7; }
  .blue { fill: #e8f1ff; stroke: #2463a6; stroke-width: 2; rx: 7; }
  .arrow { stroke: #40556f; stroke-width: 3; fill: none; marker-end: url(#arrow); }
  .thin { stroke: #6b7788; stroke-width: 2; fill: none; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#40556f"/></marker></defs>
<rect width="100%" height="100%" fill="#fbfcfe"/>
<text x="600" y="44" text-anchor="middle" class="title">One message-passing layer around target node i</text>
<circle cx="180" cy="185" r="42" fill="#e8f1ff" stroke="#2463a6" stroke-width="3"/><text x="180" y="192" text-anchor="middle" class="label">j₁</text>
<circle cx="180" cy="310" r="42" fill="#eef5f2" stroke="#31725f" stroke-width="3"/><text x="180" y="317" text-anchor="middle" class="label">j₂</text>
<circle cx="180" cy="435" r="42" fill="#fff3df" stroke="#a76315" stroke-width="3"/><text x="180" y="442" text-anchor="middle" class="label">j₃</text>
<rect x="330" y="120" width="220" height="370" class="box"/><text x="440" y="158" text-anchor="middle" class="label">Message φ</text>
<text x="440" y="205" text-anchor="middle" class="small">mⱼᵢ = φ(hᵢ, hⱼ, eⱼᵢ)</text><text x="440" y="260" text-anchor="middle" class="small">same learned rule</text><text x="440" y="292" text-anchor="middle" class="small">for every incident edge</text>
<path d="M225 185 L330 185" class="arrow"/><path d="M225 310 L330 310" class="arrow"/><path d="M225 435 L330 435" class="arrow"/>
<rect x="650" y="205" width="190" height="205" class="soft"/><text x="745" y="246" text-anchor="middle" class="label">Aggregate ⊕</text><text x="745" y="292" text-anchor="middle" class="small">sum / mean / max</text><text x="745" y="330" text-anchor="middle" class="small">order invariant</text><path d="M550 305 L650 305" class="arrow"/>
<rect x="935" y="205" width="210" height="205" class="warm"/><text x="1040" y="246" text-anchor="middle" class="label">Update γ</text><text x="1040" y="292" text-anchor="middle" class="small">hᵢ′ = γ(hᵢ, mᵢ)</text><text x="1040" y="330" text-anchor="middle" class="small">new target state</text><path d="M840 305 L935 305" class="arrow"/>
<text x="600" y="560" text-anchor="middle" class="small">Shared local functions + invariant aggregation ⇒ permutation-equivariant node outputs</text>
</svg>