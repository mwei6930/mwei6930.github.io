    <svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360">
      <rect width="1100" height="360" fill="#fbfcfe"/>
      <style>
        .title{font:700 25px Arial;fill:#17212b} .h{font:700 18px Arial;fill:#17212b}
        .t{font:15px Arial;fill:#263746} .s{font:13px Arial;fill:#51606d}
        .box{fill:#fff;stroke:#436b8e;stroke-width:2;rx:7} .soft{fill:#eef5f7;stroke:#6d889b;stroke-width:1.6;rx:7}
        .warm{fill:#fff3df;stroke:#b27a28;stroke-width:1.8;rx:7} .accent{fill:#e8f4ec;stroke:#43845a;stroke-width:1.8;rx:7}
        .line{stroke:#334b5f;stroke-width:2;fill:none;marker-end:url(#a)} .dash{stroke:#7a8791;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#a)}
      </style>
      <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#334b5f"/></marker></defs>
      <text x="40" y="42" class="title">Forward diffusion has a closed-form sample at any timestep</text>
<rect x="45" y="125" width="155" height="115" class="accent"/><text x="90" y="165" class="h">x_0 data</text><text x="74" y="205" class="s">structured digit</text><rect x="270" y="125" width="155" height="115" class="soft"/><text x="318" y="165" class="h">x_t</text><text x="295" y="205" class="s">signal + noise</text><rect x="495" y="125" width="155" height="115" class="soft"/><text x="543" y="165" class="h">x_s</text><text x="518" y="205" class="s">weaker signal</text><rect x="720" y="125" width="155" height="115" class="warm"/><text x="760" y="165" class="h">x_T noise</text><text x="744" y="205" class="s">approximately N(0,I)</text><path d="M200 182 L270 182" class="line"/><path d="M425 182 L495 182" class="line"/><path d="M650 182 L720 182" class="line"/><text x="892" y="150" class="t">x_t = sqrt(alpha_bar_t) x_0</text><text x="892" y="185" class="t">+ sqrt(1-alpha_bar_t) epsilon</text><text x="892" y="220" class="s">no need to simulate t steps</text>

    </svg>
