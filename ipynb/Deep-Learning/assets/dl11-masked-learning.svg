<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img">
<style>
  text { font-family: Inter, Segoe UI, Arial, sans-serif; fill: #172033; letter-spacing: 0; }
  .title { font-size: 28px; font-weight: 700; } .label { font-size: 20px; font-weight: 650; } .small { font-size: 16px; }
  .box { fill: #fff; stroke: #40556f; stroke-width: 2; rx: 7; } .blue { fill: #e8f1ff; stroke: #2463a6; stroke-width: 2; rx: 7; }
  .green { fill: #eef5f2; stroke: #31725f; stroke-width: 2; rx: 7; } .warm { fill: #fff3df; stroke: #a76315; stroke-width: 2; rx: 7; }
  .pink { fill: #fdecef; stroke: #aa455b; stroke-width: 2; rx: 7; } .arrow { stroke: #40556f; stroke-width: 3; fill: none; marker-end: url(#arrow); }
  .dash { stroke: #718096; stroke-width: 2; stroke-dasharray: 7 6; fill: none; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#40556f"/></marker></defs>
<rect width="100%" height="100%" fill="#fbfcfe"/>
<text x="600" y="44" text-anchor="middle" class="title">Masked representation learning predicts missing evidence</text>
<rect x="55" y="160" width="190" height="230" class="blue"/><text x="150" y="200" text-anchor="middle" class="label">original x</text><rect x="105" y="245" width="90" height="90" fill="#9fc2e8" stroke="#2463a6" stroke-width="2"/>
<rect x="305" y="160" width="190" height="230" class="pink"/><text x="400" y="200" text-anchor="middle" class="label">mask M</text><rect x="355" y="245" width="90" height="90" fill="#172033"/><rect x="355" y="245" width="45" height="45" fill="#e8a8b5"/><rect x="400" y="290" width="45" height="45" fill="#e8a8b5"/><path d="M245 275 L305 275" class="arrow"/>
<rect x="555" y="160" width="190" height="230" class="green"/><text x="650" y="200" text-anchor="middle" class="label">encoder</text><text x="650" y="260" text-anchor="middle" class="small">visible evidence</text><circle cx="650" cy="320" r="35" fill="#8ac4b4"/><text x="650" y="327" text-anchor="middle" class="label">h</text><path d="M495 275 L555 275" class="arrow"/>
<rect x="805" y="160" width="190" height="230" class="warm"/><text x="900" y="200" text-anchor="middle" class="label">decoder</text><text x="900" y="260" text-anchor="middle" class="small">reconstruct x̂</text><path d="M745 275 L805 275" class="arrow"/>
<rect x="1040" y="215" width="125" height="120" class="box"/><text x="1102" y="252" text-anchor="middle" class="label">loss</text><text x="1102" y="287" text-anchor="middle" class="small">only M</text><path d="M995 275 L1040 275" class="arrow"/><text x="600" y="485" text-anchor="middle" class="small">The mask ratio controls task difficulty; reconstruction fidelity alone does not guarantee semantic features.</text></svg>