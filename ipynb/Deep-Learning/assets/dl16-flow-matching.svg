    <svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360">
      <rect width="1100" height="360" fill="#fbfcfe"/>
      <style>
        .title{font:700 25px Arial;fill:#17212b} .h{font:700 18px Arial;fill:#17212b}
        .t{font:15px Arial;fill:#263746} .s{font:13px Arial;fill:#51606d}
        .box{fill:#fff;stroke:#436b8e;stroke-width:2;rx:7} .soft{fill:#eef5f7;stroke:#6d889b;stroke-width:1.6;rx:7}
        .warm{fill:#fff3df;stroke:#b27a28;stroke-width:1.8;rx:7} .accent{fill:#e8f4ec;stroke:#43845a;stroke-width:1.8;rx:7}
        .line{stroke:#334b5f;stroke-width:2;fill:none;marker-end:url(#a)} .dash{stroke:#7a8791;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#a)}
      </style>
      <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#334b5f"/></marker></defs>
      <text x="40" y="42" class="title">Flow matching regresses the velocity of a chosen probability path</text>
<rect x="45" y="95" width="260" height="200" class="soft"/><text x="100" y="135" class="h">sample endpoints</text><text x="82" y="180" class="t">x_0 ~ noise, x_1 ~ data</text><text x="82" y="220" class="s">independent coupling in this chapter</text><rect x="385" y="95" width="330" height="200" class="accent"/><text x="465" y="135" class="h">training path</text><text x="420" y="180" class="t">x_t = (1-t)x_0 + t x_1</text><text x="420" y="220" class="t">target velocity = x_1 - x_0</text><text x="420" y="255" class="s">regression; no ODE solve during training</text><rect x="795" y="95" width="260" height="200" class="warm"/><text x="855" y="135" class="h">generation</text><text x="825" y="180" class="t">dz/dt = v_theta(z,t,c)</text><text x="825" y="220" class="s">numerically integrate from noise</text><path d="M305 195 L385 195" class="line"/><path d="M715 195 L795 195" class="line"/>

    </svg>
