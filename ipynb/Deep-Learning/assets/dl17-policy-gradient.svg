<text x="550" y="42" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700">Policy gradients reinforce sampled decisions in proportion to advantage</text><path d="M90 220 L1010 220" stroke="#5d6d7e" stroke-width="4"/>
<g font-family="Arial" text-anchor="middle"><circle cx="140" cy="220" r="35" fill="#e8f1fb" stroke="#2364aa" stroke-width="3"/><text x="140" y="225" font-size="19">s0</text><circle cx="360" cy="220" r="35" fill="#e8f1fb" stroke="#2364aa" stroke-width="3"/><text x="360" y="225" font-size="19">s1</text><circle cx="580" cy="220" r="35" fill="#e8f1fb" stroke="#2364aa" stroke-width="3"/><text x="580" y="225" font-size="19">s2</text><circle cx="800" cy="220" r="35" fill="#e8f1fb" stroke="#2364aa" stroke-width="3"/><text x="800" y="225" font-size="19">s3</text><circle cx="1010" cy="220" r="35" fill="#edf7ed" stroke="#3a7d44" stroke-width="3"/><text x="1010" y="225" font-size="19">G</text><text x="250" y="188" font-size="18">a0</text><text x="470" y="188" font-size="18">a1</text><text x="690" y="188" font-size="18">a2</text><text x="905" y="188" font-size="18">a3</text><text x="550" y="330" font-size="22" font-weight="700">∇ log π(a|s) × advantage</text><text x="550" y="368" font-size="18">positive advantage raises action probability; negative advantage lowers it</text></g></svg>