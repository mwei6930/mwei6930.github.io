<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="520" viewBox="0 0 1160 520" role="img" aria-labelledby="title desc">
  <title id="title">End-to-end computer-system evaluation</title>
  <desc id="desc">A representative workload passes through software, processor, memory, and input-output layers while time, throughput, energy, reliability, and security are measured.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker></defs>
  <rect width="1160" height="520" rx="18" fill="#f8fafc"/>
  <text x="580" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#172033">Measure the complete path, not an isolated component</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="55" y="105" width="185" height="105" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="148" y="145" font-size="19" font-weight="700" fill="#1e3a8a">Representative</text><text x="148" y="174" font-size="19" font-weight="700" fill="#1e3a8a">workload</text><text x="148" y="197" font-size="14" fill="#334155">inputs + service level</text>
    <rect x="285" y="105" width="185" height="105" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="378" y="145" font-size="19" font-weight="700" fill="#14532d">Software stack</text><text x="378" y="174" font-size="15" fill="#334155">compiler, runtime, OS</text><text x="378" y="197" font-size="14" fill="#334155">libraries and settings</text>
    <rect x="515" y="105" width="185" height="105" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="608" y="145" font-size="19" font-weight="700" fill="#78350f">Processor</text><text x="608" y="174" font-size="15" fill="#334155">ISA + microarchitecture</text><text x="608" y="197" font-size="14" fill="#334155">frequency and cores</text>
    <rect x="745" y="105" width="185" height="105" rx="10" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/><text x="838" y="145" font-size="19" font-weight="700" fill="#581c87">Memory system</text><text x="838" y="174" font-size="15" fill="#334155">caches, DRAM, NUMA</text><text x="838" y="197" font-size="14" fill="#334155">capacity and bandwidth</text>
    <rect x="975" y="105" width="130" height="105" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="1040" y="145" font-size="19" font-weight="700" fill="#7f1d1d">I/O</text><text x="1040" y="174" font-size="15" fill="#334155">network</text><text x="1040" y="197" font-size="15" fill="#334155">and storage</text>
  </g>
  <g stroke="#334155" stroke-width="3" marker-end="url(#arrow)"><line x1="240" y1="158" x2="276" y2="158"/><line x1="470" y1="158" x2="506" y2="158"/><line x1="700" y1="158" x2="736" y2="158"/><line x1="930" y1="158" x2="966" y2="158"/></g>
  <path d="M148 228 V273 H1040 V228" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="580" y="304" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#334155">Observe outputs under controlled conditions</text>
  <g font-family="Arial, sans-serif" text-anchor="middle" font-size="16" font-weight="700">
    <rect x="65" y="342" width="170" height="78" rx="9" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="150" y="376" fill="#1e3a8a">Latency</text><text x="150" y="400" font-size="13" font-weight="400" fill="#475569">median and tail</text>
    <rect x="280" y="342" width="170" height="78" rx="9" fill="#fff" stroke="#16a34a" stroke-width="2"/><text x="365" y="376" fill="#14532d">Throughput</text><text x="365" y="400" font-size="13" font-weight="400" fill="#475569">jobs or bytes / s</text>
    <rect x="495" y="342" width="170" height="78" rx="9" fill="#fff" stroke="#d97706" stroke-width="2"/><text x="580" y="376" fill="#78350f">Energy</text><text x="580" y="400" font-size="13" font-weight="400" fill="#475569">joules / job</text>
    <rect x="710" y="342" width="170" height="78" rx="9" fill="#fff" stroke="#9333ea" stroke-width="2"/><text x="795" y="376" fill="#581c87">Reliability</text><text x="795" y="400" font-size="13" font-weight="400" fill="#475569">errors and uptime</text>
    <rect x="925" y="342" width="170" height="78" rx="9" fill="#fff" stroke="#dc2626" stroke-width="2"/><text x="1010" y="376" fill="#7f1d1d">Security</text><text x="1010" y="400" font-size="13" font-weight="400" fill="#475569">protected boundaries</text>
  </g>
  <text x="580" y="474" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">A component can look fast while the application waits elsewhere; end-to-end evidence decides.</text>
</svg>
