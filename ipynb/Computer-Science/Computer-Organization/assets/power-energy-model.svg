<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" role="img" aria-labelledby="title desc">
  <title id="title">Power and energy in a CMOS system</title><desc id="desc">Dynamic and static power add to total power, which integrated over runtime gives energy. Performance tuning changes both the height and duration of the power curve.</desc>
  <rect width="1120" height="500" rx="18" fill="#f8fafc"/>
  <text x="560" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#172033">Power is a rate; energy accumulates over time</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="55" y="105" width="285" height="130" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="198" y="140" font-size="20" font-weight="700" fill="#1e3a8a">Dynamic power</text><text x="198" y="176" font-size="18" fill="#172033">alpha C_eff V^2 f</text><text x="198" y="207" font-size="14" fill="#475569">charging switched capacitance</text>
    <text x="380" y="180" font-size="34" font-weight="700" fill="#334155">+</text>
    <rect x="420" y="105" width="285" height="130" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="563" y="140" font-size="20" font-weight="700" fill="#7f1d1d">Static power</text><text x="563" y="176" font-size="18" fill="#172033">I_leak V</text><text x="563" y="207" font-size="14" fill="#475569">leakage while powered</text>
    <text x="745" y="180" font-size="34" font-weight="700" fill="#334155">=</text>
    <rect x="785" y="105" width="280" height="130" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="925" y="140" font-size="20" font-weight="700" fill="#14532d">Total power P(t)</text><text x="925" y="176" font-size="18" fill="#172033">watts = joules / second</text><text x="925" y="207" font-size="14" fill="#475569">instantaneous operating cost</text>
  </g>
  <path d="M925 235 V285 H680" fill="none" stroke="#334155" stroke-width="3"/>
  <path d="M680 285 L680 277 L665 287 L680 297 L680 289" fill="#334155"/>
  <rect x="245" y="300" width="630" height="105" rx="13" fill="#172033"/>
  <text x="560" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#fff">Energy E = integral P(t) dt</text>
  <text x="560" y="374" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#dbeafe">joules per completed task = power profile x execution duration</text>
  <text x="560" y="459" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#475569">Lower power can still consume more energy if the task runs much longer.</text>
</svg>
