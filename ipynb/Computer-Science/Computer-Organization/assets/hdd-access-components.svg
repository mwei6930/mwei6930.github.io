<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="820" viewBox="0 0 1560 820" role="img" aria-labelledby="title desc">
  <title id="title">Hard-disk access combines mechanical positioning and media transfer</title>
  <desc id="desc">A platter contains concentric tracks and sectors. The actuator moves the head to the target track, rotation brings the sector under the head, and the bytes then transfer. A latency bar separates queue, controller, seek, rotation, and transfer time.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker><style>.body{font-family:"Segoe UI",Arial,sans-serif;fill:#111827}.small{font-family:"Segoe UI",Arial,sans-serif;fill:#4b5563;font-size:15px}.mono{font-family:Consolas,monospace;fill:#111827;font-size:15px}.line{stroke:#374151;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1560" height="820" fill="#ffffff"/>
  <text x="780" y="42" text-anchor="middle" class="body" font-size="28" font-weight="700">HDD latency begins with motion, not byte transfer</text>
  <text x="780" y="72" text-anchor="middle" class="small">Random requests pay actuator seek and rotational delay; sequential requests amortize positioning across many bytes.</text>
  <rect x="55" y="120" width="760" height="500" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="435" y="160" text-anchor="middle" class="body" font-size="22" font-weight="700">Platter, tracks, sectors, and head</text>
  <circle cx="395" cy="370" r="190" fill="#f9fafb" stroke="#374151" stroke-width="3"/><circle cx="395" cy="370" r="150" fill="none" stroke="#9ca3af" stroke-width="2"/><circle cx="395" cy="370" r="110" fill="none" stroke="#9ca3af" stroke-width="2"/><circle cx="395" cy="370" r="70" fill="none" stroke="#9ca3af" stroke-width="2"/><circle cx="395" cy="370" r="22" fill="#d1d5db" stroke="#374151" stroke-width="2"/>
  <path d="M395 180 L395 560 M205 370 H585 M260 235 L530 505 M260 505 L530 235" stroke="#d1d5db" stroke-width="1.5"/>
  <path d="M395 370 L395 220 A150 150 0 0 1 501 264 Z" fill="#fef3c7" fill-opacity="0.85" stroke="#d97706" stroke-width="2"/>
  <text x="460" y="235" class="small">target sector</text><text x="225" y="574" class="small">concentric tracks</text>
  <circle cx="690" cy="520" r="28" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><path d="M690 520 L530 335" stroke="#2563eb" stroke-width="18" stroke-linecap="round"/><circle cx="525" cy="330" r="13" fill="#dc2626"/><text x="650" y="566" class="small">actuator pivot</text><text x="505" y="310" class="small">head</text>
  <path d="M620 470 C590 430 565 390 535 345" class="line"/><text x="645" y="430" class="small">seek moves radially</text>
  <path d="M265 218 A185 185 0 0 1 520 205" fill="none" stroke="#0f766e" stroke-width="4" marker-end="url(#arrow)"/><text x="395" y="185" text-anchor="middle" class="small">platter rotation</text>
  <rect x="875" y="120" width="630" height="500" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="1190" y="160" text-anchor="middle" class="body" font-size="22" font-weight="700">One random block request</text>
  <rect x="930" y="220" width="170" height="74" fill="#f3f4f6" stroke="#6b7280"/><text x="1015" y="250" text-anchor="middle" class="mono">queue + control</text><text x="1015" y="276" text-anchor="middle" class="small">wait and decode</text>
  <rect x="1100" y="220" width="170" height="74" fill="#fee2e2" stroke="#dc2626"/><text x="1185" y="250" text-anchor="middle" class="mono">seek</text><text x="1185" y="276" text-anchor="middle" class="small">move head</text>
  <rect x="1270" y="220" width="170" height="74" fill="#fef3c7" stroke="#d97706"/><text x="1355" y="250" text-anchor="middle" class="mono">rotation</text><text x="1355" y="276" text-anchor="middle" class="small">wait for sector</text>
  <rect x="930" y="330" width="510" height="74" fill="#dcfce7" stroke="#16a34a"/><text x="1185" y="360" text-anchor="middle" class="mono">transfer bytes under the head</text><text x="1185" y="386" text-anchor="middle" class="small">fast once positioning is complete</text>
  <text x="1190" y="462" text-anchor="middle" class="mono">T_access = T_queue + T_ctrl + T_seek + T_rot + T_xfer</text>
  <text x="1190" y="505" text-anchor="middle" class="body" font-size="17" font-weight="700">Average rotational delay at RPM r</text>
  <text x="1190" y="543" text-anchor="middle" class="mono">T_rot,avg = 30,000 / r milliseconds</text>
  <text x="1190" y="579" text-anchor="middle" class="small">At 7,200 RPM, half a revolution averages about 4.17 ms.</text>
  <rect x="230" y="680" width="1100" height="86" rx="7" fill="#ecfdf5" stroke="#0f766e"/><text x="780" y="713" text-anchor="middle" class="body" font-size="18" font-weight="700">Sequential layout improves more than transfer bandwidth alone suggests.</text><text x="780" y="741" text-anchor="middle" class="small">Nearby logical blocks can reuse one seek and continue under the head; scattered requests repeatedly pay mechanical positioning.</text>
</svg>
