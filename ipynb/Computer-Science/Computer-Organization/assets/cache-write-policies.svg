<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="820" viewBox="0 0 1540 820" role="img" aria-labelledby="title desc">
  <title id="title">Cache write propagation and write-miss allocation policies</title>
  <desc id="desc">Write-through propagates every cache hit to lower memory, while write-back marks a dirty line and transfers it on eviction. On a write miss, write-allocate fetches the block before updating it, while no-write-allocate sends the store to the lower level without filling the cache.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker>
    <marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0f766e"/></marker>
    <style>.body{font-family:"Segoe UI",Arial,sans-serif;fill:#111827}.small{font-family:"Segoe UI",Arial,sans-serif;fill:#4b5563;font-size:15px}.mono{font-family:Consolas,monospace;fill:#111827;font-size:15px}.line{stroke:#374151;stroke-width:3;fill:none;marker-end:url(#arrow)}.defer{stroke:#0f766e;stroke-width:3;stroke-dasharray:8 6;fill:none;marker-end:url(#green)}</style>
  </defs>
  <rect width="1540" height="820" fill="#ffffff"/>
  <text x="770" y="43" text-anchor="middle" class="body" font-size="28" font-weight="700">Two independent decisions define how a cache handles stores</text>
  <text x="770" y="74" text-anchor="middle" class="small">Hit policy decides when lower memory changes; miss policy decides whether the missing block enters the cache.</text>

  <rect x="40" y="115" width="715" height="320" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="397" y="156" text-anchor="middle" class="body" font-size="23" font-weight="700" fill="#1d4ed8">Write-through on a hit</text>
  <text x="397" y="184" text-anchor="middle" class="small">Update the cache line and enqueue the same write for the lower level.</text>
  <rect x="80" y="235" width="150" height="82" rx="6" fill="#ffffff" stroke="#374151"/><text x="155" y="270" text-anchor="middle" class="body" font-size="19" font-weight="700">CPU store</text><text x="155" y="297" text-anchor="middle" class="mono">x = 9</text>
  <rect x="300" y="220" width="190" height="112" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="395" y="260" text-anchor="middle" class="body" font-size="19" font-weight="700">cache line</text><text x="395" y="288" text-anchor="middle" class="mono">data x = 9</text><text x="395" y="314" text-anchor="middle" class="small">no dirty state needed</text>
  <rect x="560" y="220" width="150" height="112" rx="6" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/><text x="635" y="260" text-anchor="middle" class="body" font-size="19" font-weight="700">lower level</text><text x="635" y="288" text-anchor="middle" class="mono">x = 9</text><text x="635" y="314" text-anchor="middle" class="small">write now</text>
  <path d="M230 276 H295" class="line"/><path d="M490 276 H555" class="line"/>
  <text x="397" y="377" text-anchor="middle" class="small">A write buffer can let the CPU continue while the lower-level transfer drains.</text>
  <text x="397" y="406" text-anchor="middle" class="small">Simple visibility, but every store consumes lower-level bandwidth.</text>

  <rect x="785" y="115" width="715" height="320" rx="8" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
  <text x="1142" y="156" text-anchor="middle" class="body" font-size="23" font-weight="700" fill="#0f766e">Write-back on a hit</text>
  <text x="1142" y="184" text-anchor="middle" class="small">Update only the cached copy and mark the line dirty.</text>
  <rect x="825" y="235" width="150" height="82" rx="6" fill="#ffffff" stroke="#374151"/><text x="900" y="270" text-anchor="middle" class="body" font-size="19" font-weight="700">CPU store</text><text x="900" y="297" text-anchor="middle" class="mono">x = 9</text>
  <rect x="1045" y="220" width="190" height="112" rx="6" fill="#d1fae5" stroke="#0f766e" stroke-width="2"/><text x="1140" y="256" text-anchor="middle" class="body" font-size="19" font-weight="700">cache line</text><text x="1140" y="284" text-anchor="middle" class="mono">data x = 9</text><text x="1140" y="311" text-anchor="middle" class="body" font-size="16" font-weight="700" fill="#b91c1c">dirty = 1</text>
  <rect x="1305" y="220" width="150" height="112" rx="6" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/><text x="1380" y="260" text-anchor="middle" class="body" font-size="19" font-weight="700">lower level</text><text x="1380" y="288" text-anchor="middle" class="mono">old x</text><text x="1380" y="314" text-anchor="middle" class="small">unchanged now</text>
  <path d="M975 276 H1040" class="line"/><path d="M1235 276 H1300" class="defer"/>
  <text x="1270" y="247" class="small" fill="#0f766e">write on dirty eviction</text>
  <text x="1142" y="377" text-anchor="middle" class="small">Repeated stores to one line may collapse into one later transfer.</text>
  <text x="1142" y="406" text-anchor="middle" class="small">Lower traffic, but eviction and exception logic must preserve dirty data.</text>

  <rect x="40" y="485" width="715" height="275" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="397" y="526" text-anchor="middle" class="body" font-size="23" font-weight="700" fill="#6d28d9">Write-allocate on a miss</text>
  <text x="397" y="556" text-anchor="middle" class="small">Fetch the containing block, install it, then update the requested bytes.</text>
  <rect x="85" y="610" width="145" height="72" rx="5" fill="#ffffff" stroke="#374151"/><text x="157" y="641" text-anchor="middle" class="body" font-size="18" font-weight="700">store miss</text><text x="157" y="666" text-anchor="middle" class="mono">address A</text>
  <rect x="300" y="595" width="170" height="102" rx="5" fill="#fff7ed" stroke="#c2410c"/><text x="385" y="630" text-anchor="middle" class="body" font-size="18" font-weight="700">lower level</text><text x="385" y="656" text-anchor="middle" class="mono">read block(A)</text><text x="385" y="680" text-anchor="middle" class="small">miss penalty</text>
  <rect x="540" y="595" width="170" height="102" rx="5" fill="#ede9fe" stroke="#7c3aed"/><text x="625" y="630" text-anchor="middle" class="body" font-size="18" font-weight="700">cache fill</text><text x="625" y="656" text-anchor="middle" class="mono">install + store</text><text x="625" y="680" text-anchor="middle" class="small">future hits likely</text>
  <path d="M230 646 H295" class="line"/><path d="M470 646 H535" class="line"/>
  <text x="397" y="736" text-anchor="middle" class="small">Common with write-back when nearby or repeated stores are expected.</text>

  <rect x="785" y="485" width="715" height="275" rx="8" fill="#fefce8" stroke="#a16207" stroke-width="2"/>
  <text x="1142" y="526" text-anchor="middle" class="body" font-size="23" font-weight="700" fill="#854d0e">No-write-allocate on a miss</text>
  <text x="1142" y="556" text-anchor="middle" class="small">Send the write downward without filling this cache.</text>
  <rect x="830" y="610" width="145" height="72" rx="5" fill="#ffffff" stroke="#374151"/><text x="902" y="641" text-anchor="middle" class="body" font-size="18" font-weight="700">store miss</text><text x="902" y="666" text-anchor="middle" class="mono">address A</text>
  <rect x="1045" y="595" width="170" height="102" rx="5" fill="#f9fafb" stroke="#9ca3af"/><text x="1130" y="630" text-anchor="middle" class="body" font-size="18" font-weight="700">cache</text><text x="1130" y="656" text-anchor="middle" class="mono">no allocation</text><text x="1130" y="680" text-anchor="middle" class="small">avoid pollution</text>
  <rect x="1285" y="595" width="170" height="102" rx="5" fill="#fef3c7" stroke="#a16207"/><text x="1370" y="630" text-anchor="middle" class="body" font-size="18" font-weight="700">lower level</text><text x="1370" y="656" text-anchor="middle" class="mono">write bytes</text><text x="1370" y="680" text-anchor="middle" class="small">cache stays empty</text>
  <path d="M975 646 H1040" class="line"/><path d="M1215 646 H1280" class="line"/>
  <text x="1142" y="736" text-anchor="middle" class="small">Useful for streaming writes that are unlikely to be read again soon.</text>
  <text x="770" y="798" text-anchor="middle" class="small">Common pairings are write-back plus write-allocate and write-through plus no-write-allocate, but the two choices are logically independent.</text>
</svg>
