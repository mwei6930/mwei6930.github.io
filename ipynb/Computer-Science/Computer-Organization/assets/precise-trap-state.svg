<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-labelledby="title desc">
  <title id="title">Precise exception and trap state</title>
  <desc id="desc">Older instructions are committed, the faulting instruction has no ordinary side effects, trap CSRs record its program counter and cause, and execution redirects to the trap vector.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker><marker id="redArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b91c1c"/></marker></defs>
  <rect width="1400" height="700" fill="#ffffff"/>
  <text x="700" y="40" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#111827">A precise trap creates a clean architectural boundary</text>
  <text x="700" y="70" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#4b5563">Example: an aligned instruction at 0x108 attempts a load that raises an access fault.</text>

  <text x="70" y="125" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#111827">Program order</text>
  <line x1="90" y1="190" x2="1310" y2="190" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="100" y="145" width="210" height="90" rx="7" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
  <text x="205" y="178" text-anchor="middle" font-family="Consolas, monospace" font-size="16" fill="#111827">0x100: add ...</text>
  <text x="205" y="207" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f766e">committed</text>
  <rect x="350" y="145" width="210" height="90" rx="7" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
  <text x="455" y="178" text-anchor="middle" font-family="Consolas, monospace" font-size="16" fill="#111827">0x104: sw ...</text>
  <text x="455" y="207" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f766e">committed</text>
  <rect x="600" y="135" width="240" height="110" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/>
  <text x="720" y="174" text-anchor="middle" font-family="Consolas, monospace" font-size="17" fill="#111827">0x108: lw x5, 0(x6)</text>
  <text x="720" y="203" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#b91c1c">faulting instruction</text>
  <text x="720" y="226" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#4b5563">ordinary write-back suppressed</text>
  <rect x="890" y="145" width="210" height="90" rx="7" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="995" y="178" text-anchor="middle" font-family="Consolas, monospace" font-size="16" fill="#6b7280">0x10C: sub ...</text>
  <text x="995" y="207" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#6b7280">not executed/committed</text>
  <rect x="1140" y="145" width="170" height="90" rx="7" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="1225" y="178" text-anchor="middle" font-family="Consolas, monospace" font-size="16" fill="#6b7280">younger work</text>
  <text x="1225" y="207" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#6b7280">discarded</text>

  <path d="M720 245 V310" fill="none" stroke="#b91c1c" stroke-width="3" marker-end="url(#redArrow)"/>
  <rect x="225" y="335" width="950" height="205" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="700" y="372" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#9a3412">Atomic trap-state update</text>
  <rect x="270" y="405" width="190" height="84" rx="6" fill="#ffffff" stroke="#c2410c"/>
  <text x="365" y="436" text-anchor="middle" font-family="Consolas, monospace" font-size="17" fill="#111827">mepc &#8592; 0x108</text>
  <text x="365" y="465" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#4b5563">where to resume/retry</text>
  <rect x="490" y="405" width="190" height="84" rx="6" fill="#ffffff" stroke="#c2410c"/>
  <text x="585" y="436" text-anchor="middle" font-family="Consolas, monospace" font-size="17" fill="#111827">mcause &#8592; code</text>
  <text x="585" y="465" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#4b5563">load access fault</text>
  <rect x="710" y="405" width="190" height="84" rx="6" fill="#ffffff" stroke="#c2410c"/>
  <text x="805" y="436" text-anchor="middle" font-family="Consolas, monospace" font-size="17" fill="#111827">mtval &#8592; bad VA</text>
  <text x="805" y="465" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#4b5563">diagnostic address</text>
  <rect x="930" y="405" width="190" height="84" rx="6" fill="#ffffff" stroke="#c2410c"/>
  <text x="1025" y="436" text-anchor="middle" font-family="Consolas, monospace" font-size="17" fill="#111827">PC &#8592; mtvec</text>
  <text x="1025" y="465" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#4b5563">enter trap handler</text>
  <text x="700" y="520" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#374151">RegWrite = 0 and MemWrite = 0 for the faulting instruction</text>

  <line x1="700" y1="540" x2="700" y2="585" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="450" y="595" width="500" height="65" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="700" y="623" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#1d4ed8">Trap handler sees a reproducible machine state</text>
  <text x="700" y="647" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#4b5563">all older effects visible; no ordinary effect from the faulting or younger instructions</text>
</svg>
