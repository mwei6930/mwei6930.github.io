<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="900" viewBox="0 0 1700 900" role="img" aria-labelledby="title desc">
  <title id="title">Complete virtual-address translation and cache access path</title>
  <desc id="desc">A virtual address is split into VPN and offset. The TLB is checked; a miss triggers a page-table walk and may produce a page fault. A successful translation forms a physical address, which is then checked in the data or instruction cache. A cache miss continues through lower cache levels to DRAM.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0f766e"/></marker><style>.body{font-family:"Segoe UI",Arial,sans-serif;fill:#111827}.small{font-family:"Segoe UI",Arial,sans-serif;fill:#4b5563;font-size:15px}.mono{font-family:Consolas,monospace;fill:#111827;font-size:16px}.line{stroke:#374151;stroke-width:2.7;fill:none;marker-end:url(#arrow)}.fast{stroke:#0f766e;stroke-width:3.5;fill:none;marker-end:url(#green)}</style></defs>
  <rect width="1700" height="900" fill="#ffffff"/>
  <text x="850" y="42" text-anchor="middle" class="body" font-size="28" font-weight="700">Translation first, cache lookup second</text>
  <text x="850" y="72" text-anchor="middle" class="small">The common fast path is a TLB hit followed by an L1 cache hit. The two hit/miss decisions describe different structures.</text>
  <rect x="55" y="145" width="235" height="96" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="172" y="180" text-anchor="middle" class="body" font-size="19" font-weight="700">CPU request</text><text x="172" y="208" text-anchor="middle" class="mono">VA + access type</text>
  <rect x="350" y="125" width="320" height="136" rx="7" fill="#ffffff" stroke="#374151" stroke-width="2"/><rect x="350" y="125" width="205" height="136" fill="#dbeafe" stroke="#2563eb"/><rect x="555" y="125" width="115" height="136" fill="#fef3c7" stroke="#d97706"/><text x="452" y="171" text-anchor="middle" class="body" font-size="19" font-weight="700">VPN</text><text x="452" y="204" text-anchor="middle" class="mono">lookup key</text><text x="612" y="171" text-anchor="middle" class="body" font-size="19" font-weight="700">offset</text><text x="612" y="204" text-anchor="middle" class="mono">unchanged</text>
  <rect x="760" y="125" width="250" height="136" rx="7" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="885" y="164" text-anchor="middle" class="body" font-size="20" font-weight="700">TLB lookup</text><text x="885" y="198" text-anchor="middle" class="mono">(ASID, VPN)</text><text x="885" y="229" text-anchor="middle" class="small">cached PPN + permissions</text>
  <path d="M290 193 H350" class="line"/><path d="M670 193 H760" class="line"/>

  <rect x="1130" y="125" width="280" height="136" rx="7" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="1270" y="164" text-anchor="middle" class="body" font-size="20" font-weight="700">physical address</text><text x="1270" y="198" text-anchor="middle" class="mono">PPN || page offset</text><text x="1270" y="229" text-anchor="middle" class="small">permission check already passed</text>
  <path d="M1010 163 H1130" class="fast"/><text x="1065" y="148" class="small" fill="#0f766e">TLB hit</text>

  <rect x="760" y="365" width="250" height="136" rx="7" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="885" y="404" text-anchor="middle" class="body" font-size="20" font-weight="700">page-table walk</text><text x="885" y="438" text-anchor="middle" class="small">read one PTE per level</text><text x="885" y="468" text-anchor="middle" class="small">walk reads use the cache hierarchy</text>
  <path d="M885 261 V365" class="line"/><text x="900" y="318" class="small">TLB miss</text>
  <rect x="1130" y="365" width="280" height="136" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="1270" y="404" text-anchor="middle" class="body" font-size="20" font-weight="700">valid leaf PTE</text><text x="1270" y="438" text-anchor="middle" class="small">refill TLB with translation</text><text x="1270" y="468" text-anchor="middle" class="small">then form the physical address</text>
  <path d="M1010 433 H1130" class="line"/><path d="M1270 365 V261" class="fast"/>
  <rect x="1130" y="590" width="280" height="108" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="1270" y="631" text-anchor="middle" class="body" font-size="20" font-weight="700">page fault</text><text x="1270" y="664" text-anchor="middle" class="small">trap before the requested data access</text>
  <path d="M1010 473 C1080 473 1080 644 1130 644" class="line"/><text x="1045" y="548" class="small">invalid or prohibited</text>

  <rect x="1480" y="125" width="170" height="136" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="1565" y="164" text-anchor="middle" class="body" font-size="20" font-weight="700">L1 cache</text><text x="1565" y="198" text-anchor="middle" class="small">physical tag</text><text x="1565" y="229" text-anchor="middle" class="small">instruction or data</text>
  <path d="M1410 193 H1480" class="line"/>
  <rect x="1480" y="365" width="170" height="100" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="1565" y="405" text-anchor="middle" class="body" font-size="18" font-weight="700">cache hit</text><text x="1565" y="435" text-anchor="middle" class="small">return bytes</text>
  <path d="M1565 261 V365" class="fast"/><text x="1580" y="319" class="small">hit</text>
  <rect x="1450" y="590" width="230" height="108" rx="7" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="1565" y="631" text-anchor="middle" class="body" font-size="19" font-weight="700">L2 / LLC / DRAM</text><text x="1565" y="664" text-anchor="middle" class="small">fetch block, refill, return data</text>
  <path d="M1625 261 V590" class="line"/><text x="1640" y="425" class="small">cache miss</text>

  <rect x="80" y="570" width="880" height="235" rx="8" fill="#f9fafb" stroke="#9ca3af"/>
  <text x="520" y="607" text-anchor="middle" class="body" font-size="21" font-weight="700">Four outcomes that should not be conflated</text>
  <g class="body" font-size="17"><text x="125" y="650" font-weight="700">TLB hit + cache hit</text><text x="400" y="650" class="small">translation and data are both cached</text><text x="125" y="690" font-weight="700">TLB miss + cache hit</text><text x="400" y="690" class="small">walk finds a valid mapping; requested block is already in L1</text><text x="125" y="730" font-weight="700">TLB hit + cache miss</text><text x="400" y="730" class="small">translation is cached; data block must come from below</text><text x="125" y="770" font-weight="700">page fault</text><text x="400" y="770" class="small">translation/protection cannot complete; requested data lookup waits</text></g>
  <text x="850" y="858" text-anchor="middle" class="body" font-size="18" font-weight="700">Page-table entries are memory data too, so a hardware walk can itself generate cache hits and cache misses.</text>
</svg>
