<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="700" viewBox="0 0 1450 700" role="img" aria-labelledby="title desc">
  <title id="title">RISC-V immediate generation</title>
  <desc id="desc">I, S, B, and J instruction fields are rearranged, receive an implicit low zero for branch and jump offsets, and are sign-extended to 32 bits.</desc>
  <rect width="1450" height="700" fill="#ffffff"/>
  <text x="725" y="42" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#111827">Immediate generation reconstructs meaning from scattered instruction bits</text>
  <text x="725" y="72" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#4b5563">Each row shows source fields in the 32-bit instruction, then their ordered immediate before sign extension.</text>

  <text x="55" y="125" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#111827">Format</text>
  <text x="180" y="125" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#111827">Bits taken from instruction</text>
  <text x="850" y="125" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#111827">Reconstructed immediate</text>
  <text x="1245" y="125" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#111827">32-bit output</text>

  <!-- I -->
  <rect x="40" y="150" width="1350" height="105" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="82" y="211" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#1d4ed8">I</text>
  <rect x="175" y="179" width="485" height="48" rx="5" fill="#dbeafe" stroke="#2563eb"/>
  <text x="417" y="209" text-anchor="middle" font-family="Consolas, monospace" font-size="18" fill="#111827">instr[31:20] = imm[11:0]</text>
  <text x="710" y="209" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="25" fill="#374151">&#8594;</text>
  <rect x="780" y="179" width="330" height="48" rx="5" fill="#dbeafe" stroke="#2563eb"/>
  <text x="945" y="209" text-anchor="middle" font-family="Consolas, monospace" font-size="18" fill="#111827">imm[11:0]</text>
  <text x="1150" y="209" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="25" fill="#374151">&#8594;</text>
  <rect x="1200" y="179" width="165" height="48" rx="5" fill="#ecfdf5" stroke="#0f766e"/>
  <text x="1282" y="209" text-anchor="middle" font-family="Consolas, monospace" font-size="16" fill="#111827">sign-extend</text>

  <!-- S -->
  <rect x="40" y="270" width="1350" height="105" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="82" y="331" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#0f766e">S</text>
  <rect x="175" y="299" width="240" height="48" rx="5" fill="#ccfbf1" stroke="#0f766e"/>
  <text x="295" y="329" text-anchor="middle" font-family="Consolas, monospace" font-size="17" fill="#111827">instr[31:25]</text>
  <rect x="430" y="299" width="230" height="48" rx="5" fill="#fef3c7" stroke="#a16207"/>
  <text x="545" y="329" text-anchor="middle" font-family="Consolas, monospace" font-size="17" fill="#111827">instr[11:7]</text>
  <text x="710" y="329" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="25" fill="#374151">&#8594;</text>
  <rect x="780" y="299" width="190" height="48" rx="5" fill="#ccfbf1" stroke="#0f766e"/>
  <text x="875" y="329" text-anchor="middle" font-family="Consolas, monospace" font-size="16" fill="#111827">imm[11:5]</text>
  <rect x="975" y="299" width="135" height="48" rx="5" fill="#fef3c7" stroke="#a16207"/>
  <text x="1042" y="329" text-anchor="middle" font-family="Consolas, monospace" font-size="16" fill="#111827">imm[4:0]</text>
  <text x="1150" y="329" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="25" fill="#374151">&#8594;</text>
  <rect x="1200" y="299" width="165" height="48" rx="5" fill="#ecfdf5" stroke="#0f766e"/>
  <text x="1282" y="329" text-anchor="middle" font-family="Consolas, monospace" font-size="16" fill="#111827">sign-extend</text>

  <!-- B -->
  <rect x="40" y="390" width="1350" height="115" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="82" y="455" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#c2410c">B</text>
  <rect x="175" y="419" width="110" height="48" rx="5" fill="#fee2e2" stroke="#c2410c"/>
  <text x="230" y="449" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#111827">i[31]</text>
  <rect x="290" y="419" width="110" height="48" rx="5" fill="#dbeafe" stroke="#2563eb"/>
  <text x="345" y="449" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#111827">i[7]</text>
  <rect x="405" y="419" width="145" height="48" rx="5" fill="#ccfbf1" stroke="#0f766e"/>
  <text x="477" y="449" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#111827">i[30:25]</text>
  <rect x="555" y="419" width="120" height="48" rx="5" fill="#fef3c7" stroke="#a16207"/>
  <text x="615" y="449" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#111827">i[11:8]</text>
  <text x="710" y="449" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="25" fill="#374151">&#8594;</text>
  <rect x="750" y="419" width="78" height="48" rx="5" fill="#fee2e2" stroke="#c2410c"/><text x="789" y="449" text-anchor="middle" font-family="Consolas, monospace" font-size="14">12</text>
  <rect x="832" y="419" width="78" height="48" rx="5" fill="#dbeafe" stroke="#2563eb"/><text x="871" y="449" text-anchor="middle" font-family="Consolas, monospace" font-size="14">11</text>
  <rect x="914" y="419" width="92" height="48" rx="5" fill="#ccfbf1" stroke="#0f766e"/><text x="960" y="449" text-anchor="middle" font-family="Consolas, monospace" font-size="14">10:5</text>
  <rect x="1010" y="419" width="75" height="48" rx="5" fill="#fef3c7" stroke="#a16207"/><text x="1047" y="449" text-anchor="middle" font-family="Consolas, monospace" font-size="14">4:1</text>
  <rect x="1089" y="419" width="38" height="48" rx="5" fill="#ffffff" stroke="#374151"/><text x="1108" y="449" text-anchor="middle" font-family="Consolas, monospace" font-size="14">0</text>
  <text x="1150" y="449" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="25" fill="#374151">&#8594;</text>
  <rect x="1200" y="419" width="165" height="48" rx="5" fill="#ecfdf5" stroke="#0f766e"/>
  <text x="1282" y="449" text-anchor="middle" font-family="Consolas, monospace" font-size="16" fill="#111827">sign-extend</text>
  <text x="390" y="493" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#4b5563">The appended low zero encodes an even byte offset.</text>

  <!-- J -->
  <rect x="40" y="520" width="1350" height="115" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="82" y="585" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#7c3aed">J</text>
  <rect x="175" y="549" width="110" height="48" rx="5" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="230" y="579" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#111827">i[31]</text>
  <rect x="290" y="549" width="145" height="48" rx="5" fill="#dbeafe" stroke="#2563eb"/>
  <text x="362" y="579" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#111827">i[19:12]</text>
  <rect x="440" y="549" width="110" height="48" rx="5" fill="#fee2e2" stroke="#c2410c"/>
  <text x="495" y="579" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#111827">i[20]</text>
  <rect x="555" y="549" width="120" height="48" rx="5" fill="#ccfbf1" stroke="#0f766e"/>
  <text x="615" y="579" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#111827">i[30:21]</text>
  <text x="710" y="579" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="25" fill="#374151">&#8594;</text>
  <rect x="750" y="549" width="78" height="48" rx="5" fill="#ede9fe" stroke="#7c3aed"/><text x="789" y="579" text-anchor="middle" font-family="Consolas, monospace" font-size="14">20</text>
  <rect x="832" y="549" width="92" height="48" rx="5" fill="#dbeafe" stroke="#2563eb"/><text x="878" y="579" text-anchor="middle" font-family="Consolas, monospace" font-size="14">19:12</text>
  <rect x="928" y="549" width="67" height="48" rx="5" fill="#fee2e2" stroke="#c2410c"/><text x="961" y="579" text-anchor="middle" font-family="Consolas, monospace" font-size="14">11</text>
  <rect x="999" y="549" width="86" height="48" rx="5" fill="#ccfbf1" stroke="#0f766e"/><text x="1042" y="579" text-anchor="middle" font-family="Consolas, monospace" font-size="14">10:1</text>
  <rect x="1089" y="549" width="38" height="48" rx="5" fill="#ffffff" stroke="#374151"/><text x="1108" y="579" text-anchor="middle" font-family="Consolas, monospace" font-size="14">0</text>
  <text x="1150" y="579" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="25" fill="#374151">&#8594;</text>
  <rect x="1200" y="549" width="165" height="48" rx="5" fill="#ecfdf5" stroke="#0f766e"/>
  <text x="1282" y="579" text-anchor="middle" font-family="Consolas, monospace" font-size="16" fill="#111827">sign-extend</text>
  <text x="725" y="674" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#4b5563">The same sign bit, instr[31], sits in a fixed place across formats so sign extension can begin early.</text>
</svg>
