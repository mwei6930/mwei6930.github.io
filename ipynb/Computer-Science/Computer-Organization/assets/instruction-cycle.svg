<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
  <title id="title">Conceptual instruction execution cycle</title>
  <desc id="desc">Five stages show fetch, decode, execute, memory access, and write-back for an ADD instruction.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#52606d"/>
    </marker>
  </defs>
  <rect width="1120" height="640" fill="#f8fafc"/>
  <text x="560" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#172b4d">One instruction changes architectural state through a controlled cycle</text>

  <g font-family="Arial, sans-serif">
    <rect x="35" y="95" width="190" height="245" rx="6" fill="#e8f1ff" stroke="#2f6fed" stroke-width="2"/>
    <circle cx="65" cy="128" r="18" fill="#2f6fed"/>
    <text x="65" y="134" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">1</text>
    <text x="130" y="134" text-anchor="middle" font-size="21" font-weight="700" fill="#174ea6">Fetch</text>
    <text x="55" y="175" font-size="15" fill="#253858">PC supplies an address</text>
    <text x="55" y="202" font-size="15" fill="#253858">memory returns instruction</text>
    <text x="55" y="229" font-size="15" fill="#253858">instruction enters IR</text>
    <rect x="55" y="263" width="150" height="48" rx="4" fill="#ffffff" stroke="#79a7f2"/>
    <text x="130" y="284" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#253858">IR = ADD x5,x1,x2</text>
    <text x="130" y="302" text-anchor="middle" font-size="13" fill="#52606d">PC = PC + 4</text>

    <rect x="250" y="95" width="190" height="245" rx="6" fill="#e7f7ef" stroke="#17885b" stroke-width="2"/>
    <circle cx="280" cy="128" r="18" fill="#17885b"/>
    <text x="280" y="134" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">2</text>
    <text x="345" y="134" text-anchor="middle" font-size="21" font-weight="700" fill="#0c6b45">Decode</text>
    <text x="270" y="175" font-size="15" fill="#22543d">identify opcode and format</text>
    <text x="270" y="202" font-size="15" fill="#22543d">select source registers</text>
    <text x="270" y="229" font-size="15" fill="#22543d">generate control decisions</text>
    <rect x="270" y="263" width="150" height="48" rx="4" fill="#ffffff" stroke="#58b68d"/>
    <text x="345" y="284" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#22543d">x1 = 7, x2 = 4</text>
    <text x="345" y="302" text-anchor="middle" font-size="13" fill="#52606d">operation = add</text>

    <rect x="465" y="95" width="190" height="245" rx="6" fill="#fff1df" stroke="#d97706" stroke-width="2"/>
    <circle cx="495" cy="128" r="18" fill="#d97706"/>
    <text x="495" y="134" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">3</text>
    <text x="560" y="134" text-anchor="middle" font-size="21" font-weight="700" fill="#9a4f00">Execute</text>
    <text x="485" y="175" font-size="15" fill="#4b3a2d">ALU computes a value</text>
    <text x="485" y="202" font-size="15" fill="#4b3a2d">or an effective address</text>
    <text x="485" y="229" font-size="15" fill="#4b3a2d">or evaluates a branch</text>
    <rect x="485" y="263" width="150" height="48" rx="4" fill="#ffffff" stroke="#e7a34b"/>
    <text x="560" y="284" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#4b3a2d">ALU = 7 + 4</text>
    <text x="560" y="302" text-anchor="middle" font-size="13" fill="#52606d">result = 11</text>

    <rect x="680" y="95" width="190" height="245" rx="6" fill="#f2eafe" stroke="#7e57c2" stroke-width="2"/>
    <circle cx="710" cy="128" r="18" fill="#7e57c2"/>
    <text x="710" y="134" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">4</text>
    <text x="775" y="134" text-anchor="middle" font-size="21" font-weight="700" fill="#5e3c99">Memory</text>
    <text x="700" y="175" font-size="15" fill="#44345d">load reads addressed data</text>
    <text x="700" y="202" font-size="15" fill="#44345d">store writes addressed data</text>
    <text x="700" y="229" font-size="15" fill="#44345d">other instructions bypass</text>
    <rect x="700" y="263" width="150" height="48" rx="4" fill="#ffffff" stroke="#a98bd9"/>
    <text x="775" y="284" text-anchor="middle" font-size="14" fill="#44345d">ADD needs no</text>
    <text x="775" y="302" text-anchor="middle" font-size="14" fill="#44345d">data-memory access</text>

    <rect x="895" y="95" width="190" height="245" rx="6" fill="#ffe9ec" stroke="#c9435c" stroke-width="2"/>
    <circle cx="925" cy="128" r="18" fill="#c9435c"/>
    <text x="925" y="134" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">5</text>
    <text x="990" y="134" text-anchor="middle" font-size="21" font-weight="700" fill="#9f2940">Write-back</text>
    <text x="915" y="175" font-size="15" fill="#5d2a35">commit result to register</text>
    <text x="915" y="202" font-size="15" fill="#5d2a35">or preserve memory update</text>
    <text x="915" y="229" font-size="15" fill="#5d2a35">next PC becomes visible</text>
    <rect x="915" y="263" width="150" height="48" rx="4" fill="#ffffff" stroke="#dc8293"/>
    <text x="990" y="284" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#5d2a35">x5 = 11</text>
    <text x="990" y="302" text-anchor="middle" font-size="13" fill="#52606d">architectural result</text>
  </g>

  <path d="M225 217 L250 217" stroke="#52606d" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M440 217 L465 217" stroke="#52606d" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M655 217 L680 217" stroke="#52606d" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M870 217 L895 217" stroke="#52606d" stroke-width="2.5" marker-end="url(#arrow)"/>

  <path d="M990 340 C990 410 130 410 130 340" fill="none" stroke="#52606d" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="560" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#52606d">repeat from the next program counter value</text>

  <rect x="95" y="452" width="930" height="135" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="560" y="486" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#172b4d">Conceptual stages describe information dependencies, not necessarily five clock cycles</text>
  <text x="130" y="524" font-family="Arial, sans-serif" font-size="16" fill="#52606d">Single-cycle core:</text>
  <text x="285" y="524" font-family="Arial, sans-serif" font-size="16" fill="#253858">all required work occurs during one long clock cycle.</text>
  <text x="130" y="553" font-family="Arial, sans-serif" font-size="16" fill="#52606d">Multi-cycle core:</text>
  <text x="285" y="553" font-family="Arial, sans-serif" font-size="16" fill="#253858">one instruction reuses hardware over several cycles.</text>
  <text x="130" y="582" font-family="Arial, sans-serif" font-size="16" fill="#52606d">Pipelined core:</text>
  <text x="285" y="582" font-family="Arial, sans-serif" font-size="16" fill="#253858">different instructions occupy different stages at the same time.</text>
</svg>
