<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 540" role="img" aria-labelledby="title desc">
  <title id="title">Sequential, branch, JAL, and JALR control flow</title><desc id="desc">The next program counter either advances sequentially, uses a PC-relative target, or uses a register-relative target. Jumps can save a return address.</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#374151"/></marker><style>.h{font:700 23px Arial,sans-serif;fill:#111827}.t{font:17px Arial,sans-serif;fill:#374151}.b{stroke:#1f2937;stroke-width:3}.w{fill:none;stroke:#374151;stroke-width:3;marker-end:url(#a)}.take{fill:none;stroke:#be123c;stroke-width:4;marker-end:url(#a)}.link{fill:none;stroke:#0f766e;stroke-width:4;marker-end:url(#a)}</style></defs>
  <rect x="1.5" y="1.5" width="1117" height="537" rx="8" fill="#fff" stroke="#d1d5db" stroke-width="3"/><text x="560" y="42" text-anchor="middle" class="h">How an instruction chooses the next PC</text>
  <rect x="55" y="95" width="185" height="85" rx="8" fill="#dbeafe" class="b"/><text x="148" y="132" text-anchor="middle" class="h">Current PC</text><text x="148" y="160" text-anchor="middle" class="t">instruction address</text>
  <rect x="330" y="70" width="225" height="90" rx="8" fill="#ecfdf5" class="b"/><text x="443" y="108" text-anchor="middle" class="h">Sequential</text><text x="443" y="138" text-anchor="middle" class="t">PC + 4</text><rect x="330" y="195" width="225" height="90" rx="8" fill="#fef3c7" class="b"/><text x="443" y="233" text-anchor="middle" class="h">Branch / JAL</text><text x="443" y="263" text-anchor="middle" class="t">PC + signed offset</text><rect x="330" y="320" width="225" height="90" rx="8" fill="#fee2e2" class="b"/><text x="443" y="358" text-anchor="middle" class="h">JALR</text><text x="443" y="388" text-anchor="middle" class="t">(x[rs1] + imm) &amp; ~1</text>
  <path d="M240 138H330" class="w"/><path d="M240 138V240H330" class="w"/><path d="M240 138V365H330" class="w"/>
  <polygon points="690,120 800,240 690,360 580,240" fill="#f8fafc" stroke="#1f2937" stroke-width="3"/><text x="690" y="220" text-anchor="middle" class="h">Next-PC</text><text x="690" y="250" text-anchor="middle" class="h">selection</text><text x="690" y="280" text-anchor="middle" class="t">condition + opcode</text><path d="M555 115H635" class="w"/><path d="M555 240H580" class="take"/><path d="M555 365H635" class="take"/>
  <rect x="875" y="195" width="190" height="90" rx="8" fill="#eef2ff" class="b"/><text x="970" y="233" text-anchor="middle" class="h">Next PC</text><text x="970" y="263" text-anchor="middle" class="t">captured state</text><path d="M800 240H875" class="w"/>
  <path d="M443 410V465H970V285" class="link"/><text x="680" y="492" text-anchor="middle" class="t" fill="#0f766e">JAL/JALR may also write PC + 4 into rd as a return link</text>
</svg>
