<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="700" viewBox="0 0 1420 700" role="img" aria-labelledby="title desc">
  <title id="title">Taken branch redirects fetch and flushes younger instructions</title>
  <desc id="desc">When a branch resolves taken in execute, two younger sequential instructions occupy decode and fetch. Their valid bits are cleared and the next program counter is redirected to the branch target.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker>
    <marker id="redirect" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0f766e"/></marker>
    <style>.body{font-family:"Segoe UI",Arial,sans-serif;fill:#111827}.small{font-family:"Segoe UI",Arial,sans-serif;fill:#4b5563;font-size:16px}.mono{font-family:Consolas,monospace;fill:#111827;font-size:16px}.flow{stroke:#374151;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1420" height="700" fill="#ffffff"/>
  <text x="710" y="43" text-anchor="middle" class="body" font-size="28" font-weight="700">A branch decision changes which in-flight instructions are valid</text>
  <text x="710" y="74" text-anchor="middle" class="small">Example: beq resolves as taken in EX after sequential instructions have already entered IF and ID.</text>

  <rect x="55" y="145" width="230" height="220" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="170" y="185" text-anchor="middle" class="body" font-size="22" font-weight="700" fill="#1d4ed8">IF</text>
  <rect x="83" y="218" width="174" height="78" rx="5" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
  <text x="170" y="249" text-anchor="middle" class="mono">I2: add x8,...</text>
  <text x="170" y="276" text-anchor="middle" class="small">wrong sequential path</text>
  <text x="170" y="333" text-anchor="middle" class="body" font-size="18" font-weight="700" fill="#b91c1c">valid becomes 0</text>

  <rect x="330" y="145" width="230" height="220" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="445" y="185" text-anchor="middle" class="body" font-size="22" font-weight="700" fill="#9a3412">ID</text>
  <rect x="358" y="218" width="174" height="78" rx="5" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
  <text x="445" y="249" text-anchor="middle" class="mono">I1: sub x7,...</text>
  <text x="445" y="276" text-anchor="middle" class="small">wrong sequential path</text>
  <text x="445" y="333" text-anchor="middle" class="body" font-size="18" font-weight="700" fill="#b91c1c">valid becomes 0</text>

  <rect x="605" y="125" width="260" height="260" rx="8" fill="#ecfdf5" stroke="#0f766e" stroke-width="3"/>
  <text x="735" y="169" text-anchor="middle" class="body" font-size="22" font-weight="700" fill="#0f766e">EX</text>
  <rect x="638" y="213" width="194" height="92" rx="5" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <text x="735" y="245" text-anchor="middle" class="mono">I0: beq x5,x0,L</text>
  <text x="735" y="275" text-anchor="middle" class="body" font-size="18" font-weight="700">taken = 1</text>
  <text x="735" y="344" text-anchor="middle" class="mono">target = PC + imm</text>

  <rect x="950" y="145" width="390" height="220" rx="8" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
  <text x="1145" y="185" text-anchor="middle" class="body" font-size="22" font-weight="700" fill="#0f766e">Target-path fetch</text>
  <rect x="990" y="218" width="310" height="78" rx="5" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <text x="1145" y="249" text-anchor="middle" class="mono">L:  sw x9, 0(x10)</text>
  <text x="1145" y="276" text-anchor="middle" class="small">first correct instruction after redirect</text>
  <text x="1145" y="333" text-anchor="middle" class="body" font-size="18" font-weight="700">new fetch PC = target</text>

  <path d="M285 255 H325" class="flow"/><path d="M560 255 H600" class="flow"/>
  <path d="M865 255 H945" stroke="#0f766e" stroke-width="4" fill="none" marker-end="url(#redirect)"/>
  <path d="M735 385 V470 H170 V370" stroke="#b91c1c" stroke-width="3" stroke-dasharray="8 6" fill="none"/>
  <path d="M735 470 H445 V370" stroke="#b91c1c" stroke-width="3" stroke-dasharray="8 6" fill="none"/>
  <text x="460" y="500" text-anchor="middle" class="body" font-size="18" font-weight="700" fill="#991b1b">flush younger instructions</text>

  <rect x="110" y="555" width="1200" height="92" rx="7" fill="#f3f4f6" stroke="#4b5563"/>
  <text x="710" y="590" text-anchor="middle" class="body" font-size="19" font-weight="700">Architectural rule</text>
  <text x="710" y="621" text-anchor="middle" class="small">A flushed instruction may have been fetched or decoded internally, but it must never write a register, update memory, or raise an architecturally visible exception.</text>
</svg>
