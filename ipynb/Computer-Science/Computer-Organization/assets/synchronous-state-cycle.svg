<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc">
  <title id="title">Synchronous state update cycle</title><desc id="desc">Current state and inputs enter combinational next-state logic, whose result is captured by a register on the next clock edge.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#374151"/></marker><style>.h{font:700 25px Arial,sans-serif;fill:#111827}.t{font:19px Arial,sans-serif;fill:#374151}.b{stroke:#1f2937;stroke-width:3}.w{fill:none;stroke:#374151;stroke-width:3;marker-end:url(#a)}.clk{fill:none;stroke:#be123c;stroke-width:4}</style></defs>
  <rect x="1.5" y="1.5" width="1097" height="497" rx="8" fill="#fff" stroke="#d1d5db" stroke-width="3"/><text x="550" y="45" text-anchor="middle" class="h">One synchronous cycle</text>
  <rect x="385" y="120" width="310" height="150" rx="8" fill="#e0f2fe" class="b"/><text x="540" y="175" text-anchor="middle" class="h">Combinational logic</text><text x="540" y="215" text-anchor="middle" class="t">F(state, input)</text><text x="540" y="245" text-anchor="middle" class="t">settles between edges</text>
  <rect x="790" y="120" width="210" height="150" rx="8" fill="#fef3c7" class="b"/><text x="895" y="175" text-anchor="middle" class="h">State register</text><text x="895" y="215" text-anchor="middle" class="t">captures at edge</text>
  <path d="M695 195H790" class="w"/><text x="742" y="180" text-anchor="middle" class="t">next state</text><path d="M1000 195H1040V335H280V225H385" class="w"/><text x="660" y="363" text-anchor="middle" class="t">current state feeds the next cycle</text>
  <path d="M70 170H385" class="w"/><text x="155" y="150" class="t">input X[k]</text><path d="M540 270V315H720" class="w"/><text x="545" y="306" class="t">output Y[k]</text>
  <path d="M775 430h55v-35h55v35h55v-35h55v35h55" class="clk"/><path d="M885 395V270" class="w"/><text x="760" y="438" class="t">active clock edge</text><text x="70" y="465" class="t">S[k+1] = F(S[k], X[k])</text>
</svg>
