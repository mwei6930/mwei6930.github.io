<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">Memory hierarchy balances latency, capacity, bandwidth, and cost</title>
  <desc id="desc">Registers, L1 caches, L2 cache, last-level cache, DRAM, and persistent storage form progressively larger and usually slower levels. Frequently used blocks remain close to the processor while misses continue downward.</desc>
  <defs>
    <marker id="down" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker>
    <marker id="up" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0f766e"/></marker>
    <style>.body{font-family:"Segoe UI",Arial,sans-serif;fill:#111827}.small{font-family:"Segoe UI",Arial,sans-serif;fill:#4b5563;font-size:16px}.mono{font-family:Consolas,monospace;fill:#374151;font-size:15px}.request{stroke:#374151;stroke-width:3;fill:none;marker-end:url(#down)}.fill{stroke:#0f766e;stroke-width:3;stroke-dasharray:8 6;fill:none;marker-end:url(#up)}</style>
  </defs>
  <rect width="1440" height="720" fill="#ffffff"/>
  <text x="720" y="43" text-anchor="middle" class="body" font-size="28" font-weight="700">No single memory technology is simultaneously fastest, largest, and cheapest</text>
  <text x="720" y="74" text-anchor="middle" class="small">The hierarchy keeps a changing subset of lower-level data close to the execution pipeline.</text>

  <rect x="70" y="120" width="205" height="95" rx="7" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="172" y="158" text-anchor="middle" class="body" font-size="21" font-weight="700">CPU registers</text>
  <text x="172" y="188" text-anchor="middle" class="small">architectural operands</text>
  <rect x="330" y="120" width="235" height="95" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="447" y="155" text-anchor="middle" class="body" font-size="21" font-weight="700">L1I and L1D</text>
  <text x="447" y="184" text-anchor="middle" class="small">private, smallest cache level</text>
  <rect x="620" y="120" width="205" height="95" rx="7" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
  <text x="722" y="158" text-anchor="middle" class="body" font-size="21" font-weight="700">L2 cache</text>
  <text x="722" y="188" text-anchor="middle" class="small">larger local working set</text>
  <rect x="880" y="120" width="205" height="95" rx="7" fill="#fefce8" stroke="#a16207" stroke-width="2"/>
  <text x="982" y="158" text-anchor="middle" class="body" font-size="21" font-weight="700">Last-level cache</text>
  <text x="982" y="188" text-anchor="middle" class="small">often shared by cores</text>
  <rect x="1140" y="120" width="230" height="95" rx="7" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="1255" y="158" text-anchor="middle" class="body" font-size="21" font-weight="700">Main memory</text>
  <text x="1255" y="188" text-anchor="middle" class="small">DRAM capacity</text>

  <path d="M275 168 H325" class="request"/><path d="M565 168 H615" class="request"/><path d="M825 168 H875" class="request"/><path d="M1085 168 H1135" class="request"/>
  <text x="720" y="258" text-anchor="middle" class="small">request on a miss</text>
  <path d="M1255 220 V295 H447 V220" class="fill"/>
  <text x="850" y="318" text-anchor="middle" class="small" fill="#0f766e">return a block and retain copies in upper levels</text>

  <rect x="160" y="372" width="1120" height="210" rx="8" fill="#f9fafb" stroke="#9ca3af"/>
  <text x="720" y="410" text-anchor="middle" class="body" font-size="21" font-weight="700">Moving away from the processor</text>
  <line x1="260" y1="458" x2="1180" y2="458" stroke="#374151" stroke-width="3" marker-end="url(#down)"/>
  <text x="260" y="445" text-anchor="middle" class="small">near</text><text x="1180" y="445" text-anchor="middle" class="small">far</text>
  <text x="285" y="500" class="body" font-size="18" font-weight="700" fill="#1d4ed8">latency</text><text x="520" y="500" class="small">usually increases</text>
  <text x="285" y="535" class="body" font-size="18" font-weight="700" fill="#0f766e">capacity</text><text x="520" y="535" class="small">usually increases</text>
  <text x="760" y="500" class="body" font-size="18" font-weight="700" fill="#9a3412">bandwidth per requester</text><text x="1040" y="500" class="small">usually decreases</text>
  <text x="760" y="535" class="body" font-size="18" font-weight="700" fill="#6d28d9">cost per stored bit</text><text x="1040" y="535" class="small">usually decreases</text>

  <rect x="320" y="625" width="800" height="58" rx="6" fill="#ecfdf5" stroke="#0f766e"/>
  <text x="720" y="650" text-anchor="middle" class="body" font-size="18" font-weight="700">Locality makes the compromise useful</text>
  <text x="720" y="674" text-anchor="middle" class="small">Most accesses should hit near the CPU; only a minority should pay the long lower-level path.</text>
</svg>
