<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="455" viewBox="0 0 1120 455" role="img" aria-labelledby="title desc">
  <title id="title">Amdahl's law with accelerator overhead</title><desc id="desc">A baseline execution consists of an unaffected fraction and an enhanced fraction. Acceleration shrinks only the enhanced part while transfer and launch overhead remain.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3 0 6Z" fill="#334155"/></marker></defs>
  <rect width="1120" height="455" rx="18" fill="#f8fafc"/>
  <text x="560" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#172033">Accelerate only what can actually use the enhancement</text>
  <g font-family="Arial, sans-serif">
    <text x="55" y="105" font-size="17" font-weight="700" fill="#172033">Baseline time = 1</text>
    <rect x="55" y="125" width="320" height="68" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="215" y="166" text-anchor="middle" font-size="17" fill="#7f1d1d">Unaffected fraction (1 - F)</text>
    <rect x="375" y="125" width="690" height="68" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="720" y="166" text-anchor="middle" font-size="17" fill="#1e3a8a">Enhanceable fraction F</text>
    <path d="M720 205 V248" stroke="#334155" stroke-width="3" marker-end="url(#a)"/>
    <text x="55" y="292" font-size="17" font-weight="700" fill="#172033">After enhancement</text>
    <rect x="55" y="312" width="320" height="68" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="215" y="353" text-anchor="middle" font-size="17" fill="#7f1d1d">1 - F</text>
    <rect x="375" y="312" width="180" height="68" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="465" y="353" text-anchor="middle" font-size="17" fill="#1e3a8a">F / S_e</text>
    <rect x="555" y="312" width="205" height="68" rx="7" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="658" y="353" text-anchor="middle" font-size="17" fill="#78350f">overhead O</text>
    <line x1="760" y1="346" x2="1065" y2="346" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="913" y="330" text-anchor="middle" font-size="14" fill="#64748b">time removed by acceleration</text>
  </g>
  <text x="560" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#334155">Total speedup = 1 / ((1 - F) + F / S_e + O)</text>
</svg>
