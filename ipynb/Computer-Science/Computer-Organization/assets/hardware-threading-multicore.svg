<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="810" viewBox="0 0 1500 810" role="img" aria-labelledby="title desc">
  <title id="title">Hardware multithreading and multicore compared</title>
  <desc id="desc">Three panels compare interleaved multithreading on one core, simultaneous multithreading sharing issue slots, and multicore execution using separate cores.</desc>
  <defs><style>.body{font-family:"Segoe UI",Arial,sans-serif;fill:#111827}.small{font-family:"Segoe UI",Arial,sans-serif;fill:#4b5563;font-size:15px}.mono{font-family:Consolas,monospace;fill:#111827;font-size:14px}</style></defs>
  <rect width="1500" height="810" fill="#ffffff"/>
  <text x="750" y="44" text-anchor="middle" class="body" font-size="29" font-weight="700">Threads can share time, issue width, or whole cores</text>
  <text x="750" y="75" text-anchor="middle" class="small">Each hardware thread needs architectural state; the main difference is how execution resources are shared.</text>

  <rect x="45" y="125" width="440" height="570" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="265" y="168" text-anchor="middle" class="body" font-size="21" font-weight="700">Interleaved multithreading</text>
  <text x="265" y="198" text-anchor="middle" class="small">one thread issues in each cycle</text>
  <g><rect x="100" y="245" width="330" height="54" fill="#ffffff" stroke="#6b7280"/><rect x="100" y="299" width="330" height="54" fill="#ffffff" stroke="#6b7280"/><rect x="100" y="353" width="330" height="54" fill="#ffffff" stroke="#6b7280"/><rect x="100" y="407" width="330" height="54" fill="#ffffff" stroke="#6b7280"/><rect x="100" y="461" width="330" height="54" fill="#ffffff" stroke="#6b7280"/></g>
  <g text-anchor="middle" class="mono"><text x="265" y="278">cycle 1: thread A</text><text x="265" y="332">cycle 2: thread B</text><text x="265" y="386">cycle 3: thread A</text><text x="265" y="440">cycle 4: thread C</text><text x="265" y="494">cycle 5: thread B</text></g>
  <text x="265" y="558" text-anchor="middle" class="body" font-size="17" font-weight="700">hides long stalls</text><text x="265" y="586" text-anchor="middle" class="small">but one thread uses the pipeline per cycle</text>
  <text x="265" y="642" text-anchor="middle" class="small">replicated: PC + registers</text><text x="265" y="668" text-anchor="middle" class="small">shared: pipeline + caches</text>

  <rect x="530" y="125" width="440" height="570" rx="8" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
  <text x="750" y="168" text-anchor="middle" class="body" font-size="21" font-weight="700">Simultaneous multithreading</text>
  <text x="750" y="198" text-anchor="middle" class="small">different threads fill unused issue slots</text>
  <g fill="#ffffff" stroke="#6b7280"><rect x="600" y="245" width="300" height="64"/><rect x="600" y="325" width="300" height="64"/><rect x="600" y="405" width="300" height="64"/><rect x="600" y="485" width="300" height="64"/></g>
  <g><rect x="610" y="255" width="88" height="44" rx="4" fill="#dbeafe" stroke="#2563eb"/><rect x="705" y="255" width="88" height="44" rx="4" fill="#dcfce7" stroke="#16a34a"/><rect x="800" y="255" width="88" height="44" rx="4" fill="#f3e8ff" stroke="#7c3aed"/><rect x="610" y="335" width="88" height="44" rx="4" fill="#dcfce7" stroke="#16a34a"/><rect x="705" y="335" width="88" height="44" rx="4" fill="#dbeafe" stroke="#2563eb"/><rect x="800" y="335" width="88" height="44" rx="4" fill="#f9fafb" stroke="#9ca3af"/><rect x="610" y="415" width="88" height="44" rx="4" fill="#f3e8ff" stroke="#7c3aed"/><rect x="705" y="415" width="88" height="44" rx="4" fill="#dcfce7" stroke="#16a34a"/><rect x="800" y="415" width="88" height="44" rx="4" fill="#dbeafe" stroke="#2563eb"/><rect x="610" y="495" width="88" height="44" rx="4" fill="#dbeafe" stroke="#2563eb"/><rect x="705" y="495" width="88" height="44" rx="4" fill="#f9fafb" stroke="#9ca3af"/><rect x="800" y="495" width="88" height="44" rx="4" fill="#dcfce7" stroke="#16a34a"/></g>
  <g text-anchor="middle" class="mono"><text x="654" y="282">A</text><text x="749" y="282">B</text><text x="844" y="282">C</text><text x="654" y="362">B</text><text x="749" y="362">A</text><text x="844" y="362">idle</text><text x="654" y="442">C</text><text x="749" y="442">B</text><text x="844" y="442">A</text><text x="654" y="522">A</text><text x="749" y="522">idle</text><text x="844" y="522">B</text></g>
  <text x="750" y="586" text-anchor="middle" class="body" font-size="17" font-weight="700">improves utilization</text><text x="750" y="614" text-anchor="middle" class="small">but threads contend for issue, cache, and bandwidth</text>
  <text x="750" y="662" text-anchor="middle" class="small">replicated: PC + registers</text><text x="750" y="688" text-anchor="middle" class="small">shared: most core resources</text>

  <rect x="1015" y="125" width="440" height="570" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="1235" y="168" text-anchor="middle" class="body" font-size="21" font-weight="700">Multicore</text>
  <text x="1235" y="198" text-anchor="middle" class="small">threads execute on separate cores</text>
  <g fill="#ffffff" stroke="#7c3aed" stroke-width="2"><rect x="1080" y="248" width="140" height="125" rx="7"/><rect x="1250" y="248" width="140" height="125" rx="7"/><rect x="1080" y="402" width="140" height="125" rx="7"/><rect x="1250" y="402" width="140" height="125" rx="7"/></g>
  <g text-anchor="middle" class="body" font-size="17" font-weight="700"><text x="1150" y="291">Core 0</text><text x="1320" y="291">Core 1</text><text x="1150" y="445">Core 2</text><text x="1320" y="445">Core 3</text></g>
  <g text-anchor="middle" class="mono"><text x="1150" y="331">thread A</text><text x="1320" y="331">thread B</text><text x="1150" y="485">thread C</text><text x="1320" y="485">thread D</text></g>
  <rect x="1080" y="565" width="310" height="72" rx="6" fill="#ede9fe" stroke="#7c3aed"/><text x="1235" y="595" text-anchor="middle" class="body" font-size="16" font-weight="700">shared last-level cache / memory</text><text x="1235" y="620" text-anchor="middle" class="small">coherence and synchronization required</text>
  <text x="750" y="765" text-anchor="middle" class="body" font-size="18" font-weight="700">SMT increases utilization within a core; multicore increases execution capacity but makes communication visible.</text>
</svg>
