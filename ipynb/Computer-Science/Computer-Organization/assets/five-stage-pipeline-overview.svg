<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780" role="img" aria-labelledby="title desc">
  <title id="title">Five-stage RISC-V pipeline overview</title>
  <desc id="desc">Instruction fetch, decode, execute, memory, and write-back stages are separated by four pipeline registers that carry data and control signals.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker>
    <marker id="ctrl" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#c2410c"/></marker>
    <style>.body{font-family:"Segoe UI",Arial,sans-serif;fill:#111827}.small{font-family:"Segoe UI",Arial,sans-serif;fill:#4b5563;font-size:14px}.mono{font-family:Consolas,monospace;fill:#374151;font-size:13px}.data{stroke:#374151;stroke-width:3;fill:none;marker-end:url(#arrow)}.control{stroke:#c2410c;stroke-width:2.5;stroke-dasharray:8 6;fill:none;marker-end:url(#ctrl)}</style>
  </defs>
  <rect width="1600" height="780" fill="#ffffff"/>
  <text x="800" y="42" text-anchor="middle" class="body" font-size="27" font-weight="700">Five instructions can occupy five different stages in the same cycle</text>
  <text x="800" y="70" text-anchor="middle" class="small">Pipeline registers isolate stage timing and keep each instruction's values and control together.</text>

  <rect x="35" y="115" width="245" height="515" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="157" y="153" text-anchor="middle" class="body" font-size="23" font-weight="700" fill="#1d4ed8">IF</text>
  <text x="157" y="181" text-anchor="middle" class="body" font-size="17" font-weight="600">Instruction Fetch</text>
  <rect x="70" y="230" width="175" height="78" rx="6" fill="#ffffff" stroke="#2563eb"/><text x="157" y="263" text-anchor="middle" class="body" font-size="17" font-weight="700">PC</text><text x="157" y="289" text-anchor="middle" class="mono">current fetch address</text>
  <rect x="70" y="355" width="175" height="90" rx="6" fill="#ffffff" stroke="#a16207"/><text x="157" y="388" text-anchor="middle" class="body" font-size="17" font-weight="700">Instruction cache</text><text x="157" y="416" text-anchor="middle" class="mono">Instr = I$[PC]</text>
  <rect x="70" y="492" width="175" height="78" rx="6" fill="#ffffff" stroke="#0f766e"/><text x="157" y="524" text-anchor="middle" class="body" font-size="17" font-weight="700">Next-PC logic</text><text x="157" y="550" text-anchor="middle" class="mono">prediction / PC+4</text>

  <rect x="300" y="100" width="70" height="545" rx="5" fill="#f3f4f6" stroke="#4b5563" stroke-width="2"/>
  <text x="335" y="365" text-anchor="middle" class="body" font-size="16" font-weight="700" transform="rotate(-90 335 365)">IF / ID</text>
  <text x="335" y="600" text-anchor="middle" class="mono" transform="rotate(-90 335 600)">valid, PC, instruction</text>

  <rect x="390" y="115" width="245" height="515" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="512" y="153" text-anchor="middle" class="body" font-size="23" font-weight="700" fill="#9a3412">ID</text>
  <text x="512" y="181" text-anchor="middle" class="body" font-size="17" font-weight="600">Decode and Register Read</text>
  <rect x="425" y="230" width="175" height="90" rx="6" fill="#ffffff" stroke="#c2410c"/><text x="512" y="263" text-anchor="middle" class="body" font-size="17" font-weight="700">Decoder</text><text x="512" y="291" text-anchor="middle" class="mono">control + immediate</text>
  <rect x="425" y="365" width="175" height="90" rx="6" fill="#ffffff" stroke="#2563eb"/><text x="512" y="398" text-anchor="middle" class="body" font-size="17" font-weight="700">Register file</text><text x="512" y="426" text-anchor="middle" class="mono">R[rs1], R[rs2]</text>
  <rect x="425" y="500" width="175" height="74" rx="6" fill="#ffffff" stroke="#c2410c"/><text x="512" y="531" text-anchor="middle" class="body" font-size="17" font-weight="700">Hazard unit</text><text x="512" y="556" text-anchor="middle" class="mono">stall / flush</text>

  <rect x="655" y="100" width="70" height="545" rx="5" fill="#f3f4f6" stroke="#4b5563" stroke-width="2"/>
  <text x="690" y="365" text-anchor="middle" class="body" font-size="16" font-weight="700" transform="rotate(-90 690 365)">ID / EX</text>
  <text x="690" y="600" text-anchor="middle" class="mono" transform="rotate(-90 690 600)">operands, imm, rd, control</text>

  <rect x="745" y="115" width="245" height="515" rx="8" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
  <text x="867" y="153" text-anchor="middle" class="body" font-size="23" font-weight="700" fill="#0f766e">EX</text>
  <text x="867" y="181" text-anchor="middle" class="body" font-size="17" font-weight="600">Execute</text>
  <rect x="780" y="230" width="175" height="92" rx="6" fill="#ffffff" stroke="#0f766e"/><text x="867" y="264" text-anchor="middle" class="body" font-size="18" font-weight="700">ALU</text><text x="867" y="292" text-anchor="middle" class="mono">result / address</text>
  <rect x="780" y="365" width="175" height="92" rx="6" fill="#ffffff" stroke="#0f766e"/><text x="867" y="399" text-anchor="middle" class="body" font-size="17" font-weight="700">Branch unit</text><text x="867" y="427" text-anchor="middle" class="mono">compare + target</text>
  <rect x="780" y="500" width="175" height="74" rx="6" fill="#ffffff" stroke="#c2410c"/><text x="867" y="531" text-anchor="middle" class="body" font-size="17" font-weight="700">Forward MUXes</text><text x="867" y="556" text-anchor="middle" class="mono">fresh operands</text>

  <rect x="1010" y="100" width="70" height="545" rx="5" fill="#f3f4f6" stroke="#4b5563" stroke-width="2"/>
  <text x="1045" y="365" text-anchor="middle" class="body" font-size="16" font-weight="700" transform="rotate(-90 1045 365)">EX / MEM</text>
  <text x="1045" y="600" text-anchor="middle" class="mono" transform="rotate(-90 1045 600)">ALU result, store data, rd, control</text>

  <rect x="1100" y="115" width="210" height="515" rx="8" fill="#fefce8" stroke="#a16207" stroke-width="2"/>
  <text x="1205" y="153" text-anchor="middle" class="body" font-size="23" font-weight="700" fill="#854d0e">MEM</text>
  <text x="1205" y="181" text-anchor="middle" class="body" font-size="17" font-weight="600">Memory Access</text>
  <rect x="1128" y="270" width="154" height="125" rx="6" fill="#ffffff" stroke="#a16207"/>
  <text x="1205" y="307" text-anchor="middle" class="body" font-size="17" font-weight="700">Data cache</text>
  <text x="1205" y="337" text-anchor="middle" class="mono">load / store</text>
  <text x="1205" y="365" text-anchor="middle" class="mono">or pass ALU result</text>
  <text x="1205" y="470" text-anchor="middle" class="small">Only memory instructions</text>
  <text x="1205" y="493" text-anchor="middle" class="small">use the cache operation.</text>

  <rect x="1330" y="100" width="70" height="545" rx="5" fill="#f3f4f6" stroke="#4b5563" stroke-width="2"/>
  <text x="1365" y="365" text-anchor="middle" class="body" font-size="16" font-weight="700" transform="rotate(-90 1365 365)">MEM / WB</text>
  <text x="1365" y="600" text-anchor="middle" class="mono" transform="rotate(-90 1365 600)">result, rd, RegWrite</text>

  <rect x="1420" y="115" width="145" height="515" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="1492" y="153" text-anchor="middle" class="body" font-size="23" font-weight="700" fill="#7c3aed">WB</text>
  <text x="1492" y="181" text-anchor="middle" class="body" font-size="17" font-weight="600">Write-Back</text>
  <path d="M1445 290 l70 0 l25 42 l-25 42 l-70 0 z" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="1480" y="324" text-anchor="middle" class="body" font-size="16" font-weight="700">Result</text><text x="1480" y="349" text-anchor="middle" class="mono">MUX</text>
  <text x="1492" y="440" text-anchor="middle" class="mono">R[rd] write</text>

  <line x1="280" y1="390" x2="298" y2="390" class="data"/><line x1="370" y1="390" x2="388" y2="390" class="data"/><line x1="635" y1="390" x2="653" y2="390" class="data"/><line x1="725" y1="390" x2="743" y2="390" class="data"/><line x1="990" y1="390" x2="1008" y2="390" class="data"/><line x1="1080" y1="390" x2="1098" y2="390" class="data"/><line x1="1310" y1="390" x2="1328" y2="390" class="data"/><line x1="1400" y1="390" x2="1418" y2="390" class="data"/>
  <path d="M1492 440 V700 H512 V457" class="data"/>
  <text x="920" y="724" text-anchor="middle" class="small">write-back returns to the register file; forwarding may use the value earlier</text>
  <path d="M600 270 H650 V690 H880 V574" class="control"/>
  <text x="695" y="675" class="small" fill="#9a3412">decoded control travels with the instruction</text>
</svg>
