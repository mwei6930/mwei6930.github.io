<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="820" viewBox="0 0 1580 820" role="img" aria-labelledby="title desc">
  <title id="title">Four-way cache lookup using tag, set index, and block offset</title>
  <desc id="desc">A 32-bit address for a 32 KiB four-way cache with 64-byte blocks is divided into a 19-bit tag, 7-bit set index, and 6-bit offset. The index selects set 47, four stored tags are compared in parallel, and the offset selects bytes from the matching block.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker>
    <marker id="hit" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0f766e"/></marker>
    <style>.body{font-family:"Segoe UI",Arial,sans-serif;fill:#111827}.small{font-family:"Segoe UI",Arial,sans-serif;fill:#4b5563;font-size:15px}.mono{font-family:Consolas,monospace;fill:#111827;font-size:16px}.line{stroke:#374151;stroke-width:3;fill:none;marker-end:url(#arrow)}.hitline{stroke:#0f766e;stroke-width:4;fill:none;marker-end:url(#hit)}</style>
  </defs>
  <rect width="1580" height="820" fill="#ffffff"/>
  <text x="790" y="43" text-anchor="middle" class="body" font-size="28" font-weight="700">Address decomposition turns one memory request into a set lookup and tag check</text>
  <text x="790" y="74" text-anchor="middle" class="small">Example cache: 32 KiB data capacity, 64-byte blocks, four ways, 32-bit byte addresses.</text>

  <text x="65" y="138" class="body" font-size="20" font-weight="700">Address 0x1234ABCD</text>
  <rect x="65" y="165" width="610" height="92" rx="6" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <rect x="65" y="165" width="360" height="92" fill="#ede9fe" stroke="#7c3aed"/>
  <rect x="425" y="165" width="135" height="92" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="560" y="165" width="115" height="92" fill="#d1fae5" stroke="#0f766e"/>
  <text x="245" y="199" text-anchor="middle" class="body" font-size="19" font-weight="700">Tag: 19 bits</text><text x="245" y="230" text-anchor="middle" class="mono">0x91A5</text>
  <text x="492" y="199" text-anchor="middle" class="body" font-size="19" font-weight="700">Index: 7</text><text x="492" y="230" text-anchor="middle" class="mono">47</text>
  <text x="617" y="199" text-anchor="middle" class="body" font-size="19" font-weight="700">Offset: 6</text><text x="617" y="230" text-anchor="middle" class="mono">13</text>

  <rect x="760" y="115" width="740" height="530" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
  <text x="1130" y="154" text-anchor="middle" class="body" font-size="22" font-weight="700">Selected set 47: compare all four ways in parallel</text>
  <g transform="translate(810 205)">
    <rect x="0" y="0" width="640" height="82" rx="5" fill="#ffffff" stroke="#9ca3af"/>
    <text x="32" y="34" class="body" font-size="17" font-weight="700">V</text><text x="86" y="34" class="body" font-size="17" font-weight="700">Tag</text><text x="250" y="34" class="body" font-size="17" font-weight="700">64-byte data block</text><text x="560" y="34" class="body" font-size="17" font-weight="700">state</text>
    <text x="32" y="67" class="mono">1</text><text x="86" y="67" class="mono">0x91A2</text><text x="250" y="67" class="mono">bytes from another block...</text><text x="560" y="67" class="small">clean</text>
    <rect x="0" y="100" width="640" height="82" rx="5" fill="#ecfdf5" stroke="#0f766e" stroke-width="3"/>
    <text x="32" y="150" class="mono">1</text><text x="86" y="150" class="mono" font-weight="700">0x91A5</text><text x="250" y="150" class="mono">... byte[13] ...</text><text x="560" y="150" class="small">dirty</text>
    <rect x="0" y="200" width="640" height="82" rx="5" fill="#ffffff" stroke="#9ca3af"/>
    <text x="32" y="250" class="mono">1</text><text x="86" y="250" class="mono">0x6C10</text><text x="250" y="250" class="mono">bytes from another block...</text><text x="560" y="250" class="small">clean</text>
    <rect x="0" y="300" width="640" height="82" rx="5" fill="#ffffff" stroke="#9ca3af"/>
    <text x="32" y="350" class="mono">0</text><text x="86" y="350" class="mono">--</text><text x="250" y="350" class="mono">invalid line</text><text x="560" y="350" class="small">empty</text>
  </g>

  <path d="M492 257 V690 H900 V645" class="line"/>
  <text x="685" y="711" text-anchor="middle" class="small">index chooses exactly one set</text>
  <path d="M245 257 V330 H780" class="line"/>
  <text x="510" y="317" text-anchor="middle" class="small">requested tag feeds four comparators</text>
  <path d="M1450 346 H1520 V720 H1030 V650" class="hitline"/>
  <text x="1265" y="746" text-anchor="middle" class="body" font-size="18" font-weight="700" fill="#0f766e">valid AND matching tag = hit</text>
  <path d="M617 257 V755 H1390 V648" class="line"/>
  <text x="1000" y="782" text-anchor="middle" class="small">offset selects byte 13 only after the containing line is identified</text>

  <rect x="75" y="405" width="570" height="188" rx="7" fill="#eff6ff" stroke="#2563eb"/>
  <text x="360" y="441" text-anchor="middle" class="body" font-size="19" font-weight="700">Where the field sizes come from</text>
  <text x="115" y="482" class="mono">sets = 32 KiB / (64 B x 4) = 128</text>
  <text x="115" y="519" class="mono">offset bits = log2(64) = 6</text>
  <text x="115" y="556" class="mono">index bits  = log2(128) = 7</text>
  <text x="115" y="583" class="mono">tag bits    = 32 - 7 - 6 = 19</text>
</svg>
