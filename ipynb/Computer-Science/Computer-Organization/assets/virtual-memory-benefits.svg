<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
  <title id="title">Why virtual memory sits between programs and physical memory</title>
  <desc id="desc">Two processes use simple private virtual address spaces. The memory management unit maps their pages to scattered physical frames, permits a shared read-only frame, and leaves inactive pages in backing storage.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker>
    <style>.body{font-family:"Segoe UI",Arial,sans-serif;fill:#111827}.small{font-family:"Segoe UI",Arial,sans-serif;fill:#4b5563;font-size:15px}.mono{font-family:Consolas,monospace;fill:#111827;font-size:15px}.line{stroke:#374151;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1500" height="760" fill="#ffffff"/>
  <text x="750" y="42" text-anchor="middle" class="body" font-size="28" font-weight="700">Virtual memory separates view from placement</text>
  <text x="750" y="72" text-anchor="middle" class="small">A virtual page is a name inside one address space; a physical frame is storage in RAM.</text>

  <rect x="55" y="120" width="330" height="420" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="220" y="154" text-anchor="middle" class="body" font-size="22" font-weight="700">Process A virtual space</text>
  <g class="mono">
    <rect x="105" y="190" width="230" height="58" fill="#dbeafe" stroke="#2563eb"/><text x="220" y="225" text-anchor="middle">VPN 0: code (R-X)</text>
    <rect x="105" y="258" width="230" height="58" fill="#dcfce7" stroke="#16a34a"/><text x="220" y="293" text-anchor="middle">VPN 1: data (RW-)</text>
    <rect x="105" y="326" width="230" height="58" fill="#fef3c7" stroke="#d97706"/><text x="220" y="361" text-anchor="middle">VPN 2: shared (R--)</text>
    <rect x="105" y="394" width="230" height="58" fill="#f3f4f6" stroke="#9ca3af" stroke-dasharray="7 5"/><text x="220" y="429" text-anchor="middle">VPN 3: not resident</text>
  </g>

  <rect x="1115" y="120" width="330" height="420" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="1280" y="154" text-anchor="middle" class="body" font-size="22" font-weight="700">Process B virtual space</text>
  <g class="mono">
    <rect x="1165" y="190" width="230" height="58" fill="#ede9fe" stroke="#7c3aed"/><text x="1280" y="225" text-anchor="middle">VPN 0: code (R-X)</text>
    <rect x="1165" y="258" width="230" height="58" fill="#fee2e2" stroke="#dc2626"/><text x="1280" y="293" text-anchor="middle">VPN 1: data (RW-)</text>
    <rect x="1165" y="326" width="230" height="58" fill="#fef3c7" stroke="#d97706"/><text x="1280" y="361" text-anchor="middle">VPN 2: shared (R--)</text>
    <rect x="1165" y="394" width="230" height="58" fill="#f3f4f6" stroke="#9ca3af" stroke-dasharray="7 5"/><text x="1280" y="429" text-anchor="middle">unused range</text>
  </g>

  <rect x="525" y="105" width="450" height="475" rx="8" fill="#f9fafb" stroke="#374151" stroke-width="2"/>
  <text x="750" y="139" text-anchor="middle" class="body" font-size="22" font-weight="700">Physical memory frames</text>
  <text x="750" y="165" text-anchor="middle" class="small">Frames may be scattered; physical placement is hidden from the process.</text>
  <g class="mono">
    <rect x="610" y="194" width="280" height="50" fill="#fee2e2" stroke="#dc2626"/><text x="750" y="225" text-anchor="middle">PFN 9: B data</text>
    <rect x="610" y="252" width="280" height="50" fill="#dbeafe" stroke="#2563eb"/><text x="750" y="283" text-anchor="middle">PFN 12: A code</text>
    <rect x="610" y="310" width="280" height="50" fill="#f3f4f6" stroke="#9ca3af"/><text x="750" y="341" text-anchor="middle">PFN 13: free</text>
    <rect x="610" y="368" width="280" height="50" fill="#fef3c7" stroke="#d97706"/><text x="750" y="399" text-anchor="middle">PFN 27: shared page</text>
    <rect x="610" y="426" width="280" height="50" fill="#dcfce7" stroke="#16a34a"/><text x="750" y="457" text-anchor="middle">PFN 41: A data</text>
    <rect x="610" y="484" width="280" height="50" fill="#ede9fe" stroke="#7c3aed"/><text x="750" y="515" text-anchor="middle">PFN 52: B code</text>
  </g>

  <path d="M335 219 C450 219 480 277 610 277" class="line"/><path d="M335 287 C460 287 490 451 610 451" class="line"/>
  <path d="M335 355 C455 355 500 393 610 393" class="line"/>
  <path d="M1165 219 C1050 219 1010 509 890 509" class="line"/><path d="M1165 287 C1040 287 1010 219 890 219" class="line"/>
  <path d="M1165 355 C1045 355 1000 393 890 393" class="line"/>

  <rect x="55" y="625" width="330" height="90" rx="7" fill="#ecfdf5" stroke="#0f766e"/><text x="220" y="658" text-anchor="middle" class="body" font-size="18" font-weight="700">Isolation and protection</text><text x="220" y="686" text-anchor="middle" class="small">one process cannot name another's private frame</text>
  <rect x="405" y="625" width="330" height="90" rx="7" fill="#eff6ff" stroke="#2563eb"/><text x="570" y="658" text-anchor="middle" class="body" font-size="18" font-weight="700">Relocation</text><text x="570" y="686" text-anchor="middle" class="small">virtual addresses stay stable as frames move</text>
  <rect x="755" y="625" width="330" height="90" rx="7" fill="#fff7ed" stroke="#ea580c"/><text x="920" y="658" text-anchor="middle" class="body" font-size="18" font-weight="700">Demand allocation</text><text x="920" y="686" text-anchor="middle" class="small">only actively needed pages require RAM</text>
  <rect x="1105" y="625" width="330" height="90" rx="7" fill="#f5f3ff" stroke="#7c3aed"/><text x="1270" y="658" text-anchor="middle" class="body" font-size="18" font-weight="700">Controlled sharing</text><text x="1270" y="686" text-anchor="middle" class="small">different VPNs can name one shared frame</text>
</svg>
