<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
  <title id="title">Protection and sharing through page-table mappings</title>
  <desc id="desc">Two user processes map one shared executable frame as read-execute, map a shared copy-on-write frame as read-only, keep separate private read-write data frames, and cannot access a supervisor-only kernel frame.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker><style>.body{font-family:"Segoe UI",Arial,sans-serif;fill:#111827}.small{font-family:"Segoe UI",Arial,sans-serif;fill:#4b5563;font-size:15px}.mono{font-family:Consolas,monospace;fill:#111827;font-size:15px}.line{stroke:#374151;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1500" height="760" fill="#ffffff"/>
  <text x="750" y="42" text-anchor="middle" class="body" font-size="28" font-weight="700">Mappings combine sharing and protection</text>
  <text x="750" y="72" text-anchor="middle" class="small">Sharing does not bypass protection: every mapping to a shared frame carries its own allowed operations.</text>
  <rect x="55" y="120" width="370" height="470" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="240" y="156" text-anchor="middle" class="body" font-size="22" font-weight="700">Process A mappings</text>
  <g class="mono"><rect x="105" y="200" width="270" height="58" fill="#dbeafe" stroke="#2563eb"/><text x="240" y="225" text-anchor="middle">code VPN 0x100</text><text x="240" y="247" text-anchor="middle">U=1 R=1 W=0 X=1</text><rect x="105" y="285" width="270" height="58" fill="#fef3c7" stroke="#d97706"/><text x="240" y="310" text-anchor="middle">COW VPN 0x200</text><text x="240" y="332" text-anchor="middle">U=1 R=1 W=0 X=0</text><rect x="105" y="370" width="270" height="58" fill="#dcfce7" stroke="#16a34a"/><text x="240" y="395" text-anchor="middle">data VPN 0x300</text><text x="240" y="417" text-anchor="middle">U=1 R=1 W=1 X=0</text><rect x="105" y="455" width="270" height="58" fill="#fee2e2" stroke="#dc2626"/><text x="240" y="480" text-anchor="middle">kernel VPN 0xF00</text><text x="240" y="502" text-anchor="middle">U=0 R=1 W=1 X=1</text></g>
  <rect x="1075" y="120" width="370" height="470" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="1260" y="156" text-anchor="middle" class="body" font-size="22" font-weight="700">Process B mappings</text>
  <g class="mono"><rect x="1125" y="200" width="270" height="58" fill="#dbeafe" stroke="#2563eb"/><text x="1260" y="225" text-anchor="middle">code VPN 0x500</text><text x="1260" y="247" text-anchor="middle">U=1 R=1 W=0 X=1</text><rect x="1125" y="285" width="270" height="58" fill="#fef3c7" stroke="#d97706"/><text x="1260" y="310" text-anchor="middle">COW VPN 0x600</text><text x="1260" y="332" text-anchor="middle">U=1 R=1 W=0 X=0</text><rect x="1125" y="370" width="270" height="58" fill="#ede9fe" stroke="#7c3aed"/><text x="1260" y="395" text-anchor="middle">data VPN 0x700</text><text x="1260" y="417" text-anchor="middle">U=1 R=1 W=1 X=0</text><rect x="1125" y="455" width="270" height="58" fill="#fee2e2" stroke="#dc2626"/><text x="1260" y="480" text-anchor="middle">kernel VPN 0xF00</text><text x="1260" y="502" text-anchor="middle">U=0 R=1 W=1 X=1</text></g>
  <rect x="560" y="110" width="380" height="500" rx="8" fill="#f9fafb" stroke="#374151" stroke-width="2"/><text x="750" y="147" text-anchor="middle" class="body" font-size="22" font-weight="700">Physical frames</text>
  <g class="mono"><rect x="625" y="190" width="250" height="58" fill="#dbeafe" stroke="#2563eb"/><text x="750" y="226" text-anchor="middle">shared code frame</text><rect x="625" y="285" width="250" height="58" fill="#fef3c7" stroke="#d97706"/><text x="750" y="321" text-anchor="middle">shared COW frame</text><rect x="625" y="380" width="250" height="58" fill="#dcfce7" stroke="#16a34a"/><text x="750" y="416" text-anchor="middle">A private data</text><rect x="625" y="475" width="250" height="58" fill="#ede9fe" stroke="#7c3aed"/><text x="750" y="511" text-anchor="middle">B private data</text><rect x="625" y="550" width="250" height="42" fill="#fee2e2" stroke="#dc2626"/><text x="750" y="577" text-anchor="middle">kernel frame</text></g>
  <path d="M375 229 C470 229 520 219 625 219" class="line"/><path d="M1125 229 C1030 229 980 219 875 219" class="line"/><path d="M375 314 C470 314 520 314 625 314" class="line"/><path d="M1125 314 C1030 314 980 314 875 314" class="line"/><path d="M375 399 C480 399 520 409 625 409" class="line"/><path d="M1125 399 C1020 399 980 504 875 504" class="line"/>
  <path d="M375 484 C500 484 520 571 625 571" class="line"/><path d="M1125 484 C1000 484 980 571 875 571" class="line"/>
  <rect x="150" y="650" width="1200" height="72" rx="7" fill="#fff7ed" stroke="#ea580c"/><text x="750" y="680" text-anchor="middle" class="body" font-size="18" font-weight="700">A write to the read-only COW page faults; the OS copies the frame and installs a private writable mapping.</text><text x="750" y="706" text-anchor="middle" class="small">A user access to the supervisor-only frame is a protection violation even though a valid physical frame exists.</text>
</svg>
