<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">Load and store datapath traces</title>
  <desc id="desc">A load computes an address, reads memory, and writes a register, while a store computes the same style of address and writes a register value to memory without register write-back.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker></defs>
  <rect width="1400" height="650" fill="#ffffff"/>
  <text x="700" y="40" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#111827">Loads and stores share address generation, then diverge</text>

  <rect x="40" y="85" width="1320" height="230" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="70" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#1d4ed8">Load: lw x5, 12(x6)</text>
  <text x="70" y="145" font-family="Consolas, monospace" font-size="15" fill="#4b5563">R[6] = 0x2000; Mem32[0x200C] = 37</text>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="85" y="180" width="175" height="78" rx="6" fill="#ffffff" stroke="#2563eb"/><text x="172" y="211" text-anchor="middle" font-size="17" font-weight="700">Register read</text><text x="172" y="239" text-anchor="middle" font-family="Consolas, monospace" font-size="15">A = 0x2000</text>
    <rect x="330" y="180" width="175" height="78" rx="6" fill="#ffffff" stroke="#0f766e"/><text x="417" y="211" text-anchor="middle" font-size="17" font-weight="700">Immediate</text><text x="417" y="239" text-anchor="middle" font-family="Consolas, monospace" font-size="15">Imm = 12</text>
    <rect x="575" y="180" width="185" height="78" rx="6" fill="#ffffff" stroke="#0f766e"/><text x="667" y="211" text-anchor="middle" font-size="17" font-weight="700">Address ALU</text><text x="667" y="239" text-anchor="middle" font-family="Consolas, monospace" font-size="15">0x2000 + 12</text>
    <rect x="830" y="180" width="185" height="78" rx="6" fill="#ffffff" stroke="#a16207"/><text x="922" y="211" text-anchor="middle" font-size="17" font-weight="700">Memory read</text><text x="922" y="239" text-anchor="middle" font-family="Consolas, monospace" font-size="15">RD = 37</text>
    <rect x="1085" y="180" width="200" height="78" rx="6" fill="#ffffff" stroke="#c2410c"/><text x="1185" y="211" text-anchor="middle" font-size="17" font-weight="700">Register write</text><text x="1185" y="239" text-anchor="middle" font-family="Consolas, monospace" font-size="15">R[5] &#8592; 37</text>
  </g>
  <line x1="260" y1="219" x2="573" y2="219" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="505" y1="245" x2="573" y2="245" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="760" y1="219" x2="828" y2="219" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="1015" y1="219" x2="1083" y2="219" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="700" y="293" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#374151">RegWrite=1  ALUSrc=Imm  MemWrite=0  ResultSrc=Memory  ALUControl=ADD</text>

  <rect x="40" y="345" width="1320" height="230" rx="8" fill="#fefce8" stroke="#a16207" stroke-width="2"/>
  <text x="70" y="380" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#854d0e">Store: sw x7, 12(x6)</text>
  <text x="70" y="405" font-family="Consolas, monospace" font-size="15" fill="#4b5563">R[6] = 0x2000; R[7] = 37</text>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="85" y="440" width="175" height="78" rx="6" fill="#ffffff" stroke="#2563eb"/><text x="172" y="469" text-anchor="middle" font-size="17" font-weight="700">Register reads</text><text x="172" y="497" text-anchor="middle" font-family="Consolas, monospace" font-size="15">A=0x2000 B=37</text>
    <rect x="330" y="440" width="175" height="78" rx="6" fill="#ffffff" stroke="#0f766e"/><text x="417" y="469" text-anchor="middle" font-size="17" font-weight="700">Immediate</text><text x="417" y="497" text-anchor="middle" font-family="Consolas, monospace" font-size="15">Imm = 12</text>
    <rect x="575" y="440" width="185" height="78" rx="6" fill="#ffffff" stroke="#0f766e"/><text x="667" y="469" text-anchor="middle" font-size="17" font-weight="700">Address ALU</text><text x="667" y="497" text-anchor="middle" font-family="Consolas, monospace" font-size="15">0x2000 + 12</text>
    <rect x="830" y="440" width="210" height="78" rx="6" fill="#ffffff" stroke="#a16207"/><text x="935" y="469" text-anchor="middle" font-size="17" font-weight="700">Memory write</text><text x="935" y="497" text-anchor="middle" font-family="Consolas, monospace" font-size="15">Mem32[0x200C] &#8592; 37</text>
    <rect x="1110" y="440" width="175" height="78" rx="6" fill="#ffffff" stroke="#4b5563"/><text x="1197" y="469" text-anchor="middle" font-size="17" font-weight="700">No write-back</text><text x="1197" y="497" text-anchor="middle" font-family="Consolas, monospace" font-size="15">RegWrite = 0</text>
  </g>
  <line x1="260" y1="479" x2="573" y2="479" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="505" y1="505" x2="573" y2="505" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="760" y1="479" x2="828" y2="479" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="260" y1="455" x2="805" y2="455" stroke="#374151" stroke-width="2.5"/><line x1="805" y1="455" x2="828" y2="467" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="700" y="553" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#374151">RegWrite=0  ALUSrc=Imm  MemWrite=1  ResultSrc=X  ALUControl=ADD</text>
  <text x="700" y="625" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#4b5563">The store's register value bypasses the ALU's second operand and travels directly to the data-memory write port.</text>
</svg>
