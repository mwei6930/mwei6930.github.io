<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
  <title id="title">Virtual addresses are interpreted in an address-space context</title>
  <desc id="desc">The same virtual page number in two processes maps to different physical frames, while another pair of virtual pages deliberately maps to one shared frame. Unmapped virtual regions occupy no physical frame.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker><style>.body{font-family:"Segoe UI",Arial,sans-serif;fill:#111827}.small{font-family:"Segoe UI",Arial,sans-serif;fill:#4b5563;font-size:15px}.mono{font-family:Consolas,monospace;fill:#111827;font-size:16px}.line{stroke:#374151;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1500" height="760" fill="#ffffff"/>
  <text x="750" y="42" text-anchor="middle" class="body" font-size="28" font-weight="700">Virtual addresses depend on context</text>
  <text x="750" y="72" text-anchor="middle" class="small">The page-table root and address-space identifier determine which mapping applies.</text>
  <rect x="70" y="130" width="370" height="455" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="255" y="166" text-anchor="middle" class="body" font-size="22" font-weight="700">Process A</text><text x="255" y="193" text-anchor="middle" class="small">page-table root = PT_A, ASID = 7</text>
  <g class="mono"><rect x="125" y="225" width="260" height="58" fill="#dbeafe" stroke="#2563eb"/><text x="255" y="261" text-anchor="middle">VA page 0x12345</text><rect x="125" y="302" width="260" height="58" fill="#fef3c7" stroke="#d97706"/><text x="255" y="338" text-anchor="middle">VA page 0x70000</text><rect x="125" y="379" width="260" height="58" fill="#f3f4f6" stroke="#9ca3af" stroke-dasharray="7 5"/><text x="255" y="415" text-anchor="middle">VA page 0x80000: hole</text></g>
  <rect x="1060" y="130" width="370" height="455" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="1245" y="166" text-anchor="middle" class="body" font-size="22" font-weight="700">Process B</text><text x="1245" y="193" text-anchor="middle" class="small">page-table root = PT_B, ASID = 12</text>
  <g class="mono"><rect x="1115" y="225" width="260" height="58" fill="#ede9fe" stroke="#7c3aed"/><text x="1245" y="261" text-anchor="middle">VA page 0x12345</text><rect x="1115" y="302" width="260" height="58" fill="#fef3c7" stroke="#d97706"/><text x="1245" y="338" text-anchor="middle">VA page 0x50000</text><rect x="1115" y="379" width="260" height="58" fill="#f3f4f6" stroke="#9ca3af" stroke-dasharray="7 5"/><text x="1245" y="415" text-anchor="middle">VA page 0x80000: hole</text></g>
  <rect x="565" y="105" width="370" height="520" rx="8" fill="#f9fafb" stroke="#374151" stroke-width="2"/>
  <text x="750" y="142" text-anchor="middle" class="body" font-size="22" font-weight="700">Physical frame space</text>
  <g class="mono"><rect x="630" y="195" width="240" height="58" fill="#dbeafe" stroke="#2563eb"/><text x="750" y="231" text-anchor="middle">PFN 0x2BEEF</text><rect x="630" y="285" width="240" height="58" fill="#ede9fe" stroke="#7c3aed"/><text x="750" y="321" text-anchor="middle">PFN 0x01020</text><rect x="630" y="375" width="240" height="58" fill="#fef3c7" stroke="#d97706"/><text x="750" y="411" text-anchor="middle">PFN 0x00300</text><rect x="630" y="465" width="240" height="58" fill="#f3f4f6" stroke="#9ca3af"/><text x="750" y="501" text-anchor="middle">other/free frames</text></g>
  <path d="M385 254 C480 254 525 224 630 224" class="line"/><path d="M1115 254 C1020 254 975 314 870 314" class="line"/>
  <path d="M385 331 C490 331 525 404 630 404" class="line"/><path d="M1115 331 C1010 331 975 404 870 404" class="line"/>
  <text x="750" y="563" text-anchor="middle" class="small">No arrow means no current mapping; a hole consumes no frame.</text>
  <rect x="150" y="650" width="1200" height="74" rx="7" fill="#ecfdf5" stroke="#0f766e"/>
  <text x="750" y="681" text-anchor="middle" class="body" font-size="18" font-weight="700">Same numeric VA, different process: different physical page. Different VAs, deliberate sharing: same physical page.</text>
  <text x="750" y="708" text-anchor="middle" class="small">Context switches therefore change the active page-table root and may change or tag cached TLB translations.</text>
</svg>
