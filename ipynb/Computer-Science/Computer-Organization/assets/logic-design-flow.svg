<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">From a behavioral requirement to an ALU</title>
  <desc id="desc">A six-step flow from requirements through truth tables, Boolean expressions, gates, reusable blocks, and an ALU, with verification and timing constraints feeding every step.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .label { font: 700 22px Arial, sans-serif; fill: #0f172a; text-anchor: middle; }
      .sub { font: 17px Arial, sans-serif; fill: #334155; text-anchor: middle; }
      .arrow { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .box { stroke-width: 3; rx: 6; }
    </style>
  </defs>
  <rect width="1200" height="420" fill="#ffffff"/>
  <text x="600" y="43" class="label" font-size="27">A combinational design is refined, then checked</text>

  <g transform="translate(32 95)">
    <rect class="box" width="160" height="118" fill="#dbeafe" stroke="#2563eb"/>
    <text x="80" y="48" class="label">Requirement</text>
    <text x="80" y="79" class="sub">what must the</text><text x="80" y="101" class="sub">circuit do?</text>
  </g>
  <path class="arrow" d="M198 154 H222"/>
  <g transform="translate(228 95)">
    <rect class="box" width="160" height="118" fill="#ccfbf1" stroke="#0f766e"/>
    <text x="80" y="48" class="label">Truth table</text>
    <text x="80" y="79" class="sub">every input and</text><text x="80" y="101" class="sub">required output</text>
  </g>
  <path class="arrow" d="M394 154 H418"/>
  <g transform="translate(424 95)">
    <rect class="box" width="160" height="118" fill="#dcfce7" stroke="#15803d"/>
    <text x="80" y="42" class="label">Boolean</text><text x="80" y="68" class="label">expression</text>
    <text x="80" y="99" class="sub">simplify the rule</text>
  </g>
  <path class="arrow" d="M590 154 H614"/>
  <g transform="translate(620 95)">
    <rect class="box" width="160" height="118" fill="#fef3c7" stroke="#b45309"/>
    <text x="80" y="48" class="label">Gate network</text>
    <text x="80" y="79" class="sub">map operators</text><text x="80" y="101" class="sub">to hardware</text>
  </g>
  <path class="arrow" d="M786 154 H810"/>
  <g transform="translate(816 95)">
    <rect class="box" width="160" height="118" fill="#fee2e2" stroke="#b91c1c"/>
    <text x="80" y="42" class="label">Reusable</text><text x="80" y="68" class="label">block</text>
    <text x="80" y="99" class="sub">adder, mux, shifter</text>
  </g>
  <path class="arrow" d="M982 154 H1006"/>
  <g transform="translate(1012 95)">
    <rect class="box" width="156" height="118" fill="#ede9fe" stroke="#6d28d9"/>
    <text x="78" y="48" class="label">ALU</text>
    <text x="78" y="79" class="sub">selected result</text><text x="78" y="101" class="sub">and status flags</text>
  </g>

  <rect x="230" y="282" width="740" height="90" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="2.5" stroke-dasharray="9 7"/>
  <text x="600" y="319" class="label">Verification and timing constraints</text>
  <text x="600" y="349" class="sub">Does every input case match, and does the output settle before it is sampled?</text>
  <path d="M310 282 V240" class="arrow"/>
  <path d="M505 282 V240" class="arrow"/>
  <path d="M700 282 V240" class="arrow"/>
  <path d="M895 282 V240" class="arrow"/>
</svg>
