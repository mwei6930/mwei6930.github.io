<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 500" role="img" aria-labelledby="title desc">
  <title id="title">Assembly source to execution toolchain</title><desc id="desc">The assembler creates relocatable objects, the linker resolves symbols and lays out an executable, and the loader maps it into memory before the processor fetches instructions.</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#374151"/></marker><style>.h{font:700 22px Arial,sans-serif;fill:#111827}.t{font:16px Arial,sans-serif;fill:#374151}.b{stroke:#1f2937;stroke-width:3}.w{fill:none;stroke:#374151;stroke-width:3;marker-end:url(#a)}</style></defs>
  <rect x="1.5" y="1.5" width="1137" height="497" rx="8" fill="#fff" stroke="#d1d5db" stroke-width="3"/><text x="570" y="42" text-anchor="middle" class="h">From symbolic assembly to executed instructions</text>
  <rect x="25" y="110" width="180" height="160" rx="8" fill="#dbeafe" class="b"/><text x="115" y="150" text-anchor="middle" class="h">Assembly source</text><text x="115" y="184" text-anchor="middle" class="t">mnemonics</text><text x="115" y="210" text-anchor="middle" class="t">labels + directives</text><text x="115" y="236" text-anchor="middle" class="t">.s file</text>
  <rect x="250" y="110" width="180" height="160" rx="8" fill="#ecfdf5" class="b"/><text x="340" y="150" text-anchor="middle" class="h">Assembler</text><text x="340" y="184" text-anchor="middle" class="t">encodes instructions</text><text x="340" y="210" text-anchor="middle" class="t">builds symbols</text><text x="340" y="236" text-anchor="middle" class="t">records relocations</text>
  <rect x="475" y="110" width="180" height="160" rx="8" fill="#fef3c7" class="b"/><text x="565" y="150" text-anchor="middle" class="h">Object file</text><text x="565" y="184" text-anchor="middle" class="t">machine code</text><text x="565" y="210" text-anchor="middle" class="t">symbols + relocation</text><text x="565" y="236" text-anchor="middle" class="t">.o file</text>
  <rect x="700" y="110" width="180" height="160" rx="8" fill="#fff7ed" class="b"/><text x="790" y="150" text-anchor="middle" class="h">Linker</text><text x="790" y="184" text-anchor="middle" class="t">resolves symbols</text><text x="790" y="210" text-anchor="middle" class="t">lays out sections</text><text x="790" y="236" text-anchor="middle" class="t">may relax code</text>
  <rect x="925" y="110" width="190" height="160" rx="8" fill="#fee2e2" class="b"/><text x="1020" y="150" text-anchor="middle" class="h">Executable</text><text x="1020" y="184" text-anchor="middle" class="t">final addresses</text><text x="1020" y="210" text-anchor="middle" class="t">code + data layout</text><text x="1020" y="236" text-anchor="middle" class="t">ELF image</text>
  <path d="M205 190H250" class="w"/><path d="M430 190H475" class="w"/><path d="M655 190H700" class="w"/><path d="M880 190H925" class="w"/>
  <rect x="365" y="345" width="410" height="85" rx="8" fill="#eef2ff" class="b"/><text x="570" y="380" text-anchor="middle" class="h">Loader maps segments; processor fetches at the entry PC</text><text x="570" y="410" text-anchor="middle" class="t">architectural execution begins only after toolchain and runtime work</text><path d="M1020 270V315H775" class="w"/>
</svg>
