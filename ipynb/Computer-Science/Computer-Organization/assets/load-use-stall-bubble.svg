<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-labelledby="title desc">
  <title id="title">Load-use hazard requires a one-cycle stall</title>
  <desc id="desc">A load produces data at the end of its memory stage, too late for the immediately following add to use it in execute. The program counter and IF ID register are held while a bubble is inserted into ID EX.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0f766e"/></marker>
    <style>.body{font-family:"Segoe UI",Arial,sans-serif;fill:#111827}.small{font-family:"Segoe UI",Arial,sans-serif;fill:#4b5563;font-size:15px}.mono{font-family:Consolas,monospace;fill:#111827;font-size:16px}.grid{stroke:#d1d5db;stroke-width:1}</style>
  </defs>
  <rect width="1400" height="700" fill="#ffffff"/>
  <text x="700" y="42" text-anchor="middle" class="body" font-size="28" font-weight="700">A load result arrives one stage too late for the next instruction</text>
  <text x="700" y="72" text-anchor="middle" class="small">Forwarding cannot send a value backward in time, so the interlock creates one bubble.</text>

  <g transform="translate(70 130)">
    <rect x="0" y="0" width="1260" height="370" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
    <rect x="0" y="0" width="350" height="370" fill="#f9fafb"/>
    <g class="grid"><path d="M350 0V370 M480 0V370 M610 0V370 M740 0V370 M870 0V370 M1000 0V370 M1130 0V370"/><path d="M0 70H1260 M0 145H1260 M0 220H1260 M0 295H1260"/></g>
    <text x="175" y="44" text-anchor="middle" class="body" font-size="18" font-weight="700">instruction / action</text>
    <text x="415" y="44" text-anchor="middle" class="body" font-size="18" font-weight="700">C1</text><text x="545" y="44" text-anchor="middle" class="body" font-size="18" font-weight="700">C2</text><text x="675" y="44" text-anchor="middle" class="body" font-size="18" font-weight="700">C3</text><text x="805" y="44" text-anchor="middle" class="body" font-size="18" font-weight="700">C4</text><text x="935" y="44" text-anchor="middle" class="body" font-size="18" font-weight="700">C5</text><text x="1065" y="44" text-anchor="middle" class="body" font-size="18" font-weight="700">C6</text><text x="1195" y="44" text-anchor="middle" class="body" font-size="18" font-weight="700">C7</text>
    <text x="20" y="115" class="mono">lw x5, 0(x6)</text>
    <text x="20" y="190" class="mono">add x7, x5, x8</text>
    <text x="20" y="265" class="mono">next instruction</text>
    <text x="20" y="340" class="body" font-size="17" font-weight="700" fill="#9a3412">interlock action</text>

    <g class="body" font-size="17" font-weight="700" text-anchor="middle">
      <rect x="360" y="82" width="110" height="48" fill="#eff6ff" stroke="#2563eb"/><text x="415" y="112">IF</text><rect x="490" y="82" width="110" height="48" fill="#fff7ed" stroke="#c2410c"/><text x="545" y="112">ID</text><rect x="620" y="82" width="110" height="48" fill="#ecfdf5" stroke="#0f766e"/><text x="675" y="112">EX</text><rect x="750" y="82" width="110" height="48" fill="#fefce8" stroke="#a16207"/><text x="805" y="112">MEM</text><rect x="880" y="82" width="110" height="48" fill="#f5f3ff" stroke="#7c3aed"/><text x="935" y="112">WB</text>
      <rect x="490" y="157" width="110" height="48" fill="#eff6ff" stroke="#2563eb"/><text x="545" y="187">IF</text><rect x="620" y="157" width="110" height="48" fill="#fff7ed" stroke="#c2410c"/><text x="675" y="187">ID</text><rect x="750" y="157" width="110" height="48" fill="#fee2e2" stroke="#b91c1c"/><text x="805" y="187">ID hold</text><rect x="880" y="157" width="110" height="48" fill="#ecfdf5" stroke="#0f766e"/><text x="935" y="187">EX</text><rect x="1010" y="157" width="110" height="48" fill="#fefce8" stroke="#a16207"/><text x="1065" y="187">MEM</text><rect x="1140" y="157" width="110" height="48" fill="#f5f3ff" stroke="#7c3aed"/><text x="1195" y="187">WB</text>
      <rect x="620" y="232" width="110" height="48" fill="#eff6ff" stroke="#2563eb"/><text x="675" y="262">IF</text><rect x="750" y="232" width="110" height="48" fill="#fee2e2" stroke="#b91c1c"/><text x="805" y="262">IF hold</text><rect x="880" y="232" width="110" height="48" fill="#fff7ed" stroke="#c2410c"/><text x="935" y="262">ID</text><rect x="1010" y="232" width="110" height="48" fill="#ecfdf5" stroke="#0f766e"/><text x="1065" y="262">EX</text><rect x="1140" y="232" width="110" height="48" fill="#fefce8" stroke="#a16207"/><text x="1195" y="262">MEM</text>
      <rect x="750" y="307" width="110" height="48" fill="#f3f4f6" stroke="#4b5563" stroke-dasharray="7 5"/><text x="805" y="337">bubble in EX</text>
    </g>
  </g>
  <path d="M875 247 C910 210 945 210 980 247" stroke="#0f766e" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <text x="925" y="197" text-anchor="middle" class="small" fill="#0f766e">load data becomes available</text>
  <text x="700" y="555" text-anchor="middle" class="body" font-size="19" font-weight="700">Cycle C4 control response</text>
  <rect x="155" y="585" width="315" height="74" rx="6" fill="#fef2f2" stroke="#b91c1c"/><text x="312" y="615" text-anchor="middle" class="body" font-size="18" font-weight="700">hold PC and IF / ID</text><text x="312" y="642" text-anchor="middle" class="small">consumer stays in decode</text>
  <rect x="542" y="585" width="315" height="74" rx="6" fill="#f3f4f6" stroke="#4b5563"/><text x="700" y="615" text-anchor="middle" class="body" font-size="18" font-weight="700">clear ID / EX controls</text><text x="700" y="642" text-anchor="middle" class="small">a no-op bubble enters execute</text>
  <rect x="930" y="585" width="315" height="74" rx="6" fill="#ecfdf5" stroke="#0f766e"/><text x="1087" y="615" text-anchor="middle" class="body" font-size="18" font-weight="700">let older stages advance</text><text x="1087" y="642" text-anchor="middle" class="small">the load reaches memory normally</text>
</svg>
