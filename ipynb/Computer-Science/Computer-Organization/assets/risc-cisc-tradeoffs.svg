<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 530" role="img" aria-labelledby="title desc">
  <title id="title">RISC and CISC design tradeoffs</title><desc id="desc">RISC emphasizes regular load-store operations and simpler decode, while CISC emphasizes dense variable encodings and richer operations. Modern implementations combine ideas.</desc>
  <defs><style>.h{font:700 24px Arial,sans-serif;fill:#111827}.t{font:18px Arial,sans-serif;fill:#374151}.b{stroke:#1f2937;stroke-width:3}.dash{stroke:#9ca3af;stroke-width:3;stroke-dasharray:8 7}</style></defs>
  <rect x="1.5" y="1.5" width="1117" height="527" rx="8" fill="#fff" stroke="#d1d5db" stroke-width="3"/><text x="560" y="42" text-anchor="middle" class="h">RISC and CISC are design tendencies, not performance rankings</text>
  <rect x="45" y="85" width="430" height="330" rx="8" fill="#ecfdf5" class="b"/><text x="260" y="128" text-anchor="middle" class="h">RISC tendency</text><text x="80" y="180" class="t">regular instruction fields</text><text x="80" y="220" class="t">load/store memory operations</text><text x="80" y="260" class="t">many explicit simple operations</text><text x="80" y="300" class="t">decode and pipeline regularity</text><text x="80" y="340" class="t">optional extensions can add density</text>
  <rect x="645" y="85" width="430" height="330" rx="8" fill="#fef3c7" class="b"/><text x="860" y="128" text-anchor="middle" class="h">CISC tendency</text><text x="680" y="180" class="t">variable-length dense encodings</text><text x="680" y="220" class="t">some memory operands in computation</text><text x="680" y="260" class="t">richer operation semantics</text><text x="680" y="300" class="t">more complex decode boundaries</text><text x="680" y="340" class="t">internal micro-operations may regularize work</text>
  <line x1="520" y1="95" x2="600" y2="405" class="dash"/><line x1="600" y1="95" x2="520" y2="405" class="dash"/>
  <rect x="210" y="445" width="700" height="55" rx="7" fill="#eef2ff" class="b"/><text x="560" y="480" text-anchor="middle" class="t">Modern ISAs and cores mix code-density, decode, translation, and execution techniques</text>
</svg>
