<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="820" viewBox="0 0 1580 820" role="img" aria-labelledby="title desc">
  <title id="title">Synchronous exceptions and asynchronous interrupts converge on privileged handler entry</title>
  <desc id="desc">A faulting instruction can raise a synchronous exception, while a device completion reaches an interrupt controller asynchronously. Both select a vector, save architectural state, enter a privileged handler, service or reject the cause, and return or terminate.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker><style>.body{font-family:"Segoe UI",Arial,sans-serif;fill:#111827}.small{font-family:"Segoe UI",Arial,sans-serif;fill:#4b5563;font-size:15px}.mono{font-family:Consolas,monospace;fill:#111827;font-size:15px}.line{stroke:#374151;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1580" height="820" fill="#ffffff"/>
  <text x="790" y="42" text-anchor="middle" class="body" font-size="28" font-weight="700">Different causes, one controlled transfer into privileged software</text>
  <text x="790" y="72" text-anchor="middle" class="small">Precise state identifies where execution should resume; interrupt priority and masking decide when an asynchronous event may enter.</text>
  <rect x="65" y="125" width="360" height="220" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="245" y="165" text-anchor="middle" class="body" font-size="22" font-weight="700">Synchronous exception</text><text x="245" y="198" text-anchor="middle" class="small">caused by the current instruction</text>
  <rect x="115" y="235" width="260" height="70" rx="5" fill="#ffffff" stroke="#2563eb"/><text x="245" y="263" text-anchor="middle" class="mono">page fault / illegal opcode</text><text x="245" y="289" text-anchor="middle" class="small">faulting PC is architecturally known</text>
  <rect x="65" y="455" width="360" height="220" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="245" y="495" text-anchor="middle" class="body" font-size="22" font-weight="700">Asynchronous interrupt</text><text x="245" y="528" text-anchor="middle" class="small">arrives independently of current instruction</text>
  <rect x="115" y="565" width="260" height="70" rx="5" fill="#ffffff" stroke="#ea580c"/><text x="245" y="593" text-anchor="middle" class="mono">timer / device completion</text><text x="245" y="619" text-anchor="middle" class="small">taken at a permitted instruction boundary</text>
  <rect x="505" y="455" width="300" height="220" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="655" y="495" text-anchor="middle" class="body" font-size="21" font-weight="700">Interrupt controller</text><text x="655" y="528" text-anchor="middle" class="small">pending, enable, priority, target</text><text x="655" y="570" text-anchor="middle" class="mono">claim interrupt ID</text><text x="655" y="610" text-anchor="middle" class="mono">complete interrupt ID</text>
  <path d="M425 565 H505" class="line"/>
  <rect x="900" y="165" width="600" height="480" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="1200" y="205" text-anchor="middle" class="body" font-size="23" font-weight="700">Architectural entry and return</text>
  <rect x="965" y="255" width="470" height="72" rx="6" fill="#ffffff" stroke="#7c3aed"/><text x="1200" y="284" text-anchor="middle" class="mono">1. record cause, PC, and status</text><text x="1200" y="310" text-anchor="middle" class="small">switch privilege and select vector</text>
  <rect x="965" y="355" width="470" height="72" rx="6" fill="#dbeafe" stroke="#2563eb"/><text x="1200" y="384" text-anchor="middle" class="mono">2. handler saves needed registers</text><text x="1200" y="410" text-anchor="middle" class="small">identify source and preserve precise state</text>
  <rect x="965" y="455" width="470" height="72" rx="6" fill="#dcfce7" stroke="#16a34a"/><text x="1200" y="484" text-anchor="middle" class="mono">3. service, acknowledge, or reject</text><text x="1200" y="510" text-anchor="middle" class="small">device-specific work may be deferred</text>
  <rect x="965" y="555" width="470" height="52" rx="6" fill="#ffffff" stroke="#7c3aed"/><text x="1200" y="587" text-anchor="middle" class="mono">4. restore and exception-return</text>
  <path d="M425 235 C700 235 760 291 965 291" class="line"/><path d="M805 565 C860 565 860 391 965 391" class="line"/>
  <path d="M1200 327 V355" class="line"/><path d="M1200 427 V455" class="line"/><path d="M1200 527 V555" class="line"/>
  <rect x="300" y="735" width="980" height="52" rx="6" fill="#fee2e2" stroke="#dc2626"/><text x="790" y="768" text-anchor="middle" class="body" font-size="17" font-weight="700">An interrupt reports that something happened; a DMA completion record or status register explains what completed.</text>
</svg>
