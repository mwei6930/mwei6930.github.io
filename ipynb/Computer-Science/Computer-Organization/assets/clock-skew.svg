<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 520" role="img" aria-labelledby="title desc">
  <title id="title">Clock skew between launch and capture registers</title><desc id="desc">The same nominal clock edge reaches a launch register before a capture register, creating positive clock skew.</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#374151"/></marker><style>.h{font:700 24px Arial,sans-serif;fill:#111827}.t{font:18px Arial,sans-serif;fill:#374151}.c1{fill:none;stroke:#0f766e;stroke-width:4}.c2{fill:none;stroke:#1d4ed8;stroke-width:4}.m{stroke:#be123c;stroke-width:3;stroke-dasharray:7 6}.axis{stroke:#374151;stroke-width:3;marker-end:url(#a)}</style></defs>
  <rect x="1.5" y="1.5" width="1077" height="517" rx="8" fill="#fff" stroke="#d1d5db" stroke-width="3"/><text x="540" y="45" text-anchor="middle" class="h">Clock skew is a difference in edge arrival time</text><text x="30" y="150" class="h">Launch clock</text><path d="M190 175H390V95H610V175H980" class="c1"/><text x="30" y="310" class="h">Capture clock</text><path d="M190 335H510V255H730V335H980" class="c2"/><line x1="390" y1="70" x2="390" y2="410" class="m"/><line x1="510" y1="230" x2="510" y2="410" class="m"/><path d="M390 440H510" class="axis"/><text x="450" y="430" text-anchor="middle" class="h" fill="#be123c">t_skew</text><text x="540" y="485" text-anchor="middle" class="t">Positive skew gives setup more time but makes the hold check harder</text>
</svg>
