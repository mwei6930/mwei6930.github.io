<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">Architecture, ISA, and organization</title>
  <desc id="desc">The architecture defines the software-visible contract, while organization chooses the internal hardware that implements it.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#52606d"/>
    </marker>
  </defs>
  <rect width="1100" height="560" fill="#f8fafc"/>
  <text x="550" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#172b4d">Architecture defines the promise; organization builds the promise</text>

  <rect x="55" y="82" width="420" height="350" rx="6" fill="#e8f1ff" stroke="#2f6fed" stroke-width="2"/>
  <text x="265" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#174ea6">Architecture: software-visible behavior</text>
  <text x="90" y="163" font-family="Arial, sans-serif" font-size="17" fill="#253858">Instruction repertoire and encoding</text>
  <text x="90" y="203" font-family="Arial, sans-serif" font-size="17" fill="#253858">Registers and programmer-visible state</text>
  <text x="90" y="243" font-family="Arial, sans-serif" font-size="17" fill="#253858">Addressing, data types, and memory effects</text>
  <text x="90" y="283" font-family="Arial, sans-serif" font-size="17" fill="#253858">Exceptions, privilege, and observable results</text>
  <rect x="93" y="322" width="344" height="72" rx="5" fill="#ffffff" stroke="#79a7f2"/>
  <text x="265" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#174ea6">Question answered</text>
  <text x="265" y="377" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#253858">What must every compatible machine do?</text>

  <rect x="625" y="82" width="420" height="350" rx="6" fill="#fff1df" stroke="#d97706" stroke-width="2"/>
  <text x="835" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#9a4f00">Organization: internal implementation</text>
  <text x="660" y="163" font-family="Arial, sans-serif" font-size="17" fill="#4b3a2d">Pipeline depth and issue width</text>
  <text x="660" y="203" font-family="Arial, sans-serif" font-size="17" fill="#4b3a2d">Execution units and control logic</text>
  <text x="660" y="243" font-family="Arial, sans-serif" font-size="17" fill="#4b3a2d">Cache sizes and replacement policies</text>
  <text x="660" y="283" font-family="Arial, sans-serif" font-size="17" fill="#4b3a2d">Interconnects, timing, power, and layout</text>
  <rect x="663" y="322" width="344" height="72" rx="5" fill="#ffffff" stroke="#e7a34b"/>
  <text x="835" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#9a4f00">Question answered</text>
  <text x="835" y="377" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#4b3a2d">How will this machine meet the contract?</text>

  <rect x="463" y="166" width="174" height="178" rx="6" fill="#e7f7ef" stroke="#17885b" stroke-width="2.5"/>
  <text x="550" y="208" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#0c6b45">ISA</text>
  <text x="550" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#22543d">hardware-software</text>
  <text x="550" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#22543d">contract</text>
  <path d="M488 285 L612 285" stroke="#17885b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="550" y="319" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#22543d">same semantics</text>

  <path d="M475 144 L520 166" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M625 144 L580 166" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="155" y="468" width="790" height="58" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="550" y="493" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#172b4d">One RISC-V program can run unchanged on many organizations</text>
  <text x="550" y="517" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#52606d">small in-order core | wide out-of-order core | low-power embedded core</text>
</svg>
