<svg xmlns="http://www.w3.org/2000/svg" width="1350" height="470" viewBox="0 0 1350 470" role="img" aria-labelledby="title desc">
  <title id="title">Trace of an R-type add instruction</title>
  <desc id="desc">The add x5 x6 x7 instruction is fetched, decoded, reads x6 and x7, adds them in the ALU, writes 18 to x5, and advances the program counter.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker></defs>
  <rect width="1350" height="470" fill="#ffffff"/>
  <text x="675" y="40" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#111827">R-type trace: add x5, x6, x7</text>
  <text x="675" y="69" text-anchor="middle" font-family="Consolas, monospace" font-size="16" fill="#4b5563">initial PC = 0x100, R[6] = 11, R[7] = 7</text>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="35" y="125" width="195" height="155" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="132" y="160" text-anchor="middle" font-size="19" font-weight="700" fill="#1d4ed8">Fetch</text>
    <text x="132" y="195" text-anchor="middle" font-family="Consolas, monospace" font-size="16" fill="#111827">IMem[0x100]</text>
    <text x="132" y="224" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#4b5563">opcode = 0110011</text>
    <text x="132" y="250" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#4b5563">rd=5 rs1=6 rs2=7</text>

    <rect x="300" y="125" width="195" height="155" rx="7" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
    <text x="397" y="160" text-anchor="middle" font-size="19" font-weight="700" fill="#9a3412">Decode and read</text>
    <text x="397" y="195" text-anchor="middle" font-family="Consolas, monospace" font-size="16" fill="#111827">A = R[6] = 11</text>
    <text x="397" y="224" text-anchor="middle" font-family="Consolas, monospace" font-size="16" fill="#111827">B = R[7] = 7</text>
    <text x="397" y="250" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#4b5563">ALUSrc = register</text>

    <rect x="565" y="125" width="195" height="155" rx="7" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
    <text x="662" y="160" text-anchor="middle" font-size="19" font-weight="700" fill="#0f766e">Execute</text>
    <text x="662" y="201" text-anchor="middle" font-family="Consolas, monospace" font-size="19" fill="#111827">11 + 7 = 18</text>
    <text x="662" y="235" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#4b5563">ALUControl = ADD</text>
    <text x="662" y="258" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#4b5563">no data-memory access</text>

    <rect x="830" y="125" width="195" height="155" rx="7" fill="#fefce8" stroke="#a16207" stroke-width="2"/>
    <text x="927" y="160" text-anchor="middle" font-size="19" font-weight="700" fill="#854d0e">Write-back</text>
    <text x="927" y="202" text-anchor="middle" font-family="Consolas, monospace" font-size="19" fill="#111827">R[5] &#8592; 18</text>
    <text x="927" y="236" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#4b5563">ResultSrc = ALU</text>
    <text x="927" y="259" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#4b5563">RegWrite = 1</text>

    <rect x="1095" y="125" width="220" height="155" rx="7" fill="#f3f4f6" stroke="#4b5563" stroke-width="2"/>
    <text x="1205" y="160" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Next architectural state</text>
    <text x="1205" y="200" text-anchor="middle" font-family="Consolas, monospace" font-size="17" fill="#111827">PC &#8592; 0x104</text>
    <text x="1205" y="230" text-anchor="middle" font-family="Consolas, monospace" font-size="17" fill="#111827">R[5] &#8592; 18</text>
    <text x="1205" y="258" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#4b5563">all other state unchanged</text>
  </g>
  <line x1="230" y1="202" x2="298" y2="202" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="495" y1="202" x2="563" y2="202" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="760" y1="202" x2="828" y2="202" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1025" y1="202" x2="1093" y2="202" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="215" y="345" width="920" height="73" rx="7" fill="#fff7ed" stroke="#c2410c"/>
  <text x="675" y="375" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#9a3412">Active control word</text>
  <text x="675" y="402" text-anchor="middle" font-family="Consolas, monospace" font-size="16" fill="#111827">RegWrite=1  ALUSrc=0  MemWrite=0  ResultSrc=ALU  Branch=0  Jump=0  ALUControl=ADD</text>
</svg>
