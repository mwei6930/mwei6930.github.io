<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="485" viewBox="0 0 1120 485" role="img" aria-labelledby="title desc">
  <title id="title">Thermal feedback and throttling</title><desc id="desc">Activity raises power, power raises temperature, temperature raises leakage and may trigger throttling, and cooling removes heat toward ambient.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3 0 6Z" fill="#334155"/></marker></defs>
  <rect width="1120" height="485" rx="18" fill="#f8fafc"/>
  <text x="560" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#172033">Temperature is a slow state in a fast machine</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="60" y="170" width="205" height="100" rx="11" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="163" y="207" font-size="19" font-weight="700" fill="#1e3a8a">Activity</text><text x="163" y="238" font-size="14" fill="#334155">switching + frequency</text>
    <rect x="335" y="170" width="205" height="100" rx="11" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="438" y="207" font-size="19" font-weight="700" fill="#78350f">Power</text><text x="438" y="238" font-size="14" fill="#334155">heat generation</text>
    <rect x="610" y="170" width="205" height="100" rx="11" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="713" y="207" font-size="19" font-weight="700" fill="#7f1d1d">Temperature</text><text x="713" y="238" font-size="14" fill="#334155">thermal capacitance</text>
    <rect x="885" y="170" width="175" height="100" rx="11" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/><text x="973" y="207" font-size="19" font-weight="700" fill="#581c87">Throttle</text><text x="973" y="238" font-size="14" fill="#334155">reduce V / f</text>
  </g>
  <g stroke="#334155" stroke-width="3" marker-end="url(#a)"><line x1="265" y1="220" x2="325" y2="220"/><line x1="540" y1="220" x2="600" y2="220"/><line x1="815" y1="220" x2="875" y2="220"/></g>
  <path d="M973 270 V360 H163 V280" fill="none" stroke="#9333ea" stroke-width="3" marker-end="url(#a)"/><text x="565" y="386" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#581c87">closed-loop control protects the thermal limit</text>
  <path d="M713 170 V105 H438 V160" fill="none" stroke="#dc2626" stroke-width="3" marker-end="url(#a)"/><text x="576" y="91" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#7f1d1d">higher temperature increases leakage</text>
  <path d="M713 270 V433" fill="none" stroke="#16a34a" stroke-width="3" marker-end="url(#a)"/><text x="813" y="420" font-family="Arial, sans-serif" font-size="14" fill="#14532d">cooling toward ambient</text>
</svg>
