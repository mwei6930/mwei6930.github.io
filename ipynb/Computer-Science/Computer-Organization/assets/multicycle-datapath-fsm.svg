<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Multi-cycle processor state machine</title>
  <desc id="desc">Every instruction moves through fetch and decode, then follows arithmetic, memory, branch, or jump states before returning to fetch. Internal registers preserve intermediate values between cycles.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker></defs>
  <rect width="1400" height="760" fill="#ffffff"/>
  <text x="700" y="40" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#111827">A multi-cycle controller sequences shared hardware through an FSM</text>
  <text x="700" y="68" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#4b5563">Arrows returning to IF begin the next instruction; labels show the principal register-transfer action.</text>

  <rect x="560" y="100" width="280" height="92" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="700" y="132" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#1d4ed8">IF: Instruction fetch</text>
  <text x="700" y="160" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#111827">IR &#8592; Mem[PC]; PC &#8592; PC + 4</text>
  <rect x="560" y="235" width="280" height="92" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="700" y="267" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#9a3412">ID: Decode and read</text>
  <text x="700" y="295" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#111827">A &#8592; R[rs1]; B &#8592; R[rs2]; Imm &#8592; decode</text>
  <line x1="700" y1="192" x2="700" y2="233" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="55" y="405" width="235" height="92" rx="8" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
  <text x="172" y="437" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#0f766e">EX-ALU</text>
  <text x="172" y="466" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#111827">ALUOut &#8592; A op B/Imm</text>
  <rect x="340" y="405" width="235" height="92" rx="8" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
  <text x="457" y="437" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#0f766e">EX-ADDR</text>
  <text x="457" y="466" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#111827">ALUOut &#8592; A + Imm</text>
  <rect x="625" y="405" width="235" height="92" rx="8" fill="#fefce8" stroke="#a16207" stroke-width="2"/>
  <text x="742" y="437" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#854d0e">EX-BRANCH</text>
  <text x="742" y="466" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#111827">if cond: PC &#8592; oldPC + Imm</text>
  <rect x="910" y="405" width="235" height="92" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="1027" y="437" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#1d4ed8">EX-JUMP</text>
  <text x="1027" y="466" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#111827">link &#8592; PC; PC &#8592; oldPC+Imm</text>
  <rect x="1195" y="405" width="150" height="92" rx="8" fill="#fee2e2" stroke="#c2410c" stroke-width="2"/>
  <text x="1270" y="437" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#9a3412">TRAP</text>
  <text x="1270" y="466" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#111827">save cause/PC</text>

  <path d="M650 327 C560 355, 300 350, 172 403" fill="none" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/><text x="320" y="360" font-family="Consolas, monospace" font-size="14" fill="#4b5563">R/I-type</text>
  <path d="M675 327 C610 360, 520 365, 457 403" fill="none" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/><text x="535" y="365" font-family="Consolas, monospace" font-size="14" fill="#4b5563">load/store</text>
  <path d="M720 327 L742 403" fill="none" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/><text x="745" y="365" font-family="Consolas, monospace" font-size="14" fill="#4b5563">branch</text>
  <path d="M750 327 C820 360, 960 365, 1027 403" fill="none" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/><text x="900" y="365" font-family="Consolas, monospace" font-size="14" fill="#4b5563">JAL</text>
  <path d="M790 327 C930 340, 1170 350, 1270 403" fill="none" stroke="#c2410c" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="1110" y="360" font-family="Consolas, monospace" font-size="14" fill="#9a3412">exception</text>

  <rect x="70" y="585" width="205" height="82" rx="7" fill="#fefce8" stroke="#a16207" stroke-width="2"/>
  <text x="172" y="617" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#854d0e">WB-ALU</text><text x="172" y="645" text-anchor="middle" font-family="Consolas, monospace" font-size="14">R[rd] &#8592; ALUOut</text>
  <rect x="330" y="585" width="205" height="82" rx="7" fill="#fefce8" stroke="#a16207" stroke-width="2"/>
  <text x="432" y="617" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#854d0e">MEM-READ</text><text x="432" y="645" text-anchor="middle" font-family="Consolas, monospace" font-size="14">MDR &#8592; Mem[ALUOut]</text>
  <rect x="590" y="585" width="205" height="82" rx="7" fill="#fefce8" stroke="#a16207" stroke-width="2"/>
  <text x="692" y="617" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#854d0e">MEM-WRITE</text><text x="692" y="645" text-anchor="middle" font-family="Consolas, monospace" font-size="14">Mem[ALUOut] &#8592; B</text>
  <rect x="850" y="585" width="205" height="82" rx="7" fill="#fefce8" stroke="#a16207" stroke-width="2"/>
  <text x="952" y="617" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#854d0e">WB-LOAD</text><text x="952" y="645" text-anchor="middle" font-family="Consolas, monospace" font-size="14">R[rd] &#8592; MDR</text>

  <line x1="172" y1="497" x2="172" y2="583" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M457 497 C450 535, 432 545, 432 583" fill="none" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/><text x="402" y="548" font-family="Consolas, monospace" font-size="13" fill="#4b5563">lw</text>
  <path d="M485 497 C540 545, 650 530, 692 583" fill="none" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/><text x="585" y="548" font-family="Consolas, monospace" font-size="13" fill="#4b5563">sw</text>
  <line x1="535" y1="626" x2="848" y2="626" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M172 667 C172 725, 700 725, 700 194" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M692 667 C692 710, 700 710, 700 194" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M952 667 C952 735, 700 735, 700 194" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1110" y="575" width="240" height="103" rx="7" fill="#f3f4f6" stroke="#4b5563"/>
  <text x="1230" y="607" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#111827">Internal holding registers</text>
  <text x="1230" y="637" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#374151">IR, A, B, ALUOut, MDR</text>
  <text x="1230" y="662" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#4b5563">preserve intermediate values across edges</text>
</svg>
