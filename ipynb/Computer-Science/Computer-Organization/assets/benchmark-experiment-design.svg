<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="440" viewBox="0 0 1160 440" role="img" aria-labelledby="title desc">
  <title id="title">Reproducible benchmark experiment design</title><desc id="desc">The flow selects a representative workload, fixes the environment, warms up, repeats runs, checks variation, and reports configuration and distributions.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3 0 6Z" fill="#334155"/></marker></defs>
  <rect width="1160" height="440" rx="18" fill="#f8fafc"/>
  <text x="580" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#172033">From a workload to a defensible result</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g><rect x="35" y="105" width="165" height="105" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="118" y="140" font-size="17" font-weight="700" fill="#1e3a8a">Choose workload</text><text x="118" y="170" font-size="14" fill="#334155">real input scale</text><text x="118" y="193" font-size="14" fill="#334155">correct task mix</text></g>
    <g><rect x="220" y="105" width="165" height="105" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="303" y="140" font-size="17" font-weight="700" fill="#14532d">Freeze controls</text><text x="303" y="170" font-size="14" fill="#334155">versions, affinity</text><text x="303" y="193" font-size="14" fill="#334155">power and I/O state</text></g>
    <g><rect x="405" y="105" width="165" height="105" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="488" y="140" font-size="17" font-weight="700" fill="#78350f">Warm up</text><text x="488" y="170" font-size="14" fill="#334155">fill caches</text><text x="488" y="193" font-size="14" fill="#334155">reach steady state</text></g>
    <g><rect x="590" y="105" width="165" height="105" rx="9" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/><text x="673" y="140" font-size="17" font-weight="700" fill="#581c87">Repeat runs</text><text x="673" y="170" font-size="14" fill="#334155">independent trials</text><text x="673" y="193" font-size="14" fill="#334155">record raw samples</text></g>
    <g><rect x="775" y="105" width="165" height="105" rx="9" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="858" y="140" font-size="17" font-weight="700" fill="#7f1d1d">Check noise</text><text x="858" y="170" font-size="14" fill="#334155">outliers and drift</text><text x="858" y="193" font-size="14" fill="#334155">thermal throttling</text></g>
    <g><rect x="960" y="105" width="165" height="105" rx="9" fill="#cffafe" stroke="#0891b2" stroke-width="2"/><text x="1043" y="140" font-size="17" font-weight="700" fill="#164e63">Report evidence</text><text x="1043" y="170" font-size="14" fill="#334155">median + tails</text><text x="1043" y="193" font-size="14" fill="#334155">full configuration</text></g>
  </g>
  <g stroke="#334155" stroke-width="2.7" marker-end="url(#a)"><line x1="200" y1="158" x2="212" y2="158"/><line x1="385" y1="158" x2="397" y2="158"/><line x1="570" y1="158" x2="582" y2="158"/><line x1="755" y1="158" x2="767" y2="158"/><line x1="940" y1="158" x2="952" y2="158"/></g>
  <rect x="185" y="275" width="790" height="92" rx="12" fill="#fff" stroke="#64748b" stroke-width="2"/>
  <text x="580" y="307" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#172033">Validity question</text>
  <text x="580" y="338" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#334155">Would the same conclusion survive a realistic input, another run, and full disclosure of the setup?</text>
  <text x="580" y="407" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#64748b">Benchmark scores are observations under conditions, not timeless properties of a machine.</text>
</svg>
