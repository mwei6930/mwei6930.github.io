<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" role="img" aria-labelledby="title desc">
  <title id="title">Latency and throughput are different performance questions</title>
  <desc id="desc">A single four-stage job takes eight nanoseconds, while a pipeline can finish one job every two nanoseconds after filling.</desc>
  <rect width="1040" height="470" fill="#f8fafc"/>
  <text x="520" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#172b4d">Latency asks about one job; throughput asks about completed jobs per time</text>

  <text x="60" y="95" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#174ea6">One job, four sequential stages</text>
  <line x1="60" y1="145" x2="980" y2="145" stroke="#94a3b8" stroke-width="2"/>
  <g font-family="Arial, sans-serif" font-size="15" text-anchor="middle">
    <rect x="100" y="116" width="180" height="58" rx="5" fill="#e8f1ff" stroke="#2f6fed"/>
    <text x="190" y="151" fill="#174ea6">Fetch: 2 ns</text>
    <rect x="280" y="116" width="180" height="58" rx="5" fill="#e7f7ef" stroke="#17885b"/>
    <text x="370" y="151" fill="#0c6b45">Decode: 2 ns</text>
    <rect x="460" y="116" width="180" height="58" rx="5" fill="#fff1df" stroke="#d97706"/>
    <text x="550" y="151" fill="#9a4f00">Execute: 2 ns</text>
    <rect x="640" y="116" width="180" height="58" rx="5" fill="#f2eafe" stroke="#7e57c2"/>
    <text x="730" y="151" fill="#5e3c99">Finish: 2 ns</text>
  </g>
  <text x="840" y="151" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#172b4d">latency = 8 ns</text>

  <text x="60" y="230" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#0c6b45">Four jobs in an ideal pipeline</text>
  <g font-family="Arial, sans-serif" font-size="14">
    <text x="75" y="278" fill="#52606d">Job A</text>
    <text x="75" y="318" fill="#52606d">Job B</text>
    <text x="75" y="358" fill="#52606d">Job C</text>
    <text x="75" y="398" fill="#52606d">Job D</text>
  </g>
  <g stroke-width="1">
    <rect x="130" y="255" width="105" height="28" fill="#e8f1ff" stroke="#2f6fed"/><rect x="235" y="255" width="105" height="28" fill="#e7f7ef" stroke="#17885b"/><rect x="340" y="255" width="105" height="28" fill="#fff1df" stroke="#d97706"/><rect x="445" y="255" width="105" height="28" fill="#f2eafe" stroke="#7e57c2"/>
    <rect x="235" y="295" width="105" height="28" fill="#e8f1ff" stroke="#2f6fed"/><rect x="340" y="295" width="105" height="28" fill="#e7f7ef" stroke="#17885b"/><rect x="445" y="295" width="105" height="28" fill="#fff1df" stroke="#d97706"/><rect x="550" y="295" width="105" height="28" fill="#f2eafe" stroke="#7e57c2"/>
    <rect x="340" y="335" width="105" height="28" fill="#e8f1ff" stroke="#2f6fed"/><rect x="445" y="335" width="105" height="28" fill="#e7f7ef" stroke="#17885b"/><rect x="550" y="335" width="105" height="28" fill="#fff1df" stroke="#d97706"/><rect x="655" y="335" width="105" height="28" fill="#f2eafe" stroke="#7e57c2"/>
    <rect x="445" y="375" width="105" height="28" fill="#e8f1ff" stroke="#2f6fed"/><rect x="550" y="375" width="105" height="28" fill="#e7f7ef" stroke="#17885b"/><rect x="655" y="375" width="105" height="28" fill="#fff1df" stroke="#d97706"/><rect x="760" y="375" width="105" height="28" fill="#f2eafe" stroke="#7e57c2"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="13" fill="#52606d" text-anchor="middle">
    <text x="130" y="431">0</text><text x="235" y="431">2</text><text x="340" y="431">4</text><text x="445" y="431">6</text><text x="550" y="431">8</text><text x="655" y="431">10</text><text x="760" y="431">12</text><text x="865" y="431">14 ns</text>
  </g>
  <text x="900" y="307" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0c6b45">after filling:</text>
  <text x="900" y="334" font-family="Arial, sans-serif" font-size="16" fill="#22543d">1 result / 2 ns</text>
  <text x="900" y="361" font-family="Arial, sans-serif" font-size="16" fill="#22543d">higher throughput</text>
</svg>
