<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="680" viewBox="0 0 1400 680" role="img" aria-labelledby="title desc">
  <title id="title">Pipeline latency and throughput</title>
  <desc id="desc">A non-pipelined processor completes all five stages of one instruction before starting the next, while a five-stage pipeline overlaps four instructions and eventually completes one each cycle.</desc>
  <rect width="1400" height="680" fill="#ffffff"/>
  <text x="700" y="40" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#111827">Pipelining overlaps work; it does not remove work</text>
  <text x="700" y="68" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#4b5563">Each colored block is one logical stage-time. The example assumes balanced stages and no hazards.</text>

  <text x="50" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#111827">Non-pipelined execution</text>
  <text x="50" y="146" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#4b5563">The next instruction waits until all five stages finish.</text>
  <g font-family="Consolas, monospace" font-size="14" fill="#111827">
    <text x="55" y="199">I1</text><text x="55" y="249">I2</text><text x="55" y="299">I3</text><text x="55" y="349">I4</text>
  </g>
  <g stroke="#ffffff" stroke-width="2">
    <rect x="110" y="170" width="56" height="42" fill="#dbeafe"/><rect x="166" y="170" width="56" height="42" fill="#ffedd5"/><rect x="222" y="170" width="56" height="42" fill="#ccfbf1"/><rect x="278" y="170" width="56" height="42" fill="#fef3c7"/><rect x="334" y="170" width="56" height="42" fill="#ede9fe"/>
    <rect x="390" y="220" width="56" height="42" fill="#dbeafe"/><rect x="446" y="220" width="56" height="42" fill="#ffedd5"/><rect x="502" y="220" width="56" height="42" fill="#ccfbf1"/><rect x="558" y="220" width="56" height="42" fill="#fef3c7"/><rect x="614" y="220" width="56" height="42" fill="#ede9fe"/>
    <rect x="670" y="270" width="56" height="42" fill="#dbeafe"/><rect x="726" y="270" width="56" height="42" fill="#ffedd5"/><rect x="782" y="270" width="56" height="42" fill="#ccfbf1"/><rect x="838" y="270" width="56" height="42" fill="#fef3c7"/><rect x="894" y="270" width="56" height="42" fill="#ede9fe"/>
    <rect x="950" y="320" width="56" height="42" fill="#dbeafe"/><rect x="1006" y="320" width="56" height="42" fill="#ffedd5"/><rect x="1062" y="320" width="56" height="42" fill="#ccfbf1"/><rect x="1118" y="320" width="56" height="42" fill="#fef3c7"/><rect x="1174" y="320" width="56" height="42" fill="#ede9fe"/>
  </g>
  <g font-family="Consolas, monospace" font-size="12" text-anchor="middle" fill="#111827">
    <text x="138" y="197">IF</text><text x="194" y="197">ID</text><text x="250" y="197">EX</text><text x="306" y="197">MEM</text><text x="362" y="197">WB</text>
    <text x="418" y="247">IF</text><text x="474" y="247">ID</text><text x="530" y="247">EX</text><text x="586" y="247">MEM</text><text x="642" y="247">WB</text>
    <text x="698" y="297">IF</text><text x="754" y="297">ID</text><text x="810" y="297">EX</text><text x="866" y="297">MEM</text><text x="922" y="297">WB</text>
    <text x="978" y="347">IF</text><text x="1034" y="347">ID</text><text x="1090" y="347">EX</text><text x="1146" y="347">MEM</text><text x="1202" y="347">WB</text>
  </g>
  <line x1="110" y1="380" x2="1230" y2="380" stroke="#374151" stroke-width="2"/>
  <text x="670" y="405" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#4b5563">4 instructions require 20 stage-times</text>

  <text x="50" y="465" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#111827">Five-stage pipelined execution</text>
  <text x="50" y="491" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#4b5563">After filling, one instruction reaches WB every stage-time.</text>
  <g font-family="Consolas, monospace" font-size="14" fill="#111827">
    <text x="55" y="545">I1</text><text x="55" y="585">I2</text><text x="55" y="625">I3</text><text x="55" y="665">I4</text>
  </g>
  <g stroke="#ffffff" stroke-width="2">
    <rect x="110" y="515" width="120" height="34" fill="#dbeafe"/><rect x="230" y="515" width="120" height="34" fill="#ffedd5"/><rect x="350" y="515" width="120" height="34" fill="#ccfbf1"/><rect x="470" y="515" width="120" height="34" fill="#fef3c7"/><rect x="590" y="515" width="120" height="34" fill="#ede9fe"/>
    <rect x="230" y="555" width="120" height="34" fill="#dbeafe"/><rect x="350" y="555" width="120" height="34" fill="#ffedd5"/><rect x="470" y="555" width="120" height="34" fill="#ccfbf1"/><rect x="590" y="555" width="120" height="34" fill="#fef3c7"/><rect x="710" y="555" width="120" height="34" fill="#ede9fe"/>
    <rect x="350" y="595" width="120" height="34" fill="#dbeafe"/><rect x="470" y="595" width="120" height="34" fill="#ffedd5"/><rect x="590" y="595" width="120" height="34" fill="#ccfbf1"/><rect x="710" y="595" width="120" height="34" fill="#fef3c7"/><rect x="830" y="595" width="120" height="34" fill="#ede9fe"/>
    <rect x="470" y="635" width="120" height="34" fill="#dbeafe"/><rect x="590" y="635" width="120" height="34" fill="#ffedd5"/><rect x="710" y="635" width="120" height="34" fill="#ccfbf1"/><rect x="830" y="635" width="120" height="34" fill="#fef3c7"/><rect x="950" y="635" width="120" height="34" fill="#ede9fe"/>
  </g>
  <g font-family="Consolas, monospace" font-size="12" text-anchor="middle" fill="#111827">
    <text x="170" y="538">IF</text><text x="290" y="538">ID</text><text x="410" y="538">EX</text><text x="530" y="538">MEM</text><text x="650" y="538">WB</text>
    <text x="290" y="578">IF</text><text x="410" y="578">ID</text><text x="530" y="578">EX</text><text x="650" y="578">MEM</text><text x="770" y="578">WB</text>
    <text x="410" y="618">IF</text><text x="530" y="618">ID</text><text x="650" y="618">EX</text><text x="770" y="618">MEM</text><text x="890" y="618">WB</text>
    <text x="530" y="658">IF</text><text x="650" y="658">ID</text><text x="770" y="658">EX</text><text x="890" y="658">MEM</text><text x="1010" y="658">WB</text>
  </g>
  <rect x="1120" y="505" width="230" height="142" rx="7" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="1235" y="539" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#111827">What changed?</text>
  <text x="1145" y="570" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#374151">I1 latency: still 5 stages</text>
  <text x="1145" y="598" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#374151">steady throughput: 1 per cycle</text>
  <text x="1145" y="626" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#374151">4 instructions: 8 stage-times</text>
</svg>
