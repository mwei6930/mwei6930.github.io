<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
  <title id="title">The I/O system connects processor-memory state to diverse external devices</title>
  <desc id="desc">CPU cores and memory connect through a system interconnect to storage, network, display, and input controllers. Controllers translate standardized register and queue operations into device-specific timing and protocols.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker><style>.body{font-family:"Segoe UI",Arial,sans-serif;fill:#111827}.small{font-family:"Segoe UI",Arial,sans-serif;fill:#4b5563;font-size:15px}.mono{font-family:Consolas,monospace;fill:#111827;font-size:15px}.line{stroke:#374151;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1500" height="760" fill="#ffffff"/>
  <text x="750" y="42" text-anchor="middle" class="body" font-size="28" font-weight="700">I/O bridges one processor model to many device behaviors</text>
  <text x="750" y="72" text-anchor="middle" class="small">The CPU sees registers, memory buffers, queues, interrupts, and DMA rather than raw motors, radio timing, or flash pulses.</text>
  <rect x="70" y="135" width="310" height="170" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="225" y="176" text-anchor="middle" class="body" font-size="22" font-weight="700">CPU cores</text><text x="225" y="211" text-anchor="middle" class="small">instructions, privilege, exceptions</text><text x="225" y="242" text-anchor="middle" class="small">device driver executes on the CPU</text><text x="225" y="274" text-anchor="middle" class="mono">load / store / fence</text>
  <rect x="70" y="425" width="310" height="170" rx="8" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
  <text x="225" y="466" text-anchor="middle" class="body" font-size="22" font-weight="700">Main memory</text><text x="225" y="501" text-anchor="middle" class="small">buffers and descriptor rings</text><text x="225" y="532" text-anchor="middle" class="small">shared by CPU and DMA-capable devices</text><text x="225" y="564" text-anchor="middle" class="mono">data + control structures</text>
  <rect x="500" y="205" width="300" height="320" rx="8" fill="#f9fafb" stroke="#374151" stroke-width="2"/>
  <text x="650" y="248" text-anchor="middle" class="body" font-size="22" font-weight="700">System interconnect</text><text x="650" y="280" text-anchor="middle" class="small">address, data, ordering, arbitration</text>
  <rect x="555" y="325" width="190" height="60" rx="5" fill="#ffffff" stroke="#6b7280"/><text x="650" y="362" text-anchor="middle" class="mono">MMIO transactions</text>
  <rect x="555" y="410" width="190" height="60" rx="5" fill="#ffffff" stroke="#6b7280"/><text x="650" y="447" text-anchor="middle" class="mono">DMA transactions</text>
  <path d="M380 220 H500" class="line"/><path d="M380 510 H500" class="line"/>
  <rect x="915" y="110" width="250" height="130" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="1040" y="150" text-anchor="middle" class="body" font-size="20" font-weight="700">Storage controller</text><text x="1040" y="182" text-anchor="middle" class="small">queues, ECC, media mapping</text><text x="1040" y="211" text-anchor="middle" class="mono">block interface</text>
  <rect x="1195" y="110" width="250" height="130" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="1320" y="150" text-anchor="middle" class="body" font-size="20" font-weight="700">Network controller</text><text x="1320" y="182" text-anchor="middle" class="small">packets, checksums, link timing</text><text x="1320" y="211" text-anchor="middle" class="mono">stream / packet interface</text>
  <rect x="915" y="315" width="250" height="130" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="1040" y="355" text-anchor="middle" class="body" font-size="20" font-weight="700">Display controller</text><text x="1040" y="387" text-anchor="middle" class="small">scanout timing and frame buffers</text><text x="1040" y="416" text-anchor="middle" class="mono">continuous output</text>
  <rect x="1195" y="315" width="250" height="130" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="1320" y="355" text-anchor="middle" class="body" font-size="20" font-weight="700">Input controller</text><text x="1320" y="387" text-anchor="middle" class="small">sporadic events and debouncing</text><text x="1320" y="416" text-anchor="middle" class="mono">event interface</text>
  <rect x="915" y="520" width="530" height="130" rx="8" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="1180" y="560" text-anchor="middle" class="body" font-size="20" font-weight="700">Controllers hide device-specific physics</text><text x="1180" y="592" text-anchor="middle" class="small">latency, granularity, error detection, clock domains, and protocol state</text><text x="1180" y="620" text-anchor="middle" class="small">are exposed through stable commands, status, queues, and completion events.</text>
  <path d="M800 330 C855 330 855 175 915 175" class="line"/><path d="M800 350 C875 350 1100 175 1195 175" class="line"/><path d="M800 390 H915" class="line"/><path d="M800 410 C875 410 1100 380 1195 380" class="line"/><path d="M800 450 C850 450 850 585 915 585" class="line"/>
  <text x="750" y="718" text-anchor="middle" class="body" font-size="18" font-weight="700">I/O design is mainly about crossing differences in speed, timing, representation, and trust.</text>
</svg>
