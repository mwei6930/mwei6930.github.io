<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" width="698" height="521" viewBox="0 0 698 521"
	xmlns="http://www.w3.org/2000/svg"
	xmlns:xlink="http://www.w3.org/1999/xlink"
	xml:space="preserve">
	<title>Precision of IEEE754 Floating Point Values</title>
	<style type="text/css">
		line{
			fill: none;
			stroke: #000;
			stroke-miterlimit: 10;
		}
		text{
			font-family: sans-serif;
			font-size: 13px;
		}
		.single-precision{ stroke: #00f; }
		.double-precision{ stroke: #f00; }
		.dots{
			fill: none;
			stroke-width: 5;
			stroke-linecap: round;
			stroke-linejoin: round;
			stroke-miterlimit: 10;
			stroke-dasharray: 0, 7.5;
		}
		.hair{ stroke-dasharray: none; }
		.clip{ clip-path: url(#graph-clip); }
		.sup{
			font-size: 9px;
		}
		.frame{
			fill: #fff;
			stroke: #000;
			stroke-miterlimit: 10;
		}
		.grid{
			stroke-dasharray: 3;
			marker-start: url(#tick-start);
			marker-end: url(#tick-end);
		}
		#tick-start,
		#tick-end{
			fill: none;
			stroke: #000;
			stroke-width: 1;
			stroke-miterlimit: 10;
			stroke-dasharray: none;
		}
	</style>
	<defs>
		<rect id="graph-frame" x="76.5" y="33.5" width="576" height="435"/>
		<clipPath id="graph-clip">
			<use xlink:href="#graph-frame" style="overflow: visible;"/>
		</clipPath>
		
		<!-- NOTE: librsvg lacks support for "auto-start-reverse" orientation, hence the duplicate markers -->
		<line id="tick" x1="14" y1="1" x2="0" y2="1"/>
		<marker
			id="tick-start"
			refX="15"
			refY="1"
			markerUnits="strokeWidth"
			markerWidth="14"
			markerHeight="2"
			orient="auto"
			viewBox="0 0 14 2">
			<use xlink:href="#tick"/>
		</marker>
		<marker
			id="tick-end"
			refX="0"
			refY="1"
			markerUnits="strokeWidth"
			markerWidth="14"
			markerHeight="2"
			orient="auto"
			viewBox="0 0 14 2">
			<use xlink:href="#tick"/>
		</marker>
	</defs>
	<rect fill="#ccc" width="698" height="521"/>
	<text x="237" y="23">Precision of IEEE754 Floating Point Values</text>
	
	<g id="graph">
		<use xlink:href="#graph-frame" class="frame"/>
		<g id="grid-vertical" class="clip">
			<line class="grid" x1="124.5" y1="46" x2="124.5" y2="460"/>
			<line class="grid" x1="172.5" y1="46" x2="172.5" y2="460"/>
			<line class="grid" x1="220.5" y1="46" x2="220.5" y2="460"/>
			<line class="grid" x1="268.5" y1="46" x2="268.5" y2="460"/>
			<line class="grid" x1="316.5" y1="46" x2="316.5" y2="460"/>
			<line class="grid" x1="364.5" y1="46" x2="364.5" y2="460"/>
			<line class="grid" x1="412.5" y1="46" x2="412.5" y2="460"/>
			<line class="grid" x1="460.5" y1="46" x2="460.5" y2="460"/>
			<line class="grid" x1="508.5" y1="46" x2="508.5" y2="460"/>
			<line class="grid" x1="556.5" y1="46" x2="556.5" y2="460"/>
			<line class="grid" x1="604.5" y1="46" x2="604.5" y2="460"/>
		</g>
