			<text text-anchor="middle" x="647" y="489">10<tspan x="659" y="480" class="sup">12</tspan></text>
		</g>
	</g>
	
	<g id="y-axis">
		<text text-anchor="middle" transform="rotate(-90)" x="-253" y="33">Floating Point Precision</text>
		<g id="y-labels">
			<text x="44" y="38.3379">10<tspan x="59" y="29.3379" class="sup">10</tspan></text>
			<text x="44" y="59.3379">10<tspan x="59" y="50.3379" class="sup">8</tspan></text>
			<text x="44" y="81.3379">10<tspan x="59" y="72.3379" class="sup">6</tspan></text>
