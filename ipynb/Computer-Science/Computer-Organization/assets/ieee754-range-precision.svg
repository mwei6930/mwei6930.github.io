			<text x="44" y="146.3379">10<tspan x="59" y="137.3379" class="sup">0</tspan></text>
			<text x="44" y="168.3379">10<tspan x="59" y="159.3379" class="sup">-2</tspan></text>
			<text x="44" y="189.3379">10<tspan x="59" y="180.3379" class="sup">-4</tspan></text>
			<text x="44" y="211.3379">10<tspan x="59" y="202.3379" class="sup">-6</tspan></text>
			<text x="44" y="233.3379">10<tspan x="59" y="224.3379" class="sup">-8</tspan></text>
			<text x="44" y="255.3379">10<tspan x="59" y="246.3379" class="sup">-10</tspan></text>
			<text x="44" y="276.3379">10<tspan x="59" y="267.3379" class="sup">-12</tspan></text>
			<text x="44" y="298.3379">10<tspan x="59" y="289.3379" class="sup">-14</tspan></text>
			<text x="44" y="320.3379">10<tspan x="59" y="311.3379" class="sup">-16</tspan></text>
			<text x="44" y="341.3379">10<tspan x="59" y="332.3379" class="sup">-18</tspan></text>
			<text x="44" y="363.3379">10<tspan x="59" y="354.3379" class="sup">-20</tspan></text>
			<text x="44" y="385.3379">10<tspan x="59" y="376.3379" class="sup">-22</tspan></text>
			<text x="44" y="406.3379">10<tspan x="59" y="397.3379" class="sup">-24</tspan></text>
			<text x="44" y="428.3379">10<tspan x="59" y="419.3379" class="sup">-26</tspan></text>
