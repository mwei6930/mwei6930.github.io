			<line class="grid" x1="643" y1="164.551" x2="86" y2="164.551"/>
			<line class="grid" x1="643" y1="142.551" x2="86" y2="142.551"/>
			<line class="grid" x1="643" y1="120.551" x2="86" y2="120.551"/>
			<line class="grid" x1="643" y1="99.551" x2="86" y2="99.551"/>
			<line class="grid" x1="643" y1="77.551" x2="86" y2="77.551"/>
			<line class="grid" x1="643" y1="55.551" x2="86" y2="55.551"/>
			<line class="grid" x1="643" y1="34.5" x2="86" y2="34.5"/>
		</g>
		<g id="grid-plot" class="clip">
			<g>
				<line class="single-precision dots" x1="76.97" y1="348.535" x2="652.03" y2="87.465"/>
				<line class="single-precision hair" x1="76.97" y1="348.535" x2="652.03" y2="87.465"/>
			</g>
			<g>
				<line class="double-precision dots" x1="76.97" y1="442.535" x2="652.03" y2="181.465"/>
				<line class="double-precision hair" x1="76.97" y1="442.535" x2="652.03" y2="181.465"/>
			</g>
		</g>
	</g>
	
	<g id="legend">
		<rect x="381.5" y="41.5" class="frame" width="264" height="42"/>
		<g>
			<text x="432" y="58">IEEE754 Single Precision (32-bit)</text>
			<line class="single-precision hair" x1="389" y1="52.5" x2="428" y2="52.5"/>
			<line class="single-precision dots" x1="409" y1="52.5" x2="409" y2="52.5"/>
		</g>
		<g>
			<text x="432" y="77">IEEE754 Double-Precision (64-bit)</text>
			<line class="double-precision hair" x1="389" y1="71.5" x2="428" y2="71.5"/>
			<line class="double-precision dots" x1="409" y1="71.5" x2="409" y2="71.5"/>
		</g>
	</g>
	
