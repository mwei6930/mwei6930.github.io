<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="820" viewBox="0 0 1580 820" role="img" aria-labelledby="title desc">
  <title id="title">Single-level and two-level page tables for a sparse 32-bit address space</title>
  <desc id="desc">A single-level page table allocates 2 to the twentieth entries and occupies 4 MiB per process. A two-level table splits the VPN into two 10-bit indices, keeps one 4 KiB root, and allocates only the second-level tables needed by populated 4 MiB regions.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker><style>.body{font-family:"Segoe UI",Arial,sans-serif;fill:#111827}.small{font-family:"Segoe UI",Arial,sans-serif;fill:#4b5563;font-size:15px}.mono{font-family:Consolas,monospace;fill:#111827;font-size:16px}.line{stroke:#374151;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1580" height="820" fill="#ffffff"/>
  <text x="790" y="42" text-anchor="middle" class="body" font-size="28" font-weight="700">Sparse spaces favor multi-level page tables</text>
  <text x="790" y="72" text-anchor="middle" class="small">Example: 32-bit VA, 4 KiB pages, 4-byte entries. The 20-bit VPN becomes either one flat index or two 10-bit indices.</text>
  <rect x="60" y="115" width="660" height="610" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="390" y="153" text-anchor="middle" class="body" font-size="23" font-weight="700">Single-level page table</text>
  <rect x="120" y="195" width="540" height="82" rx="5" fill="#ffffff" stroke="#374151"/>
  <text x="390" y="225" text-anchor="middle" class="body" font-size="18" font-weight="700">20-bit VPN</text><text x="390" y="255" text-anchor="middle" class="mono">one index from 0 to 2^20 - 1</text>
  <path d="M390 277 V327" class="line"/>
  <rect x="230" y="330" width="320" height="250" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="390" y="363" text-anchor="middle" class="body" font-size="18" font-weight="700">1,048,576 PTE slots</text>
  <g class="mono"><rect x="280" y="390" width="220" height="38" fill="#dbeafe" stroke="#2563eb"/><text x="390" y="415" text-anchor="middle">PTE[0]</text><rect x="280" y="438" width="220" height="38" fill="#f3f4f6" stroke="#9ca3af"/><text x="390" y="463" text-anchor="middle">mostly invalid...</text><rect x="280" y="486" width="220" height="38" fill="#dbeafe" stroke="#2563eb"/><text x="390" y="511" text-anchor="middle">PTE[2^20-1]</text></g>
  <text x="390" y="620" text-anchor="middle" class="mono">2^20 x 4 B = 4 MiB / process</text>
  <text x="390" y="654" text-anchor="middle" class="small">Fast indexing, but every hole still needs an invalid PTE slot.</text>

  <rect x="860" y="115" width="660" height="610" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="1190" y="153" text-anchor="middle" class="body" font-size="23" font-weight="700">Two-level page table</text>
  <rect x="920" y="195" width="540" height="82" rx="5" fill="#ffffff" stroke="#374151"/>
  <rect x="920" y="195" width="270" height="82" fill="#ede9fe" stroke="#7c3aed"/><rect x="1190" y="195" width="270" height="82" fill="#dbeafe" stroke="#2563eb"/>
  <text x="1055" y="226" text-anchor="middle" class="body" font-size="18" font-weight="700">L1 index: 10 bits</text><text x="1055" y="255" text-anchor="middle" class="mono">VPN[19:10]</text>
  <text x="1325" y="226" text-anchor="middle" class="body" font-size="18" font-weight="700">L2 index: 10 bits</text><text x="1325" y="255" text-anchor="middle" class="mono">VPN[9:0]</text>
  <rect x="940" y="340" width="205" height="220" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="1042" y="371" text-anchor="middle" class="body" font-size="17" font-weight="700">4 KiB root</text>
  <g class="mono"><text x="965" y="411">root[18]</text><text x="965" y="451">root[72]</text><text x="965" y="491">root[900]</text><text x="965" y="531">others invalid</text></g>
  <rect x="1260" y="315" width="220" height="78" rx="5" fill="#dcfce7" stroke="#16a34a"/><text x="1370" y="347" text-anchor="middle" class="body" font-size="16" font-weight="700">leaf table A</text><text x="1370" y="374" text-anchor="middle" class="small">4 KiB, 1024 PTEs</text>
  <rect x="1260" y="420" width="220" height="78" rx="5" fill="#dcfce7" stroke="#16a34a"/><text x="1370" y="452" text-anchor="middle" class="body" font-size="16" font-weight="700">leaf table B</text><text x="1370" y="479" text-anchor="middle" class="small">4 KiB, 1024 PTEs</text>
  <rect x="1260" y="525" width="220" height="78" rx="5" fill="#dcfce7" stroke="#16a34a"/><text x="1370" y="557" text-anchor="middle" class="body" font-size="16" font-weight="700">leaf table C</text><text x="1370" y="584" text-anchor="middle" class="small">4 KiB, 1024 PTEs</text>
  <path d="M1145 401 C1200 401 1200 354 1260 354" class="line"/><path d="M1145 441 C1200 441 1200 459 1260 459" class="line"/><path d="M1145 481 C1200 481 1200 564 1260 564" class="line"/>
  <text x="1190" y="646" text-anchor="middle" class="mono">root 4 KiB + 3 leaves x 4 KiB = 16 KiB</text>
  <text x="1190" y="680" text-anchor="middle" class="small">This sparse example saves space, but a TLB miss may require two dependent PTE reads.</text>
  <rect x="270" y="755" width="1040" height="48" rx="6" fill="#fff7ed" stroke="#ea580c"/><text x="790" y="786" text-anchor="middle" class="body" font-size="17" font-weight="700">Multi-level tables save space only because unused subtrees are not allocated; they do not make a page walk free.</text>
</svg>
