<svg xmlns="http://www.w3.org/2000/svg" width="1350" height="620" viewBox="0 0 1350 620" role="img" aria-labelledby="title desc">
  <title id="title">Single-cycle critical path</title>
  <desc id="desc">The load instruction passes through instruction memory, register read, address calculation, data memory, and write-back, forming the longest example path and setting the clock period for every instruction.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker></defs>
  <rect width="1350" height="620" fill="#ffffff"/>
  <text x="675" y="40" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#111827">The slowest legal path sets the clock for every instruction</text>
  <text x="675" y="70" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#4b5563">Illustrative delays only; real timing analysis includes wires, clock uncertainty, and reconvergent control.</text>

  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="35" y="135" width="145" height="105" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="107" y="170" text-anchor="middle" font-size="17" font-weight="700">PC clock-to-Q</text><text x="107" y="207" text-anchor="middle" font-family="Consolas, monospace" font-size="18">30 ps</text>
    <rect x="230" y="135" width="145" height="105" rx="6" fill="#fefce8" stroke="#a16207" stroke-width="2"/>
    <text x="302" y="170" text-anchor="middle" font-size="17" font-weight="700">Instruction</text><text x="302" y="192" text-anchor="middle" font-size="17" font-weight="700">memory</text><text x="302" y="222" text-anchor="middle" font-family="Consolas, monospace" font-size="18">200 ps</text>
    <rect x="425" y="135" width="145" height="105" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="497" y="170" text-anchor="middle" font-size="17" font-weight="700">Decode and</text><text x="497" y="192" text-anchor="middle" font-size="17" font-weight="700">register read</text><text x="497" y="222" text-anchor="middle" font-family="Consolas, monospace" font-size="18">120 ps</text>
    <rect x="620" y="135" width="145" height="105" rx="6" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
    <text x="692" y="170" text-anchor="middle" font-size="17" font-weight="700">Address ALU</text><text x="692" y="207" text-anchor="middle" font-family="Consolas, monospace" font-size="18">150 ps</text>
    <rect x="815" y="135" width="145" height="105" rx="6" fill="#fefce8" stroke="#a16207" stroke-width="2"/>
    <text x="887" y="170" text-anchor="middle" font-size="17" font-weight="700">Data memory</text><text x="887" y="207" text-anchor="middle" font-family="Consolas, monospace" font-size="18">250 ps</text>
    <rect x="1010" y="135" width="145" height="105" rx="6" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
    <text x="1082" y="170" text-anchor="middle" font-size="17" font-weight="700">Result MUX</text><text x="1082" y="207" text-anchor="middle" font-family="Consolas, monospace" font-size="18">30 ps</text>
    <rect x="1205" y="135" width="110" height="105" rx="6" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
    <text x="1260" y="170" text-anchor="middle" font-size="17" font-weight="700">Register</text><text x="1260" y="192" text-anchor="middle" font-size="17" font-weight="700">setup</text><text x="1260" y="222" text-anchor="middle" font-family="Consolas, monospace" font-size="18">20 ps</text>
  </g>
  <line x1="180" y1="187" x2="228" y2="187" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/><line x1="375" y1="187" x2="423" y2="187" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/><line x1="570" y1="187" x2="618" y2="187" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/><line x1="765" y1="187" x2="813" y2="187" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/><line x1="960" y1="187" x2="1008" y2="187" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/><line x1="1155" y1="187" x2="1203" y2="187" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="190" y="290" width="970" height="72" rx="7" fill="#fee2e2" stroke="#c2410c" stroke-width="2"/>
  <text x="675" y="321" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#9a3412">Illustrative load critical path</text>
  <text x="675" y="348" text-anchor="middle" font-family="Consolas, monospace" font-size="18" fill="#111827">T<tspan baseline-shift="sub" font-size="13">lw</tspan> = 30 + 200 + 120 + 150 + 250 + 30 + 20 = 800 ps</text>

  <text x="75" y="420" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#111827">Useful work by instruction class</text>
  <rect x="75" y="452" width="1040" height="30" rx="4" fill="#dbeafe"/><rect x="75" y="495" width="650" height="30" rx="4" fill="#ccfbf1"/><rect x="75" y="538" width="530" height="30" rx="4" fill="#fef3c7"/>
  <text x="85" y="474" font-family="Consolas, monospace" font-size="15" fill="#111827">lw: fetch + read + ALU + data memory + write-back</text>
  <text x="85" y="517" font-family="Consolas, monospace" font-size="15" fill="#111827">add: fetch + read + ALU + write-back</text>
  <text x="85" y="560" font-family="Consolas, monospace" font-size="15" fill="#111827">beq: fetch + read + compare + next-PC</text>
  <line x1="1115" y1="437" x2="1115" y2="579" stroke="#c2410c" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="1130" y="472" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9a3412">All instructions still wait</text>
  <text x="1130" y="496" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9a3412">for the same 800 ps edge.</text>
  <text x="1130" y="535" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#4b5563">The unused tail is the main</text>
  <text x="1130" y="557" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#4b5563">single-cycle inefficiency.</text>
</svg>
