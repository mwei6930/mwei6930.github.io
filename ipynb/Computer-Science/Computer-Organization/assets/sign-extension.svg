<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-labelledby="title desc">
  <title id="title">Sign extension from eight to sixteen bits</title>
  <desc id="desc">Positive five is widened with zeroes while negative five in two's complement is widened by repeating the sign bit one.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#355070"/></marker>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #202a35; }
      .label { font: 700 19px Arial, sans-serif; fill: #202a35; }
      .mono { font: 700 25px Consolas, monospace; fill: #102a43; letter-spacing: 2px; }
      .body { font: 16px Arial, sans-serif; fill: #475569; }
    </style>
  </defs>
  <rect width="1200" height="450" fill="#ffffff"/>
  <text x="600" y="42" text-anchor="middle" class="title">Sign extension preserves a two's-complement value</text>

  <rect x="60" y="92" width="300" height="108" rx="8" fill="#edf4ff" stroke="#457b9d" stroke-width="2"/>
  <text x="210" y="124" text-anchor="middle" class="label">8-bit +5</text>
  <text x="210" y="166" text-anchor="middle" class="mono"><tspan fill="#e76f51">0</tspan>0000101</text>
  <line x1="372" y1="146" x2="492" y2="146" stroke="#355070" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="432" y="126" text-anchor="middle" class="body">repeat 0</text>
  <rect x="510" y="92" width="620" height="108" rx="8" fill="#e8f3f1" stroke="#2a9d8f" stroke-width="2"/>
  <text x="820" y="124" text-anchor="middle" class="label">16-bit +5</text>
  <text x="820" y="166" text-anchor="middle" class="mono"><tspan fill="#e76f51">00000000</tspan> 00000101</text>

  <rect x="60" y="250" width="300" height="108" rx="8" fill="#fff2e8" stroke="#e76f51" stroke-width="2"/>
  <text x="210" y="282" text-anchor="middle" class="label">8-bit -5</text>
  <text x="210" y="324" text-anchor="middle" class="mono"><tspan fill="#e76f51">1</tspan>1111011</text>
  <line x1="372" y1="304" x2="492" y2="304" stroke="#355070" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="432" y="284" text-anchor="middle" class="body">repeat 1</text>
  <rect x="510" y="250" width="620" height="108" rx="8" fill="#fff8db" stroke="#d4a017" stroke-width="2"/>
  <text x="820" y="282" text-anchor="middle" class="label">16-bit -5</text>
  <text x="820" y="324" text-anchor="middle" class="mono"><tspan fill="#e76f51">11111111</tspan> 11111011</text>

  <text x="600" y="415" text-anchor="middle" class="body">Zero extension is correct for unsigned values; signed two's-complement values require sign extension.</text>
</svg>
