<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Four-bit carry-lookahead organization</title>
  <desc id="desc">Each bit computes propagate and generate signals in parallel. A shared lookahead network computes all carries, after which XOR gates produce the sum bits.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <style>
      .h { font: 700 25px Arial, sans-serif; fill: #0f172a; text-anchor: middle; }
      .t { font: 17px Arial, sans-serif; fill: #334155; text-anchor: middle; }
      .box { stroke-width: 3; rx: 6; }
      .wire { stroke: #475569; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="560" fill="#ffffff"/>
  <text x="600" y="38" class="h">Carry lookahead separates local bit facts from global carry decisions</text>

  <g transform="translate(75 78)">
    <g transform="translate(0 0)"><rect width="210" height="112" class="box" fill="#dbeafe" stroke="#2563eb"/><text x="105" y="37" class="h">Bit 0</text><text x="105" y="68" class="t">P0 = A0 XOR B0</text><text x="105" y="94" class="t">G0 = A0 AND B0</text></g>
    <g transform="translate(280 0)"><rect width="210" height="112" class="box" fill="#ccfbf1" stroke="#0f766e"/><text x="105" y="37" class="h">Bit 1</text><text x="105" y="68" class="t">P1 = A1 XOR B1</text><text x="105" y="94" class="t">G1 = A1 AND B1</text></g>
    <g transform="translate(560 0)"><rect width="210" height="112" class="box" fill="#fef3c7" stroke="#b45309"/><text x="105" y="37" class="h">Bit 2</text><text x="105" y="68" class="t">P2 = A2 XOR B2</text><text x="105" y="94" class="t">G2 = A2 AND B2</text></g>
    <g transform="translate(840 0)"><rect width="210" height="112" class="box" fill="#fee2e2" stroke="#b91c1c"/><text x="105" y="37" class="h">Bit 3</text><text x="105" y="68" class="t">P3 = A3 XOR B3</text><text x="105" y="94" class="t">G3 = A3 AND B3</text></g>
  </g>

  <path class="wire" d="M180 190 V244"/><path class="wire" d="M460 190 V244"/><path class="wire" d="M740 190 V244"/><path class="wire" d="M1020 190 V244"/>
  <rect x="155" y="248" width="890" height="150" class="box" fill="#ede9fe" stroke="#6d28d9"/>
  <text x="600" y="281" class="h">Lookahead carry network</text>
  <text x="600" y="315" class="t">C1 = G0 + P0 C0</text>
  <text x="600" y="344" class="t">C2 = G1 + P1 G0 + P1 P0 C0</text>
  <text x="600" y="373" class="t">C3 and C4 expand the same pattern in parallel</text>
  <path class="wire" d="M76 323 H152"/><text x="75" y="310" class="t">C0</text>

  <path class="wire" d="M260 398 V454"/><path class="wire" d="M485 398 V454"/><path class="wire" d="M715 398 V454"/><path class="wire" d="M940 398 V454"/>
  <g>
    <rect x="180" y="458" width="160" height="66" class="box" fill="#f8fafc" stroke="#475569"/><text x="260" y="486" class="h">S0</text><text x="260" y="511" class="t">P0 XOR C0</text>
    <rect x="405" y="458" width="160" height="66" class="box" fill="#f8fafc" stroke="#475569"/><text x="485" y="486" class="h">S1</text><text x="485" y="511" class="t">P1 XOR C1</text>
    <rect x="635" y="458" width="160" height="66" class="box" fill="#f8fafc" stroke="#475569"/><text x="715" y="486" class="h">S2</text><text x="715" y="511" class="t">P2 XOR C2</text>
    <rect x="860" y="458" width="160" height="66" class="box" fill="#f8fafc" stroke="#475569"/><text x="940" y="486" class="h">S3</text><text x="940" y="511" class="t">P3 XOR C3</text>
  </g>
</svg>
