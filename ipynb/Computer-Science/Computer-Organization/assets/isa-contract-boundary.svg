<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">Instruction set architecture as a contract</title>
  <desc id="desc">Programs and toolchains rely on the ISA contract, while different processor organizations can implement the same contract.</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#374151"/></marker><style>.h{font:700 24px Arial,sans-serif;fill:#111827}.t{font:18px Arial,sans-serif;fill:#374151}.b{stroke:#1f2937;stroke-width:3}.w{stroke:#374151;stroke-width:3;marker-end:url(#a)}.dash{stroke:#be123c;stroke-width:4;stroke-dasharray:10 8}</style></defs>
  <rect x="1.5" y="1.5" width="1117" height="517" rx="8" fill="#fff" stroke="#d1d5db" stroke-width="3"/><text x="560" y="42" text-anchor="middle" class="h">ISA: the stable contract between software and processors</text>
  <rect x="70" y="85" width="280" height="120" rx="8" fill="#dbeafe" class="b"/><text x="210" y="130" text-anchor="middle" class="h">Software</text><text x="210" y="165" text-anchor="middle" class="t">compiler, OS, application</text>
  <rect x="420" y="85" width="280" height="120" rx="8" fill="#ecfdf5" class="b"/><text x="560" y="130" text-anchor="middle" class="h">ISA contract</text><text x="560" y="165" text-anchor="middle" class="t">state, instructions, behavior</text>
  <rect x="770" y="85" width="280" height="120" rx="8" fill="#fef3c7" class="b"/><text x="910" y="130" text-anchor="middle" class="h">Implementation</text><text x="910" y="165" text-anchor="middle" class="t">datapath, control, pipeline</text>
  <line x1="350" y1="145" x2="420" y2="145" class="w"/><line x1="700" y1="145" x2="770" y2="145" class="w"/>
  <line x1="55" y1="255" x2="1065" y2="255" class="dash"/><text x="560" y="245" text-anchor="middle" class="t" fill="#be123c">software-visible boundary</text>
  <rect x="70" y="310" width="280" height="125" rx="8" fill="#f8fafc" class="b"/><text x="210" y="352" text-anchor="middle" class="h">Core A</text><text x="210" y="386" text-anchor="middle" class="t">small multi-cycle processor</text><text x="210" y="414" text-anchor="middle" class="t">same RV32I behavior</text>
  <rect x="420" y="310" width="280" height="125" rx="8" fill="#f8fafc" class="b"/><text x="560" y="352" text-anchor="middle" class="h">Core B</text><text x="560" y="386" text-anchor="middle" class="t">five-stage pipeline</text><text x="560" y="414" text-anchor="middle" class="t">same RV32I behavior</text>
  <rect x="770" y="310" width="280" height="125" rx="8" fill="#f8fafc" class="b"/><text x="910" y="352" text-anchor="middle" class="h">Core C</text><text x="910" y="386" text-anchor="middle" class="t">out-of-order superscalar</text><text x="910" y="414" text-anchor="middle" class="t">same RV32I behavior</text>
  <text x="560" y="485" text-anchor="middle" class="t">Compatibility constrains observable results, not internal organization</text>
</svg>
