<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">RV32I programmer-visible state</title><desc id="desc">The base integer state includes thirty-two 32-bit integer registers, a program counter, and a byte-addressed address space.</desc>
  <defs><style>.h{font:700 24px Arial,sans-serif;fill:#111827}.t{font:18px Arial,sans-serif;fill:#374151}.b{stroke:#1f2937;stroke-width:3}.bit{fill:#fff;stroke:#9ca3af;stroke-width:2}</style></defs>
  <rect x="1.5" y="1.5" width="1117" height="557" rx="8" fill="#fff" stroke="#d1d5db" stroke-width="3"/><text x="560" y="43" text-anchor="middle" class="h">RV32I programmer-visible state</text>
  <rect x="55" y="85" width="420" height="400" rx="8" fill="#eef2ff" class="b"/><text x="265" y="125" text-anchor="middle" class="h">Integer register file</text><text x="265" y="155" text-anchor="middle" class="t">32 registers, XLEN = 32</text>
  <g class="t"><rect x="105" y="185" width="320" height="42" rx="5" class="bit"/><text x="125" y="212">x0 = 0 (hardwired)</text><rect x="105" y="240" width="320" height="42" rx="5" class="bit"/><text x="125" y="267">x1</text><rect x="105" y="295" width="320" height="42" rx="5" class="bit"/><text x="125" y="322">x2</text><rect x="105" y="350" width="320" height="42" rx="5" class="bit"/><text x="125" y="377">...</text><rect x="105" y="405" width="320" height="42" rx="5" class="bit"/><text x="125" y="432">x31</text></g>
  <rect x="535" y="85" width="525" height="170" rx="8" fill="#ecfdf5" class="b"/><text x="798" y="128" text-anchor="middle" class="h">Program counter (pc)</text><rect x="600" y="160" width="395" height="48" rx="5" class="bit"/><text x="798" y="191" text-anchor="middle" class="t">address of the current instruction</text>
  <rect x="535" y="300" width="525" height="185" rx="8" fill="#fef3c7" class="b"/><text x="798" y="343" text-anchor="middle" class="h">Byte-addressed address space</text><rect x="590" y="378" width="105" height="55" class="bit"/><rect x="695" y="378" width="105" height="55" class="bit"/><rect x="800" y="378" width="105" height="55" class="bit"/><rect x="905" y="378" width="105" height="55" class="bit"/><text x="642" y="411" text-anchor="middle" class="t">A</text><text x="747" y="411" text-anchor="middle" class="t">A+1</text><text x="852" y="411" text-anchor="middle" class="t">A+2</text><text x="957" y="411" text-anchor="middle" class="t">A+3</text><text x="798" y="465" text-anchor="middle" class="t">each address identifies one byte</text>
  <text x="560" y="530" text-anchor="middle" class="t">ABI names such as ra, sp, a0, and s0 are software conventions layered on x0-x31</text>
</svg>
