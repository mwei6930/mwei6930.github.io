<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="770" viewBox="0 0 1500 770" role="img" aria-labelledby="title desc">
  <title id="title">SIMT warp execution, divergence, and memory coalescing</title>
  <desc id="desc">A warp contains lanes that execute one instruction together. A data-dependent branch masks different lane subsets and serializes paths. Consecutive addresses combine into fewer memory transactions than scattered addresses.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker><style>.body{font-family:"Segoe UI",Arial,sans-serif;fill:#111827}.small{font-family:"Segoe UI",Arial,sans-serif;fill:#4b5563;font-size:15px}.mono{font-family:Consolas,monospace;fill:#111827;font-size:14px}.line{stroke:#374151;stroke-width:2.4;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1500" height="770" fill="#ffffff"/>
  <text x="750" y="44" text-anchor="middle" class="body" font-size="29" font-weight="700">SIMT throughput depends on lane agreement and memory access shape</text>
  <text x="750" y="75" text-anchor="middle" class="small">The programmer sees threads; the machine schedules groups of lanes that share instruction issue.</text>

  <rect x="55" y="125" width="1390" height="165" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="90" y="163" class="body" font-size="21" font-weight="700">One warp, one issued instruction</text>
  <rect x="110" y="205" width="205" height="54" rx="5" fill="#ffffff" stroke="#2563eb"/><text x="212" y="238" text-anchor="middle" class="mono">instruction: add</text>
  <path d="M315 232 H405" class="line"/>
  <g fill="#dbeafe" stroke="#2563eb"><rect x="430" y="199" width="92" height="66" rx="4"/><rect x="535" y="199" width="92" height="66" rx="4"/><rect x="640" y="199" width="92" height="66" rx="4"/><rect x="745" y="199" width="92" height="66" rx="4"/><rect x="850" y="199" width="92" height="66" rx="4"/><rect x="955" y="199" width="92" height="66" rx="4"/><rect x="1060" y="199" width="92" height="66" rx="4"/><rect x="1165" y="199" width="92" height="66" rx="4"/></g>
  <g text-anchor="middle" class="mono"><text x="476" y="228">lane 0</text><text x="581" y="228">lane 1</text><text x="686" y="228">lane 2</text><text x="791" y="228">lane 3</text><text x="896" y="228">lane 4</text><text x="1001" y="228">lane 5</text><text x="1106" y="228">lane 6</text><text x="1211" y="228">lane 7</text></g>
  <text x="1340" y="228" text-anchor="middle" class="small">different registers</text><text x="1340" y="252" text-anchor="middle" class="small">same instruction</text>

  <rect x="55" y="320" width="675" height="350" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="392" y="360" text-anchor="middle" class="body" font-size="21" font-weight="700">Branch divergence masks lanes</text>
  <text x="392" y="389" text-anchor="middle" class="mono">if (lane_id % 2 == 0) path_A else path_B</text>
  <text x="125" y="445" class="body" font-size="16" font-weight="700">Path A</text>
  <g><rect x="230" y="415" width="52" height="48" fill="#dcfce7" stroke="#16a34a"/><rect x="290" y="415" width="52" height="48" fill="#f3f4f6" stroke="#9ca3af"/><rect x="350" y="415" width="52" height="48" fill="#dcfce7" stroke="#16a34a"/><rect x="410" y="415" width="52" height="48" fill="#f3f4f6" stroke="#9ca3af"/><rect x="470" y="415" width="52" height="48" fill="#dcfce7" stroke="#16a34a"/><rect x="530" y="415" width="52" height="48" fill="#f3f4f6" stroke="#9ca3af"/></g>
  <text x="125" y="525" class="body" font-size="16" font-weight="700">Path B</text>
  <g><rect x="230" y="495" width="52" height="48" fill="#f3f4f6" stroke="#9ca3af"/><rect x="290" y="495" width="52" height="48" fill="#f3e8ff" stroke="#7c3aed"/><rect x="350" y="495" width="52" height="48" fill="#f3f4f6" stroke="#9ca3af"/><rect x="410" y="495" width="52" height="48" fill="#f3e8ff" stroke="#7c3aed"/><rect x="470" y="495" width="52" height="48" fill="#f3f4f6" stroke="#9ca3af"/><rect x="530" y="495" width="52" height="48" fill="#f3e8ff" stroke="#7c3aed"/></g>
  <text x="392" y="592" text-anchor="middle" class="small">the warp executes both paths; inactive lanes do no useful work</text>
  <text x="392" y="624" text-anchor="middle" class="body" font-size="17" font-weight="700">control diversity reduces lane utilization</text>

  <rect x="770" y="320" width="675" height="350" rx="8" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
  <text x="1107" y="360" text-anchor="middle" class="body" font-size="21" font-weight="700">Coalesced addresses reduce transactions</text>
  <text x="835" y="420" class="body" font-size="16" font-weight="700">good</text>
  <g fill="#dcfce7" stroke="#0f766e"><rect x="930" y="392" width="65" height="52"/><rect x="995" y="392" width="65" height="52"/><rect x="1060" y="392" width="65" height="52"/><rect x="1125" y="392" width="65" height="52"/><rect x="1190" y="392" width="65" height="52"/><rect x="1255" y="392" width="65" height="52"/></g>
  <text x="1125" y="476" text-anchor="middle" class="small">adjacent lane addresses combine into a small number of memory transactions</text>
  <text x="835" y="545" class="body" font-size="16" font-weight="700">poor</text>
  <g fill="#fee2e2" stroke="#dc2626"><rect x="930" y="515" width="65" height="52"/><rect x="1030" y="515" width="65" height="52"/><rect x="1150" y="515" width="65" height="52"/><rect x="1280" y="515" width="65" height="52"/></g>
  <text x="1125" y="610" text-anchor="middle" class="small">scattered addresses require more transactions and waste bandwidth</text>
  <text x="1107" y="640" text-anchor="middle" class="body" font-size="17" font-weight="700">data layout is part of GPU performance</text>
  <text x="750" y="728" text-anchor="middle" class="body" font-size="18" font-weight="700">GPUs trade sophisticated single-thread latency reduction for massive throughput across regular parallel work.</text>
</svg>
