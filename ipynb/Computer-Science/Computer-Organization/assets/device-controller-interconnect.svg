<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="790" viewBox="0 0 1560 790" role="img" aria-labelledby="title desc">
  <title id="title">A device controller separates host-visible interface state from device-specific execution</title>
  <desc id="desc">A driver accesses configuration and MMIO registers through an interconnect. The controller contains command queues, control logic, buffers, protocol engines, and an interrupt or message-signaled completion path.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0f766e"/></marker><style>.body{font-family:"Segoe UI",Arial,sans-serif;fill:#111827}.small{font-family:"Segoe UI",Arial,sans-serif;fill:#4b5563;font-size:15px}.mono{font-family:Consolas,monospace;fill:#111827;font-size:15px}.line{stroke:#374151;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.done{stroke:#0f766e;stroke-width:3;fill:none;marker-end:url(#green)}</style></defs>
  <rect width="1560" height="790" fill="#ffffff"/>
  <text x="780" y="42" text-anchor="middle" class="body" font-size="28" font-weight="700">Controller interface outside, protocol machinery inside</text>
  <text x="780" y="72" text-anchor="middle" class="small">The driver controls a documented interface; controller firmware and logic perform device-specific work asynchronously.</text>
  <rect x="55" y="135" width="300" height="500" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="205" y="176" text-anchor="middle" class="body" font-size="22" font-weight="700">Host software</text><text x="205" y="207" text-anchor="middle" class="small">kernel driver</text>
  <rect x="100" y="255" width="210" height="62" rx="5" fill="#ffffff" stroke="#2563eb"/><text x="205" y="293" text-anchor="middle" class="mono">prepare descriptors</text>
  <rect x="100" y="345" width="210" height="62" rx="5" fill="#ffffff" stroke="#2563eb"/><text x="205" y="383" text-anchor="middle" class="mono">write command/doorbell</text>
  <rect x="100" y="435" width="210" height="62" rx="5" fill="#ffffff" stroke="#2563eb"/><text x="205" y="473" text-anchor="middle" class="mono">read status/completion</text>
  <rect x="100" y="525" width="210" height="62" rx="5" fill="#ffffff" stroke="#2563eb"/><text x="205" y="563" text-anchor="middle" class="mono">handle interrupt</text>
  <rect x="440" y="185" width="230" height="400" rx="8" fill="#f9fafb" stroke="#374151" stroke-width="2"/>
  <text x="555" y="226" text-anchor="middle" class="body" font-size="21" font-weight="700">Interconnect</text><text x="555" y="258" text-anchor="middle" class="small">PCIe or on-chip fabric</text>
  <rect x="485" y="315" width="140" height="58" rx="5" fill="#ffffff" stroke="#6b7280"/><text x="555" y="350" text-anchor="middle" class="mono">address route</text>
  <rect x="485" y="400" width="140" height="58" rx="5" fill="#ffffff" stroke="#6b7280"/><text x="555" y="435" text-anchor="middle" class="mono">ordering rules</text>
  <path d="M355 376 H440" class="line"/><path d="M440 466 H355" class="done"/>
  <rect x="755" y="105" width="740" height="570" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="1125" y="147" text-anchor="middle" class="body" font-size="23" font-weight="700">Device controller</text>
  <rect x="805" y="190" width="210" height="160" rx="6" fill="#ffffff" stroke="#7c3aed"/><text x="910" y="225" text-anchor="middle" class="body" font-size="18" font-weight="700">Host-visible interface</text><text x="835" y="265" class="mono">control</text><text x="835" y="295" class="mono">status</text><text x="835" y="325" class="mono">doorbells</text>
  <rect x="1060" y="190" width="180" height="160" rx="6" fill="#fff7ed" stroke="#ea580c"/><text x="1150" y="225" text-anchor="middle" class="body" font-size="18" font-weight="700">Queues</text><text x="1150" y="265" text-anchor="middle" class="mono">commands</text><text x="1150" y="295" text-anchor="middle" class="mono">completions</text><text x="1150" y="325" text-anchor="middle" class="mono">credits</text>
  <rect x="1285" y="190" width="160" height="160" rx="6" fill="#ecfdf5" stroke="#0f766e"/><text x="1365" y="225" text-anchor="middle" class="body" font-size="18" font-weight="700">Buffers</text><text x="1365" y="265" text-anchor="middle" class="mono">data</text><text x="1365" y="295" text-anchor="middle" class="mono">metadata</text><text x="1365" y="325" text-anchor="middle" class="mono">ECC</text>
  <rect x="825" y="425" width="260" height="150" rx="6" fill="#dbeafe" stroke="#2563eb"/><text x="955" y="463" text-anchor="middle" class="body" font-size="19" font-weight="700">Control engine</text><text x="955" y="497" text-anchor="middle" class="small">state machine / firmware</text><text x="955" y="528" text-anchor="middle" class="small">validation, scheduling, errors</text>
  <rect x="1165" y="425" width="260" height="150" rx="6" fill="#fef3c7" stroke="#d97706"/><text x="1295" y="463" text-anchor="middle" class="body" font-size="19" font-weight="700">Device protocol engine</text><text x="1295" y="497" text-anchor="middle" class="small">flash channels, PHY, motor, link</text><text x="1295" y="528" text-anchor="middle" class="small">device clock and error rules</text>
  <path d="M670 340 H805" class="line"/><path d="M1015 270 H1060" class="line"/><path d="M1240 270 H1285" class="line"/><path d="M1150 350 V405 H955 V425" class="line"/><path d="M1085 500 H1165" class="line"/>
  <rect x="500" y="700" width="1060" height="55" rx="6" fill="#ecfdf5" stroke="#0f766e"/><text x="1030" y="734" text-anchor="middle" class="body" font-size="17" font-weight="700">Completion may return as status polling, a queue entry, an interrupt line, or a message-signaled interrupt.</text>
</svg>
