<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" role="img" aria-labelledby="title desc">
  <title id="title">Secret-dependent cache timing channel</title><desc id="desc">A secret selects different memory locations, creating a fast cache-hit or slow cache-miss observation. Constant-work access avoids secret-dependent footprints.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3 0 6Z" fill="#334155"/></marker></defs>
  <rect width="1120" height="500" rx="18" fill="#f8fafc"/>
  <text x="560" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#172033">Timing becomes information when resource use depends on a secret</text>
  <rect x="60" y="112" width="190" height="90" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="155" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#7f1d1d">Secret value</text><text x="155" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#334155">chooses an address</text>
  <path d="M250 157 H340" stroke="#334155" stroke-width="3" marker-end="url(#a)"/>
  <g font-family="Arial, sans-serif" text-anchor="middle"><rect x="350" y="88" width="250" height="67" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="475" y="128" font-size="17" font-weight="700" fill="#1e3a8a">Address A -> cache line A</text><rect x="350" y="180" width="250" height="67" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="475" y="220" font-size="17" font-weight="700" fill="#78350f">Address B -> cache line B</text></g>
  <path d="M600 121 H690" stroke="#2563eb" stroke-width="3" marker-end="url(#a)"/><path d="M600 213 H690" stroke="#d97706" stroke-width="3" marker-end="url(#a)"/>
  <g font-family="Arial, sans-serif" text-anchor="middle"><rect x="700" y="88" width="180" height="67" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="790" y="117" font-size="17" font-weight="700" fill="#14532d">Fast reload</text><text x="790" y="140" font-size="13" fill="#334155">cache hit</text><rect x="700" y="180" width="180" height="67" rx="9" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/><text x="790" y="209" font-size="17" font-weight="700" fill="#581c87">Slow reload</text><text x="790" y="232" font-size="13" fill="#334155">cache miss</text></g>
  <path d="M880 121 H970 V278" fill="none" stroke="#334155" stroke-width="3"/><path d="M880 213 H970 V278" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#a)"/>
  <text x="970" y="316" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#7f1d1d">Timing reveals a bit</text>
  <rect x="170" y="360" width="780" height="82" rx="11" fill="#172033"/>
  <text x="560" y="392" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#fff">Constant-work design</text>
  <text x="560" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#dbeafe">Make control flow, memory footprint, and instruction mix independent of secret data.</text>
</svg>
