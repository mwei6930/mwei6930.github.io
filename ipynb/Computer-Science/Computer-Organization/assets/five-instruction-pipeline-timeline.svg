<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="660" viewBox="0 0 1500 660" role="img" aria-labelledby="title desc">
  <title id="title">Five representative instructions in an ideal five-stage pipeline</title>
  <desc id="desc">ADD, load, store, branch, and JAL enter one per cycle and traverse IF, ID, EX, MEM, and WB. The table is idealized before hazard stalls and flushes.</desc>
  <rect width="1500" height="660" fill="#ffffff"/>
  <text x="750" y="40" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#111827">Five instruction classes, overlapped cycle by cycle</text>
  <text x="750" y="69" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#4b5563">Idealized independent trace: later sections add forwarding, bubbles, and flushes when dependencies make this schedule unsafe.</text>

  <text x="65" y="130" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#111827">Instruction</text>
  <g font-family="Consolas, monospace" font-size="16" text-anchor="middle" fill="#374151">
    <text x="430" y="130">C1</text><text x="550" y="130">C2</text><text x="670" y="130">C3</text><text x="790" y="130">C4</text><text x="910" y="130">C5</text><text x="1030" y="130">C6</text><text x="1150" y="130">C7</text><text x="1270" y="130">C8</text><text x="1390" y="130">C9</text>
  </g>
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="370" y1="100" x2="370" y2="585"/><line x1="490" y1="100" x2="490" y2="585"/><line x1="610" y1="100" x2="610" y2="585"/><line x1="730" y1="100" x2="730" y2="585"/><line x1="850" y1="100" x2="850" y2="585"/><line x1="970" y1="100" x2="970" y2="585"/><line x1="1090" y1="100" x2="1090" y2="585"/><line x1="1210" y1="100" x2="1210" y2="585"/><line x1="1330" y1="100" x2="1330" y2="585"/><line x1="1450" y1="100" x2="1450" y2="585"/>
    <line x1="40" y1="150" x2="1450" y2="150"/><line x1="40" y1="235" x2="1450" y2="235"/><line x1="40" y1="320" x2="1450" y2="320"/><line x1="40" y1="405" x2="1450" y2="405"/><line x1="40" y1="490" x2="1450" y2="490"/><line x1="40" y1="575" x2="1450" y2="575"/>
  </g>
  <g font-family="Consolas, monospace" font-size="16" fill="#111827">
    <text x="55" y="188">add x5,x6,x7</text><text x="55" y="273">lw x8,0(x9)</text><text x="55" y="358">sw x10,4(x11)</text><text x="55" y="443">beq x12,x13,L</text><text x="55" y="528">jal x1,target</text>
  </g>

  <g stroke="#ffffff" stroke-width="2" font-family="Consolas, monospace" font-size="15" text-anchor="middle" fill="#111827">
    <!-- add -->
    <rect x="375" y="160" width="110" height="58" rx="5" fill="#dbeafe"/><text x="430" y="195">IF</text><rect x="495" y="160" width="110" height="58" rx="5" fill="#ffedd5"/><text x="550" y="195">ID</text><rect x="615" y="160" width="110" height="58" rx="5" fill="#ccfbf1"/><text x="670" y="195">EX:add</text><rect x="735" y="160" width="110" height="58" rx="5" fill="#fef3c7"/><text x="790" y="195">MEM:-</text><rect x="855" y="160" width="110" height="58" rx="5" fill="#ede9fe"/><text x="910" y="195">WB:x5</text>
    <!-- load -->
    <rect x="495" y="245" width="110" height="58" rx="5" fill="#dbeafe"/><text x="550" y="280">IF</text><rect x="615" y="245" width="110" height="58" rx="5" fill="#ffedd5"/><text x="670" y="280">ID</text><rect x="735" y="245" width="110" height="58" rx="5" fill="#ccfbf1"/><text x="790" y="280">EX:addr</text><rect x="855" y="245" width="110" height="58" rx="5" fill="#fef3c7"/><text x="910" y="280">MEM:read</text><rect x="975" y="245" width="110" height="58" rx="5" fill="#ede9fe"/><text x="1030" y="280">WB:x8</text>
    <!-- store -->
    <rect x="615" y="330" width="110" height="58" rx="5" fill="#dbeafe"/><text x="670" y="365">IF</text><rect x="735" y="330" width="110" height="58" rx="5" fill="#ffedd5"/><text x="790" y="365">ID</text><rect x="855" y="330" width="110" height="58" rx="5" fill="#ccfbf1"/><text x="910" y="365">EX:addr</text><rect x="975" y="330" width="110" height="58" rx="5" fill="#fef3c7"/><text x="1030" y="365">MEM:write</text><rect x="1095" y="330" width="110" height="58" rx="5" fill="#ede9fe"/><text x="1150" y="365">WB:-</text>
    <!-- branch -->
    <rect x="735" y="415" width="110" height="58" rx="5" fill="#dbeafe"/><text x="790" y="450">IF</text><rect x="855" y="415" width="110" height="58" rx="5" fill="#ffedd5"/><text x="910" y="450">ID</text><rect x="975" y="415" width="110" height="58" rx="5" fill="#ccfbf1"/><text x="1030" y="450">EX:decide</text><rect x="1095" y="415" width="110" height="58" rx="5" fill="#fef3c7"/><text x="1150" y="450">MEM:-</text><rect x="1215" y="415" width="110" height="58" rx="5" fill="#ede9fe"/><text x="1270" y="450">WB:-</text>
    <!-- jal -->
    <rect x="855" y="500" width="110" height="58" rx="5" fill="#dbeafe"/><text x="910" y="535">IF</text><rect x="975" y="500" width="110" height="58" rx="5" fill="#ffedd5"/><text x="1030" y="535">ID</text><rect x="1095" y="500" width="110" height="58" rx="5" fill="#ccfbf1"/><text x="1150" y="535">EX:target</text><rect x="1215" y="500" width="110" height="58" rx="5" fill="#fef3c7"/><text x="1270" y="535">MEM:-</text><rect x="1335" y="500" width="110" height="58" rx="5" fill="#ede9fe"/><text x="1390" y="535">WB:x1</text>
  </g>
  <rect x="330" y="610" width="840" height="34" rx="5" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="750" y="632" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#374151">By cycle 5, five different instructions occupy IF, ID, EX, MEM, and WB simultaneously.</text>
</svg>
