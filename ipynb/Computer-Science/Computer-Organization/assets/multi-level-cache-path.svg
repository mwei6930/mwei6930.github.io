<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="780" viewBox="0 0 1520 780" role="img" aria-labelledby="title desc">
  <title id="title">Instruction and data requests through a multi-level cache hierarchy</title>
  <desc id="desc">The pipeline instruction fetch stage checks L1 instruction cache and the memory stage checks L1 data cache. Misses merge at L2, then continue to the last-level cache and DRAM. A returned block fills levels on the path back to the requester.</desc>
  <defs>
    <marker id="down" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker>
    <marker id="up" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0f766e"/></marker>
    <style>.body{font-family:"Segoe UI",Arial,sans-serif;fill:#111827}.small{font-family:"Segoe UI",Arial,sans-serif;fill:#4b5563;font-size:15px}.mono{font-family:Consolas,monospace;fill:#111827;font-size:15px}.miss{stroke:#374151;stroke-width:3;fill:none;marker-end:url(#down)}.fill{stroke:#0f766e;stroke-width:3;stroke-dasharray:8 6;fill:none;marker-end:url(#up)}</style>
  </defs>
  <rect width="1520" height="780" fill="#ffffff"/>
  <text x="760" y="43" text-anchor="middle" class="body" font-size="28" font-weight="700">A split L1 serves both pipeline request streams before misses converge</text>
  <text x="760" y="74" text-anchor="middle" class="small">The exact sharing and inclusion policy is implementation-specific; the access dependency remains hierarchical.</text>

  <rect x="90" y="120" width="260" height="125" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="220" y="163" text-anchor="middle" class="body" font-size="22" font-weight="700">IF stage</text>
  <text x="220" y="198" text-anchor="middle" class="mono">instruction address</text>
  <text x="220" y="226" text-anchor="middle" class="small">one fetch for each instruction</text>
  <rect x="1170" y="120" width="260" height="125" rx="8" fill="#fefce8" stroke="#a16207" stroke-width="2"/>
  <text x="1300" y="163" text-anchor="middle" class="body" font-size="22" font-weight="700">MEM stage</text>
  <text x="1300" y="198" text-anchor="middle" class="mono">load/store address</text>
  <text x="1300" y="226" text-anchor="middle" class="small">only data-memory instructions</text>

  <rect x="100" y="320" width="300" height="125" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="250" y="363" text-anchor="middle" class="body" font-size="22" font-weight="700" fill="#1d4ed8">L1 instruction cache</text>
  <text x="250" y="397" text-anchor="middle" class="mono">smallest / shortest hit path</text>
  <text x="250" y="425" text-anchor="middle" class="small">optimized for fetch bandwidth</text>
  <rect x="1120" y="320" width="300" height="125" rx="8" fill="#fef3c7" stroke="#a16207" stroke-width="3"/>
  <text x="1270" y="363" text-anchor="middle" class="body" font-size="22" font-weight="700" fill="#854d0e">L1 data cache</text>
  <text x="1270" y="397" text-anchor="middle" class="mono">smallest / shortest hit path</text>
  <text x="1270" y="425" text-anchor="middle" class="small">supports load and store behavior</text>
  <path d="M220 245 V315" class="miss"/><path d="M1300 245 V315" class="miss"/>

  <rect x="570" y="315" width="380" height="135" rx="8" fill="#ecfdf5" stroke="#0f766e" stroke-width="3"/>
  <text x="760" y="356" text-anchor="middle" class="body" font-size="23" font-weight="700" fill="#0f766e">L2 cache</text>
  <text x="760" y="391" text-anchor="middle" class="mono">larger capacity / longer hit time</text>
  <text x="760" y="422" text-anchor="middle" class="small">may be private or shared depending on design</text>
  <path d="M400 382 H565" class="miss"/><path d="M1120 382 H955" class="miss"/>

  <rect x="570" y="515" width="380" height="100" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/>
  <text x="760" y="554" text-anchor="middle" class="body" font-size="22" font-weight="700" fill="#6d28d9">Last-level cache</text>
  <text x="760" y="586" text-anchor="middle" class="mono">large on-chip shared capacity</text>
  <path d="M760 450 V510" class="miss"/>

  <rect x="570" y="675" width="380" height="75" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/>
  <text x="760" y="706" text-anchor="middle" class="body" font-size="21" font-weight="700" fill="#9a3412">DRAM / memory controller</text>
  <text x="760" y="733" text-anchor="middle" class="mono">largest normal working capacity; longest path here</text>
  <path d="M760 615 V670" class="miss"/>

  <path d="M540 712 H485 V490 H250 V450" class="fill"/>
  <path d="M980 712 H1035 V490 H1270 V450" class="fill"/>
  <text x="385" y="535" text-anchor="middle" class="small" fill="#0f766e">instruction block return</text>
  <text x="1135" y="535" text-anchor="middle" class="small" fill="#0f766e">data block return</text>
  <text x="240" y="660" class="body" font-size="18" font-weight="700">Miss consequence</text><text x="240" y="691" class="small">IF may stop admitting instructions.</text><text x="240" y="718" class="small">A load miss can hold dependent execution.</text>
  <text x="1090" y="660" class="body" font-size="18" font-weight="700">Design consequence</text><text x="1090" y="691" class="small">Upper levels optimize hit time.</text><text x="1090" y="718" class="small">Lower levels reduce expensive DRAM visits.</text>
</svg>
