<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="810" viewBox="0 0 1500 810" role="img" aria-labelledby="title desc">
  <title id="title">Snooping and directory cache coherence</title>
  <desc id="desc">A snooping system broadcasts requests over an ordered interconnect, whereas a directory tracks sharers and sends targeted messages to relevant caches.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker><style>.body{font-family:"Segoe UI",Arial,sans-serif;fill:#111827}.small{font-family:"Segoe UI",Arial,sans-serif;fill:#4b5563;font-size:15px}.mono{font-family:Consolas,monospace;fill:#111827;font-size:14px}.line{stroke:#374151;stroke-width:2.4;fill:none;marker-end:url(#arrow)}.dash{stroke:#7c3aed;stroke-width:2.5;fill:none;stroke-dasharray:8 6;marker-end:url(#arrow)}</style></defs>
  <rect width="1500" height="810" fill="#ffffff"/>
  <text x="750" y="44" text-anchor="middle" class="body" font-size="29" font-weight="700">Two ways to discover who has a cache-line copy</text>
  <text x="750" y="75" text-anchor="middle" class="small">Both enforce the same coherence contract; they differ in metadata placement and communication pattern.</text>

  <rect x="45" y="120" width="690" height="610" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="390" y="163" text-anchor="middle" class="body" font-size="23" font-weight="700">Snooping: broadcast on a shared order</text>
  <text x="390" y="192" text-anchor="middle" class="small">every cache observes every coherence request</text>
  <g fill="#ffffff" stroke="#2563eb" stroke-width="2"><rect x="95" y="245" width="125" height="85" rx="6"/><rect x="245" y="245" width="125" height="85" rx="6"/><rect x="395" y="245" width="125" height="85" rx="6"/><rect x="545" y="245" width="125" height="85" rx="6"/></g>
  <g text-anchor="middle" class="body" font-size="16" font-weight="700"><text x="157" y="278">Cache 0</text><text x="307" y="278">Cache 1</text><text x="457" y="278">Cache 2</text><text x="607" y="278">Cache 3</text></g>
  <g text-anchor="middle" class="mono"><text x="157" y="307">I</text><text x="307" y="307">S</text><text x="457" y="307">S</text><text x="607" y="307">I</text></g>
  <path d="M90 410 H675" stroke="#374151" stroke-width="8"/>
  <g stroke="#374151" stroke-width="2"><path d="M157 330 V410"/><path d="M307 330 V410"/><path d="M457 330 V410"/><path d="M607 330 V410"/></g>
  <rect x="200" y="460" width="380" height="74" rx="6" fill="#dbeafe" stroke="#2563eb"/><text x="390" y="491" text-anchor="middle" class="mono">Core 0: GetM(line X)</text><text x="390" y="517" text-anchor="middle" class="small">all caches snoop; sharers invalidate</text>
  <path d="M390 460 V420" class="line"/>
  <text x="390" y="590" text-anchor="middle" class="body" font-size="17" font-weight="700">simple discovery and natural ordering</text><text x="390" y="619" text-anchor="middle" class="small">broadcast traffic and shared interconnect limit scale</text>
  <text x="390" y="671" text-anchor="middle" class="mono">request cost grows with observers</text>

  <rect x="765" y="120" width="690" height="610" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="1110" y="163" text-anchor="middle" class="body" font-size="23" font-weight="700">Directory: track and target sharers</text>
  <text x="1110" y="192" text-anchor="middle" class="small">a home entry records which caches may hold the line</text>
  <g fill="#ffffff" stroke="#7c3aed" stroke-width="2"><rect x="815" y="245" width="125" height="85" rx="6"/><rect x="965" y="245" width="125" height="85" rx="6"/><rect x="1115" y="245" width="125" height="85" rx="6"/><rect x="1265" y="245" width="125" height="85" rx="6"/></g>
  <g text-anchor="middle" class="body" font-size="16" font-weight="700"><text x="877" y="278">Cache 0</text><text x="1027" y="278">Cache 1</text><text x="1177" y="278">Cache 2</text><text x="1327" y="278">Cache 3</text></g>
  <rect x="930" y="410" width="360" height="125" rx="7" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="1110" y="443" text-anchor="middle" class="body" font-size="18" font-weight="700">Directory entry for line X</text><text x="1110" y="475" text-anchor="middle" class="mono">state = Shared</text><text x="1110" y="505" text-anchor="middle" class="mono">sharers = {1, 2}</text>
  <path d="M877 330 C877 380 970 395 1027 410" class="line"/><path d="M1110 410 C1130 380 1160 355 1177 330" class="dash"/><path d="M1160 410 C1230 380 1300 360 1327 330" class="dash"/>
  <text x="1110" y="590" text-anchor="middle" class="body" font-size="17" font-weight="700">targeted traffic scales to many nodes</text><text x="1110" y="619" text-anchor="middle" class="small">directory storage, indirection, and transient states add complexity</text>
  <text x="1110" y="671" text-anchor="middle" class="mono">request cost follows actual sharers</text>
  <text x="750" y="775" text-anchor="middle" class="body" font-size="18" font-weight="700">Snooping answers “who has it?” by asking everyone; a directory remembers the answer.</text>
</svg>
