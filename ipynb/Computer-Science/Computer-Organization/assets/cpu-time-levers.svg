<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="405" viewBox="0 0 1120 405" role="img" aria-labelledby="title desc">
  <title id="title">CPU-time equation and architectural levers</title><desc id="desc">CPU time is the product of instruction count, cycles per instruction, and cycle time, with software, microarchitecture, and technology influencing different factors.</desc>
  <rect width="1120" height="405" rx="18" fill="#f8fafc"/>
  <text x="560" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#172033">CPU time has three multiplicative causes</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="55" y="92" width="270" height="125" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="190" y="130" font-size="22" font-weight="700" fill="#1e3a8a">Instruction count</text><text x="190" y="164" font-size="19" fill="#172033">IC</text><text x="190" y="193" font-size="14" fill="#475569">algorithm, ISA, compiler</text>
    <text x="365" y="162" font-size="35" font-weight="700" fill="#334155">x</text>
    <rect x="425" y="92" width="270" height="125" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="560" y="130" font-size="22" font-weight="700" fill="#14532d">Cycles / instruction</text><text x="560" y="164" font-size="19" fill="#172033">CPI</text><text x="560" y="193" font-size="14" fill="#475569">pipeline, cache, branches</text>
    <text x="735" y="162" font-size="35" font-weight="700" fill="#334155">x</text>
    <rect x="795" y="92" width="270" height="125" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="930" y="130" font-size="22" font-weight="700" fill="#78350f">Cycle time</text><text x="930" y="164" font-size="19" fill="#172033">1 / f</text><text x="930" y="193" font-size="14" fill="#475569">critical path, voltage, process</text>
  </g>
  <rect x="215" y="278" width="690" height="74" rx="12" fill="#172033"/>
  <text x="560" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#fff">T_CPU = IC x CPI x T_cycle</text>
  <text x="560" y="337" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#dbeafe">Improving one factor can worsen another, so compare the final product.</text>
</svg>
