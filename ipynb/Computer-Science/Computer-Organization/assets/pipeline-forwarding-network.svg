<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="820" viewBox="0 0 1560 820" role="img" aria-labelledby="title desc">
  <title id="title">Forwarding network for a five-stage pipeline</title>
  <desc id="desc">ALU operands in the execute stage can be selected from the ID EX register, the newer EX MEM result, or the older MEM WB result. Comparators and priority logic select the nearest matching producer.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker>
    <marker id="fresh" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0f766e"/></marker>
    <marker id="older" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/></marker>
    <style>.body{font-family:"Segoe UI",Arial,sans-serif;fill:#111827}.small{font-family:"Segoe UI",Arial,sans-serif;fill:#4b5563;font-size:15px}.mono{font-family:Consolas,monospace;fill:#374151;font-size:15px}.normal{stroke:#374151;stroke-width:3;fill:none;marker-end:url(#arrow)}.fresh{stroke:#0f766e;stroke-width:4;fill:none;marker-end:url(#fresh)}.older{stroke:#7c3aed;stroke-width:3.5;stroke-dasharray:9 6;fill:none;marker-end:url(#older)}</style>
  </defs>
  <rect width="1560" height="820" fill="#ffffff"/>
  <text x="780" y="42" text-anchor="middle" class="body" font-size="28" font-weight="700">Forward the newest available result directly to the consumer's EX stage</text>
  <text x="780" y="72" text-anchor="middle" class="small">The register file may still contain an old value; bypass paths shorten the producer-to-consumer route.</text>

  <rect x="45" y="120" width="305" height="575" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="197" y="158" text-anchor="middle" class="body" font-size="22" font-weight="700" fill="#9a3412">ID / EX register</text>
  <rect x="85" y="225" width="225" height="76" rx="5" fill="#ffffff" stroke="#c2410c"/>
  <text x="197" y="256" text-anchor="middle" class="body" font-size="18" font-weight="700">stored operand A</text><text x="197" y="282" text-anchor="middle" class="mono">R[rs1]</text>
  <rect x="85" y="400" width="225" height="76" rx="5" fill="#ffffff" stroke="#c2410c"/>
  <text x="197" y="431" text-anchor="middle" class="body" font-size="18" font-weight="700">stored operand B</text><text x="197" y="457" text-anchor="middle" class="mono">R[rs2] / store data</text>
  <rect x="85" y="565" width="225" height="76" rx="5" fill="#ffffff" stroke="#c2410c"/>
  <text x="197" y="596" text-anchor="middle" class="body" font-size="18" font-weight="700">source names</text><text x="197" y="622" text-anchor="middle" class="mono">rs1, rs2</text>

  <polygon points="475,190 570,220 570,330 475,360" fill="#ecfdf5" stroke="#0f766e" stroke-width="3"/>
  <text x="525" y="256" text-anchor="middle" class="body" font-size="19" font-weight="700">MUX A</text><text x="525" y="284" text-anchor="middle" class="mono">00 / 10 / 01</text>
  <polygon points="475,390 570,420 570,530 475,560" fill="#ecfdf5" stroke="#0f766e" stroke-width="3"/>
  <text x="525" y="456" text-anchor="middle" class="body" font-size="19" font-weight="700">MUX B</text><text x="525" y="484" text-anchor="middle" class="mono">00 / 10 / 01</text>
  <rect x="690" y="260" width="220" height="240" rx="8" fill="#ecfdf5" stroke="#0f766e" stroke-width="3"/>
  <text x="800" y="313" text-anchor="middle" class="body" font-size="25" font-weight="700">EX ALU</text>
  <text x="800" y="353" text-anchor="middle" class="mono">operand A</text>
  <text x="800" y="390" text-anchor="middle" class="mono">operation</text>
  <text x="800" y="427" text-anchor="middle" class="mono">operand B</text>
  <text x="800" y="468" text-anchor="middle" class="small">consumer uses values here</text>
  <path d="M310 263 H470" class="normal"/><path d="M310 438 H470" class="normal"/><path d="M570 275 H685" class="normal"/><path d="M570 475 H635 V425 H685" class="normal"/>

  <rect x="1000" y="115" width="260" height="225" rx="8" fill="#ecfdf5" stroke="#0f766e" stroke-width="3"/>
  <text x="1130" y="155" text-anchor="middle" class="body" font-size="22" font-weight="700" fill="#0f766e">EX / MEM</text>
  <text x="1130" y="190" text-anchor="middle" class="small">nearest older instruction</text>
  <rect x="1040" y="215" width="180" height="70" rx="5" fill="#ffffff" stroke="#0f766e"/>
  <text x="1130" y="244" text-anchor="middle" class="body" font-size="17" font-weight="700">ALU result</text><text x="1130" y="269" text-anchor="middle" class="mono">rd + RegWrite</text>

  <rect x="1000" y="440" width="260" height="225" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/>
  <text x="1130" y="480" text-anchor="middle" class="body" font-size="22" font-weight="700" fill="#6d28d9">MEM / WB</text>
  <text x="1130" y="515" text-anchor="middle" class="small">next-nearest producer</text>
  <rect x="1040" y="540" width="180" height="70" rx="5" fill="#ffffff" stroke="#7c3aed"/>
  <text x="1130" y="569" text-anchor="middle" class="body" font-size="17" font-weight="700">WB value</text><text x="1130" y="594" text-anchor="middle" class="mono">rd + RegWrite</text>

  <path d="M1040 250 H955 V170 H430 V220 H470" class="fresh"/>
  <path d="M1040 250 H940 V365 H440 V420 H470" class="fresh"/>
  <path d="M1040 575 H925 V145 H405 V245 H470" class="older"/>
  <path d="M1040 575 H900 V640 H405 V445 H470" class="older"/>

  <rect x="1330" y="200" width="195" height="380" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="2"/>
  <text x="1427" y="241" text-anchor="middle" class="body" font-size="20" font-weight="700">Forward unit</text>
  <text x="1427" y="286" text-anchor="middle" class="mono">compare rd</text>
  <text x="1427" y="314" text-anchor="middle" class="mono">with rs1, rs2</text>
  <line x1="1355" y1="342" x2="1500" y2="342" stroke="#9ca3af"/>
  <text x="1427" y="382" text-anchor="middle" class="small">priority:</text>
  <text x="1427" y="414" text-anchor="middle" class="body" font-size="17" font-weight="700" fill="#0f766e">EX/MEM first</text>
  <text x="1427" y="447" text-anchor="middle" class="body" font-size="17" font-weight="700" fill="#6d28d9">then MEM/WB</text>
  <text x="1427" y="500" text-anchor="middle" class="small">ignore rd = x0</text>
  <text x="1427" y="530" text-anchor="middle" class="small">require RegWrite</text>
  <path d="M1260 240 H1325" class="normal"/><path d="M1260 575 H1290 V520 H1325" class="normal"/><path d="M310 603 H1290 V460 H1325" class="normal"/>
  <text x="780" y="760" text-anchor="middle" class="body" font-size="18" font-weight="700">Example: add x5, x1, x2 followed by sub x7, x5, x3</text>
  <text x="780" y="790" text-anchor="middle" class="small">The add result leaves EX/MEM and reaches the sub ALU input without waiting for register-file write-back.</text>
</svg>
