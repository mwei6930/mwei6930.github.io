<svg xmlns="http://www.w3.org/2000/svg" width="1780" height="940" viewBox="0 0 1780 940" role="img" aria-labelledby="title desc">
  <title id="title">End-to-end NVMe read from application request to DMA completion</title>
  <desc id="desc">A user read enters the kernel, filesystem, block layer, and NVMe driver. The driver builds a command and DMA mappings in memory, advances a submission queue tail, writes a doorbell, the controller fetches the command, reads NAND, DMA-writes the user buffer, posts a completion, and signals or is polled before the task resumes.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0f766e"/></marker><style>.body{font-family:"Segoe UI",Arial,sans-serif;fill:#111827}.small{font-family:"Segoe UI",Arial,sans-serif;fill:#4b5563;font-size:14px}.mono{font-family:Consolas,monospace;fill:#111827;font-size:14px}.line{stroke:#374151;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.data{stroke:#0f766e;stroke-width:4;fill:none;marker-end:url(#green)}</style></defs>
  <rect width="1780" height="940" fill="#ffffff"/>
  <text x="890" y="42" text-anchor="middle" class="body" font-size="28" font-weight="700">One read crosses software, queues, MMIO, DMA, and flash</text>
  <text x="890" y="72" text-anchor="middle" class="small">Control travels through commands and notifications; payload bytes travel directly between the controller and host memory.</text>
  <rect x="45" y="120" width="420" height="700" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="255" y="160" text-anchor="middle" class="body" font-size="22" font-weight="700">Host software on CPU</text>
  <g><rect x="90" y="210" width="330" height="68" rx="5" fill="#ffffff" stroke="#2563eb"/><text x="255" y="238" text-anchor="middle" class="mono">1. application read()</text><text x="255" y="263" text-anchor="middle" class="small">virtual buffer + file offset</text><rect x="90" y="305" width="330" height="68" rx="5" fill="#ffffff" stroke="#2563eb"/><text x="255" y="333" text-anchor="middle" class="mono">2. filesystem / page cache</text><text x="255" y="358" text-anchor="middle" class="small">cache miss creates block request</text><rect x="90" y="400" width="330" height="68" rx="5" fill="#ffffff" stroke="#2563eb"/><text x="255" y="428" text-anchor="middle" class="mono">3. block layer + NVMe driver</text><text x="255" y="453" text-anchor="middle" class="small">merge/schedule and build command</text><rect x="90" y="495" width="330" height="82" rx="5" fill="#fff7ed" stroke="#ea580c"/><text x="255" y="525" text-anchor="middle" class="mono">4. DMA-map pages, publish SQE</text><text x="255" y="551" text-anchor="middle" class="small">barrier before tail/doorbell update</text><rect x="90" y="620" width="330" height="68" rx="5" fill="#fef3c7" stroke="#d97706"/><text x="255" y="648" text-anchor="middle" class="mono">5. MMIO doorbell write</text><text x="255" y="673" text-anchor="middle" class="small">notify controller of new SQ tail</text><rect x="90" y="715" width="330" height="68" rx="5" fill="#dcfce7" stroke="#16a34a"/><text x="255" y="743" text-anchor="middle" class="mono">10. complete and wake task</text><text x="255" y="768" text-anchor="middle" class="small">return bytes to application</text></g>
  <rect x="535" y="120" width="520" height="700" rx="8" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
  <text x="795" y="160" text-anchor="middle" class="body" font-size="22" font-weight="700">Host memory and queues</text>
  <rect x="590" y="220" width="410" height="105" rx="6" fill="#ffffff" stroke="#0f766e"/><text x="795" y="252" text-anchor="middle" class="body" font-size="18" font-weight="700">Submission queue (SQ)</text><text x="625" y="286" class="mono">opcode=READ, LBA, length, PRP/SGL</text><text x="625" y="310" class="small">64-byte command entry in NVMe model</text>
  <rect x="590" y="375" width="410" height="160" rx="6" fill="#d1fae5" stroke="#0f766e"/><text x="795" y="410" text-anchor="middle" class="body" font-size="18" font-weight="700">DMA destination pages</text><text x="795" y="447" text-anchor="middle" class="mono">physical/device-visible addresses</text><text x="795" y="480" text-anchor="middle" class="small">payload lands here without CPU copying each word</text><text x="795" y="510" text-anchor="middle" class="small">later mapped to the process buffer/page cache</text>
  <rect x="590" y="590" width="410" height="105" rx="6" fill="#ffffff" stroke="#0f766e"/><text x="795" y="622" text-anchor="middle" class="body" font-size="18" font-weight="700">Completion queue (CQ)</text><text x="625" y="656" class="mono">command ID, status, phase, SQ head</text><text x="625" y="680" class="small">controller posts completion after data is visible</text>
  <rect x="1135" y="120" width="600" height="700" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="1435" y="160" text-anchor="middle" class="body" font-size="22" font-weight="700">NVMe controller and SSD</text>
  <rect x="1190" y="215" width="490" height="78" rx="6" fill="#ffffff" stroke="#7c3aed"/><text x="1435" y="246" text-anchor="middle" class="mono">6. DMA-fetch new SQ entry</text><text x="1435" y="272" text-anchor="middle" class="small">doorbell provides updated producer position</text>
  <rect x="1190" y="335" width="490" height="100" rx="6" fill="#fef3c7" stroke="#d97706"/><text x="1435" y="368" text-anchor="middle" class="mono">7. FTL locates NAND pages</text><text x="1435" y="396" text-anchor="middle" class="small">schedule channels, read flash, correct errors</text><text x="1435" y="420" text-anchor="middle" class="small">controller buffers the requested payload</text>
  <rect x="1190" y="480" width="490" height="90" rx="6" fill="#dcfce7" stroke="#16a34a"/><text x="1435" y="512" text-anchor="middle" class="mono">8. DMA-write host destination</text><text x="1435" y="540" text-anchor="middle" class="small">payload crosses PCIe into mapped memory pages</text>
  <rect x="1190" y="615" width="490" height="120" rx="6" fill="#dbeafe" stroke="#2563eb"/><text x="1435" y="648" text-anchor="middle" class="mono">9. post CQ entry and notify host</text><text x="1435" y="676" text-anchor="middle" class="small">MSI-X interrupt or polling discovers completion</text><text x="1435" y="704" text-anchor="middle" class="small">driver validates status and unmaps DMA state</text>
  <path d="M420 536 H590" class="line"/><path d="M420 654 C500 654 500 272 590 272" class="line"/>
  <path d="M1000 272 H1190" class="line"/><path d="M1435 293 V335" class="line"/><path d="M1435 435 V480" class="line"/>
  <path d="M1190 525 H1055" class="data"/><path d="M1055 525 H1000 V455" class="data"/>
  <path d="M1435 570 V615" class="line"/><path d="M1190 675 H1000" class="line"/><path d="M590 643 C500 643 500 749 420 749" class="line"/>
  <rect x="310" y="860" width="1160" height="55" rx="6" fill="#fff7ed" stroke="#ea580c"/><text x="890" y="894" text-anchor="middle" class="body" font-size="17" font-weight="700">A storage-backed page fault joins this path after the VM subsystem allocates a frame and requests the missing file or swap block.</text>
</svg>
