<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="800" viewBox="0 0 1500 800" role="img" aria-labelledby="title desc">
  <title id="title">Atomic read-modify-write and load-reserved store-conditional</title>
  <desc id="desc">A broken increment loses an update when two threads separately load and store. An atomic read-modify-write serializes the update, while an LR SC loop retries if another writer invalidates the reservation.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker><style>.body{font-family:"Segoe UI",Arial,sans-serif;fill:#111827}.small{font-family:"Segoe UI",Arial,sans-serif;fill:#4b5563;font-size:15px}.mono{font-family:Consolas,monospace;fill:#111827;font-size:14px}.line{stroke:#374151;stroke-width:2.4;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1500" height="800" fill="#ffffff"/>
  <text x="750" y="44" text-anchor="middle" class="body" font-size="29" font-weight="700">Synchronization starts with an indivisible memory transition</text>
  <text x="750" y="75" text-anchor="middle" class="small">Atomicity protects the update itself; ordering annotations determine what other memory operations become visible around it.</text>

  <rect x="45" y="125" width="440" height="570" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="265" y="166" text-anchor="middle" class="body" font-size="21" font-weight="700">Broken load-add-store</text>
  <text x="265" y="195" text-anchor="middle" class="small">initial counter = 0</text>
  <g fill="#ffffff" stroke="#dc2626"><rect x="92" y="235" width="150" height="55" rx="5"/><rect x="288" y="235" width="150" height="55" rx="5"/><rect x="92" y="315" width="150" height="55" rx="5"/><rect x="288" y="315" width="150" height="55" rx="5"/><rect x="92" y="395" width="150" height="55" rx="5"/><rect x="288" y="395" width="150" height="55" rx="5"/></g>
  <g text-anchor="middle" class="mono"><text x="167" y="269">A loads 0</text><text x="363" y="269">B loads 0</text><text x="167" y="349">A computes 1</text><text x="363" y="349">B computes 1</text><text x="167" y="429">A stores 1</text><text x="363" y="429">B stores 1</text></g>
  <text x="265" y="505" text-anchor="middle" class="body" font-size="19" font-weight="700">final counter = 1</text><text x="265" y="535" text-anchor="middle" class="small">one update is lost</text>
  <rect x="95" y="580" width="340" height="72" rx="6" fill="#fff7ed" stroke="#ea580c"/><text x="265" y="611" text-anchor="middle" class="mono">load + add + store</text><text x="265" y="638" text-anchor="middle" class="small">three separately interleavable actions</text>

  <rect x="530" y="125" width="440" height="570" rx="8" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
  <text x="750" y="166" text-anchor="middle" class="body" font-size="21" font-weight="700">Atomic read-modify-write</text>
  <text x="750" y="195" text-anchor="middle" class="small">the coherence system grants one writer at a time</text>
  <rect x="610" y="245" width="280" height="105" rx="7" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="750" y="282" text-anchor="middle" class="mono">A: fetch_add(1)</text><text x="750" y="317" text-anchor="middle" class="small">reads 0, publishes 1 atomically</text>
  <path d="M750 350 V405" class="line"/>
  <rect x="610" y="410" width="280" height="105" rx="7" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="750" y="447" text-anchor="middle" class="mono">B: fetch_add(1)</text><text x="750" y="482" text-anchor="middle" class="small">reads 1, publishes 2 atomically</text>
  <text x="750" y="570" text-anchor="middle" class="body" font-size="19" font-weight="700">final counter = 2</text>
  <text x="750" y="610" text-anchor="middle" class="small">CAS, AMO, and lock-prefixed operations are common forms</text>
  <text x="750" y="640" text-anchor="middle" class="small">contention still serializes access to this cache line</text>

  <rect x="1015" y="125" width="440" height="570" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="1235" y="166" text-anchor="middle" class="body" font-size="21" font-weight="700">LR/SC retry loop</text>
  <text x="1235" y="195" text-anchor="middle" class="small">conditional store succeeds only while reservation survives</text>
  <rect x="1080" y="235" width="310" height="63" rx="6" fill="#ffffff" stroke="#2563eb"/><text x="1235" y="273" text-anchor="middle" class="mono">old = LR(counter)</text>
  <path d="M1235 298 V335" class="line"/>
  <rect x="1080" y="340" width="310" height="63" rx="6" fill="#ffffff" stroke="#2563eb"/><text x="1235" y="378" text-anchor="middle" class="mono">new = old + 1</text>
  <path d="M1235 403 V440" class="line"/>
  <rect x="1080" y="445" width="310" height="63" rx="6" fill="#ffffff" stroke="#2563eb"/><text x="1235" y="483" text-anchor="middle" class="mono">ok = SC(counter, new)</text>
  <path d="M1080 476 C1035 476 1035 266 1080 266" stroke="#dc2626" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="1025" y="383" text-anchor="middle" class="small" transform="rotate(-90 1025 383)">retry if reservation lost</text>
  <rect x="1080" y="555" width="310" height="82" rx="6" fill="#dbeafe" stroke="#2563eb"/><text x="1235" y="588" text-anchor="middle" class="body" font-size="17" font-weight="700">success establishes atomic update</text><text x="1235" y="616" text-anchor="middle" class="small">acquire/release bits add ordering</text>
  <text x="750" y="758" text-anchor="middle" class="body" font-size="18" font-weight="700">Locks are software protocols built from atomic operations, waiting policies, and memory-order guarantees.</text>
</svg>
