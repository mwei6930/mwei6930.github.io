<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="650" viewBox="0 0 1300 650" role="img" aria-labelledby="title desc">
  <title id="title">Hardwired and microprogrammed control</title>
  <desc id="desc">Hardwired control maps instruction and state bits directly through logic to a control word, while microprogrammed control uses a microprogram counter and control memory to emit a sequence of microinstructions.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker></defs>
  <rect width="1300" height="650" fill="#ffffff"/>
  <text x="650" y="40" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#111827">Two ways to produce the same datapath control word</text>

  <rect x="45" y="80" width="570" height="485" rx="8" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
  <text x="330" y="120" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f766e">Hardwired control</text>
  <rect x="90" y="175" width="175" height="88" rx="6" fill="#ffffff" stroke="#2563eb"/>
  <text x="177" y="207" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#111827">Inputs</text>
  <text x="177" y="235" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#4b5563">opcode, funct, state</text>
  <rect x="330" y="150" width="220" height="138" rx="6" fill="#ffffff" stroke="#0f766e"/>
  <text x="440" y="190" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#111827">Boolean logic / FSM</text>
  <text x="440" y="223" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#4b5563">gates, PLA, synthesized RTL</text>
  <text x="440" y="252" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#4b5563">control = F(inputs)</text>
  <line x1="265" y1="219" x2="328" y2="219" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="175" y="355" width="310" height="84" rx="6" fill="#fff7ed" stroke="#c2410c"/>
  <text x="330" y="387" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#9a3412">Control word this cycle</text>
  <text x="330" y="417" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#111827">enables + MUX selects + ALU op</text>
  <line x1="440" y1="288" x2="405" y2="353" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="330" y="492" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#4b5563">Fast direct response; changes require changing logic.</text>
  <text x="330" y="521" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#4b5563">Natural for regular decoders and small control FSMs.</text>

  <rect x="685" y="80" width="570" height="485" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="970" y="120" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#9a3412">Microprogrammed control</text>
  <rect x="730" y="175" width="145" height="88" rx="6" fill="#ffffff" stroke="#2563eb"/>
  <text x="802" y="207" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#111827">Micro-PC</text>
  <text x="802" y="235" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#4b5563">uPC</text>
  <rect x="935" y="150" width="250" height="138" rx="6" fill="#ffffff" stroke="#a16207"/>
  <text x="1060" y="188" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#111827">Control memory</text>
  <text x="1060" y="220" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#4b5563">one microinstruction per row</text>
  <text x="1060" y="251" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#4b5563">uROM[uPC]</text>
  <line x1="875" y1="219" x2="933" y2="219" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="820" y="355" width="310" height="84" rx="6" fill="#fff7ed" stroke="#c2410c"/>
  <text x="975" y="387" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#9a3412">Microinstruction</text>
  <text x="975" y="417" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#111827">control word + next-uPC rule</text>
  <line x1="1060" y1="288" x2="1035" y2="353" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M820 397 C750 395, 735 315, 800 265" fill="none" stroke="#374151" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="970" y="492" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#4b5563">Complex sequences are easier to describe or patch,</text>
  <text x="970" y="521" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#4b5563">but control-store access and sequencing add overhead.</text>

  <rect x="300" y="590" width="700" height="42" rx="6" fill="#f3f4f6" stroke="#4b5563"/>
  <text x="650" y="617" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#111827">Modern processors often combine hardwired fast paths with microcode for rare or complex operations.</text>
</svg>
