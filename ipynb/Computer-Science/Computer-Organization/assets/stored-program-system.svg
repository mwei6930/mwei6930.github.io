<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
  <title id="title">Stored-program computer and system interconnect</title>
  <desc id="desc">A processor containing a program counter, control unit, registers, and ALU communicates with shared instruction and data memory and I/O devices over address, data, and control paths.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#52606d"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f6fed"/>
    </marker>
  </defs>
  <rect width="1100" height="650" fill="#f8fafc"/>
  <text x="550" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#172b4d">A stored-program computer moves addresses, instructions, and data</text>

  <rect x="50" y="80" width="360" height="395" rx="6" fill="#e8f1ff" stroke="#2f6fed" stroke-width="2"/>
  <text x="230" y="116" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#174ea6">Processor</text>
  <rect x="83" y="145" width="125" height="72" rx="5" fill="#ffffff" stroke="#79a7f2"/>
  <text x="145" y="176" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#253858">Program</text>
  <text x="145" y="199" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#253858">Counter</text>
  <rect x="250" y="145" width="125" height="72" rx="5" fill="#ffffff" stroke="#79a7f2"/>
  <text x="312" y="176" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#253858">Control</text>
  <text x="312" y="199" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#253858">Unit</text>
  <rect x="83" y="255" width="125" height="84" rx="5" fill="#ffffff" stroke="#79a7f2"/>
  <text x="145" y="287" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#253858">Register</text>
  <text x="145" y="311" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#253858">File</text>
  <rect x="250" y="255" width="125" height="84" rx="5" fill="#ffffff" stroke="#79a7f2"/>
  <text x="312" y="287" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#253858">ALU</text>
  <text x="312" y="311" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#253858">compute / compare</text>
  <path d="M208 181 L250 181" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M312 217 L312 255" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M208 297 L250 297" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="83" y="382" width="292" height="54" rx="5" fill="#dce8ff" stroke="#79a7f2"/>
  <text x="229" y="414" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#253858">architectural state changes at instruction boundaries</text>

  <rect x="465" y="80" width="285" height="395" rx="6" fill="#e7f7ef" stroke="#17885b" stroke-width="2"/>
  <text x="607" y="116" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#0c6b45">Shared memory</text>
  <rect x="500" y="148" width="215" height="116" rx="5" fill="#ffffff" stroke="#58b68d"/>
  <text x="607" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#22543d">Instructions</text>
  <text x="525" y="207" font-family="Consolas, monospace" font-size="15" fill="#22543d">0x100: LOAD x1, 0(x2)</text>
  <text x="525" y="232" font-family="Consolas, monospace" font-size="15" fill="#22543d">0x104: ADD  x3, x1, x4</text>
  <rect x="500" y="294" width="215" height="116" rx="5" fill="#ffffff" stroke="#58b68d"/>
  <text x="607" y="324" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#22543d">Program data</text>
  <text x="525" y="353" font-family="Consolas, monospace" font-size="15" fill="#22543d">0x800: 7</text>
  <text x="525" y="378" font-family="Consolas, monospace" font-size="15" fill="#22543d">0x804: 11</text>
  <text x="607" y="444" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#22543d">same addressable storage model</text>

  <rect x="805" y="80" width="245" height="395" rx="6" fill="#fff1df" stroke="#d97706" stroke-width="2"/>
  <text x="927" y="116" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#9a4f00">I/O subsystem</text>
  <rect x="840" y="155" width="175" height="66" rx="5" fill="#ffffff" stroke="#e7a34b"/>
  <text x="927" y="194" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#4b3a2d">display / network</text>
  <rect x="840" y="253" width="175" height="66" rx="5" fill="#ffffff" stroke="#e7a34b"/>
  <text x="927" y="292" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#4b3a2d">keyboard / sensors</text>
  <rect x="840" y="351" width="175" height="66" rx="5" fill="#ffffff" stroke="#e7a34b"/>
  <text x="927" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#4b3a2d">SSD / storage</text>

  <path d="M410 184 L465 184" stroke="#2f6fed" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="437" y="166" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#174ea6">PC address</text>
  <path d="M465 235 L410 235" stroke="#17885b" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="437" y="257" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#22543d">instruction</text>
  <path d="M410 346 L465 346" stroke="#52606d" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M465 386 L410 386" stroke="#52606d" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="437" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#52606d">read / write data</text>

  <path d="M750 280 L805 280" stroke="#52606d" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M805 320 L750 320" stroke="#52606d" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="82" y="525" width="936" height="82" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="132" y1="550" x2="968" y2="550" stroke="#2f6fed" stroke-width="4"/>
  <line x1="132" y1="570" x2="968" y2="570" stroke="#17885b" stroke-width="4"/>
  <line x1="132" y1="590" x2="968" y2="590" stroke="#d97706" stroke-width="4"/>
  <text x="100" y="555" text-anchor="end" font-family="Arial, sans-serif" font-size="14" fill="#174ea6">address</text>
  <text x="100" y="575" text-anchor="end" font-family="Arial, sans-serif" font-size="14" fill="#0c6b45">data</text>
  <text x="100" y="595" text-anchor="end" font-family="Arial, sans-serif" font-size="14" fill="#9a4f00">control</text>
  <text x="550" y="632" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#52606d">A real system may use several point-to-point interconnects, but every transfer still needs destination, payload, and operation semantics.</text>
</svg>
