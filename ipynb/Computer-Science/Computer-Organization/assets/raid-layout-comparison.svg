<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="860" viewBox="0 0 1700 860" role="img" aria-labelledby="title desc">
  <title id="title">RAID levels place data, mirrors, and parity differently across drives</title>
  <desc id="desc">Four panels compare RAID 0 striping, RAID 1 mirroring, RAID 5 distributed parity, and RAID 10 striped mirrors using four equal-size drives. Capacity and tolerated failures differ despite exposing one logical block device.</desc>
  <defs><style>.body{font-family:"Segoe UI",Arial,sans-serif;fill:#111827}.small{font-family:"Segoe UI",Arial,sans-serif;fill:#4b5563;font-size:14px}.mono{font-family:Consolas,monospace;fill:#111827;font-size:14px}</style></defs>
  <rect width="1700" height="860" fill="#ffffff"/>
  <text x="850" y="42" text-anchor="middle" class="body" font-size="28" font-weight="700">RAID changes placement, capacity, and failure behavior</text>
  <text x="850" y="72" text-anchor="middle" class="small">Example uses four drives of size S. Blocks with P are parity; repeated letters are mirrored copies.</text>
  <g transform="translate(35 115)">
    <rect width="390" height="620" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="195" y="40" text-anchor="middle" class="body" font-size="22" font-weight="700">RAID 0: stripe</text><text x="195" y="70" text-anchor="middle" class="small">capacity 4S, tolerates 0 drive failures</text>
    <g class="body" font-size="15"><text x="65" y="112">D0</text><text x="150" y="112">D1</text><text x="235" y="112">D2</text><text x="320" y="112">D3</text></g>
    <g class="mono"><rect x="35" y="130" width="65" height="50" fill="#dbeafe" stroke="#2563eb"/><text x="67" y="161" text-anchor="middle">A0</text><rect x="120" y="130" width="65" height="50" fill="#dcfce7" stroke="#16a34a"/><text x="152" y="161" text-anchor="middle">A1</text><rect x="205" y="130" width="65" height="50" fill="#fef3c7" stroke="#d97706"/><text x="237" y="161" text-anchor="middle">A2</text><rect x="290" y="130" width="65" height="50" fill="#f5f3ff" stroke="#7c3aed"/><text x="322" y="161" text-anchor="middle">A3</text><rect x="35" y="200" width="65" height="50" fill="#dbeafe" stroke="#2563eb"/><text x="67" y="231" text-anchor="middle">B0</text><rect x="120" y="200" width="65" height="50" fill="#dcfce7" stroke="#16a34a"/><text x="152" y="231" text-anchor="middle">B1</text><rect x="205" y="200" width="65" height="50" fill="#fef3c7" stroke="#d97706"/><text x="237" y="231" text-anchor="middle">B2</text><rect x="290" y="200" width="65" height="50" fill="#f5f3ff" stroke="#7c3aed"/><text x="322" y="231" text-anchor="middle">B3</text></g>
    <text x="195" y="315" text-anchor="middle" class="body" font-size="18" font-weight="700">Benefit</text><text x="195" y="345" text-anchor="middle" class="small">all drives contribute capacity and bandwidth</text><text x="195" y="400" text-anchor="middle" class="body" font-size="18" font-weight="700">Failure consequence</text><text x="195" y="430" text-anchor="middle" class="small">any missing stripe member loses the array</text><text x="195" y="525" text-anchor="middle" class="mono">no redundancy</text>
  </g>
  <g transform="translate(445 115)">
    <rect width="390" height="620" rx="8" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="195" y="40" text-anchor="middle" class="body" font-size="22" font-weight="700">RAID 1: mirror</text><text x="195" y="70" text-anchor="middle" class="small">two mirrored pairs here, capacity 2S</text>
    <g class="body" font-size="15"><text x="65" y="112">D0</text><text x="150" y="112">D1</text><text x="235" y="112">D2</text><text x="320" y="112">D3</text></g>
    <g class="mono"><rect x="35" y="130" width="65" height="50" fill="#dbeafe" stroke="#2563eb"/><text x="67" y="161" text-anchor="middle">A</text><rect x="120" y="130" width="65" height="50" fill="#dbeafe" stroke="#2563eb"/><text x="152" y="161" text-anchor="middle">A</text><rect x="205" y="130" width="65" height="50" fill="#dcfce7" stroke="#16a34a"/><text x="237" y="161" text-anchor="middle">B</text><rect x="290" y="130" width="65" height="50" fill="#dcfce7" stroke="#16a34a"/><text x="322" y="161" text-anchor="middle">B</text><rect x="35" y="200" width="65" height="50" fill="#fef3c7" stroke="#d97706"/><text x="67" y="231" text-anchor="middle">C</text><rect x="120" y="200" width="65" height="50" fill="#fef3c7" stroke="#d97706"/><text x="152" y="231" text-anchor="middle">C</text><rect x="205" y="200" width="65" height="50" fill="#f5f3ff" stroke="#7c3aed"/><text x="237" y="231" text-anchor="middle">D</text><rect x="290" y="200" width="65" height="50" fill="#f5f3ff" stroke="#7c3aed"/><text x="322" y="231" text-anchor="middle">D</text></g>
    <text x="195" y="315" text-anchor="middle" class="body" font-size="18" font-weight="700">Benefit</text><text x="195" y="345" text-anchor="middle" class="small">simple recovery and parallel reads</text><text x="195" y="400" text-anchor="middle" class="body" font-size="18" font-weight="700">Failure consequence</text><text x="195" y="430" text-anchor="middle" class="small">survives one failure in each pair</text><text x="195" y="525" text-anchor="middle" class="mono">writes go to both copies</text>
  </g>
  <g transform="translate(855 115)">
    <rect width="390" height="620" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="195" y="40" text-anchor="middle" class="body" font-size="22" font-weight="700">RAID 5: distributed parity</text><text x="195" y="70" text-anchor="middle" class="small">capacity 3S, tolerates 1 drive failure</text>
    <g class="body" font-size="15"><text x="65" y="112">D0</text><text x="150" y="112">D1</text><text x="235" y="112">D2</text><text x="320" y="112">D3</text></g>
    <g class="mono"><rect x="35" y="130" width="65" height="50" fill="#dbeafe" stroke="#2563eb"/><text x="67" y="161" text-anchor="middle">A0</text><rect x="120" y="130" width="65" height="50" fill="#dcfce7" stroke="#16a34a"/><text x="152" y="161" text-anchor="middle">A1</text><rect x="205" y="130" width="65" height="50" fill="#fef3c7" stroke="#d97706"/><text x="237" y="161" text-anchor="middle">A2</text><rect x="290" y="130" width="65" height="50" fill="#fee2e2" stroke="#dc2626"/><text x="322" y="161" text-anchor="middle">PA</text><rect x="35" y="200" width="65" height="50" fill="#dbeafe" stroke="#2563eb"/><text x="67" y="231" text-anchor="middle">B0</text><rect x="120" y="200" width="65" height="50" fill="#dcfce7" stroke="#16a34a"/><text x="152" y="231" text-anchor="middle">B1</text><rect x="205" y="200" width="65" height="50" fill="#fee2e2" stroke="#dc2626"/><text x="237" y="231" text-anchor="middle">PB</text><rect x="290" y="200" width="65" height="50" fill="#f5f3ff" stroke="#7c3aed"/><text x="322" y="231" text-anchor="middle">B2</text></g>
    <text x="195" y="315" text-anchor="middle" class="body" font-size="18" font-weight="700">Benefit</text><text x="195" y="345" text-anchor="middle" class="small">parity rotates; no permanent parity drive</text><text x="195" y="400" text-anchor="middle" class="body" font-size="18" font-weight="700">Failure consequence</text><text x="195" y="430" text-anchor="middle" class="small">reconstruct one missing block with XOR</text><text x="195" y="525" text-anchor="middle" class="mono">small writes update parity</text>
  </g>
  <g transform="translate(1265 115)">
    <rect width="390" height="620" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="195" y="40" text-anchor="middle" class="body" font-size="22" font-weight="700">RAID 10: striped mirrors</text><text x="195" y="70" text-anchor="middle" class="small">capacity 2S, mirror-dependent tolerance</text>
    <g class="body" font-size="15"><text x="65" y="112">D0</text><text x="150" y="112">D1</text><text x="235" y="112">D2</text><text x="320" y="112">D3</text></g>
    <g class="mono"><rect x="35" y="130" width="65" height="50" fill="#dbeafe" stroke="#2563eb"/><text x="67" y="161" text-anchor="middle">A0</text><rect x="120" y="130" width="65" height="50" fill="#dbeafe" stroke="#2563eb"/><text x="152" y="161" text-anchor="middle">A0</text><rect x="205" y="130" width="65" height="50" fill="#dcfce7" stroke="#16a34a"/><text x="237" y="161" text-anchor="middle">A1</text><rect x="290" y="130" width="65" height="50" fill="#dcfce7" stroke="#16a34a"/><text x="322" y="161" text-anchor="middle">A1</text><rect x="35" y="200" width="65" height="50" fill="#fef3c7" stroke="#d97706"/><text x="67" y="231" text-anchor="middle">B0</text><rect x="120" y="200" width="65" height="50" fill="#fef3c7" stroke="#d97706"/><text x="152" y="231" text-anchor="middle">B0</text><rect x="205" y="200" width="65" height="50" fill="#f5f3ff" stroke="#7c3aed"/><text x="237" y="231" text-anchor="middle">B1</text><rect x="290" y="200" width="65" height="50" fill="#f5f3ff" stroke="#7c3aed"/><text x="322" y="231" text-anchor="middle">B1</text></g>
    <text x="195" y="315" text-anchor="middle" class="body" font-size="18" font-weight="700">Benefit</text><text x="195" y="345" text-anchor="middle" class="small">parallelism without parity updates</text><text x="195" y="400" text-anchor="middle" class="body" font-size="18" font-weight="700">Failure consequence</text><text x="195" y="430" text-anchor="middle" class="small">array survives while each pair keeps a copy</text><text x="195" y="525" text-anchor="middle" class="mono">fast rebuild from mirror</text>
  </g>
  <rect x="250" y="780" width="1200" height="50" rx="6" fill="#fee2e2" stroke="#dc2626"/><text x="850" y="812" text-anchor="middle" class="body" font-size="17" font-weight="700">RAID improves availability against selected drive failures; it does not replace backups, checksums, or disaster recovery.</text>
</svg>
