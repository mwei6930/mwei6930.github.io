<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="title desc">
  <title id="title">Cross-coupled NOR SR latch</title>
  <desc id="desc">Two NOR gates feed back into one another. Set and reset inputs control complementary Q and not-Q outputs.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#374151"/></marker><style>.box{fill:#f8fafc;stroke:#1f2937;stroke-width:3}.wire{fill:none;stroke:#374151;stroke-width:3;marker-end:url(#arrow)}.feedback{fill:none;stroke:#0f766e;stroke-width:3;marker-end:url(#arrow)}.label{font:600 22px Arial,sans-serif;fill:#111827}.small{font:18px Arial,sans-serif;fill:#374151}.gate{font:700 25px Arial,sans-serif;fill:#1f2937}</style></defs>
  <rect x="1.5" y="1.5" width="897" height="467" rx="8" fill="#fff" stroke="#d1d5db" stroke-width="3"/>
  <text x="450" y="42" text-anchor="middle" class="label">SR latch: feedback stores one bit</text>
  <rect x="315" y="95" width="210" height="105" rx="8" class="box"/><rect x="315" y="270" width="210" height="105" rx="8" class="box"/>
  <text x="420" y="157" text-anchor="middle" class="gate">NOR</text><text x="420" y="332" text-anchor="middle" class="gate">NOR</text>
  <text x="95" y="147" class="label">R</text><path d="M125 140H315" class="wire"/><text x="95" y="322" class="label">S</text><path d="M125 315H315" class="wire"/>
  <path d="M525 147H760" class="wire"/><text x="785" y="154" class="label">Q</text><path d="M525 322H760" class="wire"/><text x="780" y="329" class="label">Q&#772;</text>
  <path d="M635 147V235H270V300H315" class="feedback"/><path d="M635 322V235H570V125H525" class="feedback"/>
  <circle cx="270" cy="235" r="5" fill="#0f766e"/><circle cx="570" cy="235" r="5" fill="#0f766e"/>
  <rect x="105" y="404" width="690" height="40" rx="5" fill="#ecfdf5" stroke="#6ee7b7"/><text x="450" y="431" text-anchor="middle" class="small">S=1 sets Q; R=1 resets Q; S=R=0 preserves the previous state</text>
</svg>
