<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="700" viewBox="0 0 1450 700" role="img" aria-labelledby="title desc">
  <title id="title">Precise exception handling in an in-order pipeline</title>
  <desc id="desc">Older instructions are allowed to complete, the faulting load records cause and suppresses its normal effects, younger instructions are flushed, and fetch is redirected to the trap vector.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker>
    <marker id="trap" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b91c1c"/></marker>
    <style>.body{font-family:"Segoe UI",Arial,sans-serif;fill:#111827}.small{font-family:"Segoe UI",Arial,sans-serif;fill:#4b5563;font-size:16px}.mono{font-family:Consolas,monospace;fill:#111827;font-size:16px}.flow{stroke:#374151;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1450" height="700" fill="#ffffff"/>
  <text x="725" y="43" text-anchor="middle" class="body" font-size="28" font-weight="700">A precise trap exposes one clean instruction boundary</text>
  <text x="725" y="74" text-anchor="middle" class="small">Snapshot: the load in MEM reports an access fault while older and younger instructions coexist.</text>

  <g transform="translate(40 135)">
    <rect x="0" y="0" width="245" height="230" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
    <text x="122" y="42" text-anchor="middle" class="body" font-size="22" font-weight="700">IF / ID</text>
    <text x="122" y="88" text-anchor="middle" class="mono">younger I3, I4</text>
    <text x="122" y="125" text-anchor="middle" class="small">may be fetched or decoded</text>
    <text x="122" y="170" text-anchor="middle" class="body" font-size="19" font-weight="700" fill="#991b1b">flush valid bits</text>
    <text x="122" y="202" text-anchor="middle" class="small">no architectural effects</text>

    <rect x="285" y="0" width="245" height="230" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
    <text x="407" y="42" text-anchor="middle" class="body" font-size="22" font-weight="700">EX</text>
    <text x="407" y="88" text-anchor="middle" class="mono">younger I2</text>
    <text x="407" y="125" text-anchor="middle" class="small">may have computed internally</text>
    <text x="407" y="170" text-anchor="middle" class="body" font-size="19" font-weight="700" fill="#991b1b">discard result</text>
    <text x="407" y="202" text-anchor="middle" class="small">side effects remain disabled</text>

    <rect x="570" y="-20" width="265" height="270" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/>
    <text x="702" y="32" text-anchor="middle" class="body" font-size="22" font-weight="700" fill="#9a3412">MEM: faulting I1</text>
    <text x="702" y="78" text-anchor="middle" class="mono">lw x5, 0(x6)</text>
    <text x="702" y="113" text-anchor="middle" class="small">data access fault detected</text>
    <line x1="610" y1="137" x2="795" y2="137" stroke="#fdba74"/>
    <text x="702" y="171" text-anchor="middle" class="body" font-size="18" font-weight="700">suppress RegWrite</text>
    <text x="702" y="203" text-anchor="middle" class="mono">mepc = PC(I1)</text>
    <text x="702" y="230" text-anchor="middle" class="mono">mcause, mtval = fault</text>

    <rect x="875" y="0" width="245" height="230" rx="8" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
    <text x="997" y="42" text-anchor="middle" class="body" font-size="22" font-weight="700">WB: older I0</text>
    <text x="997" y="88" text-anchor="middle" class="mono">add x3, x1, x2</text>
    <text x="997" y="125" text-anchor="middle" class="small">finished before the fault</text>
    <text x="997" y="170" text-anchor="middle" class="body" font-size="19" font-weight="700" fill="#0f766e">allow commit</text>
    <text x="997" y="202" text-anchor="middle" class="small">architectural state is preserved</text>

    <rect x="1160" y="0" width="210" height="230" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="1265" y="42" text-anchor="middle" class="body" font-size="22" font-weight="700">Trap entry</text>
    <text x="1265" y="92" text-anchor="middle" class="mono">PC = mtvec</text>
    <text x="1265" y="130" text-anchor="middle" class="small">fetch handler</text>
    <text x="1265" y="171" text-anchor="middle" class="body" font-size="18" font-weight="700" fill="#6d28d9">after boundary</text>
    <text x="1265" y="202" text-anchor="middle" class="small">I0 | I1 trap | I2...</text>
  </g>
  <path d="M742 385 V420 H1140 V365 H1195" stroke="#b91c1c" stroke-width="4" fill="none" marker-end="url(#trap)"/>
  <text x="940" y="446" text-anchor="middle" class="small" fill="#991b1b">redirect after selecting the oldest trap</text>

  <rect x="115" y="465" width="1220" height="150" rx="8" fill="#f9fafb" stroke="#9ca3af"/>
  <text x="725" y="505" text-anchor="middle" class="body" font-size="20" font-weight="700">The age rule determines every action</text>
  <text x="300" y="550" text-anchor="middle" class="body" font-size="18" font-weight="700" fill="#0f766e">older than fault</text><text x="300" y="580" text-anchor="middle" class="small">complete normally</text>
  <text x="725" y="550" text-anchor="middle" class="body" font-size="18" font-weight="700" fill="#9a3412">faulting instruction</text><text x="725" y="580" text-anchor="middle" class="small">record trap, suppress ordinary write</text>
  <text x="1150" y="550" text-anchor="middle" class="body" font-size="18" font-weight="700" fill="#991b1b">younger than fault</text><text x="1150" y="580" text-anchor="middle" class="small">invalidate and restart from handler</text>
  <text x="725" y="665" text-anchor="middle" class="small">Pipeline registers carry PC, valid, exception status, and cause metadata so the control unit can preserve instruction age.</text>
</svg>
