<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="800" viewBox="0 0 1580 800" role="img" aria-labelledby="title desc">
  <title id="title">Translation reach, common latency, and rare page-fault cost</title>
  <desc id="desc">Three panels show that TLB reach equals entries times page size, average translation time weights TLB hit and miss paths, and even a very small page-fault probability can dominate effective access time because storage service is many orders of magnitude slower.</desc>
  <defs><style>.body{font-family:"Segoe UI",Arial,sans-serif;fill:#111827}.small{font-family:"Segoe UI",Arial,sans-serif;fill:#4b5563;font-size:15px}.mono{font-family:Consolas,monospace;fill:#111827;font-size:16px}</style></defs>
  <rect width="1580" height="800" fill="#ffffff"/>
  <text x="790" y="42" text-anchor="middle" class="body" font-size="28" font-weight="700">Three scales of translation cost</text>
  <text x="790" y="72" text-anchor="middle" class="small">The scales differ: TLB events cost processor cycles, while a storage-backed page fault can cost millions of nanoseconds.</text>
  <rect x="55" y="120" width="460" height="565" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="285" y="158" text-anchor="middle" class="body" font-size="22" font-weight="700">1. TLB reach</text>
  <text x="285" y="205" text-anchor="middle" class="mono">reach = entries x page size</text>
  <rect x="110" y="255" width="350" height="75" rx="6" fill="#dbeafe" stroke="#2563eb"/><text x="285" y="286" text-anchor="middle" class="body" font-size="17" font-weight="700">64 entries x 4 KiB</text><text x="285" y="314" text-anchor="middle" class="mono">= 256 KiB reach</text>
  <rect x="110" y="360" width="350" height="75" rx="6" fill="#dcfce7" stroke="#16a34a"/><text x="285" y="391" text-anchor="middle" class="body" font-size="17" font-weight="700">64 entries x 2 MiB</text><text x="285" y="419" text-anchor="middle" class="mono">= 128 MiB reach</text>
  <text x="285" y="482" text-anchor="middle" class="small">Larger pages cover more memory per entry,</text><text x="285" y="506" text-anchor="middle" class="small">but can waste memory and complicate allocation.</text>
  <text x="285" y="570" text-anchor="middle" class="body" font-size="17" font-weight="700">Working set larger than reach</text><text x="285" y="599" text-anchor="middle" class="small">can create repeated TLB replacement misses.</text>

  <rect x="560" y="120" width="460" height="565" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="790" y="158" text-anchor="middle" class="body" font-size="22" font-weight="700">2. Ordinary translation time</text>
  <text x="790" y="205" text-anchor="middle" class="mono">EAT = h T_hit + (1-h) T_miss</text>
  <rect x="620" y="255" width="340" height="90" rx="6" fill="#dcfce7" stroke="#16a34a"/><text x="790" y="290" text-anchor="middle" class="body" font-size="17" font-weight="700">TLB hit: probability h</text><text x="790" y="319" text-anchor="middle" class="small">TLB check + requested cache access</text>
  <rect x="620" y="380" width="340" height="105" rx="6" fill="#fff7ed" stroke="#ea580c"/><text x="790" y="415" text-anchor="middle" class="body" font-size="17" font-weight="700">TLB miss: probability 1-h</text><text x="790" y="444" text-anchor="middle" class="small">page walk + refill + requested access</text><text x="790" y="468" text-anchor="middle" class="small">each PTE read uses the cache hierarchy</text>
  <text x="790" y="548" text-anchor="middle" class="small">A multi-level walk is a chain of dependent reads.</text><text x="790" y="576" text-anchor="middle" class="small">Walk caches and overlapping hardware reduce,</text><text x="790" y="600" text-anchor="middle" class="small">but do not remove, the miss penalty.</text>

  <rect x="1065" y="120" width="460" height="565" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="1295" y="158" text-anchor="middle" class="body" font-size="22" font-weight="700">3. Rare page-fault path</text>
  <text x="1295" y="205" text-anchor="middle" class="mono">EAT = (1-p) T_normal + p T_fault</text>
  <rect x="1125" y="255" width="340" height="75" rx="6" fill="#dcfce7" stroke="#16a34a"/><text x="1295" y="286" text-anchor="middle" class="body" font-size="17" font-weight="700">normal access</text><text x="1295" y="314" text-anchor="middle" class="mono">T_normal = 100 ns</text>
  <rect x="1125" y="360" width="340" height="75" rx="6" fill="#fee2e2" stroke="#dc2626"/><text x="1295" y="391" text-anchor="middle" class="body" font-size="17" font-weight="700">storage-backed fault</text><text x="1295" y="419" text-anchor="middle" class="mono">T_fault = 8,000,000 ns</text>
  <text x="1295" y="480" text-anchor="middle" class="body" font-size="17" font-weight="700">To keep EAT below 200 ns:</text><text x="1295" y="516" text-anchor="middle" class="mono">p &lt;= 1.25 x 10^-5</text><text x="1295" y="548" text-anchor="middle" class="small">roughly fewer than one such fault</text><text x="1295" y="572" text-anchor="middle" class="small">per 80,000 memory accesses</text>
  <text x="1295" y="625" text-anchor="middle" class="small">Actual latency varies; the scale difference is the lesson.</text>
  <rect x="245" y="720" width="1090" height="52" rx="6" fill="#f9fafb" stroke="#9ca3af"/><text x="790" y="753" text-anchor="middle" class="body" font-size="17" font-weight="700">Huge pages improve reach and reduce page-table depth, but trade against internal fragmentation and allocation flexibility.</text>
</svg>
