<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="850" viewBox="0 0 1450 850" role="img" aria-labelledby="title desc">
  <title id="title">Flynn taxonomy as a two by two matrix</title>
  <desc id="desc">Architectures are classified by whether they process single or multiple instruction streams and single or multiple data streams, producing SISD, SIMD, MISD, and MIMD.</desc>
  <defs><style>.body{font-family:"Segoe UI",Arial,sans-serif;fill:#111827}.small{font-family:"Segoe UI",Arial,sans-serif;fill:#4b5563;font-size:16px}.mono{font-family:Consolas,monospace;fill:#111827;font-size:16px}</style></defs>
  <rect width="1450" height="850" fill="#ffffff"/>
  <text x="725" y="45" text-anchor="middle" class="body" font-size="29" font-weight="700">Flynn's taxonomy classifies streams, not product names</text>
  <text x="725" y="76" text-anchor="middle" class="small">Ask how many instruction streams and how many data streams are active in the model being described.</text>
  <text x="790" y="126" text-anchor="middle" class="body" font-size="20" font-weight="700">Single data stream</text>
  <text x="1150" y="126" text-anchor="middle" class="body" font-size="20" font-weight="700">Multiple data streams</text>
  <text x="180" y="320" text-anchor="middle" class="body" font-size="20" font-weight="700" transform="rotate(-90 180 320)">Single instruction stream</text>
  <text x="180" y="650" text-anchor="middle" class="body" font-size="20" font-weight="700" transform="rotate(-90 180 650)">Multiple instruction streams</text>

  <rect x="300" y="155" width="470" height="280" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="535" y="198" text-anchor="middle" class="body" font-size="27" font-weight="700">SISD</text>
  <text x="535" y="228" text-anchor="middle" class="small">one instruction stream, one data stream</text>
  <rect x="370" y="270" width="135" height="62" rx="5" fill="#ffffff" stroke="#2563eb"/><text x="437" y="307" text-anchor="middle" class="mono">instruction</text>
  <rect x="565" y="270" width="135" height="62" rx="5" fill="#ffffff" stroke="#2563eb"/><text x="632" y="307" text-anchor="middle" class="mono">data</text>
  <path d="M505 301 H565" stroke="#374151" stroke-width="2.5"/>
  <text x="535" y="381" text-anchor="middle" class="body" font-size="17" font-weight="700">ordinary scalar execution</text>

  <rect x="800" y="155" width="470" height="280" rx="8" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
  <text x="1035" y="198" text-anchor="middle" class="body" font-size="27" font-weight="700">SIMD</text>
  <text x="1035" y="228" text-anchor="middle" class="small">one instruction stream, many data elements</text>
  <rect x="865" y="270" width="150" height="62" rx="5" fill="#ffffff" stroke="#0f766e"/><text x="940" y="307" text-anchor="middle" class="mono">add vector</text>
  <g fill="#ffffff" stroke="#0f766e"><rect x="1055" y="258" width="65" height="42" rx="4"/><rect x="1130" y="258" width="65" height="42" rx="4"/><rect x="1055" y="311" width="65" height="42" rx="4"/><rect x="1130" y="311" width="65" height="42" rx="4"/></g>
  <text x="1035" y="381" text-anchor="middle" class="body" font-size="17" font-weight="700">SIMD instructions and vector machines</text>

  <rect x="300" y="465" width="470" height="280" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="535" y="508" text-anchor="middle" class="body" font-size="27" font-weight="700">MISD</text>
  <text x="535" y="538" text-anchor="middle" class="small">many instruction streams, one data stream</text>
  <g fill="#ffffff" stroke="#ea580c"><rect x="365" y="578" width="115" height="48" rx="4"/><rect x="495" y="578" width="115" height="48" rx="4"/><rect x="625" y="578" width="90" height="48" rx="4"/></g>
  <g text-anchor="middle" class="mono"><text x="422" y="607">stage A</text><text x="552" y="607">stage B</text><text x="670" y="607">vote</text></g>
  <text x="535" y="683" text-anchor="middle" class="body" font-size="17" font-weight="700">rare; redundant or specialized pipelines</text>

  <rect x="800" y="465" width="470" height="280" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="1035" y="508" text-anchor="middle" class="body" font-size="27" font-weight="700">MIMD</text>
  <text x="1035" y="538" text-anchor="middle" class="small">many instruction streams, many data streams</text>
  <g fill="#ffffff" stroke="#7c3aed"><rect x="858" y="578" width="165" height="55" rx="5"/><rect x="1047" y="578" width="165" height="55" rx="5"/></g>
  <text x="940" y="612" text-anchor="middle" class="mono">core 0 / data A</text><text x="1129" y="612" text-anchor="middle" class="mono">core 1 / data B</text>
  <text x="1035" y="683" text-anchor="middle" class="body" font-size="17" font-weight="700">multicore CPUs and distributed systems</text>
  <text x="725" y="812" text-anchor="middle" class="body" font-size="18" font-weight="700">A machine can combine categories: a MIMD multicore CPU may execute SIMD instructions inside every core.</text>
</svg>
