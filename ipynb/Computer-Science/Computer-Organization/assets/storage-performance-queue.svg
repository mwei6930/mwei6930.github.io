<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="800" viewBox="0 0 1580 800" role="img" aria-labelledby="title desc">
  <title id="title">Storage performance combines per-request latency, concurrency, and transferred bytes</title>
  <desc id="desc">A queue with four outstanding requests feeds a device that completes requests over time. The diagram distinguishes latency, IOPS, bandwidth, queue depth, and tail latency, and relates average concurrency to arrival rate and response time through Little's Law.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker><style>.body{font-family:"Segoe UI",Arial,sans-serif;fill:#111827}.small{font-family:"Segoe UI",Arial,sans-serif;fill:#4b5563;font-size:15px}.mono{font-family:Consolas,monospace;fill:#111827;font-size:15px}.line{stroke:#374151;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1580" height="800" fill="#ffffff"/>
  <text x="790" y="42" text-anchor="middle" class="body" font-size="28" font-weight="700">Latency describes one request; throughput describes sustained work</text>
  <text x="790" y="72" text-anchor="middle" class="small">Queue depth exposes parallelism but can also increase waiting time, especially near saturation.</text>
  <rect x="55" y="125" width="850" height="475" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="480" y="165" text-anchor="middle" class="body" font-size="22" font-weight="700">Four outstanding requests</text>
  <g><rect x="100" y="230" width="170" height="65" rx="5" fill="#dbeafe" stroke="#2563eb"/><text x="185" y="269" text-anchor="middle" class="mono">R1: 4 KiB read</text><rect x="100" y="315" width="170" height="65" rx="5" fill="#dbeafe" stroke="#2563eb"/><text x="185" y="354" text-anchor="middle" class="mono">R2: 4 KiB read</text><rect x="100" y="400" width="170" height="65" rx="5" fill="#dbeafe" stroke="#2563eb"/><text x="185" y="439" text-anchor="middle" class="mono">R3: 128 KiB read</text><rect x="100" y="485" width="170" height="65" rx="5" fill="#dbeafe" stroke="#2563eb"/><text x="185" y="524" text-anchor="middle" class="mono">R4: 4 KiB write</text></g>
  <rect x="380" y="235" width="210" height="300" rx="8" fill="#f9fafb" stroke="#374151" stroke-width="2"/><text x="485" y="274" text-anchor="middle" class="body" font-size="20" font-weight="700">Device scheduler</text><text x="485" y="310" text-anchor="middle" class="small">parallel channels</text><text x="485" y="340" text-anchor="middle" class="small">reordering / fairness</text><text x="485" y="370" text-anchor="middle" class="small">internal queues</text><rect x="425" y="420" width="120" height="60" rx="5" fill="#ffffff" stroke="#6b7280"/><text x="485" y="456" text-anchor="middle" class="mono">service</text>
  <path d="M270 262 H380" class="line"/><path d="M270 347 H380" class="line"/><path d="M270 432 H380" class="line"/><path d="M270 517 H380" class="line"/>
  <line x1="660" y1="380" x2="850" y2="380" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/><text x="755" y="365" text-anchor="middle" class="small">completions over time</text>
  <g><circle cx="690" cy="420" r="18" fill="#dcfce7" stroke="#16a34a"/><text x="690" y="426" text-anchor="middle" class="mono">1</text><circle cx="745" cy="420" r="18" fill="#dcfce7" stroke="#16a34a"/><text x="745" y="426" text-anchor="middle" class="mono">2</text><circle cx="800" cy="420" r="18" fill="#dcfce7" stroke="#16a34a"/><text x="800" y="426" text-anchor="middle" class="mono">3</text><circle cx="855" cy="420" r="18" fill="#dcfce7" stroke="#16a34a"/><text x="855" y="426" text-anchor="middle" class="mono">4</text></g>
  <rect x="980" y="125" width="545" height="475" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="1252" y="165" text-anchor="middle" class="body" font-size="22" font-weight="700">Metrics answer different questions</text>
  <g class="body" font-size="17"><text x="1030" y="225" font-weight="700">Latency</text><text x="1190" y="225" class="small">submission to completion for one request</text><text x="1030" y="275" font-weight="700">IOPS</text><text x="1190" y="275" class="small">completed operations per second</text><text x="1030" y="325" font-weight="700">Bandwidth</text><text x="1190" y="325" class="small">bytes completed per second</text><text x="1030" y="375" font-weight="700">Queue depth</text><text x="1190" y="375" class="small">requests outstanding concurrently</text><text x="1030" y="425" font-weight="700">Tail latency</text><text x="1190" y="425" class="small">slow percentiles such as p99 or p999</text></g>
  <text x="1252" y="500" text-anchor="middle" class="mono">Bandwidth = IOPS x average request bytes</text><text x="1252" y="545" text-anchor="middle" class="mono">N = lambda x W   (Little's Law)</text><text x="1252" y="575" text-anchor="middle" class="small">average in-flight N = completion rate lambda x average time W</text>
  <rect x="235" y="665" width="1110" height="90" rx="7" fill="#fff7ed" stroke="#ea580c"/><text x="790" y="698" text-anchor="middle" class="body" font-size="18" font-weight="700">More queue depth helps only while the device has unused parallelism.</text><text x="790" y="727" text-anchor="middle" class="small">Beyond saturation, extra requests mostly wait longer; average throughput flattens while tail latency rises.</text>
</svg>
