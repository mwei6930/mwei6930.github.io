<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 570" role="img" aria-labelledby="title desc">
  <title id="title">CPU performance equation and worked comparison</title>
  <desc id="desc">CPU time is instruction count multiplied by cycles per instruction and cycle time; two worked designs show why clock rate alone is insufficient.</desc>
  <rect width="1100" height="570" fill="#f8fafc"/>
  <text x="550" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#172b4d">CPU time separates software work from hardware execution cost</text>

  <rect x="100" y="82" width="900" height="82" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="550" y="122" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#172b4d">CPU time = Instruction Count x CPI x Cycle Time</text>
  <text x="550" y="151" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#52606d">equivalently: CPU time = IC x CPI / Clock Rate</text>

  <rect x="55" y="205" width="235" height="150" rx="6" fill="#e8f1ff" stroke="#2f6fed" stroke-width="2"/>
  <text x="172" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#174ea6">Instruction Count</text>
  <text x="172" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#253858">dynamic instructions</text>
  <text x="172" y="294" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#253858">for this workload</text>
  <text x="172" y="329" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#52606d">affected by algorithm, compiler, ISA</text>

  <rect x="315" y="205" width="235" height="150" rx="6" fill="#e7f7ef" stroke="#17885b" stroke-width="2"/>
  <text x="432" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#0c6b45">CPI</text>
  <text x="432" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#22543d">average cycles needed</text>
  <text x="432" y="294" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#22543d">per executed instruction</text>
  <text x="432" y="329" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#52606d">affected by pipeline, cache, workload</text>

  <rect x="575" y="205" width="235" height="150" rx="6" fill="#fff1df" stroke="#d97706" stroke-width="2"/>
  <text x="692" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#9a4f00">Cycle Time</text>
  <text x="692" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#4b3a2d">seconds per clock cycle</text>
  <text x="692" y="294" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#4b3a2d">inverse of clock rate</text>
  <text x="692" y="329" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#52606d">limited by critical path and technology</text>

  <rect x="835" y="205" width="210" height="150" rx="6" fill="#f2eafe" stroke="#7e57c2" stroke-width="2"/>
  <text x="940" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#5e3c99">Clock Rate</text>
  <text x="940" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#44345d">cycles per second</text>
  <text x="940" y="294" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#44345d">for example, 3 GHz</text>
  <text x="940" y="329" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#52606d">not performance by itself</text>

  <rect x="80" y="402" width="440" height="115" rx="6" fill="#ffffff" stroke="#2f6fed" stroke-width="1.5"/>
  <text x="300" y="433" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#174ea6">Design A</text>
  <text x="300" y="463" text-anchor="middle" font-family="Consolas, monospace" font-size="16" fill="#253858">2.0B x 1.2 / 3.0GHz = 0.80 s</text>
  <text x="300" y="492" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#52606d">lower clock rate, lower CPI</text>

  <rect x="580" y="402" width="440" height="115" rx="6" fill="#ffffff" stroke="#17885b" stroke-width="1.5"/>
  <text x="800" y="433" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0c6b45">Design B</text>
  <text x="800" y="463" text-anchor="middle" font-family="Consolas, monospace" font-size="16" fill="#22543d">1.6B x 1.8 / 4.0GHz = 0.72 s</text>
  <text x="800" y="492" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#52606d">higher CPI, but less total CPU time</text>
  <text x="550" y="552" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#172b4d">Design B is 0.80 / 0.72 = 1.11 times as fast for this workload.</text>
</svg>
