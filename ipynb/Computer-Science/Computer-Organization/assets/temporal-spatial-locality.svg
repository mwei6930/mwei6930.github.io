<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="700" viewBox="0 0 1420 700" role="img" aria-labelledby="title desc">
  <title id="title">Temporal and spatial locality in an address trace</title>
  <desc id="desc">Temporal locality is shown by repeated references to the same block within a short time. Spatial locality is shown by sequential references to nearby bytes that share one cache block.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker>
    <style>.body{font-family:"Segoe UI",Arial,sans-serif;fill:#111827}.small{font-family:"Segoe UI",Arial,sans-serif;fill:#4b5563;font-size:16px}.mono{font-family:Consolas,monospace;fill:#111827;font-size:17px}</style>
  </defs>
  <rect width="1420" height="700" fill="#ffffff"/>
  <text x="710" y="43" text-anchor="middle" class="body" font-size="28" font-weight="700">Locality predicts which recently transferred blocks are likely to help again</text>
  <text x="710" y="74" text-anchor="middle" class="small">Time proximity motivates retention; address proximity motivates moving a whole block.</text>

  <rect x="45" y="120" width="640" height="465" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="365" y="165" text-anchor="middle" class="body" font-size="24" font-weight="700" fill="#6d28d9">Temporal locality</text>
  <text x="365" y="195" text-anchor="middle" class="small">If block A was used recently, keep A nearby for a likely reuse.</text>
  <line x1="105" y1="285" x2="620" y2="285" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="110" y="270" class="small">time</text>
  <g class="body" font-size="20" font-weight="700" text-anchor="middle">
    <rect x="120" y="315" width="72" height="66" rx="5" fill="#ede9fe" stroke="#7c3aed"/><text x="156" y="356">A</text>
    <rect x="220" y="315" width="72" height="66" rx="5" fill="#eff6ff" stroke="#2563eb"/><text x="256" y="356">B</text>
    <rect x="320" y="315" width="72" height="66" rx="5" fill="#ecfdf5" stroke="#0f766e"/><text x="356" y="356">C</text>
    <rect x="420" y="315" width="72" height="66" rx="5" fill="#ede9fe" stroke="#7c3aed"/><text x="456" y="356">A</text>
    <rect x="520" y="315" width="72" height="66" rx="5" fill="#ede9fe" stroke="#7c3aed"/><text x="556" y="356">A</text>
  </g>
  <path d="M156 403 C220 475 390 475 456 403" stroke="#7c3aed" stroke-width="3" fill="none"/>
  <text x="306" y="492" text-anchor="middle" class="body" font-size="18" font-weight="700" fill="#6d28d9">short reuse distance</text>
  <text x="365" y="535" text-anchor="middle" class="small">Examples: loop counter, stack frame, accumulator, hot instruction block.</text>

  <rect x="735" y="120" width="640" height="465" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="1055" y="165" text-anchor="middle" class="body" font-size="24" font-weight="700" fill="#1d4ed8">Spatial locality</text>
  <text x="1055" y="195" text-anchor="middle" class="small">If byte 0x1008 is used, nearby bytes in the same block may follow.</text>
  <g class="mono" text-anchor="middle">
    <rect x="785" y="270" width="520" height="110" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <path d="M850 270V380 M915 270V380 M980 270V380 M1045 270V380 M1110 270V380 M1175 270V380 M1240 270V380" stroke="#93c5fd"/>
    <text x="817" y="320">00</text><text x="882" y="320">08</text><text x="947" y="320">10</text><text x="1012" y="320">18</text><text x="1077" y="320">20</text><text x="1142" y="320">28</text><text x="1207" y="320">30</text><text x="1272" y="320">38</text>
    <text x="1045" y="356" class="small">one 64-byte block beginning at 0x1000</text>
  </g>
  <path d="M850 415 H1240" stroke="#0f766e" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1045" y="455" text-anchor="middle" class="body" font-size="18" font-weight="700" fill="#0f766e">sequential array traversal uses every transferred line</text>
  <text x="1055" y="507" text-anchor="middle" class="small">A large stride may touch one byte per block and waste the remaining transfer.</text>
  <text x="1055" y="535" text-anchor="middle" class="small">Examples: instructions, array elements, structure fields stored together.</text>

  <rect x="255" y="620" width="910" height="52" rx="6" fill="#f9fafb" stroke="#9ca3af"/>
  <text x="710" y="652" text-anchor="middle" class="body" font-size="18" font-weight="700">A working set with both forms of locality can remain in cache and serve many accesses per lower-level transfer.</text>
</svg>
