<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="515" viewBox="0 0 1180 515" role="img" aria-labelledby="title desc">
  <title id="title">Practical architecture evaluation workflow</title><desc id="desc">An iterative workflow defines requirements, establishes a reproducible baseline, localizes the bottleneck, predicts with a model, changes one variable, validates all constraints, and records regressions.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3 0 6Z" fill="#334155"/></marker></defs>
  <rect width="1180" height="515" rx="18" fill="#f8fafc"/>
  <text x="590" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#172033">Architecture evaluation is an evidence loop</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="30" y="105" width="150" height="96" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="105" y="137" font-size="16" font-weight="700" fill="#1e3a8a">1. Requirements</text><text x="105" y="165" font-size="13" fill="#334155">workload + SLO</text><text x="105" y="187" font-size="13" fill="#334155">power / risk limits</text>
    <rect x="190" y="105" width="150" height="96" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="265" y="137" font-size="16" font-weight="700" fill="#14532d">2. Baseline</text><text x="265" y="165" font-size="13" fill="#334155">controlled repeats</text><text x="265" y="187" font-size="13" fill="#334155">raw distributions</text>
    <rect x="350" y="105" width="150" height="96" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="425" y="137" font-size="16" font-weight="700" fill="#78350f">3. Localize</text><text x="425" y="165" font-size="13" fill="#334155">profiles + counters</text><text x="425" y="187" font-size="13" fill="#334155">one bottleneck</text>
    <rect x="510" y="105" width="150" height="96" rx="10" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/><text x="585" y="137" font-size="16" font-weight="700" fill="#581c87">4. Predict</text><text x="585" y="165" font-size="13" fill="#334155">CPU / Amdahl</text><text x="585" y="187" font-size="13" fill="#334155">Roofline / queue</text>
    <rect x="670" y="105" width="150" height="96" rx="10" fill="#cffafe" stroke="#0891b2" stroke-width="2"/><text x="745" y="137" font-size="16" font-weight="700" fill="#164e63">5. Change one</text><text x="745" y="165" font-size="13" fill="#334155">architecture lever</text><text x="745" y="187" font-size="13" fill="#334155">keep controls fixed</text>
    <rect x="830" y="105" width="150" height="96" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="905" y="137" font-size="16" font-weight="700" fill="#7f1d1d">6. Validate</text><text x="905" y="165" font-size="13" fill="#334155">speed + energy</text><text x="905" y="187" font-size="13" fill="#334155">reliability + security</text>
    <rect x="990" y="105" width="160" height="96" rx="10" fill="#e2e8f0" stroke="#475569" stroke-width="2"/><text x="1070" y="137" font-size="16" font-weight="700" fill="#172033">7. Record</text><text x="1070" y="165" font-size="13" fill="#334155">decision + evidence</text><text x="1070" y="187" font-size="13" fill="#334155">regression guard</text>
  </g>
  <g stroke="#334155" stroke-width="2.6" marker-end="url(#a)"><line x1="180" y1="153" x2="182" y2="153"/><line x1="340" y1="153" x2="342" y2="153"/><line x1="500" y1="153" x2="502" y2="153"/><line x1="660" y1="153" x2="662" y2="153"/><line x1="820" y1="153" x2="822" y2="153"/><line x1="980" y1="153" x2="982" y2="153"/></g>
  <path d="M1070 201 V300 H425 V211" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#a)"/>
  <text x="748" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#334155">If the prediction fails, update the model and relocalize; do not stack unmeasured changes.</text>
  <rect x="170" y="375" width="840" height="82" rx="12" fill="#172033"/>
  <text x="590" y="407" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#fff">Decision record = workload + configuration + raw evidence + model + tradeoff rationale</text>
  <text x="590" y="436" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#dbeafe">This turns a one-off benchmark into reproducible engineering knowledge.</text>
</svg>
