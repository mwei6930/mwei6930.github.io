<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 0 1120 540" role="img" aria-labelledby="title desc">
  <title id="title">Architecture Pareto frontier</title><desc id="desc">Design points trade performance against cost and energy. Dominated designs are worse on both axes, while frontier designs require policy choices among incomparable tradeoffs.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3 0 6Z" fill="#334155"/></marker></defs>
  <rect width="1120" height="540" rx="18" fill="#f8fafc"/>
  <text x="560" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#172033">There is rarely one best architecture</text>
  <line x1="100" y1="455" x2="850" y2="455" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><line x1="100" y1="455" x2="100" y2="85" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="470" y="498" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#334155">performance (higher is better)</text><text x="42" y="270" text-anchor="middle" transform="rotate(-90 42 270)" font-family="Arial, sans-serif" font-size="15" fill="#334155">cost / energy / risk (lower is better)</text>
  <path d="M185 398 C280 300 388 235 510 185 C605 147 700 122 808 112" fill="none" stroke="#2563eb" stroke-width="5"/>
  <g fill="#2563eb" stroke="#1e3a8a" stroke-width="2"><circle cx="185" cy="398" r="10"/><circle cx="310" cy="278" r="10"/><circle cx="510" cy="185" r="10"/><circle cx="665" cy="135" r="10"/><circle cx="808" cy="112" r="10"/></g>
  <g font-family="Arial, sans-serif" font-size="13" fill="#1e3a8a"><text x="155" y="385">low-power</text><text x="320" y="265">balanced</text><text x="520" y="173">server</text><text x="676" y="123">accelerated</text><text x="818" y="100">maximum</text></g>
  <g fill="#94a3b8" stroke="#475569" stroke-width="2"><circle cx="280" cy="405" r="9"/><circle cx="450" cy="335" r="9"/><circle cx="620" cy="270" r="9"/><circle cx="740" cy="220" r="9"/></g>
  <text x="485" y="390" font-family="Arial, sans-serif" font-size="15" fill="#475569">dominated designs</text>
  <path d="M448 376 L448 348" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <rect x="890" y="120" width="195" height="245" rx="11" fill="#fff" stroke="#64748b" stroke-width="2"/>
  <text x="988" y="153" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#172033">Constraints choose</text>
  <g font-family="Arial, sans-serif" font-size="14" fill="#334155"><text x="915" y="193">- latency SLO</text><text x="915" y="225">- power / thermal cap</text><text x="915" y="257">- purchase cost</text><text x="915" y="289">- reliability target</text><text x="915" y="321">- security policy</text></g>
  <text x="560" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#64748b">A frontier point is efficient, not automatically appropriate; requirements decide among efficient alternatives.</text>
</svg>
