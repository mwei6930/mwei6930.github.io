<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Greedy choice and optimal substructure</title>
  <desc id="desc">A greedy algorithm commits to a safe local choice, solves the residual subproblem, and combines both pieces into an optimal solution.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1200" height="560" fill="#f8fafc"/>
  <text x="600" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#0f172a">A greedy step is valid only when the local choice is safe</text>

  <rect x="45" y="86" width="250" height="168" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="170" y="116" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Current problem P</text>
  <text x="170" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">Feasible candidates</text>
  <rect x="70" y="170" width="55" height="45" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <rect x="142" y="170" width="55" height="45" rx="6" fill="#e2e8f0" stroke="#64748b"/>
  <rect x="214" y="170" width="55" height="45" rx="6" fill="#e2e8f0" stroke="#64748b"/>
  <text x="97" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#166534">g</text>
  <text x="169" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#334155">b</text>
  <text x="241" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#334155">c</text>
  <text x="170" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#166534">g is locally best</text>

  <line x1="295" y1="170" x2="400" y2="170" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="347" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#334155">prove safe</text>

  <rect x="410" y="103" width="265" height="134" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="542" y="139" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0e7490">Commit to g</text>
  <text x="542" y="171" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#155e75">Construct residual problem P_g</text>
  <text x="542" y="201" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#475569">Earlier choices are not reconsidered</text>

  <line x1="675" y1="170" x2="780" y2="170" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="790" y="103" width="360" height="134" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="970" y="139" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1d4ed8">Optimal substructure</text>
  <text x="970" y="172" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#1e3a8a">Solve the smaller problem optimally</text>
  <text x="970" y="203" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">OPT(P) = g + OPT(P_g)</text>

  <rect x="75" y="310" width="470" height="160" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <text x="310" y="344" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0f766e">Greedy search</text>
  <circle cx="145" cy="398" r="26" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <circle cx="260" cy="398" r="26" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <circle cx="375" cy="398" r="26" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <circle cx="490" cy="398" r="26" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <line x1="171" y1="398" x2="230" y2="398" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="286" y1="398" x2="345" y2="398" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="401" y1="398" x2="460" y2="398" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="145" y="404" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#134e4a">P</text>
  <text x="260" y="404" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#134e4a">P1</text>
  <text x="375" y="404" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#134e4a">P2</text>
  <text x="490" y="404" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#166534">done</text>
  <text x="310" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#475569">One path: fast, but every commitment needs a proof</text>

  <rect x="655" y="310" width="470" height="160" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="890" y="344" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#6d28d9">Dynamic programming</text>
  <circle cx="730" cy="396" r="22" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <circle cx="830" cy="374" r="22" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <circle cx="830" cy="428" r="22" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <circle cx="940" cy="374" r="22" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <circle cx="940" cy="428" r="22" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <circle cx="1050" cy="401" r="22" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <path d="M752 390 L806 378 M752 402 L806 422 M852 374 L916 374 M852 428 L916 428 M962 378 L1028 395 M962 424 L1028 407" fill="none" stroke="#7c3aed" stroke-width="2"/>
  <text x="890" y="458" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#475569">Keeps and compares multiple relevant states</text>

  <rect x="170" y="505" width="860" height="38" rx="6" fill="#fff7ed" stroke="#ea580c"/>
  <text x="600" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#9a3412">A locally attractive rule is a hypothesis. The greedy-choice proof turns it into an algorithm.</text>
</svg>
