<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Exchange argument and stays-ahead proof</title>
  <desc id="desc">Two common correctness proof patterns for greedy algorithms.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1200" height="560" fill="#f8fafc"/>
  <text x="600" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#0f172a">Two reusable ways to prove a greedy rule</text>

  <rect x="35" y="78" width="545" height="430" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="307" y="116" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1d4ed8">Exchange argument</text>
  <text x="307" y="146" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#475569">Transform an optimal solution so it begins like greedy.</text>

  <text x="75" y="195" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#334155">Optimal solution O</text>
  <rect x="75" y="214" width="92" height="52" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <rect x="177" y="214" width="92" height="52" rx="6" fill="#e2e8f0" stroke="#64748b"/>
  <rect x="279" y="214" width="92" height="52" rx="6" fill="#e2e8f0" stroke="#64748b"/>
  <rect x="381" y="214" width="92" height="52" rx="6" fill="#e2e8f0" stroke="#64748b"/>
  <text x="121" y="246" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#991b1b">o1</text>
  <text x="223" y="246" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#334155">o2</text>
  <text x="325" y="246" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#334155">o3</text>
  <text x="427" y="246" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#334155">o4</text>

  <path d="M121 280 C121 330 235 328 235 365" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="280" y="319" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#334155">replace o1 with greedy choice g</text>

  <text x="75" y="382" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#334155">Equally good solution O'</text>
  <rect x="75" y="397" width="92" height="52" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <rect x="177" y="397" width="92" height="52" rx="6" fill="#e2e8f0" stroke="#64748b"/>
  <rect x="279" y="397" width="92" height="52" rx="6" fill="#e2e8f0" stroke="#64748b"/>
  <rect x="381" y="397" width="92" height="52" rx="6" fill="#e2e8f0" stroke="#64748b"/>
  <text x="121" y="429" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#166534">g</text>
  <text x="223" y="429" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#334155">o2</text>
  <text x="325" y="429" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#334155">o3</text>
  <text x="427" y="429" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#334155">o4</text>
  <text x="307" y="482" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#166534">Feasibility and objective value do not worsen.</text>

  <rect x="620" y="78" width="545" height="430" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="892" y="116" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#6d28d9">Stays-ahead proof</text>
  <text x="892" y="146" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#475569">Compare every greedy prefix with every optimal prefix.</text>

  <line x1="680" y1="430" x2="1105" y2="430" stroke="#94a3b8" stroke-width="2"/>
  <line x1="680" y1="430" x2="680" y2="190" stroke="#94a3b8" stroke-width="2"/>
  <text x="893" y="463" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#475569">number of choices i</text>
  <text x="642" y="305" text-anchor="middle" transform="rotate(-90 642 305)" font-family="Arial, sans-serif" font-size="15" fill="#475569">progress achieved</text>

  <polyline points="700,405 790,350 880,297 970,241 1070,205" fill="none" stroke="#16a34a" stroke-width="4"/>
  <polyline points="700,410 790,382 880,326 970,288 1070,246" fill="none" stroke="#7c3aed" stroke-width="4" stroke-dasharray="8 6"/>
  <g fill="#16a34a">
    <circle cx="700" cy="405" r="6"/><circle cx="790" cy="350" r="6"/><circle cx="880" cy="297" r="6"/><circle cx="970" cy="241" r="6"/><circle cx="1070" cy="205" r="6"/>
  </g>
  <g fill="#7c3aed">
    <circle cx="700" cy="410" r="6"/><circle cx="790" cy="382" r="6"/><circle cx="880" cy="326" r="6"/><circle cx="970" cy="288" r="6"/><circle cx="1070" cy="246" r="6"/>
  </g>
  <line x1="815" y1="184" x2="855" y2="184" stroke="#16a34a" stroke-width="4"/>
  <text x="866" y="190" font-family="Arial, sans-serif" font-size="15" fill="#166534">greedy prefix G_i</text>
  <line x1="815" y1="216" x2="855" y2="216" stroke="#7c3aed" stroke-width="4" stroke-dasharray="8 6"/>
  <text x="866" y="222" font-family="Arial, sans-serif" font-size="15" fill="#6d28d9">optimal prefix O_i</text>
  <text x="892" y="492" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#334155">Show G_i is never behind O_i for every prefix i.</text>
</svg>
