<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="660" viewBox="0 0 1160 660" role="img" aria-labelledby="title desc">
  <title id="title">Responses to computational hardness</title><desc id="desc">Exact, approximation, heuristic, and parameterized methods trade correctness, guarantees, and running time differently.</desc>
  <style>.title{font:700 28px 'Segoe UI',Arial,sans-serif;fill:#172033}.head{font:700 19px 'Segoe UI',Arial,sans-serif;fill:#172033}.body{font:16px 'Segoe UI',Arial,sans-serif;fill:#334155}.small{font:14px 'Segoe UI',Arial,sans-serif;fill:#526174}.card{fill:#fff;stroke-width:2}</style>
  <rect width="1160" height="660" fill="#f8fafc"/><text x="580" y="45" text-anchor="middle" class="title">Hardness changes the contract, not the need to solve the problem</text>
  <rect x="35" y="90" width="255" height="430" rx="8" class="card" stroke="#60a5fa"/><text x="162" y="135" text-anchor="middle" class="head">Exact</text><text x="162" y="175" text-anchor="middle" class="body">Always optimal</text><text x="162" y="210" text-anchor="middle" class="small">may be exponential</text><rect x="70" y="250" width="185" height="120" rx="8" fill="#eff6ff" stroke="#bfdbfe"/><text x="162" y="283" text-anchor="middle" class="body">branch and bound</text><text x="162" y="313" text-anchor="middle" class="body">DP over subsets</text><text x="162" y="343" text-anchor="middle" class="body">SAT / ILP solver</text><text x="162" y="430" text-anchor="middle" class="small">contract: exact answer</text>
  <rect x="315" y="90" width="255" height="430" rx="8" class="card" stroke="#4ade80"/><text x="442" y="135" text-anchor="middle" class="head">Approximation</text><text x="442" y="175" text-anchor="middle" class="body">Polynomial time</text><text x="442" y="210" text-anchor="middle" class="small">provable ratio</text><rect x="350" y="250" width="185" height="120" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/><text x="442" y="293" text-anchor="middle" class="body">2-approx cover</text><text x="442" y="333" text-anchor="middle" class="body">PTAS / FPTAS</text><text x="442" y="430" text-anchor="middle" class="small">contract: bounded loss</text>
  <rect x="595" y="90" width="255" height="430" rx="8" class="card" stroke="#fb923c"/><text x="722" y="135" text-anchor="middle" class="head">Heuristic</text><text x="722" y="175" text-anchor="middle" class="body">Often fast</text><text x="722" y="210" text-anchor="middle" class="small">no worst-case guarantee</text><rect x="630" y="250" width="185" height="120" rx="8" fill="#fff7ed" stroke="#fed7aa"/><text x="722" y="283" text-anchor="middle" class="body">local search</text><text x="722" y="313" text-anchor="middle" class="body">greedy repair</text><text x="722" y="343" text-anchor="middle" class="body">domain rules</text><text x="722" y="430" text-anchor="middle" class="small">contract: empirical quality</text>
  <rect x="875" y="90" width="250" height="430" rx="8" class="card" stroke="#c084fc"/><text x="1000" y="135" text-anchor="middle" class="head">Parameterized</text><text x="1000" y="175" text-anchor="middle" class="body">f(k) * n^c</text><text x="1000" y="210" text-anchor="middle" class="small">fast when k is small</text><rect x="910" y="250" width="180" height="120" rx="8" fill="#faf5ff" stroke="#e9d5ff"/><text x="1000" y="283" text-anchor="middle" class="body">kernelization</text><text x="1000" y="313" text-anchor="middle" class="body">bounded branching</text><text x="1000" y="343" text-anchor="middle" class="body">treewidth DP</text><text x="1000" y="430" text-anchor="middle" class="small">contract: exact for small k</text>
  <rect x="160" y="555" width="840" height="66" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="2"/><text x="580" y="582" text-anchor="middle" class="head">Choose using required certainty, instance scale, structure, and parameter values</text><text x="580" y="607" text-anchor="middle" class="small">NP-hard does not mean every instance is difficult or every exact method is useless.</text>
</svg>
