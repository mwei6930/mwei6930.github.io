<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
  <title id="title">From a problem specification to a verified algorithm</title>
  <desc id="desc">A four-stage flow from preconditions and inputs, through an algorithm, to outputs and postconditions, followed by correctness and efficiency checks.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#385170"/>
    </marker>
  </defs>
  <rect width="1000" height="360" fill="#ffffff"/>
  <text x="500" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#172b4d">An algorithm is a contract, not just code</text>
  <g font-family="Arial, sans-serif">
    <rect x="48" y="88" width="200" height="132" rx="8" fill="#e9f3ff" stroke="#2f6fa3" stroke-width="2"/>
    <text x="148" y="122" text-anchor="middle" font-size="20" font-weight="700" fill="#174a73">Specification</text>
    <text x="68" y="156" font-size="16" fill="#243b53">Precondition</text>
    <text x="68" y="183" font-size="16" fill="#243b53">Valid input domain</text>
    <text x="68" y="210" font-size="16" fill="#243b53">Required result</text>

    <rect x="302" y="88" width="170" height="132" rx="8" fill="#fff3d6" stroke="#b7791f" stroke-width="2"/>
    <text x="387" y="122" text-anchor="middle" font-size="20" font-weight="700" fill="#744210">Algorithm</text>
    <text x="387" y="158" text-anchor="middle" font-size="16" fill="#4a3a1f">Finite steps</text>
    <text x="387" y="185" text-anchor="middle" font-size="16" fill="#4a3a1f">State changes</text>
    <text x="387" y="212" text-anchor="middle" font-size="16" fill="#4a3a1f">Termination</text>

    <rect x="526" y="88" width="200" height="132" rx="8" fill="#e8f7ef" stroke="#2f855a" stroke-width="2"/>
    <text x="626" y="122" text-anchor="middle" font-size="20" font-weight="700" fill="#22543d">Result</text>
    <text x="546" y="156" font-size="16" fill="#234e3b">Output value</text>
    <text x="546" y="183" font-size="16" fill="#234e3b">Postcondition</text>
    <text x="546" y="210" font-size="16" fill="#234e3b">Preserved input rules</text>

    <rect x="780" y="88" width="172" height="132" rx="8" fill="#f2ecfb" stroke="#805ad5" stroke-width="2"/>
    <text x="866" y="122" text-anchor="middle" font-size="20" font-weight="700" fill="#553c9a">Evidence</text>
    <text x="866" y="158" text-anchor="middle" font-size="16" fill="#44337a">Correctness proof</text>
    <text x="866" y="185" text-anchor="middle" font-size="16" fill="#44337a">Time analysis</text>
    <text x="866" y="212" text-anchor="middle" font-size="16" fill="#44337a">Space analysis</text>

    <path d="M248 154 H294" stroke="#385170" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M472 154 H518" stroke="#385170" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M726 154 H772" stroke="#385170" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="206" y="264" width="588" height="58" rx="8" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.5"/>
    <text x="500" y="299" text-anchor="middle" font-size="18" fill="#2d3748">A fast program that violates the postcondition is still the wrong algorithm.</text>
  </g>
</svg>
