<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="700" viewBox="0 0 1160 700" role="img" aria-labelledby="title desc">
  <title id="title">Las Vegas and Monte Carlo randomized algorithms</title><desc id="desc">Las Vegas algorithms are always correct with random runtime, while Monte Carlo algorithms have bounded runtime and controllable error.</desc>
  <style>.title{font:700 28px 'Segoe UI',Arial,sans-serif;fill:#172033}.head{font:700 20px 'Segoe UI',Arial,sans-serif;fill:#172033}.body{font:16px 'Segoe UI',Arial,sans-serif;fill:#334155}.small{font:14px 'Segoe UI',Arial,sans-serif;fill:#526174}.card{fill:#fff;stroke-width:2}</style>
  <rect width="1160" height="700" fill="#f8fafc"/><text x="580" y="45" text-anchor="middle" class="title">Random bits create a distribution over executions</text>
  <rect x="45" y="90" width="500" height="390" rx="8" class="card" stroke="#4ade80"/><text x="295" y="135" text-anchor="middle" class="head">Las Vegas</text><text x="295" y="170" text-anchor="middle" class="body">Correctness probability = 1</text><text x="295" y="202" text-anchor="middle" class="body">Running time is random</text>
  <rect x="100" y="240" width="390" height="90" rx="8" fill="#f0fdf4" stroke="#86efac"/><text x="295" y="275" text-anchor="middle" class="head">Randomized quicksort</text><text x="295" y="305" text-anchor="middle" class="small">any pivot order still returns a sorted array</text>
  <line x1="110" y1="390" x2="480" y2="390" stroke="#64748b" stroke-width="3"/><rect x="150" y="365" width="45" height="25" fill="#93c5fd"/><rect x="235" y="330" width="45" height="60" fill="#60a5fa"/><rect x="320" y="280" width="45" height="110" fill="#3b82f6"/><rect x="405" y="350" width="45" height="40" fill="#2563eb"/><text x="295" y="435" text-anchor="middle" class="small">analyze expected time E[T]</text>
  <rect x="615" y="90" width="500" height="390" rx="8" class="card" stroke="#f87171"/><text x="865" y="135" text-anchor="middle" class="head">Monte Carlo</text><text x="865" y="170" text-anchor="middle" class="body">Running time is bounded</text><text x="865" y="202" text-anchor="middle" class="body">Answer may be wrong with probability p</text>
  <rect x="670" y="240" width="390" height="90" rx="8" fill="#fef2f2" stroke="#fca5a5"/><text x="865" y="275" text-anchor="middle" class="head">Freivalds' matrix check</text><text x="865" y="305" text-anchor="middle" class="small">a false product passes one round with p &lt;= 1/2</text>
  <circle cx="735" cy="395" r="34" fill="#fee2e2" stroke="#ef4444"/><circle cx="820" cy="395" r="34" fill="#fee2e2" stroke="#ef4444"/><circle cx="905" cy="395" r="34" fill="#fee2e2" stroke="#ef4444"/><circle cx="990" cy="395" r="34" fill="#dcfce7" stroke="#22c55e"/><text x="735" y="402" text-anchor="middle" class="body">1/2</text><text x="820" y="402" text-anchor="middle" class="body">1/4</text><text x="905" y="402" text-anchor="middle" class="body">1/8</text><text x="990" y="402" text-anchor="middle" class="body">2^-r</text>
  <rect x="175" y="525" width="810" height="115" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="2"/><text x="580" y="562" text-anchor="middle" class="head">Independent repetition amplifies confidence</text><text x="580" y="595" text-anchor="middle" class="body">If one round fails with probability at most p, r rounds fail with at most p^r.</text><text x="580" y="621" text-anchor="middle" class="small">The guarantee is over internal randomness, not an assumption that inputs are random.</text>
</svg>
