<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Selecting greedy dynamic programming backtracking or branch and bound</title>
  <desc id="desc">A decision workflow based on safe local dominance, repeated equivalent states, constraints, and optimization bounds.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
  </defs>
  <rect width="1200" height="650" fill="#f8fafc"/>
  <text x="600" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#0f172a">Select the technique by what information must survive each decision</text>

  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="430" y="80" width="340" height="70" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <text x="600" y="110" font-size="18" font-weight="700" fill="#0f172a">Can one local choice be proved safe</text>
    <text x="600" y="136" font-size="16" fill="#475569">for every completion?</text>

    <rect x="70" y="205" width="260" height="90" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
    <text x="200" y="242" font-size="21" font-weight="700" fill="#0f766e">Greedy</text>
    <text x="200" y="269" font-size="14" fill="#475569">commit and discard alternatives</text>

    <rect x="470" y="205" width="260" height="90" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <text x="600" y="238" font-size="17" font-weight="700" fill="#0f172a">Do different histories have</text>
    <text x="600" y="264" font-size="16" fill="#475569">identical future-relevant state?</text>

    <rect x="870" y="205" width="260" height="90" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="1000" y="242" font-size="21" font-weight="700" fill="#6d28d9">Backtracking</text>
    <text x="1000" y="269" font-size="14" fill="#475569">keep distinct constrained histories</text>

    <rect x="270" y="365" width="280" height="90" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="410" y="402" font-size="21" font-weight="700" fill="#1d4ed8">Dynamic programming</text>
    <text x="410" y="429" font-size="14" fill="#475569">cache or tabulate each state once</text>

    <rect x="650" y="365" width="280" height="90" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="790" y="396" font-size="18" font-weight="700" fill="#c2410c">Optimization search?</text>
    <text x="790" y="423" font-size="15" fill="#475569">Is there a cheap optimistic bound?</text>

    <rect x="560" y="515" width="280" height="90" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
    <text x="700" y="552" font-size="21" font-weight="700" fill="#c2410c">Branch and bound</text>
    <text x="700" y="579" font-size="14" fill="#475569">prune states that cannot beat incumbent</text>

    <rect x="900" y="515" width="250" height="90" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="1025" y="552" font-size="19" font-weight="700" fill="#6d28d9">Constraint search</text>
    <text x="1025" y="579" font-size="14" fill="#475569">propagate, order, and backtrack</text>
  </g>

  <path d="M430 115 L340 115 C250 115 200 145 200 195" fill="none" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="305" y="101" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#0f766e">yes</text>
  <path d="M600 150 L600 195" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="620" y="178" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#334155">no</text>
  <path d="M470 250 C410 250 410 310 410 355" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="425" y="313" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#1d4ed8">yes</text>
  <path d="M730 250 C815 250 840 250 860 250" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="800" y="237" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#6d28d9">no</text>
  <path d="M1000 295 C1000 345 790 320 790 355" fill="none" stroke="#ea580c" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M790 455 C790 485 740 490 720 505" fill="none" stroke="#ea580c" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="775" y="490" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#c2410c">yes</text>
  <path d="M930 410 C1025 410 1025 470 1025 505" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="1010" y="468" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#6d28d9">no / feasibility</text>
</svg>
