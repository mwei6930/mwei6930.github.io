<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">The four parts of a dynamic programming formulation</title>
  <desc id="desc">State meaning, transition, base cases, evaluation order, and a house robber prefix example.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1200" height="610" fill="#f8fafc"/>
  <text x="600" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#0f172a">A recurrence is useful only after every state has a precise meaning</text>

  <g font-family="Arial, sans-serif">
    <rect x="35" y="82" width="250" height="145" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="160" y="116" text-anchor="middle" font-size="20" font-weight="700" fill="#1d4ed8">1. State</text>
    <text x="160" y="150" text-anchor="middle" font-size="15" fill="#334155">What subproblem does dp[i]</text>
    <text x="160" y="174" text-anchor="middle" font-size="15" fill="#334155">represent exactly?</text>
    <text x="160" y="204" text-anchor="middle" font-size="14" fill="#475569">Store sufficient, not all, history.</text>

    <rect x="328" y="82" width="250" height="145" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
    <text x="453" y="116" text-anchor="middle" font-size="20" font-weight="700" fill="#0e7490">2. Transition</text>
    <text x="453" y="150" text-anchor="middle" font-size="15" fill="#334155">Which smaller solved states</text>
    <text x="453" y="174" text-anchor="middle" font-size="15" fill="#334155">produce the current answer?</text>
    <text x="453" y="204" text-anchor="middle" font-size="14" fill="#475569">Enumerate the final decision.</text>

    <rect x="621" y="82" width="250" height="145" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="746" y="116" text-anchor="middle" font-size="20" font-weight="700" fill="#15803d">3. Base cases</text>
    <text x="746" y="150" text-anchor="middle" font-size="15" fill="#334155">What smallest states have</text>
    <text x="746" y="174" text-anchor="middle" font-size="15" fill="#334155">answers without recurrence?</text>
    <text x="746" y="204" text-anchor="middle" font-size="14" fill="#475569">Anchor every dependency chain.</text>

    <rect x="914" y="82" width="250" height="145" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="1039" y="116" text-anchor="middle" font-size="20" font-weight="700" fill="#6d28d9">4. Order</text>
    <text x="1039" y="150" text-anchor="middle" font-size="15" fill="#334155">Are all dependencies ready</text>
    <text x="1039" y="174" text-anchor="middle" font-size="15" fill="#334155">before a state is evaluated?</text>
    <text x="1039" y="204" text-anchor="middle" font-size="14" fill="#475569">Follow a topological order.</text>

    <line x1="285" y1="154" x2="318" y2="154" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
    <line x1="578" y1="154" x2="611" y2="154" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
    <line x1="871" y1="154" x2="904" y2="154" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="55" y="275" width="1090" height="285" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <text x="600" y="312" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Example: maximum non-adjacent sum over a prefix</text>
    <text x="600" y="341" text-anchor="middle" font-size="15" fill="#475569">dp[i] = best value using the first i houses</text>

    <g text-anchor="middle">
      <text x="170" y="391" font-size="15" font-weight="700" fill="#475569">house value</text>
      <rect x="280" y="363" width="105" height="50" rx="6" fill="#dbeafe" stroke="#2563eb"/>
      <rect x="395" y="363" width="105" height="50" rx="6" fill="#dbeafe" stroke="#2563eb"/>
      <rect x="510" y="363" width="105" height="50" rx="6" fill="#dbeafe" stroke="#2563eb"/>
      <rect x="625" y="363" width="105" height="50" rx="6" fill="#dbeafe" stroke="#2563eb"/>
      <rect x="740" y="363" width="105" height="50" rx="6" fill="#dbeafe" stroke="#2563eb"/>
      <text x="332" y="395" font-size="20" font-weight="700" fill="#1e3a8a">2</text>
      <text x="447" y="395" font-size="20" font-weight="700" fill="#1e3a8a">7</text>
      <text x="562" y="395" font-size="20" font-weight="700" fill="#1e3a8a">9</text>
      <text x="677" y="395" font-size="20" font-weight="700" fill="#1e3a8a">3</text>
      <text x="792" y="395" font-size="20" font-weight="700" fill="#1e3a8a">1</text>

      <text x="170" y="476" font-size="15" font-weight="700" fill="#475569">dp prefix value</text>
      <rect x="220" y="446" width="75" height="52" rx="6" fill="#e2e8f0" stroke="#64748b"/>
      <rect x="305" y="446" width="75" height="52" rx="6" fill="#dcfce7" stroke="#16a34a"/>
      <rect x="390" y="446" width="75" height="52" rx="6" fill="#dcfce7" stroke="#16a34a"/>
      <rect x="475" y="446" width="75" height="52" rx="6" fill="#dcfce7" stroke="#16a34a"/>
      <rect x="560" y="446" width="75" height="52" rx="6" fill="#dcfce7" stroke="#16a34a"/>
      <rect x="645" y="446" width="75" height="52" rx="6" fill="#dcfce7" stroke="#16a34a"/>
      <text x="257" y="479" font-size="18" fill="#334155">0</text>
      <text x="342" y="479" font-size="18" fill="#166534">2</text>
      <text x="427" y="479" font-size="18" fill="#166534">7</text>
      <text x="512" y="479" font-size="18" fill="#166534">11</text>
      <text x="597" y="479" font-size="18" fill="#166534">11</text>
      <text x="682" y="479" font-size="18" fill="#166534">12</text>
    </g>

    <rect x="770" y="435" width="320" height="78" rx="6" fill="#fff7ed" stroke="#ea580c"/>
    <text x="930" y="464" text-anchor="middle" font-size="16" font-weight="700" fill="#9a3412">Last decision at house i</text>
    <text x="930" y="491" text-anchor="middle" font-size="16" fill="#9a3412">skip: dp[i-1]  |  take: value + dp[i-2]</text>
  </g>
</svg>
