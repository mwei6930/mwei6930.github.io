<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
  <title id="title">Binary tree shape properties</title>
  <desc id="desc">Four panels compare perfect, complete, full but not complete, and skewed binary trees.</desc>
  <rect width="1000" height="500" fill="#ffffff"/>
  <text x="500" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#172b4d">Shape controls height and operation cost</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(35 75)"><rect width="220" height="370" rx="8" fill="#e8f7ef" stroke="#2f855a"/><text x="110" y="35" text-anchor="middle" font-size="20" font-weight="700" fill="#22543d">Perfect</text><text x="110" y="62" text-anchor="middle" font-size="14" fill="#234e3b">all levels filled</text><g stroke="#68a983" stroke-width="2"><path d="M110 105 L55 175 M110 105 L165 175 M55 205 L28 275 M55 205 L82 275 M165 205 L138 275 M165 205 L192 275"/></g><g fill="#ffffff" stroke="#2f855a"><circle cx="110" cy="92" r="22"/><circle cx="55" cy="190" r="20"/><circle cx="165" cy="190" r="20"/><circle cx="28" cy="290" r="18"/><circle cx="82" cy="290" r="18"/><circle cx="138" cy="290" r="18"/><circle cx="192" cy="290" r="18"/></g><text x="110" y="340" text-anchor="middle" font-size="15">n = 2^(h+1) - 1</text></g>
    <g transform="translate(275 75)"><rect width="220" height="370" rx="8" fill="#e9f3ff" stroke="#2f6fa3"/><text x="110" y="35" text-anchor="middle" font-size="20" font-weight="700" fill="#174a73">Complete</text><text x="110" y="62" text-anchor="middle" font-size="14" fill="#243b53">last level fills left first</text><g stroke="#7aa7cf" stroke-width="2"><path d="M110 105 L55 175 M110 105 L165 175 M55 205 L28 275 M55 205 L82 275 M165 205 L138 275"/></g><g fill="#ffffff" stroke="#2f6fa3"><circle cx="110" cy="92" r="22"/><circle cx="55" cy="190" r="20"/><circle cx="165" cy="190" r="20"/><circle cx="28" cy="290" r="18"/><circle cx="82" cy="290" r="18"/><circle cx="138" cy="290" r="18"/></g><text x="110" y="340" text-anchor="middle" font-size="15">height = floor(log2 n)</text></g>
    <g transform="translate(515 75)"><rect width="220" height="370" rx="8" fill="#fff3d6" stroke="#b7791f"/><text x="110" y="35" text-anchor="middle" font-size="20" font-weight="700" fill="#744210">Full</text><text x="110" y="62" text-anchor="middle" font-size="14" fill="#4a3a1f">0 or 2 children per node</text><g stroke="#d9aa55" stroke-width="2"><path d="M110 105 L55 175 M110 105 L165 175 M55 205 L25 275 M55 205 L85 275 M25 305 L10 345 M25 305 L45 345"/></g><g fill="#ffffff" stroke="#b7791f"><circle cx="110" cy="92" r="22"/><circle cx="55" cy="190" r="20"/><circle cx="165" cy="190" r="20"/><circle cx="25" cy="290" r="18"/><circle cx="85" cy="290" r="18"/><circle cx="10" cy="355" r="14"/><circle cx="45" cy="355" r="14"/></g><text x="110" y="340" text-anchor="middle" font-size="14">not necessarily balanced</text></g>
    <g transform="translate(755 75)"><rect width="210" height="370" rx="8" fill="#fff5f5" stroke="#c53030"/><text x="105" y="35" text-anchor="middle" font-size="20" font-weight="700" fill="#9b2c2c">Skewed</text><text x="105" y="62" text-anchor="middle" font-size="14" fill="#742a2a">one child per level</text><g stroke="#dd7f7f" stroke-width="2"><path d="M55 110 L90 165 M90 195 L125 250 M125 280 L160 335"/></g><g fill="#ffffff" stroke="#c53030"><circle cx="55" cy="95" r="20"/><circle cx="90" cy="180" r="20"/><circle cx="125" cy="265" r="20"/><circle cx="160" cy="350" r="20"/></g><text x="105" y="340" text-anchor="middle" font-size="15">height = n - 1</text></g>
  </g>
</svg>
