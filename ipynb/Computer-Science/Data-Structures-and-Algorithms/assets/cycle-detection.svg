<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
  <title id="title">Floyd cycle detection on a linked list</title>
  <desc id="desc">A linked list enters a cycle; slow moves one edge and fast moves two, so their distance modulo the cycle length eventually becomes zero.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#385170"/></marker></defs>
  <rect width="1000" height="470" fill="#ffffff"/>
  <text x="500" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#172b4d">Inside a cycle, fast gains one node per round</text>
  <g font-family="Arial, sans-serif">
    <g fill="#e9f3ff" stroke="#2f6fa3" stroke-width="2"><circle cx="105" cy="218" r="38"/><circle cx="230" cy="218" r="38"/><circle cx="355" cy="218" r="38"/></g>
    <g fill="#fff3d6" stroke="#b7791f" stroke-width="2"><circle cx="520" cy="135" r="38"/><circle cx="690" cy="135" r="38"/><circle cx="795" cy="270" r="38"/><circle cx="605" cy="350" r="38"/><circle cx="465" cy="290" r="38"/></g>
    <g text-anchor="middle" font-size="21" font-weight="700" fill="#243b53"><text x="105" y="225">1</text><text x="230" y="225">2</text><text x="355" y="225">3</text><text x="520" y="142">4</text><text x="690" y="142">5</text><text x="795" y="277">6</text><text x="605" y="357">7</text><text x="465" y="297">8</text></g>
    <g fill="none" stroke="#385170" stroke-width="3" marker-end="url(#arrow)"><path d="M143 218 H184"/><path d="M268 218 H309"/><path d="M392 201 L484 153"/><path d="M558 135 H644"/><path d="M716 164 L772 236"/><path d="M761 290 L641 337"/><path d="M568 339 L498 308"/><path d="M466 252 C458 176 474 153 483 151"/></g>
    <path d="M72 90 H395" stroke="#805ad5" stroke-width="4"/><text x="234" y="78" text-anchor="middle" font-size="17" font-weight="700" fill="#553c9a">tail length mu</text>
    <path d="M500 417 H799" stroke="#2f855a" stroke-width="4"/><text x="650" y="446" text-anchor="middle" font-size="17" font-weight="700" fill="#22543d">cycle length lambda</text>
    <circle cx="605" cy="350" r="50" fill="none" stroke="#c53030" stroke-width="4" stroke-dasharray="8 7"/>
    <text x="605" y="414" text-anchor="middle" font-size="16" font-weight="700" fill="#c53030">meeting node</text>
    <rect x="820" y="84" width="145" height="125" rx="8" fill="#f7fafc" stroke="#a0aec0"/>
    <text x="892" y="118" text-anchor="middle" font-size="17" font-weight="700" fill="#2f6fa3">slow</text><text x="892" y="145" text-anchor="middle" font-size="15" fill="#4a5568">1 edge / round</text><text x="892" y="177" text-anchor="middle" font-size="17" font-weight="700" fill="#c53030">fast</text><text x="892" y="202" text-anchor="middle" font-size="15" fill="#4a5568">2 edges / round</text>
  </g>
</svg>
