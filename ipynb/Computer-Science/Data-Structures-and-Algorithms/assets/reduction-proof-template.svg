<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="700" viewBox="0 0 1160 700" role="img" aria-labelledby="title desc">
  <title id="title">Four obligations in a reduction proof</title><desc id="desc">A complete NP-hardness reduction names the source, constructs the target, proves both directions, and analyzes construction time.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><style>.title{font:700 28px 'Segoe UI',Arial,sans-serif;fill:#172033}.head{font:700 19px 'Segoe UI',Arial,sans-serif;fill:#172033}.body{font:16px 'Segoe UI',Arial,sans-serif;fill:#334155}.small{font:14px 'Segoe UI',Arial,sans-serif;fill:#526174}.line{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1160" height="700" fill="#f8fafc"/><text x="580" y="45" text-anchor="middle" class="title">A reduction proof is a pair of solution mappings plus a time bound</text>
  <rect x="55" y="105" width="235" height="390" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text x="172" y="145" text-anchor="middle" class="head">1. Source</text><text x="172" y="185" text-anchor="middle" class="body">Choose known-hard A</text><text x="172" y="225" text-anchor="middle" class="small">Independent Set</text><text x="172" y="260" text-anchor="middle" class="small">instance (G, k)</text><rect x="90" y="320" width="165" height="100" rx="8" fill="#fff" stroke="#bfdbfe"/><text x="172" y="355" text-anchor="middle" class="body">State what is</text><text x="172" y="382" text-anchor="middle" class="body">already known</text>
  <path d="M290 300L345 300" class="line"/><rect x="345" y="105" width="235" height="390" rx="8" fill="#faf5ff" stroke="#c084fc" stroke-width="2"/><text x="462" y="145" text-anchor="middle" class="head">2. Construction</text><text x="462" y="185" text-anchor="middle" class="body">Build target B</text><text x="462" y="225" text-anchor="middle" class="small">Vertex Cover</text><text x="462" y="260" text-anchor="middle" class="small">instance (G, |V|-k)</text><rect x="380" y="320" width="165" height="100" rx="8" fill="#fff" stroke="#e9d5ff"/><text x="462" y="355" text-anchor="middle" class="body">Specify every</text><text x="462" y="382" text-anchor="middle" class="body">vertex and edge</text>
  <path d="M580 300L635 300" class="line"/><rect x="635" y="105" width="235" height="390" rx="8" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/><text x="752" y="145" text-anchor="middle" class="head">3. Correctness</text><text x="752" y="185" text-anchor="middle" class="body">Prove both directions</text><text x="752" y="235" text-anchor="middle" class="small">If S is independent,</text><text x="752" y="262" text-anchor="middle" class="small">V-S covers every edge.</text><text x="752" y="315" text-anchor="middle" class="small">If C is a cover,</text><text x="752" y="342" text-anchor="middle" class="small">V-C is independent.</text><rect x="670" y="390" width="165" height="70" rx="8" fill="#fff" stroke="#bbf7d0"/><text x="752" y="432" text-anchor="middle" class="head">iff</text>
  <path d="M870 300L925 300" class="line"/><rect x="925" y="105" width="180" height="390" rx="8" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text x="1015" y="145" text-anchor="middle" class="head">4. Time</text><text x="1015" y="190" text-anchor="middle" class="body">Count construction</text><text x="1015" y="230" text-anchor="middle" class="small">reuse G</text><text x="1015" y="260" text-anchor="middle" class="small">compute |V|-k</text><rect x="950" y="320" width="130" height="100" rx="8" fill="#fff" stroke="#fed7aa"/><text x="1015" y="360" text-anchor="middle" class="head">O(V+E)</text><text x="1015" y="390" text-anchor="middle" class="small">polynomial</text>
  <rect x="180" y="545" width="800" height="90" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="2"/><text x="580" y="580" text-anchor="middle" class="head">Then prove B is in NP if the goal is NP-completeness</text><text x="580" y="612" text-anchor="middle" class="body">Hardness alone proves NP-hard, not NP-complete.</text>
</svg>
