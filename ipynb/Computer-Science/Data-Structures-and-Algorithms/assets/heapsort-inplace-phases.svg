<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="510" viewBox="0 0 1100 510" role="img" aria-labelledby="title desc">
  <title id="title">Heapsort heap prefix and sorted suffix</title>
  <desc id="desc">Three array states show a max heap occupying a shrinking prefix and an ascending sorted suffix growing from the right.</desc>
  <rect width="1100" height="510" fill="#ffffff"/>
  <text x="550" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#172b4d">Heapsort reuses one array as a shrinking heap and growing suffix</text>
  <g font-family="Arial, sans-serif">
    <text x="70" y="128" font-size="18" font-weight="700" fill="#553c9a">Build max-heap</text>
    <text x="70" y="260" font-size="18" font-weight="700" fill="#744210">Extract maximum</text>
    <text x="70" y="392" font-size="18" font-weight="700" fill="#22543d">Continue</text>
    <g text-anchor="middle" font-size="19" font-weight="700">
      <g transform="translate(300 92)"><g fill="#f2ecfb" stroke="#805ad5"><rect x="0" y="0" width="82" height="58"/><rect x="84" y="0" width="82" height="58"/><rect x="168" y="0" width="82" height="58"/><rect x="252" y="0" width="82" height="58"/><rect x="336" y="0" width="82" height="58"/><rect x="420" y="0" width="82" height="58"/><rect x="504" y="0" width="82" height="58"/></g><g fill="#2d3748"><text x="41" y="37">14</text><text x="125" y="37">11</text><text x="209" y="37">9</text><text x="293" y="37">5</text><text x="377" y="37">6</text><text x="461" y="37">7</text><text x="545" y="37">2</text></g></g>
      <g transform="translate(300 224)"><g fill="#fff3d6" stroke="#b7791f"><rect x="0" y="0" width="82" height="58"/><rect x="84" y="0" width="82" height="58"/><rect x="168" y="0" width="82" height="58"/><rect x="252" y="0" width="82" height="58"/><rect x="336" y="0" width="82" height="58"/><rect x="420" y="0" width="82" height="58"/></g><rect x="504" y="0" width="82" height="58" fill="#e8f7ef" stroke="#2f855a" stroke-width="3"/><g fill="#2d3748"><text x="41" y="37">11</text><text x="125" y="37">6</text><text x="209" y="37">9</text><text x="293" y="37">5</text><text x="377" y="37">2</text><text x="461" y="37">7</text><text x="545" y="37">14</text></g></g>
      <g transform="translate(300 356)"><g fill="#e6f1fb" stroke="#2f6fa3"><rect x="0" y="0" width="82" height="58"/><rect x="84" y="0" width="82" height="58"/><rect x="168" y="0" width="82" height="58"/><rect x="252" y="0" width="82" height="58"/></g><g fill="#e8f7ef" stroke="#2f855a" stroke-width="3"><rect x="336" y="0" width="82" height="58"/><rect x="420" y="0" width="82" height="58"/><rect x="504" y="0" width="82" height="58"/></g><g fill="#2d3748"><text x="41" y="37">7</text><text x="125" y="37">6</text><text x="209" y="37">2</text><text x="293" y="37">5</text><text x="377" y="37">9</text><text x="461" y="37">11</text><text x="545" y="37">14</text></g></g>
    </g>
    <g text-anchor="middle" font-size="15"><text x="593" y="178" fill="#553c9a">heap size = 7</text><text x="550" y="310" fill="#744210">heap prefix repairs after root swap</text><text x="830" y="310" fill="#22543d">sorted suffix</text><text x="465" y="444" fill="#2f6fa3">heap size = 4</text><text x="760" y="444" fill="#22543d">final positions never re-enter heap</text></g>
  </g>
  <text x="550" y="488" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#4a5568">The boundary index, not a second container, separates active heap storage from sorted output.</text>
</svg>
