<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">Connected components and strongly connected components</title>
  <desc id="desc">An undirected graph is partitioned into connected components, while a directed graph is condensed into strongly connected components forming a DAG.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#52657a"/></marker></defs>
  <rect width="1100" height="520" fill="#ffffff"/>
  <text x="550" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#172b4d">Connectivity depends on edge direction</text>
  <g font-family="Arial, sans-serif">
    <rect x="28" y="72" width="500" height="390" rx="8" fill="#f7fafc" stroke="#9aa9ba" stroke-width="2"/>
    <text x="278" y="108" text-anchor="middle" font-size="21" font-weight="700" fill="#2d3748">Undirected connected components</text>
    <g stroke-width="4" fill="none"><path d="M90 230 L165 160 L235 240 L150 315 Z M165 160 L150 315" stroke="#2f6fa3"/><path d="M310 185 L405 155 L455 260 L350 305 Z" stroke="#2f855a"/><path d="M310 185 L455 260" stroke="#2f855a"/></g>
    <g text-anchor="middle" dominant-baseline="middle" font-size="18" font-weight="700">
      <g fill="#e6f1fb" stroke="#2f6fa3" stroke-width="3"><circle cx="90" cy="230" r="24"/><circle cx="165" cy="160" r="24"/><circle cx="235" cy="240" r="24"/><circle cx="150" cy="315" r="24"/></g><text x="90" y="230">A</text><text x="165" y="160">B</text><text x="235" y="240">C</text><text x="150" y="315">D</text>
      <g fill="#e8f7ef" stroke="#2f855a" stroke-width="3"><circle cx="310" cy="185" r="24"/><circle cx="405" cy="155" r="24"/><circle cx="455" cy="260" r="24"/><circle cx="350" cy="305" r="24"/></g><text x="310" y="185">E</text><text x="405" y="155">F</text><text x="455" y="260">G</text><text x="350" y="305">H</text>
      <circle cx="445" cy="365" r="24" fill="#fff3d6" stroke="#b7791f" stroke-width="3"/><text x="445" y="365">I</text>
    </g>
    <text x="278" y="430" text-anchor="middle" font-size="17" fill="#4a5568">One traversal starts per unvisited component.</text>

    <rect x="558" y="72" width="514" height="390" rx="8" fill="#f7fafc" stroke="#9aa9ba" stroke-width="2"/>
    <text x="815" y="108" text-anchor="middle" font-size="21" font-weight="700" fill="#2d3748">Directed strongly connected components</text>
    <g fill="none" stroke="#52657a" stroke-width="3" marker-end="url(#arrow)"><path d="M635 215 Q700 135 755 220"/><path d="M755 220 Q700 300 635 215"/><path d="M755 220 L845 190"/><path d="M845 190 Q900 130 945 215"/><path d="M945 215 Q900 290 845 190"/><path d="M945 215 L995 330"/></g>
    <g text-anchor="middle" dominant-baseline="middle" font-size="18" font-weight="700">
      <g fill="#f2ecfb" stroke="#805ad5" stroke-width="3"><circle cx="635" cy="215" r="25"/><circle cx="755" cy="220" r="25"/></g><text x="635" y="215">A</text><text x="755" y="220">B</text>
      <g fill="#fdecec" stroke="#c53030" stroke-width="3"><circle cx="845" cy="190" r="25"/><circle cx="945" cy="215" r="25"/></g><text x="845" y="190">C</text><text x="945" y="215">D</text>
      <circle cx="995" cy="330" r="25" fill="#fff3d6" stroke="#b7791f" stroke-width="3"/><text x="995" y="330">E</text>
    </g>
    <g fill="none" stroke-dasharray="8 6" stroke-width="2"><ellipse cx="695" cy="218" rx="100" ry="85" stroke="#805ad5"/><ellipse cx="895" cy="205" rx="92" ry="82" stroke="#c53030"/><ellipse cx="995" cy="330" rx="48" ry="48" stroke="#b7791f"/></g>
    <text x="815" y="405" text-anchor="middle" font-size="17" fill="#4a5568">Collapse each SCC into one node:</text>
    <text x="815" y="435" text-anchor="middle" font-size="17" font-weight="700" fill="#52657a">{A,B} → {C,D} → {E} forms a DAG</text>
  </g>
  <text x="550" y="496" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#4a5568">Reachability is symmetric inside an undirected component; inside an SCC, every vertex reaches every other by directed paths.</text>
</svg>
