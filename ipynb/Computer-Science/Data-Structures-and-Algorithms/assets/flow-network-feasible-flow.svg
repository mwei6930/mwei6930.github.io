<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">A feasible flow and its invariants</title>
  <desc id="desc">A four-node flow network whose edge labels show flow over capacity, together with capacity, conservation, and flow-value checks.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker>
    <style>
      .title{font:700 28px 'Segoe UI',Arial,sans-serif;fill:#172033}.label{font:600 18px 'Segoe UI',Arial,sans-serif;fill:#172033}.body{font:16px 'Segoe UI',Arial,sans-serif;fill:#334155}.small{font:14px 'Segoe UI',Arial,sans-serif;fill:#526174}.edge{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#arrow)}.node{stroke-width:3}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2}.pill{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1100" height="620" fill="#f8fafc"/>
  <text x="550" y="44" text-anchor="middle" class="title">A feasible flow satisfies local rules and a global objective</text>
  <rect x="34" y="72" width="680" height="510" rx="8" class="box"/>
  <rect x="740" y="72" width="326" height="510" rx="8" class="box"/>
  <text x="374" y="110" text-anchor="middle" class="label">Running network: labels are flow / capacity</text>

  <path d="M139 275L310 172" class="edge"/><path d="M139 325L310 428" class="edge"/>
  <path d="M365 190L365 410" class="edge"/><path d="M420 170L592 274" class="edge"/><path d="M420 430L592 326" class="edge"/>
  <rect x="205" y="190" width="54" height="30" rx="6" class="pill"/><text x="232" y="211" text-anchor="middle" class="label">3 / 4</text>
  <rect x="205" y="380" width="54" height="30" rx="6" class="pill"/><text x="232" y="401" text-anchor="middle" class="label">2 / 2</text>
  <rect x="379" y="288" width="54" height="30" rx="6" class="pill"/><text x="406" y="309" text-anchor="middle" class="label">1 / 1</text>
  <rect x="492" y="190" width="54" height="30" rx="6" class="pill"/><text x="519" y="211" text-anchor="middle" class="label">2 / 2</text>
  <rect x="492" y="380" width="54" height="30" rx="6" class="pill"/><text x="519" y="401" text-anchor="middle" class="label">3 / 3</text>
  <circle cx="105" cy="300" r="42" fill="#dbeafe" stroke="#2563eb" class="node"/><circle cx="365" cy="145" r="42" fill="#dcfce7" stroke="#16a34a" class="node"/>
  <circle cx="365" cy="455" r="42" fill="#fef3c7" stroke="#d97706" class="node"/><circle cx="625" cy="300" r="42" fill="#f3e8ff" stroke="#9333ea" class="node"/>
  <text x="105" y="308" text-anchor="middle" class="title">s</text><text x="365" y="153" text-anchor="middle" class="title">a</text><text x="365" y="463" text-anchor="middle" class="title">b</text><text x="625" y="308" text-anchor="middle" class="title">t</text>
  <text x="374" y="540" text-anchor="middle" class="body">Five units leave s and exactly five units enter t.</text>

  <text x="903" y="116" text-anchor="middle" class="label">Three checks</text>
  <rect x="768" y="142" width="270" height="112" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="788" y="174" class="label">1. Capacity</text><text x="788" y="205" class="body">0 &lt;= f(u,v) &lt;= c(u,v)</text><text x="788" y="231" class="small">No edge carries more than it allows.</text>
  <rect x="768" y="270" width="270" height="126" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="788" y="302" class="label">2. Conservation</text><text x="788" y="333" class="body">At a: 3 in = 2 + 1 out</text><text x="788" y="361" class="body">At b: 2 + 1 in = 3 out</text>
  <rect x="768" y="412" width="270" height="126" rx="8" fill="#faf5ff" stroke="#d8b4fe" stroke-width="2"/>
  <text x="788" y="444" class="label">3. Flow value</text><text x="788" y="475" class="body">|f| = out(s) - in(s)</text><text x="788" y="503" class="body">|f| = 3 + 2 = 5</text>
</svg>
