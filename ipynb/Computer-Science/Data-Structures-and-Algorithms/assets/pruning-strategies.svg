<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Four pruning strategies in backtracking</title>
  <desc id="desc">A state-space tree with infeasibility, bound, symmetry, and constraint-propagation pruning.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
  </defs>
  <rect width="1200" height="620" fill="#f8fafc"/>
  <text x="600" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#0f172a">Prune only when no descendant can improve the required answer</text>

  <rect x="35" y="78" width="620" height="490" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="345" y="114" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#334155">Search tree after pruning</text>
  <g fill="none" stroke="#64748b" stroke-width="2">
    <path d="M345 165 L215 245 M345 165 L475 245"/>
    <path d="M215 245 L125 335 M215 245 L275 335"/>
    <path d="M475 245 L415 335 M475 245 L565 335"/>
    <path d="M125 335 L85 430 M125 335 L165 430"/>
    <path d="M275 335 L235 430 M275 335 L315 430"/>
    <path d="M415 335 L375 430 M415 335 L455 430"/>
    <path d="M565 335 L525 430 M565 335 L605 430"/>
  </g>
  <g stroke-width="2">
    <circle cx="345" cy="165" r="27" fill="#dbeafe" stroke="#2563eb"/>
    <circle cx="215" cy="245" r="25" fill="#e0f2fe" stroke="#0891b2"/>
    <circle cx="475" cy="245" r="25" fill="#e0f2fe" stroke="#0891b2"/>
    <circle cx="125" cy="335" r="23" fill="#fee2e2" stroke="#dc2626"/>
    <circle cx="275" cy="335" r="23" fill="#fff7ed" stroke="#ea580c"/>
    <circle cx="415" cy="335" r="23" fill="#ede9fe" stroke="#7c3aed"/>
    <circle cx="565" cy="335" r="23" fill="#fef9c3" stroke="#ca8a04"/>
    <circle cx="85" cy="430" r="18" fill="#f1f5f9" stroke="#94a3b8"/><circle cx="165" cy="430" r="18" fill="#f1f5f9" stroke="#94a3b8"/>
    <circle cx="235" cy="430" r="18" fill="#f1f5f9" stroke="#94a3b8"/><circle cx="315" cy="430" r="18" fill="#f1f5f9" stroke="#94a3b8"/>
    <circle cx="375" cy="430" r="18" fill="#f1f5f9" stroke="#94a3b8"/><circle cx="455" cy="430" r="18" fill="#f1f5f9" stroke="#94a3b8"/>
    <circle cx="525" cy="430" r="18" fill="#dcfce7" stroke="#16a34a"/><circle cx="605" cy="430" r="18" fill="#dcfce7" stroke="#16a34a"/>
  </g>
  <g stroke-width="5">
    <path d="M103 313 L147 357 M147 313 L103 357" stroke="#dc2626"/>
    <path d="M253 313 L297 357 M297 313 L253 357" stroke="#ea580c"/>
    <path d="M393 313 L437 357 M437 313 L393 357" stroke="#7c3aed"/>
  </g>
  <text x="125" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#b91c1c">infeasible</text>
  <text x="275" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#c2410c">bound too weak</text>
  <text x="415" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#6d28d9">symmetric duplicate</text>
  <text x="565" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#a16207">propagate first</text>
  <text x="345" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#475569">Crossed branches are rejected before their descendants are generated.</text>

  <rect x="695" y="78" width="470" height="490" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <text x="930" y="114" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0f766e">What makes each prune safe?</text>
  <g font-family="Arial, sans-serif">
    <rect x="735" y="145" width="390" height="78" rx="6" fill="#fef2f2" stroke="#dc2626"/>
    <text x="760" y="174" font-size="16" font-weight="700" fill="#b91c1c">Feasibility</text>
    <text x="760" y="201" font-size="14" fill="#475569">A violated monotone constraint cannot be repaired later.</text>
    <rect x="735" y="240" width="390" height="78" rx="6" fill="#fff7ed" stroke="#ea580c"/>
    <text x="760" y="269" font-size="16" font-weight="700" fill="#c2410c">Branch and bound</text>
    <text x="760" y="296" font-size="14" fill="#475569">Even an optimistic completion cannot beat the incumbent.</text>
    <rect x="735" y="335" width="390" height="78" rx="6" fill="#f5f3ff" stroke="#7c3aed"/>
    <text x="760" y="364" font-size="16" font-weight="700" fill="#6d28d9">Symmetry</text>
    <text x="760" y="391" font-size="14" fill="#475569">Another canonical branch represents the same solutions.</text>
    <rect x="735" y="430" width="390" height="78" rx="6" fill="#fefce8" stroke="#ca8a04"/>
    <text x="760" y="459" font-size="16" font-weight="700" fill="#a16207">Constraint propagation</text>
    <text x="760" y="486" font-size="14" fill="#475569">Reduced domains reveal failure before making another guess.</text>
  </g>
</svg>
