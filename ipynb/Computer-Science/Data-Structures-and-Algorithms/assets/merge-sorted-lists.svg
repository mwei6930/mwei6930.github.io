<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc">
  <title id="title">Merging two sorted linked lists</title>
  <desc id="desc">Two sorted input lists feed a merged result through a tail pointer that always links the smaller front node.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#385170"/></marker></defs>
  <rect width="1000" height="460" fill="#ffffff"/>
  <text x="500" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#172b4d">Compare only the two current front nodes</text>
  <g font-family="Arial, sans-serif">
    <text x="48" y="112" font-size="19" font-weight="700" fill="#174a73">List A</text>
    <g fill="#e9f3ff" stroke="#2f6fa3" stroke-width="2"><rect x="160" y="78" width="92" height="58" rx="7"/><rect x="330" y="78" width="92" height="58" rx="7"/><rect x="500" y="78" width="92" height="58" rx="7"/></g>
    <g text-anchor="middle" font-size="22"><text x="206" y="115">1</text><text x="376" y="115">4</text><text x="546" y="115">7</text></g><path d="M252 107 H322" stroke="#385170" stroke-width="3" marker-end="url(#arrow)"/><path d="M422 107 H492" stroke="#385170" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="48" y="221" font-size="19" font-weight="700" fill="#744210">List B</text>
    <g fill="#fff3d6" stroke="#b7791f" stroke-width="2"><rect x="160" y="187" width="92" height="58" rx="7"/><rect x="330" y="187" width="92" height="58" rx="7"/><rect x="500" y="187" width="92" height="58" rx="7"/></g>
    <g text-anchor="middle" font-size="22"><text x="206" y="224">2</text><text x="376" y="224">3</text><text x="546" y="224">8</text></g><path d="M252 216 H322" stroke="#385170" stroke-width="3" marker-end="url(#arrow)"/><path d="M422 216 H492" stroke="#385170" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="675" y="92" width="270" height="138" rx="8" fill="#f7fafc" stroke="#a0aec0"/>
    <text x="810" y="128" text-anchor="middle" font-size="18" font-weight="700" fill="#2d3748">Invariant</text>
    <text x="810" y="160" text-anchor="middle" font-size="16" fill="#4a5568">Everything before tail is sorted</text>
    <text x="810" y="188" text-anchor="middle" font-size="16" fill="#4a5568">and no larger than either front.</text>

    <line x1="48" y1="279" x2="952" y2="279" stroke="#cbd5e0" stroke-width="2"/>
    <text x="48" y="344" font-size="19" font-weight="700" fill="#22543d">Merged</text>
    <g fill="#e8f7ef" stroke="#2f855a" stroke-width="2"><rect x="160" y="310" width="92" height="58" rx="7"/><rect x="315" y="310" width="92" height="58" rx="7"/><rect x="470" y="310" width="92" height="58" rx="7"/><rect x="625" y="310" width="92" height="58" rx="7"/><rect x="780" y="310" width="92" height="58" rx="7"/></g>
    <g text-anchor="middle" font-size="22"><text x="206" y="347">1</text><text x="361" y="347">2</text><text x="516" y="347">3</text><text x="671" y="347">4</text><text x="826" y="347">...</text></g>
    <g stroke="#385170" stroke-width="3" marker-end="url(#arrow)"><path d="M252 339 H307"/><path d="M407 339 H462"/><path d="M562 339 H617"/><path d="M717 339 H772"/></g>
    <text x="671" y="404" text-anchor="middle" font-size="16" font-weight="700" fill="#2f6fa3">tail</text>
  </g>
</svg>
