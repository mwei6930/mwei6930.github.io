<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" viewBox="0 0 1200 530" role="img" aria-labelledby="title desc">
  <title id="title">One-dimensional prefix dynamic programming</title>
  <desc id="desc">Decode Ways example for string 226, showing one-character and two-character transitions into prefix states.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
  </defs>
  <rect width="1200" height="530" fill="#f8fafc"/>
  <text x="600" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#0f172a">Prefix states turn local parsing choices into a left-to-right recurrence</text>

  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="150" y="113" font-size="17" font-weight="700" fill="#475569">encoded string</text>
    <rect x="300" y="78" width="110" height="70" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <rect x="430" y="78" width="110" height="70" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <rect x="560" y="78" width="110" height="70" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="355" y="122" font-size="27" font-weight="700" fill="#1e3a8a">2</text>
    <text x="485" y="122" font-size="27" font-weight="700" fill="#1e3a8a">2</text>
    <text x="615" y="122" font-size="27" font-weight="700" fill="#1e3a8a">6</text>
    <text x="355" y="169" font-size="14" fill="#475569">position 1</text>
    <text x="485" y="169" font-size="14" fill="#475569">position 2</text>
    <text x="615" y="169" font-size="14" fill="#475569">position 3</text>

    <text x="150" y="319" font-size="17" font-weight="700" fill="#475569">number of decodings</text>
    <rect x="225" y="270" width="125" height="90" rx="8" fill="#e2e8f0" stroke="#64748b"/>
    <rect x="385" y="270" width="125" height="90" rx="8" fill="#ecfeff" stroke="#0891b2"/>
    <rect x="545" y="270" width="125" height="90" rx="8" fill="#ecfeff" stroke="#0891b2"/>
    <rect x="705" y="270" width="125" height="90" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="287" y="301" font-size="15" fill="#475569">dp[0]</text><text x="287" y="340" font-size="27" font-weight="700" fill="#334155">1</text>
    <text x="447" y="301" font-size="15" fill="#155e75">dp[1]</text><text x="447" y="340" font-size="27" font-weight="700" fill="#155e75">1</text>
    <text x="607" y="301" font-size="15" fill="#155e75">dp[2]</text><text x="607" y="340" font-size="27" font-weight="700" fill="#155e75">2</text>
    <text x="767" y="301" font-size="15" fill="#166534">dp[3]</text><text x="767" y="340" font-size="27" font-weight="700" fill="#166534">3</text>
  </g>

  <path d="M350 285 C380 215 410 215 435 270" fill="none" stroke="#0891b2" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M510 285 C540 215 570 215 595 270" fill="none" stroke="#0891b2" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M670 285 C700 215 730 215 755 270" fill="none" stroke="#0891b2" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="400" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#0e7490">one digit</text>
  <text x="560" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#0e7490">one digit</text>
  <text x="720" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#0e7490">one digit</text>

  <path d="M350 345 C430 445 670 445 730 355" fill="none" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M510 345 C570 410 675 410 730 355" fill="none" stroke="#ea580c" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="520" y="468" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#6d28d9">"26" is valid: add dp[1]</text>
  <text x="695" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#c2410c">"6" is valid: add dp[2]</text>
  <rect x="870" y="245" width="285" height="145" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="1012" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Local dependency window</text>
  <text x="1012" y="319" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#334155">dp[i] receives contributions</text>
  <text x="1012" y="347" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#334155">from dp[i-1] and dp[i-2]</text>
  <text x="1012" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#475569">only when the matching token is valid</text>
</svg>
