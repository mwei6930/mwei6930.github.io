<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc">
  <title id="title">Two pointers converging in a sorted array</title>
  <desc id="desc">Three steps show left and right pointers moving inward according to whether their sum is below or above the target.</desc>
  <rect width="1000" height="450" fill="#ffffff"/>
  <text x="500" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#172b4d">Two pointers eliminate impossible ranges</text>
  <g font-family="Arial, sans-serif">
    <text x="40" y="115" font-size="18" font-weight="700" fill="#174a73">Step 1</text><text x="790" y="115" font-size="17" fill="#174a73">1 + 11 = 12 &gt; 9, move R</text>
    <text x="40" y="235" font-size="18" font-weight="700" fill="#744210">Step 2</text><text x="790" y="235" font-size="17" fill="#744210">1 + 7 = 8 &lt; 9, move L</text>
    <text x="40" y="355" font-size="18" font-weight="700" fill="#22543d">Step 3</text><text x="790" y="355" font-size="17" fill="#22543d">2 + 7 = 9, found</text>
    <g transform="translate(150 76)"><g fill="#e9f3ff" stroke="#2f6fa3"><rect width="94" height="56" rx="6"/><rect x="98" width="94" height="56" rx="6"/><rect x="196" width="94" height="56" rx="6"/><rect x="294" width="94" height="56" rx="6"/><rect x="392" width="94" height="56" rx="6"/></g><g text-anchor="middle" font-size="21"><text x="47" y="35">1</text><text x="145" y="35">2</text><text x="243" y="35">4</text><text x="341" y="35">7</text><text x="439" y="35">11</text></g><text x="47" y="79" text-anchor="middle" fill="#2f6fa3" font-weight="700">L</text><text x="439" y="79" text-anchor="middle" fill="#c53030" font-weight="700">R</text></g>
    <g transform="translate(150 196)"><g fill="#fff3d6" stroke="#b7791f"><rect width="94" height="56" rx="6"/><rect x="98" width="94" height="56" rx="6"/><rect x="196" width="94" height="56" rx="6"/><rect x="294" width="94" height="56" rx="6"/><rect x="392" width="94" height="56" rx="6"/></g><g text-anchor="middle" font-size="21"><text x="47" y="35">1</text><text x="145" y="35">2</text><text x="243" y="35">4</text><text x="341" y="35">7</text><text x="439" y="35">11</text></g><text x="47" y="79" text-anchor="middle" fill="#2f6fa3" font-weight="700">L</text><text x="341" y="79" text-anchor="middle" fill="#c53030" font-weight="700">R</text></g>
    <g transform="translate(150 316)"><g fill="#e8f7ef" stroke="#2f855a"><rect width="94" height="56" rx="6"/><rect x="98" width="94" height="56" rx="6" stroke-width="3"/><rect x="196" width="94" height="56" rx="6"/><rect x="294" width="94" height="56" rx="6" stroke-width="3"/><rect x="392" width="94" height="56" rx="6"/></g><g text-anchor="middle" font-size="21"><text x="47" y="35">1</text><text x="145" y="35">2</text><text x="243" y="35">4</text><text x="341" y="35">7</text><text x="439" y="35">11</text></g><text x="145" y="79" text-anchor="middle" fill="#2f6fa3" font-weight="700">L</text><text x="341" y="79" text-anchor="middle" fill="#c53030" font-weight="700">R</text></g>
  </g>
</svg>
