<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="title desc">
  <title id="title">A string as characters, code points, and encoded bytes</title>
  <desc id="desc">The text cafe with an accented e maps to Unicode code points and then UTF-8 bytes, showing that character indices and byte positions may differ.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#385170"/></marker></defs>
  <rect width="1000" height="400" fill="#ffffff"/>
  <text x="500" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#172b4d">A string has several useful views</text>
  <g font-family="Arial, sans-serif">
    <text x="55" y="108" font-size="19" font-weight="700" fill="#174a73">Text</text>
    <rect x="220" y="74" width="120" height="54" rx="8" fill="#e9f3ff" stroke="#2f6fa3" stroke-width="2"/>
    <text x="280" y="109" text-anchor="middle" font-size="24" fill="#174a73">cafe</text>
    <text x="55" y="199" font-size="19" font-weight="700" fill="#744210">Code points</text>
    <g fill="#fff3d6" stroke="#b7791f"><rect x="220" y="164" width="125" height="54" rx="6"/><rect x="353" y="164" width="125" height="54" rx="6"/><rect x="486" y="164" width="125" height="54" rx="6"/><rect x="619" y="164" width="125" height="54" rx="6"/></g>
    <g text-anchor="middle" font-size="17" fill="#4a3a1f"><text x="282" y="198">U+0063</text><text x="415" y="198">U+0061</text><text x="548" y="198">U+0066</text><text x="681" y="198">U+00E9</text></g>
    <text x="55" y="304" font-size="19" font-weight="700" fill="#22543d">UTF-8 bytes</text>
    <g fill="#e8f7ef" stroke="#2f855a"><rect x="220" y="269" width="105" height="54" rx="6"/><rect x="333" y="269" width="105" height="54" rx="6"/><rect x="446" y="269" width="105" height="54" rx="6"/><rect x="559" y="269" width="105" height="54" rx="6"/><rect x="672" y="269" width="105" height="54" rx="6"/></g>
    <g text-anchor="middle" font-size="17" fill="#234e3b"><text x="272" y="303">63</text><text x="385" y="303">61</text><text x="498" y="303">66</text><text x="611" y="303">C3</text><text x="724" y="303">A9</text></g>
    <path d="M280 128 V155" stroke="#385170" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M480 218 V260" stroke="#385170" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="814" y="128" width="145" height="164" rx="8" fill="#f7fafc" stroke="#a0aec0"/>
    <text x="886" y="163" text-anchor="middle" font-size="18" font-weight="700" fill="#2d3748">Key lesson</text>
    <text x="886" y="198" text-anchor="middle" font-size="16" fill="#4a5568">4 characters</text>
    <text x="886" y="227" text-anchor="middle" font-size="16" fill="#4a5568">4 code points</text>
    <text x="886" y="256" text-anchor="middle" font-size="16" fill="#4a5568">5 UTF-8 bytes</text>
  </g>
</svg>
