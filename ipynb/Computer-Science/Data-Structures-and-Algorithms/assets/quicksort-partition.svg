<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc">
  <title id="title">Three-way quicksort partition</title>
  <desc id="desc">A pivot partitions values into less-than, equal-to, and greater-than regions, after which quicksort recurses only on the outer regions.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#52657a"/></marker></defs>
  <rect width="1100" height="500" fill="#ffffff"/>
  <text x="550" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#172b4d">Partition places the pivot region before recursive calls</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="95" y="130" font-size="18" font-weight="700" fill="#2d3748">Input</text>
    <g transform="translate(225 95)" font-size="19" font-weight="700"><g fill="#e6f1fb" stroke="#2f6fa3"><rect x="0" y="0" width="72" height="55"/><rect x="74" y="0" width="72" height="55"/><rect x="148" y="0" width="72" height="55"/><rect x="222" y="0" width="72" height="55"/><rect x="296" y="0" width="72" height="55"/><rect x="370" y="0" width="72" height="55"/><rect x="444" y="0" width="72" height="55"/><rect x="518" y="0" width="72" height="55" fill="#fdecec" stroke="#c53030" stroke-width="4"/></g><g fill="#2d3748"><text x="36" y="35">7</text><text x="110" y="35">2</text><text x="184" y="35">5</text><text x="258" y="35">3</text><text x="332" y="35">9</text><text x="406" y="35">5</text><text x="480" y="35">1</text><text x="554" y="35">5</text></g></g>
    <text x="905" y="180" font-size="16" fill="#9b2c2c">pivot = 5</text>
    <path d="M550 185 V230" stroke="#52657a" stroke-width="4" marker-end="url(#arrow)"/>

    <text x="95" y="297" font-size="18" font-weight="700" fill="#2d3748">Partition</text>
    <g transform="translate(225 260)" font-size="19" font-weight="700"><g fill="#e8f7ef" stroke="#2f855a"><rect x="0" y="0" width="72" height="55"/><rect x="74" y="0" width="72" height="55"/><rect x="148" y="0" width="72" height="55"/></g><g fill="#f2ecfb" stroke="#805ad5" stroke-width="3"><rect x="222" y="0" width="72" height="55"/><rect x="296" y="0" width="72" height="55"/><rect x="370" y="0" width="72" height="55"/></g><g fill="#fff3d6" stroke="#b7791f"><rect x="444" y="0" width="72" height="55"/><rect x="518" y="0" width="72" height="55"/></g><g fill="#2d3748"><text x="36" y="35">2</text><text x="110" y="35">3</text><text x="184" y="35">1</text><text x="258" y="35">5</text><text x="332" y="35">5</text><text x="406" y="35">5</text><text x="480" y="35">9</text><text x="554" y="35">7</text></g></g>
    <g font-size="16" font-weight="700"><text x="335" y="345" fill="#22543d">values &lt; pivot</text><text x="557" y="345" fill="#553c9a">equal: final region</text><text x="780" y="345" fill="#744210">values &gt; pivot</text></g>
    <path d="M335 365 V405" stroke="#2f855a" stroke-width="4" marker-end="url(#arrow)"/><path d="M780 365 V405" stroke="#b7791f" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="230" y="418" width="220" height="45" rx="7" fill="#edf7f2" stroke="#2f855a"/><rect x="670" y="418" width="220" height="45" rx="7" fill="#fff8e8" stroke="#b7791f"/>
    <text x="340" y="447" font-size="17" font-weight="700" fill="#22543d">recurse on left</text><text x="780" y="447" font-size="17" font-weight="700" fill="#744210">recurse on right</text>
    <text x="550" y="485" font-size="15" fill="#4a5568">The equal region is already complete; three-way partitioning handles duplicates efficiently.</text>
  </g>
</svg>
