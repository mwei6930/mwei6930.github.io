<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
  <title id="title">Three implementations of the Map abstract data type</title>
  <desc id="desc">Unsorted arrays scan entries, sorted arrays use binary search, and hash tables compute a bucket index.</desc>
  <rect width="1000" height="430" fill="#ffffff"/>
  <text x="500" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#172b4d">The Map contract does not choose its storage</text>
  <g font-family="Arial, sans-serif">
    <rect x="42" y="76" width="282" height="306" rx="8" fill="#e9f3ff" stroke="#2f6fa3" stroke-width="2"/>
    <text x="183" y="112" text-anchor="middle" font-size="20" font-weight="700" fill="#174a73">Unsorted sequence</text>
    <text x="183" y="141" text-anchor="middle" font-size="16" fill="#243b53">[(pear, 4), (apple, 7), ...]</text>
    <g fill="#ffffff" stroke="#7aa7cf"><rect x="78" y="170" width="210" height="42" rx="5"/><rect x="78" y="220" width="210" height="42" rx="5"/><rect x="78" y="270" width="210" height="42" rx="5"/></g>
    <g text-anchor="middle" font-size="16" fill="#243b53"><text x="183" y="197">pear : 4</text><text x="183" y="247">apple : 7</text><text x="183" y="297">lime : 2</text></g>
    <text x="183" y="348" text-anchor="middle" font-size="16" font-weight="700" fill="#174a73">lookup: O(n)</text>

    <rect x="359" y="76" width="282" height="306" rx="8" fill="#fff3d6" stroke="#b7791f" stroke-width="2"/>
    <text x="500" y="112" text-anchor="middle" font-size="20" font-weight="700" fill="#744210">Sorted sequence</text>
    <text x="500" y="141" text-anchor="middle" font-size="16" fill="#4a3a1f">keys kept in order</text>
    <g fill="#ffffff" stroke="#d9aa55"><rect x="395" y="170" width="210" height="42" rx="5"/><rect x="395" y="220" width="210" height="42" rx="5"/><rect x="395" y="270" width="210" height="42" rx="5"/></g>
    <g text-anchor="middle" font-size="16" fill="#4a3a1f"><text x="500" y="197">apple : 7</text><text x="500" y="247">lime : 2</text><text x="500" y="297">pear : 4</text></g>
    <text x="500" y="348" text-anchor="middle" font-size="16" font-weight="700" fill="#744210">lookup: O(log n)</text>

    <rect x="676" y="76" width="282" height="306" rx="8" fill="#e8f7ef" stroke="#2f855a" stroke-width="2"/>
    <text x="817" y="112" text-anchor="middle" font-size="20" font-weight="700" fill="#22543d">Hash table</text>
    <text x="817" y="141" text-anchor="middle" font-size="16" fill="#234e3b">index = hash(key) mod m</text>
    <g fill="#ffffff" stroke="#68a983"><rect x="712" y="170" width="66" height="42" rx="5"/><rect x="712" y="220" width="66" height="42" rx="5"/><rect x="712" y="270" width="66" height="42" rx="5"/></g>
    <g text-anchor="middle" font-size="16" fill="#234e3b"><text x="745" y="197">0</text><text x="745" y="247">1</text><text x="745" y="297">2</text></g>
    <g fill="#ffffff" stroke="#68a983"><rect x="797" y="170" width="126" height="42" rx="5"/><rect x="797" y="270" width="126" height="42" rx="5"/></g>
    <g text-anchor="middle" font-size="15" fill="#234e3b"><text x="860" y="197">apple : 7</text><text x="860" y="297">pear : 4</text></g>
    <text x="817" y="348" text-anchor="middle" font-size="16" font-weight="700" fill="#22543d">expected lookup: O(1)</text>
  </g>
</svg>
