<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
  <title id="title">General tree representations</title>
  <desc id="desc">The same general tree is represented with a list of children and with first-child next-sibling links.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#385170"/></marker></defs>
  <rect width="1000" height="500" fill="#ffffff"/>
  <text x="500" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#172b4d">One logical tree, two storage choices</text>
  <g font-family="Arial, sans-serif">
    <rect x="35" y="70" width="285" height="380" rx="8" fill="#f7fafc" stroke="#a0aec0"/>
    <text x="177" y="104" text-anchor="middle" font-size="20" font-weight="700" fill="#2d3748">Logical tree</text>
    <g stroke="#718096" stroke-width="2.5"><path d="M177 157 L85 245"/><path d="M177 157 L177 245"/><path d="M177 157 L269 245"/><path d="M85 285 L55 365"/><path d="M85 285 L115 365"/><path d="M269 285 L269 365"/></g>
    <g text-anchor="middle" font-size="19" font-weight="700"><g fill="#f2ecfb" stroke="#805ad5"><circle cx="177" cy="140" r="30"/></g><g fill="#e9f3ff" stroke="#2f6fa3"><circle cx="85" cy="265" r="28"/><circle cx="177" cy="265" r="28"/><circle cx="269" cy="265" r="28"/></g><g fill="#e8f7ef" stroke="#2f855a"><circle cx="55" cy="385" r="26"/><circle cx="115" cy="385" r="26"/><circle cx="269" cy="385" r="26"/></g><text x="177" y="147">A</text><text x="85" y="272">B</text><text x="177" y="272">C</text><text x="269" y="272">D</text><text x="55" y="392">E</text><text x="115" y="392">F</text><text x="269" y="392">G</text></g>

    <rect x="350" y="70" width="285" height="380" rx="8" fill="#e9f3ff" stroke="#2f6fa3"/>
    <text x="492" y="104" text-anchor="middle" font-size="20" font-weight="700" fill="#174a73">Children-list nodes</text>
    <g font-size="16" fill="#243b53"><rect x="385" y="135" width="215" height="52" rx="6" fill="#ffffff" stroke="#7aa7cf"/><text x="403" y="168">A</text><text x="455" y="168">children [B, C, D]</text><rect x="385" y="205" width="215" height="52" rx="6" fill="#ffffff" stroke="#7aa7cf"/><text x="403" y="238">B</text><text x="455" y="238">children [E, F]</text><rect x="385" y="275" width="215" height="52" rx="6" fill="#ffffff" stroke="#7aa7cf"/><text x="403" y="308">C</text><text x="455" y="308">children []</text><rect x="385" y="345" width="215" height="52" rx="6" fill="#ffffff" stroke="#7aa7cf"/><text x="403" y="378">D</text><text x="455" y="378">children [G]</text></g>
    <text x="492" y="426" text-anchor="middle" font-size="15" fill="#174a73">Direct child iteration; variable list per node</text>

    <rect x="665" y="70" width="300" height="380" rx="8" fill="#fff3d6" stroke="#b7791f"/>
    <text x="815" y="104" text-anchor="middle" font-size="20" font-weight="700" fill="#744210">First-child / next-sibling</text>
    <g fill="#ffffff" stroke="#d69e2e" stroke-width="2"><rect x="785" y="125" width="62" height="42" rx="5"/><rect x="705" y="220" width="62" height="42" rx="5"/><rect x="785" y="220" width="62" height="42" rx="5"/><rect x="865" y="220" width="62" height="42" rx="5"/><rect x="685" y="335" width="62" height="42" rx="5"/><rect x="765" y="335" width="62" height="42" rx="5"/><rect x="865" y="335" width="62" height="42" rx="5"/></g>
    <g text-anchor="middle" font-size="18" font-weight="700"><text x="816" y="153">A</text><text x="736" y="248">B</text><text x="816" y="248">C</text><text x="896" y="248">D</text><text x="716" y="363">E</text><text x="796" y="363">F</text><text x="896" y="363">G</text></g>
    <g fill="none" stroke="#2f855a" stroke-width="3" marker-end="url(#arrow)"><path d="M800 167 L752 214"/><path d="M720 262 L715 328"/><path d="M880 262 L891 328"/></g>
    <g fill="none" stroke="#c53030" stroke-width="3" marker-end="url(#arrow)"><path d="M767 241 H778"/><path d="M847 241 H858"/><path d="M747 356 H758"/></g>
    <text x="815" y="408" text-anchor="middle" font-size="15" fill="#22543d">green = first child</text><text x="815" y="430" text-anchor="middle" font-size="15" fill="#9b2c2c">red = next sibling</text>
  </g>
</svg>
