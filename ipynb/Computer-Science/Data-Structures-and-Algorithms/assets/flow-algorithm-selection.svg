<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="720" viewBox="0 0 1160 720" role="img" aria-labelledby="title desc">
  <title id="title">Selecting a network flow or neighboring graph algorithm</title>
  <desc id="desc">A decision tree distinguishes path problems, maximum flow, bipartite matching, lower-bounded circulation, and minimum-cost flow.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><style>.title{font:700 28px 'Segoe UI',Arial,sans-serif;fill:#172033}.head{font:700 18px 'Segoe UI',Arial,sans-serif;fill:#172033}.body{font:15px 'Segoe UI',Arial,sans-serif;fill:#334155}.small{font:13px 'Segoe UI',Arial,sans-serif;fill:#526174}.line{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}.box{stroke-width:2}</style></defs>
  <rect width="1160" height="720" fill="#f8fafc"/><text x="580" y="44" text-anchor="middle" class="title">Choose the model before choosing the implementation</text>
  <rect x="420" y="75" width="320" height="70" rx="8" fill="#fff" stroke="#94a3b8" class="box"/><text x="580" y="105" text-anchor="middle" class="head">What must the solution optimize?</text><text x="580" y="130" text-anchor="middle" class="small">one route, total throughput, assignment, or cost</text>
  <path d="M495 145L260 205" class="line"/><path d="M580 145L580 205" class="line"/><path d="M665 145L900 205" class="line"/>
  <rect x="105" y="215" width="310" height="82" rx="8" fill="#eff6ff" stroke="#60a5fa" class="box"/><text x="260" y="247" text-anchor="middle" class="head">One route or one distance?</text><text x="260" y="274" text-anchor="middle" class="body">BFS / Dijkstra / Bellman-Ford</text>
  <rect x="425" y="215" width="310" height="82" rx="8" fill="#ecfdf5" stroke="#34d399" class="box"/><text x="580" y="247" text-anchor="middle" class="head">Maximum total throughput?</text><text x="580" y="274" text-anchor="middle" class="body">maximum flow model</text>
  <rect x="745" y="215" width="310" height="82" rx="8" fill="#fff7ed" stroke="#fb923c" class="box"/><text x="900" y="247" text-anchor="middle" class="head">Flow also has edge costs?</text><text x="900" y="274" text-anchor="middle" class="body">minimum-cost flow</text>
  <path d="M500 297L300 375" class="line"/><path d="M555 297L505 375" class="line"/><path d="M610 297L700 375" class="line"/><path d="M660 297L910 375" class="line"/>
  <rect x="130" y="385" width="270" height="100" rx="8" fill="#f0fdf4" stroke="#22c55e" class="box"/><text x="265" y="417" text-anchor="middle" class="head">Bipartite unit matching?</text><text x="265" y="444" text-anchor="middle" class="body">Hopcroft-Karp</text><text x="265" y="468" text-anchor="middle" class="small">or unit-capacity max flow</text>
  <rect x="420" y="385" width="270" height="100" rx="8" fill="#faf5ff" stroke="#c084fc" class="box"/><text x="555" y="417" text-anchor="middle" class="head">Lower bounds / demands?</text><text x="555" y="444" text-anchor="middle" class="body">circulation transformation</text><text x="555" y="468" text-anchor="middle" class="small">then one max-flow call</text>
  <rect x="710" y="385" width="270" height="100" rx="8" fill="#fefce8" stroke="#eab308" class="box"/><text x="845" y="417" text-anchor="middle" class="head">Tiny integer capacities?</text><text x="845" y="444" text-anchor="middle" class="body">Ford-Fulkerson is acceptable</text><text x="845" y="468" text-anchor="middle" class="small">time depends on final flow value</text>
  <path d="M580 485L580 550" class="line"/>
  <rect x="345" y="560" width="470" height="102" rx="8" fill="#fff" stroke="#64748b" class="box"/><text x="580" y="594" text-anchor="middle" class="head">Generic capacities and performance matters</text><text x="580" y="624" text-anchor="middle" class="body">Dinic is a practical default; Edmonds-Karp is the clearest baseline.</text><text x="580" y="649" text-anchor="middle" class="small">Always confirm directedness, integrality, parallel edges, and reconstruction needs.</text>
</svg>
