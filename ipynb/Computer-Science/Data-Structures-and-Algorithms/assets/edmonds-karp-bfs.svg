<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">Edmonds-Karp breadth-first augmentations</title>
  <desc id="desc">Three breadth-first augmenting paths find a maximum flow of five on the running network.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker><style>.title{font:700 28px 'Segoe UI',Arial,sans-serif;fill:#172033}.head{font:700 19px 'Segoe UI',Arial,sans-serif;fill:#172033}.body{font:16px 'Segoe UI',Arial,sans-serif;fill:#334155}.small{font:14px 'Segoe UI',Arial,sans-serif;fill:#526174}.card{fill:#fff;stroke:#cbd5e1;stroke-width:2}.node{stroke-width:2.5}.line{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1120" height="620" fill="#f8fafc"/><text x="560" y="46" text-anchor="middle" class="title">Edmonds-Karp always selects a shortest residual path by edge count</text>
  <rect x="35" y="82" width="330" height="440" rx="8" class="card"/><rect x="395" y="82" width="330" height="440" rx="8" class="card"/><rect x="755" y="82" width="330" height="440" rx="8" class="card"/>
  <text x="200" y="119" text-anchor="middle" class="head">BFS 1: s -> a -> t</text><text x="200" y="148" text-anchor="middle" class="body">levels 0, 1, 2; bottleneck 2</text>
  <path d="M100 285L185 205" class="line"/><path d="M225 205L303 285" class="line"/><circle cx="75" cy="310" r="29" fill="#dbeafe" stroke="#2563eb" class="node"/><circle cx="205" cy="185" r="29" fill="#dcfce7" stroke="#16a34a" class="node"/><circle cx="205" cy="435" r="29" fill="#fef3c7" stroke="#d97706" class="node"/><circle cx="325" cy="310" r="29" fill="#f3e8ff" stroke="#9333ea" class="node"/><text x="75" y="317" text-anchor="middle" class="head">s</text><text x="205" y="192" text-anchor="middle" class="head">a</text><text x="205" y="442" text-anchor="middle" class="head">b</text><text x="325" y="317" text-anchor="middle" class="head">t</text><text x="200" y="488" text-anchor="middle" class="small">Total flow = 2</text>

  <text x="560" y="119" text-anchor="middle" class="head">BFS 2: s -> b -> t</text><text x="560" y="148" text-anchor="middle" class="body">levels 0, 1, 2; bottleneck 2</text>
  <path d="M460 335L545 415" class="line"/><path d="M585 415L663 335" class="line"/><circle cx="435" cy="310" r="29" fill="#dbeafe" stroke="#2563eb" class="node"/><circle cx="565" cy="185" r="29" fill="#dcfce7" stroke="#16a34a" class="node"/><circle cx="565" cy="435" r="29" fill="#fef3c7" stroke="#d97706" class="node"/><circle cx="685" cy="310" r="29" fill="#f3e8ff" stroke="#9333ea" class="node"/><text x="435" y="317" text-anchor="middle" class="head">s</text><text x="565" y="192" text-anchor="middle" class="head">a</text><text x="565" y="442" text-anchor="middle" class="head">b</text><text x="685" y="317" text-anchor="middle" class="head">t</text><text x="560" y="488" text-anchor="middle" class="small">Total flow = 4</text>

  <text x="920" y="119" text-anchor="middle" class="head">BFS 3: s -> a -> b -> t</text><text x="920" y="148" text-anchor="middle" class="body">levels 0, 1, 2, 3; bottleneck 1</text>
  <path d="M820 285L905 205" class="line"/><path d="M925 215L925 397" class="line"/><path d="M945 415L1023 335" class="line"/><circle cx="795" cy="310" r="29" fill="#dbeafe" stroke="#2563eb" class="node"/><circle cx="925" cy="185" r="29" fill="#dcfce7" stroke="#16a34a" class="node"/><circle cx="925" cy="435" r="29" fill="#fef3c7" stroke="#d97706" class="node"/><circle cx="1045" cy="310" r="29" fill="#f3e8ff" stroke="#9333ea" class="node"/><text x="795" y="317" text-anchor="middle" class="head">s</text><text x="925" y="192" text-anchor="middle" class="head">a</text><text x="925" y="442" text-anchor="middle" class="head">b</text><text x="1045" y="317" text-anchor="middle" class="head">t</text><text x="920" y="488" text-anchor="middle" class="small">Total flow = 5</text>
  <rect x="190" y="546" width="740" height="50" rx="7" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/><text x="560" y="578" text-anchor="middle" class="head">No residual s-to-t path remains, so the current flow is maximum.</text>
</svg>
