<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc">
  <title id="title">Best, average, and worst cases for linear search</title>
  <desc id="desc">Three arrays show a target at the first position, near the middle, and absent, requiring one, about half, and all comparisons.</desc>
  <rect width="1000" height="390" fill="#ffffff"/>
  <text x="500" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#172b4d">The same algorithm can do different amounts of work</text>
  <g font-family="Arial, sans-serif" font-size="16">
    <text x="48" y="106" font-size="20" font-weight="700" fill="#22543d">Best case</text>
    <text x="48" y="132" fill="#2d3748">target = 7, comparisons = 1</text>
    <g transform="translate(410 78)">
      <rect x="0" y="0" width="82" height="62" rx="6" fill="#c6f6d5" stroke="#2f855a" stroke-width="3"/>
      <text x="41" y="39" text-anchor="middle" font-size="22" font-weight="700" fill="#22543d">7</text>
      <rect x="88" y="0" width="82" height="62" rx="6" fill="#edf2f7" stroke="#a0aec0"/><text x="129" y="39" text-anchor="middle" font-size="22">2</text>
      <rect x="176" y="0" width="82" height="62" rx="6" fill="#edf2f7" stroke="#a0aec0"/><text x="217" y="39" text-anchor="middle" font-size="22">9</text>
      <rect x="264" y="0" width="82" height="62" rx="6" fill="#edf2f7" stroke="#a0aec0"/><text x="305" y="39" text-anchor="middle" font-size="22">4</text>
      <rect x="352" y="0" width="82" height="62" rx="6" fill="#edf2f7" stroke="#a0aec0"/><text x="393" y="39" text-anchor="middle" font-size="22">1</text>
    </g>

    <text x="48" y="218" font-size="20" font-weight="700" fill="#744210">Typical case</text>
    <text x="48" y="244" fill="#2d3748">target = 9, comparisons = 3</text>
    <g transform="translate(410 190)">
      <rect x="0" y="0" width="82" height="62" rx="6" fill="#fffaf0" stroke="#d69e2e"/><text x="41" y="39" text-anchor="middle" font-size="22">7</text>
      <rect x="88" y="0" width="82" height="62" rx="6" fill="#fffaf0" stroke="#d69e2e"/><text x="129" y="39" text-anchor="middle" font-size="22">2</text>
      <rect x="176" y="0" width="82" height="62" rx="6" fill="#fefcbf" stroke="#b7791f" stroke-width="3"/><text x="217" y="39" text-anchor="middle" font-size="22" font-weight="700">9</text>
      <rect x="264" y="0" width="82" height="62" rx="6" fill="#edf2f7" stroke="#a0aec0"/><text x="305" y="39" text-anchor="middle" font-size="22">4</text>
      <rect x="352" y="0" width="82" height="62" rx="6" fill="#edf2f7" stroke="#a0aec0"/><text x="393" y="39" text-anchor="middle" font-size="22">1</text>
    </g>

    <text x="48" y="330" font-size="20" font-weight="700" fill="#9b2c2c">Worst case</text>
    <text x="48" y="356" fill="#2d3748">target = 5, comparisons = n</text>
    <g transform="translate(410 302)">
      <rect x="0" y="0" width="82" height="62" rx="6" fill="#fff5f5" stroke="#c53030"/><text x="41" y="39" text-anchor="middle" font-size="22">7</text>
      <rect x="88" y="0" width="82" height="62" rx="6" fill="#fff5f5" stroke="#c53030"/><text x="129" y="39" text-anchor="middle" font-size="22">2</text>
      <rect x="176" y="0" width="82" height="62" rx="6" fill="#fff5f5" stroke="#c53030"/><text x="217" y="39" text-anchor="middle" font-size="22">9</text>
      <rect x="264" y="0" width="82" height="62" rx="6" fill="#fff5f5" stroke="#c53030"/><text x="305" y="39" text-anchor="middle" font-size="22">4</text>
      <rect x="352" y="0" width="82" height="62" rx="6" fill="#fff5f5" stroke="#c53030"/><text x="393" y="39" text-anchor="middle" font-size="22">1</text>
    </g>
  </g>
</svg>
