<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="650" viewBox="0 0 1160 650" role="img" aria-labelledby="title desc">
  <title id="title">Two-approximation for vertex cover</title><desc id="desc">A maximal matching selects disjoint edges, and adding both endpoints of each matched edge yields a vertex cover within twice optimum.</desc>
  <style>.title{font:700 28px 'Segoe UI',Arial,sans-serif;fill:#172033}.head{font:700 19px 'Segoe UI',Arial,sans-serif;fill:#172033}.body{font:16px 'Segoe UI',Arial,sans-serif;fill:#334155}.small{font:14px 'Segoe UI',Arial,sans-serif;fill:#526174}.card{fill:#fff;stroke:#cbd5e1;stroke-width:2}.edge{stroke:#94a3b8;stroke-width:3}.match{stroke:#dc2626;stroke-width:6}.node{fill:#fff;stroke:#475569;stroke-width:2.5}.chosen{fill:#dcfce7;stroke:#16a34a;stroke-width:3}</style>
  <rect width="1160" height="650" fill="#f8fafc"/><text x="580" y="45" text-anchor="middle" class="title">Endpoints of a maximal matching form a 2-approximate vertex cover</text>
  <rect x="35" y="90" width="340" height="440" rx="8" class="card"/><rect x="410" y="90" width="340" height="440" rx="8" class="card"/><rect x="785" y="90" width="340" height="440" rx="8" class="card"/>
  <text x="205" y="130" text-anchor="middle" class="head">1. Start with uncovered edges</text><path d="M110 260L205 185L300 260L265 390L145 390Z" fill="none" class="edge"/><path d="M110 260L300 260M205 185L145 390M205 185L265 390" class="edge"/><circle cx="110" cy="260" r="25" class="node"/><circle cx="205" cy="185" r="25" class="node"/><circle cx="300" cy="260" r="25" class="node"/><circle cx="265" cy="390" r="25" class="node"/><circle cx="145" cy="390" r="25" class="node"/>
  <text x="580" y="130" text-anchor="middle" class="head">2. Build any maximal matching</text><path d="M485 260L580 185L675 260L640 390L520 390Z" fill="none" class="edge"/><path d="M485 260L675 260M580 185L520 390M580 185L640 390" class="edge"/><path d="M485 260L580 185M675 260L640 390" class="match"/><circle cx="485" cy="260" r="25" class="node"/><circle cx="580" cy="185" r="25" class="node"/><circle cx="675" cy="260" r="25" class="node"/><circle cx="640" cy="390" r="25" class="node"/><circle cx="520" cy="390" r="25" class="node"/><text x="580" y="455" text-anchor="middle" class="small">Matched edges share no endpoints.</text>
  <text x="955" y="130" text-anchor="middle" class="head">3. Add every matched endpoint</text><path d="M860 260L955 185L1050 260L1015 390L895 390Z" fill="none" class="edge"/><path d="M860 260L1050 260M955 185L895 390M955 185L1015 390" class="edge"/><circle cx="860" cy="260" r="25" class="chosen"/><circle cx="955" cy="185" r="25" class="chosen"/><circle cx="1050" cy="260" r="25" class="chosen"/><circle cx="1015" cy="390" r="25" class="chosen"/><circle cx="895" cy="390" r="25" class="node"/><text x="955" y="455" text-anchor="middle" class="small">All remaining edges touch a chosen vertex.</text>
  <rect x="170" y="555" width="820" height="66" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/><text x="580" y="582" text-anchor="middle" class="head">OPT >= |M| and ALG = 2|M|, therefore ALG &lt;= 2 OPT</text><text x="580" y="607" text-anchor="middle" class="small">Each disjoint matched edge forces every valid cover to choose at least one endpoint.</text>
</svg>
