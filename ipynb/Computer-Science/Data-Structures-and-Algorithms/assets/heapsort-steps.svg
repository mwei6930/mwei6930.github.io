<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
  <title id="title">Heapsort phases</title>
  <desc id="desc">An unsorted array becomes a max heap, then the root repeatedly swaps into the sorted suffix while the heap shrinks.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#385170"/></marker></defs>
  <rect width="1000" height="500" fill="#ffffff"/>
  <text x="500" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#172b4d">Heapsort builds once, then shrinks the heap</text>
  <g font-family="Arial, sans-serif">
    <text x="55" y="105" font-size="19" font-weight="700" fill="#174a73">Input</text>
    <g transform="translate(190 72)" fill="#e9f3ff" stroke="#2f6fa3"><rect width="82" height="58"/><rect x="86" width="82" height="58"/><rect x="172" width="82" height="58"/><rect x="258" width="82" height="58"/><rect x="344" width="82" height="58"/><rect x="430" width="82" height="58"/></g><g text-anchor="middle" font-size="20" font-weight="700"><text x="231" y="109">4</text><text x="317" y="109">10</text><text x="403" y="109">3</text><text x="489" y="109">5</text><text x="575" y="109">1</text><text x="661" y="109">8</text></g>
    <path d="M450 143 V181" stroke="#385170" stroke-width="4" marker-end="url(#arrow)"/><text x="500" y="170" font-size="15" fill="#4a5568">bottom-up heapify O(n)</text>
    <text x="55" y="235" font-size="19" font-weight="700" fill="#744210">Max heap</text>
    <g transform="translate(190 202)" fill="#fff3d6" stroke="#b7791f"><rect width="82" height="58"/><rect x="86" width="82" height="58"/><rect x="172" width="82" height="58"/><rect x="258" width="82" height="58"/><rect x="344" width="82" height="58"/><rect x="430" width="82" height="58"/></g><g text-anchor="middle" font-size="20" font-weight="700"><text x="231" y="239">10</text><text x="317" y="239">5</text><text x="403" y="239">8</text><text x="489" y="239">4</text><text x="575" y="239">1</text><text x="661" y="239">3</text></g>
    <path d="M450 273 V311" stroke="#385170" stroke-width="4" marker-end="url(#arrow)"/><text x="500" y="300" font-size="15" fill="#4a5568">swap root with heap end, sift down</text>
    <text x="55" y="365" font-size="19" font-weight="700" fill="#22543d">After rounds</text>
    <g transform="translate(190 332)"><g fill="#e9f3ff" stroke="#2f6fa3"><rect width="82" height="58"/><rect x="86" width="82" height="58"/><rect x="172" width="82" height="58"/></g><g fill="#e8f7ef" stroke="#2f855a"><rect x="258" width="82" height="58"/><rect x="344" width="82" height="58"/><rect x="430" width="82" height="58"/></g></g><g text-anchor="middle" font-size="20" font-weight="700"><text x="231" y="369">4</text><text x="317" y="369">3</text><text x="403" y="369">1</text><text x="489" y="369">5</text><text x="575" y="369">8</text><text x="661" y="369">10</text></g>
    <path d="M730 342 H730 V397 H471" fill="none" stroke="#2f855a" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="790" y="365" font-size="17" font-weight="700" fill="#22543d">sorted suffix grows</text>
    <rect x="760" y="80" width="190" height="190" rx="8" fill="#f7fafc" stroke="#a0aec0"/><text x="855" y="116" text-anchor="middle" font-size="18" font-weight="700" fill="#2d3748">Complexity</text><text x="855" y="153" text-anchor="middle" font-size="16">build: O(n)</text><text x="855" y="184" text-anchor="middle" font-size="16">n extracts: O(n log n)</text><text x="855" y="215" text-anchor="middle" font-size="16">extra space: O(1)</text><text x="855" y="246" text-anchor="middle" font-size="16">not stable</text>
    <text x="500" y="465" text-anchor="middle" font-size="16" fill="#4a5568">The active heap is the unsorted prefix; the suffix is already final.</text>
  </g>
</svg>
