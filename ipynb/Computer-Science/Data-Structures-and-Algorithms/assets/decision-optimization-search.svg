<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
  <title id="title">Decision, optimization, and search formulations</title>
  <desc id="desc">An optimization problem can be solved by repeated decision queries, while a search problem must also recover a witness.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><style>.title{font:700 28px 'Segoe UI',Arial,sans-serif;fill:#172033}.head{font:700 19px 'Segoe UI',Arial,sans-serif;fill:#172033}.body{font:16px 'Segoe UI',Arial,sans-serif;fill:#334155}.small{font:14px 'Segoe UI',Arial,sans-serif;fill:#526174}.card{fill:#fff;stroke-width:2}.line{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1120" height="640" fill="#f8fafc"/><text x="560" y="45" text-anchor="middle" class="title">The same combinatorial task can ask three different questions</text>
  <rect x="45" y="90" width="300" height="390" rx="8" class="card" stroke="#60a5fa"/><rect x="410" y="90" width="300" height="390" rx="8" class="card" stroke="#a78bfa"/><rect x="775" y="90" width="300" height="390" rx="8" class="card" stroke="#34d399"/>
  <text x="195" y="132" text-anchor="middle" class="head">Decision</text><text x="195" y="165" text-anchor="middle" class="body">Does a cover of size at most k exist?</text><rect x="100" y="210" width="190" height="70" rx="8" fill="#eff6ff" stroke="#93c5fd"/><text x="195" y="240" text-anchor="middle" class="head">YES / NO</text><text x="195" y="264" text-anchor="middle" class="small">one bit of output</text><text x="195" y="340" text-anchor="middle" class="body">Monotone in k:</text><text x="195" y="370" text-anchor="middle" class="small">NO, NO, NO, YES, YES ...</text>
  <text x="560" y="132" text-anchor="middle" class="head">Optimization</text><text x="560" y="165" text-anchor="middle" class="body">What is the minimum cover size?</text><path d="M480 245L640 245" class="line"/><circle cx="485" cy="245" r="24" fill="#fee2e2" stroke="#ef4444"/><circle cx="535" cy="245" r="24" fill="#fee2e2" stroke="#ef4444"/><circle cx="585" cy="245" r="24" fill="#dcfce7" stroke="#22c55e"/><circle cx="635" cy="245" r="24" fill="#dcfce7" stroke="#22c55e"/><text x="485" y="251" text-anchor="middle" class="small">2</text><text x="535" y="251" text-anchor="middle" class="small">3</text><text x="585" y="251" text-anchor="middle" class="small">4</text><text x="635" y="251" text-anchor="middle" class="small">5</text><text x="560" y="315" text-anchor="middle" class="body">Binary search for first YES</text><text x="560" y="350" text-anchor="middle" class="head">OPT = 4</text>
  <text x="925" y="132" text-anchor="middle" class="head">Search</text><text x="925" y="165" text-anchor="middle" class="body">Which vertices form that cover?</text><circle cx="850" cy="270" r="28" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><circle cx="925" cy="215" r="28" fill="#fff" stroke="#64748b" stroke-width="2"/><circle cx="1000" cy="270" r="28" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><circle cx="925" cy="340" r="28" fill="#fff" stroke="#64748b" stroke-width="2"/><path d="M873 251L902 234M948 234L977 251M982 289L943 322M907 322L868 289" stroke="#64748b" stroke-width="3"/><text x="925" y="405" text-anchor="middle" class="body">Return a concrete witness C</text>
  <path d="M345 520L410 520" class="line"/><path d="M710 520L775 520" class="line"/><text x="560" y="552" text-anchor="middle" class="head">Decision answers locate the value; self-reduction recovers the witness.</text><text x="560" y="585" text-anchor="middle" class="small">Do not compare algorithms until the requested output formulation is explicit.</text>
</svg>
