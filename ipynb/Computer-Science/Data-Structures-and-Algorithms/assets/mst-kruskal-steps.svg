<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="570" viewBox="0 0 1100 570" role="img" aria-labelledby="title desc">
  <title id="title">Kruskal minimum spanning tree steps</title>
  <desc id="desc">Kruskal sorts edges by weight, accepts edges that join distinct components, rejects cycle-forming edges, and stops after selecting V minus one edges.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#52657a"/></marker></defs>
  <rect width="1100" height="570" fill="#ffffff"/>
  <text x="550" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#172b4d">Kruskal grows a forest without creating a cycle</text>
  <g font-family="Arial, sans-serif">
    <rect x="25" y="72" width="245" height="430" rx="8" fill="#f7fafc" stroke="#9aa9ba" stroke-width="2"/>
    <text x="147" y="106" text-anchor="middle" font-size="19" font-weight="700" fill="#2d3748">1. Sort edges</text>
    <g font-size="17" fill="#2d3748"><text x="62" y="155">AB: 1</text><text x="62" y="195">CD: 2</text><text x="62" y="235">BC: 3</text><text x="62" y="275">AC: 4</text><text x="62" y="315">DE: 5</text><text x="62" y="355">BD: 6</text><text x="62" y="395">CE: 7</text></g>
    <text x="147" y="455" text-anchor="middle" font-size="15" fill="#4a5568">Process lightest first.</text>

    <path d="M280 285 H310" stroke="#52657a" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="320" y="72" width="340" height="430" rx="8" fill="#edf7f2" stroke="#4d9b71" stroke-width="2"/>
    <text x="490" y="106" text-anchor="middle" font-size="19" font-weight="700" fill="#22543d">2. Accept only cross-component edges</text>
    <g fill="none" stroke="#b5c2d0" stroke-width="3"><path d="M385 210 L470 145 L555 215 L520 350 L395 345 Z"/><path d="M385 210 L555 215 M470 145 L520 350 M555 215 L395 345"/></g>
    <g stroke="#2f855a" stroke-width="7"><path d="M385 210 L470 145"/><path d="M555 215 L520 350"/><path d="M470 145 L555 215"/></g>
    <path d="M385 210 L555 215" stroke="#c53030" stroke-width="6" stroke-dasharray="10 7"/>
    <g text-anchor="middle" dominant-baseline="middle" font-size="18" font-weight="700" fill="#2d3748">
      <g fill="#ffffff" stroke="#52657a" stroke-width="3"><circle cx="385" cy="210" r="25"/><circle cx="470" cy="145" r="25"/><circle cx="555" cy="215" r="25"/><circle cx="520" cy="350" r="25"/><circle cx="395" cy="345" r="25"/></g>
      <text x="385" y="210">A</text><text x="470" y="145">B</text><text x="555" y="215">C</text><text x="520" y="350">D</text><text x="395" y="345">E</text>
    </g>
    <g font-size="15" font-weight="700"><text x="430" y="165" fill="#22543d">1</text><text x="520" y="165" fill="#22543d">3</text><text x="550" y="290" fill="#22543d">2</text><text x="465" y="205" fill="#9b2c2c">reject 4</text></g>
    <text x="490" y="430" text-anchor="middle" font-size="15" fill="#22543d">DSU asks whether endpoints already connect.</text>
    <text x="490" y="457" text-anchor="middle" font-size="15" fill="#9b2c2c">AC would close A-B-C-A, so reject it.</text>

    <path d="M670 285 H700" stroke="#52657a" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="710" y="72" width="365" height="430" rx="8" fill="#fff8e8" stroke="#d69e2e" stroke-width="2"/>
    <text x="892" y="106" text-anchor="middle" font-size="19" font-weight="700" fill="#744210">3. Stop after |V| - 1 edges</text>
    <g fill="none" stroke="#d5dde6" stroke-width="3"><path d="M780 210 L870 145 L970 215 L930 350 L790 345 Z"/><path d="M780 210 L970 215 M870 145 L930 350 M970 215 L790 345"/></g>
    <g stroke="#b7791f" stroke-width="8"><path d="M780 210 L870 145"/><path d="M870 145 L970 215"/><path d="M970 215 L930 350"/><path d="M930 350 L790 345"/></g>
    <g text-anchor="middle" dominant-baseline="middle" font-size="18" font-weight="700" fill="#2d3748">
      <g fill="#ffffff" stroke="#b7791f" stroke-width="3"><circle cx="780" cy="210" r="25"/><circle cx="870" cy="145" r="25"/><circle cx="970" cy="215" r="25"/><circle cx="930" cy="350" r="25"/><circle cx="790" cy="345" r="25"/></g>
      <text x="780" y="210">A</text><text x="870" y="145">B</text><text x="970" y="215">C</text><text x="930" y="350">D</text><text x="790" y="345">E</text>
    </g>
    <g font-size="15" font-weight="700" fill="#744210"><text x="825" y="165">1</text><text x="920" y="165">3</text><text x="965" y="290">2</text><text x="860" y="363">5</text></g>
    <text x="892" y="430" text-anchor="middle" font-size="16" fill="#744210">Selected weight = 1 + 2 + 3 + 5 = 11</text>
    <text x="892" y="458" text-anchor="middle" font-size="15" fill="#4a5568">One connected acyclic tree remains.</text>
  </g>
  <text x="550" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#4a5568">The cut property justifies accepting the lightest edge that joins two current components.</text>
</svg>
