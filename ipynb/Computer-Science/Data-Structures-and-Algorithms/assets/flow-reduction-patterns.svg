<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="690" viewBox="0 0 1160 690" role="img" aria-labelledby="title desc">
  <title id="title">Common reductions to network flow</title>
  <desc id="desc">Three modeling gadgets represent vertex capacities, multiple sources and sinks, and mutually exclusive assignment.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker><style>.title{font:700 28px 'Segoe UI',Arial,sans-serif;fill:#172033}.head{font:700 19px 'Segoe UI',Arial,sans-serif;fill:#172033}.body{font:16px 'Segoe UI',Arial,sans-serif;fill:#334155}.small{font:14px 'Segoe UI',Arial,sans-serif;fill:#526174}.card{fill:#fff;stroke:#cbd5e1;stroke-width:2}.edge{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#a)}.node{fill:#fff;stroke:#334155;stroke-width:2.5}</style></defs>
  <rect width="1160" height="690" fill="#f8fafc"/><text x="580" y="46" text-anchor="middle" class="title">A reduction changes the representation, not the feasible choices</text>
  <rect x="35" y="82" width="340" height="500" rx="8" class="card"/><rect x="410" y="82" width="340" height="500" rx="8" class="card"/><rect x="785" y="82" width="340" height="500" rx="8" class="card"/>
  <text x="205" y="120" text-anchor="middle" class="head">Vertex capacity</text><text x="205" y="148" text-anchor="middle" class="small">Split v into v_in -> v_out</text>
  <circle cx="90" cy="300" r="30" class="node"/><circle cx="205" cy="300" r="35" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/><circle cx="320" cy="300" r="30" class="node"/><path d="M120 300L166 300" class="edge"/><path d="M240 300L290 300" class="edge"/><text x="90" y="307" text-anchor="middle" class="head">u</text><text x="205" y="307" text-anchor="middle" class="head">v</text><text x="320" y="307" text-anchor="middle" class="head">w</text><text x="205" y="380" text-anchor="middle" class="body">becomes</text>
  <circle cx="105" cy="460" r="27" class="node"/><circle cx="185" cy="460" r="27" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/><circle cx="280" cy="460" r="27" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/><circle cx="345" cy="460" r="0" fill="none"/><path d="M132 460L155 460" class="edge"/><path d="M212 460L250 460" class="edge"/><text x="105" y="467" text-anchor="middle" class="body">u</text><text x="185" y="467" text-anchor="middle" class="small">v_in</text><text x="280" y="467" text-anchor="middle" class="small">v_out</text><text x="245" y="438" text-anchor="middle" class="small">cap b(v)</text>

  <text x="580" y="120" text-anchor="middle" class="head">Multiple terminals</text><text x="580" y="148" text-anchor="middle" class="small">Attach a super source or super sink</text>
  <circle cx="465" cy="330" r="34" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><circle cx="585" cy="235" r="29" class="node"/><circle cx="585" cy="330" r="29" class="node"/><circle cx="585" cy="425" r="29" class="node"/><circle cx="690" cy="330" r="34" fill="#f3e8ff" stroke="#9333ea" stroke-width="2.5"/><path d="M495 312L556 253" class="edge"/><path d="M499 330L556 330" class="edge"/><path d="M495 348L556 407" class="edge"/><path d="M614 235L668 306" class="edge"/><path d="M614 330L656 330" class="edge"/><path d="M614 425L668 354" class="edge"/><text x="465" y="337" text-anchor="middle" class="head">SS</text><text x="585" y="242" text-anchor="middle" class="body">s1</text><text x="585" y="337" text-anchor="middle" class="body">s2</text><text x="585" y="432" text-anchor="middle" class="body">s3</text><text x="690" y="337" text-anchor="middle" class="head">t</text>

  <text x="955" y="120" text-anchor="middle" class="head">Mutually exclusive assignment</text><text x="955" y="148" text-anchor="middle" class="small">Use unit capacities around candidate edges</text>
  <circle cx="830" cy="330" r="31" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><circle cx="915" cy="245" r="27" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/><circle cx="915" cy="415" r="27" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/><circle cx="1010" cy="245" r="27" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/><circle cx="1010" cy="415" r="27" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/><circle cx="1090" cy="330" r="31" fill="#f3e8ff" stroke="#9333ea" stroke-width="2.5"/><path d="M857 315L889 268" class="edge"/><path d="M857 345L889 392" class="edge"/><path d="M942 245L983 245" class="edge"/><path d="M938 264L988 396" class="edge"/><path d="M938 396L988 264" class="edge"/><path d="M942 415L983 415" class="edge"/><path d="M1037 245L1068 307" class="edge"/><path d="M1037 415L1068 353" class="edge"/><text x="830" y="337" text-anchor="middle" class="head">s</text><text x="1090" y="337" text-anchor="middle" class="head">t</text><text x="955" y="492" text-anchor="middle" class="body">Every shown edge has capacity 1.</text>
  <rect x="205" y="610" width="750" height="52" rx="7" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/><text x="580" y="643" text-anchor="middle" class="head">Proof obligation: map every original solution to a flow and every flow back.</text>
</svg>
