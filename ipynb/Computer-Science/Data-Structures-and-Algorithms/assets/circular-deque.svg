<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc">
  <title id="title">Circular-array deque</title>
  <desc id="desc">Eight array slots wrap around using modulo arithmetic while front and rear operations occur at both ends.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#385170"/></marker></defs>
  <rect width="1000" height="450" fill="#ffffff"/>
  <text x="500" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#172b4d">A deque treats an array as a ring</text>
  <g font-family="Arial, sans-serif">
    <circle cx="500" cy="235" r="148" fill="#f7fafc" stroke="#cbd5e0" stroke-width="2"/>
    <g text-anchor="middle" font-size="18" font-weight="700">
      <g fill="#e9f3ff" stroke="#2f6fa3" stroke-width="2"><rect x="454" y="72" width="92" height="58" rx="7"/><rect x="604" y="125" width="92" height="58" rx="7"/><rect x="650" y="206" width="92" height="58" rx="7"/><rect x="604" y="287" width="92" height="58" rx="7"/></g>
      <g fill="#e8f7ef" stroke="#2f855a" stroke-width="2"><rect x="454" y="340" width="92" height="58" rx="7"/><rect x="304" y="287" width="92" height="58" rx="7"/><rect x="258" y="206" width="92" height="58" rx="7"/><rect x="304" y="125" width="92" height="58" rx="7"/></g>
      <text x="500" y="108">A</text><text x="650" y="161">B</text><text x="696" y="242">C</text><text x="650" y="323">D</text><text x="500" y="376">empty</text><text x="350" y="323">empty</text><text x="304" y="242">F</text><text x="350" y="161">E</text>
    </g>
    <path d="M235 120 C145 155 145 245 225 286" fill="none" stroke="#2f855a" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="120" y="109" font-size="17" font-weight="700" fill="#22543d">append_left</text><text x="120" y="312" font-size="17" font-weight="700" fill="#22543d">pop_left</text>
    <path d="M765 120 C855 155 855 245 775 286" fill="none" stroke="#b7791f" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="780" y="109" font-size="17" font-weight="700" fill="#744210">append_right</text><text x="795" y="312" font-size="17" font-weight="700" fill="#744210">pop_right</text>
    <text x="500" y="223" text-anchor="middle" font-size="19" font-weight="700" fill="#553c9a">next index</text>
    <text x="500" y="251" text-anchor="middle" font-size="18" fill="#553c9a">(i + 1) mod capacity</text>
    <text x="500" y="279" text-anchor="middle" font-size="18" fill="#553c9a">(i - 1) mod capacity</text>
    <text x="500" y="431" text-anchor="middle" font-size="16" fill="#4a5568">Occupied slots may cross index 0 without shifting any element.</text>
  </g>
</svg>
