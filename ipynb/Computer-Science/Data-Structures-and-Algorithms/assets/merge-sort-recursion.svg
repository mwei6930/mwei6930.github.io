<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590" role="img" aria-labelledby="title desc">
  <title id="title">Merge sort split and combine structure</title>
  <desc id="desc">An eight-element array splits into halves until singleton runs, then adjacent sorted runs are merged into larger sorted runs.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#52657a"/></marker></defs>
  <rect width="1100" height="590" fill="#ffffff"/>
  <text x="550" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#172b4d">Merge sort divides by position and combines by ordered merge</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="120" y="102" font-size="18" font-weight="700" fill="#9b2c2c">Unsorted input</text>
    <g transform="translate(315 72)" font-size="18" font-weight="700"><g fill="#fdecec" stroke="#c53030"><rect x="0" y="0" width="58" height="48"/><rect x="60" y="0" width="58" height="48"/><rect x="120" y="0" width="58" height="48"/><rect x="180" y="0" width="58" height="48"/><rect x="240" y="0" width="58" height="48"/><rect x="300" y="0" width="58" height="48"/><rect x="360" y="0" width="58" height="48"/><rect x="420" y="0" width="58" height="48"/></g><g fill="#2d3748"><text x="29" y="31">8</text><text x="89" y="31">3</text><text x="149" y="31">2</text><text x="209" y="31">9</text><text x="269" y="31">7</text><text x="329" y="31">1</text><text x="389" y="31">5</text><text x="449" y="31">4</text></g></g>
    <path d="M550 133 V164" stroke="#52657a" stroke-width="4" marker-end="url(#arrow)"/>

    <text x="105" y="213" font-size="18" font-weight="700" fill="#744210">Split halves</text>
    <g transform="translate(270 178)" font-size="18" font-weight="700"><g fill="#fff3d6" stroke="#b7791f"><rect x="0" y="0" width="58" height="48"/><rect x="60" y="0" width="58" height="48"/><rect x="120" y="0" width="58" height="48"/><rect x="180" y="0" width="58" height="48"/><rect x="300" y="0" width="58" height="48"/><rect x="360" y="0" width="58" height="48"/><rect x="420" y="0" width="58" height="48"/><rect x="480" y="0" width="58" height="48"/></g><g fill="#2d3748"><text x="29" y="31">8</text><text x="89" y="31">3</text><text x="149" y="31">2</text><text x="209" y="31">9</text><text x="329" y="31">7</text><text x="389" y="31">1</text><text x="449" y="31">5</text><text x="509" y="31">4</text></g></g>
    <path d="M550 239 V270" stroke="#52657a" stroke-width="4" marker-end="url(#arrow)"/>

    <text x="112" y="318" font-size="18" font-weight="700" fill="#553c9a">Base cases</text>
    <g transform="translate(230 282)" font-size="18" font-weight="700"><g fill="#f2ecfb" stroke="#805ad5"><rect x="0" y="0" width="58" height="48"/><rect x="80" y="0" width="58" height="48"/><rect x="160" y="0" width="58" height="48"/><rect x="240" y="0" width="58" height="48"/><rect x="400" y="0" width="58" height="48"/><rect x="480" y="0" width="58" height="48"/><rect x="560" y="0" width="58" height="48"/><rect x="640" y="0" width="58" height="48"/></g><g fill="#2d3748"><text x="29" y="31">8</text><text x="109" y="31">3</text><text x="189" y="31">2</text><text x="269" y="31">9</text><text x="429" y="31">7</text><text x="509" y="31">1</text><text x="589" y="31">5</text><text x="669" y="31">4</text></g></g>
    <path d="M550 343 V374" stroke="#2f855a" stroke-width="4" marker-end="url(#arrow)"/>

    <text x="105" y="423" font-size="18" font-weight="700" fill="#22543d">Merge runs</text>
    <g transform="translate(270 388)" font-size="18" font-weight="700"><g fill="#e8f7ef" stroke="#2f855a"><rect x="0" y="0" width="58" height="48"/><rect x="60" y="0" width="58" height="48"/><rect x="120" y="0" width="58" height="48"/><rect x="180" y="0" width="58" height="48"/><rect x="300" y="0" width="58" height="48"/><rect x="360" y="0" width="58" height="48"/><rect x="420" y="0" width="58" height="48"/><rect x="480" y="0" width="58" height="48"/></g><g fill="#22543d"><text x="29" y="31">2</text><text x="89" y="31">3</text><text x="149" y="31">8</text><text x="209" y="31">9</text><text x="329" y="31">1</text><text x="389" y="31">4</text><text x="449" y="31">5</text><text x="509" y="31">7</text></g></g>
    <path d="M550 449 V480" stroke="#2f855a" stroke-width="4" marker-end="url(#arrow)"/>

    <g transform="translate(315 495)" font-size="18" font-weight="700"><g fill="#d5f0e1" stroke="#2f855a" stroke-width="2"><rect x="0" y="0" width="58" height="48"/><rect x="60" y="0" width="58" height="48"/><rect x="120" y="0" width="58" height="48"/><rect x="180" y="0" width="58" height="48"/><rect x="240" y="0" width="58" height="48"/><rect x="300" y="0" width="58" height="48"/><rect x="360" y="0" width="58" height="48"/><rect x="420" y="0" width="58" height="48"/></g><g fill="#22543d"><text x="29" y="31">1</text><text x="89" y="31">2</text><text x="149" y="31">3</text><text x="209" y="31">4</text><text x="269" y="31">5</text><text x="329" y="31">7</text><text x="389" y="31">8</text><text x="449" y="31">9</text></g></g>
    <text x="940" y="524" font-size="18" font-weight="700" fill="#22543d">Sorted</text>
  </g>
  <text x="550" y="578" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4a5568">Every merge level processes all n elements; there are log2(n) split levels.</text>
</svg>
