<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
  <title id="title">Min heap tree and array representation</title>
  <desc id="desc">A complete min heap maps level order into an array with parent and child index formulas.</desc>
  <rect width="1000" height="500" fill="#ffffff"/>
  <text x="500" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#172b4d">A binary heap is an implicit complete tree</text>
  <g font-family="Arial, sans-serif">
    <g stroke="#718096" stroke-width="3"><path d="M325 105 L205 195 M325 105 L445 195 M205 235 L145 325 M205 235 L265 325 M445 235 L385 325 M445 235 L505 325"/></g>
    <g text-anchor="middle" font-size="20" font-weight="700"><circle cx="325" cy="85" r="36" fill="#f2ecfb" stroke="#805ad5" stroke-width="3"/><text x="325" y="92">2</text><g fill="#e9f3ff" stroke="#2f6fa3" stroke-width="2"><circle cx="205" cy="215" r="34"/><circle cx="445" cy="215" r="34"/></g><text x="205" y="222">5</text><text x="445" y="222">4</text><g fill="#e8f7ef" stroke="#2f855a" stroke-width="2"><circle cx="145" cy="345" r="30"/><circle cx="265" cy="345" r="30"/><circle cx="385" cy="345" r="30"/><circle cx="505" cy="345" r="30"/></g><text x="145" y="352">9</text><text x="265" y="352">7</text><text x="385" y="352">8</text><text x="505" y="352">6</text></g>
    <text x="325" y="408" text-anchor="middle" font-size="17" fill="#22543d">parent &lt;= each child</text>
    <rect x="600" y="75" width="350" height="335" rx="8" fill="#f7fafc" stroke="#a0aec0"/>
    <text x="775" y="112" text-anchor="middle" font-size="20" font-weight="700" fill="#2d3748">Level-order array</text>
    <g fill="#ffffff" stroke="#2f6fa3"><rect x="625" y="145" width="42" height="52"/><rect x="671" y="145" width="42" height="52"/><rect x="717" y="145" width="42" height="52"/><rect x="763" y="145" width="42" height="52"/><rect x="809" y="145" width="42" height="52"/><rect x="855" y="145" width="42" height="52"/><rect x="901" y="145" width="42" height="52"/></g>
    <g text-anchor="middle" font-size="19" font-weight="700"><text x="646" y="178">2</text><text x="692" y="178">5</text><text x="738" y="178">4</text><text x="784" y="178">9</text><text x="830" y="178">7</text><text x="876" y="178">8</text><text x="922" y="178">6</text></g>
    <g text-anchor="middle" font-size="13" fill="#718096"><text x="646" y="218">0</text><text x="692" y="218">1</text><text x="738" y="218">2</text><text x="784" y="218">3</text><text x="830" y="218">4</text><text x="876" y="218">5</text><text x="922" y="218">6</text></g>
    <rect x="630" y="255" width="290" height="120" rx="7" fill="#e9f3ff" stroke="#2f6fa3"/>
    <g font-size="18" fill="#174a73"><text x="655" y="290">parent(i) = floor((i - 1) / 2)</text><text x="655" y="326">left(i) = 2i + 1</text><text x="655" y="362">right(i) = 2i + 2</text></g>
    <text x="500" y="465" text-anchor="middle" font-size="16" fill="#4a5568">Completeness removes the need for explicit child pointers.</text>
  </g>
</svg>
