<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">Disjoint set union with path compression</title>
  <desc id="desc">Before find, several nodes form a path to a representative root. After find with path compression, every visited node points directly to the root.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#52657a"/></marker><marker id="greenarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2f855a"/></marker></defs>
  <rect width="1100" height="520" fill="#ffffff"/>
  <text x="550" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#172b4d">Find returns a representative and shortens the path</text>
  <g font-family="Arial, sans-serif">
    <rect x="28" y="72" width="460" height="380" rx="8" fill="#f7fafc" stroke="#9aa9ba" stroke-width="2"/>
    <text x="258" y="108" text-anchor="middle" font-size="21" font-weight="700" fill="#2d3748">Before find(6)</text>
    <g fill="none" stroke="#52657a" stroke-width="4" marker-end="url(#arrow)"><path d="M105 340 L175 285"/><path d="M185 270 L250 215"/><path d="M260 200 L330 150"/><path d="M355 158 L400 235"/><path d="M400 270 L330 340"/></g>
    <g text-anchor="middle" dominant-baseline="middle" font-size="18" font-weight="700">
      <circle cx="95" cy="350" r="27" fill="#fdecec" stroke="#c53030" stroke-width="3"/><text x="95" y="350">6</text>
      <circle cx="185" cy="275" r="27" fill="#fff3d6" stroke="#b7791f" stroke-width="3"/><text x="185" y="275">5</text>
      <circle cx="260" cy="205" r="27" fill="#fff3d6" stroke="#b7791f" stroke-width="3"/><text x="260" y="205">4</text>
      <circle cx="345" cy="145" r="30" fill="#e8f7ef" stroke="#2f855a" stroke-width="4"/><text x="345" y="145">1</text>
      <circle cx="410" cy="255" r="27" fill="#e6f1fb" stroke="#2f6fa3" stroke-width="3"/><text x="410" y="255">2</text>
      <circle cx="315" cy="355" r="27" fill="#e6f1fb" stroke="#2f6fa3" stroke-width="3"/><text x="315" y="355">3</text>
    </g>
    <text x="258" y="416" text-anchor="middle" font-size="16" fill="#4a5568">6 → 5 → 4 → 1; representative = 1</text>

    <path d="M505 260 H585" stroke="#2f855a" stroke-width="5" marker-end="url(#greenarrow)"/>
    <text x="545" y="240" text-anchor="middle" font-size="16" font-weight="700" fill="#22543d">compress</text>

    <rect x="612" y="72" width="460" height="380" rx="8" fill="#edf7f2" stroke="#4d9b71" stroke-width="2"/>
    <text x="842" y="108" text-anchor="middle" font-size="21" font-weight="700" fill="#22543d">After find(6)</text>
    <g fill="none" stroke="#2f855a" stroke-width="4" marker-end="url(#greenarrow)"><path d="M680 330 L820 165"/><path d="M745 260 L820 165"/><path d="M830 200 L830 175"/><path d="M940 260 L850 165"/><path d="M985 350 L850 165"/></g>
    <g text-anchor="middle" dominant-baseline="middle" font-size="18" font-weight="700">
      <circle cx="835" cy="145" r="31" fill="#e8f7ef" stroke="#2f855a" stroke-width="4"/><text x="835" y="145">1</text>
      <circle cx="670" cy="345" r="27" fill="#fdecec" stroke="#c53030" stroke-width="3"/><text x="670" y="345">6</text>
      <circle cx="735" cy="275" r="27" fill="#fff3d6" stroke="#b7791f" stroke-width="3"/><text x="735" y="275">5</text>
      <circle cx="830" cy="220" r="27" fill="#fff3d6" stroke="#b7791f" stroke-width="3"/><text x="830" y="220">4</text>
      <circle cx="950" cy="275" r="27" fill="#e6f1fb" stroke="#2f6fa3" stroke-width="3"/><text x="950" y="275">2</text>
      <circle cx="995" cy="365" r="27" fill="#e6f1fb" stroke="#2f6fa3" stroke-width="3"/><text x="995" y="365">3</text>
    </g>
    <text x="842" y="416" text-anchor="middle" font-size="16" fill="#22543d">Later finds reach root 1 in one hop.</text>
  </g>
  <text x="550" y="493" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#4a5568">Union by size prevents tall trees; path compression flattens paths discovered by find.</text>
</svg>
