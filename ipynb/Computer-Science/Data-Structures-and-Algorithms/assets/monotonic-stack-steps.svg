<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">Monotonic stack next-greater-element steps</title>
  <desc id="desc">Scanning two, one, five, and three maintains decreasing unresolved indices; five pops and resolves both earlier values.</desc>
  <rect width="1000" height="520" fill="#ffffff"/>
  <text x="500" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#172b4d">A decreasing stack stores unresolved candidates</text>
  <g font-family="Arial, sans-serif">
    <rect x="46" y="78" width="908" height="52" fill="#e9f3ff" stroke="#2f6fa3"/>
    <g text-anchor="middle" font-size="17" font-weight="700" fill="#174a73"><text x="115" y="111">current</text><text x="330" y="111">stack before</text><text x="590" y="111">action</text><text x="855" y="111">stack after</text></g>
    <g stroke="#cbd5e0"><rect x="46" y="130" width="908" height="78" fill="#ffffff"/><rect x="46" y="208" width="908" height="78" fill="#f7fafc"/><rect x="46" y="286" width="908" height="108" fill="#fff3d6"/><rect x="46" y="394" width="908" height="78" fill="#e8f7ef"/></g>
    <g text-anchor="middle" font-size="18" fill="#2d3748">
      <text x="115" y="176">2</text><text x="330" y="176">[]</text><text x="590" y="176">push index 0</text><text x="855" y="176">[2]</text>
      <text x="115" y="254">1</text><text x="330" y="254">[2]</text><text x="590" y="254">1 is smaller, push</text><text x="855" y="254">[2, 1]</text>
      <text x="115" y="327">5</text><text x="330" y="327">[2, 1]</text><text x="590" y="319">pop 1: next greater is 5</text><text x="590" y="349">pop 2: next greater is 5</text><text x="855" y="327">[5]</text>
      <text x="115" y="440">3</text><text x="330" y="440">[5]</text><text x="590" y="440">3 is smaller, push</text><text x="855" y="440">[5, 3]</text>
    </g>
    <line x1="190" y1="78" x2="190" y2="472" stroke="#cbd5e0"/><line x1="465" y1="78" x2="465" y2="472" stroke="#cbd5e0"/><line x1="735" y1="78" x2="735" y2="472" stroke="#cbd5e0"/>
    <rect x="178" y="481" width="644" height="30" rx="6" fill="#f2ecfb" stroke="#805ad5"/>
    <text x="500" y="502" text-anchor="middle" font-size="16" fill="#553c9a">Each index is pushed once and popped at most once: at most 2n stack operations.</text>
  </g>
</svg>
