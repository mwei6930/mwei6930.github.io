<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
  <title id="title">Kadane algorithm step table</title>
  <desc id="desc">A table tracks each array value, the best sum ending at that value, and the global best sum, highlighting when a new subarray starts.</desc>
  <rect width="1000" height="470" fill="#ffffff"/>
  <text x="500" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#172b4d">Kadane keeps only the useful prefix</text>
  <g font-family="Arial, sans-serif">
    <rect x="60" y="78" width="880" height="54" fill="#e9f3ff" stroke="#2f6fa3"/>
    <text x="170" y="112" text-anchor="middle" font-size="18" font-weight="700" fill="#174a73">value x</text>
    <text x="490" y="112" text-anchor="middle" font-size="18" font-weight="700" fill="#174a73">current = max(x, current + x)</text>
    <text x="820" y="112" text-anchor="middle" font-size="18" font-weight="700" fill="#174a73">best</text>
    <g stroke="#cbd5e0"><rect x="60" y="132" width="880" height="54" fill="#ffffff"/><rect x="60" y="186" width="880" height="54" fill="#f7fafc"/><rect x="60" y="240" width="880" height="54" fill="#fff3d6"/><rect x="60" y="294" width="880" height="54" fill="#f7fafc"/><rect x="60" y="348" width="880" height="54" fill="#e8f7ef"/></g>
    <g text-anchor="middle" font-size="18" fill="#2d3748">
      <text x="170" y="166">-2</text><text x="490" y="166">max(-2, 0 - 2) = -2</text><text x="820" y="166">-2</text>
      <text x="170" y="220">1</text><text x="490" y="220">max(1, -2 + 1) = 1</text><text x="820" y="220">1</text>
      <text x="170" y="274">-3</text><text x="490" y="274">max(-3, 1 - 3) = -2</text><text x="820" y="274">1</text>
      <text x="170" y="328">4</text><text x="490" y="328">max(4, -2 + 4) = 4</text><text x="820" y="328">4</text>
      <text x="170" y="382">-1, 2, 1</text><text x="490" y="382">extend: 4 -> 3 -> 5 -> 6</text><text x="820" y="382" font-weight="700" fill="#22543d">6</text>
    </g>
    <line x1="280" y1="78" x2="280" y2="402" stroke="#cbd5e0"/><line x1="700" y1="78" x2="700" y2="402" stroke="#cbd5e0"/>
    <rect x="238" y="418" width="524" height="34" rx="6" fill="#f2ecfb" stroke="#805ad5"/>
    <text x="500" y="441" text-anchor="middle" font-size="16" fill="#553c9a">A negative carried sum is discarded because it can only hurt the future.</text>
  </g>
</svg>
