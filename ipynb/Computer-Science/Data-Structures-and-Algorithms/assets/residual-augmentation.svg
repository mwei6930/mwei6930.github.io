<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
  <title id="title">Residual graph and augmentation</title>
  <desc id="desc">A partial augmenting path consumes forward capacity and creates reverse residual capacity that can later undo the decision.</desc>
  <defs>
    <marker id="darkArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker>
    <marker id="blueArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <marker id="redArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#dc2626"/></marker>
    <style>.title{font:700 28px 'Segoe UI',Arial,sans-serif;fill:#172033}.head{font:700 20px 'Segoe UI',Arial,sans-serif;fill:#172033}.body{font:16px 'Segoe UI',Arial,sans-serif;fill:#334155}.small{font:14px 'Segoe UI',Arial,sans-serif;fill:#526174}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2}.node{fill:#fff;stroke:#334155;stroke-width:2.5}.edge{fill:none;stroke:#334155;stroke-width:3;marker-end:url(#darkArrow)}.path{fill:none;stroke:#2563eb;stroke-width:5;marker-end:url(#blueArrow)}.reverse{fill:none;stroke:#dc2626;stroke-width:3;stroke-dasharray:8 6;marker-end:url(#redArrow)}</style>
  </defs>
  <rect width="1100" height="650" fill="#f8fafc"/><text x="550" y="45" text-anchor="middle" class="title">Augmentation changes both forward and reverse residual capacity</text>
  <rect x="35" y="78" width="500" height="520" rx="8" class="box"/><rect x="565" y="78" width="500" height="520" rx="8" class="box"/>
  <text x="285" y="118" text-anchor="middle" class="head">1. Send one unit on s -> a -> b -> t</text>
  <path d="M113 285L235 187" class="path"/><path d="M277 200L277 397" class="path"/><path d="M318 413L437 313" class="path"/>
  <path d="M113 315L235 413" class="edge"/><path d="M318 187L437 287" class="edge"/>
  <circle cx="85" cy="300" r="34" class="node"/><circle cx="277" cy="160" r="34" class="node"/><circle cx="277" cy="440" r="34" class="node"/><circle cx="465" cy="300" r="34" class="node"/>
  <text x="85" y="307" text-anchor="middle" class="head">s</text><text x="277" y="167" text-anchor="middle" class="head">a</text><text x="277" y="447" text-anchor="middle" class="head">b</text><text x="465" y="307" text-anchor="middle" class="head">t</text>
  <text x="159" y="207" class="body">1 of 4</text><text x="290" y="306" class="body">1 of 1</text><text x="374" y="394" class="body">1 of 3</text>
  <rect x="75" y="505" width="420" height="62" rx="7" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="285" y="531" text-anchor="middle" class="body">Bottleneck = min(4, 1, 3) = 1</text><text x="285" y="555" text-anchor="middle" class="small">Increase every edge on the path by the bottleneck.</text>

  <text x="815" y="118" text-anchor="middle" class="head">2. The residual graph records what remains</text>
  <path d="M643 285L765 187" class="path"/><path d="M805 413L927 313" class="path"/><path d="M643 315L765 413" class="edge"/><path d="M848 187L967 287" class="edge"/>
  <path d="M792 397L792 202" class="reverse"/>
  <circle cx="615" cy="300" r="34" class="node"/><circle cx="807" cy="160" r="34" class="node"/><circle cx="807" cy="440" r="34" class="node"/><circle cx="995" cy="300" r="34" class="node"/>
  <text x="615" y="307" text-anchor="middle" class="head">s</text><text x="807" y="167" text-anchor="middle" class="head">a</text><text x="807" y="447" text-anchor="middle" class="head">b</text><text x="995" y="307" text-anchor="middle" class="head">t</text>
  <text x="689" y="207" class="body">forward 3</text><text x="820" y="304" class="body">forward 0</text><text x="833" y="328" class="body" fill="#dc2626">reverse 1</text><text x="900" y="394" class="body">forward 2</text>
  <rect x="605" y="505" width="420" height="62" rx="7" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/><text x="815" y="531" text-anchor="middle" class="body">Reverse b -> a capacity 1 can cancel the earlier unit.</text><text x="815" y="555" text-anchor="middle" class="small">Residual reachability, not the original graph, controls the next move.</text>
</svg>
