<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
  <title id="title">Abstract data type, interface, and implementation layers</title>
  <desc id="desc">A stack abstract data type exposes push, pop, peek, and is empty operations while hiding array or linked-list implementations.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#385170"/>
    </marker>
  </defs>
  <rect width="1000" height="420" fill="#ffffff"/>
  <text x="500" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#172b4d">One contract, multiple implementations</text>
  <g font-family="Arial, sans-serif">
    <rect x="260" y="70" width="480" height="82" rx="8" fill="#e9f3ff" stroke="#2f6fa3" stroke-width="2"/>
    <text x="500" y="103" text-anchor="middle" font-size="20" font-weight="700" fill="#174a73">Stack ADT: last in, first out</text>
    <text x="500" y="132" text-anchor="middle" font-size="17" fill="#243b53">Behavioral promise independent of storage</text>

    <rect x="180" y="188" width="640" height="72" rx="8" fill="#fff3d6" stroke="#b7791f" stroke-width="2"/>
    <text x="500" y="218" text-anchor="middle" font-size="19" font-weight="700" fill="#744210">Interface</text>
    <text x="500" y="246" text-anchor="middle" font-size="17" fill="#4a3a1f">push(x)    pop()    peek()    is_empty()</text>

    <rect x="92" y="316" width="344" height="70" rx="8" fill="#e8f7ef" stroke="#2f855a" stroke-width="2"/>
    <text x="264" y="346" text-anchor="middle" font-size="19" font-weight="700" fill="#22543d">Dynamic-array stack</text>
    <text x="264" y="373" text-anchor="middle" font-size="16" fill="#234e3b">compact memory, occasional resize</text>

    <rect x="564" y="316" width="344" height="70" rx="8" fill="#f2ecfb" stroke="#805ad5" stroke-width="2"/>
    <text x="736" y="346" text-anchor="middle" font-size="19" font-weight="700" fill="#553c9a">Linked-list stack</text>
    <text x="736" y="373" text-anchor="middle" font-size="16" fill="#44337a">node per item, no contiguous resize</text>

    <path d="M500 152 V180" stroke="#385170" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M500 260 V286 H264 V308" fill="none" stroke="#385170" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M500 286 H736 V308" fill="none" stroke="#385170" stroke-width="3" marker-end="url(#arrow)"/>
  </g>
</svg>
