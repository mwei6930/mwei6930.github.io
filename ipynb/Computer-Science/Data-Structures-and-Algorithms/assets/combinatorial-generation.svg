<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Backtracking templates for subsets combinations and permutations</title>
  <desc id="desc">Three search patterns differ in branching decisions, state, and duplicate avoidance.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
  </defs>
  <rect width="1200" height="600" fill="#f8fafc"/>
  <text x="600" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#0f172a">The result type determines the canonical search state</text>

  <g font-family="Arial, sans-serif">
    <rect x="30" y="78" width="350" height="470" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="205" y="116" text-anchor="middle" font-size="22" font-weight="700" fill="#1d4ed8">Subsets</text>
    <text x="205" y="145" text-anchor="middle" font-size="15" fill="#475569">For each position: exclude or include.</text>
    <circle cx="205" cy="205" r="25" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <circle cx="135" cy="285" r="23" fill="#dbeafe" stroke="#2563eb"/><circle cx="275" cy="285" r="23" fill="#dbeafe" stroke="#2563eb"/>
    <circle cx="95" cy="375" r="19" fill="#eff6ff" stroke="#2563eb"/><circle cx="165" cy="375" r="19" fill="#eff6ff" stroke="#2563eb"/><circle cx="245" cy="375" r="19" fill="#eff6ff" stroke="#2563eb"/><circle cx="315" cy="375" r="19" fill="#eff6ff" stroke="#2563eb"/>
    <path d="M188 225 L149 264 M222 225 L261 264 M124 306 L103 355 M146 306 L158 355 M264 306 L252 355 M286 306 L307 355" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="138" y="245" text-anchor="middle" font-size="14" fill="#475569">skip</text><text x="272" y="245" text-anchor="middle" font-size="14" fill="#475569">take</text>
    <rect x="75" y="435" width="260" height="70" rx="6" fill="#eff6ff" stroke="#2563eb"/>
    <text x="205" y="463" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">state: index + current subset</text>
    <text x="205" y="488" text-anchor="middle" font-size="14" fill="#475569">exactly 2^n leaves</text>

    <rect x="425" y="78" width="350" height="470" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
    <text x="600" y="116" text-anchor="middle" font-size="22" font-weight="700" fill="#0f766e">Combinations</text>
    <text x="600" y="145" text-anchor="middle" font-size="15" fill="#475569">Choose increasing indices; order is irrelevant.</text>
    <rect x="480" y="185" width="240" height="55" rx="6" fill="#ccfbf1" stroke="#0f766e"/>
    <text x="600" y="219" text-anchor="middle" font-size="17" fill="#134e4a">start = 0, path = []</text>
    <rect x="455" y="285" width="115" height="52" rx="6" fill="#ecfdf5" stroke="#0f766e"/>
    <rect x="575" y="285" width="115" height="52" rx="6" fill="#ecfdf5" stroke="#0f766e"/>
    <rect x="635" y="365" width="115" height="52" rx="6" fill="#ecfdf5" stroke="#0f766e"/>
    <text x="512" y="317" text-anchor="middle" font-size="15" fill="#134e4a">choose 0</text><text x="632" y="317" text-anchor="middle" font-size="15" fill="#134e4a">choose 1</text><text x="692" y="397" text-anchor="middle" font-size="15" fill="#134e4a">choose 3</text>
    <path d="M565 240 L525 277 M635 240 L628 277 M651 338 L680 357" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="470" y="435" width="260" height="70" rx="6" fill="#ecfdf5" stroke="#0f766e"/>
    <text x="600" y="463" text-anchor="middle" font-size="15" font-weight="700" fill="#134e4a">state: start index + path</text>
    <text x="600" y="488" text-anchor="middle" font-size="14" fill="#475569">never generate a reordered duplicate</text>

    <rect x="820" y="78" width="350" height="470" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
    <text x="995" y="116" text-anchor="middle" font-size="22" font-weight="700" fill="#6d28d9">Permutations</text>
    <text x="995" y="145" text-anchor="middle" font-size="15" fill="#475569">Choose any unused item; order matters.</text>
    <rect x="875" y="185" width="240" height="55" rx="6" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="995" y="219" text-anchor="middle" font-size="17" fill="#5b21b6">used = {}, path = []</text>
    <rect x="845" y="285" width="100" height="52" rx="6" fill="#f5f3ff" stroke="#7c3aed"/>
    <rect x="950" y="285" width="100" height="52" rx="6" fill="#f5f3ff" stroke="#7c3aed"/>
    <rect x="1055" y="285" width="100" height="52" rx="6" fill="#f5f3ff" stroke="#7c3aed"/>
    <text x="895" y="317" text-anchor="middle" font-size="15" fill="#5b21b6">choose A</text><text x="1000" y="317" text-anchor="middle" font-size="15" fill="#5b21b6">choose B</text><text x="1105" y="317" text-anchor="middle" font-size="15" fill="#5b21b6">choose C</text>
    <path d="M950 240 L905 277 M995 240 L1000 277 M1040 240 L1095 277" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="865" y="365" width="120" height="52" rx="6" fill="#f5f3ff" stroke="#7c3aed"/>
    <rect x="1005" y="365" width="120" height="52" rx="6" fill="#f5f3ff" stroke="#7c3aed"/>
    <text x="925" y="397" text-anchor="middle" font-size="15" fill="#5b21b6">then B or C</text><text x="1065" y="397" text-anchor="middle" font-size="15" fill="#5b21b6">then A or C</text>
    <rect x="865" y="435" width="260" height="70" rx="6" fill="#f5f3ff" stroke="#7c3aed"/>
    <text x="995" y="463" text-anchor="middle" font-size="15" font-weight="700" fill="#5b21b6">state: used set + ordered path</text>
    <text x="995" y="488" text-anchor="middle" font-size="14" fill="#475569">n! leaves for distinct items</text>
  </g>
</svg>
