<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">Expansion of the merge sort recurrence</title>
  <desc id="desc">The recurrence T of n equals two T of n over two plus n expands into a recursion tree whose total nonrecursive work is n at each of log n levels.</desc>
  <rect width="1100" height="560" fill="#ffffff"/>
  <text x="550" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#172b4d">Expansion reveals where recurrence work accumulates</text>
  <g font-family="Arial, sans-serif">
    <rect x="55" y="82" width="370" height="390" rx="8" fill="#f7fafc" stroke="#9aa9ba" stroke-width="2"/>
    <text x="240" y="118" text-anchor="middle" font-size="21" font-weight="700" fill="#2d3748">Repeated substitution</text>
    <g font-size="18" fill="#2d3748"><text x="88" y="170">T(n) = 2T(n/2) + n</text><text x="88" y="225">= 2[2T(n/4) + n/2] + n</text><text x="88" y="280">= 4T(n/4) + 2n</text><text x="88" y="335">= 8T(n/8) + 3n</text><text x="88" y="390">...</text><text x="88" y="440" font-weight="700" fill="#553c9a">= nT(1) + n log2(n)</text></g>

    <rect x="462" y="82" width="583" height="390" rx="8" fill="#f7fafc" stroke="#9aa9ba" stroke-width="2"/>
    <text x="753" y="118" text-anchor="middle" font-size="21" font-weight="700" fill="#2d3748">Work by recursion level</text>
    <g fill="none" stroke="#52657a" stroke-width="3"><path d="M753 168 L635 235 M753 168 L870 235 M635 235 L565 310 M635 235 L700 310 M870 235 L805 310 M870 235 L940 310"/></g>
    <g text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="700"><circle cx="753" cy="155" r="34" fill="#e6f1fb" stroke="#2f6fa3" stroke-width="3"/><text x="753" y="155">n</text><g fill="#fff3d6" stroke="#b7791f" stroke-width="2"><circle cx="635" cy="235" r="31"/><circle cx="870" cy="235" r="31"/></g><text x="635" y="235">n/2</text><text x="870" y="235">n/2</text><g fill="#f2ecfb" stroke="#805ad5"><circle cx="565" cy="310" r="28"/><circle cx="700" cy="310" r="28"/><circle cx="805" cy="310" r="28"/><circle cx="940" cy="310" r="28"/></g><text x="565" y="310">n/4</text><text x="700" y="310">n/4</text><text x="805" y="310">n/4</text><text x="940" y="310">n/4</text></g>
    <g font-size="17" font-weight="700"><text x="500" y="160" fill="#174a73">level 0:</text><text x="982" y="160" text-anchor="end" fill="#174a73">total n</text><text x="500" y="240" fill="#744210">level 1:</text><text x="982" y="240" text-anchor="end" fill="#744210">total n</text><text x="500" y="315" fill="#553c9a">level 2:</text><text x="982" y="315" text-anchor="end" fill="#553c9a">total n</text></g>
    <path d="M753 350 V390" stroke="#52657a" stroke-width="3" stroke-dasharray="7 6"/>
    <text x="753" y="415" text-anchor="middle" font-size="18" font-weight="700" fill="#22543d">log2(n) levels x n work per level</text>
    <text x="753" y="450" text-anchor="middle" font-size="20" font-weight="700" fill="#22543d">T(n) = Theta(n log n)</text>
  </g>
  <rect x="210" y="498" width="680" height="42" rx="7" fill="#edf7f2" stroke="#2f855a"/>
  <text x="550" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#22543d">Expansion must stop at the base case; an ellipsis without a stopping depth is not an analysis.</text>
</svg>
