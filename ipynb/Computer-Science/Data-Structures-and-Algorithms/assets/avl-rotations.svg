<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610" role="img" aria-labelledby="title desc">
  <title id="title">Four AVL rotation cases</title>
  <desc id="desc">LL and RR imbalances use one rotation; LR and RL imbalances use two rotations and all produce a balanced subtree rooted at y.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#385170"/></marker></defs>
  <rect width="1000" height="610" fill="#ffffff"/>
  <text x="500" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#172b4d">AVL rotations restore local height balance</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(35 75)"><rect width="450" height="230" rx="8" fill="#e9f3ff" stroke="#2f6fa3"/><text x="225" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#174a73">LL: rotate right at z</text><g stroke="#718096" stroke-width="2"><path d="M90 80 L60 130 M60 160 L35 205"/><path d="M360 100 L315 165 M360 100 L405 165"/></g><g fill="#ffffff" stroke="#2f6fa3"><circle cx="90" cy="67" r="22"/><circle cx="60" cy="145" r="22"/><circle cx="35" cy="215" r="18"/><circle cx="360" cy="87" r="22"/><circle cx="315" cy="180" r="18"/><circle cx="405" cy="180" r="18"/></g><g text-anchor="middle" font-weight="700"><text x="90" y="73">z</text><text x="60" y="151">y</text><text x="35" y="221">x</text><text x="360" y="93">y</text><text x="315" y="186">x</text><text x="405" y="186">z</text></g><path d="M155 125 H250" stroke="#2f6fa3" stroke-width="4" marker-end="url(#arrow)"/></g>
    <g transform="translate(515 75)"><rect width="450" height="230" rx="8" fill="#e8f7ef" stroke="#2f855a"/><text x="225" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#22543d">RR: rotate left at z</text><g stroke="#718096" stroke-width="2"><path d="M70 80 L100 130 M100 160 L125 205"/><path d="M360 100 L315 165 M360 100 L405 165"/></g><g fill="#ffffff" stroke="#2f855a"><circle cx="70" cy="67" r="22"/><circle cx="100" cy="145" r="22"/><circle cx="125" cy="215" r="18"/><circle cx="360" cy="87" r="22"/><circle cx="315" cy="180" r="18"/><circle cx="405" cy="180" r="18"/></g><g text-anchor="middle" font-weight="700"><text x="70" y="73">z</text><text x="100" y="151">y</text><text x="125" y="221">x</text><text x="360" y="93">y</text><text x="315" y="186">z</text><text x="405" y="186">x</text></g><path d="M155 125 H250" stroke="#2f855a" stroke-width="4" marker-end="url(#arrow)"/></g>
    <g transform="translate(35 330)"><rect width="450" height="230" rx="8" fill="#fff3d6" stroke="#b7791f"/><text x="225" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#744210">LR: left at y, then right at z</text><g stroke="#718096" stroke-width="2"><path d="M90 80 L55 135 M55 165 L90 210"/><path d="M360 100 L315 165 M360 100 L405 165"/></g><g fill="#ffffff" stroke="#b7791f"><circle cx="90" cy="67" r="22"/><circle cx="55" cy="150" r="22"/><circle cx="90" cy="215" r="18"/><circle cx="360" cy="87" r="22"/><circle cx="315" cy="180" r="18"/><circle cx="405" cy="180" r="18"/></g><g text-anchor="middle" font-weight="700"><text x="90" y="73">z</text><text x="55" y="156">y</text><text x="90" y="221">x</text><text x="360" y="93">x</text><text x="315" y="186">y</text><text x="405" y="186">z</text></g><path d="M155 125 H250" stroke="#b7791f" stroke-width="4" marker-end="url(#arrow)"/></g>
    <g transform="translate(515 330)"><rect width="450" height="230" rx="8" fill="#f2ecfb" stroke="#805ad5"/><text x="225" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#553c9a">RL: right at y, then left at z</text><g stroke="#718096" stroke-width="2"><path d="M70 80 L105 135 M105 165 L70 210"/><path d="M360 100 L315 165 M360 100 L405 165"/></g><g fill="#ffffff" stroke="#805ad5"><circle cx="70" cy="67" r="22"/><circle cx="105" cy="150" r="22"/><circle cx="70" cy="215" r="18"/><circle cx="360" cy="87" r="22"/><circle cx="315" cy="180" r="18"/><circle cx="405" cy="180" r="18"/></g><g text-anchor="middle" font-weight="700"><text x="70" y="73">z</text><text x="105" y="156">y</text><text x="70" y="221">x</text><text x="360" y="93">x</text><text x="315" y="186">z</text><text x="405" y="186">y</text></g><path d="M155 125 H250" stroke="#805ad5" stroke-width="4" marker-end="url(#arrow)"/></g>
  </g>
</svg>
