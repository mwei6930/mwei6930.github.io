<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
  <title id="title">Min-heap extract and sift down</title>
  <desc id="desc">After removing the minimum, the final item moves to the root and swaps with its smaller child until heap order is restored.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#385170"/></marker></defs>
  <rect width="1000" height="500" fill="#ffffff"/>
  <text x="500" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#172b4d">Extract-min restores order by sifting down</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(35 78)"><rect width="275" height="350" rx="8" fill="#fff5f5" stroke="#c53030"/><text x="137" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#9b2c2c">1. Move last to root</text><g stroke="#b77979" stroke-width="2"><path d="M137 90 L70 170 M137 90 L205 170 M70 200 L35 275 M70 200 L105 275"/></g><g text-anchor="middle" font-size="19" font-weight="700"><circle cx="137" cy="75" r="28" fill="#ffffff" stroke="#c53030" stroke-width="3"/><text x="137" y="82">9</text><g fill="#ffffff" stroke="#c53030"><circle cx="70" cy="185" r="25"/><circle cx="205" cy="185" r="25"/><circle cx="35" cy="290" r="23"/><circle cx="105" cy="290" r="23"/></g><text x="70" y="192">4</text><text x="205" y="192">5</text><text x="35" y="297">7</text><text x="105" y="297">8</text></g><text x="137" y="330" text-anchor="middle" font-size="15" fill="#9b2c2c">9 violates parent &lt;= child</text></g>
    <path d="M320 252 H355" stroke="#385170" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(365 78)"><rect width="275" height="350" rx="8" fill="#fff3d6" stroke="#b7791f"/><text x="137" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#744210">2. Swap smaller child</text><g stroke="#d9aa55" stroke-width="2"><path d="M137 90 L70 170 M137 90 L205 170 M70 200 L35 275 M70 200 L105 275"/></g><g text-anchor="middle" font-size="19" font-weight="700"><circle cx="137" cy="75" r="28" fill="#ffffff" stroke="#b7791f"/><text x="137" y="82">4</text><g fill="#ffffff" stroke="#b7791f"><circle cx="70" cy="185" r="25" stroke-width="3"/><circle cx="205" cy="185" r="25"/><circle cx="35" cy="290" r="23"/><circle cx="105" cy="290" r="23"/></g><text x="70" y="192">9</text><text x="205" y="192">5</text><text x="35" y="297">7</text><text x="105" y="297">8</text></g><path d="M122 102 L85 152" stroke="#c53030" stroke-width="4" marker-end="url(#arrow)"/><text x="137" y="330" text-anchor="middle" font-size="15" fill="#744210">compare children 4 and 5</text></g>
    <path d="M650 252 H685" stroke="#385170" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(695 78)"><rect width="270" height="350" rx="8" fill="#e8f7ef" stroke="#2f855a"/><text x="135" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#22543d">3. Continue to a leaf</text><g stroke="#68a983" stroke-width="2"><path d="M135 90 L68 170 M135 90 L202 170 M68 200 L33 275 M68 200 L103 275"/></g><g text-anchor="middle" font-size="19" font-weight="700"><circle cx="135" cy="75" r="28" fill="#ffffff" stroke="#2f855a"/><text x="135" y="82">4</text><g fill="#ffffff" stroke="#2f855a"><circle cx="68" cy="185" r="25"/><circle cx="202" cy="185" r="25"/><circle cx="33" cy="290" r="23"/><circle cx="103" cy="290" r="23"/></g><text x="68" y="192">7</text><text x="202" y="192">5</text><text x="33" y="297">9</text><text x="103" y="297">8</text></g><text x="135" y="330" text-anchor="middle" font-size="15" fill="#22543d">heap property restored</text></g>
    <text x="500" y="472" text-anchor="middle" font-size="16" fill="#4a5568">Each swap moves one level, so sift-down takes O(height) = O(log n).</text>
  </g>
</svg>
