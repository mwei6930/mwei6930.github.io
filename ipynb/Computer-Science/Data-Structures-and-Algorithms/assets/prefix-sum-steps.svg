<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc">
  <title id="title">Building and querying a prefix sum array</title>
  <desc id="desc">The prefix array adds one element at a time and a range sum is computed by subtracting two prefix values.</desc>
  <rect width="1000" height="440" fill="#ffffff"/>
  <text x="500" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#172b4d">Prefix sums turn repeated addition into subtraction</text>
  <g font-family="Arial, sans-serif">
    <text x="55" y="112" font-size="19" font-weight="700" fill="#174a73">array A</text>
    <g fill="#e9f3ff" stroke="#2f6fa3"><rect x="190" y="76" width="88" height="58" rx="6"/><rect x="284" y="76" width="88" height="58" rx="6"/><rect x="378" y="76" width="88" height="58" rx="6"/><rect x="472" y="76" width="88" height="58" rx="6"/><rect x="566" y="76" width="88" height="58" rx="6"/></g>
    <g text-anchor="middle" font-size="22" font-weight="700" fill="#174a73"><text x="234" y="112">3</text><text x="328" y="112">-1</text><text x="422" y="112">4</text><text x="516" y="112">2</text><text x="610" y="112">5</text></g>
    <g text-anchor="middle" font-size="14" fill="#718096"><text x="234" y="156">0</text><text x="328" y="156">1</text><text x="422" y="156">2</text><text x="516" y="156">3</text><text x="610" y="156">4</text></g>

    <text x="55" y="238" font-size="19" font-weight="700" fill="#744210">prefix P</text>
    <g fill="#fff3d6" stroke="#b7791f"><rect x="142" y="202" width="88" height="58" rx="6"/><rect x="236" y="202" width="88" height="58" rx="6"/><rect x="330" y="202" width="88" height="58" rx="6"/><rect x="424" y="202" width="88" height="58" rx="6"/><rect x="518" y="202" width="88" height="58" rx="6"/><rect x="612" y="202" width="88" height="58" rx="6"/></g>
    <g text-anchor="middle" font-size="22" font-weight="700" fill="#744210"><text x="186" y="238">0</text><text x="280" y="238">3</text><text x="374" y="238">2</text><text x="468" y="238">6</text><text x="562" y="238">8</text><text x="656" y="238">13</text></g>
    <g text-anchor="middle" font-size="14" fill="#718096"><text x="186" y="282">0</text><text x="280" y="282">1</text><text x="374" y="282">2</text><text x="468" y="282">3</text><text x="562" y="282">4</text><text x="656" y="282">5</text></g>

    <path d="M328 169 V192" stroke="#385170" stroke-width="2"/><path d="M422 169 V192" stroke="#385170" stroke-width="2"/><path d="M516 169 V192" stroke="#385170" stroke-width="2"/><path d="M610 169 V192" stroke="#385170" stroke-width="2"/>
    <rect x="130" y="322" width="740" height="78" rx="8" fill="#e8f7ef" stroke="#2f855a" stroke-width="2"/>
    <text x="500" y="354" text-anchor="middle" font-size="20" font-weight="700" fill="#22543d">sum A[1:4] = P[4] - P[1] = 8 - 3 = 5</text>
    <text x="500" y="382" text-anchor="middle" font-size="16" fill="#234e3b">Build once in O(n); answer every range query in O(1).</text>
  </g>
</svg>
