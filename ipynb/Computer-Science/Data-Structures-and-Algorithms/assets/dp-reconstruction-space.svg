<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
  <title id="title">Solution reconstruction and rolling-array optimization</title>
  <desc id="desc">A full dynamic programming table preserves parent decisions for reconstruction, while rolling rows preserve only values.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
  </defs>
  <rect width="1200" height="570" fill="#f8fafc"/>
  <text x="600" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#0f172a">Optimizing the value and reconstructing the choices are different outputs</text>

  <rect x="35" y="78" width="545" height="440" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="307" y="116" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#1d4ed8">Full table + parent decisions</text>
  <text x="307" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#475569">Enough information to walk backward and recover a witness.</text>
  <g stroke="#cbd5e1" stroke-width="2">
    <path d="M125 185 H485 M125 245 H485 M125 305 H485 M125 365 H485 M125 425 H485 M125 485 H485"/>
    <path d="M125 185 V485 M185 185 V485 M245 185 V485 M305 185 V485 M365 185 V485 M425 185 V485 M485 185 V485"/>
  </g>
  <g fill="#dbeafe"><rect x="426" y="186" width="58" height="58"/><rect x="366" y="246" width="58" height="58"/><rect x="306" y="306" width="58" height="58"/><rect x="246" y="366" width="58" height="58"/><rect x="186" y="426" width="58" height="58"/></g>
  <path d="M455 215 L395 275 L335 335 L275 395 L215 455" fill="none" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="307" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#1e3a8a">Backtrack through stored choices</text>

  <rect x="620" y="78" width="545" height="440" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="892" y="116" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#15803d">Rolling rows / rolling variables</text>
  <text x="892" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#475569">Keep only values still needed by future transitions.</text>

  <text x="700" y="220" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#475569">previous</text>
  <g font-family="Arial, sans-serif" text-anchor="middle"><rect x="800" y="185" width="70" height="55" rx="5" fill="#dbeafe" stroke="#2563eb"/><rect x="880" y="185" width="70" height="55" rx="5" fill="#dbeafe" stroke="#2563eb"/><rect x="960" y="185" width="70" height="55" rx="5" fill="#dbeafe" stroke="#2563eb"/><rect x="1040" y="185" width="70" height="55" rx="5" fill="#dbeafe" stroke="#2563eb"/><text x="835" y="220" font-size="17" fill="#1e3a8a">...</text><text x="915" y="220" font-size="17" fill="#1e3a8a">4</text><text x="995" y="220" font-size="17" fill="#1e3a8a">5</text><text x="1075" y="220" font-size="17" fill="#1e3a8a">6</text></g>
  <text x="700" y="320" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#475569">current</text>
  <g font-family="Arial, sans-serif" text-anchor="middle"><rect x="800" y="285" width="70" height="55" rx="5" fill="#dcfce7" stroke="#16a34a"/><rect x="880" y="285" width="70" height="55" rx="5" fill="#dcfce7" stroke="#16a34a"/><rect x="960" y="285" width="70" height="55" rx="5" fill="#dcfce7" stroke="#16a34a"/><rect x="1040" y="285" width="70" height="55" rx="5" fill="#dcfce7" stroke="#16a34a"/><text x="835" y="320" font-size="17" fill="#166534">...</text><text x="915" y="320" font-size="17" fill="#166534">5</text><text x="995" y="320" font-size="17" fill="#166534">6</text><text x="1075" y="320" font-size="17" fill="#166534">7</text></g>
  <path d="M830 250 L830 275 M910 250 L910 275 M990 250 L990 275 M1070 250 L1070 275" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1040 370 L830 370" fill="none" stroke="#16a34a" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="935" y="398" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#166534">reuse memory for the next row</text>
  <rect x="700" y="430" width="385" height="62" rx="6" fill="#fff7ed" stroke="#ea580c"/>
  <text x="892" y="457" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#9a3412">Value survives; the path may not.</text>
  <text x="892" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#9a3412">Store decisions or recompute if reconstruction is required.</text>
</svg>
