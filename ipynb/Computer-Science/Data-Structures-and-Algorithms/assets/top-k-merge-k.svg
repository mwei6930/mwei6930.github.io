<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
  <title id="title">Top-k and merge-k heap patterns</title>
  <desc id="desc">A size-k min heap keeps the largest seen values, while a size-k heap merges sorted streams by storing one current front from each stream.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#385170"/></marker></defs>
  <rect width="1000" height="500" fill="#ffffff"/>
  <text x="500" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#172b4d">Keep only the frontier that can affect the next answer</text>
  <g font-family="Arial, sans-serif">
    <rect x="35" y="75" width="440" height="365" rx="8" fill="#e9f3ff" stroke="#2f6fa3"/>
    <text x="255" y="112" text-anchor="middle" font-size="21" font-weight="700" fill="#174a73">Top-k largest: min heap of size k</text>
    <text x="65" y="157" font-size="17" fill="#243b53">stream</text><text x="145" y="157" font-size="18" font-weight="700">8, 1, 7, 3, 9, 6</text>
    <g stroke="#718096" stroke-width="2"><path d="M255 223 L190 295 M255 223 L320 295"/></g><g fill="#ffffff" stroke="#2f6fa3" stroke-width="2"><circle cx="255" cy="205" r="32"/><circle cx="190" cy="315" r="30"/><circle cx="320" cy="315" r="30"/></g><g text-anchor="middle" font-size="20" font-weight="700"><text x="255" y="212">7</text><text x="190" y="322">8</text><text x="320" y="322">9</text></g>
    <path d="M85 375 H405" stroke="#2f6fa3" stroke-width="4" marker-end="url(#arrow)"/><text x="245" y="406" text-anchor="middle" font-size="16" fill="#174a73">root = smallest retained candidate</text>

    <rect x="525" y="75" width="440" height="365" rx="8" fill="#fff3d6" stroke="#b7791f"/>
    <text x="745" y="112" text-anchor="middle" font-size="21" font-weight="700" fill="#744210">Merge k sorted streams: heap of fronts</text>
    <g font-size="17"><text x="555" y="162">A: 1 -> 5 -> 9</text><text x="555" y="202">B: 2 -> 4 -> 8</text><text x="555" y="242">C: 3 -> 6 -> 7</text></g>
    <g stroke="#718096" stroke-width="2"><path d="M820 235 L770 305 M820 235 L870 305"/></g><g fill="#ffffff" stroke="#b7791f" stroke-width="2"><circle cx="820" cy="217" r="30"/><circle cx="770" cy="325" r="28"/><circle cx="870" cy="325" r="28"/></g><g text-anchor="middle" font-size="19" font-weight="700"><text x="820" y="224">1,A</text><text x="770" y="332">2,B</text><text x="870" y="332">3,C</text></g>
    <path d="M675 365 H900" stroke="#b7791f" stroke-width="4" marker-end="url(#arrow)"/><text x="787" y="405" text-anchor="middle" font-size="16" fill="#744210">pop one front, push its successor</text>
    <text x="500" y="478" text-anchor="middle" font-size="16" fill="#4a5568">Heap size stays k, so each update costs O(log k), not O(log n).</text>
  </g>
</svg>
