<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
  <title id="title">Memoization and tabulation</title>
  <desc id="desc">Top-down memoization follows demanded recursive dependencies and caches them; bottom-up tabulation fills states in dependency order.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
  </defs>
  <rect width="1200" height="570" fill="#f8fafc"/>
  <text x="600" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#0f172a">Same state graph, different evaluation strategy</text>

  <rect x="35" y="78" width="545" height="440" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="307" y="116" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1d4ed8">Top-down memoization</text>
  <text x="307" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#475569">Ask for the target, recurse only into needed dependencies.</text>

  <g font-family="Arial, sans-serif" text-anchor="middle">
    <circle cx="307" cy="205" r="30" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="307" y="212" font-size="17" font-weight="700" fill="#1e3a8a">F(5)</text>
    <circle cx="215" cy="290" r="30" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="215" y="297" font-size="17" font-weight="700" fill="#1e3a8a">F(4)</text>
    <circle cx="399" cy="290" r="30" fill="#e0f2fe" stroke="#0891b2" stroke-width="2"/><text x="399" y="297" font-size="17" font-weight="700" fill="#155e75">F(3)</text>
    <circle cx="155" cy="380" r="30" fill="#e0f2fe" stroke="#0891b2" stroke-width="2"/><text x="155" y="387" font-size="17" font-weight="700" fill="#155e75">F(3)</text>
    <circle cx="275" cy="380" r="30" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="275" y="387" font-size="17" font-weight="700" fill="#166534">F(2)</text>
    <circle cx="399" cy="380" r="30" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="399" y="387" font-size="17" font-weight="700" fill="#166534">F(2)</text>
    <circle cx="480" cy="380" r="30" fill="#f0fdf4" stroke="#16a34a"/><text x="480" y="387" font-size="17" fill="#166534">F(1)</text>
  </g>
  <path d="M287 228 L235 266 M327 228 L379 266 M197 314 L173 350 M235 314 L263 350 M381 315 L409 350 M419 315 L462 352" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M185 374 C230 335 350 335 374 374" fill="none" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="300" y="341" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#c2410c">cache hit: compute F(3) once</text>
  <rect x="120" y="446" width="375" height="45" rx="6" fill="#eff6ff" stroke="#2563eb"/>
  <text x="307" y="474" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#1e3a8a">Natural recursion + dictionary + call-stack space</text>

  <rect x="620" y="78" width="545" height="440" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="892" y="116" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#6d28d9">Bottom-up tabulation</text>
  <text x="892" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#475569">Start from base cases and follow a topological order.</text>

  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="675" y="225" width="72" height="72" rx="6" fill="#e2e8f0" stroke="#64748b"/><text x="711" y="252" font-size="14" fill="#475569">dp[0]</text><text x="711" y="281" font-size="21" font-weight="700" fill="#334155">0</text>
    <rect x="757" y="225" width="72" height="72" rx="6" fill="#e2e8f0" stroke="#64748b"/><text x="793" y="252" font-size="14" fill="#475569">dp[1]</text><text x="793" y="281" font-size="21" font-weight="700" fill="#334155">1</text>
    <rect x="839" y="225" width="72" height="72" rx="6" fill="#ede9fe" stroke="#7c3aed"/><text x="875" y="252" font-size="14" fill="#6d28d9">dp[2]</text><text x="875" y="281" font-size="21" font-weight="700" fill="#5b21b6">1</text>
    <rect x="921" y="225" width="72" height="72" rx="6" fill="#ede9fe" stroke="#7c3aed"/><text x="957" y="252" font-size="14" fill="#6d28d9">dp[3]</text><text x="957" y="281" font-size="21" font-weight="700" fill="#5b21b6">2</text>
    <rect x="1003" y="225" width="72" height="72" rx="6" fill="#ede9fe" stroke="#7c3aed"/><text x="1039" y="252" font-size="14" fill="#6d28d9">dp[4]</text><text x="1039" y="281" font-size="21" font-weight="700" fill="#5b21b6">3</text>
    <rect x="1085" y="225" width="60" height="72" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="1115" y="252" font-size="14" fill="#166534">dp[5]</text><text x="1115" y="281" font-size="21" font-weight="700" fill="#166534">5</text>
  </g>
  <line x1="675" y1="330" x2="1125" y2="330" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="900" y="356" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#334155">dependencies are ready before each state</text>
  <rect x="700" y="400" width="385" height="58" rx="6" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="892" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#5b21b6">Explicit loops + predictable memory layout</text>
  <text x="892" y="448" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#475569">May compute states the target never needs</text>
</svg>
