<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
  <title id="title">Correct direction of a polynomial-time reduction</title><desc id="desc">An instance of known problem A is transformed to problem B, solved with a hypothetical B solver, and mapped back to answer A.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker><style>.title{font:700 28px 'Segoe UI',Arial,sans-serif;fill:#172033}.head{font:700 19px 'Segoe UI',Arial,sans-serif;fill:#172033}.body{font:16px 'Segoe UI',Arial,sans-serif;fill:#334155}.small{font:14px 'Segoe UI',Arial,sans-serif;fill:#526174}.line{stroke:#475569;stroke-width:4;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1120" height="640" fill="#f8fafc"/><text x="560" y="45" text-anchor="middle" class="title">To show B is hard, reduce a known hard problem A to B</text>
  <rect x="45" y="155" width="220" height="160" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text x="155" y="200" text-anchor="middle" class="head">A instance x</text><text x="155" y="238" text-anchor="middle" class="body">known source problem</text><text x="155" y="270" text-anchor="middle" class="small">x is YES or NO</text>
  <path d="M265 235L390 235" class="line"/><text x="328" y="210" text-anchor="middle" class="small">poly-time f</text>
  <rect x="390" y="155" width="220" height="160" rx="8" fill="#faf5ff" stroke="#c084fc" stroke-width="2"/><text x="500" y="200" text-anchor="middle" class="head">B instance f(x)</text><text x="500" y="238" text-anchor="middle" class="body">target problem</text><text x="500" y="270" text-anchor="middle" class="small">x in A iff f(x) in B</text>
  <path d="M610 235L735 235" class="line"/><text x="673" y="210" text-anchor="middle" class="small">hypothetical solver</text>
  <rect x="735" y="155" width="340" height="160" rx="8" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/><text x="905" y="200" text-anchor="middle" class="head">Answer B, therefore answer A</text><text x="905" y="238" text-anchor="middle" class="body">A solver = transform + B solver</text><text x="905" y="270" text-anchor="middle" class="small">If B were easy, A would also be easy.</text>
  <rect x="110" y="380" width="900" height="90" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/><text x="560" y="415" text-anchor="middle" class="head">A &lt;=p B means B is at least as hard as A</text><text x="560" y="447" text-anchor="middle" class="body">The transformation must be polynomial and preserve YES exactly in both directions.</text>
  <rect x="200" y="510" width="720" height="76" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/><text x="560" y="540" text-anchor="middle" class="head">Common mistake: B &lt;=p A does not prove B is hard</text><text x="560" y="568" text-anchor="middle" class="small">That direction only shows B can be solved using A.</text>
</svg>
