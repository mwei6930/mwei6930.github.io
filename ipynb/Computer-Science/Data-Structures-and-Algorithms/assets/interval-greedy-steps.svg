<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Interval scheduling and interval merging steps</title>
  <desc id="desc">Top panel selects compatible intervals by earliest finish time; bottom panel merges overlapping intervals after sorting by start time.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1200" height="650" fill="#f8fafc"/>
  <text x="600" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#0f172a">Sorting exposes the one-dimensional frontier</text>

  <rect x="35" y="68" width="1130" height="265" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <text x="65" y="104" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#0f766e">Maximum compatible intervals: sort by finish time</text>
  <line x1="100" y1="272" x2="1100" y2="272" stroke="#64748b" stroke-width="2"/>
  <g font-family="Arial, sans-serif" font-size="14" fill="#475569" text-anchor="middle">
    <text x="100" y="298">0</text><text x="200" y="298">1</text><text x="300" y="298">2</text><text x="400" y="298">3</text><text x="500" y="298">4</text><text x="600" y="298">5</text><text x="700" y="298">6</text><text x="800" y="298">7</text><text x="900" y="298">8</text><text x="1000" y="298">9</text><text x="1100" y="298">10</text>
  </g>
  <g stroke="#cbd5e1"><line x1="100" y1="268" x2="100" y2="278"/><line x1="200" y1="268" x2="200" y2="278"/><line x1="300" y1="268" x2="300" y2="278"/><line x1="400" y1="268" x2="400" y2="278"/><line x1="500" y1="268" x2="500" y2="278"/><line x1="600" y1="268" x2="600" y2="278"/><line x1="700" y1="268" x2="700" y2="278"/><line x1="800" y1="268" x2="800" y2="278"/><line x1="900" y1="268" x2="900" y2="278"/><line x1="1000" y1="268" x2="1000" y2="278"/><line x1="1100" y1="268" x2="1100" y2="278"/></g>

  <rect x="100" y="128" width="300" height="34" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="250" y="151" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#166534">A [0, 3] accept</text>
  <rect x="200" y="174" width="400" height="34" rx="5" fill="#fee2e2" stroke="#dc2626"/>
  <text x="400" y="197" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#991b1b">B [1, 5] skip: overlaps A</text>
  <rect x="400" y="220" width="300" height="34" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="550" y="243" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#166534">C [3, 6] accept</text>
  <rect x="700" y="128" width="200" height="34" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="800" y="151" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#166534">D [6, 8] accept</text>
  <rect x="800" y="174" width="300" height="34" rx="5" fill="#fee2e2" stroke="#dc2626"/>
  <text x="950" y="197" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#991b1b">E [7, 10] skip</text>

  <rect x="35" y="360" width="1130" height="250" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="65" y="397" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#1d4ed8">Merge overlaps: sort by start time and extend one frontier</text>

  <text x="75" y="449" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#334155">Sorted input</text>
  <rect x="190" y="421" width="120" height="50" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="325" y="421" width="120" height="50" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="460" y="421" width="120" height="50" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="595" y="421" width="120" height="50" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="250" y="453" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#1e3a8a">[1, 3]</text>
  <text x="385" y="453" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#1e3a8a">[2, 6]</text>
  <text x="520" y="453" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#1e3a8a">[8, 10]</text>
  <text x="655" y="453" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#1e3a8a">[9, 12]</text>
  <path d="M730 446 L815 446" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="775" y="428" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#475569">scan</text>

  <text x="75" y="545" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#334155">Output</text>
  <rect x="190" y="514" width="235" height="54" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <rect x="460" y="514" width="255" height="54" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="307" y="548" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#166534">[1, 6]</text>
  <text x="587" y="548" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#166534">[8, 12]</text>
  <rect x="820" y="501" width="300" height="80" rx="6" fill="#f1f5f9" stroke="#64748b"/>
  <text x="970" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#334155">overlap if next.start &lt;= current.end</text>
  <text x="970" y="558" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#334155">then extend current.end</text>
</svg>
