<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Workflow for designing a greedy algorithm</title>
  <desc id="desc">A five-stage workflow from modelling the problem to proving and testing the greedy rule.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1200" height="500" fill="#f8fafc"/>
  <text x="600" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#0f172a">From a promising rule to a justified greedy strategy</text>

  <g font-family="Arial, sans-serif">
    <rect x="35" y="100" width="200" height="150" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="135" y="134" text-anchor="middle" font-size="19" font-weight="700" fill="#1d4ed8">1. Model</text>
    <text x="135" y="168" text-anchor="middle" font-size="15" fill="#334155">candidates</text>
    <text x="135" y="193" text-anchor="middle" font-size="15" fill="#334155">feasibility</text>
    <text x="135" y="218" text-anchor="middle" font-size="15" fill="#334155">objective</text>

    <rect x="270" y="100" width="200" height="150" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
    <text x="370" y="134" text-anchor="middle" font-size="19" font-weight="700" fill="#0e7490">2. Choose a rule</text>
    <text x="370" y="168" text-anchor="middle" font-size="15" fill="#334155">smallest finish?</text>
    <text x="370" y="193" text-anchor="middle" font-size="15" fill="#334155">largest gain?</text>
    <text x="370" y="218" text-anchor="middle" font-size="15" fill="#334155">best ratio?</text>

    <rect x="505" y="100" width="200" height="150" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="605" y="134" text-anchor="middle" font-size="19" font-weight="700" fill="#15803d">3. Maintain state</text>
    <text x="605" y="168" text-anchor="middle" font-size="15" fill="#334155">sort once</text>
    <text x="605" y="193" text-anchor="middle" font-size="15" fill="#334155">heap / DSU</text>
    <text x="605" y="218" text-anchor="middle" font-size="15" fill="#334155">feasibility invariant</text>

    <rect x="740" y="100" width="200" height="150" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="840" y="134" text-anchor="middle" font-size="19" font-weight="700" fill="#6d28d9">4. Prove safety</text>
    <text x="840" y="168" text-anchor="middle" font-size="15" fill="#334155">exchange</text>
    <text x="840" y="193" text-anchor="middle" font-size="15" fill="#334155">stays ahead</text>
    <text x="840" y="218" text-anchor="middle" font-size="15" fill="#334155">cut / induction</text>

    <rect x="975" y="100" width="190" height="150" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="1070" y="134" text-anchor="middle" font-size="19" font-weight="700" fill="#c2410c">5. Attack it</text>
    <text x="1070" y="168" text-anchor="middle" font-size="15" fill="#334155">tiny cases</text>
    <text x="1070" y="193" text-anchor="middle" font-size="15" fill="#334155">brute-force oracle</text>
    <text x="1070" y="218" text-anchor="middle" font-size="15" fill="#334155">edge conditions</text>

    <line x1="235" y1="175" x2="260" y2="175" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
    <line x1="470" y1="175" x2="495" y2="175" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
    <line x1="705" y1="175" x2="730" y2="175" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
    <line x1="940" y1="175" x2="965" y2="175" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="180" y="318" width="360" height="120" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <text x="360" y="352" text-anchor="middle" font-size="19" font-weight="700" fill="#166534">Proof succeeds</text>
    <text x="360" y="385" text-anchor="middle" font-size="16" fill="#334155">The choice can be committed permanently.</text>
    <text x="360" y="413" text-anchor="middle" font-size="15" fill="#475569">State shrinks; repeat until complete.</text>

    <rect x="660" y="318" width="360" height="120" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
    <text x="840" y="352" text-anchor="middle" font-size="19" font-weight="700" fill="#b91c1c">Counterexample appears</text>
    <text x="840" y="385" text-anchor="middle" font-size="16" fill="#334155">Revise the rule or keep more states.</text>
    <text x="840" y="413" text-anchor="middle" font-size="15" fill="#475569">Dynamic programming may be required.</text>

    <path d="M840 250 L840 305" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M1070 250 C1070 286 950 288 900 310" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M780 318 C720 286 460 286 420 315" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)"/>
  </g>
</svg>
