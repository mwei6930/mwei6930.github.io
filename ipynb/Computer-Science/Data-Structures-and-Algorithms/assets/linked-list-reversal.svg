<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
  <title id="title">Three-pointer linked-list reversal</title>
  <desc id="desc">Three panels show next saved before current next is redirected to previous, then previous and current advance.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#385170"/></marker></defs>
  <rect width="1000" height="470" fill="#ffffff"/>
  <text x="500" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#172b4d">Save, reverse, then advance</text>
  <g font-family="Arial, sans-serif">
    <text x="48" y="108" font-size="18" font-weight="700" fill="#174a73">1. Save next</text>
    <g transform="translate(245 75)"><g fill="#e9f3ff" stroke="#2f6fa3"><rect width="100" height="58" rx="7"/><rect x="170" width="100" height="58" rx="7"/><rect x="340" width="100" height="58" rx="7"/></g><g text-anchor="middle" font-size="22"><text x="50" y="37">2</text><text x="220" y="37">5</text><text x="390" y="37">8</text></g><path d="M100 29 H162" stroke="#385170" stroke-width="3" marker-end="url(#arrow)"/><path d="M270 29 H332" stroke="#385170" stroke-width="3" marker-end="url(#arrow)"/><text x="-55" y="36" fill="#805ad5" font-weight="700">prev = null</text><text x="50" y="88" text-anchor="middle" fill="#2f6fa3" font-weight="700">curr</text><text x="220" y="88" text-anchor="middle" fill="#b7791f" font-weight="700">next</text></g>
    <line x1="48" y1="170" x2="952" y2="170" stroke="#e2e8f0"/>
    <text x="48" y="225" font-size="18" font-weight="700" fill="#744210">2. Reverse curr.next</text>
    <g transform="translate(245 192)"><g fill="#fff3d6" stroke="#b7791f"><rect width="100" height="58" rx="7"/><rect x="170" width="100" height="58" rx="7"/><rect x="340" width="100" height="58" rx="7"/></g><g text-anchor="middle" font-size="22"><text x="50" y="37">2</text><text x="220" y="37">5</text><text x="390" y="37">8</text></g><path d="M0 29 H-62" stroke="#c53030" stroke-width="3" marker-end="url(#arrow)"/><path d="M270 29 H332" stroke="#385170" stroke-width="3" marker-end="url(#arrow)"/><text x="50" y="88" text-anchor="middle" fill="#2f6fa3" font-weight="700">curr</text><text x="220" y="88" text-anchor="middle" fill="#b7791f" font-weight="700">next</text><text x="-72" y="35" text-anchor="end" fill="#805ad5" font-weight="700">null</text></g>
    <line x1="48" y1="287" x2="952" y2="287" stroke="#e2e8f0"/>
    <text x="48" y="342" font-size="18" font-weight="700" fill="#22543d">3. Advance both pointers</text>
    <g transform="translate(245 309)"><g fill="#e8f7ef" stroke="#2f855a"><rect width="100" height="58" rx="7"/><rect x="170" width="100" height="58" rx="7"/><rect x="340" width="100" height="58" rx="7"/></g><g text-anchor="middle" font-size="22"><text x="50" y="37">2</text><text x="220" y="37">5</text><text x="390" y="37">8</text></g><path d="M170 29 H108" stroke="#c53030" stroke-width="3" marker-end="url(#arrow)"/><path d="M270 29 H332" stroke="#385170" stroke-width="3" marker-end="url(#arrow)"/><text x="50" y="88" text-anchor="middle" fill="#805ad5" font-weight="700">prev</text><text x="220" y="88" text-anchor="middle" fill="#2f6fa3" font-weight="700">curr</text><text x="390" y="88" text-anchor="middle" fill="#b7791f" font-weight="700">next</text></g>
    <rect x="690" y="198" width="252" height="76" rx="8" fill="#f7fafc" stroke="#a0aec0"/>
    <text x="816" y="229" text-anchor="middle" font-size="16" font-weight="700" fill="#2d3748">Never reverse first</text>
    <text x="816" y="253" text-anchor="middle" font-size="15" fill="#4a5568">or the remaining list is lost.</text>
  </g>
</svg>
