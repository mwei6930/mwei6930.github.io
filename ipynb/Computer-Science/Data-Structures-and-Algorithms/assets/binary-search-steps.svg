<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540" role="img" aria-labelledby="title desc">
  <title id="title">Binary search interval reduction</title>
  <desc id="desc">Binary search for 23 compares the middle item, discards the impossible half, and finds the target while preserving the candidate interval invariant.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#52657a"/></marker></defs>
  <rect width="1100" height="540" fill="#ffffff"/>
  <text x="550" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#172b4d">Binary search keeps only the possible interval</text>
  <g font-family="Arial, sans-serif">
    <text x="70" y="105" font-size="20" font-weight="700" fill="#2d3748">Target = 23</text>
    <text x="70" y="176" font-size="18" font-weight="700" fill="#744210">1. Compare middle</text>
    <g transform="translate(315 130)" text-anchor="middle">
      <g stroke="#2f6fa3" fill="#e6f1fb"><rect x="0" y="0" width="90" height="65"/><rect x="92" y="0" width="90" height="65"/><rect x="184" y="0" width="90" height="65"/><rect x="276" y="0" width="90" height="65" fill="#fff3d6" stroke="#b7791f" stroke-width="3"/><rect x="368" y="0" width="90" height="65"/><rect x="460" y="0" width="90" height="65"/><rect x="552" y="0" width="90" height="65"/></g>
      <g font-size="21" font-weight="700" fill="#2d3748"><text x="45" y="40">2</text><text x="137" y="40">5</text><text x="229" y="40">8</text><text x="321" y="40">12</text><text x="413" y="40">16</text><text x="505" y="40">23</text><text x="597" y="40">38</text></g>
      <g font-size="14" fill="#718096"><text x="45" y="88">0</text><text x="137" y="88">1</text><text x="229" y="88">2</text><text x="321" y="88">mid = 3</text><text x="413" y="88">4</text><text x="505" y="88">5</text><text x="597" y="88">6</text></g>
    </g>
    <text x="636" y="250" text-anchor="middle" font-size="17" fill="#744210">12 &lt; 23, so indices 0 through 3 cannot contain the target.</text>
    <path d="M550 273 V310" stroke="#52657a" stroke-width="4" marker-end="url(#arrow)"/>

    <text x="70" y="383" font-size="18" font-weight="700" fill="#22543d">2. Search remaining half</text>
    <g transform="translate(315 338)" text-anchor="middle">
      <g stroke="#a0aec0" fill="#edf2f7" opacity="0.55"><rect x="0" y="0" width="90" height="65"/><rect x="92" y="0" width="90" height="65"/><rect x="184" y="0" width="90" height="65"/><rect x="276" y="0" width="90" height="65"/></g>
      <g stroke="#2f855a" fill="#e8f7ef"><rect x="368" y="0" width="90" height="65"/><rect x="460" y="0" width="90" height="65" fill="#d5f0e1" stroke-width="4"/><rect x="552" y="0" width="90" height="65"/></g>
      <g font-size="21" font-weight="700"><g fill="#a0aec0"><text x="45" y="40">2</text><text x="137" y="40">5</text><text x="229" y="40">8</text><text x="321" y="40">12</text></g><g fill="#22543d"><text x="413" y="40">16</text><text x="505" y="40">23</text><text x="597" y="40">38</text></g></g>
      <g font-size="14"><text x="413" y="88" fill="#2f855a">low = 4</text><text x="505" y="88" fill="#22543d">mid = 5: found</text><text x="597" y="88" fill="#2f855a">high = 6</text></g>
    </g>
    <rect x="250" y="458" width="600" height="48" rx="7" fill="#f2ecfb" stroke="#805ad5"/>
    <text x="550" y="489" text-anchor="middle" font-size="17" font-weight="700" fill="#553c9a">Invariant: if 23 exists, it remains inside indices [low, high].</text>
  </g>
</svg>
