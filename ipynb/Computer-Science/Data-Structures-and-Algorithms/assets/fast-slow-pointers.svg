<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
  <title id="title">Fast and slow pointers locate a linked-list middle</title>
  <desc id="desc">Three snapshots show slow moving one node and fast moving two nodes until fast reaches the end and slow is at the middle.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#385170"/></marker></defs>
  <rect width="1000" height="430" fill="#ffffff"/>
  <text x="500" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#172b4d">Fast advances twice for every slow advance</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(155 78)">
      <text x="-105" y="33" font-size="18" font-weight="700" fill="#174a73">Start</text>
      <g fill="#e9f3ff" stroke="#2f6fa3"><rect width="82" height="52" rx="6"/><rect x="98" width="82" height="52" rx="6"/><rect x="196" width="82" height="52" rx="6"/><rect x="294" width="82" height="52" rx="6"/><rect x="392" width="82" height="52" rx="6"/><rect x="490" width="82" height="52" rx="6"/></g>
      <g text-anchor="middle" font-size="20"><text x="41" y="33">1</text><text x="139" y="33">2</text><text x="237" y="33">3</text><text x="335" y="33">4</text><text x="433" y="33">5</text><text x="531" y="33">6</text></g>
      <g stroke="#385170" stroke-width="2.5" marker-end="url(#arrow)"><path d="M82 26 H90"/><path d="M180 26 H188"/><path d="M278 26 H286"/><path d="M376 26 H384"/><path d="M474 26 H482"/></g>
      <text x="41" y="78" text-anchor="middle" font-size="16" font-weight="700" fill="#2f6fa3">slow</text><text x="41" y="99" text-anchor="middle" font-size="16" font-weight="700" fill="#c53030">fast</text>
    </g>
    <g transform="translate(155 196)">
      <text x="-105" y="33" font-size="18" font-weight="700" fill="#744210">After 1</text>
      <g fill="#fff3d6" stroke="#b7791f"><rect width="82" height="52" rx="6"/><rect x="98" width="82" height="52" rx="6"/><rect x="196" width="82" height="52" rx="6"/><rect x="294" width="82" height="52" rx="6"/><rect x="392" width="82" height="52" rx="6"/><rect x="490" width="82" height="52" rx="6"/></g>
      <g text-anchor="middle" font-size="20"><text x="41" y="33">1</text><text x="139" y="33">2</text><text x="237" y="33">3</text><text x="335" y="33">4</text><text x="433" y="33">5</text><text x="531" y="33">6</text></g>
      <g stroke="#385170" stroke-width="2.5" marker-end="url(#arrow)"><path d="M82 26 H90"/><path d="M180 26 H188"/><path d="M278 26 H286"/><path d="M376 26 H384"/><path d="M474 26 H482"/></g>
      <text x="139" y="82" text-anchor="middle" font-size="16" font-weight="700" fill="#2f6fa3">slow</text><text x="237" y="82" text-anchor="middle" font-size="16" font-weight="700" fill="#c53030">fast</text>
    </g>
    <g transform="translate(155 314)">
      <text x="-105" y="33" font-size="18" font-weight="700" fill="#22543d">Finish</text>
      <g fill="#e8f7ef" stroke="#2f855a"><rect width="82" height="52" rx="6"/><rect x="98" width="82" height="52" rx="6"/><rect x="196" width="82" height="52" rx="6"/><rect x="294" width="82" height="52" rx="6" stroke-width="3"/><rect x="392" width="82" height="52" rx="6"/><rect x="490" width="82" height="52" rx="6"/></g>
      <g text-anchor="middle" font-size="20"><text x="41" y="33">1</text><text x="139" y="33">2</text><text x="237" y="33">3</text><text x="335" y="33">4</text><text x="433" y="33">5</text><text x="531" y="33">6</text></g>
      <g stroke="#385170" stroke-width="2.5" marker-end="url(#arrow)"><path d="M82 26 H90"/><path d="M180 26 H188"/><path d="M278 26 H286"/><path d="M376 26 H384"/><path d="M474 26 H482"/></g>
      <text x="335" y="82" text-anchor="middle" font-size="16" font-weight="700" fill="#2f6fa3">slow = middle</text><text x="640" y="31" font-size="16" font-weight="700" fill="#c53030">fast = null</text>
    </g>
  </g>
</svg>
