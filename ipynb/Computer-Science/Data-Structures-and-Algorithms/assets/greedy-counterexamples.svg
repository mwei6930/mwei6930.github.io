<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Counterexamples where natural greedy rules fail</title>
  <desc id="desc">Coin change with denominations one, three and four and zero-one knapsack both defeat a natural locally best rule.</desc>
  <rect width="1200" height="560" fill="#f8fafc"/>
  <text x="600" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#0f172a">A small counterexample is enough to reject a greedy rule</text>

  <rect x="35" y="78" width="545" height="425" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="307" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#b91c1c">Coin change: coins {1, 3, 4}, target 6</text>
  <text x="307" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#475569">Rule: repeatedly take the largest coin that still fits.</text>

  <text x="80" y="205" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#991b1b">Greedy</text>
  <circle cx="190" cy="200" r="40" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <circle cx="285" cy="200" r="40" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <circle cx="380" cy="200" r="40" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="190" y="208" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#991b1b">4</text>
  <text x="285" y="208" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#991b1b">1</text>
  <text x="380" y="208" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#991b1b">1</text>
  <text x="470" y="208" font-family="Arial, sans-serif" font-size="17" fill="#991b1b">3 coins</text>

  <text x="80" y="320" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#166534">Optimal</text>
  <circle cx="235" cy="315" r="40" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <circle cx="350" cy="315" r="40" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="235" y="323" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#166534">3</text>
  <text x="350" y="323" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#166534">3</text>
  <text x="470" y="323" font-family="Arial, sans-serif" font-size="17" fill="#166534">2 coins</text>

  <rect x="85" y="395" width="445" height="70" rx="6" fill="#fff7ed" stroke="#ea580c"/>
  <text x="307" y="423" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#9a3412">The first locally best coin leaves a bad remainder.</text>
  <text x="307" y="449" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#9a3412">Optimal substructure exists, but greedy choice does not.</text>

  <rect x="620" y="78" width="545" height="425" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="892" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#6d28d9">0/1 knapsack: capacity 50</text>
  <text x="892" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#475569">Rule: take whole items by decreasing value/weight ratio.</text>

  <g font-family="Arial, sans-serif">
    <rect x="680" y="185" width="150" height="70" rx="6" fill="#dbeafe" stroke="#2563eb"/>
    <rect x="845" y="185" width="150" height="70" rx="6" fill="#e0f2fe" stroke="#0891b2"/>
    <rect x="1010" y="185" width="110" height="70" rx="6" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="755" y="214" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">A: w=10, v=60</text>
    <text x="755" y="239" text-anchor="middle" font-size="15" fill="#1e3a8a">ratio 6</text>
    <text x="920" y="214" text-anchor="middle" font-size="16" font-weight="700" fill="#155e75">B: w=20, v=100</text>
    <text x="920" y="239" text-anchor="middle" font-size="15" fill="#155e75">ratio 5</text>
    <text x="1065" y="214" text-anchor="middle" font-size="15" font-weight="700" fill="#5b21b6">C: w=30</text>
    <text x="1065" y="239" text-anchor="middle" font-size="15" fill="#5b21b6">v=120, ratio 4</text>

    <text x="675" y="306" font-size="16" font-weight="700" fill="#991b1b">Greedy takes A + B</text>
    <rect x="680" y="325" width="270" height="42" rx="5" fill="#fee2e2" stroke="#dc2626"/>
    <text x="815" y="352" text-anchor="middle" font-size="16" fill="#991b1b">weight 30, value 160</text>
    <text x="970" y="352" font-size="14" fill="#991b1b">C no longer fits</text>

    <text x="675" y="408" font-size="16" font-weight="700" fill="#166534">Optimal takes B + C</text>
    <rect x="680" y="426" width="390" height="42" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="875" y="453" text-anchor="middle" font-size="16" font-weight="700" fill="#166534">weight 50, value 220</text>
  </g>
</svg>
