<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Cryptographic building blocks for network protocols</title>
  <desc id="desc">A comparison of hashing, MAC, signatures, authenticated encryption, and key exchange.</desc>
  <defs>
    <style>.h{font:700 30px Arial,sans-serif;fill:#172033}.s{font:700 17px Arial,sans-serif;fill:#172033}.t{font:15px Arial,sans-serif;fill:#334155}.tiny{font:13px Arial,sans-serif;fill:#475569}.head{fill:#172033}.row{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.yes{fill:#dcfce7}.partial{fill:#fef3c7}.no{fill:#fee2e2}.use{fill:#eff6ff}.line{stroke:#cbd5e1;stroke-width:1}</style>
  </defs>
  <rect width="1280" height="760" fill="#fff"/>
  <text x="42" y="52" class="h">Cryptographic building blocks are not interchangeable</text>
  <text x="42" y="80" class="t">A secure network protocol composes primitives so that keys, identities, messages, and replay state reinforce one another.</text>

  <rect x="42" y="112" width="1196" height="54" rx="6" class="head"/>
  <text x="62" y="146" class="s" fill="#fff">Primitive</text>
  <text x="248" y="146" class="s" fill="#fff">Secret material</text>
  <text x="430" y="146" class="s" fill="#fff">Primary guarantee</text>
  <text x="703" y="146" class="s" fill="#fff">Does not prove by itself</text>
  <text x="982" y="146" class="s" fill="#fff">Typical network role</text>

  <rect x="42" y="172" width="1196" height="92" class="row"/>
  <rect x="42" y="172" width="178" height="92" class="partial"/>
  <text x="62" y="207" class="s">Hash</text><text x="62" y="233" class="tiny">H(m)</text>
  <text x="248" y="217" class="t">none</text>
  <text x="430" y="207" class="t">compact fingerprint</text><text x="430" y="233" class="t">change detection</text>
  <text x="703" y="207" class="t">who created the message</text><text x="703" y="233" class="t">or whether an attacker replaced both</text>
  <text x="982" y="207" class="t">transcript hash, object digest,</text><text x="982" y="233" class="t">Merkle tree</text>

  <rect x="42" y="270" width="1196" height="92" class="row"/>
  <rect x="42" y="270" width="178" height="92" class="yes"/>
  <text x="62" y="305" class="s">MAC</text><text x="62" y="331" class="tiny">HMAC(K, m)</text>
  <text x="248" y="315" class="t">shared secret K</text>
  <text x="430" y="305" class="t">integrity + peer possessing K</text><text x="430" y="331" class="t">efficient per-record authentication</text>
  <text x="703" y="305" class="t">which holder created it</text><text x="703" y="331" class="t">when several peers share K</text>
  <text x="982" y="305" class="t">protocol records, API requests,</text><text x="982" y="331" class="t">cookie integrity</text>

  <rect x="42" y="368" width="1196" height="92" class="row"/>
  <rect x="42" y="368" width="178" height="92" class="yes"/>
  <text x="62" y="403" class="s">Digital signature</text><text x="62" y="429" class="tiny">Sign(sk, H(m))</text>
  <text x="248" y="403" class="t">private signing key</text><text x="248" y="429" class="t">public verification key</text>
  <text x="430" y="403" class="t">origin authentication</text><text x="430" y="429" class="t">publicly verifiable integrity</text>
  <text x="703" y="403" class="t">confidentiality or freshness</text><text x="703" y="429" class="t">without nonce / timestamp policy</text>
  <text x="982" y="403" class="t">certificates, DNSSEC, RPKI,</text><text x="982" y="429" class="t">handshake authentication</text>

  <rect x="42" y="466" width="1196" height="92" class="row"/>
  <rect x="42" y="466" width="178" height="92" class="yes"/>
  <text x="62" y="501" class="s">AEAD</text><text x="62" y="527" class="tiny">Enc(K, nonce, m, AAD)</text>
  <text x="248" y="511" class="t">shared traffic key + unique nonce</text>
  <text x="430" y="501" class="t">confidentiality + integrity</text><text x="430" y="527" class="t">including unencrypted AAD</text>
  <text x="703" y="501" class="t">peer identity or replay defense</text><text x="703" y="527" class="t">unless the protocol adds them</text>
  <text x="982" y="501" class="t">TLS records, QUIC packets,</text><text x="982" y="527" class="t">IPsec ESP</text>

  <rect x="42" y="564" width="1196" height="92" class="row"/>
  <rect x="42" y="564" width="178" height="92" class="use"/>
  <text x="62" y="599" class="s">Key exchange</text><text x="62" y="625" class="tiny">ECDHE + KDF</text>
  <text x="248" y="599" class="t">ephemeral private keys</text><text x="248" y="625" class="t">authenticated separately</text>
  <text x="430" y="599" class="t">fresh shared secret</text><text x="430" y="625" class="t">forward secrecy when ephemeral</text>
  <text x="703" y="599" class="t">identity against active MITM</text><text x="703" y="625" class="t">without signatures / PSK</text>
  <text x="982" y="599" class="t">TLS 1.3 and IKE key setup</text><text x="982" y="625" class="t">then derive directional keys</text>

  <rect x="42" y="682" width="1196" height="48" rx="6" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="62" y="712" class="s">Composition rule:</text>
  <text x="220" y="712" class="t">authenticate the key exchange, bind the transcript, derive separate keys, use unique nonces, and track replay.</text>
</svg>
