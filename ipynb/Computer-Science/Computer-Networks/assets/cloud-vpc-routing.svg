<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" role="img" aria-labelledby="title desc">
  <title id="title">Vendor-neutral cloud VPC routing and policy path</title><desc id="desc">Workloads in private and public subnets use distributed route tables, security policy, NAT or internet gateways, private service endpoints, transit connectivity, and hybrid links.</desc>
  <rect width="1200" height="670" fill="#fff"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#596b78"/></marker></defs><style>.h{font:700 27px Arial,sans-serif;fill:#17212b}.t{font:700 18px Arial,sans-serif;fill:#17212b}.s{font:15px Arial,sans-serif;fill:#3d4e5c}.a{stroke:#596b78;stroke-width:3;fill:none;marker-end:url(#a)}.b{stroke:#2878b5;stroke-width:3;fill:none;marker-end:url(#a)}.g{stroke:#2f855a;stroke-width:3;fill:none;marker-end:url(#a)}</style>
  <text class="h" x="600" y="43" text-anchor="middle">A Cloud Route Is the Composition of Routing, Policy, Translation, and Provider State</text>
  <g transform="translate(55 90)"><rect width="820" height="500" rx="8" fill="#f7f9fb" stroke="#2878b5" stroke-width="3"/><text class="t" x="410" y="35" text-anchor="middle">Virtual private cloud 10.0.0.0/16</text>
    <g transform="translate(30 65)"><rect width="350" height="170" rx="7" fill="#e8f1fb" stroke="#2878b5" stroke-width="2"/><text class="t" x="175" y="32" text-anchor="middle">Private subnet 10.0.1.0/24</text><rect x="35" y="60" width="120" height="65" rx="5" fill="#fff" stroke="#2878b5"/><text class="s" x="95" y="87" text-anchor="middle">workload A</text><text class="s" x="95" y="110" text-anchor="middle">no public IP</text><rect x="195" y="60" width="120" height="65" rx="5" fill="#fff4dd" stroke="#b7791f"/><text class="s" x="255" y="87" text-anchor="middle">route table</text><text class="s" x="255" y="110" text-anchor="middle">0/0 -&gt; NAT</text></g>
    <g transform="translate(430 65)"><rect width="350" height="170" rx="7" fill="#eaf6ef" stroke="#2f855a" stroke-width="2"/><text class="t" x="175" y="32" text-anchor="middle">Public subnet 10.0.2.0/24</text><rect x="35" y="60" width="120" height="65" rx="5" fill="#fff" stroke="#2f855a"/><text class="s" x="95" y="87" text-anchor="middle">load balancer</text><text class="s" x="95" y="110" text-anchor="middle">public frontend</text><rect x="195" y="60" width="120" height="65" rx="5" fill="#fff4dd" stroke="#b7791f"/><text class="s" x="255" y="87" text-anchor="middle">route table</text><text class="s" x="255" y="110" text-anchor="middle">0/0 -&gt; IGW</text></g>
    <g transform="translate(30 285)"><rect width="220" height="85" rx="7" fill="#f2edfb" stroke="#7651a8" stroke-width="2"/><text class="t" x="110" y="32" text-anchor="middle">Security policy</text><text class="s" x="110" y="58" text-anchor="middle">stateful group + subnet ACL</text></g><g transform="translate(295 285)"><rect width="220" height="85" rx="7" fill="#fff4dd" stroke="#b7791f" stroke-width="2"/><text class="t" x="110" y="32" text-anchor="middle">NAT gateway</text><text class="s" x="110" y="58" text-anchor="middle">outbound translation state</text></g><g transform="translate(560 285)"><rect width="220" height="85" rx="7" fill="#e8f5f5" stroke="#267d7d" stroke-width="2"/><text class="t" x="110" y="32" text-anchor="middle">Private endpoint</text><text class="s" x="110" y="58" text-anchor="middle">provider service without Internet</text></g>
    <g transform="translate(170 405)"><rect width="220" height="65" rx="7" fill="#fbeaea" stroke="#b64a4a" stroke-width="2"/><text class="t" x="110" y="39" text-anchor="middle">Transit gateway / hub</text></g><g transform="translate(455 405)"><rect width="220" height="65" rx="7" fill="#e8f1fb" stroke="#2878b5" stroke-width="2"/><text class="t" x="110" y="39" text-anchor="middle">Flow logs + telemetry</text></g>
  </g>
  <g transform="translate(940 115)"><rect width="210" height="90" rx="7" fill="#e8f1fb" stroke="#2878b5" stroke-width="2"/><text class="t" x="105" y="35" text-anchor="middle">Internet / CDN</text><text class="s" x="105" y="63" text-anchor="middle">public routes and DDoS edge</text></g><g transform="translate(940 285)"><rect width="210" height="90" rx="7" fill="#eaf6ef" stroke="#2f855a" stroke-width="2"/><text class="t" x="105" y="35" text-anchor="middle">Provider service</text><text class="s" x="105" y="63" text-anchor="middle">object/database API</text></g><g transform="translate(940 455)"><rect width="210" height="90" rx="7" fill="#fff4dd" stroke="#b7791f" stroke-width="2"/><text class="t" x="105" y="35" text-anchor="middle">On-prem / other VPC</text><text class="s" x="105" y="63" text-anchor="middle">VPN or private circuit</text></g>
  <path class="b" d="M875 160H940"/><path class="g" d="M875 330H940"/><path class="a" d="M875 500H940"/>
  <text class="s" x="600" y="635" text-anchor="middle">Provider abstractions are distributed implementations; troubleshoot effective routes and policy at both endpoints.</text>
</svg>
