<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
  <title id="title">Safe network configuration change loop</title><desc id="desc">Desired state is compared, validated, canaried, observed, committed, or rolled back.</desc>
  <rect width="1200" height="590" fill="#fff"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#596b78"/></marker></defs><style>.h{font:700 27px Arial,sans-serif;fill:#17212b}.t{font:700 18px Arial,sans-serif;fill:#17212b}.s{font:15px Arial,sans-serif;fill:#3d4e5c}.a{stroke:#596b78;stroke-width:3;fill:none;marker-end:url(#a)}</style>
  <text class="h" x="600" y="43" text-anchor="middle">Configuration Is a Transaction with Evidence</text>
  <g transform="translate(70 100)"><rect width="185" height="105" rx="7" fill="#e8f1fb" stroke="#2878b5" stroke-width="2"/><text class="t" x="92" y="34" text-anchor="middle">Source of truth</text><text class="s" x="92" y="63" text-anchor="middle">intent, inventory,</text><text class="s" x="92" y="84" text-anchor="middle">owner, policy</text></g><path class="a" d="M260 153H315"/>
  <g transform="translate(320 100)"><rect width="185" height="105" rx="7" fill="#eaf6ef" stroke="#2f855a" stroke-width="2"/><text class="t" x="92" y="34" text-anchor="middle">Render + diff</text><text class="s" x="92" y="63" text-anchor="middle">deterministic template</text><text class="s" x="92" y="84" text-anchor="middle">minimal intended delta</text></g><path class="a" d="M510 153H565"/>
  <g transform="translate(570 100)"><rect width="185" height="105" rx="7" fill="#fff4dd" stroke="#b7791f" stroke-width="2"/><text class="t" x="92" y="34" text-anchor="middle">Pre-validate</text><text class="s" x="92" y="63" text-anchor="middle">syntax, policy, reachability,</text><text class="s" x="92" y="84" text-anchor="middle">capacity, rollback</text></g><path class="a" d="M760 153H815"/>
  <g transform="translate(820 100)"><rect width="145" height="105" rx="7" fill="#f2edfb" stroke="#7651a8" stroke-width="2"/><text class="t" x="72" y="34" text-anchor="middle">Canary</text><text class="s" x="72" y="63" text-anchor="middle">small fault domain</text><text class="s" x="72" y="84" text-anchor="middle">bounded window</text></g><path class="a" d="M970 153H1025"/>
  <g transform="translate(1030 100)"><rect width="120" height="105" rx="7" fill="#e8f5f5" stroke="#267d7d" stroke-width="2"/><text class="t" x="60" y="34" text-anchor="middle">Observe</text><text class="s" x="60" y="63" text-anchor="middle">guardrails</text><text class="s" x="60" y="84" text-anchor="middle">and SLI</text></g>
  <path class="a" d="M1090 210V270H850"/><polygon points="850,270 760,320 850,370 940,320" fill="#f7f9fb" stroke="#596b78" stroke-width="2"/><text class="t" x="850" y="316" text-anchor="middle">Healthy?</text><text class="s" x="850" y="339" text-anchor="middle">after settling period</text>
  <path class="a" d="M760 320H565"/><g transform="translate(380 270)"><rect width="180" height="100" rx="7" fill="#fbeaea" stroke="#b64a4a" stroke-width="2"/><text class="t" x="90" y="34" text-anchor="middle">Rollback</text><text class="s" x="90" y="63" text-anchor="middle">restore known state</text><text class="s" x="90" y="84" text-anchor="middle">verify and investigate</text></g><text class="s" x="660" y="307" text-anchor="middle">no</text>
  <path class="a" d="M850 375V430H1035"/><g transform="translate(1035 385)"><rect width="115" height="100" rx="7" fill="#eaf6ef" stroke="#2f855a" stroke-width="2"/><text class="t" x="57" y="34" text-anchor="middle">Commit</text><text class="s" x="57" y="63" text-anchor="middle">expand</text><text class="s" x="57" y="84" text-anchor="middle">and record</text></g><text class="s" x="870" y="416">yes</text>
  <path class="a" d="M380 320H205V207"/><text class="s" x="215" y="300">new hypothesis and corrected intent</text>
  <text class="s" x="600" y="545" text-anchor="middle">Idempotence prevents retries from accumulating side effects; transactional mechanisms reduce partial-state exposure.</text>
</svg>
