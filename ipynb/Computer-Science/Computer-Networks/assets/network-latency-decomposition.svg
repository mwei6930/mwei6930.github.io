<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Network and application latency decomposition</title>
  <desc id="desc">A request waterfall separates DNS, connection, TLS, server processing, and transfer time, while a packet path separates processing, queueing, transmission, and propagation delay.</desc>
  <rect width="1200" height="600" fill="#fff"/>
  <style>.h{font:700 27px Arial,sans-serif;fill:#18232d}.t{font:700 18px Arial,sans-serif;fill:#18232d}.s{font:15px Arial,sans-serif;fill:#3d4e5c}.axis{stroke:#64748b;stroke-width:2}.dash{stroke:#aab4bd;stroke-width:1;stroke-dasharray:5 5}</style>
  <text class="h" x="600" y="42" text-anchor="middle">Latency Is a Sum of Different Mechanisms</text>
  <text class="t" x="75" y="92">Packet path</text>
  <g transform="translate(70 118)">
    <rect width="190" height="66" rx="6" fill="#e8f1fb" stroke="#2878b5"/><text class="t" x="95" y="29" text-anchor="middle">Processing</text><text class="s" x="95" y="52" text-anchor="middle">header lookup</text>
    <rect x="215" width="190" height="66" rx="6" fill="#fff4dd" stroke="#b7791f"/><text class="t" x="310" y="29" text-anchor="middle">Queueing</text><text class="s" x="310" y="52" text-anchor="middle">waiting for service</text>
    <rect x="430" width="190" height="66" rx="6" fill="#eaf6ef" stroke="#2f855a"/><text class="t" x="525" y="29" text-anchor="middle">Transmission</text><text class="s" x="525" y="52" text-anchor="middle">L / link rate</text>
    <rect x="645" width="190" height="66" rx="6" fill="#f2edfb" stroke="#7651a8"/><text class="t" x="740" y="29" text-anchor="middle">Propagation</text><text class="s" x="740" y="52" text-anchor="middle">distance / signal speed</text>
    <text class="t" x="865" y="40">= one-hop delay</text>
  </g>
  <text class="s" x="70" y="216">Queueing is workload-dependent; propagation is mostly path-dependent; transmission depends on packet size and bottleneck rate.</text>
  <text class="t" x="75" y="276">HTTPS request waterfall</text>
  <line class="axis" x1="210" y1="500" x2="1110" y2="500"/>
  <g class="s" text-anchor="middle"><text x="210" y="527">0</text><text x="390" y="527">40</text><text x="570" y="527">80</text><text x="750" y="527">120</text><text x="930" y="527">160</text><text x="1110" y="527">200 ms</text></g>
  <g class="dash"><line x1="390" y1="305" x2="390" y2="500"/><line x1="570" y1="305" x2="570" y2="500"/><line x1="750" y1="305" x2="750" y2="500"/><line x1="930" y1="305" x2="930" y2="500"/></g>
  <g class="t" text-anchor="end"><text x="190" y="335">DNS</text><text x="190" y="375">TCP / QUIC</text><text x="190" y="415">TLS</text><text x="190" y="455">Server</text><text x="190" y="495">Transfer</text></g>
  <rect x="210" y="314" width="126" height="27" fill="#2878b5"/><rect x="336" y="354" width="180" height="27" fill="#2f855a"/><rect x="516" y="394" width="207" height="27" fill="#7651a8"/><rect x="723" y="434" width="248" height="27" fill="#b7791f"/><rect x="971" y="474" width="117" height="27" fill="#b64a4a"/>
  <g class="s" fill="#fff"><text x="273" y="333" text-anchor="middle" fill="#fff">28 ms</text><text x="426" y="373" text-anchor="middle" fill="#fff">40 ms</text><text x="620" y="413" text-anchor="middle" fill="#fff">46 ms</text><text x="847" y="453" text-anchor="middle" fill="#fff">55 ms</text><text x="1030" y="493" text-anchor="middle" fill="#fff">26 ms</text></g>
  <text class="s" x="600" y="570" text-anchor="middle">The same total latency can require completely different fixes; preserve phase-level timing.</text>
</svg>
