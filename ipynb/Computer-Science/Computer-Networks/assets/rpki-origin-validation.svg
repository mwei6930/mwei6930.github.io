<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">RPKI route origin validation states</title>
  <desc id="desc">A route origin authorization permits AS 65001 to originate 203.0.113.0 slash 24 with maximum length 24. Matching, wrong-origin, too-specific, and uncovered announcements become valid, invalid, or not found.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2457a7"/></marker>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#172033}.section{font:700 23px Arial,sans-serif;fill:#172033}.txt{font:19px Arial,sans-serif;fill:#172033}.small{font:16px Arial,sans-serif;fill:#455269}.mono{font:18px Consolas,monospace;fill:#172033}.white{font:700 19px Arial,sans-serif;fill:#fff}.arrow{stroke:#2457a7;stroke-width:5;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1600" height="920" fill="#fff"/>
  <text x="65" y="62" class="title">RPKI Route Origin Validation checks prefix, maximum length, and origin AS</text>

  <rect x="70" y="125" width="445" height="235" rx="10" fill="#f3ebfa" stroke="#7a4ca0" stroke-width="3"/>
  <text x="105" y="172" class="section">Signed ROA object</text>
  <text x="105" y="220" class="mono">prefix:    203.0.113.0/24</text>
  <text x="105" y="260" class="mono">maxLength: 24</text>
  <text x="105" y="300" class="mono">origin AS: 65001</text>
  <text x="105" y="338" class="small">Published through the RPKI repository hierarchy.</text>

  <rect x="620" y="125" width="360" height="235" rx="10" fill="#eef4fb" stroke="#2457a7" stroke-width="3"/>
  <text x="665" y="172" class="section">Local validator</text>
  <text x="655" y="220" class="txt">Fetch and cryptographically</text><text x="655" y="250" class="txt">validate RPKI objects.</text>
  <text x="655" y="298" class="small">Export validated ROA payloads</text><text x="655" y="325" class="small">to routers for routing policy.</text>
  <path d="M515 243 L620 243" class="arrow"/>

  <rect x="1080" y="125" width="450" height="235" rx="10" fill="#f8fafc" stroke="#9aa9bd" stroke-width="3"/>
  <text x="1120" y="172" class="section">BGP announcement</text>
  <text x="1120" y="220" class="txt">Compare announced prefix and</text><text x="1120" y="250" class="txt">rightmost AS_PATH origin with</text><text x="1120" y="280" class="txt">covering validated ROAs.</text>
  <text x="1120" y="325" class="small">The result informs local import policy.</text>
  <path d="M980 243 L1080 243" class="arrow"/>

  <g>
    <rect x="70" y="455" width="710" height="90" rx="9" fill="#eef8f3" stroke="#147a54" stroke-width="3"/>
    <text x="100" y="492" class="mono">203.0.113.0/24, origin AS65001</text><text x="585" y="510" class="section" fill="#147a54">VALID</text>
    <text x="100" y="526" class="small">Covered, prefix length allowed, origin matches.</text>

    <rect x="820" y="455" width="710" height="90" rx="9" fill="#fdf0ec" stroke="#b5473a" stroke-width="3"/>
    <text x="850" y="492" class="mono">203.0.113.0/24, origin AS65009</text><text x="1330" y="510" class="section" fill="#b5473a">INVALID</text>
    <text x="850" y="526" class="small">A covering ROA exists, but the origin AS is wrong.</text>

    <rect x="70" y="580" width="710" height="90" rx="9" fill="#fdf0ec" stroke="#b5473a" stroke-width="3"/>
    <text x="100" y="617" class="mono">203.0.113.0/25, origin AS65001</text><text x="585" y="635" class="section" fill="#b5473a">INVALID</text>
    <text x="100" y="651" class="small">Origin matches, but /25 is longer than maxLength /24.</text>

    <rect x="820" y="580" width="710" height="90" rx="9" fill="#fff8e6" stroke="#d59b20" stroke-width="3"/>
    <text x="850" y="617" class="mono">198.51.100.0/24, origin AS65008</text><text x="1315" y="635" class="section">NOT FOUND</text>
    <text x="850" y="651" class="small">No validated ROA covers this prefix.</text>
  </g>

  <rect x="175" y="745" width="1250" height="125" rx="10" fill="#f8fafc" stroke="#9aa9bd" stroke-width="2"/>
  <text x="210" y="785" class="section">What origin validation does not prove</text>
  <text x="210" y="825" class="txt">It does not validate the entire AS_PATH, customer-provider export policy, or whether traffic reaches the intended service.</text>
  <text x="210" y="854" class="small">ROV mitigates accidental or malicious mis-origination; route leaks and forged path relationships require additional controls.</text>
</svg>
