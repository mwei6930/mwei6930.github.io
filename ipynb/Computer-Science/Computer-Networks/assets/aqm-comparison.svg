<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 730" role="img" aria-labelledby="title desc">
  <title id="title">Drop-tail, RED, CoDel, and PIE queue feedback</title>
  <desc id="desc">Four queue timelines show drop-tail waiting for overflow, RED using average queue thresholds, CoDel reacting to persistently high packet sojourn time, and PIE controlling estimated queue delay with a feedback controller. ECN can turn an early drop decision into a mark for capable traffic.</desc>
  <style>.t{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#172554}.h{font-size:28px;font-weight:700}.s{font-size:19px;font-weight:700}.b{font-size:14px}.n{font-size:12px;fill:#475569}.p{fill:#fff;stroke:#94a3b8;stroke-width:2}.axis{stroke:#475569;stroke-width:2}.target{stroke:#16a34a;stroke-width:2;stroke-dasharray:8 6}</style>
  <rect width="1280" height="730" fill="#f8fafc"/><text x="640" y="43" text-anchor="middle" class="t h">AQM sends congestion feedback before a queue becomes permanently full</text>
  <g class="t">
    <rect x="35" y="80" width="585" height="280" rx="10" class="p"/><text x="65" y="115" class="s">Drop-tail: react only at the hard limit</text>
    <line x1="90" y1="305" x2="565" y2="305" class="axis"/><line x1="90" y1="305" x2="90" y2="150" class="axis"/>
    <line x1="90" y1="170" x2="565" y2="170" stroke="#dc2626" stroke-width="3"/><text x="475" y="160" class="b" fill="#b91c1c">buffer limit</text>
    <path d="M95 295 C170 290 210 255 250 205 C310 165 400 170 555 170" fill="none" stroke="#2563eb" stroke-width="5"/>
    <g fill="#dc2626"><circle cx="365" cy="170" r="7"/><circle cx="420" cy="170" r="7"/><circle cx="480" cy="170" r="7"/></g><text x="330" y="335" text-anchor="middle" class="b">overflow causes clustered losses and a standing queue</text>

    <rect x="660" y="80" width="585" height="280" rx="10" class="p"/><text x="690" y="115" class="s">RED: random early signal from average queue</text>
    <line x1="715" y1="305" x2="1190" y2="305" class="axis"/><line x1="715" y1="305" x2="715" y2="150" class="axis"/>
    <line x1="715" y1="245" x2="1190" y2="245" class="target"/><line x1="715" y1="180" x2="1190" y2="180" stroke="#f59e0b" stroke-width="2" stroke-dasharray="8 6"/><text x="1110" y="236" class="n">min threshold</text><text x="1110" y="171" class="n">max threshold</text>
    <path d="M720 295 C800 285 845 250 900 220 C955 195 1025 188 1180 190" fill="none" stroke="#2563eb" stroke-width="5"/>
    <g fill="#f59e0b"><circle cx="900" cy="220" r="7"/><circle cx="965" cy="199" r="7"/><circle cx="1035" cy="191" r="7"/></g><text x="952" y="335" text-anchor="middle" class="b">mark/drop probability rises between thresholds</text>

    <rect x="35" y="390" width="585" height="280" rx="10" class="p"/><text x="65" y="425" class="s">CoDel: measure packet sojourn time</text>
    <line x1="90" y1="615" x2="565" y2="615" class="axis"/><line x1="90" y1="615" x2="90" y2="460" class="axis"/>
    <line x1="90" y1="555" x2="565" y2="555" class="target"/><text x="475" y="546" class="n">delay target</text>
    <path d="M95 605 C155 590 205 520 265 535 C330 548 375 505 430 520 C490 535 520 565 555 570" fill="none" stroke="#7c3aed" stroke-width="5"/>
    <path d="M250 548 L250 470 L425 470 L425 548" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="7 5"/><text x="338" y="487" text-anchor="middle" class="n">above target for an interval</text><text x="330" y="645" text-anchor="middle" class="b">persistent delay enters a controlled mark/drop state</text>

    <rect x="660" y="390" width="585" height="280" rx="10" class="p"/><text x="690" y="425" class="s">PIE: feedback-control estimated queue delay</text>
    <line x1="715" y1="615" x2="1190" y2="615" class="axis"/><line x1="715" y1="615" x2="715" y2="460" class="axis"/>
    <line x1="715" y1="545" x2="1190" y2="545" class="target"/><text x="1100" y="536" class="n">delay reference</text>
    <path d="M720 605 C780 590 820 500 875 515 C930 530 965 565 1010 550 C1060 532 1110 540 1180 545" fill="none" stroke="#2563eb" stroke-width="5"/>
    <path d="M865 485 C950 455 1050 465 1130 495" fill="none" stroke="#f59e0b" stroke-width="4"/><text x="1000" y="475" text-anchor="middle" class="n">controller adjusts signal probability</text><text x="952" y="645" text-anchor="middle" class="b">error and trend move the average delay toward a target</text>
  </g>
  <rect x="270" y="685" width="740" height="30" rx="7" fill="#dcfce7" stroke="#22c55e"/><text x="640" y="706" text-anchor="middle" class="t b">For ECN-capable packets, an AQM decision can mark CE instead of discarding useful data.</text>
</svg>
