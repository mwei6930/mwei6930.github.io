<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Life of an HTTPS request across the Internet</title>
  <desc id="desc">A browser joins a local network, resolves a name, selects an address, sends packets through access and transit networks, performs a secure handshake, and exchanges HTTP content with an edge server.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563a6"/>
    </marker>
  </defs>
  <rect width="1400" height="760" fill="#ffffff"/>
  <text x="700" y="46" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#172033">From a URL to an Authenticated Response</text>
  <text x="700" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#475569">Each stage creates state at a different layer and can fail independently</text>

  <g font-family="Arial, sans-serif">
    <rect x="40" y="142" width="170" height="105" rx="8" fill="#e8f2ff" stroke="#2563a6" stroke-width="3"/>
    <text x="125" y="179" text-anchor="middle" font-size="21" font-weight="700" fill="#164e78">Browser</text>
    <text x="125" y="209" text-anchor="middle" font-size="15" fill="#27364b">URL + HTTP semantics</text>

    <rect x="270" y="142" width="190" height="105" rx="8" fill="#e8f8ee" stroke="#2f855a" stroke-width="3"/>
    <text x="365" y="179" text-anchor="middle" font-size="21" font-weight="700" fill="#17623f">Local Network</text>
    <text x="365" y="209" text-anchor="middle" font-size="15" fill="#27364b">Wi-Fi/Ethernet, DHCP</text>

    <rect x="520" y="142" width="190" height="105" rx="8" fill="#fff6d8" stroke="#b7791f" stroke-width="3"/>
    <text x="615" y="179" text-anchor="middle" font-size="21" font-weight="700" fill="#8a4b10">Access Router</text>
    <text x="615" y="209" text-anchor="middle" font-size="15" fill="#27364b">Gateway, NAT, queue</text>

    <rect x="770" y="142" width="230" height="105" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="3"/>
    <text x="885" y="179" text-anchor="middle" font-size="21" font-weight="700" fill="#334155">Internet AS Path</text>
    <text x="885" y="209" text-anchor="middle" font-size="15" fill="#27364b">ISP, peering, routers</text>

    <rect x="1060" y="142" width="285" height="105" rx="8" fill="#f2ecff" stroke="#7c4dba" stroke-width="3"/>
    <text x="1202" y="179" text-anchor="middle" font-size="21" font-weight="700" fill="#5d338f">CDN / Origin Server</text>
    <text x="1202" y="209" text-anchor="middle" font-size="15" fill="#27364b">TLS identity + content</text>
  </g>

  <line x1="210" y1="194" x2="260" y2="194" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="460" y1="194" x2="510" y2="194" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="710" y1="194" x2="760" y2="194" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="1000" y1="194" x2="1050" y2="194" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="270" y="315" width="270" height="105" rx="8" fill="#fff8e8" stroke="#b7791f" stroke-width="3"/>
  <text x="405" y="352" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#8a4b10">Recursive DNS Resolver</text>
  <text x="405" y="382" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#27364b">Cache or iterative lookup</text>
  <path d="M125 247 V367 H260" fill="none" stroke="#b7791f" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M540 367 H1202 V257" fill="none" stroke="#b7791f" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#arrow)"/>

  <g font-family="Arial, sans-serif">
    <circle cx="125" cy="505" r="24" fill="#2563a6"/>
    <text x="125" y="512" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">1</text>
    <text x="165" y="500" font-size="17" font-weight="700" fill="#172033">Configure local reachability</text>
    <text x="165" y="524" font-size="15" fill="#475569">Address, prefix, default gateway, DNS resolver</text>

    <circle cx="125" cy="585" r="24" fill="#b7791f"/>
    <text x="125" y="592" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">2</text>
    <text x="165" y="580" font-size="17" font-weight="700" fill="#172033">Resolve and select a destination</text>
    <text x="165" y="604" font-size="15" fill="#475569">DNS returns candidate addresses; the client chooses a usable path</text>

    <circle cx="720" cy="505" r="24" fill="#2f855a"/>
    <text x="720" y="512" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">3</text>
    <text x="760" y="500" font-size="17" font-weight="700" fill="#172033">Forward packets hop by hop</text>
    <text x="760" y="524" font-size="15" fill="#475569">Link headers change; the IP datagram is routed toward the destination</text>

    <circle cx="720" cy="585" r="24" fill="#7c4dba"/>
    <text x="720" y="592" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">4</text>
    <text x="760" y="580" font-size="17" font-weight="700" fill="#172033">Create secure transport and exchange content</text>
    <text x="760" y="604" font-size="15" fill="#475569">TCP + TLS + HTTP/2, or QUIC + TLS + HTTP/3</text>
  </g>

  <path d="M125 655 H1202" stroke="#2563a6" stroke-width="5" marker-end="url(#arrowBlue)"/>
  <path d="M1202 698 H125" stroke="#7c4dba" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="662" y="646" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#164e78">request direction</text>
  <text x="662" y="725" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#5d338f">response direction (not necessarily the same inter-domain path)</text>
</svg>
