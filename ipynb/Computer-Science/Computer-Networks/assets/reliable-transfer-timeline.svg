<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">Alternating-bit protocol with a lost acknowledgment</title>
  <desc id="desc">A sender transmits data sequence zero. Its acknowledgment is lost, so the sender times out and retransmits. The receiver recognizes the duplicate, suppresses a second delivery, and repeats the acknowledgment.</desc>
  <defs>
    <marker id="blueArrow" markerWidth="11" markerHeight="11" refX="10" refY="3.5" orient="auto"><path d="M0 0 L0 7 L10 3.5 Z" fill="#2563eb"/></marker>
    <marker id="greenArrow" markerWidth="11" markerHeight="11" refX="10" refY="3.5" orient="auto"><path d="M0 0 L0 7 L10 3.5 Z" fill="#15803d"/></marker>
    <marker id="redArrow" markerWidth="11" markerHeight="11" refX="10" refY="3.5" orient="auto"><path d="M0 0 L0 7 L10 3.5 Z" fill="#dc2626"/></marker>
  </defs>
  <rect width="1200" height="690" fill="#f8fafc"/>
  <text x="600" y="44" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="29" font-weight="700" fill="#172554">A lost ACK must not duplicate application data</text>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="170" y="75" width="230" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="285" y="112" text-anchor="middle" font-size="22" font-weight="700" fill="#1e3a8a">Sender</text>
    <rect x="800" y="75" width="230" height="60" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="915" y="112" text-anchor="middle" font-size="22" font-weight="700" fill="#14532d">Receiver</text>
  </g>
  <line x1="285" y1="135" x2="285" y2="635" stroke="#64748b" stroke-width="3"/>
  <line x1="915" y1="135" x2="915" y2="635" stroke="#64748b" stroke-width="3"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">
    <line x1="285" y1="180" x2="915" y2="250" stroke="#2563eb" stroke-width="4" marker-end="url(#blueArrow)"/>
    <text x="565" y="190" text-anchor="middle" font-weight="700" fill="#1e40af">DATA(seq=0, payload=A)</text>
    <rect x="935" y="226" width="205" height="60" rx="7" fill="#ecfdf5" stroke="#16a34a"/>
    <text x="1037" y="250" text-anchor="middle" fill="#14532d">checksum valid</text>
    <text x="1037" y="274" text-anchor="middle" font-weight="700" fill="#14532d">deliver A once</text>

    <line x1="915" y1="300" x2="610" y2="335" stroke="#15803d" stroke-width="4" marker-end="url(#greenArrow)"/>
    <text x="785" y="301" text-anchor="middle" font-weight="700" fill="#166534">ACK(0)</text>
    <line x1="610" y1="335" x2="545" y2="343" stroke="#dc2626" stroke-width="5"/>
    <line x1="570" y1="323" x2="585" y2="356" stroke="#dc2626" stroke-width="5"/>
    <line x1="585" y1="323" x2="570" y2="356" stroke="#dc2626" stroke-width="5"/>
    <text x="650" y="372" text-anchor="middle" font-weight="700" fill="#b91c1c">ACK lost</text>

    <path d="M260 330 C175 360 175 445 260 470" fill="none" stroke="#dc2626" stroke-width="4" marker-end="url(#redArrow)"/>
    <text x="135" y="393" text-anchor="middle" font-weight="700" fill="#b91c1c">timer expires</text>
    <text x="135" y="418" text-anchor="middle" fill="#7f1d1d">delivery is unknown</text>

    <line x1="285" y1="475" x2="915" y2="535" stroke="#2563eb" stroke-width="4" stroke-dasharray="10 6" marker-end="url(#blueArrow)"/>
    <text x="570" y="476" text-anchor="middle" font-weight="700" fill="#1e40af">retransmit DATA(seq=0, payload=A)</text>
    <rect x="935" y="510" width="205" height="70" rx="7" fill="#fff7ed" stroke="#ea580c"/>
    <text x="1037" y="535" text-anchor="middle" fill="#9a3412">expected seq=1</text>
    <text x="1037" y="558" text-anchor="middle" font-weight="700" fill="#9a3412">discard duplicate A</text>

    <line x1="915" y1="590" x2="285" y2="625" stroke="#15803d" stroke-width="4" marker-end="url(#greenArrow)"/>
    <text x="610" y="589" text-anchor="middle" font-weight="700" fill="#166534">repeat ACK(0); sender can advance to seq=1</text>
  </g>

  <rect x="430" y="120" width="340" height="65" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="600" y="147" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#334155">Safety invariant</text>
  <text x="600" y="171" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#475569">Each sequence number is delivered at most once.</text>
</svg>
