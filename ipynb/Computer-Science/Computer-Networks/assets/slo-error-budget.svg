<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">Service level objective and error budget</title><desc id="desc">A 99.9 percent objective divides a time window into good service and an error budget, with burn-rate alerts across short and long windows.</desc>
  <rect width="1200" height="610" fill="#fff"/><style>.h{font:700 27px Arial,sans-serif;fill:#17212b}.t{font:700 18px Arial,sans-serif;fill:#17212b}.s{font:15px Arial,sans-serif;fill:#3d4e5c}.w{font:700 15px Arial,sans-serif;fill:#fff}</style>
  <text class="h" x="600" y="43" text-anchor="middle">An SLO Turns Reliability into a Finite Budget</text>
  <g transform="translate(70 95)"><text class="t" x="0" y="0">Event-based SLI</text><rect x="0" y="28" width="1060" height="62" rx="7" fill="#2f855a"/><rect x="1040" y="28" width="20" height="62" rx="3" fill="#b64a4a"/><text class="w" x="520" y="66" text-anchor="middle">99.9% good events</text><text class="s" x="1060" y="112" text-anchor="end">0.1% error budget</text><text class="s" x="0" y="112">good eligible requests / all eligible requests</text></g>
  <g transform="translate(70 260)"><text class="t" x="0" y="0">Budget accounting over a 30-day window</text><line x1="0" y1="230" x2="1060" y2="230" stroke="#657583" stroke-width="2"/><line x1="0" y1="40" x2="0" y2="230" stroke="#657583" stroke-width="2"/>
    <g class="s" text-anchor="middle"><text x="0" y="255">day 0</text><text x="350" y="255">day 10</text><text x="705" y="255">day 20</text><text x="1060" y="255">day 30</text></g>
    <path d="M0 50L130 62L250 71L360 118L470 130L580 143L680 151L790 205L900 215L1060 222" fill="none" stroke="#b64a4a" stroke-width="5"/>
    <path d="M0 50L1060 230" fill="none" stroke="#2f855a" stroke-width="2" stroke-dasharray="8 6"/>
    <text class="s" x="20" y="72">100% remaining</text><text class="s" x="870" y="202">budget nearly exhausted</text><text class="s" x="640" y="108">fast burn event</text><line x1="735" y1="115" x2="785" y2="185" stroke="#b7791f" stroke-width="2"/>
  </g>
  <g transform="translate(750 165)"><rect width="380" height="110" rx="7" fill="#f7f9fb" stroke="#7651a8"/><text class="t" x="18" y="32">Multi-window alert</text><text class="s" x="18" y="60">short window: detect fast user harm</text><text class="s" x="18" y="84">long window: reject transient noise</text></g>
  <text class="s" x="600" y="585" text-anchor="middle">Alert on consumption rate tied to user harm, not on every low-level metric crossing a static threshold.</text>
</svg>
