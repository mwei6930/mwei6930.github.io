<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
  <title id="title">Packet capture vantage points and offload artifacts</title>
  <desc id="desc">A host capture before NIC offload, a switch mirror, and a server capture observe different packet forms and timestamps.</desc>
  <rect width="1200" height="590" fill="#fff"/>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#516270"/></marker></defs>
  <style>.h{font:700 27px Arial,sans-serif;fill:#17212b}.t{font:700 18px Arial,sans-serif;fill:#17212b}.s{font:15px Arial,sans-serif;fill:#3d4e5c}.p{stroke:#516270;stroke-width:4;fill:none;marker-end:url(#a)}</style>
  <text class="h" x="600" y="44" text-anchor="middle">What You Capture Depends on Where You Stand</text>
  <g transform="translate(65 125)"><rect width="225" height="110" rx="7" fill="#e8f1fb" stroke="#2878b5" stroke-width="2"/><text class="t" x="112" y="36" text-anchor="middle">Application + kernel</text><text class="s" x="112" y="65" text-anchor="middle">large send buffer</text><text class="s" x="112" y="88" text-anchor="middle">socket timestamp</text></g>
  <path class="p" d="M290 180H390"/>
  <g transform="translate(390 125)"><rect width="170" height="110" rx="7" fill="#fff4dd" stroke="#b7791f" stroke-width="2"/><text class="t" x="85" y="36" text-anchor="middle">NIC</text><text class="s" x="85" y="65" text-anchor="middle">TSO / checksum</text><text class="s" x="85" y="88" text-anchor="middle">offload</text></g>
  <path class="p" d="M560 180H675"/>
  <g transform="translate(675 125)"><rect width="170" height="110" rx="7" fill="#eaf6ef" stroke="#2f855a" stroke-width="2"/><text class="t" x="85" y="36" text-anchor="middle">Switch</text><text class="s" x="85" y="65" text-anchor="middle">SPAN / TAP</text><text class="s" x="85" y="88" text-anchor="middle">wire packets</text></g>
  <path class="p" d="M845 180H945"/>
  <g transform="translate(945 125)"><rect width="190" height="110" rx="7" fill="#f2edfb" stroke="#7651a8" stroke-width="2"/><text class="t" x="95" y="36" text-anchor="middle">Remote host</text><text class="s" x="95" y="65" text-anchor="middle">post-path order</text><text class="s" x="95" y="88" text-anchor="middle">receiver clock</text></g>
  <g transform="translate(70 300)">
    <rect width="315" height="180" rx="7" fill="#f7f9fb" stroke="#8a99a6"/><text class="t" x="18" y="34">Host-side capture may show</text><text class="s" x="22" y="68">- oversized segments before TSO</text><text class="s" x="22" y="98">- incomplete checksum fields</text><text class="s" x="22" y="128">- timestamps before NIC queueing</text><text class="s" x="22" y="158">- only one namespace or interface</text>
  </g>
  <g transform="translate(442 300)">
    <rect width="315" height="180" rx="7" fill="#f7f9fb" stroke="#8a99a6"/><text class="t" x="18" y="34">A mirror or TAP may show</text><text class="s" x="22" y="68">- actual segmentation on the wire</text><text class="s" x="22" y="98">- drops if mirror egress overloads</text><text class="s" x="22" y="128">- VLAN tags changed by the switch</text><text class="s" x="22" y="158">- traffic outside the host namespace</text>
  </g>
  <g transform="translate(814 300)">
    <rect width="315" height="180" rx="7" fill="#f7f9fb" stroke="#8a99a6"/><text class="t" x="18" y="34">Remote capture may show</text><text class="s" x="22" y="68">- loss and reordering after the path</text><text class="s" x="22" y="98">- NAT or proxy-translated tuples</text><text class="s" x="22" y="128">- different clock offset and precision</text><text class="s" x="22" y="158">- no visibility into sender queues</text>
  </g>
  <text class="s" x="600" y="548" text-anchor="middle">A packet trace is an observation made at a vantage point, not a perfect copy of end-to-end reality.</text>
</svg>
