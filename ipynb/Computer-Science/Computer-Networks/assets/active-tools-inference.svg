<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">What active network tools can and cannot infer</title><desc id="desc">Five tools map to distinct questions, evidence, and caveats.</desc>
  <rect width="1200" height="620" fill="#fff"/><style>.h{font:700 27px Arial,sans-serif;fill:#17212b}.t{font:700 18px Arial,sans-serif;fill:#17212b}.s{font:15px Arial,sans-serif;fill:#3d4e5c}.w{font:14px Arial,sans-serif;fill:#fff}</style>
  <text class="h" x="600" y="43" text-anchor="middle">Active Tools Ask Different Questions</text>
  <g transform="translate(45 85)">
    <rect width="215" height="440" rx="7" fill="#f7f9fb" stroke="#2878b5" stroke-width="2"/><rect width="215" height="58" rx="7" fill="#2878b5"/><text class="w" x="107" y="36" text-anchor="middle" style="font-weight:700;font-size:20px">ping</text><text class="t" x="18" y="95">Question</text><text class="s" x="18" y="122">Does this ICMP exchange</text><text class="s" x="18" y="144">return, and how long?</text><text class="t" x="18" y="190">Evidence</text><text class="s" x="18" y="217">reply ratio, RTT, TTL</text><text class="t" x="18" y="263">Does not prove</text><text class="s" x="18" y="290">TCP port or application</text><text class="s" x="18" y="312">health; ICMP may be</text><text class="s" x="18" y="334">filtered or deprioritized</text><text class="t" x="18" y="384">Best use</text><text class="s" x="18" y="411">fast reachability and</text><text class="s" x="18" y="433">RTT baseline check</text>
  </g>
  <g transform="translate(280 85)">
    <rect width="215" height="440" rx="7" fill="#f7f9fb" stroke="#2f855a" stroke-width="2"/><rect width="215" height="58" rx="7" fill="#2f855a"/><text class="w" x="107" y="36" text-anchor="middle" style="font-weight:700;font-size:20px">traceroute</text><text class="t" x="18" y="95">Question</text><text class="s" x="18" y="122">Which hop responses are</text><text class="s" x="18" y="144">elicited for increasing TTL?</text><text class="t" x="18" y="190">Evidence</text><text class="s" x="18" y="217">TTL, responder, probe RTT</text><text class="t" x="18" y="263">Does not prove</text><text class="s" x="18" y="290">forwarding topology,</text><text class="s" x="18" y="312">reverse path, or a single</text><text class="s" x="18" y="334">stable ECMP route</text><text class="t" x="18" y="384">Best use</text><text class="s" x="18" y="411">path-change hypothesis</text><text class="s" x="18" y="433">with repeated probes</text>
  </g>
  <g transform="translate(515 85)">
    <rect width="215" height="440" rx="7" fill="#f7f9fb" stroke="#b7791f" stroke-width="2"/><rect width="215" height="58" rx="7" fill="#b7791f"/><text class="w" x="107" y="36" text-anchor="middle" style="font-weight:700;font-size:20px">iperf3</text><text class="t" x="18" y="95">Question</text><text class="s" x="18" y="122">What rate can controlled</text><text class="s" x="18" y="144">test flows sustain?</text><text class="t" x="18" y="190">Evidence</text><text class="s" x="18" y="217">rate, retransmits, UDP loss</text><text class="t" x="18" y="263">Does not prove</text><text class="s" x="18" y="290">application goodput under</text><text class="s" x="18" y="312">real object sizes, users,</text><text class="s" x="18" y="334">and policies</text><text class="t" x="18" y="384">Best use</text><text class="s" x="18" y="411">scheduled capacity test</text><text class="s" x="18" y="433">between controlled hosts</text>
  </g>
  <g transform="translate(750 85)">
    <rect width="215" height="440" rx="7" fill="#f7f9fb" stroke="#7651a8" stroke-width="2"/><rect width="215" height="58" rx="7" fill="#7651a8"/><text class="w" x="107" y="36" text-anchor="middle" style="font-weight:700;font-size:20px">DNS / TLS</text><text class="t" x="18" y="95">Question</text><text class="s" x="18" y="122">Can the named service be</text><text class="s" x="18" y="144">resolved and authenticated?</text><text class="t" x="18" y="190">Evidence</text><text class="s" x="18" y="217">rcode, answers, handshake</text><text class="t" x="18" y="263">Does not prove</text><text class="s" x="18" y="290">application correctness,</text><text class="s" x="18" y="312">authorization, or every</text><text class="s" x="18" y="334">resolver/client path</text><text class="t" x="18" y="384">Best use</text><text class="s" x="18" y="411">dependency and identity</text><text class="s" x="18" y="433">phase isolation</text>
  </g>
  <g transform="translate(985 85)">
    <rect width="170" height="440" rx="7" fill="#f7f9fb" stroke="#b64a4a" stroke-width="2"/><rect width="170" height="58" rx="7" fill="#b64a4a"/><text class="w" x="85" y="36" text-anchor="middle" style="font-weight:700;font-size:20px">HTTP</text><text class="t" x="15" y="95">Question</text><text class="s" x="15" y="122">Does a user-level</text><text class="s" x="15" y="144">transaction work?</text><text class="t" x="15" y="190">Evidence</text><text class="s" x="15" y="217">status, phases, bytes</text><text class="t" x="15" y="263">Does not prove</text><text class="s" x="15" y="290">root cause without</text><text class="s" x="15" y="312">lower-layer evidence</text><text class="t" x="15" y="384">Best use</text><text class="s" x="15" y="411">end-to-end SLI</text><text class="s" x="15" y="433">from user regions</text>
  </g>
  <text class="s" x="600" y="575" text-anchor="middle">Corroborate an inference with another vantage point or signal before changing production.</text>
</svg>
