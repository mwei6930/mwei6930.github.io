<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">How offered load creates a bottleneck queue and congestion</title>
  <desc id="desc">Packets from three senders enter a finite bottleneck queue. When arrivals persistently exceed service capacity, queueing delay rises, the buffer overflows, and useful throughput can fall because of wasted retransmission work.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#2563eb"/></marker>
    <marker id="redarrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#dc2626"/></marker>
    <style>
      .t{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#172554}.h{font-size:28px;font-weight:700}.s{font-size:18px;font-weight:700}.b{font-size:16px}.n{font-size:14px;fill:#475569}.panel{fill:#fff;stroke:#94a3b8;stroke-width:2}.axis{stroke:#64748b;stroke-width:2}.dash{stroke:#94a3b8;stroke-width:2;stroke-dasharray:8 7}
    </style>
  </defs>
  <rect width="1280" height="720" fill="#f8fafc"/>
  <text x="640" y="42" text-anchor="middle" class="t h">Congestion is persistent demand beyond a shared service rate</text>

  <rect x="35" y="82" width="1210" height="285" rx="10" class="panel"/>
  <g class="t">
    <text x="74" y="118" class="s">Offered load</text>
    <rect x="70" y="145" width="145" height="46" rx="7" fill="#dbeafe" stroke="#3b82f6"/><text x="142" y="174" text-anchor="middle" class="b">flow A: 45 Mb/s</text>
    <rect x="70" y="208" width="145" height="46" rx="7" fill="#dcfce7" stroke="#22c55e"/><text x="142" y="237" text-anchor="middle" class="b">flow B: 40 Mb/s</text>
    <rect x="70" y="271" width="145" height="46" rx="7" fill="#fef3c7" stroke="#f59e0b"/><text x="142" y="300" text-anchor="middle" class="b">flow C: 35 Mb/s</text>
    <text x="142" y="343" text-anchor="middle" class="s" fill="#b91c1c">120 Mb/s arrives</text>

    <line x1="222" y1="230" x2="350" y2="230" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow)"/>
    <rect x="365" y="130" width="460" height="200" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
    <text x="595" y="165" text-anchor="middle" class="s">Finite bottleneck buffer: B packets</text>
    <g stroke="#64748b"><rect x="410" y="205" width="65" height="72" fill="#fee2e2"/><rect x="475" y="205" width="65" height="72" fill="#dbeafe"/><rect x="540" y="205" width="65" height="72" fill="#dcfce7"/><rect x="605" y="205" width="65" height="72" fill="#fef3c7"/><rect x="670" y="205" width="65" height="72" fill="#fee2e2"/><rect x="735" y="205" width="45" height="72" fill="#fecaca"/></g>
    <text x="595" y="305" text-anchor="middle" class="b">queue occupancy Q(t) creates queueing delay</text>
    <line x1="825" y1="230" x2="1012" y2="230" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow)"/>
    <text x="920" y="205" text-anchor="middle" class="s">service C = 100 Mb/s</text>
    <rect x="1025" y="155" width="175" height="150" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="1112" y="211" text-anchor="middle" class="s">next link</text><text x="1112" y="241" text-anchor="middle" class="b">100 Mb/s leaves</text>
    <line x1="780" y1="187" x2="780" y2="110" stroke="#dc2626" stroke-width="4" marker-end="url(#redarrow)"/>
    <text x="842" y="105" class="s" fill="#b91c1c">overflow: drop</text>
  </g>

  <rect x="35" y="398" width="590" height="285" rx="10" class="panel"/>
  <g class="t">
    <text x="330" y="432" text-anchor="middle" class="s">Queue update during one interval</text>
    <text x="330" y="485" text-anchor="middle" font-family="Cambria Math,serif" font-size="25">Q(t+1) = min[B, max(0, Q(t) + A(t) - S(t))]</text>
    <rect x="78" y="528" width="500" height="105" rx="8" fill="#eff6ff" stroke="#60a5fa"/>
    <text x="102" y="557" class="b"><tspan font-weight="700">A(t)</tspan> = bytes or packets arriving</text>
    <text x="102" y="585" class="b"><tspan font-weight="700">S(t)</tspan> = service permitted by the bottleneck</text>
    <text x="102" y="613" class="b"><tspan font-weight="700">Stable queue:</tspan> long-run arrival rate must not exceed service rate</text>
  </g>

  <rect x="655" y="398" width="590" height="285" rx="10" class="panel"/>
  <g class="t">
    <text x="950" y="432" text-anchor="middle" class="s">As offered load crosses capacity</text>
    <line x1="715" y1="625" x2="1190" y2="625" class="axis"/><line x1="715" y1="625" x2="715" y2="465" class="axis"/>
    <line x1="970" y1="625" x2="970" y2="465" class="dash"/><text x="970" y="650" text-anchor="middle" class="n">capacity C</text>
    <path d="M720 615 C820 570 900 520 965 480 C1040 470 1120 485 1180 535" fill="none" stroke="#2563eb" stroke-width="5"/>
    <path d="M720 610 C835 608 900 590 960 540 C1015 500 1080 470 1180 455" fill="none" stroke="#dc2626" stroke-width="5"/>
    <text x="1070" y="548" class="b" fill="#1d4ed8">useful throughput</text><text x="1002" y="478" class="b" fill="#b91c1c">delay / loss</text>
    <text x="950" y="675" text-anchor="middle" class="n">offered load</text>
  </g>
</svg>
