<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">How traceroute uses hop limits and ICMP</title>
  <desc id="desc">A source sends probes with increasing TTL values. Each router that decrements TTL to zero returns ICMP Time Exceeded, revealing one hop. A final response identifies the destination.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2457a7"/></marker>
    <marker id="back" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b5473a"/></marker>
    <style>
      .title{font:700 35px Arial,sans-serif;fill:#172033}.section{font:700 24px Arial,sans-serif;fill:#172033}.txt{font:20px Arial,sans-serif;fill:#172033}.small{font:17px Arial,sans-serif;fill:#455269}.mono{font:18px Consolas,monospace;fill:#172033}.node{fill:#eef4fb;stroke:#2457a7;stroke-width:3}.router{fill:#fff8e6;stroke:#d59b20;stroke-width:3}.probe{stroke:#2457a7;stroke-width:5;fill:none;marker-end:url(#arrow)}.reply{stroke:#b5473a;stroke-width:4;stroke-dasharray:10 8;fill:none;marker-end:url(#back)}</style>
  </defs>
  <rect width="1600" height="900" fill="#fff"/>
  <text x="70" y="65" class="title">Traceroute reveals one forwarding hop at a time</text>
  <text x="70" y="105" class="txt">Every router decrements TTL. A router that produces zero discards the probe and sends ICMP Time Exceeded toward the source.</text>

  <g>
    <rect x="70" y="190" width="190" height="105" rx="12" class="node"/><text x="115" y="235" class="section">Source</text><text x="107" y="270" class="mono">192.0.2.10</text>
    <polygon points="410,185 485,185 535,242 485,299 410,299 360,242" class="router"/><text x="419" y="235" class="section">R1</text><text x="397" y="270" class="mono">10.0.0.1</text>
    <polygon points="715,185 790,185 840,242 790,299 715,299 665,242" class="router"/><text x="724" y="235" class="section">R2</text><text x="702" y="270" class="mono">10.0.1.1</text>
    <polygon points="1020,185 1095,185 1145,242 1095,299 1020,299 970,242" class="router"/><text x="1029" y="235" class="section">R3</text><text x="1007" y="270" class="mono">10.0.2.1</text>
    <rect x="1290" y="190" width="240" height="105" rx="12" class="node"/><text x="1335" y="235" class="section">Destination</text><text x="1340" y="270" class="mono">198.51.100.8</text>
    <path d="M260 242 L360 242" class="probe"/><path d="M535 242 L665 242" class="probe"/><path d="M840 242 L970 242" class="probe"/><path d="M1145 242 L1290 242" class="probe"/>
  </g>

  <g>
    <text x="85" y="390" class="section">Probe 1</text><text x="215" y="390" class="mono">TTL = 1</text>
    <path d="M315 380 L440 380" class="probe"/><circle cx="465" cy="380" r="23" fill="#b5473a"/><text x="457" y="388" style="font:700 24px Arial;fill:#fff">0</text>
    <path d="M440 420 C350 470 260 470 135 430" class="reply"/>
    <text x="520" y="388" class="txt">R1 replies: ICMP Time Exceeded</text>

    <text x="85" y="505" class="section">Probe 2</text><text x="215" y="505" class="mono">TTL = 2</text>
    <path d="M315 495 L745 495" class="probe"/><circle cx="770" cy="495" r="23" fill="#b5473a"/><text x="762" y="503" style="font:700 24px Arial;fill:#fff">0</text>
    <path d="M745 535 C560 595 330 595 135 545" class="reply"/>
    <text x="830" y="503" class="txt">R2 replies: ICMP Time Exceeded</text>

    <text x="85" y="620" class="section">Probe 3</text><text x="215" y="620" class="mono">TTL = 3</text>
    <path d="M315 610 L1050 610" class="probe"/><circle cx="1075" cy="610" r="23" fill="#b5473a"/><text x="1067" y="618" style="font:700 24px Arial;fill:#fff">0</text>
    <path d="M1050 650 C770 725 380 725 135 660" class="reply"/>
    <text x="1135" y="618" class="txt">R3 replies: ICMP Time Exceeded</text>

    <text x="85" y="760" class="section">Probe 4</text><text x="215" y="760" class="mono">TTL = 4</text>
    <path d="M315 750 L1360 750" class="probe"/>
    <path d="M1390 790 C1040 875 440 875 135 805" class="reply"/>
    <text x="990" y="805" class="txt">Destination response: reached</text>
  </g>

  <rect x="70" y="835" width="1460" height="48" rx="7" fill="#f8fafc" stroke="#9aa9bd"/>
  <text x="95" y="866" class="small">Round-trip times are measured to each response. Missing replies can mean filtering or rate limiting, not necessarily a broken forwarding path.</text>
</svg>
