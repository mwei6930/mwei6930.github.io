<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Link-state routing pipeline</title>
  <desc id="desc">Routers discover neighbors and local link costs, reliably flood link-state advertisements, build consistent link-state databases, and independently run shortest-path first.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2457a7"/></marker>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#172033}.section{font:700 23px Arial,sans-serif;fill:#172033}.txt{font:19px Arial,sans-serif;fill:#172033}.small{font:16px Arial,sans-serif;fill:#455269}.mono{font:17px Consolas,monospace;fill:#172033}.node{fill:#eef4fb;stroke:#2457a7;stroke-width:3}.arrow{stroke:#2457a7;stroke-width:4;fill:none;marker-end:url(#arrow)}.flood{stroke:#d59b20;stroke-width:4;fill:none;marker-end:url(#arrow)}.phase{fill:#f8fafc;stroke:#9aa9bd;stroke-width:2}</style>
  </defs>
  <rect width="1600" height="900" fill="#fff"/>
  <text x="65" y="62" class="title">Link-state routing: describe local links, flood globally, compute locally</text>

  <rect x="55" y="110" width="465" height="690" rx="10" class="phase"/>
  <text x="85" y="155" class="section">1. Discover and originate</text>
  <circle cx="275" cy="300" r="52" class="node"/><text x="257" y="308" class="section">A</text>
  <circle cx="135" cy="470" r="52" class="node"/><text x="117" y="478" class="section">B</text>
  <circle cx="410" cy="470" r="52" class="node"/><text x="392" y="478" class="section">C</text>
  <line x1="238" y1="338" x2="170" y2="430" stroke="#2457a7" stroke-width="5"/><line x1="312" y1="338" x2="374" y2="430" stroke="#2457a7" stroke-width="5"/><line x1="187" y1="470" x2="358" y2="470" stroke="#2457a7" stroke-width="5"/>
  <text x="185" y="385" class="mono">cost 2</text><text x="330" y="385" class="mono">cost 5</text><text x="245" y="450" class="mono">cost 1</text>
  <rect x="90" y="580" width="395" height="145" rx="8" fill="#fff" stroke="#2457a7"/>
  <text x="115" y="618" class="txt">A originates an LSA:</text><text x="115" y="654" class="mono">router=A, seq=41</text><text x="115" y="684" class="mono">links={(B,2),(C,5)}</text><text x="115" y="712" class="small">Only A authors A's local state.</text>

  <rect x="565" y="110" width="465" height="690" rx="10" class="phase"/>
  <text x="595" y="155" class="section">2. Reliably flood</text>
  <circle cx="680" cy="300" r="45" class="node"/><text x="664" y="308" class="section">A</text>
  <circle cx="910" cy="300" r="45" class="node"/><text x="894" y="308" class="section">B</text>
  <circle cx="680" cy="550" r="45" class="node"/><text x="664" y="558" class="section">C</text>
  <circle cx="910" cy="550" r="45" class="node"/><text x="894" y="558" class="section">D</text>
  <path d="M725 300 L858 300" class="flood"/><path d="M680 345 L680 498" class="flood"/><path d="M713 333 L878 517" class="flood"/><path d="M910 345 L910 498" class="flood"/><path d="M725 550 L858 550" class="flood"/>
  <rect x="610" y="640" width="375" height="90" rx="8" fill="#fff8e6" stroke="#d59b20"/>
  <text x="635" y="677" class="txt">Newer sequence number wins.</text><text x="635" y="708" class="small">Acknowledgments, retransmission, and aging</text><text x="635" y="731" class="small">make the database converge after change.</text>

  <rect x="1075" y="110" width="470" height="690" rx="10" class="phase"/>
  <text x="1105" y="155" class="section">3. Build LSDB and run SPF</text>
  <rect x="1120" y="205" width="380" height="190" rx="8" fill="#eef8f3" stroke="#147a54" stroke-width="2"/>
  <text x="1150" y="245" class="txt">Consistent area LSDB</text><text x="1150" y="282" class="mono">A: B/2, C/5</text><text x="1150" y="315" class="mono">B: A/2, C/1, D/4</text><text x="1150" y="348" class="mono">C: A/5, B/1, D/2</text><text x="1150" y="380" class="mono">D: B/4, C/2</text>
  <path d="M1310 405 L1310 485" class="arrow"/>
  <rect x="1120" y="500" width="380" height="215" rx="8" fill="#eef4fb" stroke="#2457a7" stroke-width="2"/>
  <text x="1150" y="540" class="txt">Each router runs Dijkstra</text><text x="1150" y="575" class="small">Root at A: next hop to D is B</text><text x="1150" y="606" class="mono">A-B-C-D, cost 5</text><text x="1150" y="646" class="small">Root at D produces a different tree,</text><text x="1150" y="674" class="small">from the same topology database.</text>

  <path d="M520 455 L565 455" class="arrow"/><path d="M1030 455 L1075 455" class="arrow"/>
  <text x="65" y="855" class="small">Flooding distributes topology facts. SPF derives next hops. The forwarded packet still uses the FIB and LPM described in Chapter 3.</text>
</svg>
