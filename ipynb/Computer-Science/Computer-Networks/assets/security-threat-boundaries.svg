<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Threat model for one HTTPS request</title>
  <desc id="desc">An end-to-end HTTPS path showing assets, trust boundaries, attacker positions, and controls.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .h{font:700 30px Arial,sans-serif;fill:#172033}.s{font:600 18px Arial,sans-serif;fill:#172033}.t{font:15px Arial,sans-serif;fill:#334155}.tiny{font:13px Arial,sans-serif;fill:#475569}.box{fill:#fff;stroke:#64748b;stroke-width:2}.zone{fill:#f8fafc;stroke:#94a3b8;stroke-width:2;stroke-dasharray:9 7}.risk{fill:#fff1f2;stroke:#e11d48;stroke-width:2}.control{fill:#ecfdf5;stroke:#059669;stroke-width:2}.asset{fill:#eff6ff;stroke:#2563eb;stroke-width:2}
    </style>
  </defs>
  <rect width="1280" height="760" fill="#ffffff"/>
  <text x="50" y="52" class="h">Threat model for one HTTPS request</text>
  <text x="50" y="80" class="t">Security starts by locating assets, trust boundaries, attacker capabilities, and assumptions.</text>

  <rect x="38" y="112" width="250" height="365" rx="8" class="zone"/>
  <text x="58" y="142" class="s">User-controlled zone</text>
  <rect x="66" y="175" width="190" height="82" rx="7" class="asset"/>
  <text x="161" y="207" text-anchor="middle" class="s">Browser</text>
  <text x="161" y="233" text-anchor="middle" class="tiny">cookies, credentials, plaintext</text>
  <rect x="66" y="292" width="190" height="82" rx="7" class="box"/>
  <text x="161" y="324" text-anchor="middle" class="s">OS trust store</text>
  <text x="161" y="350" text-anchor="middle" class="tiny">root CAs, resolver, clock</text>
  <rect x="66" y="408" width="190" height="44" rx="7" class="risk"/>
  <text x="161" y="436" text-anchor="middle" class="t">Compromised endpoint</text>

  <rect x="330" y="112" width="250" height="365" rx="8" class="zone"/>
  <text x="350" y="142" class="s">Access network</text>
  <rect x="360" y="175" width="190" height="82" rx="7" class="box"/>
  <text x="455" y="207" text-anchor="middle" class="s">Wi-Fi / gateway</text>
  <text x="455" y="233" text-anchor="middle" class="tiny">ARP, DHCP, DNS path</text>
  <rect x="360" y="292" width="190" height="82" rx="7" class="risk"/>
  <text x="455" y="320" text-anchor="middle" class="s">Local attacker</text>
  <text x="455" y="346" text-anchor="middle" class="tiny">observe, inject, replay, drop</text>
  <rect x="360" y="408" width="190" height="44" rx="7" class="control"/>
  <text x="455" y="436" text-anchor="middle" class="t">WPA3 + TLS + ECH</text>

  <rect x="622" y="112" width="250" height="365" rx="8" class="zone"/>
  <text x="642" y="142" class="s">Internet services</text>
  <rect x="652" y="175" width="190" height="72" rx="7" class="box"/>
  <text x="747" y="204" text-anchor="middle" class="s">DNS resolver</text>
  <text x="747" y="228" text-anchor="middle" class="tiny">queries and client metadata</text>
  <rect x="652" y="272" width="190" height="72" rx="7" class="box"/>
  <text x="747" y="301" text-anchor="middle" class="s">ISP / transit AS</text>
  <text x="747" y="325" text-anchor="middle" class="tiny">IP, size, timing, route</text>
  <rect x="652" y="369" width="190" height="72" rx="7" class="risk"/>
  <text x="747" y="398" text-anchor="middle" class="s">On-path adversary</text>
  <text x="747" y="422" text-anchor="middle" class="tiny">redirect, delay, suppress</text>

  <rect x="914" y="112" width="328" height="365" rx="8" class="zone"/>
  <text x="934" y="142" class="s">Service-controlled zone</text>
  <rect x="944" y="175" width="125" height="82" rx="7" class="asset"/>
  <text x="1006" y="207" text-anchor="middle" class="s">CDN edge</text>
  <text x="1006" y="233" text-anchor="middle" class="tiny">TLS keys, cache</text>
  <rect x="1087" y="175" width="125" height="82" rx="7" class="asset"/>
  <text x="1149" y="207" text-anchor="middle" class="s">Origin</text>
  <text x="1149" y="233" text-anchor="middle" class="tiny">data, sessions</text>
  <rect x="944" y="292" width="268" height="82" rx="7" class="box"/>
  <text x="1078" y="324" text-anchor="middle" class="s">Identity and policy plane</text>
  <text x="1078" y="350" text-anchor="middle" class="tiny">CA, authorization, logs, secrets</text>
  <rect x="944" y="408" width="268" height="44" rx="7" class="control"/>
  <text x="1078" y="436" text-anchor="middle" class="t">least privilege + monitoring</text>

  <path d="M256 216 H360" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M550 216 H652" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M842 216 H944" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1069 216 H1087" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="308" y="202" text-anchor="middle" class="tiny">request</text>
  <text x="601" y="202" text-anchor="middle" class="tiny">packets</text>
  <text x="892" y="202" text-anchor="middle" class="tiny">TLS</text>

  <rect x="38" y="510" width="1204" height="210" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="62" y="544" class="s">Reason from capability, not labels</text>
  <rect x="62" y="570" width="270" height="118" rx="7" class="risk"/>
  <text x="82" y="598" class="s">Passive</text><text x="82" y="625" class="t">read headers, sizes, timing</text><text x="82" y="650" class="t">cannot alter traffic</text>
  <rect x="355" y="570" width="270" height="118" rx="7" class="risk"/>
  <text x="375" y="598" class="s">Active on-path</text><text x="375" y="625" class="t">inject, replay, redirect, drop</text><text x="375" y="650" class="t">cannot forge valid signatures</text>
  <rect x="648" y="570" width="270" height="118" rx="7" class="risk"/>
  <text x="668" y="598" class="s">Compromised endpoint</text><text x="668" y="625" class="t">sees plaintext and live keys</text><text x="668" y="650" class="t">TLS cannot repair the host</text>
  <rect x="941" y="570" width="270" height="118" rx="7" class="control"/>
  <text x="961" y="598" class="s">Control objective</text><text x="961" y="625" class="t">state which threat is reduced</text><text x="961" y="650" class="t">and what remains exposed</text>
</svg>
