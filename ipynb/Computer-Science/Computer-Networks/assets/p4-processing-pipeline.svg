<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
  <title id="title">P4 protocol-independent processing pipeline</title><desc id="desc">The P4 source and target architecture compile to a parser, ingress and egress match-action stages, traffic manager, deparser, and control-plane table interface.</desc>
  <rect width="1200" height="590" fill="#fff"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#596b78"/></marker></defs><style>.h{font:700 27px Arial,sans-serif;fill:#17212b}.t{font:700 17px Arial,sans-serif;fill:#17212b}.s{font:14px Arial,sans-serif;fill:#3d4e5c}.a{stroke:#596b78;stroke-width:3;fill:none;marker-end:url(#a)}</style>
  <text class="h" x="600" y="43" text-anchor="middle">P4 Describes Packet Processing; the Target Defines Feasible Resources</text>
  <g transform="translate(55 88)"><rect width="265" height="90" rx="7" fill="#e8f1fb" stroke="#2878b5" stroke-width="2"/><text class="t" x="132" y="33" text-anchor="middle">P4 program</text><text class="s" x="132" y="59" text-anchor="middle">headers, parser, controls, tables,</text><text class="s" x="132" y="79" text-anchor="middle">actions, deparser</text></g>
  <g transform="translate(55 205)"><rect width="265" height="90" rx="7" fill="#fff4dd" stroke="#b7791f" stroke-width="2"/><text class="t" x="132" y="33" text-anchor="middle">Target architecture</text><text class="s" x="132" y="59" text-anchor="middle">ports, queues, externs, stages,</text><text class="s" x="132" y="79" text-anchor="middle">memory and concurrency contract</text></g>
  <path class="a" d="M325 133H390V250H455"/><path class="a" d="M325 250H455"/>
  <g transform="translate(455 205)"><rect width="165" height="90" rx="7" fill="#eaf6ef" stroke="#2f855a" stroke-width="2"/><text class="t" x="82" y="33" text-anchor="middle">Compiler</text><text class="s" x="82" y="59" text-anchor="middle">maps program to</text><text class="s" x="82" y="79" text-anchor="middle">target resources</text></g><path class="a" d="M625 250H700"/>
  <g transform="translate(700 88)"><rect width="440" height="330" rx="7" fill="#f7f9fb" stroke="#7651a8" stroke-width="2"/><text class="t" x="220" y="33" text-anchor="middle">Packet-processing target</text>
    <g transform="translate(20 62)"><rect width="105" height="68" rx="5" fill="#e8f1fb" stroke="#2878b5"/><text class="t" x="52" y="28" text-anchor="middle">Parser</text><text class="s" x="52" y="50" text-anchor="middle">extract fields</text><path class="a" d="M110 34H150"/><rect x="155" width="105" height="68" rx="5" fill="#eaf6ef" stroke="#2f855a"/><text class="t" x="207" y="28" text-anchor="middle">Ingress</text><text class="s" x="207" y="50" text-anchor="middle">match-action</text><path class="a" d="M265 34H305"/><rect x="310" width="90" height="68" rx="5" fill="#fff4dd" stroke="#b7791f"/><text class="t" x="355" y="28" text-anchor="middle">Queue</text><text class="s" x="355" y="50" text-anchor="middle">schedule</text></g>
    <g transform="translate(20 165)"><rect width="105" height="68" rx="5" fill="#f2edfb" stroke="#7651a8"/><text class="t" x="52" y="28" text-anchor="middle">Egress</text><text class="s" x="52" y="50" text-anchor="middle">match-action</text><path class="a" d="M110 34H150"/><rect x="155" width="105" height="68" rx="5" fill="#fbeaea" stroke="#b64a4a"/><text class="t" x="207" y="28" text-anchor="middle">Deparser</text><text class="s" x="207" y="50" text-anchor="middle">emit headers</text><path class="a" d="M265 34H305"/><rect x="310" width="90" height="68" rx="5" fill="#e8f5f5" stroke="#267d7d"/><text class="t" x="355" y="28" text-anchor="middle">Port</text><text class="s" x="355" y="50" text-anchor="middle">transmit</text></g>
    <text class="s" x="220" y="286" text-anchor="middle">registers, counters, meters, checksums, digests</text>
  </g>
  <g transform="translate(400 450)"><rect width="400" height="90" rx="7" fill="#e8f5f5" stroke="#267d7d" stroke-width="2"/><text class="t" x="200" y="34" text-anchor="middle">Runtime control plane</text><text class="s" x="200" y="62" text-anchor="middle">installs table entries; reads counters; receives events</text></g><path class="a" d="M800 495H920V423"/>
  <text class="s" x="600" y="575" text-anchor="middle">Portability requires matching the program's assumptions to each target architecture and compiler.</text>
</svg>
