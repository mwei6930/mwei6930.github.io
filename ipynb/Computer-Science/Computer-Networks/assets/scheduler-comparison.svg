<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Comparison of FIFO, strict priority, and deficit round robin scheduling</title>
  <desc id="desc">FIFO serves one arrival queue, strict priority can starve lower classes, and deficit round robin rotates across per-flow queues while credits allow variable packet sizes.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#2563eb"/></marker><style>.t{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#172554}.h{font-size:28px;font-weight:700}.s{font-size:19px;font-weight:700}.b{font-size:15px}.n{font-size:13px;fill:#475569}.p{fill:#fff;stroke:#94a3b8;stroke-width:2}</style></defs>
  <rect width="1280" height="720" fill="#f8fafc"/><text x="640" y="43" text-anchor="middle" class="t h">Scheduling decides which queued packet gets the next transmission opportunity</text>
  <g class="t">
    <rect x="35" y="82" width="380" height="585" rx="10" class="p"/><text x="225" y="120" text-anchor="middle" class="s">FIFO: one arrival order</text>
    <rect x="82" y="175" width="245" height="85" rx="7" fill="#f1f5f9" stroke="#64748b"/><g stroke="#64748b"><rect x="97" y="194" width="50" height="48" fill="#dbeafe"/><rect x="147" y="194" width="50" height="48" fill="#fee2e2"/><rect x="197" y="194" width="50" height="48" fill="#dcfce7"/><rect x="247" y="194" width="50" height="48" fill="#fef3c7"/></g>
    <line x1="327" y1="218" x2="382" y2="218" stroke="#2563eb" stroke-width="5" marker-end="url(#a)"/>
    <text x="225" y="300" text-anchor="middle" class="b">Simple and work-conserving</text><text x="225" y="330" text-anchor="middle" class="b">but one burst can delay every flow.</text>
    <rect x="80" y="385" width="290" height="165" rx="8" fill="#eff6ff" stroke="#60a5fa"/><text x="225" y="418" text-anchor="middle" class="b" font-weight="700">No isolation</text><text x="105" y="454" class="b">A large transfer at the head</text><text x="105" y="480" class="b">can add latency to a small</text><text x="105" y="506" class="b">interactive packet behind it.</text>

    <rect x="450" y="82" width="380" height="585" rx="10" class="p"/><text x="640" y="120" text-anchor="middle" class="s">Strict priority: highest class first</text>
    <text x="490" y="174" class="b" fill="#b91c1c">high</text><rect x="545" y="145" width="205" height="55" rx="6" fill="#fee2e2" stroke="#ef4444"/><g stroke="#ef4444"><rect x="565" y="160" width="48" height="25" fill="#fecaca"/><rect x="613" y="160" width="48" height="25" fill="#fecaca"/><rect x="661" y="160" width="48" height="25" fill="#fecaca"/></g>
    <text x="490" y="249" class="b" fill="#92400e">medium</text><rect x="545" y="220" width="205" height="55" rx="6" fill="#fef3c7" stroke="#f59e0b"/><rect x="565" y="235" width="48" height="25" fill="#fde68a" stroke="#f59e0b"/>
    <text x="490" y="324" class="b" fill="#166534">low</text><rect x="545" y="295" width="205" height="55" rx="6" fill="#dcfce7" stroke="#22c55e"/><rect x="565" y="310" width="48" height="25" fill="#bbf7d0" stroke="#22c55e"/>
    <line x1="750" y1="172" x2="795" y2="172" stroke="#2563eb" stroke-width="5" marker-end="url(#a)"/>
    <rect x="495" y="405" width="290" height="145" rx="8" fill="#fee2e2" stroke="#ef4444"/><text x="640" y="438" text-anchor="middle" class="b" font-weight="700">Starvation risk</text><text x="520" y="474" class="b">If high-priority traffic is always</text><text x="520" y="500" class="b">backlogged, lower queues may get</text><text x="520" y="526" class="b">no service without rate limits.</text>

    <rect x="865" y="82" width="380" height="585" rx="10" class="p"/><text x="1055" y="120" text-anchor="middle" class="s">DRR: rotate with byte credits</text>
    <text x="900" y="178" class="b">flow A</text><rect x="975" y="145" width="205" height="55" rx="6" fill="#dbeafe" stroke="#3b82f6"/><rect x="995" y="160" width="70" height="25" fill="#bfdbfe" stroke="#3b82f6"/>
    <text x="900" y="253" class="b">flow B</text><rect x="975" y="220" width="205" height="55" rx="6" fill="#dcfce7" stroke="#22c55e"/><rect x="995" y="235" width="110" height="25" fill="#bbf7d0" stroke="#22c55e"/>
    <text x="900" y="328" class="b">flow C</text><rect x="975" y="295" width="205" height="55" rx="6" fill="#fef3c7" stroke="#f59e0b"/><rect x="995" y="310" width="45" height="25" fill="#fde68a" stroke="#f59e0b"/>
    <path d="M1195 180 C1230 210 1230 300 1195 330" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/><path d="M962 330 C925 300 925 210 962 180" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/>
    <rect x="910" y="405" width="290" height="170" rx="8" fill="#dcfce7" stroke="#22c55e"/><text x="1055" y="438" text-anchor="middle" class="b" font-weight="700">Deficit counter</text><text x="935" y="474" class="b">Each visit adds a quantum.</text><text x="935" y="500" class="b">Send while packet size fits credit.</text><text x="935" y="526" class="b">Unused credit carries forward, so</text><text x="935" y="552" class="b">large packets are not excluded.</text>
  </g>
  <text x="640" y="697" text-anchor="middle" class="t n">Fair Queuing and Weighted Fair Queuing approximate fluid sharing more precisely; DRR is simpler for variable-size packets.</text>
</svg>
