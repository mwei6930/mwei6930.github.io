<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">TCP retransmission timeout estimator</title>
  <desc id="desc">A plot compares varying round-trip-time samples with a smoothed RTT estimate and a higher retransmission timeout that includes variation margin.</desc>
  <rect width="1200" height="610" fill="#f8fafc"/>
  <text x="600" y="42" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="29" font-weight="700" fill="#172554">RTO follows RTT, but leaves room for normal variation</text>
  <g transform="translate(80,90)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect width="700" height="430" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <line x1="75" y1="35" x2="75" y2="370" stroke="#334155" stroke-width="2"/>
    <line x1="75" y1="370" x2="650" y2="370" stroke="#334155" stroke-width="2"/>
    <g stroke="#e2e8f0" stroke-width="1">
      <line x1="75" y1="90" x2="650" y2="90"/><line x1="75" y1="160" x2="650" y2="160"/>
      <line x1="75" y1="230" x2="650" y2="230"/><line x1="75" y1="300" x2="650" y2="300"/>
    </g>
    <g font-size="14" fill="#475569">
      <text x="56" y="375" text-anchor="end">0</text><text x="56" y="305" text-anchor="end">50</text>
      <text x="56" y="235" text-anchor="end">100</text><text x="56" y="165" text-anchor="end">150</text>
      <text x="56" y="95" text-anchor="end">200</text>
      <text x="20" y="210" text-anchor="middle" transform="rotate(-90 20 210)">milliseconds</text>
      <text x="360" y="410" text-anchor="middle">measurement number</text>
      <text x="135" y="392" text-anchor="middle">1</text><text x="235" y="392" text-anchor="middle">2</text>
      <text x="335" y="392" text-anchor="middle">3</text><text x="435" y="392" text-anchor="middle">4</text>
      <text x="535" y="392" text-anchor="middle">5</text><text x="635" y="392" text-anchor="middle">6</text>
    </g>

    <polyline points="135,230 235,188 335,244 435,146 535,216 635,174" fill="none" stroke="#2563eb" stroke-width="4"/>
    <g fill="#2563eb"><circle cx="135" cy="230" r="6"/><circle cx="235" cy="188" r="6"/><circle cx="335" cy="244" r="6"/><circle cx="435" cy="146" r="6"/><circle cx="535" cy="216" r="6"/><circle cx="635" cy="174" r="6"/></g>
    <polyline points="135,230 235,225 335,227 435,217 535,217 635,212" fill="none" stroke="#15803d" stroke-width="4"/>
    <polyline points="135,90 235,97 335,112 435,101 535,115 635,116" fill="none" stroke="#d97706" stroke-width="4" stroke-dasharray="10 6"/>

    <g font-size="15" font-weight="700">
      <line x1="105" y1="30" x2="145" y2="30" stroke="#2563eb" stroke-width="4"/><text x="155" y="35" fill="#1e40af">SampleRTT</text>
      <line x1="255" y1="30" x2="295" y2="30" stroke="#15803d" stroke-width="4"/><text x="305" y="35" fill="#166534">SRTT</text>
      <line x1="390" y1="30" x2="430" y2="30" stroke="#d97706" stroke-width="4" stroke-dasharray="8 5"/><text x="440" y="35" fill="#92400e">RTO</text>
    </g>
  </g>

  <g transform="translate(825,115)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect width="320" height="350" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text x="160" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2937">RFC 6298 estimator</text>
    <text x="25" y="82" font-size="17" font-weight="700" fill="#166534">SRTT</text>
    <text x="25" y="109" font-size="16" fill="#334155">smooths recent RTT samples</text>
    <text x="25" y="149" font-size="17" font-weight="700" fill="#7c3aed">RTTVAR</text>
    <text x="25" y="176" font-size="16" fill="#334155">tracks prediction error</text>
    <text x="25" y="216" font-size="17" font-weight="700" fill="#92400e">RTO</text>
    <text x="25" y="246" font-size="16" fill="#334155">= SRTT + max(G, 4 x RTTVAR)</text>
    <line x1="25" y1="270" x2="295" y2="270" stroke="#cbd5e1"/>
    <text x="25" y="301" font-size="15" fill="#475569">Timeout: retransmit and double RTO.</text>
    <text x="25" y="329" font-size="15" fill="#475569">Do not sample ambiguous retransmits.</text>
  </g>
  <rect x="255" y="548" width="690" height="42" rx="7" fill="#fff7ed" stroke="#f97316"/>
  <text x="600" y="575" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#9a3412">Too small causes spurious retransmission; too large delays recovery from real loss.</text>
</svg>
