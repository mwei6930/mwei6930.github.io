<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 690" role="img" aria-labelledby="title desc">
  <title id="title">Loss, delay, and ECN congestion signals</title>
  <desc id="desc">Three sender-router-receiver paths compare inference from packet loss, inference from increasing RTT, and explicit ECN marking with CE, ECE, and CWR feedback.</desc>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#2563eb"/></marker>
    <marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#dc2626"/></marker>
    <style>.t{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#172554}.h{font-size:28px;font-weight:700}.s{font-size:19px;font-weight:700}.b{font-size:15px}.panel{fill:#fff;stroke:#94a3b8;stroke-width:2}.node{fill:#eff6ff;stroke:#3b82f6;stroke-width:2}</style>
  </defs>
  <rect width="1280" height="690" fill="#f8fafc"/><text x="640" y="43" text-anchor="middle" class="t h">A sender cannot see the queue directly: it learns through signals</text>
  <g class="t">
    <rect x="35" y="82" width="1210" height="170" rx="10" class="panel"/><text x="65" y="115" class="s">Loss-based inference</text>
    <rect x="85" y="145" width="145" height="62" rx="8" class="node"/><text x="157" y="181" text-anchor="middle" class="s">Sender</text>
    <rect x="520" y="135" width="230" height="82" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/><text x="635" y="169" text-anchor="middle" class="s">Full queue</text><text x="635" y="195" text-anchor="middle" class="b">packet is dropped</text>
    <rect x="1040" y="145" width="145" height="62" rx="8" class="node"/><text x="1112" y="181" text-anchor="middle" class="s">Receiver</text>
    <line x1="230" y1="175" x2="515" y2="175" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/><line x1="755" y1="175" x2="1035" y2="175" stroke="#94a3b8" stroke-width="4" stroke-dasharray="10 8"/>
    <path d="M1040 220 C810 260 450 260 230 220" fill="none" stroke="#dc2626" stroke-width="3" marker-end="url(#r)"/><text x="635" y="238" text-anchor="middle" class="b" fill="#b91c1c">timeout or duplicate ACKs imply a missing packet</text>

    <rect x="35" y="275" width="1210" height="170" rx="10" class="panel"/><text x="65" y="308" class="s">Delay-based inference</text>
    <rect x="85" y="338" width="145" height="62" rx="8" class="node"/><text x="157" y="374" text-anchor="middle" class="s">Sender</text>
    <rect x="500" y="327" width="270" height="85" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/><text x="635" y="359" text-anchor="middle" class="s">Growing queue</text><text x="635" y="386" text-anchor="middle" class="b">RTT - baseRTT increases</text>
    <rect x="1040" y="338" width="145" height="62" rx="8" class="node"/><text x="1112" y="374" text-anchor="middle" class="s">Receiver</text>
    <line x1="230" y1="370" x2="495" y2="370" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/><line x1="775" y1="370" x2="1035" y2="370" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/>
    <path d="M1040 415 C810 455 450 455 230 415" fill="none" stroke="#d97706" stroke-width="3" marker-end="url(#r)"/><text x="635" y="430" text-anchor="middle" class="b" fill="#92400e">ACK timing reveals queueing before overflow</text>

    <rect x="35" y="468" width="1210" height="185" rx="10" class="panel"/><text x="65" y="501" class="s">Network-assisted ECN feedback</text>
    <rect x="85" y="535" width="145" height="62" rx="8" class="node"/><text x="157" y="560" text-anchor="middle" class="s">Sender</text><text x="157" y="584" text-anchor="middle" class="b">ECT packet</text>
    <rect x="500" y="523" width="270" height="85" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="635" y="554" text-anchor="middle" class="s">AQM marks CE</text><text x="635" y="581" text-anchor="middle" class="b">signal instead of avoidable loss</text>
    <rect x="1040" y="535" width="145" height="62" rx="8" class="node"/><text x="1112" y="560" text-anchor="middle" class="s">Receiver</text><text x="1112" y="584" text-anchor="middle" class="b">returns ECE</text>
    <line x1="230" y1="565" x2="495" y2="565" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/><line x1="775" y1="565" x2="1035" y2="565" stroke="#16a34a" stroke-width="4" marker-end="url(#a)"/>
    <path d="M1040 610 C810 655 450 655 230 610" fill="none" stroke="#16a34a" stroke-width="3" marker-end="url(#r)"/><text x="635" y="630" text-anchor="middle" class="b" fill="#166534">ECE asks sender to reduce; CWR confirms response</text>
  </g>
</svg>
