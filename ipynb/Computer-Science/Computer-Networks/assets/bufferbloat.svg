<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 700" role="img" aria-labelledby="title desc">
  <title id="title">Burst absorption versus bufferbloat</title>
  <desc id="desc">Two bottleneck queues have the same link capacity. A managed queue absorbs a short burst and drains, while an oversized unmanaged queue remains full, gives similar throughput, and adds persistent latency.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#2563eb"/></marker><style>.t{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#172554}.h{font-size:28px;font-weight:700}.s{font-size:19px;font-weight:700}.b{font-size:15px}.n{font-size:13px;fill:#475569}.p{fill:#fff;stroke:#94a3b8;stroke-width:2}.axis{stroke:#475569;stroke-width:2}</style></defs>
  <rect width="1280" height="700" fill="#f8fafc"/><text x="640" y="43" text-anchor="middle" class="t h">A larger buffer can hide loss while making every packet wait</text>
  <g class="t">
    <rect x="35" y="80" width="585" height="570" rx="10" class="p"/><text x="327" y="116" text-anchor="middle" class="s">Burst absorption: queue returns to empty</text>
    <rect x="80" y="165" width="360" height="110" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <g stroke="#64748b"><rect x="105" y="192" width="62" height="55" fill="#dbeafe"/><rect x="167" y="192" width="62" height="55" fill="#dcfce7"/><rect x="229" y="192" width="62" height="55" fill="#fef3c7"/><rect x="291" y="192" width="62" height="55" fill="#fee2e2"/></g>
    <line x1="440" y1="220" x2="550" y2="220" stroke="#2563eb" stroke-width="5" marker-end="url(#a)"/><text x="495" y="196" text-anchor="middle" class="b">same C</text>
    <line x1="90" y1="525" x2="550" y2="525" class="axis"/><line x1="90" y1="525" x2="90" y2="330" class="axis"/>
    <path d="M95 515 L170 515 L205 365 L275 390 L345 455 L420 495 L520 515" fill="none" stroke="#2563eb" stroke-width="5"/>
    <line x1="95" y1="475" x2="520" y2="475" stroke="#16a34a" stroke-width="3" stroke-dasharray="8 6"/>
    <text x="318" y="359" class="b" fill="#1d4ed8">short queue spike</text><text x="318" y="466" class="b" fill="#15803d">target / low delay</text><text x="320" y="557" text-anchor="middle" class="n">time</text>
    <rect x="90" y="575" width="460" height="48" rx="7" fill="#dcfce7" stroke="#22c55e"/><text x="320" y="604" text-anchor="middle" class="b">Capacity is used, then latency recovers.</text>

    <rect x="660" y="80" width="585" height="570" rx="10" class="p"/><text x="952" y="116" text-anchor="middle" class="s">Bufferbloat: a standing queue persists</text>
    <rect x="705" y="145" width="390" height="155" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <g stroke="#64748b"><rect x="728" y="177" width="42" height="88" fill="#dbeafe"/><rect x="770" y="177" width="42" height="88" fill="#dcfce7"/><rect x="812" y="177" width="42" height="88" fill="#fef3c7"/><rect x="854" y="177" width="42" height="88" fill="#fee2e2"/><rect x="896" y="177" width="42" height="88" fill="#dbeafe"/><rect x="938" y="177" width="42" height="88" fill="#dcfce7"/><rect x="980" y="177" width="42" height="88" fill="#fef3c7"/><rect x="1022" y="177" width="42" height="88" fill="#fee2e2"/></g>
    <line x1="1095" y1="220" x2="1190" y2="220" stroke="#2563eb" stroke-width="5" marker-end="url(#a)"/><text x="1142" y="196" text-anchor="middle" class="b">same C</text>
    <line x1="715" y1="525" x2="1175" y2="525" class="axis"/><line x1="715" y1="525" x2="715" y2="330" class="axis"/>
    <path d="M720 515 L790 510 L835 355 L915 370 L995 365 L1080 380 L1150 375" fill="none" stroke="#dc2626" stroke-width="5"/>
    <line x1="720" y1="475" x2="1150" y2="475" stroke="#16a34a" stroke-width="3" stroke-dasharray="8 6"/>
    <text x="965" y="346" class="b" fill="#b91c1c">persistent queueing delay</text><text x="940" y="557" text-anchor="middle" class="n">time</text>
    <rect x="715" y="575" width="460" height="48" rx="7" fill="#fee2e2" stroke="#ef4444"/><text x="945" y="604" text-anchor="middle" class="b">Similar throughput, much worse interactive latency.</text>
  </g>
</svg>
