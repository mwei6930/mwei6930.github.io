<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
  <title id="title">TCP three-way handshake and endpoint states</title>
  <desc id="desc">A client sends SYN with initial sequence x, a server sends SYN ACK with initial sequence y and acknowledgment x plus one, and the client acknowledges y plus one. Both enter established state.</desc>
  <defs>
    <marker id="arrBlue" markerWidth="11" markerHeight="11" refX="10" refY="3.5" orient="auto"><path d="M0 0 L0 7 L10 3.5 Z" fill="#2563eb"/></marker>
    <marker id="arrGreen" markerWidth="11" markerHeight="11" refX="10" refY="3.5" orient="auto"><path d="M0 0 L0 7 L10 3.5 Z" fill="#15803d"/></marker>
  </defs>
  <rect width="1100" height="650" fill="#f8fafc"/>
  <text x="550" y="43" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="29" font-weight="700" fill="#172554">TCP synchronizes both directions before data transfer</text>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="110" y="75" width="260" height="64" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="240" y="104" text-anchor="middle" font-size="21" font-weight="700" fill="#1e3a8a">Client</text>
    <text x="240" y="128" text-anchor="middle" font-size="15" fill="#1e3a8a">active open: connect()</text>
    <rect x="730" y="75" width="260" height="64" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="860" y="104" text-anchor="middle" font-size="21" font-weight="700" fill="#14532d">Server</text>
    <text x="860" y="128" text-anchor="middle" font-size="15" fill="#14532d">passive open: listen()</text>
  </g>
  <line x1="240" y1="139" x2="240" y2="590" stroke="#64748b" stroke-width="3"/>
  <line x1="860" y1="139" x2="860" y2="590" stroke="#64748b" stroke-width="3"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="55" y="165" width="160" height="42" rx="6" fill="#eff6ff" stroke="#60a5fa"/>
    <text x="135" y="191" text-anchor="middle" font-size="16" font-weight="700" fill="#1e40af">SYN-SENT</text>
    <rect x="885" y="165" width="160" height="42" rx="6" fill="#f0fdf4" stroke="#4ade80"/>
    <text x="965" y="191" text-anchor="middle" font-size="16" font-weight="700" fill="#166534">LISTEN</text>

    <line x1="240" y1="220" x2="860" y2="300" stroke="#2563eb" stroke-width="4" marker-end="url(#arrBlue)"/>
    <rect x="420" y="220" width="260" height="50" rx="7" fill="#dbeafe" stroke="#2563eb"/>
    <text x="550" y="242" text-anchor="middle" font-size="17" font-weight="700" fill="#1e40af">SYN, seq = x</text>
    <text x="550" y="262" text-anchor="middle" font-size="14" fill="#1e40af">client chooses its initial sequence number</text>

    <rect x="885" y="295" width="160" height="42" rx="6" fill="#f0fdf4" stroke="#4ade80"/>
    <text x="965" y="321" text-anchor="middle" font-size="16" font-weight="700" fill="#166534">SYN-RECEIVED</text>
    <line x1="860" y1="355" x2="240" y2="435" stroke="#15803d" stroke-width="4" marker-end="url(#arrGreen)"/>
    <rect x="390" y="350" width="320" height="52" rx="7" fill="#dcfce7" stroke="#15803d"/>
    <text x="550" y="373" text-anchor="middle" font-size="17" font-weight="700" fill="#166534">SYN + ACK, seq = y, ack = x + 1</text>
    <text x="550" y="393" text-anchor="middle" font-size="14" fill="#166534">server proves it received the client's SYN</text>

    <line x1="240" y1="475" x2="860" y2="535" stroke="#2563eb" stroke-width="4" marker-end="url(#arrBlue)"/>
    <rect x="420" y="457" width="260" height="48" rx="7" fill="#dbeafe" stroke="#2563eb"/>
    <text x="550" y="478" text-anchor="middle" font-size="17" font-weight="700" fill="#1e40af">ACK, ack = y + 1</text>
    <text x="550" y="498" text-anchor="middle" font-size="14" fill="#1e40af">client proves it received the server's SYN</text>

    <rect x="55" y="535" width="160" height="42" rx="6" fill="#ecfdf5" stroke="#10b981"/>
    <text x="135" y="561" text-anchor="middle" font-size="16" font-weight="700" fill="#065f46">ESTABLISHED</text>
    <rect x="885" y="535" width="160" height="42" rx="6" fill="#ecfdf5" stroke="#10b981"/>
    <text x="965" y="561" text-anchor="middle" font-size="16" font-weight="700" fill="#065f46">ESTABLISHED</text>
  </g>

  <rect x="285" y="595" width="530" height="38" rx="7" fill="#fff7ed" stroke="#f97316"/>
  <text x="550" y="620" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#9a3412">SYN consumes one sequence number even when it carries no application byte.</text>
</svg>
