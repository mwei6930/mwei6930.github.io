<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 780" role="img" aria-labelledby="title desc">
  <title id="title">WebRTC signaling, ICE candidate checks, direct media, and TURN relay</title>
  <desc id="desc">Two browsers exchange session descriptions and ICE candidates through an application signaling service. STUN helps each learn a server-reflexive address, ICE tests candidate pairs, and media uses the best validated direct path when possible or a TURN relay when NAT or firewall policy prevents direct reachability.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#2563eb"/></marker><marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#16a34a"/></marker><marker id="o" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#d97706"/></marker><style>.t{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#172554}.h{font-size:28px;font-weight:700}.s{font-size:18px;font-weight:700}.b{font-size:14px}.n{font-size:12px;fill:#475569}</style></defs>
  <rect width="1360" height="780" fill="#f8fafc"/><text x="680" y="43" text-anchor="middle" class="t h">Signaling discovers possibilities; ICE validates an actual media path</text>
  <g class="t">
    <rect x="70" y="300" width="225" height="125" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/><text x="182" y="338" text-anchor="middle" class="s">Browser A</text><text x="182" y="366" text-anchor="middle" class="b">host + reflexive + relay candidates</text><text x="182" y="392" text-anchor="middle" class="n">capture, encode, jitter buffer</text>
    <rect x="1065" y="300" width="225" height="125" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="1177" y="338" text-anchor="middle" class="s">Browser B</text><text x="1177" y="366" text-anchor="middle" class="b">host + reflexive + relay candidates</text><text x="1177" y="392" text-anchor="middle" class="n">capture, encode, jitter buffer</text>
    <rect x="555" y="92" width="250" height="105" rx="10" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/><text x="680" y="126" text-anchor="middle" class="s">Application signaling</text><text x="680" y="153" text-anchor="middle" class="b">offer/answer + ICE candidates</text><text x="680" y="177" text-anchor="middle" class="n">WebSocket/HTTP; not defined by WebRTC</text>
    <path d="M250 300 C350 205 465 155 550 145" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/><path d="M810 145 C900 160 1010 220 1115 295" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/>

    <rect x="385" y="520" width="205" height="95" rx="9" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/><text x="487" y="554" text-anchor="middle" class="s">STUN server</text><text x="487" y="581" text-anchor="middle" class="b">observed public mapping</text><text x="487" y="602" text-anchor="middle" class="n">server-reflexive candidate</text>
    <rect x="770" y="520" width="205" height="95" rx="9" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/><text x="872" y="554" text-anchor="middle" class="s">TURN relay</text><text x="872" y="581" text-anchor="middle" class="b">allocated relay candidate</text><text x="872" y="602" text-anchor="middle" class="n">fallback costs bandwidth and latency</text>
    <path d="M235 425 C270 500 345 545 380 560" fill="none" stroke="#d97706" stroke-width="4" marker-end="url(#o)"/><path d="M1125 425 C1080 500 1025 545 980 560" fill="none" stroke="#d97706" stroke-width="4" marker-end="url(#o)"/>

    <path d="M295 335 C520 240 840 240 1060 335" fill="none" stroke="#16a34a" stroke-width="6" marker-end="url(#g)"/><text x="680" y="265" text-anchor="middle" class="s" fill="#15803d">preferred: validated direct SRTP media path</text>
    <path d="M295 405 C470 485 650 570 765 570" fill="none" stroke="#dc2626" stroke-width="4" marker-end="url(#a)"/><path d="M975 570 C1080 520 1115 475 1125 430" fill="none" stroke="#dc2626" stroke-width="4" marker-end="url(#a)"/><text x="680" y="690" text-anchor="middle" class="s" fill="#b91c1c">fallback: relay both directions through TURN</text>
    <rect x="300" y="710" width="760" height="43" rx="7" fill="#eff6ff" stroke="#60a5fa"/><text x="680" y="737" text-anchor="middle" class="b">ICE checks reachability and priority; it does not assume that a discovered address is usable.</text>
  </g>
</svg>
