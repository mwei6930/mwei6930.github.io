<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">Reproducible Mininet network experiment</title><desc id="desc">Linux network namespaces connect through virtual Ethernet pairs and a switch while traffic control imposes known delay, loss, and rate.</desc>
  <rect width="1200" height="610" fill="#fff"/><style>.h{font:700 27px Arial,sans-serif;fill:#17212b}.t{font:700 18px Arial,sans-serif;fill:#17212b}.s{font:15px Arial,sans-serif;fill:#3d4e5c}.link{stroke:#596b78;stroke-width:5}.imp{stroke:#b64a4a;stroke-width:7;stroke-dasharray:8 7}</style>
  <text class="h" x="600" y="43" text-anchor="middle">A Reproducible Network Experiment Is More Than a Topology</text>
  <g transform="translate(65 105)"><rect width="235" height="150" rx="7" fill="#e8f1fb" stroke="#2878b5" stroke-width="2"/><text class="t" x="117" y="34" text-anchor="middle">namespace h1</text><rect x="38" y="62" width="160" height="48" rx="5" fill="#fff" stroke="#2878b5"/><text class="s" x="118" y="92" text-anchor="middle">real TCP/IP stack</text><text class="s" x="117" y="137" text-anchor="middle">10.0.0.1/24</text></g>
  <line class="link" x1="300" y1="180" x2="490" y2="180"/><text class="s" x="395" y="160" text-anchor="middle">veth</text>
  <g transform="translate(490 120)"><rect width="220" height="120" rx="7" fill="#eaf6ef" stroke="#2f855a" stroke-width="2"/><text class="t" x="110" y="40" text-anchor="middle">virtual switch s1</text><text class="s" x="110" y="70" text-anchor="middle">Open vSwitch / bridge</text><text class="s" x="110" y="96" text-anchor="middle">real forwarding path</text></g>
  <line class="imp" x1="710" y1="180" x2="900" y2="180"/><text class="s" x="805" y="137" text-anchor="middle">tc netem / HTB</text><text class="s" x="805" y="160" text-anchor="middle">20 ms, 1% loss, 10 Mbit/s</text>
  <g transform="translate(900 105)"><rect width="235" height="150" rx="7" fill="#f2edfb" stroke="#7651a8" stroke-width="2"/><text class="t" x="117" y="34" text-anchor="middle">namespace h2</text><rect x="38" y="62" width="160" height="48" rx="5" fill="#fff" stroke="#7651a8"/><text class="s" x="118" y="92" text-anchor="middle">test server / sink</text><text class="s" x="117" y="137" text-anchor="middle">10.0.0.2/24</text></g>
  <g transform="translate(65 330)"><rect width="1070" height="175" rx="7" fill="#f7f9fb" stroke="#8b99a5"/><text class="t" x="535" y="35" text-anchor="middle">Experiment manifest</text><text class="s" x="30" y="72">Topology: host/switch graph, addresses, routes</text><text class="s" x="380" y="72">Treatment: delay, loss, rate, queue, direction</text><text class="s" x="760" y="72">Workload: command, duration, warm-up, seed</text><text class="s" x="30" y="108">Environment: OS, kernel, Mininet/tool versions</text><text class="s" x="380" y="108">Sampling: repetitions, independent unit, clocks</text><text class="s" x="760" y="108">Artifacts: raw stdout, PCAP, logs, hashes</text><text class="s" x="535" y="148" text-anchor="middle">Run ID = hash(manifest + code + input data) before interpreting results</text></g>
  <text class="s" x="600" y="565" text-anchor="middle">Emulation executes real protocol implementations, but shared host CPU and timing still differ from production hardware.</text>
</svg>
