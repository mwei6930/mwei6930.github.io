<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 720" role="img" aria-labelledby="title desc">
  <title id="title">Framing application messages over a TCP byte stream</title>
  <desc id="desc">An application message is serialized with a fixed-width length, type, request identifier, and payload. TCP may split or combine writes, so the receiver buffers arbitrary chunks, reads the header, waits for the declared body length, validates it, and dispatches one complete message.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#2563eb"/></marker><style>.t{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#172554}.h{font-size:28px;font-weight:700}.s{font-size:19px;font-weight:700}.b{font-size:15px}.n{font-size:13px;fill:#475569}.p{fill:#fff;stroke:#94a3b8;stroke-width:2}</style></defs>
  <rect width="1320" height="720" fill="#f8fafc"/><text x="660" y="43" text-anchor="middle" class="t h">TCP preserves byte order, not application message boundaries</text>
  <g class="t">
    <rect x="35" y="78" width="1250" height="220" rx="10" class="p"/><text x="70" y="116" class="s">Sender serializes one logical request</text>
    <rect x="80" y="160" width="170" height="74" fill="#dbeafe" stroke="#3b82f6"/><text x="165" y="190" text-anchor="middle" class="b" font-weight="700">length = 21</text><text x="165" y="214" text-anchor="middle" class="n">4 bytes, network order</text>
    <rect x="250" y="160" width="135" height="74" fill="#dcfce7" stroke="#22c55e"/><text x="317" y="190" text-anchor="middle" class="b" font-weight="700">type = PUT</text><text x="317" y="214" text-anchor="middle" class="n">1 byte</text>
    <rect x="385" y="160" width="190" height="74" fill="#fef3c7" stroke="#f59e0b"/><text x="480" y="190" text-anchor="middle" class="b" font-weight="700">request-id = 42</text><text x="480" y="214" text-anchor="middle" class="n">deduplicate retry</text>
    <rect x="575" y="160" width="360" height="74" fill="#ede9fe" stroke="#8b5cf6"/><text x="755" y="190" text-anchor="middle" class="b" font-weight="700">payload = serialized object</text><text x="755" y="214" text-anchor="middle" class="n">JSON, CBOR, Protobuf, or another schema</text>
    <line x1="955" y1="197" x2="1090" y2="197" stroke="#2563eb" stroke-width="5" marker-end="url(#a)"/><rect x="1100" y="150" width="135" height="95" rx="8" fill="#eff6ff" stroke="#2563eb"/><text x="1167" y="185" text-anchor="middle" class="b" font-weight="700">send bytes</text><text x="1167" y="211" text-anchor="middle" class="n">no record marker</text>

    <rect x="35" y="330" width="1250" height="350" rx="10" class="p"/><text x="70" y="369" class="s">Receiver observes arbitrary chunks and reconstructs frames</text>
    <text x="88" y="415" class="b" font-weight="700">recv() calls</text>
    <rect x="80" y="438" width="130" height="54" fill="#dbeafe" stroke="#3b82f6"/><text x="145" y="471" text-anchor="middle" class="b">3 bytes</text>
    <rect x="220" y="438" width="210" height="54" fill="#dcfce7" stroke="#22c55e"/><text x="325" y="471" text-anchor="middle" class="b">11 bytes</text>
    <rect x="440" y="438" width="115" height="54" fill="#fef3c7" stroke="#f59e0b"/><text x="497" y="471" text-anchor="middle" class="b">7 bytes</text>
    <rect x="565" y="438" width="250" height="54" fill="#ede9fe" stroke="#8b5cf6"/><text x="690" y="471" text-anchor="middle" class="b">two messages together</text>
    <line x1="835" y1="465" x2="925" y2="465" stroke="#2563eb" stroke-width="5" marker-end="url(#a)"/>
    <rect x="940" y="405" width="290" height="125" rx="8" fill="#eff6ff" stroke="#2563eb"/><text x="1085" y="438" text-anchor="middle" class="b" font-weight="700">accumulation buffer</text><text x="1085" y="466" text-anchor="middle" class="b">1. wait for fixed header</text><text x="1085" y="491" text-anchor="middle" class="b">2. parse and bound length</text><text x="1085" y="516" text-anchor="middle" class="b">3. wait for complete body</text>
    <path d="M1085 535 L1085 585 L770 585" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/>
    <rect x="465" y="555" width="295" height="78" rx="8" fill="#dcfce7" stroke="#16a34a"/><text x="612" y="585" text-anchor="middle" class="b" font-weight="700">validate then dispatch once</text><text x="612" y="611" text-anchor="middle" class="n">retain remaining bytes for the next frame</text>
    <rect x="80" y="555" width="320" height="78" rx="8" fill="#fee2e2" stroke="#ef4444"/><text x="240" y="585" text-anchor="middle" class="b" font-weight="700">reject invalid or oversized length</text><text x="240" y="611" text-anchor="middle" class="n">never allocate unbounded memory from peer input</text>
  </g>
</svg>
