<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">From an operational question to a measurement plan</title>
  <desc id="desc">A six-stage funnel turns a symptom into a falsifiable hypothesis, metric, vantage point, sampling plan, and decision rule.</desc>
  <rect width="1200" height="560" fill="#ffffff"/>
  <style>
    .h{font:700 27px Arial,sans-serif;fill:#17212b}.t{font:700 18px Arial,sans-serif;fill:#17212b}.s{font:15px Arial,sans-serif;fill:#394b59}.n{font:700 18px Arial,sans-serif;fill:#fff}.a{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#arrow)}
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
  <text class="h" x="600" y="45" text-anchor="middle">Operational Question -&gt; Defensible Measurement</text>
  <g transform="translate(55 105)">
    <rect width="155" height="145" rx="7" fill="#e8f1fb" stroke="#2878b5" stroke-width="2"/><circle cx="25" cy="25" r="16" fill="#2878b5"/><text class="n" x="25" y="31" text-anchor="middle">1</text><text class="t" x="16" y="62">Symptom</text><text class="s" x="16" y="88">Who, where, when?</text><text class="s" x="16" y="111">Failure or slowness?</text><text class="s" x="16" y="134">What still works?</text>
  </g>
  <path class="a" d="M215 178 H248"/>
  <g transform="translate(255 105)">
    <rect width="155" height="145" rx="7" fill="#eaf6ef" stroke="#2f855a" stroke-width="2"/><circle cx="25" cy="25" r="16" fill="#2f855a"/><text class="n" x="25" y="31" text-anchor="middle">2</text><text class="t" x="16" y="62">Hypothesis</text><text class="s" x="16" y="88">A mechanism that</text><text class="s" x="16" y="111">predicts evidence</text><text class="s" x="16" y="134">and can be rejected</text>
  </g>
  <path class="a" d="M415 178 H448"/>
  <g transform="translate(455 105)">
    <rect width="155" height="145" rx="7" fill="#fff4dd" stroke="#b7791f" stroke-width="2"/><circle cx="25" cy="25" r="16" fill="#b7791f"/><text class="n" x="25" y="31" text-anchor="middle">3</text><text class="t" x="16" y="62">Metric</text><text class="s" x="16" y="88">Quantity + unit</text><text class="s" x="16" y="111">Baseline + tail</text><text class="s" x="16" y="134">Success criterion</text>
  </g>
  <path class="a" d="M615 178 H648"/>
  <g transform="translate(655 105)">
    <rect width="155" height="145" rx="7" fill="#f2edfb" stroke="#7651a8" stroke-width="2"/><circle cx="25" cy="25" r="16" fill="#7651a8"/><text class="n" x="25" y="31" text-anchor="middle">4</text><text class="t" x="16" y="62">Vantage</text><text class="s" x="16" y="88">Client, server, link,</text><text class="s" x="16" y="111">device, or collector?</text><text class="s" x="16" y="134">Before or after NAT?</text>
  </g>
  <path class="a" d="M815 178 H848"/>
  <g transform="translate(855 105)">
    <rect width="155" height="145" rx="7" fill="#fbeaea" stroke="#b64a4a" stroke-width="2"/><circle cx="25" cy="25" r="16" fill="#b64a4a"/><text class="n" x="25" y="31" text-anchor="middle">5</text><text class="t" x="16" y="62">Sampling</text><text class="s" x="16" y="88">Window + cadence</text><text class="s" x="16" y="111">Independent unit</text><text class="s" x="16" y="134">Control comparison</text>
  </g>
  <path class="a" d="M1015 178 H1048"/>
  <g transform="translate(1055 105)">
    <rect width="100" height="145" rx="7" fill="#e8f5f5" stroke="#267d7d" stroke-width="2"/><circle cx="25" cy="25" r="16" fill="#267d7d"/><text class="n" x="25" y="31" text-anchor="middle">6</text><text class="t" x="12" y="62">Decision</text><text class="s" x="12" y="88">Reject?</text><text class="s" x="12" y="111">Escalate?</text><text class="s" x="12" y="134">Rollback?</text>
  </g>
  <rect x="165" y="332" width="870" height="135" rx="7" fill="#f7f9fb" stroke="#9aa7b2" stroke-width="2"/>
  <text class="t" x="600" y="370" text-anchor="middle">Example: users report a slow checkout</text>
  <text class="s" x="200" y="405">Hypothesis: a new TLS path adds handshakes</text><text class="s" x="620" y="405">Metric: client p95 TLS time, ms</text>
  <text class="s" x="200" y="437">Vantage: real client regions, not the server LAN</text><text class="s" x="620" y="437">Rule: rollback if p95 rises &gt; 80 ms for 10 min</text>
  <text class="s" x="600" y="515" text-anchor="middle">A tool is selected only after the question defines what evidence would change the decision.</text>
</svg>
