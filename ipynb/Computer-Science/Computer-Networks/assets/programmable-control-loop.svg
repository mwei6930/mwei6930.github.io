<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
  <title id="title">Intent-driven programmable network control loop</title><desc id="desc">Intent is compiled into device state, deployed gradually, observed, verified, and either committed or rolled back.</desc>
  <rect width="1200" height="590" fill="#fff"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#596b78"/></marker></defs><style>.h{font:700 27px Arial,sans-serif;fill:#17212b}.t{font:700 18px Arial,sans-serif;fill:#17212b}.s{font:15px Arial,sans-serif;fill:#3d4e5c}.a{stroke:#596b78;stroke-width:3;fill:none;marker-end:url(#a)}</style>
  <text class="h" x="600" y="43" text-anchor="middle">Programmability Changes Configuration into a Control System</text>
  <g transform="translate(60 105)"><rect width="175" height="105" rx="7" fill="#e8f1fb" stroke="#2878b5" stroke-width="2"/><text class="t" x="87" y="34" text-anchor="middle">Intent</text><text class="s" x="87" y="63" text-anchor="middle">reachability, isolation,</text><text class="s" x="87" y="84" text-anchor="middle">capacity, service policy</text></g><path class="a" d="M240 158H300"/>
  <g transform="translate(305 105)"><rect width="175" height="105" rx="7" fill="#eaf6ef" stroke="#2f855a" stroke-width="2"/><text class="t" x="87" y="34" text-anchor="middle">Compile</text><text class="s" x="87" y="63" text-anchor="middle">topology + inventory</text><text class="s" x="87" y="84" text-anchor="middle">to desired state</text></g><path class="a" d="M485 158H545"/>
  <g transform="translate(550 105)"><rect width="175" height="105" rx="7" fill="#fff4dd" stroke="#b7791f" stroke-width="2"/><text class="t" x="87" y="34" text-anchor="middle">Validate</text><text class="s" x="87" y="63" text-anchor="middle">schema, invariants,</text><text class="s" x="87" y="84" text-anchor="middle">reachability, capacity</text></g><path class="a" d="M730 158H790"/>
  <g transform="translate(795 105)"><rect width="145" height="105" rx="7" fill="#f2edfb" stroke="#7651a8" stroke-width="2"/><text class="t" x="72" y="34" text-anchor="middle">Deploy</text><text class="s" x="72" y="63" text-anchor="middle">canary, versioned</text><text class="s" x="72" y="84" text-anchor="middle">and reversible</text></g><path class="a" d="M945 158H1005"/>
  <g transform="translate(1010 105)"><rect width="130" height="105" rx="7" fill="#e8f5f5" stroke="#267d7d" stroke-width="2"/><text class="t" x="65" y="34" text-anchor="middle">Observe</text><text class="s" x="65" y="63" text-anchor="middle">state, traffic,</text><text class="s" x="65" y="84" text-anchor="middle">user SLI</text></g>
  <path class="a" d="M1075 215V285H850"/><polygon points="850,285 745,345 850,405 955,345" fill="#f7f9fb" stroke="#596b78" stroke-width="2"/><text class="t" x="850" y="340" text-anchor="middle">Intent holds?</text><text class="s" x="850" y="365" text-anchor="middle">after convergence</text>
  <path class="a" d="M745 345H540"/><g transform="translate(345 295)"><rect width="190" height="100" rx="7" fill="#fbeaea" stroke="#b64a4a" stroke-width="2"/><text class="t" x="95" y="34" text-anchor="middle">Rollback / replan</text><text class="s" x="95" y="63" text-anchor="middle">restore known state</text><text class="s" x="95" y="84" text-anchor="middle">preserve evidence</text></g><text class="s" x="645" y="333">no</text>
  <path class="a" d="M850 410V470H1035"/><g transform="translate(1035 425)"><rect width="105" height="92" rx="7" fill="#eaf6ef" stroke="#2f855a" stroke-width="2"/><text class="t" x="52" y="34" text-anchor="middle">Commit</text><text class="s" x="52" y="63" text-anchor="middle">record state</text></g><text class="s" x="875" y="455">yes</text>
  <path class="a" d="M345 345H150V213"/><text class="s" x="600" y="558" text-anchor="middle">Automation multiplies both the speed of correction and the blast radius of an incorrect model.</text>
</svg>
