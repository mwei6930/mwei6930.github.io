<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">IPv4 fragmentation and path MTU discovery</title>
  <desc id="desc">A 4000-byte IPv4 datagram crosses a 1500-byte MTU link. With fragmentation allowed it becomes three aligned fragments. With Don't Fragment set, the router drops it and reports the usable MTU.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2457a7"/></marker>
    <marker id="redarrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b5473a"/></marker>
    <style>
      .title{font:700 35px Arial,sans-serif;fill:#172033}.section{font:700 25px Arial,sans-serif;fill:#172033}.txt{font:20px Arial,sans-serif;fill:#172033}.small{font:17px Arial,sans-serif;fill:#455269}.mono{font:18px Consolas,monospace;fill:#172033}.white{font:700 18px Arial,sans-serif;fill:#fff}.arrow{stroke:#2457a7;stroke-width:5;fill:none;marker-end:url(#arrow)}.redarrow{stroke:#b5473a;stroke-width:4;fill:none;marker-end:url(#redarrow)}</style>
  </defs>
  <rect width="1600" height="980" fill="#fff"/>
  <text x="70" y="65" class="title">MTU constrains each link: fragmentation or a smaller sender packet</text>

  <rect x="70" y="110" width="430" height="115" rx="8" fill="#eef4fb" stroke="#2457a7" stroke-width="2"/>
  <text x="100" y="150" class="section">Incoming IPv4 datagram</text>
  <rect x="100" y="172" width="45" height="35" fill="#2457a7"/><text x="111" y="196" class="white">20</text>
  <rect x="145" y="172" width="325" height="35" fill="#7ca4d5"/><text x="258" y="196" class="white">3980-byte payload</text>

  <path d="M500 168 L655 168" class="arrow"/>
  <polygon points="685,108 755,108 800,168 755,228 685,228 640,168" fill="#fff8e6" stroke="#d59b20" stroke-width="3"/>
  <text x="684" y="156" class="section">Router</text><text x="672" y="187" class="small">outgoing MTU</text><text x="704" y="211" class="mono">1500</text>
  <path d="M800 168 L940 168" class="arrow"/>
  <rect x="940" y="110" width="560" height="115" rx="8" fill="#f8fafc" stroke="#9aa9bd" stroke-width="2"/>
  <text x="970" y="150" class="section">Constraint</text>
  <text x="970" y="188" class="txt">Each outgoing IPv4 packet must be at most 1500 bytes.</text>
  <text x="970" y="214" class="small">Non-final fragment payloads must align to 8-byte offset units.</text>

  <text x="70" y="295" class="section">Case A: DF = 0, legacy IPv4 fragmentation is permitted</text>
  <g>
    <rect x="90" y="340" width="1370" height="145" rx="10" fill="#f5fbf8" stroke="#147a54" stroke-width="2"/>
    <text x="115" y="375" class="txt" style="font-weight:700">Fragment 1: total 1500, payload 1480, offset 0, MF = 1</text>
    <rect x="115" y="400" width="55" height="48" fill="#147a54"/><text x="126" y="431" class="white">H 20</text>
    <rect x="170" y="400" width="1200" height="48" fill="#65b192"/><text x="690" y="431" class="white">payload bytes 0-1479</text>
  </g>
  <g>
    <rect x="90" y="500" width="1370" height="145" rx="10" fill="#f5fbf8" stroke="#147a54" stroke-width="2"/>
    <text x="115" y="535" class="txt" style="font-weight:700">Fragment 2: total 1500, payload 1480, offset 185, MF = 1</text>
    <rect x="115" y="560" width="55" height="48" fill="#147a54"/><text x="126" y="591" class="white">H 20</text>
    <rect x="170" y="560" width="1200" height="48" fill="#65b192"/><text x="666" y="591" class="white">payload bytes 1480-2959</text>
    <text x="1390" y="591" class="mono">1480 / 8 = 185</text>
  </g>
  <g>
    <rect x="90" y="660" width="1370" height="145" rx="10" fill="#f5fbf8" stroke="#147a54" stroke-width="2"/>
    <text x="115" y="695" class="txt" style="font-weight:700">Fragment 3: total 1040, payload 1020, offset 370, MF = 0</text>
    <rect x="115" y="720" width="55" height="48" fill="#147a54"/><text x="126" y="751" class="white">H 20</text>
    <rect x="170" y="720" width="827" height="48" fill="#65b192"/><text x="470" y="751" class="white">payload bytes 2960-3979</text>
    <text x="1025" y="751" class="mono">2960 / 8 = 370</text>
  </g>
  <text x="105" y="833" class="small">All fragments carry the same Identification value; the destination, not an intermediate router, reassembles them.</text>

  <text x="70" y="890" class="section">Case B: DF = 1, Path MTU Discovery</text>
  <rect x="485" y="860" width="425" height="75" rx="8" fill="#fdf0ec" stroke="#b5473a" stroke-width="2"/>
  <text x="510" y="892" class="txt">Router drops the oversized datagram</text>
  <text x="510" y="921" class="small">and reports: fragmentation needed, MTU 1500</text>
  <path d="M485 900 C380 900 345 945 210 945" class="redarrow"/>
  <rect x="970" y="860" width="530" height="75" rx="8" fill="#eef4fb" stroke="#2457a7" stroke-width="2"/>
  <text x="995" y="892" class="txt">Sender reduces packet size and retransmits</text>
  <text x="995" y="921" class="small">PLPMTUD can confirm the path size with transport-layer probes.</text>
  <path d="M910 900 L970 900" class="arrow"/>
  <text x="70" y="966" class="small">Tunnel headers consume part of the underlay MTU: effective inner MTU = underlay MTU - encapsulation overhead.</text>
</svg>
