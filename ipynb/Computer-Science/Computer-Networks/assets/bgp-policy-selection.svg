<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 950" role="img" aria-labelledby="title desc">
  <title id="title">BGP policy selection prefers a customer route</title>
  <desc id="desc">An autonomous system receives three routes to the same prefix from a customer, peer, and provider. Higher local preference selects the longer customer path before AS path length is considered.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2457a7"/></marker>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#172033}.section{font:700 23px Arial,sans-serif;fill:#172033}.txt{font:19px Arial,sans-serif;fill:#172033}.small{font:16px Arial,sans-serif;fill:#455269}.mono{font:18px Consolas,monospace;fill:#172033}.white{font:700 19px Arial,sans-serif;fill:#fff}.node{fill:#eef4fb;stroke:#2457a7;stroke-width:3}.edge{stroke:#7d8da3;stroke-width:5;fill:none;marker-end:url(#arrow)}.winner{fill:#147a54;stroke:#0b5a3b;stroke-width:3}</style>
  </defs>
  <rect width="1600" height="950" fill="#fff"/>
  <text x="65" y="62" class="title">BGP best path begins with local policy, not global shortest distance</text>

  <rect x="610" y="120" width="380" height="125" rx="12" class="node"/>
  <text x="700" y="170" class="section">Local AS 65000</text><text x="667" y="207" class="small">select one route for 203.0.113.0/24</text>

  <rect x="80" y="335" width="390" height="170" rx="10" fill="#eef8f3" stroke="#147a54" stroke-width="3"/>
  <text x="110" y="378" class="section">Customer AS 65100</text><text x="110" y="414" class="mono">AS_PATH: 65100 65210 65300</text><text x="110" y="449" class="mono">LOCAL_PREF: 200</text><text x="110" y="482" class="small">Revenue-bearing customer route</text>
  <rect x="605" y="335" width="390" height="170" rx="10" fill="#fff8e6" stroke="#d59b20" stroke-width="3"/>
  <text x="635" y="378" class="section">Peer AS 65400</text><text x="635" y="414" class="mono">AS_PATH: 65400 65300</text><text x="635" y="449" class="mono">LOCAL_PREF: 150</text><text x="635" y="482" class="small">Settlement-free peer route</text>
  <rect x="1130" y="335" width="390" height="170" rx="10" fill="#fdf0ec" stroke="#b5473a" stroke-width="3"/>
  <text x="1160" y="378" class="section">Provider AS 65500</text><text x="1160" y="414" class="mono">AS_PATH: 65500</text><text x="1160" y="449" class="mono">LOCAL_PREF: 100</text><text x="1160" y="482" class="small">Paid upstream transit route</text>

  <path d="M275 335 C390 260 560 215 650 205" class="edge"/><path d="M800 335 L800 245" class="edge"/><path d="M1325 335 C1210 260 1040 215 950 205" class="edge"/>

  <rect x="155" y="600" width="1290" height="210" rx="10" fill="#f8fafc" stroke="#9aa9bd" stroke-width="2"/>
  <rect x="155" y="600" width="1290" height="55" fill="#2457a7"/>
  <text x="190" y="636" class="white">Decision stage</text><text x="515" y="636" class="white">Customer route</text><text x="835" y="636" class="white">Peer route</text><text x="1135" y="636" class="white">Provider route</text>
  <text x="190" y="703" class="txt">1. Highest LOCAL_PREF</text><text x="570" y="703" class="mono">200</text><text x="890" y="703" class="mono">150</text><text x="1190" y="703" class="mono">100</text>
  <text x="190" y="761" class="txt">2. Shortest AS_PATH</text><text x="570" y="761" class="mono">3</text><text x="890" y="761" class="mono">2</text><text x="1190" y="761" class="mono">1</text>
  <rect x="480" y="670" width="240" height="115" rx="8" class="winner" opacity="0.17"/>

  <rect x="430" y="845" width="740" height="70" rx="9" class="winner"/>
  <text x="525" y="889" class="white">Selected: customer route, despite its longer AS_PATH</text>
  <text x="65" y="933" class="small">Only routes tied on an earlier stage reach later comparisons. Exact tie-break details vary by implementation and configuration.</text>
</svg>
