<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">Longest-prefix matching example</title>
  <desc id="desc">A destination address is compared with five routes. The most specific matching prefix, 10.1.2.128 slash 25, selects interface four.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2457a7"/>
    </marker>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#172033}.sub{font:22px Arial,sans-serif;fill:#455269}.head{font:700 22px Arial,sans-serif;fill:#fff}.txt{font:21px Arial,sans-serif;fill:#172033}.mono{font:21px Consolas,monospace;fill:#172033}.small{font:18px Arial,sans-serif;fill:#455269}.match{font:700 20px Arial,sans-serif;fill:#147a54}.winner{font:700 21px Arial,sans-serif;fill:#fff}.line{stroke:#b8c3d4;stroke-width:2}.arrow{stroke:#2457a7;stroke-width:4;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1500" height="900" fill="#fff"/>
  <text x="70" y="65" class="title">Longest-Prefix Matching: the most specific match wins</text>
  <rect x="70" y="105" width="1360" height="85" rx="8" fill="#eef4fb" stroke="#7d9bc5" stroke-width="2"/>
  <text x="100" y="140" class="sub">Destination address</text>
  <text x="335" y="143" class="mono">10.1.2.130</text>
  <text x="540" y="143" class="mono">00001010 00000001 00000010 10000010</text>
  <text x="100" y="174" class="small">A route matches when all bits covered by its prefix length equal the destination's leading bits.</text>

  <rect x="70" y="235" width="830" height="62" fill="#2457a7"/>
  <text x="95" y="275" class="head">Destination prefix</text>
  <text x="485" y="275" class="head">Next hop / action</text>
  <text x="760" y="275" class="head">Result</text>

  <g>
    <rect x="70" y="297" width="830" height="82" fill="#f8fafc" stroke="#b8c3d4"/>
    <text x="95" y="347" class="mono">0.0.0.0/0</text><text x="485" y="347" class="txt">ISP gateway, if1</text><text x="760" y="347" class="match">match</text>
    <rect x="70" y="379" width="830" height="82" fill="#fff" stroke="#b8c3d4"/>
    <text x="95" y="429" class="mono">10.0.0.0/8</text><text x="485" y="429" class="txt">internal core, if2</text><text x="760" y="429" class="match">match</text>
    <rect x="70" y="461" width="830" height="82" fill="#f8fafc" stroke="#b8c3d4"/>
    <text x="95" y="511" class="mono">10.1.0.0/16</text><text x="485" y="511" class="txt">building A, if3</text><text x="760" y="511" class="match">match</text>
    <rect x="70" y="543" width="830" height="82" fill="#fff" stroke="#b8c3d4"/>
    <text x="95" y="593" class="mono">10.1.2.0/24</text><text x="485" y="593" class="txt">floor 2, if4</text><text x="760" y="593" class="match">match</text>
    <rect x="70" y="625" width="830" height="82" fill="#147a54" stroke="#0b5a3b" stroke-width="3"/>
    <text x="95" y="675" class="winner" style="font-family:Consolas,monospace">10.1.2.128/25</text><text x="485" y="675" class="winner">lab VLAN, if5</text><text x="760" y="675" class="winner">WINNER</text>
    <rect x="70" y="707" width="830" height="82" fill="#f8fafc" stroke="#b8c3d4"/>
    <text x="95" y="757" class="mono">192.0.2.0/24</text><text x="485" y="757" class="txt">test network, if6</text><text x="760" y="757" class="txt" fill="#a33">no match</text>
  </g>

  <path d="M930 664 C990 664 995 360 1080 360" class="arrow"/>
  <rect x="1080" y="280" width="350" height="235" rx="8" fill="#eef8f3" stroke="#147a54" stroke-width="3"/>
  <text x="1110" y="330" class="title" style="font-size:27px">Forwarding decision</text>
  <text x="1110" y="380" class="txt">Prefix length: 25 bits</text>
  <text x="1110" y="422" class="txt">Outgoing interface: if5</text>
  <text x="1110" y="464" class="txt">Next hop: directly attached</text>

  <rect x="980" y="570" width="450" height="165" rx="8" fill="#fff8e6" stroke="#d59b20" stroke-width="2"/>
  <text x="1010" y="615" class="txt" style="font-weight:700">Why not the default route?</text>
  <text x="1010" y="655" class="small">All five green rows match, but /25 fixes</text>
  <text x="1010" y="686" class="small">the greatest number of leading bits. LPM</text>
  <text x="1010" y="717" class="small">does not compare metrics across different lengths.</text>

  <text x="70" y="850" class="small">Lookup chooses a forwarding entry. How the entries were learned belongs to the routing control plane.</text>
</svg>
