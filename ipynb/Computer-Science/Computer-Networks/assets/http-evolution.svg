<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 760" role="img" aria-labelledby="title desc">
  <title id="title">HTTP 1.1, HTTP 2, and HTTP 3 request multiplexing</title>
  <desc id="desc">HTTP 1.1 uses ordered responses on a connection or several parallel TCP connections. HTTP 2 interleaves frames from several streams but all share one ordered TCP byte stream, so packet loss delays every stream. HTTP 3 carries streams in QUIC so loss blocks only data that depends on the missing QUIC stream bytes.</desc>
  <style>.t{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#172554}.h{font-size:28px;font-weight:700}.s{font-size:19px;font-weight:700}.b{font-size:14px}.n{font-size:12px;fill:#475569}.p{fill:#fff;stroke:#94a3b8;stroke-width:2}.lane{stroke:#64748b;stroke-width:2}</style>
  <rect width="1360" height="760" fill="#f8fafc"/><text x="680" y="43" text-anchor="middle" class="t h">HTTP semantics remain; framing and transport change the blocking scope</text>
  <g class="t">
    <rect x="35" y="82" width="410" height="625" rx="10" class="p"/><text x="240" y="119" text-anchor="middle" class="s">HTTP/1.1</text><text x="240" y="145" text-anchor="middle" class="n">text messages over TCP</text>
    <text x="72" y="194" class="b">one pipelined connection</text><line x1="80" y1="225" x2="400" y2="225" class="lane"/>
    <rect x="92" y="202" width="62" height="45" fill="#dbeafe" stroke="#3b82f6"/><text x="123" y="230" text-anchor="middle" class="b">req A</text><rect x="160" y="202" width="62" height="45" fill="#dcfce7" stroke="#22c55e"/><text x="191" y="230" text-anchor="middle" class="b">req B</text><rect x="228" y="202" width="62" height="45" fill="#fef3c7" stroke="#f59e0b"/><text x="259" y="230" text-anchor="middle" class="b">req C</text>
    <rect x="95" y="285" width="235" height="55" fill="#fee2e2" stroke="#ef4444"/><text x="212" y="308" text-anchor="middle" class="b" font-weight="700">slow response A</text><text x="212" y="329" text-anchor="middle" class="n">B and C responses wait in order</text>
    <text x="72" y="405" class="b">common workaround</text><g><line x1="90" y1="440" x2="390" y2="440" class="lane"/><line x1="90" y1="500" x2="390" y2="500" class="lane"/><line x1="90" y1="560" x2="390" y2="560" class="lane"/></g><text x="240" y="455" text-anchor="middle" class="n">several TCP connections</text><text x="240" y="515" text-anchor="middle" class="n">more handshakes and independent congestion state</text><text x="240" y="575" text-anchor="middle" class="n">browser limits concurrency per origin</text>

    <rect x="475" y="82" width="410" height="625" rx="10" class="p"/><text x="680" y="119" text-anchor="middle" class="s">HTTP/2</text><text x="680" y="145" text-anchor="middle" class="n">binary frames, streams, HPACK over one TCP connection</text>
    <line x1="520" y1="225" x2="840" y2="225" class="lane"/><g><rect x="532" y="202" width="54" height="45" fill="#dbeafe" stroke="#3b82f6"/><text x="559" y="230" text-anchor="middle" class="b">A1</text><rect x="592" y="202" width="54" height="45" fill="#dcfce7" stroke="#22c55e"/><text x="619" y="230" text-anchor="middle" class="b">B1</text><rect x="652" y="202" width="54" height="45" fill="#fef3c7" stroke="#f59e0b"/><text x="679" y="230" text-anchor="middle" class="b">C1</text><rect x="712" y="202" width="54" height="45" fill="#dbeafe" stroke="#3b82f6"/><text x="739" y="230" text-anchor="middle" class="b">A2</text><rect x="772" y="202" width="54" height="45" fill="#dcfce7" stroke="#22c55e"/><text x="799" y="230" text-anchor="middle" class="b">B2</text></g>
    <text x="680" y="278" text-anchor="middle" class="b">application frames interleave</text>
    <rect x="525" y="330" width="310" height="72" fill="#fee2e2" stroke="#ef4444"/><text x="680" y="357" text-anchor="middle" class="b" font-weight="700">one TCP segment is missing</text><text x="680" y="381" text-anchor="middle" class="b">ordered TCP delivery pauses A, B, and C</text>
    <rect x="525" y="465" width="310" height="120" rx="8" fill="#eff6ff" stroke="#60a5fa"/><text x="680" y="495" text-anchor="middle" class="b" font-weight="700">What HTTP/2 removes</text><text x="680" y="521" text-anchor="middle" class="b">HTTP response ordering across streams</text><text x="680" y="554" text-anchor="middle" class="b" font-weight="700">What remains</text><text x="680" y="578" text-anchor="middle" class="b">TCP transport head-of-line blocking</text>

    <rect x="915" y="82" width="410" height="625" rx="10" class="p"/><text x="1120" y="119" text-anchor="middle" class="s">HTTP/3</text><text x="1120" y="145" text-anchor="middle" class="n">HTTP frames over independent QUIC streams</text>
    <text x="955" y="192" class="b">stream A</text><line x1="1030" y1="185" x2="1270" y2="185" class="lane"/><g fill="#dbeafe" stroke="#3b82f6"><rect x="1050" y="163" width="70" height="44"/><rect x="1160" y="163" width="70" height="44"/></g>
    <text x="955" y="272" class="b">stream B</text><line x1="1030" y1="265" x2="1270" y2="265" class="lane"/><rect x="1050" y="243" width="70" height="44" fill="#dcfce7" stroke="#22c55e"/><rect x="1160" y="243" width="70" height="44" fill="#dcfce7" stroke="#22c55e"/>
    <text x="955" y="352" class="b">stream C</text><line x1="1030" y1="345" x2="1270" y2="345" class="lane"/><rect x="1050" y="323" width="70" height="44" fill="#fef3c7" stroke="#f59e0b"/><rect x="1160" y="323" width="70" height="44" fill="#fef3c7" stroke="#f59e0b"/>
    <line x1="1148" y1="235" x2="1148" y2="295" stroke="#dc2626" stroke-width="6"/><text x="1235" y="294" class="b" fill="#b91c1c">loss on B</text>
    <rect x="965" y="430" width="310" height="150" rx="8" fill="#dcfce7" stroke="#22c55e"/><text x="1120" y="461" text-anchor="middle" class="b" font-weight="700">A and C can still be delivered</text><text x="1120" y="489" text-anchor="middle" class="b">B waits for its missing stream data</text><text x="1120" y="528" text-anchor="middle" class="n">connection-level congestion control</text><text x="1120" y="551" text-anchor="middle" class="n">still couples the aggregate sending rate</text>
  </g>
</svg>
