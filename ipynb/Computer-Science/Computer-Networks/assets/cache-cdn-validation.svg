<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 800" role="img" aria-labelledby="title desc">
  <title id="title">HTTP cache freshness, validation, and a CDN request path</title>
  <desc id="desc">A browser cache and CDN edge examine cache keys and freshness. Fresh hits return immediately. Stale entries send conditional requests with If-None-Match through an origin shield; a 304 response reuses the stored body, while a miss obtains a new 200 response and fills caches.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#2563eb"/></marker><marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#16a34a"/></marker><style>.t{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#172554}.h{font-size:28px;font-weight:700}.s{font-size:18px;font-weight:700}.b{font-size:14px}.n{font-size:12px;fill:#475569}.node{fill:#fff;stroke:#64748b;stroke-width:2}</style></defs>
  <rect width="1360" height="800" fill="#f8fafc"/><text x="680" y="43" text-anchor="middle" class="t h">Caching is a semantic decision before it is a storage decision</text>
  <g class="t">
    <rect x="45" y="95" width="205" height="88" rx="9" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/><text x="147" y="128" text-anchor="middle" class="s">Browser</text><text x="147" y="155" text-anchor="middle" class="b">private cache</text>
    <rect x="350" y="95" width="230" height="88" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="465" y="128" text-anchor="middle" class="s">CDN edge</text><text x="465" y="155" text-anchor="middle" class="b">shared cache near client</text>
    <rect x="720" y="95" width="230" height="88" rx="9" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/><text x="835" y="128" text-anchor="middle" class="s">Origin shield</text><text x="835" y="155" text-anchor="middle" class="b">collapses regional misses</text>
    <rect x="1090" y="95" width="220" height="88" rx="9" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/><text x="1200" y="128" text-anchor="middle" class="s">Origin</text><text x="1200" y="155" text-anchor="middle" class="b">authoritative application state</text>

    <rect x="45" y="235" width="1265" height="138" rx="10" fill="#fff" stroke="#94a3b8" stroke-width="2"/><text x="75" y="270" class="s">Path 1: fresh cache hit</text>
    <line x1="155" y1="318" x2="447" y2="318" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/><text x="300" y="306" text-anchor="middle" class="b">GET /logo.png</text>
    <rect x="392" y="285" width="145" height="67" rx="7" fill="#dcfce7" stroke="#16a34a"/><text x="465" y="311" text-anchor="middle" class="b" font-weight="700">fresh by max-age</text><text x="465" y="335" text-anchor="middle" class="n">key includes Vary fields</text>
    <line x1="447" y1="355" x2="155" y2="355" stroke="#16a34a" stroke-width="4" marker-end="url(#g)"/><text x="300" y="347" text-anchor="middle" class="b">200 from stored response; no origin RTT</text>

    <rect x="45" y="400" width="1265" height="160" rx="10" fill="#fff" stroke="#94a3b8" stroke-width="2"/><text x="75" y="435" class="s">Path 2: stale entry is revalidated</text>
    <line x1="475" y1="480" x2="825" y2="480" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/><text x="650" y="468" text-anchor="middle" class="b">If-None-Match: "v7"</text>
    <line x1="845" y1="480" x2="1190" y2="480" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/><text x="1017" y="468" text-anchor="middle" class="b">conditional request if shield also stale</text>
    <line x1="1190" y1="525" x2="845" y2="525" stroke="#16a34a" stroke-width="4" marker-end="url(#g)"/><text x="1017" y="517" text-anchor="middle" class="b">304 Not Modified, new freshness metadata</text>
    <line x1="825" y1="525" x2="475" y2="525" stroke="#16a34a" stroke-width="4" marker-end="url(#g)"/><text x="650" y="517" text-anchor="middle" class="b">reuse cached body; avoid retransmitting it</text>

    <rect x="45" y="587" width="1265" height="160" rx="10" fill="#fff" stroke="#94a3b8" stroke-width="2"/><text x="75" y="622" class="s">Path 3: miss or changed representation</text>
    <line x1="475" y1="665" x2="1190" y2="665" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/><text x="830" y="653" text-anchor="middle" class="b">request reaches origin through the shield</text>
    <line x1="1190" y1="712" x2="475" y2="712" stroke="#16a34a" stroke-width="4" marker-end="url(#g)"/><text x="830" y="704" text-anchor="middle" class="b">200 + body + ETag + Cache-Control; fill shield and edge</text>
    <rect x="970" y="265" width="300" height="82" rx="8" fill="#fee2e2" stroke="#ef4444"/><text x="1120" y="292" text-anchor="middle" class="b" font-weight="700">Invalidation is distributed state</text><text x="1120" y="316" text-anchor="middle" class="n">purge, versioned URL, or short freshness</text><text x="1120" y="337" text-anchor="middle" class="n">trades propagation delay against origin load</text>
  </g>
</svg>
