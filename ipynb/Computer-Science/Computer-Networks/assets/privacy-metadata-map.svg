<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">Privacy controls and remaining network metadata</title>
  <desc id="desc">A comparison of cleartext DNS, encrypted DNS and TLS, encrypted client hello, VPN, and Tor showing who can still observe names, addresses, timing, and endpoints.</desc>
  <defs><style>.h{font:700 30px Arial,sans-serif;fill:#172033}.s{font:700 17px Arial,sans-serif;fill:#172033}.t{font:14px Arial,sans-serif;fill:#334155}.tiny{font:13px Arial,sans-serif;fill:#475569}.head{fill:#172033}.row{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.leak{fill:#fee2e2}.hide{fill:#dcfce7}.shift{fill:#fef3c7}.info{fill:#eff6ff;stroke:#2563eb;stroke-width:2}</style></defs>
  <rect width="1280" height="800" fill="#fff"/>
  <text x="42" y="52" class="h">Encryption changes who can observe metadata; it rarely removes all metadata</text>
  <text x="42" y="80" class="t">Names, destination IPs, packet sizes, timing, and endpoint identity leak at different boundaries.</text>
  <rect x="42" y="112" width="1196" height="54" rx="6" class="head"/>
  <text x="62" y="146" class="s" fill="#fff">Deployment</text><text x="260" y="146" class="s" fill="#fff">Local network / ISP</text><text x="545" y="146" class="s" fill="#fff">Resolver / tunnel provider</text><text x="860" y="146" class="s" fill="#fff">Destination / exit</text>

  <rect x="42" y="172" width="1196" height="94" class="row"/><rect x="42" y="172" width="190" height="94" class="leak"/>
  <text x="62" y="207" class="s">Plain DNS + HTTP</text><text x="62" y="233" class="tiny">no channel protection</text>
  <text x="260" y="207" class="t">DNS name, HTTP host/path, IP,</text><text x="260" y="233" class="t">content, size, timing</text>
  <text x="545" y="220" class="t">resolver sees each query</text>
  <text x="860" y="207" class="t">server sees client IP, request,</text><text x="860" y="233" class="t">content and identifiers</text>

  <rect x="42" y="272" width="1196" height="94" class="row"/><rect x="42" y="272" width="190" height="94" class="hide"/>
  <text x="62" y="307" class="s">DoH/DoT + TLS</text><text x="62" y="333" class="tiny">encrypted channels</text>
  <text x="260" y="307" class="t">destination IP, packet sizes, timing;</text><text x="260" y="333" class="t">SNI may remain without ECH</text>
  <text x="545" y="307" class="t">resolver still sees client and query;</text><text x="545" y="333" class="t">transport privacy is not DNSSEC</text>
  <text x="860" y="307" class="t">server sees client IP and plaintext</text><text x="860" y="333" class="t">after terminating TLS</text>

  <rect x="42" y="372" width="1196" height="94" class="row"/><rect x="42" y="372" width="190" height="94" class="hide"/>
  <text x="62" y="407" class="s">TLS + ECH</text><text x="62" y="433" class="tiny">encrypted ClientHelloInner</text>
  <text x="260" y="407" class="t">SNI hidden when ECH succeeds;</text><text x="260" y="433" class="t">IP, size and timing remain</text>
  <text x="545" y="420" class="t">same DNS visibility as chosen resolver</text>
  <text x="860" y="407" class="t">client-facing service routes inner name;</text><text x="860" y="433" class="t">backend sees authorized context</text>

  <rect x="42" y="472" width="1196" height="94" class="row"/><rect x="42" y="472" width="190" height="94" class="shift"/>
  <text x="62" y="507" class="s">VPN tunnel</text><text x="62" y="533" class="tiny">one encrypted next hop</text>
  <text x="260" y="507" class="t">sees tunnel endpoint, volume, timing;</text><text x="260" y="533" class="t">not final names or addresses</text>
  <text x="545" y="507" class="t">VPN provider can observe or correlate</text><text x="545" y="533" class="t">traffic after tunnel termination</text>
  <text x="860" y="520" class="t">destination sees VPN egress IP</text>

  <rect x="42" y="572" width="1196" height="94" class="row"/><rect x="42" y="572" width="190" height="94" class="shift"/>
  <text x="62" y="607" class="s">Tor circuit</text><text x="62" y="633" class="tiny">guard, middle, exit</text>
  <text x="260" y="607" class="t">local observer sees Tor guard;</text><text x="260" y="633" class="t">guard knows client, not destination</text>
  <text x="545" y="607" class="t">no single ordinary relay should know</text><text x="545" y="633" class="t">both client and destination</text>
  <text x="860" y="607" class="t">exit sees destination and plaintext</text><text x="860" y="633" class="t">unless end-to-end TLS is also used</text>

  <rect x="42" y="700" width="1196" height="66" rx="7" class="info"/>
  <text x="62" y="730" class="s">Ask two questions:</text><text x="223" y="730" class="t">Which observer loses which field? Which new party receives concentrated visibility?</text>
  <text x="62" y="754" class="t">Traffic analysis can correlate timing and volume even when payload, DNS, and SNI are encrypted.</text>
</svg>
