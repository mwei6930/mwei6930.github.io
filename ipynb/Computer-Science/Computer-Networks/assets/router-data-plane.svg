<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 930" role="img" aria-labelledby="title desc">
  <title id="title">Router data-plane architecture</title>
  <desc id="desc">Packets enter through input ports, are parsed and looked up, cross a switching fabric, wait in output queues, and leave through a scheduler. A control processor programs the forwarding state.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2457a7"/></marker>
    <marker id="dasharrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7a4ca0"/></marker>
    <style>
      .title{font:700 35px Arial,sans-serif;fill:#172033}.section{font:700 24px Arial,sans-serif;fill:#172033}.txt{font:20px Arial,sans-serif;fill:#172033}.small{font:17px Arial,sans-serif;fill:#455269}.white{font:700 21px Arial,sans-serif;fill:#fff}.arrow{stroke:#2457a7;stroke-width:5;fill:none;marker-end:url(#arrow)}.control{stroke:#7a4ca0;stroke-width:4;stroke-dasharray:11 8;fill:none;marker-end:url(#dasharrow)}</style>
  </defs>
  <rect width="1600" height="930" fill="#fff"/>
  <text x="70" y="65" class="title">Router architecture: control state programs a high-speed data path</text>

  <rect x="515" y="105" width="570" height="145" rx="10" fill="#f3ebfa" stroke="#7a4ca0" stroke-width="3"/>
  <text x="555" y="150" class="section">Control processor (slow path)</text>
  <text x="555" y="188" class="txt">Routing protocols, management, exceptions</text>
  <text x="555" y="220" class="small">Installs prefixes, next hops, ACLs, and queue policy</text>
  <path d="M720 250 L720 345" class="control"/>
  <path d="M880 250 L880 345" class="control"/>

  <rect x="60" y="330" width="1480" height="490" rx="12" fill="#f8fafc" stroke="#9aa9bd" stroke-width="3"/>
  <text x="90" y="370" class="section">Data plane (fast path, repeated for every packet)</text>

  <g>
    <rect x="95" y="420" width="200" height="300" rx="8" fill="#e8f1fb" stroke="#2457a7" stroke-width="2"/>
    <text x="130" y="460" class="section">Input port</text>
    <rect x="125" y="490" width="140" height="54" rx="5" fill="#2457a7"/><text x="151" y="524" class="white">PHY / MAC</text>
    <rect x="125" y="570" width="140" height="54" rx="5" fill="#3e75ba"/><text x="152" y="604" class="white">Parse</text>
    <rect x="125" y="650" width="140" height="54" rx="5" fill="#5b8bc5"/><text x="143" y="684" class="white">Input queue</text>
  </g>

  <g>
    <rect x="360" y="420" width="275" height="300" rx="8" fill="#eef8f3" stroke="#147a54" stroke-width="2"/>
    <text x="397" y="460" class="section">Lookup / classify</text>
    <rect x="397" y="492" width="200" height="62" rx="5" fill="#147a54"/><text x="423" y="530" class="white">Validate + TTL</text>
    <rect x="397" y="578" width="200" height="62" rx="5" fill="#258d67"/><text x="430" y="616" class="white">LPM / policy</text>
    <rect x="397" y="664" width="200" height="40" rx="5" fill="#42a47e"/><text x="425" y="691" class="white" style="font-size:18px">Rewrite metadata</text>
  </g>

  <g>
    <rect x="700" y="420" width="220" height="300" rx="8" fill="#fff8e6" stroke="#d59b20" stroke-width="3"/>
    <text x="738" y="460" class="section">Switch fabric</text>
    <path d="M745 510 L875 650 M875 510 L745 650 M745 580 L875 580" stroke="#d59b20" stroke-width="8"/>
    <circle cx="745" cy="510" r="11" fill="#d59b20"/><circle cx="875" cy="510" r="11" fill="#d59b20"/>
    <circle cx="745" cy="650" r="11" fill="#d59b20"/><circle cx="875" cy="650" r="11" fill="#d59b20"/>
    <text x="730" y="695" class="small">memory, bus, or crossbar</text>
  </g>

  <g>
    <rect x="985" y="420" width="275" height="300" rx="8" fill="#fdf0ec" stroke="#bd5b42" stroke-width="2"/>
    <text x="1028" y="460" class="section">Output port</text>
    <rect x="1022" y="498" width="200" height="60" rx="5" fill="#bd5b42"/><text x="1052" y="535" class="white">Output queues</text>
    <rect x="1022" y="584" width="200" height="60" rx="5" fill="#cc735d"/><text x="1060" y="622" class="white">Scheduler</text>
    <rect x="1022" y="670" width="200" height="34" rx="5" fill="#da8e7a"/><text x="1068" y="694" class="white" style="font-size:18px">Rewrite frame</text>
  </g>

  <g>
    <rect x="1325" y="420" width="170" height="300" rx="8" fill="#e8f1fb" stroke="#2457a7" stroke-width="2"/>
    <text x="1350" y="460" class="section">Link out</text>
    <rect x="1355" y="535" width="110" height="64" rx="5" fill="#2457a7"/><text x="1371" y="575" class="white">PHY/MAC</text>
    <text x="1350" y="650" class="small">new frame,</text><text x="1350" y="678" class="small">same IP packet*</text>
  </g>

  <path d="M30 570 L95 570" class="arrow"/>
  <path d="M295 570 L360 570" class="arrow"/>
  <path d="M635 570 L700 570" class="arrow"/>
  <path d="M920 570 L985 570" class="arrow"/>
  <path d="M1260 570 L1325 570" class="arrow"/>
  <path d="M1495 570 L1570 570" class="arrow"/>

  <rect x="165" y="760" width="485" height="100" rx="8" fill="#fff" stroke="#bd5b42" stroke-width="2"/>
  <text x="190" y="798" class="txt" style="font-weight:700">Head-of-line blocking</text>
  <text x="190" y="832" class="small">The front input packet can block packets behind it</text>
  <text x="190" y="855" class="small">when their desired output is free but another is busy.</text>
  <path d="M300 760 L245 705" stroke="#bd5b42" stroke-width="3" fill="none"/>

  <rect x="785" y="760" width="640" height="100" rx="8" fill="#fff" stroke="#d59b20" stroke-width="2"/>
  <text x="810" y="798" class="txt" style="font-weight:700">Where queues form</text>
  <text x="810" y="832" class="small">Whenever arrival demand exceeds fabric or link service rate,</text>
  <text x="810" y="855" class="small">packets wait, are marked, or are dropped according to policy.</text>

  <text x="70" y="905" class="small">* Routers normally decrement TTL/hop limit and may update other permitted fields before re-encapsulation.</text>
</svg>
