<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="790" viewBox="0 0 1500 790" role="img" aria-labelledby="title desc">
  <title id="title">Concurrent correctness testing workflow</title>
  <desc id="desc">A workflow begins with explicit invariants and synchronization contracts, then combines static warnings, race detectors, lock dependency checking, stress and schedule perturbation, trace analysis, and regression tests.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#374151"/></marker><style>.h{font:700 28px system-ui,sans-serif;fill:#111827}.t{font:600 18px system-ui,sans-serif;fill:#111827}.s{font:15px system-ui,sans-serif;fill:#374151}.box{stroke:#374151;stroke-width:2}.line{fill:none;stroke:#374151;stroke-width:3;marker-end:url(#arrow)}</style></defs>
  <rect width="1500" height="790" fill="#fff"/>
  <text x="750" y="45" text-anchor="middle" class="h">Concurrency testing layers evidence; no single run proves absence of bugs</text>
  <g transform="translate(80 125)">
    <rect x="0" y="0" width="260" height="110" rx="8" fill="#dbeafe" class="box"/><text x="130" y="38" text-anchor="middle" class="t">Specify contracts</text><text x="130" y="68" text-anchor="middle" class="s">invariants, lock ownership,</text><text x="130" y="91" text-anchor="middle" class="s">predicates, progress bounds</text>
    <path d="M260 55 H330" class="line"/>
    <rect x="330" y="0" width="260" height="110" rx="8" fill="#dcfce7" class="box"/><text x="460" y="38" text-anchor="middle" class="t">Make checks executable</text><text x="460" y="68" text-anchor="middle" class="s">assertions, lock annotations,</text><text x="460" y="91" text-anchor="middle" class="s">ownership and generation IDs</text>
    <path d="M590 55 H660" class="line"/>
    <rect x="660" y="0" width="260" height="110" rx="8" fill="#fef3c7" class="box"/><text x="790" y="38" text-anchor="middle" class="t">Instrument</text><text x="790" y="68" text-anchor="middle" class="s">ThreadSanitizer, Helgrind,</text><text x="790" y="91" text-anchor="middle" class="s">kernel lockdep / KCSAN</text>
    <path d="M920 55 H990" class="line"/>
    <rect x="990" y="0" width="260" height="110" rx="8" fill="#ffedd5" class="box"/><text x="1120" y="38" text-anchor="middle" class="t">Explore schedules</text><text x="1120" y="68" text-anchor="middle" class="s">stress, random delay, CPU</text><text x="1120" y="91" text-anchor="middle" class="s">counts, load, fault injection</text>
    <path d="M1120 110 V215" class="line"/>
    <rect x="990" y="215" width="260" height="110" rx="8" fill="#f3e8ff" class="box"/><text x="1120" y="253" text-anchor="middle" class="t">Capture evidence</text><text x="1120" y="283" text-anchor="middle" class="s">stacks, event IDs, wait graph,</text><text x="1120" y="306" text-anchor="middle" class="s">scheduler and futex traces</text>
    <path d="M990 270 H920" class="line"/>
    <rect x="660" y="215" width="260" height="110" rx="8" fill="#fee2e2" class="box"/><text x="790" y="253" text-anchor="middle" class="t">Minimize failing trace</text><text x="790" y="283" text-anchor="middle" class="s">identify conflicting accesses</text><text x="790" y="306" text-anchor="middle" class="s">and missing ordering edge</text>
    <path d="M660 270 H590" class="line"/>
    <rect x="330" y="215" width="260" height="110" rx="8" fill="#e0f2fe" class="box"/><text x="460" y="253" text-anchor="middle" class="t">Repair protocol</text><text x="460" y="283" text-anchor="middle" class="s">protect invariant, not timing;</text><text x="460" y="306" text-anchor="middle" class="s">state why progress follows</text>
    <path d="M330 270 H260" class="line"/>
    <rect x="0" y="215" width="260" height="110" rx="8" fill="#eef2ff" class="box"/><text x="130" y="253" text-anchor="middle" class="t">Regression matrix</text><text x="130" y="283" text-anchor="middle" class="s">repeat under sanitizers and</text><text x="130" y="306" text-anchor="middle" class="s">representative architectures</text>
    <path d="M130 215 C80 170 80 140 130 110" class="line"/>
  </g>
  <rect x="185" y="570" width="1130" height="145" rx="8" fill="#f8fafc" class="box"/>
  <text x="750" y="608" text-anchor="middle" class="t">Interpret tools by the property they observe</text>
  <text x="750" y="642" text-anchor="middle" class="s">A race detector finds conflicting accesses without happens-before; it does not prove the higher-level invariant.</text>
  <text x="750" y="670" text-anchor="middle" class="s">A lock-order checker finds observed dependency cycles; it does not establish starvation freedom.</text>
  <text x="750" y="698" text-anchor="middle" class="s">A stress test demonstrates one explored execution; passing it is evidence, not a proof.</text>
  <text x="750" y="760" text-anchor="middle" class="s">The most useful bug report identifies the shared object, conflicting events, synchronization contract, and reproducible ordering.</text>
</svg>
