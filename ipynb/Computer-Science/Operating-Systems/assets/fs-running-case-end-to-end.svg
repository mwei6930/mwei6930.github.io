<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="980" viewBox="0 0 1900 980" role="img" aria-labelledby="title desc">
  <title id="title">End-to-end durable file replacement through the filesystem</title>
  <desc id="desc">A swimlane follows a temporary-file replacement from application calls through VFS path lookup, page cache, inode and extent allocation, journal commit, device flush, rename, directory synchronization, and recovery-visible final state.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#334155"/></marker><style>.h{font:700 30px system-ui,sans-serif;fill:#111827}.t{font:700 16px system-ui,sans-serif;fill:#111827}.s{font:13px system-ui,sans-serif;fill:#334155}.lane{stroke:#cbd5e1;stroke-width:2}.line{fill:none;stroke:#334155;stroke-width:3;marker-end:url(#a)}.app{fill:#dbeafe;stroke:#2563eb;stroke-width:2}.mem{fill:#fef3c7;stroke:#d97706;stroke-width:2}.disk{fill:#dcfce7;stroke:#15803d;stroke-width:2}.log{fill:#ede9fe;stroke:#7c3aed;stroke-width:2}</style></defs>
  <rect width="1900" height="980" fill="#fff"/><text x="950" y="48" text-anchor="middle" class="h">Durable replacement crosses two objects: the new file and its parent directory</text>
  <rect x="65" y="100" width="1770" height="100" fill="#eff6ff" class="lane"/><text x="195" y="158" text-anchor="middle" class="t">Application</text>
  <rect x="65" y="200" width="1770" height="100" fill="#f8fafc" class="lane"/><text x="195" y="258" text-anchor="middle" class="t">VFS / namespace</text>
  <rect x="65" y="300" width="1770" height="100" fill="#fff7ed" class="lane"/><text x="195" y="358" text-anchor="middle" class="t">Page cache / inode</text>
  <rect x="65" y="400" width="1770" height="100" fill="#f5f3ff" class="lane"/><text x="195" y="458" text-anchor="middle" class="t">Filesystem metadata</text>
  <rect x="65" y="500" width="1770" height="100" fill="#ecfeff" class="lane"/><text x="195" y="558" text-anchor="middle" class="t">Journal / block I/O</text>
  <rect x="65" y="600" width="1770" height="100" fill="#f0fdf4" class="lane"/><text x="195" y="658" text-anchor="middle" class="t">Durable state</text>
  <line x1="330" y1="95" x2="330" y2="705" stroke="#94a3b8" stroke-width="2"/>

  <rect x="360" y="123" width="170" height="55" rx="6" class="app"/><text x="445" y="157" text-anchor="middle" class="s">openat(temp)</text>
  <path d="M530 150 V250 H580" class="line"/>
  <rect x="580" y="223" width="190" height="55" rx="6" class="app"/><text x="675" y="257" text-anchor="middle" class="s">resolve parent + create</text>
  <path d="M770 250 V450 H810" class="line"/>
  <rect x="810" y="423" width="190" height="55" rx="6" class="log"/><text x="905" y="457" text-anchor="middle" class="s">allocate inode + name</text>
  <path d="M1000 450 V350 H1040" class="line"/>
  <rect x="1040" y="323" width="180" height="55" rx="6" class="mem"/><text x="1130" y="357" text-anchor="middle" class="s">write dirty pages</text>
  <path d="M1220 350 V150 H1260" class="line"/>
  <rect x="1260" y="123" width="170" height="55" rx="6" class="app"/><text x="1345" y="157" text-anchor="middle" class="s">fdatasync(temp)</text>
  <path d="M1345 178 V550 H1390" class="line"/>
  <rect x="1390" y="523" width="190" height="55" rx="6" class="log"/><text x="1485" y="557" text-anchor="middle" class="s">write + flush + commit</text>
  <path d="M1485 578 V650 H1540" class="line"/>
  <rect x="1540" y="623" width="220" height="55" rx="6" class="disk"/><text x="1650" y="657" text-anchor="middle" class="s">temp contents durable</text>

  <path d="M1650 623 V150 H1600" class="line"/>
  <rect x="1430" y="123" width="170" height="55" rx="6" class="app"/><text x="1515" y="157" text-anchor="middle" class="s">renameat(target)</text>
  <path d="M1515 178 V250 H1450" class="line"/>
  <rect x="1260" y="223" width="190" height="55" rx="6" class="app"/><text x="1355" y="257" text-anchor="middle" class="s">atomic dentry switch</text>
  <path d="M1355 278 V450 H1240" class="line"/>
  <rect x="1040" y="423" width="200" height="55" rx="6" class="log"/><text x="1140" y="457" text-anchor="middle" class="s">directory metadata dirty</text>
  <path d="M1040 450 H980 V150 H900" class="line"/>
  <rect x="730" y="123" width="170" height="55" rx="6" class="app"/><text x="815" y="157" text-anchor="middle" class="s">fsync(dirfd)</text>
  <path d="M815 178 V550 H740" class="line"/>
  <rect x="540" y="523" width="200" height="55" rx="6" class="log"/><text x="640" y="557" text-anchor="middle" class="s">commit name replacement</text>
  <path d="M640 578 V650 H570" class="line"/>
  <rect x="360" y="623" width="210" height="55" rx="6" class="disk"/><text x="465" y="657" text-anchor="middle" class="s">new target durable</text>

  <rect x="170" y="770" width="1560" height="125" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="950" y="808" text-anchor="middle" class="t">Recovery view after the final acknowledgement</text><text x="950" y="842" text-anchor="middle" class="s">The target directory entry references the fully initialized new inode; the old inode is reclaimed only after its link/open references permit it.</text><text x="950" y="874" text-anchor="middle" class="s">Journal replay may finish checkpointing, but the application-visible result should remain one complete version.</text>
  <text x="950" y="945" text-anchor="middle" class="s">Calls are shown conceptually; real filesystems batch transactions and overlap writeback across many files.</text>
</svg>
