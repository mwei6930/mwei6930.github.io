<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Virtual machine I/O strategies</title>
  <desc id="desc">Three columns compare device emulation, paravirtualized virtio devices, and direct device assignment through an IOMMU.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#34495e"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#17202a;letter-spacing:0}.h{font-size:28px;font-weight:700}.s{font-size:19px;font-weight:700}.b{font-size:16px}.n{font-size:14px;fill:#425466}.box{stroke:#34495e;stroke-width:2;rx:6}.p{stroke:#34495e;stroke-width:3;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="650" fill="#f8fafc"/><text x="600" y="42" text-anchor="middle" class="h">Virtual I/O trades compatibility, mediation, and directness</text>
  <text x="210" y="88" text-anchor="middle" class="s">Emulated device</text>
  <rect x="60" y="112" width="300" height="65" class="box" fill="#d6eaf8"/><text x="210" y="152" text-anchor="middle" class="b">Unmodified legacy guest driver</text>
  <rect x="60" y="225" width="300" height="75" class="box" fill="#eadcf8"/><text x="210" y="255" text-anchor="middle" class="b">Device model</text><text x="210" y="280" text-anchor="middle" class="n">decode registers and emulate behavior</text>
  <rect x="60" y="348" width="300" height="65" class="box" fill="#fdebd0"/><text x="210" y="388" text-anchor="middle" class="b">Host device / file / network</text>
  <line x1="210" y1="177" x2="210" y2="225" class="p"/><line x1="210" y1="300" x2="210" y2="348" class="p"/>
  <text x="210" y="456" text-anchor="middle" class="b">Best compatibility</text><text x="210" y="483" text-anchor="middle" class="n">more exits and device-model work</text><text x="210" y="510" text-anchor="middle" class="n">large emulation attack surface</text>

  <text x="600" y="88" text-anchor="middle" class="s">Paravirtualized device</text>
  <rect x="450" y="112" width="300" height="65" class="box" fill="#d6eaf8"/><text x="600" y="152" text-anchor="middle" class="b">Virtio-aware guest driver</text>
  <rect x="450" y="225" width="300" height="75" class="box" fill="#d5f5e3"/><text x="600" y="255" text-anchor="middle" class="b">Shared virtqueue</text><text x="600" y="280" text-anchor="middle" class="n">descriptors + available + used rings</text>
  <rect x="450" y="348" width="300" height="65" class="box" fill="#eadcf8"/><text x="600" y="388" text-anchor="middle" class="b">VMM or vhost backend</text>
  <line x1="600" y1="177" x2="600" y2="225" class="p"/><line x1="600" y1="300" x2="600" y2="348" class="p"/>
  <text x="600" y="456" text-anchor="middle" class="b">Efficient batching and sharing</text><text x="600" y="483" text-anchor="middle" class="n">requires a virtualization-aware driver</text><text x="600" y="510" text-anchor="middle" class="n">still preserves a mediated device contract</text>

  <text x="990" y="88" text-anchor="middle" class="s">Device passthrough</text>
  <rect x="840" y="112" width="300" height="65" class="box" fill="#d6eaf8"/><text x="990" y="152" text-anchor="middle" class="b">Native guest driver</text>
  <rect x="840" y="225" width="300" height="75" class="box" fill="#fff3cd"/><text x="990" y="255" text-anchor="middle" class="b">IOMMU + interrupt remapping</text><text x="990" y="280" text-anchor="middle" class="n">restrict device DMA and interrupts</text>
  <rect x="840" y="348" width="300" height="65" class="box" fill="#fdebd0"/><text x="990" y="388" text-anchor="middle" class="b">Assigned physical / virtual function</text>
  <line x1="990" y1="177" x2="990" y2="225" class="p"/><line x1="990" y1="300" x2="990" y2="348" class="p"/>
  <text x="990" y="456" text-anchor="middle" class="b">Near-native data path</text><text x="990" y="483" text-anchor="middle" class="n">harder sharing, reset, and migration</text><text x="990" y="510" text-anchor="middle" class="n">device and IOMMU join the TCB</text>

  <rect x="110" y="552" width="980" height="64" rx="6" fill="#ffffff" stroke="#34495e" stroke-width="2"/><text x="600" y="578" text-anchor="middle" class="b">Modern systems mix all three.</text><text x="600" y="602" text-anchor="middle" class="n">Use emulation for boot compatibility, virtio for common high-throughput devices, and passthrough for selected accelerators.</text>
</svg>
