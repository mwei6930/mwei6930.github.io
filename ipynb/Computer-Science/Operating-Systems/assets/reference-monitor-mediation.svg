<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Reference monitor mediates subject operations on objects</title>
  <desc id="desc">A subject's request crosses the kernel boundary, resolves credentials and an object, and is authorized by a tamper resistant, always invoked, verifiable reference monitor.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#46596d"/></marker></defs>
  <style>text{font-family:Arial,sans-serif;fill:#172235}.title{font-size:28px;font-weight:700}.head{font-size:19px;font-weight:700}.body{font-size:15px}.small{font-size:13px;fill:#526274}.box{stroke:#65788b;stroke-width:2}.arrow{stroke:#46596d;stroke-width:2.6;fill:none;marker-end:url(#arrow)}</style>
  <rect width="1200" height="650" fill="#f7f9fb"/><text x="600" y="42" text-anchor="middle" class="title">Every protected operation must cross one enforceable decision point</text>
  <rect x="55" y="180" width="210" height="165" rx="8" fill="#e6f0ff" class="box"/><text x="160" y="215" text-anchor="middle" class="head">Subject</text><text x="160" y="248" text-anchor="middle" class="body">process / thread</text><text x="160" y="275" text-anchor="middle" class="body">credential context</text><text x="160" y="302" text-anchor="middle" class="body">requested operation</text><text x="160" y="329" text-anchor="middle" class="small">read, write, signal, map...</text>
  <rect x="335" y="112" width="530" height="305" rx="8" fill="#eee9ff" class="box"/><text x="600" y="150" text-anchor="middle" class="head">Reference validation mechanism</text>
  <rect x="375" y="182" width="210" height="86" rx="8" fill="#fff" class="box"/><text x="480" y="215" text-anchor="middle" class="body">Resolve stable subject</text><text x="480" y="240" text-anchor="middle" class="small">UIDs, groups, caps, label</text>
  <rect x="615" y="182" width="210" height="86" rx="8" fill="#fff" class="box"/><text x="720" y="215" text-anchor="middle" class="body">Resolve stable object</text><text x="720" y="240" text-anchor="middle" class="small">inode, task, socket, handle</text>
  <rect x="448" y="300" width="304" height="82" rx="8" fill="#e5f7ed" class="box"/><text x="600" y="332" text-anchor="middle" class="body">Evaluate policy and current state</text><text x="600" y="357" text-anchor="middle" class="small">ALLOW, DENY, AUDIT, or constrained result</text>
  <path d="M265 262H335M480 268V300M720 268V300" class="arrow"/>
  <rect x="935" y="180" width="210" height="165" rx="8" fill="#fff2d5" class="box"/><text x="1040" y="215" text-anchor="middle" class="head">Object</text><text x="1040" y="248" text-anchor="middle" class="body">file / process</text><text x="1040" y="275" text-anchor="middle" class="body">memory / IPC</text><text x="1040" y="302" text-anchor="middle" class="body">device / network</text><text x="1040" y="329" text-anchor="middle" class="small">operation occurs only if allowed</text>
  <path d="M752 341H885V262H935" class="arrow"/>
  <rect x="95" y="475" width="300" height="105" rx="8" fill="#dff4f5" class="box"/><text x="245" y="507" text-anchor="middle" class="head">Always invoked</text><text x="245" y="535" text-anchor="middle" class="body">No alternate path bypasses mediation;</text><text x="245" y="558" text-anchor="middle" class="small">cached decisions preserve equivalent checks.</text>
  <rect x="450" y="475" width="300" height="105" rx="8" fill="#ffe6e3" class="box"/><text x="600" y="507" text-anchor="middle" class="head">Tamper resistant</text><text x="600" y="535" text-anchor="middle" class="body">Untrusted subjects cannot rewrite policy,</text><text x="600" y="558" text-anchor="middle" class="small">credentials, code, or protected monitor state.</text>
  <rect x="805" y="475" width="300" height="105" rx="8" fill="#e6f0ff" class="box"/><text x="955" y="507" text-anchor="middle" class="head">Verifiable</text><text x="955" y="535" text-anchor="middle" class="body">Small and structured enough for analysis,</text><text x="955" y="558" text-anchor="middle" class="small">testing, review, or formal assurance.</text>
  <path d="M600 417V455H245V475M600 455V475M600 455H955V475" class="arrow"/>
</svg>
