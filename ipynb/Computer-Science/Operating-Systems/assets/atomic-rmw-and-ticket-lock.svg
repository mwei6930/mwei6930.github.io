<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" role="img" aria-labelledby="title desc">
  <title id="title">Atomic read modify write operations and a ticket lock</title>
  <desc id="desc">Test-and-set exchanges a lock flag, compare-and-swap updates only when expected matches, and fetch-and-add returns a unique ticket. A ticket lock serves tickets in order.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#374151"/></marker><style>.h{font:700 28px system-ui,sans-serif;fill:#111827}.t{font:600 18px system-ui,sans-serif;fill:#111827}.s{font:15px system-ui,sans-serif;fill:#374151}.box{stroke:#374151;stroke-width:2}.line{fill:none;stroke:#374151;stroke-width:3;marker-end:url(#arrow)}.code{font:16px ui-monospace,monospace;fill:#111827}</style></defs>
  <rect width="1500" height="820" fill="#fff"/>
  <text x="750" y="45" text-anchor="middle" class="h">Hardware makes one read-modify-write indivisible; software still defines the protocol</text>
  <g transform="translate(75 110)">
    <rect x="0" y="0" width="400" height="210" rx="8" fill="#dbeafe" class="box"/>
    <text x="200" y="38" text-anchor="middle" class="t">Test-and-set / exchange</text>
    <text x="30" y="85" class="code">old = atomic_exchange(&amp;flag, 1)</text>
    <text x="30" y="120" class="s">Always writes the new value and returns old.</text>
    <text x="30" y="153" class="s">If old was 0, this thread acquired the flag.</text>
    <text x="30" y="186" class="s">Repeated writes can create heavy cache traffic.</text>
    <rect x="450" y="0" width="400" height="210" rx="8" fill="#dcfce7" class="box"/>
    <text x="650" y="38" text-anchor="middle" class="t">Compare-and-swap</text>
    <text x="480" y="85" class="code">CAS(&amp;x, expected, desired)</text>
    <text x="480" y="120" class="s">Writes desired only when x still equals expected.</text>
    <text x="480" y="153" class="s">Failure reveals interference and permits retry.</text>
    <text x="480" y="186" class="s">Foundation for many optimistic algorithms.</text>
    <rect x="900" y="0" width="400" height="210" rx="8" fill="#fef3c7" class="box"/>
    <text x="1100" y="38" text-anchor="middle" class="t">Fetch-and-add</text>
    <text x="930" y="85" class="code">mine = fetch_add(&amp;next, 1)</text>
    <text x="930" y="120" class="s">Returns a unique old value and increments once.</text>
    <text x="930" y="153" class="s">Useful for counters, indices, and ticket locks.</text>
    <text x="930" y="186" class="s">Atomic does not automatically imply fairness.</text>
  </g>
  <text x="750" y="385" text-anchor="middle" class="t">Ticket-lock example: next = 4, serving = 1</text>
  <g transform="translate(190 430)">
    <rect x="0" y="0" width="250" height="105" rx="8" fill="#f3e8ff" class="box"/><text x="125" y="37" text-anchor="middle" class="t">fetch_add(next)</text><text x="125" y="70" text-anchor="middle" class="s">new caller receives 4</text>
    <path d="M250 53 H340" class="line"/>
    <rect x="340" y="0" width="250" height="105" rx="8" fill="#eef2ff" class="box"/><text x="465" y="37" text-anchor="middle" class="t">wait until serving == 4</text><text x="465" y="70" text-anchor="middle" class="s">read-only spinning after ticket issue</text>
    <path d="M590 53 H680" class="line"/>
    <rect x="680" y="0" width="250" height="105" rx="8" fill="#dcfce7" class="box"/><text x="805" y="37" text-anchor="middle" class="t">critical section</text><text x="805" y="70" text-anchor="middle" class="s">exactly one ticket served</text>
    <path d="M930 53 H1020" class="line"/>
    <rect x="1020" y="0" width="250" height="105" rx="8" fill="#ffedd5" class="box"/><text x="1145" y="37" text-anchor="middle" class="t">serving += 1</text><text x="1145" y="70" text-anchor="middle" class="s">release wakes the next ticket logically</text>
  </g>
  <g transform="translate(260 610)">
    <rect x="0" y="0" width="150" height="65" rx="6" fill="#fee2e2" class="box"/><text x="75" y="39" text-anchor="middle" class="t">ticket 1</text>
    <rect x="175" y="0" width="150" height="65" rx="6" fill="#fef3c7" class="box"/><text x="250" y="39" text-anchor="middle" class="t">ticket 2</text>
    <rect x="350" y="0" width="150" height="65" rx="6" fill="#dbeafe" class="box"/><text x="425" y="39" text-anchor="middle" class="t">ticket 3</text>
    <rect x="525" y="0" width="150" height="65" rx="6" fill="#dcfce7" class="box"/><text x="600" y="39" text-anchor="middle" class="t">ticket 4</text>
    <text x="790" y="27" class="s">FIFO acquisition gives bounded overtaking,</text><text x="790" y="52" class="s">but all waiters repeatedly read one shared cache line.</text>
  </g>
  <rect x="185" y="735" width="1130" height="50" rx="8" fill="#f8fafc" class="box"/>
  <text x="750" y="766" text-anchor="middle" class="s">Atomicity of the primitive is necessary, but memory ordering, waiting policy, overflow handling, and ownership remain software responsibilities.</text>
</svg>
