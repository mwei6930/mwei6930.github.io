<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1540 790" role="img" aria-labelledby="title desc">
  <title id="title">Animated pipe buffering and backpressure</title>
  <desc id="desc">A writer sends bytes into a bounded kernel pipe buffer and a reader removes them. Static panels explain empty, flowing, full, and end-of-file states while animated markers show byte movement.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#355070"/></marker>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17212b; }
      .title { font-size: 32px; font-weight: 700; }
      .section { font-size: 23px; font-weight: 700; }
      .head { font-size: 18px; font-weight: 700; }
      .body { font-size: 16px; }
      .small { font-size: 14px; }
      .panel { stroke: #355070; stroke-width: 2.4; rx: 9; }
      .line { stroke: #355070; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      @media (prefers-reduced-motion: reduce) { .animated-byte { display: none; } }
    </style>
  </defs>
  <rect width="1540" height="790" fill="#fff"/>
  <text x="770" y="48" text-anchor="middle" class="title">A Pipe Is a Bounded Kernel Byte Stream</text>

  <rect x="75" y="150" width="270" height="220" class="panel" fill="#e9f2fb"/>
  <text x="210" y="193" text-anchor="middle" class="section">Writer process</text>
  <text x="210" y="235" text-anchor="middle" class="body">write(pipe_write, bytes, n)</text>
  <text x="210" y="277" text-anchor="middle" class="body">continues while capacity exists</text>
  <text x="210" y="312" text-anchor="middle" class="body">blocks or gets EAGAIN when full</text>
  <text x="210" y="347" text-anchor="middle" class="small">SIGPIPE / EPIPE if no reader remains</text>

  <path d="M345 260 L505 260" class="line"/>
  <text x="425" y="242" text-anchor="middle" class="small">copy into kernel</text>

  <rect x="505" y="125" width="530" height="270" class="panel" fill="#fff3d9"/>
  <text x="770" y="170" text-anchor="middle" class="section">Kernel pipe object</text>
  <text x="770" y="200" text-anchor="middle" class="small">read endpoint + bounded byte buffer + write endpoint</text>
  <g transform="translate(555 238)">
    <rect x="0" y="0" width="52" height="82" fill="#e6f5ef" stroke="#355070" stroke-width="2"/>
    <rect x="52" y="0" width="52" height="82" fill="#e6f5ef" stroke="#355070" stroke-width="2"/>
    <rect x="104" y="0" width="52" height="82" fill="#e6f5ef" stroke="#355070" stroke-width="2"/>
    <rect x="156" y="0" width="52" height="82" fill="#e6f5ef" stroke="#355070" stroke-width="2"/>
    <rect x="208" y="0" width="52" height="82" fill="#f8fafb" stroke="#355070" stroke-width="2"/>
    <rect x="260" y="0" width="52" height="82" fill="#f8fafb" stroke="#355070" stroke-width="2"/>
    <rect x="312" y="0" width="52" height="82" fill="#f8fafb" stroke="#355070" stroke-width="2"/>
    <rect x="364" y="0" width="52" height="82" fill="#f8fafb" stroke="#355070" stroke-width="2"/>
    <text x="26" y="49" text-anchor="middle" class="head">k</text><text x="78" y="49" text-anchor="middle" class="head">e</text><text x="130" y="49" text-anchor="middle" class="head">r</text><text x="182" y="49" text-anchor="middle" class="head">n</text>
  </g>
  <text x="770" y="360" text-anchor="middle" class="small">bytes preserve order; the stream has no record boundaries</text>

  <path d="M1035 260 L1195 260" class="line"/>
  <text x="1115" y="242" text-anchor="middle" class="small">copy to reader</text>

  <rect x="1195" y="150" width="270" height="220" class="panel" fill="#edf5e8"/>
  <text x="1330" y="193" text-anchor="middle" class="section">Reader process</text>
  <text x="1330" y="235" text-anchor="middle" class="body">read(pipe_read, buffer, n)</text>
  <text x="1330" y="277" text-anchor="middle" class="body">receives available bytes</text>
  <text x="1330" y="312" text-anchor="middle" class="body">blocks or gets EAGAIN when empty</text>
  <text x="1330" y="347" text-anchor="middle" class="small">gets 0 only after buffer drains and all writers close</text>

  <circle r="10" fill="#d1495b" filter="url(#glow)" class="animated-byte">
    <animateMotion dur="7s" repeatCount="indefinite" path="M260 260 L580 260 L760 260 L960 260 L1280 260" keyTimes="0;0.22;0.45;0.72;1" calcMode="linear"/>
    <animate attributeName="opacity" values="0;1;1;1;0" keyTimes="0;0.04;0.94;0.98;1" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle r="10" fill="#2a9d8f" filter="url(#glow)" class="animated-byte">
    <animateMotion begin="2.1s" dur="7s" repeatCount="indefinite" path="M260 260 L580 260 L760 260 L960 260 L1280 260" keyTimes="0;0.22;0.45;0.72;1" calcMode="linear"/>
    <animate attributeName="opacity" values="0;1;1;1;0" keyTimes="0;0.04;0.94;0.98;1" dur="7s" repeatCount="indefinite"/>
  </circle>

  <rect x="65" y="465" width="330" height="220" class="panel" fill="#f8fafb"/>
  <text x="230" y="505" text-anchor="middle" class="head">Empty buffer</text>
  <text x="95" y="545" class="body">read cannot make progress</text>
  <text x="95" y="579" class="body">blocking: reader sleeps</text>
  <text x="95" y="613" class="body">nonblocking: EAGAIN</text>
  <text x="95" y="647" class="small">a future write creates readiness</text>

  <rect x="425" y="465" width="330" height="220" class="panel" fill="#e6f5ef"/>
  <text x="590" y="505" text-anchor="middle" class="head">Data available</text>
  <text x="455" y="545" class="body">reader consumes a prefix</text>
  <text x="455" y="579" class="body">partial reads are valid</text>
  <text x="455" y="613" class="body">writer and reader run independently</text>
  <text x="455" y="647" class="small">buffer absorbs a temporary rate mismatch</text>

  <rect x="785" y="465" width="330" height="220" class="panel" fill="#fff3d9"/>
  <text x="950" y="505" text-anchor="middle" class="head">Full buffer</text>
  <text x="815" y="545" class="body">write cannot accept more bytes</text>
  <text x="815" y="579" class="body">blocking: writer sleeps</text>
  <text x="815" y="613" class="body">nonblocking: EAGAIN</text>
  <text x="815" y="647" class="small">reader progress releases capacity</text>

  <rect x="1145" y="465" width="330" height="220" class="panel" fill="#fdebea"/>
  <text x="1310" y="505" text-anchor="middle" class="head">Last writer closes</text>
  <text x="1175" y="545" class="body">buffered bytes remain readable</text>
  <text x="1175" y="579" class="body">after drain, read returns 0</text>
  <text x="1175" y="613" class="body">descriptor lifetime defines EOF</text>
  <text x="1175" y="647" class="small">an accidental writer reference delays EOF</text>

  <text x="770" y="748" text-anchor="middle" class="body">Backpressure turns bounded capacity into control flow: faster producers eventually wait for slower consumers.</text>
</svg>
