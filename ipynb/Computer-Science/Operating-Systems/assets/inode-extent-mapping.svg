<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Inode metadata and extent mapping</title>
  <desc id="desc">An inode separates file metadata from an extent tree. Extents map ranges of logical file blocks to contiguous physical blocks, while sparse holes consume no physical blocks and read as zeros.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#334155"/></marker><style>.h{font:700 30px system-ui,sans-serif;fill:#111827}.t{font:700 18px system-ui,sans-serif;fill:#111827}.s{font:15px system-ui,sans-serif;fill:#334155}.box{stroke:#334155;stroke-width:2}.line{fill:none;stroke:#334155;stroke-width:3;marker-end:url(#a)}.hole{fill:#fff;stroke:#64748b;stroke-width:2;stroke-dasharray:8 6}</style></defs>
  <rect width="1600" height="900" fill="#fff"/><text x="800" y="48" text-anchor="middle" class="h">The inode identifies the object; its mapping translates logical offsets</text>
  <rect x="70" y="105" width="430" height="650" rx="8" fill="#fff7ed" class="box"/><text x="285" y="148" text-anchor="middle" class="t">Inode</text>
  <rect x="120" y="190" width="330" height="75" rx="6" fill="#fef3c7" class="box"/><text x="285" y="220" text-anchor="middle" class="t">Identity and type</text><text x="285" y="247" text-anchor="middle" class="s">inode number, regular/directory/link</text>
  <rect x="120" y="290" width="330" height="95" rx="6" fill="#fef3c7" class="box"/><text x="285" y="322" text-anchor="middle" class="t">Metadata</text><text x="285" y="350" text-anchor="middle" class="s">size, owner, mode, link count</text><text x="285" y="375" text-anchor="middle" class="s">atime, mtime, ctime, flags</text>
  <rect x="120" y="410" width="330" height="95" rx="6" fill="#fef3c7" class="box"/><text x="285" y="442" text-anchor="middle" class="t">Block-map root</text><text x="285" y="470" text-anchor="middle" class="s">inline extents for small maps</text><text x="285" y="495" text-anchor="middle" class="s">or root of a deeper index</text>
  <rect x="120" y="530" width="330" height="95" rx="6" fill="#fef3c7" class="box"/><text x="285" y="562" text-anchor="middle" class="t">Not stored here</text><text x="285" y="590" text-anchor="middle" class="s">the filename and per-open offset</text><text x="285" y="615" text-anchor="middle" class="s">directory/open-description state</text>
  <path d="M450 458 H620" class="line"/>

  <rect x="620" y="130" width="410" height="280" rx="8" fill="#f5f3ff" class="box"/><text x="825" y="172" text-anchor="middle" class="t">Extent index</text>
  <rect x="680" y="220" width="290" height="62" rx="6" fill="#ede9fe" class="box"/><text x="825" y="258" text-anchor="middle" class="s">logical &lt; 8 -> leaf A</text>
  <rect x="680" y="310" width="290" height="62" rx="6" fill="#ede9fe" class="box"/><text x="825" y="348" text-anchor="middle" class="s">logical >= 8 -> leaf B</text>
  <path d="M825 410 V495 H660" class="line"/><path d="M825 495 H1130" class="line"/>

  <rect x="560" y="515" width="420" height="200" rx="8" fill="#eff6ff" class="box"/><text x="770" y="555" text-anchor="middle" class="t">Leaf A: range mappings</text>
  <text x="620" y="602" class="s">logical [0, 3) -> physical [880, 883)</text><text x="620" y="636" class="s">logical [3, 4) -> HOLE</text><text x="620" y="670" class="s">logical [4, 6) -> physical [991, 993)</text>
  <rect x="1050" y="515" width="420" height="200" rx="8" fill="#f0fdf4" class="box"/><text x="1260" y="555" text-anchor="middle" class="t">Leaf B: later file ranges</text>
  <text x="1110" y="602" class="s">logical [8, 12) -> physical [1200, 1204)</text><text x="1110" y="636" class="s">logical [12, 20) -> physical [1500, 1508)</text><text x="1110" y="670" class="s">one record maps many contiguous blocks</text>

  <text x="800" y="775" text-anchor="middle" class="t">Logical file blocks</text>
  <rect x="220" y="805" width="130" height="50" fill="#dbeafe" class="box"/><text x="285" y="837" text-anchor="middle" class="s">0..2 data</text>
  <rect x="350" y="805" width="130" height="50" class="hole"/><text x="415" y="837" text-anchor="middle" class="s">3 hole</text>
  <rect x="480" y="805" width="170" height="50" fill="#dcfce7" class="box"/><text x="565" y="837" text-anchor="middle" class="s">4..5 data</text>
  <rect x="650" y="805" width="170" height="50" class="hole"/><text x="735" y="837" text-anchor="middle" class="s">6..7 hole</text>
  <rect x="820" y="805" width="260" height="50" fill="#dbeafe" class="box"/><text x="950" y="837" text-anchor="middle" class="s">8..11 data</text>
  <rect x="1080" y="805" width="300" height="50" fill="#dcfce7" class="box"/><text x="1230" y="837" text-anchor="middle" class="s">12..19 data</text>
  <text x="800" y="885" text-anchor="middle" class="s">A hole has a logical address and reads as zeros, but no data block is allocated until a write materializes it.</text>
</svg>
