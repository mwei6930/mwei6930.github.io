<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="900" viewBox="0 0 1700 900" role="img" aria-labelledby="title desc">
  <title id="title">File-system checking by global reconciliation</title>
  <desc id="desc">A checker scans superblocks, allocation maps, all inodes, directories, and block references to reconstruct expected ownership and link counts, then repairs leaks, duplicates, and unreachable objects.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#334155"/></marker><style>.h{font:700 30px system-ui,sans-serif;fill:#111827}.t{font:700 18px system-ui,sans-serif;fill:#111827}.s{font:14px system-ui,sans-serif;fill:#334155}.box{stroke:#334155;stroke-width:2}.line{fill:none;stroke:#334155;stroke-width:3;marker-end:url(#a)}.bad{fill:#fee2e2;stroke:#dc2626;stroke-width:2}.ok{fill:#dcfce7;stroke:#15803d;stroke-width:2}</style></defs>
  <rect width="1700" height="900" fill="#fff"/><text x="850" y="48" text-anchor="middle" class="h">fsck reconstructs truth by comparing redundant views of ownership</text>
  <rect x="70" y="105" width="360" height="630" rx="8" fill="#eff6ff" class="box"/><text x="250" y="145" text-anchor="middle" class="t">Observed on-disk structures</text>
  <rect x="120" y="190" width="260" height="70" rx="6" fill="#dbeafe" class="box"/><text x="250" y="232" text-anchor="middle" class="s">superblock + group metadata</text>
  <rect x="120" y="290" width="260" height="70" rx="6" fill="#fef3c7" class="box"/><text x="250" y="332" text-anchor="middle" class="s">inode/block allocation maps</text>
  <rect x="120" y="390" width="260" height="70" rx="6" fill="#ffedd5" class="box"/><text x="250" y="432" text-anchor="middle" class="s">every allocated inode + map</text>
  <rect x="120" y="490" width="260" height="70" rx="6" fill="#ede9fe" class="box"/><text x="250" y="532" text-anchor="middle" class="s">directory name references</text>
  <rect x="120" y="590" width="260" height="70" rx="6" fill="#dcfce7" class="box"/><text x="250" y="632" text-anchor="middle" class="s">data and metadata block owners</text>

  <path d="M430 420 H565" class="line"/>
  <rect x="565" y="170" width="570" height="500" rx="8" fill="#f8fafc" class="box"/><text x="850" y="212" text-anchor="middle" class="t">Reconstructed expected state</text>
  <text x="620" y="265" class="s">1. validate geometry, feature flags and checksums</text><text x="620" y="310" class="s">2. count each block reference and detect duplicates</text><text x="620" y="355" class="s">3. traverse directories from root to find reachable inodes</text><text x="620" y="400" class="s">4. recompute expected inode link counts</text><text x="620" y="445" class="s">5. compare derived allocation with stored bitmaps</text><text x="620" y="490" class="s">6. identify orphaned, leaked, invalid or cross-linked objects</text><text x="620" y="535" class="s">7. choose repairs that restore invariants</text>
  <rect x="650" y="580" width="400" height="60" rx="6" fill="#e0f2fe" class="box"/><text x="850" y="617" text-anchor="middle" class="s">cost scales with metadata/filesystem scan</text>

  <path d="M1135 420 H1270" class="line"/>
  <rect x="1270" y="105" width="360" height="630" rx="8" fill="#fff7ed" class="box"/><text x="1450" y="145" text-anchor="middle" class="t">Possible repair outcomes</text>
  <rect x="1320" y="195" width="260" height="85" rx="6" class="ok"/><text x="1450" y="230" text-anchor="middle" class="t">Fix allocation maps</text><text x="1450" y="258" text-anchor="middle" class="s">mark reachable blocks used</text>
  <rect x="1320" y="320" width="260" height="85" rx="6" fill="#fef3c7" class="box"/><text x="1450" y="355" text-anchor="middle" class="t">Release leaks</text><text x="1450" y="383" text-anchor="middle" class="s">or preserve for investigation</text>
  <rect x="1320" y="445" width="260" height="85" rx="6" fill="#ede9fe" class="box"/><text x="1450" y="480" text-anchor="middle" class="t">Reconnect orphan</text><text x="1450" y="508" text-anchor="middle" class="s">place under lost+found</text>
  <rect x="1320" y="570" width="260" height="85" rx="6" class="bad"/><text x="1450" y="605" text-anchor="middle" class="t">Ask / stop</text><text x="1450" y="633" text-anchor="middle" class="s">ambiguity risks data loss</text>
  <rect x="180" y="790" width="1340" height="65" rx="8" fill="#f5f3ff" class="box"/><text x="850" y="830" text-anchor="middle" class="s">A journal narrows recovery to recent committed transactions; fsck remains valuable for corruption outside the journal's failure model.</text>
</svg>
