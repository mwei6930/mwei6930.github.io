<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="930" viewBox="0 0 1500 930" role="img" aria-labelledby="title desc">
  <title id="title">Comparison of FCFS, SJF, SRTF, and round-robin schedules</title>
  <desc id="desc">Four Gantt charts schedule jobs A, B, C, and D with arrivals zero, one, two, and four and bursts eight, four, two, and one.</desc>
  <defs>
    <style>
      .h{font:700 28px system-ui,sans-serif;fill:#111827}.t{font:600 18px system-ui,sans-serif;fill:#111827}.s{font:15px system-ui,sans-serif;fill:#374151}.axis{stroke:#111827;stroke-width:2}.grid{stroke:#d1d5db;stroke-width:1}.a{fill:#93c5fd}.b{fill:#86efac}.c{fill:#fcd34d}.d{fill:#fca5a5}.job{stroke:#374151;stroke-width:1.5}.cursor{stroke:#dc2626;stroke-width:4;animation:scan 8s linear infinite}@keyframes scan{from{transform:translateX(0)}to{transform:translateX(1050px)}}@media (prefers-reduced-motion:reduce){.cursor{animation:none;transform:translateX(1050px)}}
    </style>
  </defs>
  <rect width="1500" height="930" fill="#fff"/>
  <text x="750" y="44" text-anchor="middle" class="h">The same workload under four policies</text>
  <text x="750" y="77" text-anchor="middle" class="s">A( arrival 0, burst 8 ), B(1,4), C(2,2), D(4,1); Round Robin quantum = 2</text>
  <g transform="translate(310 0)">
    <g class="grid"><path d="M0 110V815 M70 110V815 M140 110V815 M210 110V815 M280 110V815 M350 110V815 M420 110V815 M490 110V815 M560 110V815 M630 110V815 M700 110V815 M770 110V815 M840 110V815 M910 110V815 M980 110V815 M1050 110V815"/></g>
    <g class="s" text-anchor="middle"><text x="0" y="850">0</text><text x="70" y="850">1</text><text x="140" y="850">2</text><text x="210" y="850">3</text><text x="280" y="850">4</text><text x="350" y="850">5</text><text x="420" y="850">6</text><text x="490" y="850">7</text><text x="560" y="850">8</text><text x="630" y="850">9</text><text x="700" y="850">10</text><text x="770" y="850">11</text><text x="840" y="850">12</text><text x="910" y="850">13</text><text x="980" y="850">14</text><text x="1050" y="850">15</text></g>
    <line x1="0" y1="845" x2="1050" y2="845" class="axis"/>
    <g transform="translate(0 145)"><rect width="560" height="70" class="a job"/><rect x="560" width="280" height="70" class="b job"/><rect x="840" width="140" height="70" class="c job"/><rect x="980" width="70" height="70" class="d job"/><g class="t" text-anchor="middle"><text x="280" y="43">A</text><text x="700" y="43">B</text><text x="910" y="43">C</text><text x="1015" y="43">D</text></g></g>
    <g transform="translate(0 315)"><rect width="560" height="70" class="a job"/><rect x="560" width="70" height="70" class="d job"/><rect x="630" width="140" height="70" class="c job"/><rect x="770" width="280" height="70" class="b job"/><g class="t" text-anchor="middle"><text x="280" y="43">A</text><text x="595" y="43">D</text><text x="700" y="43">C</text><text x="910" y="43">B</text></g></g>
    <g transform="translate(0 485)"><rect width="70" height="70" class="a job"/><rect x="70" width="70" height="70" class="b job"/><rect x="140" width="140" height="70" class="c job"/><rect x="280" width="70" height="70" class="d job"/><rect x="350" width="210" height="70" class="b job"/><rect x="560" width="490" height="70" class="a job"/><g class="t" text-anchor="middle"><text x="35" y="43">A</text><text x="105" y="43">B</text><text x="210" y="43">C</text><text x="315" y="43">D</text><text x="455" y="43">B</text><text x="805" y="43">A</text></g></g>
    <g transform="translate(0 655)"><rect width="140" height="70" class="a job"/><rect x="140" width="140" height="70" class="b job"/><rect x="280" width="140" height="70" class="c job"/><rect x="420" width="140" height="70" class="a job"/><rect x="560" width="70" height="70" class="d job"/><rect x="630" width="140" height="70" class="b job"/><rect x="770" width="140" height="70" class="a job"/><rect x="910" width="140" height="70" class="a job"/><g class="t" text-anchor="middle"><text x="70" y="43">A</text><text x="210" y="43">B</text><text x="350" y="43">C</text><text x="490" y="43">A</text><text x="595" y="43">D</text><text x="700" y="43">B</text><text x="840" y="43">A</text><text x="980" y="43">A</text></g></g>
    <line x1="0" y1="120" x2="0" y2="815" class="cursor"/>
  </g>
  <g class="t" text-anchor="end"><text x="275" y="187">FCFS</text><text x="275" y="357">SJF</text><text x="275" y="527">SRTF</text><text x="275" y="697">Round Robin</text></g>
  <g class="s" text-anchor="end"><text x="275" y="215">avg wait 6.75</text><text x="275" y="385">avg wait 5.25</text><text x="275" y="555">avg wait 2.50</text><text x="275" y="725">avg wait 4.75</text></g>
  <g transform="translate(425 885)" class="s"><rect x="0" y="-18" width="24" height="18" class="a"/><text x="32" y="-3">A</text><rect x="95" y="-18" width="24" height="18" class="b"/><text x="127" y="-3">B</text><rect x="190" y="-18" width="24" height="18" class="c"/><text x="222" y="-3">C</text><rect x="285" y="-18" width="24" height="18" class="d"/><text x="317" y="-3">D</text><text x="455" y="-3">The moving red line is simulated time; the complete schedule remains visible.</text></g>
</svg>
