<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">OverlayFS lookup, copy-up, and whiteout behavior</title>
  <desc id="desc">An animated file moves from a read-only lower image layer into a writable upper layer on first modification; a whiteout hides a lower name after deletion.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#34495e"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#17202a;letter-spacing:0}.h{font-size:28px;font-weight:700}.s{font-size:20px;font-weight:700}.b{font-size:16px}.n{font-size:14px;fill:#425466}.box{stroke:#34495e;stroke-width:2;rx:6}.p{fill:none;stroke:#34495e;stroke-width:3;marker-end:url(#a)}.file{fill:#c0392b}</style></defs>
  <rect width="1200" height="650" fill="#f8fafc"/><text x="600" y="42" text-anchor="middle" class="h">Layered images share immutable data and isolate runtime changes</text>
  <rect x="100" y="92" width="1000" height="105" class="box" fill="#d6eaf8"/><text x="220" y="127" class="s">Merged mount</text><text x="220" y="157" class="n">lookup prefers upper; otherwise reveals the highest matching lower object</text><rect x="765" y="118" width="190" height="50" class="box" fill="#ffffff"/><text x="860" y="149" text-anchor="middle" class="b">/app/config.json</text>
  <rect x="100" y="245" width="1000" height="105" class="box" fill="#d5f5e3"/><text x="220" y="280" class="s">Writable upper layer</text><text x="220" y="310" class="n">private metadata and data created by this container</text><rect x="765" y="271" width="190" height="50" class="box" fill="#ffffff"/><text x="860" y="302" text-anchor="middle" class="b">new version</text>
  <rect x="100" y="397" width="1000" height="105" class="box" fill="#fdebd0"/><text x="220" y="432" class="s">Read-only lower image layers</text><text x="220" y="462" class="n">content-addressed layers can be shared by many containers</text><rect x="765" y="423" width="190" height="50" class="box" fill="#ffffff"/><text x="860" y="454" text-anchor="middle" class="b">original version</text>
  <path d="M960 448 C1060 448 1060 296 960 296" class="p"/><text x="1066" y="375" text-anchor="middle" class="b">copy_up</text>
  <circle r="10" class="file"><animateMotion dur="4s" repeatCount="indefinite" path="M955 448 C1060 448 1060 296 955 296"/></circle>
  <rect x="100" y="544" width="1000" height="70" rx="6" fill="#ffffff" stroke="#34495e" stroke-width="2"/>
  <text x="600" y="571" text-anchor="middle" class="b">Read: use lower object directly. First write: copy metadata and data upward, then modify upper.</text>
  <text x="600" y="597" text-anchor="middle" class="n">Delete: create a whiteout in upper so the lower name stays hidden without mutating the immutable image.</text>
</svg>
