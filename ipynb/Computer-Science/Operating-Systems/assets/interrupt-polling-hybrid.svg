<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="850" viewBox="0 0 1600 850" role="img" aria-labelledby="title desc">
  <title id="title">Choosing interrupts, polling, or a hybrid</title>
  <desc id="desc">A workload-density chart and timeline show why interrupts suit sparse events, polling suits sustained load, and hybrid schemes switch from an interrupt to a bounded polling phase.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#334155"/></marker><style>.h{font:700 30px system-ui,sans-serif;fill:#111827}.t{font:700 18px system-ui,sans-serif;fill:#111827}.s{font:15px system-ui,sans-serif;fill:#334155}.axis{fill:none;stroke:#334155;stroke-width:3;marker-end:url(#a)}.line{fill:none;stroke-width:5}.box{stroke:#334155;stroke-width:2}</style></defs>
  <rect width="1600" height="850" fill="#fff"/><text x="800" y="48" text-anchor="middle" class="h">The best notification policy changes with event density</text>
  <rect x="70" y="95" width="700" height="610" rx="8" fill="#f8fafc" class="box"/><text x="420" y="135" text-anchor="middle" class="t">CPU cost per useful completion</text>
  <path d="M145 625 V185" class="axis"/><path d="M145 625 H690" class="axis"/>
  <text x="420" y="675" text-anchor="middle" class="s">completion rate / offered load →</text><text x="102" y="405" transform="rotate(-90 102 405)" text-anchor="middle" class="s">CPU cost per completion →</text>
  <path d="M170 270 C250 300 380 390 650 570" stroke="#16a34a" class="line"/><text x="215" y="250" class="t" fill="#15803d">interrupt</text>
  <path d="M170 575 C310 460 470 330 650 245" stroke="#2563eb" class="line"/><text x="555" y="225" class="t" fill="#1d4ed8">polling</text>
  <circle cx="420" cy="390" r="10" fill="#7c3aed"/><path d="M420 390 V625" stroke="#7c3aed" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="420" y="365" text-anchor="middle" class="s" fill="#6d28d9">crossover depends on hardware, batching and latency target</text>
  <text x="195" y="605" class="s">idle: polls waste cycles</text><text x="465" y="605" class="s">busy: IRQs can become a storm</text>

  <rect x="830" y="95" width="700" height="610" rx="8" fill="#f0fdf4" class="box"/><text x="1180" y="135" text-anchor="middle" class="t">Hybrid receive path (for example, Linux NAPI)</text>
  <line x1="900" y1="230" x2="1460" y2="230" stroke="#334155" stroke-width="3"/>
  <circle cx="940" cy="230" r="12" fill="#16a34a"/><text x="940" y="195" text-anchor="middle" class="t">IRQ</text><text x="940" y="270" text-anchor="middle" class="s">first packet</text>
  <path d="M952 230 H1030" class="axis"/>
  <rect x="1030" y="180" width="250" height="100" rx="8" fill="#dcfce7" class="box"/><text x="1155" y="218" text-anchor="middle" class="t">Mask more IRQs</text><text x="1155" y="248" text-anchor="middle" class="s">schedule poll work</text>
  <path d="M1280 230 H1350" class="axis"/>
  <rect x="1350" y="180" width="130" height="100" rx="8" fill="#dbeafe" class="box"/><text x="1415" y="218" text-anchor="middle" class="t">Poll</text><text x="1415" y="248" text-anchor="middle" class="s">to budget</text>
  <path d="M1415 280 V370 H1040" class="axis"/>
  <polygon points="1040,320 1230,320 1280,370 1230,420 1040,420 990,370" fill="#fef3c7" class="box"/><text x="1135" y="360" text-anchor="middle" class="t">Queue drained?</text><text x="1135" y="390" text-anchor="middle" class="s">or budget exhausted?</text>
  <path d="M990 370 H915 V505" class="axis"/><text x="928" y="350" class="s">drained</text>
  <rect x="850" y="505" width="250" height="100" rx="8" fill="#dcfce7" class="box"/><text x="975" y="544" text-anchor="middle" class="t">Unmask IRQs</text><text x="975" y="574" text-anchor="middle" class="s">return to low idle cost</text>
  <path d="M1280 370 H1445 V505" class="axis"/><text x="1300" y="350" class="s">more work</text>
  <rect x="1320" y="505" width="250" height="100" rx="8" fill="#dbeafe" class="box" transform="translate(-65 0)"/><text x="1380" y="544" text-anchor="middle" class="t">Reschedule poll</text><text x="1380" y="574" text-anchor="middle" class="s">preserve fairness</text>
  <text x="800" y="770" text-anchor="middle" class="s">Interrupt coalescing and bounded polling amortize overhead, but they add batching delay and must preserve fairness across queues.</text>
</svg>
