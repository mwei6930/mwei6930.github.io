<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1540 720" role="img" aria-labelledby="title desc">
  <title id="title">Copy-on-write fork in three stages</title>
  <desc id="desc">Before fork the parent owns pages, after fork parent and child mappings share read-only frames, and after a child write fault only the modified page is copied.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#355070"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17212b; }
      .title { font-size: 31px; font-weight: 700; }
      .head { font-size: 21px; font-weight: 700; }
      .body { font-size: 17px; }
      .small { font-size: 15px; }
      .box { stroke: #355070; stroke-width: 2.3; rx: 7; }
      .arrow { stroke: #355070; stroke-width: 2.8; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1540" height="720" fill="#fff"/>
  <text x="770" y="45" text-anchor="middle" class="title">Copy-on-Write Delays Copying Until a Process Modifies a Page</text>

  <rect x="45" y="90" width="435" height="520" class="box" fill="#f8fafb"/>
  <text x="263" y="128" text-anchor="middle" class="head">Before fork()</text>
  <rect x="93" y="170" width="145" height="190" class="box" fill="#e9f2fb"/>
  <text x="166" y="204" text-anchor="middle" class="head">Parent PTEs</text>
  <text x="166" y="245" text-anchor="middle" class="body">page A: RW</text>
  <text x="166" y="285" text-anchor="middle" class="body">page B: RW</text>
  <text x="166" y="325" text-anchor="middle" class="body">page C: RW</text>
  <rect x="307" y="158" width="125" height="65" class="box" fill="#edf5e8"/><text x="370" y="197" text-anchor="middle" class="body">frame A</text>
  <rect x="307" y="246" width="125" height="65" class="box" fill="#fff3d9"/><text x="370" y="285" text-anchor="middle" class="body">frame B</text>
  <rect x="307" y="334" width="125" height="65" class="box" fill="#f1eef8"/><text x="370" y="373" text-anchor="middle" class="body">frame C</text>
  <path d="M238 245 L307 191" class="arrow"/><path d="M238 285 L307 279" class="arrow"/><path d="M238 325 L307 367" class="arrow"/>
  <text x="263" y="455" text-anchor="middle" class="body">One address space maps writable frames.</text>
  <text x="263" y="486" text-anchor="middle" class="small">Reference count = 1 for each frame.</text>

  <rect x="553" y="90" width="435" height="520" class="box" fill="#f8fafb"/>
  <text x="771" y="128" text-anchor="middle" class="head">Immediately after fork()</text>
  <rect x="584" y="167" width="140" height="173" class="box" fill="#e9f2fb"/>
  <text x="654" y="200" text-anchor="middle" class="head">Parent</text>
  <text x="654" y="240" text-anchor="middle" class="body">A: R + COW</text><text x="654" y="275" text-anchor="middle" class="body">B: R + COW</text><text x="654" y="310" text-anchor="middle" class="body">C: R + COW</text>
  <rect x="818" y="167" width="140" height="173" class="box" fill="#fdebea"/>
  <text x="888" y="200" text-anchor="middle" class="head">Child</text>
  <text x="888" y="240" text-anchor="middle" class="body">A: R + COW</text><text x="888" y="275" text-anchor="middle" class="body">B: R + COW</text><text x="888" y="310" text-anchor="middle" class="body">C: R + COW</text>
  <rect x="665" y="397" width="210" height="60" class="box" fill="#edf5e8"/><text x="770" y="433" text-anchor="middle" class="body">shared frames A, B, C</text>
  <path d="M654 340 L700 397" class="arrow"/><path d="M888 340 L840 397" class="arrow"/>
  <text x="771" y="502" text-anchor="middle" class="body">Page tables are distinct; physical data is shared.</text>
  <text x="771" y="533" text-anchor="middle" class="small">Writable mappings become read-only so a write causes a fault.</text>

  <rect x="1060" y="90" width="435" height="520" class="box" fill="#f8fafb"/>
  <text x="1278" y="128" text-anchor="middle" class="head">Child writes page B</text>
  <rect x="1095" y="170" width="145" height="190" class="box" fill="#fdebea"/>
  <text x="1168" y="204" text-anchor="middle" class="head">Child PTEs</text>
  <text x="1168" y="245" text-anchor="middle" class="body">A: shared R</text>
  <text x="1168" y="285" text-anchor="middle" class="body">B': private RW</text>
  <text x="1168" y="325" text-anchor="middle" class="body">C: shared R</text>
  <rect x="1322" y="158" width="125" height="65" class="box" fill="#edf5e8"/><text x="1385" y="197" text-anchor="middle" class="body">frame A</text>
  <rect x="1322" y="246" width="125" height="65" class="box" fill="#e6f5ef"/><text x="1385" y="285" text-anchor="middle" class="body">new B'</text>
  <rect x="1322" y="334" width="125" height="65" class="box" fill="#f1eef8"/><text x="1385" y="373" text-anchor="middle" class="body">frame C</text>
  <path d="M1240 245 L1322 191" class="arrow"/><path d="M1240 285 L1322 279" class="arrow"/><path d="M1240 325 L1322 367" class="arrow"/>
  <text x="1278" y="455" text-anchor="middle" class="body">Fault -> allocate -> copy B -> remap writable.</text>
  <text x="1278" y="486" text-anchor="middle" class="small">The parent still maps the original frame B.</text>

  <path d="M480 350 L553 350" class="arrow"/><text x="517" y="334" text-anchor="middle" class="small">fork</text>
  <path d="M988 350 L1060 350" class="arrow"/><text x="1024" y="334" text-anchor="middle" class="small">write fault</text>
  <rect x="245" y="640" width="1050" height="52" rx="8" fill="#fff3d9" stroke="#7c8794" stroke-width="2"/>
  <text x="770" y="672" text-anchor="middle" class="body">If the child quickly calls execve(), most inherited pages are never copied at all.</text>
</svg>
