<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="850" viewBox="0 0 1600 850" role="img" aria-labelledby="title desc">
  <title id="title">Local and global page replacement</title><desc id="desc">Local replacement chooses a victim inside the faulting workload's allocation; global replacement chooses from a shared eligible pool. Memory cgroups create controlled pools between those extremes.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#334155"/></marker><style>.h{font:700 30px system-ui,sans-serif;fill:#111827}.t{font:700 18px system-ui,sans-serif;fill:#111827}.s{font:15px system-ui,sans-serif;fill:#334155}.box{stroke:#334155;stroke-width:2}.line{fill:none;stroke:#334155;stroke-width:3;marker-end:url(#a)}</style></defs>
  <rect width="1600" height="850" fill="#fff"/><text x="800" y="48" text-anchor="middle" class="h">Victim scope trades isolation against flexible capacity</text>
  <text x="410" y="105" text-anchor="middle" class="t">Local scope</text><text x="1190" y="105" text-anchor="middle" class="t">Global scope</text>
  <rect x="80" y="145" width="660" height="510" rx="8" fill="#eff6ff" class="box"/>
  <rect x="130" y="205" width="240" height="155" rx="8" fill="#dbeafe" class="box"/><text x="250" y="245" text-anchor="middle" class="t">Workload A</text><text x="250" y="280" text-anchor="middle" class="s">fault asks for one frame</text><text x="250" y="313" text-anchor="middle" class="s">quota: 4 resident pages</text>
  <rect x="450" y="205" width="240" height="155" rx="8" fill="#ede9fe" class="box"/><text x="570" y="245" text-anchor="middle" class="t">Workload B</text><text x="570" y="280" text-anchor="middle" class="s">hot set remains protected</text><text x="570" y="313" text-anchor="middle" class="s">its frames are not candidates</text>
  <g class="box"><rect x="145" y="435" width="90" height="70" rx="5" fill="#dcfce7"/><rect x="245" y="435" width="90" height="70" rx="5" fill="#dcfce7"/><rect x="345" y="435" width="90" height="70" rx="5" fill="#fee2e2"/><rect x="445" y="435" width="90" height="70" rx="5" fill="#e2e8f0"/><rect x="545" y="435" width="90" height="70" rx="5" fill="#e2e8f0"/></g>
  <text x="390" y="475" text-anchor="middle" class="s">victim A3</text><path d="M250 360 V415 H390 V435" class="line"/>
  <text x="410" y="575" text-anchor="middle" class="s">predictable isolation; idle capacity can be stranded</text>

  <rect x="860" y="145" width="660" height="510" rx="8" fill="#fff7ed" class="box"/>
  <rect x="910" y="205" width="240" height="155" rx="8" fill="#dbeafe" class="box"/><text x="1030" y="245" text-anchor="middle" class="t">Workload A</text><text x="1030" y="280" text-anchor="middle" class="s">fault joins shared reclaim</text><text x="1030" y="313" text-anchor="middle" class="s">can borrow unused capacity</text>
  <rect x="1230" y="205" width="240" height="155" rx="8" fill="#ede9fe" class="box"/><text x="1350" y="245" text-anchor="middle" class="t">Workload B</text><text x="1350" y="280" text-anchor="middle" class="s">cold pages may be selected</text><text x="1350" y="313" text-anchor="middle" class="s">even for A's allocation</text>
  <g class="box"><rect x="925" y="435" width="90" height="70" rx="5" fill="#dcfce7"/><rect x="1025" y="435" width="90" height="70" rx="5" fill="#dcfce7"/><rect x="1125" y="435" width="90" height="70" rx="5" fill="#e2e8f0"/><rect x="1225" y="435" width="90" height="70" rx="5" fill="#fee2e2"/><rect x="1325" y="435" width="90" height="70" rx="5" fill="#e2e8f0"/></g>
  <text x="1270" y="475" text-anchor="middle" class="s">victim B2</text><path d="M1030 360 V415 H1270 V435" class="line"/>
  <text x="1190" y="575" text-anchor="middle" class="s">better utilization; latency interference can cross workloads</text>

  <rect x="285" y="715" width="1030" height="92" rx="8" fill="#ecfeff" class="box"/><text x="800" y="750" text-anchor="middle" class="t">Memory cgroups create bounded global pools</text><text x="800" y="780" text-anchor="middle" class="s">Reclaim can be global inside a container or service budget while preserving isolation between budgets.</text>
</svg>
