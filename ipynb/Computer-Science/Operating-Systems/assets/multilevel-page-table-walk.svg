<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Four-level page-table walk for a 4 KiB page</title>
  <desc id="desc">A virtual address supplies four nine-bit indexes and a twelve-bit offset. A root register points to the top table; one entry at each level leads to the next table and finally to a data frame. Unused branches need no lower-level table.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#374151"/></marker><style>.h{font:700 28px system-ui,sans-serif;fill:#111827}.t{font:600 17px system-ui,sans-serif;fill:#111827}.s{font:14px system-ui,sans-serif;fill:#374151}.box{stroke:#374151;stroke-width:2}.line{fill:none;stroke:#374151;stroke-width:3;marker-end:url(#arrow)}.dash{fill:none;stroke:#94a3b8;stroke-width:2;stroke-dasharray:7 6}</style></defs>
  <rect width="1600" height="900" fill="#ffffff"/>
  <text x="800" y="43" text-anchor="middle" class="h">Multilevel paging allocates tables only along populated virtual ranges</text>
  <text x="800" y="92" text-anchor="middle" class="t">Conceptual 48-bit translation with 4 KiB pages and 8-byte entries</text>
  <g class="box"><rect x="205" y="120" width="230" height="70" fill="#dbeafe"/><rect x="435" y="120" width="230" height="70" fill="#e0f2fe"/><rect x="665" y="120" width="230" height="70" fill="#dcfce7"/><rect x="895" y="120" width="230" height="70" fill="#f3e8ff"/><rect x="1125" y="120" width="270" height="70" fill="#fef3c7"/></g>
  <text x="320" y="151" text-anchor="middle" class="t">L4 index [47:39]</text><text x="320" y="176" text-anchor="middle" class="s">9 bits</text>
  <text x="550" y="151" text-anchor="middle" class="t">L3 index [38:30]</text><text x="550" y="176" text-anchor="middle" class="s">9 bits</text>
  <text x="780" y="151" text-anchor="middle" class="t">L2 index [29:21]</text><text x="780" y="176" text-anchor="middle" class="s">9 bits</text>
  <text x="1010" y="151" text-anchor="middle" class="t">L1 index [20:12]</text><text x="1010" y="176" text-anchor="middle" class="s">9 bits</text>
  <text x="1260" y="151" text-anchor="middle" class="t">page offset [11:0]</text><text x="1260" y="176" text-anchor="middle" class="s">12 bits, unchanged</text>

  <rect x="55" y="275" width="170" height="90" rx="8" fill="#fef3c7" class="box"/><text x="140" y="310" text-anchor="middle" class="t">root register</text><text x="140" y="338" text-anchor="middle" class="s">physical address of L4</text>
  <path d="M225 320 H290" class="line"/>

  <g>
    <rect x="290" y="245" width="220" height="250" rx="8" fill="#f8fafc" class="box"/><text x="400" y="278" text-anchor="middle" class="t">L4 table</text>
    <rect x="320" y="305" width="160" height="45" rx="5" fill="#e5e7eb" class="box"/><text x="400" y="334" text-anchor="middle" class="s">invalid branch</text>
    <rect x="320" y="365" width="160" height="55" rx="5" fill="#dbeafe" class="box"/><text x="400" y="399" text-anchor="middle" class="t">selected entry</text>
    <rect x="320" y="435" width="160" height="35" rx="5" fill="#e5e7eb" class="box"/>
  </g>
  <g>
    <rect x="570" y="245" width="220" height="250" rx="8" fill="#f8fafc" class="box"/><text x="680" y="278" text-anchor="middle" class="t">L3 table</text>
    <rect x="600" y="305" width="160" height="45" rx="5" fill="#e5e7eb" class="box"/>
    <rect x="600" y="365" width="160" height="55" rx="5" fill="#e0f2fe" class="box"/><text x="680" y="399" text-anchor="middle" class="t">selected entry</text>
    <rect x="600" y="435" width="160" height="35" rx="5" fill="#e5e7eb" class="box"/>
  </g>
  <g>
    <rect x="850" y="245" width="220" height="250" rx="8" fill="#f8fafc" class="box"/><text x="960" y="278" text-anchor="middle" class="t">L2 table</text>
    <rect x="880" y="305" width="160" height="45" rx="5" fill="#e5e7eb" class="box"/>
    <rect x="880" y="365" width="160" height="55" rx="5" fill="#dcfce7" class="box"/><text x="960" y="399" text-anchor="middle" class="t">selected entry</text>
    <rect x="880" y="435" width="160" height="35" rx="5" fill="#fef3c7" class="box"/><text x="960" y="459" text-anchor="middle" class="s">possible huge-page leaf</text>
  </g>
  <g>
    <rect x="1130" y="245" width="220" height="250" rx="8" fill="#f8fafc" class="box"/><text x="1240" y="278" text-anchor="middle" class="t">L1 table</text>
    <rect x="1160" y="305" width="160" height="45" rx="5" fill="#e5e7eb" class="box"/>
    <rect x="1160" y="365" width="160" height="55" rx="5" fill="#f3e8ff" class="box"/><text x="1240" y="388" text-anchor="middle" class="t">leaf PTE</text><text x="1240" y="409" text-anchor="middle" class="s">PFN + permissions</text>
    <rect x="1160" y="435" width="160" height="35" rx="5" fill="#e5e7eb" class="box"/>
  </g>
  <path d="M480 393 H600" class="line"/><path d="M760 393 H880" class="line"/><path d="M1040 393 H1160" class="line"/>
  <rect x="1395" y="325" width="160" height="135" rx="8" fill="#ffedd5" class="box"/><text x="1475" y="370" text-anchor="middle" class="t">data frame</text><text x="1475" y="399" text-anchor="middle" class="s">PFN selects page</text><text x="1475" y="425" text-anchor="middle" class="s">offset selects byte</text>
  <path d="M1320 393 H1395" class="line"/>

  <rect x="190" y="585" width="1220" height="180" rx="8" fill="#f8fafc" class="box"/>
  <text x="800" y="625" text-anchor="middle" class="t">Why this is smaller than a linear table</text>
  <path d="M330 675 H1270" class="dash"/>
  <circle cx="400" cy="675" r="18" fill="#dbeafe" class="box"/><circle cx="680" cy="675" r="18" fill="#e0f2fe" class="box"/><circle cx="960" cy="675" r="18" fill="#dcfce7" class="box"/><circle cx="1240" cy="675" r="18" fill="#f3e8ff" class="box"/>
  <text x="800" y="723" text-anchor="middle" class="s">Only the four table pages on this populated path are required; a missing upper entry represents a very large unmapped range.</text>
  <text x="800" y="810" text-anchor="middle" class="s">The space saving costs extra dependent memory reads on a TLB miss, although page-walk caches often retain upper-level entries.</text>
</svg>
