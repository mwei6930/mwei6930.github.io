<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Binary buddy allocation split and merge</title><desc id="desc">An order-three block of eight pages is repeatedly split to satisfy a two-page request. On free, a block can merge only with its aligned buddy when that buddy is also free and has the same order.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#334155"/></marker><style>.h{font:700 30px system-ui,sans-serif;fill:#111827}.t{font:700 18px system-ui,sans-serif;fill:#111827}.s{font:15px system-ui,sans-serif;fill:#334155}.mono{font:600 15px ui-monospace,monospace;fill:#111827}.box{stroke:#334155;stroke-width:2}.line{fill:none;stroke:#334155;stroke-width:3;marker-end:url(#a)}.merge{fill:none;stroke:#15803d;stroke-width:5;stroke-dasharray:10 7;marker-end:url(#a);animation:m 4.5s infinite}@keyframes m{0%,15%{opacity:.1;stroke-dashoffset:50}55%,85%{opacity:1;stroke-dashoffset:0}100%{opacity:.1}}</style></defs>
  <rect width="1600" height="900" fill="#fff"/><text x="800" y="48" text-anchor="middle" class="h">Buddy allocation rounds to powers of two so free blocks can coalesce quickly</text>
  <text x="315" y="105" text-anchor="middle" class="t">Allocate two contiguous pages</text><text x="1270" y="105" text-anchor="middle" class="t">Free and merge with aligned buddies</text>

  <rect x="95" y="155" width="440" height="95" rx="8" fill="#dbeafe" class="box"/><text x="315" y="194" text-anchor="middle" class="t">Order 3: 8 pages</text><text x="315" y="224" text-anchor="middle" class="mono">[0 1 2 3 4 5 6 7]</text>
  <path d="M315 250 V305" class="line"/>
  <rect x="70" y="305" width="230" height="95" rx="8" fill="#e0f2fe" class="box"/><text x="185" y="344" text-anchor="middle" class="t">Order 2</text><text x="185" y="374" text-anchor="middle" class="mono">[0 1 2 3]</text>
  <rect x="330" y="305" width="230" height="95" rx="8" fill="#e2e8f0" class="box"/><text x="445" y="344" text-anchor="middle" class="t">Order 2 free</text><text x="445" y="374" text-anchor="middle" class="mono">[4 5 6 7]</text>
  <path d="M185 400 V455" class="line"/>
  <rect x="70" y="455" width="230" height="95" rx="8" fill="#dcfce7" class="box"/><text x="185" y="494" text-anchor="middle" class="t">Order 1 allocated</text><text x="185" y="524" text-anchor="middle" class="mono">[0 1]</text>
  <rect x="330" y="455" width="230" height="95" rx="8" fill="#e2e8f0" class="box"/><text x="445" y="494" text-anchor="middle" class="t">Order 1 free</text><text x="445" y="524" text-anchor="middle" class="mono">[2 3]</text>
  <text x="315" y="620" text-anchor="middle" class="s">The allocator keeps separate free lists by order.</text>

  <rect x="985" y="455" width="230" height="95" rx="8" fill="#dcfce7" class="box"/><text x="1100" y="494" text-anchor="middle" class="t">Free [0 1]</text><text x="1100" y="524" text-anchor="middle" class="mono">buddy = [2 3]</text>
  <rect x="1245" y="455" width="230" height="95" rx="8" fill="#e2e8f0" class="box"/><text x="1360" y="494" text-anchor="middle" class="t">Free [2 3]</text><text x="1360" y="524" text-anchor="middle" class="mono">same order, aligned</text>
  <path d="M1100 455 V395 H1230" class="merge"/><path d="M1360 455 V395 H1230" class="merge"/>
  <rect x="1115" y="285" width="230" height="95" rx="8" fill="#e0f2fe" class="box"/><text x="1230" y="324" text-anchor="middle" class="t">Merge to order 2</text><text x="1230" y="354" text-anchor="middle" class="mono">[0 1 2 3]</text>
  <path d="M1230 285 V230" class="merge"/>
  <rect x="1115" y="135" width="230" height="95" rx="8" fill="#dbeafe" class="box"/><text x="1230" y="174" text-anchor="middle" class="t">Maybe merge again</text><text x="1230" y="204" text-anchor="middle" class="mono">if [4..7] is free</text>

  <rect x="230" y="720" width="1140" height="125" rx="8" fill="#f1f5f9" class="box"/>
  <text x="800" y="760" text-anchor="middle" class="t">Fast coalescing has a price</text>
  <text x="800" y="792" text-anchor="middle" class="s">A request for 5 pages consumes an 8-page block: internal fragmentation. Free memory can also be plentiful but split into unsuitable orders.</text>
  <text x="800" y="819" text-anchor="middle" class="s">The buddy allocator serves page-sized blocks; small kernel objects are normally layered on top through slab-style caches.</text>
</svg>
