<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Threat model and trusted computing base</title>
  <desc id="desc">Assets, adversary capabilities, entry points, security properties, assumptions, and the trusted computing base are connected.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#4e6073"/></marker></defs>
  <style>text{font-family:Arial,sans-serif;fill:#172235}.title{font-size:28px;font-weight:700}.head{font-size:19px;font-weight:700}.body{font-size:15px}.small{font-size:13px;fill:#526274}.box{stroke:#66788b;stroke-width:2}.arrow{stroke:#4e6073;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style>
  <rect width="1200" height="680" fill="#f7f9fb"/><text x="600" y="42" text-anchor="middle" class="title">A threat model states the game; the TCB contains what must win it</text>
  <rect x="55" y="85" width="250" height="160" rx="8" fill="#e6f0ff" class="box"/><text x="180" y="116" text-anchor="middle" class="head">Assets</text><text x="78" y="151" class="body">• file contents and keys</text><text x="78" y="178" class="body">• process control and identity</text><text x="78" y="205" class="body">• service availability</text><text x="78" y="232" class="body">• audit evidence</text>
  <rect x="55" y="277" width="250" height="190" rx="8" fill="#ffe6e3" class="box"/><text x="180" y="308" text-anchor="middle" class="head">Adversary powers</text><text x="78" y="343" class="body">• arbitrary unprivileged code</text><text x="78" y="370" class="body">• crafted syscall arguments</text><text x="78" y="397" class="body">• races and resource pressure</text><text x="78" y="424" class="body">• stolen user credential?</text><text x="78" y="451" class="body">• physical/kernel access?</text>
  <rect x="356" y="85" width="250" height="160" rx="8" fill="#fff2d5" class="box"/><text x="481" y="116" text-anchor="middle" class="head">Entry points</text><text x="379" y="151" class="body">syscalls and ioctls</text><text x="379" y="178" class="body">executables and loaders</text><text x="379" y="205" class="body">files, IPC, sockets, devices</text><text x="379" y="232" class="body">admin and recovery paths</text>
  <rect x="356" y="277" width="250" height="190" rx="8" fill="#e5f7ed" class="box"/><text x="481" y="308" text-anchor="middle" class="head">Required properties</text><text x="379" y="343" class="body">confidentiality</text><text x="379" y="370" class="body">integrity and authenticity</text><text x="379" y="397" class="body">availability and quotas</text><text x="379" y="424" class="body">accountability</text><text x="379" y="451" class="body">controlled delegation</text>
  <path d="M305 165H356M305 372H356" class="arrow"/>
  <rect x="680" y="85" width="465" height="382" rx="8" fill="#eee9ff" class="box"/><text x="912" y="120" text-anchor="middle" class="head">Trusted Computing Base (TCB)</text>
  <rect x="716" y="149" width="190" height="78" rx="8" fill="#fff" class="box"/><text x="811" y="180" text-anchor="middle" class="body">CPU privilege + MMU</text><text x="811" y="203" text-anchor="middle" class="small">enforcement foundation</text>
  <rect x="920" y="149" width="190" height="78" rx="8" fill="#fff" class="box"/><text x="1015" y="180" text-anchor="middle" class="body">Kernel security paths</text><text x="1015" y="203" text-anchor="middle" class="small">mediation and isolation</text>
  <rect x="716" y="248" width="190" height="78" rx="8" fill="#fff" class="box"/><text x="811" y="279" text-anchor="middle" class="body">Boot + policy config</text><text x="811" y="302" text-anchor="middle" class="small">what code and rules load</text>
  <rect x="920" y="248" width="190" height="78" rx="8" fill="#fff" class="box"/><text x="1015" y="279" text-anchor="middle" class="body">Privileged helpers</text><text x="1015" y="302" text-anchor="middle" class="small">brokers and identity services</text>
  <rect x="716" y="347" width="394" height="78" rx="8" fill="#dff4f5" class="box"/><text x="913" y="378" text-anchor="middle" class="body">Security-relevant state and update path</text><text x="913" y="401" text-anchor="middle" class="small">credentials, labels, ACLs, capabilities, keys, audit configuration</text>
  <path d="M606 276H680" class="arrow"/>
  <rect x="145" y="514" width="910" height="105" rx="8" fill="#fff" class="box"/><text x="600" y="546" text-anchor="middle" class="head">Assumptions are part of the result</text><text x="600" y="576" text-anchor="middle" class="body">A proof about user-space attackers does not cover a malicious kernel, DMA device, firmware, administrator, or physical replacement.</text><text x="600" y="602" text-anchor="middle" class="small">Shrink the TCB, remove unnecessary privilege, and state excluded failures instead of silently treating them as impossible.</text>
  <path d="M912 467V514" class="arrow"/>
</svg>
