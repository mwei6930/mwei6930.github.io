<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc">
  <title id="title">Demand-paging page-fault lifecycle</title>
  <desc id="desc">A legal memory access with no resident page is classified by backing source, supplied with a frame, populated, installed, and restarted. Invalid and protection violations leave through a signal path.</desc>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#334155"/></marker>
    <style>.h{font:700 30px system-ui,sans-serif;fill:#111827}.t{font:700 18px system-ui,sans-serif;fill:#111827}.s{font:15px system-ui,sans-serif;fill:#334155}.box{stroke:#334155;stroke-width:2}.line{fill:none;stroke:#334155;stroke-width:3;marker-end:url(#a)}.ok{fill:none;stroke:#15803d;stroke-width:3;marker-end:url(#a)}.bad{fill:none;stroke:#dc2626;stroke-width:3;marker-end:url(#a)}</style>
  </defs>
  <rect width="1600" height="940" fill="#fff"/>
  <text x="800" y="48" text-anchor="middle" class="h">A legal fault is repaired by reconstructing one missing mapping</text>

  <rect x="570" y="85" width="460" height="88" rx="8" fill="#dbeafe" class="box"/>
  <text x="800" y="120" text-anchor="middle" class="t">CPU traps on a non-present or write-protected PTE</text>
  <text x="800" y="150" text-anchor="middle" class="s">fault address + read/write/execute + privilege + architectural cause</text>
  <path d="M800 173 V220" class="line"/>

  <polygon points="585,220 1015,220 1080,280 1015,340 585,340 520,280" fill="#fef3c7" class="box"/>
  <text x="800" y="267" text-anchor="middle" class="t">Does a current region authorize this access?</text>
  <text x="800" y="297" text-anchor="middle" class="s">revalidate address range and permissions under synchronization</text>
  <path d="M520 280 H300 V370" class="bad"/><text x="400" y="262" class="s" fill="#b91c1c">no</text>
  <rect x="90" y="370" width="420" height="102" rx="8" fill="#fee2e2" class="box"/>
  <text x="300" y="410" text-anchor="middle" class="t">Reject the access</text>
  <text x="300" y="440" text-anchor="middle" class="s">SIGSEGV / SIGBUS or a controlled kernel error path</text>
  <path d="M800 340 V385" class="ok"/><text x="820" y="370" class="s" fill="#15803d">yes</text>

  <rect x="500" y="385" width="600" height="98" rx="8" fill="#ede9fe" class="box"/>
  <text x="800" y="422" text-anchor="middle" class="t">Resolve the backing source and page identity</text>
  <text x="800" y="452" text-anchor="middle" class="s">anonymous zero | private COW | page cache | swap entry</text>

  <path d="M800 483 V535" class="line"/>
  <rect x="150" y="535" width="270" height="105" rx="8" fill="#ecfeff" class="box"/>
  <text x="285" y="574" text-anchor="middle" class="t">Zero</text><text x="285" y="604" text-anchor="middle" class="s">clear a new frame or map</text><text x="285" y="627" text-anchor="middle" class="s">the shared zero page</text>
  <rect x="493" y="535" width="270" height="105" rx="8" fill="#fce7f3" class="box"/>
  <text x="628" y="574" text-anchor="middle" class="t">Copy</text><text x="628" y="604" text-anchor="middle" class="s">allocate private frame and</text><text x="628" y="627" text-anchor="middle" class="s">copy old page contents</text>
  <rect x="836" y="535" width="270" height="105" rx="8" fill="#dcfce7" class="box"/>
  <text x="971" y="574" text-anchor="middle" class="t">Page cache</text><text x="971" y="604" text-anchor="middle" class="s">reuse resident file folio or</text><text x="971" y="627" text-anchor="middle" class="s">wait for file read</text>
  <rect x="1179" y="535" width="270" height="105" rx="8" fill="#ffedd5" class="box"/>
  <text x="1314" y="574" text-anchor="middle" class="t">Swap</text><text x="1314" y="604" text-anchor="middle" class="s">find swap entry and bring</text><text x="1314" y="627" text-anchor="middle" class="s">anonymous data back</text>
  <path d="M800 483 V505 H285 V535" class="line"/><path d="M800 505 H628 V535" class="line"/><path d="M800 505 H971 V535" class="line"/><path d="M800 505 H1314 V535" class="line"/>

  <path d="M285 640 V690 H800" class="line"/><path d="M628 640 V690 H800" class="line"/><path d="M971 640 V690 H800" class="line"/><path d="M1314 640 V690 H800" class="line"/>
  <rect x="470" y="690" width="660" height="92" rx="8" fill="#e0f2fe" class="box"/>
  <text x="800" y="727" text-anchor="middle" class="t">Acquire and lock a frame, then install the PTE atomically</text>
  <text x="800" y="757" text-anchor="middle" class="s">reclaim may be needed; another thread may win the same fault race</text>
  <path d="M800 782 V827" class="ok"/>
  <rect x="520" y="827" width="560" height="76" rx="8" fill="#dcfce7" class="box"/>
  <text x="800" y="859" text-anchor="middle" class="t">Refresh translation state and restart the instruction</text>
  <text x="800" y="885" text-anchor="middle" class="s">the ordinary load/store now observes a valid mapping</text>
</svg>
