<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" role="img" aria-labelledby="title desc">
  <title id="title">Object capability delegation with narrowed rights</title>
  <desc id="desc">A broker resolves a resource and delegates a write-only capability to a worker, which cannot forge broader rights or reach an unrelated object.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#46596d"/></marker></defs>
  <style>text{font-family:Arial,sans-serif;fill:#172235}.title{font-size:28px;font-weight:700}.head{font-size:19px;font-weight:700}.body{font-size:15px}.small{font-size:13px;fill:#526274}.box{stroke:#65788b;stroke-width:2}.arrow{stroke:#46596d;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.deny{stroke:#c84c4c;stroke-width:3;stroke-dasharray:8 7;fill:none}</style>
  <rect width="1200" height="670" fill="#f7f9fb"/><text x="600" y="42" text-anchor="middle" class="title">Delegation passes exactly the authority needed for one object</text>
  <rect x="55" y="118" width="245" height="205" rx="8" fill="#e6f0ff" class="box"/><text x="177" y="153" text-anchor="middle" class="head">Privileged broker</text><text x="177" y="190" text-anchor="middle" class="body">resolves configured path</text><text x="177" y="220" text-anchor="middle" class="body">checks policy and owner</text><text x="177" y="250" text-anchor="middle" class="body">opens destination safely</text><text x="177" y="290" text-anchor="middle" class="small">ambient authority is confined here</text>
  <rect x="402" y="105" width="310" height="230" rx="8" fill="#eee9ff" class="box"/><text x="557" y="140" text-anchor="middle" class="head">Delegated capability</text><rect x="452" y="172" width="210" height="112" rx="8" fill="#fff" class="box"/><text x="557" y="202" text-anchor="middle" class="body">object: result inode</text><text x="557" y="230" text-anchor="middle" class="body">rights: write only</text><text x="557" y="258" text-anchor="middle" class="body">reference: fd 4</text><text x="557" y="310" text-anchor="middle" class="small">kernel-managed and unforgeable</text>
  <rect x="810" y="118" width="245" height="205" rx="8" fill="#e5f7ed" class="box"/><text x="932" y="153" text-anchor="middle" class="head">Unprivileged worker</text><text x="932" y="190" text-anchor="middle" class="body">receives fd over IPC</text><text x="932" y="220" text-anchor="middle" class="body">writes filtered output</text><text x="932" y="250" text-anchor="middle" class="body">cannot choose another path</text><text x="932" y="290" text-anchor="middle" class="small">authority follows the handle</text>
  <path d="M300 220H402M712 220H810" class="arrow"/>
  <rect x="142" y="423" width="290" height="125" rx="8" fill="#fff2d5" class="box"/><text x="287" y="457" text-anchor="middle" class="head">Target object</text><text x="287" y="491" text-anchor="middle" class="body">/safe/output/result.txt</text><text x="287" y="519" text-anchor="middle" class="small">descriptor keeps stable object identity</text>
  <rect x="770" y="423" width="290" height="125" rx="8" fill="#ffe6e3" class="box"/><text x="915" y="457" text-anchor="middle" class="head">Unrelated secret</text><text x="915" y="491" text-anchor="middle" class="body">/etc/shadow</text><text x="915" y="519" text-anchor="middle" class="small">no capability, no operation</text>
  <path d="M557 335V378H287V423" class="arrow"/><path d="M932 323V387H915V423" class="deny"/><text x="950" y="383" class="small">cannot forge</text>
  <rect x="170" y="590" width="860" height="50" rx="8" fill="#dff4f5" class="box"/><text x="600" y="621" text-anchor="middle" class="body">A Unix file descriptor is capability-like only when naming channels and ambient ways to reopen broader resources are also constrained.</text>
</svg>
