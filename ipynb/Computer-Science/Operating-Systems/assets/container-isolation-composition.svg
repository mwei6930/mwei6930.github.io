<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Container isolation as composition of Linux mechanisms</title>
  <desc id="desc">A container workload is surrounded by namespaced views, resource controls, reduced authority, system call and LSM policy, a layered root filesystem, runtime configuration, and a shared host kernel.</desc>
  <defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#17202a;letter-spacing:0}.h{font-size:28px;font-weight:700}.s{font-size:20px;font-weight:700}.b{font-size:16px}.n{font-size:14px;fill:#425466}.box{stroke:#34495e;stroke-width:2;rx:6}.ring{fill:none;stroke-width:28;opacity:.88}</style></defs>
  <rect width="1200" height="680" fill="#f8fafc"/><text x="600" y="42" text-anchor="middle" class="h">A container is a configured process boundary, not a miniature VM</text>
  <circle cx="600" cy="322" r="105" fill="#d6eaf8" stroke="#34495e" stroke-width="2"/><text x="600" y="299" text-anchor="middle" class="s">Workload</text><text x="600" y="330" text-anchor="middle" class="b">processes + descriptors</text><text x="600" y="358" text-anchor="middle" class="n">same syscall ABI as host kernel</text>
  <circle cx="600" cy="322" r="150" class="ring" stroke="#85c1e9"/>
  <circle cx="600" cy="322" r="194" class="ring" stroke="#82e0aa"/>
  <circle cx="600" cy="322" r="238" class="ring" stroke="#f8c471"/>
  <text x="600" y="151" text-anchor="middle" class="b">namespaces: process-specific views</text>
  <text x="600" y="105" text-anchor="middle" class="b">cgroup v2: accounting, limits, weights, pressure</text>
  <text x="600" y="61" text-anchor="middle" class="b">capabilities + no_new_privs + seccomp + LSM: authority and allowed operations</text>
  <rect x="62" y="142" width="275" height="120" class="box" fill="#ffffff"/><text x="199" y="176" text-anchor="middle" class="s">Namespaced views</text><text x="199" y="205" text-anchor="middle" class="n">PID, mount, user, network, UTS, IPC</text><text x="199" y="230" text-anchor="middle" class="n">time and cgroup namespaces where used</text>
  <rect x="863" y="142" width="275" height="120" class="box" fill="#ffffff"/><text x="1000" y="176" text-anchor="middle" class="s">Resource governance</text><text x="1000" y="205" text-anchor="middle" class="n">memory.max, cpu.weight, pids.max</text><text x="1000" y="230" text-anchor="middle" class="n">I/O control and pressure visibility</text>
  <rect x="62" y="360" width="275" height="120" class="box" fill="#ffffff"/><text x="199" y="394" text-anchor="middle" class="s">Root filesystem view</text><text x="199" y="423" text-anchor="middle" class="n">image layers + writable upper layer</text><text x="199" y="448" text-anchor="middle" class="n">bind mounts and masked paths</text>
  <rect x="863" y="360" width="275" height="120" class="box" fill="#ffffff"/><text x="1000" y="394" text-anchor="middle" class="s">Runtime contract</text><text x="1000" y="423" text-anchor="middle" class="n">executable, env, IDs, mounts, limits</text><text x="1000" y="448" text-anchor="middle" class="n">OCI config translated into kernel calls</text>
  <rect x="173" y="565" width="854" height="76" class="box" fill="#eadcf8"/><text x="600" y="596" text-anchor="middle" class="s">Shared host kernel and hardware</text><text x="600" y="624" text-anchor="middle" class="n">Every container boundary depends on the same kernel, drivers, firmware, runtime, and policy configuration.</text>
  <text x="600" y="520" text-anchor="middle" class="b" fill="#c0392b">No one mechanism is the boundary; the intersection is.</text>
</svg>
