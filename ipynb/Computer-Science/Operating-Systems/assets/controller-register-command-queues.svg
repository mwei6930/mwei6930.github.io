<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860" role="img" aria-labelledby="title desc">
  <title id="title">Controller registers and descriptor queues</title>
  <desc id="desc">A driver programs simple status, command, and data registers or places descriptors in memory and rings a doorbell. The controller performs work and reports completion.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#334155"/></marker><style>.h{font:700 30px system-ui,sans-serif;fill:#111827}.t{font:700 18px system-ui,sans-serif;fill:#111827}.s{font:15px system-ui,sans-serif;fill:#334155}.box{stroke:#334155;stroke-width:2}.line{fill:none;stroke:#334155;stroke-width:3;marker-end:url(#a)}.ret{fill:none;stroke:#0f766e;stroke-width:3;marker-end:url(#a)}.dash{fill:none;stroke:#64748b;stroke-width:2;stroke-dasharray:9 7}</style></defs>
  <rect width="1600" height="860" fill="#fff"/><text x="800" y="48" text-anchor="middle" class="h">A controller is a concurrent agent, not a passive memory location</text>
  <rect x="80" y="100" width="420" height="650" rx="8" fill="#eff6ff" class="box"/><text x="290" y="140" text-anchor="middle" class="t">CPU and device driver</text>
  <rect x="130" y="190" width="320" height="90" rx="8" fill="#dbeafe" class="box"/><text x="290" y="227" text-anchor="middle" class="t">Prepare request</text><text x="290" y="255" text-anchor="middle" class="s">validate, map buffer, assign ID</text>
  <rect x="130" y="350" width="320" height="102" rx="8" fill="#dbeafe" class="box"/><text x="290" y="387" text-anchor="middle" class="t">Publish descriptor</text><text x="290" y="416" text-anchor="middle" class="s">address, length, operation, flags</text><text x="290" y="440" text-anchor="middle" class="s">then memory barrier</text>
  <rect x="130" y="540" width="320" height="104" rx="8" fill="#dcfce7" class="box"/><text x="290" y="577" text-anchor="middle" class="t">Consume completion</text><text x="290" y="606" text-anchor="middle" class="s">status, bytes transferred, request ID</text><text x="290" y="630" text-anchor="middle" class="s">unmap and wake/notify</text>

  <rect x="590" y="100" width="430" height="650" rx="8" fill="#f8fafc" class="box"/><text x="805" y="140" text-anchor="middle" class="t">Memory and MMIO boundary</text>
  <rect x="635" y="185" width="340" height="110" rx="8" fill="#ede9fe" class="box"/><text x="805" y="223" text-anchor="middle" class="t">Legacy register interface</text><text x="805" y="252" text-anchor="middle" class="s">STATUS | COMMAND | DATA</text><text x="805" y="278" text-anchor="middle" class="s">few outstanding operations</text>
  <rect x="635" y="345" width="340" height="112" rx="8" fill="#fef3c7" class="box"/><text x="805" y="383" text-anchor="middle" class="t">Submission ring in RAM</text><text x="805" y="412" text-anchor="middle" class="s">many descriptors; producer/consumer indexes</text><text x="805" y="438" text-anchor="middle" class="s">owned cooperatively by CPU and device</text>
  <rect x="635" y="525" width="340" height="112" rx="8" fill="#dcfce7" class="box"/><text x="805" y="563" text-anchor="middle" class="t">Completion ring in RAM</text><text x="805" y="592" text-anchor="middle" class="s">request ID, result and status</text><text x="805" y="618" text-anchor="middle" class="s">completion order may differ</text>
  <rect x="700" y="670" width="210" height="55" rx="8" fill="#ffedd5" class="box"/><text x="805" y="704" text-anchor="middle" class="t">MMIO doorbell</text>

  <rect x="1110" y="100" width="410" height="650" rx="8" fill="#ecfeff" class="box"/><text x="1315" y="140" text-anchor="middle" class="t">Controller and device</text>
  <rect x="1155" y="215" width="320" height="105" rx="8" fill="#cffafe" class="box"/><text x="1315" y="253" text-anchor="middle" class="t">Fetch command</text><text x="1315" y="282" text-anchor="middle" class="s">read registers or ring entries</text><text x="1315" y="307" text-anchor="middle" class="s">after observing the doorbell</text>
  <rect x="1155" y="380" width="320" height="105" rx="8" fill="#cffafe" class="box"/><text x="1315" y="418" text-anchor="middle" class="t">Execute concurrently</text><text x="1315" y="447" text-anchor="middle" class="s">transfer data, check media/link</text><text x="1315" y="472" text-anchor="middle" class="s">possibly reorder requests</text>
  <rect x="1155" y="545" width="320" height="105" rx="8" fill="#cffafe" class="box"/><text x="1315" y="583" text-anchor="middle" class="t">Publish completion</text><text x="1315" y="612" text-anchor="middle" class="s">write CQ entry and signal IRQ</text><text x="1315" y="637" text-anchor="middle" class="s">or wait for host polling</text>

  <path d="M450 401 H635" class="line"/><path d="M975 401 H1120 V267 H1155" class="line"/><path d="M910 697 H1080 V300 H1155" class="line"/>
  <path d="M1475 597 H1538 V581 H975" class="ret"/><path d="M635 581 H450" class="ret"/>
  <path d="M1315 320 V380" class="line"/><path d="M1315 485 V545" class="line"/>
  <path d="M550 80 V775" class="dash"/><path d="M1065 80 V775" class="dash"/>
  <text x="800" y="814" text-anchor="middle" class="s">Publishing data before the doorbell and observing completion before reusing buffers require explicit ordering rules.</text>
</svg>
