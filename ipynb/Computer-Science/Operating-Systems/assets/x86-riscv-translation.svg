<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Conceptual comparison of x86-64 four-level paging and RISC-V Sv39</title>
  <desc id="desc">x86-64 four-level paging divides a 48-bit canonical virtual address into four nine-bit indexes and a twelve-bit offset, rooted at CR3. RISC-V Sv39 uses three nine-bit VPN fields and a twelve-bit offset, rooted through satp. Both use 512-entry page-table pages.</desc>
  <defs><style>.h{font:700 28px system-ui,sans-serif;fill:#111827}.t{font:600 18px system-ui,sans-serif;fill:#111827}.s{font:15px system-ui,sans-serif;fill:#374151}.box{stroke:#374151;stroke-width:2}</style></defs>
  <rect width="1600" height="900" fill="#ffffff"/>
  <text x="800" y="44" text-anchor="middle" class="h">Different encodings, the same radix-tree translation idea</text>
  <line x1="800" y1="80" x2="800" y2="840" stroke="#cbd5e1" stroke-width="3"/>
  <text x="400" y="100" text-anchor="middle" class="t">x86-64: common 4-level, 4 KiB mapping</text>
  <text x="1200" y="100" text-anchor="middle" class="t">RISC-V: Sv39, 4 KiB mapping</text>

  <text x="400" y="145" text-anchor="middle" class="s">canonical virtual address uses low 48 translated bits</text>
  <g class="box"><rect x="75" y="175" width="130" height="75" fill="#dbeafe"/><rect x="205" y="175" width="130" height="75" fill="#e0f2fe"/><rect x="335" y="175" width="130" height="75" fill="#dcfce7"/><rect x="465" y="175" width="130" height="75" fill="#f3e8ff"/><rect x="595" y="175" width="130" height="75" fill="#fef3c7"/></g>
  <text x="140" y="205" text-anchor="middle" class="t">PML4</text><text x="140" y="231" text-anchor="middle" class="s">9 bits</text><text x="270" y="205" text-anchor="middle" class="t">PDPT</text><text x="270" y="231" text-anchor="middle" class="s">9 bits</text><text x="400" y="205" text-anchor="middle" class="t">PD</text><text x="400" y="231" text-anchor="middle" class="s">9 bits</text><text x="530" y="205" text-anchor="middle" class="t">PT</text><text x="530" y="231" text-anchor="middle" class="s">9 bits</text><text x="660" y="205" text-anchor="middle" class="t">offset</text><text x="660" y="231" text-anchor="middle" class="s">12 bits</text>
  <rect x="110" y="305" width="580" height="105" rx="8" fill="#f8fafc" class="box"/><text x="400" y="343" text-anchor="middle" class="t">root and address-space tag</text><text x="400" y="374" text-anchor="middle" class="s">CR3 supplies root; PCID may tag cached translations</text><text x="400" y="398" text-anchor="middle" class="s">5-level paging adds one more 9-bit index when enabled</text>
  <rect x="110" y="445" width="580" height="150" rx="8" fill="#eef2ff" class="box"/><text x="400" y="484" text-anchor="middle" class="t">representative leaf state</text><text x="145" y="520" class="s">Present, Read/Write, User/Supervisor</text><text x="145" y="549" class="s">Accessed, Dirty, Global, Execute Disable</text><text x="145" y="578" class="s">large-page leaves at upper levels</text>
  <rect x="110" y="630" width="580" height="118" rx="8" fill="#fff7ed" class="box"/><text x="400" y="669" text-anchor="middle" class="t">translation maintenance</text><text x="400" y="700" text-anchor="middle" class="s">INVLPG, INVPCID, or CR3-related invalidation</text><text x="400" y="726" text-anchor="middle" class="s">under architectural ordering rules</text>

  <text x="1200" y="145" text-anchor="middle" class="s">bits 63:39 must equal bit 38 (sign extension)</text>
  <g class="box"><rect x="885" y="175" width="170" height="75" fill="#dbeafe"/><rect x="1055" y="175" width="170" height="75" fill="#dcfce7"/><rect x="1225" y="175" width="170" height="75" fill="#f3e8ff"/><rect x="1395" y="175" width="130" height="75" fill="#fef3c7"/></g>
  <text x="970" y="205" text-anchor="middle" class="t">VPN[2]</text><text x="970" y="231" text-anchor="middle" class="s">9 bits</text><text x="1140" y="205" text-anchor="middle" class="t">VPN[1]</text><text x="1140" y="231" text-anchor="middle" class="s">9 bits</text><text x="1310" y="205" text-anchor="middle" class="t">VPN[0]</text><text x="1310" y="231" text-anchor="middle" class="s">9 bits</text><text x="1460" y="205" text-anchor="middle" class="t">offset</text><text x="1460" y="231" text-anchor="middle" class="s">12 bits</text>
  <rect x="910" y="305" width="580" height="105" rx="8" fill="#f8fafc" class="box"/><text x="1200" y="343" text-anchor="middle" class="t">root and address-space tag</text><text x="1200" y="374" text-anchor="middle" class="s">satp selects mode, ASID, and root PPN</text><text x="1200" y="398" text-anchor="middle" class="s">Sv48 and Sv57 add one or two 9-bit levels</text>
  <rect x="910" y="445" width="580" height="150" rx="8" fill="#eef2ff" class="box"/><text x="1200" y="484" text-anchor="middle" class="t">representative leaf state</text><text x="945" y="520" class="s">V, R, W, X, User, Global</text><text x="945" y="549" class="s">Accessed and Dirty; reserved combinations fault</text><text x="945" y="578" class="s">leaf at any level can form a superpage</text>
  <rect x="910" y="630" width="580" height="118" rx="8" fill="#fff7ed" class="box"/><text x="1200" y="669" text-anchor="middle" class="t">translation maintenance</text><text x="1200" y="700" text-anchor="middle" class="s">SFENCE.VMA orders subsequent local translation use</text><text x="1200" y="726" text-anchor="middle" class="s">after updates and invalidates selected state</text>
  <rect x="260" y="790" width="1080" height="58" rx="8" fill="#f1f5f9" class="box"/><text x="800" y="825" text-anchor="middle" class="s">Both use 512 eight-byte entries per 4 KiB table page; architecture manuals define exact validation, permissions, and invalidation rules.</text>
</svg>
