<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1540 850" role="img" aria-labelledby="title desc">
  <title id="title">Readiness-driven event loop for multiple IPC endpoints</title>
  <desc id="desc">Pipes, sockets, timers, and signal descriptors feed a readiness monitor. The event loop waits, receives ready descriptors, drains work until EAGAIN, updates state, and waits again.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#355070"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17212b; }
      .title { font-size: 32px; font-weight: 700; }
      .section { font-size: 22px; font-weight: 700; }
      .head { font-size: 18px; font-weight: 700; }
      .body { font-size: 16px; }
      .small { font-size: 14px; }
      .panel { stroke: #355070; stroke-width: 2.4; rx: 9; }
      .line { stroke: #355070; stroke-width: 2.7; fill: none; marker-end: url(#arrow); }
      .feedback { stroke: #d1495b; stroke-width: 2.7; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1540" height="850" fill="#fff"/>
  <text x="770" y="48" text-anchor="middle" class="title">Event-Driven IPC Separates Readiness from the Operation Itself</text>

  <text x="80" y="115" class="section">Potential event sources</text>
  <rect x="70" y="145" width="240" height="88" class="panel" fill="#e9f2fb"/>
  <text x="190" y="181" text-anchor="middle" class="head">pipe / FIFO</text>
  <text x="190" y="210" text-anchor="middle" class="small">bytes or writable capacity</text>
  <rect x="70" y="260" width="240" height="88" class="panel" fill="#edf5e8"/>
  <text x="190" y="296" text-anchor="middle" class="head">local / network socket</text>
  <text x="190" y="325" text-anchor="middle" class="small">connection, message, stream data</text>
  <rect x="70" y="375" width="240" height="88" class="panel" fill="#fff3d9"/>
  <text x="190" y="411" text-anchor="middle" class="head">timer / event descriptor</text>
  <text x="190" y="440" text-anchor="middle" class="small">time or explicit wakeup count</text>
  <rect x="70" y="490" width="240" height="88" class="panel" fill="#fdebea"/>
  <text x="190" y="526" text-anchor="middle" class="head">signal descriptor</text>
  <text x="190" y="555" text-anchor="middle" class="small">Linux signalfd integration</text>

  <rect x="390" y="190" width="300" height="320" class="panel" fill="#f1eef8"/>
  <text x="540" y="235" text-anchor="middle" class="section">Readiness instance</text>
  <text x="540" y="272" text-anchor="middle" class="body">interest set</text>
  <rect x="440" y="295" width="200" height="62" class="panel" fill="#fff"/>
  <text x="540" y="333" text-anchor="middle" class="body">fd 3: readable</text>
  <rect x="440" y="372" width="200" height="62" class="panel" fill="#fff"/>
  <text x="540" y="410" text-anchor="middle" class="body">fd 7: writable</text>
  <text x="540" y="470" text-anchor="middle" class="small">select / poll / epoll / kqueue</text>
  <path d="M310 189 L390 275" class="line"/><path d="M310 304 L390 320" class="line"/><path d="M310 419 L390 380" class="line"/><path d="M310 534 L390 430" class="line"/>

  <rect x="770" y="120" width="700" height="600" class="panel" fill="#f8fafb"/>
  <text x="1120" y="164" text-anchor="middle" class="section">Single event-loop thread</text>
  <rect x="835" y="210" width="230" height="100" class="panel" fill="#e9f2fb"/>
  <text x="950" y="247" text-anchor="middle" class="head">1. wait</text>
  <text x="950" y="277" text-anchor="middle" class="body">epoll_wait(...)</text>
  <rect x="1175" y="210" width="230" height="100" class="panel" fill="#fff3d9"/>
  <text x="1290" y="247" text-anchor="middle" class="head">2. receive batch</text>
  <text x="1290" y="277" text-anchor="middle" class="body">ready descriptor tokens</text>
  <rect x="1175" y="410" width="230" height="120" class="panel" fill="#e6f5ef"/>
  <text x="1290" y="447" text-anchor="middle" class="head">3. perform I/O</text>
  <text x="1290" y="477" text-anchor="middle" class="body">read / write repeatedly</text>
  <text x="1290" y="506" text-anchor="middle" class="small">edge-triggered: drain to EAGAIN</text>
  <rect x="835" y="410" width="230" height="120" class="panel" fill="#fdebea"/>
  <text x="950" y="447" text-anchor="middle" class="head">4. update state</text>
  <text x="950" y="477" text-anchor="middle" class="body">partial message progress</text>
  <text x="950" y="506" text-anchor="middle" class="small">queues, offsets, close policy</text>
  <path d="M1065 260 L1175 260" class="line"/><path d="M1290 310 L1290 410" class="line"/><path d="M1175 470 L1065 470" class="line"/><path d="M950 410 C950 345 900 350 900 310" class="feedback"/>
  <text x="1120" y="594" text-anchor="middle" class="body">Readiness means an operation can make progress now.</text>
  <text x="1120" y="630" text-anchor="middle" class="body">It does not promise that the whole application message is available.</text>
  <text x="1120" y="674" text-anchor="middle" class="small">Handlers must remain short or offload CPU-heavy work to avoid delaying every endpoint.</text>
  <path d="M690 350 L835 260" class="line"/>

  <rect x="280" y="760" width="980" height="54" rx="8" fill="#fff" stroke="#7c8794" stroke-width="2"/>
  <text x="770" y="793" text-anchor="middle" class="body">Nonblocking mode converts "would sleep" into EAGAIN so the loop can serve another endpoint.</text>
</svg>
