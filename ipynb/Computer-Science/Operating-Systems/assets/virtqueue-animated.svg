<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">Virtio split virtqueue request lifecycle</title>
  <desc id="desc">An animated request moves from guest descriptor publication through the available ring to backend processing and the used ring.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#34495e"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#17202a;letter-spacing:0}.h{font-size:28px;font-weight:700}.s{font-size:19px;font-weight:700}.b{font-size:16px}.n{font-size:14px;fill:#425466}.box{stroke:#34495e;stroke-width:2;rx:6}.p{fill:none;stroke:#34495e;stroke-width:3;marker-end:url(#a)}.req{fill:#c0392b}</style></defs>
  <rect width="1200" height="610" fill="#f8fafc"/><text x="600" y="42" text-anchor="middle" class="h">Virtqueue: describe, publish, process, complete, reclaim</text>
  <rect x="55" y="95" width="220" height="100" class="box" fill="#d6eaf8"/><text x="165" y="132" text-anchor="middle" class="s">Guest driver</text><text x="165" y="161" text-anchor="middle" class="n">build request buffers</text><text x="165" y="183" text-anchor="middle" class="n">optionally notify backend</text>
  <rect x="330" y="95" width="220" height="100" class="box" fill="#d5f5e3"/><text x="440" y="132" text-anchor="middle" class="s">Descriptor table</text><text x="440" y="161" text-anchor="middle" class="n">address, length, flags, next</text><text x="440" y="183" text-anchor="middle" class="n">chains describe scatter/gather I/O</text>
  <rect x="650" y="95" width="220" height="100" class="box" fill="#fff3cd"/><text x="760" y="132" text-anchor="middle" class="s">Available ring</text><text x="760" y="161" text-anchor="middle" class="n">guest publishes descriptor head</text><text x="760" y="183" text-anchor="middle" class="n">monotonic index</text>
  <rect x="925" y="95" width="220" height="100" class="box" fill="#eadcf8"/><text x="1035" y="132" text-anchor="middle" class="s">Backend</text><text x="1035" y="161" text-anchor="middle" class="n">validate and perform I/O</text><text x="1035" y="183" text-anchor="middle" class="n">QEMU, vhost, or device</text>
  <path d="M275 145 H330" class="p"/><path d="M550 145 H650" class="p"/><path d="M870 145 H925" class="p"/>

  <rect x="650" y="310" width="220" height="100" class="box" fill="#f5cba7"/><text x="760" y="347" text-anchor="middle" class="s">Used ring</text><text x="760" y="376" text-anchor="middle" class="n">backend publishes completion</text><text x="760" y="398" text-anchor="middle" class="n">id + bytes written</text>
  <rect x="330" y="310" width="220" height="100" class="box" fill="#d6eaf8"/><text x="440" y="347" text-anchor="middle" class="s">Guest completion</text><text x="440" y="376" text-anchor="middle" class="n">consume used element</text><text x="440" y="398" text-anchor="middle" class="n">release buffers</text>
  <path d="M1035 195 V360 H870" class="p"/><path d="M650 360 H550" class="p"/>
  <path id="cycle" d="M165 145 H1035 V360 H440 V145 H165" fill="none"/>
  <circle r="10" class="req"><animateMotion dur="6s" repeatCount="indefinite"><mpath href="#cycle"/></animateMotion></circle>
  <rect x="110" y="465" width="980" height="108" rx="6" fill="#ffffff" stroke="#34495e" stroke-width="2"/>
  <text x="600" y="498" text-anchor="middle" class="b">The ring transports references; payload buffers stay in shared guest memory.</text>
  <text x="600" y="526" text-anchor="middle" class="n">Memory-ordering rules make descriptors visible before the available index and completion data visible before the used index.</text>
  <text x="600" y="552" text-anchor="middle" class="n">Batching and notification suppression reduce VM exits, but the backend must treat every guest-provided descriptor as untrusted.</text>
</svg>
