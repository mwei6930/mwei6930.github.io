<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">CPU scheduling policy and dispatch mechanism</title>
  <desc id="desc">Runnable threads enter a run queue. Scheduling policy chooses one thread, while the dispatcher performs the context switch. Running threads can block, be preempted, or exit.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker>
    <style>
      .h{font:700 28px system-ui,sans-serif;fill:#111827}.t{font:600 19px system-ui,sans-serif;fill:#111827}.s{font:16px system-ui,sans-serif;fill:#374151}.box{stroke:#374151;stroke-width:2}.line{fill:none;stroke:#374151;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1400" height="650" fill="#ffffff"/>
  <text x="700" y="48" text-anchor="middle" class="h">From runnable work to CPU execution</text>
  <rect x="50" y="105" width="230" height="100" rx="8" fill="#dbeafe" class="box"/>
  <text x="165" y="145" text-anchor="middle" class="t">Events</text>
  <text x="165" y="176" text-anchor="middle" class="s">arrival, wakeup, fork</text>
  <rect x="365" y="90" width="315" height="215" rx="8" fill="#ecfdf5" class="box"/>
  <text x="522" y="128" text-anchor="middle" class="t">Runnable set / run queue</text>
  <rect x="410" y="157" width="225" height="36" rx="5" fill="#a7f3d0" stroke="#047857"/>
  <text x="522" y="181" text-anchor="middle" class="s">A: remaining 7</text>
  <rect x="410" y="205" width="225" height="36" rx="5" fill="#bfdbfe" stroke="#1d4ed8"/>
  <text x="522" y="229" text-anchor="middle" class="s">B: remaining 4</text>
  <rect x="410" y="253" width="225" height="36" rx="5" fill="#fde68a" stroke="#b45309"/>
  <text x="522" y="277" text-anchor="middle" class="s">C: remaining 2</text>
  <rect x="765" y="105" width="250" height="100" rx="8" fill="#fef3c7" class="box"/>
  <text x="890" y="145" text-anchor="middle" class="t">Policy: choose next</text>
  <text x="890" y="176" text-anchor="middle" class="s">FCFS? shortest? fair? deadline?</text>
  <rect x="765" y="250" width="250" height="100" rx="8" fill="#f3e8ff" class="box"/>
  <text x="890" y="290" text-anchor="middle" class="t">Dispatcher: make it run</text>
  <text x="890" y="321" text-anchor="middle" class="s">save, switch, restore, return</text>
  <rect x="1120" y="180" width="225" height="115" rx="8" fill="#fee2e2" class="box"/>
  <text x="1232" y="223" text-anchor="middle" class="t">CPU</text>
  <text x="1232" y="254" text-anchor="middle" class="s">RUNNING: thread C</text>
  <path d="M280 155 H365" class="line"/>
  <path d="M680 155 H765" class="line"/>
  <path d="M890 205 V250" class="line"/>
  <path d="M1015 300 C1080 300 1065 237 1120 237" class="line"/>
  <rect x="90" y="430" width="260" height="105" rx="8" fill="#e0f2fe" class="box"/>
  <text x="220" y="472" text-anchor="middle" class="t">Block</text>
  <text x="220" y="503" text-anchor="middle" class="s">wait for I/O or an event</text>
  <rect x="470" y="430" width="260" height="105" rx="8" fill="#ffedd5" class="box"/>
  <text x="600" y="472" text-anchor="middle" class="t">Preempt</text>
  <text x="600" y="503" text-anchor="middle" class="s">timer or higher urgency</text>
  <rect x="850" y="430" width="260" height="105" rx="8" fill="#f3f4f6" class="box"/>
  <text x="980" y="472" text-anchor="middle" class="t">Exit</text>
  <text x="980" y="503" text-anchor="middle" class="s">release execution context</text>
  <path d="M1200 295 C1180 380 270 360 220 430" class="line"/>
  <path d="M1232 295 C1220 385 650 360 600 430" class="line"/>
  <path d="M1260 295 C1280 385 1030 365 980 430" class="line"/>
  <path d="M600 430 C600 380 522 365 522 305" class="line"/>
  <path d="M220 430 C220 350 420 365 455 305" class="line"/>
  <text x="700" y="615" text-anchor="middle" class="s">Policy decides who should run; dispatch supplies the mechanism that changes who is running.</text>
</svg>
