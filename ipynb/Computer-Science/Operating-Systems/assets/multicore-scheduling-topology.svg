<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850" role="img" aria-labelledby="title desc">
  <title id="title">Multiprocessor scheduling, affinity, and NUMA locality</title>
  <desc id="desc">Two NUMA nodes each contain two CPUs with private run queues and caches. Local migration is cheaper than cross-node migration, which can leave memory remote. An asymmetric core is also shown.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#374151"/></marker><style>.h{font:700 27px system-ui,sans-serif;fill:#111827}.t{font:600 18px system-ui,sans-serif;fill:#111827}.s{font:15px system-ui,sans-serif;fill:#374151}.node{stroke:#374151;stroke-width:2}.cpu{stroke:#1d4ed8;stroke-width:2}.line{fill:none;stroke:#374151;stroke-width:3;marker-end:url(#arrow)}.costly{fill:none;stroke:#dc2626;stroke-width:4;stroke-dasharray:10 8;marker-end:url(#arrow)}</style></defs>
  <rect width="1500" height="850" fill="#fff"/>
  <text x="750" y="45" text-anchor="middle" class="h">Balancing runnable work also moves cache and memory locality</text>
  <rect x="55" y="95" width="650" height="590" rx="10" fill="#eff6ff" class="node"/>
  <text x="380" y="130" text-anchor="middle" class="t">NUMA node 0</text>
  <rect x="95" y="165" width="250" height="230" rx="8" fill="#fff" class="cpu"/><text x="220" y="200" text-anchor="middle" class="t">CPU 0</text><rect x="130" y="225" width="180" height="48" fill="#dbeafe" stroke="#1d4ed8"/><text x="220" y="255" text-anchor="middle" class="s">private cache: A hot</text><rect x="130" y="300" width="180" height="58" fill="#bfdbfe" stroke="#1d4ed8"/><text x="220" y="325" text-anchor="middle" class="s">run queue</text><text x="220" y="347" text-anchor="middle" class="s">A, B, C</text>
  <rect x="410" y="165" width="250" height="230" rx="8" fill="#fff" class="cpu"/><text x="535" y="200" text-anchor="middle" class="t">CPU 1</text><rect x="445" y="225" width="180" height="48" fill="#dcfce7" stroke="#15803d"/><text x="535" y="255" text-anchor="middle" class="s">private cache</text><rect x="445" y="300" width="180" height="58" fill="#bbf7d0" stroke="#15803d"/><text x="535" y="325" text-anchor="middle" class="s">run queue</text><text x="535" y="347" text-anchor="middle" class="s">D</text>
  <rect x="155" y="475" width="450" height="125" rx="8" fill="#e0f2fe" class="node"/><text x="380" y="515" text-anchor="middle" class="t">Memory node 0</text><text x="380" y="548" text-anchor="middle" class="s">A's pages are physically local here</text><text x="380" y="574" text-anchor="middle" class="s">lower access latency for CPUs 0-1</text>
  <path d="M345 335 C380 310 385 310 410 335" class="line"/><text x="378" y="300" text-anchor="middle" class="s">pull B?</text>
  <rect x="795" y="95" width="650" height="590" rx="10" fill="#f0fdf4" class="node"/>
  <text x="1120" y="130" text-anchor="middle" class="t">NUMA node 1</text>
  <rect x="835" y="165" width="250" height="230" rx="8" fill="#fff" class="cpu"/><text x="960" y="200" text-anchor="middle" class="t">CPU 2</text><rect x="870" y="225" width="180" height="48" fill="#dcfce7" stroke="#15803d"/><text x="960" y="255" text-anchor="middle" class="s">private cache</text><rect x="870" y="300" width="180" height="58" fill="#bbf7d0" stroke="#15803d"/><text x="960" y="325" text-anchor="middle" class="s">run queue: E, F</text>
  <rect x="1150" y="165" width="250" height="230" rx="8" fill="#fff" stroke="#b45309" stroke-width="3"/><text x="1275" y="200" text-anchor="middle" class="t">CPU 3: high capacity</text><rect x="1185" y="225" width="180" height="48" fill="#fef3c7" stroke="#b45309"/><text x="1275" y="255" text-anchor="middle" class="s">faster, higher energy</text><rect x="1185" y="300" width="180" height="58" fill="#fde68a" stroke="#b45309"/><text x="1275" y="325" text-anchor="middle" class="s">run queue: G</text>
  <rect x="895" y="475" width="450" height="125" rx="8" fill="#dcfce7" class="node"/><text x="1120" y="515" text-anchor="middle" class="t">Memory node 1</text><text x="1120" y="548" text-anchor="middle" class="s">local to CPUs 2-3</text><text x="1120" y="574" text-anchor="middle" class="s">capacity and energy may differ across cores</text>
  <path d="M310 365 C520 455 760 455 900 365" class="costly"/><text x="710" y="430" text-anchor="middle" class="t" fill="#b91c1c">migrate A: balance improves, locality may worsen</text>
  <path d="M605 535 C760 620 835 620 895 535" class="costly"/><text x="750" y="650" text-anchor="middle" class="s" fill="#b91c1c">remote memory until pages migrate or placement changes</text>
  <rect x="185" y="735" width="1130" height="70" rx="8" fill="#f8fafc" class="node"/>
  <text x="750" y="765" text-anchor="middle" class="t">Placement objective = runnable load + cache warmth + NUMA distance + CPU capacity + energy + affinity constraints</text>
  <text x="750" y="791" text-anchor="middle" class="s">Keeping a task on one CPU is useful only while the locality benefit exceeds idle-time or imbalance costs.</text>
</svg>
