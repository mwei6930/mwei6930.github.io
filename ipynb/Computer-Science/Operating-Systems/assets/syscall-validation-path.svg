<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 650" role="img" aria-labelledby="title desc">
  <title id="title">A system call crosses a trust boundary and must be validated</title>
  <desc id="desc">A user API call passes through a library wrapper and system-call ABI; the kernel dispatches it, validates handles, sizes, pointers, and permissions, performs the service, and returns a result.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#264653"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #18232c; }
      .title { font-size: 30px; font-weight: 700; }
      .head { font-size: 22px; font-weight: 700; }
      .body { font-size: 18px; }
      .small { font-size: 16px; }
      .box { stroke: #264653; stroke-width: 2.4; rx: 8; }
      .arrow { stroke: #264653; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .boundary { stroke: #c44536; stroke-width: 3; stroke-dasharray: 10 8; }
    </style>
  </defs>
  <rect width="1500" height="650" fill="#fff"/>
  <text x="750" y="44" text-anchor="middle" class="title">A System Call Is a Validated Request, Not a Direct Kernel Function Call</text>

  <rect x="45" y="105" width="225" height="116" class="box" fill="#e9f2fb"/>
  <text x="158" y="141" text-anchor="middle" class="head">Application API</text>
  <text x="158" y="174" text-anchor="middle" class="body">write(fd, buf, n)</text>
  <text x="158" y="203" text-anchor="middle" class="small">source-level contract</text>

  <rect x="315" y="105" width="225" height="116" class="box" fill="#edf5e8"/>
  <text x="428" y="141" text-anchor="middle" class="head">libc wrapper</text>
  <text x="428" y="174" text-anchor="middle" class="body">marshal arguments</text>
  <text x="428" y="203" text-anchor="middle" class="small">translate errors to errno</text>

  <rect x="585" y="105" width="225" height="116" class="box" fill="#fff3d9"/>
  <text x="698" y="141" text-anchor="middle" class="head">System-call ABI</text>
  <text x="698" y="174" text-anchor="middle" class="body">number + registers</text>
  <text x="698" y="203" text-anchor="middle" class="small">syscall / ecall instruction</text>

  <path d="M270 163 L315 163" class="arrow"/>
  <path d="M540 163 L585 163" class="arrow"/>
  <line x1="845" y1="72" x2="845" y2="590" class="boundary"/>
  <text x="832" y="92" text-anchor="end" class="small" fill="#c44536">untrusted user space</text>
  <text x="858" y="92" class="small" fill="#c44536">trusted kernel space</text>
  <path d="M810 163 L895 163" class="arrow"/>

  <rect x="895" y="105" width="245" height="116" class="box" fill="#f1eef8"/>
  <text x="1018" y="141" text-anchor="middle" class="head">Entry and dispatch</text>
  <text x="1018" y="174" text-anchor="middle" class="body">save state; check number</text>
  <text x="1018" y="203" text-anchor="middle" class="small">select kernel handler</text>

  <rect x="1185" y="105" width="270" height="116" class="box" fill="#fdebea"/>
  <text x="1320" y="141" text-anchor="middle" class="head">Validate and copy</text>
  <text x="1320" y="174" text-anchor="middle" class="body">fd, size, pointer, access</text>
  <text x="1320" y="203" text-anchor="middle" class="small">reject malformed requests</text>
  <path d="M1140 163 L1185 163" class="arrow"/>

  <rect x="1025" y="309" width="300" height="108" class="box" fill="#e6f5ef"/>
  <text x="1175" y="347" text-anchor="middle" class="head">Kernel subsystem</text>
  <text x="1175" y="379" text-anchor="middle" class="body">VFS, scheduler, VM, network...</text>
  <text x="1175" y="405" text-anchor="middle" class="small">enforce policy and perform work</text>
  <path d="M1320 221 L1320 266 L1175 266 L1175 309" class="arrow"/>

  <rect x="895" y="493" width="560" height="100" class="box" fill="#eaf0f4"/>
  <text x="1175" y="529" text-anchor="middle" class="head">Return path</text>
  <text x="1175" y="560" text-anchor="middle" class="body">result or error -> restore state -> lower privilege -> resume user code</text>
  <path d="M1175 417 L1175 493" class="arrow"/>
  <path d="M895 543 L736 543 L736 252" class="arrow"/>

  <rect x="70" y="310" width="690" height="230" rx="8" fill="#f8fafb" stroke="#7c8794" stroke-width="2"/>
  <text x="415" y="348" text-anchor="middle" class="head">Why validation is mandatory</text>
  <text x="105" y="389" class="body">1. A user pointer is only an address in the caller's virtual address space.</text>
  <text x="105" y="425" class="body">2. Length arithmetic can overflow or cross an unmapped page.</text>
  <text x="105" y="461" class="body">3. A file descriptor names a per-process object and may lack permission.</text>
  <text x="105" y="497" class="body">4. User memory can change while the kernel is checking it.</text>
  <text x="105" y="525" class="small">Every system call begins with hostile-input assumptions, even for ordinary programs.</text>
</svg>
