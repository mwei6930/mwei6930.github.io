<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="930" viewBox="0 0 1700 930" role="img" aria-labelledby="title desc">
  <title id="title">Crash-consistency update dependencies</title>
  <desc id="desc">Appending a new block requires data, data bitmap, and inode updates. A dependency graph and crash states show leaked blocks, stale pointers, exposed old data, and the need to move from one consistent state to another.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#334155"/></marker><style>.h{font:700 30px system-ui,sans-serif;fill:#111827}.t{font:700 18px system-ui,sans-serif;fill:#111827}.s{font:14px system-ui,sans-serif;fill:#334155}.box{stroke:#334155;stroke-width:2}.line{fill:none;stroke:#334155;stroke-width:3;marker-end:url(#a)}.need{fill:none;stroke:#7c3aed;stroke-width:3;stroke-dasharray:8 6;marker-end:url(#a)}.bad{fill:#fee2e2;stroke:#dc2626;stroke-width:2}.ok{fill:#dcfce7;stroke:#15803d;stroke-width:2}</style></defs>
  <rect width="1700" height="930" fill="#fff"/><text x="850" y="48" text-anchor="middle" class="h">One logical append can require several independently persistent block updates</text>
  <rect x="80" y="95" width="1540" height="130" rx="8" fill="#eff6ff" class="box"/><text x="150" y="137" class="t">Intent</text><text x="360" y="137" class="s">append logical block 1 to a one-block file</text><text x="360" y="172" class="s">allocate physical block 81, write new bytes, grow inode size/map</text><text x="1180" y="155" class="t">old state S0 -> new state S1</text>

  <rect x="160" y="315" width="340" height="130" rx="8" fill="#dbeafe" class="box"/><text x="330" y="355" text-anchor="middle" class="t">D: data block 81</text><text x="330" y="387" text-anchor="middle" class="s">contains the new user bytes</text><text x="330" y="417" text-anchor="middle" class="s">must not expose stale old contents</text>
  <rect x="680" y="315" width="340" height="130" rx="8" fill="#fef3c7" class="box"/><text x="850" y="355" text-anchor="middle" class="t">B: allocation bitmap</text><text x="850" y="387" text-anchor="middle" class="s">marks physical block 81 used</text><text x="850" y="417" text-anchor="middle" class="s">prevents reuse by another file</text>
  <rect x="1200" y="315" width="340" height="130" rx="8" fill="#ffedd5" class="box"/><text x="1370" y="355" text-anchor="middle" class="t">I: inode update</text><text x="1370" y="387" text-anchor="middle" class="s">size grows and map points to 81</text><text x="1370" y="417" text-anchor="middle" class="s">makes new block reachable</text>
  <path d="M500 380 H680" class="need"/><text x="590" y="360" text-anchor="middle" class="s" fill="#6d28d9">initialize before allocate</text>
  <path d="M1020 380 H1200" class="need"/><text x="1110" y="360" text-anchor="middle" class="s" fill="#6d28d9">allocate before point</text>

  <text x="850" y="520" text-anchor="middle" class="t">Examples of persistent subsets if power fails</text>
  <rect x="70" y="565" width="300" height="180" rx="8" class="bad"/><text x="220" y="605" text-anchor="middle" class="t">Only I reached storage</text><text x="220" y="640" text-anchor="middle" class="s">inode points at an unallocated</text><text x="220" y="668" text-anchor="middle" class="s">block with stale/unknown bytes</text><text x="220" y="708" text-anchor="middle" class="t" fill="#b91c1c">unsafe exposure + double use</text>
  <rect x="390" y="565" width="300" height="180" rx="8" class="bad"/><text x="540" y="605" text-anchor="middle" class="t">Only B reached storage</text><text x="540" y="640" text-anchor="middle" class="s">block marked used but no inode</text><text x="540" y="668" text-anchor="middle" class="s">references it after recovery</text><text x="540" y="708" text-anchor="middle" class="t" fill="#b91c1c">space leak</text>
  <rect x="710" y="565" width="300" height="180" rx="8" fill="#fef3c7" class="box"/><text x="860" y="605" text-anchor="middle" class="t">D + B reached storage</text><text x="860" y="640" text-anchor="middle" class="s">initialized block is allocated</text><text x="860" y="668" text-anchor="middle" class="s">but not linked from the inode</text><text x="860" y="708" text-anchor="middle" class="t">consistent but leaked</text>
  <rect x="1030" y="565" width="300" height="180" rx="8" class="bad"/><text x="1180" y="605" text-anchor="middle" class="t">B + I reached storage</text><text x="1180" y="640" text-anchor="middle" class="s">reachable and allocated, but</text><text x="1180" y="668" text-anchor="middle" class="s">new bytes may never have arrived</text><text x="1180" y="708" text-anchor="middle" class="t" fill="#b91c1c">stale/torn contents</text>
  <rect x="1350" y="565" width="280" height="180" rx="8" class="ok"/><text x="1490" y="605" text-anchor="middle" class="t">D + B + I</text><text x="1490" y="640" text-anchor="middle" class="s">content initialized, owned,</text><text x="1490" y="668" text-anchor="middle" class="s">reachable and correctly sized</text><text x="1490" y="708" text-anchor="middle" class="t" fill="#15803d">new state S1</text>

  <rect x="180" y="800" width="1340" height="78" rx="8" fill="#f8fafc" class="box"/><text x="850" y="832" text-anchor="middle" class="t">Ordering reduces dangerous states but does not make a group of writes atomic</text><text x="850" y="861" text-anchor="middle" class="s">Recovery protocols add enough evidence to choose, replay, roll back or reconstruct a valid state after any prefix of persistence.</text>
  <text x="850" y="914" text-anchor="middle" class="s">Real devices may reorder, cache, tear or fail writes unless barriers, flushes, atomic-write limits and checksums establish stronger assumptions.</text>
</svg>
