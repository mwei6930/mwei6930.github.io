<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">xv6, Linux, and seL4 comparison</title>
  <desc id="desc">Three columns compare a teaching kernel, a production general-purpose kernel, and a formally verified capability microkernel by purpose and assurance.</desc>
  <defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#17202a;letter-spacing:0}.h{font-size:28px;font-weight:700}.s{font-size:21px;font-weight:700}.b{font-size:16px}.n{font-size:14px;fill:#425466}.box{stroke:#34495e;stroke-width:2;rx:6}</style></defs>
  <rect width="1200" height="650" fill="#f8fafc"/><text x="600" y="42" text-anchor="middle" class="h">Different kernels optimize for different forms of understanding</text>
  <rect x="55" y="85" width="330" height="470" class="box" fill="#eaf2f8"/><text x="220" y="125" text-anchor="middle" class="s">xv6</text><text x="220" y="155" text-anchor="middle" class="b">small Unix-like teaching kernel</text>
  <rect x="90" y="192" width="260" height="72" class="box" fill="#d6eaf8"/><text x="220" y="221" text-anchor="middle" class="b">Readable end-to-end mechanisms</text><text x="220" y="247" text-anchor="middle" class="n">processes, traps, VM, files, logging</text>
  <rect x="90" y="289" width="260" height="72" class="box" fill="#d5f5e3"/><text x="220" y="318" text-anchor="middle" class="b">Deliberately limited surface</text><text x="220" y="344" text-anchor="middle" class="n">few devices and policies</text>
  <text x="220" y="407" text-anchor="middle" class="n">Excellent for causal tracing</text><text x="220" y="434" text-anchor="middle" class="n">Not a production feature baseline</text><text x="220" y="461" text-anchor="middle" class="n">Simplicity is the product goal</text>

  <rect x="435" y="85" width="330" height="470" class="box" fill="#eafaf1"/><text x="600" y="125" text-anchor="middle" class="s">Linux</text><text x="600" y="155" text-anchor="middle" class="b">production general-purpose kernel</text>
  <rect x="470" y="192" width="260" height="72" class="box" fill="#d6eaf8"/><text x="600" y="221" text-anchor="middle" class="b">Broad hardware and ABI support</text><text x="600" y="247" text-anchor="middle" class="n">servers, phones, embedded, cloud</text>
  <rect x="470" y="289" width="260" height="72" class="box" fill="#d5f5e3"/><text x="600" y="318" text-anchor="middle" class="b">Performance and evolution</text><text x="600" y="344" text-anchor="middle" class="n">modules, RCU, eBPF, many policies</text>
  <text x="600" y="407" text-anchor="middle" class="n">Large changing implementation</text><text x="600" y="434" text-anchor="middle" class="n">Extensive review and testing</text><text x="600" y="461" text-anchor="middle" class="n">No whole-kernel functional proof</text>

  <rect x="815" y="85" width="330" height="470" class="box" fill="#f4ecf7"/><text x="980" y="125" text-anchor="middle" class="s">seL4</text><text x="980" y="155" text-anchor="middle" class="b">capability-based microkernel</text>
  <rect x="850" y="192" width="260" height="72" class="box" fill="#d6eaf8"/><text x="980" y="221" text-anchor="middle" class="b">Small verified kernel contract</text><text x="980" y="247" text-anchor="middle" class="n">IPC, scheduling, memory authority</text>
  <rect x="850" y="289" width="260" height="72" class="box" fill="#d5f5e3"/><text x="980" y="318" text-anchor="middle" class="b">Proof-backed assurance</text><text x="980" y="344" text-anchor="middle" class="n">under explicit model assumptions</text>
  <text x="980" y="407" text-anchor="middle" class="n">User-level services remain separate</text><text x="980" y="434" text-anchor="middle" class="n">Proof scope is precise, not magical</text><text x="980" y="461" text-anchor="middle" class="n">System policy still needs design</text>

  <rect x="105" y="585" width="990" height="42" rx="6" fill="#fff3cd" stroke="#b9770e" stroke-width="2"/><text x="600" y="612" text-anchor="middle" class="b">Read xv6 to see mechanisms, Linux to see engineering scale, and seL4 to learn how assumptions become machine-checked claims.</text>
</svg>
