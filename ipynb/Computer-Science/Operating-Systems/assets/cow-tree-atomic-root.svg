<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="940" viewBox="0 0 1800 940" role="img" aria-labelledby="title desc">
  <title id="title">Copy-on-write tree commit and atomic root switch</title>
  <desc id="desc">An old consistent tree remains intact while a changed leaf and its ancestors are written to new blocks. After new blocks are durable, a superblock root pointer switches to the new tree; snapshots can retain the old root.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#334155"/></marker><style>.h{font:700 30px system-ui,sans-serif;fill:#111827}.t{font:700 18px system-ui,sans-serif;fill:#111827}.s{font:14px system-ui,sans-serif;fill:#334155}.old{fill:#dbeafe;stroke:#2563eb;stroke-width:2}.new{fill:#dcfce7;stroke:#15803d;stroke-width:3}.box{stroke:#334155;stroke-width:2}.line{fill:none;stroke:#334155;stroke-width:3;marker-end:url(#a)}.share{fill:none;stroke:#7c3aed;stroke-width:3;stroke-dasharray:9 7;marker-end:url(#a)}</style></defs>
  <rect width="1800" height="940" fill="#fff"/><text x="900" y="48" text-anchor="middle" class="h">Copy-on-write preserves the old tree until a new root is safely installed</text>
  <rect x="70" y="95" width="760" height="650" rx="8" fill="#eff6ff" class="box"/><text x="450" y="137" text-anchor="middle" class="t">Committed generation 41</text>
  <rect x="335" y="190" width="230" height="75" rx="8" class="old"/><text x="450" y="220" text-anchor="middle" class="t">Old root R41</text><text x="450" y="248" text-anchor="middle" class="s">checksum + generation</text>
  <rect x="170" y="360" width="230" height="75" rx="8" class="old"/><text x="285" y="405" text-anchor="middle" class="t">Node A</text>
  <rect x="500" y="360" width="230" height="75" rx="8" class="old"/><text x="615" y="405" text-anchor="middle" class="t">Node B</text>
  <rect x="110" y="550" width="180" height="75" rx="8" class="old"/><text x="200" y="595" text-anchor="middle" class="t">Leaf 1</text>
  <rect x="330" y="550" width="180" height="75" rx="8" class="old"/><text x="420" y="595" text-anchor="middle" class="t">Leaf 2</text>
  <rect x="550" y="550" width="180" height="75" rx="8" class="old"/><text x="640" y="595" text-anchor="middle" class="t">Leaf 3</text>
  <path d="M450 265 V315 H285 V360" class="line"/><path d="M450 315 H615 V360" class="line"/><path d="M285 435 V500 H200 V550" class="line"/><path d="M285 500 H420 V550" class="line"/><path d="M615 435 V550" class="line"/>
  <rect x="260" y="665" width="380" height="55" rx="8" fill="#dbeafe" class="box"/><text x="450" y="699" text-anchor="middle" class="s">superblock slot points to R41</text>

  <rect x="970" y="95" width="760" height="650" rx="8" fill="#f0fdf4" class="box"/><text x="1350" y="137" text-anchor="middle" class="t">Preparing generation 42: modify Leaf 2</text>
  <rect x="1235" y="190" width="230" height="75" rx="8" class="new"/><text x="1350" y="220" text-anchor="middle" class="t">New root R42</text><text x="1350" y="248" text-anchor="middle" class="s">written after descendants</text>
  <rect x="1070" y="360" width="230" height="75" rx="8" class="new"/><text x="1185" y="405" text-anchor="middle" class="t">New node A'</text>
  <rect x="1400" y="360" width="230" height="75" rx="8" class="old"/><text x="1515" y="405" text-anchor="middle" class="t">Shared node B</text>
  <rect x="1010" y="550" width="180" height="75" rx="8" class="old"/><text x="1100" y="595" text-anchor="middle" class="t">Shared leaf 1</text>
  <rect x="1230" y="550" width="180" height="75" rx="8" class="new"/><text x="1320" y="582" text-anchor="middle" class="t">New leaf 2'</text><text x="1320" y="609" text-anchor="middle" class="s">changed data</text>
  <rect x="1450" y="550" width="180" height="75" rx="8" class="old"/><text x="1540" y="595" text-anchor="middle" class="t">Shared leaf 3</text>
  <path d="M1350 265 V315 H1185 V360" class="line"/><path d="M1350 315 H1515 V360" class="line"/><path d="M1185 435 V500 H1100 V550" class="line"/><path d="M1185 500 H1320 V550" class="line"/><path d="M1515 435 V550" class="line"/>
  <rect x="1110" y="665" width="480" height="55" rx="8" fill="#dcfce7" class="box"/><text x="1350" y="699" text-anchor="middle" class="s">after all new blocks persist, superblock points to R42</text>

  <path d="M830 400 H970" class="share"/><text x="900" y="380" text-anchor="middle" class="s" fill="#6d28d9">unchanged subtrees shared</text>
  <rect x="170" y="800" width="1460" height="85" rx="8" fill="#f8fafc" class="box"/><text x="900" y="834" text-anchor="middle" class="t">Crash rule</text><text x="900" y="863" text-anchor="middle" class="s">Before the durable root switch, mount generation 41; after it, mount generation 42. Retaining R41 creates a cheap snapshot.</text>
  <text x="900" y="920" text-anchor="middle" class="s">Copy-on-write avoids in-place metadata overwrite but introduces reference counting, space reservation, fragmentation, cleaning and write amplification.</text>
</svg>
