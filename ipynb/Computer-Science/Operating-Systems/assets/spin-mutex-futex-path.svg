<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="830" viewBox="0 0 1500 830" role="img" aria-labelledby="title desc">
  <title id="title">Adaptive mutex path using user-space atomics and futex wait wake</title>
  <desc id="desc">A thread first attempts a user-space compare-and-swap. On contention it may spin briefly, then executes futex wait only if the lock word still indicates contention. Unlock uses a user-space release and futex wake when waiters exist.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#374151"/></marker><style>.h{font:700 28px system-ui,sans-serif;fill:#111827}.t{font:600 18px system-ui,sans-serif;fill:#111827}.s{font:15px system-ui,sans-serif;fill:#374151}.box{stroke:#374151;stroke-width:2}.line{fill:none;stroke:#374151;stroke-width:3;marker-end:url(#arrow)}.kernel{stroke:#7c3aed;stroke-width:3;stroke-dasharray:9 7}</style></defs>
  <rect width="1500" height="830" fill="#fff"/>
  <text x="750" y="45" text-anchor="middle" class="h">A practical mutex keeps the uncontended path in user space</text>
  <line x1="80" y1="560" x2="1420" y2="560" class="kernel"/><text x="118" y="545" class="t" fill="#6d28d9">kernel boundary</text>
  <rect x="90" y="125" width="250" height="90" rx="8" fill="#dbeafe" class="box"/><text x="215" y="160" text-anchor="middle" class="t">atomic CAS</text><text x="215" y="188" text-anchor="middle" class="s">0 -> locked</text>
  <path d="M340 170 H450" class="line"/>
  <polygon points="545,115 645,170 545,225 445,170" fill="#fef3c7" class="box"/><text x="545" y="165" text-anchor="middle" class="t">success?</text>
  <path d="M645 170 H785" class="line"/><text x="700" y="153" class="s">yes</text>
  <rect x="785" y="125" width="250" height="90" rx="8" fill="#dcfce7" class="box"/><text x="910" y="160" text-anchor="middle" class="t">critical section</text><text x="910" y="188" text-anchor="middle" class="s">no syscall</text>
  <path d="M545 225 V315" class="line"/><text x="560" y="275" class="s">no</text>
  <rect x="420" y="315" width="250" height="90" rx="8" fill="#ffedd5" class="box"/><text x="545" y="350" text-anchor="middle" class="t">optional short spin</text><text x="545" y="378" text-anchor="middle" class="s">owner may be running</text>
  <path d="M545 405 V475" class="line"/>
  <rect x="385" y="475" width="320" height="65" rx="8" fill="#f3e8ff" class="box"/><text x="545" y="515" text-anchor="middle" class="t">futex_wait(word, locked)</text>
  <path d="M545 540 V625" class="line"/>
  <rect x="385" y="625" width="320" height="90" rx="8" fill="#ede9fe" class="box"/><text x="545" y="660" text-anchor="middle" class="t">compare-and-block atomically</text><text x="545" y="688" text-anchor="middle" class="s">sleep only if value still matches</text>
  <path d="M705 670 C780 670 780 455 670 360" class="line"/><text x="755" y="580" class="s">wake -> retry</text>
  <rect x="1090" y="125" width="250" height="90" rx="8" fill="#fee2e2" class="box"/><text x="1215" y="160" text-anchor="middle" class="t">release store</text><text x="1215" y="188" text-anchor="middle" class="s">unlock word</text>
  <path d="M1035 170 H1090" class="line"/>
  <path d="M1215 215 V475" class="line"/>
  <rect x="1055" y="475" width="320" height="65" rx="8" fill="#f3e8ff" class="box"/><text x="1215" y="515" text-anchor="middle" class="t">waiters? futex_wake(word, 1)</text>
  <path d="M1215 540 V625" class="line"/>
  <rect x="1055" y="625" width="320" height="90" rx="8" fill="#ede9fe" class="box"/><text x="1215" y="660" text-anchor="middle" class="t">kernel marks a waiter runnable</text><text x="1215" y="688" text-anchor="middle" class="s">scheduler decides when it runs</text>
  <rect x="200" y="755" width="1100" height="45" rx="8" fill="#f8fafc" class="box"/>
  <text x="750" y="784" text-anchor="middle" class="s">The exact lock-word states and adaptive spinning policy are library details; applications should use pthread mutexes rather than raw futex calls.</text>
</svg>
