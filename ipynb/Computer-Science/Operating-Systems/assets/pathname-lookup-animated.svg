<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="920" viewBox="0 0 1700 920" role="img" aria-labelledby="title desc">
  <title id="title">Pathname lookup from root to inode</title>
  <desc id="desc">An animated lookup walks the components of /home/ana/report.txt. Each directory maps the next component name to an inode, and the final regular-file inode maps logical offsets to data extents.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#334155"/></marker><style>.h{font:700 30px system-ui,sans-serif;fill:#111827}.t{font:700 18px system-ui,sans-serif;fill:#111827}.s{font:14px system-ui,sans-serif;fill:#334155}.box{stroke:#334155;stroke-width:2}.line{fill:none;stroke:#334155;stroke-width:4;marker-end:url(#a)}.cache{fill:none;stroke:#7c3aed;stroke-width:3;stroke-dasharray:9 7}</style></defs>
  <rect width="1700" height="920" fill="#fff"/><text x="850" y="48" text-anchor="middle" class="h">Path lookup alternates between directory contents and inode metadata</text>
  <rect x="90" y="95" width="1520" height="90" rx="8" fill="#eff6ff" class="box"/><text x="150" y="132" class="t">Input path</text><text x="370" y="145" class="t">/ home / ana / report.txt</text><text x="1120" y="145" class="s">absolute path starts at this namespace's root</text>

  <rect x="80" y="280" width="260" height="145" rx="8" fill="#fef3c7" class="box"/><text x="210" y="319" text-anchor="middle" class="t">Root inode 2</text><text x="210" y="351" text-anchor="middle" class="s">type: directory</text><text x="210" y="381" text-anchor="middle" class="s">maps to root directory blocks</text>
  <rect x="410" y="250" width="260" height="205" rx="8" fill="#dbeafe" class="box"/><text x="540" y="289" text-anchor="middle" class="t">Root directory</text><text x="460" y="330" class="s">bin -> inode 11</text><text x="460" y="360" class="s">home -> inode 25</text><text x="460" y="390" class="s">tmp -> inode 39</text><text x="460" y="420" class="s">...</text>
  <rect x="740" y="280" width="260" height="145" rx="8" fill="#fef3c7" class="box"/><text x="870" y="319" text-anchor="middle" class="t">Inode 25</text><text x="870" y="351" text-anchor="middle" class="s">type: directory</text><text x="870" y="381" text-anchor="middle" class="s">/home directory blocks</text>
  <rect x="1070" y="250" width="260" height="205" rx="8" fill="#dbeafe" class="box"/><text x="1200" y="289" text-anchor="middle" class="t">/home directory</text><text x="1120" y="330" class="s">ana -> inode 73</text><text x="1120" y="360" class="s">lee -> inode 81</text><text x="1120" y="390" class="s">shared -> inode 92</text><text x="1120" y="420" class="s">...</text>
  <rect x="1400" y="280" width="220" height="145" rx="8" fill="#fef3c7" class="box"/><text x="1510" y="319" text-anchor="middle" class="t">Inode 73</text><text x="1510" y="351" text-anchor="middle" class="s">type: directory</text><text x="1510" y="381" text-anchor="middle" class="s">/home/ana blocks</text>
  <path id="upper" d="M340 352 H410 M670 352 H740 M1000 352 H1070 M1330 352 H1400" class="line"/>

  <rect x="290" y="600" width="320" height="205" rx="8" fill="#dbeafe" class="box"/><text x="450" y="639" text-anchor="middle" class="t">/home/ana directory</text><text x="345" y="681" class="s">notes.md -> inode 99</text><text x="345" y="713" class="s">report.txt -> inode 104</text><text x="345" y="745" class="s">archive -> inode 122</text><text x="345" y="777" class="s">...</text>
  <rect x="720" y="600" width="370" height="205" rx="8" fill="#fff7ed" class="box"/><text x="905" y="639" text-anchor="middle" class="t">Final inode 104</text><text x="775" y="681" class="s">type: regular file</text><text x="775" y="713" class="s">size: 18,432 bytes</text><text x="775" y="745" class="s">logical blocks -> extent tree</text><text x="775" y="777" class="s">permissions checked during walk/open</text>
  <rect x="1200" y="600" width="350" height="205" rx="8" fill="#dcfce7" class="box"/><text x="1375" y="639" text-anchor="middle" class="t">File contents</text><text x="1260" y="681" class="s">logical 0..2 -> physical 880..882</text><text x="1260" y="713" class="s">logical 3 -> sparse hole</text><text x="1260" y="745" class="s">logical 4 -> physical 991</text><text x="1260" y="777" class="s">page cache may satisfy the read</text>
  <path d="M1510 425 V520 H450 V600" class="line"/><path d="M610 702 H720" class="line"/><path d="M1090 702 H1200" class="line"/>
  <circle cx="340" cy="352" r="11" fill="#2563eb"><animateMotion dur="8s" repeatCount="indefinite" path="M0 0 H1060 V168 H110 V350 H380 H860"/></circle>
  <path d="M160 215 H1540" class="cache"/><text x="850" y="228" text-anchor="middle" class="s" fill="#6d28d9">dentry/inode caches can satisfy components without reading directory blocks from storage</text>
  <text x="850" y="872" text-anchor="middle" class="s">A directory stores name-to-inode mappings; the inode stores object metadata and the mapping from logical file offsets to storage.</text>
</svg>
