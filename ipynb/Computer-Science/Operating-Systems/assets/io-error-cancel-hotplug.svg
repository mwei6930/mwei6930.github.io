<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">I/O errors, timeout, cancellation, and hotplug state machine</title>
  <desc id="desc">A request state machine shows submission, in-flight completion, timeout observation, cancellation races, reset, late completion, and device removal with a single terminal ownership rule.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#334155"/></marker><style>.h{font:700 30px system-ui,sans-serif;fill:#111827}.t{font:700 17px system-ui,sans-serif;fill:#111827}.s{font:14px system-ui,sans-serif;fill:#334155}.box{stroke:#334155;stroke-width:2}.line{fill:none;stroke:#334155;stroke-width:3;marker-end:url(#a)}.bad{fill:none;stroke:#dc2626;stroke-width:3;marker-end:url(#a)}.ok{fill:none;stroke:#15803d;stroke-width:3;marker-end:url(#a)}.dash{fill:none;stroke:#7c3aed;stroke-width:3;stroke-dasharray:9 7;marker-end:url(#a)}</style></defs>
  <rect width="1600" height="920" fill="#fff"/><text x="800" y="48" text-anchor="middle" class="h">Timeout and cancellation are races around an independently executing request</text>
  <rect x="80" y="125" width="230" height="90" rx="8" fill="#dbeafe" class="box"/><text x="195" y="160" text-anchor="middle" class="t">Prepared</text><text x="195" y="190" text-anchor="middle" class="s">buffer + request ID owned</text>
  <rect x="395" y="125" width="230" height="90" rx="8" fill="#ede9fe" class="box"/><text x="510" y="160" text-anchor="middle" class="t">Submitted</text><text x="510" y="190" text-anchor="middle" class="s">visible to driver/controller</text>
  <rect x="710" y="125" width="230" height="90" rx="8" fill="#fef3c7" class="box"/><text x="825" y="160" text-anchor="middle" class="t">In flight</text><text x="825" y="190" text-anchor="middle" class="s">may already affect device</text>
  <rect x="1025" y="125" width="230" height="90" rx="8" fill="#dcfce7" class="box"/><text x="1140" y="160" text-anchor="middle" class="t">Completed</text><text x="1140" y="190" text-anchor="middle" class="s">one result is published</text>
  <rect x="1340" y="125" width="180" height="90" rx="8" fill="#f0fdf4" class="box"/><text x="1430" y="160" text-anchor="middle" class="t">Reaped</text><text x="1430" y="190" text-anchor="middle" class="s">resources reusable</text>
  <path d="M310 170 H395" class="line"/><path d="M625 170 H710" class="line"/><path d="M940 170 H1025" class="ok"/><path d="M1255 170 H1340" class="ok"/>

  <polygon points="620,330 930,330 980,380 930,430 620,430 570,380" fill="#fee2e2" class="box"/><text x="775" y="371" text-anchor="middle" class="t">Deadline expires or caller cancels</text><text x="775" y="401" text-anchor="middle" class="s">this is an observation/request, not proof of non-execution</text>
  <path d="M825 215 V330" class="bad"/>
  <rect x="120" y="520" width="360" height="120" rx="8" fill="#dcfce7" class="box"/><text x="300" y="559" text-anchor="middle" class="t">Cancellation wins</text><text x="300" y="589" text-anchor="middle" class="s">driver removes queued work or device</text><text x="300" y="615" text-anchor="middle" class="s">confirms abort; publish ECANCELED once</text>
  <rect x="620" y="520" width="360" height="120" rx="8" fill="#fef3c7" class="box"/><text x="800" y="559" text-anchor="middle" class="t">Completion wins</text><text x="800" y="589" text-anchor="middle" class="s">ordinary result is retained even if</text><text x="800" y="615" text-anchor="middle" class="s">the cancel request reports not found</text>
  <rect x="1120" y="520" width="360" height="120" rx="8" fill="#ffedd5" class="box"/><text x="1300" y="559" text-anchor="middle" class="t">Recovery required</text><text x="1300" y="589" text-anchor="middle" class="s">quiesce queue, reset device, invalidate</text><text x="1300" y="615" text-anchor="middle" class="s">or retry only under a safe policy</text>
  <path d="M570 380 H300 V520" class="line"/><path d="M775 430 V520" class="line"/><path d="M980 380 H1300 V520" class="line"/>
  <path d="M300 640 V720 H1140 V215" class="dash"/><path d="M800 640 V700 H1140 V215" class="dash"/><path d="M1300 640 V680 H1140 V215" class="dash"/>

  <rect x="190" y="735" width="1220" height="110" rx="8" fill="#f8fafc" class="box"/>
  <text x="800" y="774" text-anchor="middle" class="t">Hot unplug applies the same ownership rule to every outstanding request</text>
  <text x="800" y="805" text-anchor="middle" class="s">stop admission → mask callbacks → detach device → complete or fail each request exactly once → release only after references drain</text>
  <text x="800" y="831" text-anchor="middle" class="s">Generation IDs prevent a late completion from being mistaken for work on a replacement device.</text>
  <text x="800" y="884" text-anchor="middle" class="s">Retry is safe only when the operation is idempotent or the protocol can determine whether the original side effect occurred.</text>
</svg>
