<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="850" viewBox="0 0 1600 850" role="img" aria-labelledby="title desc">
  <title id="title">Character, block, and network device paths</title>
  <desc id="desc">Three columns compare the units, ordering, queues, kernel abstractions, and application interfaces of character, block, and network devices.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#334155"/></marker><style>.h{font:700 30px system-ui,sans-serif;fill:#111827}.t{font:700 19px system-ui,sans-serif;fill:#111827}.s{font:15px system-ui,sans-serif;fill:#334155}.box{stroke:#334155;stroke-width:2}.line{fill:none;stroke:#334155;stroke-width:3;marker-end:url(#a)}</style></defs>
  <rect width="1600" height="850" fill="#fff"/><text x="800" y="48" text-anchor="middle" class="h">Device classes expose different transfer units and scheduling opportunities</text>
  <rect x="70" y="100" width="460" height="650" rx="8" fill="#eff6ff" class="box"/><text x="300" y="142" text-anchor="middle" class="t">Character-style device</text>
  <rect x="130" y="190" width="340" height="82" rx="8" fill="#dbeafe" class="box"/><text x="300" y="223" text-anchor="middle" class="t">Application: read/write/ioctl</text><text x="300" y="251" text-anchor="middle" class="s">terminal, serial port, sensor</text>
  <path d="M300 272 V335" class="line"/>
  <rect x="130" y="335" width="340" height="100" rx="8" fill="#ede9fe" class="box"/><text x="300" y="372" text-anchor="middle" class="t">Byte or device message flow</text><text x="300" y="402" text-anchor="middle" class="s">often sequential; driver-defined controls</text><text x="300" y="427" text-anchor="middle" class="s">may buffer in either direction</text>
  <path d="M300 435 V505" class="line"/>
  <rect x="130" y="505" width="340" height="100" rx="8" fill="#cffafe" class="box"/><text x="300" y="542" text-anchor="middle" class="t">Controller / stream endpoint</text><text x="300" y="572" text-anchor="middle" class="s">ordered arrival is common</text><text x="300" y="597" text-anchor="middle" class="s">random block addressing is absent</text>
  <text x="300" y="682" text-anchor="middle" class="s">Scheduling focuses on wakeups, flow control,</text><text x="300" y="709" text-anchor="middle" class="s">latency and device-specific state.</text>

  <rect x="570" y="100" width="460" height="650" rx="8" fill="#fff7ed" class="box"/><text x="800" y="142" text-anchor="middle" class="t">Block device</text>
  <rect x="630" y="190" width="340" height="82" rx="8" fill="#fef3c7" class="box"/><text x="800" y="223" text-anchor="middle" class="t">File/page or direct I/O request</text><text x="800" y="251" text-anchor="middle" class="s">offset + length + direction</text>
  <path d="M800 272 V335" class="line"/>
  <rect x="630" y="335" width="340" height="100" rx="8" fill="#ffedd5" class="box"/><text x="800" y="372" text-anchor="middle" class="t">Block layer request queues</text><text x="800" y="402" text-anchor="middle" class="s">merge, prioritize and dispatch</text><text x="800" y="427" text-anchor="middle" class="s">multiple requests may be outstanding</text>
  <path d="M800 435 V505" class="line"/>
  <rect x="630" y="505" width="340" height="100" rx="8" fill="#cffafe" class="box"/><text x="800" y="542" text-anchor="middle" class="t">Addressable storage sectors</text><text x="800" y="572" text-anchor="middle" class="s">random access and DMA</text><text x="800" y="597" text-anchor="middle" class="s">completion order may differ</text>
  <text x="800" y="682" text-anchor="middle" class="s">Scheduling balances throughput, latency,</text><text x="800" y="709" text-anchor="middle" class="s">fairness and device parallelism.</text>

  <rect x="1070" y="100" width="460" height="650" rx="8" fill="#f0fdf4" class="box"/><text x="1300" y="142" text-anchor="middle" class="t">Network device</text>
  <rect x="1130" y="190" width="340" height="82" rx="8" fill="#dcfce7" class="box"/><text x="1300" y="223" text-anchor="middle" class="t">Application: socket API</text><text x="1300" y="251" text-anchor="middle" class="s">stream/datagram above the device</text>
  <path d="M1300 272 V335" class="line"/>
  <rect x="1130" y="335" width="340" height="100" rx="8" fill="#d1fae5" class="box"/><text x="1300" y="372" text-anchor="middle" class="t">Protocol stack + packet queues</text><text x="1300" y="402" text-anchor="middle" class="s">flow state, qdisc, NAPI budget</text><text x="1300" y="427" text-anchor="middle" class="s">socket is not the NIC itself</text>
  <path d="M1300 435 V505" class="line"/>
  <rect x="1130" y="505" width="340" height="100" rx="8" fill="#cffafe" class="box"/><text x="1300" y="542" text-anchor="middle" class="t">NIC packet descriptor rings</text><text x="1300" y="572" text-anchor="middle" class="s">frames arrive/depart via DMA</text><text x="1300" y="597" text-anchor="middle" class="s">interrupt and polling hybrid</text>
  <text x="1300" y="682" text-anchor="middle" class="s">Scheduling handles packet bursts, queue</text><text x="1300" y="709" text-anchor="middle" class="s">affinity, fairness and congestion signals.</text>
  <text x="800" y="805" text-anchor="middle" class="s">The categories guide interfaces; real devices can expose several functions and several queue types at once.</text>
</svg>
