<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">The cat grep pipeline running natively, in a container, and in a virtual machine</title>
  <desc id="desc">Three stacks trace the same shell pipeline through process and file-descriptor operations to a host kernel, a namespaced shared kernel, or a guest kernel and hypervisor.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#34495e"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#17202a;letter-spacing:0}.h{font-size:28px;font-weight:700}.s{font-size:19px;font-weight:700}.b{font-size:15px}.n{font-size:13px;fill:#425466}.box{stroke:#34495e;stroke-width:2;rx:6}.p{stroke:#34495e;stroke-width:2.5;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="720" fill="#f8fafc"/><text x="600" y="42" text-anchor="middle" class="h">The program is unchanged; the resource and trust path is not</text>
  <text x="205" y="85" text-anchor="middle" class="s">Native</text><text x="600" y="85" text-anchor="middle" class="s">Container</text><text x="995" y="85" text-anchor="middle" class="s">Virtual machine</text>
  <rect x="50" y="110" width="310" height="82" class="box" fill="#d6eaf8"/><text x="205" y="140" text-anchor="middle" class="b">shell -> cat | grep</text><text x="205" y="166" text-anchor="middle" class="n">pipe, fork/clone, dup2, execve</text><text x="205" y="185" text-anchor="middle" class="n">host PIDs and host mount view</text>
  <rect x="50" y="232" width="310" height="105" class="box" fill="#d5f5e3"/><text x="205" y="265" text-anchor="middle" class="b">Host kernel</text><text x="205" y="291" text-anchor="middle" class="n">VFS opens host paths</text><text x="205" y="315" text-anchor="middle" class="n">scheduler runs host tasks</text>
  <rect x="50" y="377" width="310" height="72" class="box" fill="#fdebd0"/><text x="205" y="420" text-anchor="middle" class="b">Host filesystem and hardware</text><line x1="205" y1="192" x2="205" y2="232" class="p"/><line x1="205" y1="337" x2="205" y2="377" class="p"/>
  <text x="205" y="490" text-anchor="middle" class="n">Failure domain: process + host kernel</text><text x="205" y="516" text-anchor="middle" class="n">Observability: normal host tools</text>

  <rect x="445" y="110" width="310" height="82" class="box" fill="#d6eaf8"/><text x="600" y="140" text-anchor="middle" class="b">shell -> cat | grep</text><text x="600" y="166" text-anchor="middle" class="n">same Linux syscalls</text><text x="600" y="185" text-anchor="middle" class="n">namespaced PIDs and mount view</text>
  <rect x="445" y="212" width="310" height="82" class="box" fill="#fff3cd"/><text x="600" y="242" text-anchor="middle" class="b">Runtime-created boundary</text><text x="600" y="268" text-anchor="middle" class="n">namespace, cgroup, capability, seccomp, LSM</text><text x="600" y="287" text-anchor="middle" class="n">layered rootfs and explicit mounts</text>
  <rect x="445" y="314" width="310" height="82" class="box" fill="#d5f5e3"/><text x="600" y="344" text-anchor="middle" class="b">Shared host kernel</text><text x="600" y="370" text-anchor="middle" class="n">resolves views; charges resources</text><text x="600" y="389" text-anchor="middle" class="n">runs same VFS and scheduler code</text>
  <rect x="445" y="416" width="310" height="72" class="box" fill="#fdebd0"/><text x="600" y="459" text-anchor="middle" class="b">Image layers, volumes, hardware</text><line x1="600" y1="192" x2="600" y2="212" class="p"/><line x1="600" y1="294" x2="600" y2="314" class="p"/><line x1="600" y1="396" x2="600" y2="416" class="p"/>
  <text x="600" y="529" text-anchor="middle" class="n">Failure domain: process boundary, shared kernel</text><text x="600" y="555" text-anchor="middle" class="n">Observability: host sees through namespace mapping</text>

  <rect x="840" y="110" width="310" height="82" class="box" fill="#d6eaf8"/><text x="995" y="140" text-anchor="middle" class="b">shell -> cat | grep</text><text x="995" y="166" text-anchor="middle" class="n">guest PIDs, descriptors, and paths</text><text x="995" y="185" text-anchor="middle" class="n">ordinary guest syscalls</text>
  <rect x="840" y="212" width="310" height="82" class="box" fill="#d5f5e3"/><text x="995" y="242" text-anchor="middle" class="b">Guest kernel</text><text x="995" y="268" text-anchor="middle" class="n">guest scheduler, VFS, page cache</text><text x="995" y="287" text-anchor="middle" class="n">virtio block/network driver</text>
  <rect x="840" y="314" width="310" height="82" class="box" fill="#eadcf8"/><text x="995" y="344" text-anchor="middle" class="b">Hypervisor + VMM</text><text x="995" y="370" text-anchor="middle" class="n">vCPU, nested memory, virtual I/O</text><text x="995" y="389" text-anchor="middle" class="n">host scheduling and backing files</text>
  <rect x="840" y="416" width="310" height="72" class="box" fill="#fdebd0"/><text x="995" y="459" text-anchor="middle" class="b">VM image, host files, hardware</text><line x1="995" y1="192" x2="995" y2="212" class="p"/><line x1="995" y1="294" x2="995" y2="314" class="p"/><line x1="995" y1="396" x2="995" y2="416" class="p"/>
  <text x="995" y="529" text-anchor="middle" class="n">Failure domain: guest kernel inside VM boundary</text><text x="995" y="555" text-anchor="middle" class="n">Observability: guest and host viewpoints differ</text>

  <rect x="80" y="605" width="1040" height="82" rx="6" fill="#ffffff" stroke="#34495e" stroke-width="2"/>
  <text x="600" y="635" text-anchor="middle" class="b">For all three, correctness still depends on pipe EOF, descriptor closure, pathname policy, scheduling, page cache, and durable output.</text>
  <text x="600" y="662" text-anchor="middle" class="n">Virtualization changes who owns each abstraction and which software must be trusted, observed, backed up, patched, and migrated.</text>
</svg>
