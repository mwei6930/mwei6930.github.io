<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="940" viewBox="0 0 1300 940" role="img" aria-labelledby="title desc">
  <title id="title">Typical Linux process virtual address-space regions</title>
  <desc id="desc">A conceptual user virtual address space from low to high addresses containing executable mappings, data, heap, mapped files and libraries, thread stacks, guard gaps, and the main stack. Arrows show heap and stack growth.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#374151"/></marker>
    <style>.h{font:700 28px system-ui,sans-serif;fill:#111827}.t{font:600 18px system-ui,sans-serif;fill:#111827}.s{font:15px system-ui,sans-serif;fill:#374151}.box{stroke:#374151;stroke-width:2}.line{stroke:#374151;stroke-width:3;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1300" height="940" fill="#ffffff"/>
  <text x="650" y="44" text-anchor="middle" class="h">A region is a policy interval; pages are the translation granularity</text>
  <text x="360" y="91" text-anchor="middle" class="s">lower virtual addresses</text>
  <rect x="230" y="115" width="520" height="740" rx="8" fill="#f8fafc" class="box"/>
  <rect x="255" y="140" width="470" height="70" rx="6" fill="#dbeafe" class="box"/><text x="490" y="172" text-anchor="middle" class="t">executable text and read-only data</text><text x="490" y="196" text-anchor="middle" class="s">file-backed, typically r-x / r--</text>
  <rect x="255" y="225" width="470" height="65" rx="6" fill="#dcfce7" class="box"/><text x="490" y="254" text-anchor="middle" class="t">initialized data + BSS</text><text x="490" y="278" text-anchor="middle" class="s">private writable state</text>
  <rect x="255" y="310" width="470" height="105" rx="6" fill="#bbf7d0" class="box"/><text x="490" y="346" text-anchor="middle" class="t">heap / allocator arenas</text><text x="490" y="373" text-anchor="middle" class="s">brk may extend one arena; large allocations often use mmap</text><path d="M690 330 V390" class="line"/><text x="645" y="403" class="s">growth</text>
  <rect x="255" y="435" width="470" height="95" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 6"/><text x="490" y="477" text-anchor="middle" class="t">unmapped gaps</text><text x="490" y="504" text-anchor="middle" class="s">ASLR and sparse reservation leave holes</text>
  <rect x="255" y="550" width="470" height="105" rx="6" fill="#f3e8ff" class="box"/><text x="490" y="586" text-anchor="middle" class="t">mmap area</text><text x="490" y="614" text-anchor="middle" class="s">shared libraries, files, anonymous mappings</text><text x="490" y="638" text-anchor="middle" class="s">and additional thread stacks</text>
  <rect x="255" y="675" width="470" height="42" rx="6" fill="#fee2e2" class="box"/><text x="490" y="702" text-anchor="middle" class="s">guard page: deliberately inaccessible</text>
  <rect x="255" y="732" width="470" height="98" rx="6" fill="#ffedd5" class="box"/><text x="490" y="768" text-anchor="middle" class="t">main thread stack</text><text x="490" y="796" text-anchor="middle" class="s">arguments, environment, call frames</text><path d="M690 805 V748" class="line"/><text x="645" y="822" class="s">growth</text>
  <text x="360" y="884" text-anchor="middle" class="s">higher user virtual addresses</text>

  <rect x="820" y="150" width="360" height="150" rx="8" fill="#e0f2fe" class="box"/><text x="1000" y="190" text-anchor="middle" class="t">VMA / region metadata</text><text x="850" y="223" class="s">start, end</text><text x="850" y="250" class="s">permissions and backing object</text><text x="850" y="277" class="s">sharing and growth policy</text>
  <rect x="820" y="345" width="360" height="150" rx="8" fill="#fef3c7" class="box"/><text x="1000" y="385" text-anchor="middle" class="t">page-table state</text><text x="850" y="418" class="s">present physical frame or invalid</text><text x="850" y="445" class="s">hardware permission bits</text><text x="850" y="472" class="s">accessed and dirty state</text>
  <rect x="820" y="540" width="360" height="160" rx="8" fill="#f3e8ff" class="box"/><text x="1000" y="580" text-anchor="middle" class="t">important distinction</text><text x="850" y="615" class="s">A region can exist without every page</text><text x="850" y="642" class="s">being resident. The VMA answers</text><text x="850" y="669" class="s">"is this access allowed in principle?"</text>
  <path d="M750 225 H820" class="line"/><path d="M750 420 H820" class="line"/><path d="M750 615 H820" class="line"/>
  <text x="1000" y="770" text-anchor="middle" class="s">Exact addresses, ordering, and kernel mappings vary by ABI, loader, ASLR policy, and process history.</text>
</svg>
