<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1540 760" role="img" aria-labelledby="title desc">
  <title id="title">Kernel path of cat input.txt piped to grep kernel and redirected to result.txt</title>
  <desc id="desc">The shell creates a pipe and output file, forks and executes cat and grep, then data moves through file descriptors and kernel objects until the shell waits for both processes.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#264653"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17212b; }
      .title { font-size: 30px; font-weight: 700; }
      .head { font-size: 21px; font-weight: 700; }
      .body { font-size: 17px; }
      .small { font-size: 15px; }
      .box { stroke: #264653; stroke-width: 2.3; rx: 8; }
      .arrow { stroke: #264653; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #c44536; stroke-width: 3; stroke-dasharray: 10 8; }
    </style>
  </defs>
  <rect width="1540" height="760" fill="#fff"/>
  <text x="770" y="44" text-anchor="middle" class="title">Running Case: cat input.txt | grep kernel &gt; result.txt</text>

  <rect x="55" y="92" width="1430" height="195" rx="8" fill="#e9f2fb" stroke="#355070" stroke-width="2.3"/>
  <text x="82" y="125" class="head">User space: the shell constructs the process graph</text>
  <rect x="92" y="154" width="238" height="92" class="box" fill="#fff"/>
  <text x="211" y="186" text-anchor="middle" class="head">Shell</text>
  <text x="211" y="217" text-anchor="middle" class="body">parse command line</text>
  <rect x="480" y="154" width="238" height="92" class="box" fill="#fff"/>
  <text x="599" y="186" text-anchor="middle" class="head">cat process</text>
  <text x="599" y="217" text-anchor="middle" class="body">read input; write stdout</text>
  <rect x="1010" y="154" width="238" height="92" class="box" fill="#fff"/>
  <text x="1129" y="186" text-anchor="middle" class="head">grep process</text>
  <text x="1129" y="217" text-anchor="middle" class="body">read stdin; write matches</text>
  <path d="M330 200 L480 200" class="arrow"/><text x="405" y="185" text-anchor="middle" class="small">fork + execve</text>
  <path d="M330 220 L1010 220" class="arrow"/><text x="853" y="244" text-anchor="middle" class="small">fork + execve</text>
  <path d="M211 246 L211 430" class="arrow"/>

  <line x1="35" y1="318" x2="1505" y2="318" class="dash"/>
  <text x="55" y="307" class="small" fill="#c44536">system-call boundary</text>

  <rect x="55" y="354" width="1430" height="330" rx="8" fill="#f8fafb" stroke="#7c8794" stroke-width="2.3"/>
  <text x="82" y="389" class="head">Kernel space: descriptors refer to shared kernel objects</text>

  <rect x="84" y="430" width="260" height="105" class="box" fill="#fff3d9"/>
  <text x="214" y="463" text-anchor="middle" class="head">Setup syscalls</text>
  <text x="214" y="493" text-anchor="middle" class="body">pipe2, openat, dup2</text>
  <text x="214" y="519" text-anchor="middle" class="small">close unused descriptors</text>

  <rect x="423" y="430" width="250" height="105" class="box" fill="#edf5e8"/>
  <text x="548" y="463" text-anchor="middle" class="head">input.txt</text>
  <text x="548" y="493" text-anchor="middle" class="body">open-file description</text>
  <text x="548" y="519" text-anchor="middle" class="small">offset + access mode</text>

  <rect x="733" y="430" width="250" height="105" class="box" fill="#f1eef8"/>
  <text x="858" y="463" text-anchor="middle" class="head">Pipe object</text>
  <text x="858" y="493" text-anchor="middle" class="body">bounded kernel buffer</text>
  <text x="858" y="519" text-anchor="middle" class="small">read end + write end</text>

  <rect x="1043" y="430" width="250" height="105" class="box" fill="#fdebea"/>
  <text x="1168" y="463" text-anchor="middle" class="head">result.txt</text>
  <text x="1168" y="493" text-anchor="middle" class="body">open-file description</text>
  <text x="1168" y="519" text-anchor="middle" class="small">created/truncated by shell</text>

  <path d="M599 246 L599 340 L548 340 L548 430" class="arrow"/>
  <path d="M599 246 L599 340 L858 340 L858 430" class="arrow"/>
  <path d="M1129 246 L1129 340 L858 340 L858 430" class="arrow"/>
  <path d="M1129 246 L1129 340 L1168 340 L1168 430" class="arrow"/>
  <path d="M673 482 L733 482" class="arrow"/>
  <path d="M983 482 L1043 482" class="arrow"/>
  <text x="703" y="469" text-anchor="middle" class="small">bytes</text>
  <text x="1013" y="469" text-anchor="middle" class="small">bytes</text>

  <rect x="338" y="589" width="864" height="66" rx="8" fill="#eaf0f4" stroke="#355070" stroke-width="2.3"/>
  <text x="770" y="618" text-anchor="middle" class="head">Scheduler + virtual memory + VFS + device drivers</text>
  <text x="770" y="643" text-anchor="middle" class="small">may block, wake, page-fault, cache, and submit I/O while preserving isolation</text>
  <path d="M858 535 L858 589" class="arrow"/>

  <rect x="1262" y="585" width="190" height="78" class="box" fill="#e6f5ef"/>
  <text x="1357" y="615" text-anchor="middle" class="head">Completion</text>
  <text x="1357" y="643" text-anchor="middle" class="small">EOF, exit, wait</text>
  <path d="M1202 622 L1262 622" class="arrow"/>
  <text x="770" y="725" text-anchor="middle" class="small">The pipe is not text syntax inside the kernel; it is an object connected to file-descriptor table entries.</text>
</svg>
