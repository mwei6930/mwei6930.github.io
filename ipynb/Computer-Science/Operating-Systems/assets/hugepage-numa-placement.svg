<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="950" viewBox="0 0 1700 950" role="img" aria-labelledby="title desc">
  <title id="title">Huge pages and NUMA placement</title><desc id="desc">Base pages may be promoted into a transparent huge page to reduce translation overhead. On a NUMA system, first-touch placement and task migration determine whether accesses use local or remote memory.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#334155"/></marker><style>.h{font:700 30px system-ui,sans-serif;fill:#111827}.t{font:700 18px system-ui,sans-serif;fill:#111827}.s{font:15px system-ui,sans-serif;fill:#334155}.box{stroke:#334155;stroke-width:2}.line{fill:none;stroke:#334155;stroke-width:3;marker-end:url(#a)}.remote{fill:none;stroke:#dc2626;stroke-width:4;stroke-dasharray:10 7;marker-end:url(#a)}.local{fill:none;stroke:#15803d;stroke-width:4;marker-end:url(#a)}</style></defs>
  <rect width="1700" height="950" fill="#fff"/><text x="850" y="48" text-anchor="middle" class="h">Page size and placement jointly determine translation cost and memory locality</text>

  <rect x="70" y="100" width="750" height="700" rx="8" fill="#eff6ff" class="box"/><text x="445" y="143" text-anchor="middle" class="t">Transparent huge-page promotion</text>
  <text x="445" y="182" text-anchor="middle" class="s">Example uses 4 KiB base pages and a 2 MiB PMD-sized THP</text>
  <g transform="translate(125,235)" class="box"><rect x="0" y="0" width="62" height="62" fill="#dbeafe"/><rect x="68" y="0" width="62" height="62" fill="#dbeafe"/><rect x="136" y="0" width="62" height="62" fill="#dbeafe"/><rect x="204" y="0" width="62" height="62" fill="#dbeafe"/><rect x="272" y="0" width="62" height="62" fill="#dbeafe"/><rect x="340" y="0" width="62" height="62" fill="#dbeafe"/><rect x="408" y="0" width="62" height="62" fill="#dbeafe"/><rect x="476" y="0" width="62" height="62" fill="#dbeafe"/></g>
  <text x="445" y="332" text-anchor="middle" class="s">many base-page PTEs and more TLB entries</text>
  <path d="M445 355 V425" class="line"/>
  <rect x="155" y="425" width="580" height="135" rx="8" fill="#dcfce7" class="box"/><text x="445" y="467" text-anchor="middle" class="t">One compound huge page</text><text x="445" y="503" text-anchor="middle" class="s">fewer translation entries; larger fault, clear, copy, split,</text><text x="445" y="532" text-anchor="middle" class="s">and contiguous-allocation consequences</text>
  <rect x="145" y="635" width="600" height="105" rx="8" fill="#fff7ed" class="box"/><text x="445" y="673" text-anchor="middle" class="t">Promotion is conditional, not guaranteed</text><text x="445" y="706" text-anchor="middle" class="s">alignment, policy, sharing, swap state, fragmentation, and memory pressure matter</text>

  <rect x="880" y="100" width="750" height="700" rx="8" fill="#fff7ed" class="box"/><text x="1255" y="143" text-anchor="middle" class="t">NUMA locality after first touch</text>
  <rect x="950" y="215" width="260" height="170" rx="8" fill="#dbeafe" class="box"/><text x="1080" y="255" text-anchor="middle" class="t">NUMA node 0</text><text x="1080" y="290" text-anchor="middle" class="s">CPU 0, CPU 1</text><rect x="995" y="315" width="170" height="42" rx="5" fill="#dcfce7" class="box"/><text x="1080" y="342" text-anchor="middle" class="s">local memory A</text>
  <rect x="1300" y="215" width="260" height="170" rx="8" fill="#ede9fe" class="box"/><text x="1430" y="255" text-anchor="middle" class="t">NUMA node 1</text><text x="1430" y="290" text-anchor="middle" class="s">CPU 2, CPU 3</text><rect x="1345" y="315" width="170" height="42" rx="5" fill="#fce7f3" class="box"/><text x="1430" y="342" text-anchor="middle" class="s">local memory B</text>
  <path d="M1080 300 V315" class="local"/><path d="M1430 300 V315" class="local"/>
  <path d="M1195 280 H1315" class="remote"/><text x="1255" y="262" text-anchor="middle" class="s" fill="#b91c1c">remote interconnect</text>
  <rect x="1035" y="490" width="440" height="120" rx="8" fill="#fef3c7" class="box"/><text x="1255" y="532" text-anchor="middle" class="t">Task moves but pages do not automatically follow</text><text x="1255" y="568" text-anchor="middle" class="s">scheduler placement, memory policy, and migration must be considered together</text>
  <rect x="995" y="655" width="520" height="85" rx="8" fill="#f1f5f9" class="box"/><text x="1255" y="689" text-anchor="middle" class="t">First touch is a placement event</text><text x="1255" y="719" text-anchor="middle" class="s">the CPU that materializes the page often influences its initial node</text>

  <rect x="250" y="850" width="1200" height="65" rx="8" fill="#ecfeff" class="box"/><text x="850" y="890" text-anchor="middle" class="s">Huge pages reduce translation overhead; NUMA placement reduces remote data travel. Either optimization can hurt when workload assumptions are wrong.</text>
</svg>
