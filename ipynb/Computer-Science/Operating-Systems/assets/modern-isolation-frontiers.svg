<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">Confidential computing, library operating systems, and serverless microVM isolation</title>
  <desc id="desc">Three designs move trust boundaries by excluding the host from guest private state, moving OS abstractions into a library, or specializing a minimal virtual machine monitor for serverless workloads.</desc>
  <defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#17202a;letter-spacing:0}.h{font-size:28px;font-weight:700}.s{font-size:20px;font-weight:700}.b{font-size:16px}.n{font-size:14px;fill:#425466}.box{stroke:#34495e;stroke-width:2;rx:6}.bound{fill:none;stroke:#c0392b;stroke-width:3;stroke-dasharray:9 6;rx:8}</style></defs>
  <rect width="1200" height="690" fill="#f8fafc"/><text x="600" y="42" text-anchor="middle" class="h">Modern designs move the trust boundary for a specific deployment problem</text>
  <text x="205" y="88" text-anchor="middle" class="s">Confidential VM</text>
  <rect x="55" y="112" width="300" height="86" class="box" fill="#d6eaf8"/><text x="205" y="145" text-anchor="middle" class="b">Guest application + guest kernel</text><text x="205" y="174" text-anchor="middle" class="n">private memory and register state</text>
  <rect x="55" y="225" width="300" height="86" class="box" fill="#eadcf8"/><text x="205" y="258" text-anchor="middle" class="b">Security manager + TEE hardware</text><text x="205" y="287" text-anchor="middle" class="n">measurement, attestation, access control</text>
  <rect x="55" y="338" width="300" height="86" class="box" fill="#f9ebea"/><text x="205" y="371" text-anchor="middle" class="b">Potentially untrusted host / VMM</text><text x="205" y="400" text-anchor="middle" class="n">still controls scheduling and availability</text>
  <rect x="42" y="99" width="326" height="225" class="bound"/>
  <text x="205" y="465" text-anchor="middle" class="n">Protect data in use from host inspection</text><text x="205" y="490" text-anchor="middle" class="n">Shared I/O and side channels remain difficult</text>

  <text x="600" y="88" text-anchor="middle" class="s">Library OS</text>
  <rect x="450" y="112" width="300" height="86" class="box" fill="#d6eaf8"/><text x="600" y="145" text-anchor="middle" class="b">Application</text><text x="600" y="174" text-anchor="middle" class="n">often unmodified Linux-facing binary</text>
  <rect x="450" y="225" width="300" height="86" class="box" fill="#d5f5e3"/><text x="600" y="258" text-anchor="middle" class="b">Library OS + narrow PAL</text><text x="600" y="287" text-anchor="middle" class="n">implements app-facing OS abstractions</text>
  <rect x="450" y="338" width="300" height="86" class="box" fill="#fdebd0"/><text x="600" y="371" text-anchor="middle" class="b">Host OS, VM, or enclave backend</text><text x="600" y="400" text-anchor="middle" class="n">small platform adaptation interface</text>
  <rect x="437" y="99" width="326" height="225" class="bound"/>
  <text x="600" y="465" text-anchor="middle" class="n">Move compatibility code beside the app</text><text x="600" y="490" text-anchor="middle" class="n">Narrow the host interface; validate replies</text>

  <text x="995" y="88" text-anchor="middle" class="s">Serverless microVM</text>
  <rect x="845" y="112" width="300" height="86" class="box" fill="#d6eaf8"/><text x="995" y="145" text-anchor="middle" class="b">Function / container workload</text><text x="995" y="174" text-anchor="middle" class="n">guest kernel inside a small VM</text>
  <rect x="845" y="225" width="300" height="86" class="box" fill="#eadcf8"/><text x="995" y="258" text-anchor="middle" class="b">Specialized VMM</text><text x="995" y="287" text-anchor="middle" class="n">minimal device model, jailer, API</text>
  <rect x="845" y="338" width="300" height="86" class="box" fill="#fdebd0"/><text x="995" y="371" text-anchor="middle" class="b">KVM + host kernel + hardware</text><text x="995" y="400" text-anchor="middle" class="n">snapshot/restore and fleet management</text>
  <rect x="832" y="99" width="326" height="225" class="bound"/>
  <text x="995" y="465" text-anchor="middle" class="n">Combine VM boundary with rapid lifecycle</text><text x="995" y="490" text-anchor="middle" class="n">Specialization reduces compatibility surface</text>

  <rect x="85" y="545" width="1030" height="110" rx="6" fill="#ffffff" stroke="#34495e" stroke-width="2"/>
  <text x="600" y="577" text-anchor="middle" class="b">Each design changes the adversary and the trusted computing base.</text>
  <text x="600" y="606" text-anchor="middle" class="n">Confidential computing reduces trust in the host; a library OS narrows the host ABI; a microVM specializes the virtual-hardware surface.</text>
  <text x="600" y="632" text-anchor="middle" class="n">None removes denial of service, supply-chain risk, side channels, vulnerable application code, or the need for attested and updateable images.</text>
</svg>
