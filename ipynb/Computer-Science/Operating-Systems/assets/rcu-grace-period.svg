<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" role="img" aria-labelledby="title desc">
  <title id="title">Read copy update publication and grace period</title>
  <desc id="desc">Two readers begin before an updater publishes a new object. New readers use the new object. The updater waits for a grace period until every old reader has exited, then reclaims the old object.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#374151"/></marker><style>.h{font:700 28px system-ui,sans-serif;fill:#111827}.t{font:600 18px system-ui,sans-serif;fill:#111827}.s{font:15px system-ui,sans-serif;fill:#374151}.axis{stroke:#111827;stroke-width:2}.old{fill:#fcd34d;stroke:#b45309;stroke-width:2}.new{fill:#86efac;stroke:#15803d;stroke-width:2}.wait{fill:#f3e8ff;stroke:#7c3aed;stroke-width:2;stroke-dasharray:8 6}.event{stroke:#dc2626;stroke-width:3}</style></defs>
  <rect width="1500" height="820" fill="#fff"/>
  <text x="750" y="45" text-anchor="middle" class="h">RCU separates publication from reclamation</text>
  <line x1="275" y1="120" x2="1330" y2="120" class="axis" marker-end="url(#arrow)"/><text x="1350" y="126" class="s">time</text>
  <line x1="650" y1="95" x2="650" y2="690" class="event"/><text x="650" y="82" text-anchor="middle" class="t" fill="#b91c1c">publish new pointer</text>
  <line x1="1120" y1="95" x2="1120" y2="690" class="event"/><text x="1120" y="82" text-anchor="middle" class="t" fill="#b91c1c">grace period ends</text>
  <g class="t" text-anchor="end"><text x="235" y="220">Reader A</text><text x="235" y="330">Reader B</text><text x="235" y="440">Reader C</text><text x="235" y="565">Updater</text></g>
  <rect x="350" y="185" width="500" height="65" rx="7" class="old"/><text x="600" y="225" text-anchor="middle" class="t">read-side critical section using old object</text>
  <rect x="515" y="295" width="385" height="65" rx="7" class="old"/><text x="707" y="335" text-anchor="middle" class="t">old object</text>
  <rect x="760" y="405" width="245" height="65" rx="7" class="new"/><text x="882" y="445" text-anchor="middle" class="t">new object</text>
  <rect x="410" y="515" width="240" height="75" rx="7" class="new"/><text x="530" y="545" text-anchor="middle" class="t">copy and modify</text><text x="530" y="570" text-anchor="middle" class="s">not yet visible</text>
  <rect x="650" y="515" width="470" height="75" rx="7" class="wait"/><text x="885" y="545" text-anchor="middle" class="t">wait for pre-existing readers</text><text x="885" y="570" text-anchor="middle" class="s">synchronize_rcu or deferred callback</text>
  <rect x="1120" y="515" width="210" height="75" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="1225" y="545" text-anchor="middle" class="t">reclaim old</text><text x="1225" y="570" text-anchor="middle" class="s">now safe</text>
  <rect x="330" y="650" width="250" height="75" rx="7" class="old"/><text x="455" y="680" text-anchor="middle" class="t">old version</text><text x="455" y="706" text-anchor="middle" class="s">reachable before publish</text>
  <rect x="750" y="650" width="250" height="75" rx="7" class="new"/><text x="875" y="680" text-anchor="middle" class="t">new version</text><text x="875" y="706" text-anchor="middle" class="s">new readers follow pointer</text>
  <path d="M580 687 H750" fill="none" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="750" y="775" text-anchor="middle" class="s">Readers may observe old or new consistent versions. No reader may retain the old pointer beyond the protected read-side lifetime.</text>
</svg>
