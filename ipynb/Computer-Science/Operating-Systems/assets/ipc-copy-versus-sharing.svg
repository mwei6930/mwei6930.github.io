<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1540 820" role="img" aria-labelledby="title desc">
  <title id="title">IPC by copying messages versus sharing memory</title>
  <desc id="desc">The left path copies bytes through a kernel-managed channel. The right path maps the same physical frames into two isolated processes and requires a synchronization protocol.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#355070"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17212b; }
      .title { font-size: 32px; font-weight: 700; }
      .section { font-size: 25px; font-weight: 700; }
      .head { font-size: 19px; font-weight: 700; }
      .body { font-size: 16px; }
      .small { font-size: 14px; }
      .panel { stroke: #355070; stroke-width: 2.3; rx: 9; }
      .line { stroke: #355070; stroke-width: 2.7; fill: none; marker-end: url(#arrow); }
      .map { stroke: #2a9d8f; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1540" height="820" fill="#fff"/>
  <text x="770" y="48" text-anchor="middle" class="title">IPC Chooses Where Data Lives and Who Enforces the Protocol</text>

  <rect x="45" y="90" width="705" height="640" class="panel" fill="#f8fafb"/>
  <text x="397" y="134" text-anchor="middle" class="section">Kernel-Mediated Message Path</text>
  <rect x="85" y="190" width="190" height="170" class="panel" fill="#e9f2fb"/>
  <text x="180" y="225" text-anchor="middle" class="head">Process A</text>
  <rect x="115" y="260" width="130" height="60" class="panel" fill="#fff"/>
  <text x="180" y="296" text-anchor="middle" class="body">user buffer</text>

  <rect x="315" y="175" width="165" height="200" class="panel" fill="#fff3d9"/>
  <text x="397" y="215" text-anchor="middle" class="head">Kernel channel</text>
  <rect x="340" y="250" width="115" height="85" class="panel" fill="#fff"/>
  <text x="397" y="282" text-anchor="middle" class="body">buffer or</text>
  <text x="397" y="307" text-anchor="middle" class="body">message queue</text>

  <rect x="520" y="190" width="190" height="170" class="panel" fill="#edf5e8"/>
  <text x="615" y="225" text-anchor="middle" class="head">Process B</text>
  <rect x="550" y="260" width="130" height="60" class="panel" fill="#fff"/>
  <text x="615" y="296" text-anchor="middle" class="body">user buffer</text>
  <path d="M245 290 L340 290" class="line"/><path d="M455 290 L550 290" class="line"/>

  <rect x="105" y="435" width="585" height="225" class="panel" fill="#fff"/>
  <text x="397" y="472" text-anchor="middle" class="head">Typical contract</text>
  <text x="145" y="510" class="body">- kernel controls endpoint lifetime, buffering, and wakeups</text>
  <text x="145" y="545" class="body">- send and receive create explicit transfer boundaries</text>
  <text x="145" y="580" class="body">- isolation remains strong; copying or traversal costs work</text>
  <text x="145" y="615" class="body">- bounded capacity naturally creates backpressure</text>

  <rect x="790" y="90" width="705" height="640" class="panel" fill="#f8fafb"/>
  <text x="1142" y="134" text-anchor="middle" class="section">Shared-Memory Path</text>
  <rect x="830" y="190" width="190" height="240" class="panel" fill="#e9f2fb"/>
  <text x="925" y="225" text-anchor="middle" class="head">Process A</text>
  <rect x="860" y="270" width="130" height="95" class="panel" fill="#e6f5ef"/>
  <text x="925" y="307" text-anchor="middle" class="body">virtual mapping</text>
  <text x="925" y="337" text-anchor="middle" class="small">address differs</text>

  <rect x="1265" y="190" width="190" height="240" class="panel" fill="#edf5e8"/>
  <text x="1360" y="225" text-anchor="middle" class="head">Process B</text>
  <rect x="1295" y="270" width="130" height="95" class="panel" fill="#e6f5ef"/>
  <text x="1360" y="307" text-anchor="middle" class="body">virtual mapping</text>
  <text x="1360" y="337" text-anchor="middle" class="small">address differs</text>

  <rect x="1065" y="250" width="160" height="145" class="panel" fill="#fff3d9"/>
  <text x="1145" y="286" text-anchor="middle" class="head">Shared frames</text>
  <text x="1145" y="322" text-anchor="middle" class="body">payload</text>
  <text x="1145" y="350" text-anchor="middle" class="body">indices / flags</text>
  <text x="1145" y="378" text-anchor="middle" class="small">same physical data</text>
  <path d="M990 317 L1065 317" class="map"/><path d="M1295 317 L1225 317" class="map"/>

  <rect x="850" y="470" width="585" height="190" class="panel" fill="#fff"/>
  <text x="1142" y="507" text-anchor="middle" class="head">Typical contract</text>
  <text x="890" y="545" class="body">- payload can be read without a second kernel-mediated copy</text>
  <text x="890" y="580" class="body">- applications define ownership, publication, and reuse rules</text>
  <text x="890" y="615" class="body">- atomics or process-shared synchronization establish visibility</text>

  <rect x="260" y="750" width="1020" height="48" rx="8" fill="#fdebea" stroke="#7c8794" stroke-width="2"/>
  <text x="770" y="780" text-anchor="middle" class="body">Shared memory removes a data-transfer boundary, not the need for a communication protocol.</text>
</svg>
