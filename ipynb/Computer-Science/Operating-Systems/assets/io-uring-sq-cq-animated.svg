<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">io_uring submission and completion queues</title>
  <desc id="desc">An animated request moves from a user-built submission queue entry through a shared submission ring to the kernel and device, then returns as a completion queue entry correlated by user_data.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#334155"/></marker><marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#0f766e"/></marker><style>.h{font:700 30px system-ui,sans-serif;fill:#111827}.t{font:700 18px system-ui,sans-serif;fill:#111827}.s{font:14px system-ui,sans-serif;fill:#334155}.box{stroke:#334155;stroke-width:2}.line{fill:none;stroke:#334155;stroke-width:4;marker-end:url(#a)}.ret{fill:none;stroke:#0f766e;stroke-width:4;marker-end:url(#g)}.dash{fill:none;stroke:#7c3aed;stroke-width:2;stroke-dasharray:9 7}</style></defs>
  <rect width="1600" height="920" fill="#fff"/><text x="800" y="48" text-anchor="middle" class="h">io_uring batches operation descriptions and results through shared rings</text>
  <rect x="70" y="95" width="600" height="720" rx="8" fill="#eff6ff" class="box"/><text x="370" y="135" text-anchor="middle" class="t">Userspace</text>
  <rect x="120" y="180" width="500" height="110" rx="8" fill="#dbeafe" class="box"/><text x="370" y="218" text-anchor="middle" class="t">1. Fill an SQE</text><text x="370" y="248" text-anchor="middle" class="s">opcode, fd, buffer, offset, length, flags</text><text x="370" y="274" text-anchor="middle" class="s">user_data = application request identity</text>
  <rect x="120" y="355" width="500" height="128" rx="8" fill="#ede9fe" class="box"/><text x="370" y="393" text-anchor="middle" class="t">2. Publish SQ ring entries</text><text x="370" y="423" text-anchor="middle" class="s">array indexes point to prepared SQEs</text><text x="370" y="449" text-anchor="middle" class="s">advance tail with required memory ordering</text><text x="370" y="475" text-anchor="middle" class="s">enter syscall, SQPOLL wakeup, or cooperative task work</text>
  <rect x="120" y="610" width="500" height="128" rx="8" fill="#dcfce7" class="box"/><text x="370" y="648" text-anchor="middle" class="t">6. Consume CQEs</text><text x="370" y="678" text-anchor="middle" class="s">user_data identifies the request</text><text x="370" y="704" text-anchor="middle" class="s">res is bytes or a negative errno value</text><text x="370" y="730" text-anchor="middle" class="s">advance CQ head; only now release request state</text>
  <path d="M370 290 V355" class="line"/><path d="M370 483 V560 H760" class="line"/>

  <rect x="760" y="95" width="770" height="720" rx="8" fill="#f8fafc" class="box"/><text x="1145" y="135" text-anchor="middle" class="t">Kernel and device</text>
  <rect x="820" y="180" width="650" height="110" rx="8" fill="#fef3c7" class="box"/><text x="1145" y="218" text-anchor="middle" class="t">3. Kernel consumes submissions</text><text x="1145" y="248" text-anchor="middle" class="s">validate each operation, acquire references, queue or execute</text><text x="1145" y="274" text-anchor="middle" class="s">linked operations and dependencies affect issue order</text>
  <rect x="820" y="355" width="650" height="110" rx="8" fill="#cffafe" class="box"/><text x="1145" y="393" text-anchor="middle" class="t">4. Work executes</text><text x="1145" y="423" text-anchor="middle" class="s">cache, network stack, block driver or device handles the request</text><text x="1145" y="449" text-anchor="middle" class="s">different requests can complete out of submission order</text>
  <rect x="820" y="610" width="650" height="128" rx="8" fill="#dcfce7" class="box"/><text x="1145" y="648" text-anchor="middle" class="t">5. Kernel publishes CQEs</text><text x="1145" y="678" text-anchor="middle" class="s">result + flags + copied user_data</text><text x="1145" y="704" text-anchor="middle" class="s">one SQE may produce multiple CQEs for a multishot operation</text><text x="1145" y="730" text-anchor="middle" class="s">completion can be observed by polling or waiting</text>
  <path d="M760 235 H820" class="line"/><path d="M1145 290 V355" class="line"/><path d="M1145 465 V610" class="line"/><path d="M820 674 H620" class="ret"/>
  <circle cx="370" cy="290" r="11" fill="#2563eb"><animateMotion dur="6s" repeatCount="indefinite" path="M0 0 V65 V270 H390 V-55 H450"/></circle>
  <circle cx="1145" cy="465" r="11" fill="#0f766e"><animateMotion dur="6s" begin="3s" repeatCount="indefinite" path="M0 0 V145 H-525"/></circle>
  <path d="M715 80 V830" class="dash"/><text x="715" y="855" text-anchor="middle" class="s" fill="#6d28d9">shared-memory rings cross the API boundary; data buffers may still be copied or DMA-mapped</text>
  <text x="800" y="890" text-anchor="middle" class="s">Reducing submission/completion syscalls is not a universal zero-copy guarantee.</text>
</svg>
