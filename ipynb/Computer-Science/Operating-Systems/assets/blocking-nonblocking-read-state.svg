<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="850" viewBox="0 0 1600 850" role="img" aria-labelledby="title desc">
  <title id="title">Blocking and nonblocking read outcomes</title>
  <desc id="desc">A decision diagram compares a blocking read that sleeps until progress with a nonblocking read that returns EAGAIN, and shows data, EOF, partial success, signals and hard errors.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#334155"/></marker><style>.h{font:700 30px system-ui,sans-serif;fill:#111827}.t{font:700 18px system-ui,sans-serif;fill:#111827}.s{font:15px system-ui,sans-serif;fill:#334155}.box{stroke:#334155;stroke-width:2}.line{fill:none;stroke:#334155;stroke-width:3;marker-end:url(#a)}.ok{fill:none;stroke:#15803d;stroke-width:3;marker-end:url(#a)}.bad{fill:none;stroke:#dc2626;stroke-width:3;marker-end:url(#a)}</style></defs>
  <rect width="1600" height="850" fill="#fff"/><text x="800" y="48" text-anchor="middle" class="h">Blocking changes the waiting policy, not the possible results</text>
  <rect x="615" y="90" width="370" height="80" rx="8" fill="#dbeafe" class="box"/><text x="800" y="138" text-anchor="middle" class="t">read(fd, buffer, requested)</text>
  <path d="M800 170 V220" class="line"/>
  <polygon points="620,220 980,220 1035,275 980,330 620,330 565,275" fill="#fef3c7" class="box"/><text x="800" y="266" text-anchor="middle" class="t">Can the object make progress now?</text><text x="800" y="296" text-anchor="middle" class="s">data, EOF, pending error, or device-specific condition</text>
  <path d="M565 275 H300 V375" class="line"/><text x="420" y="255" class="s">no</text>
  <polygon points="145,375 455,375 505,425 455,475 145,475 95,425" fill="#ede9fe" class="box"/><text x="300" y="417" text-anchor="middle" class="t">O_NONBLOCK?</text><text x="300" y="447" text-anchor="middle" class="s">descriptor/object status flag</text>
  <path d="M95 425 H55 V575 H185" class="bad"/><text x="65" y="405" class="s">yes</text>
  <rect x="185" y="525" width="300" height="100" rx="8" fill="#fee2e2" class="box"/><text x="335" y="566" text-anchor="middle" class="t">Return -1, EAGAIN</text><text x="335" y="596" text-anchor="middle" class="s">caller decides when to retry</text>
  <path d="M505 425 H600 V575 H680" class="line"/><text x="530" y="405" class="s">no</text>
  <rect x="680" y="525" width="320" height="100" rx="8" fill="#e0f2fe" class="box"/><text x="840" y="566" text-anchor="middle" class="t">Sleep on a wait queue</text><text x="840" y="596" text-anchor="middle" class="s">scheduler runs another runnable task</text>
  <path d="M840 525 V450 H800 V330" class="line"/><text x="852" y="480" class="s">wake and recheck</text>

  <path d="M1035 275 H1250 V375" class="ok"/><text x="1135" y="255" class="s">yes</text>
  <rect x="1075" y="375" width="350" height="275" rx="8" fill="#f0fdf4" class="box"/>
  <text x="1250" y="415" text-anchor="middle" class="t">Return one observable result</text>
  <rect x="1120" y="445" width="260" height="48" rx="6" fill="#dcfce7" class="box"/><text x="1250" y="476" text-anchor="middle" class="s">n &gt; 0: bytes transferred (possibly partial)</text>
  <rect x="1120" y="510" width="260" height="48" rx="6" fill="#fef3c7" class="box"/><text x="1250" y="541" text-anchor="middle" class="s">0: EOF for a byte stream / file</text>
  <rect x="1120" y="575" width="260" height="48" rx="6" fill="#fee2e2" class="box"/><text x="1250" y="606" text-anchor="middle" class="s">-1: EINTR or a persistent error</text>
  <rect x="180" y="705" width="1240" height="78" rx="8" fill="#f8fafc" class="box"/><text x="800" y="737" text-anchor="middle" class="t">Always loop around the operation's contract</text><text x="800" y="765" text-anchor="middle" class="s">readiness can race, signals can interrupt, and successful reads/writes can be shorter than requested.</text>
</svg>
