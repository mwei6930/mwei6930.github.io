<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">Classifying a page-fault exception</title>
  <desc id="desc">A decision flow checks address form, region existence, requested permission, and page presence. The kernel may reject the access, repair a valid missing mapping, perform copy-on-write, or resume after updating translation state.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#374151"/></marker><style>.h{font:700 28px system-ui,sans-serif;fill:#111827}.t{font:600 18px system-ui,sans-serif;fill:#111827}.s{font:15px system-ui,sans-serif;fill:#374151}.box{stroke:#374151;stroke-width:2}.line{fill:none;stroke:#374151;stroke-width:3;marker-end:url(#arrow)}.bad{fill:none;stroke:#dc2626;stroke-width:3;marker-end:url(#arrow)}.good{fill:none;stroke:#15803d;stroke-width:3;marker-end:url(#arrow)}</style></defs>
  <rect width="1500" height="900" fill="#ffffff"/>
  <text x="750" y="44" text-anchor="middle" class="h">A page fault is a question to the kernel, not a synonym for disk I/O</text>
  <rect x="585" y="80" width="330" height="82" rx="8" fill="#dbeafe" class="box"/><text x="750" y="113" text-anchor="middle" class="t">CPU raises page-fault exception</text><text x="750" y="141" text-anchor="middle" class="s">faulting VA, access type, mode, cause bits</text>
  <path d="M750 162 V210" class="line"/>
  <polygon points="560,210 940,210 1000,265 940,320 560,320 500,265" fill="#fef3c7" class="box"/><text x="750" y="250" text-anchor="middle" class="t">well-formed user address and mapped region?</text><text x="750" y="280" text-anchor="middle" class="s">consult architectural rules and process region metadata</text>
  <path d="M500 265 H285 V350" class="bad"/><text x="360" y="247" class="s" fill="#b91c1c">no</text>
  <rect x="100" y="350" width="370" height="110" rx="8" fill="#fee2e2" class="box"/><text x="285" y="389" text-anchor="middle" class="t">invalid address</text><text x="285" y="419" text-anchor="middle" class="s">deliver signal / terminate, or handle a</text><text x="285" y="444" text-anchor="middle" class="s">carefully recovered kernel access</text>
  <path d="M750 320 V365" class="good"/><text x="770" y="348" class="s" fill="#15803d">yes</text>
  <polygon points="560,365 940,365 1000,420 940,475 560,475 500,420" fill="#f3e8ff" class="box"/><text x="750" y="406" text-anchor="middle" class="t">requested read/write/execute is permitted?</text><text x="750" y="436" text-anchor="middle" class="s">region policy plus PTE state</text>
  <path d="M1000 420 H1215 V350" class="bad"/><text x="1080" y="402" class="s" fill="#b91c1c">no</text>
  <rect x="1030" y="350" width="370" height="110" rx="8" fill="#fee2e2" class="box"/><text x="1215" y="389" text-anchor="middle" class="t">protection fault</text><text x="1215" y="419" text-anchor="middle" class="s">reject write to read-only, execute-disabled,</text><text x="1215" y="444" text-anchor="middle" class="s">or supervisor-only mapping</text>
  <path d="M750 475 V525" class="good"/><text x="770" y="507" class="s" fill="#15803d">yes</text>
  <polygon points="560,525 940,525 1000,580 940,635 560,635 500,580" fill="#e0f2fe" class="box"/><text x="750" y="566" text-anchor="middle" class="t">usable present translation already exists?</text><text x="750" y="596" text-anchor="middle" class="s">distinguish stale TLB state from missing page state</text>
  <path d="M500 580 H330 V680" class="line"/><text x="385" y="562" class="s">no</text>
  <rect x="120" y="680" width="420" height="125" rx="8" fill="#ffedd5" class="box"/><text x="330" y="720" text-anchor="middle" class="t">repair a valid mapping</text><text x="330" y="751" text-anchor="middle" class="s">zero-fill, copy-on-write, map file data,</text><text x="330" y="778" text-anchor="middle" class="s">or load a nonresident page (chapter 07)</text>
  <path d="M1000 580 H1170 V680" class="line"/><text x="1070" y="562" class="s">yes</text>
  <rect x="960" y="680" width="420" height="125" rx="8" fill="#dcfce7" class="box"/><text x="1170" y="720" text-anchor="middle" class="t">refresh translation state</text><text x="1170" y="751" text-anchor="middle" class="s">update accessed/dirty state if needed,</text><text x="1170" y="778" text-anchor="middle" class="s">invalidate/refill TLB, then resume</text>
  <path d="M540 742 H960" class="good"/><text x="750" y="727" text-anchor="middle" class="s" fill="#15803d">install PTE, invalidate stale entry, restart the faulting instruction</text>
  <text x="750" y="862" text-anchor="middle" class="s">The handler must distinguish a legal-but-not-materialized access from a programming error or security violation.</text>
</svg>
