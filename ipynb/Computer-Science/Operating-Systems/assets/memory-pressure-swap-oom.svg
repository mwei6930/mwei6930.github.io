<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="950" viewBox="0 0 1700 950" role="img" aria-labelledby="title desc">
  <title id="title">Memory pressure, swap, overcommit, and OOM handling</title><desc id="desc">A memory request passes accounting, free lists, reclaim, writeback or swap, compaction, and finally allocation failure or OOM handling. Committed virtual memory, resident pages, and swap occupancy are distinct quantities.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#334155"/></marker><style>.h{font:700 30px system-ui,sans-serif;fill:#111827}.t{font:700 18px system-ui,sans-serif;fill:#111827}.s{font:15px system-ui,sans-serif;fill:#334155}.box{stroke:#334155;stroke-width:2}.line{fill:none;stroke:#334155;stroke-width:3;marker-end:url(#a)}.bad{fill:none;stroke:#dc2626;stroke-width:3;marker-end:url(#a)}.ok{fill:none;stroke:#15803d;stroke-width:3;marker-end:url(#a)}</style></defs>
  <rect width="1700" height="950" fill="#fff"/><text x="850" y="48" text-anchor="middle" class="h">Memory pressure is an escalation path, not a single “RAM full” event</text>

  <rect x="80" y="95" width="455" height="250" rx="8" fill="#eff6ff" class="box"/>
  <text x="307" y="135" text-anchor="middle" class="t">Three quantities that must not be merged</text>
  <rect x="125" y="175" width="120" height="120" rx="8" fill="#dbeafe" class="box"/><text x="185" y="215" text-anchor="middle" class="t">Commit</text><text x="185" y="247" text-anchor="middle" class="s">promised</text><text x="185" y="272" text-anchor="middle" class="s">potential use</text>
  <rect x="247" y="175" width="120" height="120" rx="8" fill="#dcfce7" class="box"/><text x="307" y="215" text-anchor="middle" class="t">RSS</text><text x="307" y="247" text-anchor="middle" class="s">currently</text><text x="307" y="272" text-anchor="middle" class="s">resident</text>
  <rect x="369" y="175" width="120" height="120" rx="8" fill="#ffedd5" class="box"/><text x="429" y="215" text-anchor="middle" class="t">Swap</text><text x="429" y="247" text-anchor="middle" class="s">anonymous</text><text x="429" y="272" text-anchor="middle" class="s">data stored out</text>

  <rect x="675" y="85" width="350" height="88" rx="8" fill="#dbeafe" class="box"/><text x="850" y="120" text-anchor="middle" class="t">Allocation or page fault needs a frame</text><text x="850" y="149" text-anchor="middle" class="s">policy and accounting may reject early</text>
  <path d="M850 173 V215" class="line"/>
  <polygon points="680,215 1020,215 1070,265 1020,315 680,315 630,265" fill="#fef3c7" class="box"/><text x="850" y="253" text-anchor="middle" class="t">Suitable free block above watermark?</text><text x="850" y="283" text-anchor="middle" class="s">right node, zone, order, and constraints</text>
  <path d="M1070 265 H1230" class="ok"/><text x="1135" y="247" class="s" fill="#15803d">yes</text>
  <rect x="1230" y="215" width="360" height="100" rx="8" fill="#dcfce7" class="box"/><text x="1410" y="253" text-anchor="middle" class="t">Allocate and return</text><text x="1410" y="283" text-anchor="middle" class="s">the fast path ends here</text>
  <path d="M850 315 V365" class="bad"/><text x="870" y="347" class="s" fill="#b91c1c">no</text>
  <rect x="650" y="365" width="400" height="100" rx="8" fill="#fff7ed" class="box"/><text x="850" y="403" text-anchor="middle" class="t">Reclaim cold eligible pages</text><text x="850" y="434" text-anchor="middle" class="s">drop clean file cache; write dirty data; swap anonymous pages</text>
  <path d="M850 465 V510" class="line"/>
  <polygon points="680,510 1020,510 1070,560 1020,610 680,610 630,560" fill="#fef3c7" class="box"/><text x="850" y="548" text-anchor="middle" class="t">Enough usable memory now?</text><text x="850" y="578" text-anchor="middle" class="s">high-order requests may also need compaction</text>
  <path d="M1070 560 H1230 V315" class="ok"/><text x="1130" y="542" class="s" fill="#15803d">yes</text>
  <path d="M850 610 V655" class="bad"/><text x="870" y="640" class="s" fill="#b91c1c">no</text>
  <rect x="650" y="655" width="400" height="105" rx="8" fill="#fee2e2" class="box"/><text x="850" y="695" text-anchor="middle" class="t">Fail, throttle, or invoke scoped OOM handling</text><text x="850" y="727" text-anchor="middle" class="s">the exact response depends on context and cgroup/system scope</text>

  <rect x="80" y="445" width="455" height="315" rx="8" fill="#f1f5f9" class="box"/>
  <text x="307" y="485" text-anchor="middle" class="t">Reclaim cost by page type</text>
  <text x="120" y="535" class="s">Clean file page</text><text x="480" y="535" text-anchor="end" class="s">discard; reread later</text>
  <text x="120" y="580" class="s">Dirty file page</text><text x="480" y="580" text-anchor="end" class="s">write back before reuse</text>
  <text x="120" y="625" class="s">Anonymous page</text><text x="480" y="625" text-anchor="end" class="s">swap or keep resident</text>
  <text x="120" y="670" class="s">Pinned / unevictable</text><text x="480" y="670" text-anchor="end" class="s">not a normal victim</text>
  <text x="120" y="715" class="s">Huge contiguous request</text><text x="480" y="715" text-anchor="end" class="s">may require compaction</text>

  <rect x="1145" y="445" width="455" height="315" rx="8" fill="#fdf2f8" class="box"/>
  <text x="1372" y="485" text-anchor="middle" class="t">What swap does and does not do</text>
  <text x="1185" y="535" class="s">+ Preserves cold anonymous contents.</text>
  <text x="1185" y="580" class="s">+ Releases frames for a hotter working set.</text>
  <text x="1185" y="625" class="s">- Adds latency and write amplification.</text>
  <text x="1185" y="670" class="s">- Cannot repair a persistently oversized hot set.</text>
  <text x="1185" y="715" class="s">- Is not equivalent to fast physical memory.</text>
  <rect x="250" y="850" width="1200" height="65" rx="8" fill="#ecfeff" class="box"/><text x="850" y="890" text-anchor="middle" class="s">Tune only after measurement: overcommit policy, reclaim, swap, cgroup limits, and OOM behavior form one coupled contract.</text>
</svg>
