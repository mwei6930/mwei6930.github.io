<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="850" viewBox="0 0 1600 850" role="img" aria-labelledby="title desc">
  <title id="title">Tagged TLB entries across context switches and a multicore TLB shootdown</title>
  <desc id="desc">The upper panel shows ASID or PCID tags allowing translations for two processes to coexist across a context switch. The lower panel shows a kernel page-table update followed by interprocessor invalidation requests and acknowledgements from other CPUs.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#374151"/></marker><style>.h{font:700 28px system-ui,sans-serif;fill:#111827}.t{font:600 18px system-ui,sans-serif;fill:#111827}.s{font:15px system-ui,sans-serif;fill:#374151}.box{stroke:#374151;stroke-width:2}.line{fill:none;stroke:#374151;stroke-width:3;marker-end:url(#arrow)}.ipi{fill:none;stroke:#dc2626;stroke-width:4;stroke-dasharray:9 6;marker-end:url(#arrow)}</style></defs>
  <rect width="1600" height="850" fill="#ffffff"/>
  <text x="800" y="44" text-anchor="middle" class="h">Tags preserve useful translations; invalidation restores coherence</text>
  <text x="800" y="91" text-anchor="middle" class="t">Context switch on CPU 0</text>
  <rect x="80" y="125" width="260" height="105" rx="8" fill="#dbeafe" class="box"/><text x="210" y="162" text-anchor="middle" class="t">run process A</text><text x="210" y="192" text-anchor="middle" class="s">root A, tag 17</text>
  <path d="M340 177 H470" class="line"/>
  <rect x="470" y="112" width="470" height="205" rx="8" fill="#f8fafc" class="box"/><text x="705" y="148" text-anchor="middle" class="t">CPU 0 TLB</text>
  <rect x="510" y="175" width="390" height="48" rx="5" fill="#dbeafe" class="box"/><text x="535" y="205" class="s">tag 17 | VPN 0x40</text><text x="760" y="205" class="s">PFN 8 | r-x</text>
  <rect x="510" y="238" width="390" height="48" rx="5" fill="#dcfce7" class="box"/><text x="535" y="268" class="s">tag 29 | VPN 0x40</text><text x="760" y="268" class="s">PFN 31 | r-x</text>
  <path d="M940 177 H1060" class="line"/>
  <rect x="1060" y="125" width="260" height="105" rx="8" fill="#dcfce7" class="box"/><text x="1190" y="162" text-anchor="middle" class="t">switch to process B</text><text x="1190" y="192" text-anchor="middle" class="s">root B, tag 29</text>
  <rect x="1325" y="125" width="205" height="105" rx="8" fill="#fef3c7" class="box"/><text x="1428" y="161" text-anchor="middle" class="t">no full flush</text><text x="1428" y="191" text-anchor="middle" class="s">tag selects B entry</text>
  <path d="M1320 177 H1325" class="line"/>
  <text x="800" y="352" text-anchor="middle" class="s">Without tags, stale VPN 0x40 from A could be mistaken for B; flushing prevents that but discards useful translations.</text>

  <line x1="95" y1="390" x2="1505" y2="390" stroke="#cbd5e1" stroke-width="3"/>
  <text x="800" y="435" text-anchor="middle" class="t">Page-table change while the address space has run on multiple CPUs</text>
  <rect x="80" y="480" width="310" height="130" rx="8" fill="#f3e8ff" class="box"/><text x="235" y="518" text-anchor="middle" class="t">CPU 0: kernel updater</text><text x="235" y="549" text-anchor="middle" class="s">unmap or tighten permission</text><text x="235" y="577" text-anchor="middle" class="s">write page-table entry</text>
  <rect x="645" y="470" width="310" height="150" rx="8" fill="#fee2e2" class="box"/><text x="800" y="508" text-anchor="middle" class="t">shootdown protocol</text><text x="800" y="540" text-anchor="middle" class="s">identify CPUs that may cache the mapping</text><text x="800" y="568" text-anchor="middle" class="s">send IPI / request invalidation</text><text x="800" y="596" text-anchor="middle" class="s">wait for required acknowledgements</text>
  <rect x="1210" y="455" width="310" height="90" rx="8" fill="#e0f2fe" class="box"/><text x="1365" y="490" text-anchor="middle" class="t">CPU 1 TLB</text><text x="1365" y="519" text-anchor="middle" class="s">invalidate tag 17, VPN 0x40</text>
  <rect x="1210" y="575" width="310" height="90" rx="8" fill="#e0f2fe" class="box"/><text x="1365" y="610" text-anchor="middle" class="t">CPU 2 TLB</text><text x="1365" y="639" text-anchor="middle" class="s">invalidate tag 17, VPN 0x40</text>
  <path d="M390 545 H645" class="line"/>
  <path d="M955 520 C1060 500 1110 500 1210 500" class="ipi"/>
  <path d="M955 575 C1060 620 1110 620 1210 620" class="ipi"/>
  <path d="M1210 535 C1100 555 1060 555 955 550" fill="none" stroke="#15803d" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1210 650 C1100 680 1050 635 955 600" fill="none" stroke="#15803d" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="370" y="710" width="860" height="72" rx="8" fill="#f1f5f9" class="box"/><text x="800" y="740" text-anchor="middle" class="s">The update is not globally safe until CPUs that might use the stale translation have invalidated it.</text><text x="800" y="766" text-anchor="middle" class="s">Batching invalidations reduces IPIs but delays reclamation and permission changes.</text>
</svg>
