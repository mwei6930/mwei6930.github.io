<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="950" viewBox="0 0 1800 950" role="img" aria-labelledby="title desc">
  <title id="title">Write-ahead journal commit, checkpoint, and recovery</title>
  <desc id="desc">An animated transaction writes a descriptor and logged metadata to the journal, flushes, writes a commit record, then checkpoints blocks to home locations. Recovery replays only complete committed transactions.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#334155"/></marker><style>.h{font:700 30px system-ui,sans-serif;fill:#111827}.t{font:700 17px system-ui,sans-serif;fill:#111827}.s{font:14px system-ui,sans-serif;fill:#334155}.box{stroke:#334155;stroke-width:2}.line{fill:none;stroke:#334155;stroke-width:4;marker-end:url(#a)}.journal{fill:#fef3c7;stroke:#d97706;stroke-width:2}.home{fill:#dbeafe;stroke:#2563eb;stroke-width:2}.ok{fill:#dcfce7;stroke:#15803d;stroke-width:2}.bad{fill:#fee2e2;stroke:#dc2626;stroke-width:2}</style></defs>
  <rect width="1800" height="950" fill="#fff"/><text x="900" y="48" text-anchor="middle" class="h">Write-ahead logging commits recovery evidence before overwriting home locations</text>
  <rect x="65" y="100" width="1670" height="180" rx="8" fill="#fff7ed" class="box"/><text x="115" y="140" class="t">Journal ring</text>
  <rect x="240" y="165" width="240" height="70" class="journal"/><text x="360" y="195" text-anchor="middle" class="t">Descriptor T7</text><text x="360" y="221" text-anchor="middle" class="s">home block identities</text>
  <rect x="480" y="165" width="220" height="70" class="journal"/><text x="590" y="207" text-anchor="middle" class="s">inode block image</text>
  <rect x="700" y="165" width="220" height="70" class="journal"/><text x="810" y="207" text-anchor="middle" class="s">bitmap block image</text>
  <rect x="920" y="165" width="220" height="70" class="journal"/><text x="1030" y="207" text-anchor="middle" class="s">directory block image</text>
  <rect x="1140" y="165" width="220" height="70" class="ok"/><text x="1250" y="195" text-anchor="middle" class="t">Commit T7</text><text x="1250" y="221" text-anchor="middle" class="s">checksum / sequence</text>
  <rect x="1360" y="165" width="280" height="70" fill="#fff" class="box"/><text x="1500" y="207" text-anchor="middle" class="s">space for later transactions...</text>
  <path id="journalPath" d="M200 200 H240 M480 200 H700 M920 200 H1140" class="line"/>
  <circle cx="200" cy="200" r="11" fill="#d97706"><animateMotion dur="7s" repeatCount="indefinite" path="M0 0 H1040"/></circle>

  <rect x="65" y="345" width="800" height="290" rx="8" fill="#eff6ff" class="box"/><text x="465" y="387" text-anchor="middle" class="t">Normal execution</text>
  <text x="120" y="440" class="s">1. collect related metadata changes in transaction T7</text><text x="120" y="482" class="s">2. write descriptor + logged blocks to journal</text><text x="120" y="524" class="s">3. enforce ordering/flush, then write commit record</text><text x="120" y="566" class="s">4. acknowledge according to filesystem/fsync policy</text><text x="120" y="608" class="s">5. checkpoint blocks to home locations; reclaim journal space</text>
  <path d="M1250 235 V310 H805 V345" class="line"/>

  <rect x="935" y="345" width="800" height="290" rx="8" fill="#f0fdf4" class="box"/><text x="1335" y="387" text-anchor="middle" class="t">Recovery after a crash</text>
  <rect x="990" y="435" width="310" height="125" rx="8" class="bad"/><text x="1145" y="475" text-anchor="middle" class="t">No valid commit</text><text x="1145" y="508" text-anchor="middle" class="s">discard incomplete transaction</text><text x="1145" y="536" text-anchor="middle" class="s">home state remains authoritative</text>
  <rect x="1370" y="435" width="310" height="125" rx="8" class="ok"/><text x="1525" y="475" text-anchor="middle" class="t">Valid commit present</text><text x="1525" y="508" text-anchor="middle" class="s">replay logged blocks idempotently</text><text x="1525" y="536" text-anchor="middle" class="s">finish interrupted checkpoint</text>
  <path d="M1335 405 H1145 V435" class="line"/><path d="M1335 405 H1525 V435" class="line"/>

  <rect x="170" y="720" width="1460" height="145" rx="8" fill="#f8fafc" class="box"/><text x="900" y="758" text-anchor="middle" class="t">What journaling usually protects</text><text x="900" y="794" text-anchor="middle" class="s">Metadata journaling keeps allocation and namespace structures consistent; data mode determines whether user data is journaled or merely ordered.</text><text x="900" y="827" text-anchor="middle" class="s">A committed journal transaction is not automatically the same unit as an application's multi-file transaction.</text>
  <text x="900" y="912" text-anchor="middle" class="s">Descriptor, data, commit and checkpoint ordering must survive device caches and reordering through flush/barrier semantics.</text>
</svg>
