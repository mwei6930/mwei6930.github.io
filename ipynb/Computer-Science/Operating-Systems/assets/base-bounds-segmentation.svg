<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850" role="img" aria-labelledby="title desc">
  <title id="title">Base and bounds compared with segmentation</title>
  <desc id="desc">The left panel translates one contiguous process region using a base and limit. The right panel translates independent code, heap, and stack segments but leaves external holes in physical memory.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#374151"/></marker>
    <style>.h{font:700 28px system-ui,sans-serif;fill:#111827}.t{font:600 18px system-ui,sans-serif;fill:#111827}.s{font:15px system-ui,sans-serif;fill:#374151}.box{stroke:#374151;stroke-width:2}.line{fill:none;stroke:#374151;stroke-width:3;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1500" height="850" fill="#ffffff"/>
  <text x="750" y="44" text-anchor="middle" class="h">Dynamic relocation protects ranges; segmentation gives regions independent placement</text>
  <line x1="750" y1="80" x2="750" y2="795" stroke="#cbd5e1" stroke-width="3"/>
  <text x="370" y="95" text-anchor="middle" class="t">Base and bounds: one contiguous allocation</text>
  <rect x="75" y="130" width="250" height="110" rx="8" fill="#dbeafe" class="box"/><text x="200" y="170" text-anchor="middle" class="t">virtual address = 0x320</text><text x="200" y="201" text-anchor="middle" class="s">bounds = 0x800</text>
  <path d="M325 185 H430" class="line"/>
  <polygon points="450,125 625,125 680,185 625,245 450,245 395,185" fill="#fef3c7" class="box"/>
  <text x="538" y="164" text-anchor="middle" class="t">0x320 &lt; 0x800?</text><text x="538" y="196" text-anchor="middle" class="s">yes: add base 0x4000</text><text x="538" y="222" text-anchor="middle" class="s">PA = 0x4320</text>
  <rect x="90" y="310" width="560" height="340" rx="8" fill="#f8fafc" class="box"/>
  <text x="370" y="345" text-anchor="middle" class="t">physical memory</text>
  <rect x="125" y="370" width="490" height="65" rx="6" fill="#e5e7eb" class="box"/><text x="370" y="410" text-anchor="middle" class="s">operating system and other allocations</text>
  <rect x="125" y="455" width="490" height="135" rx="6" fill="#dcfce7" class="box"/><text x="370" y="500" text-anchor="middle" class="t">entire process</text><text x="370" y="532" text-anchor="middle" class="s">[base, base + bounds)</text><text x="370" y="561" text-anchor="middle" class="s">code, heap gap, and stack reserve move together</text>
  <text x="370" y="700" text-anchor="middle" class="s">Simple and fast, but growth requires one sufficiently large contiguous hole.</text>

  <text x="1125" y="95" text-anchor="middle" class="t">Segmentation: one base, limit, and policy per region</text>
  <rect x="825" y="130" width="250" height="75" rx="8" fill="#dbeafe" class="box"/><text x="950" y="162" text-anchor="middle" class="t">code: selector 0</text><text x="950" y="188" text-anchor="middle" class="s">offset 0x120, execute</text>
  <rect x="825" y="220" width="250" height="75" rx="8" fill="#dcfce7" class="box"/><text x="950" y="252" text-anchor="middle" class="t">heap: selector 1</text><text x="950" y="278" text-anchor="middle" class="s">offset 0x090, write</text>
  <rect x="825" y="310" width="250" height="75" rx="8" fill="#ffedd5" class="box"/><text x="950" y="342" text-anchor="middle" class="t">stack: selector 2</text><text x="950" y="368" text-anchor="middle" class="s">offset interpreted by policy</text>
  <rect x="1130" y="130" width="300" height="255" rx="8" fill="#f8fafc" class="box"/><text x="1280" y="165" text-anchor="middle" class="t">segment table</text><text x="1160" y="205" class="s">0: base 0x5000, limit 0x600, r-x</text><text x="1160" y="245" class="s">1: base 0x9000, limit 0x400, rw-</text><text x="1160" y="285" class="s">2: base 0xD000, limit 0x500, rw-</text><text x="1160" y="335" class="s">check selector, offset, permission</text>
  <path d="M1075 167 H1130" class="line"/><path d="M1075 257 H1130" class="line"/><path d="M1075 347 H1130" class="line"/>
  <rect x="825" y="430" width="605" height="250" rx="8" fill="#f8fafc" class="box"/><text x="1125" y="465" text-anchor="middle" class="t">physical memory after independent placement</text>
  <rect x="855" y="490" width="160" height="65" rx="6" fill="#dbeafe" class="box"/><text x="935" y="530" text-anchor="middle" class="t">code</text>
  <rect x="1030" y="490" width="80" height="65" rx="6" fill="#fee2e2" class="box"/><text x="1070" y="530" text-anchor="middle" class="s">hole</text>
  <rect x="1125" y="490" width="125" height="65" rx="6" fill="#dcfce7" class="box"/><text x="1188" y="530" text-anchor="middle" class="t">heap</text>
  <rect x="1265" y="490" width="135" height="65" rx="6" fill="#e5e7eb" class="box"/><text x="1332" y="530" text-anchor="middle" class="s">other</text>
  <rect x="855" y="575" width="105" height="65" rx="6" fill="#fee2e2" class="box"/><text x="907" y="615" text-anchor="middle" class="s">hole</text>
  <rect x="975" y="575" width="180" height="65" rx="6" fill="#ffedd5" class="box"/><text x="1065" y="615" text-anchor="middle" class="t">stack</text>
  <rect x="1170" y="575" width="230" height="65" rx="6" fill="#fee2e2" class="box"/><text x="1285" y="615" text-anchor="middle" class="s">free, but fragmented</text>
  <text x="1125" y="730" text-anchor="middle" class="s">Flexible protection and sharing, but variable-size segments create external fragmentation.</text>
  <rect x="270" y="775" width="960" height="48" rx="8" fill="#f1f5f9" class="box"/><text x="750" y="805" text-anchor="middle" class="s">Both mechanisms relocate addresses; paging removes the requirement that logical neighbors occupy one physical interval.</text>
</svg>
