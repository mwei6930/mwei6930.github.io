<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Read-copy-update publication and reclamation</title>
  <desc id="desc">An animated timeline shows readers using old and new versions around publication, followed by a grace period and safe reclamation.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#34495e"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#17202a;letter-spacing:0}.h{font-size:28px;font-weight:700}.s{font-size:19px;font-weight:700}.b{font-size:16px}.n{font-size:14px;fill:#425466}.axis{stroke:#34495e;stroke-width:3;marker-end:url(#a)}.old{stroke:#c0392b;stroke-width:10;stroke-linecap:round}.new{stroke:#1f618d;stroke-width:10;stroke-linecap:round}.grace{fill:#fcf3cf;stroke:#b9770e;stroke-width:2}.pulse{fill:#c0392b}</style></defs>
  <rect width="1200" height="640" fill="#f8fafc"/><text x="600" y="42" text-anchor="middle" class="h">RCU separates publication from reclamation</text>
  <line x1="105" y1="540" x2="1120" y2="540" class="axis"/><text x="1125" y="568" text-anchor="end" class="n">time</text>
  <rect x="535" y="82" width="390" height="425" class="grace"/><text x="730" y="112" text-anchor="middle" class="s">Grace period</text><text x="730" y="137" text-anchor="middle" class="n">wait until every pre-existing reader can no longer hold old</text>
  <line x1="535" y1="155" x2="535" y2="540" stroke="#c0392b" stroke-width="3" stroke-dasharray="8 6"/><text x="535" y="570" text-anchor="middle" class="b">publish new</text>
  <line x1="925" y1="155" x2="925" y2="540" stroke="#1f618d" stroke-width="3" stroke-dasharray="8 6"/><text x="925" y="570" text-anchor="middle" class="b">reclaim old</text>
  <text x="105" y="210" class="s">Reader A</text><line x1="260" y1="205" x2="690" y2="205" class="old"/><text x="475" y="190" text-anchor="middle" class="n">began before publication; may still see old</text>
  <text x="105" y="295" class="s">Reader B</text><line x1="355" y1="290" x2="815" y2="290" class="old"/><text x="585" y="275" text-anchor="middle" class="n">another pre-existing read-side critical section</text>
  <text x="105" y="380" class="s">Reader C</text><line x1="625" y1="375" x2="1015" y2="375" class="new"/><text x="820" y="360" text-anchor="middle" class="n">starts after publication; follows new pointer</text>
  <text x="105" y="465" class="s">Updater</text><line x1="280" y1="460" x2="535" y2="460" class="new"/><text x="405" y="445" text-anchor="middle" class="n">copy and initialize new object</text><line x1="925" y1="460" x2="1045" y2="460" class="old"/><text x="985" y="445" text-anchor="middle" class="n">free old</text>
  <circle r="10" class="pulse"><animateMotion dur="5s" repeatCount="indefinite" path="M280 460 H535 V155 H925 V460 H1045"/></circle>
  <rect x="105" y="590" width="990" height="34" rx="6" fill="#ffffff" stroke="#34495e" stroke-width="2"/><text x="600" y="613" text-anchor="middle" class="b">RCU protects lifetime in read-mostly paths; it does not automatically make multi-field updates atomic or enforce arbitrary invariants.</text>
</svg>
