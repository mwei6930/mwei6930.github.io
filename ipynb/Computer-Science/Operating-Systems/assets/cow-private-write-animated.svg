<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="850" viewBox="0 0 1600 850" role="img" aria-labelledby="title desc">
  <title id="title">Copy-on-write after fork</title><desc id="desc">Parent and child initially map one frame read-only. A child write faults, allocates a private frame, copies the bytes, changes only the child PTE, and leaves the parent data unchanged.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#334155"/></marker><style>.h{font:700 30px system-ui,sans-serif;fill:#111827}.t{font:700 18px system-ui,sans-serif;fill:#111827}.s{font:15px system-ui,sans-serif;fill:#334155}.box{stroke:#334155;stroke-width:2}.line{fill:none;stroke:#334155;stroke-width:3;marker-end:url(#a)}.copy{fill:none;stroke:#db2777;stroke-width:5;stroke-dasharray:10 8;marker-end:url(#a);animation:m 4.5s infinite}@keyframes m{0%,20%{stroke-dashoffset:40;opacity:.1}55%,85%{stroke-dashoffset:0;opacity:1}100%{opacity:.1}}</style></defs>
  <rect width="1600" height="850" fill="#fff"/><text x="800" y="48" text-anchor="middle" class="h">Copy first only when a writer would break sharing</text>
  <text x="380" y="105" text-anchor="middle" class="t">Immediately after fork()</text><text x="1210" y="105" text-anchor="middle" class="t">After the child writes</text>

  <rect x="80" y="150" width="250" height="145" rx="8" fill="#dbeafe" class="box"/><text x="205" y="190" text-anchor="middle" class="t">Parent PTE</text><text x="205" y="225" text-anchor="middle" class="s">present, read-only, COW</text><text x="205" y="257" text-anchor="middle" class="s">refcount participates in sharing</text>
  <rect x="80" y="440" width="250" height="145" rx="8" fill="#ede9fe" class="box"/><text x="205" y="480" text-anchor="middle" class="t">Child PTE</text><text x="205" y="515" text-anchor="middle" class="s">present, read-only, COW</text><text x="205" y="547" text-anchor="middle" class="s">same virtual page, same frame</text>
  <rect x="450" y="285" width="280" height="160" rx="8" fill="#fef3c7" class="box"/><text x="590" y="330" text-anchor="middle" class="t">Shared physical frame F</text><text x="590" y="365" text-anchor="middle" class="s">contents: value = 41</text><text x="590" y="397" text-anchor="middle" class="s">mapping count: 2</text>
  <path d="M330 220 H390 V330 H450" class="line"/><path d="M330 512 H390 V400 H450" class="line"/>

  <path d="M755 512 H850" class="copy"/><text x="800" y="490" text-anchor="middle" class="s" fill="#be185d">child store faults</text>
  <rect x="885" y="440" width="250" height="145" rx="8" fill="#fee2e2" class="box"/><text x="1010" y="480" text-anchor="middle" class="t">COW handler</text><text x="1010" y="515" text-anchor="middle" class="s">allocate, copy, remap child</text><text x="1010" y="547" text-anchor="middle" class="s">then restart the store</text>

  <rect x="1265" y="150" width="260" height="145" rx="8" fill="#dcfce7" class="box"/><text x="1395" y="190" text-anchor="middle" class="t">Frame F</text><text x="1395" y="225" text-anchor="middle" class="s">parent: value = 41</text><text x="1395" y="257" text-anchor="middle" class="s">may become writable if exclusive</text>
  <rect x="1265" y="440" width="260" height="145" rx="8" fill="#fce7f3" class="box"/><text x="1395" y="480" text-anchor="middle" class="t">New frame G</text><text x="1395" y="515" text-anchor="middle" class="s">child: value = 99</text><text x="1395" y="547" text-anchor="middle" class="s">private writable mapping</text>
  <path d="M730 330 H1190 V220 H1265" class="line"/><path d="M1135 512 H1265" class="copy"/>

  <rect x="235" y="675" width="1130" height="105" rx="8" fill="#f1f5f9" class="box"/><text x="800" y="713" text-anchor="middle" class="t">The optimization is semantic, not merely a delayed memcpy</text><text x="800" y="745" text-anchor="middle" class="s">If neither process writes, no page copy is needed. If a page is already exclusive, the handler may only upgrade permissions.</text>
</svg>
