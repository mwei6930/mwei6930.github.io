<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Slab and object cache organization</title><desc id="desc">A type-specific kernel cache obtains pages from the page allocator, divides slabs into fixed-size objects, and keeps full, partial, and empty slabs plus a fast per-CPU path.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#334155"/></marker><style>.h{font:700 30px system-ui,sans-serif;fill:#111827}.t{font:700 18px system-ui,sans-serif;fill:#111827}.s{font:15px system-ui,sans-serif;fill:#334155}.box{stroke:#334155;stroke-width:2}.line{fill:none;stroke:#334155;stroke-width:3;marker-end:url(#a)}.obj{stroke:#64748b;stroke-width:1.5}</style></defs>
  <rect width="1600" height="900" fill="#fff"/><text x="800" y="48" text-anchor="middle" class="h">Slab caches turn page blocks into reusable, typed kernel objects</text>
  <rect x="90" y="135" width="310" height="135" rx="8" fill="#dbeafe" class="box"/><text x="245" y="176" text-anchor="middle" class="t">Buddy / page allocator</text><text x="245" y="210" text-anchor="middle" class="s">supplies one or more page blocks</text><text x="245" y="238" text-anchor="middle" class="s">physical contiguity at page granularity</text>
  <path d="M400 202 H505" class="line"/>
  <rect x="505" y="115" width="360" height="175" rx="8" fill="#fef3c7" class="box"/><text x="685" y="157" text-anchor="middle" class="t">kmem_cache for one object class</text><text x="685" y="192" text-anchor="middle" class="s">size, alignment, debug and hardening metadata</text><text x="685" y="223" text-anchor="middle" class="s">for example: dentries or task structures</text><text x="685" y="254" text-anchor="middle" class="s">implementation may be SLUB, SLAB, or another policy</text>
  <path d="M865 202 H970" class="line"/>
  <rect x="970" y="135" width="300" height="135" rx="8" fill="#dcfce7" class="box"/><text x="1120" y="176" text-anchor="middle" class="t">Per-CPU fast path</text><text x="1120" y="210" text-anchor="middle" class="s">nearby freelist reduces contention</text><text x="1120" y="238" text-anchor="middle" class="s">refills from shared cache state</text>

  <text x="800" y="355" text-anchor="middle" class="t">Slabs are classified by occupancy</text>
  <g transform="translate(100,410)">
    <rect width="420" height="250" rx="8" fill="#ecfdf5" class="box"/><text x="210" y="38" text-anchor="middle" class="t">Full slab</text>
    <g fill="#86efac" class="obj"><rect x="35" y="75" width="72" height="62"/><rect x="120" y="75" width="72" height="62"/><rect x="205" y="75" width="72" height="62"/><rect x="290" y="75" width="72" height="62"/><rect x="35" y="150" width="72" height="62"/><rect x="120" y="150" width="72" height="62"/><rect x="205" y="150" width="72" height="62"/><rect x="290" y="150" width="72" height="62"/></g>
  </g>
  <g transform="translate(590,410)">
    <rect width="420" height="250" rx="8" fill="#fff7ed" class="box"/><text x="210" y="38" text-anchor="middle" class="t">Partial slab</text>
    <g class="obj"><rect x="35" y="75" width="72" height="62" fill="#86efac"/><rect x="120" y="75" width="72" height="62" fill="#fff"/><rect x="205" y="75" width="72" height="62" fill="#86efac"/><rect x="290" y="75" width="72" height="62" fill="#fff"/><rect x="35" y="150" width="72" height="62" fill="#86efac"/><rect x="120" y="150" width="72" height="62" fill="#fff"/><rect x="205" y="150" width="72" height="62" fill="#86efac"/><rect x="290" y="150" width="72" height="62" fill="#fff"/></g>
  </g>
  <g transform="translate(1080,410)">
    <rect width="420" height="250" rx="8" fill="#f8fafc" class="box"/><text x="210" y="38" text-anchor="middle" class="t">Empty slab</text>
    <g fill="#fff" class="obj"><rect x="35" y="75" width="72" height="62"/><rect x="120" y="75" width="72" height="62"/><rect x="205" y="75" width="72" height="62"/><rect x="290" y="75" width="72" height="62"/><rect x="35" y="150" width="72" height="62"/><rect x="120" y="150" width="72" height="62"/><rect x="205" y="150" width="72" height="62"/><rect x="290" y="150" width="72" height="62"/></g>
  </g>
  <rect x="250" y="755" width="1100" height="88" rx="8" fill="#f1f5f9" class="box"/><text x="800" y="788" text-anchor="middle" class="t">Why not use the buddy allocator for every object?</text><text x="800" y="818" text-anchor="middle" class="s">Typed caches reduce power-of-two waste, amortize initialization, improve locality, and make hot allocation paths cheaper.</text>
</svg>
