<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="940" viewBox="0 0 1700 940" role="img" aria-labelledby="title desc">
  <title id="title">File allocation and free-space strategies</title>
  <desc id="desc">Four panels compare contiguous, linked, indexed, and extent-based file allocation. A lower panel contrasts free-space bitmaps with free-extent trees and explains fragmentation.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#334155"/></marker><style>.h{font:700 30px system-ui,sans-serif;fill:#111827}.t{font:700 18px system-ui,sans-serif;fill:#111827}.s{font:14px system-ui,sans-serif;fill:#334155}.box{stroke:#334155;stroke-width:2}.line{fill:none;stroke:#334155;stroke-width:3;marker-end:url(#a)}.data{fill:#dbeafe;stroke:#334155;stroke-width:2}.free{fill:#fff;stroke:#94a3b8;stroke-width:2}</style></defs>
  <rect width="1700" height="940" fill="#fff"/><text x="850" y="48" text-anchor="middle" class="h">Allocation trades metadata cost, random access, growth and fragmentation</text>
  <rect x="55" y="95" width="385" height="470" rx="8" fill="#eff6ff" class="box"/><text x="248" y="137" text-anchor="middle" class="t">Contiguous</text>
  <text x="100" y="180" class="s">metadata: start=40, length=5</text>
  <rect x="90" y="225" width="50" height="55" class="free"/><rect x="140" y="225" width="50" height="55" class="free"/><rect x="190" y="225" width="50" height="55" class="data"/><rect x="240" y="225" width="50" height="55" class="data"/><rect x="290" y="225" width="50" height="55" class="data"/><rect x="340" y="225" width="50" height="55" class="data"/>
  <text x="240" y="315" text-anchor="middle" class="s">logical i -> start + i</text><text x="90" y="365" class="s">+ minimal metadata, fast sequential/random</text><text x="90" y="402" class="s">- growth needs adjacent space or relocation</text><text x="90" y="439" class="s">- external fragmentation</text><text x="90" y="505" class="t">Best when size is known</text>

  <rect x="460" y="95" width="385" height="470" rx="8" fill="#fff7ed" class="box"/><text x="653" y="137" text-anchor="middle" class="t">Linked</text>
  <rect x="505" y="215" width="90" height="65" class="data"/><text x="550" y="255" text-anchor="middle" class="s">40</text><rect x="640" y="300" width="90" height="65" class="data"/><text x="685" y="340" text-anchor="middle" class="s">87</text><rect x="700" y="195" width="90" height="65" class="data"/><text x="745" y="235" text-anchor="middle" class="s">12</text>
  <path d="M595 248 H620 V332 H640" class="line"/><path d="M730 332 H770 V280 H745 V260" class="line"/>
  <text x="505" y="405" class="s">+ simple growth and no external fragments</text><text x="505" y="442" class="s">- random block access follows the chain</text><text x="505" y="479" class="s">- pointer overhead and corruption exposure</text><text x="505" y="525" class="t">Classic FAT centralizes links</text>

  <rect x="865" y="95" width="385" height="470" rx="8" fill="#f5f3ff" class="box"/><text x="1058" y="137" text-anchor="middle" class="t">Indexed</text>
  <rect x="915" y="190" width="150" height="170" rx="6" fill="#ede9fe" class="box"/><text x="990" y="225" text-anchor="middle" class="t">index block</text><text x="945" y="265" class="s">0 -> 40</text><text x="945" y="300" class="s">1 -> 87</text><text x="945" y="335" class="s">2 -> 12</text>
  <rect x="1120" y="195" width="80" height="52" class="data"/><text x="1160" y="227" text-anchor="middle" class="s">40</text><rect x="1120" y="270" width="80" height="52" class="data"/><text x="1160" y="302" text-anchor="middle" class="s">87</text><rect x="1120" y="345" width="80" height="52" class="data"/><text x="1160" y="377" text-anchor="middle" class="s">12</text>
  <path d="M1065 265 H1120" class="line"/><path d="M1065 300 H1100 V296 H1120" class="line"/><path d="M1065 335 H1100 V371 H1120" class="line"/>
  <text x="910" y="442" class="s">+ direct random access and flexible growth</text><text x="910" y="479" class="s">- index blocks consume space and I/O</text><text x="910" y="516" class="s">- multilevel trees needed for large files</text>

  <rect x="1270" y="95" width="375" height="470" rx="8" fill="#f0fdf4" class="box"/><text x="1458" y="137" text-anchor="middle" class="t">Extent-based</text>
  <rect x="1315" y="190" width="285" height="170" rx="6" fill="#dcfce7" class="box"/><text x="1458" y="225" text-anchor="middle" class="t">range records</text><text x="1350" y="265" class="s">L0 + 3 -> P40</text><text x="1350" y="300" class="s">L3 + 2 -> P87</text><text x="1350" y="335" class="s">L5 + 8 -> P120</text>
  <text x="1315" y="405" class="s">+ compact maps for contiguous runs</text><text x="1315" y="442" class="s">+ efficient large sequential files</text><text x="1315" y="479" class="s">- fragmentation creates more records</text><text x="1315" y="516" class="s">- allocator must predict locality/growth</text>

  <rect x="80" y="630" width="1540" height="230" rx="8" fill="#f8fafc" class="box"/><text x="850" y="670" text-anchor="middle" class="t">Free-space management supplies candidates to the allocator</text>
  <text x="135" y="720" class="t">Bitmap</text><text x="270" y="720" class="s">0011110010000111...</text><text x="270" y="753" class="s">one bit per allocation unit; easy counting and local run search</text>
  <text x="135" y="810" class="t">Free extents/tree</text><text x="350" y="810" class="s">(start=12,len=4), (start=90,len=32), ...</text><text x="900" y="810" class="s">compact for long runs; needs split/merge and indexed search</text>
  <text x="850" y="902" text-anchor="middle" class="s">Internal fragmentation wastes space inside allocated units; external fragmentation splits free space into poorly shaped runs.</text>
</svg>
