<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Working sets and the thrashing feedback loop</title><desc id="desc">A moving window defines the pages actively referenced by a process. When total demand exceeds available frames, eviction removes pages that are needed again, causing faults, stalls, and even less useful progress.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#334155"/></marker><style>.h{font:700 30px system-ui,sans-serif;fill:#111827}.t{font:700 18px system-ui,sans-serif;fill:#111827}.s{font:15px system-ui,sans-serif;fill:#334155}.mono{font:600 16px ui-monospace,monospace;fill:#111827}.box{stroke:#334155;stroke-width:2}.line{fill:none;stroke:#334155;stroke-width:3;marker-end:url(#a)}.danger{fill:none;stroke:#dc2626;stroke-width:4;marker-end:url(#a)}</style></defs>
  <rect width="1600" height="900" fill="#fff"/><text x="800" y="48" text-anchor="middle" class="h">Thrashing begins when active demand no longer fits, not when RAM is merely full</text>

  <rect x="85" y="105" width="660" height="285" rx="8" fill="#eff6ff" class="box"/>
  <text x="415" y="145" text-anchor="middle" class="t">Working set over a recent window Delta</text>
  <text x="415" y="184" text-anchor="middle" class="mono">reference stream: A B C A D B C | E F E G F</text>
  <rect x="192" y="213" width="326" height="55" rx="6" fill="none" stroke="#2563eb" stroke-width="4"/>
  <text x="355" y="248" text-anchor="middle" class="s">current window</text>
  <text x="415" y="310" text-anchor="middle" class="mono">W(t, Delta) = {A, B, C, D}</text>
  <text x="415" y="352" text-anchor="middle" class="s">The set changes as execution moves into another phase.</text>

  <rect x="855" y="105" width="660" height="285" rx="8" fill="#fff7ed" class="box"/>
  <text x="1185" y="145" text-anchor="middle" class="t">Capacity test</text>
  <rect x="920" y="205" width="220" height="90" rx="8" fill="#dbeafe" class="box"/><text x="1030" y="240" text-anchor="middle" class="t">sum of working sets</text><text x="1030" y="271" text-anchor="middle" class="s">18 active frames</text>
  <text x="1185" y="258" text-anchor="middle" class="h">&gt;</text>
  <rect x="1230" y="205" width="220" height="90" rx="8" fill="#fee2e2" class="box"/><text x="1340" y="240" text-anchor="middle" class="t">usable frames</text><text x="1340" y="271" text-anchor="middle" class="s">12 available frames</text>
  <text x="1185" y="340" text-anchor="middle" class="s">Some hot page must be absent, regardless of victim policy.</text>

  <g transform="translate(170,505)">
    <rect x="0" y="0" width="270" height="110" rx="8" fill="#fee2e2" class="box"/><text x="135" y="43" text-anchor="middle" class="t">Evict active page</text><text x="135" y="76" text-anchor="middle" class="s">cold candidates exhausted</text>
    <rect x="390" y="0" width="270" height="110" rx="8" fill="#ffedd5" class="box"/><text x="525" y="43" text-anchor="middle" class="t">Page faults soon</text><text x="525" y="76" text-anchor="middle" class="s">page must be reconstructed</text>
    <rect x="780" y="0" width="270" height="110" rx="8" fill="#fef3c7" class="box"/><text x="915" y="43" text-anchor="middle" class="t">Tasks stall</text><text x="915" y="76" text-anchor="middle" class="s">reclaim, writeback, or swap wait</text>
    <rect x="1170" y="0" width="270" height="110" rx="8" fill="#ede9fe" class="box"/><text x="1305" y="43" text-anchor="middle" class="t">Less useful progress</text><text x="1305" y="76" text-anchor="middle" class="s">turnover dominates execution</text>
    <path d="M270 55 H390" class="danger"/><path d="M660 55 H780" class="danger"/><path d="M1050 55 H1170" class="danger"/>
    <path d="M1305 110 V205 H135 V110" class="danger"/>
  </g>

  <rect x="270" y="780" width="1060" height="80" rx="8" fill="#ecfeff" class="box"/><text x="800" y="812" text-anchor="middle" class="t">Observe productivity loss, not just counters</text><text x="800" y="841" text-anchor="middle" class="s">Fault rate, reclaim activity, swap I/O, and Linux memory PSI together distinguish pressure from actual thrashing.</text>
</svg>
