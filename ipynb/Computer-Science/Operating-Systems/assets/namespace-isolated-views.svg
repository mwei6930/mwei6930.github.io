<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710" role="img" aria-labelledby="title desc">
  <title id="title">Linux namespaces create different views of shared kernel resources</title>
  <desc id="desc">Two processes in different namespace sets see distinct PID, mount, network, UTS, IPC and user identity views while using the same kernel.</desc>
  <style>text{font-family:Arial,sans-serif;fill:#172235}.title{font-size:28px;font-weight:700}.head{font-size:18px;font-weight:700}.body{font-size:15px}.small{font-size:13px;fill:#526274}.box{stroke:#65788b;stroke-width:2}.dash{stroke:#9b55cf;stroke-width:2.5;stroke-dasharray:9 7;fill:none}</style>
  <rect width="1200" height="710" fill="#f7f9fb"/><text x="600" y="42" text-anchor="middle" class="title">Namespaces virtualize identity and visibility, not the kernel itself</text>
  <rect x="45" y="90" width="535" height="450" rx="8" fill="#e6f0ff" class="box"/><text x="312" y="125" text-anchor="middle" class="head">Namespace set A</text><rect x="202" y="150" width="220" height="65" rx="8" fill="#fff" class="box"/><text x="312" y="177" text-anchor="middle" class="body">process A: PID 1 inside</text><text x="312" y="199" text-anchor="middle" class="small">host PID 24108</text>
  <rect x="80" y="250" width="210" height="94" rx="8" fill="#fff2d5" class="box"/><text x="185" y="278" text-anchor="middle" class="body">PID + IPC + UTS</text><text x="185" y="304" text-anchor="middle" class="small">private process IDs, IPC</text><text x="185" y="326" text-anchor="middle" class="small">objects and hostname</text>
  <rect x="335" y="250" width="210" height="94" rx="8" fill="#e5f7ed" class="box"/><text x="440" y="278" text-anchor="middle" class="body">mount + network</text><text x="440" y="304" text-anchor="middle" class="small">private mount tree, links,</text><text x="440" y="326" text-anchor="middle" class="small">routes, ports and firewall</text>
  <rect x="80" y="379" width="465" height="102" rx="8" fill="#eee9ff" class="box"/><text x="312" y="408" text-anchor="middle" class="body">user namespace</text><text x="312" y="435" text-anchor="middle" class="small">inside UID 0 -> host UID 100000; capabilities apply only</text><text x="312" y="458" text-anchor="middle" class="small">to resources governed by this user namespace or descendants</text>
  <rect x="620" y="90" width="535" height="450" rx="8" fill="#fff2d5" class="box"/><text x="887" y="125" text-anchor="middle" class="head">Namespace set B / host view</text><rect x="777" y="150" width="220" height="65" rx="8" fill="#fff" class="box"/><text x="887" y="177" text-anchor="middle" class="body">process B: host PID 920</text><text x="887" y="199" text-anchor="middle" class="small">different namespace handles</text>
  <rect x="655" y="250" width="210" height="94" rx="8" fill="#fff" class="box"/><text x="760" y="278" text-anchor="middle" class="body">sees host process tree</text><text x="760" y="304" text-anchor="middle" class="small">and host IPC objects</text><text x="760" y="326" text-anchor="middle" class="small">under its own permissions</text>
  <rect x="910" y="250" width="210" height="94" rx="8" fill="#fff" class="box"/><text x="1015" y="278" text-anchor="middle" class="body">host mounts + network</text><text x="1015" y="304" text-anchor="middle" class="small">different devices, routes,</text><text x="1015" y="326" text-anchor="middle" class="small">interfaces and port space</text>
  <rect x="655" y="379" width="465" height="102" rx="8" fill="#dff4f5" class="box"/><text x="887" y="408" text-anchor="middle" class="body">initial user namespace</text><text x="887" y="435" text-anchor="middle" class="small">host UID 0 has broader capabilities; host UID 100000</text><text x="887" y="458" text-anchor="middle" class="small">remains an ordinary identity outside namespace A</text>
  <path d="M600 76V555" class="dash"/>
  <rect x="130" y="585" width="940" height="76" rx="8" fill="#ffe6e3" class="box"/><text x="600" y="614" text-anchor="middle" class="head">Same kernel, different views</text><text x="600" y="642" text-anchor="middle" class="body">Namespaces do not impose CPU/memory limits, automatically filter syscalls, or authorize every object access; combine them with cgroups and policy controls.</text>
  <text x="600" y="692" text-anchor="middle" class="small">Namespace membership is represented by kernel objects and handles under /proc/PID/ns; several namespace types are hierarchical or owned by a user namespace.</text>
</svg>
