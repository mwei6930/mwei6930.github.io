<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 670" role="img" aria-labelledby="title desc">
  <title id="title">Pre-copy and post-copy virtual machine live migration</title>
  <desc id="desc">Two timelines compare iterative pre-copy with destination-side fault-driven post-copy and show their downtime and failure tradeoffs.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#34495e"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#17202a;letter-spacing:0}.h{font-size:28px;font-weight:700}.s{font-size:20px;font-weight:700}.b{font-size:16px}.n{font-size:14px;fill:#425466}.box{stroke:#34495e;stroke-width:2;rx:6}.p{stroke:#34495e;stroke-width:3;marker-end:url(#a)}.dash{stroke:#c0392b;stroke-width:3;stroke-dasharray:9 6;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="670" fill="#f8fafc"/><text x="600" y="42" text-anchor="middle" class="h">Live migration moves execution state without pretending state is simple</text>
  <text x="600" y="86" text-anchor="middle" class="s">Pre-copy: move memory while the source VM continues running</text>
  <rect x="65" y="118" width="210" height="82" class="box" fill="#d6eaf8"/><text x="170" y="151" text-anchor="middle" class="b">Round 0</text><text x="170" y="178" text-anchor="middle" class="n">copy all RAM</text>
  <rect x="330" y="118" width="210" height="82" class="box" fill="#d5f5e3"/><text x="435" y="151" text-anchor="middle" class="b">Round 1..n</text><text x="435" y="178" text-anchor="middle" class="n">recopy pages dirtied meanwhile</text>
  <rect x="595" y="118" width="210" height="82" class="box" fill="#f5cba7"/><text x="700" y="151" text-anchor="middle" class="b">Stop-and-copy</text><text x="700" y="178" text-anchor="middle" class="n">pause; final dirty set + CPU/device</text>
  <rect x="860" y="118" width="275" height="82" class="box" fill="#eadcf8"/><text x="997" y="151" text-anchor="middle" class="b">Destination runs</text><text x="997" y="178" text-anchor="middle" class="n">acknowledge before source cleanup</text>
  <line x1="275" y1="159" x2="330" y2="159" class="p"/><line x1="540" y1="159" x2="595" y2="159" class="p"/><line x1="805" y1="159" x2="860" y2="159" class="p"/>
  <path d="M435 210 C435 260 700 260 700 210" class="dash"/><text x="568" y="278" text-anchor="middle" class="n">If dirtying outruns transfer, iterations may not converge</text>

  <text x="600" y="342" text-anchor="middle" class="s">Post-copy: resume first, fetch missing memory after switchover</text>
  <rect x="65" y="375" width="210" height="82" class="box" fill="#d6eaf8"/><text x="170" y="408" text-anchor="middle" class="b">Minimal pre-copy</text><text x="170" y="435" text-anchor="middle" class="n">prepare destination</text>
  <rect x="330" y="375" width="210" height="82" class="box" fill="#f5cba7"/><text x="435" y="408" text-anchor="middle" class="b">Pause and transfer</text><text x="435" y="435" text-anchor="middle" class="n">CPU + required device state</text>
  <rect x="595" y="375" width="210" height="82" class="box" fill="#eadcf8"/><text x="700" y="408" text-anchor="middle" class="b">Resume destination</text><text x="700" y="435" text-anchor="middle" class="n">some pages still at source</text>
  <rect x="860" y="375" width="275" height="82" class="box" fill="#fff3cd"/><text x="997" y="408" text-anchor="middle" class="b">Fault and prefetch</text><text x="997" y="435" text-anchor="middle" class="n">request missing pages; finish background copy</text>
  <line x1="275" y1="416" x2="330" y2="416" class="p"/><line x1="540" y1="416" x2="595" y2="416" class="p"/><line x1="805" y1="416" x2="860" y2="416" class="p"/>
  <path d="M997 466 C997 520 700 520 700 466" class="dash"/><text x="850" y="537" text-anchor="middle" class="n">Page faults create latency; source loss before completion can lose the VM</text>

  <rect x="90" y="568" width="1020" height="70" rx="6" fill="#ffffff" stroke="#34495e" stroke-width="2"/>
  <text x="600" y="595" text-anchor="middle" class="b">A migratable VM includes more than RAM.</text><text x="600" y="620" text-anchor="middle" class="n">CPU model, interrupt state, clocks, virtual devices, storage, network identity, firmware, and destination compatibility must form one coherent checkpoint.</text>
</svg>
