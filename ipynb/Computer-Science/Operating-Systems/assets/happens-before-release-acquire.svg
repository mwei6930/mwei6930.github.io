<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="780" viewBox="0 0 1500 780" role="img" aria-labelledby="title desc">
  <title id="title">Release acquire synchronization establishes happens-before</title>
  <desc id="desc">A producer writes payload and performs a release store to ready. A consumer performs an acquire load that observes ready and then reads payload. Program-order and synchronizes-with edges form happens-before.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#374151"/></marker><style>.h{font:700 28px system-ui,sans-serif;fill:#111827}.t{font:600 18px system-ui,sans-serif;fill:#111827}.s{font:15px system-ui,sans-serif;fill:#374151}.box{stroke:#374151;stroke-width:2}.line{fill:none;stroke:#374151;stroke-width:3;marker-end:url(#arrow)}.sync{fill:none;stroke:#7c3aed;stroke-width:4;stroke-dasharray:10 7;marker-end:url(#arrow)}</style></defs>
  <rect width="1500" height="780" fill="#fff"/>
  <text x="750" y="45" text-anchor="middle" class="h">Atomicity answers “one value”; ordering answers “which earlier writes become visible”</text>
  <text x="370" y="100" text-anchor="middle" class="t">Producer thread</text><text x="1130" y="100" text-anchor="middle" class="t">Consumer thread</text>
  <rect x="170" y="145" width="400" height="80" rx="8" fill="#dbeafe" class="box"/><text x="370" y="178" text-anchor="middle" class="t">payload.message = "ready"</text><text x="370" y="205" text-anchor="middle" class="s">ordinary non-atomic writes</text>
  <rect x="170" y="315" width="400" height="90" rx="8" fill="#f3e8ff" class="box"/><text x="370" y="349" text-anchor="middle" class="t">atomic_store(ready, true, release)</text><text x="370" y="378" text-anchor="middle" class="s">publishes preceding writes</text>
  <path d="M370 225 V315" class="line"/><text x="388" y="275" class="s">sequenced-before</text>
  <rect x="930" y="315" width="400" height="90" rx="8" fill="#f3e8ff" class="box"/><text x="1130" y="349" text-anchor="middle" class="t">atomic_load(ready, acquire) == true</text><text x="1130" y="378" text-anchor="middle" class="s">observes the release value</text>
  <path d="M570 360 H930" class="sync"/><text x="750" y="335" text-anchor="middle" class="t" fill="#6d28d9">synchronizes-with</text>
  <rect x="930" y="500" width="400" height="80" rx="8" fill="#dcfce7" class="box"/><text x="1130" y="533" text-anchor="middle" class="t">print(payload.message)</text><text x="1130" y="560" text-anchor="middle" class="s">must observe the published initialization</text>
  <path d="M1130 405 V500" class="line"/><text x="1148" y="460" class="s">sequenced-before</text>
  <path d="M370 225 C650 660 850 660 1130 580" fill="none" stroke="#15803d" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="750" y="660" text-anchor="middle" class="t" fill="#15803d">transitive happens-before edge</text>
  <rect x="250" y="700" width="1000" height="48" rx="8" fill="#f8fafc" class="box"/>
  <text x="750" y="730" text-anchor="middle" class="s">Replacing release/acquire with relaxed operations preserves atomic access to ready but does not publish payload.</text>
</svg>
