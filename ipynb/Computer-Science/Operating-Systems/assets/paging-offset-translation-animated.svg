<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
  <title id="title">Paging preserves the page offset during translation</title>
  <desc id="desc">A virtual address is divided into virtual page number and offset. The page table maps VPN 0x0B to PFN 0x15, and the unchanged offset 0x13A forms physical address 0x553A. Highlights animate through the steps.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#374151"/></marker>
    <style>.h{font:700 28px system-ui,sans-serif;fill:#111827}.t{font:600 18px system-ui,sans-serif;fill:#111827}.s{font:15px system-ui,sans-serif;fill:#374151}.box{stroke:#374151;stroke-width:2}.line{fill:none;stroke:#374151;stroke-width:3;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1500" height="760" fill="#ffffff"/>
  <text x="750" y="44" text-anchor="middle" class="h">Example: 16-bit addresses, 1 KiB pages, VA 0x2D3A</text>
  <text x="235" y="105" text-anchor="middle" class="t">1. Split the virtual address</text>
  <rect x="80" y="135" width="310" height="95" rx="8" fill="#f8fafc" class="box"/>
  <rect x="105" y="160" width="145" height="48" rx="5" fill="#dbeafe" class="box"><animate attributeName="fill" values="#dbeafe;#60a5fa;#dbeafe" dur="4s" repeatCount="indefinite"/></rect>
  <rect x="250" y="160" width="115" height="48" rx="5" fill="#fef3c7" class="box"/>
  <text x="177" y="191" text-anchor="middle" class="t">VPN = 0x0B</text><text x="307" y="191" text-anchor="middle" class="t">0x13A</text>
  <text x="235" y="257" text-anchor="middle" class="s">P = 2^10 bytes, so 10 low bits are offset</text>

  <path d="M390 183 H520" class="line"/>
  <text x="735" y="105" text-anchor="middle" class="t">2. Index the page table with VPN</text>
  <rect x="520" y="130" width="430" height="360" rx="8" fill="#f8fafc" class="box"/>
  <text x="735" y="165" text-anchor="middle" class="t">page table for this process</text>
  <rect x="560" y="195" width="350" height="58" rx="5" fill="#e5e7eb" class="box"/><text x="590" y="231" class="s">VPN 0x09</text><text x="805" y="231" class="s">not mapped</text>
  <rect x="560" y="265" width="350" height="58" rx="5" fill="#e5e7eb" class="box"/><text x="590" y="301" class="s">VPN 0x0A</text><text x="805" y="301" class="s">PFN 0x04</text>
  <rect x="560" y="335" width="350" height="74" rx="5" fill="#dcfce7" class="box"><animate attributeName="stroke-width" values="2;7;2" dur="4s" begin="1s" repeatCount="indefinite"/></rect>
  <text x="590" y="370" class="t">VPN 0x0B</text><text x="785" y="370" class="t">PFN 0x15</text><text x="785" y="395" class="s">valid, read/write</text>
  <rect x="560" y="421" width="350" height="45" rx="5" fill="#e5e7eb" class="box"/><text x="590" y="450" class="s">VPN 0x0C</text><text x="805" y="450" class="s">PFN 0x31</text>

  <path d="M950 372 H1060" class="line"/>
  <text x="1250" y="105" text-anchor="middle" class="t">3. Combine PFN with the same offset</text>
  <rect x="1060" y="135" width="380" height="180" rx="8" fill="#f8fafc" class="box"/>
  <rect x="1090" y="170" width="190" height="65" rx="5" fill="#dcfce7" class="box"><animate attributeName="fill" values="#dcfce7;#4ade80;#dcfce7" dur="4s" begin="2s" repeatCount="indefinite"/></rect>
  <rect x="1280" y="170" width="130" height="65" rx="5" fill="#fef3c7" class="box"/>
  <text x="1185" y="210" text-anchor="middle" class="t">PFN = 0x15</text><text x="1345" y="210" text-anchor="middle" class="t">0x13A</text>
  <text x="1250" y="270" text-anchor="middle" class="t">PA = 0x553A</text>

  <rect x="120" y="550" width="1260" height="130" rx="8" fill="#eef2ff" class="box"/>
  <text x="750" y="590" text-anchor="middle" class="t">The equations</text>
  <text x="750" y="624" text-anchor="middle" class="s">VPN = floor(VA / P) = 0x0B; offset = VA mod P = 0x13A</text>
  <text x="750" y="653" text-anchor="middle" class="s">PA = PFN x P + offset = 0x15 x 0x400 + 0x13A = 0x553A</text>
  <text x="750" y="720" text-anchor="middle" class="s">Translation changes the page identity, not the byte position within that page.</text>
</svg>
