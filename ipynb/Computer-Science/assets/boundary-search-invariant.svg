<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">Boundary binary search on a monotone predicate</title>
  <desc id="desc">A false-then-true predicate is searched using a half-open interval until low equals high at the first true position.</desc>
  <rect width="1100" height="520" fill="#ffffff"/>
  <text x="550" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#172b4d">Boundary search finds the first position where a monotone predicate changes</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="550" y="90" font-size="18" fill="#4a5568">Predicate values: false false false false true true true true</text>
    <g transform="translate(182 120)">
      <g fill="#fdecec" stroke="#c53030"><rect x="0" y="0" width="90" height="58"/><rect x="92" y="0" width="90" height="58"/><rect x="184" y="0" width="90" height="58"/><rect x="276" y="0" width="90" height="58"/></g>
      <g fill="#e8f7ef" stroke="#2f855a"><rect x="368" y="0" width="90" height="58" stroke-width="4"/><rect x="460" y="0" width="90" height="58"/><rect x="552" y="0" width="90" height="58"/><rect x="644" y="0" width="90" height="58"/></g>
      <g font-size="18" font-weight="700"><g fill="#9b2c2c"><text x="45" y="36">F</text><text x="137" y="36">F</text><text x="229" y="36">F</text><text x="321" y="36">F</text></g><g fill="#22543d"><text x="413" y="36">T</text><text x="505" y="36">T</text><text x="597" y="36">T</text><text x="689" y="36">T</text></g></g>
      <g font-size="13" fill="#718096"><text x="45" y="80">0</text><text x="137" y="80">1</text><text x="229" y="80">2</text><text x="321" y="80">3</text><text x="413" y="80">4</text><text x="505" y="80">5</text><text x="597" y="80">6</text><text x="689" y="80">7</text></g>
    </g>

    <rect x="100" y="238" width="900" height="205" rx="8" fill="#f7fafc" stroke="#9aa9ba"/>
    <g text-anchor="start" font-size="17" fill="#2d3748">
      <text x="140" y="282" font-weight="700">Start:</text><text x="250" y="282">[low, high) = [0, 8), mid = 4, predicate(4) is true</text><text x="830" y="282" fill="#22543d">high = 4</text>
      <text x="140" y="331" font-weight="700">Next:</text><text x="250" y="331">[0, 4), mid = 2, predicate(2) is false</text><text x="830" y="331" fill="#9b2c2c">low = 3</text>
      <text x="140" y="380" font-weight="700">Next:</text><text x="250" y="380">[3, 4), mid = 3, predicate(3) is false</text><text x="830" y="380" fill="#9b2c2c">low = 4</text>
      <text x="140" y="423" font-weight="700">Stop:</text><text x="250" y="423">low = high = 4, the first true index</text>
    </g>
    <rect x="210" y="462" width="680" height="40" rx="7" fill="#fff3d6" stroke="#b7791f"/>
    <text x="550" y="488" font-size="16" font-weight="700" fill="#744210">Invariant: every index below low is false; every index at or above high is true.</text>
  </g>
</svg>
