<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">Sorting properties and the comparison decision tree lower bound</title>
  <desc id="desc">One panel shows stable handling of equal keys and memory properties. Another shows that a comparison decision tree needs at least n factorial leaves and logarithmic height.</desc>
  <rect width="1100" height="560" fill="#ffffff"/>
  <text x="550" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#172b4d">A sorting algorithm has a contract and an information limit</text>
  <g font-family="Arial, sans-serif">
    <rect x="28" y="72" width="500" height="425" rx="8" fill="#f7fafc" stroke="#9aa9ba" stroke-width="2"/>
    <text x="278" y="108" text-anchor="middle" font-size="21" font-weight="700" fill="#2d3748">Observable sorting properties</text>
    <text x="68" y="153" font-size="17" font-weight="700" fill="#553c9a">Stable order for equal keys</text>
    <g text-anchor="middle" font-size="17" font-weight="700"><rect x="70" y="175" width="75" height="45" fill="#e6f1fb" stroke="#2f6fa3"/><rect x="150" y="175" width="75" height="45" fill="#fdecec" stroke="#c53030"/><rect x="230" y="175" width="75" height="45" fill="#e8f7ef" stroke="#2f855a"/><rect x="310" y="175" width="75" height="45" fill="#fff3d6" stroke="#b7791f"/><text x="107" y="204">2:A</text><text x="187" y="204">1:X</text><text x="267" y="204">2:B</text><text x="347" y="204">1:Y</text></g>
    <text x="410" y="204" font-size="20" fill="#52657a">-&gt;</text>
    <g text-anchor="middle" font-size="17" font-weight="700"><rect x="62" y="245" width="90" height="45" fill="#fdecec" stroke="#c53030"/><rect x="157" y="245" width="90" height="45" fill="#fff3d6" stroke="#b7791f"/><rect x="252" y="245" width="90" height="45" fill="#e6f1fb" stroke="#2f6fa3"/><rect x="347" y="245" width="90" height="45" fill="#e8f7ef" stroke="#2f855a"/><text x="107" y="274">1:X</text><text x="202" y="274">1:Y</text><text x="297" y="274">2:A</text><text x="392" y="274">2:B</text></g>
    <text x="278" y="320" text-anchor="middle" font-size="15" fill="#4a5568">X remains before Y; A remains before B.</text>
    <g font-size="17"><text x="68" y="365" font-weight="700" fill="#22543d">In-place:</text><text x="175" y="365" fill="#4a5568">uses O(1) or O(log n) auxiliary memory</text><text x="68" y="405" font-weight="700" fill="#744210">Adaptive:</text><text x="175" y="405" fill="#4a5568">exploits existing input order</text><text x="68" y="445" font-weight="700" fill="#9b2c2c">Worst-case:</text><text x="175" y="445" fill="#4a5568">guarantees a bound for every arrangement</text></g>

    <rect x="558" y="72" width="514" height="425" rx="8" fill="#f7fafc" stroke="#9aa9ba" stroke-width="2"/>
    <text x="815" y="108" text-anchor="middle" font-size="21" font-weight="700" fill="#2d3748">Comparison decision tree</text>
    <g fill="none" stroke="#52657a" stroke-width="3"><path d="M815 155 L715 225 M815 155 L915 225 M715 225 L650 305 M715 225 L760 305 M915 225 L870 305 M915 225 L980 305"/></g>
    <g text-anchor="middle" dominant-baseline="middle"><circle cx="815" cy="145" r="30" fill="#f2ecfb" stroke="#805ad5" stroke-width="3"/><text x="815" y="145" font-size="16" font-weight="700">a &lt; b?</text><circle cx="715" cy="225" r="28" fill="#e6f1fb" stroke="#2f6fa3"/><text x="715" y="225" font-size="15">b &lt; c?</text><circle cx="915" cy="225" r="28" fill="#fff3d6" stroke="#b7791f"/><text x="915" y="225" font-size="15">a &lt; c?</text></g>
    <g text-anchor="middle" font-size="15" font-weight="700"><rect x="610" y="305" width="80" height="42" rx="5" fill="#e8f7ef" stroke="#2f855a"/><rect x="720" y="305" width="80" height="42" rx="5" fill="#e8f7ef" stroke="#2f855a"/><rect x="830" y="305" width="80" height="42" rx="5" fill="#e8f7ef" stroke="#2f855a"/><rect x="940" y="305" width="80" height="42" rx="5" fill="#e8f7ef" stroke="#2f855a"/><text x="650" y="332">abc</text><text x="760" y="332">acb</text><text x="870" y="332">...</text><text x="980" y="332">cba</text></g>
    <text x="815" y="390" text-anchor="middle" font-size="18" font-weight="700" fill="#553c9a">At least n! possible input orders</text>
    <text x="815" y="425" text-anchor="middle" font-size="17" fill="#4a5568">2^height >= n!, so height >= log2(n!)</text>
    <text x="815" y="460" text-anchor="middle" font-size="18" font-weight="700" fill="#9b2c2c">Worst-case comparisons are Omega(n log n)</text>
  </g>
  <text x="550" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#4a5568">The lower bound applies to algorithms that learn order only through pairwise comparisons.</text>
</svg>
