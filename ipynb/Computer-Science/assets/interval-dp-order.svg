<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">Interval dynamic programming evaluation order</title>
  <desc id="desc">Upper triangular interval states filled from shorter to longer ranges, with a split point combining two subintervals.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
  </defs>
  <rect width="1200" height="610" fill="#f8fafc"/>
  <text x="600" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#0f172a">Interval DP fills short ranges before the longer ranges that depend on them</text>

  <rect x="45" y="78" width="560" height="470" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="325" y="114" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1d4ed8">Upper-triangular state table dp[i][j]</text>
  <g font-family="Arial, sans-serif" text-anchor="middle" font-size="15">
    <text x="185" y="160" fill="#475569">j=0</text><text x="260" y="160" fill="#475569">j=1</text><text x="335" y="160" fill="#475569">j=2</text><text x="410" y="160" fill="#475569">j=3</text><text x="485" y="160" fill="#475569">j=4</text>
    <text x="120" y="212" fill="#475569">i=0</text><text x="120" y="287" fill="#475569">i=1</text><text x="120" y="362" fill="#475569">i=2</text><text x="120" y="437" fill="#475569">i=3</text><text x="120" y="512" fill="#475569">i=4</text>
  </g>
  <g stroke="#ffffff" stroke-width="3">
    <rect x="150" y="175" width="70" height="70" fill="#dcfce7"/><rect x="225" y="175" width="70" height="70" fill="#dbeafe"/><rect x="300" y="175" width="70" height="70" fill="#e0e7ff"/><rect x="375" y="175" width="70" height="70" fill="#ede9fe"/><rect x="450" y="175" width="70" height="70" fill="#fae8ff"/>
    <rect x="150" y="250" width="70" height="70" fill="#f1f5f9"/><rect x="225" y="250" width="70" height="70" fill="#dcfce7"/><rect x="300" y="250" width="70" height="70" fill="#dbeafe"/><rect x="375" y="250" width="70" height="70" fill="#e0e7ff"/><rect x="450" y="250" width="70" height="70" fill="#ede9fe"/>
    <rect x="150" y="325" width="70" height="70" fill="#f1f5f9"/><rect x="225" y="325" width="70" height="70" fill="#f1f5f9"/><rect x="300" y="325" width="70" height="70" fill="#dcfce7"/><rect x="375" y="325" width="70" height="70" fill="#dbeafe"/><rect x="450" y="325" width="70" height="70" fill="#e0e7ff"/>
    <rect x="150" y="400" width="70" height="70" fill="#f1f5f9"/><rect x="225" y="400" width="70" height="70" fill="#f1f5f9"/><rect x="300" y="400" width="70" height="70" fill="#f1f5f9"/><rect x="375" y="400" width="70" height="70" fill="#dcfce7"/><rect x="450" y="400" width="70" height="70" fill="#dbeafe"/>
    <rect x="150" y="475" width="70" height="70" fill="#f1f5f9"/><rect x="225" y="475" width="70" height="70" fill="#f1f5f9"/><rect x="300" y="475" width="70" height="70" fill="#f1f5f9"/><rect x="375" y="475" width="70" height="70" fill="#f1f5f9"/><rect x="450" y="475" width="70" height="70" fill="#dcfce7"/>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle" font-size="14" fill="#334155">
    <text x="185" y="217">len 1</text><text x="260" y="217">len 2</text><text x="335" y="217">len 3</text><text x="410" y="217">len 4</text><text x="485" y="217">len 5</text>
    <text x="260" y="292">len 1</text><text x="335" y="292">len 2</text><text x="410" y="292">len 3</text><text x="485" y="292">len 4</text>
    <text x="335" y="367">len 1</text><text x="410" y="367">len 2</text><text x="485" y="367">len 3</text>
    <text x="410" y="442">len 1</text><text x="485" y="442">len 2</text><text x="485" y="517">len 1</text>
  </g>

  <rect x="645" y="78" width="510" height="470" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="900" y="114" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#6d28d9">Try every final split k inside [i, j]</text>
  <line x1="720" y1="235" x2="1080" y2="235" stroke="#334155" stroke-width="5"/>
  <line x1="720" y1="220" x2="720" y2="250" stroke="#334155" stroke-width="3"/>
  <line x1="1080" y1="220" x2="1080" y2="250" stroke="#334155" stroke-width="3"/>
  <line x1="900" y1="212" x2="900" y2="258" stroke="#ea580c" stroke-width="4"/>
  <text x="720" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#334155">i</text>
  <text x="900" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#c2410c">k</text>
  <text x="1080" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#334155">j</text>
  <rect x="700" y="310" width="195" height="70" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="905" y="310" width="195" height="70" rx="6" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="797" y="353" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1e3a8a">dp[i][k]</text>
  <text x="1002" y="353" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#5b21b6">dp[k+1][j]</text>
  <path d="M797 385 C797 430 865 440 884 470" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M1002 385 C1002 430 935 440 916 470" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="805" y="465" width="190" height="54" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="900" y="498" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#166534">candidate for dp[i][j]</text>
  <text x="900" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#475569">Both child intervals are shorter, so their values already exist.</text>
</svg>
