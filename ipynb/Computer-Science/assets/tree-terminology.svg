<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
  <title id="title">Rooted tree terminology</title>
  <desc id="desc">A rooted tree labels root, parent, child, siblings, leaf, depth, height, edge, path, and subtree.</desc>
  <rect width="1000" height="500" fill="#ffffff"/>
  <text x="500" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#172b4d">A rooted tree organizes nodes by ancestry</text>
  <g stroke="#718096" stroke-width="3" fill="none"><path d="M500 105 L300 205"/><path d="M500 105 L700 205"/><path d="M300 245 L185 355"/><path d="M300 245 L385 355"/><path d="M700 245 L615 355"/><path d="M700 245 L815 355"/></g>
  <g font-family="Arial, sans-serif" text-anchor="middle" font-size="22" font-weight="700">
    <g fill="#f2ecfb" stroke="#805ad5" stroke-width="3"><circle cx="500" cy="85" r="42"/></g><text x="500" y="93" fill="#553c9a">A</text>
    <g fill="#e9f3ff" stroke="#2f6fa3" stroke-width="2"><circle cx="300" cy="225" r="38"/><circle cx="700" cy="225" r="38"/></g><text x="300" y="233" fill="#174a73">B</text><text x="700" y="233" fill="#174a73">C</text>
    <g fill="#e8f7ef" stroke="#2f855a" stroke-width="2"><circle cx="185" cy="375" r="34"/><circle cx="385" cy="375" r="34"/><circle cx="615" cy="375" r="34"/><circle cx="815" cy="375" r="34"/></g><text x="185" y="383" fill="#22543d">D</text><text x="385" y="383" fill="#22543d">E</text><text x="615" y="383" fill="#22543d">F</text><text x="815" y="383" fill="#22543d">G</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="16">
    <text x="565" y="72" fill="#553c9a" font-weight="700">root, depth 0</text>
    <text x="184" y="205" fill="#174a73" font-weight="700">parent of D and E</text>
    <text x="355" y="220" fill="#174a73">B and C are siblings</text>
    <text x="95" y="430" fill="#22543d" font-weight="700">leaves: no children</text>
    <path d="M255 258 C230 290 220 315 203 339" fill="none" stroke="#c53030" stroke-width="3" stroke-dasharray="7 5"/>
    <text x="65" y="296" fill="#9b2c2c">edge B-D</text>
    <rect x="545" y="170" width="340" height="260" rx="12" fill="none" stroke="#2f855a" stroke-width="3" stroke-dasharray="10 7"/>
    <text x="730" y="460" text-anchor="middle" fill="#22543d" font-weight="700">subtree rooted at C</text>
    <text x="905" y="232" fill="#4a5568">height(A) = 2</text>
    <text x="905" y="260" fill="#4a5568">depth(G) = 2</text>
    <text x="450" y="467" text-anchor="middle" fill="#4a5568">path A -> C -> G has 2 edges</text>
  </g>
</svg>
