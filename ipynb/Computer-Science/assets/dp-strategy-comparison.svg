<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Greedy, dynamic programming, and backtracking</title>
  <desc id="desc">Greedy commits to one path, dynamic programming merges equivalent states, and backtracking explores distinct choice paths.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
  </defs>
  <rect width="1200" height="600" fill="#f8fafc"/>
  <text x="600" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#0f172a">The techniques differ in how many decision histories they preserve</text>

  <rect x="30" y="78" width="350" height="470" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <text x="205" y="116" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f766e">Greedy</text>
  <text x="205" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#475569">Prove one local choice is permanently safe.</text>
  <circle cx="205" cy="205" r="25" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <circle cx="205" cy="285" r="25" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <circle cx="205" cy="365" r="25" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <circle cx="205" cy="445" r="25" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <path d="M205 230 V255 M205 310 V335 M205 390 V415" fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M190 230 L125 285 M220 230 L285 285" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="205" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#166534">one committed path</text>

  <rect x="425" y="78" width="350" height="470" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="600" y="116" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1d4ed8">Dynamic programming</text>
  <text x="600" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#475569">Merge histories with identical future-relevant state.</text>
  <circle cx="600" cy="205" r="24" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <circle cx="520" cy="285" r="24" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <circle cx="680" cy="285" r="24" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <circle cx="555" cy="380" r="24" fill="#e0f2fe" stroke="#0891b2" stroke-width="2"/>
  <circle cx="645" cy="380" r="24" fill="#e0f2fe" stroke="#0891b2" stroke-width="2"/>
  <circle cx="600" cy="465" r="26" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <path d="M585 225 L535 263 M615 225 L665 263 M505 307 L542 360 M535 307 L630 362 M665 307 L570 362 M695 307 L658 360 M555 404 L585 443 M645 404 L615 443" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="600" y="512" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1d4ed8">many paths, few distinct states</text>

  <rect x="820" y="78" width="350" height="470" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="995" y="116" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#6d28d9">Backtracking</text>
  <text x="995" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#475569">Explore distinct choices; prune only impossible branches.</text>
  <circle cx="995" cy="205" r="24" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <circle cx="915" cy="285" r="22" fill="#ede9fe" stroke="#7c3aed"/><circle cx="1075" cy="285" r="22" fill="#ede9fe" stroke="#7c3aed"/>
  <circle cx="870" cy="375" r="20" fill="#f5f3ff" stroke="#7c3aed"/><circle cx="955" cy="375" r="20" fill="#f5f3ff" stroke="#7c3aed"/><circle cx="1035" cy="375" r="20" fill="#f5f3ff" stroke="#7c3aed"/><circle cx="1120" cy="375" r="20" fill="#f5f3ff" stroke="#7c3aed"/>
  <circle cx="850" cy="455" r="17" fill="#faf5ff" stroke="#7c3aed"/><circle cx="895" cy="455" r="17" fill="#faf5ff" stroke="#7c3aed"/><circle cx="935" cy="455" r="17" fill="#faf5ff" stroke="#7c3aed"/><circle cx="975" cy="455" r="17" fill="#faf5ff" stroke="#7c3aed"/><circle cx="1015" cy="455" r="17" fill="#faf5ff" stroke="#7c3aed"/><circle cx="1055" cy="455" r="17" fill="#faf5ff" stroke="#7c3aed"/><circle cx="1100" cy="455" r="17" fill="#faf5ff" stroke="#7c3aed"/><circle cx="1140" cy="455" r="17" fill="#faf5ff" stroke="#7c3aed"/>
  <path d="M980 225 L928 266 M1010 225 L1062 266 M902 305 L880 355 M928 305 L945 355 M1062 305 L1045 355 M1088 305 L1110 355 M862 394 L852 436 M878 394 L890 436 M947 395 L938 436 M963 395 L972 436 M1027 395 L1018 436 M1043 395 L1052 436 M1112 395 L1103 436 M1128 395 L1137 436" fill="none" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="995" y="512" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#6d28d9">potentially exponential choice tree</text>
</svg>
