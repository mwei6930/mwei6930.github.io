<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540" role="img" aria-labelledby="title desc">
  <title id="title">Divide-and-conquer design template</title>
  <desc id="desc">A problem is divided into smaller subproblems, solved recursively, and combined. Binary search and merge sort instantiate different numbers of recursive branches and combine costs.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#52657a"/></marker></defs>
  <rect width="1100" height="540" fill="#ffffff"/>
  <text x="550" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#172b4d">Divide, solve smaller instances, and combine</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="430" y="78" width="240" height="60" rx="8" fill="#e6f1fb" stroke="#2f6fa3" stroke-width="2"/>
    <text x="550" y="115" font-size="19" font-weight="700" fill="#174a73">problem of size n</text>
    <path d="M500 143 L340 203 M600 143 L760 203" stroke="#52657a" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <rect x="205" y="210" width="270" height="70" rx="8" fill="#fff3d6" stroke="#b7791f" stroke-width="2"/>
    <rect x="625" y="210" width="270" height="70" rx="8" fill="#fff3d6" stroke="#b7791f" stroke-width="2"/>
    <text x="340" y="240" font-size="18" font-weight="700" fill="#744210">recursive subproblem</text><text x="340" y="265" font-size="16" fill="#744210">size n / b</text>
    <text x="760" y="240" font-size="18" font-weight="700" fill="#744210">up to a subproblems</text><text x="760" y="265" font-size="16" fill="#744210">each of size n / b</text>
    <path d="M340 288 L500 350 M760 288 L600 350" stroke="#52657a" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <rect x="405" y="358" width="290" height="65" rx="8" fill="#e8f7ef" stroke="#2f855a" stroke-width="2"/>
    <text x="550" y="387" font-size="18" font-weight="700" fill="#22543d">combine partial answers</text><text x="550" y="412" font-size="16" fill="#22543d">nonrecursive work f(n)</text>
    <rect x="345" y="450" width="410" height="55" rx="8" fill="#f2ecfb" stroke="#805ad5" stroke-width="2"/>
    <text x="550" y="484" font-size="20" font-weight="700" fill="#553c9a">T(n) = a T(n / b) + f(n)</text>

    <rect x="30" y="330" width="285" height="150" rx="8" fill="#f7fafc" stroke="#9aa9ba"/>
    <text x="172" y="362" font-size="18" font-weight="700" fill="#2f6fa3">Binary search</text><text x="172" y="395" font-size="16" fill="#4a5568">a = 1, b = 2, f(n) = 1</text><text x="172" y="425" font-size="16" fill="#4a5568">discard one half</text><text x="172" y="455" font-size="17" font-weight="700" fill="#174a73">T(n) = Theta(log n)</text>
    <rect x="785" y="330" width="285" height="150" rx="8" fill="#f7fafc" stroke="#9aa9ba"/>
    <text x="927" y="362" font-size="18" font-weight="700" fill="#2f855a">Merge sort</text><text x="927" y="395" font-size="16" fill="#4a5568">a = 2, b = 2, f(n) = n</text><text x="927" y="425" font-size="16" fill="#4a5568">solve both halves</text><text x="927" y="455" font-size="17" font-weight="700" fill="#22543d">T(n) = Theta(n log n)</text>
  </g>
  <text x="550" y="528" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4a5568">Subproblems must be smaller; independence and combine cost determine whether the design is useful.</text>
</svg>
