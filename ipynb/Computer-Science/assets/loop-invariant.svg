<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img" aria-labelledby="title desc">
  <title id="title">Loop invariant proof structure</title>
  <desc id="desc">Initialization establishes an invariant, maintenance preserves it through iterations, and termination combines it with the exit condition to prove the postcondition.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#385170"/></marker></defs>
  <rect width="1000" height="380" fill="#ffffff"/>
  <text x="500" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#172b4d">A loop invariant connects every iteration</text>
  <g font-family="Arial, sans-serif">
    <rect x="55" y="98" width="230" height="104" rx="8" fill="#e9f3ff" stroke="#2f6fa3" stroke-width="2"/>
    <text x="170" y="132" text-anchor="middle" font-size="20" font-weight="700" fill="#174a73">Initialization</text>
    <text x="170" y="162" text-anchor="middle" font-size="16" fill="#243b53">Invariant is true</text>
    <text x="170" y="185" text-anchor="middle" font-size="16" fill="#243b53">before the first iteration</text>
    <rect x="385" y="98" width="230" height="104" rx="8" fill="#fff3d6" stroke="#b7791f" stroke-width="2"/>
    <text x="500" y="132" text-anchor="middle" font-size="20" font-weight="700" fill="#744210">Maintenance</text>
    <text x="500" y="162" text-anchor="middle" font-size="16" fill="#4a3a1f">One iteration keeps</text>
    <text x="500" y="185" text-anchor="middle" font-size="16" fill="#4a3a1f">the invariant true</text>
    <rect x="715" y="98" width="230" height="104" rx="8" fill="#e8f7ef" stroke="#2f855a" stroke-width="2"/>
    <text x="830" y="132" text-anchor="middle" font-size="20" font-weight="700" fill="#22543d">Termination</text>
    <text x="830" y="162" text-anchor="middle" font-size="16" fill="#234e3b">Invariant + exit condition</text>
    <text x="830" y="185" text-anchor="middle" font-size="16" fill="#234e3b">imply the postcondition</text>
    <path d="M285 150 H377" stroke="#385170" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M615 150 H707" stroke="#385170" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M500 202 V254 C500 300 350 300 350 254 V219" fill="none" stroke="#805ad5" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="500" y="331" text-anchor="middle" font-size="18" fill="#553c9a">Repeat maintenance while the loop condition is true</text>
  </g>
</svg>
