<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="650" viewBox="0 0 1160 650" role="img" aria-labelledby="title desc">
  <title id="title">Approximation ratios and schemes</title><desc id="desc">Minimization and maximization ratios compare algorithm output to optimum, while PTAS and FPTAS trade epsilon for running time.</desc>
  <style>.title{font:700 28px 'Segoe UI',Arial,sans-serif;fill:#172033}.head{font:700 19px 'Segoe UI',Arial,sans-serif;fill:#172033}.body{font:16px 'Segoe UI',Arial,sans-serif;fill:#334155}.small{font:14px 'Segoe UI',Arial,sans-serif;fill:#526174}.card{fill:#fff;stroke-width:2}</style>
  <rect width="1160" height="650" fill="#f8fafc"/><text x="580" y="45" text-anchor="middle" class="title">A guarantee bounds the worst legal output, not the average example</text>
  <rect x="45" y="90" width="500" height="300" rx="8" class="card" stroke="#60a5fa"/><text x="295" y="130" text-anchor="middle" class="head">Minimization</text><text x="295" y="165" text-anchor="middle" class="body">OPT &lt;= ALG &lt;= rho * OPT</text><line x1="110" y1="255" x2="480" y2="255" stroke="#64748b" stroke-width="3"/><circle cx="210" cy="255" r="14" fill="#16a34a"/><circle cx="400" cy="255" r="14" fill="#dc2626"/><text x="210" y="220" text-anchor="middle" class="head">OPT</text><text x="400" y="220" text-anchor="middle" class="head">ALG</text><text x="295" y="310" text-anchor="middle" class="body">ALG / OPT &lt;= rho</text><text x="295" y="347" text-anchor="middle" class="small">smaller is better; rho >= 1</text>
  <rect x="615" y="90" width="500" height="300" rx="8" class="card" stroke="#c084fc"/><text x="865" y="130" text-anchor="middle" class="head">Maximization</text><text x="865" y="165" text-anchor="middle" class="body">OPT / rho &lt;= ALG &lt;= OPT</text><line x1="680" y1="255" x2="1050" y2="255" stroke="#64748b" stroke-width="3"/><circle cx="760" cy="255" r="14" fill="#dc2626"/><circle cx="960" cy="255" r="14" fill="#16a34a"/><text x="760" y="220" text-anchor="middle" class="head">ALG</text><text x="960" y="220" text-anchor="middle" class="head">OPT</text><text x="865" y="310" text-anchor="middle" class="body">OPT / ALG &lt;= rho</text><text x="865" y="347" text-anchor="middle" class="small">larger is better; rho >= 1</text>
  <rect x="45" y="430" width="330" height="160" rx="8" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text x="210" y="470" text-anchor="middle" class="head">Constant-factor</text><text x="210" y="505" text-anchor="middle" class="body">rho = 2, 3/2, ...</text><text x="210" y="540" text-anchor="middle" class="small">fixed guarantee and polynomial time</text>
  <rect x="415" y="430" width="330" height="160" rx="8" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/><text x="580" y="470" text-anchor="middle" class="head">PTAS</text><text x="580" y="505" text-anchor="middle" class="body">ratio 1 + epsilon</text><text x="580" y="540" text-anchor="middle" class="small">polynomial in n for each fixed epsilon</text>
  <rect x="785" y="430" width="330" height="160" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text x="950" y="470" text-anchor="middle" class="head">FPTAS</text><text x="950" y="505" text-anchor="middle" class="body">ratio 1 + epsilon</text><text x="950" y="540" text-anchor="middle" class="small">polynomial in both n and 1/epsilon</text>
  <text x="580" y="625" text-anchor="middle" class="small">State whether the guarantee is multiplicative, additive, expected, or high-probability.</text>
</svg>
