<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="680" viewBox="0 0 1160 680" role="img" aria-labelledby="title desc">
  <title id="title">Transforming lower-bounded circulation into ordinary maximum flow</title>
  <desc id="desc">Lower bounds create node imbalances, residual capacities remove the lower bounds, and a super source and sink route the imbalance.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#dc2626"/></marker><style>.title{font:700 27px 'Segoe UI',Arial,sans-serif;fill:#172033}.head{font:700 19px 'Segoe UI',Arial,sans-serif;fill:#172033}.body{font:16px 'Segoe UI',Arial,sans-serif;fill:#334155}.small{font:14px 'Segoe UI',Arial,sans-serif;fill:#526174}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2}.edge{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#a)}.extra{stroke:#dc2626;stroke-width:4;fill:none;marker-end:url(#r)}.node{fill:#fff;stroke:#334155;stroke-width:2.5}</style></defs>
  <rect width="1160" height="680" fill="#f8fafc"/><text x="580" y="44" text-anchor="middle" class="title">Lower bounds are prepaid flow; super nodes repair the resulting imbalance</text>
  <rect x="35" y="78" width="500" height="555" rx="8" class="box"/><rect x="565" y="78" width="560" height="555" rx="8" class="box"/>
  <text x="285" y="116" text-anchor="middle" class="head">1. Original edges carry [lower, upper]</text>
  <path d="M169 262L373 262" class="edge"/><path d="M398 294L303 445" class="edge"/><path d="M257 445L162 294" class="edge"/>
  <circle cx="135" cy="262" r="36" class="node"/><circle cx="407" cy="262" r="36" class="node"/><circle cx="280" cy="475" r="36" class="node"/><text x="135" y="269" text-anchor="middle" class="head">0</text><text x="407" y="269" text-anchor="middle" class="head">1</text><text x="280" y="482" text-anchor="middle" class="head">2</text>
  <text x="270" y="240" text-anchor="middle" class="body">[2,4]</text><text x="378" y="386" text-anchor="middle" class="body">[1,3]</text><text x="183" y="386" text-anchor="middle" class="body">[1,5]</text>
  <rect x="76" y="525" width="418" height="76" rx="7" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/><text x="285" y="552" text-anchor="middle" class="body">Preload lower bounds: node 0 has -1, node 1 has +1.</text><text x="285" y="578" text-anchor="middle" class="small">Positive means excess lower-bound inflow; negative means a deficit.</text>

  <text x="845" y="116" text-anchor="middle" class="head">2. Replace capacity by upper - lower</text>
  <path d="M749 262L921 262" class="edge"/><path d="M946 294L863 433" class="edge"/><path d="M817 433L734 294" class="edge"/>
  <circle cx="715" cy="262" r="36" class="node"/><circle cx="955" cy="262" r="36" class="node"/><circle cx="840" cy="465" r="36" class="node"/><text x="715" y="269" text-anchor="middle" class="head">0</text><text x="955" y="269" text-anchor="middle" class="head">1</text><text x="840" y="472" text-anchor="middle" class="head">2</text>
  <text x="835" y="240" text-anchor="middle" class="body">capacity 2</text><text x="931" y="376" text-anchor="middle" class="body">capacity 2</text><text x="751" y="376" text-anchor="middle" class="body">capacity 4</text>
  <circle cx="1040" cy="445" r="38" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/><circle cx="640" cy="445" r="38" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><text x="1040" y="452" text-anchor="middle" class="head">SS</text><text x="640" y="452" text-anchor="middle" class="head">TT</text>
  <path d="M1020 416L978 290" class="extra"/><path d="M686 291L655 407" class="extra"/><text x="1000" y="350" class="body" fill="#dc2626">1</text><text x="660" y="350" class="body" fill="#dc2626">1</text>
  <rect x="606" y="525" width="478" height="76" rx="7" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="845" y="552" text-anchor="middle" class="body">A max flow saturating every SS edge proves feasibility.</text><text x="845" y="578" text-anchor="middle" class="small">Add the lower bounds back to recover the original circulation.</text>
</svg>
