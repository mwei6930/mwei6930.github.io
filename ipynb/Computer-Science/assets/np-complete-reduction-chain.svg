<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="690" viewBox="0 0 1160 690" role="img" aria-labelledby="title desc">
  <title id="title">Canonical NP-complete reduction chain</title><desc id="desc">Known NP-complete problems transfer hardness through polynomial-time reductions and simple graph complements.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><style>.title{font:700 28px 'Segoe UI',Arial,sans-serif;fill:#172033}.head{font:700 18px 'Segoe UI',Arial,sans-serif;fill:#172033}.body{font:15px 'Segoe UI',Arial,sans-serif;fill:#334155}.small{font:13px 'Segoe UI',Arial,sans-serif;fill:#526174}.box{stroke-width:2}.line{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1160" height="690" fill="#f8fafc"/><text x="580" y="44" text-anchor="middle" class="title">One established NP-complete problem starts many new proofs</text>
  <rect x="455" y="82" width="250" height="78" rx="8" fill="#fef2f2" stroke="#f87171" class="box"/><text x="580" y="114" text-anchor="middle" class="head">Circuit-SAT / SAT</text><text x="580" y="141" text-anchor="middle" class="small">canonical starting point</text>
  <path d="M580 160L580 215" class="line"/><rect x="455" y="225" width="250" height="78" rx="8" fill="#fff7ed" stroke="#fb923c" class="box"/><text x="580" y="257" text-anchor="middle" class="head">3SAT</text><text x="580" y="284" text-anchor="middle" class="small">three literals per clause</text>
  <path d="M455 265L270 350" class="line"/><path d="M580 303L580 350" class="line"/><path d="M705 265L890 350" class="line"/>
  <rect x="120" y="360" width="250" height="88" rx="8" fill="#eff6ff" stroke="#60a5fa" class="box"/><text x="245" y="394" text-anchor="middle" class="head">Independent Set</text><text x="245" y="422" text-anchor="middle" class="small">one consistent literal per clause</text>
  <rect x="455" y="360" width="250" height="88" rx="8" fill="#faf5ff" stroke="#c084fc" class="box"/><text x="580" y="394" text-anchor="middle" class="head">3-Coloring</text><text x="580" y="422" text-anchor="middle" class="small">variable and clause gadgets</text>
  <rect x="790" y="360" width="250" height="88" rx="8" fill="#f0fdf4" stroke="#4ade80" class="box"/><text x="915" y="394" text-anchor="middle" class="head">Subset Sum</text><text x="915" y="422" text-anchor="middle" class="small">digit-position encoding</text>
  <path d="M215 448L215 520" class="line"/><path d="M275 448L440 520" class="line"/>
  <rect x="90" y="530" width="250" height="88" rx="8" fill="#ecfeff" stroke="#22d3ee" class="box"/><text x="215" y="564" text-anchor="middle" class="head">Clique</text><text x="215" y="592" text-anchor="middle" class="small">take the complement graph</text>
  <rect x="365" y="530" width="250" height="88" rx="8" fill="#fefce8" stroke="#eab308" class="box"/><text x="490" y="564" text-anchor="middle" class="head">Vertex Cover</text><text x="490" y="592" text-anchor="middle" class="small">C = V minus independent set</text>
  <path d="M705 404L790 404" class="line"/><text x="748" y="387" text-anchor="middle" class="small">other chains</text>
  <rect x="700" y="530" width="370" height="88" rx="8" fill="#fff" stroke="#94a3b8" class="box"/><text x="885" y="564" text-anchor="middle" class="head">Hamiltonian Cycle / Set Cover / TSP</text><text x="885" y="592" text-anchor="middle" class="small">choose a source problem whose structure matches the target</text>
  <text x="580" y="660" text-anchor="middle" class="body">Every arrow needs a polynomial construction and an if-and-only-if correctness proof.</text>
</svg>
