<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc">
  <title id="title">Reducing bipartite matching to unit-capacity maximum flow</title>
  <desc id="desc">A source connects to left vertices, candidate edges connect left to right vertices, and right vertices connect to a sink, all with unit capacity.</desc>
  <defs><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#16a34a"/></marker><style>.title{font:700 28px 'Segoe UI',Arial,sans-serif;fill:#172033}.head{font:700 19px 'Segoe UI',Arial,sans-serif;fill:#172033}.body{font:16px 'Segoe UI',Arial,sans-serif;fill:#334155}.small{font:14px 'Segoe UI',Arial,sans-serif;fill:#526174}.edge{stroke:#94a3b8;stroke-width:2.5;fill:none;marker-end:url(#g)}.match{stroke:#16a34a;stroke-width:5;fill:none;marker-end:url(#m)}.node{stroke-width:2.5}</style></defs>
  <rect width="1120" height="650" fill="#f8fafc"/><text x="560" y="46" text-anchor="middle" class="title">One unit of flow is one matched pair</text>
  <text x="95" y="96" text-anchor="middle" class="head">source</text><text x="330" y="96" text-anchor="middle" class="head">left partition L</text><text x="790" y="96" text-anchor="middle" class="head">right partition R</text><text x="1025" y="96" text-anchor="middle" class="head">sink</text>
  <path d="M130 305L290 175" class="match"/><path d="M130 325L290 325" class="edge"/><path d="M130 345L290 475" class="match"/>
  <path d="M370 175L750 325" class="match"/><path d="M370 175L750 175" class="edge"/><path d="M370 325L750 175" class="edge"/><path d="M370 325L750 475" class="edge"/><path d="M370 475L750 475" class="match"/><path d="M370 475L750 325" class="edge"/>
  <path d="M830 175L990 305" class="edge"/><path d="M830 325L990 325" class="match"/><path d="M830 475L990 345" class="match"/>
  <circle cx="95" cy="325" r="38" fill="#dbeafe" stroke="#2563eb" class="node"/><circle cx="1025" cy="325" r="38" fill="#f3e8ff" stroke="#9333ea" class="node"/>
  <circle cx="330" cy="165" r="38" fill="#dcfce7" stroke="#16a34a" class="node"/><circle cx="330" cy="325" r="38" fill="#dcfce7" stroke="#16a34a" class="node"/><circle cx="330" cy="485" r="38" fill="#dcfce7" stroke="#16a34a" class="node"/>
  <circle cx="790" cy="165" r="38" fill="#fef3c7" stroke="#d97706" class="node"/><circle cx="790" cy="325" r="38" fill="#fef3c7" stroke="#d97706" class="node"/><circle cx="790" cy="485" r="38" fill="#fef3c7" stroke="#d97706" class="node"/>
  <text x="95" y="332" text-anchor="middle" class="head">s</text><text x="1025" y="332" text-anchor="middle" class="head">t</text><text x="330" y="172" text-anchor="middle" class="head">L1</text><text x="330" y="332" text-anchor="middle" class="head">L2</text><text x="330" y="492" text-anchor="middle" class="head">L3</text><text x="790" y="172" text-anchor="middle" class="head">R1</text><text x="790" y="332" text-anchor="middle" class="head">R2</text><text x="790" y="492" text-anchor="middle" class="head">R3</text>
  <rect x="190" y="550" width="740" height="66" rx="7" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/><text x="560" y="577" text-anchor="middle" class="body">Every edge has capacity 1, so integral max flow cannot reuse any left or right vertex.</text><text x="560" y="602" text-anchor="middle" class="small">Highlighted flow gives matching {(L1,R2), (L3,R3)}; another augmentation may match L2.</text>
</svg>
