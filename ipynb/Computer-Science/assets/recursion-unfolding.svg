<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc">
  <title id="title">Recursive Fibonacci call tree</title>
  <desc id="desc">Fibonacci of five recursively branches into overlapping Fibonacci calls, illustrating repeated work and tree depth.</desc>
  <rect width="1000" height="450" fill="#ffffff"/>
  <text x="500" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#172b4d">Recursion unfolds into a call tree</text>
  <g stroke="#718096" stroke-width="2.5" fill="none">
    <path d="M500 98 L300 170 M500 98 L700 170"/>
    <path d="M300 218 L190 286 M300 218 L410 286"/>
    <path d="M700 218 L610 286 M700 218 L790 286"/>
    <path d="M190 334 L135 394 M190 334 L245 394"/>
    <path d="M610 334 L555 394 M610 334 L665 394"/>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g fill="#e9f3ff" stroke="#2f6fa3" stroke-width="2"><rect x="440" y="62" width="120" height="48" rx="8"/><rect x="240" y="170" width="120" height="48" rx="8"/><rect x="640" y="170" width="120" height="48" rx="8"/></g>
    <g fill="#fff3d6" stroke="#b7791f" stroke-width="2"><rect x="135" y="286" width="110" height="48" rx="8"/><rect x="355" y="286" width="110" height="48" rx="8"/><rect x="555" y="286" width="110" height="48" rx="8"/><rect x="735" y="286" width="110" height="48" rx="8"/></g>
    <g fill="#e8f7ef" stroke="#2f855a" stroke-width="2"><rect x="95" y="394" width="80" height="40" rx="8"/><rect x="205" y="394" width="80" height="40" rx="8"/><rect x="515" y="394" width="80" height="40" rx="8"/><rect x="625" y="394" width="80" height="40" rx="8"/></g>
    <g font-size="18" font-weight="700" fill="#243b53"><text x="500" y="93">fib(5)</text><text x="300" y="201">fib(4)</text><text x="700" y="201">fib(3)</text><text x="190" y="317">fib(3)</text><text x="410" y="317">fib(2)</text><text x="610" y="317">fib(2)</text><text x="790" y="317">fib(1)</text><text x="135" y="420">fib(2)</text><text x="245" y="420">fib(1)</text><text x="555" y="420">fib(1)</text><text x="665" y="420">fib(0)</text></g>
    <text x="840" y="128" font-size="16" fill="#9b2c2c">fib(3) and fib(2)</text>
    <text x="840" y="151" font-size="16" fill="#9b2c2c">are recomputed</text>
  </g>
</svg>
