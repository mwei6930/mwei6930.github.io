<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Choose explore and unchoose lifecycle</title>
  <desc id="desc">A backtracking frame mutates a path, explores descendants, then restores the exact previous state before trying the next candidate.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
  </defs>
  <rect width="1200" height="560" fill="#f8fafc"/>
  <text x="600" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#0f172a">Every recursive frame must leave shared state exactly as it found it</text>

  <g font-family="Arial, sans-serif">
    <rect x="40" y="95" width="240" height="190" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="160" y="130" text-anchor="middle" font-size="21" font-weight="700" fill="#1d4ed8">Before choice</text>
    <text x="75" y="170" font-size="15" fill="#475569">path</text>
    <rect x="130" y="145" width="105" height="45" rx="6" fill="#dbeafe" stroke="#2563eb"/>
    <text x="182" y="174" text-anchor="middle" font-size="17" fill="#1e3a8a">[A, B]</text>
    <text x="75" y="225" font-size="15" fill="#475569">used</text>
    <rect x="130" y="202" width="105" height="45" rx="6" fill="#dbeafe" stroke="#2563eb"/>
    <text x="182" y="231" text-anchor="middle" font-size="16" fill="#1e3a8a">{A, B}</text>
    <text x="160" y="269" text-anchor="middle" font-size="14" fill="#475569">frame invariant holds</text>

    <rect x="340" y="95" width="240" height="190" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
    <text x="460" y="130" text-anchor="middle" font-size="21" font-weight="700" fill="#0e7490">Choose C</text>
    <text x="375" y="170" font-size="15" fill="#475569">path</text>
    <rect x="430" y="145" width="105" height="45" rx="6" fill="#cffafe" stroke="#0891b2"/>
    <text x="482" y="174" text-anchor="middle" font-size="17" fill="#155e75">[A,B,C]</text>
    <text x="375" y="225" font-size="15" fill="#475569">used</text>
    <rect x="430" y="202" width="105" height="45" rx="6" fill="#cffafe" stroke="#0891b2"/>
    <text x="482" y="231" text-anchor="middle" font-size="16" fill="#155e75">{A,B,C}</text>
    <text x="460" y="269" text-anchor="middle" font-size="14" fill="#0e7490">mutate shared state once</text>

    <rect x="640" y="95" width="240" height="190" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="760" y="130" text-anchor="middle" font-size="21" font-weight="700" fill="#15803d">Explore</text>
    <circle cx="760" cy="175" r="24" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <circle cx="705" cy="240" r="22" fill="#f0fdf4" stroke="#16a34a"/>
    <circle cx="815" cy="240" r="22" fill="#f0fdf4" stroke="#16a34a"/>
    <path d="M744 194 L718 220 M776 194 L802 220" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="760" y="269" text-anchor="middle" font-size="14" fill="#166534">recursive descendants see C</text>

    <rect x="940" y="95" width="220" height="190" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="1050" y="130" text-anchor="middle" font-size="21" font-weight="700" fill="#c2410c">Unchoose C</text>
    <text x="970" y="170" font-size="15" fill="#475569">path</text>
    <rect x="1020" y="145" width="105" height="45" rx="6" fill="#ffedd5" stroke="#ea580c"/>
    <text x="1072" y="174" text-anchor="middle" font-size="17" fill="#9a3412">[A, B]</text>
    <text x="970" y="225" font-size="15" fill="#475569">used</text>
    <rect x="1020" y="202" width="105" height="45" rx="6" fill="#ffedd5" stroke="#ea580c"/>
    <text x="1072" y="231" text-anchor="middle" font-size="16" fill="#9a3412">{A, B}</text>
    <text x="1050" y="269" text-anchor="middle" font-size="14" fill="#9a3412">restore before next sibling</text>
  </g>

  <line x1="280" y1="190" x2="330" y2="190" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="580" y1="190" x2="630" y2="190" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="880" y1="190" x2="930" y2="190" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="120" y="350" width="960" height="150" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="600" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Canonical frame</text>
  <text x="210" y="425" font-family="Consolas, monospace" font-size="17" fill="#0e7490">path.append(choice)</text>
  <text x="500" y="425" font-family="Consolas, monospace" font-size="17" fill="#166534">search(next_state)</text>
  <text x="800" y="425" font-family="Consolas, monospace" font-size="17" fill="#9a3412">path.pop()</text>
  <line x1="405" y1="418" x2="480" y2="418" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="705" y1="418" x2="780" y2="418" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="600" y="468" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#475569">Append a copy only when recording a solution; otherwise later mutations change the stored object.</text>
</svg>
