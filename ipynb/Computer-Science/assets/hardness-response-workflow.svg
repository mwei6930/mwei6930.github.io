<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="720" viewBox="0 0 1160 720" role="img" aria-labelledby="title desc">
  <title id="title">Workflow for responding to a hard problem</title><desc id="desc">A decision workflow chooses polynomial special cases, exact methods, parameterized algorithms, approximation, or heuristics based on guarantees and structure.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><style>.title{font:700 28px 'Segoe UI',Arial,sans-serif;fill:#172033}.head{font:700 18px 'Segoe UI',Arial,sans-serif;fill:#172033}.body{font:15px 'Segoe UI',Arial,sans-serif;fill:#334155}.small{font:13px 'Segoe UI',Arial,sans-serif;fill:#526174}.line{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}.box{stroke-width:2}</style></defs>
  <rect width="1160" height="720" fill="#f8fafc"/><text x="580" y="44" text-anchor="middle" class="title">A practical response starts by narrowing the real contract</text>
  <rect x="420" y="78" width="320" height="72" rx="8" fill="#fff" stroke="#94a3b8" class="box"/><text x="580" y="108" text-anchor="middle" class="head">Formalize input, objective, and constraints</text><text x="580" y="134" text-anchor="middle" class="small">decision, search, optimization, or counting?</text>
  <path d="M580 150L580 205" class="line"/><rect x="390" y="215" width="380" height="78" rx="8" fill="#eff6ff" stroke="#60a5fa" class="box"/><text x="580" y="247" text-anchor="middle" class="head">Does a polynomial special case apply?</text><text x="580" y="274" text-anchor="middle" class="small">bipartite, bounded treewidth, interval structure, small weights</text>
  <path d="M390 255L210 350" class="line"/><text x="300" y="292" class="small">yes</text><rect x="55" y="360" width="300" height="95" rx="8" fill="#ecfdf5" stroke="#34d399" class="box"/><text x="205" y="397" text-anchor="middle" class="head">Use the specialized exact algorithm</text><text x="205" y="427" text-anchor="middle" class="small">document the structural assumption</text>
  <path d="M580 293L580 350" class="line"/><text x="595" y="326" class="small">no</text><rect x="420" y="360" width="320" height="95" rx="8" fill="#faf5ff" stroke="#c084fc" class="box"/><text x="580" y="397" text-anchor="middle" class="head">Is an exact answer mandatory?</text><text x="580" y="427" text-anchor="middle" class="small">and are n or parameter k small?</text>
  <path d="M420 407L300 520" class="line"/><path d="M740 407L860 520" class="line"/>
  <rect x="95" y="530" width="340" height="110" rx="8" fill="#eff6ff" stroke="#60a5fa" class="box"/><text x="265" y="565" text-anchor="middle" class="head">Exact / parameterized</text><text x="265" y="595" text-anchor="middle" class="body">branch-and-bound, FPT, SAT, ILP</text><text x="265" y="621" text-anchor="middle" class="small">set time and memory limits</text>
  <rect x="725" y="530" width="340" height="110" rx="8" fill="#fff7ed" stroke="#fb923c" class="box"/><text x="895" y="565" text-anchor="middle" class="head">Approximation / heuristic</text><text x="895" y="595" text-anchor="middle" class="body">choose guarantee or empirical speed</text><text x="895" y="621" text-anchor="middle" class="small">report bounds, gaps, and benchmark quality</text>
  <rect x="425" y="530" width="310" height="110" rx="8" fill="#f0fdf4" stroke="#4ade80" class="box"/><text x="580" y="565" text-anchor="middle" class="head">Hybrid anytime method</text><text x="580" y="595" text-anchor="middle" class="body">good feasible solution + lower bound</text><text x="580" y="621" text-anchor="middle" class="small">stop with a measured optimality gap</text>
  <text x="580" y="685" text-anchor="middle" class="body">Measure on representative instances and record what is guaranteed versus merely observed.</text>
</svg>
