<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc">
  <title id="title">Input encoding and resource growth</title><desc id="desc">Polynomial, pseudopolynomial, and exponential costs behave differently when numeric values are encoded in binary.</desc>
  <style>.title{font:700 28px 'Segoe UI',Arial,sans-serif;fill:#172033}.head{font:700 19px 'Segoe UI',Arial,sans-serif;fill:#172033}.body{font:16px 'Segoe UI',Arial,sans-serif;fill:#334155}.small{font:14px 'Segoe UI',Arial,sans-serif;fill:#526174}.axis{stroke:#64748b;stroke-width:2.5}.grid{stroke:#e2e8f0;stroke-width:1}</style>
  <rect width="1120" height="650" fill="#f8fafc"/><text x="560" y="45" text-anchor="middle" class="title">Complexity is measured against encoded input length</text>
  <rect x="45" y="90" width="690" height="480" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="125" y1="500" x2="680" y2="500" class="axis"/><line x1="125" y1="500" x2="125" y2="145" class="axis"/>
  <line x1="125" y1="420" x2="680" y2="420" class="grid"/><line x1="125" y1="340" x2="680" y2="340" class="grid"/><line x1="125" y1="260" x2="680" y2="260" class="grid"/><line x1="125" y1="180" x2="680" y2="180" class="grid"/>
  <path d="M145 485C280 470 430 438 655 360" fill="none" stroke="#2563eb" stroke-width="5"/><path d="M145 482C300 455 470 350 655 185" fill="none" stroke="#d97706" stroke-width="5"/><path d="M145 480C390 470 570 430 655 155" fill="none" stroke="#dc2626" stroke-width="5"/>
  <text x="600" y="386" class="head" fill="#2563eb">n²</text><text x="590" y="235" class="head" fill="#d97706">nW</text><text x="590" y="145" class="head" fill="#dc2626">2ⁿ</text><text x="405" y="540" text-anchor="middle" class="body">encoded input length n</text><text x="73" y="325" text-anchor="middle" transform="rotate(-90 73 325)" class="body">time / space</text>
  <rect x="770" y="90" width="305" height="480" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="922" y="130" text-anchor="middle" class="head">Why nW may be misleading</text>
  <rect x="800" y="165" width="245" height="90" rx="8" fill="#eff6ff" stroke="#93c5fd"/><text x="922" y="197" text-anchor="middle" class="body">Binary value W = 1,000,000</text><text x="922" y="225" text-anchor="middle" class="small">needs only about 20 bits</text>
  <rect x="800" y="280" width="245" height="105" rx="8" fill="#fff7ed" stroke="#fdba74"/><text x="922" y="312" text-anchor="middle" class="body">O(nW) is polynomial in W</text><text x="922" y="340" text-anchor="middle" class="small">but exponential in log W</text><text x="922" y="366" text-anchor="middle" class="head">pseudopolynomial</text>
  <rect x="800" y="410" width="245" height="110" rx="8" fill="#f0fdf4" stroke="#86efac"/><text x="922" y="442" text-anchor="middle" class="body">Tractable usually means</text><text x="922" y="470" text-anchor="middle" class="head">polynomial in total bits</text><text x="922" y="495" text-anchor="middle" class="small">under the chosen machine model</text>
  <text x="560" y="612" text-anchor="middle" class="small">Worst-case asymptotics classify growth; constants, structure, and parameter values still matter in practice.</text>
</svg>
